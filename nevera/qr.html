<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR de la nevera · para imprimir</title>
<!-- Hoja para IMPRIMIR y pegar en la nevera. No se enlaza desde la web
     (solo desde el panel admin/nevera). El QR lleva a
     https://atletismoapolana.com/nevera/ y se generó con segno (corrección H,
     por eso aguanta el escudo en el centro). PNG grande: nevera/qr-nevera.png -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/img/favicon-escudo.png">
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 500 800; src: url('../assets/fonts/bricolage-grotesque-latin.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url('../assets/fonts/ibm-plex-sans-400-latin.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-weight: 600; src: url('../assets/fonts/ibm-plex-sans-600-latin.woff2') format('woff2'); }
@page { size: A5 portrait; margin: 0; }
:root { --navy: #2E4256; --verde: #1E7A3D; --crema: #FBF9F4; --suave: #6E6656; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #E9E4D8; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--navy);
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.barra { max-width: 148mm; margin: 16px auto 10px; padding: 0 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--suave); }
.barra button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 999px; background: var(--navy); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
.hoja { width: 148mm; height: 210mm; max-width: calc(100vw - 32px); margin: 0 auto 24px; background: var(--crema); display: flex; flex-direction: column;
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.4); overflow: hidden; }
.cab { background: var(--navy); color: #fff; text-align: center; padding: 9mm 8mm 8mm; border-radius: 0 0 9mm 9mm; }
.cab .club { display: inline-flex; align-items: center; gap: 3mm; font-size: 11pt; opacity: .85; margin-bottom: 3mm; }
.cab .club img { width: 9mm; height: 9mm; border-radius: 50%; background: #fff; }
.cab h1 { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 31pt; line-height: 1; letter-spacing: -.01em; }
.cab h1 span { color: #9FF0B8; }
.qr { position: relative; width: 92mm; max-width: 72%; margin: 8mm auto 0; background: #fff; border-radius: 6mm; padding: 6mm; border: .4mm solid #E4DCCB; }
.qr-svg { display: block; width: 100%; height: auto; }
.qr .escudo { position: absolute; left: 50%; top: 50%; width: 21%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
  background: #fff; padding: 1.2mm; }
.qr .escudo img { width: 100%; height: 100%; display: block; }
.pasos { list-style: none; margin: 7mm 9mm 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }
.pasos li { background: #fff; border: .3mm solid #E4DCCB; border-radius: 4mm; padding: 3mm 2mm; text-align: center; font-size: 10.5pt; line-height: 1.2; }
.pasos b { display: grid; place-items: center; width: 8mm; height: 8mm; margin: 0 auto 1.5mm; border-radius: 50%; background: var(--verde); color: #fff;
  font-family: 'Bricolage Grotesque', sans-serif; font-size: 13pt; }
.pie { margin-top: auto; text-align: center; padding: 0 8mm 7mm; font-size: 9.5pt; color: var(--suave); line-height: 1.45; }
.pie strong { color: var(--navy); }
@media print {
  html, body { background: none; }
  .barra { display: none; }
  .hoja { margin: 0; box-shadow: none; max-width: none; }
}
@media (max-width: 600px) { .hoja { height: auto; min-height: 150vw; } .cab h1 { font-size: 26pt; } }
</style>
</head>
