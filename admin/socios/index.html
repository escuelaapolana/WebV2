<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socios · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  .so-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 60px; }
  .so-cab h1 { font-family: var(--ap-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; }
  .so-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 0; }

  .so-cifras { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0 6px; }
  .so-cifra { flex: 1 1 130px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05); padding: 13px 16px; }
  .so-cifra b { display: block; font-family: var(--dato,'IBM Plex Mono',monospace); font-weight: 700; font-size: 24px; color: var(--navy,#26374B); }
  .so-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .so-cifra.aviso { background: #FBF1DE; border-color: #E9CE9A; }
  .so-cifra.aviso b, .so-cifra.aviso span { color: #8A5307; }
  .so-cifra a { color: inherit; text-decoration: none; display: block; }

  .so-avisos { margin: 12px 0 4px; }
  .so-transicion { background: #FBF1DE; border: 1px solid #E9CE9A; border-radius: 14px; padding: 14px 16px; color: #7A4E12; font-size: 14px; line-height: 1.5; }
  .so-transicion b { color: #6b430f; }
  .so-transicion .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .so-transicion .chip { background: #fff; border: 1px solid #E9CE9A; border-radius: 999px; padding: 4px 11px; font-size: 13px; color: #7A4E12; }

  .so-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 12px; }
  .so-filtros input, .so-filtros select { padding: 10px 12px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 10px; font: inherit; background: #fff; }
  .so-filtros input { flex: 1 1 220px; min-width: 180px; }

  .so-tabla { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; overflow: hidden; }
  .so-tabla th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--texto-suave,#6E6656); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--linea-marcada,#E4DCCB); }
  .so-tabla td { padding: 12px 14px; border-bottom: 1px solid var(--linea,#EDE6D7); font-size: 14.5px; color: var(--navy,#26374B); vertical-align: middle; }
  .so-tabla tbody tr:last-child td { border-bottom: 0; }
  .so-tabla .nom { font-weight: 600; }
  .so-tabla .sub { font-size: 12.5px; color: var(--texto-tenue,#9A927F); }
  .so-tabla a.nom { color: var(--navy,#26374B); text-decoration: none; }
  .so-tabla a.nom:hover { text-decoration: underline; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; }
  .pill .pt { width: 9px; height: 9px; border-radius: 999px; background: var(--texto-suave); }
  .pill.ok .pt { background: #3E7A34; } .pill.ok { color: #3E7A34; }
  .pill.mal .pt { background: #B23B3B; } .pill.mal { color: #B23B3B; }
  .pill.sin .pt { background: #9A927F; } .pill.sin { color: #9A927F; }
  .so-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px; }
  @media (max-width: 640px) {
    .so-tabla thead { display: none; }
    .so-tabla, .so-tabla tbody, .so-tabla tr, .so-tabla td { display: block; width: 100%; }
    .so-tabla tr { border-bottom: 1px solid var(--linea-marcada,#E4DCCB); padding: 6px 0; }
    .so-tabla td { border: 0; padding: 4px 14px; }
    .so-tabla td::before { content: attr(data-et) ': '; color: var(--texto-tenue); font-size: 12px; }
    .so-tabla td.nom-td::before { content: ''; }
  }
</style>
</head>
<body class="adm-piel">

<div class="so-wrap" id="so">
  <div class="so-cab"><h1>Socios</h1><p>Cargando…</p></div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var b = (window.APOLANA_BASE || '../../');
  var hoyIso = new Date().toISOString().slice(0, 10);
  var ANIO_ESCUELA = 2009; // nacidos en 2009 o después = escuela; antes = socio (adulto)

  function anio(f) { if (!f) return NaN; var y = parseInt(String(f).slice(0, 4), 10); return isNaN(y) ? NaN : y; }
  function edad(f) { var y = anio(f); if (isNaN(y)) return null; return (new Date().getFullYear()) - y; }
  // Un socio = ficha con tipo_membresia 'socio', o sin membresía conocida y
  // nacido antes de 2009 (adulto). Misma lógica que usa hoy el panel.
  function esSocio(a) {
    var t = a.tipo_membresia;
    if (t === 'socio') return true;
    if (t === 'escuela' || t === 'municipal' || t === 'cubo') return false;
    var y = anio(a.fecha_nacimiento);
    return !(y >= ANIO_ESCUELA); // sin fecha o < 2009 → socio
  }
  // Candidato a pasar a socio ESTE AÑO: hoy figura como escuela pero ya tiene
  // la edad de salir de la escuela (nació el año del corte). Se confirma a mano.
  function pasaAsocio(a) {
    var t = a.tipo_membresia;
    var esEscuela = (t === 'escuela') || (!t && anio(a.fecha_nacimiento) >= ANIO_ESCUELA);
    return esEscuela && anio(a.fecha_nacimiento) === ANIO_ESCUELA;
  }

  function sinCobrar(p) {
    return p.estado === 'impagado' || (p.estado === 'pendiente' && p.fecha_vencimiento && p.fecha_vencimiento < hoyIso);
  }

  var SOCIOS = [], ULTIMO = {}, SIN_RECIBOS = false, CANDIDATOS = [], ALTAS_PEND = 0;

  async function cargar() {
    // Personas (no de baja)
    var ra = await sb.from('atletas')
      .select('id,nombre,apellidos,estado,fecha_nacimiento,tipo_membresia,telefono,email')
      .neq('estado', 'baja');
    var gente = (!ra.error && ra.data) ? ra.data : [];
    SOCIOS = gente.filter(esSocio);
    CANDIDATOS = gente.filter(pasaAsocio);

    // Último recibo por persona (tabla pagos)
    ULTIMO = {};
    var rp = await sb.from('pagos').select('atleta_id,importe,estado,fecha_vencimiento')
      .order('fecha_vencimiento', { ascending: false, nullsFirst: false });
    SIN_RECIBOS = !!rp.error;
    if (!rp.error && rp.data) rp.data.forEach(function (p) {
      if (!p.atleta_id || ULTIMO[p.atleta_id]) return;
      ULTIMO[p.atleta_id] = { sinCobrar: sinCobrar(p) };
    });

    // Altas de socio pendientes
    try {
      var rs = await sb.from('altas_socio_panel').select('id,estado');
      if (!rs.error && rs.data) ALTAS_PEND = rs.data.filter(function (x) { return x.estado === 'pendiente'; }).length;
    } catch (e) { /* si no se puede leer, se deja en 0 */ }
  }

  function estadoRecibo(a) {
    if (SIN_RECIBOS) return { clase: 'sin', txt: 'sin poder mirarlo' };
    var u = ULTIMO[a.id];
    if (!u) return { clase: 'sin', txt: 'sin recibos' };
    return u.sinCobrar ? { clase: 'mal', txt: 'impagado' } : { clase: 'ok', txt: 'al día' };
  }

  function pintar() {
    var q = ($('so-buscar') ? $('so-buscar').value : '').trim().toLowerCase();
    var fEstado = $('so-estado') ? $('so-estado').value : '';
    var lista = SOCIOS.filter(function (a) {
      if (q) {
        var txt = ((a.nombre || '') + ' ' + (a.apellidos || '') + ' ' + (a.telefono || '') + ' ' + (a.email || '')).toLowerCase();
        if (txt.indexOf(q) === -1) return false;
      }
      if (fEstado) {
        var e = estadoRecibo(a).clase;
        if (fEstado === 'aldia' && e !== 'ok') return false;
        if (fEstado === 'impago' && e !== 'mal') return false;
        if (fEstado === 'sinrecibos' && e !== 'sin') return false;
      }
      return true;
    }).sort(function (x, y) { return (x.apellidos || x.nombre || '').localeCompare(y.apellidos || y.nombre || '', 'es'); });

    var filas = lista.map(function (a) {
      var e = estadoRecibo(a);
      var ed = edad(a.fecha_nacimiento);
      return '<tr>' +
        '<td class="nom-td" data-et="Socio"><a class="nom" href="' + b + 'admin/atletas/?ficha=' + esc(a.id) + '">' + esc(((a.nombre || '') + ' ' + (a.apellidos || '')).trim() || 'Sin nombre') + '</a>' +
          (ed != null ? '<div class="sub">' + ed + ' años</div>' : '') + '</td>' +
        '<td data-et="Recibo"><span class="pill ' + e.clase + '"><span class="pt"></span>' + esc(e.txt) + '</span></td>' +
        '<td data-et="Ficha">' + esc(a.estado || '—') + '</td>' +
        '<td data-et="Contacto">' + (a.telefono ? '<a href="tel:' + esc(a.telefono) + '" style="color:var(--azul-oscuro,#1E4E78);text-decoration:none">' + esc(a.telefono) + '</a>' : '<span class="sub">—</span>') + '</td>' +
      '</tr>';
    }).join('');

    var alDia = SOCIOS.filter(function (a) { return estadoRecibo(a).clase === 'ok'; }).length;
    var impago = SOCIOS.filter(function (a) { return estadoRecibo(a).clase === 'mal'; }).length;

    var transicion = CANDIDATOS.length
      ? '<div class="so-avisos"><div class="so-transicion">' +
          '<b>' + CANDIDATOS.length + (CANDIDATOS.length === 1 ? ' persona pasa' : ' personas pasan') + ' a socio este año</b> (acaban la escuela por edad). Revisa quién sigue en el club como socio y a quién das de baja — cámbialo en su ficha.' +
          '<div class="chips">' + CANDIDATOS.slice(0, 30).map(function (a) {
            return '<a class="chip" href="' + b + 'admin/atletas/?ficha=' + esc(a.id) + '">' + esc(((a.nombre || '') + ' ' + (a.apellidos || '')).trim()) + '</a>';
          }).join('') + '</div></div></div>'
      : '';

    $('so').innerHTML =
      '<div class="so-cab"><h1>Socios</h1><p>Los socios del club (cuota anual). Aquí ves quién está al día, quién debe, y las altas nuevas.</p></div>' +
      '<div class="so-cifras">' +
        '<div class="so-cifra"><b>' + SOCIOS.length + '</b><span>socios</span></div>' +
        '<div class="so-cifra"><b style="color:#3E7A34">' + alDia + '</b><span>al día</span></div>' +
        '<div class="so-cifra"><b style="color:#B23B3B">' + impago + '</b><span>impagados</span></div>' +
        '<div class="so-cifra aviso"><a href="' + b + 'admin/altas/"><b>' + ALTAS_PEND + '</b><span>altas de socio por revisar →</span></a></div>' +
      '</div>' +
      transicion +
      '<div class="so-filtros">' +
        '<input type="search" id="so-buscar" placeholder="Buscar socio (nombre, teléfono, correo)…" value="' + esc(q) + '">' +
        '<select id="so-estado">' +
          '<option value="">Todos los recibos</option>' +
          '<option value="aldia"' + (fEstado === 'aldia' ? ' selected' : '') + '>Al día</option>' +
          '<option value="impago"' + (fEstado === 'impago' ? ' selected' : '') + '>Impagados</option>' +
          '<option value="sinrecibos"' + (fEstado === 'sinrecibos' ? ' selected' : '') + '>Sin recibos</option>' +
        '</select>' +
        '<a class="btn btn--fantasma btn--sm" href="' + b + 'admin/cobros/" style="margin-left:auto">Recibos y cuotas →</a>' +
      '</div>' +
      (lista.length
        ? '<table class="so-tabla"><thead><tr><th>Socio</th><th>Recibo</th><th>Ficha</th><th>Contacto</th></tr></thead><tbody>' + filas + '</tbody></table>'
        : '<div class="so-tabla"><div class="so-vacio">' + (SOCIOS.length ? 'Ningún socio con este filtro.' : 'Todavía no hay socios en la app. Se irán viendo aquí según los vayas dando de alta.') + '</div></div>');

    if ($('so-buscar')) $('so-buscar').addEventListener('input', pintar);
    if ($('so-estado')) $('so-estado').addEventListener('change', pintar);
    // El buscador mantiene el foco al re-pintar
    if (q && $('so-buscar')) { var el = $('so-buscar'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }

  cargar().then(pintar).catch(function (e) {
    $('so').innerHTML = '<div class="so-cab"><h1>Socios</h1><p style="color:#B23B3B">No se ha podido cargar: ' + esc(String(e)) + '</p></div>';
  });
});
</script>

</body>
</html>
