<style>
  /* ============================================================
     SOCIOS · lista en tarjetas (21-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Grupos»: bloques con título (aquí, la
     inicial del apellido), filas-tarjeta con franja de color por
     el estado del recibo, buscador grande y filtro en chips, y
     una hoja inferior con lo que se hace con un socio (ficha,
     llamar, correo, sus recibos). Mismos datos y misma lógica
     que la tabla de antes; la pantalla no escribe nada.
     Prefijo so-.
     ============================================================ */
  /* Necesario para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .so-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .so-wrap *, .so-capa * { box-sizing: border-box; }
  .so-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; line-height: 1; }
  .so-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; }

  /* --- Cifras: pulsar «al día / impagados» filtra la lista --- */
  .so-cifras { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 18px 0 6px; }
  .so-cifra { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; text-decoration: none;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .so-cifra:hover { border-color: var(--linea-borde,#C9C0AE); }
  .so-cifra:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .so-cifra b { display: block; font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .so-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .so-cifra.ok b { color: #3E7A34; } .so-cifra.mal b { color: #B23B3B; }
  .so-cifra.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  .so-cifra.aviso { background: #FBF1DE; border-color: #E9CE9A; }
  .so-cifra.aviso b, .so-cifra.aviso span { color: #8A5307; }
  @media (max-width: 620px) { .so-cifras { grid-template-columns: repeat(2, minmax(0,1fr)); } .so-cifra b { font-size: 21px; } }

  .so-avisos { margin: 12px 0 4px; }
  .so-transicion { background: #FBF1DE; border: 1px solid #E9CE9A; border-radius: 14px; padding: 14px 16px; color: #7A4E12; font-size: 14px; line-height: 1.5; }
  .so-transicion b { color: #6b430f; }
  .so-transicion .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .so-transicion .chip { background: #fff; border: 1px solid #E9CE9A; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: #7A4E12; text-decoration: none; min-height: 34px; display: inline-flex; align-items: center; }
  .so-transicion .chip:hover { background: #FFF8EC; }

  /* --- Buscador + chips --- */
  .so-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 4px; }
  .so-buscar { flex: 1 1 260px; min-width: 0; min-height: 48px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; background: #fff; color: var(--navy,#26374B); }
  .so-buscar:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .so-chips { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .so-chips::-webkit-scrollbar { display: none; }
  .so-chips button { flex: 1 0 auto; min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px; background: none; font: inherit; font-weight: 700;
    font-size: 13.5px; color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .so-chips button:hover { color: var(--navy,#26374B); }
  .so-chips button.on { background: var(--navy,#26374B); color: #fff; }
  .so-pie-filtros { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .so-cuenta { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .so-ir { font-size: 14px; font-weight: 700; color: var(--azul-oscuro,#2A5E8C); text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; }
  .so-ir:hover { text-decoration: underline; text-underline-offset: 2px; }
  @media (max-width: 620px) { .so-chips { width: 100%; border-radius: 14px; } }

  /* --- Bloques por inicial --- */
  .so-letra { margin: 20px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave,#6E6656);
    display: flex; align-items: baseline; gap: 8px; }
  .so-letra span { font-weight: 600; letter-spacing: 0; text-transform: none; }
  .so-lista { container: so-lista / inline-size; display: flex; flex-direction: column; gap: 8px; }

  /* --- Fila-tarjeta de socio: toda ella abre la hoja --- */
  .so-fila { position: relative; display: grid; grid-template-columns: 40px minmax(0,1.6fr) 130px 110px 150px 14px; gap: 0 14px; align-items: center;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid #CFC6B4; border-radius: 14px; padding: 10px 14px 10px 12px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .so-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .so-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .so-fila.ok { border-left-color: #6FAF7E; }
  .so-fila.mal { border-left-color: #C9564C; background: #FFFBFA; }
  .so-ini { width: 40px; height: 40px; border-radius: 999px; background: #EAF2FA; color: var(--azul-oscuro,#2A5E8C); display: flex; align-items: center;
    justify-content: center; font-family: var(--fuente-titulo); font-weight: 700; font-size: 14px; }
  .so-fila.mal .so-ini { background: #FBE9E7; color: #9A2F26; }
  .so-per { min-width: 0; }
  .so-per b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .so-per small { display: block; font-size: 13px; color: var(--texto-tenue,#9A927F); margin-top: 1px; }
  .so-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px 3px 9px; border-radius: 999px;
    background: #F0EBE0; color: #6E6656; white-space: nowrap; justify-self: start; }
  .so-pill .pt { width: 7px; height: 7px; border-radius: 999px; background: #9A927F; flex: 0 0 7px; }
  .so-pill.ok { background: #E7F3EA; color: #23603A; } .so-pill.ok .pt { background: #3E7A34; }
  .so-pill.mal { background: #FDECEA; color: #9A2F26; } .so-pill.mal .pt { background: #B23B3B; }
  .so-ficha { font-size: 13.5px; color: var(--texto-suave,#6E6656); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .so-ficha::first-letter { text-transform: uppercase; }
  .so-tel { position: relative; z-index: 1; justify-self: start; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 10px;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; color: var(--azul-oscuro,#1E4E78); text-decoration: none; font-size: 13.5px;
    font-variant-numeric: tabular-nums; background: #fff; white-space: nowrap; }
  .so-tel:hover { background: #F2F7FC; border-color: #CFE2F1; }
  .so-tel svg { width: 15px; height: 15px; flex: 0 0 15px; }
  .so-tel.sin { color: var(--texto-tenue,#9A927F); border-style: dashed; cursor: default; }
  .so-tel.sin:hover { background: #fff; border-color: var(--linea-marcada,#E4DCCB); }
  .so-flecha { color: #B5AC99; font-size: 20px; line-height: 1; text-align: right; }
  .so-cab-cols { display: grid; grid-template-columns: 40px minmax(0,1.6fr) 130px 110px 150px 14px; gap: 0 14px; padding: 0 14px 4px 16px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-tenue,#9A927F); }
  /* Lista estrecha (móvil): nombre arriba, pastillas debajo, teléfono a mano */
  @container so-lista (max-width: 640px) {
    .so-fila { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 11px 12px 12px 10px; }
    .so-ini { order: 0; flex: 0 0 40px; }
    .so-per { order: 1; flex: 1 1 0; }
    .so-flecha { order: 2; font-size: 22px; }
    .so-fila::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
    .so-pill { order: 4; }
    .so-ficha { order: 5; align-self: center; }
    .so-tel { order: 6; margin-left: auto; }
    .so-tel.sin { display: none; }
  }
  @media (max-width: 700px) { .so-cab-cols { display: none; } }
  .so-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE); border-radius: 14px; }
  .so-vacio button { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linea-borde,#C9C0AE); background: #fff;
    font: inherit; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; }

  /* --- Hoja inferior: lo que se hace con un socio --- */
  .so-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .so-velo.ver { opacity: 1; pointer-events: auto; }
  .so-hoja { position: fixed; left: 50%; bottom: 0; width: min(560px,100%); transform: translate(-50%,105%); z-index: 9001; background: #fff; color: var(--navy,#26374B);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transition: transform .25s ease; max-height: 92vh; overflow: auto;
    overscroll-behavior: contain; box-shadow: 0 -10px 40px rgba(20,30,45,.25); visibility: hidden; }
  .so-hoja.ver { transform: translate(-50%,0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .so-hoja, .so-velo, .so-fila { transition: none; } }
  .so-hoja .asa { width: 42px; height: 5px; border-radius: 9px; background: #DDD5C4; margin: 2px auto 12px; }
  .so-hoja-cab { display: flex; align-items: center; gap: 12px; }
  .so-hoja-cab .so-ini { width: 48px; height: 48px; flex: 0 0 48px; font-size: 16px; }
  .so-hoja-cab > div { flex: 1; min-width: 0; }
  .so-hoja h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
  .so-hoja .sub { color: var(--texto-suave,#6E6656); font-size: 13.5px; margin: 3px 0 0; }
  .so-cerrar { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 20px; line-height: 1; cursor: pointer; }
  .so-datos { margin: 14px 0 4px; background: var(--crema,#FBF9F4); border-radius: 14px; padding: 4px 14px; }
  .so-datos div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; }
  .so-datos div:last-child { border-bottom: 0; }
  .so-datos span { color: var(--texto-suave,#6E6656); }
  .so-datos b { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .so-acc { display: grid; gap: 8px; margin-top: 14px; }
  .so-acc a { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; font-weight: 700; font-size: 15px;
    text-decoration: none; border: 1px solid var(--linea-marcada,#E4DCCB); color: var(--navy,#26374B); background: #fff; }
  .so-acc a:hover { background: var(--crema,#FBF9F4); }
  .so-acc a.prin { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }
  .so-acc a.prin:hover { background: #24364A; }
  .so-acc .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .so-acc svg { width: 17px; height: 17px; }
</style>

<body class="adm-piel">

<div class="admin-wrap">
  <div class="so-wrap" id="so">
    <div class="so-cab"><h1>Socios</h1><p>Cargando…</p></div>
  </div>
</div>

<!-- ===== HOJA DEL SOCIO (se abre al tocar una fila) ===== -->
<div class="so-capa">
  <div class="so-velo" id="so-velo"></div>
  <div class="so-hoja" id="so-hoja" role="dialog" aria-modal="true" aria-labelledby="so-h-nombre">
    <div class="asa" aria-hidden="true"></div>
    <div class="so-hoja-cab">
      <span class="so-ini" id="so-h-ini"></span>
      <div><h3 id="so-h-nombre"></h3><p class="sub" id="so-h-sub"></p></div>
      <button type="button" class="so-cerrar" id="so-h-cerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="so-datos" id="so-h-datos"></div>
    <div class="so-acc" id="so-h-acc"></div>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var b = (window.APOLANA_BASE || '../../');
  var hoyIso = new Date().toISOString().slice(0, 10);
  var ANIO_ESCUELA = 2009; // nacidos en 2009 o después = escuela; antes = socio (adulto)
  var EDAD_SOCIO = 18;     // se pasa a socio el año que se cumplen 18

  function anio(f) { if (!f) return NaN; var y = parseInt(String(f).slice(0, 4), 10); return isNaN(y) ? NaN : y; }
  function edad(f) { var y = anio(f); if (isNaN(y)) return null; return (new Date().getFullYear()) - y; }
  // Un socio = ficha con tipo_membresia 'socio', o SIN membresía puesta pero
  // CON número de socio (socio mal etiquetado). Antes se contaba como socio a
  // cualquier adulto sin datos, y eso metía a entrenadores, máster, atletas y
  // hasta voluntarios en el recuento (salían 215 en vez de ~172 reales).
  function esSocio(a) {
    if (a.tipo_membresia === 'socio') return true;
    // CON número de socio = socio, aunque el tipo diga otra cosa: hay socios que
    // además hacen Cubo (Gloria, Pilar…) y estaban puestos como 'cubo'. El número
    // de socio solo lo tienen los socios, así que es la marca fiable. Los atletas,
    // escuela, entrenadores y máster no tienen número → no cuentan.
    return a.numero_socio != null && String(a.numero_socio).trim() !== '';
  }
  // Candidato a pasar a socio: se pasa a socio el AÑO QUE SE CUMPLEN 18
  // (nacidos ese año). Este año, 2008; el que viene, 2009; y así. Solo se
  // avisa de quien todavía NO consta como socio (para confirmarlo y cambiarle
  // la ficha): los que ya son socios no son «transición». Con `<=` también
  // salen los que se pasaron y quedaron sin cambiar (rezagados), no solo la
  // hornada de este año.
  function anioActual() { return new Date().getFullYear(); }
  // Candidato a pasar a socio = niño de la ESCUELA que ya tiene la edad de socio
  // (nacido antes de 2009) y aún no consta como socio. Antes marcaba a CUALQUIER
  // adulto sin nº de socio (Cubo, máster, atletas, entrenadores, voluntarios…) y
  // salían decenas que no tocaban. Solo la escuela «acaba por edad».
  function pasaAsocio(a) {
    if (a.tipo_membresia !== 'escuela') return false;
    var y = anio(a.fecha_nacimiento);
    if (isNaN(y)) return false;
    return (y <= anioActual() - EDAD_SOCIO) && !esSocio(a);
  }

  function sinCobrar(p) {
    return p.estado === 'impagado' || (p.estado === 'pendiente' && p.fecha_vencimiento && p.fecha_vencimiento < hoyIso);
  }

  var SOCIOS = [], ULTIMO = {}, SIN_RECIBOS = false, CANDIDATOS = [], ALTAS_PEND = 0;

  async function cargar() {
    // Personas (no de baja)
    var ra = await sb.from('atletas')
      .select('id,nombre,apellidos,estado,fecha_nacimiento,tipo_membresia,numero_socio,telefono,email')
      .neq('estado', 'baja');
    var gente = (!ra.error && ra.data) ? ra.data : [];
    SOCIOS = gente.filter(esSocio);
    CANDIDATOS = gente.filter(pasaAsocio);

    // Último recibo por persona (tabla pagos)
    ULTIMO = {};
    var rp = await sb.from('pagos').select('atleta_id,importe,estado,fecha_vencimiento')
      .order('fecha_vencimiento', { ascending: false, nullsFirst: false });
    SIN_RECIBOS = !!rp.error;
    if (!rp.error && rp.data) rp.data.forEach(function (p) {
      if (!p.atleta_id || ULTIMO[p.atleta_id]) return;
      ULTIMO[p.atleta_id] = { sinCobrar: sinCobrar(p) };
    });

    // Altas de socio pendientes
    try {
      var rs = await sb.from('altas_socio_panel').select('id,estado');
      if (!rs.error && rs.data) ALTAS_PEND = rs.data.filter(function (x) { return x.estado === 'pendiente'; }).length;
    } catch (e) { /* si no se puede leer, se deja en 0 */ }
  }

  function estadoRecibo(a) {
    if (SIN_RECIBOS) return { clase: 'sin', txt: 'sin poder mirarlo' };
    var u = ULTIMO[a.id];
    if (!u) return { clase: 'sin', txt: 'sin recibos' };
    return u.sinCobrar ? { clase: 'mal', txt: 'impagado' } : { clase: 'ok', txt: 'al día' };
  }

  /* ---------- pantalla ----------
     La estructura se pinta una vez (cabecera, cifras, aviso, buscador y
     chips) y solo se repinta la lista: el buscador no pierde el foco. */
  var FESTADO = '';   // '' | 'aldia' | 'impago' | 'sinrecibos' (los mismos valores que el desplegable de antes)
  var ICO_TEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICO_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';

  function nombreDe(a) { return ((a.nombre || '') + ' ' + (a.apellidos || '')).trim() || 'Sin nombre'; }
  function inicialesDe(a) {
    var n = (a.nombre || '').trim(), ap = (a.apellidos || '').trim();
    return ((n ? n[0] : '') + (ap ? ap[0] : '')).toUpperCase() || '·';
  }
  /* La letra del bloque: la del apellido (por eso ordena la lista). */
  function letraDe(a) {
    var t = (a.apellidos || a.nombre || '').trim();
    var c = t ? t[0].toUpperCase() : '#';
    try { c = c.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
    return /[A-ZÑ]/.test(c) ? c : '#';
  }

  function filtrada() {
    var q = ($('so-buscar') ? $('so-buscar').value : '').trim().toLowerCase();
    var fEstado = FESTADO;
    return SOCIOS.filter(function (a) {
      if (q) {
        var txt = ((a.nombre || '') + ' ' + (a.apellidos || '') + ' ' + (a.telefono || '') + ' ' + (a.email || '')).toLowerCase();
        if (txt.indexOf(q) === -1) return false;
      }
      if (fEstado) {
        var e = estadoRecibo(a).clase;
        if (fEstado === 'aldia' && e !== 'ok') return false;
        if (fEstado === 'impago' && e !== 'mal') return false;
        if (fEstado === 'sinrecibos' && e !== 'sin') return false;
      }
      return true;
    }).sort(function (x, y) { return (x.apellidos || x.nombre || '').localeCompare(y.apellidos || y.nombre || '', 'es'); });
  }

  function filaHtml(a) {
    var e = estadoRecibo(a);
    var ed = edad(a.fecha_nacimiento);
    var sub = [ed != null ? ed + ' años' : '', a.numero_socio != null && String(a.numero_socio).trim() !== '' ? 'nº ' + a.numero_socio : ''].filter(Boolean).join(' · ');
    return '<div class="so-fila ' + e.clase + '" tabindex="0" data-id="' + esc(a.id) + '" aria-label="' + esc(nombreDe(a)) + ': ver qué hacer">' +
      '<span class="so-ini">' + esc(inicialesDe(a)) + '</span>' +
      '<span class="so-per"><b>' + esc(nombreDe(a)) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
      '<span class="so-pill ' + e.clase + '" title="Recibo"><span class="pt"></span>' + esc(e.txt) + '</span>' +
      '<span class="so-ficha" title="Ficha">' + esc(a.estado || '—') + '</span>' +
      (a.telefono
        ? '<a class="so-tel" href="tel:' + esc(String(a.telefono).replace(/\s+/g, '')) + '" aria-label="Llamar a ' + esc(nombreDe(a)) + '">' + ICO_TEL + esc(a.telefono) + '</a>'
        : '<span class="so-tel sin">sin teléfono</span>') +
      '<span class="so-flecha" aria-hidden="true">›</span>' +
    '</div>';
  }

  function pintarLista() {
    var lista = filtrada();
    var q = ($('so-buscar').value || '').trim();
    Array.prototype.forEach.call(document.querySelectorAll('#so-chips button'), function (b) {
      var on = (b.getAttribute('data-f') || '') === FESTADO;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.so-cifra[data-f]'), function (c) {
      c.classList.toggle('on', !!FESTADO && c.getAttribute('data-f') === FESTADO);
    });
    $('so-cuenta').textContent = (lista.length === SOCIOS.length ? SOCIOS.length + ' socios' : lista.length + ' de ' + SOCIOS.length + ' socios');
    if (!lista.length) {
      $('so-lista').innerHTML = '<div class="so-vacio">' + (SOCIOS.length ? 'Ningún socio con este filtro.' +
        ((q || FESTADO) ? '<br><button type="button" data-limpiar>Quitar el filtro</button>' : '')
        : 'Todavía no hay socios en la app. Se irán viendo aquí según los vayas dando de alta.') + '</div>';
      return;
    }
    /* Por bloques de inicial (solo si hay suficientes: con pocos, estorban). */
    var h = '<div class="so-cab-cols" aria-hidden="true"><span></span><span>Socio</span><span>Recibo</span><span>Ficha</span><span>Contacto</span><span></span></div>';
    var conLetras = lista.length > 12, letra = null, cuantos = {};
    if (conLetras) lista.forEach(function (a) { var l = letraDe(a); cuantos[l] = (cuantos[l] || 0) + 1; });
    h += '<div class="so-lista">';
    lista.forEach(function (a) {
      if (conLetras) {
        var l = letraDe(a);
        if (l !== letra) {
          if (letra !== null) h += '</div><div class="so-lista">';
          letra = l;
          h += '<h2 class="so-letra">' + esc(l) + ' <span>' + cuantos[l] + '</span></h2>';
        }
      }
      h += filaHtml(a);
    });
    h += '</div>';
    $('so-lista').innerHTML = h;
  }

  function montar() {
    var alDia = SOCIOS.filter(function (a) { return estadoRecibo(a).clase === 'ok'; }).length;
    var impago = SOCIOS.filter(function (a) { return estadoRecibo(a).clase === 'mal'; }).length;
    var sinRec = SOCIOS.filter(function (a) { return estadoRecibo(a).clase === 'sin'; }).length;

    var transicion = CANDIDATOS.length
      ? '<div class="so-avisos"><div class="so-transicion">' +
          '<b>' + CANDIDATOS.length + (CANDIDATOS.length === 1 ? ' persona pasa' : ' personas pasan') + ' a socio este año</b> (acaban la escuela por edad). Revisa quién sigue en el club como socio y a quién das de baja — cámbialo en su ficha.' +
          '<div class="chips">' + CANDIDATOS.slice(0, 30).map(function (a) {
            return '<a class="chip" href="' + b + 'admin/atletas/?ficha=' + esc(a.id) + '">' + esc(((a.nombre || '') + ' ' + (a.apellidos || '')).trim()) + '</a>';
          }).join('') + '</div></div></div>'
      : '';

    $('so').innerHTML =
      '<div class="so-cab"><h1>Socios</h1><p>Los socios del club (cuota anual). Aquí ves quién está al día, quién debe, y las altas nuevas. Toca un socio para abrir su ficha, llamarle o ver sus recibos.</p></div>' +
      '<div class="so-cifras">' +
        '<button type="button" class="so-cifra" data-f=""><b>' + SOCIOS.length + '</b><span>socios</span></button>' +
        '<button type="button" class="so-cifra ok" data-f="aldia"><b>' + alDia + '</b><span>al día</span></button>' +
        '<button type="button" class="so-cifra mal" data-f="impago"><b>' + impago + '</b><span>impagados</span></button>' +
        '<a class="so-cifra aviso" href="' + b + 'admin/altas/?tipo=socio"><b>' + ALTAS_PEND + '</b><span>altas de socio por revisar →</span></a>' +
      '</div>' +
      transicion +
      '<div class="so-filtros">' +
        '<input type="search" class="so-buscar" id="so-buscar" placeholder="Buscar socio (nombre, teléfono, correo)…" aria-label="Buscar socio" autocomplete="off">' +
        '<div class="so-chips" id="so-chips" role="group" aria-label="Recibos">' +
          '<button type="button" data-f="">Todos</button>' +
          '<button type="button" data-f="aldia">Al día</button>' +
          '<button type="button" data-f="impago">Impagados</button>' +
          '<button type="button" data-f="sinrecibos">Sin recibos' + (sinRec ? ' · ' + sinRec : '') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="so-pie-filtros"><span class="so-cuenta" id="so-cuenta" aria-live="polite"></span>' +
        '<a class="so-ir" href="' + b + 'admin/cobros/">Recibos y cuotas →</a></div>' +
      '<div id="so-lista"></div>';

    $('so-buscar').addEventListener('input', pintarLista);
    $('so').addEventListener('click', function (e) {
      var f = e.target.closest('[data-f]');
      if (f && (f.closest('#so-chips') || f.classList.contains('so-cifra'))) {
        var v = f.getAttribute('data-f') || '';
        /* Pulsar la cifra que ya filtra la quita. */
        FESTADO = (f.classList.contains('so-cifra') && v && FESTADO === v) ? '' : v;
        pintarLista(); return;
      }
      if (e.target.closest('[data-limpiar]')) { FESTADO = ''; $('so-buscar').value = ''; pintarLista(); $('so-buscar').focus(); return; }
      if (e.target.closest('a')) return;          // el teléfono llama, no abre la hoja
      var fila = e.target.closest('.so-fila[data-id]');
      if (fila) abrirHoja(fila.getAttribute('data-id'), fila);
    });
    $('so').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var fila = e.target.closest && e.target.closest('.so-fila[data-id]');
      if (!fila || e.target !== fila) return;
      e.preventDefault(); abrirHoja(fila.getAttribute('data-id'), fila);
    });
    pintarLista();
  }

  /* ---------- hoja del socio ---------- */
  var focoPrevio = null;
  function abrirHoja(id, desde) {
    var a = SOCIOS.filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    focoPrevio = desde || document.activeElement;
    var e = estadoRecibo(a), ed = edad(a.fecha_nacimiento);
    $('so-h-ini').textContent = inicialesDe(a);
    $('so-h-ini').style.cssText = e.clase === 'mal' ? 'background:#FBE9E7;color:#9A2F26' : '';
    $('so-h-nombre').textContent = nombreDe(a);
    $('so-h-sub').textContent = [ed != null ? ed + ' años' : '', a.numero_socio ? 'socio nº ' + a.numero_socio : ''].filter(Boolean).join(' · ') || 'Socio';
    function par(k, v) { return '<div><span>' + esc(k) + '</span><b>' + v + '</b></div>'; }
    $('so-h-datos').innerHTML =
      par('Recibo', '<span class="so-pill ' + e.clase + '"><span class="pt"></span>' + esc(e.txt) + '</span>') +
      par('Ficha', esc(a.estado || '—')) +
      par('Teléfono', a.telefono ? esc(a.telefono) : '—') +
      par('Correo', a.email ? esc(a.email) : '—');
    var tel = a.telefono ? String(a.telefono).replace(/\s+/g, '') : '';
    $('so-h-acc').innerHTML =
      '<a class="prin" href="' + b + 'admin/atletas/?ficha=' + esc(a.id) + '">Abrir su ficha</a>' +
      ((tel || a.email) ? '<div class="dos">' +
        (tel ? '<a href="tel:' + esc(tel) + '">' + ICO_TEL + 'Llamar</a>' : '') +
        (a.email ? '<a href="mailto:' + esc(a.email) + '">' + ICO_MAIL + 'Correo</a>' : '') + '</div>' : '') +
      '<a href="' + b + 'admin/cobros/?atleta=' + esc(a.id) + '">Ver sus recibos</a>';
    $('so-velo').classList.add('ver'); $('so-hoja').classList.add('ver');
    setTimeout(function () { $('so-h-cerrar').focus(); }, 60);
  }
  function cerrarHoja() {
    if (!$('so-hoja').classList.contains('ver')) return;
    $('so-velo').classList.remove('ver'); $('so-hoja').classList.remove('ver');
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) focoPrevio.focus();
  }
  $('so-velo').addEventListener('click', cerrarHoja);
  $('so-h-cerrar').addEventListener('click', cerrarHoja);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarHoja(); });

  cargar().then(montar).catch(function (e) {
    $('so').innerHTML = '<div class="so-cab"><h1>Socios</h1><p style="color:#B23B3B">No se ha podido cargar: ' + esc(String(e)) + '</p></div>';
  });
});
</script>

</body>
</html>
