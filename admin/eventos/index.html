<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js?v=a02b231d" defer></script>
<script src="../../assets/js/db.js?v=4fd9379b" defer></script>
<script src="../../assets/js/admin-auth.js?v=881708bc"></script>
<script src="../../assets/js/admin-tabbar.js?v=df4a2fba" defer></script>
<style>
  /* ============================================================
     EVENTOS · lista en tarjetas (23-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios» y «Competiciones»: cabecera grande,
     cifras que filtran, buscador + chips (tipo de evento), una
     tarjeta por evento agrupadas por MES, con la fecha a la
     izquierda y la franja del mismo color con el que sale en el
     calendario de la web, y una HOJA INFERIOR con su ficha, editar
     y borrar. El formulario de nuevo / editar es el de antes, en
     ventana por encima de la hoja. Mismas escrituras que la versión
     de antes. Prefijo ev-.
     ============================================================ */
  /* Necesario para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .ev-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .ev-wrap *, .ev-capa *, #panel-form * { box-sizing: border-box; }
  .oculto { display: none !important; }

  /* --- Cabecera --- */
  .ev-cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
  .ev-cab > div:first-child { flex: 1 1 340px; min-width: 0; }
  .ev-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; line-height: 1; }
  .ev-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 68ch; }
  .ev-cab-acc { display: flex; gap: 8px; flex-wrap: wrap; }
  .ev-b { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; padding: 0 18px; border-radius: 999px;
    border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff; color: var(--navy,#26374B); font: inherit; font-size: 14.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; text-decoration: none; }
  .ev-b:hover { background: var(--crema,#FBF9F4); }
  .ev-b.prin { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }
  .ev-b.prin:hover { background: #24364A; }
  .ev-b:disabled { opacity: .55; cursor: wait; }
  .ev-b.mini { min-height: 44px; padding: 0 16px; font-size: 14px; }
  @media (max-width: 520px) { .ev-cab-acc { width: 100%; } .ev-cab-acc .ev-b { flex: 1 1 0; padding: 0 12px; } }

  /* --- Cifras: pulsar una filtra la lista --- */
  .ev-cifras { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 18px 0 6px; }
  .ev-cifra { display: flex; flex-direction: column; justify-content: flex-start; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .ev-cifra:hover { border-color: var(--linea-borde,#C9C0AE); }
  .ev-cifra:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .ev-cifra b { display: block; font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .ev-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .ev-cifra.ok b { color: #3E7A34; }
  .ev-cifra.tenue b { color: var(--texto-suave,#6E6656); }
  .ev-cifra.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  @media (max-width: 620px) { .ev-cifras { grid-template-columns: repeat(2, minmax(0,1fr)); } .ev-cifra b { font-size: 21px; } }

  /* --- Buscador + chips (tipo de evento) --- */
  .ev-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 4px; }
  .ev-buscar { flex: 1 1 260px; min-width: 0; min-height: 48px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; background: #fff; color: var(--navy,#26374B); }
  .ev-buscar:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  /* Seis tipos no caben en una línea: los chips bajan a la siguiente en vez
     de esconderse por la derecha. */
  .ev-chips { display: flex; flex-wrap: wrap; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 16px; padding: 4px;
    max-width: 100%; }
  .ev-chips button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px;
    background: none; font: inherit; font-weight: 700; font-size: 13.5px; color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .ev-chips button:hover { color: var(--navy,#26374B); }
  .ev-chips button small { font-family: var(--fuente-dato); font-weight: 600; font-size: 12px; opacity: .75; }
  .ev-chips button.on { background: var(--navy,#26374B); color: #fff; }
  .ev-pie-filtros { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .ev-cuenta { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .ev-ir { font-size: 14px; font-weight: 700; color: var(--azul-oscuro,#2A5E8C); text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; }
  .ev-ir:hover { text-decoration: underline; text-underline-offset: 2px; }
  @media (max-width: 620px) { .ev-chips { width: 100%; border-radius: 14px; } }

  /* --- Color: el mismo con el que sale en el calendario de la web.
     Las competiciones, del color de su deporte; el resto de eventos, en
     el azul de «evento del club». Primero el gris de reserva y DESPUÉS los
     colores, para que estos ganen. --- */
  .ev-fila, .ev-hoja-cab { --c: #CFC6B4; --s: #F0ECE2; --t: #55503F; }
  .d-pista            { --c: #B0563A; --s: #FBEAE5; --t: #8A3E28; }
  .d-running          { --c: #C1742E; --s: #FBEEDD; --t: #86501C; }
  .d-natacion         { --c: #2E8C86; --s: #E2F1EF; --t: #1F615C; }
  .d-escuela-natacion { --c: #3B85C0; --s: #E6F0F8; --t: #29628F; }
  .d-triatlon         { --c: #7A5CA8; --s: #EEE8F4; --t: #543C74; }
  .d-escolar          { --c: #6E9B3E; --s: #EEF4E2; --t: #4C6C2A; }
  .d-montana          { --c: #8A6D3B; --s: #F3ECDD; --t: #60492A; }
  .d-cubo             { --c: #6B5B8A; --s: #F0E6F1; --t: #4C3F66; }
  .d-evento           { --c: #2F6FA8; --s: #E8F0F7; --t: #23507A; }

  /* --- Bloques por mes --- */
  .ev-mes { margin: 22px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave,#6E6656);
    display: flex; align-items: baseline; gap: 8px; }
  .ev-mes span { font-weight: 600; letter-spacing: 0; text-transform: none; }
  .ev-mes.pasado { color: var(--texto-tenue,#9A927F); }
  .ev-lista { container: ev-lista / inline-size; display: flex; flex-direction: column; gap: 8px; }

  /* --- Fila-tarjeta: toda ella abre la hoja --- */
  .ev-fila { position: relative; display: grid; grid-template-columns: 52px minmax(0,1.5fr) minmax(0,1.5fr) 14px; gap: 0 14px; align-items: center;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid var(--c); border-radius: 14px; padding: 10px 14px 10px 12px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .ev-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .ev-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .ev-fila.pasada { background: #FCFBF8; }
  .ev-fila.pasada .ev-nom b { color: var(--texto-suave,#6E6656); }
  /* La fecha, donde otras pantallas llevan las iniciales */
  .ev-dia { width: 52px; min-height: 52px; border-radius: 12px; background: var(--s); color: var(--t); display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1; padding: 5px 0; text-align: center; }
  .ev-dia small { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .ev-dia b { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-size: 22px; font-weight: 700; margin-top: 3px; }
  .ev-fila.pasada .ev-dia { background: #F0EBE0; color: #8A816E; }
  .ev-nom { min-width: 0; }
  .ev-nom b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .ev-nom small { display: block; font-size: 13px; color: var(--texto-tenue,#9A927F); margin-top: 2px; overflow-wrap: anywhere; line-height: 1.35; }
  .ev-nom small svg { width: 12px; height: 12px; vertical-align: -1px; margin-right: 3px; }
  .ev-nom .encurso { color: #23603A; font-weight: 700; }
  .ev-pills { display: flex; flex-wrap: wrap; gap: 4px 5px; min-width: 0; align-items: center; }
  .ev-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px 3px 9px; border-radius: 999px;
    background: #F0EBE0; color: #6E6656; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .ev-pill .pt { width: 7px; height: 7px; border-radius: 999px; background: #9A927F; flex: 0 0 7px; }
  .ev-pill.tipo { background: var(--s); color: var(--t); } .ev-pill.tipo .pt { background: var(--c); }
  .ev-pill.sec { background: #fff; color: var(--navy,#26374B); border: 1px solid var(--linea-marcada,#E4DCCB); padding: 2px 9px; font-weight: 600; }
  .ev-pill.todos { background: #fff; color: var(--azul-oscuro,#23507A); border: 1px dashed #B9CFE3; padding: 2px 9px; font-weight: 600; }
  .ev-pill.abierta { background: #E7F3EA; color: #23603A; } .ev-pill.abierta .pt { background: #3E7A34; }
  .ev-pill.cerrada { background: #fff; color: var(--texto-tenue,#9A927F); border: 1px dashed #D8CFBC; padding: 2px 9px; }
  .ev-enlace { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 10px; border-radius: 999px;
    border: 1px solid #CFE2F1; background: #F2F7FC; color: var(--azul-oscuro,#1E4E78); font-size: 12.5px; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .ev-enlace:hover { background: #E6F0F8; }
  .ev-enlace svg { width: 13px; height: 13px; }
  .ev-flecha { color: #B5AC99; font-size: 20px; line-height: 1; text-align: right; }
  .ev-cab-cols { display: grid; grid-template-columns: 52px minmax(0,1.5fr) minmax(0,1.5fr) 14px; gap: 0 14px; padding: 14px 14px 0 16px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-tenue,#9A927F); }
  /* Lista estrecha (móvil): fecha y nombre arriba; tipo, secciones y enlaces debajo */
  @container ev-lista (max-width: 640px) {
    .ev-fila { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 11px 12px 12px 10px; }
    .ev-dia { order: 0; flex: 0 0 52px; }
    .ev-nom { order: 1; flex: 1 1 0; align-self: center; }
    .ev-flecha { order: 2; font-size: 22px; align-self: center; }
    .ev-fila::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
    .ev-pills { order: 4; flex: 1 1 auto; padding-left: 64px; }
  }
  @media (max-width: 700px) { .ev-cab-cols { display: none; } }
  .ev-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE); border-radius: 14px; margin-top: 10px; line-height: 1.5; }
  .ev-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }
  .ev-vacio button { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linea-borde,#C9C0AE); background: #fff;
    font: inherit; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; }

  /* --- Hoja inferior: lo que se hace con un evento --- */
  .ev-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .ev-velo.ver { opacity: 1; pointer-events: auto; }
  .ev-hoja { position: fixed; left: 50%; bottom: 0; width: min(640px,100%); transform: translate(-50%,105%); z-index: 9001; background: #fff; color: var(--navy,#26374B);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transition: transform .25s ease; max-height: 92vh; overflow: auto;
    overscroll-behavior: contain; box-shadow: 0 -10px 40px rgba(20,30,45,.25); visibility: hidden; }
  .ev-hoja.ver { transform: translate(-50%,0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .ev-hoja, .ev-velo, .ev-fila { transition: none; } }
  .ev-hoja .asa { width: 42px; height: 5px; border-radius: 9px; background: #DDD5C4; margin: 2px auto 12px; }
  .ev-hoja-cab { display: flex; align-items: center; gap: 12px; }
  .ev-hoja-cab .ev-dia { width: 60px; flex: 0 0 60px; min-height: 64px; }
  .ev-hoja-cab .ev-dia b { font-size: 26px; margin: 2px 0 3px; }
  .ev-hoja-cab > div { flex: 1; min-width: 0; }
  .ev-hoja h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
  .ev-hoja .sub { color: var(--texto-suave,#6E6656); font-size: 13.5px; margin: 4px 0 0; overflow-wrap: anywhere; }
  .ev-cerrar { flex: 0 0 auto; align-self: flex-start; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 20px; line-height: 1; cursor: pointer; }
  .ev-caja { background: var(--crema,#FBF9F4); border-radius: 14px; padding: 4px 14px; margin-top: 14px; }
  .ev-caja > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; }
  .ev-caja > div:last-child { border-bottom: 0; }
  .ev-caja > div.alto { align-items: flex-start; }
  .ev-caja > div > span { color: var(--texto-suave,#6E6656); flex: 0 0 auto; }
  .ev-caja > div > b { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .ev-caja b .ev-pill { vertical-align: 1px; margin: 1px 0 1px 3px; }
  .ev-caja b small { display: block; font-size: 12.5px; font-weight: 400; color: var(--texto-tenue,#9A927F); }
  .ev-caja a { color: var(--azul-oscuro,#2A5E8C); }
  .ev-cartel { display: inline-block; line-height: 0; }
  .ev-cartel img { max-width: 120px; max-height: 160px; border-radius: 10px; border: 1px solid var(--linea,#E4DCCB); display: block; }
  .ev-notas { margin-top: 10px; background: #F3F7FB; border: 1px solid #D5E3F0; color: #24476B; border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.45;
    white-space: pre-line; overflow-wrap: anywhere; }
  .ev-acc { display: grid; gap: 8px; margin-top: 20px; }
  .ev-acc button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 15px;
    border: 1px solid var(--linea-marcada,#E4DCCB); color: var(--navy,#26374B); background: #fff; cursor: pointer; width: 100%; }
  .ev-acc button:hover { background: var(--crema,#FBF9F4); }
  .ev-acc button.prin { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }
  .ev-acc button.prin:hover { background: #24364A; }
  /* «Borrar» no va pegado a «Editar»: así no se pulsa sin querer */
  .ev-acc button.peligro { color: #9A3B3B; border-color: #EBC9C5; margin-top: 10px; }
  .ev-acc button.peligro:hover { background: #FDF3F2; }
  .ev-acc button:disabled { opacity: .55; cursor: wait; }

  .msg { margin-top: 10px; font-size: 14px; }
  .msg:empty { display: none; }
  .msg.error { color: #B0563A; }
  .msg.ok { color: #1e7a3d; }

  /* --- Formulario nuevo / editar: el de antes, en ventana por ENCIMA de la hoja --- */
  #panel-form { position: fixed; inset: 0; z-index: 9500; background: rgba(20,30,45,.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(16px,5vh,60px) 16px; overflow: auto;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  #panel-form .modal-caja { background: #fff; border-radius: 20px; color: var(--navy,#26374B);
    box-shadow: 0 30px 70px -25px rgba(20,30,45,.6); padding: 22px clamp(16px,4vw,26px) 22px; width: min(680px,100%);
    animation: modal-sube .2s ease; }
  @keyframes modal-sube { from { transform: translateY(12px); opacity: .6; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #panel-form .modal-caja { animation: none; } }
  #panel-form h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; letter-spacing: -0.01em; color: var(--navy,#26374B); margin: 0 0 4px; line-height: 1.1; }
  #panel-form label { display: block; font-size: 13px; font-weight: 600; color: var(--navy,#26374B); margin: 12px 0 5px; }
  #panel-form input, #panel-form textarea, #panel-form select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--linea-borde,#C9C0AE); border-radius: 12px;
    font-family: var(--fuente-texto); font-size: 15px; background: #fff; color: var(--navy,#26374B); }
  #panel-form input:focus, #panel-form textarea:focus, #panel-form select:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  #panel-form textarea { min-height: 100px; resize: vertical; }
  #panel-form input[type=file] { padding: 8px; font-size: 14px; }
  /* El cuadradito de marcar mide trece píxeles: con el dedo se falla más de lo
     que se acierta. Por eso la fila entera responde al toque, con la altura de
     un dedo, y también vale pulsar el texto, que es lo que la gente hace sin
     pensar. La casilla se ve igual que siempre; lo que crece es la zona
     sensible, que no se ve. */
  #panel-form .fila-check { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; min-height: 44px; cursor: pointer; font-weight: 500; }
  #panel-form .fila-check input { width: auto; flex: 0 0 auto; }

  /* Rótulo de un grupo de botones: se ve igual que un <label>, pero no
     apunta a un solo campo porque debajo van varios. */
  .etiqueta { display: block; font-size: 13px; font-weight: 600; color: var(--navy,#26374B); margin: 12px 0 5px; }

  /* --- Las secciones, a golpe de dedo --- */
  /* Mismo aspecto que los chips del resto del panel: el elegido relleno
     en navy, el resto perfilado sobre blanco. 44 px de alto, que esto se
     usa desde el móvil. */
  .sec-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sec-chips button {
    display: inline-flex; align-items: center; box-sizing: border-box;
    min-height: 44px; padding: 9px 16px; border: 1px solid var(--linea-borde, #C6BEAE);
    border-radius: 999px; background: #fff; color: var(--texto, #4A4437);
    font-family: var(--fuente-texto); font-size: 15px; font-weight: 500; line-height: 1.2;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .sec-chips button:hover { border-color: var(--navy); }
  .sec-chips button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .sec-chips .cargando { color: var(--texto-suave); font-size: 14px; padding: 10px 0; }
  /* La salida de emergencia: se ofrece lo que hay, pero si el club abre algo
     que aún no está en la base, que nadie se quede encerrado. Va discreta:
     el camino normal es elegir, no escribir. */
  .sec-otra { margin-top: 8px; }
  .sec-otra .abrir {
    background: none; border: 0; padding: 10px 2px; min-height: 44px;
    font-family: var(--fuente-texto); font-size: 14px; color: var(--azul-oscuro, #2F6FA8);
    text-decoration: underline; cursor: pointer;
  }
  .sec-otra .caja { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .sec-otra .caja input { flex: 1 1 auto; min-width: 0; }

  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
  .ev-form-pie { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ev-form-pie .msg { margin: 0; }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">
    <div class="ev-wrap" id="ev">
      <div class="ev-cab">
        <div>
          <h1>Eventos</h1>
          <p>Competiciones sueltas, salidas y quedadas del club: todo lo que guardas aquí sale en el calendario de la web. Toca un evento para ver su ficha, editarlo o borrarlo.</p>
        </div>
        <div class="ev-cab-acc"><button type="button" class="ev-b prin" id="nuevo-evento">+ Nuevo evento</button></div>
      </div>
      <div class="ev-cifras" id="ev-cifras"></div>
      <div class="ev-filtros">
        <input type="search" class="ev-buscar" id="ev-buscar" placeholder="Buscar evento, lugar o sección…" aria-label="Buscar evento" autocomplete="off">
        <div class="ev-chips" id="ev-chips" role="group" aria-label="Tipo de evento"></div>
      </div>
      <div class="ev-pie-filtros"><span class="ev-cuenta" id="ev-cuenta" aria-live="polite"></span>
        <a class="ev-ir" id="ev-ir-web" href="../../calendario/" target="_blank" rel="noopener">Ver el calendario de la web →</a></div>
      <div id="tabla-eventos"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
    </div>
  </div>
</div>

<!-- ===== HOJA DEL EVENTO (se abre al tocar una fila) ===== -->
<div class="ev-capa">
  <div class="ev-velo" id="ev-velo"></div>
  <div class="ev-hoja" id="ev-hoja" role="dialog" aria-modal="true" aria-labelledby="ev-h-tit">
    <div class="asa" aria-hidden="true"></div>
    <div class="ev-hoja-cab" id="ev-h-cab">
      <span class="ev-dia" id="ev-h-dia"></span>
      <div><h3 id="ev-h-tit"></h3><p class="sub" id="ev-h-sub"></p></div>
      <button type="button" class="ev-cerrar" id="ev-h-cerrar" aria-label="Cerrar">×</button>
    </div>
    <div id="ev-h-datos"></div>
    <div class="ev-acc" id="ev-h-acc">
      <button type="button" class="prin" data-hoja="editar">Editar el evento</button>
      <button type="button" class="peligro" data-hoja="borrar">Borrar el evento</button>
    </div>
  </div>
</div>

<!-- ===== FORMULARIO (nuevo / editar), el mismo de antes ===== -->
<div class="oculto" id="panel-form">
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="form-titulo">
  <h2 id="form-titulo">Nuevo evento</h2>
  <form id="form-evento">
    <input type="hidden" id="e-id">
    <label for="e-titulo">Título</label>
    <input type="text" id="e-titulo" required>
    <div class="grid2">
      <div>
        <label for="e-tipo">Tipo</label>
        <!-- Los tipos los fija la propia base (eventos_tipo_check): fuera de
             esta lista no deja guardar. Por eso aquí se elige, no se escribe:
             escribir cualquier otra cosa solo daría un error al guardar. -->
        <select id="e-tipo"></select>
      </div>
      <div>
        <label for="e-lugar">Lugar</label>
        <input type="text" id="e-lugar" placeholder="Ciudad / instalación">
      </div>
    </div>
    <label class="fila-check" for="e-dia-entero">
      <input type="checkbox" id="e-dia-entero">
      <span>Todo el día (sin hora) — p. ej. «sábado 20 · carrera»</span>
    </label>
    <div class="grid2">
      <div>
        <label for="e-inicio">Fecha inicio</label>
        <input type="datetime-local" id="e-inicio" required>
      </div>
      <div>
        <label for="e-fin">Fecha fin (opcional)</label>
        <input type="datetime-local" id="e-fin">
      </div>
    </div>
    <label for="e-enlace">Enlace (web de la carrera, opcional)</label>
    <input type="url" id="e-enlace" placeholder="https://…" inputmode="url" autocomplete="off">
    <label for="e-cartel-file">Cartel de la carrera (opcional)</label>
    <input type="file" id="e-cartel-file" accept="image/*">
    <input type="hidden" id="e-cartel-url">
    <div id="e-cartel-prev" class="cartel-prev oculto" style="margin-top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;">
      <img id="e-cartel-img" alt="Cartel del evento" style="max-width:220px;max-height:280px;border-radius:10px;border:1px solid var(--linea,#E4DCCB);display:block;">
      <button type="button" class="ev-b mini" id="e-cartel-quitar">Quitar cartel</button>
    </div>
    <span class="etiqueta" id="lbl-seccion">Secciones</span>
    <div class="sec-chips" id="e-seccion" role="group" aria-labelledby="lbl-seccion"></div>
    <div class="sec-otra">
      <button type="button" class="abrir" id="sec-otra-abrir">¿Falta alguna? Escríbela</button>
      <div class="caja oculto" id="sec-otra-caja">
        <input type="text" id="sec-otra-txt" placeholder="Nombre de la sección" aria-label="Otra sección">
        <button type="button" class="ev-b mini" id="sec-otra-add">Añadir</button>
      </div>
    </div>
    <label for="e-descripcion">Descripción</label>
    <textarea id="e-descripcion"></textarea>
    <label class="fila-check" for="e-inscripcion">
      <input type="checkbox" id="e-inscripcion">
      <span>Inscripción abierta</span>
    </label>
    <div class="ev-form-pie">
      <button class="ev-b prin" type="submit">Guardar</button>
      <button class="ev-b" type="button" id="cancelar">Cancelar</button>
      <span class="msg" id="msg-form"></span>
    </div>
  </form>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // timestamptz -> value para input datetime-local (YYYY-MM-DDTHH:mm) en hora local
  function paraInput(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d)) return '';
    var y = d.getFullYear(), mo = ('0' + (d.getMonth() + 1)).slice(-2), da = ('0' + d.getDate()).slice(-2);
    var h = ('0' + d.getHours()).slice(-2), mi = ('0' + d.getMinutes()).slice(-2);
    return y + '-' + mo + '-' + da + 'T' + h + ':' + mi;
  }

  var b = (window.APOLANA_BASE || '../../');
  $('ev-ir-web').href = b + 'calendario/';

  /* Los tipos que la base admite, en el orden en que se usan, y cómo se
     dicen delante de una persona: en la base se guarda el identificador
     (sin tildes ni espacios), pero eso no se enseña nunca. */
  var TIPOS = [
    { v: 'competicion',            t: 'Competición' },
    { v: 'control',                t: 'Control' },
    { v: 'entrenamiento_especial', t: 'Entrenamiento especial' },
    { v: 'evento_club',            t: 'Evento del club' },
    { v: 'actividad_padres',       t: 'Actividad de familias' },
    { v: 'otro',                   t: 'Otro' }
  ];
  function nombreTipo(t) {
    if (!t) return '—';
    for (var i = 0; i < TIPOS.length; i++) if (TIPOS[i].v === t) return TIPOS[i].t;
    /* Un tipo que ya no está en la lista se sigue leyendo bien: mejor
       «Marcha popular» que el identificador crudo. */
    return t.charAt(0).toUpperCase() + t.slice(1).replace(/_/g, ' ');
  }

  /* El desplegable de tipos. Se pinta con `elegido` puesto, y si un evento
     guardado trae un tipo que ya no está en la lista, se le añade su propia
     opción: al abrir su ficha no se le puede cambiar el tipo por la espalda. */
  function pintarTipos(elegido) {
    var lista = TIPOS.slice();
    if (elegido && !lista.some(function (x) { return x.v === elegido; })) {
      lista.push({ v: elegido, t: nombreTipo(elegido) });
    }
    $('e-tipo').innerHTML = '<option value="">Sin tipo</option>' +
      lista.map(function (x) {
        return '<option value="' + esc(x.v) + '"' + (x.v === elegido ? ' selected' : '') + '>' + esc(x.t) + '</option>';
      }).join('');
  }

  /* ------------------------------------------------------------
     LAS SECCIONES DEL CLUB
     No se escriben a mano ni se copian aquí: se preguntan a la base.
     Se dan por buenas las que tienen grupo, tarifa o algún evento ya
     guardado —esas son las secciones de verdad, las que existen— y el
     nombre con el que se enseñan sale de la página de cada sección.
     Así, el día que el club abra una sección nueva, aparece aquí sola.
     ------------------------------------------------------------ */
  var SECS = null;          /* [{v,t}] ya ordenadas */
  var NOMBRES = {};         /* identificador -> nombre bonito */
  function nombreSeccion(v) {
    if (NOMBRES[v]) return NOMBRES[v];
    var s = String(v || '').replace(/[-_]/g, ' ');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function cargarSecciones() {
    if (SECS) return Promise.resolve(SECS);
    return Promise.all([
      sb.from('contenido_secciones').select('seccion,titulo'),
      sb.from('grupos').select('seccion'),
      sb.from('tarifas').select('seccion'),
      sb.from('eventos').select('seccion')
    ]).then(function (r) {
      (r[0].data || []).forEach(function (x) { if (x.seccion && x.titulo) NOMBRES[x.seccion] = x.titulo; });
      var usadas = {};
      (r[1].data || []).forEach(function (x) { if (x.seccion) usadas[x.seccion] = true; });
      (r[2].data || []).forEach(function (x) { if (x.seccion) usadas[x.seccion] = true; });
      (r[3].data || []).forEach(function (x) {
        (x.seccion || []).forEach(function (s) { if (s) usadas[s] = true; });
      });
      var lista = Object.keys(usadas).map(function (v) { return { v: v, t: nombreSeccion(v) }; });
      lista.sort(function (a, b) { return a.t.localeCompare(b.t, 'es'); });
      /* Si las consultas fallan la lista sale vacía. No se inventa nada:
         quedan los botones de lo que ya tuviera el evento y el «escríbela». */
      SECS = lista;
      /* Con los nombres bonitos ya en la mano, la lista y la hoja los usan. */
      if (EVENTOS.length) pintarLista();
      if (hojaAbierta() && HOJA_EV) pintarHoja(HOJA_EV);
      return SECS;
    }, function () { SECS = []; return SECS; });
  }

  /* Qué secciones hay marcadas ahora mismo. Se lee de los propios botones
     para que al repintar (cuando llega la lista de la base) no se pierda lo
     que la persona acabara de tocar. */
  function seccionesMarcadas() {
    return Array.prototype.slice.call($('e-seccion').querySelectorAll('button[aria-pressed="true"]'))
      .map(function (b) { return b.getAttribute('data-sec'); });
  }

  function pintarSecciones(marcadas) {
    marcadas = marcadas || [];
    var lista = (SECS || []).slice();
    /* Una sección que ya tenía el evento y no está en la lista no se pierde:
       se le pone su botón, marcado. Nada desaparece por abrir la ficha. */
    marcadas.forEach(function (v) {
      if (!lista.some(function (x) { return x.v === v; })) lista.push({ v: v, t: nombreSeccion(v) });
    });
    var caja = $('e-seccion');
    if (!lista.length) {
      caja.innerHTML = SECS ? '<span class="cargando">No hemos podido traer las secciones. Puedes escribirlas abajo.</span>'
                            : '<span class="cargando">Cargando las secciones…</span>';
      return;
    }
    caja.innerHTML = lista.map(function (x) {
      var on = marcadas.indexOf(x.v) !== -1;
      return '<button type="button" data-sec="' + esc(x.v) + '" aria-pressed="' + on + '">' + esc(x.t) + '</button>';
    }).join('');
  }

  $('e-seccion').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sec]');
    if (!b) return;
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  });

  /* «¿Falta alguna? Escríbela»: el mismo criterio que en los ejercicios.
     Se ofrece lo que hay, pero no se encierra a nadie. Lo escrito se guarda
     con la misma forma que usa la base (minúsculas, sin tildes, con guiones)
     para que no salgan dos secciones que en realidad son la misma. */
  $('sec-otra-abrir').addEventListener('click', function () {
    $('sec-otra-caja').classList.remove('oculto');
    this.classList.add('oculto');
    $('sec-otra-txt').focus();
  });
  function anadirOtra() {
    var txt = $('sec-otra-txt').value.trim();
    if (!txt) return;
    var v = txt.toLowerCase()
      .replace(/[áàäâ]/g, 'a').replace(/[éèëê]/g, 'e').replace(/[íìïî]/g, 'i')
      .replace(/[óòöô]/g, 'o').replace(/[úùüû]/g, 'u').replace(/ñ/g, 'n')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if (!v) return;
    if (!NOMBRES[v]) NOMBRES[v] = txt.charAt(0).toUpperCase() + txt.slice(1);
    var marcadas = seccionesMarcadas();
    if (marcadas.indexOf(v) === -1) marcadas.push(v);
    pintarSecciones(marcadas);
    $('sec-otra-txt').value = '';
  }
  $('sec-otra-add').addEventListener('click', anadirOtra);
  /* Enter dentro del hueco añade la sección; no manda el formulario, que
     sería guardar el evento a medias sin querer. */
  $('sec-otra-txt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); anadirOtra(); }
  });

  /* ---------- fechas ---------- */
  var DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var DIAS_LARGO = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var ME = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  /* Las fechas se leen en hora local, igual que el calendario de la web. */
  function fechaDe(ts) { if (!ts) return null; var d = new Date(ts); return isNaN(d.getTime()) ? null : d; }
  function claveDe(d) { return d ? d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) : ''; }
  /* La hora, solo si la tiene: un evento de todo el día (o a las 00:00) no
     lleva un «00:00» que no significa nada. Mismo criterio que la web. */
  function horaDe(ts, diaEntero) {
    if (diaEntero) return null;
    var d = fechaDe(ts); if (!d) return null;
    var h = pad(d.getHours()) + ':' + pad(d.getMinutes());
    return h === '00:00' ? null : h;
  }
  function fechaLarga(d) { return d ? DIAS_LARGO[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() : 'sin fecha'; }
  function fechaCortaDia(d) { return d ? DIAS[d.getDay()] + ' ' + d.getDate() + ' ' + ME[d.getMonth()] : ''; }
  function diaHtml(ts, conMes) {
    var d = fechaDe(ts);
    if (!d) return '<small>fecha</small><b>?</b>' + (conMes ? '<small>&nbsp;</small>' : '');
    return '<small>' + DIAS[d.getDay()] + '</small><b>' + d.getDate() + '</b>' + (conMes ? '<small>' + ME[d.getMonth()] + '</small>' : '');
  }
  function quitarTildes(s) { s = String(s || '').toLowerCase(); try { s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {} return s; }

  var ICO_LUGAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  var ICO_ENLACE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
  var ICO_CARTEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="9.5" cy="9" r="1.8"/><path d="M20 16l-4.5-4.5L7 20"/></svg>';

  /* El color con el que sale en el calendario de la web: una competición, el
     de su deporte (si lleva una sola sección); el resto de eventos, el azul
     de «evento del club». */
  function colorClase(ev) {
    if (ev.tipo !== 'competicion') return 'd-evento';
    var secs = (ev.seccion || []).filter(Boolean);
    var d = secs.length === 1 ? secs[0] : '';
    if (d === 'pista' || d === 'competicion' || d === 'atletismo') return 'd-pista';
    if (['escuela-natacion', 'natacion', 'running', 'triatlon', 'escolar', 'montana', 'cubo'].indexOf(d) !== -1) return 'd-' + d;
    return 'd-otro';
  }

  // =========================================================
  // LISTA DE EVENTOS
  // =========================================================
  var EVENTOS = [], HOY = '', LISTA_ROTA = false;
  var FCIFRA = '';   // '' | 'proximos' | 'mes' | 'abiertos' | 'pasados'
  var FTIPO = null;  // null = todos | '' = sin tipo | tipo

  /* Lo que se deduce de cada evento (nada de esto se guarda). */
  function info(ev) {
    var di = fechaDe(ev.fecha_inicio), df = fechaDe(ev.fecha_fin);
    var ki = claveDe(di), kf = claveDe(df);
    var varios = !!kf && kf > ki;
    var kfin = varios ? kf : ki;
    return { di: di, df: df, ki: ki, varios: varios, mes: ki.slice(0, 7),
      pasado: !!ki && kfin < HOY, enCurso: !!ki && ki <= HOY && kfin >= HOY,
      hora: horaDe(ev.fecha_inicio, ev.dia_entero) };
  }

  async function cargarEventos() {
    var cont = $('tabla-eventos');
    cont.innerHTML = ADM.esqueleto(4);
    var r = await sb.from('eventos')
      .select('id,titulo,tipo,fecha_inicio,fecha_fin,dia_entero,lugar,seccion,inscripcion_abierta,url,cartel_url')
      .order('fecha_inicio', { ascending: true });
    // Si la consulta falla no sabemos si hay eventos o no: error con reintento,
    // nunca «no hay eventos», que sería mentir.
    if (r.error) {
      LISTA_ROTA = true; EVENTOS = [];
      $('ev-cifras').innerHTML = ''; $('ev-chips').innerHTML = ''; $('ev-cuenta').textContent = '';
      cont.innerHTML = ADM.error(r.error.message, cargarEventos);
      return;
    }
    LISTA_ROTA = false;
    HOY = claveDe(new Date());
    /* Primero los PRÓXIMOS (y los que están en marcha), del más cercano al más
       lejano; después los ya celebrados, del más reciente al más antiguo. */
    var todos = r.data || [];
    var prox = todos.filter(function (ev) { return !info(ev).pasado; });
    var pas = todos.filter(function (ev) { return info(ev).pasado; }).reverse();
    EVENTOS = prox.concat(pas);
    pintarTodo();
  }

  function pintarTodo() { pintarCifras(); pintarChips(); pintarLista(); }

  function pintarCifras() {
    if (!EVENTOS.length) { $('ev-cifras').innerHTML = ''; return; }
    var mesHoy = HOY.slice(0, 7), nProx = 0, nMes = 0, nAb = 0, nPas = 0;
    EVENTOS.forEach(function (ev) {
      var i = info(ev);
      if (i.pasado) nPas++; else nProx++;
      if (i.mes === mesHoy) nMes++;
      if (!i.pasado && ev.inscripcion_abierta) nAb++;
    });
    $('ev-cifras').innerHTML =
      '<button type="button" class="ev-cifra" data-f="proximos"><b>' + nProx + '</b><span>' + (nProx === 1 ? 'próximo' : 'próximos') + '</span></button>' +
      '<button type="button" class="ev-cifra" data-f="mes"><b>' + nMes + '</b><span>en ' + MESES[+mesHoy.slice(5, 7) - 1] + '</span></button>' +
      '<button type="button" class="ev-cifra ok" data-f="abiertos"><b>' + nAb + '</b><span>con inscripción abierta</span></button>' +
      '<button type="button" class="ev-cifra tenue" data-f="pasados"><b>' + nPas + '</b><span>' + (nPas === 1 ? 'ya celebrado' : 'ya celebrados') + '</span></button>';
  }

  function pintarChips() {
    if (!EVENTOS.length) { $('ev-chips').innerHTML = ''; $('ev-chips').classList.add('oculto'); return; }
    $('ev-chips').classList.remove('oculto');
    var cuenta = {};
    EVENTOS.forEach(function (ev) { var k = ev.tipo || ''; cuenta[k] = (cuenta[k] || 0) + 1; });
    var orden = TIPOS.map(function (x) { return x.v; }).filter(function (k) { return cuenta[k]; });
    Object.keys(cuenta).forEach(function (k) { if (k && orden.indexOf(k) === -1) orden.push(k); });
    if (cuenta['']) orden.push('');
    if (FTIPO !== null && !cuenta[FTIPO]) FTIPO = null;
    $('ev-chips').innerHTML = '<button type="button" data-tipo="*">Todos</button>' + orden.map(function (k) {
      return '<button type="button" data-tipo="' + esc(k) + '">' + esc(k ? nombreTipo(k) : 'Sin tipo') + ' <small>' + cuenta[k] + '</small></button>';
    }).join('');
  }

  function textoSecciones(ev) { return (ev.seccion || []).filter(Boolean).map(nombreSeccion).join(' '); }

  function visibles() {
    var q = quitarTildes(($('ev-buscar').value || '').trim());
    var mesHoy = HOY.slice(0, 7);
    return EVENTOS.filter(function (ev) {
      var i = info(ev);
      if (FTIPO !== null && (ev.tipo || '') !== FTIPO) return false;
      if (FCIFRA === 'proximos' && i.pasado) return false;
      if (FCIFRA === 'mes' && i.mes !== mesHoy) return false;
      if (FCIFRA === 'abiertos' && (i.pasado || !ev.inscripcion_abierta)) return false;
      if (FCIFRA === 'pasados' && !i.pasado) return false;
      if (q && quitarTildes((ev.titulo || '') + ' ' + (ev.lugar || '') + ' ' + nombreTipo(ev.tipo) + ' ' + textoSecciones(ev)).indexOf(q) === -1) return false;
      return true;
    });
  }

  function seccionesPills(ev) {
    var secs = (ev.seccion || []).filter(Boolean);
    if (!secs.length) return '<span class="ev-pill todos" title="Sin sección: en el calendario sale a todo el club">Todo el club</span>';
    return secs.map(function (s) { return '<span class="ev-pill sec">' + esc(nombreSeccion(s)) + '</span>'; }).join('');
  }

  function filaHtml(ev) {
    var i = info(ev);
    var sub = [];
    if (ev.lugar) sub.push(ICO_LUGAR + esc(ev.lugar));
    if (i.hora) sub.push(esc(i.hora));
    else if (ev.dia_entero) sub.push('todo el día');
    if (i.varios) sub.push('hasta el ' + esc(fechaCortaDia(i.df)));
    if (i.enCurso && i.varios) sub.push('<span class="encurso">en marcha</span>');
    var pills = (ev.tipo ? '<span class="ev-pill tipo"><span class="pt"></span>' + esc(nombreTipo(ev.tipo)) + '</span>' : '') +
      seccionesPills(ev) +
      (ev.inscripcion_abierta && !i.pasado ? '<span class="ev-pill abierta"><span class="pt"></span>Inscripción abierta</span>' : '') +
      (ev.url ? '<a class="ev-enlace" href="' + esc(ev.url) + '" target="_blank" rel="noopener" title="Abrir la web del evento">' + ICO_ENLACE + 'Enlace</a>' : '') +
      (ev.cartel_url ? '<a class="ev-enlace" href="' + esc(ev.cartel_url) + '" target="_blank" rel="noopener" title="Ver el cartel">' + ICO_CARTEL + 'Cartel</a>' : '');
    return '<div class="ev-fila ' + colorClase(ev) + (i.pasado ? ' pasada' : '') + '" tabindex="0" data-id="' + esc(ev.id) + '" aria-label="' + esc(ev.titulo) + ': ver ficha, editar o borrar">' +
      '<span class="ev-dia">' + diaHtml(ev.fecha_inicio) + '</span>' +
      '<span class="ev-nom"><b>' + esc(ev.titulo) + '</b>' + (sub.length ? '<small>' + sub.join(' · ') + '</small>' : '') + '</span>' +
      '<span class="ev-pills">' + pills + '</span>' +
      '<span class="ev-flecha" aria-hidden="true">›</span>' +
    '</div>';
  }

  function pintarLista() {
    if (LISTA_ROTA) return;
    Array.prototype.forEach.call(document.querySelectorAll('#ev-chips button'), function (x) {
      var v = x.getAttribute('data-tipo');
      var on = (v === '*') ? FTIPO === null : FTIPO === v;
      x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.ev-cifra[data-f]'), function (c) {
      c.classList.toggle('on', !!FCIFRA && c.getAttribute('data-f') === FCIFRA);
    });
    var cont = $('tabla-eventos');
    if (!EVENTOS.length) {
      $('ev-cuenta').textContent = '';
      cont.innerHTML = ADM.vacio('Todavía no hay ningún evento',
        'Aquí van las competiciones, salidas y quedadas del club. En cuanto crees el primero, saldrá en el calendario de la web.',
        '<button type="button" class="ev-b prin" data-primero>+ Nuevo evento</button>',
        '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>');
      return;
    }
    var lista = visibles();
    var nPas = EVENTOS.filter(function (ev) { return info(ev).pasado; }).length;
    $('ev-cuenta').textContent = lista.length === EVENTOS.length
      ? plural(EVENTOS.length, 'evento', 'eventos') + (nPas ? ' · ' + nPas + ' ya ' + (nPas === 1 ? 'celebrado' : 'celebrados') : '')
      : lista.length + ' de ' + plural(EVENTOS.length, 'evento', 'eventos');
    if (!lista.length) {
      cont.innerHTML = '<div class="ev-vacio"><b>Ningún evento con este filtro</b>Prueba con otra palabra o quita el filtro.<br><button type="button" data-limpiar>Ver todos</button></div>';
      return;
    }
    /* Por meses, en el orden en que llegan: primero los próximos y luego los
       ya celebrados (el más reciente primero). */
    var grupos = [], porClave = {};
    lista.forEach(function (ev) {
      var i = info(ev), clave, titulo;
      if (!i.di) { clave = 'sin'; titulo = 'Sin fecha'; }
      else {
        var mes = MESES[i.di.getMonth()];
        titulo = mes.charAt(0).toUpperCase() + mes.slice(1) + ' ' + i.di.getFullYear() + (i.pasado ? ' · ya celebrados' : '');
        clave = (i.pasado ? 'p' : 'f') + i.mes;
      }
      if (!porClave[clave]) { porClave[clave] = { titulo: titulo, pasado: i.pasado, filas: [] }; grupos.push(porClave[clave]); }
      porClave[clave].filas.push(ev);
    });
    cont.innerHTML =
      '<div class="ev-cab-cols" aria-hidden="true"><span>Fecha</span><span>Evento</span><span>Tipo, secciones y enlaces</span><span></span></div>' +
      grupos.map(function (g) {
        return '<h2 class="ev-mes' + (g.pasado ? ' pasado' : '') + '">' + esc(g.titulo) + ' <span>' + g.filas.length + '</span></h2>' +
          '<div class="ev-lista">' + g.filas.map(filaHtml).join('') + '</div>';
      }).join('');
  }

  $('ev-buscar').addEventListener('input', pintarLista);
  $('ev').addEventListener('click', function (e) {
    var f = e.target.closest('.ev-cifra[data-f]');
    if (f) {
      var v = f.getAttribute('data-f') || '';
      /* Pulsar la cifra que ya filtra la quita. */
      FCIFRA = (FCIFRA === v) ? '' : v;
      pintarLista(); return;
    }
    var ch = e.target.closest('#ev-chips button[data-tipo]');
    if (ch) { var t = ch.getAttribute('data-tipo'); FTIPO = (t === '*') ? null : t; pintarLista(); return; }
    if (e.target.closest('[data-limpiar]')) { FCIFRA = ''; FTIPO = null; $('ev-buscar').value = ''; pintarLista(); $('ev-buscar').focus(); return; }
    if (e.target.closest('[data-primero]')) { abrirForm(); return; }
    if (e.target.closest('a')) return;          // el enlace y el cartel se abren, no abren la hoja
    var fila = e.target.closest('.ev-fila[data-id]');
    if (fila) verEvento(fila.getAttribute('data-id'), fila);
  });
  $('ev').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var fila = e.target.closest && e.target.closest('.ev-fila[data-id]');
    if (!fila || e.target !== fila) return;
    e.preventDefault(); verEvento(fila.getAttribute('data-id'), fila);
  });

  cargarSecciones();   /* se pide al abrir la pantalla, así el formulario ya la tiene */

  // =========================================================
  // HOJA DE UN EVENTO (ficha, editar, borrar)
  // =========================================================
  var HOJA_ID = null, HOJA_EV = null, focoPrevio = null, TURNO = 0;
  function hojaAbierta() { return $('ev-hoja').classList.contains('ver'); }
  function abrirCapa(desde) {
    focoPrevio = desde || document.activeElement;
    $('ev-velo').classList.add('ver'); $('ev-hoja').classList.add('ver');
    $('ev-hoja').scrollTop = 0;
    setTimeout(function () { $('ev-h-cerrar').focus(); }, 60);
  }
  function cerrarHoja() {
    if (!hojaAbierta()) return;
    $('ev-velo').classList.remove('ver'); $('ev-hoja').classList.remove('ver');
    HOJA_ID = null; HOJA_EV = null; TURNO++;
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) focoPrevio.focus();
  }
  $('ev-velo').addEventListener('click', cerrarHoja);
  $('ev-h-cerrar').addEventListener('click', cerrarHoja);

  function pintarHoja(ev) {
    var i = info(ev);
    $('ev-h-cab').className = 'ev-hoja-cab ' + colorClase(ev);
    $('ev-h-dia').innerHTML = diaHtml(ev.fecha_inicio, true);
    $('ev-h-tit').textContent = ev.titulo || 'Evento';
    $('ev-h-sub').textContent = [ev.tipo ? nombreTipo(ev.tipo) : '', ev.lugar || '', i.pasado ? 'ya celebrado' : (i.enCurso && i.varios ? 'en marcha' : '')]
      .filter(Boolean).join(' · ');
    function par(k, v, cls) { return '<div' + (cls ? ' class="' + cls + '"' : '') + '><span>' + esc(k) + '</span><b>' + v + '</b></div>'; }
    var cuando = esc(fechaLarga(i.di)) + (i.hora ? ' · ' + esc(i.hora) : (ev.dia_entero ? '<small>todo el día</small>' : ''));
    var hFin = i.df ? horaDe(ev.fecha_fin, ev.dia_entero) : null;
    var secs = (ev.seccion || []).filter(Boolean);
    $('ev-h-datos').innerHTML = '<div class="ev-caja">' +
      par(i.df ? 'Empieza' : 'Cuándo', cuando) +
      (i.df ? par('Termina', esc(fechaLarga(i.df)) + (hFin ? ' · ' + esc(hFin) : '')) : '') +
      par('Lugar', ev.lugar ? esc(ev.lugar) : '<small>sin lugar</small>') +
      par('Tipo', ev.tipo ? esc(nombreTipo(ev.tipo)) : '<small>sin tipo</small>') +
      par('Secciones', secs.length ? secs.map(function (s) { return '<span class="ev-pill sec">' + esc(nombreSeccion(s)) + '</span>'; }).join('')
                                   : 'Todo el club<small>sin sección: en el calendario sale a todos</small>') +
      par('Inscripción', ev.inscripcion_abierta ? '<span class="ev-pill abierta"><span class="pt"></span>Abierta</span>' : '<span class="ev-pill cerrada">Cerrada</span>') +
      par('Enlace', ev.url ? '<a href="' + esc(ev.url) + '" target="_blank" rel="noopener">Abrir la web</a>' : '<small>sin enlace</small>') +
      par('Cartel', ev.cartel_url ? '<a class="ev-cartel" href="' + esc(ev.cartel_url) + '" target="_blank" rel="noopener" title="Ver el cartel en grande"><img src="' + esc(ev.cartel_url) + '" alt="Cartel de ' + esc(ev.titulo || 'el evento') + '"></a>' : '<small>sin cartel</small>', ev.cartel_url ? 'alto' : '') +
      '</div>' +
      (ev.descripcion ? '<div class="ev-notas">' + esc(ev.descripcion) + '</div>' : '');
  }

  /* Al abrir se pinta con lo que ya hay en la lista; cuando llega la ficha
     entera (con la descripción), se repinta con ella. */
  async function verEvento(id, desde) {
    var turno = ++TURNO;
    HOJA_ID = id;
    if (!hojaAbierta()) abrirCapa(desde);
    var ya = EVENTOS.filter(function (x) { return x.id === id; })[0];
    if (ya) { HOJA_EV = ya; pintarHoja(ya); }
    else { $('ev-h-tit').textContent = 'Evento'; $('ev-h-sub').textContent = ''; $('ev-h-dia').innerHTML = ''; $('ev-h-datos').innerHTML = ADM.esqueleto(3); }
    var r = await sb.from('eventos').select('*').eq('id', id).single();
    if (turno !== TURNO) return;
    if (r.error) {
      if (!ya) $('ev-h-datos').innerHTML = ADM.error(r.error.message, function () { verEvento(id); });
      return;
    }
    HOJA_EV = r.data;
    pintarHoja(r.data);
  }

  // Editar y borrar, desde la hoja
  $('ev-h-acc').addEventListener('click', async function (e) {
    var bt = e.target.closest('button[data-hoja]');
    if (!bt || !HOJA_ID) return;
    var id = HOJA_ID;
    if (bt.getAttribute('data-hoja') === 'editar') {
      var r = await sb.from('eventos').select('*').eq('id', id).single();
      // Antes, si fallaba, no pasaba nada al pulsar «Editar» y parecía que la página se había colgado.
      if (r.error) { apoToast('No hemos podido abrir el evento: ' + r.error.message, 'error'); return; }
      abrirForm(r.data);
      return;
    }
    var ev = (HOJA_EV && HOJA_EV.id === id) ? HOJA_EV : (EVENTOS.filter(function (x) { return x.id === id; })[0] || {});
    if (!await apoConfirm({ texto: '¿Borrar el evento "' + (ev.titulo || '') + '"? No se puede deshacer.', peligro: true })) return;
    var d = await sb.from('eventos').delete().eq('id', id);
    if (d.error) { apoToast('No se pudo borrar: ' + d.error.message, 'error'); return; }
    cerrarHoja();
    cargarEventos();
  });

  // =========================================================
  // FORMULARIO (crear / editar)
  // =========================================================
  function abrirForm(n) {
    n = n || {};
    $('form-titulo').textContent = n.id ? 'Editar evento' : 'Nuevo evento';
    $('e-id').value = n.id || '';
    $('e-titulo').value = n.titulo || '';
    pintarTipos(n.tipo || '');
    $('e-lugar').value = n.lugar || '';
    $('e-inicio').value = paraInput(n.fecha_inicio);
    $('e-fin').value = paraInput(n.fecha_fin);
    $('e-dia-entero').checked = n.id ? !!n.dia_entero : false;
    $('e-enlace').value = n.url || '';
    $('e-cartel-url').value = n.cartel_url || '';
    pintarCartelPrev(n.cartel_url || '');
    modoDiaEntero($('e-dia-entero').checked);
    /* La ficha se abre al momento con lo que el evento ya tiene, y cuando
       llega la lista de la base se repinta sin perder lo tocado mientras. */
    var suyas = Array.isArray(n.seccion) ? n.seccion.slice()
              : (n.seccion ? String(n.seccion).split(',').map(function (s) { return s.trim(); }).filter(Boolean) : []);
    pintarSecciones(suyas);
    cargarSecciones().then(function () { pintarSecciones(seccionesMarcadas()); });
    $('sec-otra-caja').classList.add('oculto');
    $('sec-otra-abrir').classList.remove('oculto');
    $('sec-otra-txt').value = '';
    $('e-descripcion').value = n.descripcion || '';
    $('e-inscripcion').checked = n.id ? !!n.inscripcion_abierta : false;
    $('msg-form').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
  }
  function cerrarForm() { $('panel-form').classList.add('oculto'); }
  /* «Todo el día»: cambia los dos campos de fecha entre datetime-local (con
     hora) y date (solo día), conservando la parte de fecha al alternar. */
  function modoDiaEntero(on) {
    ['e-inicio', 'e-fin'].forEach(function (idd) {
      var inp = $(idd); if (!inp) return;
      var v = inp.value;
      inp.type = on ? 'date' : 'datetime-local';
      if (v) inp.value = on ? v.slice(0, 10) : (v.length === 10 ? v + 'T00:00' : v);
    });
  }
  $('e-dia-entero').addEventListener('change', function () { modoDiaEntero(this.checked); });

  /* Cartel del evento: se sube al bucket público `imagenes` (carpeta carteles)
     nada más elegir el archivo, y su dirección pública se guarda en
     `eventos.cartel_url`. El calendario la muestra en la ficha del evento. */
  function pintarCartelPrev(url) {
    var box = $('e-cartel-prev'), img = $('e-cartel-img');
    if (url) { img.src = url; box.classList.remove('oculto'); }
    else { img.removeAttribute('src'); box.classList.add('oculto'); }
  }
  $('e-cartel-file').addEventListener('change', async function () {
    var file = this.files && this.files[0]; if (!file) return;
    $('msg-form').textContent = 'Subiendo el cartel…'; $('msg-form').className = 'msg';
    var clean = file.name.toLowerCase().replace(/[^\w.\-]+/g, '-').replace(/-+/g, '-');
    var ruta = 'carteles/' + Date.now() + '-' + clean;
    var up = await sb.storage.from('imagenes').upload(ruta, file, { cacheControl: '3600', upsert: false });
    if (up.error) { $('msg-form').textContent = 'No se pudo subir el cartel: ' + up.error.message; $('msg-form').className = 'msg error'; this.value = ''; return; }
    var url = sb.storage.from('imagenes').getPublicUrl(ruta).data.publicUrl;
    $('e-cartel-url').value = url; pintarCartelPrev(url);
    $('msg-form').textContent = 'Cartel subido ✓'; $('msg-form').className = 'msg ok';
    this.value = '';
  });
  $('e-cartel-quitar').addEventListener('click', function () { $('e-cartel-url').value = ''; pintarCartelPrev(''); });

  $('nuevo-evento').addEventListener('click', function () { abrirForm(); });
  $('cancelar').addEventListener('click', cerrarForm);
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) cerrarForm(); });
  /* Escape cierra primero lo de arriba (el formulario) y luego la hoja. El
     Escape que cierra un «¿seguro?» no cierra también lo de debajo. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    if (!$('panel-form').classList.contains('oculto')) { cerrarForm(); return; }
    cerrarHoja();
  });

  $('form-evento').addEventListener('submit', async function (e) {
    e.preventDefault();
    var seccionArr = seccionesMarcadas();
    /* Día entero: los inputs son de tipo `date` (sin hora), así que su valor
       viene «2026-09-20». Se le pega la medianoche para que sea una fecha-hora
       válida, y `dia_entero` avisa a la vista de que no pinte hora. */
    var diaEntero = $('e-dia-entero').checked;
    var ini = $('e-inicio').value || null;
    var fin = $('e-fin').value || null;
    if (diaEntero) {
      if (ini && ini.length === 10) ini = ini + 'T00:00';
      if (fin && fin.length === 10) fin = fin + 'T00:00';
    }
    var datos = {
      titulo: $('e-titulo').value.trim(),
      tipo: $('e-tipo').value || null,
      lugar: $('e-lugar').value.trim() || null,
      fecha_inicio: ini,
      fecha_fin: fin,
      dia_entero: diaEntero,
      url: $('e-enlace').value.trim() || null,
      cartel_url: $('e-cartel-url').value || null,
      seccion: seccionArr.length ? seccionArr : null,
      descripcion: $('e-descripcion').value.trim() || null,
      inscripcion_abierta: $('e-inscripcion').checked
    };
    $('msg-form').textContent = 'Guardando…'; $('msg-form').className = 'msg';
    var id = $('e-id').value, r;
    if (id) r = await sb.from('eventos').update(datos).eq('id', id);
    else r = await sb.from('eventos').insert(datos);
    if (r.error) { $('msg-form').textContent = 'Error: ' + r.error.message; $('msg-form').className = 'msg error'; return; }
    $('msg-form').textContent = 'Guardado ✓'; $('msg-form').className = 'msg ok';
    cerrarForm();
    await cargarEventos();
    /* Si se ha editado desde su hoja, la hoja se pone al día. */
    if (id && hojaAbierta() && HOJA_ID === id) verEvento(id);
  });

  cargarEventos();
});
</script>

</body>
</html>
