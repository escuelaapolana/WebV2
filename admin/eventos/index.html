<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--linea-borde); border-radius: 10px;
    font-family: var(--fuente-texto); font-size: 15px; background: #fff; color: var(--navy);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul); border-color: var(--azul); }
  textarea { min-height: 100px; resize: vertical; }
  .fila-check { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .fila-check input { width: auto; }
  .fila-check label { margin: 0; }

  .msg { margin-top: 12px; font-size: 14px; }
  .msg.error { color: #b3261e; }
  .msg.ok { color: #1e7a3d; }

  .panel { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,30px); box-shadow: var(--sombra-suave); margin-bottom: 22px; }
  .panel h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 24px; color: var(--navy); margin-bottom: 4px; }
  .panel .intro { margin-bottom: 10px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); font-size: 14px; vertical-align: top; }
  th { font-family: var(--fuente-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-tenue); }
  .acciones-fila { display: flex; gap: 8px; white-space: nowrap; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }

  .btn { cursor: pointer; }
  .btn--peligro { background: transparent; border: 1px solid #e0b4b0; color: #b3261e; padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .btn--peligro:hover { background: #fbeceb; }
  .btn--mini { padding: 8px 14px; font-size: 14px; }
  .oculto { display: none !important; }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">

    <!-- ===== LISTA DE EVENTOS ===== -->
    <div class="panel">
      <h2>Eventos</h2>
      <p class="intro">Competiciones, salidas y quedadas del club. Alimentan el calendario de la web.</p>
      <div style="margin-bottom:14px;"><button class="btn btn--primario btn--mini" id="nuevo-evento">+ Nuevo evento</button></div>
      <div style="overflow-x:auto;">
        <table id="tabla-eventos">
          <thead><tr><th>Fecha</th><th>Título</th><th>Tipo</th><th>Lugar</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- ===== FORMULARIO (oculto hasta crear/editar) ===== -->
    <div class="panel oculto" id="panel-form">
      <h2 id="form-titulo">Nuevo evento</h2>
      <form id="form-evento">
        <input type="hidden" id="e-id">
        <label for="e-titulo">Título</label>
        <input type="text" id="e-titulo" required>
        <div class="grid2">
          <div>
            <label for="e-tipo">Tipo</label>
            <input type="text" id="e-tipo" placeholder="competicion, salida, quedada…">
          </div>
          <div>
            <label for="e-lugar">Lugar</label>
            <input type="text" id="e-lugar" placeholder="Ciudad / instalación">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="e-inicio">Fecha inicio</label>
            <input type="datetime-local" id="e-inicio" required>
          </div>
          <div>
            <label for="e-fin">Fecha fin (opcional)</label>
            <input type="datetime-local" id="e-fin">
          </div>
        </div>
        <label for="e-seccion">Secciones (separadas por comas)</label>
        <input type="text" id="e-seccion" placeholder="pista, running">
        <label for="e-descripcion">Descripción</label>
        <textarea id="e-descripcion"></textarea>
        <div class="fila-check">
          <input type="checkbox" id="e-inscripcion">
          <label for="e-inscripcion">Inscripción abierta</label>
        </div>
        <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
          <button class="btn btn--primario btn--mini" type="submit">Guardar</button>
          <button class="btn btn--fantasma btn--mini" type="button" id="cancelar">Cancelar</button>
          <span class="msg" id="msg-form"></span>
        </div>
      </form>
    </div>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  // Muestra sólo la parte de fecha (YYYY-MM-DD) de un timestamptz
  function soloFecha(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    if (isNaN(d)) return String(ts).slice(0, 10);
    var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), da = ('0' + d.getDate()).slice(-2);
    return da + '/' + m + '/' + y;
  }

  // timestamptz -> value para input datetime-local (YYYY-MM-DDTHH:mm) en hora local
  function paraInput(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d)) return '';
    var y = d.getFullYear(), mo = ('0' + (d.getMonth() + 1)).slice(-2), da = ('0' + d.getDate()).slice(-2);
    var h = ('0' + d.getHours()).slice(-2), mi = ('0' + d.getMinutes()).slice(-2);
    return y + '-' + mo + '-' + da + 'T' + h + ':' + mi;
  }

  // --- Listar ---
  async function cargarEventos() {
    var tb = $('tabla-eventos').querySelector('tbody');
    tb.innerHTML = '<tr><td colspan="5">Cargando…</td></tr>';
    var r = await sb.from('eventos')
      .select('id,titulo,tipo,fecha_inicio,lugar')
      .order('fecha_inicio', { ascending: true });
    if (r.error) { tb.innerHTML = '<tr><td colspan="5">Error: ' + esc(r.error.message) + '</td></tr>'; return; }
    if (!r.data.length) { tb.innerHTML = '<tr><td colspan="5">No hay eventos todavía.</td></tr>'; return; }
    tb.innerHTML = r.data.map(function (n) {
      return '<tr>' +
        '<td>' + esc(soloFecha(n.fecha_inicio)) + '</td>' +
        '<td>' + esc(n.titulo) + '</td>' +
        '<td>' + esc(n.tipo || '—') + '</td>' +
        '<td>' + esc(n.lugar || '—') + '</td>' +
        '<td class="acciones-fila"><button class="btn btn--fantasma btn--mini" data-editar="' + n.id + '">Editar</button>' +
        '<button class="btn btn--peligro" data-borrar="' + n.id + '" data-tit="' + esc(n.titulo) + '">Borrar</button></td>' +
      '</tr>';
    }).join('');
  }

  // --- Crear/editar ---
  function abrirForm(n) {
    n = n || {};
    $('form-titulo').textContent = n.id ? 'Editar evento' : 'Nuevo evento';
    $('e-id').value = n.id || '';
    $('e-titulo').value = n.titulo || '';
    $('e-tipo').value = n.tipo || '';
    $('e-lugar').value = n.lugar || '';
    $('e-inicio').value = paraInput(n.fecha_inicio);
    $('e-fin').value = paraInput(n.fecha_fin);
    $('e-seccion').value = Array.isArray(n.seccion) ? n.seccion.join(', ') : (n.seccion || '');
    $('e-descripcion').value = n.descripcion || '';
    $('e-inscripcion').checked = n.id ? !!n.inscripcion_abierta : false;
    $('msg-form').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollIntoView({ behavior: 'smooth' });
  }
  $('nuevo-evento').addEventListener('click', function () { abrirForm(); });
  $('cancelar').addEventListener('click', function () { $('panel-form').classList.add('oculto'); });

  $('tabla-eventos').addEventListener('click', async function (e) {
    var ed = e.target.getAttribute('data-editar');
    var bo = e.target.getAttribute('data-borrar');
    if (ed) {
      var r = await sb.from('eventos').select('*').eq('id', ed).single();
      if (!r.error) abrirForm(r.data);
    }
    if (bo) {
      if (!confirm('¿Borrar el evento "' + e.target.getAttribute('data-tit') + '"? No se puede deshacer.')) return;
      var d = await sb.from('eventos').delete().eq('id', bo);
      if (d.error) { alert('No se pudo borrar: ' + d.error.message); return; }
      cargarEventos();
    }
  });

  $('form-evento').addEventListener('submit', async function (e) {
    e.preventDefault();
    var seccionArr = $('e-seccion').value.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; });
    var datos = {
      titulo: $('e-titulo').value.trim(),
      tipo: $('e-tipo').value.trim() || null,
      lugar: $('e-lugar').value.trim() || null,
      fecha_inicio: $('e-inicio').value || null,
      fecha_fin: $('e-fin').value || null,
      seccion: seccionArr.length ? seccionArr : null,
      descripcion: $('e-descripcion').value.trim() || null,
      inscripcion_abierta: $('e-inscripcion').checked
    };
    $('msg-form').textContent = 'Guardando…'; $('msg-form').className = 'msg';
    var id = $('e-id').value, r;
    if (id) r = await sb.from('eventos').update(datos).eq('id', id);
    else r = await sb.from('eventos').insert(datos);
    if (r.error) { $('msg-form').textContent = 'Error: ' + r.error.message; $('msg-form').className = 'msg error'; return; }
    $('msg-form').textContent = 'Guardado ✓'; $('msg-form').className = 'msg ok';
    $('panel-form').classList.add('oculto');
    cargarEventos();
  });

  cargarEventos();
});
</script>

</body>
</html>
