<style>
  /* ============================================================
     TRAINING CAMPS · concentraciones de equipos extranjeros (29-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios» y «Pruebas de pista»: cabecera grande,
     cifras que filtran, buscador + filtros, una tarjeta por expediente con
     la franja de su estado. Al tocar una se abre el expediente en un panel
     lateral (pantalla completa en el móvil) con sus pestañas: Resumen ·
     Presupuestos · Pagos · Seguimiento · Tareas · Archivos.
     Datos: tablas camp_* (mig 492-493) + Edge Function camp-gestion.
     Prefijo tc-.
     ============================================================ */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .tc-wrap { max-width: 1060px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .tc-wrap *, .tc-capa *, .tc-dlg * { box-sizing: border-box; }
  .tc-cab { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .tc-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); margin: 2px 0 4px; line-height: 1; }
  .tc-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 66ch; }
  .tc-cab a { color: var(--azul-oscuro,#2A5E8C); }
  .tc-cab-acc { display: flex; gap: 8px; flex-wrap: wrap; }

  .tc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 15px; border-radius: 12px;
    border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff; color: var(--navy,#26374B); font: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer; text-decoration: none; white-space: nowrap; }
  .tc-btn:hover { background: var(--crema,#FBF9F4); }
  .tc-btn:focus-visible, .tc-cifra:focus-visible, .tc-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .tc-btn.pri { background: var(--azul,#2F6FA8); border-color: var(--azul,#2F6FA8); color: #fff; }
  .tc-btn.pri:hover { background: var(--azul-hover,#1E4E78); }
  .tc-btn.ok { background: #2F7A45; border-color: #2F7A45; color: #fff; }
  .tc-btn.peligro { color: #8A3B32; border-color: #E8C9C2; }
  .tc-btn.mini { min-height: 34px; padding: 0 11px; font-size: 13px; border-radius: 10px; }
  .tc-btn:disabled { opacity: .55; cursor: not-allowed; }
  .tc-btn svg { width: 16px; height: 16px; flex: 0 0 16px; }

  /* Vistas */
  .tc-vistas { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    margin: 18px 0 4px; max-width: 100%; overflow-x: auto; scrollbar-width: none; width: max-content; }
  .tc-vistas::-webkit-scrollbar { display: none; }
  .tc-vistas button { min-height: 38px; padding: 0 15px; border: 0; border-radius: 999px; background: none; font: inherit; font-weight: 700; font-size: 14px;
    color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .tc-vistas button.on { background: var(--navy,#26374B); color: #fff; }

  /* Cifras */
  .tc-cifras { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin: 16px 0 6px; }
  .tc-cifra { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: #fff;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .tc-cifra b { display: block; font-family: var(--fuente-dato,'JetBrains Mono',monospace); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .tc-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .tc-cifra.aviso { background: #FBF1DE; border-color: #E9CE9A; } .tc-cifra.aviso b, .tc-cifra.aviso span { color: #8A5307; }
  .tc-cifra.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  @media (max-width: 760px) { .tc-cifras { grid-template-columns: repeat(2, minmax(0,1fr)); } .tc-cifra b { font-size: 21px; } }

  /* Filtros */
  .tc-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 4px; }
  .tc-filtros input, .tc-filtros select, .tc-campo input, .tc-campo select, .tc-campo textarea, .tc-lin input, .tc-lin select {
    min-height: 44px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px;
    background: #fff; color: var(--navy,#26374B); min-width: 0; }
  .tc-filtros input:focus, .tc-filtros select:focus, .tc-campo :is(input,select,textarea):focus, .tc-lin :is(input,select):focus {
    outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .tc-filtros .q { flex: 1 1 240px; }
  .tc-filtros .f { flex: 0 1 auto; }
  .tc-filtros label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--texto-suave,#6E6656); }
  .tc-cuenta { display: block; font-size: 13px; color: var(--texto-suave,#6E6656); margin: 6px 2px 0; min-height: 20px; }
  @media (max-width: 620px) { .tc-filtros .f { flex: 1 1 calc(50% - 8px); } }

  /* Filas */
  .tc-lista { container: tc-lista / inline-size; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .tc-fila { display: grid; grid-template-columns: minmax(0,1.7fr) 170px minmax(0,1.1fr) 120px 14px; gap: 0 14px; align-items: center; background: #fff;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid #CFC6B4; border-radius: 14px; padding: 11px 14px 11px 12px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .tc-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .tc-fila.g-nueva { border-left-color: #3B85C0; } .tc-fila.g-curso { border-left-color: #8C7BC2; } .tc-fila.g-enviado { border-left-color: #D9A441; }
  .tc-fila.g-cobro { border-left-color: #D97A41; } .tc-fila.g-ok { border-left-color: #6FAF7E; } .tc-fila.g-fin { background: #FCFBF8; }
  .tc-per { min-width: 0; }
  .tc-per b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .tc-per small { display: block; font-size: 13px; color: var(--texto-suave,#6E6656); margin-top: 2px; }
  .tc-per .cod { font-family: var(--fuente-dato,'JetBrains Mono',monospace); font-size: 12px; color: var(--azul,#2F6FA8); }
  .tc-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px 3px 9px; border-radius: 999px;
    background: #F0EBE0; color: #6E6656; white-space: nowrap; justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tc-pill .pt { width: 7px; height: 7px; border-radius: 999px; background: #9A927F; flex: 0 0 7px; }
  .tc-pill.g-nueva { background: #E6F0FB; color: #2F6FA8; } .tc-pill.g-nueva .pt { background: #3B85C0; }
  .tc-pill.g-curso { background: #EFEBF8; color: #5A4A93; } .tc-pill.g-curso .pt { background: #8C7BC2; }
  .tc-pill.g-enviado { background: #FBF1D9; color: #8A5307; } .tc-pill.g-enviado .pt { background: #D9A441; }
  .tc-pill.g-cobro { background: #FCE9DC; color: #96471A; } .tc-pill.g-cobro .pt { background: #D97A41; }
  .tc-pill.g-ok { background: #E7F3EA; color: #23603A; } .tc-pill.g-ok .pt { background: #3E7A34; }
  .tc-pill.p-pagado { background: #E7F3EA; color: #23603A; } .tc-pill.p-pendiente { background: #FBF1D9; color: #8A5307; }
  .tc-pill.p-vencido { background: #FBE6E2; color: #8A3B32; } .tc-pill.p-anulado { background: #F0EBE0; color: #8A816E; text-decoration: line-through; }
  .tc-fechas { font-size: 13.5px; min-width: 0; }
  .tc-fechas b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-fechas small { color: var(--texto-suave,#6E6656); font-size: 12.5px; }
  .tc-din { text-align: right; font-family: var(--fuente-dato,'JetBrains Mono',monospace); font-size: 13px; line-height: 1.35; }
  .tc-din small { display: block; font-family: var(--fuente-texto); color: var(--texto-suave,#6E6656); font-size: 12px; }
  .tc-flecha { color: #B5AC99; font-size: 20px; text-align: right; }
  .tc-marca { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px;
    border-radius: 999px; background: #F0EBE0; color: #8A816E; vertical-align: 2px; }
  .tc-marca.tarea { background: #FBE6E2; color: #8A3B32; }
  @container tc-lista (max-width: 680px) {
    .tc-fila { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 12px; }
    .tc-per { flex: 1 1 0; order: 0; } .tc-flecha { order: 1; }
    .tc-fila::after { content: ""; order: 2; flex-basis: 100%; height: 0; }
    .tc-pill { order: 3; } .tc-fechas { order: 4; flex: 1 1 auto; } .tc-din { order: 5; margin-left: auto; }
  }
  .tc-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE);
    border-radius: 14px; margin-top: 10px; line-height: 1.5; }
  .tc-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }

  /* Tarjetas genéricas (Próximos, Ajustes, bloques del expediente) */
  .tc-tarj { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; overflow: hidden; margin-top: 12px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .tc-tarj > h3 { margin: 0; padding: 11px 16px; background: var(--crema-banda,#F1EADC); font-size: 12.5px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; color: var(--texto-suave,#6E6656); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tc-tarj > h3 .tc-btn { text-transform: none; letter-spacing: 0; }
  .tc-tarj .cuerpo { padding: 14px 16px; }
  .tc-aviso { background: var(--aviso-fondo,#FDF5DF); border: 1px solid var(--aviso-borde,#EBDCAE); color: var(--aviso-texto,#4A4335); border-radius: 12px;
    padding: 11px 14px; font-size: 14px; line-height: 1.5; margin-top: 12px; }
  .tc-aviso b { color: var(--aviso-titulo,#7A6A2B); }
  .tc-aviso.azul { background: #EAF2F9; border-color: #CFE2F1; color: #1E4E78; }
  .tc-aviso.azul b { color: #1E4E78; }
  .tc-aviso.verde { background: #EDF5EE; border-color: #CBE0CE; color: #23603A; }
  .tc-aviso.verde b { color: #23603A; }

  /* Próximos */
  .tc-prox { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 10px; }
  .tc-prox .tc-tarj { margin: 0; cursor: pointer; }
  .tc-prox .cuenta-atras { font-family: var(--fuente-dato); font-size: 28px; font-weight: 700; line-height: 1; }
  .tc-prox .cuenta-atras small { font-family: var(--fuente-texto); font-size: 13px; font-weight: 600; color: var(--texto-suave,#6E6656); margin-left: 6px; }
  .tc-barra { height: 8px; border-radius: 99px; background: #EFE9DC; overflow: hidden; margin: 10px 0 4px; }
  .tc-barra i { display: block; height: 100%; background: #3E7A34; border-radius: 99px; }

  /* Calendario */
  .tc-cal-cab { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  .tc-cal-cab h2 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; text-transform: capitalize; min-width: 180px; }
  .tc-cal-ley { display: flex; gap: 14px; font-size: 13px; color: var(--texto-suave,#6E6656); margin-left: auto; flex-wrap: wrap; }
  .tc-cal-ley i { display: inline-block; width: 22px; height: 10px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }
  .tc-cal { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; overflow: hidden; }
  .tc-cal-dias { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--crema-banda,#F1EADC); font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .05em; color: var(--texto-suave,#6E6656); }
  .tc-cal-dias span { padding: 8px 10px; }
  .tc-sem { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: min-content; grid-auto-flow: row dense; min-height: 96px;
    border-top: 1px solid #EFE9DA; position: relative; padding-bottom: 6px; }
  .tc-sem .dia { grid-row: 1; padding: 6px 10px 2px; font-size: 13px; font-family: var(--fuente-dato); color: var(--texto-suave,#6E6656);
    border-left: 1px solid #F3EEE3; }
  .tc-sem .dia:first-child { border-left: 0; }
  .tc-sem .dia.fuera { color: #C9C0AE; } .tc-sem .dia.hoy { color: #fff; }
  .tc-sem .dia.hoy span { background: var(--azul,#2F6FA8); border-radius: 99px; padding: 1px 7px; }
  .tc-bar { margin: 2px 3px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; border: 0; text-align: left; font-family: inherit; min-height: 22px; }
  .tc-bar.conf { background: #3E7A34; color: #fff; }
  .tc-bar.prev { background: #FBF1D9; color: #8A5307; border: 1px dashed #D9A441; }
  .tc-bar.fin { background: #EFE9DC; color: #8A816E; }
  .tc-cal-movil { display: none; }
  @media (max-width: 640px) { .tc-cal { display: none; } .tc-cal-movil { display: block; } }

  /* Ajustes */
  .tc-rejilla { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 14px; }
  .tc-rejilla .ancho { grid-column: 1 / -1; }
  @media (max-width: 620px) { .tc-rejilla { grid-template-columns: 1fr; } }
  .tc-campo { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 700; color: var(--texto-suave,#6E6656); min-width: 0; }
  .tc-campo small { font-weight: 400; font-size: 12.5px; }
  .tc-campo textarea { min-height: 90px; padding: 10px 12px; line-height: 1.45; resize: vertical; }
  .tc-campo textarea.legal { min-height: 380px; font-family: var(--fuente-dato); font-size: 13px; }
  .tc-campo .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tc-chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--navy,#26374B); font-weight: 600; line-height: 1.4; }
  .tc-chk input { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 20px; accent-color: var(--azul,#2F6FA8); }
  .tc-gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tc-gal figure { margin: 0; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 12px; overflow: hidden; background: #FBF9F4; }
  .tc-gal figure.oculta { opacity: .55; }
  .tc-gal .med { aspect-ratio: 16/10; background: #EFE9DC center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: #8A816E; font-weight: 700; font-size: 13px; }
  .tc-gal figcaption { padding: 8px 10px; display: grid; gap: 6px; }
  .tc-gal figcaption input { min-height: 36px; font-size: 13.5px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 9px; padding: 0 9px; font: inherit; }
  .tc-gal .fila-acc { display: flex; gap: 6px; flex-wrap: wrap; }
  .tc-prev-legal { border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 12px; padding: 4px 18px 14px; max-height: 460px; overflow: auto; font-size: 14px; line-height: 1.55; color: var(--texto,#4A4437); }
  .tc-prev-legal h4 { font-size: 15px; color: var(--navy,#26374B); margin: 16px 0 6px; }
  .tc-prev-legal ul { padding-left: 20px; margin: 6px 0; }

  /* ===== Panel del expediente ===== */
  .tc-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .tc-velo.ver { opacity: 1; pointer-events: auto; }
  .tc-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100%); z-index: 9001; background: var(--crema,#FBF9F4); color: var(--navy,#26374B);
    transform: translateX(102%); transition: transform .25s var(--ease-panel, ease); display: flex; flex-direction: column; visibility: hidden;
    box-shadow: -12px 0 40px rgba(20,30,45,.25); }
  .tc-panel.ver { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .tc-panel, .tc-velo, .tc-fila { transition: none; } }
  .tc-p-cab { background: #fff; border-bottom: 1px solid var(--linea-marcada,#E4DCCB); padding: 14px clamp(14px,3vw,24px) 0; }
  .tc-p-top { display: flex; gap: 12px; align-items: flex-start; }
  .tc-p-top > div { flex: 1; min-width: 0; }
  .tc-p-top h2 { margin: 2px 0 2px; font-family: var(--fuente-titulo); font-size: clamp(20px,4vw,26px); line-height: 1.12; overflow-wrap: anywhere; }
  .tc-p-top .sub { font-size: 13.5px; color: var(--texto-suave,#6E6656); }
  .tc-p-top .cod { font-family: var(--fuente-dato); font-size: 12.5px; color: var(--azul,#2F6FA8); font-weight: 700; }
  .tc-cerrar { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 22px; line-height: 1; cursor: pointer; }
  .tc-p-estado { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }
  .tc-p-estado select { min-height: 38px; border-radius: 10px; border: 1px solid var(--linea-marcada,#E4DCCB); font: inherit; font-weight: 700; font-size: 14px;
    padding: 0 10px; background: #fff; color: var(--navy,#26374B); max-width: 100%; }
  .tc-tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .tc-tabs::-webkit-scrollbar { display: none; }
  .tc-tabs button { border: 0; background: none; font: inherit; font-weight: 700; font-size: 14px; color: var(--texto-suave,#6E6656); padding: 10px 12px 11px;
    border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  .tc-tabs button.on { color: var(--navy,#26374B); border-bottom-color: var(--azul,#2F6FA8); }
  .tc-tabs button .n { display: inline-block; min-width: 19px; padding: 0 5px; border-radius: 99px; background: #F0EBE0; font-size: 11.5px; margin-left: 4px; }
  .tc-tabs button .n.rojo { background: #FBE6E2; color: #8A3B32; }
  .tc-p-cuerpo { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 4px clamp(14px,3vw,24px) 40px; }
  .tc-datos { margin: 0; }
  .tc-datos div { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; }
  .tc-datos div:last-child { border-bottom: 0; }
  .tc-datos dt { color: var(--texto-suave,#6E6656); }
  .tc-datos dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; white-space: pre-line; }
  @media (max-width: 560px) { .tc-datos div { grid-template-columns: 1fr; gap: 2px; } }
  .tc-acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  /* Presupuestos y pagos */
  .tc-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #EFE9DA; }

<script>
APOLANA_ADMIN.listo(function (sb) {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var URL_WEB = 'https://atletismoapolana.com/';

  /* ---------------- catálogos ---------------- */
  var ESTADOS = [
    ['nueva','Nueva solicitud'], ['pendiente_info','Pendiente de información'], ['disponibilidad','Estudiando disponibilidad'],
    ['preparando','Preparando presupuesto'], ['enviado','Presupuesto enviado'], ['pendiente_senal','Pendiente de señal'],

  var ESTXT = {}; ESTADOS.forEach(function (e) { ESTXT[e[0]] = e[1]; });
  var GRUPO = { nueva:'nueva', pendiente_info:'curso', disponibilidad:'curso', preparando:'curso', enviado:'enviado', pendiente_senal:'cobro',
    confirmada:'ok', pendiente_final:'cobro', pagada:'ok', en_curso:'ok', finalizada:'fin', cancelada:'fin' };
  var CONFIRMADOS = ['confirmada','pendiente_final','pagada','en_curso'];
  var ETQ = {
    modalidades: { sprints:'Velocidad', hurdles:'Vallas', middle:'Medio fondo', long:'Fondo', jumps:'Saltos', throws:'Lanzamientos', combined:'Combinadas', walk:'Marcha', trail:'Trail / montaña', other:'Otras' },
    dias: { mon:'Lun', tue:'Mar', wed:'Mié', thu:'Jue', fri:'Vie', sat:'Sáb', sun:'Dom' },
    horario: { morning:'Mañana (8:15–14:00)', afternoon:'Tarde (15:15–17:15)', evening:'Noche (18:30–21:45)' },
    instalaciones: { track:'Pista', throws:'Lanzamientos', jumps:'Saltos', gym:'Gimnasio / fuerza', other:'Otras' },
    idioma_com: { en:'Inglés', es:'Español', fr:'Francés', de:'Alemán', it:'Italiano', pt:'Portugués', nl:'Neerlandés', other:'Otro' },
    sino: { yes:'Sí', no:'No', unsure:'No lo sabe' },
    servicios: { transporte:'Transporte', alojamiento:'Alojamiento', comidas:'Comidas', fisio:'Fisioterapia', entrenadores:'Entrenadores',
      playa_montana:'Playa / montaña', actividades:'Actividades complementarias', otros:'Otros servicios' },
    sub: { aeropuerto:'traslados aeropuerto', diario:'transporte diario', hotel:'hotel', apartments:'apartamentos', any:'sin preferencia',
      breakfast:'desayuno', lunch:'comida', dinner:'cena', beach:'playa', mountain:'montaña' },
    origen: { web:'Formulario web', concejalia:'Derivada por la Concejalía', correo:'Correo', telefono:'Teléfono', otro:'Otro' }
  };
  var CATS = [['instalaciones','Instalaciones / pista'], ['gimnasio','Gimnasio'], ['material','Material'], ['transporte','Transporte'],
    ['entrenadores','Entrenadores'], ['servicios','Servicios adicionales'], ['otros','Otros conceptos']];
  var CATXT = {}; CATS.forEach(function (c) { CATXT[c[0]] = c[1]; });
  var PRE_EST = { borrador:'Borrador', enviado:'Enviado', aceptado:'Aceptado', rechazado:'Rechazado', sustituido:'Sustituido', anulado:'Anulado' };
  var PRE_G = { borrador:'curso', enviado:'enviado', aceptado:'ok', rechazado:'fin', sustituido:'fin', anulado:'fin' };
  var REG_ICO = { nota:'✎', comunicacion:'✉', estado:'↻', sistema:'•', presupuesto:'€', pago:'✓', archivo:'📎', tarea:'☐' };
  var CANALES = { email:'Correo', whatsapp:'WhatsApp', telefono:'Teléfono', reunion:'Reunión', videollamada:'Videollamada', otro:'Otro' };

  /* ---------------- utilidades ---------------- */
  function hoy() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Madrid' }).format(new Date()); }
  function sumaDias(f, n) { var d = new Date(f + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function diasEntre(a, b) { return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 86400000); }
  var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fCorta(f) { if (!f) return ''; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(f); return m ? (+m[3]) + ' ' + MES[+m[2] - 1] + ' ' + m[1] : ''; }
  function fSinAnio(f) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(f || ''); return m ? (+m[3]) + ' ' + MES[+m[2] - 1] : ''; }
  function rango(a, b) { if (!a) return 'Sin fechas'; if (!b) return fCorta(a); return (a.slice(0, 4) === b.slice(0, 4) ? fSinAnio(a) : fCorta(a)) + ' – ' + fCorta(b); }
  function fHora(ts) { try { return new Date(ts).toLocaleString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function eur(n) { return (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function toast(m, t) { if (window.apoToast) apoToast(m, t || 'ok'); else alert(m); }
  function fallo(e) { toast(String((e && (e.message || e.mensaje)) || e || 'Error'), 'error'); }
  async function confirmar(o) { if (window.apoConfirm) return window.apoConfirm(o); return window.confirm((o.titulo || '') + '\n\n' + (o.texto || '')); }
  function waNum(tel) { var t = String(tel || '').replace(/[^\d+]/g, ''); if (t.charAt(0) === '+') t = t.slice(1); else if (t.slice(0, 2) === '00') t = t.slice(2); else if (t.length === 9) t = '34' + t; return t; }
  async function copiar(txt) { try { await navigator.clipboard.writeText(txt); toast('Enlace copiado'); } catch (e) { window.prompt('Copia el enlace:', txt); } }
  function lista(g, v) { return (v || []).map(function (x) { return ETQ[g][x] || x; }).join(', '); }
  function servTxt(o) {
    var p = [];
    if (o.aeropuerto) p.push(ETQ.sub.aeropuerto); if (o.diario) p.push(ETQ.sub.diario);
    if (o.tipo) p.push(ETQ.sub[o.tipo] || o.tipo); if (o.habitaciones) p.push(o.habitaciones);
    if (o.cuales && o.cuales.length) p.push(o.cuales.map(function (x) { return ETQ.sub[x] || x; }).join(' + '));
    if (o.cual && o.cual.length) p.push(o.cual.map(function (x) { return ETQ.sub[x] || x; }).join(' + '));
    if (o.dieta) p.push('dieta: ' + o.dieta); if (o.detalle) p.push(o.detalle);
    return p.join(' · ') || 'Sí';
  }
  async function gestion(accion, cuerpo) {
    var r = await sb.functions.invoke('camp-gestion', { body: Object.assign({ accion: accion }, cuerpo || {}) });
    if (r.error) { var m = ''; try { var j = await r.error.context.json(); m = j.mensaje || ''; } catch (e) {} throw new Error(m || 'No se ha podido hacer.'); }
    return r.data;
  }
  function abrirPdf(b64, nombre) {
    var bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    if (/iPhone|iPad|Android/i.test(navigator.userAgent)) a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  /* ---------------- diálogo con formulario ---------------- */
  function dialogo(o) {
    return new Promise(function (resolve) {
      var capa = document.createElement('div');
      capa.className = 'tc-dlg';
      capa.innerHTML = '<form novalidate role="dialog" aria-modal="true" aria-labelledby="tc-dlg-t"' + (o.ancho ? ' style="width:min(' + o.ancho + 'px,100%)"' : '') + '>' +
        '<h3 id="tc-dlg-t">' + esc(o.titulo) + '</h3>' + (o.html || '') + '<p class="err" role="alert" hidden></p>' +
        '<div class="bots"><button type="button" class="tc-btn" data-no>Cancelar</button>' +
        '<button type="submit" class="tc-btn ' + (o.peligro ? 'peligro' : 'pri') + '">' + esc(o.ok || 'Guardar') + '</button></div></form>';
      document.body.appendChild(capa);
      var f = capa.querySelector('form'), prev = document.activeElement;
      function cerrar(v) { document.removeEventListener('keydown', tecla, true); capa.remove(); if (prev && prev.focus) try { prev.focus(); } catch (e) {} resolve(v); }
      function tecla(ev) { if (ev.key === 'Escape') { ev.stopPropagation(); cerrar(null); } }
      document.addEventListener('keydown', tecla, true);
      capa.addEventListener('mousedown', function (ev) { if (ev.target === capa) cerrar(null); });
      f.querySelector('[data-no]').addEventListener('click', function () { cerrar(null); });
      if (o.alAbrir) o.alAbrir(f);
      f.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        var d = {};
        Array.prototype.forEach.call(f.elements, function (el) {
          if (!el.name) return;
          if (el.type === 'checkbox') d[el.name] = el.checked;
          else if (el.type === 'radio') { if (el.checked) d[el.name] = el.value; }
          else d[el.name] = el.value.trim();
        });
        var err = o.validar ? o.validar(d, f) : '';
        var caja = f.querySelector('.err');
        if (err) { caja.textContent = err; caja.hidden = false; return; }
        if (o.alEnviar) {
          var b = f.querySelector('[type=submit]'); b.disabled = true; var t = b.textContent; b.textContent = 'Un momento…';
          try { await o.alEnviar(d); } catch (e) { b.disabled = false; b.textContent = t; caja.textContent = (e && e.message) || 'No se ha podido.'; caja.hidden = false; return; }
        }
        cerrar(d);
      });
      setTimeout(function () { var p = f.querySelector('input:not([type=hidden]):not([type=checkbox]),textarea,select'); if (p) p.focus(); }, 40);
    });
  }
  function campo(label, inner, ayuda, clase) {
    return '<label class="tc-campo' + (clase ? ' ' + clase : '') + '">' + esc(label) + inner + (ayuda ? '<small>' + ayuda + '</small>' : '') + '</label>';
  }

  /* ---------------- estado ---------------- */
  var S = { sol: [], pre: [], pag: [], tar: [], cfg: null, cond: [], gal: [], vista: 'lista', cifra: 'activas', q: '', pais: '', estado: '', desde: '', hasta: '',
    prueba: false, mes: hoy().slice(0, 7), abierto: null, tab: 'resumen', reg: [], arch: [], editor: null };
  var qs = new URLSearchParams(location.search);
  if (['lista','calendario','proximos','ajustes'].indexOf(qs.get('v')) >= 0) S.vista = qs.get('v');

  async function cargar() {
    var rs = await Promise.all([
      sb.from('camp_solicitudes').select('*').order('creado_en', { ascending: false }),
      sb.from('camp_presupuestos').select('id,solicitud_id,version,numero,estado,idioma,total,senal,saldo,valido_hasta,saldo_vence,enviado_en,aceptado_en,aceptado_nombre,aceptado_por,token,titulo,creado_en').order('version'),
      sb.from('camp_pagos_v').select('*').order('creado_en'),
      sb.from('camp_tareas').select('*').order('vence', { nullsFirst: false }),
      sb.from('camp_config').select('*').eq('id', 1).maybeSingle()
    ]);
    var e = rs.filter(function (r) { return r.error; })[0];
    if (e) { $('tc').innerHTML = '<div class="tc-cab"><div><h1>Training Camps</h1></div></div>' + ADM.error(e.error.message, cargar); return false; }
    S.sol = rs[0].data || []; S.pre = rs[1].data || []; S.pag = rs[2].data || []; S.tar = rs[3].data || []; S.cfg = rs[4].data;
    return true;
  }
  function presDe(id) { return S.pre.filter(function (p) { return p.solicitud_id === id; }); }
  function aceptadoDe(id) { return presDe(id).filter(function (p) { return p.estado === 'aceptado'; }).pop() || null; }
  function pagosDe(id) { return S.pag.filter(function (p) { return p.solicitud_id === id; }); }
  function tareasDe(id) { return S.tar.filter(function (t) { return t.solicitud_id === id; }); }
  function tareasPend(id) { return tareasDe(id).filter(function (t) { return !t.hecha_en; }); }
  function vencidas(id) { var h = hoy(); return tareasPend(id).filter(function (t) { return t.vence && t.vence <= h; }).length; }
  function dinero(id) {
    var a = aceptadoDe(id), ps = pagosDe(id).filter(function (p) { return p.situacion !== 'anulado'; });
    var cobrado = ps.filter(function (p) { return p.situacion === 'pagado'; }).reduce(function (s, p) { return s + Number(p.importe); }, 0);
    var pedido = ps.reduce(function (s, p) { return s + Number(p.importe); }, 0);
    var prox = ps.filter(function (p) { return p.situacion === 'pendiente'; }).sort(function (x, y) { return (x.vence || '9') < (y.vence || '9') ? -1 : 1; })[0] || null;
    return { total: a ? Number(a.total) : null, cobrado: r2(cobrado), pedido: r2(pedido), pendiente: r2(pedido - cobrado), prox: prox, aceptado: a };
  }

  /* ---------------- montaje ---------------- */
  function montar() {
    var pub = URL_WEB + 'training-camps/';
    $('tc').innerHTML =
      '<div class="tc-cab"><div><h1>Training Camps</h1><p>Concentraciones de clubes y equipos extranjeros en Alicante: solicitudes, presupuestos, pagos y calendario. ' +
      'La página pública va <b>solo por enlace</b> (no sale en los menús): <a href="' + pub + '" target="_blank" rel="noopener">/training-camps/</a>.</p></div>' +
      '<div class="tc-cab-acc"><button type="button" class="tc-btn" data-copiar="' + pub + '">Copiar enlace público</button>' +
      '<button type="button" class="tc-btn pri" id="tc-nuevo">＋ Expediente a mano</button></div></div>' +
      '<div class="tc-vistas" role="tablist" id="tc-vistas">' +
      [['lista','Expedientes'],['calendario','Calendario'],['proximos','Próximos'],['ajustes','Ajustes']].map(function (v) {
        return '<button type="button" role="tab" data-vista="' + v[0] + '">' + v[1] + '</button>'; }).join('') + '</div>' +
      '<div id="tc-vista"></div>';
    $('tc-vistas').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-vista]'); if (!b) return;
      S.vista = b.getAttribute('data-vista');
      var u = new URL(location.href); u.searchParams.set('v', S.vista); u.searchParams.delete('id'); history.replaceState(null, '', u);
      pintar();
    });

      var c = ev.target.closest('[data-copiar]'); if (c) { copiar(c.getAttribute('data-copiar')); return; }

  /* =========================== LISTA =========================== */

  function base() { return S.sol.filter(function (s) { return S.prueba || !s.es_prueba; }); }
  function visibles() {

      if (S.estado && s.estado !== S.estado) return false;

      if (S.desde && (s.salida || s.llegada || '') < S.desde) return false;

      if (q && [s.entidad, s.contacto, s.email, s.codigo, s.pais, s.telefono].join(' ').toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function (a, b) {

  /* =========================== CALENDARIO =========================== */
  function pintarCalendario() {
    var y = +S.mes.slice(0, 4), m = +S.mes.slice(5, 7) - 1;
    var primero = new Date(Date.UTC(y, m, 1)), offset = (primero.getUTCDay() + 6) % 7;
    var inicio = new Date(Date.UTC(y, m, 1 - offset));
    var ultimo = new Date(Date.UTC(y, m + 1, 0));
    var semanas = Math.ceil((offset + ultimo.getUTCDate()) / 7);
    var h = hoy(), ini = inicio.toISOString().slice(0, 10), fin = sumaDias(ini, semanas * 7 - 1);
    var camps = base().filter(function (s) { return s.llegada && s.estado !== 'cancelada' && s.llegada <= fin && (s.salida || s.llegada) >= ini; });
    var clase = function (s) { return CONFIRMADOS.indexOf(s.estado) >= 0 ? 'conf' : s.estado === 'finalizada' ? 'fin' : 'prev'; };
    var html = '<div class="tc-cal-cab"><button type="button" class="tc-btn mini" data-mes="-1" aria-label="Mes anterior">‹</button>' +
      '<h2>' + primero.toLocaleDateString('es-ES', { month: 'long', year: 'numeric', timeZone: 'UTC' }) + '</h2>' +
      '<button type="button" class="tc-btn mini" data-mes="1" aria-label="Mes siguiente">›</button><button type="button" class="tc-btn mini" data-mes="0">Hoy</button>' +
      '<div class="tc-cal-ley"><span><i style="background:#3E7A34"></i>Confirmada</span><span><i style="background:#FBF1D9;border:1px dashed #D9A441"></i>Prevista (sin confirmar)</span><span><i style="background:#EFE9DC"></i>Finalizada</span></div></div>' +
      '<div class="tc-cal"><div class="tc-cal-dias">' + ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function (d) { return '<span>' + d + '</span>'; }).join('') + '</div>';
    for (var w = 0; w < semanas; w++) {
      var a = sumaDias(ini, w * 7), b = sumaDias(a, 6);
      html += '<div class="tc-sem">';
      for (var d = 0; d < 7; d++) {
        var f = sumaDias(a, d);
        html += '<div class="dia' + (+f.slice(5, 7) - 1 !== m ? ' fuera' : '') + (f === h ? ' hoy' : '') + '" style="grid-column:' + (d + 1) + '"><span>' + (+f.slice(8)) + '</span></div>';
      }
      camps.filter(function (s) { return s.llegada <= b && (s.salida || s.llegada) >= a; }).sort(function (x, z) { return x.llegada < z.llegada ? -1 : 1; }).forEach(function (s) {
        var c0 = Math.max(0, diasEntre(a, s.llegada)), c1 = Math.min(6, diasEntre(a, s.salida || s.llegada));
        html += '<button type="button" class="tc-bar ' + clase(s) + '" style="grid-column:' + (c0 + 1) + ' / ' + (c1 + 2) + '" data-abrir="' + s.id + '" title="' +
          esc(s.entidad + ' · ' + rango(s.llegada, s.salida) + ' · ' + ESTXT[s.estado]) + '">' + esc(s.entidad) + ' · ' + ((s.n_atletas || 0) + (s.n_entrenadores || 0)) + '</button>';
      });
      html += '</div>';
    }
    html += '</div>';
    var delMes = camps.filter(function (s) { return s.llegada <= S.mes + '-31' && (s.salida || s.llegada) >= S.mes + '-01'; });
    html += '<div class="tc-cal-movil">' + (delMes.length ? '<div class="tc-lista">' + delMes.map(filaHtml).join('') + '</div>' : '<div class="tc-vacio"><b>Ninguna concentración este mes</b></div>') + '</div>';
    if (!camps.length) html += '<div class="tc-aviso azul" style="margin-top:12px">Este mes no hay concentraciones previstas ni confirmadas.</div>';
    $('tc-vista').innerHTML = html;
    $('tc-vista').querySelector('.tc-cal-cab').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-mes]'); if (!b) return;
      var n = +b.getAttribute('data-mes');
      if (n === 0) S.mes = hoy().slice(0, 7);
      else { var dd = new Date(Date.UTC(y, m + n, 1)); S.mes = dd.toISOString().slice(0, 7); }
      pintarCalendario();
    });
  }

  /* =========================== PRÓXIMOS =========================== */
  function pintarProximos() {

        var up = await sb.storage.from('training-camps').upload(ruta, f, { contentType: f.type || 'application/octet-stream' });
        if (up.error) { fallo(up.error); continue; }
        var ri = await sb.from('camp_archivos').insert({ solicitud_id: s.id, ruta: ruta, nombre: f.name, mime: f.type || null, tamano: f.size });
        if (ri.error) fallo(ri.error);
      }
      toast('Archivos adjuntados'); return refrescar();
    }
    if (t.form && t.form.id === 'tc-reg-form' && t.name === 'tipo') { $('tc-reg-com').hidden = t.value !== 'comunicacion'; }
  });
  $('tc-p-cuerpo').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var f = ev.target, s = sAbierta(), r;
    if (f.id === 'tc-reg-form') {
      if (!f.texto.value.trim()) return toast('Escribe algo.', 'error');
      var com = f.tipo.value === 'comunicacion';
      r = await sb.from('camp_registro').insert({ solicitud_id: s.id, tipo: f.tipo.value, canal: com ? f.canal.value : null, sentido: com ? f.sentido.value : null, texto: f.texto.value.trim() });
      if (r.error) return fallo(r.error); toast('Anotado'); return refrescar();
    }
    if (f.id === 'tc-tarea-form') {
      if (!f.texto.value.trim()) return toast('Escribe la tarea.', 'error');
      r = await sb.from('camp_tareas').insert({ solicitud_id: s.id, texto: f.texto.value.trim(), vence: f.vence.value || null });
      if (r.error) return fallo(r.error); toast('Tarea añadida'); return refrescar();
    }
  });

  /* ---------------- arranque ---------------- */
  (async function () {
    if (!await cargar()) return;
    montar(); pintar();
    var id = qs.get('id');
    if (id) { var tab = qs.get('tab'); abrir(id, tab); }
  })();
});
</script>
</body>
</html>
