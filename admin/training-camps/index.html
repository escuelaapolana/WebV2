<style>
  /* ============================================================
     TRAINING CAMPS · concentraciones de equipos extranjeros (29-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios» y «Pruebas de pista»: cabecera grande,
     cifras que filtran, buscador + filtros, una tarjeta por expediente con
     la franja de su estado. Al tocar una se abre el expediente en un panel
     lateral (pantalla completa en el móvil) con sus pestañas: Resumen ·
     Presupuestos · Pagos · Seguimiento · Tareas · Archivos.
     Datos: tablas camp_* (mig 492-493) + Edge Function camp-gestion.
     Prefijo tc-.
     ============================================================ */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .tc-wrap { max-width: 1060px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .tc-wrap *, .tc-capa *, .tc-dlg * { box-sizing: border-box; }
  .tc-cab { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .tc-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); margin: 2px 0 4px; line-height: 1; }
  .tc-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 66ch; }
  .tc-cab a { color: var(--azul-oscuro,#2A5E8C); }
  .tc-cab-acc { display: flex; gap: 8px; flex-wrap: wrap; }

  .tc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 15px; border-radius: 12px;
    border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff; color: var(--navy,#26374B); font: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer; text-decoration: none; white-space: nowrap; }
  .tc-btn:hover { background: var(--crema,#FBF9F4); }
  .tc-btn:focus-visible, .tc-cifra:focus-visible, .tc-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .tc-btn.pri { background: var(--azul,#2F6FA8); border-color: var(--azul,#2F6FA8); color: #fff; }
  .tc-btn.pri:hover { background: var(--azul-hover,#1E4E78); }
  .tc-btn.ok { background: #2F7A45; border-color: #2F7A45; color: #fff; }
  .tc-btn.peligro { color: #8A3B32; border-color: #E8C9C2; }
  .tc-btn.mini { min-height: 34px; padding: 0 11px; font-size: 13px; border-radius: 10px; }
  .tc-btn:disabled { opacity: .55; cursor: not-allowed; }
  .tc-btn svg { width: 16px; height: 16px; flex: 0 0 16px; }

  /* Vistas */
  .tc-vistas { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    margin: 18px 0 4px; max-width: 100%; overflow-x: auto; scrollbar-width: none; width: max-content; }
  .tc-vistas::-webkit-scrollbar { display: none; }
  .tc-vistas button { min-height: 38px; padding: 0 15px; border: 0; border-radius: 999px; background: none; font: inherit; font-weight: 700; font-size: 14px;
    color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .tc-vistas button.on { background: var(--navy,#26374B); color: #fff; }

  /* Cifras */
  .tc-cifras { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin: 16px 0 6px; }
  .tc-cifra { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; background: #fff;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .tc-cifra b { display: block; font-family: var(--fuente-dato,'JetBrains Mono',monospace); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .tc-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .tc-cifra.aviso { background: #FBF1DE; border-color: #E9CE9A; } .tc-cifra.aviso b, .tc-cifra.aviso span { color: #8A5307; }
  .tc-cifra.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  @media (max-width: 760px) { .tc-cifras { grid-template-columns: repeat(2, minmax(0,1fr)); } .tc-cifra b { font-size: 21px; } }

  /* Filtros */
  .tc-filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 4px; }
  .tc-filtros input, .tc-filtros select, .tc-campo input, .tc-campo select, .tc-campo textarea, .tc-lin input, .tc-lin select {
    min-height: 44px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 12px; padding: 0 12px; font: inherit; font-size: 15px;
    background: #fff; color: var(--navy,#26374B); min-width: 0; }
  .tc-filtros input:focus, .tc-filtros select:focus, .tc-campo :is(input,select,textarea):focus, .tc-lin :is(input,select):focus {
    outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .tc-filtros .q { flex: 1 1 240px; }
  .tc-filtros .f { flex: 0 1 auto; }
  .tc-filtros label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--texto-suave,#6E6656); }
  .tc-cuenta { display: block; font-size: 13px; color: var(--texto-suave,#6E6656); margin: 6px 2px 0; min-height: 20px; }
  @media (max-width: 620px) { .tc-filtros .f { flex: 1 1 calc(50% - 8px); } }

  /* Filas */
  .tc-lista { container: tc-lista / inline-size; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .tc-fila { display: grid; grid-template-columns: minmax(0,1.7fr) 170px minmax(0,1.1fr) 120px 14px; gap: 0 14px; align-items: center; background: #fff;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid #CFC6B4; border-radius: 14px; padding: 11px 14px 11px 12px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .tc-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .tc-fila.g-nueva { border-left-color: #3B85C0; } .tc-fila.g-curso { border-left-color: #8C7BC2; } .tc-fila.g-enviado { border-left-color: #D9A441; }
  .tc-fila.g-cobro { border-left-color: #D97A41; } .tc-fila.g-ok { border-left-color: #6FAF7E; } .tc-fila.g-fin { background: #FCFBF8; }
  .tc-per { min-width: 0; }
  .tc-per b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .tc-per small { display: block; font-size: 13px; color: var(--texto-suave,#6E6656); margin-top: 2px; }
  .tc-per .cod { font-family: var(--fuente-dato,'JetBrains Mono',monospace); font-size: 12px; color: var(--azul,#2F6FA8); }
  .tc-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px 3px 9px; border-radius: 999px;
    background: #F0EBE0; color: #6E6656; white-space: nowrap; justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tc-pill .pt { width: 7px; height: 7px; border-radius: 999px; background: #9A927F; flex: 0 0 7px; }
  .tc-pill.g-nueva { background: #E6F0FB; color: #2F6FA8; } .tc-pill.g-nueva .pt { background: #3B85C0; }
  .tc-pill.g-curso { background: #EFEBF8; color: #5A4A93; } .tc-pill.g-curso .pt { background: #8C7BC2; }
  .tc-pill.g-enviado { background: #FBF1D9; color: #8A5307; } .tc-pill.g-enviado .pt { background: #D9A441; }
  .tc-pill.g-cobro { background: #FCE9DC; color: #96471A; } .tc-pill.g-cobro .pt { background: #D97A41; }
  .tc-pill.g-ok { background: #E7F3EA; color: #23603A; } .tc-pill.g-ok .pt { background: #3E7A34; }
  .tc-pill.p-pagado { background: #E7F3EA; color: #23603A; } .tc-pill.p-pendiente { background: #FBF1D9; color: #8A5307; }
  .tc-pill.p-vencido { background: #FBE6E2; color: #8A3B32; } .tc-pill.p-anulado { background: #F0EBE0; color: #8A816E; text-decoration: line-through; }
  .tc-fechas { font-size: 13.5px; min-width: 0; }
  .tc-fechas b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-fechas small { color: var(--texto-suave,#6E6656); font-size: 12.5px; }
  .tc-din { text-align: right; font-family: var(--fuente-dato,'JetBrains Mono',monospace); font-size: 13px; line-height: 1.35; }
  .tc-din small { display: block; font-family: var(--fuente-texto); color: var(--texto-suave,#6E6656); font-size: 12px; }
  .tc-flecha { color: #B5AC99; font-size: 20px; text-align: right; }
  .tc-marca { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px;
    border-radius: 999px; background: #F0EBE0; color: #8A816E; vertical-align: 2px; }
  .tc-marca.tarea { background: #FBE6E2; color: #8A3B32; }
  @container tc-lista (max-width: 680px) {
    .tc-fila { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 12px; }
    .tc-per { flex: 1 1 0; order: 0; } .tc-flecha { order: 1; }
    .tc-fila::after { content: ""; order: 2; flex-basis: 100%; height: 0; }
    .tc-pill { order: 3; } .tc-fechas { order: 4; flex: 1 1 auto; } .tc-din { order: 5; margin-left: auto; }
  }
  .tc-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE);
    border-radius: 14px; margin-top: 10px; line-height: 1.5; }
  .tc-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }

  /* Tarjetas genéricas (Próximos, Ajustes, bloques del expediente) */
  .tc-tarj { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; overflow: hidden; margin-top: 12px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .tc-tarj > h3 { margin: 0; padding: 11px 16px; background: var(--crema-banda,#F1EADC); font-size: 12.5px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; color: var(--texto-suave,#6E6656); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tc-tarj > h3 .tc-btn { text-transform: none; letter-spacing: 0; }
  .tc-tarj .cuerpo { padding: 14px 16px; }
  .tc-aviso { background: var(--aviso-fondo,#FDF5DF); border: 1px solid var(--aviso-borde,#EBDCAE); color: var(--aviso-texto,#4A4335); border-radius: 12px;
    padding: 11px 14px; font-size: 14px; line-height: 1.5; margin-top: 12px; }
  .tc-aviso b { color: var(--aviso-titulo,#7A6A2B); }
  .tc-aviso.azul { background: #EAF2F9; border-color: #CFE2F1; color: #1E4E78; }
  .tc-aviso.azul b { color: #1E4E78; }
  .tc-aviso.verde { background: #EDF5EE; border-color: #CBE0CE; color: #23603A; }
  .tc-aviso.verde b { color: #23603A; }

  /* Próximos */
  .tc-prox { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 10px; }
  .tc-prox .tc-tarj { margin: 0; cursor: pointer; }
  .tc-prox .cuenta-atras { font-family: var(--fuente-dato); font-size: 28px; font-weight: 700; line-height: 1; }
  .tc-prox .cuenta-atras small { font-family: var(--fuente-texto); font-size: 13px; font-weight: 600; color: var(--texto-suave,#6E6656); margin-left: 6px; }
  .tc-barra { height: 8px; border-radius: 99px; background: #EFE9DC; overflow: hidden; margin: 10px 0 4px; }
  .tc-barra i { display: block; height: 100%; background: #3E7A34; border-radius: 99px; }

  /* Calendario */
  .tc-cal-cab { display: flex; align-items: center; gap: 10px; margin: 16px 0 10px; flex-wrap: wrap; }
  .tc-cal-cab h2 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; text-transform: capitalize; min-width: 180px; }
  .tc-cal-ley { display: flex; gap: 14px; font-size: 13px; color: var(--texto-suave,#6E6656); margin-left: auto; flex-wrap: wrap; }
  .tc-cal-ley i { display: inline-block; width: 22px; height: 10px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }
  .tc-cal { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; overflow: hidden; }
  .tc-cal-dias { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--crema-banda,#F1EADC); font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .05em; color: var(--texto-suave,#6E6656); }
  .tc-cal-dias span { padding: 8px 10px; }
  .tc-sem { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: min-content; grid-auto-flow: row dense; min-height: 96px;
    border-top: 1px solid #EFE9DA; position: relative; padding-bottom: 6px; }
  .tc-sem .dia { grid-row: 1; padding: 6px 10px 2px; font-size: 13px; font-family: var(--fuente-dato); color: var(--texto-suave,#6E6656);
    border-left: 1px solid #F3EEE3; }
  .tc-sem .dia:first-child { border-left: 0; }
  .tc-sem .dia.fuera { color: #C9C0AE; } .tc-sem .dia.hoy { color: #fff; }
  .tc-sem .dia.hoy span { background: var(--azul,#2F6FA8); border-radius: 99px; padding: 1px 7px; }
  .tc-bar { margin: 2px 3px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer; border: 0; text-align: left; font-family: inherit; min-height: 22px; }
  .tc-bar.conf { background: #3E7A34; color: #fff; }
  .tc-bar.prev { background: #FBF1D9; color: #8A5307; border: 1px dashed #D9A441; }
  .tc-bar.fin { background: #EFE9DC; color: #8A816E; }
  .tc-cal-movil { display: none; }
  @media (max-width: 640px) { .tc-cal { display: none; } .tc-cal-movil { display: block; } }

  /* Ajustes */
  .tc-rejilla { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 14px; }
  .tc-rejilla .ancho { grid-column: 1 / -1; }
  @media (max-width: 620px) { .tc-rejilla { grid-template-columns: 1fr; } }
  .tc-campo { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 700; color: var(--texto-suave,#6E6656); min-width: 0; }
  .tc-campo small { font-weight: 400; font-size: 12.5px; }
  .tc-campo textarea { min-height: 90px; padding: 10px 12px; line-height: 1.45; resize: vertical; }
  .tc-campo textarea.legal { min-height: 380px; font-family: var(--fuente-dato); font-size: 13px; }
  .tc-campo .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tc-chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--navy,#26374B); font-weight: 600; line-height: 1.4; }
  .tc-chk input { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 20px; accent-color: var(--azul,#2F6FA8); }
  .tc-gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .tc-gal figure { margin: 0; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 12px; overflow: hidden; background: #FBF9F4; }
  .tc-gal figure.oculta { opacity: .55; }
  .tc-gal .med { aspect-ratio: 16/10; background: #EFE9DC center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: #8A816E; font-weight: 700; font-size: 13px; }
  .tc-gal figcaption { padding: 8px 10px; display: grid; gap: 6px; }
  .tc-gal figcaption input { min-height: 36px; font-size: 13.5px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 9px; padding: 0 9px; font: inherit; }
  .tc-gal .fila-acc { display: flex; gap: 6px; flex-wrap: wrap; }
  .tc-prev-legal { border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 12px; padding: 4px 18px 14px; max-height: 460px; overflow: auto; font-size: 14px; line-height: 1.55; color: var(--texto,#4A4437); }
  .tc-prev-legal h4 { font-size: 15px; color: var(--navy,#26374B); margin: 16px 0 6px; }
  .tc-prev-legal ul { padding-left: 20px; margin: 6px 0; }

  /* ===== Panel del expediente ===== */
  .tc-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .tc-velo.ver { opacity: 1; pointer-events: auto; }
  .tc-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100%); z-index: 9001; background: var(--crema,#FBF9F4); color: var(--navy,#26374B);
    transform: translateX(102%); transition: transform .25s var(--ease-panel, ease); display: flex; flex-direction: column; visibility: hidden;
    box-shadow: -12px 0 40px rgba(20,30,45,.25); }
  .tc-panel.ver { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .tc-panel, .tc-velo, .tc-fila { transition: none; } }
  .tc-p-cab { background: #fff; border-bottom: 1px solid var(--linea-marcada,#E4DCCB); padding: 14px clamp(14px,3vw,24px) 0; }
  .tc-p-top { display: flex; gap: 12px; align-items: flex-start; }
  .tc-p-top > div { flex: 1; min-width: 0; }
  .tc-p-top h2 { margin: 2px 0 2px; font-family: var(--fuente-titulo); font-size: clamp(20px,4vw,26px); line-height: 1.12; overflow-wrap: anywhere; }
  .tc-p-top .sub { font-size: 13.5px; color: var(--texto-suave,#6E6656); }
  .tc-p-top .cod { font-family: var(--fuente-dato); font-size: 12.5px; color: var(--azul,#2F6FA8); font-weight: 700; }
  .tc-cerrar { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 22px; line-height: 1; cursor: pointer; }
  .tc-p-estado { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }
  .tc-p-estado select { min-height: 38px; border-radius: 10px; border: 1px solid var(--linea-marcada,#E4DCCB); font: inherit; font-weight: 700; font-size: 14px;
    padding: 0 10px; background: #fff; color: var(--navy,#26374B); max-width: 100%; }
  .tc-tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .tc-tabs::-webkit-scrollbar { display: none; }
  .tc-tabs button { border: 0; background: none; font: inherit; font-weight: 700; font-size: 14px; color: var(--texto-suave,#6E6656); padding: 10px 12px 11px;
    border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  .tc-tabs button.on { color: var(--navy,#26374B); border-bottom-color: var(--azul,#2F6FA8); }
  .tc-tabs button .n { display: inline-block; min-width: 19px; padding: 0 5px; border-radius: 99px; background: #F0EBE0; font-size: 11.5px; margin-left: 4px; }
  .tc-tabs button .n.rojo { background: #FBE6E2; color: #8A3B32; }
  .tc-p-cuerpo { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 4px clamp(14px,3vw,24px) 40px; }
  .tc-datos { margin: 0; }
  .tc-datos div { display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; }
  .tc-datos div:last-child { border-bottom: 0; }
  .tc-datos dt { color: var(--texto-suave,#6E6656); }
  .tc-datos dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; white-space: pre-line; }
  @media (max-width: 560px) { .tc-datos div { grid-template-columns: 1fr; gap: 2px; } }
  .tc-acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  /* Presupuestos y pagos */
  .tc-item { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #EFE9DA; }

      '<span class="tc-modo" role="group" aria-label="Vista"><button type="button" class="on" data-modo="mes">Mes</button><button type="button" data-modo="semana">Semana</button></span>' +
      '<div class="tc-cal-ley"><span><i style="background:#3E7A34"></i>Reserva confirmada</span><span><i style="background:#E7F3EA;border:1px solid #6FAF7E"></i>Disponibilidad confirmada</span>' +
      '<span><i style="background:#FBF1D9;border:1px solid #D9A441"></i>Pendiente de confirmar</span><span><i style="background:#EAF2F9;border:1px dashed #3B85C0"></i>Aparente</span>' +

    for (var w = 0; w < semanas; w++) {
      var a = sumaDias(ini, w * 7), b = sumaDias(a, 6);
      html += '<div class="tc-sem">';
      for (var d = 0; d < 7; d++) {
        var f = sumaDias(a, d);
        html += '<div class="dia' + (+f.slice(5, 7) - 1 !== m ? ' fuera' : '') + (f === h ? ' hoy' : '') + '" style="grid-column:' + (d + 1) + '"><span>' + (+f.slice(8)) + '</span></div>';
      }
      camps.filter(function (s) { return s.llegada <= b && (s.salida || s.llegada) >= a; }).sort(function (x, z) { return x.llegada < z.llegada ? -1 : 1; }).forEach(function (s) {
        var c0 = Math.max(0, diasEntre(a, s.llegada)), c1 = Math.min(6, diasEntre(a, s.salida || s.llegada));
        html += '<button type="button" class="tc-bar ' + clase(s) + '" style="grid-column:' + (c0 + 1) + ' / ' + (c1 + 2) + '" data-abrir="' + s.id + '" title="' +
          esc(s.entidad + ' · ' + rango(s.llegada, s.salida) + ' · ' + ESTXT[s.estado] + ' · disponibilidad ' + (NIVTXT[s.disponibilidad_estado] || '').toLowerCase()) + '">' +
          (nAvisos(s.id) ? '⚠ ' : '') + esc(s.entidad) + ' · ' + ((s.n_atletas || 0) + (s.n_entrenadores || 0)) + '</button>';
      });
      html += '</div>';
    }
    html += '</div>';
    var delMes = camps.filter(function (s) { return s.llegada <= S.mes + '-31' && (s.salida || s.llegada) >= S.mes + '-01'; });
    html += '<div class="tc-cal-movil">' + (delMes.length ? '<div class="tc-lista">' + delMes.map(filaHtml).join('') + '</div>' : '<div class="tc-vacio"><b>Ninguna concentración este mes</b></div>') + '</div>';
    if (!camps.length) html += '<div class="tc-aviso azul" style="margin-top:12px">Este mes no hay concentraciones previstas ni confirmadas.</div>';
    $('tc-vista').innerHTML = html;
    $('tc-vista').querySelector('.tc-cal-cab').addEventListener('click', function (ev) {
      var mo = ev.target.closest('[data-modo]'); if (mo) { S.calModo = mo.getAttribute('data-modo'); pintarCalendario(); return; }
      var b = ev.target.closest('[data-mes]'); if (!b) return;
      var n = +b.getAttribute('data-mes');
      if (n === 0) S.mes = hoy().slice(0, 7);
      else { var dd = new Date(Date.UTC(y, m + n, 1)); S.mes = dd.toISOString().slice(0, 7); }
      pintarCalendario();
    });
  }

  // Semana: cada día con lo que hay en pista y en El Cubo (sesiones, grupos del club y ocupación externa).
  function lunesDe(f) { return sumaDias(f, -(diaSem(f) - 1)); }
  function pintarSemana() {
    if (!S.semana) S.semana = lunesDe(hoy());
    var a = S.semana, h = hoy(), cols = '';
    for (var i = 0; i < 7; i++) {
      var f = sumaDias(a, i), d = i + 1, items = [];
      S.ses.filter(function (x) { return x.fecha === f && cuenta_(x.solicitud_id); }).forEach(function (x) {
        var s0 = solDe(x.solicitud_id), av = avisos(x);
        items.push([x.hora_inicio, '<button type="button" class="tc-chip-s ' + (x.recurso === 'pista' || x.recurso === 'cubo' ? x.recurso : 'otro') + (av.length ? ' aviso' : '') + '" data-abrir-plan="' + x.solicitud_id + '" title="' + esc(av.map(function (v) { return v[1]; }).join('\n')) + '">' +
          '<b>' + hh(x) + '</b> ' + esc(RECURSOS[x.recurso]) + (x.zona ? ' · ' + esc(x.zona) : '') + '<br>' + esc(s0 ? s0.codigo + ' · ' + s0.entidad : '') + (x.subgrupo ? ' · ' + esc(x.subgrupo) : '') + (x.n_atletas ? ' · ' + x.n_atletas : '') + (av.length ? ' · ⚠ ' + av.length : '') + '</button>']);
      });
      S.cuboGr.filter(function (g) { return g.dia_semana === d; }).forEach(function (g) {
        items.push([g.hora_inicio, '<span class="tc-chip-s club"><b>' + String(g.hora_inicio).slice(0, 5) + '–' + String(g.hora_fin).slice(0, 5) + '</b> El Cubo · grupo del club<br>' + esc(g.grupo) + ' · ' + g.inscritos + ' inscritos</span>']);
      });
      S.ext.filter(function (e) { return e.fecha === f; }).forEach(function (e) {
        items.push([e.hora_inicio, '<span class="tc-chip-s ext"><b>' + hh(e) + '</b> ' + esc(RECURSOS[e.recurso] || e.recurso) + ' · ' + (e.fuente === 'concejalia' ? 'Concejalía' : 'ocupado') + '<br>' + esc(e.titulo) + '</span>']);
      });
      items.sort(function (p, q) { return p[0] < q[0] ? -1 : 1; });
      cols += '<div class="d' + (f === h ? ' hoy' : '') + '"><h4>' + DIAS_ES[i] + ' ' + (+f.slice(8)) + ' ' + MES[+f.slice(5, 7) - 1] + '</h4>' +
        (items.length ? items.map(function (p) { return p[1]; }).join('') : '<span style="font-size:12px;color:var(--texto-suave)">—</span>') + '</div>';
    }
    $('tc-vista').innerHTML = '<div class="tc-cal-cab"><button type="button" class="tc-btn mini" data-sem="-7" aria-label="Semana anterior">‹</button>' +
      '<h2 style="text-transform:none">Semana del ' + fSinAnio(a) + ' al ' + fCorta(sumaDias(a, 6)) + '</h2>' +
      '<button type="button" class="tc-btn mini" data-sem="7" aria-label="Semana siguiente">›</button><button type="button" class="tc-btn mini" data-sem="0">Hoy</button>' +
      '<span class="tc-modo" role="group" aria-label="Vista"><button type="button" data-modo="mes">Mes</button><button type="button" class="on" data-modo="semana">Semana</button></span>' +
      '<div class="tc-cal-ley"><span><i style="background:#3E7A34"></i>Pista</span><span><i style="background:#B98A2E"></i>El Cubo</span><span><i style="background:#EAF2F9"></i>Grupo del club</span><span><i style="background:#ECE7F7"></i>Concejalía / ocupado</span><span><i style="background:#FDF5DF;border:1px solid #E9CE9A"></i>Con aviso</span></div></div>' +
      '<div class="tc-semana-caja"><div class="tc-semana">' + cols + '</div></div>' +
      '<p style="font-size:13px;color:var(--texto-suave);margin:10px 2px 0">Los avisos no bloquean: dos grupos pueden compartir pista en zonas distintas. La decisión es vuestra (y de la Concejalía cuando corresponda).</p>';
    $('tc-vista').querySelector('.tc-cal-cab').addEventListener('click', function (ev) {
      var mo = ev.target.closest('[data-modo]'); if (mo) { S.calModo = mo.getAttribute('data-modo'); pintarCalendario(); return; }
      var b = ev.target.closest('[data-sem]'); if (!b) return;
      var n = +b.getAttribute('data-sem'); S.semana = n === 0 ? lunesDe(hoy()) : sumaDias(S.semana, n); pintarSemana();
    });
    $('tc-vista').querySelector('.tc-semana').addEventListener('click', function (ev) {
      var c = ev.target.closest('[data-abrir-plan]'); if (c) abrir(c.getAttribute('data-abrir-plan'), 'plan');
    });
  }

  /* =========================== PRÓXIMOS =========================== */
  function pintarProximos() {
    var h = hoy();
    var conf = base().filter(function (s) { return CONFIRMADOS.indexOf(s.estado) >= 0 && (s.salida || s.llegada || '9') >= h; })
      .sort(function (a, b) { return (a.llegada || '9') < (b.llegada || '9') ? -1 : 1; });
    var prev = base().filter(function (s) { return ['enviado','pendiente_senal'].indexOf(s.estado) >= 0; })
      .sort(function (a, b) { return (a.llegada || '9') < (b.llegada || '9') ? -1 : 1; });
    function tarjeta(s) {
      var d = dinero(s.id), falta = s.llegada ? diasEntre(h, s.llegada) : null, pct = d.total ? Math.min(100, Math.round(d.cobrado / d.total * 100)) : 0;
      var g = GRUPO[s.estado];
      return '<div class="tc-tarj" data-abrir="' + s.id + '" tabindex="0"><h3><span>' + esc(s.codigo) + '</span><span class="tc-pill g-' + g + '"><span class="pt"></span>' + esc(ESTXT[s.estado]) + '</span></h3>' +
        '<div class="cuerpo"><b style="font-size:17px;display:block">' + esc(s.entidad) + '</b><small style="color:var(--texto-suave)">' + esc([s.pais, s.contacto].filter(Boolean).join(' · ')) + '</small>' +
        '<div style="margin:12px 0 6px" class="cuenta-atras">' + (falta == null ? '—' : falta > 0 ? falta + '<small>días para llegar</small>' : '<small>están aquí</small>') + '</div>' +
        '<div style="font-size:14px">' + esc(rango(s.llegada, s.salida)) + ' · ' + ((s.n_atletas || 0) + (s.n_entrenadores || 0)) + ' personas</div>' +
        (d.total != null ? '<div class="tc-barra" title="Cobrado"><i style="width:' + pct + '%"></i></div><div style="font-size:13px;color:var(--texto-suave)">Cobrado ' + eur(d.cobrado) + ' de ' + eur(d.total) +
          (d.prox ? ' · próximo: ' + eur(d.prox.importe) + (d.prox.vence ? ' el ' + fSinAnio(d.prox.vence) : '') : '') + '</div>' : '') +
        (tareasPend(s.id).length ? '<div style="font-size:13px;margin-top:6px">' + tareasPend(s.id).length + ' tarea(s) pendiente(s)</div>' : '') +
        '</div></div>';
    }
    $('tc-vista').innerHTML =
      '<h2 style="font-family:var(--fuente-titulo);font-size:20px;margin:20px 0 4px">Confirmadas</h2>' +
      (conf.length ? '<div class="tc-prox">' + conf.map(tarjeta).join('') + '</div>' : '<div class="tc-vacio"><b>Ninguna concentración confirmada por delante</b>Se confirman al cobrar la señal con la disponibilidad aprobada.</div>') +
      '<h2 style="font-family:var(--fuente-titulo);font-size:20px;margin:26px 0 4px">Pendientes de confirmar</h2>' +
      (prev.length ? '<div class="tc-prox">' + prev.map(tarjeta).join('') + '</div>' : '<div class="tc-vacio"><b>Nada pendiente de confirmar</b>Aquí salen las que tienen presupuesto enviado o esperan la señal.</div>');
  }

        '<div class="tc-acc"><button type="button" class="tc-btn pri" data-acc="pedir-senal"' + (haySenal || s.estado === 'cancelada' ? ' disabled' : '') + '>Pedir la señal (' + eur(a.senal) + ')…</button>' +
        '<button type="button" class="tc-btn" data-acc="pedir-saldo"' + (haySaldo || s.estado === 'cancelada' ? ' disabled' : '') + '>Pedir el pago final…</button>' +
        '<button type="button" class="tc-btn" data-acc="pedir-otro"' + (s.estado === 'cancelada' ? ' disabled' : '') + '>Otro pago…</button></div>' +
        '<p style="font-size:13px;color:var(--texto-suave);margin:10px 0 0">' + (online ? 'Pedir un pago crea el recibo y su enlace (Stripe de Apolana). <b>No se cobra nada</b> hasta que el cliente paga; se da por cobrado solo cuando Stripe lo confirma.' : 'Pedir un pago crea el recibo (sin enlace mientras los pagos online estén desactivados).') + ' Los recibos salen también en Dinero.</p></div></div>'
        : '<div class="tc-aviso azul">Para pedir pagos hace falta un presupuesto <b>aceptado</b> (por el cliente desde su enlace o marcado a mano).</div>') +
      '<div class="tc-tarj"><h3>Pagos pedidos</h3><div class="cuerpo">' + (ps.length ? ps.map(function (p) {
        var sit = p.situacion === 'pendiente' && p.vence && p.vence < h ? 'vencido' : p.situacion;
        var txt = { pagado: 'Cobrado', pendiente: 'Pendiente', vencido: 'Vencido', anulado: 'Anulado' }[sit];
        var det = [];
        if (p.vence) det.push('vence ' + fCorta(p.vence));
        if (p.situacion === 'pagado') det.push('cobrado ' + fCorta(p.fecha_pago) + ' · ' + (p.metodo || '') + (p.numero_recibo ? ' · recibo ' + p.numero_recibo : ''));
        if (p.enviado_en) det.push('enlace enviado ' + fCorta(p.enviado_en.slice(0, 10)));
        if (p.anulado_motivo) det.push('anulado: ' + p.anulado_motivo);
        var b = [];
        if (p.situacion === 'pendiente') {
          if (online) b.push('<button type="button" class="tc-btn mini" data-copiar="' + URL_WEB + 'training-camps/pay/?t=' + p.token + '">Copiar enlace</button>',
            '<button type="button" class="tc-btn mini" data-pago="reenviar" data-id="' + p.id + '">' + (p.enviado_en ? 'Reenviar' : 'Enviar') + ' por correo</button>');
          b.push('<button type="button" class="tc-btn mini ok" data-pago="manual" data-id="' + p.id + '">Cobrado por transferencia…</button>',
            '<button type="button" class="tc-btn mini peligro" data-pago="anular" data-id="' + p.id + '">Anular…</button>');
        }
        return '<div class="tc-item"><div class="t"><b>' + esc(p.concepto) + '</b> <span class="tc-pill p-' + sit + '">' + txt + '</span><small>' + esc(det.join(' · ')) + '</small></div>' +
          '<div class="imp">' + eur(p.importe) + '</div>' + (b.length ? '<div class="tc-acc">' + b.join('') + '</div>' : '') + '</div>';
      }).join('') : '<p style="margin:0;color:var(--texto-suave)">Todavía no se ha pedido ningún pago.</p>') + '</div></div>';
  }
  async function pedirPago(tipo) {
    var s = sAbierta(), d = dinero(s.id), a = d.aceptado, g = S.cfg || {};
    var imp = tipo === 'senal' ? a.senal : tipo === 'saldo' ? r2(a.total - d.pedido) : '';
    var vence = tipo === 'senal' ? sumaDias(hoy(), g.senal_dias_pago || 7) : tipo === 'saldo' ? (a.saldo_vence || '') : '';
    var nombre = { senal: 'la señal', saldo: 'el pago final', otro: 'otro pago' }[tipo];
    await dialogo({ titulo: 'Pedir ' + nombre, ok: 'Crear el pago', ancho: 600,
      html: (tipo === 'senal' && !s.disponibilidad_ok_en ? '<div class="tc-aviso" style="margin:0">Aún no has aprobado la disponibilidad. Puedes pedir la señal igual: la reserva se confirmará cuando la apruebes.</div>' : '') +
        '<div class="tc-rejilla">' + campo('Importe (€)', '<input name="importe" type="number" min="0.01" step="0.01" value="' + esc(imp) + '">') +
        campo('Fecha límite', '<input name="vence" type="date" value="' + esc(vence) + '">') + '</div>' +
        (tipo === 'otro' ? campo('Concepto', '<input name="concepto" placeholder="Training camp ' + esc(s.codigo) + ' · Extra transport">') : '') +
        (S.cfg && S.cfg.pagos_online
          ? '<label class="tc-chk"><input type="checkbox" name="enviar" checked> Enviarle ahora el enlace por correo (en ' + (a.idioma === 'es' ? 'castellano' : 'inglés') + ')</label>' +
            campo('Mensaje (opcional)', '<textarea name="mensaje" rows="3"></textarea>', 'Va encima del botón de pagar. En el idioma del cliente.')
          : '<p class="ayuda">Pagos online desactivados: se crea el recibo <b>sin enlace</b>. Pídele la transferencia por correo y, cuando llegue, márcalo «Cobrado por transferencia».</p>'),
      validar: function (x) { if (!(Number(x.importe) > 0)) return 'Pon el importe.'; if (tipo === 'otro' && !x.concepto) return 'Pon el concepto.'; return ''; },
      alEnviar: async function (x) {
        var res = await gestion('pedir_pago', { solicitud_id: s.id, tipo: tipo, importe: Number(x.importe), vence: x.vence || null, concepto: x.concepto || null, enviar: !!x.enviar, mensaje: x.mensaje || '' });
        if (!res.pagos_online) toast('Pago apuntado (sin enlace: pagos online desactivados)');
        else if (x.enviar && !res.correo) { toast('Pago creado, pero el correo no ha salido: te copio el enlace.', 'error'); copiar(res.enlace); }
        else toast(x.enviar ? 'Pago creado y enlace enviado' : 'Pago creado: copia el enlace para mandarlo');
        await refrescar();
      } });
  }
  async function accionPago(acc, id) {
    var p = S.pag.filter(function (x) { return x.id === id; })[0];
    if (acc === 'reenviar') { try { var r = await gestion('reenviar_pago', { camp_pago_id: id }); toast(r.correo ? 'Enlace enviado' : 'No ha salido el correo', r.correo ? 'ok' : 'error'); await refrescar(); } catch (e) { fallo(e); } return; }
    if (acc === 'manual') {
      await dialogo({ titulo: 'Registrar el cobro de «' + p.concepto + '»', ok: 'Registrar cobro',
        html: '<p class="ayuda">Para cuando paguen por transferencia u otra vía. Queda en el libro de cobros con su número de recibo y el expediente avanza solo.</p>' +
          '<div class="tc-rejilla">' + campo('Forma de pago', '<select name="metodo"><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option><option value="otro">Otro</option></select>') +
          campo('Fecha', '<input name="fecha" type="date" value="' + hoy() + '">') + '</div>' + campo('Nota', '<input name="nota" placeholder="Transferencia del 30-oct, ref…">'),
        alEnviar: async function (d) { var r = await sb.rpc('camp_pago_manual', { p_id: id, p_metodo: d.metodo, p_fecha: d.fecha || null, p_nota: d.nota || null }); if (r.error) throw r.error; toast('Cobro registrado'); await refrescar(); } });
      return;
    }
    if (acc === 'anular') {
      await dialogo({ titulo: 'Anular «' + p.concepto + '»', ok: 'Anular', peligro: true,
        html: '<p class="ayuda">El enlace deja de funcionar y el recibo pendiente sale del libro de cobros. Si ya lo hubieran pagado no se puede anular.</p>' + campo('Motivo', '<input name="motivo">'),
        validar: function (d) { return d.motivo ? '' : 'Escribe el motivo.'; },
        alEnviar: async function (d) { var r = await sb.rpc('camp_pago_anular', { p_id: id, p_motivo: d.motivo }); if (r.error) throw r.error; toast('Pago anulado'); await refrescar(); } });
    }
  }
  async function disponibilidad(ok) {
    var s = sAbierta();
    if (!ok) {
      if (!await confirmar({ titulo: 'Retirar la disponibilidad', texto: 'El expediente no cambia de estado, pero queda anotado.', confirmar: 'Retirar' })) return;
      var r = await sb.rpc('camp_disponibilidad', { p_id: s.id, p_ok: false, p_nota: null }); if (r.error) return fallo(r.error); toast('Retirada'); return refrescar();
    }
    await dialogo({ titulo: 'Aprobar la disponibilidad', ok: 'Aprobar',
      html: '<p class="ayuda">Confirmas que la pista, El Cubo y los servicios están disponibles para sus fechas. Si la señal ya está cobrada, la reserva queda confirmada.</p>' + campo('Nota (opcional)', '<input name="nota" placeholder="Pista confirmada con el estadio: L-X-S mañanas">'),
      alEnviar: async function (d) { var r = await sb.rpc('camp_disponibilidad', { p_id: s.id, p_ok: true, p_nota: d.nota || null }); if (r.error) throw r.error; toast('Disponibilidad aprobada'); await refrescar(); } });
  }

  /* ---------- Seguimiento ---------- */
  function tabSeguimiento() {
    return '<div class="tc-tarj"><h3>Anotar</h3><div class="cuerpo"><form id="tc-reg-form" class="tc-rejilla">' +
      campo('Qué es', '<select name="tipo"><option value="nota">Nota interna</option><option value="comunicacion">Comunicación con el cliente</option></select>') +
      '<span class="tc-rejilla" style="gap:8px" id="tc-reg-com" hidden>' + campo('Canal', '<select name="canal">' + Object.keys(CANALES).map(function (k) { return '<option value="' + k + '">' + CANALES[k] + '</option>'; }).join('') + '</select>') +
        campo('Sentido', '<select name="sentido"><option value="entrante">Nos escriben / llaman</option><option value="saliente">Les escribimos / llamamos</option></select>') + '</span>' +
      campo('Texto', '<textarea name="texto" rows="3" placeholder="Qué se ha hablado, qué falta…"></textarea>', '', 'ancho') +
      '<div class="ancho"><button type="submit" class="tc-btn pri">Anotar</button></div></form></div></div>' +
      '<div class="tc-tarj"><h3>Historial</h3><div class="cuerpo"><ul class="tc-reg">' + (S.reg.length ? S.reg.map(function (r) {
        var meta = [fHora(r.creado_en)];
        if (r.canal) meta.push(CANALES[r.canal] + (r.sentido === 'entrante' ? ' · recibido' : r.sentido === 'saliente' ? ' · enviado' : ''));
        return '<li><span class="ico ' + r.tipo + '" aria-hidden="true">' + (REG_ICO[r.tipo] || '•') + '</span><div><div class="txt">' + esc(r.texto) + '</div><small>' + esc(meta.join(' · ')) + '</small></div></li>';
      }).join('') : '<li>Sin movimientos.</li>') + '</ul></div></div>';
  }

  /* ---------- Tareas ---------- */
  function tabTareas(s) {
    var ts = tareasDe(s.id).slice().sort(function (a, b) { return (!!a.hecha_en - !!b.hecha_en) || ((a.vence || '9') < (b.vence || '9') ? -1 : 1); }), h = hoy();
    return '<div class="tc-tarj"><h3>Nueva tarea</h3><div class="cuerpo"><form id="tc-tarea-form" class="tc-rejilla">' +
      campo('Qué hay que hacer', '<input name="texto" placeholder="Reservar el autobús del aeropuerto">', '', 'ancho') + campo('Para cuándo', '<input name="vence" type="date">') +
      '<div style="align-self:end"><button type="submit" class="tc-btn pri">Añadir</button></div></form></div></div>' +
      '<div class="tc-tarj"><h3>Tareas</h3><div class="cuerpo">' + (ts.length ? ts.map(function (t) {
        var venc = !t.hecha_en && t.vence && t.vence <= h;
        return '<label class="tc-tarea' + (t.hecha_en ? ' hecha' : '') + '"><input type="checkbox" data-tarea="' + t.id + '"' + (t.hecha_en ? ' checked' : '') + '><span class="t">' + esc(t.texto) +
          '<small class="' + (venc ? 'vencida' : '') + '">' + (t.vence ? (venc ? 'Vencida · ' : 'Para el ') + fCorta(t.vence) : 'Sin fecha') + (t.auto ? ' · automática' : '') + (t.hecha_en ? ' · hecha ' + fHora(t.hecha_en) : '') + '</small></span>' +
          (t.auto ? '' : '<button type="button" class="tc-btn mini peligro" data-borrar-tarea="' + t.id + '" aria-label="Borrar tarea">×</button>') + '</label>';
      }).join('') : '<p style="margin:0;color:var(--texto-suave)">Sin tareas.</p>') + '</div></div>';
  }

  /* ---------- Archivos ---------- */
  function tabArchivos() {
    return '<div class="tc-tarj"><h3><span>Archivos del expediente</span><label class="tc-btn mini pri" style="cursor:pointer">Adjuntar…<input type="file" id="tc-arch" multiple hidden></label></h3><div class="cuerpo">' +
      '<p style="margin:0 0 6px;font-size:13px;color:var(--texto-suave)">Privados (solo administración). Hasta 25 MB cada uno. Los PDF de los presupuestos enviados se guardan aquí solos.</p>' +
      (S.arch.length ? S.arch.map(function (a) {
        return '<div class="tc-item"><div class="t"><b>' + esc(a.nombre) + '</b><small>' + esc([a.descripcion, fHora(a.creado_en), a.tamano ? Math.max(1, Math.round(a.tamano / 1024)) + ' KB' : ''].filter(Boolean).join(' · ')) + '</small></div>' +
          '<div class="tc-acc" style="grid-column:auto;margin:0"><button type="button" class="tc-btn mini" data-arch="ver" data-id="' + a.id + '">Abrir</button>' +
          (a.origen === 'presupuesto' ? '' : '<button type="button" class="tc-btn mini peligro" data-arch="borrar" data-id="' + a.id + '">Borrar</button>') + '</div></div>';
      }).join('') : '<p style="margin:0;color:var(--texto-suave)">Sin archivos.</p>') + '</div></div>';
  }

  /* ---------- eventos del panel ---------- */
  $('tc-p-cuerpo').addEventListener('click', async function (ev) {
    var t = ev.target, b;
    if ((b = t.closest('[data-copiar]'))) return copiar(b.getAttribute('data-copiar'));
    if ((b = t.closest('[data-ir]'))) {
      var ir = b.getAttribute('data-ir'); S.tab = ir; pintarPanel();
      var s0 = sAbierta();
      if (ir === 'presupuestos' && !presDe(s0.id).length) abrirEditor(null);
      if (ir === 'pagos' && aceptadoDe(s0.id)) {
        var activo = function (tipo) { return pagosDe(s0.id).some(function (p) { return p.tipo === tipo && p.situacion !== 'anulado'; }); };
        if (!activo('senal')) pedirPago('senal');
        else if (s0.estado === 'confirmada' && !activo('saldo')) pedirPago('saldo');
      }
      return;
    }
    if ((b = t.closest('[data-pre]'))) return accionPresupuesto(b.getAttribute('data-pre'), b.getAttribute('data-id'));
    if ((b = t.closest('[data-nivel]'))) return cambiarNivel(b.getAttribute('data-nivel'));
    if ((b = t.closest('[data-ses]'))) {
      var sx = S.ses.filter(function (q) { return q.id === b.getAttribute('data-id'); })[0], qa = b.getAttribute('data-ses');
      if (qa === 'editar') return dlgSesion(sx, false);
      if (qa === 'duplicar') return dlgSesion(sx, true);
      if (!await confirmar({ titulo: 'Borrar la sesión', texto: fCorta(sx.fecha) + ' · ' + hh(sx) + ' · ' + RECURSOS[sx.recurso], peligro: true, confirmar: 'Borrar' })) return;
      var rds = await sb.from('camp_sesiones').delete().eq('id', sx.id); if (rds.error) return fallo(rds.error); toast('Sesión borrada'); return refrescar();
    }
    if ((b = t.closest('[data-pago]'))) return accionPago(b.getAttribute('data-pago'), b.getAttribute('data-id'));
    if ((b = t.closest('[data-quitar]'))) { S.editor.lineas.splice(+b.getAttribute('data-quitar'), 1); return pintarEditor(); }
    if ((b = t.closest('[data-borrar-tarea]'))) {
      ev.preventDefault();
      var rb = await sb.from('camp_tareas').delete().eq('id', b.getAttribute('data-borrar-tarea')); if (rb.error) return fallo(rb.error); return refrescar();
    }
    if ((b = t.closest('[data-arch]'))) {
      var a = S.arch.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
      if (b.getAttribute('data-arch') === 'ver') {
        var su = await sb.storage.from('training-camps').createSignedUrl(a.ruta, 300); if (su.error) return fallo(su.error); window.open(su.data.signedUrl, '_blank', 'noopener'); return;
      }
      if (!await confirmar({ titulo: 'Borrar archivo', texto: a.nombre, peligro: true })) return;
      await sb.storage.from('training-camps').remove([a.ruta]);
      var rd = await sb.from('camp_archivos').delete().eq('id', a.id); if (rd.error) return fallo(rd.error); toast('Borrado'); return refrescar();
    }
    if ((b = t.closest('[data-acc]'))) {
      var acc = b.getAttribute('data-acc');
      if (acc === 'editar') return editarDatos();
      if (acc === 'pre-nuevo') return abrirEditor(null);
      if (acc === 'ed-volver') { S.editor = null; S.tab = 'presupuestos'; return pintarPanel(); }
      if (acc === 'ed-linea') { S.editor.lineas.push({ categoria: $('tc-ed-cat').value, descripcion: '', detalle: '', cantidad: 1, unidad: '', precio: '', iva: (S.cfg && S.cfg.impuesto_defecto != null) ? Number(S.cfg.impuesto_defecto) : 21, coste: '' }); pintarEditor(); var ls = document.querySelectorAll('.tc-lin [data-k="descripcion"]'); if (ls.length) ls[ls.length - 1].focus(); return; }
      if (acc === 'ed-guardar') return guardarEditor(false);
      if (acc === 'ed-pdf') return guardarEditor(true);
      if (acc === 'pedir-senal') return pedirPago('senal');
      if (acc === 'pedir-saldo') return pedirPago('saldo');
      if (acc === 'pedir-otro') return pedirPago('otro');
      if (acc === 'ses-nueva') return dlgSesion(null, false);
      if (acc === 'ses-proponer') {
        var sp0 = sAbierta(), filas = proponerSesiones(sp0);
        if (!filas.length) return toast('Con los días y franjas que pidieron no sale ninguna sesión: añádelas a mano.', 'error');
        if (!await confirmar({ titulo: 'Proponer ' + filas.length + ' sesiones', texto: 'Una por día y franja que pidieron, en pista y con todo el grupo, empezando al abrir la franja. Luego ajustas horas, zonas, subgrupos y El Cubo.', confirmar: 'Proponer' })) return;
        var rpp = await sb.from('camp_sesiones').insert(filas); if (rpp.error) return fallo(rpp.error);
        toast(filas.length + ' sesiones propuestas'); return refrescar();
      }
      if (acc === 'dispo-si') return disponibilidad(true);
      if (acc === 'dispo-no') return disponibilidad(false);
      if (acc === 'borrar-prueba') {
        var sp = sAbierta();
        if (!await confirmar({ titulo: 'Borrar ' + sp.codigo, texto: 'Se borra del todo, con sus presupuestos, pagos pendientes, seguimiento y archivos. Solo para expedientes de prueba sin cobros.', peligro: true, confirmar: 'Borrar' })) return;
        if (S.arch.length) await sb.storage.from('training-camps').remove(S.arch.map(function (x) { return x.ruta; }));
        var rbp = await sb.rpc('camp_borrar_prueba', { p_id: sp.id });
        if (rbp.error) return fallo(rbp.error);
        toast(sp.codigo + ' borrado'); cerrarPanel(); await cargar(); pintar(); return;
      }
    }
  });
  $('tc-p-cuerpo').addEventListener('change', async function (ev) {
    var t = ev.target;
    if (t.matches('[data-tarea]')) {
      var r = await sb.from('camp_tareas').update(t.checked ? { hecha_en: new Date().toISOString() } : { hecha_en: null, hecha_por: null }).eq('id', t.getAttribute('data-tarea'));
      if (r.error) return fallo(r.error); return refrescar();
    }
    if (t.matches('[data-acc="prueba"]')) {
      var r2_ = await sb.from('camp_solicitudes').update({ es_prueba: t.checked }).eq('id', S.abierto); if (r2_.error) return fallo(r2_.error); toast('Guardado'); return refrescar();
    }
    if (t.id === 'tc-arch') {
      var fs = Array.prototype.slice.call(t.files || []), s = sAbierta();
      for (var i = 0; i < fs.length; i++) {
        var f = fs[i]; if (f.size > 25 * 1024 * 1024) { toast(f.name + ': pasa de 25 MB', 'error'); continue; }
        var limpio = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);
        var ruta = s.id + '/' + Date.now() + '-' + limpio;
        var up = await sb.storage.from('training-camps').upload(ruta, f, { contentType: f.type || 'application/octet-stream' });
        if (up.error) { fallo(up.error); continue; }
        var ri = await sb.from('camp_archivos').insert({ solicitud_id: s.id, ruta: ruta, nombre: f.name, mime: f.type || null, tamano: f.size });
        if (ri.error) fallo(ri.error);
      }
      toast('Archivos adjuntados'); return refrescar();
    }
    if (t.form && t.form.id === 'tc-reg-form' && t.name === 'tipo') { $('tc-reg-com').hidden = t.value !== 'comunicacion'; }
  });
  $('tc-p-cuerpo').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var f = ev.target, s = sAbierta(), r;
    if (f.id === 'tc-reg-form') {
      if (!f.texto.value.trim()) return toast('Escribe algo.', 'error');
      var com = f.tipo.value === 'comunicacion';
      r = await sb.from('camp_registro').insert({ solicitud_id: s.id, tipo: f.tipo.value, canal: com ? f.canal.value : null, sentido: com ? f.sentido.value : null, texto: f.texto.value.trim() });
      if (r.error) return fallo(r.error); toast('Anotado'); return refrescar();
    }
    if (f.id === 'tc-tarea-form') {
      if (!f.texto.value.trim()) return toast('Escribe la tarea.', 'error');
      r = await sb.from('camp_tareas').insert({ solicitud_id: s.id, texto: f.texto.value.trim(), vence: f.vence.value || null });
      if (r.error) return fallo(r.error); toast('Tarea añadida'); return refrescar();
    }
  });

  /* ---------------- arranque ---------------- */
  (async function () {
    if (!await cargar()) return;
    montar(); pintar();
    var id = qs.get('id');
    if (id) { var tab = qs.get('tab'); abrir(id, tab); }
  })();
});
</script>
</body>
</html>
