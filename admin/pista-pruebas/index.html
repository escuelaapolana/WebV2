<style>
  /* ============================================================
     PRUEBAS DE PISTA · lista en tarjetas (23-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios»: cabecera grande, cifras que
     filtran, buscador + chips, una tarjeta por solicitud con la
     franja de color de su estado, y una hoja inferior para
     llamar, escribir por WhatsApp y cambiar el estado. Lo único
     que se guarda sigue siendo el estado (pista_pruebas.estado).
     Prefijo pp-.
     ============================================================ */
  /* Necesario para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .pp-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .pp-wrap *, .pp-capa * { box-sizing: border-box; }
  .pp-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; line-height: 1; }
  .pp-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 70ch; }
  .pp-cab a { color: var(--azul-oscuro,#2A5E8C); }

  /* --- Cifras: pulsar una filtra la lista --- */
  .pp-cifras { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 18px 0 6px; }
  .pp-cifra { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .pp-cifra:hover { border-color: var(--linea-borde,#C9C0AE); }
  .pp-cifra:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .pp-cifra b { display: block; font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .pp-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .pp-cifra.nueva b { color: #2F6FA8; } .pp-cifra.convertido b { color: #3E7A34; } .pp-cifra.descartado b { color: #8A816E; }
  .pp-cifra.aviso { background: #FBF1DE; border-color: #E9CE9A; }
  .pp-cifra.aviso b, .pp-cifra.aviso span { color: #8A5307; }
  .pp-cifra.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  @media (max-width: 620px) { .pp-cifras { grid-template-columns: repeat(2, minmax(0,1fr)); } .pp-cifra b { font-size: 21px; } }

  /* --- Buscador + chips --- */
  .pp-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 4px; }
  .pp-buscar { flex: 1 1 260px; min-width: 0; min-height: 48px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; background: #fff; color: var(--navy,#26374B); }
  .pp-buscar:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .pp-chips { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .pp-chips::-webkit-scrollbar { display: none; }
  .pp-chips button { flex: 1 0 auto; min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px; background: none; font: inherit; font-weight: 700;
    font-size: 13.5px; color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .pp-chips button:hover { color: var(--navy,#26374B); }
  .pp-chips button.on { background: var(--navy,#26374B); color: #fff; }
  .pp-cuenta { display: block; font-size: 13px; color: var(--texto-suave,#6E6656); margin: 4px 2px 0; min-height: 20px; }
  @media (max-width: 620px) { .pp-chips { width: 100%; border-radius: 14px; } }

  /* --- Fila-tarjeta: toda ella abre la hoja --- */
  .pp-lista { container: pp-lista / inline-size; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .pp-fila { position: relative; display: grid; grid-template-columns: 40px minmax(0,1.6fr) 120px minmax(0,1fr) 150px 14px; gap: 0 14px; align-items: center;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid #CFC6B4; border-radius: 14px; padding: 10px 14px 10px 12px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .pp-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .pp-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .pp-fila.nueva { border-left-color: #3B85C0; }
  .pp-fila.contactado { border-left-color: #D9A441; }
  .pp-fila.convertido { border-left-color: #6FAF7E; }
  .pp-fila.descartado { border-left-color: #CFC6B4; background: #FCFBF8; }
  .pp-fila.descartado .pp-per b { color: var(--texto-suave,#6E6656); }
  .pp-ini { width: 40px; height: 40px; border-radius: 999px; background: #EAF2FA; color: var(--azul-oscuro,#2A5E8C); display: flex; align-items: center;
    justify-content: center; font-family: var(--fuente-titulo); font-weight: 700; font-size: 14px; }
  .pp-fila.descartado .pp-ini { background: #F0EBE0; color: #8A816E; }
  .pp-per { min-width: 0; }
  .pp-per b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .pp-per small { display: block; font-size: 13px; color: var(--texto-tenue,#9A927F); margin-top: 1px; }
  .pp-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 3px 10px 3px 9px; border-radius: 999px;
    background: #F0EBE0; color: #6E6656; white-space: nowrap; justify-self: start; }
  .pp-pill .pt { width: 7px; height: 7px; border-radius: 999px; background: #9A927F; flex: 0 0 7px; }
  .pp-pill.nueva { background: #E6F0FB; color: #2F6FA8; } .pp-pill.nueva .pt { background: #3B85C0; }
  .pp-pill.contactado { background: #FBF1D9; color: #8A5307; } .pp-pill.contactado .pt { background: #D9A441; }
  .pp-pill.convertido { background: #E7F3EA; color: #23603A; } .pp-pill.convertido .pt { background: #3E7A34; }
  .pp-dia { font-size: 13.5px; color: var(--texto-suave,#6E6656); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pp-tel { position: relative; z-index: 1; justify-self: start; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 10px;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; color: var(--azul-oscuro,#1E4E78); text-decoration: none; font-size: 13.5px;
    font-variant-numeric: tabular-nums; background: #fff; white-space: nowrap; }
  .pp-tel:hover { background: #F2F7FC; border-color: #CFE2F1; }
  .pp-tel svg { width: 15px; height: 15px; flex: 0 0 15px; }
  .pp-tel.sin { color: var(--texto-tenue,#9A927F); border-style: dashed; cursor: default; }
  .pp-flecha { color: #B5AC99; font-size: 20px; line-height: 1; text-align: right; }
  .pp-cab-cols { display: grid; grid-template-columns: 40px minmax(0,1.6fr) 120px minmax(0,1fr) 150px 14px; gap: 0 14px; padding: 12px 14px 0 16px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-tenue,#9A927F); }
  @container pp-lista (max-width: 640px) {
    .pp-fila { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 11px 12px 12px 10px; }
    .pp-ini { order: 0; flex: 0 0 40px; }
    .pp-per { order: 1; flex: 1 1 0; }
    .pp-flecha { order: 2; font-size: 22px; }
    .pp-fila::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
    .pp-pill { order: 4; }
    .pp-dia { order: 5; align-self: center; flex: 1 1 0; min-width: 0; }
    .pp-tel { order: 6; margin-left: auto; }
    .pp-tel.sin { display: none; }
  }
  @media (max-width: 700px) { .pp-cab-cols { display: none; } }
  .pp-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE); border-radius: 14px; margin-top: 10px; line-height: 1.5; }
  .pp-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }
  .pp-vacio button { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linea-borde,#C9C0AE); background: #fff;
    font: inherit; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; }

  /* --- Hoja inferior --- */
  .pp-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .pp-velo.ver { opacity: 1; pointer-events: auto; }
  .pp-hoja { position: fixed; left: 50%; bottom: 0; width: min(560px,100%); transform: translate(-50%,105%); z-index: 9001; background: #fff; color: var(--navy,#26374B);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transition: transform .25s ease; max-height: 92vh; overflow: auto;
    overscroll-behavior: contain; box-shadow: 0 -10px 40px rgba(20,30,45,.25); visibility: hidden; }
  .pp-hoja.ver { transform: translate(-50%,0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .pp-hoja, .pp-velo, .pp-fila { transition: none; } }
  .pp-hoja .asa { width: 42px; height: 5px; border-radius: 9px; background: #DDD5C4; margin: 2px auto 12px; }
  .pp-hoja-cab { display: flex; align-items: center; gap: 12px; }
  .pp-hoja-cab .pp-ini { width: 48px; height: 48px; flex: 0 0 48px; font-size: 16px; }
  .pp-hoja-cab > div { flex: 1; min-width: 0; }
  .pp-hoja h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
  .pp-hoja .sub { color: var(--texto-suave,#6E6656); font-size: 13.5px; margin: 3px 0 0; }
  .pp-cerrar { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 20px; line-height: 1; cursor: pointer; }
  .pp-datos { margin: 14px 0 4px; background: var(--crema,#FBF9F4); border-radius: 14px; padding: 4px 14px; }
  .pp-datos div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; }
  .pp-datos div:last-child { border-bottom: 0; }
  .pp-datos span { color: var(--texto-suave,#6E6656); flex: 0 0 auto; }
  .pp-datos b { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .pp-et { margin: 16px 2px 8px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave,#6E6656); }
  .pp-estados { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
  .pp-estados button { min-height: 46px; border-radius: 12px; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff; font: inherit; font-size: 13.5px;
    font-weight: 700; color: var(--navy,#26374B); cursor: pointer; padding: 4px 6px; line-height: 1.15; }
  .pp-estados button:hover { background: var(--crema,#FBF9F4); }
  .pp-estados button[aria-pressed="true"] { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }
  .pp-estados button[aria-pressed="true"].e-nueva { background: #2F6FA8; border-color: #2F6FA8; }
  .pp-estados button[aria-pressed="true"].e-contactado { background: #A86A10; border-color: #A86A10; }
  .pp-estados button[aria-pressed="true"].e-convertido { background: #2F7A45; border-color: #2F7A45; }
  .pp-estados button[aria-pressed="true"].e-descartado { background: #8A816E; border-color: #8A816E; }
  .pp-estados button:disabled { opacity: .6; cursor: wait; }
  @media (max-width: 400px) { .pp-estados { grid-template-columns: 1fr 1fr; } }
  .pp-acc { display: grid; gap: 8px; margin-top: 14px; }
  .pp-acc a { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; font-weight: 700; font-size: 15px;
    text-decoration: none; border: 1px solid var(--linea-marcada,#E4DCCB); color: var(--navy,#26374B); background: #fff; }
  .pp-acc a:hover { background: var(--crema,#FBF9F4); }
  .pp-acc a.wa { background: #1F8F4E; border-color: #1F8F4E; color: #fff; }
  .pp-acc a.wa:hover { background: #187A41; }
  .pp-acc .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pp-acc svg { width: 17px; height: 17px; }
  .pp-ayuda { margin: 12px 2px 0; font-size: 13px; color: var(--texto-suave,#6E6656); line-height: 1.45; }
  .pp-ayuda a { color: var(--azul-oscuro,#2A5E8C); }
</style>
</head>
<body class="adm-piel">

<div class="admin-wrap">
  <div class="pp-wrap" id="pp">
    <div class="pp-cab"><h1>Pruebas de pista</h1><p>Cargando…</p></div>
  </div>
</div>

<!-- ===== HOJA DE LA SOLICITUD (se abre al tocar una fila) ===== -->
<div class="pp-capa">
  <div class="pp-velo" id="pp-velo"></div>
  <div class="pp-hoja" id="pp-hoja" role="dialog" aria-modal="true" aria-labelledby="pp-h-nombre">
    <div class="asa" aria-hidden="true"></div>
    <div class="pp-hoja-cab">
      <span class="pp-ini" id="pp-h-ini"></span>
      <div><h3 id="pp-h-nombre"></h3><p class="sub" id="pp-h-sub"></p></div>
      <button type="button" class="pp-cerrar" id="pp-h-cerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="pp-datos" id="pp-h-datos"></div>
    <p class="pp-et">¿En qué punto va?</p>
    <div class="pp-estados" id="pp-h-estados" role="group" aria-label="Estado"></div>
    <div class="pp-acc" id="pp-h-acc"></div>
    <p class="pp-ayuda">Cuando decida quedarse, pásale el <a href="../../socio/alta/" target="_blank" rel="noopener">formulario de socio</a> (eso le crea la cuenta) y ya le puedes abrir el cobro.</p>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var EST = [['nueva','Nuevas'],['contactado','Contactados'],['convertido','Se quedan'],['descartado','Descartados']];
  var ESTXT = { nueva:'Nueva', contactado:'Contactado', convertido:'Se queda', descartado:'Descartado' };
  var LEADS = [], filtro = 'activos', montado = false;

  var ICO_TEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICO_WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

  function iniciales(n) {
    var p = String(n || '').trim().split(/\s+/).filter(function (w) { return /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(w); });
    return ((p[0] ? p[0][0] : '') + (p[1] ? p[1][0] : '')).toUpperCase() || '·';
  }
  // Teléfono → número para wa.me (solo dígitos, con prefijo país; España por defecto). Igual que en «Altas del Cubo».
  function waNum(tel) { var t = String(tel || '').replace(/[^\d+]/g, ''); if (t.charAt(0) === '+') t = t.slice(1); else if (t.slice(0, 2) === '00') t = t.slice(2); else if (t.length === 9) t = '34' + t; return t; }
  function fechaCorta(s) {
    if (!s) return '';
    try { return new Date(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); } catch (e) { return ''; }
  }
  function esActivo(a) { return a.estado === 'nueva' || a.estado === 'contactado'; }
  function cuenta(e) { return LEADS.filter(function (a) { return a.estado === e; }).length; }

  async function cargar() {
    var r = await sb.from('pista_pruebas').select('*').order('created_at', { ascending: false });
    if (r.error) {
      $('pp').innerHTML = '<div class="pp-cab"><h1>Pruebas de pista</h1></div>' + ADM.error(r.error.message, cargar);
      montado = false; return;
    }
    LEADS = r.data || [];
    if (!montado) montar(); else { pintarCifras(); pintarLista(); }
  }

  function visibles() {
    var q = ($('pp-buscar').value || '').trim().toLowerCase();
    return LEADS.filter(function (a) {
      if (filtro === 'activos' && !esActivo(a)) return false;
      if (filtro !== 'activos' && filtro !== 'todos' && a.estado !== filtro) return false;
      if (q && ((a.nombre || '') + ' ' + (a.telefono || '') + ' ' + (a.tutor || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function subDe(a) {
    var partes = [];
    if (a.es_menor) partes.push('Peque' + (a.edad ? ' · ' + a.edad + ' años' : '') + (a.tutor ? ' · tutor: ' + a.tutor : ''));
    else if (a.edad) partes.push(a.edad + ' años');
    if (a.created_at) partes.push('pidió el ' + fechaCorta(a.created_at));
    return partes.join(' · ');
  }

  function filaHtml(a) {
    var e = a.estado || 'nueva';
    var sub = subDe(a);
    return '<div class="pp-fila ' + esc(e) + '" tabindex="0" data-id="' + esc(a.id) + '" aria-label="' + esc(a.nombre || 'Solicitud') + ': ver qué hacer">' +
      '<span class="pp-ini">' + esc(iniciales(a.nombre)) + '</span>' +
      '<span class="pp-per"><b>' + esc(a.nombre || '—') + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
      '<span class="pp-pill ' + esc(e) + '"><span class="pt"></span>' + esc(ESTXT[e] || e) + '</span>' +
      '<span class="pp-dia" title="Día que prefiere">' + esc(a.dia_preferido || 'sin día elegido') + '</span>' +
      (a.telefono
        ? '<a class="pp-tel" href="tel:' + esc(String(a.telefono).replace(/\s+/g, '')) + '" aria-label="Llamar a ' + esc(a.nombre || '') + '">' + ICO_TEL + esc(a.telefono) + '</a>'
        : '<span class="pp-tel sin">sin teléfono</span>') +
      '<span class="pp-flecha" aria-hidden="true">›</span>' +
    '</div>';
  }

  function pintarCifras() {
    var activos = LEADS.filter(esActivo).length;
    var nuevas = cuenta('nueva');
    $('pp-cifras').innerHTML =
      '<button type="button" class="pp-cifra nueva' + (nuevas ? ' aviso' : '') + '" data-f="nueva"><b>' + nuevas + '</b><span>' + (nuevas === 1 ? 'nueva sin contestar' : 'nuevas sin contestar') + '</span></button>' +
      '<button type="button" class="pp-cifra" data-f="contactado"><b>' + cuenta('contactado') + '</b><span>contactados</span></button>' +
      '<button type="button" class="pp-cifra convertido" data-f="convertido"><b>' + cuenta('convertido') + '</b><span>se quedan</span></button>' +
      '<button type="button" class="pp-cifra descartado" data-f="descartado"><b>' + cuenta('descartado') + '</b><span>descartados</span></button>';
    var chips = [['activos', 'En curso', activos]].concat(EST.map(function (e) { return [e[0], e[1], cuenta(e[0])]; }));
    chips.push(['todos', 'Todas', LEADS.length]);
    $('pp-chips').innerHTML = chips.map(function (c) {
      return '<button type="button" data-f="' + esc(c[0]) + '">' + esc(c[1]) + (c[2] ? ' · ' + c[2] : '') + '</button>';
    }).join('');
  }

  function pintarLista() {
    Array.prototype.forEach.call(document.querySelectorAll('#pp-chips button'), function (b) {
      var on = b.getAttribute('data-f') === filtro;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pp-cifra[data-f]'), function (c) {
      c.classList.toggle('on', c.getAttribute('data-f') === filtro);
    });
    var lista = visibles();
    var q = ($('pp-buscar').value || '').trim();
    $('pp-cuenta').textContent = lista.length === LEADS.length
      ? LEADS.length + (LEADS.length === 1 ? ' solicitud' : ' solicitudes')
      : lista.length + ' de ' + LEADS.length + (LEADS.length === 1 ? ' solicitud' : ' solicitudes');
    if (!LEADS.length) {
      $('pp-lista').innerHTML = '<div class="pp-vacio"><b>Todavía no ha pedido nadie venir a probar</b>Cuando alguien rellene el formulario de prueba de pista, aparecerá aquí.</div>';
      return;
    }
    if (!lista.length) {
      $('pp-lista').innerHTML = '<div class="pp-vacio"><b>Nada con este filtro</b>' +
        (filtro === 'activos' && !q ? 'No queda ninguna solicitud en curso: están todas contestadas.' : 'Prueba con otro estado o quita la búsqueda.') +
        '<br><button type="button" data-limpiar>Ver todas</button></div>';
      return;
    }
    $('pp-lista').innerHTML =
      '<div class="pp-cab-cols" aria-hidden="true"><span></span><span>Quién</span><span>Estado</span><span>Día que prefiere</span><span>Contacto</span><span></span></div>' +
      '<div class="pp-lista">' + lista.map(filaHtml).join('') + '</div>';
  }

  function montar() {
    montado = true;
    $('pp').innerHTML =
      '<div class="pp-cab"><h1>Pruebas de pista</h1><p>Quien pide venir a <b>probar</b> el atletismo en pista (formulario: <a href="../../pista/probar/" target="_blank" rel="noopener">/pista/probar/</a>). Escríbeles para citarles un día y marca en qué punto va cada uno. Toca una solicitud para llamar, escribir por WhatsApp o cambiar su estado.</p></div>' +
      '<div class="pp-cifras" id="pp-cifras"></div>' +
      '<div class="pp-filtros">' +
        '<input type="search" class="pp-buscar" id="pp-buscar" placeholder="Buscar por nombre, teléfono o tutor…" aria-label="Buscar solicitud" autocomplete="off">' +
        '<div class="pp-chips" id="pp-chips" role="group" aria-label="Estado"></div>' +
      '</div>' +
      '<span class="pp-cuenta" id="pp-cuenta" aria-live="polite"></span>' +
      '<div id="pp-lista"></div>';

    $('pp-buscar').addEventListener('input', pintarLista);
    $('pp').addEventListener('click', function (ev) {
      var f = ev.target.closest('[data-f]');
      if (f && (f.closest('#pp-chips') || f.classList.contains('pp-cifra'))) {
        var v = f.getAttribute('data-f');
        /* Pulsar la cifra que ya filtra la quita (vuelve a «En curso»). */
        filtro = (f.classList.contains('pp-cifra') && filtro === v) ? 'activos' : v;
        pintarLista(); return;
      }
      if (ev.target.closest('[data-limpiar]')) { filtro = 'todos'; $('pp-buscar').value = ''; pintarLista(); return; }
      if (ev.target.closest('a')) return;          // el teléfono llama, no abre la hoja
      var fila = ev.target.closest('.pp-fila[data-id]');
      if (fila) abrirHoja(fila.getAttribute('data-id'), fila);
    });
    $('pp').addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var fila = ev.target.closest && ev.target.closest('.pp-fila[data-id]');
      if (!fila || ev.target !== fila) return;
      ev.preventDefault(); abrirHoja(fila.getAttribute('data-id'), fila);
    });
    pintarCifras();
    pintarLista();
  }

  /* ---------- hoja de la solicitud ---------- */
  var focoPrevio = null, abiertaId = null;
  function pintarHoja() {
    var a = LEADS.filter(function (x) { return x.id === abiertaId; })[0];
    if (!a) return;
    $('pp-h-ini').textContent = iniciales(a.nombre);
    $('pp-h-nombre').textContent = a.nombre || 'Sin nombre';
    $('pp-h-sub').textContent = (a.es_menor ? 'Peque' + (a.edad ? ' · ' + a.edad + ' años' : '') : (a.edad ? a.edad + ' años' : 'Adulto')) +
      (a.created_at ? ' · pidió el ' + fechaCorta(a.created_at) : '');
    function par(k, v) { return '<div><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }
    $('pp-h-datos').innerHTML =
      par('Teléfono', a.telefono || '—') +
      (a.es_menor ? par('Tutor', a.tutor || '—') : '') +
      par('Día que prefiere', a.dia_preferido || '—') +
      (a.nota ? par('Nota', a.nota) : '');
    $('pp-h-estados').innerHTML = EST.map(function (e) {
      return '<button type="button" class="e-' + e[0] + '" data-estado="' + e[0] + '" aria-pressed="' + (a.estado === e[0] ? 'true' : 'false') + '">' + esc(ESTXT[e[0]]) + '</button>';
    }).join('');
    var tel = a.telefono ? String(a.telefono).replace(/\s+/g, '') : '';
    $('pp-h-acc').innerHTML = tel
      ? '<a class="wa" href="https://wa.me/' + esc(waNum(tel)) + '" target="_blank" rel="noopener">' + ICO_WA + 'Escribir por WhatsApp</a>' +
        '<a href="tel:' + esc(tel) + '">' + ICO_TEL + 'Llamar</a>'
      : '';
  }
  function abrirHoja(id, desde) {
    abiertaId = id;
    focoPrevio = desde || document.activeElement;
    pintarHoja();
    $('pp-velo').classList.add('ver'); $('pp-hoja').classList.add('ver');
    setTimeout(function () { $('pp-h-cerrar').focus(); }, 60);
  }
  function cerrarHoja() {
    if (!$('pp-hoja').classList.contains('ver')) return;
    $('pp-velo').classList.remove('ver'); $('pp-hoja').classList.remove('ver');
    abiertaId = null;
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) focoPrevio.focus();
  }
  $('pp-velo').addEventListener('click', cerrarHoja);
  $('pp-h-cerrar').addEventListener('click', cerrarHoja);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') cerrarHoja(); });

  // Cambiar el estado: lo mismo que guardaba el desplegable de antes.
  $('pp-h-estados').addEventListener('click', async function (ev) {
    var b = ev.target.closest('button[data-estado]');
    if (!b || !abiertaId) return;
    var id = abiertaId, nuevo = b.getAttribute('data-estado');
    var a = LEADS.filter(function (x) { return x.id === id; })[0];
    if (!a || a.estado === nuevo) return;
    var botones = $('pp-h-estados').querySelectorAll('button');
    Array.prototype.forEach.call(botones, function (x) { x.disabled = true; });
    var r = await sb.from('pista_pruebas').update({ estado: nuevo }).eq('id', id);
    Array.prototype.forEach.call(botones, function (x) { x.disabled = false; });
    if (r.error) { if (window.apoToast) apoToast('No se pudo guardar: ' + r.error.message, 'error'); else alert('No se pudo guardar.'); return; }
    a.estado = nuevo;
    pintarHoja(); pintarCifras(); pintarLista();
    if (window.apoToast) apoToast('Estado: ' + (ESTXT[nuevo] || nuevo), 'ok');
  });

  cargar();
});
</script>
</body>
</html>
