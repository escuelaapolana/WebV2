<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas de pista · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }
  .cp-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(26px,5vw,34px); color: var(--navy); margin: 0 0 4px; }
  .cp-cab p { font-size: 15px; color: var(--texto-suave); margin: 0 0 20px; max-width: 64ch; line-height: 1.6; }
  .cp-cab a { color: var(--azul-oscuro, #2F6FA8); }

  .pp-chips { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
  .pp-chip { border: 1px solid var(--linea-borde, #D8CFBC); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600; color: var(--navy); cursor: pointer; }
  .pp-chip b { font-family: var(--fuente-dato, monospace); margin-left: 5px; opacity: .8; }
  .pp-chip.on { background: var(--navy, #26374B); border-color: var(--navy, #26374B); color: #fff; }
  .pp-chip.on.c-nueva { background:#2F6FA8; border-color:#2F6FA8; }
  .pp-chip.on.c-convertido { background:#1E7A3D; border-color:#1E7A3D; }
  .pp-chip.on.c-descartado { background:#8A816E; border-color:#8A816E; }

  .cp-buscar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cp-buscar input { flex: 1 1 240px; max-width: 340px; box-sizing: border-box; min-height: 44px; padding: 10px 14px; border: 1px solid var(--linea-borde); border-radius: 999px; background: #fff; font-family: inherit; font-size: 15px; color: var(--navy); }
  .cp-buscar .cuenta { margin-left: auto; font-family: var(--fuente-dato); font-size: 14px; color: var(--texto-suave); }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--linea); font-size: 14px; vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: var(--texto-suave); background: var(--crema, #FBF9F4); }
  tr:last-child td { border-bottom: 0; }
  .cp-tel a { color: var(--azul-oscuro, #2F6FA8); text-decoration: none; }
  .cp-alt { color: var(--texto-suave); font-size: 13px; }
  .pill { display:inline-block; font-size:12px; border-radius:999px; padding:2px 9px; background:#fdf0e0; color:#B96F09; }
  .pp-est { min-height:40px; border-radius:9px; padding:7px 10px; border:1px solid var(--linea-borde,#D8CFBC); background:#fff; font:inherit; font-size:13.5px; color:var(--navy); cursor:pointer; }
  .est-tag { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:2px 10px; }
  .est-nueva { background:#e6f0fb; color:#2F6FA8; }
  .est-contactado { background:#FBF1D9; color:#8A5307; }
  .est-convertido { background:#E3F2E8; color:#1E7A3D; }
  .est-descartado { background:#EFE9DA; color:#8A816E; }
</style>
</head>
<body class="adm-piel">
<div class="admin-wrap">
  <div class="cp-cab">
    <h1>Pruebas de pista</h1>
    <p>Quien pide venir a <b>probar</b> el atletismo en pista (formulario: <a href="../../pista/probar/" target="_blank">/pista/probar/</a>). Escríbeles para citarles un día. Cuando decidan quedarse, pásales el <a href="../../socio/alta/" target="_blank">formulario de socio</a> (eso les crea la cuenta) y ya les puedes abrir el cobro. Marca aquí en qué punto va cada uno.</p>
  </div>
  <div class="pp-chips" id="chips"></div>
  <div class="cp-buscar">
    <input type="search" id="buscar" placeholder="Buscar por nombre o teléfono…" aria-label="Buscar">
    <span class="cuenta" id="cuenta"></span>
  </div>
  <div id="lista"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var EST = [['nueva','Nuevas'],['contactado','Contactados'],['convertido','Se quedan'],['descartado','Descartados']];
  var ESTXT = { nueva:'Nueva', contactado:'Contactado', convertido:'Se queda', descartado:'Descartado' };
  var LEADS = [], filtro = 'activos';

  async function cargar() {
    var r = await sb.from('pista_pruebas').select('*').order('created_at', { ascending: false });
    if (r.error) { $('lista').innerHTML = ADM.error(r.error.message, cargar); return; }
    LEADS = r.data || [];
    pintarChips();
    pintar();
  }

  function cuenta(e) { return LEADS.filter(function (a) { return a.estado === e; }).length; }
  function pintarChips() {
    var activos = LEADS.filter(function (a) { return a.estado === 'nueva' || a.estado === 'contactado'; }).length;
    var chips = [['activos','En curso', activos]].concat(EST.map(function (e) { return [e[0], e[1], cuenta(e[0])]; }));
    chips.push(['todos','Todos', LEADS.length]);
    $('chips').innerHTML = chips.map(function (c) {
      return '<button type="button" class="pp-chip c-' + esc(c[0]) + (filtro === c[0] ? ' on' : '') + '" data-f="' + esc(c[0]) + '">' + esc(c[1]) + ' <b>' + c[2] + '</b></button>';
    }).join('');
  }

  function visibles() {
    var q = ($('buscar').value || '').trim().toLowerCase();
    return LEADS.filter(function (a) {
      if (filtro === 'activos' && !(a.estado === 'nueva' || a.estado === 'contactado')) return false;
      if (filtro !== 'activos' && filtro !== 'todos' && a.estado !== filtro) return false;
      if (q && ((a.nombre || '') + ' ' + (a.telefono || '') + ' ' + (a.tutor || '')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function pintar() {
    var lista = visibles();
    $('cuenta').textContent = lista.length === LEADS.length
      ? LEADS.length + (LEADS.length === 1 ? ' solicitud' : ' solicitudes')
      : lista.length + ' de ' + LEADS.length;
    if (!LEADS.length) { $('lista').innerHTML = ADM.vacio('Todavía no hay solicitudes', 'Cuando alguien rellene el formulario de prueba de pista, aparecerá aquí.', ''); return; }
    if (!lista.length) { $('lista').innerHTML = ADM.vacio('Nada con este filtro', 'Prueba con otro estado o quita la búsqueda.', ''); return; }

    $('lista').innerHTML = '<table><thead><tr><th>Persona</th><th>Teléfono</th><th>Día</th><th>Nota</th><th>Estado</th></tr></thead><tbody>' +
      lista.map(function (a) {
        var quien = '<b>' + esc(a.nombre || '—') + '</b>' +
          (a.es_menor ? '<div class="cp-alt"><span class="pill">Peque' + (a.edad ? ' · ' + a.edad + ' años' : '') + '</span>' + (a.tutor ? ' tutor: ' + esc(a.tutor) : '') + '</div>' : '');
        var opc = EST.map(function (e) { return '<option value="' + e[0] + '"' + (a.estado === e[0] ? ' selected' : '') + '>' + esc(ESTXT[e[0]]) + '</option>'; }).join('');
        return '<tr>' +
          '<td>' + quien + '</td>' +
          '<td class="cp-tel">' + (a.telefono ? '<a href="tel:' + esc(a.telefono) + '">' + esc(a.telefono) + '</a>' : '—') + '</td>' +
          '<td>' + esc(a.dia_preferido || '—') + '</td>' +
          '<td>' + (a.nota ? '<span class="cp-alt">' + esc(a.nota) + '</span>' : '—') + '</td>' +
          '<td><span class="est-tag est-' + esc(a.estado) + '" style="margin-bottom:6px">' + esc(ESTXT[a.estado] || a.estado) + '</span><br>' +
            '<select class="pp-est" data-id="' + esc(a.id) + '">' + opc + '</select></td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
  }

  $('chips').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.pp-chip[data-f]') : null;
    if (!b) return;
    filtro = b.getAttribute('data-f'); pintarChips(); pintar();
  });
  $('buscar').addEventListener('input', pintar);

  // Cambiar el estado de un lead.
  $('lista').addEventListener('change', async function (ev) {
    var s = ev.target.closest ? ev.target.closest('select.pp-est[data-id]') : null;
    if (!s) return;
    var id = s.getAttribute('data-id'), nuevo = s.value;
    s.disabled = true;
    var r = await sb.from('pista_pruebas').update({ estado: nuevo }).eq('id', id);
    s.disabled = false;
    if (r.error) { if (window.apoToast) apoToast('No se pudo guardar: ' + r.error.message, 'error'); else alert('No se pudo guardar.'); return; }
    LEADS.forEach(function (a) { if (a.id === id) a.estado = nuevo; });
    pintarChips(); pintar();
    if (window.apoToast) apoToast('Estado: ' + (ESTXT[nuevo] || nuevo), 'ok');
  });

  cargar();
});
</script>
</body>
</html>
