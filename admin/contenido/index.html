<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contenido de las páginas · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--linea-borde); border-radius: 10px;
    font-family: var(--fuente-texto); font-size: 15px; background: #fff; color: var(--navy);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul); border-color: var(--azul); }
  textarea { min-height: 100px; resize: vertical; }

  .msg { margin-top: 12px; font-size: 14px; }
  .msg.error { color: #B0563A; }
  .msg.ok { color: #1e7a3d; }

  .panel { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,30px); box-shadow: var(--sombra-suave); margin-bottom: 22px; }
  .panel h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 21px; color: var(--navy); margin-bottom: 4px; }
  .panel .intro { margin-bottom: 10px; }

  .aviso { background: var(--crema-media); border: 1px solid var(--linea); border-radius: 10px; padding: 12px 15px; font-size: 14px; color: var(--texto-suave); margin-bottom: 18px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); font-size: 14px; vertical-align: top; }
  th { font-size: 13px; text-transform: none; color: var(--texto-suave); }
  .acciones-fila { display: flex; gap: 8px; white-space: nowrap; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }

  .btn { cursor: pointer; }
  .btn--peligro { background: transparent; border: 1px solid #e0b4b0; color: #B0563A; padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .btn--peligro:hover { background: #fbeceb; }
  .btn--mini { padding: 8px 14px; font-size: 14px; }
  .oculto { display: none !important; }
  /* Edición en ventana emergente (modal), no al fondo de la página */
  #panel-form { position:fixed; inset:0; z-index:1000; background:rgba(46,66,86,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(16px,5vh,60px) 16px; overflow:auto; border:0; border-radius:0; box-shadow:none; margin:0;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #panel-form .modal-caja { background:#fff; border:1px solid var(--linea); border-radius: 14px;
    box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:24px; width:min(660px,100%);
    animation:modal-sube .2s ease; }
  @keyframes modal-sube { from{ transform:translateY(12px); opacity:.6; } to{ transform:none; opacity:1; } }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">

    <div class="aviso">Aquí se editan los textos, horarios y precios de cada sección. (Las páginas empezarán a leer de aquí en un paso siguiente.)</div>

    <div class="panel">
      <h2>Contenido de las páginas</h2>
      <p class="intro">Crea, edita o borra el contenido editable de cada sección de la web.</p>
      <div style="margin-bottom:14px;"><button class="btn btn--primario btn--mini" id="nuevo-contenido">+ Nueva sección</button></div>
      <div style="overflow-x:auto;">
        <table id="tabla-contenido">
          <thead><tr><th>Sección</th><th>Título</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Formulario (oculto hasta crear/editar) -->
    <div class="panel oculto" id="panel-form">
      <div class="modal-caja">
      <h2 id="form-titulo">Nueva sección</h2>
      <form id="form-contenido">
        <input type="hidden" id="c-id">
        <div class="grid2">
          <div>
            <label for="c-seccion">Sección</label>
            <input type="text" id="c-seccion" placeholder="competicion, running, natacion, triatlon, montana, cubo, escuela, campus…" required>
          </div>
          <div>
            <label for="c-titulo">Título</label>
            <input type="text" id="c-titulo">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="c-dirigido">Dirigido a</label>
            <input type="text" id="c-dirigido">
          </div>
          <div>
            <label for="c-horarios">Horarios</label>
            <input type="text" id="c-horarios">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="c-precio">Precio</label>
            <input type="text" id="c-precio">
          </div>
          <div>
            <label for="c-grupos">Grupos</label>
            <input type="text" id="c-grupos">
          </div>
        </div>
        <label for="c-descripcion">Descripción</label>
        <textarea id="c-descripcion"></textarea>
        <label for="c-puntos">Puntos destacados</label>
        <textarea id="c-puntos" placeholder="Un punto por línea"></textarea>
        <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
          <button class="btn btn--primario btn--mini" type="submit">Guardar</button>
          <button class="btn btn--fantasma btn--mini" type="button" id="cancelar">Cancelar</button>
          <span class="msg" id="msg-form"></span>
        </div>
      </form>
      </div>
    </div>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  // Nombre de la página tal y como se llama en la web (en la base se guarda el identificador)
  var NOMBRES = {
    'campus': 'Campus de verano', 'competicion': 'Atletismo en pista', 'cubo': 'El Cubo',
    'deporte-adaptado': 'Deporte adaptado', 'escuela': 'Escuela de atletismo',
    'escuela-municipal': 'Escuela municipal de atletismo', 'escuela-natacion': 'Escuela de natación',
    'instalaciones': 'Instalaciones', 'montana': 'Montaña', 'mun-atletismo': 'Atletismo municipal',
    'mun-triatlon': 'Triatlón municipal', 'natacion': 'Natación', 'running': 'Running', 'triatlon': 'Triatlón'
  };
  function nombreLegible(sec) { return NOMBRES[sec] || sec; }

  // --- Listar ---
  async function cargarContenido() {
    var tb = $('tabla-contenido').querySelector('tbody');
    tb.innerHTML = '<tr><td colspan="3" class="sin-etiqueta"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></td></tr>';
    var r = await sb.from('contenido_secciones')
      .select('id,seccion,titulo')
      .order('seccion', { ascending: true });
    if (r.error) { tb.innerHTML = '<tr><td colspan="3">Error: ' + esc(r.error.message) + '</td></tr>'; return; }
    if (!r.data.length) { tb.innerHTML = '<tr><td colspan="3">No hay contenido todavía.</td></tr>'; return; }
    tb.innerHTML = r.data.map(function (c) {
      return '<tr>' +
        '<td><strong>' + esc(nombreLegible(c.seccion)) + '</strong>' +
          '<span style="display:block;font-size:13px;color:var(--texto-suave);">' + esc(c.seccion) + '</span></td>' +
        '<td>' + esc(c.titulo || '—') + '</td>' +
        '<td class="acciones-fila"><button class="btn btn--fantasma btn--mini" data-editar="' + c.id + '">Editar</button>' +
        '<button class="btn btn--peligro" data-borrar="' + c.id + '" data-sec="' + esc(c.seccion) + '">Borrar</button></td>' +
      '</tr>';
    }).join('');
  }

  // --- Crear/editar ---
  function abrirForm(c) {
    c = c || {};
    $('form-titulo').textContent = c.id ? 'Editar sección' : 'Nueva sección';
    $('c-id').value = c.id || '';
    $('c-seccion').value = c.seccion || '';
    $('c-titulo').value = c.titulo || '';
    $('c-dirigido').value = c.dirigido_a || '';
    $('c-horarios').value = c.horarios || '';
    $('c-precio').value = c.precio || '';
    $('c-grupos').value = c.grupos || '';
    $('c-descripcion').value = c.descripcion || '';
    $('c-puntos').value = c.puntos_destacados || '';
    $('msg-form').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
  }
  $('nuevo-contenido').addEventListener('click', function () { abrirForm(); });
  $('cancelar').addEventListener('click', function () { $('panel-form').classList.add('oculto'); });
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) $('panel-form').classList.add('oculto'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('panel-form').classList.contains('oculto')) $('panel-form').classList.add('oculto'); });

  $('tabla-contenido').addEventListener('click', async function (e) {
    var ed = e.target.getAttribute('data-editar');
    var bo = e.target.getAttribute('data-borrar');
    if (ed) {
      var r = await sb.from('contenido_secciones').select('*').eq('id', ed).single();
      if (!r.error) abrirForm(r.data);
    }
    if (bo) {
      if (!await apoConfirm({ texto: '¿Borrar el contenido de la sección "' + e.target.getAttribute('data-sec') + '"? No se puede deshacer.', peligro: true })) return;
      var d = await sb.from('contenido_secciones').delete().eq('id', bo);
      if (d.error) { apoToast('No se pudo borrar: ' + d.error.message, 'error'); return; }
      cargarContenido();
    }
  });

  $('form-contenido').addEventListener('submit', async function (e) {
    e.preventDefault();
    var datos = {
      seccion: $('c-seccion').value.trim(),
      titulo: $('c-titulo').value.trim() || null,
      dirigido_a: $('c-dirigido').value.trim() || null,
      horarios: $('c-horarios').value.trim() || null,
      precio: $('c-precio').value.trim() || null,
      grupos: $('c-grupos').value.trim() || null,
      descripcion: $('c-descripcion').value.trim() || null,
      puntos_destacados: $('c-puntos').value.trim() || null,
      updated_at: new Date().toISOString()
    };
    $('msg-form').textContent = 'Guardando…'; $('msg-form').className = 'msg';
    var id = $('c-id').value, r;
    if (id) r = await sb.from('contenido_secciones').update(datos).eq('id', id);
    else r = await sb.from('contenido_secciones').insert(datos);
    if (r.error) { $('msg-form').textContent = 'Error: ' + r.error.message; $('msg-form').className = 'msg error'; return; }
    $('msg-form').textContent = 'Guardado ✓'; $('msg-form').className = 'msg ok';
    $('panel-form').classList.add('oculto');
    cargarContenido();
  });

  cargarContenido();
});
</script>

</body>
</html>
