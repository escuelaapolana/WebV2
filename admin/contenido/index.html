<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contenido de las páginas · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js?v=a02b231d" defer></script>
<script src="../../assets/js/db.js?v=4fd9379b" defer></script>
<script src="../../assets/js/admin-auth.js?v=881708bc"></script>
<script src="../../assets/js/admin-tabbar.js?v=af4093ec" defer></script>
<style>
  /* ============================================================
     CONTENIDO DE LAS PÁGINAS · diseño nuevo (23-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios» y «Competiciones»: cabecera
     grande, cifras que filtran, buscador + chips por deporte, una
     tarjeta por sección de la web con la franja de su color (los
     del calendario) y una HOJA INFERIOR con lo que tiene guardado
     esa sección, editar y borrar. El formulario de nueva / editar
     es el de antes, en ventana por encima de la hoja. Mismas
     lecturas y mismas escrituras que la versión de antes.
     Prefijo cn-.
     ============================================================ */
  /* Necesario para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .cn-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .cn-wrap *, .cn-capa *, #panel-form * { box-sizing: border-box; }
  .oculto { display: none !important; }

  /* --- Cabecera --- */
  .cn-cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
  .cn-cab > div:first-child { flex: 1 1 340px; min-width: 0; }
  .cn-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; line-height: 1; }
  .cn-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 68ch; }
  .cn-cab-acc { display: flex; gap: 8px; flex-wrap: wrap; }
  .cn-b { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; padding: 0 18px; border-radius: 999px;
    border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff; color: var(--navy,#26374B); font: inherit; font-size: 14.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; text-decoration: none; }
  .cn-b:hover { background: var(--crema,#FBF9F4); }
  .cn-b.prin { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }
  .cn-b.prin:hover { background: #24364A; }
  .cn-b:disabled { opacity: .55; cursor: wait; }
  @media (max-width: 520px) { .cn-cab-acc { width: 100%; } .cn-cab-acc .cn-b { flex: 1 1 0; padding: 0 12px; } }

  /* --- Cifras: pulsar una filtra la lista --- */
  .cn-cifras { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 18px 0 6px; }
  .cn-cifra { display: flex; flex-direction: column; justify-content: flex-start; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .cn-cifra:hover { border-color: var(--linea-borde,#C9C0AE); }
  .cn-cifra:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .cn-cifra b { display: block; font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .cn-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .cn-cifra.ok b { color: #3E7A34; }
  .cn-cifra.aviso { background: #FBF1DE; border-color: #E9CE9A; }
  .cn-cifra.aviso b, .cn-cifra.aviso span { color: #8A5307; }
  .cn-cifra.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  @media (max-width: 620px) { .cn-cifras { grid-template-columns: repeat(2, minmax(0,1fr)); } .cn-cifras .cn-cifra:first-child { grid-column: 1 / -1; } .cn-cifra b { font-size: 21px; } }

  /* --- Buscador + chips (deporte) --- */
  .cn-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 4px; }
  .cn-buscar { flex: 1 1 260px; min-width: 0; min-height: 48px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; background: #fff; color: var(--navy,#26374B); }
  .cn-buscar:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .cn-chips { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .cn-chips::-webkit-scrollbar { display: none; }
  .cn-chips button { flex: 1 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px;
    background: none; font: inherit; font-weight: 700; font-size: 13.5px; color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .cn-chips button:hover { color: var(--navy,#26374B); }
  .cn-chips button .pt { width: 8px; height: 8px; border-radius: 999px; background: var(--c); flex: 0 0 8px; }
  .cn-chips button.on { background: var(--navy,#26374B); color: #fff; }
  .cn-pie-filtros { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; min-height: 30px; }
  .cn-cuenta { font-size: 13px; color: var(--texto-suave,#6E6656); }
  @media (max-width: 620px) { .cn-chips { width: 100%; border-radius: 14px; flex-wrap: wrap; } .cn-chips button { flex: 0 0 auto; } }

  /* --- Color por deporte: los mismos que el calendario de la web.
     Primero el gris de reserva y DESPUÉS los colores, para que ganen. --- */
  .cn-fila, .cn-hoja-cab, .cn-chips button { --c: #CFC6B4; --s: #F0EBE0; --t: #6E6656; }
  .d-pista    { --c: #B0563A; --s: #FBEAE5; --t: #8A3E28; }
  .d-escuela  { --c: #6E9B3E; --s: #EEF4E2; --t: #4C6C2A; }
  .d-running  { --c: #C1742E; --s: #FBEEDD; --t: #86501C; }
  .d-natacion { --c: #2E8C86; --s: #E2F1EF; --t: #1F615C; }
  .d-escnat   { --c: #3B85C0; --s: #E6F0F8; --t: #29628F; }
  .d-triatlon { --c: #7A5CA8; --s: #EEE8F4; --t: #543C74; }
  .d-montana  { --c: #8A6D3B; --s: #F3ECDD; --t: #60492A; }
  .d-cubo     { --c: #4A6280; --s: #E9EEF4; --t: #33495F; }
  .cn-chips button.f-atl { --c: #B0563A; } .cn-chips button.f-nat { --c: #2E8C86; } .cn-chips button.f-tri { --c: #7A5CA8; } .cn-chips button.f-club { --c: #4A6280; }

  /* --- Lista --- */
  .cn-lista { container: cn-lista / inline-size; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .cn-fila { position: relative; display: grid; grid-template-columns: 40px minmax(0,1.3fr) minmax(0,1.5fr) 150px 14px; gap: 0 14px; align-items: center;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid var(--c); border-radius: 14px; padding: 10px 14px 10px 12px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .cn-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .cn-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .cn-ini { width: 40px; height: 40px; border-radius: 999px; background: var(--s); color: var(--t); display: flex; align-items: center;
    justify-content: center; font-family: var(--fuente-titulo); font-weight: 700; font-size: 14px; flex: 0 0 auto; }
  .cn-per { min-width: 0; }
  .cn-per b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .cn-per small { display: block; font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-size: 12px; color: var(--texto-tenue,#9A927F); margin-top: 2px; overflow-wrap: anywhere; }
  .cn-tit { min-width: 0; font-size: 14px; color: var(--texto,#4A4437); line-height: 1.35; overflow-wrap: anywhere; }
  .cn-tit q { quotes: "«" "»"; }
  .cn-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 10px 3px 9px; border-radius: 999px;
    background: var(--s); color: var(--t); white-space: nowrap; justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .cn-pill .pt { width: 7px; height: 7px; border-radius: 999px; background: var(--c); flex: 0 0 7px; }
  .cn-pill.falta { background: #FBF1D9; color: #8A5307; } .cn-pill.falta .pt { background: #D9A441; }
  .cn-flecha { color: #B5AC99; font-size: 20px; line-height: 1; text-align: right; }
  .cn-cab-cols { display: grid; grid-template-columns: 40px minmax(0,1.3fr) minmax(0,1.5fr) 150px 14px; gap: 0 14px; padding: 14px 14px 0 16px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-tenue,#9A927F); }
  /* Lista estrecha (móvil): nombre arriba; título y deporte debajo */
  @container cn-lista (max-width: 640px) {
    .cn-fila { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 11px 12px 12px 10px; }
    .cn-ini { order: 0; }
    .cn-per { order: 1; flex: 1 1 0; align-self: center; }
    .cn-flecha { order: 2; font-size: 22px; align-self: center; }
    .cn-fila::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
    .cn-tit { order: 4; flex: 1 1 0; padding-left: 52px; align-self: center; }
    .cn-tit + .cn-pill { order: 5; align-self: center; }
  }
  @media (max-width: 700px) { .cn-cab-cols { display: none; } }
  .cn-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE); border-radius: 14px; margin-top: 10px; line-height: 1.5; }
  .cn-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }
  .cn-vacio button { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linea-borde,#C9C0AE); background: #fff;
    font: inherit; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; }
  .cn-error { color: #B3261E; }

  /* --- Hoja inferior: lo que se hace con una sección --- */
  .cn-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .cn-velo.ver { opacity: 1; pointer-events: auto; }
  .cn-hoja { position: fixed; left: 50%; bottom: 0; width: min(600px,100%); transform: translate(-50%,105%); z-index: 9001; background: #fff; color: var(--navy,#26374B);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transition: transform .25s ease; max-height: 92vh; overflow: auto;
    overscroll-behavior: contain; box-shadow: 0 -10px 40px rgba(20,30,45,.25); visibility: hidden; }
  .cn-hoja.ver { transform: translate(-50%,0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .cn-hoja, .cn-velo, .cn-fila { transition: none; } }
  .cn-hoja .asa { width: 42px; height: 5px; border-radius: 9px; background: #DDD5C4; margin: 2px auto 12px; }
  .cn-hoja-cab { display: flex; align-items: center; gap: 12px; }
  .cn-hoja-cab .cn-ini { width: 48px; height: 48px; font-size: 16px; }
  .cn-hoja-cab > div { flex: 1; min-width: 0; }
  .cn-hoja h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
  .cn-hoja .sub { color: var(--texto-suave,#6E6656); font-size: 13.5px; margin: 4px 0 0; overflow-wrap: anywhere; }
  .cn-hoja .sub code { font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-size: 12.5px; background: var(--crema,#FBF9F4); padding: 1px 6px; border-radius: 6px; }
  .cn-cerrar { flex: 0 0 auto; align-self: flex-start; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 20px; line-height: 1; cursor: pointer; }
  .cn-et { margin: 18px 2px 8px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave,#6E6656);
    display: flex; justify-content: space-between; gap: 10px; }
  .cn-et span { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--texto-tenue,#9A927F); }
  .cn-caja { background: var(--crema,#FBF9F4); border-radius: 14px; padding: 4px 14px; }
  .cn-caja > div { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 12px; padding: 9px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; align-items: baseline; }
  .cn-caja > div:last-child { border-bottom: 0; }
  .cn-caja span { color: var(--texto-suave,#6E6656); font-size: 13.5px; }
  .cn-caja b { font-weight: 600; overflow-wrap: anywhere; min-width: 0; line-height: 1.4; white-space: pre-line; }
  .cn-caja b.vacio { font-weight: 400; font-style: italic; color: var(--texto-tenue,#9A927F); }
  .cn-caja b small { display: block; font-weight: 400; font-size: 13px; color: var(--texto-suave,#6E6656); margin-top: 2px; }
  @media (max-width: 420px) { .cn-caja > div { grid-template-columns: 1fr; gap: 2px; } }
  .cn-acc { display: grid; gap: 8px; margin-top: 18px; }
  .cn-acc button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 15px;
    border: 1px solid var(--linea-marcada,#E4DCCB); color: var(--navy,#26374B); background: #fff; cursor: pointer; width: 100%; }
  .cn-acc button:hover { background: var(--crema,#FBF9F4); }
  .cn-acc button.prin { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }
  .cn-acc button.prin:hover { background: #24364A; }
  .cn-acc button.peligro { color: #9A3B3B; border-color: #EBC9C5; }
  .cn-acc button.peligro:hover { background: #FDF3F2; }
  .cn-acc button:disabled { opacity: .55; cursor: wait; }
  .cn-acc svg { width: 17px; height: 17px; }

  .msg { font-size: 14px; }
  .msg:empty { display: none; }
  .msg.error { color: #B0563A; }
  .msg.ok { color: #1e7a3d; }

  /* --- Formulario nueva / editar: el de antes, en ventana por ENCIMA de la hoja --- */
  #panel-form { position: fixed; inset: 0; z-index: 9500; background: rgba(20,30,45,.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(16px,5vh,60px) 16px; overflow: auto;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  #panel-form .modal-caja { background: #fff; border-radius: 20px; color: var(--navy,#26374B);
    box-shadow: 0 30px 70px -25px rgba(20,30,45,.6); padding: 22px clamp(16px,4vw,26px) 22px; width: min(680px,100%);
    animation: modal-sube .2s ease; }
  @keyframes modal-sube { from { transform: translateY(12px); opacity: .6; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #panel-form .modal-caja { animation: none; } }
  #panel-form h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; letter-spacing: -0.01em; color: var(--navy,#26374B); margin: 0 0 4px; line-height: 1.1; }
  #panel-form h4 { margin: 22px 0 0; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave,#6E6656); }
  #panel-form label { display: block; font-size: 13px; font-weight: 600; color: var(--navy,#26374B); margin: 12px 0 5px; }
  #panel-form input, #panel-form textarea, #panel-form select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--linea-borde,#C9C0AE); border-radius: 12px;
    font-family: var(--fuente-texto); font-size: 15px; background: #fff; color: var(--navy,#26374B); }
  #panel-form input:focus, #panel-form textarea:focus, #panel-form select:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  #panel-form textarea { min-height: 100px; resize: vertical; line-height: 1.45; }
  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
  .cn-form-pie { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .cn-form-pie .msg { margin: 0; }
</style>
</head>
<body class="adm-piel">

<div id="admin-contenido">
  <div class="admin-wrap">
    <div class="cn-wrap" id="cn">
      <div class="cn-cab">
        <div>
          <h1>Contenido de las páginas</h1>
          <p>Lo que dice cada sección de la web: título, a quién va, horarios, precio, descripción, qué traer… Es lo que leen sus páginas. Toca una sección para ver lo que tiene guardado, editarla o borrarla.</p>
        </div>
        <div class="cn-cab-acc"><button type="button" class="cn-b prin" id="nuevo-contenido">+ Nueva sección</button></div>
      </div>
      <div class="cn-cifras" id="cn-cifras"></div>
      <div class="cn-filtros">
        <input type="search" class="cn-buscar" id="cn-buscar" placeholder="Buscar sección o título…" aria-label="Buscar sección" autocomplete="off">
        <div class="cn-chips" id="cn-chips" role="group" aria-label="Deporte"></div>
      </div>
      <div class="cn-pie-filtros"><span class="cn-cuenta" id="cn-cuenta" aria-live="polite"></span></div>
      <div id="tabla-contenido"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
    </div>
  </div>
</div>

<!-- ===== HOJA DE LA SECCIÓN (se abre al tocar una fila) ===== -->
<div class="cn-capa">
  <div class="cn-velo" id="cn-velo"></div>
  <div class="cn-hoja" id="cn-hoja" role="dialog" aria-modal="true" aria-labelledby="cn-h-nombre">
    <div class="asa" aria-hidden="true"></div>
    <div class="cn-hoja-cab" id="cn-h-cab">
      <span class="cn-ini" id="cn-h-ini"></span>
      <div><h3 id="cn-h-nombre"></h3><p class="sub" id="cn-h-sub"></p></div>
      <button type="button" class="cn-cerrar" id="cn-h-cerrar" aria-label="Cerrar">×</button>
    </div>
    <p class="cn-et">Lo que tiene guardado <span id="cn-h-fecha"></span></p>
    <div class="cn-caja" id="cn-h-datos"></div>
    <div class="cn-acc">
      <button type="button" class="prin" id="cn-h-editar">Editar el contenido</button>
      <button type="button" class="peligro" id="cn-h-borrar">Borrar la sección</button>
    </div>
  </div>
</div>

<!-- ===== FORMULARIO (nueva / editar), el mismo de antes ===== -->
<div class="oculto" id="panel-form">
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="form-titulo">
  <h2 id="form-titulo">Nueva sección</h2>
  <form id="form-contenido">
    <input type="hidden" id="c-id">
    <div class="grid2">
      <div>
        <label for="c-seccion">Sección</label>
        <input type="text" id="c-seccion" placeholder="competicion, running, natacion, triatlon, montana, cubo, escuela, campus…" required>
      </div>
      <div>
        <label for="c-titulo">Título</label>
        <input type="text" id="c-titulo">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label for="c-dirigido">Dirigido a</label>
        <input type="text" id="c-dirigido">
      </div>
      <div>
        <label for="c-horarios">Horarios</label>
        <input type="text" id="c-horarios">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label for="c-precio">Nota del precio</label>
        <input type="text" id="c-precio">
      </div>
      <div>
        <label for="c-grupos">Grupos</label>
        <input type="text" id="c-grupos">
      </div>
    </div>
    <!-- Por dónde se entra a la sede. Es igual para todos los grupos de
         la sección, así que se dice una vez y sale como una línea
         debajo de todos ellos, no repetido en cada tarjeta. -->
    <label for="c-acceso">Cómo se llega · por dónde se entra a la sede</label>
    <input type="text" id="c-acceso" placeholder="«Se entra por el parking de…». Vacío, no sale nada.">
    <label for="c-descripcion">Descripción</label>
    <textarea id="c-descripcion"></textarea>
    <h4>Listas · una cosa por línea</h4>
    <label for="c-puntos">Puntos destacados</label>
    <textarea id="c-puntos" placeholder="Un punto por línea"></textarea>
    <label for="c-traer">Qué traer</label>
    <textarea id="c-traer" placeholder="Una cosa por línea (gorro, gafas, botella de agua…)"></textarea>
    <label for="c-servicios">Servicios · lo que pone el club</label>
    <textarea id="c-servicios" placeholder="Una cosa por línea (planificación individual, acompañamiento a competiciones, inscripciones…)"></textarea>
    <label for="c-compromisos">A qué te comprometes · lo que se espera de quien entrena</label>
    <textarea id="c-compromisos" placeholder="Una cosa por línea (asistencia, competir con el club, cuidarse…)"></textarea>
    <div class="cn-form-pie">
      <button class="cn-b prin" type="submit">Guardar</button>
      <button class="cn-b" type="button" id="cancelar">Cancelar</button>
      <span class="msg" id="msg-form"></span>
    </div>
  </form>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // Nombre de la página tal y como se llama en la web (en la base se guarda el identificador)
  var NOMBRES = {
    'campus': 'Campus de verano', 'competicion': 'Atletismo en pista', 'cubo': 'El Cubo',
    'deporte-adaptado': 'Deporte adaptado', 'escuela': 'Escuela de atletismo',
    'escuela-municipal': 'Escuela municipal de atletismo', 'escuela-natacion': 'Escuela de natación',
    'home': 'Portada de la web',
    'instalaciones': 'Instalaciones', 'montana': 'Montaña', 'mun-atletismo': 'Atletismo municipal',
    'mun-triatlon': 'Triatlón municipal', 'natacion': 'Natación', 'running': 'Running', 'triatlon': 'Triatlón'
  };
  function nombreLegible(sec) { return NOMBRES[sec] || sec; }

  /* Color (los del calendario de la web) y familia para los chips. */
  var COLOR = {
    'competicion': 'd-pista', 'deporte-adaptado': 'd-pista',
    'escuela': 'd-escuela', 'escuela-municipal': 'd-escuela', 'mun-atletismo': 'd-escuela', 'campus': 'd-escuela',
    'running': 'd-running', 'natacion': 'd-natacion', 'escuela-natacion': 'd-escnat',
    'triatlon': 'd-triatlon', 'mun-triatlon': 'd-triatlon', 'montana': 'd-montana', 'cubo': 'd-cubo'
  };
  var FAMILIA = {
    'competicion': 'atl', 'deporte-adaptado': 'atl', 'escuela': 'atl', 'escuela-municipal': 'atl', 'mun-atletismo': 'atl', 'campus': 'atl', 'running': 'atl',
    'natacion': 'nat', 'escuela-natacion': 'nat',
    'triatlon': 'tri', 'mun-triatlon': 'tri', 'montana': 'tri'
  };
  var FAMILIAS = [
    { k: '', t: 'Todas' }, { k: 'atl', t: 'Atletismo' }, { k: 'nat', t: 'Natación' },
    { k: 'tri', t: 'Triatlón y montaña' }, { k: 'club', t: 'El club y otras' }
  ];
  var NOM_FAM = { atl: 'Atletismo', nat: 'Natación', tri: 'Triatlón y montaña', club: 'El club' };
  function familiaDe(sec) { return FAMILIA[sec] || 'club'; }
  function iniciales(t) {
    var p = String(t || '').trim().split(/[\s-]+/).filter(function (w) { return w && !/^(de|del|la|el|en|y)$/i.test(w); });
    if (!p.length) return '·';
    if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
    return (p[0][0] + p[1][0]).toUpperCase();
  }

  var SECCIONES = [];      // filas de la lista (id, seccion, titulo)
  var FILTRO = '';         // '' | 'sintitulo' | 'desconocida'
  var FAM = '';            // '' | 'atl' | 'nat' | 'tri' | 'club'
  var actual = null;       // la sección de la hoja abierta

  // --- Listar ---
  async function cargarContenido() {
    var caja = $('tabla-contenido');
    caja.innerHTML = '<div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div>';
    var r = await sb.from('contenido_secciones')
      .select('id,seccion,titulo')
      .order('seccion', { ascending: true });
    if (r.error) { caja.innerHTML = '<div class="cn-vacio cn-error">Error: ' + esc(r.error.message) + '</div>'; return; }
    SECCIONES = r.data || [];
    pintarCifras();
    pintarLista();
  }

  function sinTitulo(c) { return !String(c.titulo || '').trim(); }
  function desconocida(c) { return !NOMBRES[c.seccion]; }

  function pintarCifras() {
    var st = SECCIONES.filter(sinTitulo).length, de = SECCIONES.filter(desconocida).length;
    $('cn-cifras').innerHTML =
      '<button type="button" class="cn-cifra" data-f=""><b>' + SECCIONES.length + '</b><span>secciones de la web</span></button>' +
      '<button type="button" class="cn-cifra ' + (st ? 'aviso' : 'ok') + '" data-f="sintitulo"><b>' + st + '</b><span>sin título</span></button>' +
      '<button type="button" class="cn-cifra ' + (de ? 'aviso' : 'ok') + '" data-f="desconocida" title="El identificador no es el de ninguna página conocida: revisa que esté bien escrito">' +
        '<b>' + de + '</b><span>no casan con ninguna página</span></button>';
    var cuenta = {};
    SECCIONES.forEach(function (c) { var f = familiaDe(c.seccion); cuenta[f] = (cuenta[f] || 0) + 1; });
    $('cn-chips').innerHTML = FAMILIAS.map(function (f) {
      if (f.k && !cuenta[f.k]) return '';
      return '<button type="button" class="' + (f.k ? 'f-' + f.k : '') + '" data-fam="' + f.k + '">' + (f.k ? '<span class="pt"></span>' : '') + esc(f.t) +
        (f.k ? ' · ' + cuenta[f.k] : '') + '</button>';
    }).join('');
  }

  function filtrada() {
    var q = ($('cn-buscar').value || '').trim().toLowerCase();
    return SECCIONES.filter(function (c) {
      if (FAM && familiaDe(c.seccion) !== FAM) return false;
      if (FILTRO === 'sintitulo' && !sinTitulo(c)) return false;
      if (FILTRO === 'desconocida' && !desconocida(c)) return false;
      if (q) {
        var t = (nombreLegible(c.seccion) + ' ' + c.seccion + ' ' + (c.titulo || '')).toLowerCase();
        if (t.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function filaHtml(c) {
    var nom = nombreLegible(c.seccion), fam = familiaDe(c.seccion);
    var pill = desconocida(c)
      ? '<span class="cn-pill falta"><span class="pt"></span>sin página</span>'
      : '<span class="cn-pill"><span class="pt"></span>' + esc(NOM_FAM[fam]) + '</span>';
    return '<div class="cn-fila ' + (COLOR[c.seccion] || '') + '" tabindex="0" role="button" data-id="' + esc(c.id) + '" aria-label="' + esc(nom) + ': ver y editar">' +
      '<span class="cn-ini">' + esc(iniciales(nom)) + '</span>' +
      '<span class="cn-per"><b>' + esc(nom) + '</b><small>' + esc(c.seccion) + '</small></span>' +
      '<span class="cn-tit">' + (sinTitulo(c) ? '<span class="cn-pill falta"><span class="pt"></span>sin título</span>' : '<q>' + esc(c.titulo) + '</q>') + '</span>' +
      pill +
      '<span class="cn-flecha" aria-hidden="true">›</span></div>';
  }

  function pintarLista() {
    Array.prototype.forEach.call(document.querySelectorAll('#cn-chips button'), function (b) {
      var on = (b.getAttribute('data-fam') || '') === FAM;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.cn-cifra[data-f]'), function (c) {
      c.classList.toggle('on', !!FILTRO && c.getAttribute('data-f') === FILTRO);
    });
    var lista = filtrada();
    $('cn-cuenta').textContent = lista.length === SECCIONES.length ? SECCIONES.length + ' secciones' : lista.length + ' de ' + SECCIONES.length + ' secciones';
    if (!SECCIONES.length) {
      $('tabla-contenido').innerHTML = '<div class="cn-vacio"><b>No hay contenido todavía.</b>Crea la primera sección con «+ Nueva sección».</div>';
      return;
    }
    if (!lista.length) {
      $('tabla-contenido').innerHTML = '<div class="cn-vacio">Ninguna sección con este filtro.<br><button type="button" data-limpiar>Quitar el filtro</button></div>';
      return;
    }
    $('tabla-contenido').innerHTML =
      '<div class="cn-cab-cols" aria-hidden="true"><span></span><span>Sección</span><span>Título</span><span>Deporte</span><span></span></div>' +
      '<div class="cn-lista">' + lista.map(filaHtml).join('') + '</div>';
  }

  $('cn-buscar').addEventListener('input', pintarLista);
  $('cn').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : null;
    if (!t) return;
    var cf = t.closest('.cn-cifra[data-f]');
    if (cf) { var v = cf.getAttribute('data-f') || ''; FILTRO = (v && FILTRO === v) ? '' : v; pintarLista(); return; }
    var ch = t.closest('#cn-chips [data-fam]');
    if (ch) { FAM = ch.getAttribute('data-fam') || ''; pintarLista(); return; }
    if (t.closest('[data-limpiar]')) { FILTRO = ''; FAM = ''; $('cn-buscar').value = ''; pintarLista(); $('cn-buscar').focus(); return; }
    var fila = t.closest('.cn-fila[data-id]');
    if (fila) abrirHoja(fila.getAttribute('data-id'), fila);
  });
  $('cn').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var fila = e.target.closest && e.target.closest('.cn-fila[data-id]');
    if (!fila || e.target !== fila) return;
    e.preventDefault(); abrirHoja(fila.getAttribute('data-id'), fila);
  });

  // --- Hoja de la sección ---
  var focoPrevio = null;
  /* Igual que las páginas (assets/js/seccion.js): una cosa por línea o separadas por «|». */
  function lineas(v) { return String(v || '').split(/[\n|]/).map(function (x) { return x.trim(); }).filter(Boolean); }
  function corto(v, n) { v = String(v || '').trim(); return v.length > n ? v.slice(0, n).replace(/\s+\S*$/, '') + '…' : v; }
  function fechaTxt(iso) {
    if (!iso) return ''; var d = new Date(iso); if (isNaN(d.getTime())) return '';
    var me = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return 'editado el ' + d.getDate() + ' ' + me[d.getMonth()] + ' ' + d.getFullYear();
  }
  function pintarDatos(d) {
    function par(k, v) {
      var s = String(v == null ? '' : v).trim();
      return '<div><span>' + esc(k) + '</span>' + (s ? '<b>' + esc(s) + '</b>' : '<b class="vacio">vacío</b>') + '</div>';
    }
    function lista(k, v) {
      var l = lineas(v);
      if (!l.length) return '<div><span>' + esc(k) + '</span><b class="vacio">vacío</b></div>';
      return '<div><span>' + esc(k) + '</span><b>' + l.length + (l.length === 1 ? ' punto' : ' puntos') +
        '<small>' + esc(corto(l.join(' · '), 110)) + '</small></b></div>';
    }
    $('cn-h-datos').innerHTML =
      par('Título', d.titulo) + par('Dirigido a', d.dirigido_a) + par('Horarios', d.horarios) +
      par('Nota del precio', d.precio) + par('Grupos', d.grupos) + par('Cómo se llega', d.acceso) +
      par('Descripción', corto(d.descripcion, 180)) +
      lista('Puntos destacados', d.puntos_destacados) + lista('Qué traer', d.que_traer) +
      lista('Servicios', d.servicios) + lista('Compromisos', d.compromisos);
    $('cn-h-fecha').textContent = fechaTxt(d.updated_at);
  }

  async function abrirHoja(id, desde) {
    var c = SECCIONES.filter(function (x) { return String(x.id) === String(id); })[0];
    if (!c) return;
    actual = c;
    focoPrevio = desde || document.activeElement;
    var nom = nombreLegible(c.seccion);
    $('cn-h-cab').className = 'cn-hoja-cab ' + (COLOR[c.seccion] || '');
    $('cn-h-ini').textContent = iniciales(nom);
    $('cn-h-nombre').textContent = nom;
    $('cn-h-sub').innerHTML = 'Identificador: <code>' + esc(c.seccion) + '</code>' + (desconocida(c) ? ' · no es el de ninguna página conocida' : '');
    $('cn-h-fecha').textContent = '';
    $('cn-h-datos').innerHTML = '<div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span></div>';
    $('cn-h-editar').disabled = false; $('cn-h-borrar').disabled = false;
    $('cn-velo').classList.add('ver'); $('cn-hoja').classList.add('ver');
    setTimeout(function () { $('cn-h-cerrar').focus(); }, 60);
    // Lo que tiene guardado: la misma lectura que hace «Editar».
    var r = await sb.from('contenido_secciones').select('*').eq('id', c.id).single();
    if (actual !== c) return;
    if (r.error || !r.data) { $('cn-h-datos').innerHTML = '<div><span>No se ha podido leer</span><b>' + esc(r.error ? r.error.message : '—') + '</b></div>'; return; }
    pintarDatos(r.data);
  }
  function cerrarHoja() {
    if (!$('cn-hoja').classList.contains('ver')) return;
    $('cn-velo').classList.remove('ver'); $('cn-hoja').classList.remove('ver');
    actual = null;
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) focoPrevio.focus();
  }
  $('cn-velo').addEventListener('click', cerrarHoja);
  $('cn-h-cerrar').addEventListener('click', cerrarHoja);

  // --- Crear/editar ---
  function abrirForm(c) {
    c = c || {};
    $('form-titulo').textContent = c.id ? 'Editar sección' : 'Nueva sección';
    $('c-id').value = c.id || '';
    $('c-seccion').value = c.seccion || '';
    $('c-titulo').value = c.titulo || '';
    $('c-dirigido').value = c.dirigido_a || '';
    $('c-horarios').value = c.horarios || '';
    $('c-precio').value = c.precio || '';
    $('c-grupos').value = c.grupos || '';
    $('c-acceso').value = c.acceso || '';
    $('c-descripcion').value = c.descripcion || '';
    $('c-puntos').value = c.puntos_destacados || '';
    $('c-traer').value = c.que_traer || '';
    $('c-servicios').value = c.servicios || '';
    $('c-compromisos').value = c.compromisos || '';
    $('msg-form').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
    setTimeout(function () { try { $(c.id ? 'c-titulo' : 'c-seccion').focus(); } catch (e) {} }, 60);
  }
  function cerrarForm() { $('panel-form').classList.add('oculto'); }
  $('nuevo-contenido').addEventListener('click', function () { abrirForm(); });
  $('cancelar').addEventListener('click', cerrarForm);
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) cerrarForm(); });
  /* Escape cierra primero la ventana del formulario y, si no hay, la hoja. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (document.querySelector('.apo-modal-fondo')) return;
    if (!$('panel-form').classList.contains('oculto')) { cerrarForm(); return; }
    cerrarHoja();
  });

  $('cn-h-editar').addEventListener('click', async function () {
    if (!actual) return;
    var ed = actual.id, btn = this;
    btn.disabled = true;
    var r = await sb.from('contenido_secciones').select('*').eq('id', ed).single();
    btn.disabled = false;
    if (!r.error) abrirForm(r.data);
    else apoToast('No se ha podido abrir: ' + r.error.message, 'error');
  });

  $('cn-h-borrar').addEventListener('click', async function () {
    if (!actual) return;
    var bo = actual.id, sec = actual.seccion;
    if (!await apoConfirm({ texto: '¿Borrar el contenido de la sección "' + sec + '"? No se puede deshacer.', peligro: true })) return;
    var d = await sb.from('contenido_secciones').delete().eq('id', bo);
    if (d.error) { apoToast('No se pudo borrar: ' + d.error.message, 'error'); return; }
    cerrarHoja();
    cargarContenido();
  });

  $('form-contenido').addEventListener('submit', async function (e) {
    e.preventDefault();
    var datos = {
      seccion: $('c-seccion').value.trim(),
      titulo: $('c-titulo').value.trim() || null,
      dirigido_a: $('c-dirigido').value.trim() || null,
      horarios: $('c-horarios').value.trim() || null,
      precio: $('c-precio').value.trim() || null,
      grupos: $('c-grupos').value.trim() || null,
      acceso: $('c-acceso').value.trim() || null,
      descripcion: $('c-descripcion').value.trim() || null,
      puntos_destacados: $('c-puntos').value.trim() || null,
      que_traer: $('c-traer').value.trim() || null,
      servicios: $('c-servicios').value.trim() || null,
      compromisos: $('c-compromisos').value.trim() || null,
      updated_at: new Date().toISOString()
    };
    $('msg-form').textContent = 'Guardando…'; $('msg-form').className = 'msg';
    var id = $('c-id').value, r;
    if (id) r = await sb.from('contenido_secciones').update(datos).eq('id', id);
    else r = await sb.from('contenido_secciones').insert(datos);
    if (r.error) { $('msg-form').textContent = 'Error: ' + r.error.message; $('msg-form').className = 'msg error'; return; }
    $('msg-form').textContent = 'Guardado ✓'; $('msg-form').className = 'msg ok';
    cerrarForm();
    cerrarHoja();
    apoToast('Guardado.', 'ok');
    cargarContenido();
  });

  cargarContenido();
});
</script>

</body>
</html>
