<style>
  /* ============================================================
     ENTRENADORES · lista en tarjetas (23-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios»: cabecera grande, cifras que
     filtran, buscador + chips, una tarjeta por monitor con sus
     grupos, y una hoja inferior con su ficha, sus grupos (asignar
     y quitar, igual que antes: grupos.entrenador_id) y para
     llamarle o escribirle. Prefijo en-.
     ============================================================ */
  /* Necesario para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .en-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .en-wrap *, .en-capa * { box-sizing: border-box; }
  .en-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; line-height: 1; }
  .en-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 70ch; }
  .en-cab a { color: var(--azul-oscuro,#2A5E8C); }

  /* --- Cifras: pulsar una filtra la lista --- */
  .en-cifras { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 18px 0 6px; }
  .en-cifra { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); }
  .en-cifra:hover { border-color: var(--linea-borde,#C9C0AE); }
  .en-cifra:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .en-cifra b { display: block; font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-weight: 700; font-size: 24px; line-height: 1.15; }
  .en-cifra span { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .en-cifra.ok b { color: #3E7A34; }
  .en-cifra.aviso { background: #FBF1DE; border-color: #E9CE9A; }
  .en-cifra.aviso b, .en-cifra.aviso span { color: #8A5307; }
  .en-cifra.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  @media (max-width: 520px) { .en-cifra b { font-size: 21px; } .en-cifra { padding: 10px 12px; } }

  /* --- Buscador + chips --- */
  .en-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 4px; }
  .en-buscar { flex: 1 1 260px; min-width: 0; min-height: 48px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; background: #fff; color: var(--navy,#26374B); }
  .en-buscar:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .en-chips { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .en-chips::-webkit-scrollbar { display: none; }
  .en-chips button { flex: 1 0 auto; min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px; background: none; font: inherit; font-weight: 700;
    font-size: 13.5px; color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .en-chips button:hover { color: var(--navy,#26374B); }
  .en-chips button.on { background: var(--navy,#26374B); color: #fff; }
  .en-pie-filtros { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .en-cuenta { font-size: 13px; color: var(--texto-suave,#6E6656); }
  .en-ir { font-size: 14px; font-weight: 700; color: var(--azul-oscuro,#2A5E8C); text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; }
  .en-ir:hover { text-decoration: underline; text-underline-offset: 2px; }
  @media (max-width: 620px) { .en-chips { width: 100%; border-radius: 14px; } }

  /* --- Fila-tarjeta: toda ella abre la hoja --- */
  .en-lista { container: en-lista / inline-size; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .en-fila { position: relative; display: grid; grid-template-columns: 40px minmax(0,1.3fr) minmax(0,1.5fr) 150px 14px; gap: 0 14px; align-items: center;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid #6FAF7E; border-radius: 14px; padding: 10px 14px 10px 12px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .en-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .en-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .en-fila.sin { border-left-color: #D9A441; }
  .en-fila.baja { border-left-color: #CFC6B4; background: #FCFBF8; }
  .en-ini { width: 40px; height: 40px; border-radius: 999px; background: var(--navy,#26374B); color: #fff; display: flex; align-items: center;
    justify-content: center; font-family: var(--fuente-titulo); font-weight: 700; font-size: 14px; }
  .en-fila.baja .en-ini { background: #B5AC99; }
  .en-per { min-width: 0; }
  .en-per b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .en-per small { display: block; font-size: 13px; color: var(--texto-tenue,#9A927F); margin-top: 1px; overflow-wrap: anywhere; }
  .en-per small .baja { color: #B0563A; font-weight: 600; }
  .en-gr { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .en-g { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #E7F3EA; color: #23603A; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .en-g.mas { background: #F0EBE0; color: #6E6656; }
  .en-g.ninguno { background: #FBF1D9; color: #8A5307; }
  .en-tel { position: relative; z-index: 1; justify-self: start; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 10px;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; color: var(--azul-oscuro,#1E4E78); text-decoration: none; font-size: 13.5px;
    font-variant-numeric: tabular-nums; background: #fff; white-space: nowrap; }
  .en-tel:hover { background: #F2F7FC; border-color: #CFE2F1; }
  .en-tel svg { width: 15px; height: 15px; flex: 0 0 15px; }
  .en-tel.sin { color: var(--texto-tenue,#9A927F); border-style: dashed; cursor: default; }
  .en-flecha { color: #B5AC99; font-size: 20px; line-height: 1; text-align: right; }
  .en-cab-cols { display: grid; grid-template-columns: 40px minmax(0,1.3fr) minmax(0,1.5fr) 150px 14px; gap: 0 14px; padding: 12px 14px 0 16px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-tenue,#9A927F); }
  @container en-lista (max-width: 640px) {
    .en-fila { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 11px 12px 12px 10px; }
    .en-ini { order: 0; flex: 0 0 40px; }
    .en-per { order: 1; flex: 1 1 0; }
    .en-flecha { order: 2; font-size: 22px; }
    .en-fila::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
    .en-gr { order: 4; flex: 1 1 0; }
    .en-tel { order: 6; margin-left: auto; }
    .en-tel.sin { display: none; }
  }
  @media (max-width: 700px) { .en-cab-cols { display: none; } }
  .en-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE); border-radius: 14px; margin-top: 10px; line-height: 1.5; }
  .en-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }
  .en-vacio button { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linea-borde,#C9C0AE); background: #fff;
    font: inherit; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; }

  /* --- Hoja inferior --- */
  .en-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .en-velo.ver { opacity: 1; pointer-events: auto; }
  .en-hoja { position: fixed; left: 50%; bottom: 0; width: min(560px,100%); transform: translate(-50%,105%); z-index: 9001; background: #fff; color: var(--navy,#26374B);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transition: transform .25s ease; max-height: 92vh; overflow: auto;
    overscroll-behavior: contain; box-shadow: 0 -10px 40px rgba(20,30,45,.25); visibility: hidden; }
  .en-hoja.ver { transform: translate(-50%,0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .en-hoja, .en-velo, .en-fila { transition: none; } }
  .en-hoja .asa { width: 42px; height: 5px; border-radius: 9px; background: #DDD5C4; margin: 2px auto 12px; }
  .en-hoja-cab { display: flex; align-items: center; gap: 12px; }
  .en-hoja-cab .en-ini { width: 48px; height: 48px; flex: 0 0 48px; font-size: 16px; }
  .en-hoja-cab > div { flex: 1; min-width: 0; }
  .en-hoja h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
  .en-hoja .sub { color: var(--texto-suave,#6E6656); font-size: 13.5px; margin: 3px 0 0; overflow-wrap: anywhere; }
  .en-cerrar { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 20px; line-height: 1; cursor: pointer; }
  .en-et { margin: 16px 2px 8px; font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave,#6E6656); }
  .en-mis { display: flex; flex-direction: column; gap: 6px; }
  .en-mi { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #F3F9F4; border: 1px solid #D4E8D9; border-radius: 12px;
    padding: 6px 6px 6px 14px; font-size: 14.5px; font-weight: 600; color: #23603A; }
  .en-mi span { min-width: 0; overflow-wrap: anywhere; }
  .en-mi button { flex: 0 0 auto; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #E3CFCB; background: #fff; color: #9A3B3B;
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .en-mi button:hover { background: #FDF3F2; }
  .en-ninguno { font-size: 14px; color: #8A5307; background: #FBF1DE; border: 1px solid #E9CE9A; border-radius: 12px; padding: 10px 14px; }
  .en-asignar { width: 100%; min-height: 48px; margin-top: 8px; border: 1px dashed var(--azul-filete,#3B85C0); border-radius: 12px; background: #fff;
    color: var(--azul-oscuro,#2A5E8C); font: inherit; font-size: 14.5px; font-weight: 600; padding: 0 12px; cursor: pointer; }
  .en-datos { background: var(--crema,#FBF9F4); border-radius: 14px; padding: 4px 14px; }
  .en-datos div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; }
  .en-datos div:last-child { border-bottom: 0; }
  .en-datos span { color: var(--texto-suave,#6E6656); flex: 0 0 auto; }
  .en-datos b { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .en-nota { margin: 8px 2px 0; font-size: 13px; color: var(--texto-suave,#6E6656); line-height: 1.45; }
  .en-acc { display: grid; gap: 8px; margin-top: 16px; }
  .en-acc a { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; font-weight: 700; font-size: 15px;
    text-decoration: none; border: 1px solid var(--linea-marcada,#E4DCCB); color: var(--navy,#26374B); background: #fff; }
  .en-acc a:hover { background: var(--crema,#FBF9F4); }
  .en-acc a.wa { background: #1F8F4E; border-color: #1F8F4E; color: #fff; }
  .en-acc a.wa:hover { background: #187A41; }
  .en-acc .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .en-acc svg { width: 17px; height: 17px; }
</style>
</head>
<body class="adm-piel">

<div class="admin-wrap">
  <div class="en-wrap" id="en">
    <div class="en-cab"><h1>Entrenadores</h1><p>Cargando…</p></div>
  </div>
</div>

<!-- ===== HOJA DEL ENTRENADOR (se abre al tocar una fila) ===== -->
<div class="en-capa">
  <div class="en-velo" id="en-velo"></div>
  <div class="en-hoja" id="en-hoja" role="dialog" aria-modal="true" aria-labelledby="en-h-nombre">
    <div class="asa" aria-hidden="true"></div>
    <div class="en-hoja-cab">
      <span class="en-ini" id="en-h-ini"></span>
      <div><h3 id="en-h-nombre"></h3><p class="sub" id="en-h-sub"></p></div>
      <button type="button" class="en-cerrar" id="en-h-cerrar" aria-label="Cerrar">×</button>
    </div>
    <p class="en-et">Grupos que lleva</p>
    <div id="en-h-grupos"></div>
    <p class="en-et">Su ficha</p>
    <div id="en-h-ficha"></div>
    <div class="en-acc" id="en-h-acc"></div>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var GN = window.APOLANA_GRUPO_NOMBRE || function (g) { return g && g.nombre || ''; };
  var b = (window.APOLANA_BASE || '../../');

  var ENTRENADORES = [], GRUPOS = [], FICHAS = {}, FILTRO = '', montado = false;

  var ICO_TEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICO_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  var ICO_WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

  function nombreCompleto(p) { return ((p.nombre || '') + ' ' + (p.apellidos || '')).trim(); }
  function iniciales(p) {
    var n = (p.nombre || '').trim(), a = (p.apellidos || '').trim();
    return (((n ? n[0] : '') + (a ? a[0] : '')).toUpperCase()) || '·';
  }
  function esEntrenador(p) {
    var roles = (p.roles && p.roles.length) ? p.roles : (p.rol ? [p.rol] : []);
    return roles.indexOf('entrenador') !== -1 || p.rol === 'entrenador' || p.rol_activo === 'entrenador';
  }
  function nombreDe(id) {
    for (var i = 0; i < ENTRENADORES.length; i++) if (ENTRENADORES[i].id === id) return nombreCompleto(ENTRENADORES[i]);
    return null;
  }
  function gruposDe(id) { return GRUPOS.filter(function (g) { return g.entrenador_id === id; }); }
  // Teléfono → número para wa.me (solo dígitos, con prefijo país; España por defecto). Igual que en «Altas del Cubo».
  function waNum(tel) { var t = String(tel || '').replace(/[^\d+]/g, ''); if (t.charAt(0) === '+') t = t.slice(1); else if (t.slice(0, 2) === '00') t = t.slice(2); else if (t.length === 9) t = '34' + t; return t; }
  function fechaBonita(s) {
    if (!s) return '—';
    var t = String(s).slice(0, 10).split('-');
    return t.length === 3 ? (t[2] + '/' + t[1] + '/' + t[0]) : s;
  }

  async function cargar() {
    var rp = await sb.from('perfiles').select('id,nombre,apellidos,email,telefono,rol,rol_activo,roles,activo').order('apellidos').order('nombre');
    if (rp.error) {
      $('en').innerHTML = '<div class="en-cab"><h1>Entrenadores</h1></div>' + ADM.error(rp.error.message, cargar);
      montado = false; return;
    }
    ENTRENADORES = (rp.data || []).filter(esEntrenador);
    var rg = await sb.from('grupos').select('id,nombre,turno,seccion,entrenador_id,activo').eq('activo', true).order('nombre').order('turno', { nullsFirst: true });
    GRUPOS = (!rg.error && rg.data) ? rg.data : [];
    if (!montado) montar(); else { pintarCifras(); pintarLista(); }
  }

  function visibles() {
    var q = ($('en-buscar').value || '').trim().toLowerCase();
    return ENTRENADORES.filter(function (p) {
      var n = gruposDe(p.id).length;
      if (FILTRO === 'con' && !n) return false;
      if (FILTRO === 'sin' && n) return false;
      if (!q) return true;
      return ((p.nombre || '') + ' ' + (p.apellidos || '') + ' ' + (p.email || '') + ' ' + (p.telefono || '')).toLowerCase().indexOf(q) !== -1;
    });
  }

  function filaHtml(p) {
    var mios = gruposDe(p.id);
    var clase = p.activo === false ? 'baja' : (mios.length ? '' : 'sin');
    var gr = mios.length
      ? mios.slice(0, 2).map(function (g) { return '<span class="en-g" title="' + esc(GN(g)) + '">' + esc(GN(g)) + '</span>'; }).join('') +
        (mios.length > 2 ? '<span class="en-g mas">+' + (mios.length - 2) + '</span>' : '')
      : '<span class="en-g ninguno">Sin grupo</span>';
    return '<div class="en-fila ' + clase + '" tabindex="0" data-id="' + esc(p.id) + '" aria-label="' + esc(nombreCompleto(p) || 'Entrenador') + ': ver ficha y grupos">' +
      '<span class="en-ini">' + esc(iniciales(p)) + '</span>' +
      '<span class="en-per"><b>' + esc(nombreCompleto(p) || '(sin nombre)') + '</b><small>' + esc(p.email || 'sin correo') +
        (p.activo === false ? ' · <span class="baja">desactivado</span>' : '') + '</small></span>' +
      '<span class="en-gr">' + gr + '</span>' +
      (p.telefono
        ? '<a class="en-tel" href="tel:' + esc(String(p.telefono).replace(/\s+/g, '')) + '" aria-label="Llamar a ' + esc(nombreCompleto(p)) + '">' + ICO_TEL + esc(p.telefono) + '</a>'
        : '<span class="en-tel sin">sin teléfono</span>') +
      '<span class="en-flecha" aria-hidden="true">›</span>' +
    '</div>';
  }

  function pintarCifras() {
    var con = ENTRENADORES.filter(function (p) { return gruposDe(p.id).length; }).length;
    var sin = ENTRENADORES.length - con;
    $('en-cifras').innerHTML =
      '<button type="button" class="en-cifra" data-f=""><b>' + ENTRENADORES.length + '</b><span>entrenadores</span></button>' +
      '<button type="button" class="en-cifra ok" data-f="con"><b>' + con + '</b><span>llevan grupo</span></button>' +
      '<button type="button" class="en-cifra' + (sin ? ' aviso' : '') + '" data-f="sin"><b>' + sin + '</b><span>sin grupo</span></button>';
    $('en-chips').innerHTML =
      '<button type="button" data-f="">Todos</button>' +
      '<button type="button" data-f="con">Con grupo</button>' +
      '<button type="button" data-f="sin">Sin grupo' + (sin ? ' · ' + sin : '') + '</button>';
  }

  function pintarLista() {
    Array.prototype.forEach.call(document.querySelectorAll('#en-chips button'), function (x) {
      var on = (x.getAttribute('data-f') || '') === FILTRO;
      x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.en-cifra[data-f]'), function (c) {
      c.classList.toggle('on', !!FILTRO && c.getAttribute('data-f') === FILTRO);
    });
    var lista = visibles();
    $('en-cuenta').textContent = lista.length === ENTRENADORES.length
      ? ENTRENADORES.length + (ENTRENADORES.length === 1 ? ' entrenador' : ' entrenadores')
      : lista.length + ' de ' + ENTRENADORES.length + ' entrenadores';
    if (!ENTRENADORES.length) {
      $('en-lista').innerHTML = '<div class="en-vacio"><b>Todavía no hay entrenadores</b>Los monitores se dan de alta en Enlaces → Alta de monitor. Cuando alguien con cuenta deba ser entrenador, cámbiale el papel en «Quién entra al panel».</div>';
      return;
    }
    if (!lista.length) {
      $('en-lista').innerHTML = '<div class="en-vacio"><b>Nadie encaja con el filtro</b>Prueba con otra palabra o quita el filtro.<br><button type="button" data-limpiar>Ver a todos</button></div>';
      return;
    }
    $('en-lista').innerHTML =
      '<div class="en-cab-cols" aria-hidden="true"><span></span><span>Entrenador</span><span>Grupos</span><span>Contacto</span><span></span></div>' +
      '<div class="en-lista">' + lista.map(filaHtml).join('') + '</div>';
  }

  function montar() {
    montado = true;
    $('en').innerHTML =
      '<div class="en-cab"><h1>Entrenadores</h1><p>Los monitores del club: su ficha y el grupo que lleva cada uno. Se dan de alta ellos en <a href="' + b + 'admin/enlaces/">Enlaces → Alta de monitor</a>; aquí les <b>asignas o cambias el grupo</b>. Para hacer entrenador a alguien que ya tiene cuenta, cámbiale el papel en <a href="' + b + 'admin/usuarios/">Quién entra al panel</a>.</p></div>' +
      '<div class="en-cifras" id="en-cifras"></div>' +
      '<div class="en-filtros">' +
        '<input type="search" class="en-buscar" id="en-buscar" placeholder="Buscar por nombre, correo o teléfono…" aria-label="Buscar entrenador" autocomplete="off">' +
        '<div class="en-chips" id="en-chips" role="group" aria-label="Grupo"></div>' +
      '</div>' +
      '<div class="en-pie-filtros"><span class="en-cuenta" id="en-cuenta" aria-live="polite"></span>' +
        '<a class="en-ir" href="' + b + 'admin/grupos/">Ver todos los grupos →</a></div>' +
      '<div id="en-lista"></div>';

    $('en-buscar').addEventListener('input', pintarLista);
    $('en').addEventListener('click', function (ev) {
      var f = ev.target.closest('[data-f]');
      if (f && (f.closest('#en-chips') || f.classList.contains('en-cifra'))) {
        var v = f.getAttribute('data-f') || '';
        /* Pulsar la cifra que ya filtra la quita. */
        FILTRO = (f.classList.contains('en-cifra') && v && FILTRO === v) ? '' : v;
        pintarLista(); return;
      }
      if (ev.target.closest('[data-limpiar]')) { FILTRO = ''; $('en-buscar').value = ''; pintarLista(); return; }
      if (ev.target.closest('a')) return;          // el teléfono llama, no abre la hoja
      var fila = ev.target.closest('.en-fila[data-id]');
      if (fila) abrirHoja(fila.getAttribute('data-id'), fila);
    });
    $('en').addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var fila = ev.target.closest && ev.target.closest('.en-fila[data-id]');
      if (!fila || ev.target !== fila) return;
      ev.preventDefault(); abrirHoja(fila.getAttribute('data-id'), fila);
    });
    pintarCifras();
    pintarLista();
  }

  /* ---------- hoja del entrenador ---------- */
  var focoPrevio = null, abiertoId = null;

  function pintarGruposHoja() {
    var p = ENTRENADORES.filter(function (x) { return x.id === abiertoId; })[0];
    if (!p) return;
    var mios = gruposDe(p.id);
    // Desplegable para asignar un grupo (los que no lleva ya). Muestra si otro lo lleva.
    var libres = GRUPOS.filter(function (g) { return g.entrenador_id !== p.id; });
    var opciones = '<option value="">+ Asignarle un grupo…</option>' + libres.map(function (g) {
      var quien = g.entrenador_id ? nombreDe(g.entrenador_id) : null;
      return '<option value="' + esc(g.id) + '">' + esc(GN(g)) + (quien ? ' — lo lleva ' + esc(quien) : '') + '</option>';
    }).join('');
    $('en-h-grupos').innerHTML =
      (mios.length
        ? '<div class="en-mis">' + mios.map(function (g) {
            return '<div class="en-mi"><span>' + esc(GN(g)) + '</span><button type="button" data-quitar="' + esc(g.id) + '" aria-label="Quitarle ' + esc(GN(g)) + '">Quitar</button></div>';
          }).join('') + '</div>'
        : '<div class="en-ninguno">Todavía no lleva ningún grupo.</div>') +
      '<select class="en-asignar" id="en-h-asignar" aria-label="Asignarle un grupo">' + opciones + '</select>';
  }

  async function pintarFichaHoja() {
    var id = abiertoId;
    var p = ENTRENADORES.filter(function (x) { return x.id === id; })[0] || {};
    function par(k, v) { return '<div><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }
    if (!FICHAS[id]) {
      $('en-h-ficha').innerHTML = '<div class="en-datos">' + par('Teléfono', p.telefono || '—') + '</div><p class="en-nota">Cargando ficha…</p>';
      var r = await sb.from('entrenador_ficha').select('dni,fecha_nacimiento,sexo,direccion,cp,localidad').eq('perfil_id', id).maybeSingle();
      if (abiertoId !== id) return;
      if (r.error) { $('en-h-ficha').innerHTML = '<div class="en-datos">' + par('Teléfono', p.telefono || '—') + '</div><p class="en-nota">No se pudo leer la ficha: ' + esc(r.error.message) + '</p>'; return; }
      FICHAS[id] = r.data || 'no';
    }
    var f = FICHAS[id];
    if (f === 'no') {
      $('en-h-ficha').innerHTML = '<div class="en-datos">' + par('Teléfono', p.telefono || '—') + par('Correo', p.email || '—') + '</div>' +
        '<p class="en-nota">Todavía no tiene ficha completa (se dio de alta con el formulario antiguo, o le cambiaste el papel a mano).</p>';
      return;
    }
    $('en-h-ficha').innerHTML = '<div class="en-datos">' +
      par('Teléfono', p.telefono || '—') +
      par('Correo', p.email || '—') +
      par('DNI', f.dni || '—') +
      par('Fecha de nacimiento', fechaBonita(f.fecha_nacimiento)) +
      par('Sexo', f.sexo || '—') +
      par('Dirección', f.direccion || '—') +
      par('CP', f.cp || '—') +
      par('Localidad', f.localidad || '—') +
    '</div>';
  }

  function abrirHoja(id, desde) {
    var p = ENTRENADORES.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    abiertoId = id;
    focoPrevio = desde || document.activeElement;
    $('en-h-ini').textContent = iniciales(p);
    $('en-h-ini').style.cssText = p.activo === false ? 'background:#B5AC99' : '';
    $('en-h-nombre').textContent = nombreCompleto(p) || '(sin nombre)';
    $('en-h-sub').textContent = (p.email || 'sin correo') + (p.activo === false ? ' · desactivado' : '');
    pintarGruposHoja();
    pintarFichaHoja();
    var tel = p.telefono ? String(p.telefono).replace(/\s+/g, '') : '';
    $('en-h-acc').innerHTML =
      (tel ? '<a class="wa" href="https://wa.me/' + esc(waNum(tel)) + '" target="_blank" rel="noopener">' + ICO_WA + 'Escribir por WhatsApp</a>' : '') +
      ((tel || p.email) ? '<div' + (tel && p.email ? ' class="dos"' : '') + '>' +
        (tel ? '<a href="tel:' + esc(tel) + '">' + ICO_TEL + 'Llamar</a>' : '') +
        (p.email ? '<a href="mailto:' + esc(p.email) + '">' + ICO_MAIL + 'Correo</a>' : '') + '</div>' : '');
    $('en-velo').classList.add('ver'); $('en-hoja').classList.add('ver');
    setTimeout(function () { $('en-h-cerrar').focus(); }, 60);
  }
  function cerrarHoja() {
    if (!$('en-hoja').classList.contains('ver')) return;
    $('en-velo').classList.remove('ver'); $('en-hoja').classList.remove('ver');
    abiertoId = null;
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) focoPrevio.focus();
  }
  $('en-velo').addEventListener('click', cerrarHoja);
  $('en-h-cerrar').addEventListener('click', cerrarHoja);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !ev.defaultPrevented) cerrarHoja();   // el Escape que cierra un «¿seguro?» no cierra también la hoja
  });

  // Quitar un grupo
  $('en-h-grupos').addEventListener('click', function (ev) {
    var bq = ev.target.closest('[data-quitar]');
    if (bq && abiertoId) quitarGrupo(bq.getAttribute('data-quitar'), abiertoId);
  });
  // Asignar un grupo
  $('en-h-grupos').addEventListener('change', function (ev) {
    var sel = ev.target.closest('#en-h-asignar');
    if (!sel || !sel.value || !abiertoId) return;
    asignarGrupo(sel.value, abiertoId);
  });

  function repintar() { pintarGruposHoja(); pintarCifras(); pintarLista(); }

  async function asignarGrupo(grupoId, entrenadorId) {
    var g = GRUPOS.filter(function (x) { return x.id === grupoId; })[0];
    // Si el grupo ya tiene otro entrenador, avisa antes de quitárselo.
    if (g && g.entrenador_id && g.entrenador_id !== entrenadorId) {
      var quien = nombreDe(g.entrenador_id) || 'otra persona';
      var ok = await apoConfirm({ titulo: 'Cambiar de entrenador',
        texto: 'El grupo "' + GN(g) + '" ahora lo lleva ' + quien + '.\n\n¿Se lo pasas a ' + (nombreDe(entrenadorId) || 'este entrenador') + '?',
        confirmar: 'Sí, cambiar' });
      if (!ok) { pintarGruposHoja(); return; }
    }
    var r = await sb.from('grupos').update({ entrenador_id: entrenadorId }).eq('id', grupoId);
    if (r.error) { apoToast('No se pudo asignar: ' + r.error.message, 'error'); pintarGruposHoja(); return; }
    if (g) g.entrenador_id = entrenadorId;
    apoToast('Grupo asignado.', 'ok');
    repintar();
  }

  async function quitarGrupo(grupoId, entrenadorId) {
    var g = GRUPOS.filter(function (x) { return x.id === grupoId; })[0];
    if (!await apoConfirm({ titulo: 'Quitar el grupo', texto: '¿Le quitas "' + (g ? GN(g) : 'este grupo') + '"? El grupo se quedará sin entrenador hasta que le asignes otro.', confirmar: 'Quitar', peligro: true })) return;
    var r = await sb.from('grupos').update({ entrenador_id: null }).eq('id', grupoId);
    if (r.error) { apoToast('No se pudo quitar: ' + r.error.message, 'error'); return; }
    if (g) g.entrenador_id = null;
    apoToast('Grupo quitado.', 'ok');
    repintar();
  }

  cargar();
});
</script>
</body>
</html>
