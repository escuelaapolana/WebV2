<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrenadores · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 900px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }
  .en-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(26px,5vw,34px); color: var(--navy); margin: 0 0 4px; }
  .en-cab p { font-size: 15px; color: var(--texto-suave); margin: 0 0 20px; max-width: 62ch; line-height: 1.6; }
  .en-cab a { color: var(--azul-oscuro, #2F6FA8); }

  .en-busca { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .en-busca input { flex: 1 1 240px; max-width: 340px; box-sizing: border-box; min-height: 44px; padding: 10px 14px;
    border: 1px solid var(--linea-borde); border-radius: 999px; background: #fff; font-family: inherit; font-size: 15px; color: var(--navy); }
  .en-busca .cuenta { margin-left: auto; font-family: var(--fuente-dato); font-size: 14px; color: var(--texto-suave); }

  .en-lista { display: flex; flex-direction: column; gap: 14px; }
  .en-card { background: #fff; border: 1px solid var(--linea); border-radius: 14px; box-shadow: var(--sombra-suave); padding: 16px 18px; }
  .en-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .en-ava { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: var(--navy, #2E4256); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .en-info { flex: 1 1 200px; min-width: 0; }
  .en-info b { display: block; font-size: 16px; color: var(--navy); }
  .en-info span { font-size: 13.5px; color: var(--texto-suave); }
  .en-info .baja { color: #B0563A; }
  .en-acc { flex: 0 0 auto; }
  .en-acc button { min-height: 40px; box-sizing: border-box; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-family: inherit; cursor: pointer;
    border: 1px solid var(--linea-borde, #C9C0AE); background: #fff; color: var(--navy, #2E4256); }
  .en-acc button:hover { background: var(--crema-media, #F1EADC); }

  .en-grupos { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--linea); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .en-grupos .et { font-size: 13px; color: var(--texto-suave); margin-right: 2px; }
  .en-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--crema, #FBF9F4); border: 1px solid var(--linea-borde, #D4CBB9);
    border-radius: 999px; padding: 6px 8px 6px 13px; font-size: 13.5px; color: var(--navy); }
  .en-chip button { border: 0; background: transparent; cursor: pointer; color: var(--texto-suave); font-size: 17px; line-height: 1;
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
  .en-chip button:hover { background: #fbeceb; color: #B0563A; }
  .en-sin { font-size: 13.5px; color: var(--texto-suave); font-style: italic; }
  .en-add { min-height: 40px; border: 1px solid var(--azul-filete, #3B85C0); border-radius: 999px; background: #fff; color: var(--azul-oscuro, #2F6FA8);
    font-family: inherit; font-size: 13.5px; padding: 8px 12px; cursor: pointer; max-width: 260px; }

  .en-ficha { margin-top: 12px; padding: 12px 14px; background: var(--crema-media, #F1EADC); border-radius: 10px; }
  .en-ficha table { width: 100%; border-collapse: collapse; }
  .en-ficha td { padding: 5px 6px; font-size: 14px; vertical-align: top; }
  .en-ficha td.k { color: var(--texto-suave); width: 150px; white-space: nowrap; }
  .en-ficha td.v { color: var(--navy); font-weight: 600; }
  .oculto { display: none !important; }
</style>
</head>
<body class="adm-piel">

<div class="admin-wrap">
  <div class="en-cab">
    <h1>Entrenadores</h1>
    <p>Los monitores del club: su ficha y el grupo que lleva cada uno. Los monitores se dan de alta ellos en <a href="../enlaces/">Enlaces → Alta de monitor</a>; aquí les <b>asignas o cambias el grupo</b>. Para hacer entrenador a alguien que ya tiene cuenta, cámbiale el papel en <a href="../usuarios/">Quién entra al panel</a>.</p>
  </div>
  <div class="en-busca">
    <input type="search" id="buscar" placeholder="Buscar por nombre o correo…" aria-label="Buscar entrenador">
    <span class="cuenta" id="cuenta"></span>
  </div>
  <div class="en-lista" id="lista"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var GN = window.APOLANA_GRUPO_NOMBRE || function (g) { return g && g.nombre || ''; };

  var ENTRENADORES = [], GRUPOS = [], FICHAS = {}, ABIERTA = {};

  function nombreCompleto(p) { return ((p.nombre || '') + ' ' + (p.apellidos || '')).trim(); }
  function iniciales(p) {
    var n = (p.nombre || '').trim(), a = (p.apellidos || '').trim();
    return (((n ? n[0] : '') + (a ? a[0] : '')).toUpperCase()) || '·';
  }
  function esEntrenador(p) {
    var roles = (p.roles && p.roles.length) ? p.roles : (p.rol ? [p.rol] : []);
    return roles.indexOf('entrenador') !== -1 || p.rol === 'entrenador' || p.rol_activo === 'entrenador';
  }
  function nombreDe(id) {
    for (var i = 0; i < ENTRENADORES.length; i++) if (ENTRENADORES[i].id === id) return nombreCompleto(ENTRENADORES[i]);
    return null;
  }

  async function cargar() {
    var rp = await sb.from('perfiles').select('id,nombre,apellidos,email,telefono,rol,rol_activo,roles,activo').order('apellidos').order('nombre');
    if (rp.error) { $('lista').innerHTML = ADM.error(rp.error.message, cargar); return; }
    ENTRENADORES = (rp.data || []).filter(esEntrenador);
    var rg = await sb.from('grupos').select('id,nombre,turno,seccion,entrenador_id,activo').eq('activo', true).order('nombre').order('turno', { nullsFirst: true });
    GRUPOS = (!rg.error && rg.data) ? rg.data : [];
    pintar();
  }

  function pintar() {
    var texto = ($('buscar').value || '').trim().toLowerCase();
    var lista = ENTRENADORES.filter(function (p) {
      if (!texto) return true;
      return ((p.nombre || '') + ' ' + (p.apellidos || '') + ' ' + (p.email || '')).toLowerCase().indexOf(texto) !== -1;
    });
    $('cuenta').textContent = lista.length === ENTRENADORES.length
      ? ENTRENADORES.length + (ENTRENADORES.length === 1 ? ' entrenador' : ' entrenadores')
      : lista.length + ' de ' + ENTRENADORES.length;

    if (!ENTRENADORES.length) {
      $('lista').innerHTML = ADM.vacio('Todavía no hay entrenadores',
        'Los monitores se dan de alta en Enlaces → Alta de monitor. Cuando alguien con cuenta deba ser entrenador, cámbiale el papel en «Quién entra al panel».', '');
      return;
    }
    if (!lista.length) { $('lista').innerHTML = ADM.vacio('Nadie encaja con la búsqueda', 'Prueba con otra palabra.', ''); return; }

    $('lista').innerHTML = lista.map(function (p) {
      var mios = GRUPOS.filter(function (g) { return g.entrenador_id === p.id; });
      var chips = mios.length
        ? mios.map(function (g) {
            return '<span class="en-chip">' + esc(GN(g)) +
              '<button type="button" data-quitar="' + esc(g.id) + '" data-ent="' + esc(p.id) + '" title="Quitarle este grupo" aria-label="Quitar grupo">×</button></span>';
          }).join('')
        : '<span class="en-sin">Sin grupo asignado</span>';

      // Desplegable para asignar un grupo (los que no lleva ya). Muestra si otro lo lleva.
      var libres = GRUPOS.filter(function (g) { return g.entrenador_id !== p.id; });
      var opciones = '<option value="">+ Asignar un grupo…</option>' + libres.map(function (g) {
        var quien = g.entrenador_id ? nombreDe(g.entrenador_id) : null;
        return '<option value="' + esc(g.id) + '">' + esc(GN(g)) + (quien ? ' — lo lleva ' + esc(quien) : '') + '</option>';
      }).join('');

      var baja = p.activo === false ? '<span class="baja"> · desactivado</span>' : '';
      var fichaAbierta = ABIERTA[p.id];
      return '<div class="en-card" data-card="' + esc(p.id) + '">' +
        '<div class="en-top">' +
          '<div class="en-ava">' + esc(iniciales(p)) + '</div>' +
          '<div class="en-info"><b>' + esc(nombreCompleto(p) || '(sin nombre)') + '</b>' +
            '<span>' + esc(p.email || 'sin correo') + (p.telefono ? ' · ' + esc(p.telefono) : '') + baja + '</span></div>' +
          '<div class="en-acc"><button type="button" data-ficha="' + esc(p.id) + '">' + (fichaAbierta ? 'Ocultar ficha' : 'Ver ficha') + '</button></div>' +
        '</div>' +
        '<div class="en-grupos"><span class="et">Grupos:</span>' + chips +
          '<select class="en-add" data-asignar="' + esc(p.id) + '" aria-label="Asignar un grupo">' + opciones + '</select>' +
        '</div>' +
        '<div class="en-ficha' + (fichaAbierta ? '' : ' oculto') + '" data-ficha-cont="' + esc(p.id) + '">' +
          (fichaAbierta ? '' : '') +
        '</div>' +
      '</div>';
    }).join('');

    // Rellenar las fichas que estén abiertas.
    Object.keys(ABIERTA).forEach(function (id) { if (ABIERTA[id]) pintarFicha(id); });
  }

  function fechaBonita(s) {
    if (!s) return '—';
    var t = String(s).slice(0, 10).split('-');
    return t.length === 3 ? (t[2] + '/' + t[1] + '/' + t[0]) : s;
  }

  async function pintarFicha(id) {
    var cont = $('lista').querySelector('[data-ficha-cont="' + id + '"]');
    if (!cont) return;
    if (!FICHAS[id]) {
      cont.innerHTML = '<span class="en-sin">Cargando ficha…</span>';
      var r = await sb.from('entrenador_ficha').select('dni,fecha_nacimiento,sexo,direccion,cp,localidad').eq('perfil_id', id).maybeSingle();
      if (r.error) { cont.innerHTML = '<span class="en-sin">No se pudo leer la ficha: ' + esc(r.error.message) + '</span>'; return; }
      FICHAS[id] = r.data || 'no';
    }
    var f = FICHAS[id];
    var p = ENTRENADORES.filter(function (x) { return x.id === id; })[0] || {};
    if (f === 'no') {
      cont.innerHTML = '<table><tr><td class="k">Teléfono</td><td class="v">' + esc(p.telefono || '—') + '</td></tr></table>' +
        '<p class="en-sin" style="margin:8px 0 0">Todavía no tiene ficha completa (se dio de alta con el formulario antiguo, o le cambiaste el papel a mano).</p>';
      return;
    }
    cont.innerHTML = '<table>' +
      '<tr><td class="k">Teléfono</td><td class="v">' + esc(p.telefono || '—') + '</td></tr>' +
      '<tr><td class="k">DNI</td><td class="v">' + esc(f.dni || '—') + '</td></tr>' +
      '<tr><td class="k">Fecha de nacimiento</td><td class="v">' + esc(fechaBonita(f.fecha_nacimiento)) + '</td></tr>' +
      '<tr><td class="k">Sexo</td><td class="v">' + esc(f.sexo || '—') + '</td></tr>' +
      '<tr><td class="k">Dirección</td><td class="v">' + esc(f.direccion || '—') + '</td></tr>' +
      '<tr><td class="k">CP</td><td class="v">' + esc(f.cp || '—') + '</td></tr>' +
      '<tr><td class="k">Localidad</td><td class="v">' + esc(f.localidad || '—') + '</td></tr>' +
    '</table>';
  }

  $('buscar').addEventListener('input', pintar);

  // Ver/ocultar ficha
  $('lista').addEventListener('click', function (e) {
    var bf = e.target.closest ? e.target.closest('[data-ficha]') : null;
    if (bf) { var id = bf.getAttribute('data-ficha'); ABIERTA[id] = !ABIERTA[id]; pintar(); return; }
    var bq = e.target.closest ? e.target.closest('[data-quitar]') : null;
    if (bq) { quitarGrupo(bq.getAttribute('data-quitar'), bq.getAttribute('data-ent')); return; }
  });

  // Asignar un grupo
  $('lista').addEventListener('change', function (e) {
    var sel = e.target.closest ? e.target.closest('[data-asignar]') : null;
    if (!sel || !sel.value) return;
    asignarGrupo(sel.value, sel.getAttribute('data-asignar'));
  });

  async function asignarGrupo(grupoId, entrenadorId) {
    var g = GRUPOS.filter(function (x) { return x.id === grupoId; })[0];
    // Si el grupo ya tiene otro entrenador, avisa antes de quitárselo.
    if (g && g.entrenador_id && g.entrenador_id !== entrenadorId) {
      var quien = nombreDe(g.entrenador_id) || 'otra persona';
      var ok = await apoConfirm({ titulo: 'Cambiar de entrenador',
        texto: 'El grupo "' + GN(g) + '" ahora lo lleva ' + quien + '.\n\n¿Se lo pasas a ' + (nombreDe(entrenadorId) || 'este entrenador') + '?',
        confirmar: 'Sí, cambiar' });
      if (!ok) { pintar(); return; }
    }
    var r = await sb.from('grupos').update({ entrenador_id: entrenadorId }).eq('id', grupoId);
    if (r.error) { apoToast('No se pudo asignar: ' + r.error.message, 'error'); return; }
    if (g) g.entrenador_id = entrenadorId;
    apoToast('Grupo asignado.', 'ok');
    pintar();
  }

  async function quitarGrupo(grupoId, entrenadorId) {
    var g = GRUPOS.filter(function (x) { return x.id === grupoId; })[0];
    if (!await apoConfirm({ titulo: 'Quitar el grupo', texto: '¿Le quitas "' + (g ? GN(g) : 'este grupo') + '"? El grupo se quedará sin entrenador hasta que le asignes otro.', confirmar: 'Quitar', peligro: true })) return;
    var r = await sb.from('grupos').update({ entrenador_id: null }).eq('id', grupoId);
    if (r.error) { apoToast('No se pudo quitar: ' + r.error.message, 'error'); return; }
    if (g) g.entrenador_id = null;
    apoToast('Grupo quitado.', 'ok');
    pintar();
  }

  cargar();
});
</script>
</body>
</html>
