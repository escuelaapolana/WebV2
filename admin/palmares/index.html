<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmarés · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--linea-borde); border-radius: 10px;
    font-family: var(--fuente-texto); font-size: 15px; background: #fff; color: var(--navy);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }

  .msg { margin-top: 12px; font-size: 14px; }
  .msg.error { color: #B0563A; }
  .msg.ok { color: #1e7a3d; }

  .panel { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,30px); box-shadow: var(--sombra-suave); margin-bottom: 22px; }
  .panel h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 21px; color: var(--navy); margin-bottom: 4px; }
  .intro { color: var(--texto-suave); }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); font-size: 14px; vertical-align: top; }
  th { font-size: 13px; text-transform: none; color: var(--texto-suave); }
  .acciones-fila { display: flex; gap: 8px; white-space: nowrap; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }

  .btn { cursor: pointer; }
  .btn--peligro { background: transparent; border: 1px solid #e0b4b0; color: #B0563A; padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .btn--peligro:hover { background: #fbeceb; }
  .btn--mini { padding: 8px 14px; font-size: 14px; }
  .oculto { display: none !important; }

  /* La casilla del nombre: va pegada al campo del atleta, con su explicación debajo */
  /* La fila entera es la zona que responde al toque, no solo el cuadradito:
     así también vale pulsar el texto, que es lo que la gente hace sin pensar. */
  .fila-check { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 4px 0 0;
    cursor: pointer; }
  .fila-check input { width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--azul); }
  .fila-check span { margin: 0; }
  .pista { font-size: 13px; line-height: 1.45; color: var(--texto-suave); margin: 0 0 4px 30px; max-width: 52ch; }
  /* En el listado, aviso discreto de los que salen con el nombre recortado */
  .aviso-nombre { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px;
    font-size: 12px; white-space: nowrap; color: var(--ambar); background: var(--ambar-fondo); border: 1px solid var(--ambar-borde); }
  /* Edición en ventana emergente (modal), no al fondo de la página */
  #panel-form { position:fixed; inset:0; z-index:1000; background:rgba(46,66,86,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(16px,5vh,60px) 16px; overflow:auto; border:0; border-radius:0; box-shadow:none; margin:0;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #panel-form .modal-caja { background:#fff; border:1px solid var(--linea); border-radius: 14px;
    box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:24px; width:min(660px,100%);
    animation:modal-sube .2s ease; }
  @keyframes modal-sube { from{ transform:translateY(12px); opacity:.6; } to{ transform:none; opacity:1; } }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">

    <div class="panel">
      <h2>Palmarés</h2>
      <p class="intro" style="margin-bottom:10px;">Marcas y resultados destacados del club. Se ordenan del año más reciente al más antiguo.</p>
      <div style="margin-bottom:14px;"><button class="btn btn--primario btn--mini" id="nuevo-palmares">+ Nuevo</button></div>
      <div style="overflow-x:auto;">
        <table id="tabla-palmares">
          <thead><tr><th>Año</th><th>Competición</th><th>Prueba</th><th>Atleta</th><th>Posición</th><th>Ámbito</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="panel oculto" id="panel-form">
      <div class="modal-caja">
      <h2 id="form-titulo">Nuevo registro</h2>
      <form id="form-palmares">
        <input type="hidden" id="pl-id">
        <div class="grid2">
          <div>
            <label for="pl-anyo">Año</label>
            <input type="number" id="pl-anyo" required>
          </div>
          <div>
            <label for="pl-posicion">Posición (1, 2, 3…)</label>
            <input type="number" id="pl-posicion" min="1">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="pl-competicion">Competición</label>
            <input type="text" id="pl-competicion">
          </div>
          <div>
            <label for="pl-prueba">Prueba</label>
            <input type="text" id="pl-prueba" placeholder="100 m, salto de longitud…">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="pl-categoria">Categoría</label>
            <input type="text" id="pl-categoria" placeholder="sub-18, absoluto, veterano…">
          </div>
          <div>
            <label for="pl-atleta">Atleta</label>
            <input type="text" id="pl-atleta">
            <label class="fila-check" for="pl-nombre-publico">
              <input type="checkbox" id="pl-nombre-publico" checked>
              <span>El nombre completo se ve en la web</span>
            </label>
            <p class="pista">Si la quitas, en la web sale «Sergio R.» en vez del nombre completo. El resultado no se toca.</p>
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="pl-ambito">Ámbito</label>
            <input type="text" id="pl-ambito" placeholder="autonómico, nacional…">
          </div>
          <div>
            <label for="pl-sede">Sede</label>
            <input type="text" id="pl-sede" placeholder="Ciudad / instalación">
          </div>
        </div>
        <div style="margin-top:18px; display:flex; gap:10px;">
          <button class="btn btn--primario btn--mini" type="submit">Guardar</button>
          <button class="btn btn--fantasma btn--mini" type="button" id="cancelar">Cancelar</button>
          <span class="msg" id="msg-form"></span>
        </div>
      </form>
      </div>
    </div>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  // --- Listar ---
  async function cargar() {
    var tb = $('tabla-palmares').querySelector('tbody');
    tb.innerHTML = '<tr><td colspan="7" class="sin-etiqueta"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></td></tr>';
    var r = await sb.from('palmares')
      .select('id,anyo,competicion,prueba,categoria,posicion,atleta,ambito,sede,nombre_publico')
      .order('anyo', { ascending: false });
    if (r.error) { tb.innerHTML = '<tr><td colspan="7">Error: ' + esc(r.error.message) + '</td></tr>'; return; }
    if (!r.data.length) { tb.innerHTML = '<tr><td colspan="7">No hay registros todavía.</td></tr>'; return; }
    tb.innerHTML = r.data.map(function (p) {
      return '<tr>' +
        '<td>' + esc(p.anyo) + '</td>' +
        '<td>' + esc(p.competicion || '—') + '</td>' +
        '<td>' + esc(p.prueba || '—') + '</td>' +
        '<td>' + esc(p.atleta || '—') +
          (p.nombre_publico === false ? '<span class="aviso-nombre" title="En la web sale el nombre recortado, no el completo">nombre recortado</span>' : '') + '</td>' +
        '<td>' + esc(p.posicion != null ? p.posicion : '—') + '</td>' +
        '<td>' + esc(p.ambito || '—') + '</td>' +
        '<td class="acciones-fila"><button class="btn btn--fantasma btn--mini" data-editar="' + p.id + '">Editar</button>' +
        '<button class="btn btn--peligro" data-borrar="' + p.id + '">Borrar</button></td>' +
      '</tr>';
    }).join('');
  }

  // --- Crear / editar ---
  function abrirForm(p) {
    p = p || {};
    $('form-titulo').textContent = p.id ? 'Editar registro' : 'Nuevo registro';
    $('pl-id').value = p.id || '';
    $('pl-anyo').value = p.anyo != null ? p.anyo : '';
    $('pl-competicion').value = p.competicion || '';
    $('pl-prueba').value = p.prueba || '';
    $('pl-categoria').value = p.categoria || '';
    $('pl-posicion').value = p.posicion != null ? p.posicion : '';
    $('pl-atleta').value = p.atleta || '';
    $('pl-ambito').value = p.ambito || '';
    $('pl-sede').value = p.sede || '';
    // Un registro nuevo nace con el nombre a la vista
    $('pl-nombre-publico').checked = p.id ? p.nombre_publico !== false : true;
    $('msg-form').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
  }
  $('nuevo-palmares').addEventListener('click', function () { abrirForm(); });
  $('cancelar').addEventListener('click', function () { $('panel-form').classList.add('oculto'); });
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) $('panel-form').classList.add('oculto'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('panel-form').classList.contains('oculto')) $('panel-form').classList.add('oculto'); });

  $('tabla-palmares').addEventListener('click', async function (e) {
    var ed = e.target.getAttribute('data-editar');
    var bo = e.target.getAttribute('data-borrar');
    if (ed) {
      var r = await sb.from('palmares').select('*').eq('id', ed).single();
      if (!r.error) abrirForm(r.data);
    }
    if (bo) {
      if (!await apoConfirm({ texto: '¿Borrar este registro del palmarés? No se puede deshacer.', peligro: true })) return;
      var d = await sb.from('palmares').delete().eq('id', bo);
      if (d.error) { apoToast('No se pudo borrar: ' + d.error.message, 'error'); return; }
      cargar();
    }
  });

  $('form-palmares').addEventListener('submit', async function (e) {
    e.preventDefault();
    var datos = {
      anyo: $('pl-anyo').value !== '' ? Number($('pl-anyo').value) : null,
      competicion: $('pl-competicion').value.trim() || null,
      prueba: $('pl-prueba').value.trim() || null,
      categoria: $('pl-categoria').value.trim() || null,
      posicion: $('pl-posicion').value !== '' ? Number($('pl-posicion').value) : null,
      atleta: $('pl-atleta').value.trim() || null,
      ambito: $('pl-ambito').value.trim() || null,
      sede: $('pl-sede').value.trim() || null,
      nombre_publico: $('pl-nombre-publico').checked
    };
    $('msg-form').textContent = 'Guardando…'; $('msg-form').className = 'msg';
    var id = $('pl-id').value, r;
    if (id) r = await sb.from('palmares').update(datos).eq('id', id);
    else r = await sb.from('palmares').insert(datos);
    if (r.error) { $('msg-form').textContent = 'Error: ' + r.error.message; $('msg-form').className = 'msg error'; return; }
    $('msg-form').textContent = 'Guardado ✓'; $('msg-form').className = 'msg ok';
    $('panel-form').classList.add('oculto');
    cargar();
  });

  cargar();
});
</script>

</body>
</html>
