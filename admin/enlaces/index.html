<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">

<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">
<script>window.APOLANA_BASE="../../";</script>

<style>
  /* ============================================================
     ENLACES · diseño nuevo (23-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios» o «Competiciones»: cabecera
     grande, buscador + chips por sección, una tarjeta por enlace
     agrupadas por sección (franja del color de su mundo), con
     «Copiar» y «WhatsApp» a mano, y una HOJA INFERIOR con el
     enlace entero y todas las formas de mandarlo (copiar, copiar
     con el título, WhatsApp, correo, abrir). Los enlaces son los
     mismos de antes; la pantalla no lee ni escribe nada en la
     base. Prefijo lk-.
     ============================================================ */
  /* Necesario para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .lk-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .lk-wrap *, .lk-capa * { box-sizing: border-box; }

  /* --- Cabecera --- */
  .lk-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; line-height: 1; }
  .lk-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 68ch; }
  .lk-cab p b { color: var(--navy,#26374B); }

  /* --- Buscador + chips (sección) --- */
  .lk-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 4px; }
  .lk-buscar { flex: 1 1 240px; min-width: 0; min-height: 48px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; background: #fff; color: var(--navy,#26374B); }
  .lk-buscar:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .lk-chips { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .lk-chips::-webkit-scrollbar { display: none; }
  .lk-chips button { flex: 1 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px;
    background: none; font: inherit; font-weight: 700; font-size: 13.5px; color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .lk-chips button:hover { color: var(--navy,#26374B); }
  .lk-chips button .pt { width: 8px; height: 8px; border-radius: 999px; background: var(--c); flex: 0 0 8px; }
  .lk-chips button.on { background: var(--navy,#26374B); color: #fff; }
  .lk-pie-filtros { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 4px 2px 0; }
  .lk-cuenta { font-size: 13px; color: var(--texto-suave,#6E6656); }
  @media (max-width: 620px) { .lk-chips { width: 100%; border-radius: 14px; flex-wrap: wrap; } .lk-chips button { flex: 0 0 auto; } }

  /* --- Bloques por sección --- */
  .lk-sec { margin: 22px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-suave,#6E6656);
    display: flex; align-items: center; gap: 8px; }
  .lk-sec i { width: 9px; height: 9px; border-radius: 999px; background: var(--c); flex: 0 0 9px; }
  .lk-sec span { font-weight: 600; letter-spacing: 0; text-transform: none; }
  .lk-lista { container: lk-lista / inline-size; display: flex; flex-direction: column; gap: 8px; }

  /* --- Tarjeta de enlace: el cuerpo abre la hoja; Copiar y WhatsApp, directos --- */
  .lk-fila { --c: #2E4256; position: relative; display: grid; grid-template-columns: 44px minmax(0,1fr) auto 14px; gap: 0 14px; align-items: center;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid var(--c); border-radius: 14px; padding: 12px 14px 12px 12px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .lk-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .lk-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .lk-ico { width: 44px; height: 44px; border-radius: 12px; background: #F0EBE0; background: color-mix(in srgb, var(--c) 13%, #fff); color: var(--c);
    display: flex; align-items: center; justify-content: center; }
  .lk-ico svg { width: 22px; height: 22px; }
  .lk-txt { min-width: 0; }
  .lk-txt b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .lk-txt p { margin: 2px 0 6px; font-size: 13.5px; color: var(--texto-suave,#6E6656); line-height: 1.4; }
  .lk-url { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .lk-url code { display: block; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-size: 12.5px; color: var(--azul-oscuro,#2A5E8C); }
  .lk-pill { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto;
    background: #FBF1D9; color: #8A5307; }
  .lk-acc { position: relative; z-index: 1; display: flex; gap: 6px; }
  .lk-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff; color: var(--navy,#26374B); font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; white-space: nowrap; text-decoration: none; }
  .lk-btn:hover { background: var(--crema,#FBF9F4); }
  .lk-btn.prin { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; min-width: 108px; }
  .lk-btn.prin:hover { background: #24364A; }
  .lk-btn.ok, .lk-btn.ok:hover { background: #1e7a3d; border-color: #1e7a3d; color: #fff; }
  .lk-btn.wa { color: #1F7A4A; }
  .lk-btn.wa:hover { background: #EEF7F1; border-color: #CBE5D4; }
  .lk-btn svg { width: 17px; height: 17px; flex: 0 0 17px; }
  .lk-flecha { color: #B5AC99; font-size: 20px; line-height: 1; text-align: right; }
  /* Lista estrecha (móvil): icono y texto arriba; los dos botones debajo, a lo ancho */
  @container lk-lista (max-width: 600px) {
    .lk-fila { display: flex; flex-wrap: wrap; gap: 10px 12px; padding: 12px 12px 12px 10px; }
    .lk-ico { order: 0; flex: 0 0 44px; }
    .lk-txt { order: 1; flex: 1 1 0; }
    .lk-flecha { order: 2; font-size: 22px; align-self: center; }
    .lk-acc { order: 3; flex: 1 1 100%; }
    .lk-acc .lk-btn { flex: 1 1 0; }
  }
  .lk-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE); border-radius: 14px; margin-top: 12px; line-height: 1.5; }
  .lk-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }
  .lk-vacio button { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linea-borde,#C9C0AE); background: #fff;
    font: inherit; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; }

  /* --- Hoja inferior: el enlace entero y todas las formas de mandarlo --- */
  .lk-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .lk-velo.ver { opacity: 1; pointer-events: auto; }
  .lk-hoja { --c: #2E4256; position: fixed; left: 50%; bottom: 0; width: min(560px,100%); transform: translate(-50%,105%); z-index: 9001; background: #fff; color: var(--navy,#26374B);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transition: transform .25s ease; max-height: 92vh; overflow: auto;
    overscroll-behavior: contain; box-shadow: 0 -10px 40px rgba(20,30,45,.25); visibility: hidden; }
  .lk-hoja.ver { transform: translate(-50%,0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .lk-hoja, .lk-velo, .lk-fila { transition: none; } }
  .lk-hoja .asa { width: 42px; height: 5px; border-radius: 9px; background: #DDD5C4; margin: 2px auto 12px; }
  .lk-hoja-cab { display: flex; align-items: center; gap: 12px; }
  .lk-hoja-cab .lk-ico { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 14px; }
  .lk-hoja-cab .lk-ico svg { width: 26px; height: 26px; }
  .lk-hoja-cab > div { flex: 1; min-width: 0; }
  .lk-hoja h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
  .lk-hoja .sub { color: var(--texto-suave,#6E6656); font-size: 13.5px; margin: 3px 0 0; }
  .lk-cerrar { flex: 0 0 auto; align-self: flex-start; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 20px; line-height: 1; cursor: pointer; }
  .lk-para { margin: 14px 0 0; font-size: 15px; line-height: 1.5; }
  .lk-enlace { margin-top: 12px; background: var(--crema,#FBF9F4); border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px; }
  .lk-enlace span { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-tenue,#9A927F); margin-bottom: 4px; }
  .lk-enlace a { font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-size: 14px; color: var(--azul-oscuro,#2A5E8C); overflow-wrap: anywhere; text-decoration: none; }
  .lk-enlace a:hover { text-decoration: underline; }
  .lk-enlace small { display: block; margin-top: 6px; font-size: 13px; color: var(--texto-suave,#6E6656); line-height: 1.4; }
  .lk-hacc { display: grid; gap: 8px; margin-top: 16px; }
  .lk-hacc .lk-btn { width: 100%; min-height: 48px; border-radius: 12px; font-size: 15px; }
  .lk-hacc .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body class="adm-piel">

<div class="admin-wrap">
  <div class="lk-wrap" id="lk">
    <div class="lk-cab">
      <h1>Enlaces</h1>
      <p>Los enlaces de los formularios del club, para <b>copiar y mandar</b> por WhatsApp, correo o donde quieras. Pulsa «Copiar» o «WhatsApp»; toca un enlace para ver todas las formas de mandarlo.</p>
    </div>
    <div class="lk-filtros">
      <input type="search" class="lk-buscar" id="lk-buscar" placeholder="Buscar un enlace…" aria-label="Buscar un enlace" autocomplete="off">
      <div class="lk-chips" id="lk-chips" role="group" aria-label="Sección"></div>
    </div>
    <div class="lk-pie-filtros"><span class="lk-cuenta" id="lk-cuenta" aria-live="polite"></span></div>
    <div id="lista"></div>
  </div>
</div>

<!-- ===== HOJA DEL ENLACE (se abre al tocar una tarjeta) ===== -->
<div class="lk-capa">
  <div class="lk-velo" id="lk-velo"></div>
  <div class="lk-hoja" id="lk-hoja" role="dialog" aria-modal="true" aria-labelledby="lk-h-tit">
    <div class="asa" aria-hidden="true"></div>
    <div class="lk-hoja-cab">
      <span class="lk-ico" id="lk-h-ico" aria-hidden="true"></span>
      <div><h3 id="lk-h-tit"></h3><p class="sub" id="lk-h-sub"></p></div>
      <button type="button" class="lk-cerrar" id="lk-h-cerrar" aria-label="Cerrar">×</button>
    </div>
    <p class="lk-para" id="lk-h-para"></p>
    <div class="lk-enlace"><span>El enlace</span><a id="lk-h-url" href="#" target="_blank" rel="noopener"></a><small id="lk-h-donde"></small></div>
    <div class="lk-hacc" id="lk-h-acc"></div>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };

  // El dominio público del club: lo que se comparte es SIEMPRE el enlace de
  // verdad, no el de localhost ni el de GitHub Pages desde donde se mire.
  var BASE = 'https://atletismoapolana.com';

  /* Las secciones en las que se agrupan (colores de su mundo en la barra lateral). */
  var SECCIONES = [
    { k: 'cubo',   t: 'El Cubo',            c: '#B5714A' },
    { k: 'atl',    t: 'Atletismo',          c: '#4A5FA6' },
    { k: 'socios', t: 'Socios y monitores', c: '#2E4256' },
    { k: 'app',    t: 'La app',             c: '#2F6FA8' }
  ];

  var ENLACES = [
    { s: 'cubo',   i: 'pesa',    t: 'Fuerza gratis del Cubo (octubre)', d: 'Los 3 turnos gratuitos de fuerza (viernes, sábado, domingo). Se apuntan sin pagar.', u: '/cubo/fuerza-gratis/' },
    { s: 'cubo',   i: 'alta',    t: 'Apuntarse a El Cubo', d: 'Crea su cuenta, elige turno y días. La cuota se cobra después.', u: '/cubo/apuntarse/' },
    { s: 'atl',    i: 'crono',   t: 'Probar atletismo en pista', d: 'Formulario corto para pedir una prueba en pista (sin cuenta). Lo ves en «Pruebas de pista».', u: '/pista/probar/' },
    { s: 'socios', i: 'silbato', t: 'Alta de monitor / entrenador', d: 'Para que los monitores se den de alta con su ficha completa.', u: '/entrenador/alta/' },
    { s: 'socios', i: 'carne',   t: 'Hazte socio', d: 'Alta de socio con domiciliación (SEPA) y cuenta de acceso.', u: '/socio/alta/' },
    { s: 'atl',    i: 'hoja',    t: 'Inscripción a la escuela', d: 'Formulario de la escuela de atletismo (Google Forms).', u: 'https://forms.gle/2fj2LLnExUMUkkyH6', externo: true },
    { s: 'app',    i: 'grupo',   t: 'Entra a tu grupo', d: 'Alta de un atleta en un grupo, con el código que da el entrenador.', u: '/acceso-grupo/' },
    { s: 'app',    i: 'movil',   t: 'Instalar la app', d: 'Para que se instalen la web como app en el móvil.', u: '/app/' }
  ];

  var ICO = {
    pesa:    '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
    alta:    '<circle cx="9" cy="8" r="4"/><path d="M2.5 21a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/>',
    crono:   '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.5h4M18.5 6.5l1.5-1.5"/>',
    silbato: '<circle cx="9" cy="8" r="4"/><path d="M2.5 21a6.5 6.5 0 0 1 13 0"/><path d="m16 11 2 2 4-4"/>',
    carne:   '<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2.2"/><path d="M5.5 16a3.2 3.2 0 0 1 6 0M14.5 10h4M14.5 13.5h3"/>',
    hoja:    '<path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8.5 13h7M8.5 17h5"/>',
    grupo:   '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2a5 5 0 0 1 5 5"/>',
    movil:   '<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>'
  };
  function ico(k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICO[k] || ICO.hoja) + '</svg>'; }
  var I_COPIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  var I_WA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5l1.3-4.1A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 8.8c.2 2.9 2.4 5.3 5.4 6l1.1-1.4-2-1-.9.8a4.6 4.6 0 0 1-2.2-2.2l.8-.9-1-2z" fill="currentColor" stroke-width="1"/></svg>';
  var I_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  var I_ABRIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>';

  function urlDe(e) { return e.externo ? e.u : (BASE + e.u); }
  function secDe(e) { return SECCIONES.filter(function (s) { return s.k === e.s; })[0] || SECCIONES[2]; }
  function waDe(e) { return 'https://wa.me/?text=' + encodeURIComponent(e.t + ': ' + urlDe(e)); }
  function mailDe(e) { return 'mailto:?subject=' + encodeURIComponent(e.t + ' · Club Atletismo Apolana') + '&body=' + encodeURIComponent(urlDe(e)); }

  /* ---------- chips + lista ---------- */
  var FSEC = '';
  $('lk-chips').innerHTML = '<button type="button" data-s="">Todos</button>' + SECCIONES.map(function (s) {
    return '<button type="button" data-s="' + s.k + '" style="--c:' + s.c + '"><span class="pt"></span>' + esc(s.t) + '</button>';
  }).join('');

  function filtrados() {
    var q = ($('lk-buscar').value || '').trim().toLowerCase();
    return ENLACES.filter(function (e) {
      if (FSEC && e.s !== FSEC) return false;
      if (!q) return true;
      return (e.t + ' ' + e.d + ' ' + urlDe(e) + ' ' + secDe(e).t).toLowerCase().indexOf(q) !== -1;
    });
  }

  function filaHtml(e) {
    var url = urlDe(e), sec = secDe(e), n = ENLACES.indexOf(e);
    return '<div class="lk-fila" style="--c:' + sec.c + '" tabindex="0" role="button" data-n="' + n + '" aria-label="' + esc(e.t) + ': ver todas las formas de mandarlo">' +
      '<span class="lk-ico">' + ico(e.i) + '</span>' +
      '<div class="lk-txt"><b>' + esc(e.t) + '</b><p>' + esc(e.d) + '</p>' +
        '<span class="lk-url"><code>' + esc(url.replace(/^https?:\/\//, '')) + '</code>' + (e.externo ? '<span class="lk-pill">fuera de la web</span>' : '') + '</span></div>' +
      '<div class="lk-acc">' +
        '<button type="button" class="lk-btn prin" data-copiar="' + esc(url) + '">' + I_COPIAR + '<span>Copiar</span></button>' +
        '<a class="lk-btn wa" href="' + esc(waDe(e)) + '" target="_blank" rel="noopener" aria-label="Mandar «' + esc(e.t) + '» por WhatsApp">' + I_WA + '<span>WhatsApp</span></a>' +
      '</div>' +
      '<span class="lk-flecha" aria-hidden="true">›</span>' +
    '</div>';
  }

  function pintar() {
    Array.prototype.forEach.call(document.querySelectorAll('#lk-chips button'), function (b) {
      var on = (b.getAttribute('data-s') || '') === FSEC;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var lista = filtrados();
    $('lk-cuenta').textContent = lista.length === ENLACES.length ? ENLACES.length + ' enlaces' : lista.length + ' de ' + ENLACES.length + ' enlaces';
    if (!lista.length) {
      $('lista').innerHTML = '<div class="lk-vacio"><b>Ningún enlace con esta búsqueda</b><button type="button" data-limpiar>Quitar el filtro</button></div>';
      return;
    }
    $('lista').innerHTML = SECCIONES.map(function (s) {
      var de = lista.filter(function (e) { return e.s === s.k; });
      if (!de.length) return '';
      return '<h2 class="lk-sec" style="--c:' + s.c + '"><i></i>' + esc(s.t) + ' <span>' + de.length + '</span></h2>' +
        '<div class="lk-lista">' + de.map(filaHtml).join('') + '</div>';
    }).join('');
  }

  /* ---------- copiar (igual que antes) ---------- */
  async function copiar(texto) {
    var copiado = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(texto); copiado = true; }
    } catch (e) { copiado = false; }
    if (!copiado) {
      // Reserva por si el navegador no deja copiar directamente.
      try {
        var ta = document.createElement('textarea');
        ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        copiado = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) { copiado = false; }
    }
    return copiado;
  }
  async function botonCopiar(boton, texto) {
    var copiado = await copiar(texto);
    var et = boton.querySelector('span') || boton;
    if (copiado) {
      if (!boton.__antes) boton.__antes = et.textContent;
      et.textContent = '¡Copiado!'; boton.classList.add('ok');
      clearTimeout(boton.__t);
      boton.__t = setTimeout(function () { et.textContent = boton.__antes; boton.classList.remove('ok'); }, 1600);
    } else if (window.apoToast) {
      apoToast('No se ha podido copiar. Mantén pulsado el enlace y cópialo a mano.', 'error');
    }
  }

  /* ---------- hoja ---------- */
  var focoPrevio = null;
  function abrirHoja(n, desde) {
    var e = ENLACES[n];
    if (!e) return;
    focoPrevio = desde || document.activeElement;
    var url = urlDe(e), sec = secDe(e);
    $('lk-hoja').style.setProperty('--c', sec.c);
    $('lk-h-ico').innerHTML = ico(e.i);
    $('lk-h-tit').textContent = e.t;
    $('lk-h-sub').textContent = sec.t;
    $('lk-h-para').textContent = e.d;
    $('lk-h-url').textContent = url;
    $('lk-h-url').href = url;
    $('lk-h-donde').textContent = e.externo ? 'Es un formulario de fuera de la web del club (Google Forms).' : 'En la web del club: es el mismo enlace se mire desde donde se mire.';
    $('lk-h-acc').innerHTML =
      '<button type="button" class="lk-btn prin" data-copiar="' + esc(url) + '">' + I_COPIAR + '<span>Copiar el enlace</span></button>' +
      '<button type="button" class="lk-btn" data-copiar="' + esc(e.t + ': ' + url) + '">' + I_COPIAR + '<span>Copiar con el título</span></button>' +
      '<div class="dos">' +
        '<a class="lk-btn wa" href="' + esc(waDe(e)) + '" target="_blank" rel="noopener">' + I_WA + '<span>WhatsApp</span></a>' +
        '<a class="lk-btn" href="' + esc(mailDe(e)) + '">' + I_MAIL + '<span>Correo</span></a>' +
      '</div>' +
      '<a class="lk-btn" href="' + esc(url) + '" target="_blank" rel="noopener">' + I_ABRIR + '<span>Abrir el formulario</span></a>';
    $('lk-velo').classList.add('ver'); $('lk-hoja').classList.add('ver');
    $('lk-hoja').scrollTop = 0;
    setTimeout(function () { $('lk-h-cerrar').focus(); }, 60);
  }
  function cerrarHoja() {
    if (!$('lk-hoja').classList.contains('ver')) return;
    $('lk-velo').classList.remove('ver'); $('lk-hoja').classList.remove('ver');
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) focoPrevio.focus();
  }
  $('lk-velo').addEventListener('click', cerrarHoja);
  $('lk-h-cerrar').addEventListener('click', cerrarHoja);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarHoja(); });
  $('lk-h-acc').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-copiar]') : null;
    if (b) botonCopiar(b, b.getAttribute('data-copiar'));
  });

  /* ---------- clics en la pantalla ---------- */
  $('lk').addEventListener('click', function (ev) {
    if (!ev.target.closest) return;
    var chip = ev.target.closest('#lk-chips [data-s]');
    if (chip) { FSEC = chip.getAttribute('data-s') || ''; pintar(); return; }
    if (ev.target.closest('[data-limpiar]')) { FSEC = ''; $('lk-buscar').value = ''; pintar(); $('lk-buscar').focus(); return; }
    var boton = ev.target.closest('[data-copiar]');
    if (boton) { botonCopiar(boton, boton.getAttribute('data-copiar')); return; }
    if (ev.target.closest('a')) return;          // WhatsApp abre WhatsApp, no la hoja
    var fila = ev.target.closest('.lk-fila[data-n]');
    if (fila) abrirHoja(parseInt(fila.getAttribute('data-n'), 10), fila);
  });
  $('lk').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var fila = ev.target.closest && ev.target.closest('.lk-fila[data-n]');
    if (!fila || ev.target !== fila) return;
    ev.preventDefault(); abrirHoja(parseInt(fila.getAttribute('data-n'), 10), fila);
  });
  $('lk-buscar').addEventListener('input', pintar);

  pintar();
});
</script>
</body>
