<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enlaces · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 900px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }
  .enl-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(26px,5vw,34px); color: var(--navy); margin: 0 0 4px; }
  .enl-cab p { font-size: 15px; color: var(--texto-suave); margin: 0 0 22px; max-width: 60ch; line-height: 1.6; }

  .enl-lista { display: flex; flex-direction: column; gap: 14px; }
  .enl-card { background: #fff; border: 1px solid var(--linea); border-radius: 14px; box-shadow: var(--sombra-suave);
    padding: 16px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .enl-txt { flex: 1 1 260px; min-width: 0; }
  .enl-txt b { display: block; font-size: 16px; color: var(--navy); }
  .enl-txt p { margin: 3px 0 8px; font-size: 14px; color: var(--texto-suave); line-height: 1.5; }
  .enl-txt code { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--fuente-dato, monospace); font-size: 13px; color: var(--azul-oscuro, #2F6FA8);
    background: var(--crema, #FBF9F4); border: 1px solid var(--linea-borde, #D4CBB9); border-radius: 8px; padding: 5px 9px; vertical-align: middle; }
  .enl-acc { display: flex; gap: 8px; flex: 0 0 auto; }
  .enl-acc button, .enl-acc a { min-height: 42px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; font-family: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .enl-acc button { border: 1px solid var(--azul-filete, #3B85C0); background: var(--navy, #2E4256); color: #fff; font-weight: 600; }
  .enl-acc button:hover { filter: brightness(1.08); }
  .enl-acc button.ok { background: #1e7a3d; border-color: #1e7a3d; }
  .enl-acc a { border: 1px solid var(--linea-borde, #C9C0AE); background: #fff; color: var(--navy, #2E4256); }
  .enl-acc a:hover { background: var(--crema-media, #F1EADC); }
  @media (max-width: 520px) { .enl-acc { flex: 1 1 100%; } .enl-acc button, .enl-acc a { flex: 1 1 auto; } }
</style>
</head>
<body class="adm-piel">

<div class="admin-wrap">
  <div class="enl-cab">
    <h1>Enlaces</h1>
    <p>Los enlaces de los formularios del club, para <b>copiar y mandar</b> (WhatsApp, correo…). Pulsa «Copiar» y pégalo donde quieras.</p>
  </div>
  <div class="enl-lista" id="lista"></div>
</div>

<script>
APOLANA_ADMIN.listo(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };

  // El dominio público del club: lo que se comparte es SIEMPRE el enlace de
  // verdad, no el de localhost ni el de GitHub Pages desde donde se mire.
  var BASE = 'https://atletismoapolana.com';

  var ENLACES = [
    { t: 'Fuerza gratis del Cubo (octubre)', d: 'Los 3 turnos gratuitos de fuerza (viernes, sábado, domingo). Se apuntan sin pagar.', u: '/cubo/fuerza-gratis/' },
    { t: 'Apuntarse a El Cubo', d: 'Crea su cuenta, elige turno y días. La cuota se cobra después.', u: '/cubo/apuntarse/' },
    { t: 'Alta de monitor / entrenador', d: 'Para que los monitores se den de alta con su ficha completa.', u: '/entrenador/alta/' },
    { t: 'Hazte socio', d: 'Alta de socio con domiciliación (SEPA) y cuenta de acceso.', u: '/socio/alta/' },
    { t: 'Inscripción a la escuela', d: 'Formulario de la escuela de atletismo (Google Forms).', u: 'https://forms.gle/2fj2LLnExUMUkkyH6', externo: true },
    { t: 'Entra a tu grupo', d: 'Alta de un atleta en un grupo, con el código que da el entrenador.', u: '/acceso-grupo/' },
    { t: 'Instalar la app', d: 'Para que se instalen la web como app en el móvil.', u: '/app/' }
  ];

  function urlDe(e) { return e.externo ? e.u : (BASE + e.u); }

  $('lista').innerHTML = ENLACES.map(function (e) {
    var url = urlDe(e);
    return '<div class="enl-card">' +
      '<div class="enl-txt"><b>' + esc(e.t) + '</b><p>' + esc(e.d) + '</p>' +
        '<code>' + esc(url) + '</code></div>' +
      '<div class="enl-acc">' +
        '<button type="button" data-copiar="' + esc(url) + '">Copiar</button>' +
        '<a href="' + esc(url) + '" target="_blank" rel="noopener">Abrir</a>' +
      '</div></div>';
  }).join('');

  $('lista').addEventListener('click', async function (ev) {
    var boton = ev.target.closest ? ev.target.closest('[data-copiar]') : null;
    if (!boton) return;
    var url = boton.getAttribute('data-copiar');
    var copiado = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(url); copiado = true; }
    } catch (e) { copiado = false; }
    if (!copiado) {
      // Reserva por si el navegador no deja copiar directamente.
      try {
        var ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        copiado = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) { copiado = false; }
    }
    if (copiado) {
      var antes = boton.textContent;
      boton.textContent = '¡Copiado!'; boton.classList.add('ok');
      setTimeout(function () { boton.textContent = antes; boton.classList.remove('ok'); }, 1600);
    } else if (window.apoToast) {
      apoToast('No se ha podido copiar. Mantén pulsado el enlace y cópialo a mano.', 'error');
    }
  });
});
</script>
</body>
</html>
