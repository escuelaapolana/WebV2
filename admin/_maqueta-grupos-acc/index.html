<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · acciones de fila</title>
<link rel="stylesheet" href="../../assets/css/apolana.css">
<style>
  body { background: var(--crema-media, #F1EADC); margin: 0; font-family: var(--fuente-texto, system-ui); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 30px 24px; }
  .panel { background:#fff; border:1px solid var(--linea,#E7DFCD); border-radius:18px; padding:24px 26px; }
  h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 16px; }
  table { width:100%; border-collapse: collapse; }
  th, td { text-align:left; padding:14px 8px; border-bottom:1px solid var(--linea,#EDE6D7); font-size:14px; vertical-align: middle; }
  th { font-size:13px; color: var(--texto-suave); font-weight:600; }
  .nom { font-weight:600; color: var(--navy); }
  .nom small { display:block; font-weight:400; color: var(--texto-suave); }
  .maq-nota { max-width:1000px; margin:0 auto; padding:16px 24px 0; color:#8A8271; font-size:13px; }

  .acciones-fila { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; }
  .acc-ic { width: 40px; height: 40px; flex: 0 0 auto; border: 1px solid var(--linea-borde, #C9C0AE);
    background: #fff; border-radius: 10px; display: inline-grid; place-items: center; cursor: pointer;
    color: var(--texto-suave, #6E6656); transition: background .15s, color .15s, border-color .15s; }
  .acc-ic svg { width: 19px; height: 19px; }
  .acc-ic:hover { background: var(--crema-media, #F1EADC); color: var(--navy, #26374B); }
  .acc-ic--peligro:hover { background: #fbeceb; color: #B0563A; border-color: #e0b4b0; }
</style>
</head>
<body>
  <p class="maq-nota">Maqueta · así quedan las acciones de cada fila (pasa el ratón por la papelera). Datos de ejemplo.</p>
  <div class="wrap"><div class="panel">
    <h1>Grupos de entrenamiento</h1>
    <table>
      <thead><tr><th>Nombre</th><th>Sección</th><th>Horario</th><th>Activo</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div></div>
<script>
  var FILAS = [
    { nom:'A partir de Sub-14', sub:'', sec:'Escuela de atletismo', hor:'—' },
    { nom:'Azul 1', sub:'lunes y miércoles', sec:'Escuela de atletismo', hor:'Lunes y miércoles 17:30-18:30 · Estadio Joaquín Villar' },
    { nom:'Azul 1', sub:'martes y jueves', sec:'Escuela de atletismo', hor:'Martes y jueves 17:30-18:30 · Estadio Joaquín Villar' },
    { nom:'Rojo 2', sub:'lunes y miércoles', sec:'Escuela de atletismo', hor:'Lunes y miércoles 18:00-19:00 · Estadio Joaquín Villar' }
  ];
  var EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
  var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
  document.getElementById('tb').innerHTML = FILAS.map(function(f){
    return '<tr><td><span class="nom">'+f.nom+(f.sub?'<small>'+f.sub+'</small>':'')+'</span></td>'+
      '<td>'+f.sec+'</td><td>'+f.hor+'</td><td><span class="pill pill-si">Sí</span></td>'+
      '<td><div class="acciones-fila">'+
        '<button type="button" class="acc-ic" title="Editar" aria-label="Editar">'+EDIT+'</button>'+
        '<button type="button" class="acc-ic acc-ic--peligro" title="Borrar" aria-label="Borrar">'+TRASH+'</button>'+
      '</div></td></tr>';
  }).join('');
</script>
</body>
</html>
