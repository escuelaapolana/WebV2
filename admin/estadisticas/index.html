<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estadísticas · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<script src="../../assets/js/admin-filtros.js" defer></script>
<style>
  /* ============================================================
     Cómo va el club · panel  (maqueta 41b y 41c)
     ------------------------------------------------------------
     Cada gráfica responde una pregunta que alguien se hace de
     verdad, y lleva por titular la conclusión, no el nombre del
     eje. Debajo, una frase que dice qué hacer. Barras planas de
     dos tonos: navy el dato que importa, azul claro el contexto
     y ámbar solo donde hay un problema. Sin degradados, sin
     sombras y sin esquinas redondeadas. Y todo dato que pide una
     decisión lleva su acción al lado.
     ============================================================ */
  body { background: var(--crema); }
  .admin-wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px,4vw,40px) clamp(24px,4vw,44px); }

  /* --- Cabecera de pantalla (kit 30h) --- */
  .cab-linea { border-bottom:1px solid var(--linea); }
  .cab { max-width:1180px; margin:0 auto; padding: 20px clamp(16px,4vw,40px) 16px;
         display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end; justify-content:space-between; }
  .migas { display:flex; align-items:center; gap:8px; font-size:14px; color: var(--texto-suave); margin-bottom:5px; }
  .migas b { font-weight:400; color: var(--texto); }
  .migas i { font-style:normal; color: var(--linea-borde); }
  .cab h1 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size: 28px; line-height:1; color: var(--navy); margin:0; letter-spacing:.01em; }
  .cab h1 .cuenta { font-family: var(--fuente-dato); font-size:15px; font-weight:400; text-transform:none;
                    letter-spacing:normal; color:#8A5307; margin-left:11px; vertical-align:baseline; }
  .cab .acciones { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  /* El recuento lo lleva la propia cabecera: se apaga el automático de la piel. */
  body.adm-piel #admin-contenido .adm-cuenta-tit { display:none !important; }

  /* --- Banda de contexto: a sangre y sin radio --- */
  .banda { background: var(--crema-banda); border-bottom:1px solid var(--linea-marcada); margin-bottom:22px; }
  .banda .dentro { max-width:1180px; margin:0 auto; padding:12px clamp(16px,4vw,40px);
                   display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:14px; color: var(--texto); }
  .banda .temporada { margin-left:auto; font-family: var(--fuente-dato); font-size:14px; color:#8A5307; }

  .filtros { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .filtros label { display:block; font-size:13px; color: var(--texto-suave); margin:0 0 5px; }
  select { box-sizing:border-box; min-height:44px; padding:10px 13px; border:1px solid var(--linea-borde);
           border-radius:10px; font-family: var(--fuente-texto); font-size:15px; background:#fff; color: var(--navy); }
  select:focus { outline:2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }

  /* --- Lo que pide una decisión: fila con su acción al lado --- */
  .decide { background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; margin-bottom:26px; overflow:hidden; }
  .decide h2 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; color: var(--navy);
               margin:0; padding:16px 18px 10px; }
  .decide .fila { display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap;
                  padding:12px 18px; border-top:1px solid var(--linea); min-height:48px; box-sizing:border-box; }
  .decide .fila .dato { font-family: var(--fuente-dato); font-weight:700; font-size:19px; color: var(--navy);
                        min-width:74px; font-variant-numeric: tabular-nums; }
  .decide .fila.urge .dato { color:#8A5307; }
  .decide .fila .que { flex:1 1 240px; min-width:0; font-size:15px; line-height:1.45; color: var(--texto); }
  .decide .fila .bmini { flex:0 0 auto; }
  .decide .todo-bien { padding:14px 18px 18px; font-size:15px; line-height:1.5; color:#2F5A36; border-top:1px solid var(--linea); }

  /* --- Rejilla de gráficas --- */
  .rejilla { display:grid; gap:18px; margin-bottom:18px; }
  .rejilla.dos { grid-template-columns: 1.35fr 1fr; }
  .rejilla.tres { grid-template-columns: repeat(3, minmax(0,1fr)); }
  @media (max-width: 1000px) { .rejilla.dos, .rejilla.tres { grid-template-columns:1fr; } }

  .g { background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; padding:17px 19px;
       display:flex; flex-direction:column; gap:13px; min-width:0; }
  .g .titular { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase;
                font-size:22px; line-height:1.05; color: var(--navy); }
  .g .quemide { font-size:14px; color: var(--texto-suave); margin-top:3px; }
  .g .cuerpo { min-width:0; }
  /* La frase de qué hacer: verde buena noticia, ámbar hay que actuar, gris contexto. */
  .g .quehacer { font-size:14px; line-height:1.45; color: var(--texto-suave);
                 border-top:1px solid var(--linea); padding-top:11px; margin-top:auto;
                 display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; }
  .g .quehacer.bien { color:#2F5A36; }
  .g .quehacer.actuar { color:#6B5227; }
  .g .quehacer span { flex:1 1 220px; min-width:0; }

  /* --- Barras verticales planas: sin degradados, sin radios --- */
  .cols { display:flex; align-items:flex-end; gap:6px; height:150px; border-bottom:1px solid var(--linea-marcada); }
  .cols > span { flex:1 1 0; min-width:0; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; }
  .cols i { display:block; width:100%; background: var(--azul-claro, #C0D9EC); }
  .cols i.foco { background: var(--navy); }
  .cols i.mal  { background:#C98F5A; }
  .pies { display:flex; gap:6px; margin-top:7px; }
  .pies > span { flex:1 1 0; min-width:0; text-align:center; font-size:13px; color: var(--texto-suave);
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pies > span.foco { color: var(--navy); }
  .cifras-col { display:flex; gap:6px; margin-bottom:5px; }
  .cifras-col > span { flex:1 1 0; min-width:0; text-align:center; font-family: var(--fuente-dato);
                       font-size:13px; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .cifras-col > span.foco { color: var(--navy); font-weight:700; }

  /* --- Barras horizontales planas, con la cifra al lado y en mono --- */
  .barras { display:flex; flex-direction:column; gap:8px; }
  .barras .fila { display:flex; align-items:center; gap:11px; }
  .barras { --rot: 88px; }
  .barras .rot { flex:0 0 auto; width: var(--rot); font-size:14px; color: var(--texto);
                 overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barras .rot.hora { font-family: var(--fuente-dato); width:52px; }
  .barras .pista { flex:1 1 auto; min-width:0; height:16px; background: var(--crema-banda); display:block; }
  .barras .pista i { display:block; height:100%; background: var(--navy); }
  .barras .pista i.mal { background:#C98F5A; }
  .barras .val { flex:0 0 auto; min-width:46px; text-align:right; font-family: var(--fuente-dato);
                 font-size:14px; color: var(--navy); font-variant-numeric: tabular-nums; }
  .barras .val.mal { color:#8A5307; }
  @media (max-width: 480px) { .barras .rot { width:70px; } }

  /* Sin datos, sin gráfica: la cifra sola y una línea que lo explica. */
  .aun-no { display:flex; flex-direction:column; gap:6px; padding:6px 0 4px; }
  .aun-no .cifra { font-family: var(--fuente-dato); font-weight:700; font-size:30px; line-height:1; color: var(--navy); }
  .aun-no .cifra small { font-family: var(--fuente-texto); font-weight:400; font-size:15px; color: var(--texto-suave); margin-left:8px; }
  .aun-no p { margin:0; font-size:14px; line-height:1.5; color: var(--texto-suave); }

  .bmini { cursor:pointer; font-family: var(--fuente-texto); font-size:14px; min-height:44px; padding:10px 16px;
           border-radius:999px; border:1px solid #C9C0AE; background:#fff; color: var(--navy); white-space:nowrap;
           display:inline-flex; align-items:center; text-decoration:none; }
  .bmini:hover { background: var(--crema); color: var(--navy); }

  .leyenda { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:14px; color: var(--texto); }
  .leyenda span { display:inline-flex; align-items:center; gap:7px; }
  .leyenda i { width:12px; height:12px; display:inline-block; }

  .fallo { background: var(--ambar-fondo); border:1px solid var(--ambar-borde); border-radius:14px;
           padding:14px 16px; font-size:15px; line-height:1.45; color: var(--texto); }
  .fallo b { display:block; color:#8A5307; }
  .oculto { display:none !important; }
  .nota-pie { font-size:13px; line-height:1.5; color: var(--texto-suave); margin-top:8px; max-width:78ch; }
</style>
</head>
<body>

<div id="admin-contenido">

  <div class="cab-linea">
    <div class="cab">
      <div>
        <div class="migas"><span>Análisis de datos</span><i>/</i><b>Estadísticas</b></div>
        <h1>Cómo va el club<span class="cuenta" id="cuenta-cab"></span></h1>
      </div>
      <div class="acciones">
        <!-- Los chips de «lo que está puesto» los pone assets/js/admin-filtros.js -->
        <div class="filtros" data-chips>
          <div>
            <label for="f-seccion">Sección</label>
            <select id="f-seccion" data-chip="Sección"><option value="">Todo el club</option></select>
          </div>
        </div>
        <a class="bmini" href="../historico/">Histórico de la escuela</a>
      </div>
    </div>
  </div>

  <div class="banda"><div class="dentro">
    <span>Todo sale de la base de datos del club y se lee al abrir esta página: no hay nada guardado a mano.</span>
    <span class="temporada" id="txt-leido"></span>
  </div></div>

  <div class="admin-wrap">

    <!-- Lo que pide una decisión, con su acción en la fila -->
    <div class="decide" id="decide">
      <h2>Lo que pide una decisión</h2>
      <div class="fila"><span class="dato"><span class="adm-esq" style="width:52px;height:20px;margin:0"></span></span>
        <span class="que"><span class="adm-esq adm-esq--medio" style="margin:0"></span></span></div>
    </div>

    <div id="graficas"></div>

    <p class="nota-pie" id="nota-pie"></p>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(async function (sb) {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

  var fmtNum = new Intl.NumberFormat('es-ES');
  function num(n) { return fmtNum.format(Math.round(Number(n) || 0)); }
  function eur(n) { return num(n) + ' €'; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var SEC_LABEL = { competicion:'Competición', natacion:'Natación', escuela:'Escuela', running:'Running',
                    triatlon:'Triatlón', montana:'Montaña', 'escuela-natacion':'Escuela de natación', cubo:'El Cubo' };

  function estrecho() { return window.matchMedia('(max-width: 760px)').matches; }

  /* ---------- piezas de dibujo ----------
     Barras planas, dos tonos y la cifra siempre al lado, en mono y
     alineada a la derecha: nada de pasar el ratón para saber cuánto
     mide algo. Nunca una escala de seis colores.                     */

  /* filas: [{rot, valor, texto, mal, hora}] */
  function barrasH(filas, ancho) {
    var max = 0;
    filas.forEach(function (f) { if (f.valor > max) max = f.valor; });
    if (!max) max = 1;
    return '<div class="barras"' + (ancho ? ' style="--rot:' + ancho + 'px"' : '') + '>' + filas.map(function (f) {
      /* Un cero no pinta barra: una raya mínima haría creer que hay algo. */
      var ancho = f.valor > 0 ? Math.max(1, Math.round(f.valor / max * 100)) : 0;
      return '<div class="fila">' +
        '<span class="rot' + (f.hora ? ' hora' : '') + '" title="' + esc(f.rot) + '">' + esc(f.rot) + '</span>' +
        '<span class="pista"><i class="' + (f.mal ? 'mal' : '') + '" style="width:' + ancho + '%"></i></span>' +
        '<span class="val' + (f.mal ? ' mal' : '') + '">' + esc(f.texto != null ? f.texto : num(f.valor)) + '</span>' +
        '</div>';
    }).join('') + '</div>';
  }

  /* cols: [{rot, valor, foco, mal, texto}] */
  function barrasV(cols, alto) {
    var max = 0;
    cols.forEach(function (c) { if (c.valor > max) max = c.valor; });
    if (!max) max = 1;
    var h = alto || 150;
    return '<div>' +
      '<div class="cifras-col">' + cols.map(function (c) {
        return '<span class="' + (c.foco ? 'foco' : '') + '">' + esc(c.texto != null ? c.texto : num(c.valor)) + '</span>';
      }).join('') + '</div>' +
      '<div class="cols" style="height:' + h + 'px">' + cols.map(function (c) {
        var px = Math.max(2, Math.round(c.valor / max * (h - 12)));
        return '<span><i class="' + (c.mal ? 'mal' : (c.foco ? 'foco' : '')) + '" style="height:' + px + 'px"></i></span>';
      }).join('') + '</div>' +
      '<div class="pies">' + cols.map(function (c) {
        return '<span class="' + (c.foco ? 'foco' : '') + '" title="' + esc(c.rot) + '">' + esc(c.rot) + '</span>';
      }).join('') + '</div></div>';
  }

  /* Una gráfica entera: el titular ES la conclusión. Si no hay titular
     que poner, esa gráfica no hace falta y no se pinta. */
  function tarjeta(o) {
    return '<div class="g">' +
      '<div><div class="titular">' + esc(o.titular) + '</div>' +
      '<div class="quemide">' + esc(o.quemide) + '</div></div>' +
      '<div class="cuerpo">' + o.cuerpo + '</div>' +
      (o.frase ? '<div class="quehacer ' + (o.tono || '') + '"><span>' + esc(o.frase) + '</span>' +
        (o.accion || '') + '</div>' : '') +
      '</div>';
  }
  function accion(texto, url) {
    return '<a class="bmini" href="' + esc(url) + '">' + esc(texto) + '</a>';
  }

  /* ================= CARGA ================= */
  var grupos, atletas, pagos, cubClases, cubReservas, escHist, asistencia;
  var secDe = {}, vivos = [], hayDatos = false;

  var ESQUELETO_DECIDE = '<h2>Lo que pide una decisión</h2>' +
    '<div class="fila"><span class="dato"><span class="adm-esq" style="width:52px;height:20px;margin:0"></span></span>' +
    '<span class="que"><span class="adm-esq adm-esq--medio" style="margin:0"></span></span></div>';

  /* Las siete consultas se leen de una vez porque los titulares se calculan
     cruzando unas con otras: si falla cualquiera, no se puede pintar ni una
     gráfica sin arriesgarse a decir algo que no es. */
  async function leerTodo() {
    var r = await Promise.all([
      sb.from('grupos').select('id,nombre,turno,seccion,activo').limit(5000),
      sb.from('atletas').select('id,nombre,estado,categoria,grupo_id,fecha_prueba_fin').limit(5000),
      sb.from('pagos').select('importe,estado,fecha_pago,fecha_vencimiento,anulado').limit(5000),
      sb.from('cubo_clases').select('id,fecha,hora_inicio,plazas,activa').limit(5000),
      sb.from('cubo_reservas').select('clase_id,estado').limit(5000),
      sb.from('escuela_historico').select('*').limit(5000),
      sb.from('asistencia').select('presente,fecha,grupo_id').limit(5000)
    ]);
    var err = null;
    r.forEach(function (x) { if (x.error && !err) err = x.error; });
    if (err) throw err;
    grupos = r[0].data || []; atletas = r[1].data || [];
    /* En la gráfica de grupos que no arrancan cada barra lleva el nombre del
       grupo. La escuela tiene dos con cada nombre, uno de lunes y miércoles y
       otro de martes y jueves: dos barras «Azul 2» con números distintos no
       dirían cuál es la que se queda vacía. Se les añaden los días. */
    grupos.forEach(function (g) {
      if (g.turno && window.APOLANA_GRUPO_NOMBRE) g.nombre = window.APOLANA_GRUPO_NOMBRE(g);
    });
    pagos = (r[2].data || []).filter(function (p) { return !p.anulado; });
    cubClases = r[3].data || []; cubReservas = r[4].data || [];
    escHist = r[5].data || []; asistencia = r[6].data || [];
  }

  /* El desplegable se rehace con cada lectura y se respeta la sección que
     hubiera elegida; el escuchador se engancha una sola vez, para que un
     reintento no acabe pintando dos veces con cada cambio. */
  var selectorEnganchado = false;
  function prepararSelector() {
    var n = {};
    vivos.forEach(function (a) { var s = secDe[a.grupo_id]; if (s) n[s] = (n[s] || 0) + 1; });
    var claves = Object.keys(n).sort(function (a, b) { return n[b] - n[a]; });
    var sel = $('f-seccion'), previa = sel.value;
    sel.innerHTML = '<option value="">Todo el club</option>';
    claves.forEach(function (k) {
      var o = document.createElement('option');
      o.value = k; o.textContent = (SEC_LABEL[k] || k) + ' · ' + n[k];
      sel.appendChild(o);
    });
    if (claves.indexOf(previa) > -1) sel.value = previa;
    if (!selectorEnganchado) { sel.addEventListener('change', pintar); selectorEnganchado = true; }
  }

  /* Volver a intentarlo repite solo la lectura de esta pantalla. Recargar la
     página entera hacía perder la sección elegida y volvía a pasar por el
     control de acceso sin necesidad. */
  async function arrancar() {
    hayDatos = false;
    $('decide').classList.remove('oculto');
    $('decide').innerHTML = ESQUELETO_DECIDE;
    $('graficas').innerHTML = '';
    $('nota-pie').textContent = '';
    try {
      await leerTodo();
    } catch (e) {
      /* Sin datos no hay ni decisiones ni gráficas: se apaga el bloque de
         arriba y manda el aviso, en ámbar y con su botón de reintentar. */
      $('decide').classList.add('oculto');
      $('cuenta-cab').textContent = '';
      $('graficas').innerHTML = ADM.error((e && e.message) ? e.message : 'Puede ser la conexión.', arrancar);
      return;
    }

    var hoy = new Date();
    $('txt-leido').textContent = 'leído el ' + hoy.getDate() + ' de ' + MESES[hoy.getMonth()] + ' de ' + hoy.getFullYear();

    secDe = {};
    grupos.forEach(function (g) { secDe[g.id] = g.seccion; });
    vivos = atletas.filter(function (a) { return a.estado !== 'baja'; });
    $('cuenta-cab').textContent = num(vivos.length) + (vivos.length === 1 ? ' persona' : ' personas');

    hayDatos = true;
    prepararSelector();
    pintar();
  }

  /* ================= HISTÓRICO DE LA ESCUELA =================
     Es la única serie larga que tiene el club: trece temporadas de
     inscripciones reales. De aquí salen las preguntas que de verdad
     se hace la junta.                                               */
  function serieEscuela() {
    var mapa = {};
    escHist.forEach(function (f) {
      if (f.programa !== 'escuela') return;
      mapa[f.temporada] = f;
    });
    return Object.keys(mapa).sort().map(function (t) { return mapa[t]; });
  }
  function tempCorta(t) { return String(t).replace('.', '-').replace(/^20/, ''); }

  /* ================= PINTADO ================= */
  function pintar() {
    var sec = $('f-seccion').value;
    var gente = sec ? vivos.filter(function (a) { return secDe[a.grupo_id] === sec; }) : vivos;
    var bloques = [];

    /* ---------- 1 · ¿estamos perdiendo gente? ---------- */
    var serie = serieEscuela();
    if (serie.length >= 3) {
      var ult = serie[serie.length - 1];
      var cols = serie.map(function (f, i) {
        return { rot: tempCorta(f.temporada), valor: Number(f.apuntados_total) || 0,
                 foco: i === serie.length - 1 };
      });
      /* El titular sale de los datos, no de una frase escrita a mano. */
      var bajadas = 0;
      for (var i = serie.length - 1; i > 0; i--) {
        if ((serie[i].apuntados_total || 0) < (serie[i - 1].apuntados_total || 0)) bajadas++;
        else break;
      }
      /* En columnas trece temporadas no caben en un móvil sin que las cifras
         se peguen unas a otras: ahí la misma serie va en barras tumbadas. */
      var cuerpoEsc = estrecho()
        ? barrasH(cols.map(function (c) { return { rot: c.rot, valor: c.valor, mal: false }; }), 56)
        : barrasV(cols, 156);
      var techo = serie.reduce(function (a, f) { return Math.max(a, Number(f.apuntados_total) || 0); }, 0);
      var titular, frase, tono;
      if (bajadas >= 2) {
        titular = 'La escuela lleva ' + bajadas + ' temporadas bajando';
        frase = 'Del máximo de ' + num(techo) + ' se ha pasado a ' + num(ult.apuntados_total) + ' apuntados. ' +
                'Es la cifra que decide el presupuesto del año que viene.';
        tono = 'actuar';
      } else if (bajadas === 1) {
        titular = 'La escuela ha bajado esta temporada';
        frase = 'De ' + num(serie[serie.length - 2].apuntados_total) + ' a ' + num(ult.apuntados_total) +
                ' apuntados. Una temporada suelta no es una tendencia, pero conviene mirarla.';
        tono = '';
      } else {
        titular = 'La escuela vuelve a crecer';
        frase = num(ult.apuntados_total) + ' apuntados, más que la temporada pasada.';
        tono = 'bien';
      }
      bloques.push({ ancho: 'dos', html: tarjeta({
        titular: titular,
        quemide: 'Personas apuntadas a la escuela del club, por temporada',
        cuerpo: cuerpoEsc,
        frase: frase, tono: tono,
        accion: accion('Ver el histórico', '../historico/')
      }) });
    }

    /* ---------- 2 · ¿se quedan tras la clase de prueba? ---------- */
    var conPrueba = serie.filter(function (f) { return f.vinieron_a_probar && f.se_quedaron; });
    if (conPrueba.length >= 2) {
      var u = conPrueba[conPrueba.length - 1];
      var ant = conPrueba[conPrueba.length - 2];
      var pU = pct(u.se_quedaron, u.vinieron_a_probar);
      var pA = pct(ant.se_quedaron, ant.vinieron_a_probar);
      /* Fracciones antes que porcentajes: «149 de 225» dice más que «66 %». */
      var filas = conPrueba.slice(-5).map(function (f, i, todas) {
        return { rot: tempCorta(f.temporada), valor: pct(f.se_quedaron, f.vinieron_a_probar),
                 texto: num(f.se_quedaron) + '/' + num(f.vinieron_a_probar),
                 mal: i === todas.length - 1 && pct(f.se_quedaron, f.vinieron_a_probar) < 70 };
      });
      bloques.push({ html: tarjeta({
        titular: pU >= 70 ? 'Quien viene a probar, se queda' : 'Uno de cada tres se va tras probar',
        quemide: 'De los que vienen a la clase de prueba, cuántos se apuntan',
        cuerpo: barrasH(filas),
        frase: num(u.se_quedaron) + ' de ' + num(u.vinieron_a_probar) + ' se quedaron en ' + u.temporada +
               (pU < pA ? ', menos que en ' + ant.temporada + '. La clase de prueba es donde se gana o se pierde una familia.'
                        : ', mejor que en ' + ant.temporada + '.'),
        tono: pU >= 70 ? 'bien' : 'actuar'
      }) });
    }

    /* ---------- 3 · ¿en qué edad se van? ---------- */
    var CATS = [ { c:'sub6', n:'Sub 6' }, { c:'sub8', n:'Sub 8' }, { c:'sub10', n:'Sub 10' },
                 { c:'sub12', n:'Sub 12' }, { c:'sub14', n:'Sub 14' }, { c:'sub16', n:'Sub 16' },
                 { c:'sub18', n:'Sub 18' } ];
    var ultima = serie[serie.length - 1];
    if (ultima) {
      var vals = CATS.map(function (c) { return { n: c.n, v: ultima[c.c] == null ? null : Number(ultima[c.c]) }; })
                     .filter(function (x) { return x.v != null; });
      if (vals.length >= 4) {
        /* El escalón más grande hacia abajo: ahí es donde se pierde gente. */
        var peor = null;
        for (var k = 1; k < vals.length; k++) {
          var caida = vals[k - 1].v - vals[k].v;
          if (vals[k - 1].v > 0 && (!peor || caida > peor.caida)) {
            peor = { caida: caida, de: vals[k - 1], a: vals[k], porcion: caida / vals[k - 1].v };
          }
        }
        var filasCat = vals.map(function (x) {
          return { rot: x.n, valor: x.v, mal: peor && peor.porcion >= 0.3 && x.n === peor.a.n };
        });
        bloques.push({ html: tarjeta({
          titular: (peor && peor.porcion >= 0.3) ? 'Se van al llegar a ' + peor.a.n.toLowerCase() : 'La escuela se reparte por igual',
          quemide: 'Atletas de la escuela por categoría, temporada ' + ultima.temporada,
          cuerpo: barrasH(filasCat),
          frase: (peor && peor.porcion >= 0.3)
            ? 'De ' + peor.de.n.toLowerCase() + ' a ' + peor.a.n.toLowerCase() + ' se pierde ' +
              Math.round(peor.porcion * 100) + ' de cada 100. Es donde hay que hacer algo.'
            : 'No hay ningún escalón grande entre categorías.',
          tono: (peor && peor.porcion >= 0.3) ? 'actuar' : 'bien'
        }) });
      }
    }

    /* ---------- 4 · ¿cómo nos conocen? ---------- */
    var VIAS = [ { c:'capt_amigos', n:'Boca a boca' }, { c:'capt_hermano', n:'Un hermano' },
                 { c:'capt_whatsapp', n:'WhatsApp' }, { c:'capt_campus', n:'El campus' },
                 { c:'capt_facebook', n:'Facebook' } ];
    if (ultima) {
      var vias = VIAS.map(function (v) { return { rot: v.n, valor: ultima[v.c] == null ? null : Number(ultima[v.c]) }; })
                     .filter(function (v) { return v.valor != null; })
                     .sort(function (a, b) { return b.valor - a.valor; });
      if (vias.length >= 3) {
        var totalV = vias.reduce(function (a, v) { return a + v.valor; }, 0);
        var primera = vias[0];
        bloques.push({ html: tarjeta({
          titular: pct(primera.valor, totalV) >= 50 ? 'Casi todos llegan por ' + primera.rot.toLowerCase() : 'Llegan por varios sitios',
          quemide: 'Cómo nos conocieron las familias, temporada ' + ultima.temporada,
          cuerpo: barrasH(vias),
          frase: num(primera.valor) + ' de ' + num(totalV) + ' familias llegaron por ' + primera.rot.toLowerCase() +
                 '. Lo que funciona es que hablen bien de nosotros, no la publicidad.',
          tono: ''
        }) });
      }
    }

    /* ---------- 5 · ¿qué turno llena El Cubo? ---------- */
    (function () {
      var activas = cubClases.filter(function (c) { return c.activa; });
      if (!activas.length) return;
      var porHora = {}, deClase = {};
      activas.forEach(function (c) {
        var h = String(c.hora_inicio || '').slice(0, 5) || '—';
        deClase[c.id] = h;
        porHora[h] = porHora[h] || { plazas: 0, ocupadas: 0, clases: 0 };
        porHora[h].plazas += Number(c.plazas) || 0;
        porHora[h].clases++;
      });
      cubReservas.forEach(function (rv) {
        if (rv.estado !== 'reservada' && rv.estado !== 'asistida') return;
        var h = deClase[rv.clase_id];
        if (h && porHora[h]) porHora[h].ocupadas++;
      });
      var horas = Object.keys(porHora).sort();
      if (horas.length < 2) return;
      var filas = horas.map(function (h) {
        var x = porHora[h];
        return { rot: h, hora: true, valor: pct(x.ocupadas, x.plazas),
                 texto: num(x.ocupadas) + '/' + num(x.plazas), mal: pct(x.ocupadas, x.plazas) < 40 };
      });
      var flojos = filas.filter(function (f) { return f.mal; });
      bloques.push({ html: tarjeta({
        titular: flojos.length
          ? (flojos.length === 1 ? 'El turno de las ' + flojos[0].rot + ' va vacío' : 'Hay ' + flojos.length + ' turnos casi vacíos')
          : 'El Cubo va lleno a todas horas',
        quemide: 'Plazas ocupadas de las ofrecidas, por hora de clase',
        cuerpo: barrasH(filas),
        frase: flojos.length
          ? 'Los turnos de ' + flojos.map(function (f) { return f.rot; }).join(' y ') +
            ' no llegan ni a la mitad. O se juntan con otro o se promocionan.'
          : 'Todos los turnos pasan del 40 % de ocupación.',
        tono: flojos.length ? 'actuar' : 'bien',
        accion: accion('Ver El Cubo', '../cubo/')
      }) });
    })();

    /* ---------- 6 · ¿quién falta mucho? ----------
       Sin datos, sin gráfica: con unas pocas semanas de lista pasada
       esto no dice nada todavía, y decirlo es más honesto que dibujar
       una gráfica de dos barras.                                      */
    (function () {
      var lista = sec ? asistencia.filter(function (a) { return secDe[a.grupo_id] === sec; }) : asistencia;
      var dias = {};
      lista.forEach(function (a) { if (a.fecha) dias[a.fecha] = 1; });
      var nDias = Object.keys(dias).length;
      var pres = lista.filter(function (a) { return a.presente; }).length;
      if (nDias >= 20) {
        bloques.push({ html: tarjeta({
          titular: pct(pres, lista.length) >= 80 ? 'La gente viene a entrenar' : 'Falta uno de cada cuatro',
          quemide: 'Asistencia registrada en la pista, sobre ' + num(nDias) + ' días de lista',
          cuerpo: barrasH([{ rot: 'Vinieron', valor: pres, texto: num(pres) + '/' + num(lista.length) }]),
          frase: num(pres) + ' de ' + num(lista.length) + ' registros son presencias.',
          tono: pct(pres, lista.length) >= 80 ? 'bien' : 'actuar',
          accion: accion('Pasar lista', '../campo/')
        }) });
      } else {
        bloques.push({ html: tarjeta({
          titular: 'Todavía no se puede decir quién falta',
          quemide: 'Asistencia en la pista',
          cuerpo: '<div class="aun-no"><span class="cifra">' + num(nDias) + '<small>' +
                  (nDias === 1 ? 'día de lista pasada' : 'días de lista pasada') + '</small></span>' +
                  '<p>Hacen falta unas cuantas semanas seguidas de lista para que esto diga algo. ' +
                  'Mientras tanto, la cifra sola es más honesta que una gráfica.</p></div>',
          frase: 'Cuanto más se pase lista en la pista, antes se sabrá quién se está descolgando.',
          tono: '',
          accion: accion('Pasar lista', '../campo/')
        }) });
      }
    })();

    /* ---------- 7 · ¿cuánto entra cada mes? ---------- */
    (function () {
      var mes = {};
      pagos.forEach(function (p) {
        if (p.estado !== 'pagado' || !p.fecha_pago) return;
        var k = String(p.fecha_pago).slice(0, 7);
        mes[k] = (mes[k] || 0) + (Number(p.importe) || 0);
      });
      var conCobro = Object.keys(mes).sort();
      if (conCobro.length < 3) return;
      /* Los meses sin cobros también cuentan: pintarlos seguidos, saltándose
         los vacíos, haría creer que se cobra todos los meses. */
      var claves = [], p0 = conCobro[0].split('-'), p1 = conCobro[conCobro.length - 1].split('-');
      var a = +p0[0], m = +p0[1];
      while (a < +p1[0] || (a === +p1[0] && m <= +p1[1])) {
        claves.push(a + '-' + (m < 10 ? '0' : '') + m);
        m++; if (m > 12) { m = 1; a++; }
      }
      claves = claves.slice(-8);
      var mejor = claves.reduce(function (x, k) { return (mes[k] || 0) > (mes[x] || 0) ? k : x; }, claves[0]);
      var total = claves.reduce(function (x, k) { return x + (mes[k] || 0); }, 0);
      /* En horizontal porque los importes son largos: así la cifra cabe
         entera al lado de su barra y se pueden sumar con la vista. */
      var filas = claves.map(function (k) {
        var t = k.split('-');
        return { rot: MESES[+t[1] - 1].slice(0, 3) + ' ' + t[0].slice(2), valor: mes[k] || 0,
                 texto: num(mes[k] || 0) };
      });
      var tm = mejor.split('-');
      var parte = pct(mes[mejor] || 0, total);
      bloques.push({ ancho: 'dos', html: tarjeta({
        titular: 'El grueso entra en ' + MESES[+tm[1] - 1],
        quemide: 'Cobrado por mes, según la fecha de cobro del recibo',
        cuerpo: barrasH(filas, 62),
        frase: 'De los ' + eur(total) + ' cobrados en estos ' + claves.length + ' meses, ' +
               eur(mes[mejor] || 0) + ' entraron en ' + MESES[+tm[1] - 1] + ' de ' + tm[0] +
               ' (' + parte + ' de cada 100). Es el mes en que la web tiene que estar lista.',
        tono: ''
      }) });
    })();

    /* ---------- 8 · ¿qué grupos no arrancan? ---------- */
    (function () {
      var cuenta = {};
      grupos.forEach(function (g) { if (g.activo && (!sec || g.seccion === sec)) cuenta[g.id] = 0; });
      gente.forEach(function (a) { if (a.grupo_id in cuenta) cuenta[a.grupo_id]++; });
      var lista = grupos.filter(function (g) { return g.id in cuenta; })
        .map(function (g) { return { rot: g.nombre, valor: cuenta[g.id] }; })
        .sort(function (a, b) { return a.valor - b.valor; });
      if (lista.length < 3) return;
      var flojos = lista.filter(function (g) { return g.valor < 5; });
      var pocos = lista.slice(0, 6).map(function (g) {
        return { rot: g.rot, valor: g.valor, mal: g.valor < 5 };
      });
      bloques.push({ html: tarjeta({
        titular: flojos.length ? (flojos.length + ' grupos no llegan a cinco') : 'Todos los grupos tienen gente',
        quemide: 'Los grupos con menos atletas, de los ' + num(lista.length) + ' que hay abiertos',
        cuerpo: barrasH(pocos, 132),
        frase: flojos.length
          ? 'Un grupo de menos de cinco cuesta lo mismo que uno lleno. O se juntan o se abren a más gente.'
          : 'Ningún grupo se queda por debajo de cinco atletas.',
        tono: flojos.length ? 'actuar' : 'bien',
        accion: accion('Ver los grupos', '../grupos/')
      }) });
    })();

    /* ---------- lo que pide una decisión, con su acción ---------- */
    pintarDecisiones(gente);

    /* La primera va ancha; el resto, de tres en tres. */
    var anchas = bloques.filter(function (b) { return b.ancho === 'dos'; });
    var normales = bloques.filter(function (b) { return b.ancho !== 'dos'; });
    var html = '';
    if (anchas.length) html += '<div class="rejilla dos">' + anchas.map(function (b) { return b.html; }).join('') + '</div>';
    if (normales.length) html += '<div class="rejilla tres">' + normales.map(function (b) { return b.html; }).join('') + '</div>';
    $('graficas').innerHTML = html || '<div class="fallo"><b>Todavía no hay datos suficientes</b>' +
      'En cuanto el club lleve unas temporadas de fichas, cobros y listas, esta pantalla se llena sola.</div>';

    $('nota-pie').textContent = 'Cada gráfica responde una pregunta concreta. Si alguna deja de servir para decidir algo, ' +
      'lo suyo es quitarla: una pantalla de datos que nadie usa acaba estorbando.';
  }

  function pintarDecisiones(gente) {
    var filas = [];

    var impagados = pagos.filter(function (p) { return p.estado === 'impagado'; });
    var deuda = impagados.reduce(function (a, p) { return a + (Number(p.importe) || 0); }, 0);
    if (impagados.length) {
      filas.push({ urge: true, dato: eur(deuda),
        que: impagados.length + (impagados.length === 1 ? ' recibo devuelto sin resolver.' : ' recibos devueltos sin resolver.'),
        btn: 'Ir a cobros', url: '../cobros/' });
    }

    var prueba = gente.filter(function (a) { return a.estado === 'prueba'; });
    if (prueba.length) {
      var hoyIso = new Date().toISOString().slice(0, 10);
      var acaban = prueba.filter(function (a) { return a.fecha_prueba_fin && a.fecha_prueba_fin <= hoyIso; });
      filas.push({ urge: acaban.length > 0, dato: num(prueba.length),
        que: acaban.length
          ? 'personas en periodo de prueba, y a ' + num(acaban.length) + ' ya se les ha pasado la fecha.'
          : 'personas en periodo de prueba. Hay que decidir si se quedan.',
        btn: 'Ver las fichas', url: '../atletas/' });
    }

    var lesionados = gente.filter(function (a) { return a.estado === 'lesionado'; });
    if (lesionados.length) {
      filas.push({ dato: num(lesionados.length),
        que: lesionados.length === 1 ? 'persona lesionada ahora mismo.' : 'personas lesionadas ahora mismo.',
        btn: 'Ver las fichas', url: '../atletas/' });
    }

    var sinGrupo = gente.filter(function (a) { return !a.grupo_id; });
    if (sinGrupo.length) {
      filas.push({ urge: true, dato: num(sinGrupo.length),
        que: sinGrupo.length === 1 ? 'persona sin grupo asignado: no le sale ni horario ni lista.'
                                   : 'personas sin grupo asignado: no les sale ni horario ni lista.',
        btn: 'Asignar grupo', url: '../atletas/' });
    }

    var html = '<h2>Lo que pide una decisión</h2>';
    if (!filas.length) {
      html += '<p class="todo-bien">No hay nada pendiente de decidir: sin recibos devueltos, sin periodos de prueba ' +
              'sin cerrar y todo el mundo con su grupo.</p>';
    } else {
      html += filas.map(function (f) {
        return '<div class="fila' + (f.urge ? ' urge' : '') + '">' +
          '<span class="dato">' + esc(f.dato) + '</span>' +
          '<span class="que">' + esc(f.que) + '</span>' +
          '<a class="bmini" href="' + esc(f.url) + '">' + esc(f.btn) + '</a></div>';
      }).join('');
    }
    $('decide').innerHTML = html;
  }

  arrancar();

  /* Al girar el móvil o cambiar el tamaño, la misma serie puede tener que
     pasar de columnas a barras tumbadas. Si la lectura falló no hay nada que
     repintar: lo que se ve es el aviso, y girar el móvil no lo arregla. */
  var espera = null, eraEstrecho = estrecho();
  window.addEventListener('resize', function () {
    clearTimeout(espera);
    espera = setTimeout(function () {
      if (!hayDatos) return;
      if (estrecho() === eraEstrecho) return;
      eraEstrecho = estrecho();
      pintar();
    }, 180);
  });
});
</script>

</body>
</html>
