<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>
window.APOLANA_BASE = "../../";
/* Base de mentira, solo para comprobar la navegación sin credenciales. */
var NOMBRES = ['Iván Requena','Lucía Avisos','Marta Sanz','Adrián Onandía','Isabel Peña','Noa Avilés','Hugo Martín','Sara Aviño'];
window.APOLANA_DB = {
  from: function () {
    var b = {
      select: function () { return b; },
      order:  function () { return b; },
      limit:  function () { return b; },
      then: function (res) {
        setTimeout(function () {
          res({ data: NOMBRES.map(function (n, i) {
            var p = n.split(' ');
            return { id: 'id-' + i, nombre: p[0], apellidos: p.slice(1).join(' '), categoria: 'sub-16', estado: 'activo' };
          }), error: null });
        }, 30);
        return { catch: function () {} };
      }
    };
    return b;
  }
};
/* Teclado de iOS de mentira: visualViewport que encoge, que es lo único que
   avisa de que el teclado ha subido. __teclado(true) lo levanta. */
(function () {
  var q = new URLSearchParams(location.search);
  if (!q.has('teclado')) return;
  var alto = +q.get('teclado') || 216, abierto = false;
  var vv = new EventTarget();
  Object.defineProperty(vv, 'height',     { get: function () { return window.innerHeight - (abierto ? alto : 0); } });
  Object.defineProperty(vv, 'width',      { get: function () { return window.innerWidth; } });
  Object.defineProperty(vv, 'offsetTop',  { get: function () { return 0; } });
  Object.defineProperty(vv, 'offsetLeft', { get: function () { return 0; } });
  Object.defineProperty(vv, 'pageTop',    { get: function () { return 0; } });
  try { Object.defineProperty(window, 'visualViewport', { value: vv, configurable: true }); } catch (e) {}
  window.__teclado = function (si) { abierto = !!si; vv.dispatchEvent(new Event('resize')); };
})();
</script>
<style>
.adm-top{background:#2E4256;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px clamp(14px,4vw,40px);min-height:60px;flex-wrap:nowrap;width:100%;box-sizing:border-box}
.adm-top .izq{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.adm-top a.volver{color:#cdd6e0;text-decoration:none;font-size:15px;display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;padding:10px 12px;margin-left:-12px;border-radius:10px;min-height:44px;box-sizing:border-box}
.adm-top .marca{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:20px;line-height:1.15;color:#fff;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.adm-top .der{display:flex;align-items:center;gap:12px;font-size:14px;color:#cdd6e0;min-width:0;flex:0 0 auto}
.adm-top .der span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.adm-top button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:10px 18px;min-height:44px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap;flex:0 0 auto}
html,body{max-width:100%;overflow-x:hidden}
@media(max-width:900px){.adm-top .der span{display:none}}
</style>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>body{background:var(--crema-media)} .admin-wrap{max-width:1000px;margin:0 auto;padding:24px 16px}</style>
</head>
<body>
<div class="adm-top">
  <div class="izq"><a class="volver" href="../"><i>←</i><span class="txt">Panel</span></a><span class="sep">·</span><span class="marca">Verificación</span></div>
  <div class="der"><span>prueba@local</span><button>Salir</button></div>
</div>
<div id="admin-contenido"><div class="admin-wrap">

  <p>Contenido largo para comprobar que no hay desplazamiento horizontal.</p>
  <p style="height:1200px">.</p>
</div></div>
