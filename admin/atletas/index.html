<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atletas · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<!-- La escalera de categorías, sin `defer` a propósito: los bloques de
     abajo la usan y tienen que encontrarla ya puesta. -->
<script src="../../assets/js/categorias.js"></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<script src="../../assets/js/admin-filtros.js" defer></script>
<style>
  /* ============================================================
     ATLETAS · patrón de pantalla de listado del panel (maqueta 40a)
     ------------------------------------------------------------
     Cabecera · banda de filtros a sangre · dos columnas.
     La piel común (cuatro estados, aviso único, tabla→ficha por
     debajo de 720 px, rótulos de 13 px) vive en admin-tabbar.js y
     los chips de filtro en admin-filtros.js: aquí solo va la
     estructura, la jerarquía y el ritmo.
     ============================================================ */
  body { background: var(--crema); }

  /* El envoltorio no estrecha: las bandas van a sangre y son ellas
     las que anclan. (También hace que la piel común encuentre el
     buscador de la banda y no monte otro encima de la tabla.) */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .lados { padding-inline: clamp(16px, 3.2vw, 34px); }
  .centro { max-width: 1400px; margin-inline: auto; }

  /* --- Cabecera: migas, título con el recuento y dos acciones --- */
  .pcab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
          gap: 14px; padding-block: 18px 15px; border-bottom: 1px solid var(--linea); }
  .migas { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--texto-suave); margin-bottom: 4px; }
  .migas .sep { color: #A79F8E; }
  .migas .aqui { color: var(--texto); }
  .pcab h1 { font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
             font-size: 28px; line-height: 1; color: var(--navy); margin: 0; }
  .pcab .acciones { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Tres niveles de botón y ni uno más. El azul relleno es uno por
     pantalla: aquí, «Nuevo atleta». */
  .btn { cursor: pointer; }
  .b2 { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
        padding: 10px 17px; border: 1px solid #C9C0AE; border-radius: 999px; background: #fff;
        color: var(--navy); font-family: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
  .b2:hover { background: var(--crema); border-color: var(--linea-borde); color: var(--navy); }
  .b3 { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
        padding: 10px 12px; border: 0; border-radius: 999px; background: none;
        color: var(--azul-oscuro); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .b3:hover { background: var(--crema-media); color: var(--azul-hover); }

  /* --- Banda de filtros: crema fuerte, a sangre y sin radio --- */
  .banda { background: var(--crema-banda); border-bottom: 1px solid var(--linea-marcada);
           padding-block: 12px; border-radius: 0; }
  .filtros { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0; }
  .filtros input[type="search"], .filtros select {
    box-sizing: border-box; min-height: 44px; padding: 10px 14px; border: 1px solid var(--linea-borde);
    border-radius: 999px; background: #fff; font-family: inherit; font-size: 15px; color: var(--navy); }
  /* El buscador va primero y con sitio para un nombre entero */
  .filtros input[type="search"] { flex: 1 1 260px; max-width: 320px; }
  .filtros select { flex: 0 1 auto; max-width: 210px; }
  .filtros input:focus, .filtros select:focus { outline: 2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }
  /* «32 de 206»: dice a la vez cuánto hay filtrado y cuánto hay en total */
  .cuenta { margin-left: auto; font-family: var(--fuente-dato); font-size: 14px; color: var(--texto-suave); white-space: nowrap; }
  .banda .apf-chips { margin: 9px 0 0; }

  /* --- Cuerpo: lista a la izquierda, contexto a la derecha --- */
  .cuerpo { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 24px;
            align-items: start; padding-block: 18px 26px; }
  @media (max-width: 1080px) { .cuerpo { grid-template-columns: 1fr; } }

  /* --- Tabla: separadores horizontales y nada más --- */
  .envol { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 400; font-size: 13px; color: var(--texto-suave);
       padding: 0 8px 9px; border-bottom: 2px solid var(--linea-marcada); white-space: nowrap; }
  th.num { text-align: right; }
  /* El nombre manda: se queda con el sitio que sobra y el resto no se estira */
  th:nth-child(1) { width: 42%; }
  th:nth-child(3) { width: 140px; }
  th:nth-child(4) { width: 122px; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--linea); font-size: 15px; vertical-align: middle; }
  tbody tr.fila { cursor: pointer; }
  tbody tr.fila:hover { background: #F6F2E8; }
  tbody tr.fila:focus-visible { outline: 2px solid var(--azul-filete, #3B85C0); outline-offset: -2px; }
  /* La fila que pide algo va con fondo ámbar, y su motivo se lee al lado */
  tbody tr.pide { background: var(--ambar-fondo); }
  tbody tr.pide:hover { background: #F9EBD3; }

  .persona { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .ini { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 999px; background: var(--crema-media);
         display: flex; align-items: center; justify-content: center; font-family: var(--fuente-titulo);
         font-weight: 700; font-size: 13px; color: var(--texto); }
  tr.pide .ini { background: #F6EBD6; color: #8A5307; }
  .persona .nom { display: block; color: var(--navy); line-height: 1.25; }
  .persona .sub { display: block; font-size: 14px; color: var(--texto-suave); line-height: 1.3; }

  /* Estado = punto de 9 px + palabra. Nunca solo color. */
  .pill-estado { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--navy); }
  .pill-estado .pt { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 999px; background: var(--texto-suave); }
  .e-activo   .pt { background: var(--verde); }
  .e-prueba   .pt { background: var(--ambar); }
  .e-lesion   .pt { background: var(--ambar); }
  .e-baja     .pt { background: #A79F8E; }
  .e-sin      .pt { background: #A79F8E; }
  .e-baja, .e-sin { color: var(--texto-suave); }

  td.num { text-align: right; font-family: var(--fuente-dato); white-space: nowrap; color: var(--navy); }
  td.num .sinc { display: block; font-family: var(--fuente-texto); font-size: 13px; color: #8A5307; }
  td.num .debe { color: #8A5307; }
  /* «sin recibos» es una palabra, no una cifra: no va en monoespaciada */
  td.num .nada { font-family: var(--fuente-texto); font-size: 14px; color: var(--texto-suave); }

  .pie-lista { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 12px; font-size: 14px; color: var(--texto-suave); }

  /* --- Lateral --- */
  aside { display: flex; flex-direction: column; gap: 12px; }
  .tar { background: #fff; border: 1px solid var(--linea-marcada); border-radius: var(--radio); padding: 15px 17px; }
  .tar h2 { font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
            font-size: 21px; line-height: 1; color: var(--navy); margin: 0 0 11px; }
  .par { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .par .k { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--texto); }
  .par .k .pt { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 999px; }
  .par .v { font-family: var(--fuente-dato); font-size: 15px; color: var(--navy); }
  .par.raya { border-top: 1px solid var(--linea); margin-top: 6px; padding-top: 9px; }

  /* Aviso: ámbar en fondo suave, con icono y con su acción al lado */
  .avis { background: var(--ambar-fondo); border: 1px solid var(--ambar-borde); border-radius: var(--radio);
          padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .avis .t { font-size: 15px; font-weight: 600; color: #6B5227; }
  .avis .d { font-size: 14px; line-height: 1.5; color: #6B5227; }
  .avis .b2 { align-self: flex-start; border-color: #E0CDA8; color: #6B5227; }
  .avis .b2:hover { background: #fff; }

  .nota { background: var(--crema-banda); border-radius: var(--radio); padding: 14px 16px;
          display: flex; flex-direction: column; gap: 4px; }
  .nota .t { font-size: 15px; font-weight: 600; color: var(--navy); }
  .nota .d { font-size: 14px; line-height: 1.5; color: var(--texto); }
  .nota a { font-weight: 600; }

  /* --- Ficha: se abre encima, en ventana sobre la lista --- */
  #panel-form { position: fixed; inset: 0; z-index: 1000; background: rgba(46,66,86,.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: clamp(16px,5vh,60px) 16px; overflow: auto;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  #panel-form .modal-caja { background: #fff; border: 1px solid var(--linea); border-radius: 14px;
    box-shadow: 0 30px 70px -25px rgba(46,66,86,.55); padding: 24px; width: min(680px,100%);
    animation: modal-sube .2s ease; }
  @keyframes modal-sube { from { transform: translateY(12px); opacity: .6; } to { transform: none; opacity: 1; } }
  .modal-caja h2 { font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
                   font-size: 21px; color: var(--navy); margin: 0 0 4px; }
  .modal-caja .sub-ficha { font-size: 14px; color: var(--texto-suave); margin: 0 0 6px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin: 12px 0 5px; }
  input, select { width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--linea-borde);
    border-radius: 10px; font-size: 15px; font-family: var(--fuente-texto); background: #fff; color: var(--navy); }
  input:focus, select:focus { outline: 2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
  .pie-form { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn--peligro { background: transparent; border: 1px solid #e0b4b0; color: #B0563A; padding: 10px 18px;
    border-radius: 999px; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center;
    justify-content: center; cursor: pointer; font-family: inherit; margin-left: auto; }
  .btn--mini { padding: 10px 18px; font-size: 14px; min-height: 44px; display: inline-flex;
    align-items: center; justify-content: center; }
  .msg { font-size: 14px; }
  .msg.error { color: #B0563A; } .msg.ok { color: #3D6220; }
  .oculto { display: none !important; }

  /* --- Móvil: la tabla es ficha (lo hace la piel común); aquí solo
         se recolocan las piezas propias de esta pantalla --- */
  @media (max-width: 720px) {
    .pcab { padding-block: 14px 12px; }
    .pcab .acciones { width: 100%; }
    .pcab .acciones .b2, .pcab .acciones .btn { flex: 1 1 auto; }
    .filtros input[type="search"], .filtros select { max-width: none; flex: 1 1 100%; }
    .cuenta { margin-left: 0; width: 100%; }
    .cuerpo { padding-block: 14px 20px; }
    body.adm-piel table.adm-tabla tbody tr.pide { background: var(--ambar-fondo); border-color: var(--ambar-borde); }
    body.adm-piel table.adm-tabla tbody td.adm-estado { display: flex; justify-content: flex-end; }
    body.adm-piel table.adm-tabla tbody td.num { text-align: left; }
    /* el rótulo de la línea de datos es texto, aunque el dato sea una cifra */
    body.adm-piel table.adm-tabla tbody td.num::before { font-family: var(--fuente-texto); }
    .persona .sub { font-size: 14px; font-weight: 400; }
  }

  /* Las especialidades del atleta eran casillas de trece píxeles puestas en
     línea, tan juntas que con el dedo se fallaba más de lo que se acertaba.
     Ahora cada una es una pastilla entera que se pulsa, con la altura de un
     dedo. El cuadradito desaparece de la vista, pero la casilla sigue ahí
     debajo: se puede recorrer con el teclado y se marca con la barra
     espaciadora, igual que antes. */
  /* Las dos cajas de marcar de la ficha —especialidades y los demás
     grupos— se dibujan igual: mismo recuadro, mismo alto máximo y la
     misma barra de desplazamiento. Son la misma pregunta hecha dos
     veces («marca las que sean») y tienen que parecerlo. */
  .caja-marcar { border: 1px solid var(--linea-borde); border-radius: 10px; padding: 10px 12px;
                 max-height: 340px; overflow: auto; font-size: 14px; }
  .caja-marcar .grupo-tit { font-size: 13px; color: var(--texto-suave); margin-bottom: 4px; }
  .caja-marcar .fila-p { display: flex; flex-wrap: wrap; gap: 8px; }
  .caja-marcar .bloque { margin-bottom: 8px; }
  .caja-marcar .aviso { font-size: 14px; color: var(--texto-suave); line-height: 1.5; margin: 2px 0; }

  /* En la lista, el grupo principal manda y los demás se dicen debajo,
     en pequeño: el que lleva las fichas busca por el de siempre, pero
     tiene que ver de un vistazo quién va a dos sitios. */
  .mas-grupos { display: block; margin-top: 2px; font-size: 13px; color: var(--texto-suave); }

  .esp-p { display: inline-flex; align-items: center; min-height: 44px; box-sizing: border-box;
           padding: 8px 15px; margin: 0; border: 1px solid var(--linea-borde); border-radius: 999px;
           font-size: 14px; font-weight: 400; line-height: 1.2; color: var(--texto); background: #fff;
           cursor: pointer; }
  .esp-p:hover { background: var(--crema-media); }
  .esp-p input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .esp-p input:checked + span { font-weight: 600; }
  .esp-p:has(input:checked) { background: var(--navy); border-color: var(--navy); color: #fff; }
  /* Con el teclado tiene que verse dónde estás, que la casilla no se ve. */
  .esp-p:has(input:focus-visible) { outline: 2px solid var(--azul-filete, #3B85C0); outline-offset: 2px; }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">

    <!-- ===== CABECERA ===== -->
    <div class="lados centro">
      <div class="pcab">
        <div>
          <div class="migas"><span>Personas</span><span class="sep">/</span><span class="aqui">Atletas</span></div>
          <h1>Atletas</h1>
        </div>
        <div class="acciones">
          <button type="button" class="b2" id="exportar">Exportar</button>
          <button type="button" class="btn btn--primario btn--mini" id="nuevo">+ Nuevo atleta</button>
        </div>
      </div>
    </div>

    <!-- ===== BANDA DE FILTROS (a sangre) ===== -->
    <div class="banda">
      <div class="lados centro">
        <div class="filtros" data-chips>
          <input type="search" id="f-buscar" placeholder="Buscar por nombre o apellidos…" aria-label="Buscar un atleta">
          <select id="f-estado" aria-label="Estado">
            <option value="">Todos los estados</option>
            <option value="activo">Activo</option>
            <option value="prueba">En prueba</option>
            <option value="lesionado">Lesionado</option>
            <option value="baja">Baja</option>
          </select>
          <select id="f-grupo" aria-label="Grupo"><option value="">Todos los grupos</option></select>
          <select id="f-tipo" aria-label="Escuela o socios">
            <option value="">Escuela y socios</option>
            <option value="escuela">Solo escuela</option>
            <option value="socio">Solo socios</option>
          </select>
          <span class="cuenta" id="f-cuenta" aria-live="polite"></span>
        </div>
      </div>
    </div>

    <!-- ===== CUERPO ===== -->
    <div class="lados centro">
      <div class="cuerpo">

        <main>
          <div class="envol">
            <table id="tabla">
              <thead>
                <tr>
                  <th>Atleta</th><th>Grupo</th><th>Estado</th><th class="num">Último recibo</th>
                </tr>
              </thead>
              <tbody>
                <tr><td class="sin-etiqueta" colspan="4"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></td></tr>
              </tbody>
            </table>
          </div>
          <p class="pie-lista" id="pie-lista"></p>
        </main>

        <aside>
          <div class="tar" id="tar-resumen">
            <h2>Con estos filtros</h2>
            <div id="resumen"><div class="adm-cargando"><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
          </div>

          <div id="avisos-lateral"></div>

          <div class="nota">
            <span class="t">La ficha se abre encima</span>
            <span class="d">Al pulsar una fila, la ficha se abre en ventana sobre la lista. Al cerrarla sigues donde estabas, con los filtros puestos.</span>
          </div>
        </aside>

      </div>
    </div>

    <!-- ===== FICHA (ventana sobre la lista) ===== -->
    <div class="oculto" id="panel-form">
      <div class="modal-caja">
      <h2 id="form-titulo">Nuevo atleta</h2>
      <p class="sub-ficha" id="form-sub"></p>
      <form id="form">
        <input type="hidden" id="a-id">
        <input type="hidden" id="a-perfil-id">
        <div class="grid2">
          <div><label for="a-nombre">Nombre</label><input type="text" id="a-nombre" required></div>
          <div><label for="a-apellidos">Apellidos</label><input type="text" id="a-apellidos"></div>
        </div>
        <label for="a-email">Correo de la cuenta (para que entre al portal)</label>
        <input type="email" id="a-email" placeholder="correo del atleta o de la familia">
        <div class="grid2">
          <div><label for="a-nacimiento">Fecha de nacimiento</label><input type="date" id="a-nacimiento"></div>
          <div><label for="a-categoria">Categoría <span style="font-weight:400;color:var(--texto-suave);">(se rellena sola con la fecha)</span></label>
            <select id="a-categoria">
              <option value="">(elige)</option>
              <option>Escuela iniciación</option><option>Sub-12</option><option>Sub-14</option>
              <option>Sub-16</option><option>Sub-18</option><option>Sub-20</option>
              <option>Sub-23</option><option>Absoluto</option><option>Máster</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div><label for="a-estado">Estado</label>
            <select id="a-estado">
              <option value="activo">Activo</option>
              <option value="prueba">En prueba</option>
              <option value="lesionado">Lesionado</option>
              <option value="baja">Baja</option>
            </select>
          </div>
          <div><label for="a-grupo">Grupo principal</label><select id="a-grupo"><option value="">(sin grupo)</option></select></div>
        </div>
        <!-- Los demás grupos. Una persona puede estar en varios a la vez:
             running en La Tribu y El Cubo, o la escuela a primera hora y
             fuerza a segunda. Hasta ahora solo cabía uno y el club tenía
             que elegir cuál escribir. -->
        <label id="a-otros-lab">También entrena en <span style="font-weight:400;color:var(--texto-suave);">— marca los demás grupos, si va a más de uno</span></label>
        <div id="a-otros-grupos" class="caja-marcar" role="group" aria-labelledby="a-otros-lab"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
        <label for="a-tipo">Escuela o socio <span style="font-weight:400;color:var(--texto-suave);">(por defecto se calcula por la edad; cámbialo solo en las excepciones)</span></label>
        <select id="a-tipo">
          <option value="">Automático por edad</option>
          <option value="escuela">Escuela (fijado a mano)</option>
          <option value="socio">Socio (fijado a mano)</option>
        </select>
        <label>Especialidades <span style="font-weight:400;color:var(--texto-suave);">— marca las pruebas de competición que hace (puede ser varias)</span></label>
        <div id="a-especialidades" class="caja-marcar"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
        <div class="pie-form">
          <button class="btn btn--primario btn--mini" type="submit">Guardar</button>
          <button class="b2" type="button" id="cancelar">Cancelar</button>
          <span class="msg" id="msg"></span>
          <button class="btn--peligro oculto" type="button" id="borrar">Borrar la ficha</button>
        </div>
      </form>
      </div>
    </div>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

  var COLS = 4;
  var hoyIso = new Date().toISOString().slice(0, 10);
  /* En una columna de importes el punto de los miles tiene que salir siempre. */
  var fmtEur = (function () {
    var o = { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always' };
    try { return new Intl.NumberFormat('es-ES', o); }
    catch (e) { delete o.useGrouping; return new Intl.NumberFormat('es-ES', o); }
  })();

  /* Filtro inicial desde la dirección web: las alertas del panel enlazan con
     ?estado=lesionado / ?estado=prueba, y Cobros con ?ficha=<id>. */
  (function () {
    var e = new URLSearchParams(location.search).get('estado');
    if (e) { var s = $('f-estado'); if (s) s.value = e; }
  })();

  var ICONO_LUPA    = '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>';
  var ICONO_PERSONA = '<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>';

  var gruposById = {};   /* id → nombre con su turno, para enseñarlo */
  var GRUPOS = [];       /* la lista entera, en el orden en que se enseña */
  /* MIEMBROS[atleta_id] = [{ grupo_id, principal }], el principal primero.
     Es lo que dice en qué grupos entrena cada uno desde que se puede estar
     en varios. */
  var MIEMBROS = {};
  /* Si la tabla de grupos no contesta, la ficha no puede decir «solo va a
     uno»: eso sería inventarse la respuesta. Se cae al grupo de la ficha,
     que es lo que se sabe seguro, y se avisa. */
  var SIN_MIEMBROS = false;
  /* Las nueve categorías salen de `assets/js/categorias.js`, que es el
     único sitio donde está la escalera. Los `option` escritos en el HTML
     de arriba son los mismos nueve; si algún día cambian, se cambian
     allí y aquí no hay nada que tocar. */
  var CATS = (window.APOLANA_CATEGORIAS || {}).LISTA ||
             ['Escuela iniciación','Sub-12','Sub-14','Sub-16','Sub-18','Sub-20','Sub-23','Absoluto','Máster'];

  /* Escuela / Socios por año de nacimiento: nacidos en 2009 o después = Escuela. */
  var ANIO_CORTE_ESCUELA = 2009;
  function tipoDe(a) {
    if (a.tipo_membresia === 'escuela' || a.tipo_membresia === 'socio') return a.tipo_membresia;
    var y = parseInt(String(a.fecha_nacimiento || '').slice(0, 4), 10);
    if (!y) return null;
    return y >= ANIO_CORTE_ESCUELA ? 'escuela' : 'socio';
  }

  /* La categoría por el año de nacimiento. La cuenta NO está aquí: vive
     en `assets/js/categorias.js` con la tabla de la federación al lado,
     porque estaba escrita en tres pantallas y las tres se equivocaban
     igual. Si falta ese fichero se devuelve vacío y la categoría se
     elige a mano: mejor no decir nada que decir una que no es. */
  function categoriaPorNacimiento(fechaStr) {
    return window.APOLANA_CATEGORIAS
      ? window.APOLANA_CATEGORIAS.porNacimiento(fechaStr) : '';
  }
  function ponerCategoria(valor) {
    var sel = $('a-categoria');
    if (valor && CATS.indexOf(valor) === -1 && !sel.querySelector('option[value="' + valor + '"]')) {
      var o = document.createElement('option'); o.value = valor; o.textContent = valor; sel.appendChild(o);
    }
    sel.value = valor || '';
  }

  /* ---------- estado: punto de 9 px + palabra, nunca solo color ---------- */
  var ESTADOS = {
    activo:    { clase: 'e-activo', txt: 'Activo' },
    prueba:    { clase: 'e-prueba', txt: 'En prueba' },
    lesionado: { clase: 'e-lesion', txt: 'Lesionado' },
    baja:      { clase: 'e-baja',   txt: 'Baja' }
  };
  function estadoHtml(e) {
    var d = ESTADOS[e] || { clase: 'e-sin', txt: 'Sin estado' };
    return '<span class="pill-estado ' + d.clase + '"><span class="pt"></span>' + esc(d.txt) + '</span>';
  }
  /* Lo que pide una decisión: en prueba (hay que decir si se queda) y las
     fichas sin estado puesto. Esas van con la fila en ámbar. */
  function pideAlgo(a) { return a.estado === 'prueba' || !a.estado; }

  function iniciales(a) {
    var n = (a.nombre || '').trim(), ap = (a.apellidos || '').trim();
    return ((n ? n[0] : '') + (ap ? ap[0] : '')).toUpperCase() || '·';
  }
  function nombreCompleto(a) { return ((a.nombre || '') + ' ' + (a.apellidos || '')).trim(); }

  async function cargarGrupos() {
    /* Con el turno, y ordenados por él dentro de cada nombre. La escuela
       tiene el mismo grupo dos veces por semana con niños distintos: hay
       un «Azul 2» de lunes y miércoles y otro de martes y jueves. Sin
       esto, la lista enseñaba «Azul 2» dos veces seguidas y elegir uno u
       otro era echarlo a suertes: media escuela acabaría en el turno
       equivocado y en la lista de asistencia del día que no es. */
    var r = await sb.from('grupos').select('id,nombre,turno,seccion')
      .order('nombre').order('turno', { nullsFirst: true });
    var sel = $('a-grupo'), filtro = $('f-grupo');
    if (!r.error && r.data) {
      GRUPOS = r.data;
      GRUPOS.forEach(function (g) {
        var etiqueta = window.APOLANA_GRUPO_NOMBRE ? window.APOLANA_GRUPO_NOMBRE(g) : g.nombre;
        gruposById[g.id] = etiqueta;
        g.etiqueta = etiqueta;
        var o = document.createElement('option'); o.value = g.id; o.textContent = etiqueta; sel.appendChild(o);
        var o2 = document.createElement('option'); o2.value = g.id; o2.textContent = etiqueta; filtro.appendChild(o2);
      });
    }
  }

  /* Nombre bonito de la sección, para agrupar la lista de grupos igual
     que las especialidades se agrupan por disciplina. */
  var SECCIONES = {
    'pista': 'Atletismo en pista', 'competicion': 'Competición', 'running': 'Running',
    'natacion': 'Natación', 'escuela-natacion': 'Escuela de natación', 'triatlon': 'Triatlón',
    'montana': 'Montaña', 'cubo': 'El Cubo', 'escuela': 'Escuela de atletismo'
  };
  function nombreSeccion(s) { return s ? (SECCIONES[s] || s) : 'Sin sección'; }

  /* Los grupos de un atleta, el principal primero. Si la tabla de grupos
     no se ha podido leer, se dice lo único que se sabe: el de su ficha. */
  function gruposDe(a) {
    var m = MIEMBROS[a.id];
    if (m && m.length) return m.map(function (x) { return x.grupo_id; });
    return a.grupo_id ? [a.grupo_id] : [];
  }

  /* Los demás grupos: los pintan como pastillas que se marcan, igual que
     las especialidades. Fuera queda el principal, que ya está elegido
     arriba: enseñarlo dos veces solo invita a marcarlo dos veces. */
  function pintarOtrosGrupos(marcados) {
    var box = $('a-otros-grupos');
    var principal = $('a-grupo').value;
    var set = {}; (marcados || []).forEach(function (id) { set[id] = true; });

    if (!GRUPOS.length) {
      box.innerHTML = '<p class="aviso">No se han podido leer los grupos, así que aquí no se puede marcar ninguno.</p>';
      return;
    }
    if (!principal) {
      box.innerHTML = '<p class="aviso">Elige antes su grupo principal. Los demás se marcan aquí debajo.</p>';
      return;
    }
    /* Sin poder leer la tabla, «sin marcar» no querría decir «no va a ese
       grupo» sino «no lo sabemos». Callarlo sería enseñar como cierto algo
       que no se ha podido mirar. */
    var aviso = SIN_MIEMBROS
      ? '<p class="aviso">No se han podido leer los demás grupos de este atleta, así que aquí no sale ninguno marcado aunque los tenga. Al guardar no se tocarán.</p>'
      : '';

    var porSeccion = {}, orden = [];
    GRUPOS.forEach(function (g) {
      if (g.id === principal) return;
      var s = nombreSeccion(g.seccion);
      if (!porSeccion[s]) { porSeccion[s] = []; orden.push(s); }
      porSeccion[s].push(g);
    });
    box.innerHTML = aviso + orden.map(function (s) {
      return '<div class="bloque"><div class="grupo-tit">' + esc(s) + '</div><div class="fila-p">' +
        porSeccion[s].map(function (g) {
          return '<label class="esp-p"><input type="checkbox" class="grp-chk" value="' + esc(g.id) + '"' +
                 (set[g.id] ? ' checked' : '') + '><span>' + esc(g.etiqueta) + '</span></label>';
        }).join('') + '</div></div>';
    }).join('');
  }
  function otrosGruposMarcados() {
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll('.grp-chk'), function (chk) { if (chk.checked) out.push(chk.value); });
    return out;
  }

  /* Especialidades: casillas agrupadas por disciplina, desde el catálogo. */
  async function cargarPruebas() {
    var box = $('a-especialidades');
    var r = await sb.from('pruebas').select('nombre,disciplina,ambito').eq('activa', true).order('orden');
    if (r.error || !r.data) { box.innerHTML = ADM.error('No se pudieron cargar las pruebas.', cargarPruebas); return; }
    var groups = {}, order = [];
    r.data.forEach(function (p) {
      var g = (p.ambito === 'natacion' ? 'Natación' : 'Atletismo') + ' · ' + (p.disciplina || '');
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(p.nombre);
    });
    box.innerHTML = order.map(function (g) {
      return '<div class="bloque"><div class="grupo-tit">' + esc(g) + '</div>' +
        '<div class="fila-p">' + groups[g].map(function (n) {
          return '<label class="esp-p"><input type="checkbox" class="esp-chk" value="' + esc(n) + '"><span>' + esc(n) + '</span></label>';
        }).join('') + '</div></div>';
    }).join('');
  }
  function setEspecialidades(arr) {
    var set = {}; (arr || []).forEach(function (n) { set[n] = true; });
    Array.prototype.forEach.call(document.querySelectorAll('.esp-chk'), function (chk) { chk.checked = !!set[chk.value]; });
  }
  function getEspecialidades() {
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll('.esp-chk'), function (chk) { if (chk.checked) out.push(chk.value); });
    return out;
  }

  var TODOS = [];      // fichas cargadas
  var CORREOS = {};    // perfil_id → correo (solo para la ficha, nunca en la lista)
  var ULTIMO = {};     // atleta_id → último recibo { importe, sinCobrar }
  var SIN_RECIBOS = false;   // true si la consulta de recibos se cayó: entonces no se sabe nada de dinero
  var VISTA = [];      // lo que se está viendo ahora mismo (para exportar)

  /* Un recibo cuenta como «sin cobrar» si está marcado impagado o si está
     pendiente y su fecha de vencimiento ya pasó: el mismo cálculo de Cobros. */
  function sinCobrar(p) {
    return p.estado === 'impagado' || (p.estado === 'pendiente' && p.fecha_vencimiento && p.fecha_vencimiento < hoyIso);
  }

  function filtrada() {
    var texto = ($('f-buscar').value || '').trim().toLowerCase();
    var estado = $('f-estado').value, grupo = $('f-grupo').value, tipo = $('f-tipo').value;
    return TODOS.filter(function (a) {
      if (estado && (a.estado || '') !== estado) return false;
      /* Filtrar por un grupo saca a TODO el que entrene ahí, sea o no su
         grupo principal: quien busca «los del Cubo» los quiere a todos. */
      if (grupo && gruposDe(a).indexOf(grupo) === -1) return false;
      if (tipo && tipoDe(a) !== tipo) return false;
      if (texto && nombreCompleto(a).toLowerCase().indexOf(texto) === -1) return false;
      return true;
    });
  }

  /* La columna «Grupo»: el principal en grande y los demás debajo, en
     pequeño. Con uno solo se lee igual que siempre; con dos, se ve. */
  function celdaGrupos(a) {
    var ids = gruposDe(a);
    if (!ids.length) return 'Sin grupo';
    var mas = ids.slice(1).map(function (id) { return gruposById[id] || 'otro grupo'; });
    return esc(gruposById[ids[0]] || 'Sin grupo') +
      (mas.length ? '<span class="mas-grupos">y ' + esc(mas.join(', ')) + '</span>' : '');
  }

  function pintar() {
    var tb = $('tabla').querySelector('tbody');
    var lista = filtrada();
    VISTA = lista;

    /* El recuento dice a la vez cuánto hay filtrado y cuánto hay en total. */
    $('f-cuenta').textContent = (lista.length === TODOS.length)
      ? TODOS.length + ' atletas'
      : lista.length + ' de ' + TODOS.length;

    pintarLateral(lista);

    if (!TODOS.length) {
      $('pie-lista').textContent = '';
      tb.innerHTML = ADM.filaVacia(COLS, 'Todavía no hay fichas de atletas',
        'Crea la primera a mano o trae la lista entera desde una hoja de cálculo.',
        '<button type="button" class="btn btn--primario btn--mini" data-primer-atleta>+ Nuevo atleta</button>',
        ICONO_PERSONA);
      return;
    }
    if (!lista.length) {
      $('pie-lista').textContent = '';
      tb.innerHTML = ADM.filaVacia(COLS, 'Ningún atleta encaja con la búsqueda',
        'Prueba a quitar algún filtro o a buscar solo por el apellido.',
        '<button type="button" class="b2" data-limpiar>Quitar los filtros</button>',
        ICONO_LUPA);
      return;
    }

    tb.innerHTML = lista.map(function (a) {
      var u = ULTIMO[a.id];
      var recibo = SIN_RECIBOS ? '<span class="nada">sin poder mirarlo</span>'
        : !u ? '<span class="nada">sin recibos</span>'
        : (u.sinCobrar
            ? '<span class="debe">' + esc(fmtEur.format(u.importe)) + '</span><span class="sinc">sin cobrar</span>'
            : esc(fmtEur.format(u.importe)));
      var anio = String(a.fecha_nacimiento || '').slice(0, 4);
      var sub = [anio, a.categoria].filter(Boolean).join(' · ');
      return '<tr class="fila' + (pideAlgo(a) ? ' pide' : '') + '" tabindex="0" role="button" data-ed="' + esc(a.id) + '" ' +
             'aria-label="Abrir la ficha de ' + esc(nombreCompleto(a)) + '">' +
        '<td data-etiqueta="Atleta"><span class="persona"><span class="ini">' + esc(iniciales(a)) + '</span>' +
          '<span><span class="nom">' + esc(nombreCompleto(a)) + '</span>' +
          (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</span></span></td>' +
        '<td data-etiqueta="Grupo">' + celdaGrupos(a) + '</td>' +
        '<td data-etiqueta="Estado">' + estadoHtml(a.estado) + '</td>' +
        '<td class="num" data-etiqueta="Último recibo">' + recibo + '</td>' +
      '</tr>';
    }).join('');

    $('pie-lista').textContent = lista.length === TODOS.length
      ? lista.length + ' atletas en total'
      : lista.length + ' atletas con estos filtros, de ' + TODOS.length;
  }

  /* ---------- lateral: el contexto de lo que se está viendo ---------- */
  function pintarLateral(lista) {
    function n(f) { return lista.filter(f).length; }
    var nAct = n(function (a) { return a.estado === 'activo'; });
    var nPru = n(function (a) { return a.estado === 'prueba'; });
    var nLes = n(function (a) { return a.estado === 'lesionado'; });
    var nBaj = n(function (a) { return a.estado === 'baja'; });
    var nSin = n(function (a) { return !a.estado; });
    var nEsc = n(function (a) { return tipoDe(a) === 'escuela'; });
    var nSoc = n(function (a) { return tipoDe(a) === 'socio'; });

    function fila(clase, txt, valor) {
      return '<div class="par"><span class="k"><span class="pt" style="background:' + clase + '"></span>' +
        esc(txt) + '</span><span class="v">' + valor + '</span></div>';
    }
    var h = '';
    h += fila('#3F7A4C', 'Activos', nAct);
    h += fila('#B96F09', 'En prueba', nPru);
    h += fila('#B96F09', 'Lesionados', nLes);
    h += fila('#A79F8E', 'Baja', nBaj);
    if (nSin) h += fila('#A79F8E', 'Sin estado puesto', nSin);
    h += '<div class="par raya"><span class="k">Escuela</span><span class="v">' + nEsc + '</span></div>';
    h += '<div class="par"><span class="k">Socios</span><span class="v">' + nSoc + '</span></div>';
    /* Cuánta gente va a más de un grupo. Sale solo cuando hay alguien:
       una fila que pone «0» un curso entero es una fila de más. */
    var nDos = n(function (a) { return gruposDe(a).length > 1; });
    if (nDos) h += '<div class="par"><span class="k">En dos grupos o más</span><span class="v">' + nDos + '</span></div>';
    $('resumen').innerHTML = h;

    /* Avisos: solo si hay trabajo de verdad, y siempre con su acción. */
    var av = '';
    var pru = TODOS.filter(function (a) { return a.estado === 'prueba'; });
    if (pru.length) {
      var conFin = pru.filter(function (a) { return a.fecha_prueba_fin; }).length;
      av += '<div class="avis">' +
        '<span class="t">' + pru.length + (pru.length === 1 ? ' atleta en prueba' : ' atletas en prueba') + '</span>' +
        '<span class="d">' + (conFin
            ? conFin + ' de ' + pru.length + ' tienen puesta la fecha en que acaba la prueba. Hay que decir a la familia si se queda antes de que acabe.'
            : 'Ninguno tiene puesta la fecha en que acaba la prueba, así que no se sabe a quién hay que contestar esta semana.') +
        '</span>' +
        '<button type="button" class="b2" data-ver-prueba>Ver los ' + pru.length + '</button>' +
        '</div>';
    }
    var deben = TODOS.filter(function (a) { return ULTIMO[a.id] && ULTIMO[a.id].sinCobrar; });
    if (SIN_RECIBOS) {
      /* Callarse el aviso de impagados equivaldría a decir que no hay ninguno. */
      av += '<div class="avis">' +
        '<span class="t">No se han podido leer los recibos</span>' +
        '<span class="d">La columna «Último recibo» y el aviso de impagados están en blanco porque la consulta no ha contestado, no porque esté todo cobrado.</span>' +
        '<button type="button" class="b2" data-recargar>Volver a intentarlo</button>' +
        '</div>';
    } else if (deben.length) {
      av += '<div class="avis">' +
        '<span class="t">' + deben.length + (deben.length === 1 ? ' atleta con el último recibo sin cobrar' : ' atletas con el último recibo sin cobrar') + '</span>' +
        '<span class="d">Se resuelven en Cobros: ahí está a quién escribir y qué recibo volver a pasar.</span>' +
        '<a class="b2" href="../cobros/?estado=impagado">Ver en Cobros</a>' +
        '</div>';
    }
    $('avisos-lateral').innerHTML = av;
  }

  /* ---------- carga ---------- */
  async function cargar() {
    var tb = $('tabla').querySelector('tbody');
    tb.innerHTML = ADM.filaCargando(COLS);
    var r = await sb.from('atletas')
      .select('id,nombre,apellidos,categoria,estado,grupo_id,perfil_id,fecha_nacimiento,tipo_membresia,fecha_prueba_fin')
      .order('apellidos');
    if (r.error) { tb.innerHTML = ADM.filaError(COLS, r.error.message, cargar); return; }
    TODOS = r.data || [];

    /* En qué grupos entrena cada uno. Va aparte de la ficha porque desde
       este curso se puede estar en varios y eso ya no cabe en una casilla. */
    MIEMBROS = {};
    var rg = await sb.from('atleta_grupos').select('atleta_id,grupo_id,principal');
    SIN_MIEMBROS = !!rg.error;
    if (!rg.error && rg.data) {
      rg.data.forEach(function (m) { (MIEMBROS[m.atleta_id] = MIEMBROS[m.atleta_id] || []).push(m); });
      /* El principal siempre delante: es el que se lee primero en todas
         las pantallas y el que sale en los recibos. */
      Object.keys(MIEMBROS).forEach(function (id) {
        MIEMBROS[id].sort(function (x, y) { return (y.principal ? 1 : 0) - (x.principal ? 1 : 0); });
      });
    }

    /* Último recibo de cada atleta. Es el único dato de dinero que sale
       aquí, y su acción está en Cobros (aviso del lateral y ficha). */
    ULTIMO = {};
    var rp = await sb.from('pagos')
      .select('atleta_id,importe,estado,fecha_vencimiento')
      .order('fecha_vencimiento', { ascending: false, nullsFirst: false });
    /* Si los recibos no se han podido leer, la columna no puede decir «sin
       recibos» de todo el mundo ni el lateral callarse los impagados. */
    SIN_RECIBOS = !!rp.error;
    if (!rp.error && rp.data) {
      rp.data.forEach(function (p) {
        if (!p.atleta_id || ULTIMO[p.atleta_id]) return;
        ULTIMO[p.atleta_id] = { importe: Number(p.importe || 0), sinCobrar: sinCobrar(p) };
      });
    }

    /* Los correos solo se usan dentro de la ficha: nunca salen en la lista. */
    var ids = TODOS.map(function (a) { return a.perfil_id; }).filter(Boolean);
    CORREOS = {};
    if (ids.length) {
      var pr = await sb.from('perfiles').select('id,email').in('id', ids);
      if (!pr.error && pr.data) pr.data.forEach(function (p) { CORREOS[p.id] = p.email; });
    }
    pintar();

    /* Cobros enlaza aquí con ?ficha=<id> cuando falta el correo de alguien. */
    var f = new URLSearchParams(location.search).get('ficha');
    if (f && !document.body.dataset.fichaAbierta) {
      document.body.dataset.fichaAbierta = '1';
      var reg = await sb.from('atletas').select('*').eq('id', f).maybeSingle();
      if (!reg.error && reg.data) abrir(reg.data);
    }
  }

  ['f-buscar', 'f-estado', 'f-grupo', 'f-tipo'].forEach(function (id) {
    $(id).addEventListener('input', pintar);
    $(id).addEventListener('change', pintar);
  });

  /* ---------- la ficha, encima de la lista ---------- */
  var focoPrevio = null;
  async function abrir(a) {
    a = a || {};
    focoPrevio = document.activeElement;
    $('form-titulo').textContent = a.id ? nombreCompleto(a) || 'Ficha del atleta' : 'Nuevo atleta';
    var u = a.id ? ULTIMO[a.id] : null;
    $('form-sub').innerHTML = a.id
      ? [ esc(gruposDe(a).map(function (id) { return gruposById[id] || 'otro grupo'; }).join(' + ') || 'Sin grupo'),
          esc((ESTADOS[a.estado] || { txt: 'Sin estado' }).txt),
          (u ? (u.sinCobrar ? '<a href="../cobros/?atleta=' + esc(a.id) + '">último recibo sin cobrar</a>'
                            : '<a href="../cobros/?atleta=' + esc(a.id) + '">ver sus recibos</a>')
             : '<a href="../cobros/?atleta=' + esc(a.id) + '">sin recibos todavía</a>')
        ].join(' · ')
      : '';
    $('a-id').value = a.id || '';
    $('a-perfil-id').value = a.perfil_id || '';
    $('a-nombre').value = a.nombre || '';
    $('a-apellidos').value = a.apellidos || '';
    $('a-nacimiento').value = a.fecha_nacimiento || '';
    ponerCategoria(a.categoria || '');
    $('a-estado').value = a.estado || '';
    $('a-grupo').value = a.grupo_id || '';
    /* Los demás grupos: los que ya tenía, menos el principal. */
    pintarOtrosGrupos(gruposDe(a).filter(function (id) { return id !== a.grupo_id; }));
    $('a-tipo').value = a.tipo_membresia || '';
    setEspecialidades(a.especialidades);
    $('a-email').value = a.perfil_id ? (CORREOS[a.perfil_id] || '') : '';
    if (a.perfil_id && !CORREOS[a.perfil_id]) {
      var pr = await sb.from('perfiles').select('email').eq('id', a.perfil_id).maybeSingle();
      if (!pr.error && pr.data) $('a-email').value = pr.data.email || '';
    }
    $('borrar').classList.toggle('oculto', !a.id);
    $('msg').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
    $('a-nombre').focus();
  }
  function cerrarForm() {
    $('panel-form').classList.add('oculto');
    if (focoPrevio && focoPrevio.focus) { try { focoPrevio.focus(); } catch (e) {} }
  }

  $('nuevo').addEventListener('click', function () { abrir(); });
  $('cancelar').addEventListener('click', cerrarForm);
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) cerrarForm(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('panel-form').classList.contains('oculto')) cerrarForm();
  });
  $('a-nacimiento').addEventListener('change', function () {
    var c = categoriaPorNacimiento(this.value);
    if (c) ponerCategoria(c);
  });
  /* Al cambiar el principal, el de abajo desaparece de las pastillas y el
     que estaba puesto vuelve a la lista. Lo marcado se conserva: cambiar
     de grupo principal no es motivo para perder lo demás. */
  $('a-grupo').addEventListener('change', function () {
    pintarOtrosGrupos(otrosGruposMarcados());
  });

  /* La fila entera abre la ficha: no hay columna de acciones. */
  $('tabla').addEventListener('click', async function (e) {
    if (e.target.closest('[data-primer-atleta]')) { abrir(); return; }
    if (e.target.closest('[data-limpiar]')) {
      $('f-buscar').value = ''; $('f-estado').value = ''; $('f-grupo').value = ''; $('f-tipo').value = '';
      if (window.APOLANA_FILTROS) APOLANA_FILTROS.repasar();
      pintar(); return;
    }
    var fila = e.target.closest('tr[data-ed]');
    if (!fila) return;
    var r = await sb.from('atletas').select('*').eq('id', fila.getAttribute('data-ed')).single();
    if (r.error) { apoToast('No se pudo abrir la ficha: ' + r.error.message, 'error'); return; }
    abrir(r.data);
  });
  $('tabla').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var fila = e.target.closest && e.target.closest('tr[data-ed]');
    if (!fila) return;
    e.preventDefault();
    fila.click();
  });

  /* «Ver los N en prueba» deja el filtro puesto, con su chip. */
  $('avisos-lateral').addEventListener('click', function (e) {
    if (e.target.closest('[data-recargar]')) { cargar(); return; }
    if (!e.target.closest('[data-ver-prueba]')) return;
    $('f-estado').value = 'prueba';
    if (window.APOLANA_FILTROS) APOLANA_FILTROS.repasar();
    pintar();
  });

  /* ---------- borrar, desde dentro de la ficha ---------- */
  $('borrar').addEventListener('click', async function () {
    var id = $('a-id').value;
    if (!id) return;
    var ok = await apoConfirm({
      titulo: 'Borrar ficha',
      texto: '¿Borrar esta ficha de atleta? No borra su cuenta de acceso. No se puede deshacer.',
      peligro: true
    });
    if (!ok) return;
    var d = await sb.from('atletas').delete().eq('id', id);
    if (d.error) { apoToast('No se pudo borrar: ' + d.error.message, 'error'); return; }
    cerrarForm();
    apoToast('Ficha borrada', 'ok');
    cargar();
  });

  /* ---------- guardar ---------- */
  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('msg').textContent = 'Guardando…'; $('msg').className = 'msg';
    var email = $('a-email').value.trim();
    var perfilId = $('a-perfil-id').value || null;

    /* Enlazar el perfil de la cuenta por su correo (el perfil se crea solo
       al crear la cuenta en Supabase). */
    if (email) {
      var pr = await sb.from('perfiles').select('id,rol').eq('email', email).maybeSingle();
      if (pr.error) { $('msg').textContent = 'Error buscando la cuenta: ' + pr.error.message; $('msg').className = 'msg error'; return; }
      if (!pr.data) {
        $('msg').textContent = 'No hay ninguna cuenta con ese correo. Créala primero en Supabase → Authentication (Add user) con ese mismo correo y vuelve a intentarlo.';
        $('msg').className = 'msg error'; return;
      }
      perfilId = pr.data.id;
      var upd = {};
      if (['admin', 'coordinador', 'entrenador'].indexOf(pr.data.rol) === -1) upd.rol = 'atleta';
      if ($('a-nombre').value.trim()) upd.nombre = $('a-nombre').value.trim();
      if ($('a-apellidos').value.trim()) upd.apellidos = $('a-apellidos').value.trim();
      if (Object.keys(upd).length) await sb.from('perfiles').update(upd).eq('id', perfilId);
    }

    var datos = {
      nombre: $('a-nombre').value.trim(),
      apellidos: $('a-apellidos').value.trim() || null,
      fecha_nacimiento: $('a-nacimiento').value || null,
      categoria: $('a-categoria').value.trim() || null,
      estado: $('a-estado').value.trim() || null,
      grupo_id: $('a-grupo').value || null,
      tipo_membresia: $('a-tipo').value || null,
      especialidades: (function () { var e2 = getEspecialidades(); return e2.length ? e2 : null; })(),
      perfil_id: perfilId
    };
    async function guardar(d) {
      var id = $('a-id').value;
      /* La ficha nueva devuelve su id: hace falta enseguida para guardar
         los demás grupos, que van en otra tabla. */
      return id ? await sb.from('atletas').update(d).eq('id', id).select('id').maybeSingle()
                : await sb.from('atletas').insert(d).select('id').single();
    }
    var r = await guardar(datos);
    if (r.error && /fecha_nacimiento/.test(r.error.message)) {
      var d2 = Object.assign({}, datos); delete d2.fecha_nacimiento;
      r = await guardar(d2);
    }
    if (r.error) { $('msg').textContent = 'Error: ' + r.error.message; $('msg').className = 'msg error'; return; }

    /* ---------- los grupos, después de la ficha ----------
       Se manda la lista ENTERA de una vez (la base se encarga de meter
       los que faltan y sacar los que sobran) en lugar de ir apuntando y
       borrando desde aquí: si se corta la conexión a mitad, o se hace
       todo o no se hace nada, y nadie se queda fuera de su grupo sin
       que se note.

       Si la tabla de grupos no se pudo leer al abrir la pantalla, no se
       manda nada: las pastillas sin marcar no querrían decir «no va a
       esos grupos», sino «no lo sabemos», y guardarlas los borraría. */
    var atletaId = $('a-id').value || (r.data && r.data.id);
    if (SIN_MIEMBROS) {
      cerrarForm();
      apoToast('Ficha guardada. Los demás grupos no se han tocado: no se han podido leer.', 'error');
      cargar();
      return;
    }
    if (atletaId) {
      var principal = $('a-grupo').value || null;
      var todos = (principal ? [principal] : []).concat(otrosGruposMarcados());
      var rg = await sb.rpc('apo_grupos_de_atleta', {
        p_atleta: atletaId, p_grupos: todos, p_principal: principal
      });
      if (rg.error) {
        $('msg').textContent = 'La ficha se ha guardado, pero los grupos no: ' + rg.error.message;
        $('msg').className = 'msg error';
        cargar();
        return;
      }
    }

    cerrarForm();
    apoToast('Ficha guardada', 'ok');
    cargar();
  });

  /* ---------- exportar lo que se está viendo ----------
     Solo lo que sale en la lista: ni correos ni teléfonos de las familias. */
  $('exportar').addEventListener('click', function () {
    if (!VISTA.length) { apoToast('No hay nada que exportar con estos filtros.', 'error'); return; }
    var cab = ['Nombre', 'Apellidos', 'Nacimiento', 'Categoría', 'Grupos', 'Estado', 'Último recibo'];
    function celda(v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
    var lineas = [cab.map(celda).join(';')];
    VISTA.forEach(function (a) {
      var u = ULTIMO[a.id];
      lineas.push([
        a.nombre || '', a.apellidos || '', a.fecha_nacimiento || '', a.categoria || '',
        gruposDe(a).map(function (id) { return gruposById[id] || ''; }).join(' + '),
        (ESTADOS[a.estado] || { txt: '' }).txt,
        u ? fmtEur.format(u.importe) + (u.sinCobrar ? ' (sin cobrar)' : '') : ''
      ].map(celda).join(';'));
    });
    var blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var a2 = document.createElement('a');
    a2.href = URL.createObjectURL(blob);
    a2.download = 'atletas-' + hoyIso + '.csv';
    a2.click();
    setTimeout(function () { URL.revokeObjectURL(a2.href); }, 1000);
    apoToast(VISTA.length + ' atletas exportados', 'ok');
  });

  cargarPruebas();
  cargarGrupos().then(cargar);
});
</script>

</body>
</html>
