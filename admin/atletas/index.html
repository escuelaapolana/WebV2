<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atletas · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<script src="../../assets/js/admin-filtros.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }
  .panel { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,30px); box-shadow: var(--sombra-suave); margin-bottom: 22px; }
  .panel h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 21px; color: var(--navy); margin-bottom: 4px; }
  a.volver { display:inline-block; margin-bottom:14px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; }
  table { width:100%; border-collapse: collapse; margin-top: 8px; }
  th,td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-texto); font-size: 13px; text-transform:none; color: var(--texto-suave); }
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:12px 0 5px; }
  input, select { width:100%; box-sizing:border-box; padding:11px 13px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:620px){ .grid2{ grid-template-columns:1fr; } }
  /* Objetivo táctil cómodo (44px) en los botones de uso frecuente */
  .btn { cursor:pointer; }
  .btn--peligro { background:transparent; border:1px solid #e0b4b0; color:#B0563A; padding:8px 16px; border-radius:999px; font-size:14px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .btn--mini { padding:8px 18px; font-size:14px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .acciones-fila { display:flex; gap:8px; }
  .msg { font-size:14px; margin-left:8px; }
  .msg.error { color:#B0563A; } .msg.ok { color:#1e7a3d; }
  .oculto { display:none !important; }
  /* Edición en ventana emergente (modal), no bajando al fondo de la página */
  #panel-form { position:fixed; inset:0; z-index:1000; background:rgba(46,66,86,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(16px,5vh,60px) 16px; overflow:auto; border:0; border-radius:0; box-shadow:none;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #panel-form .modal-caja { background:#fff; border:1px solid var(--linea); border-radius: 14px;
    box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:24px; width:min(660px,100%);
    animation:modal-sube .2s ease; }
  @keyframes modal-sube { from{ transform:translateY(12px); opacity:.6; } to{ transform:none; opacity:1; } }
  .pill { display:inline-block; font-family: var(--fuente-texto); font-size: 13px; padding:3px 9px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .filtros { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:6px; }
  .filtros input, .filtros select { padding:11px 12px; font-size:14px; min-height:44px; }
  .filtros .cuenta { font-family: var(--fuente-texto); font-size: 13px; text-transform:none; color: var(--texto-suave); }

  /* Estado vacío con algo de cuerpo: dibujo de línea + frase + acción */
  .vacio-caja { text-align:center; padding:30px 18px; }
  .vacio-caja svg { display:block; margin:0 auto 12px; color: var(--texto-suave); }
  .vacio-caja .frase { font-size:15px; color: var(--texto-suave); margin:0 0 4px; }
  .vacio-caja .pista { font-size: 14px; color: var(--texto-suave); margin:0 0 14px; }

  /* --- Móvil: cada atleta pasa a ser una ficha (mismo patrón que Cobros) --- */
  @media (max-width: 760px) {
    table { min-width:0; }
    table, thead, tbody, tr, th, td { display:block; }
    thead { display:none; }
    tr { border:1px solid var(--linea); border-radius: var(--radio); margin-bottom:12px; padding:6px 12px; background:#fff; }
    td { border-bottom:1px solid var(--crema-media); padding:9px 0; }
    tr td:last-child { border-bottom:none; padding-top:12px; }
    td::before { content: attr(data-etiqueta); display:block; font-family: var(--fuente-texto); font-size: 13px; text-transform:none; color: var(--texto-suave); margin-bottom:2px; }
    td.sin-etiqueta::before { content:none; }
    /* El nombre hace de titular de la ficha: no necesita etiqueta encima */
    td[data-etiqueta="Nombre"] { font-size: 15px; font-weight:600; color: var(--navy); }
    td[data-etiqueta="Nombre"]::before { content:none; }
    .filtros input, .filtros select { max-width:none !important; width:100%; }
  }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">
    <div class="panel">
      <h2>Atletas</h2>
      <p class="intro" style="margin-bottom:10px;">Fichas de los atletas del club. El acceso al portal (usuario/contraseña) se crea aparte en Supabase con el mismo correo.</p>
      <div style="margin-bottom:14px;"><button class="btn btn--primario btn--mini" id="nuevo">+ Nuevo atleta</button></div>
      <div class="filtros" data-chips>
        <input type="search" id="f-buscar" placeholder="Buscar por nombre o correo…" style="max-width:280px;">
        <select id="f-estado" style="max-width:170px;">
          <option value="">Todos los estados</option>
          <option value="activo">Activo</option>
          <option value="lesionado">Lesionado</option>
          <option value="prueba">Prueba</option>
          <option value="baja">Baja</option>
        </select>
        <select id="f-grupo" style="max-width:220px;"><option value="">Todos los grupos</option></select>
        <select id="f-tipo" style="max-width:180px;">
          <option value="">Escuela y socios</option>
          <option value="escuela">Solo escuela</option>
          <option value="socio">Solo socios</option>
        </select>
        <span class="cuenta" id="f-cuenta"></span>
      </div>
      <div style="overflow-x:auto;">
        <table id="tabla"><thead><tr><th>Nombre</th><th>Tipo</th><th>Categoría</th><th>Grupo</th><th>Estado</th><th>Correo (cuenta)</th><th></th></tr></thead><tbody></tbody></table>
      </div>
    </div>

    <div class="panel oculto" id="panel-form">
      <div class="modal-caja">
      <h2 id="form-titulo">Nuevo atleta</h2>
      <form id="form">
        <input type="hidden" id="a-id">
        <input type="hidden" id="a-perfil-id">
        <div class="grid2">
          <div><label>Nombre</label><input type="text" id="a-nombre" required></div>
          <div><label>Apellidos</label><input type="text" id="a-apellidos"></div>
        </div>
        <label>Correo de la cuenta (para que entre al portal)</label>
        <input type="email" id="a-email" placeholder="correo del atleta o de la familia">
        <div class="grid2">
          <div><label>Fecha de nacimiento</label><input type="date" id="a-nacimiento"></div>
          <div><label>Categoría <span style="font-weight:400;color:var(--texto-suave);">(se rellena sola con la fecha)</span></label>
            <select id="a-categoria">
              <option value="">(elige)</option>
              <option>Escuela iniciación</option><option>Sub-12</option><option>Sub-14</option>
              <option>Sub-16</option><option>Sub-18</option><option>Sub-20</option>
              <option>Sub-23</option><option>Absoluto</option><option>Máster</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div><label>Estado</label>
            <select id="a-estado">
              <option value="activo">Activo</option>
              <option value="lesionado">Lesionado</option>
              <option value="baja">Baja</option>
              <option value="prueba">Prueba</option>
            </select>
          </div>
          <div><label>Grupo</label><select id="a-grupo"><option value="">(sin grupo)</option></select></div>
        </div>
        <label>Escuela o socio <span style="font-weight:400;color:var(--texto-suave);">(por defecto se calcula por la edad; cámbialo solo en las excepciones)</span></label>
        <select id="a-tipo">
          <option value="">Automático por edad</option>
          <option value="escuela">Escuela (fijado a mano)</option>
          <option value="socio">Socio (fijado a mano)</option>
        </select>
        <label>Especialidades <span style="font-weight:400;color:var(--texto-suave);">— marca las pruebas que hace (puede ser varias)</span></label>
        <div id="a-especialidades" style="border:1px solid var(--linea-borde);border-radius:10px;padding:10px 12px;max-height:230px;overflow:auto;font-size:14px;"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
        <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
          <button class="btn btn--primario btn--mini" type="submit">Guardar</button>
          <button class="btn btn--fantasma btn--mini" type="button" id="cancelar">Cancelar</button>
          <span class="msg" id="msg"></span>
        </div>
      </form>
      </div>
    </div>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  // Filtro inicial desde la URL (las alertas del panel enlazan con ?estado=lesionado / ?estado=prueba)
  (function () { var e = new URLSearchParams(location.search).get('estado'); if (e) { var s = $('f-estado'); if (s) s.value = e; } })();
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  /* --- Filas de aviso y estados vacíos con algo de cuerpo --- */
  function filaAviso(texto) { return '<tr><td class="sin-etiqueta" colspan="7">' + esc(texto) + '</td></tr>'; }
  function svgLinea(trazo) {
    return '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' + trazo + '</svg>';
  }
  var ICONO_LUPA    = svgLinea('<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>');
  var ICONO_PERSONA = svgLinea('<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>');
  function filaVacia(icono, frase, pista, accion) {
    return '<tr><td class="sin-etiqueta" colspan="7"><div class="vacio-caja">' + icono +
      '<p class="frase">' + esc(frase) + '</p><p class="pista">' + esc(pista) + '</p>' + (accion || '') +
      '</div></td></tr>';
  }
  var gruposById = {};
  var CATS = ['Escuela iniciación','Sub-12','Sub-14','Sub-16','Sub-18','Sub-20','Sub-23','Absoluto','Máster'];

  // Escuela / Socios por año de nacimiento: nacidos en 2009 o después = Escuela; 2008 o antes = Socios.
  var ANIO_CORTE_ESCUELA = 2009;
  function tipoDe(a) {
    if (a.tipo_membresia === 'escuela' || a.tipo_membresia === 'socio') return a.tipo_membresia; // fijado a mano
    var y = parseInt(String(a.fecha_nacimiento || '').slice(0, 4), 10);
    if (!y) return null;
    return y >= ANIO_CORTE_ESCUELA ? 'escuela' : 'socio';
  }
  function tipoBadge(t, manual) {
    var m = manual ? ' title="Fijado a mano">' + (t === 'escuela' ? 'Escuela' : 'Socio') + ' ·' : '>' + (t === 'escuela' ? 'Escuela' : 'Socio');
    if (t === 'escuela') return '<span class="pill" style="background:var(--azul-suave);color:var(--azul-oscuro);"' + m + '</span>';
    if (t === 'socio') return '<span class="pill" style="background:var(--crema-banda);color:var(--texto-suave);"' + m + '</span>';
    return '<span class="pill">—</span>';
  }

  // Categoría por año de nacimiento (RFEA). Cada categoría = 2 años de nacimiento
  // (Sub-23 = 3) y se desplaza cada temporada, por eso se calcula con el año actual.
  function categoriaPorNacimiento(fechaStr) {
    if (!fechaStr) return '';
    var y = parseInt(String(fechaStr).slice(0, 4), 10);
    if (!y) return '';
    var edad = new Date().getFullYear() - y; // edad que cumple en la temporada
    if (edad <= 8) return 'Escuela iniciación'; // más pequeños
    if (edad <= 10) return 'Sub-12'; // 9-10
    if (edad <= 12) return 'Sub-14'; // 11-12
    if (edad <= 14) return 'Sub-16'; // 13-14
    if (edad <= 16) return 'Sub-18'; // 15-16
    if (edad <= 18) return 'Sub-20'; // 17-18
    if (edad <= 21) return 'Sub-23'; // 19-21
    if (edad <= 34) return 'Absoluto'; // 22-34
    return 'Máster';                 // 35 en adelante (RFEA: M35, M40, M45...)
  }
  function ponerCategoria(valor) {
    var sel = $('a-categoria');
    if (valor && CATS.indexOf(valor) === -1 && !sel.querySelector('option[value="' + valor + '"]')) {
      var o = document.createElement('option'); o.value = valor; o.textContent = valor; sel.appendChild(o);
    }
    sel.value = valor || '';
  }

  async function cargarGrupos() {
    var r = await sb.from('grupos').select('id,nombre').order('nombre');
    var sel = $('a-grupo'), filtro = $('f-grupo');
    if (!r.error && r.data) {
      r.data.forEach(function (g) {
        gruposById[g.id] = g.nombre;
        var o = document.createElement('option'); o.value = g.id; o.textContent = g.nombre; sel.appendChild(o);
        var o2 = document.createElement('option'); o2.value = g.id; o2.textContent = g.nombre; filtro.appendChild(o2);
      });
    }
  }

  // Especialidades: casillas agrupadas por disciplina, desde el catálogo de pruebas
  async function cargarPruebas() {
    var box = $('a-especialidades');
    var r = await sb.from('pruebas').select('nombre,disciplina,ambito').eq('activa', true).order('orden');
    if (r.error || !r.data) { box.textContent = 'No se pudieron cargar las pruebas.'; return; }
    var groups = {}, order = [];
    r.data.forEach(function (p) { var g = (p.ambito === 'natacion' ? 'Natación' : 'Atletismo') + ' · ' + (p.disciplina || ''); if (!groups[g]) { groups[g] = []; order.push(g); } groups[g].push(p.nombre); });
    box.innerHTML = order.map(function (g) {
      return '<div style="margin-bottom:8px;"><div style="font-size:13px;text-transform:none;color:var(--texto-suave);margin-bottom:4px;">' + esc(g) + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;">' + groups[g].map(function (n) {
          return '<label style="display:inline-flex;align-items:center;gap:5px;font-weight:400;margin:0;font-size:13px;white-space:nowrap;"><input type="checkbox" class="esp-chk" value="' + esc(n) + '" style="width:auto;">' + esc(n) + '</label>';
        }).join('') + '</div></div>';
    }).join('');
  }
  function setEspecialidades(arr) {
    var set = {}; (arr || []).forEach(function (n) { set[n] = true; });
    Array.prototype.forEach.call(document.querySelectorAll('.esp-chk'), function (chk) { chk.checked = !!set[chk.value]; });
  }
  function getEspecialidades() {
    var out = []; Array.prototype.forEach.call(document.querySelectorAll('.esp-chk'), function (chk) { if (chk.checked) out.push(chk.value); }); return out;
  }

  var TODOS = [];      // fichas cargadas
  var CORREOS = {};    // perfil_id → correo

  function pintar() {
    var tb = $('tabla').querySelector('tbody');
    var texto = ($('f-buscar').value || '').trim().toLowerCase();
    var estado = $('f-estado').value;
    var grupo = $('f-grupo').value;
    var tipo = $('f-tipo').value;
    var lista = TODOS.filter(function (a) {
      if (estado && (a.estado || '') !== estado) return false;
      if (grupo && (a.grupo_id || '') !== grupo) return false;
      if (tipo && tipoDe(a) !== tipo) return false;
      if (texto) {
        var campo = ((a.nombre || '') + ' ' + (a.apellidos || '') + ' ' + (CORREOS[a.perfil_id] || '')).toLowerCase();
        if (campo.indexOf(texto) === -1) return false;
      }
      return true;
    });
    var nEsc = TODOS.filter(function (a) { return tipoDe(a) === 'escuela'; }).length;
    var nSoc = TODOS.filter(function (a) { return tipoDe(a) === 'socio'; }).length;
    var base = (lista.length === TODOS.length) ? TODOS.length + ' atletas' : lista.length + ' de ' + TODOS.length + ' atletas';
    $('f-cuenta').textContent = base + '  ·  Escuela ' + nEsc + ' · Socios ' + nSoc;
    if (!lista.length) {
      tb.innerHTML = filaVacia(ICONO_LUPA, 'Ningún atleta encaja con la búsqueda',
        'Prueba a quitar algún filtro o a buscar solo por el apellido.',
        '<button type="button" class="btn btn--fantasma btn--mini" data-limpiar>Quitar los filtros</button>');
      return;
    }
    tb.innerHTML = lista.map(function (a) {
      return '<tr><td data-etiqueta="Nombre">' + esc((a.nombre||'')+' '+(a.apellidos||'')) + '</td>' +
        '<td data-etiqueta="Tipo">' + tipoBadge(tipoDe(a), !!a.tipo_membresia) + '</td>' +
        '<td data-etiqueta="Categoría">' + esc(a.categoria||'—') + '</td>' +
        '<td data-etiqueta="Grupo">' + esc(gruposById[a.grupo_id] || '—') + '</td>' +
        '<td data-etiqueta="Estado"><span class="pill">' + esc(a.estado||'—') + '</span></td>' +
        '<td data-etiqueta="Correo (cuenta)">' + esc(CORREOS[a.perfil_id]||'—') + '</td>' +
        '<td class="acciones-fila sin-etiqueta"><button class="btn btn--fantasma btn--mini" data-ed="'+a.id+'">Editar</button>' +
        '<button class="btn btn--peligro" data-bo="'+a.id+'">Borrar</button></td></tr>';
    }).join('');
  }

  async function cargar() {
    var tb = $('tabla').querySelector('tbody');
    tb.innerHTML = ADM.filaCargando(7);
    var r = await sb.from('atletas').select('id,nombre,apellidos,categoria,estado,grupo_id,perfil_id,fecha_nacimiento,tipo_membresia').order('apellidos');
    if (r.error) { tb.innerHTML = ADM.filaError(7, r.error.message); return; }
    TODOS = r.data || [];
    if (!TODOS.length) {
      $('f-cuenta').textContent = '';
      tb.innerHTML = filaVacia(ICONO_PERSONA, 'Todavía no hay fichas de atletas',
        'Crea la primera a mano o trae la lista entera desde una hoja de cálculo.',
        '<button type="button" class="btn btn--primario btn--mini" data-primer-atleta>+ Nuevo atleta</button>');
      return;
    }
    // correos de los perfiles enlazados
    var ids = TODOS.map(function(a){return a.perfil_id;}).filter(Boolean);
    CORREOS = {};
    if (ids.length) {
      var pr = await sb.from('perfiles').select('id,email').in('id', ids);
      if (!pr.error && pr.data) pr.data.forEach(function(p){ CORREOS[p.id]=p.email; });
    }
    pintar();
  }
  ['f-buscar', 'f-estado', 'f-grupo', 'f-tipo'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', pintar);
  });

  async function abrir(a) {
    a = a || {};
    $('form-titulo').textContent = a.id ? 'Editar atleta' : 'Nuevo atleta';
    $('a-id').value = a.id || '';
    $('a-perfil-id').value = a.perfil_id || '';
    $('a-nombre').value = a.nombre || '';
    $('a-apellidos').value = a.apellidos || '';
    $('a-nacimiento').value = a.fecha_nacimiento || '';
    ponerCategoria(a.categoria || '');
    $('a-estado').value = a.estado || '';
    $('a-grupo').value = a.grupo_id || '';
    $('a-tipo').value = a.tipo_membresia || '';
    setEspecialidades(a.especialidades);
    $('a-email').value = '';
    if (a.perfil_id) {
      var pr = await sb.from('perfiles').select('email').eq('id', a.perfil_id).maybeSingle();
      if (!pr.error && pr.data) $('a-email').value = pr.data.email || '';
    }
    $('msg').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
  }
  function cerrarForm() { $('panel-form').classList.add('oculto'); }

  $('nuevo').addEventListener('click', function () { abrir(); });
  $('cancelar').addEventListener('click', cerrarForm);
  // Cerrar la ventana emergente al pulsar fuera de la caja o con Escape
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) cerrarForm(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('panel-form').classList.contains('oculto')) cerrarForm(); });
  $('a-nacimiento').addEventListener('change', function () {
    var c = categoriaPorNacimiento(this.value);
    if (c) ponerCategoria(c);
  });

  $('tabla').addEventListener('click', async function (e) {
    if (e.target.closest('[data-primer-atleta]')) { abrir(); return; }
    if (e.target.closest('[data-limpiar]')) {
      $('f-buscar').value = ''; $('f-estado').value = ''; $('f-grupo').value = ''; $('f-tipo').value = '';
      pintar(); return;
    }
    var ed = e.target.getAttribute('data-ed'), bo = e.target.getAttribute('data-bo');
    if (ed) { var r = await sb.from('atletas').select('*').eq('id', ed).single(); if (!r.error) abrir(r.data); }
    if (bo) { if (!await apoConfirm({ titulo: 'Borrar ficha', texto: '¿Borrar esta ficha de atleta? No borra su cuenta de acceso. No se puede deshacer.', peligro: true })) return; var d = await sb.from('atletas').delete().eq('id', bo); if (d.error) { apoToast('No se pudo: ' + d.error.message, 'error'); return; } cargar(); }
  });

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('msg').textContent = 'Guardando…'; $('msg').className = 'msg';
    var email = $('a-email').value.trim();
    var perfilId = $('a-perfil-id').value || null;

    // Enlazar el perfil de la cuenta por su correo (el perfil se crea solo al crear la cuenta)
    if (email) {
      var pr = await sb.from('perfiles').select('id,rol').eq('email', email).maybeSingle();
      if (pr.error) { $('msg').textContent = 'Error buscando la cuenta: ' + pr.error.message; $('msg').className = 'msg error'; return; }
      if (!pr.data) {
        $('msg').textContent = 'No hay ninguna cuenta con ese correo. Créala primero en Supabase → Authentication (Add user) con ese mismo correo y vuelve a intentarlo.';
        $('msg').className = 'msg error'; return;
      }
      perfilId = pr.data.id;
      // Asegurar rol atleta y nombre (sin tocar cuentas de admin/coordinador/entrenador)
      var upd = {};
      if (['admin', 'coordinador', 'entrenador'].indexOf(pr.data.rol) === -1) upd.rol = 'atleta';
      if ($('a-nombre').value.trim()) upd.nombre = $('a-nombre').value.trim();
      if ($('a-apellidos').value.trim()) upd.apellidos = $('a-apellidos').value.trim();
      if (Object.keys(upd).length) await sb.from('perfiles').update(upd).eq('id', perfilId);
    }

    var datos = {
      nombre: $('a-nombre').value.trim(),
      apellidos: $('a-apellidos').value.trim() || null,
      fecha_nacimiento: $('a-nacimiento').value || null,
      categoria: $('a-categoria').value.trim() || null,
      estado: $('a-estado').value.trim() || null,
      grupo_id: $('a-grupo').value || null,
      tipo_membresia: $('a-tipo').value || null,
      especialidades: (function(){ var e=getEspecialidades(); return e.length?e:null; })(),
      perfil_id: perfilId
    };
    async function guardar(d) {
      var id = $('a-id').value;
      return id ? await sb.from('atletas').update(d).eq('id', id) : await sb.from('atletas').insert(d);
    }
    var r = await guardar(datos);
    if (r.error && /fecha_nacimiento/.test(r.error.message)) {
      var d2 = Object.assign({}, datos); delete d2.fecha_nacimiento;
      r = await guardar(d2);
    }
    if (r.error) { $('msg').textContent = 'Error: ' + r.error.message; $('msg').className = 'msg error'; return; }
    $('msg').textContent = 'Guardado ✓'; $('msg').className = 'msg ok';
    $('panel-form').classList.add('oculto');
    cargar();
  });

  cargarPruebas();
  cargarGrupos().then(cargar);
});
</script>

</body>
