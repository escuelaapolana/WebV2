<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Récords · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--linea-borde); border-radius: 10px;
    font-family: var(--fuente-texto); font-size: 15px; background: #fff; color: var(--navy);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul); border-color: var(--azul); }

  .msg { margin-top: 12px; font-size: 14px; }
  .msg.error { color: #b3261e; }
  .msg.ok { color: #1e7a3d; }

  .panel { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,30px); box-shadow: var(--sombra-suave); margin-bottom: 22px; }
  .panel h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 21px; color: var(--navy); margin-bottom: 4px; }
  .panel .intro { margin-bottom: 10px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); font-size: 14px; vertical-align: top; }
  th { font-size: 13px; text-transform: none; color: var(--texto-suave); }
  .acciones-fila { display: flex; gap: 8px; white-space: nowrap; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }

  .btn { cursor: pointer; }
  .btn--peligro { background: transparent; border: 1px solid #e0b4b0; color: #b3261e; padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .btn--peligro:hover { background: #fbeceb; }
  .btn--mini { padding: 8px 14px; font-size: 14px; }
  .oculto { display: none !important; }
  /* Edición en ventana emergente (modal), no al fondo de la página */
  #panel-form { position:fixed; inset:0; z-index:1000; background:rgba(46,66,86,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(16px,5vh,60px) 16px; overflow:auto; border:0; border-radius:0; box-shadow:none; margin:0;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #panel-form .modal-caja { background:#fff; border:1px solid var(--linea); border-radius: 14px;
    box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:24px; width:min(660px,100%);
    animation:modal-sube .2s ease; }
  @keyframes modal-sube { from{ transform:translateY(12px); opacity:.6; } to{ transform:none; opacity:1; } }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">

    <div class="panel">
      <h2>Récords del club</h2>
      <p class="intro">Marcas y récords del Club Atletismo Apolana. Se muestran en la web al instante.</p>
      <div style="margin-bottom:14px;"><button class="btn btn--primario btn--mini" id="nuevo-record">+ Nuevo récord</button></div>
      <div style="overflow-x:auto;">
        <table id="tabla-records">
          <thead><tr><th>Prueba</th><th>Categoría</th><th>Marca</th><th>Atleta</th><th>Año</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Formulario (oculto hasta crear/editar) -->
    <div class="panel oculto" id="panel-form">
      <div class="modal-caja">
      <h2 id="form-titulo">Nuevo récord</h2>
      <form id="form-record">
        <input type="hidden" id="r-id">
        <label for="r-prueba">Prueba</label>
        <input type="text" id="r-prueba" placeholder="100 m lisos, Salto de longitud…" required>
        <div class="grid2">
          <div>
            <label for="r-categoria">Categoría</label>
            <input type="text" id="r-categoria" placeholder="Absoluta, Sub-20, Sub-18, Máster…">
          </div>
          <div>
            <label for="r-marca">Marca</label>
            <input type="text" id="r-marca" placeholder="10.85, 6,42 m…">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="r-atleta">Atleta</label>
            <input type="text" id="r-atleta">
          </div>
          <div>
            <label for="r-anyo">Año</label>
            <input type="number" id="r-anyo" min="1900" max="2100" step="1">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="r-sede">Sede</label>
            <input type="text" id="r-sede" placeholder="Ciudad / instalación">
          </div>
          <div>
            <label for="r-competicion">Competición</label>
            <input type="text" id="r-competicion">
          </div>
        </div>
        <label for="r-orden">Orden (para ordenar la lista)</label>
        <input type="number" id="r-orden" step="1" placeholder="0">
        <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
          <button class="btn btn--primario btn--mini" type="submit">Guardar</button>
          <button class="btn btn--fantasma btn--mini" type="button" id="cancelar">Cancelar</button>
          <span class="msg" id="msg-form"></span>
        </div>
      </form>
      </div>
    </div>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  // --- Listar ---
  async function cargarRecords() {
    var tb = $('tabla-records').querySelector('tbody');
    tb.innerHTML = '<tr><td colspan="6" class="sin-etiqueta"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></td></tr>';
    var r = await sb.from('records_club')
      .select('id,prueba,categoria,marca,atleta,anyo')
      .order('orden', { ascending: true })
      .order('prueba', { ascending: true });
    if (r.error) { tb.innerHTML = '<tr><td colspan="6">Error: ' + esc(r.error.message) + '</td></tr>'; return; }
    if (!r.data.length) { tb.innerHTML = '<tr><td colspan="6">No hay récords todavía.</td></tr>'; return; }
    tb.innerHTML = r.data.map(function (n) {
      return '<tr>' +
        '<td>' + esc(n.prueba) + '</td>' +
        '<td>' + esc(n.categoria || '—') + '</td>' +
        '<td>' + esc(n.marca || '—') + '</td>' +
        '<td>' + esc(n.atleta || '—') + '</td>' +
        '<td>' + esc(n.anyo != null ? n.anyo : '—') + '</td>' +
        '<td class="acciones-fila"><button class="btn btn--fantasma btn--mini" data-editar="' + n.id + '">Editar</button>' +
        '<button class="btn btn--peligro" data-borrar="' + n.id + '" data-tit="' + esc(n.prueba) + '">Borrar</button></td>' +
      '</tr>';
    }).join('');
  }

  // --- Crear/editar ---
  function abrirForm(n) {
    n = n || {};
    $('form-titulo').textContent = n.id ? 'Editar récord' : 'Nuevo récord';
    $('r-id').value = n.id || '';
    $('r-prueba').value = n.prueba || '';
    $('r-categoria').value = n.categoria || '';
    $('r-marca').value = n.marca || '';
    $('r-atleta').value = n.atleta || '';
    $('r-anyo').value = n.anyo != null ? n.anyo : '';
    $('r-sede').value = n.sede || '';
    $('r-competicion').value = n.competicion || '';
    $('r-orden').value = n.orden != null ? n.orden : '';
    $('msg-form').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
  }
  $('nuevo-record').addEventListener('click', function () { abrirForm(); });
  $('cancelar').addEventListener('click', function () { $('panel-form').classList.add('oculto'); });
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) $('panel-form').classList.add('oculto'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('panel-form').classList.contains('oculto')) $('panel-form').classList.add('oculto'); });

  $('tabla-records').addEventListener('click', async function (e) {
    var ed = e.target.getAttribute('data-editar');
    var bo = e.target.getAttribute('data-borrar');
    if (ed) {
      var r = await sb.from('records_club').select('*').eq('id', ed).single();
      if (!r.error) abrirForm(r.data);
    }
    if (bo) {
      if (!await apoConfirm({ texto: '¿Borrar el récord de "' + e.target.getAttribute('data-tit') + '"? No se puede deshacer.', peligro: true })) return;
      var d = await sb.from('records_club').delete().eq('id', bo);
      if (d.error) { apoToast('No se pudo borrar: ' + d.error.message, 'error'); return; }
      cargarRecords();
    }
  });

  $('form-record').addEventListener('submit', async function (e) {
    e.preventDefault();
    var datos = {
      prueba: $('r-prueba').value.trim(),
      categoria: $('r-categoria').value.trim() || null,
      marca: $('r-marca').value.trim() || null,
      atleta: $('r-atleta').value.trim() || null,
      anyo: $('r-anyo').value !== '' ? Number($('r-anyo').value) : null,
      sede: $('r-sede').value.trim() || null,
      competicion: $('r-competicion').value.trim() || null,
      orden: $('r-orden').value !== '' ? Number($('r-orden').value) : null
    };
    $('msg-form').textContent = 'Guardando…'; $('msg-form').className = 'msg';
    var id = $('r-id').value, r;
    if (id) r = await sb.from('records_club').update(datos).eq('id', id);
    else r = await sb.from('records_club').insert(datos);
    if (r.error) { $('msg-form').textContent = 'Error: ' + r.error.message; $('msg-form').className = 'msg error'; return; }
    $('msg-form').textContent = 'Guardado ✓'; $('msg-form').className = 'msg ok';
    $('panel-form').classList.add('oculto');
    cargarRecords();
  });

  cargarRecords();
});
</script>

</body>
</html>
