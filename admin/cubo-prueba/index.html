<style>
  /* ============================================================
     FUERZA GRATIS DEL CUBO · lista en tarjetas (23-oct-2026)
     ------------------------------------------------------------
     Mismo lenguaje que «Socios»: cabecera grande, los tres turnos
     como tarjetas (con su barra de plazas y su recordatorio) que
     además filtran la lista, buscador + chips, una tarjeta por
     apuntado y una hoja inferior para llamar, escribir o cancelar.
     Guarda lo mismo que antes: cancelar = cubo_prueba.estado.
     Prefijo fg-.
     ============================================================ */
  /* Necesario para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width: 100%; max-width: none; margin: 0; padding: 0; }
  .fg-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(16px,3vw,26px) clamp(14px,4vw,26px) 110px; color: var(--navy,#26374B); }
  .fg-wrap *, .fg-capa * { box-sizing: border-box; }
  .fg-cab h1 { font-family: var(--fuente-titulo,'Bricolage Grotesque',sans-serif); font-weight: 700; text-transform: uppercase;
    letter-spacing: -0.01em; font-size: clamp(24px,5vw,34px); color: var(--navy,#26374B); margin: 2px 0 4px; line-height: 1; }
  .fg-cab p { color: var(--texto-suave,#6E6656); font-size: 15px; margin: 6px 0 0; line-height: 1.45; max-width: 70ch; }
  .fg-cab a { color: var(--azul-oscuro,#2A5E8C); }

  /* --- Turnos: tarjeta = cifra que filtra + barra de plazas + recordatorio --- */
  .fg-turnos { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 18px 0 6px; }
  @media (max-width: 620px) { .fg-turnos { grid-template-columns: 1fr; } }
  .fg-turno { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 12px 14px 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 12px 24px -20px rgba(30,45,65,.35); display: flex; flex-direction: column; gap: 8px; }
  .fg-turno.on { border-color: var(--navy,#26374B); box-shadow: inset 0 0 0 1px var(--navy,#26374B); }
  .fg-filtra { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 8px; }
  .fg-filtra:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 3px; }
  .fg-filtra .dia { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .fg-filtra .dia strong { font-size: 16px; font-weight: 700; }
  .fg-filtra .dia span { font-size: 13px; color: var(--texto-suave,#6E6656); white-space: nowrap; }
  .fg-filtra .n { display: block; font-family: var(--fuente-dato,'IBM Plex Mono',monospace); font-weight: 700; font-size: 26px; line-height: 1.15; margin-top: 4px; }
  .fg-filtra .n small { font-size: 14px; font-weight: 400; color: var(--texto-suave,#6E6656); }
  .fg-barra { height: 7px; border-radius: 999px; background: #EFE9DA; overflow: hidden; }
  .fg-barra > span { display: block; height: 100%; background: var(--navy,#26374B); border-radius: 999px; }
  .fg-turno.pocos .fg-barra > span { background: #C79A3B; }
  .fg-turno.lleno .n { color: #B0563A; } .fg-turno.lleno .fg-barra > span { background: #B0563A; }
  .fg-nota { font-size: 13px; font-weight: 600; }
  .fg-turno.pocos .fg-nota { color: #8A5307; } .fg-turno.lleno .fg-nota { color: #B0563A; }
  .fg-rec { margin-top: auto; min-height: 42px; width: 100%; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 12px; background: #fff;
    font: inherit; font-size: 13.5px; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .fg-rec:hover { background: var(--crema,#FBF9F4); }
  .fg-rec:disabled { opacity: .6; cursor: wait; }
  .fg-rec svg { width: 16px; height: 16px; }

  /* --- Buscador + chips --- */
  .fg-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 4px; }
  .fg-buscar { flex: 1 1 260px; min-width: 0; min-height: 48px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 14px; padding: 0 14px;
    font: inherit; font-size: 16px; background: #fff; color: var(--navy,#26374B); }
  .fg-buscar:focus { outline: 2px solid var(--azul-filete,#3B85C0); border-color: var(--azul-filete,#3B85C0); }
  .fg-chips { display: flex; gap: 4px; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 4px;
    max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .fg-chips::-webkit-scrollbar { display: none; }
  .fg-chips button { flex: 1 0 auto; min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px; background: none; font: inherit; font-weight: 700;
    font-size: 13.5px; color: var(--texto-suave,#6E6656); cursor: pointer; white-space: nowrap; }
  .fg-chips button:hover { color: var(--navy,#26374B); }
  .fg-chips button.on { background: var(--navy,#26374B); color: #fff; }
  .fg-cuenta { display: block; font-size: 13px; color: var(--texto-suave,#6E6656); margin: 4px 2px 0; min-height: 20px; }
  @media (max-width: 620px) { .fg-chips { width: 100%; border-radius: 14px; } }

  /* --- Fila-tarjeta: toda ella abre la hoja --- */
  .fg-lista { container: fg-lista / inline-size; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .fg-fila { position: relative; display: grid; grid-template-columns: 40px minmax(0,1.5fr) 170px minmax(0,1fr) 150px 14px; gap: 0 14px; align-items: center;
    background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-left: 4px solid #6E8FB0; border-radius: 14px; padding: 10px 14px 10px 12px;
    cursor: pointer; box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 22px -20px rgba(30,45,65,.4); transition: box-shadow .15s, transform .15s; }
  .fg-fila:hover { box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 16px 26px -18px rgba(30,45,65,.45); transform: translateY(-1px); }
  .fg-fila:focus-visible { outline: 3px solid var(--azul-filete,#3B85C0); outline-offset: 2px; }
  .fg-fila.q-socio { border-left-color: #3B85C0; }
  .fg-fila.q-escuela { border-left-color: #D9A441; }
  .fg-ini { width: 40px; height: 40px; border-radius: 999px; background: #EAF2FA; color: var(--azul-oscuro,#2A5E8C); display: flex; align-items: center;
    justify-content: center; font-family: var(--fuente-titulo); font-weight: 700; font-size: 14px; }
  .fg-per { min-width: 0; }
  .fg-per b { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .fg-per small { display: block; font-size: 13px; color: var(--texto-tenue,#9A927F); margin-top: 1px; overflow-wrap: anywhere; }
  .fg-dias { display: flex; flex-wrap: wrap; gap: 4px; }
  .fg-dia { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #EEF3F8; color: #2A4A6B; white-space: nowrap; }
  .fg-alt { font-size: 13.5px; color: var(--texto-suave,#6E6656); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fg-alt.sin { color: var(--texto-tenue,#9A927F); }
  .fg-tel { position: relative; z-index: 1; justify-self: start; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 10px;
    border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; color: var(--azul-oscuro,#1E4E78); text-decoration: none; font-size: 13.5px;
    font-variant-numeric: tabular-nums; background: #fff; white-space: nowrap; }
  .fg-tel:hover { background: #F2F7FC; border-color: #CFE2F1; }
  .fg-tel svg { width: 15px; height: 15px; flex: 0 0 15px; }
  .fg-tel.sin { color: var(--texto-tenue,#9A927F); border-style: dashed; cursor: default; }
  .fg-flecha { color: #B5AC99; font-size: 20px; line-height: 1; text-align: right; }
  .fg-cab-cols { display: grid; grid-template-columns: 40px minmax(0,1.5fr) 170px minmax(0,1fr) 150px 14px; gap: 0 14px; padding: 12px 14px 0 16px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--texto-tenue,#9A927F); }
  @container fg-lista (max-width: 640px) {
    .fg-fila { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: 11px 12px 12px 10px; }
    .fg-ini { order: 0; flex: 0 0 40px; }
    .fg-per { order: 1; flex: 1 1 0; }
    .fg-flecha { order: 2; font-size: 22px; }
    .fg-fila::after { content: ""; order: 3; flex-basis: 100%; height: 0; }
    .fg-dias { order: 4; }
    .fg-alt { display: none; }
    .fg-tel { order: 6; margin-left: auto; }
    .fg-tel.sin { display: none; }
  }
  @media (max-width: 700px) { .fg-cab-cols { display: none; } }
  .fg-vacio { text-align: center; color: var(--texto-suave,#6E6656); padding: 30px 18px; background: #fff; border: 1px dashed var(--linea-borde,#C9C0AE); border-radius: 14px; margin-top: 10px; line-height: 1.5; }
  .fg-vacio b { display: block; color: var(--navy,#26374B); font-size: 16px; margin-bottom: 4px; }
  .fg-vacio button { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linea-borde,#C9C0AE); background: #fff;
    font: inherit; font-weight: 700; color: var(--navy,#26374B); cursor: pointer; }

  /* --- Hoja inferior --- */
  .fg-velo { position: fixed; inset: 0; background: rgba(20,30,45,.45); z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .fg-velo.ver { opacity: 1; pointer-events: auto; }
  .fg-hoja { position: fixed; left: 50%; bottom: 0; width: min(560px,100%); transform: translate(-50%,105%); z-index: 9001; background: #fff; color: var(--navy,#26374B);
    border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transition: transform .25s ease; max-height: 92vh; overflow: auto;
    overscroll-behavior: contain; box-shadow: 0 -10px 40px rgba(20,30,45,.25); visibility: hidden; }
  .fg-hoja.ver { transform: translate(-50%,0); visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .fg-hoja, .fg-velo, .fg-fila { transition: none; } }
  .fg-hoja .asa { width: 42px; height: 5px; border-radius: 9px; background: #DDD5C4; margin: 2px auto 12px; }
  .fg-hoja-cab { display: flex; align-items: center; gap: 12px; }
  .fg-hoja-cab .fg-ini { width: 48px; height: 48px; flex: 0 0 48px; font-size: 16px; }
  .fg-hoja-cab > div { flex: 1; min-width: 0; }
  .fg-hoja h3 { margin: 0; font-family: var(--fuente-titulo); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
  .fg-hoja .sub { color: var(--texto-suave,#6E6656); font-size: 13.5px; margin: 3px 0 0; }
  .fg-cerrar { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea-marcada,#E4DCCB); background: #fff;
    color: var(--texto-suave,#6E6656); font-size: 20px; line-height: 1; cursor: pointer; }
  .fg-datos { margin: 14px 0 4px; background: var(--crema,#FBF9F4); border-radius: 14px; padding: 4px 14px; }
  .fg-datos div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #EFE9DA; font-size: 14.5px; }
  .fg-datos div:last-child { border-bottom: 0; }
  .fg-datos span { color: var(--texto-suave,#6E6656); flex: 0 0 auto; }
  .fg-datos b { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .fg-acc { display: grid; gap: 8px; margin-top: 14px; }
  .fg-acc a, .fg-acc button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 15px;
    text-decoration: none; border: 1px solid var(--linea-marcada,#E4DCCB); color: var(--navy,#26374B); background: #fff; cursor: pointer; width: 100%; }
  .fg-acc a:hover, .fg-acc button:hover { background: var(--crema,#FBF9F4); }
  .fg-acc a.wa { background: #1F8F4E; border-color: #1F8F4E; color: #fff; }
  .fg-acc a.wa:hover { background: #187A41; }
  .fg-acc button.peligro { color: #9A3B3B; border-color: #EBC9C5; }
  .fg-acc button.peligro:hover { background: #FDF3F2; }
  .fg-acc .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fg-acc svg { width: 17px; height: 17px; }
</style>
</head>
<body class="adm-piel">

<div class="admin-wrap">
  <div class="fg-wrap" id="fg">
    <div class="fg-cab"><h1>Fuerza gratis del Cubo</h1><p>Cargando…</p></div>
  </div>
</div>

<!-- ===== HOJA DEL APUNTADO (se abre al tocar una fila) ===== -->
<div class="fg-capa">
  <div class="fg-velo" id="fg-velo"></div>
  <div class="fg-hoja" id="fg-hoja" role="dialog" aria-modal="true" aria-labelledby="fg-h-nombre">
    <div class="asa" aria-hidden="true"></div>
    <div class="fg-hoja-cab">
      <span class="fg-ini" id="fg-h-ini"></span>
      <div><h3 id="fg-h-nombre"></h3><p class="sub" id="fg-h-sub"></p></div>
      <button type="button" class="fg-cerrar" id="fg-h-cerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="fg-datos" id="fg-h-datos"></div>
    <div class="fg-acc" id="fg-h-acc"></div>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  var PLAZAS = 20;
  var DIAS = [['viernes','Viernes','18:30–19:30'],['sabado','Sábado','9:00–10:30'],['domingo','Domingo','9:00–10:30']];
  var DCORTO = { viernes: 'Vie', sabado: 'Sáb', domingo: 'Dom' };
  var CERRADOS = ['domingo'];   // turnos cancelados hasta nuevo aviso (también en la Edge cubo-prueba-alta)
  var DLARGO = { viernes: 'Viernes', sabado: 'Sábado', domingo: 'Domingo' };
  var QTXT = { socio: 'Socio', escuela: 'Familia de la escuela', otro: 'Otro' };
  var ALTAS = [], FTURNO = '', montado = false;

  var ICO_TEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICO_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  var ICO_WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

  function nombreDe(a) { return ((a.nombre || '') + ' ' + (a.apellidos || '')).trim() || 'Sin nombre'; }
  function inicialesDe(a) {
    var n = (a.nombre || '').trim(), ap = (a.apellidos || '').trim();
    return ((n ? n[0] : '') + (ap ? ap[0] : '')).toUpperCase() || '·';
  }
  // Teléfono → número para wa.me (solo dígitos, con prefijo país; España por defecto). Igual que en «Altas del Cubo».
  function waNum(tel) { var t = String(tel || '').replace(/[^\d+]/g, ''); if (t.charAt(0) === '+') t = t.slice(1); else if (t.slice(0, 2) === '00') t = t.slice(2); else if (t.length === 9) t = '34' + t; return t; }
  function quienDe(a) {
    var q = QTXT[a.quien] || a.quien || '';
    if (a.quien === 'escuela' && a.hijo) q += ' · hijo/a: ' + a.hijo;
    return q;
  }
  function enTurno(a, t) { return (a.turnos || []).indexOf(t) !== -1; }

  async function cargar() {
    var r = await sb.from('cubo_prueba').select('*').neq('estado','cancelado').order('created_at', { ascending: false });
    if (r.error) {
      $('fg').innerHTML = '<div class="fg-cab"><h1>Fuerza gratis del Cubo</h1></div>' + ADM.error(r.error.message, cargar);
      montado = false; return;
    }
    ALTAS = r.data || [];
    /* Al mirar esta página se marcan como «vistas»: así el aviso de «inscripciones
       nuevas» del panel de inicio se apaga (guarda el momento en este dispositivo). */
    try { localStorage.setItem('apo-cubo-visto', new Date().toISOString()); } catch (e) {}
    if (!montado) montar(); else { pintarTurnos(); pintarLista(); }
  }

  function pintarTurnos() {
    $('fg-turnos').innerHTML = DIAS.map(function (d) {
      var n = ALTAS.filter(function (a) { return enTurno(a, d[0]); }).length;
      // El domingo está cancelado hasta nuevo aviso (24-oct): se ve, pero sin recordatorio.
      var cerrado = CERRADOS.indexOf(d[0]) !== -1;
      var lleno = !cerrado && n >= PLAZAS, pocos = !cerrado && n > 0 && n < 6;
      var pct = Math.min(100, Math.round(n / PLAZAS * 100));
      return '<div class="fg-turno' + (lleno ? ' lleno' : '') + (pocos ? ' pocos' : '') + (FTURNO === d[0] ? ' on' : '') + '">' +
        '<button type="button" class="fg-filtra" data-turno="' + d[0] + '" aria-pressed="' + (FTURNO === d[0] ? 'true' : 'false') + '" aria-label="Ver solo los del ' + esc(d[1]) + '">' +
          '<span class="dia"><strong>' + esc(d[1]) + '</strong><span>' + esc(d[2]) + '</span></span>' +
          '<span class="n">' + n + '<small> / ' + PLAZAS + ' plazas</small></span>' +
        '</button>' +
        '<div class="fg-barra"><span style="width:' + pct + '%"></span></div>' +
        (cerrado ? '<span class="fg-nota" style="color:#9A3B3B">Cancelado hasta nuevo aviso</span>' :
          (lleno ? '<span class="fg-nota">Completo</span>' : (pocos ? '<span class="fg-nota">Pocos apuntados — ¿cancelar el turno?</span>' : ''))) +
        (n > 0 && !cerrado ? '<button type="button" class="fg-rec" data-rec="' + d[0] + '">' + ICO_MAIL + 'Recordatorio por correo</button>' : '') +
      '</div>';
    }).join('');
    var chips = [['', 'Todos', ALTAS.length]].concat(DIAS.map(function (d) {
      return [d[0], d[1], ALTAS.filter(function (a) { return enTurno(a, d[0]); }).length];
    }));
    $('fg-chips').innerHTML = chips.map(function (c) {
      return '<button type="button" data-turno="' + c[0] + '">' + esc(c[1]) + ' · ' + c[2] + '</button>';
    }).join('');
  }

  function visibles() {
    var q = ($('fg-buscar').value || '').trim().toLowerCase();
    return ALTAS.filter(function (a) {
      if (FTURNO && !enTurno(a, FTURNO)) return false;
      if (!q) return true;
      return ((a.nombre || '') + ' ' + (a.apellidos || '') + ' ' + (a.telefono || '') + ' ' + (a.email || '') + ' ' + (a.hijo || '')).toLowerCase().indexOf(q) !== -1;
    });
  }

  function filaHtml(a) {
    var sub = quienDe(a);   // el correo, en la hoja: en la fila alargaba cada tarjeta
    var dias = (a.turnos || []).map(function (t) { return '<span class="fg-dia">' + esc(DCORTO[t] || t) + '</span>'; }).join('');
    return '<div class="fg-fila q-' + esc(a.quien || 'otro') + '" tabindex="0" data-id="' + esc(a.id) + '" aria-label="' + esc(nombreDe(a)) + ': ver qué hacer">' +
      '<span class="fg-ini">' + esc(inicialesDe(a)) + '</span>' +
      '<span class="fg-per"><b>' + esc(nombreDe(a)) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
      '<span class="fg-dias" title="Turnos">' + (dias || '<span class="fg-alt sin">sin turno</span>') + '</span>' +
      (a.alternativa ? '<span class="fg-alt" title="' + esc(a.alternativa) + '">' + esc(a.alternativa) + '</span>' : '<span class="fg-alt sin">—</span>') +
      (a.telefono
        ? '<a class="fg-tel" href="tel:' + esc(String(a.telefono).replace(/\s+/g, '')) + '" aria-label="Llamar a ' + esc(nombreDe(a)) + '">' + ICO_TEL + esc(a.telefono) + '</a>'
        : '<span class="fg-tel sin">sin teléfono</span>') +
      '<span class="fg-flecha" aria-hidden="true">›</span>' +
    '</div>';
  }

  function pintarLista() {
    Array.prototype.forEach.call(document.querySelectorAll('#fg-chips button'), function (b) {
      var on = (b.getAttribute('data-turno') || '') === FTURNO;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.fg-turno'), function (t) {
      var bt = t.querySelector('.fg-filtra');
      var on = !!FTURNO && bt && bt.getAttribute('data-turno') === FTURNO;
      t.classList.toggle('on', on); if (bt) bt.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var lista = visibles();
    $('fg-cuenta').textContent = lista.length === ALTAS.length
      ? ALTAS.length + (ALTAS.length === 1 ? ' apuntado' : ' apuntados')
      : lista.length + ' de ' + ALTAS.length + ' apuntados';
    if (!ALTAS.length) {
      $('fg-lista').innerHTML = '<div class="fg-vacio"><b>Todavía no se ha apuntado nadie</b>Cuando alguien rellene el formulario de fuerza gratis, aparecerá aquí.</div>';
      return;
    }
    if (!lista.length) {
      $('fg-lista').innerHTML = '<div class="fg-vacio"><b>Nadie encaja con el filtro</b>Prueba con otra palabra o quita el filtro.<br><button type="button" data-limpiar>Ver a todos</button></div>';
      return;
    }
    $('fg-lista').innerHTML =
      '<div class="fg-cab-cols" aria-hidden="true"><span></span><span>Quién</span><span>Turnos</span><span>Otro horario</span><span>Contacto</span><span></span></div>' +
      '<div class="fg-lista">' + lista.map(filaHtml).join('') + '</div>';
  }

  function montar() {
    montado = true;
    $('fg').innerHTML =
      '<div class="fg-cab"><h1>Fuerza gratis del Cubo</h1><p>Los que se han apuntado a los <b>3 turnos gratuitos</b> de octubre (formulario: <a href="../../cubo/fuerza-gratis/" target="_blank" rel="noopener">/cubo/fuerza-gratis/</a>). Mira cuántos hay en cada turno para decidir si amplías o cancelas alguno; toca un turno para ver solo a los suyos, o a una persona para llamarle, escribirle o cancelar su plaza.</p></div>' +
      '<div class="fg-turnos" id="fg-turnos"></div>' +
      '<div class="fg-filtros">' +
        '<input type="search" class="fg-buscar" id="fg-buscar" placeholder="Buscar por nombre o teléfono…" aria-label="Buscar apuntado (nombre, teléfono o correo)" autocomplete="off">' +
        '<div class="fg-chips" id="fg-chips" role="group" aria-label="Turno"></div>' +
      '</div>' +
      '<span class="fg-cuenta" id="fg-cuenta" aria-live="polite"></span>' +
      '<div id="fg-lista"></div>';

    $('fg-buscar').addEventListener('input', pintarLista);
    $('fg').addEventListener('click', function (ev) {
      var rec = ev.target.closest('.fg-rec[data-rec]');
      if (rec) { enviarRecordatorio(rec); return; }
      var f = ev.target.closest('[data-turno]');
      if (f && (f.closest('#fg-chips') || f.classList.contains('fg-filtra'))) {
        var v = f.getAttribute('data-turno') || '';
        /* Pulsar el turno que ya filtra lo quita. */
        FTURNO = (f.classList.contains('fg-filtra') && FTURNO === v) ? '' : v;
        pintarLista(); return;
      }
      if (ev.target.closest('[data-limpiar]')) { FTURNO = ''; $('fg-buscar').value = ''; pintarLista(); return; }
      if (ev.target.closest('a')) return;          // el teléfono llama, no abre la hoja
      var fila = ev.target.closest('.fg-fila[data-id]');
      if (fila) abrirHoja(fila.getAttribute('data-id'), fila);
    });
    $('fg').addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var fila = ev.target.closest && ev.target.closest('.fg-fila[data-id]');
      if (!fila || ev.target !== fila) return;
      ev.preventDefault(); abrirHoja(fila.getAttribute('data-id'), fila);
    });
    pintarTurnos();
    pintarLista();
  }

  // Envía el recordatorio del turno por correo (Edge cubo-recordatorio → Brevo). Igual que antes.
  async function enviarRecordatorio(b) {
    var turno = b.getAttribute('data-rec');
    var dNom = { viernes: 'viernes', sabado: 'sábado', domingo: 'domingo' }[turno] || turno;
    var texto = 'Se enviará el recordatorio por correo a los apuntados del ' + dNom + ' (los que tienen correo y no están cancelados). ¿Seguir?';
    var ok = window.apoConfirm ? await apoConfirm({ titulo: 'Enviar recordatorio', texto: texto }) : window.confirm(texto);
    if (!ok) return;
    var html = b.innerHTML; b.disabled = true; b.textContent = 'Enviando…';
    var r = await sb.functions.invoke('cubo-recordatorio', { body: { turno: turno } });
    b.disabled = false; b.innerHTML = html;
    var avisar = function (msg, tono) { if (window.apoToast) apoToast(msg, tono === 'ok' ? 'ok' : (tono || '')); else alert(msg); };
    if (r.error) {
      var d = null; try { if (r.error.context && r.error.context.json) d = await r.error.context.json(); } catch (e) {}
      avisar((d && d.mensaje) || 'No se ha podido enviar. Inténtalo en un rato.', 'error'); return;
    }
    var data = r.data || {};
    avisar('Recordatorio enviado a ' + (data.enviados || 0) + ' persona' + ((data.enviados === 1) ? '' : 's') +
      (data.fallidos ? ' (' + data.fallidos + ' fallaron)' : ''), data.fallidos ? 'error' : 'ok');
  }

  /* ---------- hoja del apuntado ---------- */
  var focoPrevio = null, abiertaId = null;
  function abrirHoja(id, desde) {
    var a = ALTAS.filter(function (x) { return x.id === id; })[0];
    if (!a) return;
    abiertaId = id;
    focoPrevio = desde || document.activeElement;
    $('fg-h-ini').textContent = inicialesDe(a);
    $('fg-h-nombre').textContent = nombreDe(a);
    $('fg-h-sub').textContent = quienDe(a) || 'Apuntado a fuerza gratis';
    function par(k, v) { return '<div><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }
    var turnos = (a.turnos || []).map(function (t) {
      var d = DIAS.filter(function (x) { return x[0] === t; })[0];
      return (DLARGO[t] || t) + (d ? ' ' + d[2] : '');
    }).join(' · ');
    $('fg-h-datos').innerHTML =
      par('Turnos', turnos || '—') +
      par('Teléfono', a.telefono || '—') +
      par('Correo', a.email || '—') +
      par('Otro horario', a.alternativa || '—');
    var tel = a.telefono ? String(a.telefono).replace(/\s+/g, '') : '';
    $('fg-h-acc').innerHTML =
      (tel ? '<a class="wa" href="https://wa.me/' + esc(waNum(tel)) + '" target="_blank" rel="noopener">' + ICO_WA + 'Escribir por WhatsApp</a>' : '') +
      ((tel || a.email) ? '<div' + (tel && a.email ? ' class="dos"' : '') + '>' +
        (tel ? '<a href="tel:' + esc(tel) + '">' + ICO_TEL + 'Llamar</a>' : '') +
        (a.email ? '<a href="mailto:' + esc(a.email) + '">' + ICO_MAIL + 'Correo</a>' : '') + '</div>' : '') +
      '<button type="button" class="peligro" id="fg-h-cancelar">Cancelar su plaza</button>';
    $('fg-velo').classList.add('ver'); $('fg-hoja').classList.add('ver');
    setTimeout(function () { $('fg-h-cerrar').focus(); }, 60);
  }
  function cerrarHoja() {
    if (!$('fg-hoja').classList.contains('ver')) return;
    $('fg-velo').classList.remove('ver'); $('fg-hoja').classList.remove('ver');
    abiertaId = null;
    if (focoPrevio && focoPrevio.focus && document.body.contains(focoPrevio)) focoPrevio.focus();
  }
  $('fg-velo').addEventListener('click', cerrarHoja);
  $('fg-h-cerrar').addEventListener('click', cerrarHoja);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !ev.defaultPrevented) cerrarHoja(); });

  // Cancelar a un apuntado: deja de contar y no recibe recordatorios. Lo mismo que antes.
  $('fg-h-acc').addEventListener('click', async function (ev) {
    if (!ev.target.closest('#fg-h-cancelar') || !abiertaId) return;
    var id = abiertaId;
    var a = ALTAS.filter(function (x) { return x.id === id; })[0];
    var nom = a ? nombreDe(a) : 'esta persona';
    var texto = '¿Cancelar a ' + nom + '? Dejará de contar en el turno y no recibirá recordatorios.';
    var ok = window.apoConfirm ? await apoConfirm({ titulo: 'Cancelar apuntado', texto: texto, peligro: true }) : window.confirm(texto);
    if (!ok) return;
    var r = await sb.from('cubo_prueba').update({ estado: 'cancelado' }).eq('id', id);
    if (r.error) { if (window.apoToast) apoToast('No se pudo cancelar: ' + r.error.message, 'error'); else alert('No se pudo cancelar.'); return; }
    cerrarHoja();
    if (window.apoToast) apoToast(nom + ' cancelado', 'ok', { deshacer: async function () { await sb.from('cubo_prueba').update({ estado: 'apuntado' }).eq('id', id); await cargar(); } });
    await cargar();
  });

  cargar();
});
</script>
</body>
</html>
