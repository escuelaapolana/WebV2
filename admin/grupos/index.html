<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupos de entrenamiento · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; box-sizing: border-box; padding: 11px 13px; border: 1px solid var(--linea-borde); border-radius: 10px;
    font-family: var(--fuente-texto); font-size: 15px; background: #fff; color: var(--navy);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }
  textarea { min-height: 100px; resize: vertical; }
  .fila-check { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .fila-check input { width: auto; }
  .fila-check label { margin: 0; }

  .msg { margin-top: 12px; font-size: 14px; }
  .msg.error { color: #B0563A; }
  .msg.ok { color: #1e7a3d; }

  .panel { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,30px); box-shadow: var(--sombra-suave); margin-bottom: 22px; }
  .panel h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 21px; color: var(--navy); margin-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); font-size: 14px; vertical-align: top; }
  th { font-size: 13px; text-transform: none; color: var(--texto-suave); }
  .acciones-fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* Borrar un grupo no se deshace: se aparta del botón de editar. */
  .acciones-fila .btn--peligro { margin-left: auto; }

  /* --- Buscador de la lista: mismo patrón que en Atletas --- */
  .banda-busca { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .banda-busca input[type="search"] {
    flex: 1 1 240px; max-width: 320px; box-sizing: border-box; min-height: 44px;
    padding: 10px 14px; border: 1px solid var(--linea-borde); border-radius: 999px;
    background: #fff; font-family: inherit; font-size: 15px; color: var(--navy); }
  .banda-busca select { flex: 0 1 auto; max-width: 240px; min-height: 44px; border-radius: 999px; }
  .banda-busca .cuenta { margin-left: auto; font-family: var(--fuente-dato); font-size: 14px;
    color: var(--texto-suave); white-space: nowrap; }
  @media (max-width: 620px) {
    .banda-busca input[type="search"], .banda-busca select { max-width: none; flex: 1 1 100%; }
    .banda-busca .cuenta { margin-left: 0; width: 100%; }
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }

  .btn { cursor: pointer; }
  /* Todo lo pulsable llega a 44 px de alto: es lo que se acierta con el pulgar. */
  .btn--peligro { background: transparent; border: 1px solid #e0b4b0; color: #B0563A; padding: 10px 16px;
    border-radius: 999px; font-size: 14px; min-height: 44px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center; font-family: inherit; }
  .btn--peligro:hover { background: #fbeceb; }
  .btn--mini { padding: 10px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center; }
  .oculto { display: none !important; }
  /* Edición en ventana emergente (modal), no al fondo de la página */
  #panel-form { position:fixed; inset:0; z-index:1000; background:rgba(46,66,86,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(16px,5vh,60px) 16px; overflow:auto; border:0; border-radius:0; box-shadow:none; margin:0;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #panel-form .modal-caja { background:#fff; border:1px solid var(--linea); border-radius: 14px;
    box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:24px; width:min(660px,100%);
    animation:modal-sube .2s ease; }
  @keyframes modal-sube { from{ transform:translateY(12px); opacity:.6; } to{ transform:none; opacity:1; } }

  .pill-estado { font-size: 13px; padding: 2px 8px; border-radius: 999px; }
  .pill-si { background: #e6f4ea; color: #1e7a3d; }
  .pill-no { background: var(--crema-media); color: var(--texto-suave); }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="admin-wrap">

    <!-- ===== LISTA DE GRUPOS ===== -->
    <div class="panel">
      <h2>Grupos de entrenamiento</h2>
      <p class="intro" style="margin-bottom:10px;">Crea, edita o borra los grupos de entrenamiento del club.</p>
      <div style="margin-bottom:14px;"><button class="btn btn--primario btn--mini" id="nuevo-grupo">+ Nuevo grupo</button></div>

      <div class="banda-busca">
        <input type="search" id="f-buscar" placeholder="Buscar por nombre o sección…" aria-label="Buscar un grupo">
        <select id="f-activo" aria-label="Activo en la web">
          <option value="">Activos y apagados</option>
          <option value="si">Solo los activos</option>
          <option value="no">Solo los apagados</option>
        </select>
        <span class="cuenta" id="f-cuenta" aria-live="polite"></span>
      </div>

      <div style="overflow-x:auto;">
        <table id="tabla-grupos">
          <thead><tr><th>Nombre</th><th>Sección</th><th>Horario</th><th>Activo</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- ===== FORMULARIO (oculto hasta crear/editar) ===== -->
    <div class="panel oculto" id="panel-form">
      <div class="modal-caja">
      <h2 id="form-titulo">Nuevo grupo</h2>
      <form id="form-grupo">
        <input type="hidden" id="g-id">
        <label for="g-nombre">Nombre</label>
        <input type="text" id="g-nombre" required>
        <div class="grid2">
          <div>
            <label for="g-seccion">Sección</label>
            <input type="text" id="g-seccion" list="lista-secciones" placeholder="pista, running, natacion, triatlon, montana, cubo, escuela…">
            <datalist id="lista-secciones">
              <option value="pista"></option><option value="running"></option><option value="natacion"></option>
              <option value="escuela-natacion"></option><option value="triatlon"></option><option value="montana"></option>
              <option value="cubo"></option><option value="escuela"></option><option value="competicion"></option>
            </datalist>
          </div>
          <div>
            <label for="g-horario">Horario</label>
            <input type="text" id="g-horario" placeholder="Lunes y miércoles, 18:00–19:30">
          </div>
        </div>
        <label for="g-descripcion">Descripción</label>
        <textarea id="g-descripcion"></textarea>

        <label for="g-pruebas">Pruebas del grupo</label>
        <textarea id="g-pruebas" placeholder="Una por línea: 60 m, 100 m, vallas, longitud… Salen como pastillas en la página de la sección. Si lo dejas vacío, no sale nada."></textarea>
        <div class="fila-check">
          <input type="checkbox" id="g-activo" checked>
          <label for="g-activo">Activo (visible en la web)</label>
        </div>
        <div style="margin-top:18px; display:flex; gap:10px;">
          <button class="btn btn--primario btn--mini" type="submit">Guardar</button>
          <button class="btn btn--fantasma btn--mini" type="button" id="cancelar">Cancelar</button>
          <span class="msg" id="msg-form"></span>
        </div>
      </form>
      </div>
    </div>

  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  // Nombre bonito de la sección (en la base se guarda el identificador sin acentos)
  var SECCIONES = {
    'pista': 'Atletismo en pista', 'running': 'Running', 'natacion': 'Natación',
    'escuela-natacion': 'Escuela de natación', 'triatlon': 'Triatlón', 'montana': 'Montaña',
    'cubo': 'El Cubo', 'escuela': 'Escuela de atletismo', 'competicion': 'Competición'
  };
  function nombreSeccion(s) { return s ? (SECCIONES[s] || s) : '—'; }

  // --- Listar ---
  var GRUPOS = [];

  async function cargarGrupos() {
    var tb = $('tabla-grupos').querySelector('tbody');
    tb.innerHTML = ADM.filaCargando(5);
    $('f-cuenta').textContent = '';
    var r = await sb.from('grupos').select('id,nombre,seccion,horario,activo').order('nombre');
    /* Con la consulta caída `data` viene vacío: decir «no hay grupos todavía»
       sería dar por mirado lo que no se ha podido mirar. */
    if (r.error) { GRUPOS = []; tb.innerHTML = ADM.filaError(5, r.error.message, cargarGrupos); return; }
    GRUPOS = r.data || [];
    pintarGrupos();
  }

  function pintarGrupos() {
    var tb = $('tabla-grupos').querySelector('tbody');
    var texto = ($('f-buscar').value || '').trim().toLowerCase();
    var estado = $('f-activo').value;

    var lista = GRUPOS.filter(function (g) {
      if (estado === 'si' && !g.activo) return false;
      if (estado === 'no' && g.activo) return false;
      if (!texto) return true;
      var t = ((g.nombre || '') + ' ' + (g.seccion || '') + ' ' + nombreSeccion(g.seccion) + ' ' + (g.horario || '')).toLowerCase();
      return t.indexOf(texto) !== -1;
    });

    $('f-cuenta').textContent = lista.length === GRUPOS.length
      ? GRUPOS.length + (GRUPOS.length === 1 ? ' grupo' : ' grupos')
      : lista.length + ' de ' + GRUPOS.length;

    /* «No hay grupos» y «la búsqueda no encuentra ninguno» piden cosas
       distintas: crear uno, o quitar el filtro. */
    if (!GRUPOS.length) {
      tb.innerHTML = ADM.filaVacia(5, 'Todavía no hay ningún grupo',
        'Los grupos son la base de los horarios, las listas de asistencia y la web pública. Crea el primero.',
        '<button type="button" class="btn btn--primario btn--mini" data-primero>+ Nuevo grupo</button>',
        '<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.9-3 3.1-4.5 5.5-4.5s4.6 1.5 5.5 4.5"/><path d="M16 6.2a3.2 3.2 0 0 1 0 6"/><path d="M17.5 15.4c1.6.7 2.7 2 3.2 4.1"/>');
      return;
    }
    if (!lista.length) {
      tb.innerHTML = ADM.filaVacia(5, 'Ningún grupo encaja con la búsqueda',
        'Prueba con una palabra suelta del nombre o vuelve a «Activos y apagados».',
        '<button type="button" class="btn btn--fantasma btn--mini" data-limpiar>Quitar el filtro</button>',
        '<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>');
      return;
    }

    tb.innerHTML = lista.map(function (g) {
      return '<tr>' +
        '<td>' + esc(g.nombre) + '</td>' +
        '<td>' + esc(nombreSeccion(g.seccion)) + '</td>' +
        '<td>' + esc(g.horario || '—') + '</td>' +
        '<td>' + (g.activo ? '<span class="pill-estado pill-si">Sí</span>' : '<span class="pill-estado pill-no">No</span>') + '</td>' +
        '<td><div class="acciones-fila"><button class="btn btn--fantasma btn--mini" data-editar="' + g.id + '">Editar</button>' +
        '<button class="btn btn--peligro" data-borrar="' + g.id + '" data-nom="' + esc(g.nombre) + '">Borrar</button></div></td>' +
      '</tr>';
    }).join('');
  }

  $('f-buscar').addEventListener('input', pintarGrupos);
  $('f-activo').addEventListener('change', pintarGrupos);

  // --- Crear/editar ---
  function abrirForm(g) {
    g = g || {};
    $('form-titulo').textContent = g.id ? 'Editar grupo' : 'Nuevo grupo';
    $('g-id').value = g.id || '';
    $('g-nombre').value = g.nombre || '';
    $('g-seccion').value = g.seccion || '';
    $('g-horario').value = g.horario || '';
    $('g-descripcion').value = g.descripcion || '';
    $('g-pruebas').value = g.pruebas || '';
    $('g-activo').checked = g.id ? !!g.activo : true;
    $('msg-form').textContent = '';
    $('panel-form').classList.remove('oculto');
    $('panel-form').scrollTop = 0;
  }
  $('nuevo-grupo').addEventListener('click', function () { abrirForm(); });
  $('cancelar').addEventListener('click', function () { $('panel-form').classList.add('oculto'); });
  $('panel-form').addEventListener('click', function (e) { if (e.target === this) $('panel-form').classList.add('oculto'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('panel-form').classList.contains('oculto')) $('panel-form').classList.add('oculto'); });

  $('tabla-grupos').addEventListener('click', async function (e) {
    if (e.target.closest && e.target.closest('[data-primero]')) { abrirForm(); return; }
    if (e.target.closest && e.target.closest('[data-limpiar]')) {
      $('f-buscar').value = ''; $('f-activo').value = ''; pintarGrupos(); return;
    }
    var ed = e.target.getAttribute('data-editar');
    var bo = e.target.getAttribute('data-borrar');
    if (ed) {
      var r = await sb.from('grupos').select('*').eq('id', ed).single();
      /* Si la ficha no se puede leer hay que decirlo: antes el botón «Editar»
         no hacía nada y parecía que la pantalla se había quedado colgada. */
      if (r.error) { apoToast('No se ha podido abrir el grupo: ' + r.error.message, 'error'); return; }
      abrirForm(r.data);
    }
    if (bo) {
      if (!await apoConfirm({ texto: '¿Borrar el grupo "' + e.target.getAttribute('data-nom') + '"? No se puede deshacer.', peligro: true })) return;
      var d = await sb.from('grupos').delete().eq('id', bo);
      if (d.error) { apoToast('No se pudo borrar: ' + d.error.message, 'error'); return; }
      cargarGrupos();
    }
  });

  $('form-grupo').addEventListener('submit', async function (e) {
    e.preventDefault();
    var datos = {
      nombre: $('g-nombre').value.trim(),
      seccion: $('g-seccion').value.trim() || null,
      horario: $('g-horario').value.trim() || null,
      descripcion: $('g-descripcion').value.trim() || null,
      pruebas: $('g-pruebas').value.trim() || null,
      activo: $('g-activo').checked
    };
    $('msg-form').textContent = 'Guardando…'; $('msg-form').className = 'msg';
    var id = $('g-id').value, r;
    if (id) r = await sb.from('grupos').update(datos).eq('id', id);
    else r = await sb.from('grupos').insert(datos);
    if (r.error) { $('msg-form').textContent = 'Error: ' + r.error.message; $('msg-form').className = 'msg error'; return; }
    $('msg-form').textContent = 'Guardado ✓'; $('msg-form').className = 'msg ok';
    $('panel-form').classList.add('oculto');
    cargarGrupos();
  });

  cargarGrupos();
});
</script>

</body>
</html>
