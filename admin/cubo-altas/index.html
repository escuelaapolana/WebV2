<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altas de El Cubo · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); }
  .ca-wrap { max-width:820px; margin:0 auto; padding:clamp(18px,4vw,30px) clamp(14px,4vw,28px) 60px; }
  .volver { display:inline-flex; align-items:center; min-height:44px; color:var(--azul-oscuro,#2F6FA8); font-weight:600; text-decoration:none; font-size:14px; }
  h1.saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-.01em; font-size:clamp(26px,5.5vw,36px); color:var(--navy,#26374B); margin:6px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 12px; }
  .chip { font:inherit; font-size:13.5px; cursor:pointer; background:#fff; color:var(--texto-suave,#6E6656); border:1px solid var(--linea-marcada,#E4DCCB); border-radius:999px; padding:7px 13px; }
  .chip.on { background:var(--navy,#26374B); color:#fff; border-color:var(--navy,#26374B); }
  .chip .c { opacity:.7; font-variant-numeric:tabular-nums; }

  .alta { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); padding:15px 17px; margin-top:12px; }
  .alta-top { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .alta .quien { flex:1; min-width:0; }
  .alta .quien b { font-size:16px; color:var(--navy,#26374B); }
  .alta .quien .tag { font-size:10.5px; font-weight:700; text-transform:uppercase; border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:2px; }
  .alta .quien .tag.esc { background:#EAF3E3; color:#4E8A3E; } .alta .quien .tag.fuera { background:#EDE6F5; color:#5B4B8A; }
  .alta .quien .tag.socio { background:#E7F1F9; color:#2F6FA8; }
  .alta .quien small { display:block; font-size:12.5px; color:var(--texto-suave,#6E6656); margin-top:3px; line-height:1.55; }
  .alta .quien small a { color:var(--azul-oscuro,#2F6FA8); text-decoration:none; }
  .alta .precio { font-family:var(--dato); font-weight:700; font-size:18px; color:var(--navy,#26374B); white-space:nowrap; }
  .alta .est { font-size:11px; font-weight:700; text-transform:uppercase; border-radius:7px; padding:4px 9px; }
  .est.pendiente { background:#F4EAD6; color:#8A5307; } .est.aprobada { background:#EAF3E3; color:#4E8A3E; } .est.rechazada { background:#F3E4E4; color:#9A3B3B; }
  .cuota-est { display:inline-block; font-size:11.5px; font-weight:700; border-radius:7px; padding:3px 9px; margin-top:2px; }
  .cuota-est.activa { background:#EAF3E3; color:#3E7A34; } .cuota-est.impago { background:#F7E4DE; color:#9A4A2E; }
  .cuota-est.cancelada { background:#EEE9DF; color:#7A7263; } .cuota-est.sin { background:#F4EAD6; color:#8A5307; }
  .cuota-est.baja { background:#F7E4DE; color:#9A4A2E; }
  .cuota-est.pausa { background:#F4EAD6; color:#8A5307; }
  .cuota-est.espera { background:#EEF3F8; color:#2F6FA8; }
  .b-baja { background:#fff; color:#9A3B3B; border-color:#e0b4b0; } .b-baja:hover{ background:#fbeceb; }
  .b-plaza { background:var(--azul,#2F6FA8); color:#fff; border-color:var(--azul,#2F6FA8); } .b-plaza:hover{ background:var(--azul-hover,#1E4E78); }
  .b-pago { background:#F4F7FA; color:#2F6FA8; border-color:#DCE7F1; } .b-pago:hover{ background:#E7F1F9; }
  .ca-cobro { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:2px 0 18px;
              border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; padding:14px 16px; background:#fff; }
  .ca-cobro.abierto { border-color:#BFD9BB; background:#F2F8F1; }
  .ca-cobro .tx { flex:1 1 240px; min-width:0; }
  .ca-cobro .tx b { display:block; font-size:15px; color:var(--navy,#26374B); }
  .ca-cobro .tx small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }
  .ca-cobro .b { flex:0 0 auto; min-height:42px; padding:0 18px; border-radius:999px; font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .ca-cobro .b.abrir { background:var(--azul,#2F6FA8); color:#fff; }
  .ca-cobro .b.cerrar { background:#fff; color:var(--navy,#26374B); border-color:var(--linea-borde,#C9C0AE); }
  .ca-cobro .b[disabled]{ opacity:.5; cursor:progress; }
  .ca-aforo { flex-basis:100%; margin-top:8px; padding-top:10px; border-top:1px solid var(--linea,#EDE6D7); font-size:13.5px; color:var(--texto-suave,#6E6656); }
  .ca-aforo b { color:var(--navy,#26374B); }
  .ca-aforo small { display:block; margin-top:2px; font-size:12.5px; }
  .aforo-link { background:none; border:0; padding:0; font:inherit; color:var(--azul,#2F6FA8); text-decoration:underline; cursor:pointer; }
  .ca-rot { font-family:var(--fuente-titulo,inherit); font-weight:700; text-transform:uppercase; font-size:13px; letter-spacing:.03em; color:var(--texto-suave,#6E6656); margin:24px 0 10px; }
  .cg-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .cg-card { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; padding:14px 16px; }
  .cg-card h3 { font-family:var(--fuente-titulo,inherit); font-weight:700; font-size:16px; color:var(--navy,#26374B); margin:0 0 3px; }
  .cg-card .cg-hor { font-size:12.5px; line-height:1.4; color:var(--texto-suave,#6E6656); margin:0 0 10px; }
  .cg-ocup { display:flex; align-items:baseline; gap:8px; }
  .cg-ocup b { font-family:var(--fuente-dato,monospace); font-size:22px; color:var(--navy,#26374B); }
  .cg-ocup span { font-size:12.5px; color:var(--texto-suave,#6E6656); }
  .cg-bar { height:8px; border-radius:999px; background:var(--crema-media,#EFE9DC); overflow:hidden; margin-top:8px; }
  .cg-bar i { display:block; height:100%; background:var(--azul,#2F6FA8); border-radius:999px; }
  .cg-bar.lleno i { background:#C99A5B; }
  .cg-espera { font-size:12px; color:#8A5307; margin:6px 0 0; }
  .alta-acc { display:flex; gap:9px; flex-wrap:wrap; margin-top:13px; padding-top:12px; border-top:1px solid var(--linea,#EDE6D7); }
  .b { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 16px; border-radius:999px; font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .b-si { background:var(--azul,#2F6FA8); color:#fff; border-color:var(--azul,#2F6FA8); } .b-si:hover{ background:var(--azul-hover,#1E4E78); }
  .b-no { background:transparent; color:#b3261e; border-color:#e0b4b0; } .b-no:hover{ background:#fbeceb; }
  .b-volver { background:#fff; color:var(--navy,#26374B); border-color:var(--linea-borde,#C9C0AE); margin-left:auto; }
  .b[disabled]{ opacity:.5; cursor:not-allowed; }
  .ca-vacio, .ca-cargando { text-align:center; color:var(--texto-suave,#6E6656); font-size:15px; padding:34px 12px; }
  .ca-vacio h2 { font-family:var(--ap-titulo); color:var(--navy,#26374B); font-size:20px; margin:0 0 6px; text-transform:uppercase; }
  .ca-toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy,#26374B); color:#fff; padding:11px 18px; border-radius:999px; font-size:14.5px; box-shadow:0 10px 26px -8px rgba(30,45,65,.5); z-index:9000; opacity:0; transition:opacity .2s; }
  .ca-toast.ver { opacity:1; } .ca-toast.err { background:#9A3B3B; }
</style>
</head>
<body>

<div id="admin-contenido">
  <div class="ca-wrap">
    <a class="volver" href="../">← Volver al panel</a>
    <h1 class="saludo">El Cubo · socios y cuotas</h1>
    <p class="sub">Los grupos y su ocupación, el cobro, y quién se ha apuntado.</p>
    <div id="ca-cobro"></div>
    <div id="ca-grupos"></div>
    <p class="ca-rot">Quién se ha apuntado</p>
    <div class="chips" id="ca-chips" hidden></div>
    <div id="ca-lista" class="ca-cargando">Cargando…</div>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var ALTAS = [], filtro = 'pendiente', fallo = '';

  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fecha(iso){ if(!iso) return ''; var d=new Date(iso); return d.getDate()+' '+MESES[d.getMonth()]; }
  var NOMBRE_EST={ pendiente:'Pendiente', aprobada:'Aprobada', rechazada:'Rechazada' };
  function vacioHTML(t,d){ return '<div class="ca-vacio"><h2>'+esc(t)+'</h2><p>'+esc(d)+'</p></div>'; }
  function toast(msg,tipo){ var t=document.createElement('div'); t.className='ca-toast'+(tipo==='error'?' err':''); t.textContent=msg; document.body.appendChild(t); requestAnimationFrame(function(){ t.classList.add('ver'); }); setTimeout(function(){ t.classList.remove('ver'); setTimeout(function(){ t.remove(); },260); },2200); }

  async function cargar(){
    fallo='';
    var r = await sb.from('cubo_altas').select('*').order('created_at',{ascending:false});
    if(r.error){ fallo=r.error.message; ALTAS=[]; return; }
    ALTAS = r.data||[];
  }

  function visibles(){ return filtro==='todas' ? ALTAS : ALTAS.filter(function(a){ return (a.estado||'pendiente')===filtro; }); }

  function pintarChips(){
    var n=function(e){ return ALTAS.filter(function(a){ return (a.estado||'pendiente')===e; }).length; };
    var chips=[
      {v:'pendiente',t:'Pendientes',c:n('pendiente')},
      {v:'aprobada',t:'Aprobadas',c:n('aprobada')},
      {v:'rechazada',t:'Rechazadas',c:n('rechazada')},
      {v:'todas',t:'Todas',c:ALTAS.length}
    ];
    $('ca-chips').hidden=false;
    $('ca-chips').innerHTML=chips.map(function(c){ return '<button type="button" class="chip'+(filtro===c.v?' on':'')+'" data-f="'+c.v+'">'+esc(c.t)+' <span class="c">'+c.c+'</span></button>'; }).join('');
  }

  function pagoHTML(a){
    var e=a.suscripcion_estado, baja='';
    if(a.baja_solicitada) baja=' <span class="cuota-est baja">Baja solicitada</span>';
    var esp = a.lista_espera ? ' <span class="cuota-est espera">Lista de espera</span>' : '';
    if(e==='activa'){ var px=a.proximo_cobro?(' · próx. cobro '+fecha(a.proximo_cobro)):''; return '<span class="cuota-est activa">Cuota activa'+esc(px)+'</span>'+baja; }
    if(e==='impago') return '<span class="cuota-est impago">Cuota impagada</span>'+baja;
    if(e==='pausada') return '<span class="cuota-est pausa">Pagos en pausa</span>'+baja;
    if(e==='cancelada') return '<span class="cuota-est cancelada">Cuota dada de baja</span>';
    if(a.lista_espera) return '<span class="cuota-est espera">Lista de espera</span>';
    return '<span class="cuota-est sin">Sin pagar la cuota</span>'+esp;
  }

  function tarjeta(a){
    var est=a.estado||'pendiente';
    var cont=[];
    if(a.telefono) cont.push('<a href="tel:'+esc(a.telefono)+'">'+esc(a.telefono)+'</a>');
    if(a.dni) cont.push('DNI '+esc(a.dni));
    if(a.direccion) cont.push(esc(a.direccion));
    var linea2=[esc(a.horario), (a.dias===1?'1 día/sem':'2 días/sem')];
    if(a.es_escuela && a.hijo) linea2.push('hijo/a: '+esc(a.hijo));
    var acc='';
    if(est!=='aprobada') acc+='<button type="button" class="b b-si" data-id="'+esc(a.id)+'" data-e="aprobada">Aprobar</button>';
    if(est!=='rechazada') acc+='<button type="button" class="b b-no" data-id="'+esc(a.id)+'" data-e="rechazada">Rechazar</button>';
    if(est!=='pendiente') acc+='<button type="button" class="b b-volver" data-id="'+esc(a.id)+'" data-e="pendiente">Volver a pendiente</button>';
    // Abrir/cerrar el cobro POR PERSONA (solo aprobadas que aún no pagan).
    // Mientras esté cerrado, a esa persona NO le sale «Pagar la cuota» (prueba).
    if(est==='aprobada' && a.suscripcion_estado!=='activa'){
      acc+='<button type="button" class="b '+(a.cobro_abierto?'b-cerrar-cobro':'b-abrir-cobro')+'" data-cobro="'+esc(a.id)+'" data-abierto="'+(a.cobro_abierto?'1':'0')+'">'+(a.cobro_abierto?'Cerrar cobro':'Abrir cobro')+'</button>';
    }
    if(a.suscripcion_estado==='activa' || a.suscripcion_estado==='pausada'){
      if(a.suscripcion_estado==='pausada')
        acc+='<button type="button" class="b b-si" data-pago-reanudar="'+esc(a.id)+'">Reanudar pagos</button>';
      else
        acc+='<button type="button" class="b b-pago" data-pago-pausar="'+esc(a.id)+'">Pausar pagos</button>';
      acc+='<button type="button" class="b b-pago" data-pago-saltar="'+esc(a.id)+'">Saltar/aplazar mes</button>';
      acc+='<button type="button" class="b b-pago" data-pago-cargo="'+esc(a.id)+'">Cargo / descuento</button>';
      acc+='<button type="button" class="b b-pago" data-pago-cuota="'+esc(a.id)+'">Cambiar cuota</button>';
      acc+='<button type="button" class="b b-baja" data-baja="'+esc(a.id)+'">Dar de baja'+(a.baja_solicitada?' (pedida)':'')+'</button>';
    }
    if(a.lista_espera) acc+='<button type="button" class="b b-plaza" data-plaza="'+esc(a.id)+'">Dar plaza</button>';
    if(a.horario) acc+='<button type="button" class="b b-grupo" data-grupo="'+esc(a.id)+'">Cambiar de grupo</button>';
    // Eliminar la solicitud (rechazadas / de prueba). La RPC no deja si tiene
    // suscripción activa (primero «Dar de baja»).
    if(a.suscripcion_estado!=='activa' && a.suscripcion_estado!=='pausada')
      acc+='<button type="button" class="b b-no" data-eliminar="'+esc(a.id)+'">Eliminar</button>';
    return '<article class="alta">'+
      '<div class="alta-top">'+
        '<span class="quien"><b>'+esc((a.nombre||'')+' '+(a.apellidos||''))+'</b>'+
          '<span class="tag '+(a.es_escuela?'esc':(a.es_socio?'socio':'fuera'))+'">'+(a.es_escuela?'Escuela':(a.es_socio?'Socio':'De fuera'))+'</span>'+
          '<small>'+cont.join(' · ')+'</small>'+
          '<small>'+linea2.join(' · ')+'</small>'+
          (a.nota?'<small>«'+esc(a.nota)+'»</small>':'')+
          '<small>Apuntado el '+esc(fecha(a.created_at))+'</small>'+
          pagoHTML(a)+
        '</span>'+
        '<span class="precio">'+esc(a.precio_mes||'')+' €/mes</span>'+
        '<span class="est '+esc(est)+'">'+esc(NOMBRE_EST[est]||est)+'</span>'+
        (est==='aprobada' && a.suscripcion_estado!=='activa'
          ? '<span class="est '+(a.cobro_abierto?'aprobada':'pendiente')+'">'+(a.cobro_abierto?'Cobro abierto':'En prueba (no cobra)')+'</span>'
          : '')+
      '</div>'+
      '<div class="alta-acc">'+acc+'</div>'+
    '</article>';
  }

  function pintar(){
    pintarChips();
    pintarCobro();
    pintarGrupos();
    var caja=$('ca-lista'); caja.className='';
    if(fallo){ caja.innerHTML=vacioHTML('No hemos podido traer las altas','Puede ser la conexión. Recarga la página.'); return; }
    if(!ALTAS.length){ caja.innerHTML=vacioHTML('Todavía no hay altas','Cuando alguien se apunte en la web de El Cubo, aparecerá aquí.'); return; }
    var lista=visibles();
    if(!lista.length){ caja.innerHTML=vacioHTML('Nada con este filtro','Prueba con otro estado.'); return; }
    caja.innerHTML=lista.map(tarjeta).join('');
  }

  async function refrescar(){ $('ca-lista').className='ca-cargando'; $('ca-lista').textContent='Cargando…'; await cargar(); pintar(); }

  async function marcar(id, estado, btn){
    btn.disabled=true;
    var r=await sb.rpc('cubo_alta_marcar',{ p_id:id, p_estado:estado });
    if(r.error || (r.data && r.data.ok===false)){ toast((r.error&&r.error.message)||'No se ha podido.', 'error'); btn.disabled=false; return; }
    ALTAS.forEach(function(a){ if(a.id===id) a.estado=estado; });
    pintar();
    toast(estado==='aprobada'?'Alta aprobada':estado==='rechazada'?'Alta rechazada':'Vuelta a pendiente');
  }

  // ---- Abrir/cerrar el cobro POR PERSONA ----
  // No cobra nada: solo hace que a esa persona le aparezca (o no) «Pagar la
  // cuota» en su portal. Los que quedan cerrados están «de prueba».
  async function abrirCobro(id, estabaAbierto, btn){
    btn.disabled=true;
    var nuevo=!estabaAbierto;
    var r=await sb.rpc('cubo_cobro_abrir',{ p_id:id, p_abierto:nuevo });
    if(r.error){ toast(r.error.message||'No se ha podido.', 'error'); btn.disabled=false; return; }
    ALTAS.forEach(function(a){ if(a.id===id) a.cobro_abierto=nuevo; });
    pintar();
    toast(nuevo?'Cobro abierto a esta persona':'Cobro cerrado (queda de prueba)');
  }
  async function eliminarCubo(id, btn){
    var a=null; ALTAS.forEach(function(x){ if(x.id===id) a=x; });
    var quien=a?((a.nombre||'')+' '+(a.apellidos||'')).trim():'esta solicitud';
    if(!confirm('¿Eliminar la solicitud de '+quien+'? Se borra del todo y NO se puede deshacer.')) return;
    btn.disabled=true;
    var r=await sb.rpc('cubo_alta_eliminar',{ p_id:id });
    if(r.error){ toast(r.error.message||'No se ha podido.', 'error'); btn.disabled=false; return; }
    if(r.data && r.data.ok===false){ toast(r.data.mensaje||'No se puede eliminar.', 'error'); btn.disabled=false; return; }
    ALTAS=ALTAS.filter(function(x){ return x.id!==id; });
    pintar();
    toast('Solicitud eliminada');
  }
  async function abrirCobroTodos(btn){
    var pend=ALTAS.filter(function(a){ return (a.estado==='aprobada') && a.suscripcion_estado!=='activa' && !a.cobro_abierto; }).length;
    if(!confirm('Abrir el cobro a los '+pend+' aprobados que aún están de prueba. Les aparecerá «Pagar la cuota». ¿Seguir?')) return;
    if(btn) btn.disabled=true;
    var r=await sb.rpc('cubo_cobro_abrir',{ p_todos_aprobados:true, p_abierto:true });
    if(r.error){ toast(r.error.message||'No se ha podido.', 'error'); if(btn) btn.disabled=false; return; }
    ALTAS.forEach(function(a){ if(a.estado==='aprobada') a.cobro_abierto=true; });
    pintar();
    toast('Cobro abierto a '+(r.data||0)+' personas');
  }

  // ---- Interruptor: abrir/cerrar el cobro de la cuota (tabla cubo_config) ----
  var COBRO = null, LIMITE = null;
  async function cargarCobro(){
    var r = await sb.from('cubo_config').select('cobro_abierto,limite_grupo').eq('id',1).maybeSingle();
    COBRO = r.error ? null : !!(r.data && r.data.cobro_abierto);
    LIMITE = (r.data && r.data.limite_grupo!=null) ? r.data.limite_grupo : 20;
    pintarCobro();
    pintarGrupos();
  }

  // ---- Grupos del Cubo con su ocupación (X/aforo + lista de espera) ----
  var GRUPOS_CUBO = null;
  async function cargarGrupos(){
    var r = await sb.from('grupos').select('id,nombre,horario').eq('seccion','cubo').eq('activo',true).order('nombre');
    GRUPOS_CUBO = r.error ? [] : (r.data||[]);
    pintarGrupos();
  }
  function pintarGrupos(){
    var caja=$('ca-grupos'); if(!caja || !GRUPOS_CUBO) return;
    if(!GRUPOS_CUBO.length){ caja.innerHTML=''; return; }
    var lim = LIMITE!=null ? LIMITE : 20;
    caja.innerHTML = '<p class="ca-rot">Grupos del Cubo</p><div class="cg-grid">' + GRUPOS_CUBO.map(function(g){
      var ocup = ALTAS.filter(function(a){ return a.horario===g.nombre && !a.lista_espera && (a.estado||'pendiente')!=='rechazada'; }).length;
      var espera = ALTAS.filter(function(a){ return a.horario===g.nombre && a.lista_espera; }).length;
      var pct = Math.min(100, Math.round(ocup/lim*100));
      var lleno = ocup>=lim;
      var nombre = String(g.nombre||'').replace(/^El Cubo\s*·\s*/i,'');
      return '<div class="cg-card"><h3>'+esc(nombre)+'</h3>'+
        (g.horario?'<p class="cg-hor">'+esc(g.horario)+'</p>':'')+
        '<div class="cg-ocup"><b>'+ocup+'/'+lim+'</b><span>plazas'+(lleno?' · completo':'')+'</span></div>'+
        '<div class="cg-bar'+(lleno?' lleno':'')+'"><i style="width:'+pct+'%"></i></div>'+
        (espera?'<p class="cg-espera">'+espera+' en lista de espera</p>':'')+
      '</div>';
    }).join('') + '</div>';
  }
  function aforoHTML(){
    return '<div class="ca-aforo">Aforo por grupo: <b>'+esc(LIMITE)+' plazas</b> · '+
      '<button type="button" class="aforo-link" id="ca-limite">Cambiar</button>'+
      '<small>Cuando un grupo se llena, las altas nuevas entran en lista de espera.</small></div>';
  }
  function pintarCobro(){
    var caja=$('ca-cobro'); if(!caja) return;
    if(!ALTAS){ caja.innerHTML=''; caja.className=''; return; }
    // El cobro es POR PERSONA (cada tarjeta tiene su «Abrir/Cerrar cobro»).
    // Aquí solo el resumen y el atajo para abrirlo a todos los de prueba.
    var aprob=ALTAS.filter(function(a){ return (a.estado==='aprobada') && a.suscripcion_estado!=='activa'; });
    var abiertos=aprob.filter(function(a){ return a.cobro_abierto; }).length;
    var prueba=aprob.length-abiertos;
    caja.className='ca-cobro'+(abiertos>0?' abierto':'');
    caja.innerHTML='<div class="tx"><b>Cobro por persona</b>'+
      '<small><b>'+abiertos+'</b> con cobro abierto · <b>'+prueba+'</b> de prueba (no les sale pagar). '+
      'Abre el cobro a cada uno en su tarjeta, o a todos los de prueba de golpe.</small></div>'+
      (prueba>0?'<button type="button" class="b abrir" id="ca-abrir-todos">Abrir cobro a los '+prueba+' de prueba</button>':'')+
      aforoHTML();
  }
  async function toggleCobro(btn){
    var abrir = btn.getAttribute('data-abrir')==='1';
    var ok = abrir
      ? confirm('¿Abrir el cobro? Los padres verán el botón de pagar.\n\nIMPORTANTE: hazlo solo cuando Stripe esté en modo REAL (claves live puestas en Supabase).')
      : confirm('¿Cerrar el cobro? Se ocultará el botón de pagar a los padres.');
    if(!ok) return;
    btn.disabled=true;
    var r = await sb.from('cubo_config').update({ cobro_abierto: abrir, actualizado: new Date().toISOString() }).eq('id',1);
    if(r.error){ toast('No se ha podido: '+r.error.message,'error'); btn.disabled=false; return; }
    COBRO = abrir; pintarCobro();
    toast(abrir?'Cobro abierto · los padres ya pueden pagar':'Cobro cerrado');
  }

  async function darBaja(id, btn){
    if(!confirm('¿Dar de baja esta cuota? Se cancelará la suscripción en Stripe y dejará de cobrarse.')) return;
    var txt=btn.textContent; btn.disabled=true; btn.textContent='Dando de baja…';
    var r=await sb.functions.invoke('cubo-baja',{ body:{ alta_id:id } });
    if(r.error || !(r.data && r.data.ok)){
      var m=''; try{ var ctx=r.error&&r.error.context; if(ctx&&ctx.json){ var d=await ctx.json(); m=d&&d.mensaje; } }catch(e){}
      toast(m||'No se ha podido dar de baja.','error'); btn.disabled=false; btn.textContent=txt; return;
    }
    ALTAS.forEach(function(a){ if(a.id===id){ a.suscripcion_estado='cancelada'; a.baja_solicitada=null; } });
    pintar(); toast('Cuota dada de baja');
  }

  // ---- Ajustes de cobro (Stripe) · solo con la cuota activa ----
  async function invocarPago(id, extra, btn, okMsg){
    var txt=btn.textContent; btn.disabled=true; btn.textContent='…';
    var r=await sb.functions.invoke('cubo-pago',{ body: Object.assign({ alta_id:id }, extra) });
    btn.disabled=false; btn.textContent=txt;
    if(r.error || !(r.data && r.data.ok)){
      var m=''; try{ var ctx=r.error&&r.error.context; if(ctx&&ctx.json){ var d=await ctx.json(); m=d&&d.mensaje; } }catch(e){}
      toast(m||'No se ha podido.','error'); return;
    }
    if(extra.accion==='cuota' && r.data.precio_mes){ ALTAS.forEach(function(a){ if(a.id===id) a.precio_mes=r.data.precio_mes; }); pintar(); }
    if(r.data.estado){ ALTAS.forEach(function(a){ if(a.id===id) a.suscripcion_estado=r.data.estado; }); pintar(); }
    toast(okMsg);
  }
  async function pagoPausar(id, btn){
    if(!confirm('¿Pausar los pagos de esta persona?\n\nNo se le cobrará nada hasta que le des a «Reanudar pagos». No es una baja: sigue en el Cubo.')) return;
    await invocarPago(id, { accion:'pausar' }, btn, 'Pagos en pausa · no se le cobrará hasta reanudar');
  }
  async function pagoReanudar(id, btn){
    if(!confirm('¿Reanudar los pagos de esta persona? Se le volverá a cobrar su cuota cada mes.')) return;
    await invocarPago(id, { accion:'reanudar' }, btn, 'Pagos reanudados');
  }
  async function pagoSaltar(id, btn){
    if(!confirm('¿Saltar el próximo cobro de esta persona?\n\nEste mes no se le pasa el recibo (se le abona su cuota). Para APLAZAR y juntarlo con el mes que viene, dale luego a «Cargo / descuento» con el importe el mes siguiente.')) return;
    await invocarPago(id, { accion:'saltar_mes' }, btn, 'Mes saltado · no se le cobrará el próximo recibo');
  }
  async function pagoCargo(id, btn){
    var v = prompt('Importe en € para el PRÓXIMO recibo.\nPositivo = cobrar de más · negativo = descontar\n(ej.: 30 para un cargo, -10 para un descuento)');
    if(v==null) return;
    var n = Number(String(v).replace(',','.'));
    if(!n){ toast('Pon un número.','error'); return; }
    var concepto = prompt('¿Qué concepto? (se ve en el recibo)', n<0?'Descuento':'Cargo') || '';
    await invocarPago(id, { accion:(n<0?'descuento':'cargo'), importe:Math.abs(n), concepto:concepto }, btn,
      (n<0?'Descuento':'Cargo')+' de '+Math.abs(n)+' € en el próximo recibo');
  }
  async function pagoCuota(id, btn){
    var a = ALTAS.filter(function(x){ return x.id===id; })[0];
    var v = prompt('Nueva cuota mensual en € (a partir del próximo recibo):', a?String(a.precio_mes||''):'');
    if(v==null) return;
    var n = Number(String(v).replace(',','.'));
    if(!n || n<=0){ toast('Pon una cuota válida.','error'); return; }
    await invocarPago(id, { accion:'cuota', importe:n }, btn, 'Cuota cambiada a '+n+' €/mes');
  }

  async function darPlaza(id, btn){
    btn.disabled=true;
    var r=await sb.from('cubo_altas').update({ lista_espera:false }).eq('id', id).select('id');
    if(r.error){ toast('No se ha podido: '+r.error.message,'error'); btn.disabled=false; return; }
    ALTAS.forEach(function(a){ if(a.id===id) a.lista_espera=false; });
    pintar(); toast('Plaza dada · ya puede pagar la cuota');
  }
  async function cambiarGrupo(id){
    var a = ALTAS.filter(function(x){ return x.id===id; })[0]; if(!a) return;
    if(!GRUPOS_CUBO || !GRUPOS_CUBO.length){ toast('Aún no tengo los grupos, recarga.','error'); return; }
    var lista = GRUPOS_CUBO.map(function(g,i){ return (i+1)+') '+String(g.nombre||'').replace(/^El Cubo\s*·\s*/i,''); }).join('\n');
    var actual = GRUPOS_CUBO.map(function(g){ return g.nombre; }).indexOf(a.horario);
    var v = prompt('Mover a '+((a.nombre||'')+' '+(a.apellidos||'')).trim()+' a qué grupo del Cubo:\n\n'+lista, actual>=0?String(actual+1):'');
    if(v==null) return;
    var n = parseInt(String(v).replace(/[^0-9]/g,''),10);
    if(!n || n<1 || n>GRUPOS_CUBO.length){ toast('Elige un número de la lista.','error'); return; }
    var g = GRUPOS_CUBO[n-1];
    if(g.nombre===a.horario){ toast('Ya está en ese grupo.'); return; }
    var r = await sb.from('cubo_altas').update({ horario:g.nombre }).eq('id', id).select('id');
    if(r.error){ toast('No se ha podido: '+r.error.message,'error'); return; }
    if(a.atleta_id){
      var r2 = await sb.from('atletas').update({ grupo_id:g.id }).eq('id', a.atleta_id);
      if(r2.error){ toast('Movido en la lista, pero su ficha no: '+r2.error.message,'error'); }
    }
    a.horario = g.nombre;
    pintar();
    toast('Movido a '+String(g.nombre||'').replace(/^El Cubo\s*·\s*/i,''));
  }
  async function cambiarLimite(){
    var actual = LIMITE!=null ? LIMITE : 20;
    var v = prompt('Aforo por grupo del Cubo (plazas antes de lista de espera):', String(actual));
    if(v==null) return;
    var n = parseInt(String(v).replace(/[^0-9]/g,''),10);
    if(!n || n<1){ toast('Pon un número válido.','error'); return; }
    var r=await sb.from('cubo_config').update({ limite_grupo:n }).eq('id',1);
    if(r.error){ toast('No se ha podido: '+r.error.message,'error'); return; }
    LIMITE=n; pintarCobro(); pintarGrupos(); toast('Aforo: '+n+' por grupo');
  }

  $('admin-contenido').addEventListener('click', function(ev){
    var t=ev.target.closest?ev.target.closest('#ca-cobro-btn'):null;
    if(t){ toggleCobro(t); return; }
    var pl=ev.target.closest?ev.target.closest('.b-plaza[data-plaza]'):null;
    if(pl){ darPlaza(pl.getAttribute('data-plaza'), pl); return; }
    var gr=ev.target.closest?ev.target.closest('.b-grupo[data-grupo]'):null;
    if(gr){ cambiarGrupo(gr.getAttribute('data-grupo')); return; }
    var lim=ev.target.closest?ev.target.closest('#ca-limite'):null;
    if(lim){ cambiarLimite(); return; }
    var bb=ev.target.closest?ev.target.closest('.b-baja[data-baja]'):null;
    if(bb){ darBaja(bb.getAttribute('data-baja'), bb); return; }
    var pp=ev.target.closest?ev.target.closest('[data-pago-pausar]'):null;
    if(pp){ pagoPausar(pp.getAttribute('data-pago-pausar'), pp); return; }
    var pr=ev.target.closest?ev.target.closest('[data-pago-reanudar]'):null;
    if(pr){ pagoReanudar(pr.getAttribute('data-pago-reanudar'), pr); return; }
    var ps=ev.target.closest?ev.target.closest('[data-pago-saltar]'):null;
    if(ps){ pagoSaltar(ps.getAttribute('data-pago-saltar'), ps); return; }
    var pc=ev.target.closest?ev.target.closest('[data-pago-cargo]'):null;
    if(pc){ pagoCargo(pc.getAttribute('data-pago-cargo'), pc); return; }
    var pq=ev.target.closest?ev.target.closest('[data-pago-cuota]'):null;
    if(pq){ pagoCuota(pq.getAttribute('data-pago-cuota'), pq); return; }
    var cb=ev.target.closest?ev.target.closest('[data-cobro]'):null;
    if(cb){ abrirCobro(cb.getAttribute('data-cobro'), cb.getAttribute('data-abierto')==='1', cb); return; }
    var elim=ev.target.closest?ev.target.closest('[data-eliminar]'):null;
    if(elim){ eliminarCubo(elim.getAttribute('data-eliminar'), elim); return; }
    var at=ev.target.closest?ev.target.closest('#ca-abrir-todos'):null;
    if(at){ abrirCobroTodos(at); return; }
    var f=ev.target.closest?ev.target.closest('.chip[data-f]'):null;
    if(f){ filtro=f.getAttribute('data-f'); pintar(); return; }
    var b=ev.target.closest?ev.target.closest('.b[data-id]'):null;
    if(b) marcar(b.getAttribute('data-id'), b.getAttribute('data-e'), b);
  });

  refrescar();
  cargarCobro();
  cargarGrupos();
});
</script>

</body>
</html>
