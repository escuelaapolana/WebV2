<!DOCTYPE html>
<html lang="es">
<head>

<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); }
  /* Para que admin-tabbar.js monte la barra lateral de escritorio. */
  .admin-wrap { width:100%; max-width:none; margin:0; padding:0; }
  .ca-wrap { max-width:820px; margin:0 auto; padding:clamp(18px,4vw,30px) clamp(14px,4vw,28px) 60px; }
  .volver { display:inline-flex; align-items:center; min-height:44px; color:var(--azul-oscuro,#2F6FA8); font-weight:600; text-decoration:none; font-size:14px; }
  h1.saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-.01em; font-size:clamp(26px,5.5vw,36px); color:var(--navy,#26374B); margin:6px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 12px; }
  .chip { font:inherit; font-size:13.5px; cursor:pointer; background:#fff; color:var(--texto-suave,#6E6656); border:1px solid var(--linea-marcada,#E4DCCB); border-radius:999px; padding:7px 13px; }
  .chip.on { background:var(--navy,#26374B); color:#fff; border-color:var(--navy,#26374B); }
  .chip .c { opacity:.7; font-variant-numeric:tabular-nums; }

  .alta { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); padding:15px 17px; margin-top:12px; }
  .alta-top { display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .alta .quien { flex:1; min-width:0; }
  .alta .quien b { font-size:16px; color:var(--navy,#26374B); }
  .alta .quien .tag { font-size:10.5px; font-weight:700; text-transform:uppercase; border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:2px; }
  .alta .quien .tag.esc { background:#EAF3E3; color:#4E8A3E; } .alta .quien .tag.fuera { background:#EDE6F5; color:#5B4B8A; }
  .alta .quien .tag.socio { background:#E7F1F9; color:#2F6FA8; }
  .alta .quien small { display:block; font-size:12.5px; color:var(--texto-suave,#6E6656); margin-top:3px; line-height:1.55; }
  .alta .quien small a { color:var(--azul-oscuro,#2F6FA8); text-decoration:none; }
  .alta .precio { font-family:var(--dato); font-weight:700; font-size:18px; color:var(--navy,#26374B); white-space:nowrap; }
  .alta .est { font-size:11px; font-weight:700; text-transform:uppercase; border-radius:7px; padding:4px 9px; }
  .est.pendiente { background:#F4EAD6; color:#8A5307; } .est.aprobada { background:#EAF3E3; color:#4E8A3E; } .est.rechazada { background:#F3E4E4; color:#9A3B3B; }
  .cuota-est { display:inline-block; font-size:11.5px; font-weight:700; border-radius:7px; padding:3px 9px; margin-top:2px; }
  .cuota-est.activa { background:#EAF3E3; color:#3E7A34; } .cuota-est.impago { background:#F7E4DE; color:#9A4A2E; }
  .cuota-est.cancelada { background:#EEE9DF; color:#7A7263; } .cuota-est.sin { background:#F4EAD6; color:#8A5307; }
  .cuota-est.baja { background:#F7E4DE; color:#9A4A2E; }
  .cuota-est.pausa { background:#F4EAD6; color:#8A5307; }
  .cuota-est.espera { background:#EEF3F8; color:#2F6FA8; }
  .b-baja { background:#fff; color:#9A3B3B; border-color:#e0b4b0; } .b-baja:hover{ background:#fbeceb; }
  .b-plaza { background:var(--azul,#2F6FA8); color:#fff; border-color:var(--azul,#2F6FA8); } .b-plaza:hover{ background:var(--azul-hover,#1E4E78); }
  .b-pago { background:#F4F7FA; color:#2F6FA8; border-color:#DCE7F1; } .b-pago:hover{ background:#E7F1F9; }
  .ca-cobro { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:2px 0 18px;
              border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; padding:14px 16px; background:#fff; }
  .ca-cobro.abierto { border-color:#BFD9BB; background:#F2F8F1; }
  .ca-cobro .tx { flex:1 1 240px; min-width:0; }
  .ca-cobro .tx b { display:block; font-size:15px; color:var(--navy,#26374B); }
  .ca-cobro .tx small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }
  .ca-cobro .b { flex:0 0 auto; min-height:42px; padding:0 18px; border-radius:999px; font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .ca-cobro .b.abrir { background:var(--azul,#2F6FA8); color:#fff; }
  .ca-cobro .b.cerrar { background:#fff; color:var(--navy,#26374B); border-color:var(--linea-borde,#C9C0AE); }
  .ca-cobro .b[disabled]{ opacity:.5; cursor:progress; }
  .ca-aforo { flex-basis:100%; margin-top:8px; padding-top:10px; border-top:1px solid var(--linea,#EDE6D7); font-size:13.5px; color:var(--texto-suave,#6E6656); }
  .ca-aforo b { color:var(--navy,#26374B); }
  .ca-aforo small { display:block; margin-top:2px; font-size:12.5px; }
  .aforo-link { background:none; border:0; padding:0; font:inherit; color:var(--azul,#2F6FA8); text-decoration:underline; cursor:pointer; }
  .ca-rot { font-family:var(--fuente-titulo,inherit); font-weight:700; text-transform:uppercase; font-size:13px; letter-spacing:.03em; color:var(--texto-suave,#6E6656); margin:24px 0 10px; }
  .cg-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .cg-card { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; padding:14px 16px; }
  .cg-card h3 { font-family:var(--fuente-titulo,inherit); font-weight:700; font-size:16px; color:var(--navy,#26374B); margin:0 0 3px; }
  .cg-card .cg-hor { font-size:12.5px; line-height:1.4; color:var(--texto-suave,#6E6656); margin:0 0 10px; }
  .cg-ocup { display:flex; align-items:baseline; gap:8px; }
  .cg-ocup b { font-family:var(--fuente-dato,monospace); font-size:22px; color:var(--navy,#26374B); }
  .cg-ocup span { font-size:12.5px; color:var(--texto-suave,#6E6656); }
  .cg-bar { height:8px; border-radius:999px; background:var(--crema-media,#EFE9DC); overflow:hidden; margin-top:8px; }
  .cg-bar i { display:block; height:100%; background:var(--azul,#2F6FA8); border-radius:999px; }
  .cg-bar.lleno i { background:#C99A5B; }
  .cg-espera { font-size:12px; color:#8A5307; margin:6px 0 0; }
  .cg-dia { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-top:12px; }
  .cg-dia:first-of-type { margin-top:2px; }
  .cg-dia-n { font-size:13px; font-weight:600; color:var(--navy,#26374B); }
  .cg-dia-c b { font-family:var(--fuente-dato,monospace); font-size:17px; color:var(--navy,#26374B); }
  .cg-dia-c span { font-size:12px; color:var(--texto-suave,#6E6656); }
  .cg-dia-c.lleno b { color:#B0563A; }
  .alta-acc { display:flex; gap:9px; flex-wrap:wrap; margin-top:13px; padding-top:12px; border-top:1px solid var(--linea,#EDE6D7); }
  .b { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 16px; border-radius:999px; font:inherit; font-size:14.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .b-si { background:var(--azul,#2F6FA8); color:#fff; border-color:var(--azul,#2F6FA8); } .b-si:hover{ background:var(--azul-hover,#1E4E78); }
  .b-no { background:transparent; color:#b3261e; border-color:#e0b4b0; } .b-no:hover{ background:#fbeceb; }
  .b-volver { background:#fff; color:var(--navy,#26374B); border-color:var(--linea-borde,#C9C0AE); margin-left:auto; }
  .b[disabled]{ opacity:.5; cursor:not-allowed; }
  .ca-vacio, .ca-cargando { text-align:center; color:var(--texto-suave,#6E6656); font-size:15px; padding:34px 12px; }
  .ca-vacio h2 { font-family:var(--ap-titulo); color:var(--navy,#26374B); font-size:20px; margin:0 0 6px; text-transform:uppercase; }
  .ca-toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy,#26374B); color:#fff; padding:11px 18px; border-radius:999px; font-size:14.5px; box-shadow:0 10px 26px -8px rgba(30,45,65,.5); z-index:9000; opacity:0; transition:opacity .2s; }
  .ca-toast.ver { opacity:1; } .ca-toast.err { background:#9A3B3B; }
  /* Lista para la contabilidad (fusionada desde Pagos del Cubo) */
  .cx-chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 10px; }
  .cx-chip { border:1px solid var(--linea-borde,#C9C0AE); background:#fff; color:var(--navy,#26374B); border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; }
  .cx-chip.on { background:var(--navy,#26374B); color:#fff; border-color:var(--navy,#26374B); }
  .cx-chip b { font-family:var(--fuente-dato,monospace); font-weight:600; opacity:.8; margin-left:4px; }
  .cx-barra { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin-bottom:12px; }
  .cx-barra input { flex:1 1 220px; min-width:180px; font:inherit; font-size:14px; border:1px solid var(--linea-borde,#C9C0AE); border-radius:10px; padding:10px 12px; }
  .cx-btn { border:none; color:#fff; border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; font-size:13.5px; cursor:pointer; }
  .cx-btn[disabled]{ opacity:.6; cursor:default; }
  .cx-tabla { overflow-x:auto; border:1px solid var(--linea,#EDE6D7); border-radius:12px; }
  .cx-tabla table { border-collapse:collapse; width:100%; font-size:13px; background:#fff; }
  .cx-tabla th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.02em; color:var(--texto-suave,#8A816E); padding:8px 10px; border-bottom:1px solid var(--linea,#EDE6D7); white-space:nowrap; }
  .cx-tabla td { padding:8px 10px; border-bottom:1px solid var(--linea,#F3EEE2); color:var(--texto,#333); white-space:nowrap; }
  .cx-tabla .cx-num { font-family:var(--fuente-dato,monospace); text-align:right; }
  .cx-tabla .cx-mono { font-family:var(--fuente-dato,monospace); font-size:11.5px; color:var(--texto-suave,#8A816E); }
  .cx-si { color:#1E7A3D; font-weight:700; } .cx-no { color:#B0563A; }
  .cx-chip-prueba.on { background:#9A6B16; border-color:#9A6B16; }
  /* Tracker de prueba */
  .pr-wrap { margin:4px 0 20px; border:1px solid var(--linea,#EDE6D7); border-radius:14px; background:linear-gradient(180deg,#FFFDF8,#FBF7EE); padding:14px 14px 8px; }
  .pr-cab { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
  .pr-cab b { font-size:15.5px; }
  .pr-res { font-size:12.5px; color:var(--texto-suave,#8A816E); font-weight:600; }
  .pr-sub { font-size:12.5px; color:var(--texto-suave,#8A816E); margin:2px 0 10px; }
  .pr-fila { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px; border-top:1px solid var(--linea,#F3EEE2); }
  .pr-fila.pr-ojo { background:#FFF7E6; border-radius:10px; padding-left:8px; padding-right:8px; }
  .pr-quien { display:flex; flex-direction:column; min-width:160px; }
  .pr-quien b { font-size:14.5px; }
  .pr-quien small { font-size:12px; color:var(--texto-suave,#8A816E); }
  .pr-pasos { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .pr-chip { font:inherit; font-size:13px; font-weight:700; border-radius:999px; padding:7px 13px; cursor:pointer; border:1.5px solid; line-height:1; }
  .pr-chip.on { background:#1E7A3D; border-color:#1E7A3D; color:#fff; }
  .pr-chip.off { background:#fff; border-color:#C9C0AE; color:#6B6354; }
  .pr-chip.off:hover { border-color:#9A6B16; color:#9A6B16; }
  .pr-chip[disabled]{ opacity:.55; cursor:default; }
  .pr-fin { font-size:12px; font-weight:700; color:#1E7A3D; align-self:center; margin-left:2px; }
  .cx-wa { font:inherit; font-size:12px; font-weight:700; border-radius:999px; padding:4px 11px; cursor:pointer; border:1.5px solid; white-space:nowrap; }
  .cx-wa.on { background:#E3F2E8; border-color:#1E7A3D; color:#1E7A3D; }
  .cx-wa.off { background:#fff; border-color:#C9C0AE; color:#8A816E; }
  .cx-wa.off:hover { border-color:#1E7A3D; color:#1E7A3D; }
  .cx-wa[disabled] { opacity:.55; cursor:default; }
  .cx-chips2 { margin-top:-4px; align-items:center; }
  .cx-chip-falta.on { background:#B0563A; border-color:#B0563A; }
  .cx-sel { font-size:13px; color:var(--texto-suave,#8A816E); font-weight:600; display:inline-flex; align-items:center; gap:6px; margin-left:4px; }
  .cx-sel select { font:inherit; font-size:13px; border:1px solid var(--linea-borde,#C9C0AE); border-radius:9px; padding:7px 9px; background:#fff; cursor:pointer; }
</style>
</head>
<body>

<div id="admin-contenido" class="admin-wrap">
  <div class="ca-wrap">
    <a class="volver" href="../">← Volver al panel</a>
    <h1 class="saludo">El Cubo · socios y cuotas</h1>
    <p class="sub">Todo el dinero del Cubo en un sitio: grupos y ocupación, cobros, altas y la lista para la contabilidad.</p>
    <div id="ca-cobro"></div>
    <div id="ca-grupos"></div>
    <p class="ca-rot">Quién se ha apuntado</p>
    <div class="chips" id="ca-chips" hidden></div>
    <div id="ca-pruebas"></div>
    <div id="ca-lista" class="ca-cargando">Cargando…</div>
    <div id="ca-contab"></div>
  </div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var ALTAS = [], filtro = 'pendiente', fallo = '';
  var COBROS = {};   // alta_id -> [pagos puntuales pendientes]

  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fecha(iso){ if(!iso) return ''; var d=new Date(iso); return d.getDate()+' '+MESES[d.getMonth()]; }
  var NOMBRE_EST={ pendiente:'Pendiente', aprobada:'Aprobada', rechazada:'Rechazada' };
  function vacioHTML(t,d){ return '<div class="ca-vacio"><h2>'+esc(t)+'</h2><p>'+esc(d)+'</p></div>'; }
  function toast(msg,tipo){ var t=document.createElement('div'); t.className='ca-toast'+(tipo==='error'?' err':''); t.textContent=msg; document.body.appendChild(t); requestAnimationFrame(function(){ t.classList.add('ver'); }); setTimeout(function(){ t.classList.remove('ver'); setTimeout(function(){ t.remove(); },260); },2200); }

  async function cargar(){
    fallo='';
    var r = await sb.from('cubo_altas').select('*').order('created_at',{ascending:false});
    if(r.error){ fallo=r.error.message; ALTAS=[]; return; }
    ALTAS = r.data||[];
    await cargarCobros();
    await cargarEmails();
    await cargarDias();
    indexarDuplicados();
  }
  var DIAS = {};   // alta_id -> nº de días distintos que ha venido (desde su alta)
  async function cargarDias(){
    DIAS = {};
    var conAtleta = ALTAS.filter(function(a){ return a.atleta_id; });
    var ids = conAtleta.map(function(a){ return a.atleta_id; });
    if(!ids.length) return;
    var r = await sb.from('asistencia').select('atleta_id,fecha,presente').in('atleta_id', ids).eq('presente', true);
    if(r.error || !r.data) return;
    var porAtleta = {};
    r.data.forEach(function(x){ (porAtleta[x.atleta_id]=porAtleta[x.atleta_id]||[]).push(String(x.fecha||'')); });
    conAtleta.forEach(function(a){
      var desde = a.created_at ? String(a.created_at).slice(0,10) : '';
      var set={};
      (porAtleta[a.atleta_id]||[]).forEach(function(f){ if(f && (!desde || f>=desde)) set[f]=1; });
      DIAS[a.id] = Object.keys(set).length;
    });
  }
  var EMAIL = {};
  async function cargarEmails(){
    EMAIL = {};
    var ids = ALTAS.map(function(a){ return a.perfil_id; }).filter(Boolean);
    if(!ids.length) return;
    var r = await sb.from('perfiles').select('id,email').in('id', ids);
    if(!r.error && r.data) r.data.forEach(function(p){ EMAIL[p.id]=p.email||''; });
  }
  async function cargarCobros(){
    COBROS = {};
    var r = await sb.from('cubo_cobros').select('id,alta_id,concepto,importe_cent,estado,created_at').eq('estado','pendiente');
    if(!r.error && r.data){ r.data.forEach(function(c){ (COBROS[c.alta_id]=COBROS[c.alta_id]||[]).push(c); }); }
  }

  // --- Aviso de DUPLICADOS: misma persona dada de alta más de una vez ---
  // Salta si otra alta NO rechazada comparte cuenta (perfil_id), ficha (atleta_id)
  // o teléfono+nombre (reenvío del formulario). Teléfono solo no basta: así no
  // marca a dos hermanos que comparten el móvil de un padre.
  var DUP = {};
  function _norm(s){ return String(s==null?'':s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function _claves(a){
    var k=[];
    if(a.perfil_id) k.push('p:'+a.perfil_id);
    if(a.atleta_id) k.push('a:'+a.atleta_id);
    if(a.telefono && (a.nombre||a.apellidos)) k.push('t:'+_norm(a.telefono)+'|'+_norm(a.nombre));
    return k;
  }
  function indexarDuplicados(){
    DUP={}; var mapa={};
    ALTAS.forEach(function(a){ if((a.estado||'')==='rechazada') return; _claves(a).forEach(function(k){ (mapa[k]=mapa[k]||[]).push(a.id); }); });
    ALTAS.forEach(function(a){
      if((a.estado||'')==='rechazada'){ DUP[a.id]=false; return; }
      DUP[a.id]=_claves(a).some(function(k){ return (mapa[k]||[]).some(function(id){ return id!==a.id; }); });
    });
  }

  function visibles(){ return filtro==='todas' ? ALTAS : ALTAS.filter(function(a){ return (a.estado||'pendiente')===filtro; }); }

  function pintarChips(){
    var n=function(e){ return ALTAS.filter(function(a){ return (a.estado||'pendiente')===e; }).length; };
    var chips=[
      {v:'pendiente',t:'Pendientes',c:n('pendiente')},
      {v:'aprobada',t:'Aprobadas',c:n('aprobada')},
      {v:'rechazada',t:'Rechazadas',c:n('rechazada')},
      {v:'todas',t:'Todas',c:ALTAS.length}
    ];
    $('ca-chips').hidden=false;
    $('ca-chips').innerHTML=chips.map(function(c){ return '<button type="button" class="chip'+(filtro===c.v?' on':'')+'" data-f="'+c.v+'">'+esc(c.t)+' <span class="c">'+c.c+'</span></button>'; }).join('');
  }

  function pagoHTML(a){
    var e=a.suscripcion_estado, baja='';
    if(a.baja_solicitada) baja=' <span class="cuota-est baja">Baja solicitada</span>';
    var esp = a.lista_espera ? ' <span class="cuota-est espera">Lista de espera</span>' : '';
    if(e==='activa'){ var px=a.proximo_cobro?(' · próx. cobro '+fecha(a.proximo_cobro)):''; return '<span class="cuota-est activa">Cuota activa'+esc(px)+'</span>'+baja; }
    if(e==='impago') return '<span class="cuota-est impago">Cuota impagada</span>'+baja;
    if(e==='pausada') return '<span class="cuota-est pausa">Pagos en pausa</span>'+baja;
    if(e==='cancelada') return '<span class="cuota-est cancelada">Cuota dada de baja</span>';
    if(a.lista_espera) return '<span class="cuota-est espera">Lista de espera</span>';
    return '<span class="cuota-est sin">Sin pagar la cuota</span>'+esp;
  }
  function eurCent(c){ return (Number(c)/100).toFixed(2).replace('.',',')+' €'; }
  // Pagos puntuales pendientes de esta persona (le aparecen a pagar en su app).
  function pagosPuntualesHTML(a){
    var lista = COBROS[a.id]||[];
    if(!lista.length) return '';

  function tarjeta(a){
    var est=a.estado||'pendiente';
    var cont=[];
    if(a.telefono) cont.push('<a href="tel:'+esc(a.telefono)+'">'+esc(a.telefono)+'</a>');
    if(a.dni) cont.push('DNI '+esc(a.dni));
    if(a.direccion) cont.push(esc(a.direccion));
    var linea2=[esc(a.horario), (a.dias===1?'1 día/sem':'2 días/sem')];
    if(a.es_escuela && a.hijo) linea2.push('hijo/a: '+esc(a.hijo));
    var acc='';
    if(est!=='aprobada') acc+='<button type="button" class="b b-si" data-id="'+esc(a.id)+'" data-e="aprobada">Aprobar</button>';
    if(est!=='rechazada') acc+='<button type="button" class="b b-no" data-id="'+esc(a.id)+'" data-e="rechazada">Rechazar</button>';
    if(est!=='pendiente') acc+='<button type="button" class="b b-volver" data-id="'+esc(a.id)+'" data-e="pendiente">Volver a pendiente</button>';
    // Abrir/cerrar el cobro POR PERSONA (solo aprobadas que aún no pagan).
    // Mientras esté cerrado, a esa persona NO le sale «Pagar la cuota» (prueba).
    if(est==='aprobada' && a.suscripcion_estado!=='activa'){
      // El botón de cobro de la app solo si paga POR la app (no en efectivo/transf.)
      if(!a.pago_externo)
        acc+='<button type="button" class="b '+(a.cobro_abierto?'b-cerrar-cobro':'b-abrir-cobro')+'" data-cobro="'+esc(a.id)+'" data-abierto="'+(a.cobro_abierto?'1':'0')+'">'+(a.cobro_abierto?'Cerrar cobro':'Abrir cobro')+'</button>';
      // Cómo paga: por la app (Stripe) o fuera (efectivo/transferencia). Al elegir
      // un método externo se cierra el cobro de la app y deja de salir «de prueba».
      var ME=a.pago_externo||'';
      acc+='<label class="b b-comopaga" style="display:inline-flex;align-items:center;gap:6px;cursor:default">Paga: '+
        '<select data-pagoext="'+esc(a.id)+'" style="font:inherit;border:0;background:transparent;cursor:pointer;color:inherit">'+
          '<option value=""'+(ME===''?' selected':'')+'>Por la app</option>'+
          '<option value="efectivo"'+(ME==='efectivo'?' selected':'')+'>Efectivo</option>'+
          '<option value="transferencia"'+(ME==='transferencia'?' selected':'')+'>Transferencia</option>'+
          '<option value="otro"'+(ME==='otro'?' selected':'')+'>Otro (manual)</option>'+
        '</select></label>';
    }
    if(a.suscripcion_estado==='activa' || a.suscripcion_estado==='pausada'){
      if(a.suscripcion_estado==='pausada')
        acc+='<button type="button" class="b b-si" data-pago-reanudar="'+esc(a.id)+'">Reanudar pagos</button>';
      else
        acc+='<button type="button" class="b b-pago" data-pago-pausar="'+esc(a.id)+'">Pausar pagos</button>';
      acc+='<button type="button" class="b b-pago" data-pago-saltar="'+esc(a.id)+'">Saltar/aplazar mes</button>';
      acc+='<button type="button" class="b b-pago" data-pago-cargo="'+esc(a.id)+'">Cargo / descuento</button>';
      acc+='<button type="button" class="b b-pago" data-pago-cuota="'+esc(a.id)+'">Cambiar cuota</button>';
      acc+='<button type="button" class="b b-baja" data-baja="'+esc(a.id)+'">Dar de baja'+(a.baja_solicitada?' (pedida)':'')+'</button>';
    }
    if(a.lista_espera) acc+='<button type="button" class="b b-plaza" data-plaza="'+esc(a.id)+'">Dar plaza</button>';
    if(a.horario) acc+='<button type="button" class="b b-grupo" data-grupo="'+esc(a.id)+'">Cambiar de grupo</button>';
    // Poner un pago puntual (concepto + importe) que le aparece en su app.
    if(est==='aprobada') acc+='<button type="button" class="b b-pago" data-poner-pago="'+esc(a.id)+'">Poner un pago</button>';
    // Eliminar la solicitud (rechazadas / de prueba). La RPC no deja si tiene
    // suscripción activa (primero «Dar de baja»).
    if(a.suscripcion_estado!=='activa' && a.suscripcion_estado!=='pausada')
      acc+='<button type="button" class="b b-no" data-eliminar="'+esc(a.id)+'">Eliminar</button>';
    return '<article class="alta">'+
      '<div class="alta-top">'+
        '<span class="quien"><b>'+esc((a.nombre||'')+' '+(a.apellidos||''))+'</b>'+
          '<span class="tag '+(a.es_escuela?'esc':(a.es_socio?'socio':'fuera'))+'">'+(a.es_escuela?'Escuela':(a.es_socio?'Socio':'De fuera'))+'</span>'+
          '<small>'+cont.join(' · ')+'</small>'+
          '<small>'+linea2.join(' · ')+'</small>'+
          (a.nota?'<small>«'+esc(a.nota)+'»</small>':'')+
          '<small>Apuntado el '+esc(fecha(a.created_at))+'</small>'+
          (DUP[a.id] && est!=='rechazada' ? '<small class="dup-aviso" style="color:#9A3B3B;font-weight:700">⚠️ Posible duplicado · ya hay otra alta de esta persona</small>' : '')+
          pagoHTML(a)+
          pagosPuntualesHTML(a)+
          badgesPruebaHTML(a)+
        '</span>'+
        '<span class="precio">'+esc(a.precio_mes||'')+' €/mes</span>'+
        '<span class="est '+esc(est)+'">'+esc(NOMBRE_EST[est]||est)+'</span>'+
        (est==='aprobada' && a.suscripcion_estado!=='activa'
          ? (a.pago_externo
              ? '<span class="est activa">Paga '+(PAGO_EXT[a.pago_externo]||'(manual)')+'</span>'
              : '<span class="est '+(a.cobro_abierto?'aprobada':'pendiente')+'">'+
                  (a.cobro_abierto
                    ? 'Cobro abierto'+(a.primer_pago_cent>0?' · 1er pago '+eurCent(a.primer_pago_cent):'')
                    : 'En prueba (no cobra)')+'</span>')
          : '')+
      '</div>'+
      '<div class="alta-acc">'+acc+'</div>'+
    '</article>';
  }

  function pintar(){
    pintarChips();
    pintarPruebas();
    pintarCobro();
    pintarGrupos();
    pintarContab();
    var caja=$('ca-lista'); caja.className='';
    if(fallo){ caja.innerHTML=vacioHTML('No hemos podido traer las altas','Puede ser la conexión. Recarga la página.'); return; }

  // ====== TRACKER DE PRUEBA: quién está probando y por dónde va cada uno ======
  // Los pasos que Andrés lleva a mano: ¿confirmó que se queda? ¿lo metí al
  // WhatsApp? ¿le abrí el cobro? El que paga desaparece de aquí (ya es socio).
  function pintarPruebas(){
    var caja=$('ca-pruebas'); if(!caja) return;
    var lista=ALTAS.filter(enPruebaJourney).sort(function(a,b){
      var da=DIAS[a.id]||0, db=DIAS[b.id]||0; if(db!==da) return db-da;
      return ((a.nombre||'')+(a.apellidos||'')).localeCompare((b.nombre||'')+(b.apellidos||''));
    });
    if(!lista.length){ caja.innerHTML=''; return; }
    var conf=lista.filter(function(a){ return a.confirmado_sigue; }).length;
    var listos=lista.filter(function(a){ return a.confirmado_sigue && a.en_whatsapp && a.cobro_abierto; }).length;
    function chip(id,paso,on,txtOn,txtOff){
      return '<button type="button" class="pr-chip '+(on?'on':'off')+'" data-paso="'+paso+'" data-id="'+esc(id)+'" data-on="'+(on?'1':'0')+'">'+
        (on?'✓ ':'')+esc(on?txtOn:txtOff)+'</button>';
    }
    var filas=lista.map(function(a){
      var nom=((a.nombre||'')+' '+(a.apellidos||'')).trim();
      var v=DIAS[a.id]; var vino = v!=null ? ('vino '+v+' día'+(v===1?'':'s')) : 'sin lista aún';
      var alerta = (v>=2 && !a.confirmado_sigue) ? ' pr-ojo' : '';
      // Cobro: si está abierto es verde (estado); si no, botón para abrirlo (pregunta importe).
      var cobroChip = a.cobro_abierto
        ? '<span class="pr-chip on">✓ Cobro abierto</span>'
        : '<button type="button" class="pr-chip off" data-cobrochip="'+esc(a.id)+'">Abrir cobro</button>';
      var fin = (a.confirmado_sigue && a.en_whatsapp && a.cobro_abierto)
        ? '<span class="pr-fin">Todo listo · esperando pago</span>' : '';
      return '<div class="pr-fila'+alerta+'">'+
        '<div class="pr-quien"><b>'+esc(nom)+'</b><small>'+esc(a.horario||'')+' · '+esc(vino)+'</small></div>'+
        '<div class="pr-pasos">'+
          chip(a.id,'confirmado',!!a.confirmado_sigue,'Se queda','¿Se queda?')+
          chip(a.id,'whatsapp',!!a.en_whatsapp,'En WhatsApp','Falta WhatsApp')+
          cobroChip+ fin+
        '</div>'+
      '</div>';
    }).join('');
    caja.innerHTML=
      '<div class="pr-wrap">'+
        '<div class="pr-cab"><b>🧪 Pruebas en marcha</b> <span class="pr-res">'+lista.length+' de prueba'+
          (conf?' · '+conf+' confirmados':'')+(listos?' · '+listos+' listos para pagar':'')+'</span></div>'+
        '<div class="pr-sub">Marca según avanzas con cada uno. Pagar es lo que lo convierte en socio del Cubo (desaparece de aquí).</div>'+
        filas+
      '</div>';
  }
  async function marcarPaso(id, paso, on, chip){
    if(chip) chip.disabled=true;
    var r=await sb.rpc('cubo_prueba_paso',{ p_id:id, p_paso:paso, p_on:on });
    if(chip) chip.disabled=false;
    if(r.error || (r.data && r.data.ok===false)){ toast((r.error&&r.error.message)||(r.data&&r.data.error)||'No se ha podido.','error'); return; }
    ALTAS.forEach(function(a){ if(a.id===id){ if(paso==='confirmado') a.confirmado_sigue = on?new Date().toISOString():null; else if(paso==='whatsapp') a.en_whatsapp=on; } });
    pintar();
    toast(paso==='confirmado'?(on?'Marcado: se queda':'Desmarcado'):(on?'Marcado: en WhatsApp':'Quitado de WhatsApp'));
  }

  async function refrescar(){ $('ca-lista').className='ca-cargando'; $('ca-lista').textContent='Cargando…'; await cargar(); pintar(); }

  async function marcar(id, estado, btn){

  // ---- Abrir/cerrar el cobro POR PERSONA ----
  // No cobra nada: solo hace que a esa persona le aparezca (o no) «Pagar la
  // cuota» en su portal. Los que quedan cerrados están «de prueba».
  // ====== LISTA PARA LA CONTABILIDAD (fusionado desde «Pagos del Cubo») ======
  var contabFiltro='todos', contabQ='', contabWA='todos', contabGrupo='';
  function eurC(n){ return (Number(n)||0).toFixed(2).replace('.',',')+' €'; }
  function emailDe(a){ return EMAIL[a.perfil_id]||''; }
  function primerPagoC(a){ return (a.primer_pago_cent!=null && Number(a.primer_pago_cent)>0) ? Number(a.primer_pago_cent)/100 : 10; }
  var PAGO_EXT={efectivo:'en efectivo',transferencia:'por transferencia',otro:'(manual)'};
  function estadoCuota(a){ var e=a.suscripcion_estado;
    if(a.pago_externo) return 'Paga '+(PAGO_EXT[a.pago_externo]||'(manual)')+' · fuera de la app';
    if(e==='activa') return 'Cuota activa'; if(e==='impago') return 'Impagada';
    if(e==='pausada') return 'En pausa'; if(e==='cancelada') return 'De baja';
    if(a.cobro_abierto) return 'Cobro abierto (sin pagar)';
    if(a.estado==='aprobada' && !a.lista_espera){
      var v = DIAS[a.id];
      return 'De prueba'+(v!=null ? ' · vino '+v+' día'+(v===1?'':'s') : '');
    }
    return 'Sin activar'; }
  // ¿Está en el camino prueba → pago? (aprobada, aún no paga, no en espera, paga por la app)
  function enPruebaJourney(a){ return a.estado==='aprobada' && a.suscripcion_estado!=='activa' && !a.lista_espera && !a.pago_externo; }
  function badgesPruebaHTML(a){
    if(!enPruebaJourney(a)) return '';
    var b=[];
    if(a.confirmado_sigue) b.push('<span class="cuota-est activa">✓ Se queda</span>');
    if(a.en_whatsapp) b.push('<span class="cuota-est activa">✓ WhatsApp</span>');
    if(!b.length) return '';
    return '<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:6px">'+b.join('')+'</div>';
  }
  function esPagadoC(a){ return a.suscripcion_estado==='activa'; }
  function esPendienteC(a){ return a.cobro_abierto && a.suscripcion_estado!=='activa'; }
  function esPruebaC(a){ return a.estado==='aprobada' && a.suscripcion_estado!=='activa' && !a.cobro_abierto && !a.lista_espera && !a.pago_externo; }
  function contabVisibles(){
    return ALTAS.filter(function(a){
      if((a.estado||'')==='rechazada') return false;
      if(contabFiltro==='pagados' && !esPagadoC(a)) return false;
      if(contabFiltro==='pendientes' && !esPendienteC(a)) return false;
      if(contabFiltro==='prueba' && !esPruebaC(a)) return false;
      if(contabWA==='si' && !a.en_whatsapp) return false;
      if(contabWA==='no' && a.en_whatsapp) return false;
      if(contabGrupo && (a.horario||'')!==contabGrupo) return false;
      if(contabQ){ var s=((a.nombre||'')+' '+(a.apellidos||'')+' '+emailDe(a)+' '+(a.telefono||'')).toLowerCase(); if(s.indexOf(contabQ)===-1) return false; }
      return true;
    });
  }
  function gruposContab(){
    var set={}; ALTAS.forEach(function(a){ if((a.estado||'')!=='rechazada' && a.horario) set[a.horario]=1; });
    return Object.keys(set).sort();
  }
  function pintarContab(){
    var caja=$('ca-contab'); if(!caja) return;

    if(!todos.length){ caja.innerHTML=''; return; }

    var wsi=todos.filter(function(a){ return a.en_whatsapp; }).length, wno=todos.length-wsi;

      return '<tr>'+
        '<td><b>'+esc(((a.nombre||'')+' '+(a.apellidos||'')).trim())+'</b></td>'+
        '<td><button type="button" class="cx-wa '+(a.en_whatsapp?'on':'off')+'" data-wa="'+esc(a.id)+'">'+(a.en_whatsapp?'✓ En grupo':'＋ Añadir')+'</button></td>'+
        '<td>'+esc(emailDe(a))+'</td><td>'+esc(a.telefono||'')+'</td><td>'+esc(a.horario||'')+'</td>'+
        '<td class="cx-num">'+eurC(a.precio_mes)+'</td><td class="cx-num">'+eurC(primerPagoC(a))+'</td>'+
        '<td>'+(a.cobro_abierto?'<span class="cx-si">Sí</span>':'<span class="cx-no">No</span>')+'</td>'+
        '<td>'+esc(estadoCuota(a))+'</td>'+
        '<td class="cx-mono">'+esc(a.stripe_customer_id||'—')+'</td><td class="cx-mono">'+esc(a.stripe_subscription_id||'—')+'</td>'+
        '<td>'+esc(fecha(a.ultimo_cobro))+'</td><td>'+esc(fecha(a.proximo_cobro))+'</td></tr>';
    }).join('');
    caja.innerHTML=
      '<p class="ca-rot" style="margin-top:30px">Lista para la contabilidad</p>'+
      '<p class="sub" style="margin-top:-4px">Cada persona con su cuota, primer pago e identificadores de Stripe (para cruzar con los payouts). Exporta a Excel o avisa a los pendientes.</p>'+
      '<div class="cx-chips">'+[['todos','Todos',todos.length],['pagados','Han pagado',pag],['pendientes','Cobro abierto',pen],['prueba','De prueba',prb]].map(function(c){ return '<button type="button" class="cx-chip'+(contabFiltro===c[0]?' on':'')+(c[0]==='prueba'?' cx-chip-prueba':'')+'" data-cf="'+c[0]+'">'+c[1]+' <b>'+c[2]+'</b></button>'; }).join('')+'</div>'+
      '<div class="cx-chips cx-chips2">'+
        [['todos','WhatsApp: todos',todos.length],['si','En el grupo',wsi],['no','Falta WhatsApp',wno]].map(function(c){ return '<button type="button" class="cx-chip'+(contabWA===c[0]?' on':'')+(c[0]==='no'?' cx-chip-falta':'')+'" data-wf="'+c[0]+'">'+c[1]+' <b>'+c[2]+'</b></button>'; }).join('')+

        '</select></label>'+
      '</div>'+
      '<div class="cx-barra">'+
        '<input type="search" id="cx-buscar" placeholder="Buscar nombre, email o teléfono…" value="'+esc(contabQ)+'">'+
        '<button type="button" class="cx-btn" id="cx-avisar" style="background:#2F6FA8">✉ Avisar a pendientes</button>'+
        '<button type="button" class="cx-btn" id="cx-resync" style="background:#5E7D3A">↻ Re-sincronizar Stripe</button>'+
        '<button type="button" class="cx-btn" id="cx-export" style="background:#26374B">⬇ Exportar Excel (CSV)</button>'+
      '</div>'+
      '<div class="cx-tabla"><table><thead><tr><th>Persona</th><th>WhatsApp</th><th>Email</th><th>Tel</th><th>Grupo</th><th>Cuota</th><th>1er pago</th><th>Cobro</th><th>Estado cuota</th><th>Cliente Stripe</th><th>Suscripción Stripe</th><th>Últ. cobro</th><th>Próx. cobro</th></tr></thead><tbody>'+filas+'</tbody></table></div>';
  }
  function csvCampo(v){ v=(v==null?'':String(v)); return '"'+v.replace(/"/g,'""')+'"'; }
  function exportarPagos(){
    var cols=['Nombre','Apellidos','Email','Teléfono','Grupo','Días/sem','Cuota (€/mes)','Primer pago (€)','Estado alta','Cobro abierto','En WhatsApp','Estado cuota','ID cliente Stripe','ID suscripción Stripe','Último cobro','Próximo cobro'];
    var lineas=[cols.map(csvCampo).join(';')];
    contabVisibles().forEach(function(a){
      lineas.push([a.nombre||'',a.apellidos||'',emailDe(a),a.telefono||'',a.horario||'',(a.dias||''),
        String(Number(a.precio_mes)||0).replace('.',','),String(primerPagoC(a)).replace('.',','),
        a.estado||'',(a.cobro_abierto?'Sí':'No'),(a.en_whatsapp?'Sí':'No'),estadoCuota(a),a.stripe_customer_id||'',a.stripe_subscription_id||'',
        fecha(a.ultimo_cobro),fecha(a.proximo_cobro)].map(csvCampo).join(';'));
    });
    var blob=new Blob(['﻿'+lineas.join('\r\n')],{type:'text/csv;charset=utf-8;'});
    var h=new Date(), nombre='pagos-cubo-'+h.getFullYear()+('0'+(h.getMonth()+1)).slice(-2)+('0'+h.getDate()).slice(-2)+'.csv';
    var url=URL.createObjectURL(blob); var el=document.createElement('a'); el.href=url; el.download=nombre; document.body.appendChild(el); el.click();
    setTimeout(function(){ URL.revokeObjectURL(url); el.remove(); },400);
  }
  async function avisarPendientes(btn){
    var pend=ALTAS.filter(function(a){ return (a.estado||'')!=='rechazada' && a.cobro_abierto && a.suscripcion_estado!=='activa'; });
    if(!pend.length){ toast('No hay nadie con el cobro abierto pendiente de pagar.'); return; }
    if(!confirm('Se enviará el correo «Ya puedes activar tu cuota de El Cubo» a '+pend.length+' persona(s) con el cobro abierto y sin pagar. ¿Enviar?')) return;
    btn.disabled=true; var ok=0,err=0;
    for(var i=0;i<pend.length;i++){ btn.textContent='Enviando '+(i+1)+'/'+pend.length+'…';
      try{ var r=await sb.functions.invoke('cubo-cobro-aviso',{body:{alta_id:pend[i].id}}); if(r&&r.error) err++; else ok++; }catch(e){ err++; } }
    btn.disabled=false; btn.textContent='✉ Avisar a pendientes';
    toast('Correos enviados: '+ok+(err?(' · fallaron '+err):''), err?'error':'ok');
  }
  async function resyncStripe(btn){
    btn.disabled=true; var txt=btn.textContent; btn.textContent='Preguntando a Stripe…';

  // Cobro en lote de los pendientes «de antes» (alta < 30-sep, aún sin suscripción):
  // septiembre 10€ (entrada) + octubre su cuota, unificado en el primer pago; luego
  // la cuota normal el día 5. Abre el cobro y manda el correo a cada uno.
  async function cobrarSepOct(btn){
    var lista=ALTAS.filter(function(a){
      return a.estado==='aprobada' && a.suscripcion_estado!=='activa' && !a.lista_espera
        && a.created_at && String(a.created_at).slice(0,10) < '2026-09-30';
    });
    if(!lista.length){ toast('No hay pendientes de antes del 30-sep.'); return; }
    var total=lista.reduce(function(s,a){ return s + (10 + (a.precio_mes>0?a.precio_mes:30)); }, 0);
    var nombres=lista.slice(0,6).map(function(a){ return (a.nombre||'')+' '+(a.apellidos||''); }).join(', ');
    var ok=confirm('Vas a abrir el cobro a '+lista.length+' personas (alta antes del 30-sep, aún sin pagar):\n'+
      nombres+(lista.length>6?'…':'')+'\n\n'+
      'Primer pago = SEPTIEMBRE 10€ + OCTUBRE su cuota (unificado). Total aprox: '+total+'€.\n'+
      'Luego su cuota le saldrá sola el día 5 de cada mes.\n'+
      'Se les ENVIARÁ EL CORREO para pagar.\n\n¿Seguir?');
    if(!ok) return;
    btn.disabled=true; var txt=btn.textContent; btn.textContent='Enviando…';
    var hechos=0, fallos=0, sinCorreo=0;
    for(var i=0;i<lista.length;i++){
      var a=lista[i];
      var cuota = (a.precio_mes>0?a.precio_mes:30);
      var euros = 10 + cuota;
      var nota = 'Este primer pago ('+euros+' €) incluye SEPTIEMBRE (10 €) y OCTUBRE ('+cuota+' €). Desde noviembre, tu cuota de '+cuota+' €/mes se cobra sola el día 5.';
      var rp = await sb.rpc('cubo_primer_pago_set', { p_alta_id:a.id, p_euros:euros, p_nota:nota });
      if(rp.error){ fallos++; continue; }
      var r = await sb.rpc('cubo_cobro_abrir', { p_id:a.id, p_abierto:true });
      if(r.error){ fallos++; continue; }
      a.cobro_abierto=true; a.primer_pago_cent=Math.round(euros*100);
      var av = await sb.functions.invoke('cubo-cobro-aviso', { body:{ alta_id:a.id } }).catch(function(){ return null; });
      if(!(av && av.data && av.data.ok)) sinCorreo++;
      hechos++;
    }
    btn.textContent=txt; btn.disabled=false; pintar();
    toast('Cobro abierto a '+hechos+' personas'+(fallos?' · '+fallos+' fallaron':'')+(sinCorreo?' · '+sinCorreo+' sin correo (avísales por WhatsApp)':' · correos enviados'), (fallos||sinCorreo)?'error':'ok');
  }

  async function abrirCobro(id, estabaAbierto, btn){
    var nuevo=!estabaAbierto;
    var a=null; ALTAS.forEach(function(x){ if(x.id===id) a=x; });
    // Al ABRIR: se pregunta lo que paga ESTE mes (por defecto su cuota entera;
    // se baja solo si entra a mitad de mes) y luego se avisa por correo.
    if(nuevo){
      var cuota = (a && a.precio_mes>0) ? a.precio_mes : 30;
      var porDef = (a && a.primer_pago_cent>0) ? (a.primer_pago_cent/100) : cuota;
      var v = prompt('¿Cuánto paga ESTE mes '+((a&&a.nombre)||'esta persona')+'? (€)\n\n'+
        'Normalmente su cuota: '+cuota+' €. Bájalo solo si entra a mitad de mes.\n'+
        'A partir de aquí, su cuota ('+cuota+' €) le saldrá sola el día 5 de cada mes (desde el mes que viene).',
        String(porDef).replace('.',','));
      if(v==null) return; // canceló
      var n = Number(String(v).replace(',','.'));
      if(!(n>0)){ toast('Pon un importe válido para este mes.','error'); return; }
      btn.disabled=true;
      var rp = await sb.rpc('cubo_primer_pago_set', { p_alta_id:id, p_euros:n });
      if(rp.error){ toast(rp.error.message||'No se ha podido guardar el primer pago.','error'); btn.disabled=false; return; }
      var r=await sb.rpc('cubo_cobro_abrir',{ p_id:id, p_abierto:true });
      if(r.error){ toast(r.error.message||'No se ha podido.', 'error'); btn.disabled=false; return; }
      ALTAS.forEach(function(x){ if(x.id===id){ x.cobro_abierto=true; x.primer_pago_cent=Math.round(n*100); } });
      pintar();
      // Aviso por correo (extra: si falla, el cobro ya está abierto igualmente).
      var av = await sb.functions.invoke('cubo-cobro-aviso', { body:{ alta_id:id } }).catch(function(){ return null; });
      var ok = av && av.data && av.data.ok;
      toast(ok?'Cobro abierto · correo enviado':'Cobro abierto (el correo no salió; avísale por WhatsApp)', ok?'':'error');
      return;
    }
    // Al CERRAR: solo cerrar, sin correo.
    btn.disabled=true;
    var r2=await sb.rpc('cubo_cobro_abrir',{ p_id:id, p_abierto:false });
    if(r2.error){ toast(r2.error.message||'No se ha podido.', 'error'); btn.disabled=false; return; }
    ALTAS.forEach(function(x){ if(x.id===id) x.cobro_abierto=false; });
    pintar();
    toast('Cobro cerrado (queda de prueba)');
  }

  var COBRO = null, LIMITE = null;

  // ---- Grupos del Cubo con su ocupación (X/aforo + lista de espera) ----
  // La ocupación son los INTEGRANTES REALES de cada grupo (atleta_grupos), no
  // las altas de la web: así cuenta a todos —también los de fuerza gratis, que
  // se apuntan por otro formulario— y cuadra con «Grupos del Cubo» e «Integrantes».
  var GRUPOS_CUBO = null;
  var CUENTA_GRUPO = {};  // grupo_id -> nº de integrantes reales
  async function cargarGrupos(){
    var r = await sb.from('grupos').select('id,nombre,horario').eq('seccion','cubo').eq('activo',true).order('nombre');
    GRUPOS_CUBO = r.error ? [] : (r.data||[]);
    CUENTA_GRUPO = {};
    var rc = await sb.from('atleta_grupos').select('grupo_id');
    if(!rc.error && rc.data){ rc.data.forEach(function(x){ CUENTA_GRUPO[x.grupo_id] = (CUENTA_GRUPO[x.grupo_id]||0) + 1; }); }
    pintarGrupos();
  }
  function pintarGrupos(){
    var caja=$('ca-grupos'); if(!caja || !GRUPOS_CUBO) return;
    if(!GRUPOS_CUBO.length){ caja.innerHTML=''; return; }
    var lim = LIMITE!=null ? LIMITE : 20;
    var DIAS_SEM = {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado',7:'Domingo'};
    caja.innerHTML = '<p class="ca-rot">Grupos del Cubo</p><div class="cg-grid">' + GRUPOS_CUBO.map(function(g){
      var espera = ALTAS.filter(function(a){ return a.horario===g.nombre && a.lista_espera; }).length;
      var nombre = String(g.nombre||'').replace(/^El Cubo\s*·\s*/i,'');
      // Altas aprobadas y activas de este grupo (cubo_altas es donde vive dias_semana).
      var altasG = ALTAS.filter(function(a){ return a.horario===g.nombre && (a.estado==='aprobada') && !a.lista_espera; });
      // Días propios del grupo = unión de los dias_semana fijados de sus altas.
      var dias = [];
      altasG.forEach(function(a){ (a.dias_semana||[]).forEach(function(d){ if(dias.indexOf(d)===-1) dias.push(d); }); });
      dias.sort(function(x,y){ return x-y; });

      var cab = '<h3>'+esc(nombre)+'</h3>'+(g.horario?'<p class="cg-hor">'+esc(g.horario)+'</p>':'');

      // Grupo de VARIOS días (L y X, M y J…): una fila por día, cada uno con su conteo.
      // Quien no tiene días fijados (dias_semana vacío) cuenta en TODOS los días del grupo.
      if(dias.length>=2){
        var filas = dias.map(function(D){
          var n = altasG.filter(function(a){ var ds=a.dias_semana||[]; return !ds.length || ds.indexOf(D)!==-1; }).length;
          var lleno = n>=lim, pct = Math.min(100, Math.round(n/lim*100));
          return '<div class="cg-dia"><span class="cg-dia-n">'+esc(DIAS_SEM[D]||('Día '+D))+'</span>'+
            '<span class="cg-dia-c'+(lleno?' lleno':'')+'"><b>'+n+'</b><span>/'+lim+(lleno?' · completo':'')+'</span></span></div>'+
            '<div class="cg-bar'+(lleno?' lleno':'')+'"><i style="width:'+pct+'%"></i></div>';
        }).join('');
        return '<div class="cg-card">'+cab+filas+
          (espera?'<p class="cg-espera">'+espera+' en lista de espera</p>':'')+'</div>';
      }

      // Grupo de UN solo día (gratis viernes/sábado/domingo…): conteo único del grupo.
      var ocup = CUENTA_GRUPO[g.id] || 0;  // integrantes reales del grupo (atleta_grupos)
      var pct = Math.min(100, Math.round(ocup/lim*100));
      var lleno = ocup>=lim;
      return '<div class="cg-card">'+cab+
        '<div class="cg-ocup"><b>'+ocup+'/'+lim+'</b><span>plazas'+(lleno?' · completo':'')+'</span></div>'+
        '<div class="cg-bar'+(lleno?' lleno':'')+'"><i style="width:'+pct+'%"></i></div>'+
        (espera?'<p class="cg-espera">'+espera+' en lista de espera</p>':'')+
      '</div>';
    }).join('') + '</div>';
  }
  function aforoHTML(){
    return '<div class="ca-aforo">Aforo por grupo: <b>'+esc(LIMITE)+' plazas</b> · '+
      '<button type="button" class="aforo-link" id="ca-limite">Cambiar</button>'+
      '<small>Cuando un grupo se llena, las altas nuevas entran en lista de espera.</small></div>';

  function pintarCobro(){
    var caja=$('ca-cobro'); if(!caja) return;
    if(!ALTAS){ caja.innerHTML=''; caja.className=''; return; }
    // El cobro es POR PERSONA (cada tarjeta tiene su «Abrir/Cerrar cobro»).

    var aprob=ALTAS.filter(function(a){ return (a.estado==='aprobada') && a.suscripcion_estado!=='activa'; });

    caja.innerHTML='<div class="tx"><b>Cobro por persona</b>'+

      'Abre el cobro a cada uno en su tarjeta, o a todos los de prueba de golpe.</small></div>'+
      (septoct.length?'<button type="button" class="b abrir" id="ca-cobrar-septoct" style="background:#1E7A3D">Cobrar sep+oct a '+septoct.length+' pendientes (alta &lt; 30-sep) · ~'+septoctTotal+'€</button>':'')+
      (prueba>0?'<button type="button" class="b abrir" id="ca-abrir-todos">Abrir cobro a los '+prueba+' de prueba</button>':'')+
      aforoHTML();

    var v = prompt('Aforo por grupo del Cubo (plazas antes de lista de espera):', String(actual));
    if(v==null) return;
    var n = parseInt(String(v).replace(/[^0-9]/g,''),10);
    if(!n || n<1){ toast('Pon un número válido.','error'); return; }
    var r=await sb.from('cubo_config').update({ limite_grupo:n }).eq('id',1);
    if(r.error){ toast('No se ha podido: '+r.error.message,'error'); return; }
    LIMITE=n; pintarCobro(); pintarGrupos(); toast('Aforo: '+n+' por grupo');
  }

  $('admin-contenido').addEventListener('input', function(ev){
    if(ev.target && ev.target.id==='cx-buscar'){ contabQ=(ev.target.value||'').trim().toLowerCase(); pintarContab();
      var inp=document.getElementById('cx-buscar'); if(inp){ inp.focus(); var v=inp.value; inp.value=''; inp.value=v; } }
  });
  $('admin-contenido').addEventListener('click', function(ev){
    var t=ev.target.closest?ev.target.closest('#ca-cobro-btn'):null;
    if(t){ toggleCobro(t); return; }
    var pl=ev.target.closest?ev.target.closest('.b-plaza[data-plaza]'):null;
    if(pl){ darPlaza(pl.getAttribute('data-plaza'), pl); return; }
    var gr=ev.target.closest?ev.target.closest('.b-grupo[data-grupo]'):null;
    if(gr){ cambiarGrupo(gr.getAttribute('data-grupo')); return; }
    var lim=ev.target.closest?ev.target.closest('#ca-limite'):null;
    if(lim){ cambiarLimite(); return; }
    var bb=ev.target.closest?ev.target.closest('.b-baja[data-baja]'):null;
    if(bb){ darBaja(bb.getAttribute('data-baja'), bb); return; }
    var pp=ev.target.closest?ev.target.closest('[data-pago-pausar]'):null;
    if(pp){ pagoPausar(pp.getAttribute('data-pago-pausar'), pp); return; }
    var pr=ev.target.closest?ev.target.closest('[data-pago-reanudar]'):null;
    if(pr){ pagoReanudar(pr.getAttribute('data-pago-reanudar'), pr); return; }
    var ps=ev.target.closest?ev.target.closest('[data-pago-saltar]'):null;
    if(ps){ pagoSaltar(ps.getAttribute('data-pago-saltar'), ps); return; }
    var pc=ev.target.closest?ev.target.closest('[data-pago-cargo]'):null;
    if(pc){ pagoCargo(pc.getAttribute('data-pago-cargo'), pc); return; }
    var pq=ev.target.closest?ev.target.closest('[data-pago-cuota]'):null;
    if(pq){ pagoCuota(pq.getAttribute('data-pago-cuota'), pq); return; }
    var prp=ev.target.closest?ev.target.closest('.pr-chip[data-paso]'):null;
    if(prp){ marcarPaso(prp.getAttribute('data-id'), prp.getAttribute('data-paso'), prp.getAttribute('data-on')!=='1', prp); return; }
    var prc=ev.target.closest?ev.target.closest('[data-cobrochip]'):null;
    if(prc){ abrirCobro(prc.getAttribute('data-cobrochip'), false, prc); return; }
    var cb=ev.target.closest?ev.target.closest('[data-cobro]'):null;
    if(cb){ abrirCobro(cb.getAttribute('data-cobro'), cb.getAttribute('data-abierto')==='1', cb); return; }
    var elim=ev.target.closest?ev.target.closest('[data-eliminar]'):null;
    if(elim){ eliminarCubo(elim.getAttribute('data-eliminar'), elim); return; }
    var pp=ev.target.closest?ev.target.closest('[data-poner-pago]'):null;
    if(pp){ ponerPago(pp.getAttribute('data-poner-pago'), pp); return; }
    var cp=ev.target.closest?ev.target.closest('[data-cancelar-pago]'):null;
    if(cp){ cancelarPago(cp.getAttribute('data-cancelar-pago'), cp); return; }
    var at=ev.target.closest?ev.target.closest('#ca-abrir-todos'):null;
    if(at){ abrirCobroTodos(at); return; }
    var so=ev.target.closest?ev.target.closest('#ca-cobrar-septoct'):null;
    if(so){ cobrarSepOct(so); return; }
    var wa=ev.target.closest?ev.target.closest('.cx-wa[data-wa]'):null;
    if(wa){ marcarPaso(wa.getAttribute('data-wa'),'whatsapp',!wa.classList.contains('on'),wa); return; }
    var cf=ev.target.closest?ev.target.closest('[data-cf]'):null;
    if(cf){ contabFiltro=cf.getAttribute('data-cf'); pintarContab(); return; }
    var wf=ev.target.closest?ev.target.closest('[data-wf]'):null;
    if(wf){ contabWA=wf.getAttribute('data-wf'); pintarContab(); return; }
    if(ev.target.closest&&ev.target.closest('#cx-export')){ exportarPagos(); return; }
    var cav=ev.target.closest?ev.target.closest('#cx-avisar'):null;
    if(cav){ avisarPendientes(cav); return; }
    var crs=ev.target.closest?ev.target.closest('#cx-resync'):null;
    if(crs){ resyncStripe(crs); return; }
    var f=ev.target.closest?ev.target.closest('.chip[data-f]'):null;
    if(f){ filtro=f.getAttribute('data-f'); pintar(); return; }
    var b=ev.target.closest?ev.target.closest('.b[data-id]'):null;
    if(b) marcar(b.getAttribute('data-id'), b.getAttribute('data-e'), b);
  });

  // Selector «Cómo paga» (por la app / efectivo / transferencia / otro).
  $('admin-contenido').addEventListener('change', function(ev){
    if(ev.target && ev.target.id==='cx-grupo'){ contabGrupo=ev.target.value||''; pintarContab(); return; }
    var sel=ev.target.closest?ev.target.closest('select[data-pagoext]'):null;
    if(sel) ponerComoPaga(sel.getAttribute('data-pagoext'), sel.value, sel);
  });
  async function ponerComoPaga(id, metodo, sel){
    if(sel) sel.disabled=true;
    var r=await sb.rpc('cubo_pago_externo_set',{ p_id:id, p_metodo:(metodo||null) });
    if(sel) sel.disabled=false;
    if(r.error){ toast('No se pudo guardar: '+r.error.message); return; }
    ALTAS.forEach(function(x){ if(x.id===id){ x.pago_externo=metodo||null; if(metodo) x.cobro_abierto=false; } });
    toast(metodo ? 'Marcado: paga '+(PAGO_EXT[metodo]||'(manual)') : 'Vuelve a pagar por la app');
    pintar();
  }

  refrescar();
  cargarCobro();
  cargarGrupos();
});
</script>
