<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagos del Cubo · Panel Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .admin-wrap { max-width: 1200px; margin: 0 auto; padding: clamp(20px,4vw,40px) clamp(16px,4vw,40px); }
  .cp-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(26px,5vw,34px); color: var(--navy); margin: 0 0 4px; }
  .cp-cab p { font-size: 15px; color: var(--texto-suave); margin: 0 0 18px; max-width: 70ch; line-height: 1.6; }
  .cp-cab a { color: var(--azul-oscuro, #2F6FA8); }

  .cp-barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .cp-barra input { flex: 1 1 240px; max-width: 340px; box-sizing: border-box; min-height: 44px; padding: 10px 14px; border: 1px solid var(--linea-borde); border-radius: 999px; background: #fff; font-family: inherit; font-size: 15px; color: var(--navy); }
  .cp-barra .cuenta { font-family: var(--fuente-dato); font-size: 14px; color: var(--texto-suave); }
  .cp-barra .btn-exp { margin-left: auto; min-height: 44px; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--navy, #26374B); color: #fff; font-family: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .cp-barra .btn-exp:hover { filter: brightness(1.08); }

  .cp-tabla-wrap { overflow-x: auto; border: 1px solid var(--linea); border-radius: 14px; background: #fff; }
  table { width: 100%; border-collapse: collapse; min-width: 900px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--linea); font-size: 13px; white-space: nowrap; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .3px; color: var(--texto-suave); background: var(--crema, #FBF9F4); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--fuente-dato); text-align: right; }
  .pill { display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 9px; }
  .pill.si { background: #EAF3E3; color: #4E8A3E; }
  .pill.no { background: #F4EAD6; color: #8A5307; }
  .pill.activa { background: #EAF3E3; color: #4E8A3E; }
  .pill.sin { background: var(--crema-media, #EFE9DA); color: var(--texto-suave); }
  .mono { font-family: var(--fuente-dato); font-size: 12px; color: var(--texto-suave); }
  .cp-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--linea-borde,#C9C0AE); background: #fff; color: var(--navy,#26374B); border-radius: 999px; padding: 8px 15px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--navy,#26374B); color: #fff; border-color: var(--navy,#26374B); }
  .chip .c { font-family: var(--fuente-dato); opacity: .75; margin-left: 5px; }
</style>
</head>
<body class="adm-piel">
<div class="admin-wrap">
  <div class="cp-cab">
    <h1>Pagos del Cubo</h1>
    <p>Listado para la contabilidad: cada persona con su cuota, su primer pago y los <b>identificadores de Stripe</b> (cliente y suscripción) para cruzar con el export de Stripe (Payments/Payouts). El botón <b>Exportar</b> baja un CSV que abre directo en Excel. · <a href="../cubo-altas/">← Altas y cobros del Cubo</a></p>
  </div>
  <div class="cp-chips" id="chips"></div>
  <div class="cp-barra">
    <input type="search" id="buscar" placeholder="Buscar por nombre, email o teléfono…" aria-label="Buscar">
    <span class="cuenta" id="cuenta"></span>
    <button type="button" class="btn-exp" id="avisar" style="background:#2F6FA8">✉️ Avisar del pago a los pendientes</button>
    <button type="button" class="btn-exp" id="exportar">⬇ Exportar Excel (CSV)</button>
  </div>
  <div id="lista"><div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span><span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div>
</div>

<script>
APOLANA_ADMIN.listo(function (sb) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fecha(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }
  function eur(n){ return (Number(n)||0).toFixed(2).replace('.',',')+' €'; }
  // El primer pago por defecto son 10 € (cubo-pagar: PRIMER_PAGO_DEFECTO_CENT), salvo que el club ponga otro.
  function primerPago(a){ return (a.primer_pago_cent!=null && Number(a.primer_pago_cent)>0) ? Number(a.primer_pago_cent)/100 : 10; }
  function estadoCuota(a){
    var e=a.suscripcion_estado;
    if(e==='activa') return 'Cuota activa';
    if(e==='impago') return 'Impagada';
    if(e==='pausada') return 'En pausa';
    if(e==='cancelada') return 'De baja';
    return a.cobro_abierto ? 'Cobro abierto (sin pagar)' : 'Sin activar';
  }

  var FILAS = [];  // {a, email}
  var estadoFiltro = 'todos';
  function esPagado(a){ return a.suscripcion_estado==='activa'; }
  function esPendiente(a){ return a.cobro_abierto && a.suscripcion_estado!=='activa'; }

  async function cargar(){
    var r = await sb.from('cubo_altas')
      .select('id,nombre,apellidos,telefono,perfil_id,horario,dias,precio_mes,primer_pago_cent,cobro_abierto,suscripcion_estado,stripe_customer_id,stripe_subscription_id,ultimo_cobro,proximo_cobro,estado,es_escuela,es_socio')
      .neq('estado','rechazada')
      .order('apellidos',{ascending:true});
    if(r.error){ $('lista').innerHTML = ADM.error(r.error.message, cargar); return; }
    var altas = r.data||[];
    // Emails: vienen de perfiles (por perfil_id).
    var ids = altas.map(function(a){ return a.perfil_id; }).filter(Boolean);
    var EMAIL = {};
    if(ids.length){
      var rp = await sb.from('perfiles').select('id,email').in('id', ids);
      if(!rp.error && rp.data) rp.data.forEach(function(p){ EMAIL[p.id]=p.email||''; });
    }
    FILAS = altas.map(function(a){ return { a:a, email: EMAIL[a.perfil_id]||'' }; });
    pintar();
  }

  function visibles(){
    var q=($('buscar').value||'').trim().toLowerCase();
    return FILAS.filter(function(f){
      var a=f.a;
      if(estadoFiltro==='pagados' && !esPagado(a)) return false;
      if(estadoFiltro==='pendientes' && !esPendiente(a)) return false;
      if(q && ((a.nombre||'')+' '+(a.apellidos||'')+' '+(f.email||'')+' '+(a.telefono||'')).toLowerCase().indexOf(q)===-1) return false;
      return true;
    });
  }
  function pintarChips(){
    var pag=FILAS.filter(function(f){return esPagado(f.a);}).length;
    var pen=FILAS.filter(function(f){return esPendiente(f.a);}).length;
    var chips=[{v:'todos',t:'Todos',c:FILAS.length},{v:'pagados',t:'Han pagado',c:pag},{v:'pendientes',t:'Pendientes',c:pen}];
    $('chips').innerHTML=chips.map(function(c){ return '<button type="button" class="chip'+(estadoFiltro===c.v?' on':'')+'" data-f="'+c.v+'">'+esc(c.t)+' <span class="c">'+c.c+'</span></button>'; }).join('');
  }

  function pintar(){
    pintarChips();
    var lista=visibles();
    $('cuenta').textContent = lista.length===FILAS.length
      ? FILAS.length+(FILAS.length===1?' persona':' personas')
      : lista.length+' de '+FILAS.length;
    if(!FILAS.length){ $('lista').innerHTML = ADM.vacio('Todavía no hay altas del Cubo','Cuando alguien se apunte aparecerá aquí.',''); return; }
    if(!lista.length){ $('lista').innerHTML = ADM.vacio('Nadie encaja con la búsqueda','Prueba con otra palabra.',''); return; }
    var filas = lista.map(function(f){
      var a=f.a;
      return '<tr>'+
        '<td><b>'+esc((a.nombre||'')+' '+(a.apellidos||''))+'</b></td>'+
        '<td>'+esc(f.email)+'</td>'+
        '<td>'+esc(a.telefono||'')+'</td>'+
        '<td>'+esc(a.horario||'')+'</td>'+
        '<td class="num">'+eur(a.precio_mes)+'</td>'+
        '<td class="num">'+eur(primerPago(a))+'</td>'+
        '<td>'+(a.cobro_abierto?'<span class="pill si">Sí</span>':'<span class="pill no">No</span>')+'</td>'+
        '<td><span class="pill '+(a.suscripcion_estado==='activa'?'activa':'sin')+'">'+esc(estadoCuota(a))+'</span></td>'+
        '<td class="mono">'+esc(a.stripe_customer_id||'—')+'</td>'+
        '<td class="mono">'+esc(a.stripe_subscription_id||'—')+'</td>'+
        '<td>'+esc(fecha(a.ultimo_cobro))+'</td>'+
        '<td>'+esc(fecha(a.proximo_cobro))+'</td>'+
      '</tr>';
    }).join('');
    $('lista').innerHTML =
      '<div class="cp-tabla-wrap"><table><thead><tr>'+
        '<th>Persona</th><th>Email</th><th>Teléfono</th><th>Grupo</th>'+
        '<th>Cuota/mes</th><th>Primer pago</th><th>Cobro abierto</th><th>Estado cuota</th>'+
        '<th>ID cliente Stripe</th><th>ID suscripción Stripe</th><th>Último cobro</th><th>Próximo cobro</th>'+
      '</tr></thead><tbody>'+filas+'</tbody></table></div>';
  }

  // --- Exportar a CSV (lo que se ve, respetando el buscador) ---
  function csvCampo(v){ v = (v==null?'':String(v)); return '"'+v.replace(/"/g,'""')+'"'; }
  function exportar(){
    var cols=['Nombre','Apellidos','Email','Teléfono','Grupo','Días/sem','Cuota (€/mes)','Primer pago (€)','Estado alta','Cobro abierto','Estado cuota','ID cliente Stripe','ID suscripción Stripe','Último cobro','Próximo cobro'];
    var lineas=[cols.map(csvCampo).join(';')];
    visibles().forEach(function(f){
      var a=f.a;
      lineas.push([
        a.nombre||'', a.apellidos||'', f.email||'', a.telefono||'', a.horario||'',
        (a.dias||''), String(Number(a.precio_mes)||0).replace('.',','), String(primerPago(a)).replace('.',','),
        a.estado||'', (a.cobro_abierto?'Sí':'No'), estadoCuota(a),
        a.stripe_customer_id||'', a.stripe_subscription_id||'',
        fecha(a.ultimo_cobro), fecha(a.proximo_cobro)
      ].map(csvCampo).join(';'));
    });
    // BOM UTF-8 para que Excel respete los acentos.
    var blob = new Blob(['﻿'+lineas.join('\r\n')], { type:'text/csv;charset=utf-8;' });
    var hoy = new Date();
    var nombre = 'pagos-cubo-'+hoy.getFullYear()+('0'+(hoy.getMonth()+1)).slice(-2)+('0'+hoy.getDate()).slice(-2)+'.csv';
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=nombre; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
  }

  // --- Avisar por correo a los que tienen el cobro abierto y aún no pagan ---
  // Reutiliza la Edge `cubo-cobro-aviso` (correo «Ya puedes activar tu cuota»,
  // con el enlace al portal para pagar). Uno por persona, con la sesión de admin.
  async function avisarPendientes(){
    var pend = FILAS.filter(function(f){ return f.a.cobro_abierto && f.a.suscripcion_estado!=='activa'; });
    if(!pend.length){ window.alert('No hay nadie con el cobro abierto pendiente de pagar.'); return; }
    if(!window.confirm('Se enviará el correo «Ya puedes activar tu cuota de El Cubo» (con el enlace para pagar) a '+pend.length+' persona(s). ¿Enviar ahora?')) return;
    var btn=$('avisar'); btn.disabled=true; var ok=0, err=0;
    for(var i=0;i<pend.length;i++){
      btn.textContent='Enviando '+(i+1)+'/'+pend.length+'…';
      try { var r = await sb.functions.invoke('cubo-cobro-aviso', { body:{ alta_id: pend[i].a.id } }); if(r && r.error){ err++; } else { ok++; } }
      catch(e){ err++; }
    }
    btn.disabled=false; btn.textContent='✉️ Avisar del pago a los pendientes';
    window.alert('Correos enviados: '+ok+(err?(' · fallaron '+err):'')+'.');
  }

  $('buscar').addEventListener('input', pintar);
  $('exportar').addEventListener('click', exportar);
  $('avisar').addEventListener('click', avisarPendientes);
  $('chips').addEventListener('click', function(e){ var b=e.target.closest('[data-f]'); if(b){ estadoFiltro=b.getAttribute('data-f'); pintar(); } });
  cargar();
});
</script>
</body>
</html>
