<body>

<div id="admin-contenido">
  <div id="pista"></div>
</div>

<!-- Esta pantalla es modo trabajo: NO lleva barra de pestañas (de pie en la
     pista se pulsa sin querer). Este hueco vacío es la señal que la piel
     común del panel busca para apartarse y no pintar la suya. -->
<nav class="tabbar" hidden aria-hidden="true"></nav>

<!-- Ventana para apuntar la nota del día de un atleta. Vacía hasta que se abre. -->
<div id="modal-nota" class="oculto" role="dialog" aria-modal="true" aria-label="Observaciones del equipo técnico"><div class="caja" id="modal-nota-caja"></div></div>

<script>
window.APOLANA_ADMIN.listo(function (sb) {
  document.body.classList.add('pista-viva');

  /* ============================================================
     0 · Cosillas de siempre
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };
  var RAIZ = $('pista');

  /* La fecha se calcula CADA VEZ que se usa, no una sola vez al abrir: el
     panel se queda abierto en el móvil de un día para otro y, si no, la
     lista de la mañana siguiente se guardaría con la fecha de ayer. */
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fechaHoy() { return iso(new Date()); }
  function deISO(s) { var p = (s || '').split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fechaBonita(s) { return (s || '').split('-').reverse().join('/'); }
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function norm(s) { return (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function nombreDe(a) { return [a.nombre, a.apellidos].filter(Boolean).join(' '); }
  /* En la lista, a 375 px, «Laura Espí» se lee de un vistazo y «Laura Espí
     Doménech» se corta a la mitad. Se enseña el nombre y el primer apellido,
     salvo que en ese grupo haya dos que se llamen igual: entonces, el
     nombre entero. La ficha y el buscador siempre lo dicen completo. */
  function nombreCorto(a) {
    var uno = [a.nombre, (a.apellidos || '').split(' ')[0]].filter(Boolean).join(' ');
    /* Los homónimos se buscan en la lista que se está pasando, no en «su
       grupo»: ahora una persona está en varios y su grupo principal puede
       no ser el que el entrenador tiene delante. */
    var enLista = LST.grupo || a.grupo_id;
    var repes = ATLETAS.filter(function (x) {
      return estaEn(x, enLista) && x.id !== a.id &&
        [x.nombre, (x.apellidos || '').split(' ')[0]].filter(Boolean).join(' ') === uno;
    });
    return repes.length ? nombreDe(a) : uno;
  }
  function iniciales(a) { return ((a.nombre || '?')[0] + (a.apellidos ? a.apellidos[0] : '')).toUpperCase(); }
  function anoNac(a) { return a.fecha_nacimiento ? String(a.fecha_nacimiento).slice(0, 4) : ''; }
  function ella(a) { return a && a.sexo === 'mujer'; }

  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var DIAS_CORTO = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function fechaLarga(s) { var d = deISO(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function fechaCorta(s) { var d = deISO(s); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3); }
  function hhmm(t) { return (t || '').slice(0, 5); }

  /* Iconos: lienzo de 24, un solo trazo de 1,9 y puntas redondas. */
  function ic(p, w) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.9) +
           '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }
  var IC_BUSCAR = ic('<circle cx="11" cy="11" r="6.6"/><path d="M16 16l4.5 4.5"/>');
  var IC_ATRAS = ic('<path d="M19.5 12h-15M11 5.5L4.5 12l6.5 6.5"/>');
  var IC_ENTRAR = ic('<path d="M9.5 6l6 6-6 6"/>');
  var IC_CANDADO = ic('<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8.5 11V8.5a3.5 3.5 0 017 0V11"/>');
  var VISTO = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function CRUZ(c) { return '<svg viewBox="0 0 24 24" fill="none" stroke="' + c + '" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>'; }
  function OJO(c) { return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 8v4.5" stroke="' + c + '" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16" r="1.2" fill="' + c + '"/></svg>'; }

  /* ============================================================
     1 · Lo que sabemos del club
     ============================================================ */
  var GRUPOS = [], GMAP = {}, HOR = {}, ATLETAS = [], AMAP = {}, PERSONAS = {}, YO = '';
  /* MIEMBROS[atleta_id] = { grupo_id: true, … }. En qué grupos entrena cada
     uno, que ya no es uno solo. Vacío mientras no se haya podido leer. */
  var MIEMBROS = {};
  /* ASIS[atleta_id][fecha] = true/false. Es la copia de lo que hay GUARDADO. */
  var ASIS = {};
  /* HOY_POR_GRUPO[grupo_id][atleta_id] = true/false. Lo marcado HOY en cada
     grupo, para el recuento de los grupos plegados. Va aparte de ASIS porque
     ASIS es de una persona y un día, y hoy eso ya no basta. */
  var HOY_POR_GRUPO = {};
  var AUSENCIAS = {};                        /* AUSENCIAS[atleta_id] = aviso de la familia de ESE día */
  var NOTAS_HOY = {};                        /* notas del día de la lista, por atleta */
  var NOTAS_AT = [];                         /* notas del atleta abierto en la ficha */
  var CARGA_ERROR = '';

  var ESCRITORIO = window.matchMedia('(min-width: 900px)');
  function esEscritorio() { return ESCRITORIO.matches; }

  /* En qué pantalla estamos: la lista, la ficha de alguien o la semana. */
  var PANTALLA = 'lista';
  var FICHA = null;          /* atleta abierto */
  var BUSCA = '';
  var SEMANA = 0;            /* 0 = esta semana, -1 = la anterior… */

  /* `sucio` = hay marcas puestas a mano que todavía NO están en la base.
     Es lo único que evita que se pierda el trabajo al salir de la lista. */
  var LST = { grupo: '', fecha: '', marcas: {}, guardadas: {}, sucio: false,
              guardando: false, guardadoEn: '', error: '', version: 0, cargando: false };

  /* ¿Esta persona entrena en este grupo?
     Desde este curso puede estar en varios —running en La Tribu y El Cubo,
     la escuela a primera hora y fuerza a segunda—, así que la respuesta ya
     no es «mira su casilla de grupo» sino «mira sus grupos».
     Si la tabla de grupos no se ha podido leer, se cae a la casilla de la
     ficha: enseñar el grupo a medias es mejor que enseñarlo vacío. */
  function estaEn(a, gid) {
    var m = MIEMBROS[a.id];
    return m ? !!m[gid] : a.grupo_id === gid;
  }
  /* Todos sus grupos, el principal delante. */
  function gruposDe(a) {
    var m = MIEMBROS[a.id];
    if (!m) return a.grupo_id ? [a.grupo_id] : [];
    return Object.keys(m).sort(function (x, y) {
      if (x === a.grupo_id) return -1;
      if (y === a.grupo_id) return 1;
      return 0;
    });
  }
  function nombresDeSusGrupos(a) {
    var n = gruposDe(a).map(function (id) { return GMAP[id] ? GMAP[id].nombre : ''; }).filter(Boolean);
    return n.length ? n.join(' · ') : '';
  }
  function atletasDeGrupo(gid) {
    return ATLETAS.filter(function (a) { return estaEn(a, gid) && a.estado !== 'baja'; });
  }
  function horariosDe(gid) { return HOR[gid] || []; }
  /* ¿Este grupo entrena el día de la semana X? (1 lunes … 7 domingo) */
  function entrenaDia(gid, dow) {
    return horariosDe(gid).some(function (h) { return h.dia_semana === dow; });
  }
  function dowDe(fechaISO) { var d = deISO(fechaISO).getDay(); return d === 0 ? 7 : d; }
  function franjaDelDia(gid, dow) {
    var h = horariosDe(gid).filter(function (x) { return x.dia_semana === dow; })
      .sort(function (a, b) { return a.hora_inicio < b.hora_inicio ? -1 : 1; })[0];
    if (!h) return null;
    var ini = hhmm(h.hora_inicio);
    return { ini: ini, fin: h.hora_fin ? hhmm(h.hora_fin) : masMinutos(ini, 90) };
  }
  function horaDelDia(gid, dow) { var f = franjaDelDia(gid, dow); return f ? f.ini : ''; }
  function masMinutos(hm, min) {
    var p = (hm || '00:00').split(':');
    var t = Math.min((+p[0]) * 60 + (+p[1]) + min, 1439);
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }
  function ahoraHM() { var d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  /* ¿Ese entreno de hoy está por llegar, en marcha o ya pasado? Se dan 20
     minutos de cortesía al final: la lista se suele pasar al terminar. */
  var CORTESIA = 20;
  function momentoDe(gid) {
    var f = franjaDelDia(gid, dowDe(fechaHoy()));
    if (!f) return null;
    var ahora = ahoraHM();
    if (ahora < f.ini) return 'antes';
    if (ahora <= masMinutos(f.fin, CORTESIA)) return 'ahora';
    return 'despues';
  }
  function gruposConAtletas() { return GRUPOS.filter(function (g) { return atletasDeGrupo(g.id).length > 0; }); }
  function gruposDeHoy() {
    var dow = dowDe(fechaHoy());
    return GRUPOS.filter(function (g) { return entrenaDia(g.id, dow); })
      .sort(function (a, b) { return (horaDelDia(a.id, dow) || '99') < (horaDelDia(b.id, dow) || '99') ? -1 : 1; });
  }

  async function cargar() {
    var g = await sb.from('grupos').select('id,nombre,turno,seccion,horario,activo').eq('activo', true).order('nombre').order('turno', { nullsFirst: true });
    if (g.error) { CARGA_ERROR = 'No se han podido leer los grupos (' + (g.error.message || 'sin conexión') + ').'; }
    else if (g.data) {
      GRUPOS = g.data;
      /* Con esto se pasa lista en la pista. En la escuela hay un «Azul 2» de
         lunes y miércoles y otro de martes y jueves, con niños distintos: si
         el desplegable enseñara dos veces lo mismo, el entrenador podría abrir
         la lista del grupo que no es y marcar faltas a quien no toca. */
      GRUPOS.forEach(function (x) {
        if (x.turno && window.APOLANA_GRUPO_NOMBRE) x.nombre = window.APOLANA_GRUPO_NOMBRE(x);
        GMAP[x.id] = x;
      });
    }

    /* El horario estructurado del panel: de aquí sale qué grupo toca ahora y a
       qué hora, sin tener que adivinarlo leyendo un texto. */
    try {
      var h = await sb.from('grupo_horarios').select('grupo_id,dia_semana,hora_inicio,hora_fin,lugar').eq('activo', true);
      if (!h.error && h.data) h.data.forEach(function (x) { (HOR[x.grupo_id] = HOR[x.grupo_id] || []).push(x); });
    } catch (e) {}

    var a = await sb.from('atletas')
      .select('id,nombre,apellidos,fecha_nacimiento,categoria,grupo_id,estado,fecha_prueba_fin,sexo,email,email_tutor,telefono_tutor,nombre_tutor')
      .neq('estado', 'baja').order('apellidos');
    if (a.error) { CARGA_ERROR = 'No se han podido leer los atletas (' + (a.error.message || 'sin conexión') + ').'; }
    else if (a.data) { ATLETAS = a.data; ATLETAS.forEach(function (x) { AMAP[x.id] = x; }); }

    /* En qué grupos entrena cada uno. Tiene que estar cargado ANTES de
       armar ninguna lista: es lo que decide quién sale en cada una. */
    try {
      var m = await sb.from('atleta_grupos').select('atleta_id,grupo_id');
      if (!m.error && m.data) {
        m.data.forEach(function (x) { (MIEMBROS[x.atleta_id] = MIEMBROS[x.atleta_id] || {})[x.grupo_id] = true; });
      }
    } catch (e) {}

    /* Quién está usando el panel: se guarda como autor de las notas. */
    try {
      var s = await sb.auth.getSession();
      if (s && s.data && s.data.session) YO = s.data.session.user.id;
    } catch (e) {}
    try {
      var p = await sb.from('perfiles').select('id,nombre,apellidos');
      if (!p.error && p.data) p.data.forEach(function (x) { PERSONAS[x.id] = [x.nombre, x.apellidos].filter(Boolean).join(' '); });
    } catch (e) {}

    /* La lista de HOY de todos los grupos que entrenan hoy. Hace falta antes
       de pintar nada: es lo que permite decir en cada grupo plegado cuánto
       lleva marcado, y sobre todo saber DÓNDE QUEDA TRABAJO para abrir ese y
       no otro. */
    try {
      var ids = [], gids = [];
      gruposDeHoy().forEach(function (g) { gids.push(g.id); atletasDeGrupo(g.id).forEach(function (a) { ids.push(a.id); }); });
      /* El cajón de cada grupo se abre aunque venga vacío: así «vacío» quiere
         decir «hoy no hay nada marcado» y no «esto no se ha llegado a leer». */
      gids.forEach(function (g) { HOY_POR_GRUPO[g] = {}; });
      if (ids.length) {
        /* Se pide solo la asistencia DE ESTOS GRUPOS. Hay quien entrena dos
           veces el mismo día con dos grupos distintos, y desde el curso pasado
           esas son dos marcas separadas: sin nombrar el grupo aquí se leería la
           del otro entrenador y esta pantalla diría que ya está pasada. */
        var r = await sb.from('asistencia').select('atleta_id,fecha,presente,grupo_id')
          .in('atleta_id', ids).in('grupo_id', gids).eq('fecha', fechaHoy());
        /* Se guarda POR GRUPO, no solo por persona. Quien hace la escuela a
           primera hora y fuerza a segunda tiene hoy dos marcas distintas: si
           se metieran las dos en el mismo cajón, la última pisaría a la otra
           y uno de los dos grupos plegados diría un recuento que no es. */
        if (!r.error && r.data) r.data.forEach(function (x) {
          (ASIS[x.atleta_id] = ASIS[x.atleta_id] || {})[x.fecha] = !!x.presente;
          (HOY_POR_GRUPO[x.grupo_id] = HOY_POR_GRUPO[x.grupo_id] || {})[x.atleta_id] = !!x.presente;
        });
      }
    } catch (e) {}
  }

  /* ============================================================
     Qué grupo se abre solo
     ------------------------------------------------------------
     «Un solo grupo abierto, el que toca ahora». Pero cuando ya no
     hay ninguno «ahora», la pregunta cambia: pasa a ser dónde
     queda trabajo por hacer. Por orden:
       1. el que está entrenando ahora mismo
       2. si no, el siguiente que empieza hoy
       3. si ya han pasado todos, el MÁS TEMPRANO que aún tenga
          gente sin marcar — ahí es donde queda trabajo
       4. si está todo pasado, ninguno: abrir un entreno terminado
          no aporta nada y hace dudar de si falta algo
     ============================================================ */
  function grupoQueToca() {
    var hoyG = gruposDeHoy().filter(function (g) { return atletasDeGrupo(g.id).length; });
    if (!hoyG.length) return null;
    var enMarcha = hoyG.filter(function (g) { return momentoDe(g.id) === 'ahora'; });
    if (enMarcha.length) return enMarcha[0];
    var porLlegar = hoyG.filter(function (g) { return momentoDe(g.id) === 'antes'; });
    if (porLlegar.length) return porLlegar[0];
    var pendientes = hoyG.filter(function (g) { return cuentaGrupo(g.id).sinMarcar > 0; });
    if (pendientes.length) return pendientes[0];
    return null;
  }

  /* Qué trozo de calendario hace falta tener cargado: el mes de la lista, el
     mes de la semana que se esté mirando y la propia semana. De un tirón, para
     que el recuento «7 / 8» cuente el mes entero y no solo lo que se vea. */
  function primeroDelMes(f) { return (f || fechaHoy()).slice(0, 8) + '01'; }
  function rangoNecesario() {
    var f = LST.fecha || fechaHoy();
    var sem = semanaDe(SEMANA);
    var candidatos = [primeroDelMes(f), primeroDelMes(sem.hasta), sem.desde];
    var desde = candidatos.sort()[0];
    var hasta = [f, sem.hasta].sort().pop();
    return { desde: desde, hasta: hasta };
  }

  /* Trae la asistencia YA GUARDADA de un grupo entre dos fechas y la deja en
     ASIS. Se pide de golpe el mes entero porque con ella se pinta el recuento
     de la ficha y la rejilla de la semana. */
  async function cargarAsistencia(gid, desde, hasta) {
    var ids = atletasDeGrupo(gid).map(function (a) { return a.id; });
    if (!ids.length) return true;
    /* Del grupo que se está mirando y de ningún otro: la misma persona puede
       tener otra marca ese día con otro grupo, y no es esta. */
    var r = await sb.from('asistencia').select('atleta_id,fecha,presente')
      .in('atleta_id', ids).eq('grupo_id', gid).gte('fecha', desde).lte('fecha', hasta);
    if (r.error) return false;
    ids.forEach(function (id) { ASIS[id] = ASIS[id] || {}; });
    /* se limpia el tramo pedido antes de rellenarlo, para no dejar restos */
    ids.forEach(function (id) {
      Object.keys(ASIS[id]).forEach(function (f) { if (f >= desde && f <= hasta) delete ASIS[id][f]; });
    });
    (r.data || []).forEach(function (x) { (ASIS[x.atleta_id] = ASIS[x.atleta_id] || {})[x.fecha] = !!x.presente; });
    return true;
  }

  /* ============================================================
     2 · No perder marcas · el corazón de esta pantalla
     ------------------------------------------------------------
     Tres redes, y las tres tienen que seguir puestas:
       1. Al cambiar de grupo o de día se avisa y se guarda.
       2. Cada toque deja copia en el propio móvil (por si se
          cierra la pestaña o se queda sin batería).
       3. Si se cierra la ventana, el navegador pregunta.
     ============================================================ */
  var BORRADOR = 'apolana.lista.panel';
  function guardarBorrador() {
    try {
      var m = {};
      Object.keys(LST.marcas).forEach(function (id) { m[id] = (LST.marcas[id] === undefined ? null : LST.marcas[id]); });
      localStorage.setItem(BORRADOR, JSON.stringify({ grupo: LST.grupo, fecha: LST.fecha, marcas: m }));
    } catch (e) {}
  }
  function borrarBorrador() { try { localStorage.removeItem(BORRADOR); } catch (e) {} }
  function leerBorrador() { try { return JSON.parse(localStorage.getItem(BORRADOR) || 'null'); } catch (e) { return null; } }
  /* Devuelve true si había copia de ESTE grupo y ESTE día con algo distinto
     de lo guardado. */
  function recuperarBorrador() {
    var b = leerBorrador();
    if (!b || b.grupo !== LST.grupo || b.fecha !== LST.fecha || !b.marcas) return false;
    var distinto = false;
    Object.keys(b.marcas).forEach(function (id) {
      var v = (b.marcas[id] === null ? undefined : b.marcas[id]);
      if (LST.marcas[id] !== v) { LST.marcas[id] = v; distinto = true; }
    });
    return distinto;
  }

  /* Salir de la lista (cambiar de grupo, cambiar de día, abrir otra cosa) sin
     perder nada: si hay marcas sin guardar no se tira nada por la borda, se
     guarda. Guardar en vez de descartar porque a pie de pista el error caro es
     perder la lista, nunca guardarla de más: una marca de sobra se corrige en
     dos toques, una lista perdida hay que repetirla entera. */
  var PREGUNTA = null;     /* la pregunta que ya está en pantalla */
  async function puedoSalirDeLaLista() {
    if (!LST.sucio) return true;
    /* Si ya hay una pregunta abierta se espera a ESA. Dos ventanas encima de
       la otra dejan la pantalla bloqueada, y aquí eso significa un entrenador
       de pie sin poder pasar lista. */
    if (PREGUNTA) return await PREGUNTA;
    PREGUNTA = (async function () {
      var ok = window.apoConfirm ? await window.apoConfirm({
        titulo: 'Tienes marcas sin guardar',
        texto: 'Has marcado a alguien y todavía no se ha guardado. Si sales ahora se perdería.',
        confirmar: 'Guardar y salir',
        cancelar: 'Seguir en la lista'
      }) : true;
      if (!ok) return false;
      return await guardarLista();
    })();
    try { return await PREGUNTA; } finally { PREGUNTA = null; }
  }

  /* Última red: si se cierra la pestaña o se sale del panel con marcas sin
     guardar, el navegador pregunta antes de tirarlas. */
  window.addEventListener('beforeunload', function (e) {
    if (LST.grupo && LST.sucio) { e.preventDefault(); e.returnValue = ''; return ''; }
  });

  function marcar(id, valor) {
    /* Mientras se está leyendo la lista de ese día no se puede marcar: lo que
       llegue de la base pisaría la marca y se perdería sin decir nada. */
    if (LST.cargando) return;
    LST.marcas[id] = valor;
    LST.sucio = true; LST.guardadoEn = ''; LST.version++;
    guardarBorrador();
  }
  function girar(id) {
    var v = LST.marcas[id];
    marcar(id, v === undefined ? true : v === true ? false : undefined);
  }

  /* Devuelve true solo si TODO ha quedado escrito en la base.

     ⚠️ LA LISTA SE MANDA ENTERA A `apo_pasar_lista` Y NO SE ESCRIBE A MANO.
     Antes esta pantalla guardaba y borraba diciendo «esta persona, este día»,
     sin nombrar el grupo. El chaval que hace la escuela a primera hora y fuerza
     a segunda solo cabía en una lista: el segundo entrenador que guardaba se
     llevaba por delante la marca del primero, y desmarcarlo borraba las dos.
     La función de la base solo sabe tocar las marcas DE SU GRUPO, así que
     desde aquí ya no se puede pisar la lista de otro (migración 113). */
  async function guardarLista() {
    if (LST.guardando) return false;                 /* dos toques seguidos = un solo guardado */
    if (LST.cargando || !LST.grupo) return true;
    var atls = atletasDeGrupo(LST.grupo);
    var fecha = LST.fecha || fechaHoy();
    /* `true`/`false` = vino / no vino · `null` = quítale la marca.
       De quien no venga aquí no se dice nada, y no se le toca. */
    var marcas = {}, nMarcadas = 0, nQuitadas = 0;
    atls.forEach(function (a) {
      var v = LST.marcas[a.id];
      if (v === undefined) {
        if (LST.guardadas[a.id]) { marcas[a.id] = null; nQuitadas++; }
      } else {
        marcas[a.id] = v; nMarcadas++;
      }
    });
    if (!nMarcadas && !nQuitadas) {
      if (window.apoToast) window.apoToast('Todavía no has marcado a nadie.', 'info');
      return false;
    }
    LST.guardando = true; LST.error = '';
    var version0 = LST.version;   /* por si se marca a alguien más mientras se guarda */
    pintar();
    try {
      var r = await sb.rpc('apo_pasar_lista', { p_grupo: LST.grupo, p_fecha: fecha, p_marcas: marcas });
      if (r.error) throw r.error;
      /* Lo que devuelve es la lista de ese grupo y ese día TAL COMO HA QUEDADO
         guardada. Se cree eso y no lo que había en pantalla: si otro entrenador
         tocó algo a la vez, aquí se ve al momento en vez de dentro de un mes. */
      var guardado = r.data || {};
      LST.guardadas = {};
      Object.keys(marcas).forEach(function (id) { if (ASIS[id]) delete ASIS[id][fecha]; });
      Object.keys(guardado).forEach(function (id) {
        LST.guardadas[id] = true;
        (ASIS[id] = ASIS[id] || {})[fecha] = !!guardado[id];
      });
      /* Y el recuento de este grupo para cuando se pliegue: si no, al pasar
         al siguiente grupo el que se acaba de cerrar diría lo de antes. */
      if (fecha === fechaHoy()) {
        var caja = HOY_POR_GRUPO[LST.grupo] = {};
        Object.keys(guardado).forEach(function (id) { caja[id] = !!guardado[id]; });
      }
      LST.sucio = (LST.version !== version0);   /* si tocó algo mientras tanto, sigue pendiente */
      LST.guardadoEn = LST.sucio ? '' : new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      LST.guardando = false;
      if (LST.sucio) guardarBorrador(); else borrarBorrador();
      pintar();
      /* Se cuenta sobre lo guardado, no sobre lo que se acaba de mandar: el
         recuento tiene que ser el del día entero de ese grupo. */
      var pres = Object.keys(guardado).filter(function (id) { return guardado[id]; }).length;
      if (window.apoToast) window.apoToast('Lista guardada · ' + pres + ' de ' + atls.length + ' han venido', 'ok');
      return !LST.sucio;
    } catch (e) {
      LST.guardando = false;
      LST.error = 'NO se ha guardado: ' + ((e && e.message) || e) + '. Las marcas siguen aquí: comprueba la conexión y vuelve a darle a «Guardar lista».';
      pintar();
      if (window.apoToast) window.apoToast('No se ha guardado. Las marcas siguen en pantalla, vuelve a intentarlo.', 'error');
      return false;
    }
  }

  /* ============================================================
     3 · Abrir un grupo (y un día)
     ============================================================ */
  /* Devuelve true solo si de verdad se ha cambiado de grupo o de día. Si el
     entrenador dice «seguir en la lista», se queda TODO como estaba: ni se
     suelta el grupo abierto ni se pierde una marca. */
  async function abrirGrupo(gid, fecha) {
    var f = fecha || fechaHoy();
    if (gid === LST.grupo && f === LST.fecha) return true;
    if (!(await puedoSalirDeLaLista())) return false;
    LST.grupo = gid;
    LST.fecha = f;
    LST.marcas = {}; LST.guardadas = {}; LST.sucio = false; LST.guardadoEn = ''; LST.error = '';
    AUSENCIAS = {}; NOTAS_HOY = {}; LST.cargando = true;
    pintar();

    var ids = atletasDeGrupo(gid).map(function (a) { return a.id; });
    if (ids.length) {
      var r = rangoNecesario();
      var ok = await cargarAsistencia(gid, r.desde, r.hasta);
      if (!ok) {
        /* Si no se ha podido leer lo ya guardado hay que decirlo: si no, el
           entrenador vería la lista en blanco y creería que nadie está pasado. */
        LST.error = 'No se ha podido leer la lista guardada de este día. Vuelve a entrar en el grupo antes de marcar, para no pisar lo que ya hubiera.';
      } else {
        ids.forEach(function (id) {
          var v = ASIS[id] && ASIS[id][LST.fecha];
          if (v !== undefined) { LST.marcas[id] = v; LST.guardadas[id] = true; }
        });
      }
      try {
        var au = await sb.from('ausencias').select('atleta_id,motivo,avisado_por_nombre').eq('fecha', LST.fecha).in('atleta_id', ids);
        if (!au.error && au.data) au.data.forEach(function (r) {
          AUSENCIAS[r.atleta_id] = r;
          /* La falta avisada por la familia se deja PREPARADA como falta, pero
             sin guardar todavía: hasta que no se le da a Guardar no hay fila.
             No cuenta como «cambio sin guardar»: no es trabajo del entrenador
             y se vuelve a preparar sola la próxima vez que entre. */
          if (LST.marcas[r.atleta_id] === undefined) LST.marcas[r.atleta_id] = false;
        });
      } catch (e) {}
      await cargarNotasDia(ids, LST.fecha);
    }
    if (recuperarBorrador()) {
      LST.sucio = true;
      LST.error = 'Se han recuperado las marcas que quedaron sin guardar en este móvil. Repásalas y dale a «Guardar lista».';
    }
    LST.cargando = false;
    pintar();
    return true;
  }

  /* ============================================================
     4 · Cuentas
     ============================================================ */
  /* «11 marcados de 14», y en singular cuando toca: la pantalla la lee gente,
     no un programa. */
  function marcadosDe(c) { return (c.marcados === 1 ? '1 marcado de ' : c.marcados + ' marcados de ') + c.total; }
  function atletasTxt(n) { return n === 1 ? '1 atleta' : n + ' atletas'; }

  function cuentaGrupo(gid) {
    var atls = atletasDeGrupo(gid);
    var marcados = 0, presentes = 0;
    atls.forEach(function (a) {
      /* Del grupo abierto manda lo que hay en pantalla. De los plegados, lo
         de HOY de ESE grupo, que es lo único que se ha cargado de ellos y lo
         único que no confunde a quien entrena dos veces el mismo día. */
      var dia = LST.fecha || fechaHoy();
      var hoy = (dia === fechaHoy()) ? HOY_POR_GRUPO[gid] : null;
      var v = (gid === LST.grupo) ? LST.marcas[a.id]
            : hoy ? hoy[a.id]
            : (ASIS[a.id] ? ASIS[a.id][dia] : undefined);
      if (v !== undefined) { marcados++; if (v) presentes++; }
    });
    return { total: atls.length, marcados: marcados, presentes: presentes, sinMarcar: atls.length - marcados };
  }

  /* Asistencia del mes de un atleta: «7 / 8» son los días con lista pasada,
     no un porcentaje. A pie de pista se necesita el dato, no el análisis. */
  function mesDe(atletaId, fechaRef) {
    var ref = fechaRef || LST.fecha || fechaHoy();
    var d1 = ref.slice(0, 8) + '01';
    var f = ASIS[atletaId] || {};
    var vino = 0, falto = 0, faltas = [];
    Object.keys(f).forEach(function (fe) {
      if (fe < d1 || fe > ref) return;
      if (f[fe]) vino++; else { falto++; faltas.push(deISO(fe).getDate()); }
    });
    faltas.sort(function (a, b) { return a - b; });
    return { vino: vino, dias: vino + falto, faltas: faltas };
  }
  function frasePorFaltas(m) {
    if (!m.dias) return 'todavía no se ha pasado lista este mes';
    if (!m.faltas.length) return 'no ha faltado ningún día';
    if (m.faltas.length === 1) return 'solo faltó el día ' + m.faltas[0];
    if (m.faltas.length === 2) return 'faltó los días ' + m.faltas[0] + ' y ' + m.faltas[1];
    return 'faltó ' + m.faltas.length + ' días';
  }

  /* ============================================================
     5 · La fila · tres estados y un chevron para la ficha
     ============================================================ */
  function subLinea(a) {
    /* Máximo una línea debajo del nombre, y la que más falta hace saber
       antes de mandar una serie. */
    var av = AUSENCIAS[a.id];
    if (av) return 'Avisó la familia' + (av.motivo ? ' · ' + av.motivo : '');
    if (a.estado === 'lesionado') return ella(a) ? 'Lesionada' : 'Lesionado';
    if (a.estado === 'prueba') {
      if (!a.fecha_prueba_fin) return 'En periodo de prueba';
      var q = diasHasta(a.fecha_prueba_fin);
      if (q < 0) return 'En prueba · se pasó el plazo';
      if (q === 0) return 'En prueba · acaba hoy';
      if (q === 1) return 'En prueba · acaba mañana';
      if (q <= 7) return 'En prueba · acaba el ' + DIAS[deISO(a.fecha_prueba_fin).getDay()];
      return 'En prueba · acaba el ' + fechaCorta(a.fecha_prueba_fin);
    }
    return '';
  }
  function diasHasta(fISO) {
    var a = deISO(fechaHoy()), b = deISO(fISO);
    return Math.round((b - a) / 86400000);
  }

  function filaAtleta(a) {
    var v = LST.marcas[a.id];
    var sub = subLinea(a);
    var clase = v === true ? 'at--vino' : v === false ? 'at--falta' : (sub && !AUSENCIAS[a.id] ? 'at--aviso' : 'at--sin');
    if (v === undefined && AUSENCIAS[a.id]) clase = 'at--aviso';
    var cir = v === true ? VISTO
            : v === false ? CRUZ('var(--f-sub)')
            : (clase === 'at--aviso' ? OJO('var(--f-ambar)') : '');
    var meta = v === true ? anoNac(a) : v === false ? 'no ha venido' : 'sin marcar';
    var dice = v === true ? 'ha venido' : v === false ? 'no ha venido' : 'sin marcar';
    return '<div class="at ' + clase + '" data-fila="' + esc(a.id) + '">' +
      '<button type="button" class="at-tog" data-girar="' + esc(a.id) + '" aria-label="' + esc(nombreDe(a) + ': ' + dice + '. Tocar para cambiar') + '">' +
        '<span class="at-cir">' + cir + '</span>' +
        '<span class="at-txt"><span class="at-nom">' + esc(nombreCorto(a)) + '</span>' +
          (sub ? '<span class="at-sub">' + esc(sub) + '</span>' : '') + '</span>' +
        '<span class="at-meta">' + esc(meta) + '</span>' +
      '</button>' +
      '<button type="button" class="at-ficha" data-ficha="' + esc(a.id) + '" aria-label="' + esc('Abrir la ficha de ' + nombreDe(a)) + '">' + IC_ENTRAR + '</button>' +
    '</div>';
  }

  /* Bloques con la forma del dato mientras llega: la pantalla no salta y,
     sobre todo, no hay filas falsas que se puedan pulsar. */
  function esqueleto(n) {
    var h = '';
    for (var i = 0; i < n; i++) h += '<div class="at at--sin" style="align-items:center;padding:0 15px">' +
      '<span class="at-cir"></span><span class="adm-esq adm-esq--medio" style="flex:1;margin-left:13px"></span></div>';
    return '<div class="at-lista" aria-live="polite" aria-label="Cargando la lista">' + h + '</div>';
  }

  function engancharFilas(raiz) {
    raiz.querySelectorAll('[data-girar]').forEach(function (b) {
      b.addEventListener('click', function () { girar(b.getAttribute('data-girar')); pintar(); });
    });
    raiz.querySelectorAll('[data-ficha]').forEach(function (b) {
      b.addEventListener('click', function () { abrirFicha(b.getAttribute('data-ficha')); });
    });
  }

  /* ============================================================
     6 · MÓVIL · pasar lista
     ============================================================ */
  function pintarMovil() {
    if (PANTALLA === 'ficha' && FICHA) { pintarFichaMovil(); return; }

    var hoy = LST.fecha || fechaHoy();
    var h = '<div class="p-movil"><div class="p-cab">' +
      '<span class="p-fecha">' + esc(fechaLarga(hoy)) + (horaAhora() ? ' · ' + horaAhora() : '') + '</span>' +
      '<h1>En la pista</h1></div><div class="p-cuerpo">';

    h += buscadorHTML();

    if (CARGA_ERROR) h += '<p class="p-error">' + esc(CARGA_ERROR) + '</p>';
    if (LST.error) h += '<p class="p-error">' + esc(LST.error) + '</p>';

    if (BUSCA.length >= 2) {
      h += resultadosBusquedaHTML();
    } else {
      h += cuerpoGruposHTML();
    }
    h += '</div>' + barraHTML() + '</div>';
    RAIZ.innerHTML = h;
    engancharComunes();
  }

  function horaAhora() {
    if ((LST.fecha || fechaHoy()) !== fechaHoy()) return '';
    return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }

  function buscadorHTML() {
    return '<div class="p-buscar">' + IC_BUSCAR +
      '<input id="p-q" type="search" placeholder="Buscar un atleta" autocomplete="off" value="' + esc(BUSCA) + '" aria-label="Buscar un atleta">' +
      (BUSCA ? '<button type="button" id="p-q-x" aria-label="Quitar la búsqueda">Quitar</button>' : '') + '</div>';
  }

  function resultadosBusquedaHTML() {
    var f = norm(BUSCA);
    var lista = ATLETAS.filter(function (a) { return norm(nombreDe(a)).indexOf(f) > -1; }).slice(0, 30);
    if (!lista.length) return '<p class="p-vacio">Nadie con ese nombre. Si es de prueba, quizá aún no está dado de alta.</p>';
    return '<div class="at-lista">' + lista.map(function (a) {
      /* Se dicen TODOS sus grupos: quien entrena dos veces al día sale una
         sola vez en el buscador, y hay que ver de cuál de las dos listas
         se le está sacando. */
      var suyos = nombresDeSusGrupos(a);
      return '<div class="at at--sin">' +
        '<button type="button" class="at-tog" data-ficha="' + esc(a.id) + '">' +
          '<span class="at-cir">' + (estaEn(a, LST.grupo) ? OJO('var(--f-sub)') : '') + '</span>' +
          '<span class="at-txt"><span class="at-nom">' + esc(nombreDe(a)) + '</span>' +
          '<span class="at-sub" style="color:var(--f-sub)">' + esc(suyos || 'sin grupo') + '</span></span>' +
        '</button>' +
        '<button type="button" class="at-ficha" data-ficha="' + esc(a.id) + '" aria-label="' + esc('Abrir la ficha de ' + nombreDe(a)) + '">' + IC_ENTRAR + '</button>' +
      '</div>';
    }).join('') + '</div>';
  }

  function cuerpoGruposHTML() {
    var hoyG = gruposDeHoy();
    var abierto = LST.grupo ? GMAP[LST.grupo] : null;
    var h = '';

    if (abierto) {
      var c = cuentaGrupo(abierto.id);
      var hora = horaDelDia(abierto.id, dowDe(LST.fecha || fechaHoy()));
      h += '<div class="g-abierto"><div class="g-cab"><h2>' + esc(abierto.nombre) + '</h2>' +
        (hora ? '<span class="g-hora">' + esc(hora) + '</span>' : '') +
        '<span class="g-cuenta">' + (c.total ? marcadosDe(c) : 'sin atletas') + '</span></div>';
      var atls = atletasDeGrupo(abierto.id);
      if (LST.cargando) {
        h += esqueleto(Math.min(atls.length || 3, 6));
      } else if (!atls.length) {
        h += '<p class="p-vacio">Este grupo no tiene atletas en activo. Se dan de alta en Personas → Atletas.</p>';
      } else {
        h += '<div class="at-lista">' + atls.map(filaAtleta).join('') + '</div>' +
             '<span class="at-pie">' + atletasTxt(atls.length) + ' · ' +
             (c.sinMarcar ? c.sinMarcar + ' sin marcar' : 'todos marcados') + '</span>';
      }
      h += '</div>';
    }

    /* Los demás grupos, plegados, con su hora. Un entrenador lleva un grupo a
       la vez: enseñar los tres abiertos es obligarle a buscar.
       Solo salen los grupos en los que se ve gente: un entrenador ve los
       nombres de los 27 grupos del club pero solo los atletas que lleva él, y
       una lista de 26 «sin atletas» no sirve para nada. */
    var conGente = function (g) { return atletasDeGrupo(g.id).length > 0; };
    var vacios = GRUPOS.filter(function (g) { return !conGente(g); }).length;
    var restoHoy = hoyG.filter(function (g) { return g.id !== LST.grupo && conGente(g); });
    var otros = GRUPOS.filter(function (g) { return g.id !== LST.grupo && hoyG.indexOf(g) === -1 && conGente(g); });

    if (restoHoy.length) {
      h += '<div class="g-plegados"><span class="g-et">' +
        (abierto ? 'También entrenan hoy' : 'Entrenan hoy') + '</span>' +
        restoHoy.map(function (g) { return grupoPlegadoHTML(g, true); }).join('') + '</div>';
    }
    if (!abierto) {
      var hoyConGente = hoyG.filter(conGente);
      if (!hoyConGente.length) {
        h += '<p class="p-vacio">Hoy no tiene entrenamiento ningún grupo tuyo con horario fijo. Abre abajo el que necesites.</p>';
      } else if (!hoyConGente.some(function (g) { return cuentaGrupo(g.id).sinMarcar > 0; })) {
        /* No se abre ninguno a propósito: abrir un entreno terminado no aporta
           nada y hace dudar de si falta algo. */
        h = '<p class="p-vacio">Todo pasado hoy. Los entrenamientos de hoy tienen su lista completa.</p>' + h;
      }
    }
    if (otros.length) {
      h += '<div class="g-plegados"><span class="g-et">El resto de grupos</span>' +
        otros.map(function (g) { return grupoPlegadoHTML(g, false); }).join('') + '</div>';
    }
    if (vacios) h += '<span class="at-pie">Hay ' + vacios + (vacios === 1 ? ' grupo más sin atletas.' : ' grupos más sin atletas.') + '</span>';
    return h;
  }

  /* Qué días entrena un grupo, para los que hoy no tocan: «lun · mié · vie». */
  function diasDeGrupo(gid) {
    var d = {};
    horariosDe(gid).forEach(function (h) { d[h.dia_semana] = true; });
    var o = Object.keys(d).map(Number).sort(function (a, b) { return a - b; });
    return o.map(function (n) { return DIAS_CORTO[n === 7 ? 0 : n]; }).join(' · ');
  }

  function grupoPlegadoHTML(g, esHoy) {
    var dow = dowDe(LST.fecha || fechaHoy());
    var hora = horaDelDia(g.id, dow);
    var c = cuentaGrupo(g.id);
    var estado, pendiente = false;
    if (!esHoy) {
      /* Hoy no le toca: decir cuándo entrena es más útil que «sin empezar». */
      estado = c.total === 0 ? 'sin atletas' : (diasDeGrupo(g.id) || 'sin horario fijo');
    } else if (c.total === 0) {
      estado = 'sin atletas';
    } else if (c.marcados === c.total) {
      estado = 'lista pasada';
    } else {
      var m = momentoDe(g.id);
      if (m === 'despues') {
        /* Un entreno de hace diez horas al que nadie pasó lista NO está «sin
           empezar»: está sin pasar lista, y eso es trabajo pendiente. */
        estado = c.marcados === 0 ? 'sin pasar lista' : marcadosDe(c);
        pendiente = true;
      } else if (m === 'ahora') {
        estado = c.marcados === 0 ? 'entrenando ahora' : marcadosDe(c);
      } else {
        estado = c.marcados === 0 ? 'sin empezar' : marcadosDe(c);
      }
    }
    return '<button type="button" class="g-pleg" data-grupo="' + esc(g.id) + '">' +
      '<span class="n">' + esc(g.nombre) + '</span>' +
      '<span class="e' + (pendiente ? ' pend' : '') + '">' + (esHoy && hora ? esc(hora) + ' · ' : '') + esc(estado) + '</span>' +
      '<span class="v"></span></button>';
  }

  function barraHTML() {
    /* Sin grupo abierto no hay nada que guardar: la barra sobra. */
    if (!LST.grupo) return '';
    var c = cuentaGrupo(LST.grupo);
    var estado, clase = '';
    if (LST.sucio) { estado = 'Cambios sin guardar'; clase = 'sucio'; }
    else if (LST.guardadoEn) { estado = 'Guardado a las ' + LST.guardadoEn; clase = 'ok'; }
    else if (c.marcados === 0) { estado = 'Todavía no has marcado a nadie.'; }
    else { estado = marcadosDe(c); }
    return '<div class="p-barra">' +
      '<span class="p-estado ' + clase + '">' + esc(estado) + '</span>' +
      '<div class="p-bots">' +
        '<button type="button" class="b-borde" id="p-todos" aria-label="Marcar como que han venido los que quedan sin marcar">Todos</button>' +
        '<button type="button" class="b-azul" id="p-guardar"' + (LST.guardando ? ' disabled' : '') + '>' +
          (LST.guardando ? 'Guardando…' : 'Guardar lista') + '</button>' +
      '</div></div>';
  }

  /* «Todos» resuelve los que quedan sin marcar, no pisa lo ya decidido, y se
     puede deshacer: casi siempre vienen todos y marcarlos de uno en uno es el
     rato más tonto del entrenamiento. */
  function todosLosQueQuedan() {
    if (!LST.grupo) return;
    var atls = atletasDeGrupo(LST.grupo);
    var tocados = atls.filter(function (a) { return LST.marcas[a.id] === undefined; });
    if (!tocados.length) {
      if (window.apoToast) window.apoToast('Ya están todos marcados.', 'info');
      return;
    }
    tocados.forEach(function (a) { marcar(a.id, true); });
    pintar();
    if (window.apoToast) window.apoToast(tocados.length + (tocados.length === 1 ? ' marcado' : ' marcados') + ' como que han venido', 'ok', {
      deshacer: function () {
        tocados.forEach(function (a) { marcar(a.id, undefined); });
        pintar();
      }
    });
  }

  /* ============================================================
     7 · MÓVIL · ficha del atleta
     ============================================================ */
  async function abrirFicha(id) {
    var a = AMAP[id];
    if (!a) return;
    /* Si no está en la lista abierta, primero se abre una de las suyas (con
       su aviso de guardar): así marcarle desde la ficha guarda donde tiene
       que guardar. Si entrena en varios, se abre el principal, que es el
       que la ficha enseña primero. */
    if (!estaEn(a, LST.grupo)) {
      var suyo = gruposDe(a)[0];
      if (suyo) {
        await abrirGrupo(suyo, LST.fecha || fechaHoy());
        if (LST.grupo !== suyo) return;   /* se quedó en la lista */
      }
    }
    FICHA = a; PANTALLA = 'ficha'; NOTAS_AT = [];
    BUSCA = '';
    pintar();
    try {
      var r = await sb.from('notas_atleta').select('id,atleta_id,texto,tipo,fecha,autor_id,created_at')
        .eq('atleta_id', id).order('created_at', { ascending: false }).limit(3);
      if (!r.error && r.data) { NOTAS_AT = r.data; pintar(); }
    } catch (e) {}
  }
  function cerrarFicha() { FICHA = null; PANTALLA = esEscritorio() ? 'lista' : 'lista'; pintar(); window.scrollTo(0, 0); }

  function fichaCuerpoHTML(a) {
    var v = LST.marcas[a.id];
    var m = mesDe(a.id);
    var sub = subLinea(a);
    var h = '';

    h += '<div class="f-dos">' +
      '<button type="button" data-marcar="vino" class="' + (v === true ? 'sel-vino' : '') + '">' +
        (v === true ? VISTO : ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 2.4)) + 'Ha venido</button>' +
      '<button type="button" data-marcar="falta" class="' + (v === false ? 'sel-falta' : '') + '">No ha venido</button>' +
    '</div>';
    if (v !== undefined) h += '<button type="button" class="f-quitar" data-marcar="quitar">Quitar la marca</button>';

    var malMes = m.dias >= 4 && m.vino * 2 < m.dias;
    var claseMes = !m.dias ? 'gris' : malMes ? 'mal' : '';
    h += '<div class="f-bloque"><span class="f-et">Asistencia este mes</span>' +
      '<div class="f-cifra"><b>' + m.vino + ' / ' + m.dias + '</b>' +
      '<span class="' + claseMes + '">' + esc(frasePorFaltas(m)) + '</span></div></div>';

    /* Bloque ámbar si la prueba se acaba: es una decisión que hay que tomar
       con la familia y aquí lleva sus dos botones. */
    if (a.estado === 'prueba') {
      var q = a.fecha_prueba_fin ? diasHasta(a.fecha_prueba_fin) : null;
      var cuando = q === null ? 'sin fecha de fin'
        : q < 0 ? 'se pasó el plazo el ' + fechaCorta(a.fecha_prueba_fin)
        : q === 0 ? 'acaba hoy'
        : q === 1 ? 'acaba mañana'
        : q <= 7 ? 'acaba el ' + DIAS[deISO(a.fecha_prueba_fin).getDay()]
        : 'acaba el ' + fechaCorta(a.fecha_prueba_fin);
      h += '<div class="f-ambar"><span class="t">La prueba ' + esc(cuando) + '</span>' +
        '<span class="x">Hay que hablar con la familia y decirles si se queda.</span>' +
        '<div class="a"><button type="button" class="b-ambar" id="f-queda">Se queda</button>' +
        botonFamiliaHTML(a, 'b-fino') + '</div></div>';
    }

    var n = NOTAS_AT[0];
    h += '<div class="f-bloque"><span class="f-et">Observaciones</span>' +
      (n ? '<p class="f-nota">' + esc(n.texto) + '</p><span class="f-nota-quien">' + esc(autorTexto(n)) + ' · ' + esc(fechaCorta(n.fecha)) + '</span>'
         : '<p class="f-nota" style="color:var(--f-sub)">Todavía no hay nada apuntado.</p>') +
      '<div class="a" style="display:flex;gap:9px;flex-wrap:wrap"><button type="button" class="b-fino" id="f-nota">Apuntar una observación</button>' +
      (a.estado !== 'prueba' ? botonFamiliaHTML(a, 'b-fino') : '') + '</div></div>';

    h += '<div class="f-privado">' + IC_CANDADO +
      '<span>Las observaciones y el contacto de la familia solo los ve el equipo técnico. El atleta y su familia no los ven en su portal.</span></div>';
    return h;
  }

  function correoFamilia(a) { return a.email_tutor || a.email || ''; }
  function botonFamiliaHTML(a, clase) {
    var c = correoFamilia(a);
    if (!c) return '<span class="f-nota-quien">No tenemos el correo de la familia. Se apunta en Personas → Atletas.</span>';
    var asunto = 'Club Atletismo Apolana · ' + nombreDe(a);
    return '<a class="' + clase + '" href="mailto:' + esc(c) + '?subject=' + encodeURIComponent(asunto) + '">Escribir a la familia</a>';
  }

  function pintarFichaMovil() {
    var a = FICHA;
    var sub = subLinea(a);
    /* El botón de volver dice la lista ABIERTA, no «su grupo»: quien entrena
       en dos tiene dos, y volver al que no era descoloca. */
    var g = GMAP[LST.grupo] || GMAP[a.grupo_id];
    var h = '<div class="p-movil"><div class="f-cab">' +
      /* El botón dice adónde vuelve: al grupo del que salió la ficha. En el
         móvil ponía «Volver» a secas y había que pulsarlo para saberlo. */
      '<button type="button" class="f-volver" id="f-atras">' + IC_ATRAS +
        '<span>' + esc(g ? g.nombre : 'En la pista') + '</span></button>' +
      '<div class="f-quien"><span class="f-av">' + esc(iniciales(a)) + '</span>' +
        '<div style="min-width:0"><h1>' + esc(nombreDe(a)) + '</h1>' +
        '<span class="f-sub' + (sub ? '' : ' gris') + '">' + esc(sub || (anoNac(a) ? anoNac(a) + (a.categoria ? ' · ' + a.categoria : '') : (a.categoria || ''))) + '</span></div>' +
      '</div></div><div class="p-cuerpo">' + fichaCuerpoHTML(a) + '</div>' +
      '<div class="p-barra"><div class="p-bots">' +
        '<button type="button" class="b-azul" id="f-volver2">← ' + esc(g ? g.nombre : 'En la pista') + '</button>' +
      '</div></div></div>';
    RAIZ.innerHTML = h;
    engancharComunes();
  }

  /* ============================================================
     8 · ESCRITORIO · repasar la semana, sentado
     ============================================================ */
  function semanaDe(desplaz) {
    var d = deISO(fechaHoy());
    var dow = d.getDay() === 0 ? 7 : d.getDay();
    d.setDate(d.getDate() - (dow - 1) + (desplaz * 7));
    var f = new Date(d); f.setDate(f.getDate() + 6);
    return { desde: iso(d), hasta: iso(f), lunes: d };
  }
  function diasDeLaSemana(gid, sem) {
    /* Solo los días que ese grupo entrena; si no tiene horario, los días en
       los que haya lista pasada esa semana. */
    var out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(sem.lunes); d.setDate(d.getDate() + i);
      var f = iso(d), dow = i + 1;
      var entrena = entrenaDia(gid, dow);
      if (!entrena) {
        entrena = atletasDeGrupo(gid).some(function (a) { return ASIS[a.id] && ASIS[a.id][f] !== undefined; });
      }
      if (entrena) out.push({ fecha: f, dow: dow, et: DIAS_CORTO[d.getDay()] });
    }
    return out;
  }
  function puntoDe(a, fecha) {
    var v = ASIS[a.id] ? ASIS[a.id][fecha] : undefined;
    if (v === true) return { c: 'pt--vino', t: 'ha venido' };
    if (v === false) return { c: 'pt--falta', t: 'no ha venido' };
    if (a.estado === 'lesionado') return { c: 'pt--nada', t: 'no contaba · lesión' };
    /* «Ese día no le toca» se mira en el grupo de ESTA rejilla, que es de un
       grupo y de una semana. Con su grupo principal se decía que no tocaba
       en la lista del segundo grupo, donde sí tocaba. */
    if (!entrenaDia(LST.grupo || a.grupo_id, dowDe(fecha))) return { c: 'pt--nada', t: 'no contaba · ese día no le toca' };
    return { c: 'pt--sin', t: 'aún sin dato · no se pasó lista' };
  }

  function pintarEscritorio() {
    if (PANTALLA === 'ficha' && FICHA) { pintarFichaEscritorio(); return; }
    if (PANTALLA === 'lista') { pintarListaEscritorio(); return; }

    var sem = semanaDe(SEMANA);
    var g = GMAP[LST.grupo];
    var h = '<div class="p-escritorio">' + membreteHTML(g, sem) +
      '<div class="e-cab"><div><span class="e-migas">En la pista</span><br>' +
        '<h1>Asistencia de la semana</h1><span class="e-rango">' + esc(fechaCorta(sem.desde) + ' al ' + fechaCorta(sem.hasta)) + '</span></div>' +
        '<div class="e-acc">' +
          '<button type="button" class="btn btn--primario" id="e-pasar">Pasar lista</button>' +
          '<button type="button" class="btn btn--neutro" id="e-exportar">Exportar</button>' +
        '</div></div>';

    h += '<div class="e-mandos"><select id="e-grupo" aria-label="Grupo">' +
      (LST.grupo ? '' : '<option value="">Elige un grupo…</option>') +
      gruposConAtletas().map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === LST.grupo ? ' selected' : '') + '>' + esc(x.nombre) + '</option>'; }).join('') +
      '</select><span class="e-sem"><button type="button" id="e-ant" aria-label="Semana anterior">‹</button>' +
      '<button type="button" id="e-hoy">Esta semana</button>' +
      '<button type="button" id="e-sig" aria-label="Semana siguiente">›</button></span></div>';

    if (CARGA_ERROR) h += '<p class="p-error">' + esc(CARGA_ERROR) + '</p>';
    if (LST.error) h += '<p class="p-error">' + esc(LST.error) + '</p>';

    if (!g) {
      h += '<p class="p-vacio">Elige arriba el grupo que quieras repasar.</p></div>';
      RAIZ.innerHTML = h; engancharComunes(); return;
    }

    var atls = atletasDeGrupo(g.id);
    var dias = diasDeLaSemana(g.id, sem);
    var cols = '1.8fr repeat(' + Math.max(dias.length, 1) + ', 60px) 92px';
    /* El recuento del mes se cuenta HASTA la semana que se está mirando, y el
       aviso del lateral usa exactamente el mismo corte: si no, dirían cosas
       distintas en la misma pantalla. */
    var corte = sem.hasta > fechaHoy() ? fechaHoy() : sem.hasta;

    h += '<div class="e-cols"><div><div class="rej">' +
      '<div class="rej-fila rej-cab" style="grid-template-columns:' + cols + '"><span>Atleta</span>' +
      (dias.length ? dias.map(function (d) { return '<span>' + esc(d.et) + '</span>'; }).join('') : '<span>—</span>') +
      '<span>Mes</span></div>';

    if (!atls.length) {
      h += '<p class="p-vacio">Este grupo no tiene atletas en activo.</p>';
    } else {
      h += atls.map(function (a) {
        var m = mesDe(a.id, corte);
        var etiq = a.estado === 'lesionado' ? (ella(a) ? 'lesionada' : 'lesionado') : a.estado === 'prueba' ? 'en prueba' : '';
        var mes = (a.estado === 'lesionado' && !m.dias) ? '<span class="rej-mes texto">baja</span>'
          : !m.dias ? '<span class="rej-mes texto">sin datos</span>'
          : '<span class="rej-mes' + (m.vino * 2 < m.dias ? ' baja' : '') + '">' + m.vino + ' / ' + m.dias + '</span>';
        return '<div class="rej-fila" style="grid-template-columns:' + cols + '">' +
          '<span class="rej-nom">' + esc(nombreDe(a)) + (etiq ? '<em>' + esc(etiq) + '</em>' : '') + '</span>' +
          (dias.length ? dias.map(function (d) {
            var p = puntoDe(a, d.fecha);
            return '<span class="rej-p"><span class="pt ' + p.c + '" title="' + esc(d.et + ' ' + fechaBonita(d.fecha) + ' · ' + p.t) + '"></span></span>';
          }).join('') : '<span class="rej-p">—</span>') + mes + '</div>';
      }).join('');
      h += '<div class="rej-pie">' +
        '<span class="l"><span class="pt pt--vino"></span>Ha venido</span>' +
        '<span class="l"><span class="pt pt--falta"></span>No ha venido</span>' +
        '<span class="l"><span class="pt pt--nada"></span>No contaba</span>' +
        '<span class="l"><span class="pt pt--sin"></span>Aún sin dato</span>' +
        '<span class="n">' + atletasTxt(atls.length) + '</span></div>';
    }
    h += '</div></div>' + lateralHTML(g, atls, corte) + '</div></div>';
    RAIZ.innerHTML = h;
    engancharComunes();
  }

  function membreteHTML(g, sem) {
    return '<div class="p-membrete"><img src="../../assets/img/logo.png" alt="">' +
      '<b>Club Atletismo Apolana</b><span>' + esc((g ? g.nombre + ' · ' : '') + fechaCorta(sem.desde) + ' al ' + fechaCorta(sem.hasta)) + '</span></div>';
  }

  /* El aviso convierte el dato en algo que hacer: una tabla sola no sirve. */
  function lateralHTML(g, atls, corte) {
    var h = '<div class="e-lat">';
    var flojos = atls.map(function (a) { return { a: a, m: mesDe(a.id, corte) }; })
      .filter(function (x) { return x.a.estado !== 'lesionado' && x.m.dias >= 4 && x.m.vino * 2 < x.m.dias; })
      .sort(function (p, q) { return (p.m.vino / p.m.dias) - (q.m.vino / q.m.dias); });
    if (flojos.length) {
      var x = flojos[0], nom = x.a.nombre;
      h += '<div class="e-aviso"><span class="t">' + esc(nom + ' lleva ' + x.m.vino + ' de ' + x.m.dias) + '</span>' +
        '<span class="x">Ha faltado más de la mitad del mes' + (AUSENCIAS[x.a.id] ? '' : ' sin avisar') +
        '. Conviene preguntar a la familia antes de que se caiga solo.</span>' +
        botonFamiliaHTML(x.a, '') + '</div>';
    }
    var media = 0, conDato = 0, prueba = 0, lesion = 0;
    atls.forEach(function (a) {
      var m = mesDe(a.id, corte);
      if (m.dias) { media += m.vino / m.dias; conDato++; }
      if (a.estado === 'prueba') prueba++;
      if (a.estado === 'lesionado') lesion++;
    });
    var diasMes = atls.length ? Math.max.apply(null, atls.map(function (a) { return mesDe(a.id, corte).dias; })) : 0;
    h += '<div class="e-caja"><h3>El grupo este mes</h3>' +
      '<div class="r"><span>Asistencia media</span><b>' +
        (conDato && diasMes ? (Math.round((media / conDato) * diasMes * 10) / 10).toString().replace('.', ',') + ' / ' + diasMes : 'sin datos') + '</b></div>' +
      '<div class="r"><span>En prueba</span><b>' + prueba + '</b></div>' +
      '<div class="r"><span>Lesionados</span><b>' + lesion + '</b></div>' +
      '<button type="button" class="enlace" id="e-imprimir">Imprimir el historial del grupo</button></div>';
    return h + '</div>';
  }

  function pintarListaEscritorio() {
    var g = GMAP[LST.grupo];
    var c = g ? cuentaGrupo(g.id) : null;
    var h = '<div class="p-escritorio"><div class="e-cab"><div><span class="e-migas">En la pista</span><br>' +
      '<h1>' + esc(g ? g.nombre : 'Pasar lista') + '</h1>' +
      '<span class="e-rango">' + esc(c ? marcadosDe(c) : '') + '</span></div>' +
      '<div class="e-acc">' +
        '<button type="button" class="btn btn--primario" id="p-guardar"' + (LST.guardando ? ' disabled' : '') + '>' +
          (LST.guardando ? 'Guardando…' : 'Guardar lista') + '</button>' +
        '<button type="button" class="btn btn--neutro" id="e-semana">Ver la semana</button>' +
      '</div></div>';

    h += '<div class="e-mandos"><select id="e-grupo" aria-label="Grupo">' +
      gruposConAtletas().map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === LST.grupo ? ' selected' : '') + '>' + esc(x.nombre) + '</option>'; }).join('') +
      '</select><input type="date" id="e-fecha" value="' + esc(LST.fecha || fechaHoy()) + '" max="' + esc(fechaHoy()) + '" aria-label="Día de la lista">' +
      '<button type="button" class="btn btn--neutro" id="p-todos">Todos</button></div>';

    if (LST.error) h += '<p class="p-error">' + esc(LST.error) + '</p>';

    var atls = g ? atletasDeGrupo(g.id) : [];
    h += '<div class="e-lista">';
    if (LST.cargando) h += esqueleto(Math.min(atls.length || 3, 6));
    else if (!atls.length) h += '<p class="p-vacio">Este grupo no tiene atletas en activo.</p>';
    else h += '<div class="at-lista">' + atls.map(filaAtleta).join('') + '</div>' +
      '<span class="at-pie">' + atletasTxt(atls.length) + ' · ' + (c.sinMarcar ? c.sinMarcar + ' sin marcar' : 'todos marcados') +
      (LST.guardadoEn ? ' · guardado a las ' + esc(LST.guardadoEn) : LST.sucio ? ' · cambios sin guardar' : '') + '</span>';
    h += '</div></div>';
    RAIZ.innerHTML = h;
    engancharComunes();
  }

  function pintarFichaEscritorio() {
    /* Igual que en el móvil: la miga y el botón dicen la lista abierta. */
    var a = FICHA, g = GMAP[LST.grupo] || GMAP[a.grupo_id], sub = subLinea(a);
    var h = '<div class="p-escritorio"><div class="e-cab"><div><span class="e-migas">' +
      esc(g ? g.nombre : 'En la pista') + '</span><br><h1>' + esc(nombreDe(a)) + '</h1>' +
      '<span class="e-rango">' + esc(sub || anoNac(a)) + '</span></div>' +
      '<div class="e-acc"><button type="button" class="btn btn--neutro" id="f-atras">← ' + esc(g ? g.nombre : 'En la pista') + '</button></div></div>' +
      '<div class="e-lista" style="display:flex;flex-direction:column;gap:12px;padding-top:16px">' +
      fichaCuerpoHTML(a) + '</div></div>';
    RAIZ.innerHTML = h;
    engancharComunes();
  }

  /* ============================================================
     9 · Enganchar lo que se pulsa (vale para los dos modos)
     ============================================================ */
  function engancharComunes() {
    engancharFilas(RAIZ);

    var q = $('p-q');
    if (q) {
      q.addEventListener('input', function () {
        BUSCA = q.value;
        var pos = q.selectionStart;
        pintar();
        var q2 = $('p-q');
        if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    var qx = $('p-q-x');
    if (qx) qx.addEventListener('click', function () { BUSCA = ''; pintar(); });

    RAIZ.querySelectorAll('[data-grupo]').forEach(function (b) {
      b.addEventListener('click', function () { abrirGrupo(b.getAttribute('data-grupo')); });
    });

    var gu = $('p-guardar'); if (gu) gu.addEventListener('click', guardarLista);
    var td = $('p-todos'); if (td) td.addEventListener('click', todosLosQueQuedan);

    RAIZ.querySelectorAll('[data-marcar]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!FICHA) return;
        var q = b.getAttribute('data-marcar');
        marcar(FICHA.id, q === 'vino' ? true : q === 'falta' ? false : undefined);
        pintar();
      });
    });
    var at = $('f-atras'); if (at) at.addEventListener('click', cerrarFicha);
    var v2 = $('f-volver2'); if (v2) v2.addEventListener('click', cerrarFicha);
    var nn = $('f-nota'); if (nn) nn.addEventListener('click', function () { abrirNota(FICHA.id); });
    var sq = $('f-queda'); if (sq) sq.addEventListener('click', seQueda);

    var eg = $('e-grupo');
    if (eg) eg.addEventListener('change', function () {
      var v = eg.value;
      if (!v) return;
      abrirGrupo(v, LST.fecha || fechaHoy()).then(function (hecho) {
        if (!hecho) eg.value = LST.grupo;            /* se queda donde estaba */
      });
    });
    var ef = $('e-fecha');
    if (ef) ef.addEventListener('change', function () {
      var f = ef.value || fechaHoy();
      abrirGrupo(LST.grupo, f).then(function (hecho) {
        if (!hecho) ef.value = LST.fecha;             /* se queda donde estaba */
      });
    });
    var ea = $('e-ant'); if (ea) ea.addEventListener('click', function () { moverSemana(-1); });
    var es = $('e-sig'); if (es) es.addEventListener('click', function () { moverSemana(1); });
    var eh = $('e-hoy'); if (eh) eh.addEventListener('click', function () { moverSemana(null); });
    var ep = $('e-pasar'); if (ep) ep.addEventListener('click', function () {
      if (!LST.grupo) { if (window.apoToast) window.apoToast('Elige antes un grupo.', 'info'); return; }
      PANTALLA = 'lista'; pintar();
    });
    var ew = $('e-semana'); if (ew) ew.addEventListener('click', async function () {
      if (!(await puedoSalirDeLaLista())) return;
      PANTALLA = 'semana'; pintar();
    });
    var ex = $('e-exportar'); if (ex) ex.addEventListener('click', exportar);
    var ei = $('e-imprimir'); if (ei) ei.addEventListener('click', function () { window.print(); });
  }

  async function moverSemana(paso) {
    SEMANA = (paso === null) ? 0 : SEMANA + paso;
    if (LST.grupo) {
      var r = rangoNecesario();
      await cargarAsistencia(LST.grupo, r.desde, r.hasta);
    }
    pintar();
  }

  /* «Se queda»: el atleta deja de estar en prueba. */
  async function seQueda() {
    var a = FICHA; if (!a) return;
    var ok = window.apoConfirm ? await window.apoConfirm({
      titulo: 'Se queda en el club',
      texto: nombreDe(a) + ' deja de estar en periodo de prueba y pasa a ser un atleta más del grupo.',
      confirmar: 'Se queda', cancelar: 'Ahora no'
    }) : true;
    if (!ok) return;
    var r = await sb.from('atletas').update({ estado: 'activo', fecha_prueba_fin: null }).eq('id', a.id);
    if (r.error) {
      if (window.apoToast) window.apoToast('No se ha podido cambiar: ' + (r.error.message || ''), 'error');
      return;
    }
    a.estado = 'activo'; a.fecha_prueba_fin = null;
    pintar();
    if (window.apoToast) window.apoToast(nombreDe(a) + ' ya no está en prueba', 'ok');
  }

  function exportar() {
    var g = GMAP[LST.grupo]; if (!g) return;
    var sem = semanaDe(SEMANA);
    var dias = diasDeLaSemana(g.id, sem);
    var lin = ['Atleta;' + dias.map(function (d) { return d.et + ' ' + fechaBonita(d.fecha); }).join(';') + ';Mes'];
    atletasDeGrupo(g.id).forEach(function (a) {
      var m = mesDe(a.id, sem.hasta > fechaHoy() ? fechaHoy() : sem.hasta);
      lin.push([nombreDe(a)].concat(dias.map(function (d) {
        var v = ASIS[a.id] ? ASIS[a.id][d.fecha] : undefined;
        return v === true ? 'ha venido' : v === false ? 'no ha venido' : '';
      })).concat([m.dias ? m.vino + ' de ' + m.dias : '']).join(';'));
    });
    var url = URL.createObjectURL(new Blob(['﻿' + lin.join('\n')], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = 'asistencia-' + norm(g.nombre).replace(/[^a-z0-9]+/g, '-') + '-' + sem.desde + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  /* ============================================================
     10 · Pintar
     ============================================================ */
  function pintar() {
    var y = window.scrollY;
    if (esEscritorio()) pintarEscritorio(); else pintarMovil();
    window.scrollTo(0, y);
  }
  ESCRITORIO.addEventListener('change', function () {
    /* Al cambiar de tamaño no se pierde nada: las marcas viven en LST, no en
       la pantalla. Solo se elige la pantalla que toca. */
    if (PANTALLA === 'lista' && esEscritorio() && !LST.sucio && !LST.guardadoEn) PANTALLA = 'semana';
    pintar();
  });

  /* ============================================================
     11 · NOTA DEL EQUIPO TÉCNICO
     ------------------------------------------------------------
     Apuntar en el momento lo que ha pasado con un atleta, para
     poder hablarlo luego con la familia. Va en `notas_atleta`,
     que SOLO lee el equipo técnico: ni el atleta ni la familia la
     ven en su portal. La nota se guarda sola, sin tocar la lista.
     ============================================================ */
  var TIPOS_NOTA = [
    { v: 'comportamiento', t: 'Comportamiento' },
    { v: 'lesion', t: 'Lesión' },
    { v: 'material', t: 'Material' },
    { v: 'familia', t: 'Familia' },
    { v: 'otro', t: 'Otro' }
  ];
  function tipoTexto(v) {
    for (var i = 0; i < TIPOS_NOTA.length; i++) if (TIPOS_NOTA[i].v === v) return TIPOS_NOTA[i].t;
    return 'Otro';
  }
  var NOTA = { atleta: null, editando: '', guardando: false, msg: '', error: false };

  async function cargarNotasDia(ids, fecha) {
    NOTAS_HOY = {};
    if (!ids || !ids.length || !fecha) return;
    var r = await sb.from('notas_atleta').select('id,atleta_id,texto,tipo,fecha,autor_id,created_at')
      .eq('fecha', fecha).in('atleta_id', ids).order('created_at', { ascending: true });
    if (r.error || !r.data) return;
    r.data.forEach(function (n) { (NOTAS_HOY[n.atleta_id] = NOTAS_HOY[n.atleta_id] || []).push(n); });
  }
  function autorTexto(n) {
    if (n.autor_id && n.autor_id === YO) return 'Lo apuntaste tú';
    var nom = n.autor_id ? PERSONAS[n.autor_id] : '';
    return nom ? 'Lo apuntó ' + nom : 'Equipo técnico';
  }

  function abrirNota(atletaId) {
    var at = AMAP[atletaId];
    if (!at) return;
    NOTA = { atleta: at, editando: '', guardando: false, msg: '', error: false };
    $('modal-nota').classList.remove('oculto');
    pintarModalNota();
  }
  function cerrarNota() {
    $('modal-nota').classList.add('oculto');
    $('modal-nota-caja').innerHTML = '';
    NOTA = { atleta: null, editando: '', guardando: false, msg: '', error: false };
    pintar();
  }

  function pintarModalNota() {
    var at = NOTA.atleta; if (!at) return;
    var caja = $('modal-nota-caja');
    var lista = NOTAS_HOY[at.id] || [];
    var enEdicion = null;
    lista.forEach(function (n) { if (n.id === NOTA.editando) enEdicion = n; });

    var notasHTML = lista.length ? '<div class="mn-lista">' + lista.map(function (n) {
      return '<div class="nd"><span class="q">' + esc(tipoTexto(n.tipo)) + ' · ' + esc(autorTexto(n)) + '</span>' +
        '<p>' + esc(n.texto) + '</p><div class="acc">' +
        '<button type="button" data-editar="' + esc(n.id) + '">Corregir</button>' +
        '<button type="button" data-borrar="' + esc(n.id) + '">Borrar</button></div></div>';
    }).join('') + '</div>' : '';

    var tipoSel = enEdicion ? (enEdicion.tipo || 'otro') : 'comportamiento';
    caja.innerHTML =
      '<h3>' + esc(nombreDe(at)) + '</h3>' +
      '<p class="mn-sub">Observaciones del ' + esc(fechaBonita(LST.fecha || fechaHoy())) + '</p>' + notasHTML +
      '<label for="mn-tipo">' + (enEdicion ? 'Corrige la observación' : 'Qué ha pasado') + '</label>' +
      '<select id="mn-tipo">' + TIPOS_NOTA.map(function (t) {
        return '<option value="' + t.v + '"' + (t.v === tipoSel ? ' selected' : '') + '>' + t.t + '</option>';
      }).join('') + '</select>' +
      '<label for="mn-texto">En dos líneas</label>' +
      '<textarea id="mn-texto" placeholder="Ha roto un cono y no ha hecho caso cuando se le ha llamado la atención.">' + esc(enEdicion ? enEdicion.texto : '') + '</textarea>' +
      '<div class="mn-acc">' +
        '<button type="button" class="btn btn--primario" id="mn-guardar"' + (NOTA.guardando ? ' disabled' : '') + '>' +
          (NOTA.guardando ? 'Guardando…' : (enEdicion ? 'Guardar los cambios' : 'Guardar la observación')) + '</button>' +
        '<button type="button" class="btn btn--neutro" id="mn-cerrar">' + (enEdicion ? 'Dejarlo como estaba' : 'Cerrar') + '</button>' +
        '<span class="mn-msg' + (NOTA.error ? ' error' : '') + '">' + esc(NOTA.msg) + '</span>' +
      '</div>' +
      '<p class="mn-privado">Esta observación es interna del club: la ve el equipo técnico y nadie más. La familia y el atleta no la ven en su portal.</p>';

    $('mn-cerrar').addEventListener('click', function () {
      if (NOTA.editando) { NOTA.editando = ''; NOTA.msg = ''; NOTA.error = false; pintarModalNota(); return; }
      cerrarNota();
    });
    $('mn-guardar').addEventListener('click', guardarNota);
    caja.querySelectorAll('[data-editar]').forEach(function (b) {
      b.addEventListener('click', function () {
        NOTA.editando = b.getAttribute('data-editar'); NOTA.msg = ''; NOTA.error = false;
        pintarModalNota();
        var t = $('mn-texto'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
      });
    });
    caja.querySelectorAll('[data-borrar]').forEach(function (b) {
      b.addEventListener('click', function () { borrarNota(b.getAttribute('data-borrar')); });
    });
  }

  async function guardarNota() {
    if (NOTA.guardando || !NOTA.atleta) return;
    var texto = ($('mn-texto').value || '').trim();
    var tipo = $('mn-tipo').value;
    if (!texto) { NOTA.msg = 'Escribe qué ha pasado antes de guardar.'; NOTA.error = true; pintarModalNota(); return; }
    NOTA.guardando = true; NOTA.msg = 'Guardando…'; NOTA.error = false; pintarModalNota();
    var at = NOTA.atleta, fecha = LST.fecha || fechaHoy();
    try {
      if (NOTA.editando) {
        var up = await sb.from('notas_atleta').update({ texto: texto, tipo: tipo })
          .eq('id', NOTA.editando).select('id,atleta_id,texto,tipo,fecha,autor_id,created_at');
        if (up.error) throw up.error;
        if (!up.data || !up.data.length) throw new Error('no se ha encontrado la nota');
        var l = NOTAS_HOY[at.id] || [];
        for (var i = 0; i < l.length; i++) if (l[i].id === NOTA.editando) l[i] = up.data[0];
        NOTA.editando = '';
      } else {
        var ins = await sb.from('notas_atleta').insert({
          atleta_id: at.id, autor_id: YO || null, texto: texto, tipo: tipo,
          fecha: fecha, grupo_id: LST.grupo || at.grupo_id || null
        }).select('id,atleta_id,texto,tipo,fecha,autor_id,created_at');
        if (ins.error) throw ins.error;
        if (ins.data && ins.data.length) {
          (NOTAS_HOY[at.id] = NOTAS_HOY[at.id] || []).push(ins.data[0]);
          if (FICHA && FICHA.id === at.id) NOTAS_AT.unshift(ins.data[0]);
        }
      }
      NOTA.guardando = false; NOTA.msg = 'Observación guardada.'; NOTA.error = false;
      pintarModalNota();
      var t = $('mn-texto'); if (t) t.value = '';
      if (window.apoToast) window.apoToast('Observación guardada · ' + nombreDe(at), 'ok');
    } catch (e) {
      NOTA.guardando = false;
      NOTA.msg = 'NO se ha guardado: ' + ((e && e.message) || e) + '. El texto sigue aquí, vuelve a intentarlo.';
      NOTA.error = true;
      pintarModalNota();
    }
  }

  async function borrarNota(id) {
    var ok = window.apoConfirm ? await window.apoConfirm({
      titulo: 'Borrar la observación',
      texto: 'Se borra del historial del atleta y no se puede recuperar.',
      confirmar: 'Borrar', cancelar: 'Dejarla', peligro: true
    }) : true;
    if (!ok) return;
    var at = NOTA.atleta; if (!at) return;
    var d = await sb.from('notas_atleta').delete().eq('id', id);
    if (d.error) { NOTA.msg = 'NO se ha borrado: ' + (d.error.message || ''); NOTA.error = true; pintarModalNota(); return; }
    NOTAS_HOY[at.id] = (NOTAS_HOY[at.id] || []).filter(function (n) { return n.id !== id; });
    NOTAS_AT = NOTAS_AT.filter(function (n) { return n.id !== id; });
    if (NOTA.editando === id) NOTA.editando = '';
    NOTA.msg = 'Observación borrada.'; NOTA.error = false;
    pintarModalNota();
  }

  $('modal-nota').addEventListener('click', function (e) { if (e.target === this) cerrarNota(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('modal-nota').classList.contains('oculto')) cerrarNota();
  });

  /* ============================================================
     12 · Arranque
     ============================================================ */
  (async function () {
    PANTALLA = esEscritorio() ? 'semana' : 'lista';
    RAIZ.innerHTML = '<div class="p-movil"><div class="p-cuerpo" style="padding-top:20px">' +
      '<div class="adm-cargando"><span class="adm-esq adm-esq--largo"></span>' +
      '<span class="adm-esq adm-esq--medio"></span><span class="adm-esq adm-esq--corto"></span></div></div></div>';
    await cargar();
    var elegido = grupoQueToca();
    if (elegido) await abrirGrupo(elegido.id);
    else pintar();
  })();
});
</script>

</body>
</html>
