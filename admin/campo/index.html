<style>
/* ============================================================
   EN LA PISTA · la herramienta de campo
   ------------------------------------------------------------
   Cabecera navy, cuerpo crema, en los dos tamaños. El navy a
   pantalla completa se retiró: se leía peor al sol y el salto a
   negro parecía haber salido del panel. El modo trabajo lo marcan
   quitar la barra de pestañas, el «Salir» y agrandar los datos.

   · MÓVIL (hasta 899 px) · MODO TRABAJO. Se usa de pie, con una
     mano, al sol y mirando a los críos. Filas de 56 px, toda la
     fila cambia de estado y TRES estados: ha venido / no ha venido
     / sin marcar. Ningún texto por debajo de 4,5:1: los grises van
     al secundario del sistema y el ámbar de texto a #8A5307.

   · ESCRITORIO (desde 900 px) · MODO CONSULTA. La misma
     información para repasar la semana sentado: rejilla de
     puntos, recuento del mes y el aviso que convierte el dato
     en algo que hacer.

   Los colores de la fila se escriben una sola vez, como variables
   (--f-…), con un único juego de valores claros para los dos
   tamaños. Así hay un solo componente de fila y no dos que se van
   separando.
   ============================================================ */

/* Cabecera navy, cuerpo crema. El navy a pantalla completa se leía
   PEOR al sol (navy sobre crema 10,9:1; blanco sobre navy, la mitad)
   y el salto a negro parecía haber salido del panel. El modo trabajo
   lo marcan quitar la barra de pestañas, el «Salir» y agrandar los
   datos, no el fondo. */
body.pista-viva { background: var(--crema); }
body.pista-viva #admin-contenido { min-height: 100vh; }

/* La barra superior del panel es la cabecera navy del modo trabajo:
   «← Panel» a la izquierda y «Salir» a la derecha. En móvil se
   quitan la marca y el separador para dejarla limpia. */
@media (max-width: 899px) {
  body.pista-viva .adm-top .sep,
  body.pista-viva .adm-top .marca { display: none; }
}

/* La fila y sus estados se escriben una sola vez, como variables (--f-…).
   Ahora hay un único juego de valores —el claro, sobre crema— para móvil
   y escritorio: el ámbar de texto en #8A5307 (6:1 sobre crema), los grises
   en el secundario del sistema y las cajas en blanco. */
#pista {
  --f-fondo: var(--crema);
  --f-caja: #fff;
  --f-caja-2: var(--crema);
  --f-vino: #EDF5EE;
  --f-borde: var(--linea-marcada);
  --f-borde-flojo: var(--linea);
  --f-linea: var(--linea);
  --f-txt: var(--navy);
  --f-sub: var(--texto-suave);
  --f-ambar: #8A5307;   /* el ámbar de MARCA no llega a 4,5:1 sobre crema; el de TEXTO sí */
  --f-ambar-fondo: var(--ambar-fondo);
  --f-ambar-borde: var(--ambar-borde);
  --f-ambar-txt: #8A5307;
  --f-verde: #3F7A4C;
  --f-verde-txt: #2E6B3B;
  /* Dos azules con dos trabajos, como en el resto del sistema:
     el oscuro para lo que lleva texto blanco encima (5,3:1) y el
     claro solo para bordes y foco, donde nunca hay letra. */
  --f-azul: #2F6FA8;
  --f-azul-filete: #3B85C0;
  --f-sombra: var(--sombra-suave);
  font-family: var(--fuente-texto);
}

/* ---------- armazón del móvil (modo trabajo) ---------- */
.p-movil { display: flex; flex-direction: column; min-height: calc(100vh - 60px); color: var(--f-txt); }
.p-cab { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 3px; }
.p-cab .p-fecha { font-size: 14px; color: var(--f-sub); }
.p-cab h1 { font-family: var(--fuente-titulo); font-weight: 700; font-size: 32px; line-height: 1;
  text-transform: uppercase; color: var(--f-txt); margin: 0; }
.p-cuerpo { flex: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
/* hueco para que la barra de abajo no tape la última fila */
.p-movil .p-cuerpo { padding-bottom: calc(136px + env(safe-area-inset-bottom)); }

/* buscador */
.p-buscar { display: flex; align-items: center; gap: 12px; background: var(--f-caja);
  border: 1px solid transparent; border-radius: 12px; padding: 0 14px; min-height: 50px; }
.p-buscar svg { flex: 0 0 20px; width: 20px; height: 20px; color: var(--f-sub); }
.p-buscar input { flex: 1; min-width: 0; border: 0; background: none; outline: none;
  font-family: inherit; font-size: 16px; color: var(--f-txt); padding: 13px 0; }
.p-buscar input::placeholder { color: var(--f-sub); opacity: 1; }
.p-buscar:focus-within { border-color: var(--f-azul-filete); }
.p-buscar button { flex: 0 0 auto; min-width: 44px; min-height: 44px; border: 0; background: none;
  color: var(--f-sub); font-family: inherit; font-size: 15px; cursor: pointer; }

/* ---------- grupo abierto y grupos plegados ---------- */
.g-abierto { display: flex; flex-direction: column; gap: 8px; }
.g-cab { display: flex; align-items: baseline; gap: 10px; padding: 0 2px; }
.g-cab h2 { font-family: var(--fuente-titulo); font-weight: 700; font-size: 22px; line-height: 1;
  text-transform: uppercase; color: var(--f-txt); margin: 0; min-width: 0; }
.g-cab .g-cuenta { margin-left: auto; font-family: var(--fuente-dato); font-size: 15px;
  color: var(--f-ambar); white-space: nowrap; }
.g-cab .g-hora { font-size: 14px; color: var(--f-sub); white-space: nowrap; }

.g-plegados { border-top: 1px solid var(--f-linea); padding-top: 11px; display: flex; flex-direction: column; gap: 2px; }
.g-plegados .g-et { font-size: 14px; color: var(--f-sub); padding: 0 2px 4px; }
.g-pleg { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box;
  min-height: 48px; padding: 6px 2px; border: 0; background: none; text-align: left;
  font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.g-pleg .n { font-family: var(--fuente-titulo); font-weight: 700; font-size: 20px; line-height: 1.05;
  text-transform: uppercase; color: var(--f-sub); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-pleg .e { margin-left: auto; font-size: 14px; color: var(--f-sub); white-space: nowrap; }
/* queda trabajo ahí: en ámbar, como los recuentos del panel */
.g-pleg .e.pend { color: var(--f-ambar); }
.g-pleg .v { flex: 0 0 auto; width: 9px; height: 9px; border-right: 2px solid var(--f-sub);
  border-bottom: 2px solid var(--f-sub); transform: rotate(45deg) translate(-2px,-2px); }
.g-pleg:hover .n, .g-pleg:hover .e { color: var(--f-txt); }

/* ---------- LA FILA · 56 px, toda ella cambia de estado ---------- */
.at { display: flex; align-items: stretch; gap: 0; border-radius: 12px; min-height: 56px;
  border: 1px solid transparent; box-sizing: border-box; }
/* La fila de «ha venido» se tiñe de verde muy claro; sus grises y su ámbar
   se mantienen en los tonos de texto del sistema, que sobre ese verde siguen
   por encima de 4,5:1 (gris 5,1:1, ámbar 5,7:1). */
.at--vino { background: var(--f-vino); --f-sub: var(--texto-suave); --f-ambar-txt: #8A5307; }
.at--falta { border-color: var(--f-borde-flojo); }
.at--sin { border-color: var(--f-borde); }
.at--aviso { border-color: var(--f-ambar-borde); background: var(--f-ambar-fondo); }

.at-tog { flex: 1; min-width: 0; display: flex; align-items: center; gap: 13px;
  padding: 8px 4px 8px 15px; border: 0; background: none; text-align: left; cursor: pointer;
  font-family: inherit; color: inherit; border-radius: 12px 0 0 12px;
  -webkit-tap-highlight-color: transparent; }
.at-cir { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
.at--vino .at-cir { background: var(--f-verde); }
.at--falta .at-cir { border: 2px solid var(--f-borde-flojo); }
.at--sin .at-cir { border: 2px solid var(--f-borde); }
.at--aviso .at-cir { border: 2px solid var(--f-ambar); }
.at-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.at-nom { font-size: 16px; line-height: 1.25; color: var(--f-txt);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.at--falta .at-nom { color: var(--f-sub); }
.at-sub { font-size: 14px; line-height: 1.25; color: var(--f-ambar-txt);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.at-meta { flex: 0 0 auto; font-size: 14px; color: var(--f-sub); white-space: nowrap; padding-left: 6px; }
/* El chevron de «entrar» es lo único que va a la derecha de una fila y
   siempre en gris: abre la ficha del atleta. La fila, no. */
.at-ficha { flex: 0 0 42px; width: 42px; border: 0; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--f-sub);
  border-radius: 0 12px 12px 0; -webkit-tap-highlight-color: transparent; }
.at-ficha svg { width: 22px; height: 22px; }
.at-ficha:hover { color: var(--f-txt); }
.at-lista { display: flex; flex-direction: column; gap: 8px; }
.at-pie { font-size: 15px; color: var(--f-sub); padding: 4px 2px 0; }

/* ---------- barra de abajo (móvil) · sobre crema, no es barra de
   pestañas: es la acción de guardar, que se queda a mano. ---------- */
.p-barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 500; box-sizing: border-box;
  background: var(--crema); border-top: 1px solid var(--linea);
  box-shadow: 0 -10px 24px -18px rgba(46,66,86,0.45);
  padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }
.p-barra .p-estado { font-size: 14px; color: var(--f-sub); padding: 0 2px 8px; display: block; }
.p-barra .p-estado.sucio { color: var(--f-ambar); }
.p-barra .p-estado.ok { color: var(--f-verde-txt); }
.p-barra .p-bots { display: flex; gap: 10px; }
.b-borde { border: 1px solid var(--linea-borde); background: #fff; color: var(--navy);
  border-radius: 999px; min-height: 52px; padding: 0 20px; font-family: inherit; font-size: 15px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.b-borde:hover { border-color: var(--f-azul-filete); }
.b-azul { flex: 1; border: 0; background: var(--f-azul); color: #fff; border-radius: 999px;
  min-height: 52px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; }
.b-azul[disabled] { opacity: .6; cursor: default; }

/* ---------- ficha del atleta ---------- */
.f-cab { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.f-volver { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; border: 0;
  background: none; padding: 0; color: var(--f-sub); font-family: inherit; font-size: 14px; cursor: pointer; }
.f-volver svg { width: 24px; height: 24px; }
.f-quien { display: flex; align-items: center; gap: 14px; }
.f-av { flex: 0 0 52px; width: 52px; height: 52px; border-radius: 999px; background: var(--f-vino);
  display: flex; align-items: center; justify-content: center; font-family: var(--fuente-titulo);
  font-weight: 700; font-size: 19px; color: var(--f-txt); }
.f-quien h1 { font-family: var(--fuente-titulo); font-weight: 700; font-size: 30px; line-height: 1;
  text-transform: uppercase; color: var(--f-txt); margin: 0; }
.f-quien .f-sub { font-size: 15px; color: var(--f-ambar-txt); }
.f-quien .f-sub.gris { color: var(--f-sub); }

.f-dos { display: flex; gap: 9px; }
.f-dos button { flex: 1; min-height: 56px; border-radius: 12px; font-family: inherit; font-size: 16px;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  border: 1px solid var(--f-borde); background: none; color: var(--f-txt); }
.f-dos button svg { width: 19px; height: 19px; }
.f-dos button.sel-vino { background: var(--f-verde); border-color: var(--f-verde); color: #fff; font-weight: 600; }
.f-dos button.sel-falta { background: var(--f-vino); border-color: var(--f-txt); font-weight: 600; }
.f-quitar { border: 0; background: none; color: var(--f-sub); font-family: inherit; font-size: 15px;
  min-height: 44px; cursor: pointer; text-decoration: underline; align-self: flex-start; padding: 0 2px; }

.f-bloque { background: var(--f-caja); border: 1px solid var(--linea); border-radius: 12px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; }
.f-bloque .f-et { font-size: 14px; color: var(--f-sub); }
.f-cifra { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.f-cifra b { font-family: var(--fuente-dato); font-size: 30px; font-weight: 700; color: var(--f-txt); }
.f-cifra span { font-size: 15px; color: var(--f-verde-txt); }
.f-cifra span.mal { color: var(--f-ambar-txt); }
.f-cifra span.gris { color: var(--f-sub); }
.f-ambar { background: var(--f-ambar-fondo); border: 1px solid var(--f-ambar-borde); border-radius: 12px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; }
.f-ambar .t { font-size: 15px; font-weight: 600; color: var(--f-ambar-txt); }
.f-ambar .x { font-size: 15px; line-height: 1.45; color: var(--f-txt); }
.f-ambar .a { display: flex; gap: 9px; flex-wrap: wrap; }
.b-ambar { background: var(--f-ambar); color: #fff; border: 0; border-radius: 999px; min-height: 44px;
  padding: 0 16px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; }
.b-fino { background: none; border: 1px solid var(--f-borde); color: var(--f-txt); border-radius: 999px;
  min-height: 44px; padding: 0 16px; font-family: inherit; font-size: 15px; cursor: pointer;
  display: inline-flex; align-items: center; text-decoration: none; }
.f-nota { font-size: 15px; line-height: 1.5; color: var(--f-txt); margin: 0; white-space: pre-wrap; }
.f-nota-quien { font-size: 14px; color: var(--f-sub); }
.f-privado { display: flex; align-items: flex-start; gap: 12px; padding: 2px; }
.f-privado svg { flex: 0 0 20px; width: 20px; height: 20px; color: var(--f-sub); margin-top: 1px; }
.f-privado span { font-size: 14px; line-height: 1.45; color: var(--f-sub); }

/* ---------- escritorio · modo consulta ---------- */
.p-escritorio { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px,3vw,26px) 40px; color: var(--texto); }
.e-cab { padding: 20px 0 16px; border-bottom: 1px solid var(--linea); display: flex;
  align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.e-cab .e-migas { font-size: 14px; color: var(--texto-suave); }
.e-cab h1 { font-family: var(--fuente-titulo); font-weight: 700; font-size: 28px; line-height: 1;
  text-transform: uppercase; color: var(--navy); margin: 4px 0 0; display: inline; }
.e-cab .e-rango { font-family: var(--fuente-dato); font-size: 15px; color: var(--texto-suave); margin-left: 11px; }
.e-acc { display: flex; gap: 8px; flex-wrap: wrap; }
.e-mandos { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 0 4px; }
.e-mandos select, .e-mandos input[type=date] { min-height: 44px; padding: 10px 14px; border-radius: 999px;
  border: 1px solid var(--linea-borde); background: #fff; font-family: inherit; font-size: 15px; color: var(--navy); }
.e-sem { display: inline-flex; align-items: center; gap: 4px; }
.e-sem button { min-width: 44px; min-height: 44px; border: 1px solid var(--linea-borde); background: #fff;
  border-radius: 999px; color: var(--navy); font-family: inherit; font-size: 17px; cursor: pointer; }
.e-cols { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 24px; align-items: start; padding-top: 14px; }
@media (max-width: 1099px) { .e-cols { grid-template-columns: minmax(0,1fr); } }

.rej { display: flex; flex-direction: column; gap: 0; }
.rej-fila { display: grid; gap: 10px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--linea); }
.rej-cab { border-bottom: 2px solid var(--linea-marcada); padding-bottom: 9px; }
.rej-cab span { font-size: 13px; color: var(--texto-suave); text-align: center; }
.rej-cab span:first-child { text-align: left; }
.rej-cab span:last-child { text-align: right; }
.rej-nom { font-size: 15px; color: var(--navy); display: flex; align-items: baseline; gap: 9px;
  min-width: 0; flex-wrap: wrap; }
.rej-nom em { font-style: normal; font-size: 14px; color: #8A5307; }
.rej-p { display: flex; justify-content: center; }
.pt { width: 22px; height: 22px; border-radius: 999px; box-sizing: border-box; display: block; }
.pt--vino { background: #3F7A4C; }
.pt--falta { border: 2px solid #DCD3C1; }
.pt--nada { background: #F1EADC; }
.pt--sin { border: 2px dashed #DCD3C1; }
.rej-mes { font-family: var(--fuente-dato); font-size: 15px; color: var(--navy); text-align: right; }
.rej-mes.baja { color: var(--f-ambar); }
.rej-mes.texto { font-family: var(--fuente-texto); color: var(--texto-suave); }
.rej-pie { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 10px; }
.rej-pie .l { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--texto); }
.rej-pie .l .pt { width: 14px; height: 14px; }
.rej-pie .n { margin-left: auto; font-size: 14px; color: var(--texto-suave); }

.e-lat { display: flex; flex-direction: column; gap: 12px; }
.e-aviso { background: #FDF3E3; border: 1px solid #EBD9B8; border-radius: 14px; padding: 15px 17px;
  display: flex; flex-direction: column; gap: 9px; }
.e-aviso .t { font-size: 15px; font-weight: 600; color: #6B5227; }
.e-aviso .x { font-size: 14px; line-height: 1.5; color: #6B5227; }
.e-aviso a, .e-aviso button { align-self: flex-start; background: #fff; border: 1px solid #E0CDA8;
  border-radius: 999px; padding: 0 15px; min-height: 44px; font-size: 14px; font-weight: 600;
  color: #6B5227; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; text-decoration: none; }
.e-caja { background: #fff; border: 1px solid var(--linea-marcada); border-radius: 14px; padding: 15px 17px;
  display: flex; flex-direction: column; gap: 10px; }
.e-caja h3 { font-family: var(--fuente-titulo); font-weight: 700; font-size: 21px; line-height: 1;
  text-transform: uppercase; color: var(--navy); margin: 0; }
.e-caja .r { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.e-caja .r span { font-size: 15px; color: var(--texto); }
.e-caja .r b { font-family: var(--fuente-dato); font-size: 15px; font-weight: 400; color: var(--navy); }
.e-caja .enlace { border: 0; background: none; padding: 10px 0 0; text-align: left; font-family: inherit;
  font-size: 14px; font-weight: 600; color: var(--azul-oscuro); border-top: 1px solid var(--linea);
  cursor: pointer; min-height: 44px; }

/* la lista de escritorio (pasar lista sentado) reutiliza la misma fila */
.e-lista { max-width: 720px; }
.e-lista .at-lista { gap: 8px; }

.p-vacio { font-size: 15px; line-height: 1.5; color: var(--f-sub); padding: 10px 2px; }
.p-error { background: var(--f-ambar-fondo); border: 1px solid var(--f-ambar-borde); border-radius: 12px;
  padding: 12px 14px; font-size: 15px; line-height: 1.45; color: var(--f-txt); margin: 0; }

/* ---------- ventana de la nota · tarjeta blanca sobre el velo ---------- */
#modal-nota { position: fixed; inset: 0; z-index: 1000; background: rgba(20,30,40,.6);
  display: flex; align-items: flex-start; justify-content: center; padding: clamp(14px,5vh,60px) 14px;
  overflow: auto; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
#modal-nota.oculto { display: none !important; }
#modal-nota .caja { background: #fff; border: 1px solid var(--linea); border-radius: 14px;
  padding: 20px; width: min(520px,100%); box-sizing: border-box; color: var(--texto); }
#modal-nota h3 { font-size: 17px; font-weight: 700; margin: 0; color: inherit; }
#modal-nota .mn-sub { font-size: 14px; color: var(--f-sub); margin: 4px 0 0; }
#modal-nota label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 5px; color: inherit; }
#modal-nota select, #modal-nota textarea { width: 100%; box-sizing: border-box; padding: 12px;
  border: 1px solid var(--f-borde); border-radius: 10px; background: var(--f-caja); font-family: inherit;
  font-size: 16px; color: inherit; }
