<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En la pista · Panel Apolana</title>
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/admin-auth.js"></script>
<script src="../../assets/js/admin-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 18px clamp(14px,4vw,26px) 90px; }
  .cab h1 { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase; color: var(--navy); font-size: clamp(28px,7vw,40px); line-height:1; margin:0; }
  .cab p { color: var(--texto-suave); font-size:14px; margin:6px 0 0; }

  .card { background:#fff; border:1px solid var(--linea); border-radius:16px; padding:16px; box-shadow: var(--sombra-suave); margin-top:16px; }
  .card h2 { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase; color: var(--navy); font-size:20px; margin:0 0 10px; }

  /* Buscador */
  .buscar-in { width:100%; box-sizing:border-box; padding:14px 16px; border:1px solid var(--linea); border-radius:12px; font-size:16px; font-family:inherit; }
  .res { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .res-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--linea); border-radius:12px; background:#fff; }
  .res-item .av { width:40px; height:40px; flex:0 0 40px; border-radius:20px; background: var(--azul-suave); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .res-item .info { flex:1; min-width:0; }
  .res-item .info b { display:block; color: var(--navy); font-size:15px; }
  .res-item .info small { color: var(--texto-suave); font-size:13px; }
  .chip-g { font-family: var(--fuente-mono); font-size:11px; padding:4px 10px; border-radius:999px; background: var(--crema-media); color: var(--navy); white-space:nowrap; }
  .chip-g.sin { background:#FBE9E7; color:#A8453F; }
  .badge-prueba { font-family: var(--fuente-mono); font-size:12px; padding:2px 7px; border-radius:999px; background:#FDF3DD; color:#8A7530; margin-left:6px; }

  /* Selector de grupo (chips) */
  .grupos-chips { display:flex; flex-wrap:wrap; gap:8px; }
  /* Lo que entrena hoy, primero y destacado */
  .hoy-bloque { background: var(--azul-suave); border:1px solid #C9D9E7; border-radius:14px; padding:12px 14px; margin-bottom:14px; }
  .hoy-et { display:block; font-size:12.5px; color: var(--azul-oscuro); font-weight:600; margin-bottom:8px; }
  /* Los grupos, por sección y plegados */
  .secciones { display:flex; flex-direction:column; gap:6px; }
  .sec-bloque { border:1px solid var(--linea); border-radius:14px; background:#fff; }
  .sec-bloque > summary { list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; min-height:52px; font-size:16px; font-weight:600; color: var(--navy); }
  .sec-bloque > summary::-webkit-details-marker { display:none; }
  .sec-bloque > summary::after { content:""; width:8px; height:8px; flex:0 0 auto; margin-left:4px;
    border-right:2px solid var(--texto-tenue); border-bottom:2px solid var(--texto-tenue);
    transform:rotate(45deg) translate(-2px,-2px); transition:transform .18s ease; }
  .sec-bloque[open] > summary::after { transform:rotate(-135deg) translate(-2px,-2px); }
  .sec-bloque .cuenta { font-size:12.5px; font-weight:400; color: var(--texto-suave); }
  .sec-bloque .grupos-chips { padding:0 14px 14px; }
  /* Cabecera al entrar en un grupo (la pantalla cambia, no se abre debajo) */
  .lst-cab { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .volver-g { width:44px; height:44px; flex:0 0 44px; border-radius:22px; border:1px solid var(--linea); background:#fff;
    color: var(--navy); font-size:20px; line-height:1; cursor:pointer; }
  .lst-tit h2 { margin:0; }
  .lst-sec { font-size:13px; color: var(--texto-suave); }
  .g-chip { border:1px solid var(--linea); background:#fff; color: var(--navy); border-radius:999px; padding:9px 14px; font-size:14px; font-family:inherit; cursor:pointer; }
  .g-chip.activo { background: var(--navy); color:#fff; border-color: var(--navy); }
  .g-chip small { display:block; font-size:12px; color: var(--texto-tenue); }
  .g-chip.activo small { color:#c9d6e2; }

  /* Lista de asistencia */
  .lst-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 0 8px; flex-wrap:wrap; }
  .lst-fecha { font-family: var(--fuente-mono); font-size:12px; color: var(--texto-suave); }
  .lst-cont { font-family: var(--fuente-mono); font-size:13px; color: var(--navy); background: var(--crema-media); padding:4px 10px; border-radius:999px; }
  .fila-at { display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid #F2ECDE; }
  .fila-at:last-child { border-bottom:0; }
  .fila-at .nom { flex:1; min-width:0; color: var(--navy); font-size:15px; }
  .fila-at .nom small { display:block; color: var(--texto-suave); font-size:12px; }
  .toggle { border:1px solid var(--linea); background:#fff; color: var(--texto-suave); border-radius:999px; padding:8px 14px; font-size:13px; font-family:var(--fuente-mono); cursor:pointer; min-width:78px; text-align:center; }
  .toggle.vino { background:#E9F6EC; border-color:#Bfe3C7; color:#1e7a3d; }
  .toggle.falta { background:#FBE9E7; border-color:#F1C9C4; color:#A8453F; }
  .guardar-barra { display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  .lst-estado { font-size:13px; color: var(--texto-suave); }
  .lst-estado.sin-guardar { color:#A8453F; font-weight:600; }
  .lst-estado.guardado { color:#1e7a3d; font-weight:600; }
  .lst-error { margin:10px 0 0; background:#FBE9E7; border:1px solid #F1C9C4; color:#8f2c2b;
    border-radius:10px; padding:10px 12px; font-size:13.5px; }
  .aviso-fam { background: var(--azul-suave); border:1px solid #C9D9E7; border-radius:10px; padding:10px 12px; font-size:13px; color: var(--navy); margin-bottom:10px; }

  .vacio { color: var(--texto-suave); font-size:14px; padding:8px 0; }

  /* ---------- NOTA DEL DÍA ----------
     Botón discreto en cada fila. Si ese día ya hay algo apuntado se
     pone en azul con un punto, para verlo de un vistazo sin abrirlo. */
  .nd-btn { width:44px; height:44px; flex:0 0 44px; padding:0; position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--linea); background:#fff; border-radius:12px;
    color: var(--texto-tenue); cursor:pointer; }
  .nd-btn svg { width:20px; height:20px; }
  .nd-btn.tiene { color: var(--azul-oscuro); background: var(--azul-suave); border-color:#C9D9E7; }
  .nd-btn.tiene::after { content:""; position:absolute; top:5px; right:5px; width:8px; height:8px;
    border-radius:50%; background: var(--azul-oscuro); }
  .privado-linea { font-size:12.5px; color: var(--texto-suave); margin:10px 0 0; }

  /* Ventana emergente de la nota (mismo patrón que el resto del panel) */
  #modal-nota { position:fixed; inset:0; z-index:1000; background:rgba(46,66,86,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(14px,5vh,60px) 14px; overflow:auto;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #modal-nota.oculto { display:none !important; }
  #modal-nota .modal-caja { background:#fff; border:1px solid var(--linea); border-radius:18px;
    box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:20px; width:min(520px,100%);
    box-sizing:border-box; animation:modal-sube .2s ease; }
  @keyframes modal-sube { from{ transform:translateY(12px); opacity:.6; } to{ transform:none; opacity:1; } }
  #modal-nota h3 { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase;
    color: var(--navy); font-size:21px; line-height:1.1; margin:0; }
  #modal-nota .mn-sub { font-family: var(--fuente-mono); font-size:12px; color: var(--texto-suave); margin:4px 0 0; }
  #modal-nota label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:14px 0 5px; }
  #modal-nota select, #modal-nota textarea { width:100%; box-sizing:border-box; padding:12px;
    border:1px solid var(--linea-borde,var(--linea)); border-radius:10px; background:#fff;
    font-family:inherit; font-size:16px; color: var(--navy); }
  #modal-nota textarea { min-height:110px; resize:vertical; line-height:1.45; }
  #modal-nota .mn-acc { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  #modal-nota .mn-msg { font-size:13px; color: var(--texto-suave); }
  #modal-nota .mn-msg.error { color:#A8453F; font-weight:600; }
  .mn-privado { background: var(--azul-suave); border:1px solid #C9D9E7; border-radius:10px;
    padding:9px 11px; font-size:12.5px; color: var(--navy); margin:12px 0 0; }
  .mn-lista { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .nd-item { border:1px solid var(--linea); border-radius:12px; padding:10px 12px; background: var(--crema,#FBF9F4); }
  .nd-item.editandose { border-color: var(--azul); box-shadow:0 0 0 2px rgba(59,133,192,.16); }
  .nd-item .nm { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .nd-tipo { font-family: var(--fuente-mono); font-size:11px; padding:3px 9px; border-radius:999px;
    background: var(--crema-media); color: var(--navy); }
  .nd-tipo.t-comportamiento { background:#FBE9E7; color:#A8453F; }
  .nd-tipo.t-lesion { background:#FDF3DD; color:#8A5507; }
  .nd-tipo.t-material { background:#EDE7F6; color:#5B4A8A; }
  .nd-tipo.t-familia { background: var(--azul-suave); color: var(--azul-oscuro); }
  .nd-quien { font-size:12px; color: var(--texto-tenue); }
  .nd-txt { margin:6px 0 0; font-size:14.5px; color: var(--navy); line-height:1.45; white-space:pre-wrap; }
  .nd-acc { display:flex; gap:6px; margin-top:8px; }
  .nd-lin { border:0; background:none; padding:8px 10px; min-height:44px; font-family:inherit; font-size:13px;
    color: var(--azul-oscuro); cursor:pointer; text-decoration:underline; }
  .nd-lin.peligro { color:#A8453F; }

  /* Barra inferior tipo app · mismo aspecto que la del resto del panel
     y la del portal (assets/js/admin-tabbar.js). */
  .tabbar { display:flex; align-items:stretch; position:fixed; left:0; right:0; bottom:0; z-index:600;
    box-sizing:border-box; max-width:100%;
    background:rgba(255,255,255,.97); -webkit-backdrop-filter:saturate(1.3) blur(10px); backdrop-filter:saturate(1.3) blur(10px);
    border-top:1px solid var(--linea); padding:10px 6px calc(10px + env(safe-area-inset-bottom)); }
  .tabbar a { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-height:48px; cursor:pointer; padding:0 2px;
    text-decoration:none; color: var(--texto-tenue,#A79F8E); font-family:inherit; font-size:11px; font-weight:400;
    line-height:1.2; letter-spacing:.01em; text-transform:none; -webkit-tap-highlight-color:transparent; }
  .tabbar a .ic { width:24px; height:24px; flex:0 0 24px; }
  .tabbar a .tx { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tabbar a.activo { color: var(--azul-oscuro,#2F6FA8); }
  .tabbar a.activo .tx { font-weight:600; }
  .tabbar a.activo .ic { stroke-width:2; }
  html, body { max-width:100%; overflow-x:hidden; }
</style>
</head>
<body>

<div id="admin-contenido">
  <main class="wrap">
    <div class="cab">
      <h1>En la pista</h1>
      <p>Herramientas rápidas para el día a día: pasar lista, buscar a un niño y ver quién ha venido hoy.</p>
    </div>
    <section id="sec-lista"></section>
    <section id="sec-buscar" hidden></section>
    <section id="sec-hoy" hidden></section>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- Ventana para apuntar la nota del día de un atleta. Vacía hasta que se abre. -->
<div id="modal-nota" class="oculto" role="dialog" aria-modal="true" aria-label="Nota del día"><div class="modal-caja" id="modal-nota-caja"></div></div>

<script>
window.APOLANA_ADMIN.listo(function (sb) {
  var $ = function(id){ return document.getElementById(id); };
  /* La fecha se calcula CADA VEZ que se usa, no una sola vez al abrir: el panel
     se queda abierto en el móvil de un día para otro y, si no, la lista de la
     mañana siguiente se guardaría con la fecha de ayer. */
  function fechaHoy(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fechaBonita(iso){ return (iso||'').split('-').reverse().join('/'); }
  function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function nombreDe(a){ return [a.nombre, a.apellidos].filter(Boolean).join(' '); }
  function iniciales(a){ return ((a.nombre||'?')[0]+(a.apellidos?a.apellidos[0]:'')).toUpperCase(); }
  function edad(a){ if(!a.fecha_nacimiento) return null; var n=new Date(a.fecha_nacimiento), h=new Date(); var e=h.getFullYear()-n.getFullYear(); var m=h.getMonth()-n.getMonth(); if(m<0||(m===0&&h.getDate()<n.getDate())) e--; return e; }

  var GRUPOS = [], ATLETAS = [], GMAP = {}, PERSONAS = {}, YO = '';
  var svg = function(p,f){ return '<svg class="ic" viewBox="0 0 24 24" fill="'+(f||'none')+'" stroke="'+(f?'none':'currentColor')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; };
  var icLista = svg('<path d="M9 4h6a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v0a1 1 0 0 1 1-1z"/><path d="M6 5H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1"/><path d="M8 11l2 2 3.5-3.5M8 16h6"/>');
  var icBuscar = svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>');
  var icHoy = svg('<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>');
  var icPanel = svg('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>');

  var TABS = [
    {sec:'lista', txt:'Pasar lista', ic:icLista},
    {sec:'buscar', txt:'Buscar', ic:icBuscar},
    {sec:'hoy', txt:'Hoy', ic:icHoy}
  ];
  function pintarTabbar(activa){
    var h = TABS.map(function(t){ return '<a data-sec="'+t.sec+'"'+(t.sec===activa?' class="activo"':'')+'>'+t.ic+'<span class="tx">'+t.txt+'</span></a>'; }).join('');
    h += '<a href="../">'+icPanel+'<span class="tx">Panel</span></a>';
    $('tabbar').innerHTML = h;
    $('tabbar').querySelectorAll('a[data-sec]').forEach(function(a){ a.addEventListener('click', function(){ irA(a.getAttribute('data-sec')); }); });
  }
  function irA(sec){
    ['lista','buscar','hoy'].forEach(function(s){ $('sec-'+s).hidden = (s!==sec); });
    $('tabbar').querySelectorAll('a[data-sec]').forEach(function(a){ a.classList.toggle('activo', a.getAttribute('data-sec')===sec); });
    window.scrollTo(0,0);
    if(sec==='hoy') pintarHoy();
  }

  // ---------- Carga de datos ----------
  async function cargar(){
    var g = await sb.from('grupos').select('id,nombre,seccion,horario,activo').eq('activo',true).order('nombre');
    if(!g.error && g.data){ GRUPOS = g.data; GRUPOS.forEach(function(x){ GMAP[x.id]=x; }); }
    var a = await sb.from('atletas').select('id,nombre,apellidos,fecha_nacimiento,categoria,grupo_id,estado,fecha_prueba_fin').neq('estado','baja').order('apellidos');
    if(!a.error && a.data) ATLETAS = a.data;
    /* Quién está usando el panel: se guarda como autor de las notas, para
       que en el informe se pueda decir quién apuntó cada cosa. */
    try {
      var s = await sb.auth.getSession();
      if(s && s.data && s.data.session) YO = s.data.session.user.id;
    } catch(e){}
    try {
      var p = await sb.from('perfiles').select('id,nombre,apellidos');
      if(!p.error && p.data) p.data.forEach(function(x){ PERSONAS[x.id] = [x.nombre,x.apellidos].filter(Boolean).join(' '); });
    } catch(e){}
  }

  // ---------- SECCIÓN: BUSCAR ----------
  function pintarBuscar(){
    $('sec-buscar').innerHTML =
      '<div class="card"><h2>Buscar a un niño</h2>'+
      '<input class="buscar-in" id="q" placeholder="Nombre o apellido…" autocomplete="off">'+
      '<p class="vacio" id="q-ayuda">Escribe para ver en qué grupo va cada uno.</p>'+
      '<div class="res" id="q-res"></div></div>';
    var q = $('q');
    q.addEventListener('input', function(){
      var f = norm(q.value.trim());
      var res = $('q-res'), ayuda = $('q-ayuda');
      if(f.length<2){ res.innerHTML=''; ayuda.style.display=''; ayuda.textContent='Escribe para ver en qué grupo va cada uno.'; return; }
      ayuda.style.display='none';
      var lista = ATLETAS.filter(function(a){ return norm(nombreDe(a)).indexOf(f)>-1; }).slice(0,40);
      if(!lista.length){ res.innerHTML='<p class="vacio">Nadie con ese nombre. Si es de prueba, quizá aún no está dado de alta.</p>'; return; }
      res.innerHTML = lista.map(function(a){
        var g = GMAP[a.grupo_id];
        var e = edad(a);
        var chip = g ? '<span class="chip-g">'+esc(g.nombre)+'</span>' : '<span class="chip-g sin">Sin grupo</span>';
        var pr = a.estado==='prueba' ? '<span class="badge-prueba">PRUEBA</span>' : '';
        return '<div class="res-item"><div class="av">'+esc(iniciales(a))+'</div>'+
          '<div class="info"><b>'+esc(nombreDe(a))+pr+'</b><small>'+(e!=null?e+' años':'')+(a.categoria?' · '+esc(a.categoria):'')+'</small></div>'+chip+'</div>';
      }).join('');
    });
  }

  // ---------- SECCIÓN: PASAR LISTA ----------
  /* `sucio` = hay marcas puestas a mano que todavía NO están en la base.
     Es lo que evita que se pierda el trabajo al salir de la lista. */
  var LST = { grupo:'', fecha:'', marcas:{}, guardadas:{}, ausencias:{}, sucio:false, guardando:false, guardadoEn:'', error:'', version:0 };
  function atletasDeGrupo(gid){ return ATLETAS.filter(function(a){ return a.grupo_id===gid && a.estado!=='baja'; }); }

  /* Los grupos, agrupados por sección y plegados: con 27 grupos, una lista
     alfabética suelta era imposible de mirar a pie de pista. */
  var SECCIONES_ORDEN = ['escuela','escuela-natacion','competicion','natacion','running','montana','triatlon','cubo'];
  var SECCION_NOMBRE = {
    'escuela':'Escuela', 'escuela-natacion':'Escuela de natación', 'competicion':'Atletismo',
    'natacion':'Natación', 'running':'Running', 'montana':'Montaña',
    'triatlon':'Triatlón', 'cubo':'El Cubo'
  };
  /* ¿Este grupo entrena hoy? Se mira en el texto del horario. */
  var DIAS_HOY = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  function entrenaHoy(g){
    var t = (g.horario||'').toLowerCase()
      .replace(/miercoles/g,'miércoles').replace(/sabado/g,'sábado');
    var hoy = DIAS_HOY[new Date().getDay()];
    if(t.indexOf('de lunes a viernes')!==-1 && hoy!=='sábado' && hoy!=='domingo') return true;
    return t.indexOf(hoy)!==-1;
  }
  function chipGrupo(g){
    var n = atletasDeGrupo(g.id).length;
    return '<button type="button" class="g-chip'+(g.id===LST.grupo?' activo':'')+'" data-g="'+g.id+'">'+
             esc(g.nombre)+'<small>'+n+' atletas</small></button>';
  }
  function pintarLista(){
    /* Con un grupo elegido, la pantalla se convierte en SU lista: no se abre
       nada debajo, se cambia de vista y se vuelve con la flecha. */
    if(LST.grupo){
      var gr = GMAP[LST.grupo];
      $('sec-lista').innerHTML =
        '<div class="card">'+
          '<div class="lst-cab">'+
            '<button type="button" class="volver-g" id="lst-volver" aria-label="Volver a los grupos">←</button>'+
            '<div class="lst-tit"><h2>'+esc(gr?gr.nombre:'Pasar lista')+'</h2>'+
              (gr&&gr.seccion?'<span class="lst-sec">'+esc(SECCION_NOMBRE[gr.seccion]||gr.seccion)+'</span>':'')+
            '</div>'+
          '</div>'+
          '<div id="lista-cuerpo"></div>'+
        '</div>';
      $('lst-volver').addEventListener('click', async function(){
        if(!(await puedoSalirDeLaLista())) return;
        LST.grupo=''; LST.fecha=''; LST.marcas={}; LST.guardadas={}; LST.ausencias={};
        LST.sucio=false; LST.guardadoEn=''; LST.error=''; NOTAS={};
        pintarLista(); window.scrollTo(0,0);
      });
      pintarCuerpoLista();
      return;
    }

    var hoyGrupos = GRUPOS.filter(entrenaHoy);
    var html = '<div class="card"><h2>Pasar lista</h2>';

    /* Primero, lo que toca hoy: es lo que se busca con el móvil en la mano. */
    if(hoyGrupos.length){
      html += '<div class="hoy-bloque"><span class="hoy-et">Entrenan hoy</span>'+
              '<div class="grupos-chips">'+hoyGrupos.map(chipGrupo).join('')+'</div></div>';
    }

    /* Debajo, todos los grupos por sección, plegados. */
    var porSeccion = {};
    GRUPOS.forEach(function(g){ (porSeccion[g.seccion||'otros'] = porSeccion[g.seccion||'otros'] || []).push(g); });
    var claves = Object.keys(porSeccion).sort(function(a,b){
      var ia = SECCIONES_ORDEN.indexOf(a), ib = SECCIONES_ORDEN.indexOf(b);
      return (ia<0?99:ia) - (ib<0?99:ib);
    });
    html += '<div class="secciones">'+claves.map(function(k){
      var gs = porSeccion[k];
      var atl = gs.reduce(function(s,g){ return s + atletasDeGrupo(g.id).length; }, 0);
      var abierto = gs.some(function(g){ return g.id===LST.grupo; });
      return '<details class="sec-bloque"'+(abierto?' open':'')+'>'+
               '<summary>'+esc(SECCION_NOMBRE[k]||k)+
                 '<span class="cuenta">'+gs.length+(gs.length===1?' grupo':' grupos')+' · '+atl+' atletas</span>'+
               '</summary>'+
               '<div class="grupos-chips">'+gs.map(chipGrupo).join('')+'</div>'+
             '</details>';
    }).join('')+'</div>';

    html += '<div id="lista-cuerpo"></div></div>';
    $('sec-lista').innerHTML = html;
    $('sec-lista').querySelectorAll('.g-chip').forEach(function(b){ b.addEventListener('click', function(){ seleccionarGrupo(b.getAttribute('data-g')); }); });
    if(LST.grupo) pintarCuerpoLista();
  }

  /* BORRADOR EN EL PROPIO MÓVIL
     La flecha de atrás ya pregunta, pero en un móvil a pie de pista la pestaña
     se puede cerrar sola (se queda sin batería, el sistema la mata, se va la
     cobertura). Cada toque deja copia de lo marcado en el propio teléfono, y
     al volver a entrar en ese grupo y ese día se recupera. Se borra en cuanto
     queda guardado en la base, así que nunca "resucita" nada viejo. */
  var BORRADOR = 'apolana.lista.panel';
  function guardarBorrador(){
    try {
      var m = {};
      Object.keys(LST.marcas).forEach(function(id){ m[id] = (LST.marcas[id]===undefined ? null : LST.marcas[id]); });
      localStorage.setItem(BORRADOR, JSON.stringify({ grupo:LST.grupo, fecha:LST.fecha, marcas:m }));
    } catch(e){}
  }
  function borrarBorrador(){ try { localStorage.removeItem(BORRADOR); } catch(e){} }
  function leerBorrador(){ try { return JSON.parse(localStorage.getItem(BORRADOR) || 'null'); } catch(e){ return null; } }
  /* Devuelve true si había un borrador de ESTE grupo y ESTE día con algo
     distinto de lo que hay guardado. */
  function recuperarBorrador(){
    var b = leerBorrador();
    if(!b || b.grupo!==LST.grupo || b.fecha!==LST.fecha || !b.marcas) return false;
    var distinto = false;
    Object.keys(b.marcas).forEach(function(id){
      var v = (b.marcas[id]===null ? undefined : b.marcas[id]);
      if(LST.marcas[id] !== v){ LST.marcas[id] = v; distinto = true; }
    });
    return distinto;
  }

  /* Salir de la lista (flecha atrás o cambio de grupo) sin perder nada:
     si hay marcas sin guardar no se tira nada por la borda, se guarda.
     Elegimos guardar en vez de "descartar" porque a pie de pista el error
     caro es perder la lista, nunca guardarla de más: una marca de sobra se
     corrige en dos toques, una lista perdida hay que repetirla entera. */
  async function puedoSalirDeLaLista(){
    if(!LST.sucio) return true;
    var ok = window.apoConfirm ? await window.apoConfirm({
      titulo: 'Tienes marcas sin guardar',
      texto: 'Has marcado a alguien y todavía no se ha guardado. Si sales ahora se perdería.',
      confirmar: 'Guardar y salir',
      cancelar: 'Seguir en la lista'
    }) : true;
    if(!ok) return false;
    return await guardarLista();
  }

  async function seleccionarGrupo(gid){
    if(!(await puedoSalirDeLaLista())) return;
    LST.grupo = gid; LST.fecha = fechaHoy();
    LST.marcas = {}; LST.guardadas = {}; LST.ausencias = {};
    LST.sucio = false; LST.guardadoEn = ''; LST.error = '';
    pintarLista();
    $('lista-cuerpo').innerHTML = '<p class="vacio">Cargando…</p>';
    var ids = atletasDeGrupo(gid).map(function(a){ return a.id; });
    if(ids.length){
      var asis = await sb.from('asistencia').select('atleta_id,presente').eq('fecha',LST.fecha).in('atleta_id',ids);
      if(asis.error){
        /* Si no se ha podido leer lo ya guardado, hay que decirlo: si no, el
           entrenador vería la lista en blanco y creería que nadie está pasado. */
        LST.error = 'No se ha podido leer la lista guardada de hoy ('+(asis.error.message||'sin conexión')+'). Vuelve a entrar en el grupo antes de marcar, para no pisar lo que ya hubiera.';
      } else if(asis.data){
        asis.data.forEach(function(r){ LST.marcas[r.atleta_id]=!!r.presente; LST.guardadas[r.atleta_id]=true; });
      }
      try {
        var au = await sb.from('ausencias').select('atleta_id,motivo,avisado_por_nombre').eq('fecha',LST.fecha).in('atleta_id',ids);
        if(!au.error && au.data) au.data.forEach(function(r){
          LST.ausencias[r.atleta_id]=r;
          /* La falta avisada por la familia se deja PREPARADA como falta, pero
             sin guardar todavía: hasta que no se le da a Guardar no hay fila.
             No cuenta como "cambio sin guardar": no es trabajo del entrenador
             y se vuelve a preparar sola la próxima vez que entre. */
          if(LST.marcas[r.atleta_id]===undefined) LST.marcas[r.atleta_id]=false;
        });
      } catch(e){}
    }
    /* Las notas de ESE día: así el icono de cada fila ya sale marcado si
       alguien apuntó algo antes (por ejemplo, al corregir la lista). */
    await cargarNotasDia(ids, LST.fecha);
    if(recuperarBorrador()){
      LST.sucio = true;
      LST.error = 'Se han recuperado las marcas que quedaron sin guardar en este móvil. Repásalas y dale a «Guardar lista».';
    }
    pintarCuerpoLista();
  }

  function estadoToggle(v){ return v===true ? 'vino' : v===false ? 'falta' : ''; }
  function textoToggle(v){ return v===true ? 'Vino' : v===false ? 'Falta' : 'Marcar'; }

  function pintarCuerpoLista(){
    var cuerpo = $('lista-cuerpo'); if(!cuerpo) return;
    var g = GMAP[LST.grupo];
    var atls = atletasDeGrupo(LST.grupo);
    var pres = 0, marc = 0;
    atls.forEach(function(a){ if(LST.marcas[a.id]!==undefined){ marc++; if(LST.marcas[a.id]) pres++; } });

    if(!atls.length){ cuerpo.innerHTML = '<p class="vacio">Este grupo no tiene atletas en activo.</p>'; return; }

    var conAviso = atls.filter(function(a){ return LST.ausencias[a.id]; });
    var aviso = conAviso.length ? '<div class="aviso-fam"><b>'+conAviso.length+' falta'+(conAviso.length>1?'s':'')+' avisada'+(conAviso.length>1?'s':'')+' por la familia.</b> Se marcan como falta; cámbialo si al final vino.</div>' : '';

    var filas = atls.map(function(a){
      var e = edad(a);
      var v = LST.marcas[a.id];
      var nn = (NOTAS[a.id]||[]).length;
      var etiqNota = nn ? nn+(nn>1?' notas':' nota')+' de hoy · '+nombreDe(a) : 'Añadir nota de hoy · '+nombreDe(a);
      return '<div class="fila-at"><div class="nom">'+esc(nombreDe(a))+(a.estado==='prueba'?'<span class="badge-prueba">PRUEBA</span>':'')+'<small>'+(e!=null?e+' años':'')+'</small></div>'+
        '<button type="button" class="nd-btn'+(nn?' tiene':'')+'" data-nota="'+a.id+'" title="'+esc(etiqNota)+'" aria-label="'+esc(etiqNota)+'">'+icNota+'</button>'+
        '<button type="button" class="toggle '+estadoToggle(v)+'" data-a="'+a.id+'">'+textoToggle(v)+'</button></div>';
    }).join('');

    /* Que se vea de un vistazo si lo de la pantalla está ya en la base. */
    var estado = LST.sucio
      ? '<span class="lst-estado sin-guardar">Cambios sin guardar</span>'
      : (LST.guardadoEn ? '<span class="lst-estado guardado">Guardado a las '+esc(LST.guardadoEn)+'</span>'
                        : '<span class="lst-estado">'+marc+' de '+atls.length+' marcados</span>');
    var errorHTML = LST.error ? '<p class="lst-error">'+esc(LST.error)+'</p>' : '';

    cuerpo.innerHTML =
      '<div class="lst-top"><span class="lst-fecha">'+(LST.fecha===fechaHoy()?'Hoy · ':'Lista del ')+fechaBonita(LST.fecha)+(g&&g.horario?' · '+esc(g.horario):'')+'</span>'+
      '<span class="lst-cont">'+pres+' / '+atls.length+'</span></div>'+
      aviso + filas +
      '<div class="guardar-barra"><button type="button" class="btn btn--primario" id="lst-guardar"'+(LST.guardando?' disabled':'')+'>'+
        (LST.guardando?'Guardando…':'Guardar lista')+'</button>'+estado+'</div>'+
      errorHTML+
      '<p class="privado-linea">El icono de nota sirve para apuntar lo que pase con un atleta ese día. Son notas internas del club: la familia no las ve.</p>';

    cuerpo.querySelectorAll('.nd-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ abrirNota(btn.getAttribute('data-nota')); });
    });
    cuerpo.querySelectorAll('.toggle').forEach(function(btn){ btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-a');
      var v = LST.marcas[id];
      LST.marcas[id] = (v===undefined) ? true : (v===true) ? false : undefined;
      LST.sucio = true; LST.guardadoEn = ''; LST.version++;
      guardarBorrador();
      pintarCuerpoLista();
    }); });
    $('lst-guardar').addEventListener('click', guardarLista);
  }

  /* Devuelve true solo si TODO ha quedado escrito en la base. */
  async function guardarLista(){
    if(LST.guardando) return false;                 // dos toques seguidos = un solo guardado
    var atls = atletasDeGrupo(LST.grupo);
    var fecha = LST.fecha || fechaHoy();
    var filas = [], borrar = [];
    atls.forEach(function(a){
      var v = LST.marcas[a.id];
      if(v===undefined){ if(LST.guardadas[a.id]) borrar.push(a.id); }
      else filas.push({ atleta_id:a.id, fecha:fecha, grupo_id:LST.grupo, presente:v });
    });
    if(!filas.length && !borrar.length){
      if(window.apoToast) window.apoToast('Todavía no has marcado a nadie.','info');
      return false;
    }
    LST.guardando = true; LST.error = '';
    var version0 = LST.version;   // por si se marca a alguien más mientras se guarda
    var btn = $('lst-guardar'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
    try {
      if(filas.length){ var r = await sb.from('asistencia').upsert(filas, { onConflict:'atleta_id,fecha' }); if(r.error) throw r.error; }
      /* El borrado también puede fallar: si no se mira, se diría "guardada"
         habiendo quedado marcas viejas que el entrenador acaba de quitar. */
      if(borrar.length){ var d = await sb.from('asistencia').delete().eq('fecha',fecha).in('atleta_id',borrar); if(d.error) throw d.error; }
      LST.guardadas = {};
      filas.forEach(function(f){ LST.guardadas[f.atleta_id]=true; });
      LST.sucio = (LST.version !== version0);   // si tocó algo mientras tanto, sigue pendiente
      LST.guardadoEn = LST.sucio ? '' : new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      LST.guardando = false;
      if(LST.sucio) guardarBorrador(); else borrarBorrador();
      pintarCuerpoLista();
      var pres = filas.filter(function(f){ return f.presente; }).length;
      if(window.apoToast) window.apoToast('Lista guardada · '+pres+' de '+atls.length+' presentes','ok');
      return !LST.sucio;
    } catch(e){
      LST.guardando = false;
      LST.error = 'NO se ha guardado: '+((e&&e.message)||e)+'. Las marcas siguen aquí: comprueba la conexión y vuelve a darle a «Guardar lista».';
      pintarCuerpoLista();
      if(window.apoToast) window.apoToast('No se ha guardado. Las marcas siguen en pantalla, vuelve a intentarlo.','error');
      return false;
    }
  }

  /* Última red: si se cierra la pestaña o se sale del panel con marcas
     sin guardar, el navegador pregunta antes de tirarlas. */
  window.addEventListener('beforeunload', function(e){
    if(LST.grupo && LST.sucio){ e.preventDefault(); e.returnValue = ''; return ''; }
  });

  /* ============================================================
     NOTA DEL DÍA
     ------------------------------------------------------------
     Apuntar en el momento lo que ha pasado con un atleta («hoy ha
     roto X y no ha hecho caso»), para poder enseñárselo luego a la
     familia en el informe. Va en la tabla `notas_atleta`, que SOLO
     lee el equipo técnico: ni el atleta ni la familia la ven.
     La nota se guarda SOLA, sin tocar la lista: se puede apuntar
     antes de darle a «Guardar lista» y no depende de ella.
     ============================================================ */
  var TIPOS_NOTA = [
    { v:'comportamiento', t:'Comportamiento' },
    { v:'lesion',         t:'Lesión' },
    { v:'material',       t:'Material' },
    { v:'familia',        t:'Familia' },
    { v:'otro',           t:'Otro' }
  ];
  function tipoTexto(v){
    for(var i=0;i<TIPOS_NOTA.length;i++) if(TIPOS_NOTA[i].v===v) return TIPOS_NOTA[i].t;
    return 'Otro';
  }
  var icNota = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7.5z"/><path d="M15 4v4h4"/><path d="M8.5 12.5h7M8.5 16h4.5"/></svg>';

  /* NOTAS[atleta_id] = notas de ese atleta EN EL DÍA de la lista. */
  var NOTAS = {};
  var NOTA = { atleta:null, editando:'', guardando:false, msg:'', error:false };

  async function cargarNotasDia(ids, fecha){
    NOTAS = {};
    if(!ids || !ids.length || !fecha) return;
    var r = await sb.from('notas_atleta')
      .select('id,atleta_id,texto,tipo,fecha,autor_id,created_at')
      .eq('fecha', fecha).in('atleta_id', ids)
      .order('created_at', { ascending:true });
    if(r.error || !r.data) return;
    r.data.forEach(function(n){ (NOTAS[n.atleta_id] = NOTAS[n.atleta_id] || []).push(n); });
  }
  function autorTexto(n){
    if(n.autor_id && n.autor_id===YO) return 'Lo apuntaste tú';
    var nom = n.autor_id ? PERSONAS[n.autor_id] : '';
    return nom ? 'Lo apuntó '+nom : 'Equipo técnico';
  }
  function horaDe(iso){
    if(!iso) return '';
    var d = new Date(iso); if(isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }

  function abrirNota(atletaId){
    var at = null;
    ATLETAS.forEach(function(a){ if(a.id===atletaId) at = a; });
    if(!at) return;
    NOTA = { atleta:at, editando:'', guardando:false, msg:'', error:false };
    $('modal-nota').classList.remove('oculto');
    pintarModalNota();
  }
  function cerrarNota(){
    $('modal-nota').classList.add('oculto');
    $('modal-nota-caja').innerHTML = '';
    NOTA = { atleta:null, editando:'', guardando:false, msg:'', error:false };
    pintarCuerpoLista();
  }

  function pintarModalNota(){
    var at = NOTA.atleta; if(!at) return;
    var caja = $('modal-nota-caja');
    var lista = NOTAS[at.id] || [];
    var enEdicion = null;
    lista.forEach(function(n){ if(n.id===NOTA.editando) enEdicion = n; });

    var notasHTML = lista.length
      ? '<div class="mn-lista">'+lista.map(function(n){
          return '<div class="nd-item'+(n.id===NOTA.editando?' editandose':'')+'">'+
            '<div class="nm"><span class="nd-tipo t-'+esc(n.tipo||'otro')+'">'+esc(tipoTexto(n.tipo))+'</span>'+
              '<span class="nd-quien">'+esc(autorTexto(n))+(horaDe(n.created_at)?' · '+esc(horaDe(n.created_at)):'')+'</span></div>'+
            '<p class="nd-txt">'+esc(n.texto)+'</p>'+
            '<div class="nd-acc">'+
              '<button type="button" class="nd-lin" data-editar="'+esc(n.id)+'">Editar</button>'+
              '<button type="button" class="nd-lin peligro" data-borrar="'+esc(n.id)+'">Borrar</button>'+
            '</div></div>';
        }).join('')+'</div>'
      : '';

    var tipoSel = enEdicion ? (enEdicion.tipo||'otro') : 'comportamiento';
    caja.innerHTML =
      '<h3>'+esc(nombreDe(at))+'</h3>'+
      '<p class="mn-sub">Nota del '+esc(fechaBonita(LST.fecha||fechaHoy()))+'</p>'+
      notasHTML +
      '<label for="mn-tipo">'+(enEdicion?'Corrige la nota':'Qué ha pasado')+'</label>'+
      '<select id="mn-tipo">'+TIPOS_NOTA.map(function(t){
        return '<option value="'+t.v+'"'+(t.v===tipoSel?' selected':'')+'>'+t.t+'</option>';
      }).join('')+'</select>'+
      '<label for="mn-texto">En dos líneas</label>'+
      '<textarea id="mn-texto" placeholder="Ha roto un cono y no ha hecho caso cuando se le ha llamado la atención.">'+esc(enEdicion?enEdicion.texto:'')+'</textarea>'+
      '<div class="mn-acc">'+
        '<button type="button" class="btn btn--primario" id="mn-guardar"'+(NOTA.guardando?' disabled':'')+'>'+
          (NOTA.guardando ? 'Guardando…' : (enEdicion ? 'Guardar cambios' : 'Guardar nota'))+'</button>'+
        '<button type="button" class="btn btn--neutro" id="mn-cerrar">'+(enEdicion?'Dejarlo como estaba':'Cerrar')+'</button>'+
        '<span class="mn-msg'+(NOTA.error?' error':'')+'">'+esc(NOTA.msg)+'</span>'+
      '</div>'+
      '<p class="mn-privado">Esta nota es interna del club: la ve el equipo técnico y nadie más. La familia y el atleta no la ven en su portal.</p>';

    $('mn-cerrar').addEventListener('click', function(){
      if(NOTA.editando){ NOTA.editando=''; NOTA.msg=''; NOTA.error=false; pintarModalNota(); return; }
      cerrarNota();
    });
    $('mn-guardar').addEventListener('click', guardarNota);
    caja.querySelectorAll('[data-editar]').forEach(function(b){
      b.addEventListener('click', function(){
        NOTA.editando = b.getAttribute('data-editar'); NOTA.msg=''; NOTA.error=false;
        pintarModalNota();
        var t = $('mn-texto'); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
      });
    });
    caja.querySelectorAll('[data-borrar]').forEach(function(b){
      b.addEventListener('click', function(){ borrarNota(b.getAttribute('data-borrar')); });
    });
  }

  async function guardarNota(){
    if(NOTA.guardando || !NOTA.atleta) return;
    var texto = ($('mn-texto').value||'').trim();
    var tipo = $('mn-tipo').value;
    if(!texto){ NOTA.msg='Escribe qué ha pasado antes de guardar.'; NOTA.error=true; pintarModalNota(); return; }
    NOTA.guardando = true; NOTA.msg='Guardando…'; NOTA.error=false; pintarModalNota();
    var at = NOTA.atleta, fecha = LST.fecha || fechaHoy();
    try {
      if(NOTA.editando){
        var up = await sb.from('notas_atleta').update({ texto:texto, tipo:tipo })
          .eq('id', NOTA.editando).select('id,atleta_id,texto,tipo,fecha,autor_id,created_at');
        if(up.error) throw up.error;
        if(!up.data || !up.data.length) throw new Error('no se ha encontrado la nota');
        var lst = NOTAS[at.id] || [];
        for(var i=0;i<lst.length;i++) if(lst[i].id===NOTA.editando) lst[i] = up.data[0];
        NOTA.editando = '';
      } else {
        var ins = await sb.from('notas_atleta').insert({
          atleta_id: at.id, autor_id: YO || null, texto: texto, tipo: tipo,
          fecha: fecha, grupo_id: LST.grupo || at.grupo_id || null
        }).select('id,atleta_id,texto,tipo,fecha,autor_id,created_at');
        if(ins.error) throw ins.error;
        if(ins.data && ins.data.length) (NOTAS[at.id] = NOTAS[at.id] || []).push(ins.data[0]);
      }
      NOTA.guardando = false; NOTA.msg = 'Nota guardada.'; NOTA.error = false;
      pintarModalNota();
      var t = $('mn-texto'); if(t) t.value = '';
      pintarCuerpoLista();
      if(window.apoToast) window.apoToast('Nota guardada · '+nombreDe(at),'ok');
    } catch(e){
      NOTA.guardando = false;
      NOTA.msg = 'NO se ha guardado: '+((e&&e.message)||e)+'. El texto sigue aquí, vuelve a intentarlo.';
      NOTA.error = true;
      pintarModalNota();
    }
  }

  async function borrarNota(id){
    var ok = window.apoConfirm ? await window.apoConfirm({
      titulo: 'Borrar la nota',
      texto: 'Se borra del historial del atleta y no se puede recuperar.',
      confirmar: 'Borrar', cancelar: 'Dejarla', peligro: true
    }) : true;
    if(!ok) return;
    var at = NOTA.atleta; if(!at) return;
    var d = await sb.from('notas_atleta').delete().eq('id', id);
    if(d.error){ NOTA.msg='NO se ha borrado: '+(d.error.message||''); NOTA.error=true; pintarModalNota(); return; }
    NOTAS[at.id] = (NOTAS[at.id]||[]).filter(function(n){ return n.id!==id; });
    if(NOTA.editando===id) NOTA.editando='';
    NOTA.msg = 'Nota borrada.'; NOTA.error = false;
    pintarModalNota();
    pintarCuerpoLista();
  }

  $('modal-nota').addEventListener('click', function(e){ if(e.target===this) cerrarNota(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && !$('modal-nota').classList.contains('oculto')) cerrarNota();
  });

  // ---------- SECCIÓN: HOY ----------
  async function pintarHoy(){
    var cont = $('sec-hoy');
    cont.innerHTML = '<div class="card"><h2>Quién ha venido hoy</h2><p class="vacio">Cargando…</p></div>';
    var hoy = fechaHoy();
    var res = await sb.from('asistencia').select('atleta_id,presente').eq('fecha',hoy);
    if(res.error){
      cont.innerHTML = '<div class="card"><h2>Quién ha venido hoy</h2>'+
        '<p class="lst-error">No se ha podido leer la asistencia de hoy: '+esc(res.error.message||'sin conexión')+'.</p>'+
        '<div class="guardar-barra"><button type="button" class="btn btn--neutro" id="hoy-refrescar">Reintentar</button></div></div>';
      var rb0 = $('hoy-refrescar'); if(rb0) rb0.addEventListener('click', pintarHoy);
      return;
    }
    var pres = {}; if(res.data) res.data.forEach(function(r){ if(r.presente) pres[r.atleta_id]=true; });
    var totalPres = Object.keys(pres).length;
    var porGrupo = GRUPOS.map(function(g){
      var atls = atletasDeGrupo(g.id);
      var p = atls.filter(function(a){ return pres[a.id]; });
      return { g:g, presentes:p, total:atls.length };
    }).filter(function(x){ return x.presentes.length>0; });

    var html = '<div class="card"><h2>Quién ha venido hoy</h2>'+
      '<p class="vacio">'+fechaBonita(hoy)+' · <b>'+totalPres+'</b> presentes en total. '+
      '<button type="button" class="btn btn--neutro btn--mini" id="hoy-refrescar" style="margin-left:6px">Actualizar</button></p>';
    if(!porGrupo.length){ html += '<p class="vacio">Todavía nadie marcado hoy. Ve a "Pasar lista".</p>'; }
    else {
      html += porGrupo.map(function(x){
        return '<div style="margin-top:12px"><div class="lst-top"><span class="lst-fecha">'+esc(x.g.nombre)+'</span><span class="lst-cont">'+x.presentes.length+' / '+x.total+'</span></div>'+
          x.presentes.map(function(a){ return '<div class="fila-at"><div class="nom">'+esc(nombreDe(a))+'</div><span class="toggle vino">Vino</span></div>'; }).join('')+'</div>';
      }).join('');
    }
    html += '</div>';
    cont.innerHTML = html;
    var rb = $('hoy-refrescar'); if(rb) rb.addEventListener('click', pintarHoy);
  }

  // ---------- Arranque ----------
  (async function(){
    pintarTabbar('lista');
    await cargar();
    pintarLista();
    pintarBuscar();
  })();
});
</script>
