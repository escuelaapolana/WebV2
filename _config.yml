# GitHub Pages: no publicar carpetas internas (esquema de BD, documentos de diseño,
# herramientas, notas y el código de las funciones de pago). No contienen secretos,
# pero no deben ser públicas.
exclude:
  - migraciones/
  - supabase/
  - docs/
  - herramientas/
  - maquetas/
  - piezas/                 # documentos de diseño internos (no son web pública)
  - "*.sql"
  - SETUP-SUPABASE.md
  - ESPECIFICACION.md
  - README.md
  - CLAUDE.md               # notas internas de trabajo (no se sirven en el dominio)
  - ping-base-de-datos.yml  # workflow interno de mantenimiento
  - cuerpo.json             # fichero suelto de pruebas
