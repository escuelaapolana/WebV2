# GitHub Pages: no publicar carpetas internas (esquema de BD, documentos de diseño,
# herramientas, notas y el código de las funciones de pago). No contienen secretos,
# pero no deben ser públicas.
exclude:
  - migraciones/
  - supabase/
  - docs/
  - herramientas/
  - maquetas/
  - "*.sql"
  - SETUP-SUPABASE.md
  - ESPECIFICACION.md
  - README.md
