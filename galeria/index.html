<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería · Club Atletismo Apolana</title>
<meta name="description" content="Galería de fotos del Club Atletismo Apolana: pista, running, natación, triatlón, montaña, El Cubo, la escuela y el campus de verano. El club en imágenes.">
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/apolana.css">
<script>window.APOLANA_BASE="../";</script>
<script src="../assets/js/datos.js" defer></script>
<script src="../assets/js/apolana.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../assets/js/db.js" defer></script>
<script src="../assets/js/imagenes-web.js" defer></script>
<style>
  /* ===========================================================
     LAYOUT PROPIO DE LA PÁGINA /galeria
     =========================================================== */
  .gal-cabecera { display: flex; flex-direction: column; gap: 10px; }
  .gal-cabecera .titular {
    font-family: var(--fuente-titulo); font-weight: 700;
    font-size: clamp(46px, 8vw, 62px); line-height: 0.92;
    text-transform: uppercase; color: var(--navy);
  }
  .gal-cabecera .intro {
    max-width: 560px; margin: 4px 0 0;
    font-size: clamp(15px, 2vw, 17px); line-height: 1.6; color: #47433B;
  }

  /* Rejilla de fotos: se adapta sola. En 375 px quedan dos columnas
     cómodas; cada foto ocupa un cuadro grande, fácil de ver y de tocar. */
  .gal-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 200px;
    gap: 12px;
    margin-top: 26px;
  }
  .gal-grid .marco { height: 100%; border-radius: 14px; }
  .gal-grid .marco img { transition: transform .25s ease; }
  .gal-grid .marco:hover img { transform: scale(1.04); }
  /* Algunas fotos ocupan dos huecos para dar ritmo a la parrilla. */
  .gal-grid .marco.ancha { grid-column: span 2; }
  .gal-grid .marco.alta  { grid-row: span 2; }

  /* ===========================================================
     RESPONSIVE
     =========================================================== */
  @media (max-width: 900px) {
    .gal-grid { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 170px; }
    .gal-grid .marco.ancha { grid-column: span 2; }
    .gal-grid .marco.alta  { grid-row: auto; }
  }
  @media (max-width: 560px) {
    .gal-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 150px; gap: 10px; }
    /* En móvil todas iguales: nada de huecos raros a un dedo de distancia. */
    .gal-grid .marco.ancha,
    .gal-grid .marco.alta { grid-column: auto; grid-row: auto; }
  }
</style>
</head>
<body>

<apolana-cabecera activo="club"></apolana-cabecera>

<main>

  <!-- ================= ENCABEZADO ================= -->
  <section class="seccion" style="padding-bottom:0;">
    <div class="contenedor">
      <div class="gal-cabecera">
        <span class="eyebrow">El club en imágenes</span>
        <h1 class="titular">Galería</h1>
        <p class="intro">Un año del club en fotos: pista, asfalto, agua, montaña y las escuelas. Las mismas caras que te cruzas cada tarde en el entrenamiento.</p>
      </div>
    </div>
  </section>

  <!-- ================= REJILLA DE FOTOS ================= -->
  <section class="seccion">
    <div class="contenedor">
      <div class="gal-grid">
        <div class="marco ancha"><img src="../assets/img/galeria-3.jpg" data-img="galeria.1" alt="Competición de atletismo en pista al aire libre" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/galeria-1.jpg" data-img="galeria.2" alt="Salida de una carrera en pista" loading="lazy"></div>
        <div class="marco alta"><img src="../assets/img/competicion-andres.jpg" data-img="galeria.3" alt="Atleta del club en plena competición" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/galeria-2.jpg" data-img="galeria.4" alt="Atletas de la escuela en el estadio" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/running-claudia.jpg" data-img="galeria.5" alt="Grupo de running del club entrenando" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/running-nicolas.jpg" data-img="galeria.6" alt="Entrenamiento de rendimiento en pista" loading="lazy"></div>
        <div class="marco alta"><img src="../assets/img/galeria-4.jpg" data-img="galeria.7" alt="Carrera de montaña por la sierra" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/natacion-hero.jpg" data-img="galeria.8" alt="Nadadores del club en la piscina" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/triatlon-hero.jpg" data-img="galeria.9" alt="Triatletas del club durante una prueba" loading="lazy"></div>
        <div class="marco ancha"><img src="../assets/img/instalaciones-estadio.jpg" data-img="galeria.10" alt="Estadio de atletismo donde entrena el club" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/cubo-hero.jpg" data-img="galeria.11" alt="Sesión de fuerza en El Cubo" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/escuela-galeria-1.jpg" data-img="galeria.12" alt="Entrenamiento de la escuela de atletismo" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/escuela-galeria-2.jpg" data-img="galeria.13" alt="Atletas de la escuela en competición" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/ig-2.jpg" data-img="galeria.14" alt="Grupo de la escuela municipal de atletismo" loading="lazy"></div>
        <div class="marco ancha"><img src="../assets/img/campus-itaka.jpg" data-img="galeria.15" alt="Campus de verano del club" loading="lazy"></div>
        <div class="marco"><img src="../assets/img/ig-3.jpg" data-img="galeria.16" alt="Equipo del club en una competición" loading="lazy"></div>
      </div>
    </div>
  </section>

</main>

<!-- ================= PIE (compartido) ================= -->
<apolana-pie></apolana-pie>

</body>
</html>
