<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería · Club Atletismo Apolana</title>
<meta name="description" content="Galería de fotos del Club Atletismo Apolana: pista, running, natación, triatlón, montaña, El Cubo, la escuela y el campus de verano. El club en imágenes.">
<!-- APOLANA-SEO · lo genera herramientas/seo.py · no editar a mano -->
<!-- MIENTRAS LA WEB ESTA EN PRUEBAS: le decimos a Google que no la
     mire, para que no compita con atletismoapolana.com. EL DIA DEL
     CAMBIO DE DOMINIO HAY QUE QUITAR ESTA LINEA (la quita sola el
     comando de arriba con --indexable). -->
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Club Atletismo Apolana">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Galería · Club Atletismo Apolana">
<meta property="og:description" content="Galería de fotos del Club Atletismo Apolana: pista, running, natación, triatlón, montaña, El Cubo, la escuela y el campus de verano. El club en imágenes.">
<meta property="og:url" content="https://escuelaapolana.github.io/WebV2/galeria/">
<meta property="og:image" content="https://escuelaapolana.github.io/WebV2/assets/img/galeria-1.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- /APOLANA-SEO -->
<link rel="icon" href="../assets/img/logo.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/apolana.css">
<script>window.APOLANA_BASE="../";</script>
<script src="../assets/js/datos.js" defer></script>
<script src="../assets/js/apolana.js" defer></script>
<script src="../assets/js/supabase.js" defer></script>
<script src="../assets/js/db.js" defer></script>
<script src="../assets/js/editar-en-vivo.js" defer></script>
<script src="../assets/js/imagenes-web.js" defer></script>
<style>
  /* ===========================================================
     LAYOUT PROPIO DE LA PÁGINA /galeria
     Agrupada por bloques, no en rejilla plana: con doscientas fotos
     una rejilla seguida es un vertedero, y agrupada es la memoria
     del club. Cada bloque lleva una foto grande y tres pequeñas.
     =========================================================== */
  .gal-cabecera { display: flex; flex-direction: column; gap: 10px; }
  .gal-cabecera .intro { max-width: 560px; margin: 4px 0 0; }

  /* Barra de filtros: sección (categoría) y acontecimiento (grupo). */
  .gal-filtros { display: flex; gap: 14px 20px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 24px; }
  .gal-fsel { display: flex; flex-direction: column; gap: 5px; }
  .gal-fsel > span { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-suave); font-weight: 600; }
  .gal-fsel select {
    min-width: 190px; padding: 10px 12px; border: 1px solid var(--linea-borde);
    border-radius: 10px; background: #fff; font: inherit; font-size: 15px; color: var(--navy); min-height: 44px;
  }
  .gal-cuenta { margin-left: auto; align-self: center; font-family: var(--fuente-dato); font-size: 14px; color: var(--texto-suave); }

  /* Rejilla de todas las fotos marcadas. */
  .gal-rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .gal-cel {
    position: relative; display: block; width: 100%; aspect-ratio: 4 / 3;
    overflow: hidden; border-radius: 14px; background: var(--crema-media);
    border: 0; padding: 0; cursor: pointer;
  }
  .gal-cel img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transition: transform .25s ease; }
  .gal-cel:hover img { transform: scale(1.04); }
  /* La sección, en una pastilla discreta sobre la foto. */
  .gal-cel .cel-cat {
    position: absolute; left: 8px; bottom: 8px; background: rgba(22,31,40,0.60); color: #fff;
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
  }
  .gal-sinfiltro { color: var(--texto-suave); font-size: 15px; padding: 8px 2px; }

  /* Estado vacío honesto: mejor pedir fotos que repetir la misma tres veces. */
  .gal-vacio {
    background: var(--crema-banda); border-radius: 14px; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 10px; max-width: 640px;
  }
  .gal-vacio b { font-size: 15px; font-weight: 600; color: var(--navy); }
  .gal-vacio p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--texto); }
  .gal-vacio a {
    align-self: flex-start; background: #fff; border: 1px solid var(--linea-borde);
    border-radius: var(--radio-pastilla); padding: 13px 22px; min-height: 44px;
    display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--navy);
  }

  /* ---- Pantalla completa, con flechas ---- */
  .gal-visor {
    position: fixed; inset: 0; z-index: 9990; background: rgba(16,22,28,0.94);
    display: none; align-items: center; justify-content: center; padding: 20px;
    /* Entra con fundido en vez de un corte seco a negro. */
    opacity: 0; transition: opacity var(--dur-entrada, 200ms) ease;
  }
  .gal-visor[open], .gal-visor.abierto { display: flex; }
  .gal-visor.visible { opacity: 1; }
  .gal-visor img {
    max-width: min(1100px, 92vw); max-height: 82vh; width: auto; border-radius: 14px;
    /* Al abrir crece un pelín (escala); al pasar de foto solo cambia la
       opacidad (la maneja el JS), que se re-dirige suave si aporreas las
       flechas. */
    transform: scale(0.96);
    transition: transform var(--dur-entrada, 200ms) var(--ease-salida, cubic-bezier(.23,1,.32,1)), opacity 150ms ease;
  }
  .gal-visor.visible img { transform: scale(1); }
  @media (prefers-reduced-motion: reduce) {
    .gal-visor img, .gal-visor.visible img { transform: none; transition: opacity 120ms ease; }
  }
  .gal-visor .pie {
    position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
    font-size: 14px; color: rgba(255,255,255,0.78); padding: 0 70px;
  }
  .gal-visor button {
    position: absolute; width: 52px; height: 52px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
    color: #fff; display: flex; align-items: center; justify-content: center;
  }
  .gal-visor button:hover { background: rgba(255,255,255,0.22); }
  .gal-visor svg { width: 24px; height: 24px; }
  .gal-ant { left: 16px; }
  .gal-sig { right: 16px; }
  .gal-cerrar { top: 16px; right: 16px; }

  /* ===========================================================
     RESPONSIVE
     =========================================================== */
  @media (max-width: 560px) {
    .gal-rejilla { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .gal-fsel select { min-width: 0; width: 100%; }
    .gal-fsel { flex: 1 1 140px; }
    .gal-visor button { width: 44px; height: 44px; }
    .gal-ant { left: 8px; } .gal-sig { right: 8px; }
  }
</style>
</head>
<body>

<apolana-cabecera activo="club"></apolana-cabecera>

<main>

  <!-- ================= ENCABEZADO ================= -->
  <section class="seccion" style="padding-bottom:0;">
    <div class="contenedor">
      <div class="gal-cabecera">
        <span class="eyebrow">El club en imágenes</span>
        <h1 class="display">Galería</h1>
        <p class="intro">Un año del club en fotos: pista, asfalto, agua, montaña y las escuelas. Las mismas caras que te cruzas cada tarde en el entrenamiento.</p>
      </div>
    </div>
  </section>

  <!-- ================= BLOQUES DE FOTOS ================= -->
  <section class="seccion">
    <div class="contenedor">
      <!-- Barra de filtros: se rellena y se muestra sola si hay algo que
           filtrar (secciones o acontecimientos). -->
      <div class="gal-filtros" id="gal-filtros" hidden>
        <label class="gal-fsel">
          <span>Sección</span>
          <select id="gal-cat"><option value="">Todas las secciones</option></select>
        </label>
        <label class="gal-fsel">
          <span>Acontecimiento</span>
          <select id="gal-grupo"><option value="">Todos los acontecimientos</option></select>
        </label>
        <span class="gal-cuenta" id="gal-cuenta"></span>
      </div>
      <div class="gal-rejilla" id="gal-rejilla"></div>
    </div>
  </section>

</main>

<!-- Pantalla completa -->
<div class="gal-visor" id="gal-visor" role="dialog" aria-modal="true" aria-label="Foto a pantalla completa">
  <button type="button" class="gal-cerrar" id="gal-cerrar" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button type="button" class="gal-ant" id="gal-ant" aria-label="Foto anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img id="gal-visor-img" alt="">
  <button type="button" class="gal-sig" id="gal-sig" aria-label="Foto siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <span class="pie" id="gal-visor-pie"></span>
</div>

<!-- ================= PIE (compartido) ================= -->
<apolana-pie></apolana-pie>

<script>
(function () {
  'use strict';
  var base = window.APOLANA_BASE || '../';
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

  /* GALERÍA DIRIGIDA FOTO A FOTO
     Antes eran «huecos» fijos; ahora la galería enseña TODAS las fotos que
     el club marca en la biblioteca con «Mostrar en la galería web», y deja
     filtrar por sección (categoría) y por acontecimiento (grupo). Las fotos
     salen de la vista pública `galeria_publica` (solo las marcadas y ya
     publicadas); la dirección de cada una se arma con su ruta pública. */
  var DB = null;
  var caja = document.getElementById('gal-rejilla');
  var filtros = document.getElementById('gal-filtros');
  var selCat = document.getElementById('gal-cat');
  var selGrupo = document.getElementById('gal-grupo');
  var elCuenta = document.getElementById('gal-cuenta');
  var FOTOS = [];   // todas las marcadas
  var TODAS = [];   // las que se ven ahora, según el filtro

  /* Las secciones se guardan en la biblioteca como claves («triatlon»,
     «montana»…). Aquí se enseñan bonitas. Es el mismo mapa que CATS en
     assets/js/biblioteca.js; si allí se añade una categoría, añádela aquí. */
  var ETIQUETAS = {
    'escuela': 'Escuela', 'escuela-natacion': 'Escuela de natación', 'escuela-municipal': 'Escuela municipal',
    'competicion': 'Competición', 'running': 'Running', 'natacion': 'Natación', 'triatlon': 'Triatlón',
    'montana': 'Montaña', 'cubo': 'El Cubo', 'campus': 'Campus', 'instalaciones': 'Instalaciones',
    'club': 'Club', 'eventos': 'Eventos', 'equipacion': 'Equipación', 'otras': 'Otras'
  };
  function bonito(v) { return (v && ETIQUETAS[v]) || v || ''; }

  function vacio() {
    if (filtros) filtros.hidden = true;
    caja.innerHTML = '<div class="gal-vacio">' +
      '<b>Estamos preparando la galería</b>' +
      '<p>Muy pronto, un año del club en fotos. Si has hecho alguna en una carrera del club, mándanosla por WhatsApp y la subimos.</p>' +
      '<a href="' + base + 'contacto/">Escribirnos</a></div>';
  }

  /* La dirección pública de una foto a partir de su ruta en el bucket. */
  function urlDe(ruta) {
    try { return DB.storage.from('imagenes').getPublicUrl(ruta).data.publicUrl; }
    catch (e) { return ''; }
  }

  function opciones(sel, valores, etiquetaTodos, etiquetar) {
    var et = etiquetar || function (v) { return v; };
    var html = '<option value="">' + esc(etiquetaTodos) + '</option>';
    valores.forEach(function (v) { html += '<option value="' + esc(v) + '">' + esc(et(v)) + '</option>'; });
    if (sel) sel.innerHTML = html;
  }
  /* Los dos desplegables se rellenan con los valores que DE VERDAD hay. Si no
     hay nada que filtrar, la barra no se enseña. */
  function montarFiltros() {
    var cats = {}, grupos = {};
    FOTOS.forEach(function (f) {
      if (f.categoria) cats[f.categoria] = true;
      if (f.grupo) grupos[f.grupo] = true;
    });
    var lCat = Object.keys(cats).sort(), lGr = Object.keys(grupos).sort();
    opciones(selCat, lCat, 'Todas las secciones', bonito);
    opciones(selGrupo, lGr, 'Todos los acontecimientos');
    var laCat = selCat && selCat.closest('.gal-fsel');
    var laGr = selGrupo && selGrupo.closest('.gal-fsel');
    if (laCat) laCat.hidden = lCat.length === 0;
    if (laGr) laGr.hidden = lGr.length === 0;
    if (filtros) filtros.hidden = (lCat.length + lGr.length) === 0;
  }

  function pintaRejilla() {
    if (!TODAS.length) {
      caja.innerHTML = '<p class="gal-sinfiltro">No hay fotos con ese filtro. Prueba con otra sección o acontecimiento.</p>';
      return;
    }
    caja.innerHTML = TODAS.map(function (f, i) {
      return '<button type="button" class="gal-cel" data-i="' + i + '" aria-label="' + esc(f.alt) + '">' +
        '<img src="' + esc(f.src) + '" alt="" loading="lazy">' +
        (f.categoria ? '<span class="cel-cat">' + esc(bonito(f.categoria)) + '</span>' : '') +
      '</button>';
    }).join('');
    Array.prototype.forEach.call(caja.querySelectorAll('img'), function (im, i) {
      if (TODAS[i]) TODAS[i].nodo = im;
    });
  }

  /* Filtra por lo elegido, actualiza el contador y repinta la rejilla. */
  function aplicaFiltro() {
    var c = selCat ? selCat.value : '';
    var g = selGrupo ? selGrupo.value : '';
    TODAS = FOTOS.filter(function (f) {
      return (!c || f.categoria === c) && (!g || f.grupo === g);
    });
    if (elCuenta) elCuenta.textContent = TODAS.length + (TODAS.length === 1 ? ' foto' : ' fotos');
    pintaRejilla();
  }

  /* Le pregunta a la base qué fotos están marcadas y las pinta. Va en
     DOMContentLoaded a propósito: este script es inline y corre durante el
     parseo, ANTES que db.js (que es `defer`); en ese instante APOLANA_DB aún
     no existe. Al soltar DOMContentLoaded ya están todos los `defer`. */
  function iniciar() {
    DB = window.APOLANA_DB;
    if (!DB || typeof DB.from !== 'function') { vacio(); return; }
    try {
      DB.from('galeria_publica').select('id,titulo,categoria,grupo,fecha_foto,publicada_ruta')
        .then(function (r) {
          if (!r || r.error || !r.data || !r.data.length) { vacio(); return; }
          FOTOS = r.data.map(function (f) {
            return {
              categoria: f.categoria || '', grupo: f.grupo || '', fecha: f.fecha_foto || '',
              src: urlDe(f.publicada_ruta),
              alt: f.titulo || f.categoria || 'Foto del club',
              bloque: f.titulo || f.grupo || f.categoria || 'Club Apolana'
            };
          }).filter(function (f) { return f.src; });
          /* Las más recientes primero, por la fecha del acontecimiento. */
          FOTOS.sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); });
          if (!FOTOS.length) { vacio(); return; }
          montarFiltros();
          aplicaFiltro();
        })
        .catch(function () { vacio(); });
    } catch (e) { vacio(); }
  }
  if (selCat) selCat.addEventListener('change', aplicaFiltro);
  if (selGrupo) selGrupo.addEventListener('change', aplicaFiltro);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();

  /* ---- Pantalla completa, con flechas y teclado ---- */
  var visor = document.getElementById('gal-visor');
  var img = document.getElementById('gal-visor-img');
  var pie = document.getElementById('gal-visor-pie');
  var actual = 0, previo = null;

  function mostrar(i) {
    if (!TODAS.length) return;
    actual = (i + TODAS.length) % TODAS.length;
    var f = TODAS[actual];
    /* Fundido corto al cambiar de foto: se apaga, se cambia la fuente y se
       vuelve a encender. Como es solo opacidad, aporrear las flechas se
       re-dirige suave en vez de saltar. */
    img.style.opacity = '0';
    img.src = (f.nodo && f.nodo.getAttribute('src')) || f.src;
    img.alt = (f.nodo && f.nodo.getAttribute('alt')) || f.alt;
    pie.textContent = f.bloque + ' · ' + (actual + 1) + ' de ' + TODAS.length;
    void img.offsetWidth;              // reflujo: fija la opacidad 0 antes de encender
    img.style.opacity = '1';
  }
  function abrir(i) {
    previo = document.activeElement;
    mostrar(i);
    visor.classList.add('abierto');
    /* Un reflujo forzado entre poner el display y encender la opacidad, para
       que la transición arranque. Se usa reflujo y no requestAnimationFrame
       porque el rAF se pausa si la pestaña no está componiendo, y entonces
       el visor se quedaría invisible. */
    void visor.offsetWidth;
    visor.classList.add('visible');
    document.body.style.overflow = 'hidden';
    document.getElementById('gal-cerrar').focus();
  }
  function cerrar() {
    /* Se apaga (fundido de salida) y, cuando termina, se quita el display.
       Un respaldo por tiempo por si `transitionend` no llega. */
    visor.classList.remove('visible');
    document.body.style.overflow = '';
    var quitar = function () { visor.classList.remove('abierto'); };
    var hecho = false;
    visor.addEventListener('transitionend', function te(ev) {
      if (ev.target !== visor || hecho) return;
      hecho = true; visor.removeEventListener('transitionend', te); quitar();
    });
    setTimeout(function () { if (!hecho) { hecho = true; quitar(); } }, 260);
    if (previo && previo.focus) previo.focus();
  }

  caja.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.gal-cel') : null;
    if (b) abrir(parseInt(b.getAttribute('data-i'), 10) || 0);
  });
  document.getElementById('gal-cerrar').addEventListener('click', cerrar);
  document.getElementById('gal-ant').addEventListener('click', function () { mostrar(actual - 1); });
  document.getElementById('gal-sig').addEventListener('click', function () { mostrar(actual + 1); });
  visor.addEventListener('click', function (e) { if (e.target === visor) cerrar(); });
  document.addEventListener('keydown', function (e) {
    if (!visor.classList.contains('abierto')) return;
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowLeft') mostrar(actual - 1);
    else if (e.key === 'ArrowRight') mostrar(actual + 1);
  });
})();
</script>

</body>
</html>
