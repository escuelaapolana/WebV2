<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galería · Club Atletismo Apolana</title>
<meta name="description" content="Galería de fotos del Club Atletismo Apolana: pista, running, natación, triatlón, montaña, El Cubo, la escuela y el campus de verano. El club en imágenes.">
<!-- APOLANA-SEO · lo genera herramientas/seo.py · no editar a mano -->
<!-- MIENTRAS LA WEB ESTA EN PRUEBAS: le decimos a Google que no la
     mire, para que no compita con atletismoapolana.com. EL DIA DEL
     CAMBIO DE DOMINIO HAY QUE QUITAR ESTA LINEA (la quita sola el
     comando de arriba con --indexable). -->
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Club Atletismo Apolana">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Galería · Club Atletismo Apolana">
<meta property="og:description" content="Galería de fotos del Club Atletismo Apolana: pista, running, natación, triatlón, montaña, El Cubo, la escuela y el campus de verano. El club en imágenes.">
<meta property="og:url" content="https://escuelaapolana.github.io/WebV2/galeria/">
<meta property="og:image" content="https://escuelaapolana.github.io/WebV2/assets/img/galeria-1.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- /APOLANA-SEO -->
<link rel="icon" href="../assets/img/logo.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/apolana.css">
<script>window.APOLANA_BASE="../";</script>
<script src="../assets/js/datos.js" defer></script>
<script src="../assets/js/apolana.js" defer></script>
<script src="../assets/js/supabase.js" defer></script>
<script src="../assets/js/db.js" defer></script>
<script src="../assets/js/editar-en-vivo.js" defer></script>
<script src="../assets/js/imagenes-web.js" defer></script>
<style>
  /* ===========================================================
     LAYOUT PROPIO DE LA PÁGINA /galeria
     Agrupada por bloques, no en rejilla plana: con doscientas fotos
     una rejilla seguida es un vertedero, y agrupada es la memoria
     del club. Cada bloque lleva una foto grande y tres pequeñas.
     =========================================================== */
  .gal-cabecera { display: flex; flex-direction: column; gap: 10px; }
  .gal-cabecera .intro { max-width: 560px; margin: 4px 0 0; }

  .gal-bloques { display: flex; flex-direction: column; gap: 40px; }
  .gal-bloque { display: flex; flex-direction: column; gap: 12px; }
  .gal-bloque-cab { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gal-bloque-cab .cuenta { font-family: var(--fuente-dato); font-size: 14px; color: var(--texto-suave); }
  .gal-bloque-cab .nota { font-size: 14px; color: var(--texto-suave); margin-left: auto; }

  /* Una grande a la izquierda y tres pequeñas apiladas a la derecha. */
  .gal-tira { display: grid; grid-template-columns: 2fr 1fr; grid-auto-rows: 118px; gap: 12px; }
  .gal-foto {
    position: relative; display: block; height: 100%; overflow: hidden;
    border-radius: 14px; background: var(--crema-media);
    border: 0; padding: 0; cursor: pointer; width: 100%;
  }
  /* Encuadre hacia arriba, que es donde están las caras. Aquí va más alto que
     el 30% del resto de la web a propósito: los huecos de la galería son
     franjas muy apaisadas y la mayoría de las fotos son verticales, así que
     con el 30% se quedaban en la frente. */
  .gal-foto img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; transition: transform .25s ease; }
  .gal-foto:hover img { transform: scale(1.04); }
  .gal-foto--grande { grid-column: 1; grid-row: span 3; }
  /* Las fotos que se cuentan en el «+N»: no ocupan sitio en la página,
     pero existen, para que el club también pueda cambiarlas desde el
     panel y para que a pantalla completa salga la suya. */
  .gal-guardadas { display: none; }
  /* El «+30»: se marca encima de la última, no como un hueco aparte. */
  .gal-foto .mas {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(22,31,40,0.62); color: #fff;
    font-family: var(--fuente-dato); font-size: 20px; font-weight: 700;
  }

  /* Estado vacío honesto: mejor pedir fotos que repetir la misma tres veces. */
  .gal-vacio {
    background: var(--crema-banda); border-radius: 14px; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 10px; max-width: 640px;
  }
  .gal-vacio b { font-size: 15px; font-weight: 600; color: var(--navy); }
  .gal-vacio p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--texto); }
  .gal-vacio a {
    align-self: flex-start; background: #fff; border: 1px solid var(--linea-borde);
    border-radius: var(--radio-pastilla); padding: 13px 22px; min-height: 44px;
    display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--navy);
  }

  /* ---- Pantalla completa, con flechas ---- */
  .gal-visor {
    position: fixed; inset: 0; z-index: 9990; background: rgba(16,22,28,0.94);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .gal-visor[open], .gal-visor.abierto { display: flex; }
  .gal-visor img { max-width: min(1100px, 92vw); max-height: 82vh; width: auto; border-radius: 14px; }
  .gal-visor .pie {
    position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
    font-size: 14px; color: rgba(255,255,255,0.78); padding: 0 70px;
  }
  .gal-visor button {
    position: absolute; width: 52px; height: 52px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
    color: #fff; display: flex; align-items: center; justify-content: center;
  }
  .gal-visor button:hover { background: rgba(255,255,255,0.22); }
  .gal-visor svg { width: 24px; height: 24px; }
  .gal-ant { left: 16px; }
  .gal-sig { right: 16px; }
  .gal-cerrar { top: 16px; right: 16px; }

  /* ===========================================================
     RESPONSIVE
     =========================================================== */
  @media (max-width: 900px) {
    /* La grande pasa a ocupar el ancho y las tres pequeñas van debajo, en fila. */
    .gal-tira { grid-template-columns: repeat(3, 1fr); grid-auto-rows: 120px; }
    .gal-foto--grande { grid-column: 1 / -1; grid-row: span 2; }
  }
  @media (max-width: 560px) {
    .gal-bloques { gap: 30px; }
    .gal-tira { grid-auto-rows: 92px; gap: 8px; }
    .gal-foto--grande { grid-row: span 2; }
    .gal-visor button { width: 44px; height: 44px; }
    .gal-ant { left: 8px; } .gal-sig { right: 8px; }
  }
</style>
</head>
<body>

<apolana-cabecera activo="club"></apolana-cabecera>

<main>

  <!-- ================= ENCABEZADO ================= -->
  <section class="seccion" style="padding-bottom:0;">
    <div class="contenedor">
      <div class="gal-cabecera">
        <span class="eyebrow">El club en imágenes</span>
        <h1 class="display">Galería</h1>
        <p class="intro">Un año del club en fotos: pista, asfalto, agua, montaña y las escuelas. Las mismas caras que te cruzas cada tarde en el entrenamiento.</p>
      </div>
    </div>
  </section>

  <!-- ================= BLOQUES DE FOTOS ================= -->
  <section class="seccion">
    <div class="contenedor">
      <div class="gal-bloques" id="gal-bloques"></div>
    </div>
  </section>

</main>

<!-- Pantalla completa -->
<div class="gal-visor" id="gal-visor" role="dialog" aria-modal="true" aria-label="Foto a pantalla completa">
  <button type="button" class="gal-cerrar" id="gal-cerrar" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button type="button" class="gal-ant" id="gal-ant" aria-label="Foto anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img id="gal-visor-img" alt="">
  <button type="button" class="gal-sig" id="gal-sig" aria-label="Foto siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <span class="pie" id="gal-visor-pie"></span>
</div>

<!-- ================= PIE (compartido) ================= -->
<apolana-pie></apolana-pie>

<script>
(function () {
  'use strict';
  var base = window.APOLANA_BASE || '../';
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

  /* Las fotos, agrupadas por dónde se hicieron. Cuando el club suba las suyas
     desde el panel, cada bloque será una carrera con su fecha; de momento se
     agrupan por sección, que es lo que hay y no inventa nada.

     TODAS se cambian desde Panel → Fotos de la web: cada una lleva su hueco
     «galeria.<bloque>.<n>» (galeria.pista.1, galeria.agua.3…). Las cuatro
     primeras de cada bloque son las que se ven en la rejilla; la que sobra
     se cuenta en el «+N» y solo sale a pantalla completa, pero se cambia
     igual. Si añades una foto a un bloque, dale su fila en la base
     (migraciones/084_huecos_de_foto.sql) o no saldrá en el panel. */
  /* Los cuatro bloques y cuántos huecos tiene cada uno en el panel
     (Panel → Fotos de la web). Cada hueco es «galeria.<bloque>.<n>».
     La galería NO trae fotos por defecto: enseña solo los huecos que el
     club haya rellenado. Los vacíos no salen; un bloque sin ninguna foto
     tampoco. Para poner una, se asigna su hueco desde el panel o en modo
     fantasma. Si añades más huecos a un bloque, sube su «n» y dale su fila
     en migraciones/084_huecos_de_foto.sql. */
  var BLOQUES = [
    { titulo: 'Pista y competición', hueco: 'pista', n: 5, alt: 'Atletismo en pista y competición del club' },
    { titulo: 'Running y montaña', hueco: 'running', n: 4, alt: 'Running y carreras de montaña del club' },
    { titulo: 'Agua y triatlón', hueco: 'agua', n: 4, alt: 'Natación y triatlón del club' },
    { titulo: 'Las escuelas y el campus', hueco: 'escuelas', n: 5, alt: 'Las escuelas y el campus del club' }
  ];

  var caja = document.getElementById('gal-bloques');
  var TODAS = [];

  function vacio() {
    caja.innerHTML = '<div class="gal-vacio">' +
      '<b>Estamos preparando la galería</b>' +
      '<p>Muy pronto, un año del club en fotos. Si has hecho alguna en una carrera del club, mándanosla por WhatsApp y la subimos.</p>' +
      '<a href="' + base + 'contacto/">Escribirnos</a></div>';
  }

  /* La foto de un hueco ya puesto: su marca «galeria.<bloque>.<n>» para el
     panel y el modo fantasma, su foto de verdad y el encuadre elegido. */
  function imgHueco(x, indice) {
    var st = x.encuadre ? ' style="object-position:' + esc(x.encuadre) + '"' : '';
    return '<img src="' + esc(x.url) + '"' +
      ' data-img="' + esc(x.clave) + '"' +
      ' data-i="' + indice + '"' + st + ' alt="" loading="lazy">';
  }

  /* Pinta con lo que el club ha rellenado. `porClave` es {clave: fila}. */
  function pinta(porClave) {
    TODAS = [];
    var html = '';
    BLOQUES.forEach(function (b) {
      /* Huecos de este bloque que tienen foto, en orden. */
      var fotos = [];
      for (var i = 1; i <= b.n; i++) {
        var k = 'galeria.' + b.hueco + '.' + i;
        var f = porClave[k];
        var u = f && f.url && String(f.url).trim();
        if (u) fotos.push({
          clave: k, url: u,
          encuadre: f.encuadre && String(f.encuadre).trim(),
          alt: (f.alt && String(f.alt).trim()) || b.alt
        });
      }
      if (!fotos.length) return;   // bloque sin fotos: no se enseña

      /* Una grande y hasta tres pequeñas; el resto se cuenta en un «+N». */
      var visibles = fotos.slice(0, 4);
      var resto = fotos.length - visibles.length;
      var desde = TODAS.length;
      fotos.forEach(function (x) { TODAS.push({ src: x.url, alt: x.alt, bloque: b.titulo }); });

      html += '<section class="gal-bloque">' +
        '<div class="gal-bloque-cab">' +
          '<h2 class="titulo">' + esc(b.titulo) + '</h2>' +
          '<span class="cuenta">' + fotos.length + (fotos.length === 1 ? ' foto' : ' fotos') + '</span>' +
        '</div>' +
        '<div class="gal-tira">' + visibles.map(function (x, i) {
          var indice = desde + i;
          var ultima = (i === visibles.length - 1) && resto > 0;
          return '<button type="button" class="gal-foto' + (i === 0 ? ' gal-foto--grande' : '') + '"' +
            ' data-i="' + indice + '" aria-label="' + esc(x.alt) + '">' +
            imgHueco(x, indice) +
            (ultima ? '<span class="mas">+' + resto + '</span>' : '') +
          '</button>';
        }).join('') + '</div>' +
        (resto > 0
          ? '<div class="gal-guardadas">' + fotos.slice(4).map(function (x, i) {
              return imgHueco(x, desde + 4 + i);
            }).join('') + '</div>'
          : '') +
      '</section>';
    });

    if (!html) { vacio(); return; }
    caja.innerHTML = html;

    /* Cada foto se queda apuntada en su ficha, para que a pantalla completa
       se abra LA MISMA que se ve en la rejilla. */
    Array.prototype.forEach.call(caja.querySelectorAll('img[data-i]'), function (im) {
      var i = parseInt(im.getAttribute('data-i'), 10);
      if (TODAS[i]) TODAS[i].nodo = im;
    });
  }

  /* Le pregunta a la base qué fotos hay puestas y pinta. Si no responde o
     no hay ninguna, se queda el estado «estamos preparando la galería».
     Va en DOMContentLoaded a propósito: este script es inline y corre
     durante el parseo, ANTES que db.js (que es `defer`); en ese instante
     window.APOLANA_DB aún no existe. Al soltar DOMContentLoaded ya están
     ejecutados todos los `defer`, así que la base está lista. */
  function iniciar() {
    var db = window.APOLANA_DB;
    if (!db || typeof db.from !== 'function') { vacio(); return; }
    var claves = [];
    BLOQUES.forEach(function (b) {
      for (var i = 1; i <= b.n; i++) claves.push('galeria.' + b.hueco + '.' + i);
    });
    try {
      db.from('imagenes_web').select('clave,url,encuadre,zoom,alt').in('clave', claves)
        .then(function (r) {
          var porClave = {};
          if (r && !r.error && r.data) r.data.forEach(function (f) { porClave[f.clave] = f; });
          pinta(porClave);
        })
        .catch(function () { vacio(); });
    } catch (e) { vacio(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();

  /* ---- Pantalla completa, con flechas y teclado ---- */
  var visor = document.getElementById('gal-visor');
  var img = document.getElementById('gal-visor-img');
  var pie = document.getElementById('gal-visor-pie');
  var actual = 0, previo = null;

  function mostrar(i) {
    if (!TODAS.length) return;
    actual = (i + TODAS.length) % TODAS.length;
    var f = TODAS[actual];
    img.src = (f.nodo && f.nodo.getAttribute('src')) || f.src;
    img.alt = (f.nodo && f.nodo.getAttribute('alt')) || f.alt;
    pie.textContent = f.bloque + ' · ' + (actual + 1) + ' de ' + TODAS.length;
  }
  function abrir(i) {
    previo = document.activeElement;
    mostrar(i);
    visor.classList.add('abierto');
    document.body.style.overflow = 'hidden';
    document.getElementById('gal-cerrar').focus();
  }
  function cerrar() {
    visor.classList.remove('abierto');
    document.body.style.overflow = '';
    if (previo && previo.focus) previo.focus();
  }

  caja.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.gal-foto') : null;
    if (b) abrir(parseInt(b.getAttribute('data-i'), 10) || 0);
  });
  document.getElementById('gal-cerrar').addEventListener('click', cerrar);
  document.getElementById('gal-ant').addEventListener('click', function () { mostrar(actual - 1); });
  document.getElementById('gal-sig').addEventListener('click', function () { mostrar(actual + 1); });
  visor.addEventListener('click', function (e) { if (e.target === visor) cerrar(); });
  document.addEventListener('keydown', function (e) {
    if (!visor.classList.contains('abierto')) return;
    if (e.key === 'Escape') cerrar();
    else if (e.key === 'ArrowLeft') mostrar(actual - 1);
    else if (e.key === 'ArrowRight') mostrar(actual + 1);
  });
})();
</script>

</body>
</html>
