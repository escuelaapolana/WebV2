<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu cuota · Club Atletismo Apolana</title>
<meta name="description" content="Activa o domicilia tu cuota del Club Atletismo Apolana.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js?v=a02b231d" defer></script>
<script src="../../assets/js/db.js?v=4fd9379b" defer></script>
<style>
  body{ background:var(--crema,#FBF9F4); margin:0; font-family:var(--fuente-texto,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif); color:var(--navy,#2E4256); }
  .wrap{ max-width:560px; margin:0 auto; padding:34px 18px 60px; }
  .cab{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .cab img{ height:46px; width:auto; }
  .cab b{ font-family:var(--fuente-titulo); font-weight:700; font-size:18px; }
  .caja{ background:#fff; border:1px solid var(--linea,#EDE6D7); border-radius:18px;
    box-shadow:0 18px 40px -26px rgba(46,66,86,.5); padding:26px 24px; }
  h1{ font-family:var(--fuente-titulo); font-size:clamp(22px,5vw,28px); margin:0 0 10px; }
  p{ line-height:1.6; color:#3f3f46; margin:0 0 14px; }
  .dato{ background:#F1EADC; border-radius:12px; padding:14px 16px; color:#5C4A1E; font-size:14.5px; line-height:1.6; margin:4px 0 18px; }
  .dato ul{ margin:8px 0 0; padding-left:20px; }
  .btn{ display:inline-block; background:#2F6FA8; color:#fff; border:0; text-decoration:none;
    padding:15px 30px; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; font-family:inherit; }
  .btn[disabled]{ opacity:.6; cursor:default; }
  .fina{ font-size:13px; color:var(--texto-suave,#6E6656); margin-top:16px; }
  .err{ color:#B3261E; font-size:14px; margin-top:12px; min-height:1.2em; }
  .ok{ background:#EAF3E3; color:#2E6B3A; border-radius:12px; padding:16px 18px; line-height:1.6; }
  .mal{ background:#FBEAE8; color:#B3261E; border-radius:12px; padding:16px 18px; line-height:1.6; }
  /* Estados finales (ya domiciliada, cerrada, enlace que no vale…): botones a lo ancho en el móvil. */
  .acciones{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .acciones .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; box-sizing:border-box; padding:0 22px; }
  .btn--wa{ background:#1F8A4C; }
  .btn--claro{ background:#fff; color:var(--navy,#2E4256); border:1px solid var(--linea,#E4DCCB); }
  .volver{ display:inline-flex; align-items:center; min-height:44px; margin-top:8px; color:#2F6FA8; font-weight:600; text-decoration:none; font-size:15px; }
  .volver:hover{ text-decoration:underline; }
  @media (max-width:480px){ .acciones .btn{ flex:1 1 100%; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cab">
      <img src="../../assets/img/favicon-escudo.png" alt="Escudo Apolana">
      <b>Club Atletismo Apolana</b>
    </div>
    <div class="caja" id="caja"><p>Cargando…</p></div>
  </div>
<script>
(function () {
  var caja = document.getElementById('caja');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var qs = new URLSearchParams(location.search);
  var token = (qs.get('t') || '').trim();
  var pago = qs.get('pago');
  var mensual = qs.get('m') === '1';   // cuota MENSUAL (mig 313), p. ej. natación

  /* MIG 380 · Las cuotas del asistente «Nuevo cobro» (tarjeta o SEPA; mensual,
     trimestral o anual; con mes de inicio y fin) se explican con SUS datos, que
     se piden a la base por el token (cuota_entreno_publica: sin datos
     personales). Las de antes (sin mes de inicio) siguen con los textos de
     siempre, más abajo (legado()). */
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function fechaLarga(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return (+p[2]) + ' de ' + MESES[(+p[1]) - 1] + ' de ' + p[0]; }
  function eur(n) { var v = Number(n) || 0; return v.toLocaleString('es-ES', { minimumFractionDigits: Math.round(v * 100) % 100 ? 2 : 0, maximumFractionDigits: 2 }) + ' €'; }
  var D = null;   // datos de la cuota (si es del asistente)

  /* --- Estados que no son «paga aquí» -----------------------------------
     El WhatsApp es el del club (el mismo que sale en toda la web). */
  var WA = 'https://wa.me/34636061700?text=' + encodeURIComponent('Hola, el enlace para pagar mi cuota del club no me funciona. ¿Me mandáis uno nuevo?');
  var WEB = window.APOLANA_BASE || '../../';
  function botonWA(txt) { return '<a class="btn btn--wa" href="' + WA + '" target="_blank" rel="noopener">' + esc(txt || 'Pedir otro enlace por WhatsApp') + '</a>'; }
  function volverWeb() { return '<a class="volver" href="' + WEB + '">← Volver a la web del club</a>'; }
  // Enlace que no existe, cortado o caducado (la base no lo encuentra).
  function enlaceMalo() {
    caja.innerHTML = '<h1>Este enlace ya no vale o no es correcto</h1>' +
      '<div class="mal">Puede que haya caducado o que se haya copiado a medias. No pasa nada: escríbenos y te mandamos uno nuevo.</div>' +
      '<div class="acciones">' + botonWA() + '</div>' + volverWeb();
  }
  // No se pudo consultar (sin conexión, la base no responde…): no es culpa del enlace.
  function sinConexion() {
    caja.innerHTML = '<h1>No hemos podido abrir tu cuota</h1>' +
      '<div class="mal">Parece un problema de conexión. Vuelve a cargar la página en un momento; si sigue igual, escríbenos.</div>' +
      '<div class="acciones"><button class="btn" id="recargar">Volver a cargar</button>' + botonWA('Escribir al club por WhatsApp') + '</div>' + volverWeb();
    document.getElementById('recargar').addEventListener('click', function () { location.reload(); });
  }
  // Vuelta de Stripe sin poder leer los datos de la cuota: un «hecho» que no se equivoque.
  function hechoNeutro() {
    caja.innerHTML = '<h1>¡Hecho! 🎉</h1>' +
      '<div class="ok">Hemos recibido tus datos de pago. A partir de ahora la cuota se cobra sola: no tienes que hacer nada más.</div>' +
      '<p class="fina">Si algún dato no cuadra, contesta al correo del club y lo miramos. ¡Gracias!</p>';
  }
  /* Respuesta «no» de entreno-pagar (409/404…): cada caso con su pantalla.
     Devuelve true si la ha pintado; false si es un fallo pasajero (se enseña
     el mensaje debajo del botón para reintentar). */
  function estadoDeLaEdge(d) {
    var cod = d && d.error, msg = d && d.mensaje;
    if (cod === 'ya_activa') {
      var tar = (D && D.metodo === 'tarjeta') || /tarjeta/i.test(msg || '');
      caja.innerHTML = '<h1>' + (tar ? '✓ Tu cuota ya está activa' : '✓ Ya está domiciliada') + '</h1>' +
        '<div class="ok">' + esc(msg || (tar ? 'Tu cuota ya está activa y se cobra sola.' : 'Tu cuota ya está domiciliada y se cobra sola.')) + '</div>' +
        '<p class="fina">No se cobra dos veces: puedes cerrar esta página tranquilamente.</p>' + volverWeb();
      return true;
    }
    if (cod === 'cerrado' || cod === 'terminada') {
      // El porqué lo dice la Edge («no está abierta», «ya terminó»…); el título no lo repite.
      caja.innerHTML = '<h1>Ahora no hay nada que pagar</h1>' +
        '<div class="mal">' + esc(msg || (cod === 'terminada' ? 'Esta cuota ya terminó.' : 'Esta cuota no está abierta ahora mismo.') + ' Si crees que es un error, escríbenos.') + '</div>' +
        '<div class="acciones">' + botonWA('Escribir al club por WhatsApp') + '</div>' + volverWeb();
      return true;
    }
    if (cod === 'no_existe' || cod === 'sin_token') { enlaceMalo(); return true; }
    return false;
  }
  function txt() {
    var tar = D.metodo === 'tarjeta';
    var cada = D.periodicidad === 'mensual' ? 'al mes' : D.periodicidad === 'anual' ? 'al año' : 'cada 3 meses';
    var repite = D.periodicidad === 'mensual' ? 'cada mes' : D.periodicidad === 'anual' ? 'cada año' : 'cada 3 meses';
    var ini = D.inicio ? new Date(String(D.inicio).slice(0, 10) + 'T08:00:00Z') : null;
    var diferido = ini && (ini - Date.now()) > 49 * 3600 * 1000;   // misma regla que entreno-pagar
    return {
      tar: tar, cada: cada,
      boton: tar ? 'Pagar con tarjeta →' : 'Domiciliar mi cuota →',
      primero: (diferido && D.cargo_inicial)
                 ? 'Hoy, al domiciliar, se cobran <b>' + eur(D.cargo_inicial) + '</b>' + (D.cargo_inicial_concepto ? ' (' + esc(D.cargo_inicial_concepto) + ')' : '') +
                   '. La cuota de <b>' + eur(D.importe) + '</b> empieza el <b>' + fechaLarga(D.inicio) + '</b> y después ' + repite + ' en esa misma fecha.'
               : diferido ? 'El <b>primer cobro</b> será el <b>' + fechaLarga(D.inicio) + '</b>; hoy no se cobra nada. Después, ' + repite + ' en esa misma fecha.'
                        : 'El <b>primer cobro</b> se hace ' + (tar ? 'al pagar' : 'al domiciliar (el adeudo tarda unos días)') + ' y después ' + repite + ' en esa misma fecha.',
      fin: D.fin ? 'Se <b>para sola</b> el ' + fechaLarga(D.fin) + ': después no se cobra nada más.' : '',
      seguro: tar ? 'La tarjeta se teclea en la pantalla segura de Stripe, <b>nunca</b> en esta web.' : 'El IBAN se teclea en la pantalla segura de Stripe, <b>nunca</b> en esta web.'
    };
  }
  function generica() {
    var t = txt();
    if (pago === 'hecho') {
      caja.innerHTML = '<h1>' + (t.tar ? '¡Cuota activada! 🎉' : '¡Domiciliación recibida! 🎉') + '</h1>' +
        '<div class="ok">' + (t.tar ? 'Tu tarjeta ha quedado guardada para esta cuota.' : 'Ya hemos guardado tu mandato SEPA.') + ' ' + t.primero + ' ' + t.fin + '</div>' +
        '<p class="fina">Si algún dato no cuadra, contesta al correo del club y lo miramos. ¡Gracias!</p>';
      return;
    }
    if (pago === 'cancelado') {
      caja.innerHTML = '<h1>No se completó</h1>' +
        '<div class="mal">No llegaste a terminar. No pasa nada: puedes volver a intentarlo cuando quieras.</div>' +
        '<p style="margin-top:16px"><button class="btn" id="reintentar">Volver a intentarlo →</button></p><p class="err" id="err"></p>';
      document.getElementById('reintentar').addEventListener('click', irAPagar);
      return;
    }
    caja.innerHTML = '<h1>' + (t.tar ? 'Activa tu cuota' : 'Domicilia tu cuota') + '</h1>' +
      '<p>Se paga ' + (t.tar ? 'con <b>tarjeta</b>: la metes una vez y se cobra sola.' : 'por <b>domiciliación bancaria (SEPA)</b>: metes tu IBAN una vez y se cobra sola.') + '</p>' +
      '<div class="dato"><b>' + esc(D.concepto || 'Cuota') + '</b><br><span style="font-size:20px;font-weight:700">' + eur(D.importe) + '</span> ' + t.cada +
        '<ul><li>' + t.primero + '</li>' + (t.fin ? '<li>' + t.fin + '</li>' : '') + '<li>' + t.seguro + '</li></ul></div>' +
      '<button class="btn" id="domiciliar">' + t.boton + '</button><p class="err" id="err"></p>' +
      '<p class="fina">Si ya lo hiciste, puedes ignorar este mensaje: no se cobra dos veces.</p>';
    document.getElementById('domiciliar').addEventListener('click', irAPagar);
  }
  function textoBoton() { return D ? txt().boton : 'Domiciliar mi cuota →'; }

  if (!token || token.length < 20) { legado(); return; }
  caja.innerHTML = '<p>Cargando…</p>';
  // Si no se puede consultar: a la vuelta de Stripe se da el «hecho»/«cancelado»
  // sin detalles; si no, se dice que falla la conexión (no que el enlace esté mal).
  function falloConsulta() {
    if (pago === 'hecho') hechoNeutro();
    else if (pago === 'cancelado') legado();
    else sinConexion();
  }
  esperarDB(function (db) {
    if (!db || !db.rpc) { falloConsulta(); return; }
    Promise.resolve(db.rpc('cuota_entreno_publica', { p_token: token })).then(function (r) {
      if (!r || r.error) { falloConsulta(); return; }
      var d = r.data;
      if (d && d.inicio) { D = d; generica(); return; }   // cuota del asistente (mig 380)
      if (d) { legado(); return; }                          // cuota antigua (sin mes de inicio): textos de siempre
      // La base no la encuentra. Los tokens antiguos de 32 caracteres no los
      // busca la RPC (pide ≥ 40), así que esos siguen por legado() como
      // siempre; la Edge dirá al pulsar si ya está domiciliada.
      if (token.length < 40) { legado(); return; }
      enlaceMalo();
    }).catch(falloConsulta);
  });

  function legado() {
  if (pago === 'hecho') {
    caja.innerHTML =
      '<h1>¡Domiciliación recibida! 🎉</h1>' +
      (mensual
        ? '<div class="ok">Ya hemos guardado tu mandato SEPA. El <b>primer cargo</b> (el mes en curso) se te pasará al banco en unos días, y a partir de ahí se cobra <b>sola cada mes, en esa misma fecha</b>. Tras junio ya no se te pasa nada más esta temporada.</div>'
        : '<div class="ok">Ya hemos guardado tu mandato SEPA. El <b>primer cargo</b> se te pasará al banco en unos días, y los siguientes trimestres (<b>enero y abril</b>) se cobrarán <b>solos</b>. Tras abril ya no se te pasa nada más esta temporada.</div>') +
      '<p class="fina">Si algún dato no cuadra, contesta al correo del club y lo miramos. ¡Gracias!</p>';
    return;
  }
  if (pago === 'cancelado') {
    caja.innerHTML =
      '<h1>No se completó</h1>' +
      '<div class="mal">No llegaste a terminar la domiciliación. No pasa nada: puedes volver a intentarlo cuando quieras.</div>' +
      (token ? '<p style="margin-top:16px"><button class="btn" id="reintentar">Volver a intentarlo →</button></p>' : '') +
      '<p class="err" id="err"></p>';
    if (token) document.getElementById('reintentar').addEventListener('click', irAPagar);
    return;
  }
  if (!token || token.length < 20) { enlaceMalo(); return; }

  caja.innerHTML =
    (mensual ? '<h1>Domicilia tu cuota</h1>' : '<h1>Domicilia tu cuota de entrenamiento</h1>') +
    (mensual
      ? '<p>Para no tener que ocuparte cada mes, tu cuota pasa a <b>domiciliación bancaria (SEPA)</b>: metes tu IBAN una vez y se cobra sola.</p>'
      : '<p>Para no tener que ocuparte cada trimestre, tu cuota de entrenamiento pasa a <b>domiciliación bancaria (SEPA)</b>: metes tu IBAN una vez y se cobra solo.</p>') +
    '<div class="dato">Cómo funciona:' +
      '<ul>' +
        (mensual
          ? '<li>Se cobra <b>cada mes</b>: el mes en curso al domiciliar, y luego <b>cada mes en esa misma fecha</b>.</li>' +
            '<li>Tras el cargo de junio <b>se para sola</b>.</li>'
          : '<li>Se cobra <b>por trimestres</b>: ahora (octubre), enero y abril.</li>' +
            '<li>Tras el cargo de abril <b>se para solo</b> — en junio no se te pasa nada.</li>') +
        '<li>El IBAN se teclea en la pantalla segura de Stripe, <b>nunca</b> en esta web.</li>' +
      '</ul>' +
    '</div>' +
    '<button class="btn" id="domiciliar">Domiciliar mi cuota →</button>' +
    '<p class="err" id="err"></p>' +
    '<p class="fina">Si ya la domiciliaste, puedes ignorar este mensaje: no se cobra dos veces.</p>';
  document.getElementById('domiciliar').addEventListener('click', irAPagar);
  }   // fin de legado()

  function irAPagar() {
    var btn = document.getElementById('domiciliar') || document.getElementById('reintentar');
    var err = document.getElementById('err');
    if (err) err.textContent = '';
    if (btn) { btn.disabled = true; btn.textContent = 'Abriendo…'; }
    esperarDB(function (db) {
      if (!db || !db.functions) { if (err) err.textContent = 'No se pudo conectar. Recarga la página.'; if (btn){ btn.disabled=false; btn.textContent=textoBoton(); } return; }
      db.functions.invoke('entreno-pagar', { body: { token: token } }).then(function (r) {
        var d = r && r.data;
        if (d && d.url) { location.href = d.url; return; }
        // Con 4xx/5xx supabase-js no da `data`: el cuerpo ({error, mensaje})
        // viene en error.context (la Response). Igual que en cubo-cuota.js.
        var ctx = r && r.error && r.error.context;
        var leer = (!d && ctx && typeof ctx.json === 'function') ? ctx.json().catch(function () { return null; }) : Promise.resolve(d);
        return leer.then(function (cuerpo) {
          if (estadoDeLaEdge(cuerpo)) return;
          if (btn) { btn.disabled = false; btn.textContent = textoBoton(); }
          if (err) err.textContent = (cuerpo && cuerpo.mensaje) || 'No se pudo abrir el pago. Inténtalo en un minuto.';
        });
      }).catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = textoBoton(); }
        if (err) err.textContent = 'No se pudo abrir el pago. Inténtalo en un minuto.';
      });
    });
  }

  // db.js se carga con defer: esperamos a que APOLANA_DB esté listo.
  function esperarDB(cb, intentos) {
    intentos = intentos == null ? 50 : intentos;
    if (window.APOLANA_DB && window.APOLANA_DB.functions) return cb(window.APOLANA_DB);
    if (intentos <= 0) return cb(null);
    setTimeout(function () { esperarDB(cb, intentos - 1); }, 100);
  }
})();
</script>
</body>
</html>
