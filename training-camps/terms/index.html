<style>
  /* ============================================================
     CONDICIONES DE CONTRATACIÓN · /training-camps/terms/
     El texto vive en la base (camp_condiciones, editable en el panel):
     la publicada; si aún no hay, el borrador con su marca. Las cifras
     ({senal}, {saldo_dias}…) salen de los ajustes. Prefijo tt-.
     ============================================================ */
  .tt-main { padding-block: clamp(28px, 5vw, 56px) clamp(56px, 8vw, 96px); }
  .tt-doc { max-width: 820px; margin-inline: auto; background: #fff; border-radius: 22px; box-shadow: var(--tc-sombra, 0 26px 50px -32px rgba(46,66,86,.5)); padding: clamp(22px, 4vw, 44px); }
  .tt-meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13.5px; color: var(--texto-suave); padding-bottom: 14px; border-bottom: 1px solid var(--linea); margin-bottom: 8px; }
  .tt-doc h2 { font-family: var(--fuente-titulo); font-size: clamp(19px, 2.4vw, 22px); color: var(--navy); margin: 28px 0 10px; line-height: 1.2; }
  .tt-doc p, .tt-doc li { font-size: 15.5px; line-height: 1.65; color: var(--texto); }
  .tt-doc p { margin: 0 0 12px; }
  .tt-doc ul { margin: 0 0 14px; padding-left: 22px; }
  .tt-doc li { margin-bottom: 6px; }
  .tt-acc { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
  .tt-cargando { padding: 60px 0; text-align: center; color: var(--texto-suave); }
  @media print { apolana-cabecera, apolana-pie, .tc-bar, .tt-acc { display: none !important; } .tt-doc { box-shadow: none; padding: 0; } }
</style>
</head>
<body>

<apolana-cabecera></apolana-cabecera>

<main class="tc-page">
  <div class="tc-bar">
    <div class="tc-wrap">
      <span class="tc-bar__label"><b data-i18n="bar.label">Training camps</b> · Alicante</span>
      <div class="tc-lang" role="group" aria-label="Language · Idioma">
        <button type="button" class="tc-lang__btn" data-tc-set="en" lang="en" aria-label="English" title="English" aria-pressed="true">EN</button>
        <button type="button" class="tc-lang__btn" data-tc-set="es" lang="es" aria-label="Español" title="Español" aria-pressed="false">ES</button>
      </div>
    </div>
  </div>

  <div class="tc-hero-shell">
    <section class="tc-hero tc-hero--compact" aria-labelledby="tt-titulo">
      <div class="tc-hero__inner">
        <p class="tc-hero__eyebrow" data-i18n="hero.eyebrow">Club Atletismo Apolana · Training camps</p>
        <h1 class="tc-hero__title" id="tt-titulo" data-i18n="hero.title">Booking conditions</h1>
      </div>
    </section>
  </div>

  <div class="tc-wrap tt-main">
    <div id="tt-aviso"></div>
    <article class="tt-doc" id="tt" aria-live="polite"><p class="tt-cargando" data-i18n="cargando">Loading…</p></article>
    <div class="tt-acc">
      <a class="btn btn--fantasma" href="../" data-tc-href data-i18n="volver">Back to training camps</a>
      <button type="button" class="btn btn--fantasma" onclick="window.print()" data-i18n="imprimir">Print</button>
    </div>
  </div>
</main>

<apolana-pie></apolana-pie>

<script>
(function () {
  'use strict';
  function db() { return window.APOLANA_DB || null; }
  TC.add({ es: { 'bar.label': 'Concentraciones', 'hero.eyebrow': 'Club Atletismo Apolana · Concentraciones', 'hero.title': 'Condiciones de contratación',
    'cargando': 'Cargando…', 'volver': 'Volver a concentraciones', 'imprimir': 'Imprimir' } });
  var T = {
    en: { version: 'Version {v}', fecha: 'Last updated {d}', borrador_t: 'Draft version', borrador_p: 'These conditions are a draft pending final review and may change. The version that applies to your booking is the one stated on your accepted proposal.', error: 'We could not load the conditions. Please try again in a moment.' },
    es: { version: 'Versión {v}', fecha: 'Actualizadas el {d}', borrador_t: 'Versión en borrador', borrador_p: 'Estas condiciones son un borrador pendiente de revisión y pueden cambiar. La versión que se aplica a tu reserva es la que figura en tu presupuesto aceptado.', error: 'No hemos podido cargar las condiciones. Vuelve a intentarlo en un momento.' }
  };
  var C = null;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  function L() { return T[TC.lang()] || T.en; }
  function r(s, o) { return String(s).replace(/\{(\w+)\}/g, function (_, k) { return o[k] == null ? '{' + k + '}' : o[k]; }); }
  function num(n) { return (Number(n) || 0).toLocaleString(TC.lang() === 'es' ? 'es-ES' : 'en-GB', { maximumFractionDigits: 2 }); }
  // Formato del texto: «## Título», párrafos separados por una línea en blanco y «- » para listas.
  function md(texto) {
    var out = [], lista = null;
    function cierra() { if (lista) { out.push('<ul>' + lista.join('') + '</ul>'); lista = null; } }
    String(texto || '').split(/\n/).forEach(function (l) {
      var s = l.trim();
      if (!s) { cierra(); return; }
      if (/^##\s+/.test(s)) { cierra(); out.push('<h2>' + esc(s.replace(/^##\s+/, '')) + '</h2>'); return; }
      if (/^-\s+/.test(s)) { (lista = lista || []).push('<li>' + esc(s.replace(/^-\s+/, '')) + '</li>'); return; }
      cierra(); out.push('<p>' + esc(s) + '</p>');
    });
    cierra();
    return out.join('');
  }
  function pintar() {
    var t = L(), es = TC.lang() === 'es';
    var senal = C.senal_tipo === 'importe' ? (es ? num(C.senal_valor) + ' €' : '€' + num(C.senal_valor)) : num(C.senal_valor) + ' %';
    var texto = r(es ? C.texto_es : C.texto_en, { senal: senal, senal_dias: C.senal_dias_pago, saldo_dias: C.saldo_dias_antes, validez_dias: C.validez_dias });
    var f = String(C.fecha || '').slice(0, 10);
    document.getElementById('tt-aviso').innerHTML = C.borrador
      ? '<div class="tc-note tc-note--warn" role="note" style="max-width:820px;margin:0 auto 18px"><div><b>' + esc(t.borrador_t) + '.</b> ' + esc(t.borrador_p) + '</div></div>' : '';
    document.getElementById('tt').innerHTML = '<div class="tt-meta"><span>' + esc(r(t.version, { v: C.version })) + '</span><span>' + esc(r(t.fecha, { d: f ? (TC.date ? TC.date(f) : f) : '' })) + '</span></div>' + md(texto);
  }
  async function cargar() {
    var x = await db().rpc('camp_condiciones_publicas');
    if (x.error || !x.data) { document.getElementById('tt').innerHTML = '<p>' + esc(L().error) + '</p>'; return; }
    C = x.data; pintar();
  }
  TC.onChange(function () { if (C) pintar(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', cargar); else cargar();
})();
</script>
</body>
</html>
