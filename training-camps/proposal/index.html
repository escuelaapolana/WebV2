<style>
  /* ============================================================
     PROPUESTA DEL CLIENTE · /training-camps/proposal/?t=…
     Lo que ve el cliente de su presupuesto (Edge camp-publico): conceptos,
     totales, calendario de pagos, aceptar con su nombre y descargar el PDF.
     Nunca hay costes ni notas internas (la base no los manda). Prefijo tp-.
     ============================================================ */
  .tp-main { padding-block: clamp(28px, 5vw, 56px) clamp(56px, 8vw, 96px); }
  .tp-estado { margin-bottom: 18px; }
  .tp-doc { background: #fff; border-radius: 22px; box-shadow: var(--tc-sombra, 0 26px 50px -32px rgba(46,66,86,.5)); overflow: hidden; }
  .tp-doc__cab { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding: clamp(20px, 3vw, 30px); border-bottom: 1px solid var(--linea); }
  .tp-doc__cab h2 { margin: 0; font-family: var(--fuente-titulo); font-size: clamp(22px, 3vw, 30px); color: var(--navy); line-height: 1.1; }
  .tp-doc__cab .num { font-family: var(--fuente-dato); color: var(--azul); font-size: 14px; font-weight: 700; }
  .tp-doc__cab dl { display: grid; grid-template-columns: auto auto; gap: 4px 16px; margin: 0; font-size: 14.5px; align-self: center; }
  .tp-doc__cab dt { color: var(--texto-suave); } .tp-doc__cab dd { margin: 0; color: var(--navy); font-weight: 600; }
  .tp-tabla { width: 100%; border-collapse: collapse; font-size: 15px; }
  .tp-tabla th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-suave); font-weight: 700; padding: 12px 10px; background: var(--crema); }
  .tp-tabla th.n, .tp-tabla td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tp-tabla th:first-child, .tp-tabla td:first-child { padding-left: clamp(20px, 3vw, 30px); }
  .tp-tabla th:last-child, .tp-tabla td:last-child { padding-right: clamp(20px, 3vw, 30px); }
  .tp-tabla td { padding: 12px 10px; border-top: 1px solid var(--linea); vertical-align: top; color: var(--navy); }
  .tp-tabla td small { display: block; color: var(--texto-suave); font-size: 13.5px; margin-top: 2px; }
  .tp-tabla tr.cat td { background: #FCFAF6; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--azul); padding-block: 8px; }
  .tp-tabla td.imp { font-family: var(--fuente-dato); font-weight: 700; }
  .tp-pie { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: clamp(18px, 3vw, 34px); padding: clamp(20px, 3vw, 30px); border-top: 1px solid var(--linea); }
  .tp-tot { display: grid; gap: 2px; align-self: start; }
  .tp-tot div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 15px; color: var(--texto); }
  .tp-tot div b { font-family: var(--fuente-dato); color: var(--navy); font-variant-numeric: tabular-nums; }
  .tp-tot .total { background: var(--navy); color: #fff; border-radius: 12px; padding: 12px 14px; margin: 6px 0; font-size: 17px; font-weight: 700; }
  .tp-tot .total b { color: #fff; font-size: 20px; }
  .tp-tot .plazo { font-size: 14.5px; }
  .tp-tot .plazo span small { display: block; color: var(--texto-suave); font-size: 12.5px; }
  .tp-notas h3, .tp-bloque h3 { margin: 0 0 8px; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-suave); }
  .tp-notas p { margin: 0 0 14px; font-size: 15px; line-height: 1.6; color: var(--texto); white-space: pre-line; }
  .tp-acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .tp-bloque { margin-top: 22px; background: #fff; border-radius: 22px; box-shadow: var(--tc-sombra, 0 26px 50px -32px rgba(46,66,86,.5)); padding: clamp(20px, 3vw, 30px); }
  .tp-bloque h2 { margin: 0 0 6px; font-family: var(--fuente-titulo); font-size: clamp(22px, 3vw, 28px); color: var(--navy); }
  .tp-bloque > p { margin: 0 0 16px; color: var(--texto); line-height: 1.6; }
  .tp-acepta { display: grid; gap: 14px; max-width: 560px; }
  .tp-acepta input[type=text] { min-height: 50px; border: 1px solid var(--linea-borde); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--navy); }
  .tp-acepta input[type=text]:focus { outline: 3px solid var(--azul-filete); outline-offset: 1px; }
  .tp-pagos { display: grid; gap: 10px; }
  .tp-pago { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--linea); border-radius: 14px; }
  .tp-pago b { color: var(--navy); } .tp-pago small { display: block; color: var(--texto-suave); font-size: 13.5px; }
  .tp-pago .imp { font-family: var(--fuente-dato); font-weight: 700; color: var(--navy); font-size: 17px; }
  .tp-pago .ok { color: var(--verde); font-weight: 700; font-size: 14px; }
  .tp-cargando { padding: 60px 0; text-align: center; color: var(--texto-suave); }
  @media (max-width: 720px) {
    .tp-pie { grid-template-columns: 1fr; }
    .tp-tot { order: -1; }
    .tp-tabla thead { display: none; }
    .tp-tabla tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 12px clamp(20px, 3vw, 30px); border-top: 1px solid var(--linea); }
    .tp-tabla tr.cat { padding-block: 8px; background: #FCFAF6; }
    .tp-tabla td { border: 0; padding: 0 !important; }
    .tp-tabla td.desc { grid-column: 1 / -1; }
    .tp-tabla td.cant { color: var(--texto-suave); font-size: 14px; padding-top: 6px !important; text-align: left; }
    .tp-tabla td.pu, .tp-tabla td.iva { display: none; }
    .tp-tabla td.imp { padding-top: 6px !important; }
  }
  @media print {
    apolana-cabecera, apolana-pie, .tc-bar, .tp-acciones, .tp-bloque--acepta { display: none !important; }
    .tp-doc { box-shadow: none; border: 1px solid #ddd; }
  }
</style>
</head>

      para: 'Preparado para', fechas: 'Fechas', personas: 'Participantes', valido: 'Válido hasta', numero: 'Presupuesto', fecha: 'Fecha',
      concepto: 'Concepto', cant: 'Cant.', pu: 'Precio unit.', iva: 'IVA', importe: 'Importe', subtotal: 'Base imponible', ivade: 'IVA {p} % sobre {b}', total: 'Total',

      anul_t: 'Esta propuesta ya no está disponible', anul_p: 'Escríbenos si tienes cualquier duda.', rech_t: 'Esta propuesta se rechazó',
      canc_t: 'Esta solicitud de concentración se ha cancelado',
      pagos_t: 'Pagos', pagos_p: 'Paga de forma segura con tarjeta (Stripe). Cada pago solo se da por recibido cuando Stripe lo confirma.', pagar: 'Pagar {i}', pagado: 'Recibido el {d}', vence: 'vence el {d}',
      pagos_off: 'Te enviaremos los datos para hacer cada pago.', pendiente: 'Pendiente',
      dudas: '¿Alguna duda? Contesta al correo que te enviamos o escribe a {e}.' }
  };
  var MES = { en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], es: ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'] };
  var ORDEN = ['instalaciones','gimnasio','material','transporte','entrenadores','servicios','otros'];
  var token = new URLSearchParams(location.search).get('t') || '', D = null;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  function L() { return T[TC.lang()] || T.en; }
  function r(s, o) { return String(s).replace(/\{(\w+)\}/g, function (_, k) { return o[k] == null ? '' : o[k]; }); }
  function fecha(f) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(f || ''); return m ? (+m[3]) + ' ' + MES[TC.lang()][+m[2] - 1] + ' ' + m[1] : ''; }
  function eur(n) {
    var v = Number(n) || 0, es = TC.lang() === 'es';
    var s = v.toLocaleString(es ? 'es-ES' : 'en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true });
    return es ? s + ' €' : '€' + s;
  }
  function num(n) { var v = Number(n) || 0; return v.toLocaleString(TC.lang() === 'es' ? 'es-ES' : 'en-GB', { maximumFractionDigits: 2 }); }
  function rango(a, b) { if (!a) return ''; return (a.slice(0, 4) === (b || '').slice(0, 4) ? fecha(a).replace(/ \d{4}$/, '') : fecha(a)) + ' – ' + fecha(b); }
  function aviso(tipo, titulo, texto, extra) {
    return '<div class="tc-note ' + (tipo ? 'tc-note--' + tipo : '') + ' tp-estado" role="status"><div><b>' + esc(titulo) + '</b>' + (texto ? '<br>' + texto : '') + (extra || '') + '</div></div>';
  }
  async function llamar(cuerpo) {
    var r1 = await db().functions.invoke('camp-publico', { body: Object.assign({ t: token, lang: TC.lang() }, cuerpo) });
    if (r1.error) { var m = ''; try { var j = await r1.error.context.json(); m = j.mensaje || ''; } catch (e) {} throw new Error(m || L().red); }
    return r1.data;
  }

  function pintar() {
    var t = L(), d = D, ex = d.expediente || {};
    document.getElementById('tp-ante').textContent = t.numero + ' ' + d.numero;
    document.getElementById('tp-lead').textContent = [ex.entidad, rango(d.llegada, d.salida), d.participantes ? d.participantes + ' ' + t.personas.toLowerCase() : ''].filter(Boolean).join(' · ');
    var est = '';
    if (ex.cancelado) est = aviso('warn', t.canc_t, esc(t.anul_p));
    else if (d.estado === 'aceptado') est = aviso('ok', t.ok_t, esc(r(t.ok_p, { d: fecha(String(d.aceptado_en || '').slice(0, 10)), n: d.aceptado_nombre || '—' })));
    else if (d.estado === 'sustituido') est = aviso('warn', t.sust_t, esc(t.sust_p), d.sustituido_por ? '<br><a class="tc-link-btn" href="?t=' + esc(d.sustituido_por) + '&lang=' + TC.lang() + '">' + esc(t.sust_b) + ' →</a>' : '');
    else if (d.estado === 'anulado') est = aviso('warn', t.anul_t, esc(t.anul_p));
    else if (d.estado === 'rechazado') est = aviso('warn', t.rech_t, esc(t.anul_p));

    var filas = '';

          '<td class="n cant">' + esc(num(l.cantidad) + (l.unidad ? ' ' + l.unidad : '')) + '</td><td class="n pu">' + eur(l.precio) + '</td>' +

      });
    });
    var tot = '<div><span>' + t.subtotal + '</span><b>' + eur(d.base) + '</b></div>' +
      (d.desglose || []).map(function (x) { return '<div><span>' + esc(r(t.ivade, { p: num(x.pct), b: eur(x.base) })) + '</span><b>' + eur(x.cuota) + '</b></div>'; }).join('') +
      '<div class="total"><span>' + t.total + '</span><b>' + eur(d.total) + '</b></div>' +
      '<div class="plazo"><span>' + esc(d.senal_tipo === 'porcentaje' ? r(t.senal_pct, { p: num(d.senal_valor) }) : t.senal) + '<small>' + t.senal_cuando + '</small></span><b>' + eur(d.senal) + '</b></div>' +
      '<div class="plazo"><span>' + t.saldo + '<small>' + esc(d.saldo_vence ? r(t.saldo_cuando, { d: fecha(d.saldo_vence) }) : t.saldo_antes) + '</small></span><b>' + eur(d.saldo) + '</b></div>';
    var em = d.emisor || {};
    var condUrl = '../terms/?lang=' + TC.lang();
    var html = est +
      '<article class="tp-doc"><header class="tp-doc__cab"><div><span class="num">' + esc(d.numero) + '</span><h2>' + esc(d.titulo || ex.entidad) + '</h2></div>' +
        '<dl><dt>' + t.para + '</dt><dd>' + esc(ex.entidad) + '</dd><dt>' + t.fechas + '</dt><dd>' + esc(rango(d.llegada, d.salida)) + '</dd>' +
        (d.participantes ? '<dt>' + t.personas + '</dt><dd>' + esc(d.participantes) + '</dd>' : '') +
        '<dt>' + t.fecha + '</dt><dd>' + esc(fecha(d.fecha)) + '</dd>' + (d.valido_hasta ? '<dt>' + t.valido + '</dt><dd>' + esc(fecha(d.valido_hasta)) + '</dd>' : '') + '</dl></header>' +
        '<table class="tp-tabla"><thead><tr><th>' + t.concepto + '</th><th class="n">' + t.cant + '</th><th class="n">' + t.pu + '</th><th class="n">' + t.iva + '</th><th class="n">' + t.importe + '</th></tr></thead><tbody>' + filas + '</tbody></table>' +
        '<div class="tp-pie"><div class="tp-notas">' + (d.notas_cliente ? '<h3>' + t.notas + '</h3><p>' + esc(d.notas_cliente) + '</p>' : '') +
          (d.formas_pago ? '<h3>' + t.pago + '</h3><p>' + esc(d.formas_pago) + '</p>' : '') + (d.nota_impuestos ? '<h3>' + t.iva + '</h3><p>' + esc(d.nota_impuestos) + '</p>' : '') +
          '<div class="tp-acciones"><button type="button" class="btn btn--fantasma" id="tp-pdf">' + t.pdf + '</button><button type="button" class="btn btn--fantasma" onclick="window.print()">' + t.imprimir + '</button></div></div>' +
          '<div class="tp-tot">' + tot + '</div></div></article>';

    var pagos = (d.pagos || []);
    if (pagos.length) {
      var online = d.pagos_online === true;
      html += '<section class="tp-bloque"><h2>' + t.pagos_t + '</h2><p>' + (online ? t.pagos_p : t.pagos_off) + '</p><div class="tp-pagos">' + pagos.map(function (p) {
        return '<div class="tp-pago"><div><b>' + esc(p.concepto) + '</b><small>' + esc(p.pagado ? r(t.pagado, { d: fecha(p.fecha_pago) }) : p.vence ? r(t.vence, { d: fecha(p.vence) }) : '') + '</small></div>' +
          '<span class="imp">' + eur(p.importe) + '</span>' + (p.pagado ? '<span class="ok">✓</span>' : online && p.token ? '<a class="btn btn--primario" href="../pay/?t=' + esc(p.token) + '&lang=' + TC.lang() + '">' + esc(r(t.pagar, { i: eur(p.importe) })) + '</a>' : '<span class="tc-mono" style="font-size:13px;color:var(--texto-suave)">' + esc(t.pendiente) + '</span>') + '</div>';
      }).join('') + '</div></section>';
    }
    if (d.estado === 'enviado' && !d.caducado && !ex.cancelado) {
      html += '<section class="tp-bloque tp-bloque--acepta" id="aceptar"><h2>' + t.acep_t + '</h2><p>' + t.acep_p + '</p>' +
        '<form class="tp-acepta" id="tp-form" novalidate><label class="tc-field"><span class="tc-label">' + t.nombre + '</span><input type="text" id="tp-nombre" autocomplete="name" placeholder="' + t.nombre_ph + '" value="' + esc(ex.contacto || '') + '"></label>' +
        '<label class="tc-check"><input type="checkbox" id="tp-acepto"><span>' + r(t.acepto, { u: condUrl, v: esc(d.condiciones_version || '') }) + '</span></label>' +
        '<p class="tc-error" id="tp-err" role="alert" hidden></p>' +
        '<div><button type="submit" class="btn btn--primario tc-btn--lg" id="tp-boton">' + t.boton + '</button></div></form></section>';
    }
    if (em.email) html += '<p style="margin-top:22px;color:var(--texto-suave);font-size:14.5px">' + esc(r(t.dudas, { e: em.email })) + '</p>';
    document.getElementById('tp').innerHTML = html;

    document.getElementById('tp-pdf').addEventListener('click', descargar);
    var f = document.getElementById('tp-form');
    if (f) f.addEventListener('submit', aceptar);
  }

  async function descargar(ev) {
    var b = ev.currentTarget, txt = b.textContent; b.disabled = true; b.textContent = '…';
    try {
      var d = await llamar({ accion: 'pdf' });
      var bin = atob(d.pdf), u8 = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
      var a = document.createElement('a'); a.href = url; a.download = d.nombre; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    } catch (e) { alert(e.message); }
    b.disabled = false; b.textContent = txt;
  }

  async function aceptar(ev) {
    ev.preventDefault();
    var t = L(), err = document.getElementById('tp-err'), nombre = document.getElementById('tp-nombre').value.trim();
    err.hidden = true;
    if (nombre.length < 3) { err.textContent = t.err_nombre; err.hidden = false; document.getElementById('tp-nombre').focus(); return; }
    if (!document.getElementById('tp-acepto').checked) { err.textContent = t.err_acepto; err.hidden = false; return; }
    var b = document.getElementById('tp-boton'); b.disabled = true; b.textContent = t.aceptando;
    try {
      await llamar({ accion: 'aceptar', nombre: nombre, acepto: true });
      await cargar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) { err.textContent = e.message; err.hidden = false; b.disabled = false; b.textContent = t.boton; }
  }

  async function cargar() {
    if (!/^[0-9a-f]{40,128}$/i.test(token)) { document.getElementById('tp').innerHTML = aviso('warn', L().enlace, ''); return; }
    try {
      var d = await llamar({ accion: 'propuesta' });
      D = d.propuesta;
      // Sin ?lang en el enlace, la página habla el idioma del presupuesto.
      if (!new URLSearchParams(location.search).get('lang') && D.idioma && D.idioma !== TC.lang()) TC.setLang(D.idioma);
      pintar();
    } catch (e) { document.getElementById('tp').innerHTML = aviso('warn', e.message || L().enlace, ''); }
  }

  TC.onChange(function () { if (D) pintar(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', cargar); else cargar();
})();
</script>

</html>
