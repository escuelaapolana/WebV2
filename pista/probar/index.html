<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probar atletismo en pista · Club Atletismo Apolana</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/datos.js" defer></script>
<script src="../../assets/js/apolana.js" defer></script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/textos-web.js" defer></script>
<script src="../../assets/js/editar-en-vivo.js" defer></script>
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; }
  body { background:var(--crema,#FBF9F4); }
  .ap-form { max-width:620px; margin:0 auto; padding:clamp(22px,5vw,44px) clamp(16px,4vw,28px) 60px; }
  .ap-form h1 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
                font-size:clamp(28px,6vw,40px); line-height:1.02; color:var(--navy,#26374B); margin:0 0 8px; }
  .ap-form .intro { font-size:15.5px; line-height:1.6; color:var(--texto-suave,#6E6656); margin:0 0 22px; }
  .campo { margin-bottom:16px; }
  .campo label { display:block; font-size:14px; font-weight:600; color:var(--navy,#26374B); margin-bottom:6px; }
  .campo label .opt { font-weight:400; color:var(--texto-tenue,#9A927F); }
  .campo input[type=text], .campo input[type=tel], .campo input[type=number], .campo textarea {
    width:100%; box-sizing:border-box; min-height:46px; padding:11px 13px; font-size:16px;
    font-family:var(--fuente-texto,inherit); color:var(--navy,#26374B); background:#fff;
    border:1px solid var(--linea-borde,#D8CFBC); border-radius:11px; }
  .campo textarea { min-height:80px; resize:vertical; }
  .campo input:focus, .campo textarea:focus { outline:2px solid var(--azul,#2F6FA8); outline-offset:1px; border-color:var(--azul,#2F6FA8); }
  fieldset { border:0; padding:0; margin:0 0 16px; }
  fieldset legend { font-size:14px; font-weight:600; color:var(--navy,#26374B); margin-bottom:8px; padding:0; }
  .opcion { display:flex; align-items:center; gap:11px; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB);
            border-radius:12px; padding:13px 14px; margin-bottom:9px; cursor:pointer; }
  .opcion:has(input:checked) { border-color:var(--azul,#2F6FA8); box-shadow:0 0 0 1px var(--azul,#2F6FA8) inset; background:#F5F9FC; }
  .opcion input { width:20px; height:20px; flex:0 0 auto; accent-color:var(--azul,#2F6FA8); }
  .opcion .tx { flex:1; }
  .opcion .tx b { display:block; font-size:15px; color:var(--navy,#26374B); }
  .opcion .tx small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:1px; }
  .sub-menor { background:#F5F9FC; border:1px solid #cfe0ee; border-radius:12px; padding:12px 14px; margin:0 0 16px; }
  .sub-menor .campo:last-child { margin-bottom:0; }
  .enviar { display:inline-flex; align-items:center; justify-content:center; width:100%; min-height:52px; margin-top:8px;
            border:0; border-radius:999px; background:var(--azul,#2F6FA8); color:#fff; font-family:inherit;
            font-size:17px; font-weight:600; cursor:pointer; }
  .enviar:hover { background:var(--azul-hover,#1E4E78); }
  .enviar[disabled] { opacity:.55; cursor:not-allowed; }
  .err { color:#b3261e; font-size:14px; margin:10px 0 0; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .hecho { text-align:center; padding:28px 10px; }
  .hecho .tic { width:64px; height:64px; border-radius:50%; background:#EAF3E3; color:#4E8A3E; display:grid; place-items:center; margin:0 auto 16px; }
  .hecho h2 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:24px; color:var(--navy,#26374B); margin:0 0 8px; }
  .hecho p { font-size:15.5px; line-height:1.6; color:var(--texto-suave,#6E6656); margin:0 auto; max-width:440px; }
</style>
</head>
<body>

<apolana-cabecera activo="entrena"></apolana-cabecera>

<main class="ap-form">
  <div id="pista-form">
    <h1>Ven a probar</h1>
    <p class="intro">¿Quieres probar un entrenamiento de atletismo en pista? Déjanos tus datos y te escribimos para citarte un día. Sin compromiso.</p>

    <form id="f" novalidate>
      <div class="campo">
        <label for="nombre">Nombre y apellidos</label>
        <input type="text" id="nombre" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" autocomplete="tel" required>
      </div>

      <fieldset>
        <legend>¿Qué día te viene mejor para probar?</legend>
        <label class="opcion"><input type="radio" name="dia" value="lx"><span class="tx"><b>Lunes y miércoles</b></span></label>
        <label class="opcion"><input type="radio" name="dia" value="mj"><span class="tx"><b>Martes y jueves</b></span></label>
        <label class="opcion"><input type="radio" name="dia" value="cualquiera" checked><span class="tx"><b>Me da igual</b><small>Cualquier día, lo vemos juntos</small></span></label>
      </fieldset>

      <label class="opcion" style="margin-bottom:14px">
        <input type="checkbox" id="menor">
        <span class="tx"><b>Es para un niño/a</b><small>Si la prueba es para un menor, marca aquí</small></span>
      </label>
      <div class="sub-menor" id="caja-menor" hidden>
        <div class="campo">
          <label for="edad">Edad del niño/a</label>
          <input type="number" id="edad" min="3" max="17" inputmode="numeric">
        </div>
        <div class="campo">
          <label for="tutor">Nombre del padre/madre o tutor</label>
          <input type="text" id="tutor" autocomplete="name">
        </div>
      </div>

      <div class="campo">
        <label for="nota">¿Algo que debamos saber? <span class="opt">(opcional)</span></label>
        <textarea id="nota" placeholder="Experiencia previa, lesiones, horario preferido…"></textarea>
      </div>

      <div class="hp" aria-hidden="true"><label>No rellenar<input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>

      <button type="submit" class="enviar" id="btn">Pedir prueba</button>
      <p class="err" id="err" hidden></p>
    </form>
  </div>
</main>

<apolana-pie></apolana-pie>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var f = document.getElementById('f');
    var err = document.getElementById('err');
    var menor = document.getElementById('menor');
    var cajaMenor = document.getElementById('caja-menor');
    function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
    function radio(name) { var e = document.querySelector('input[name="' + name + '"]:checked'); return e ? e.value : ''; }
    function db() { return window.APOLANA_DB || null; }

    menor.addEventListener('change', function () { cajaMenor.hidden = !menor.checked; });

    f.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      err.hidden = true;
      if (!val('nombre')) { err.textContent = 'Pon el nombre.'; err.hidden = false; return; }
      if (!val('telefono')) { err.textContent = 'Hace falta un teléfono de contacto.'; err.hidden = false; return; }
      if (menor.checked && !val('tutor')) { err.textContent = 'Si es para un menor, pon el nombre del padre/madre o tutor.'; err.hidden = false; return; }
      if (!db() || !db().functions) { err.textContent = 'No hemos podido conectar. Vuelve a intentarlo.'; err.hidden = false; return; }

      var btn = document.getElementById('btn');
      btn.disabled = true; var t = btn.textContent; btn.textContent = 'Enviando…';
      var r = await db().functions.invoke('pista-prueba', { body: {
        nombre: val('nombre'), telefono: val('telefono'), dia: radio('dia'),
        menor: menor.checked, edad: val('edad'), tutor: val('tutor'),
        nota: val('nota'), website: val('website')
      } });
      btn.disabled = false; btn.textContent = t;

      if (r.error) {
        var m = '';
        try { var j = await r.error.context.json(); m = j.mensaje || ''; } catch (e) {}
        err.textContent = m || 'No se ha podido enviar. Inténtalo de nuevo.'; err.hidden = false; return;
      }
      document.getElementById('pista-form').innerHTML =
        '<div class="hecho">' +
          '<div class="tic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>' +
          '<h2>¡Recibido!</h2>' +
          '<p>Gracias. Te escribiremos al teléfono que nos has dejado para citarte un día de prueba. ¡Nos vemos en la pista!</p>' +
        '</div>';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
</script>

</body>
</html>
