<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario · Club Atletismo Apolana</title>
<meta name="description" content="Entrenamientos y competiciones del Club Atletismo Apolana en Alicante. Los mismos datos que ve la app, filtrables por grupo, con la próxima competición siempre a la vista.">
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/apolana.css">
<script>window.APOLANA_BASE="../";</script>
<script src="../assets/js/datos.js" defer></script>
<script src="../assets/js/apolana.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../assets/js/db.js" defer></script>
<style>
  /* ===========================================================
     LAYOUT PROPIO DE LA PÁGINA /calendario
     Usa las piezas del sistema (apolana.css) y añade solo la
     colocación específica de esta página.
     =========================================================== */

  /* Cabecera del mes: eyebrow + titular grande + filtros */
  .cal-cab {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
  }
  .cal-cab .mes { margin-top: 8px; }
  .mes-fila { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }

  /* Navegación de mes (anterior / hoy / siguiente) */
  .mes-nav { display: flex; align-items: center; gap: 8px; }
  .mes-nav button {
    background: #fff; border: 1px solid var(--linea-borde); color: var(--navy);
    border-radius: var(--radio-pastilla); padding: 7px 13px;
    font-family: inherit; font-size: 14px; line-height: 1; cursor: pointer;
  }
  .mes-nav button:hover { border-color: var(--azul); }

  /* Filtros por sección (pastillas) */
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .filtro {
    padding: 9px 15px; border-radius: var(--radio-pastilla);
    background: #fff; border: 1px solid var(--linea-borde);
    color: var(--texto); font-family: inherit; font-size: 14px; line-height: 1.2; cursor: pointer;
  }
  .filtro[aria-pressed="true"] {
    background: var(--azul-oscuro); border-color: var(--azul-oscuro);
    color: #fff; font-weight: 600;
  }

  /* Rejilla: calendario (izquierda) + columna lateral (derecha) */
  .cal-grid {
    margin-top: clamp(22px, 3vw, 28px);
    display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; align-items: start;
  }
  /* Sin esto, las columnas de un grid no bajan de su contenido y desbordan en móvil */
  .cal-grid > * { min-width: 0; }

  /* Tarjeta del calendario */
  .cal-tabla {
    background: #fff; border: 1px solid var(--crema-media);
    border-radius: 18px; padding: 22px;
    box-shadow: 0 26px 50px -36px rgba(46,66,86,0.5);
    max-width: 100%; overflow: hidden;
  }
  .cal-dias-cab {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px;
    font-family: var(--fuente-mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--texto-tenue); text-align: center; padding-bottom: 10px;
  }
  .cal-dias-cab span { min-width: 0; overflow: hidden; }
  .cal-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .dia {
    height: 92px; border-radius: 10px;
    background: var(--crema); border: 1px solid var(--crema-banda);
    padding: 8px; display: flex; flex-direction: column; gap: 5px;
    min-width: 0; overflow: hidden;
    font-family: inherit; text-align: left; cursor: pointer;
  }
  .dia:hover { border-color: var(--azul); }
  .dia .num { font-family: var(--fuente-mono); font-size: 11px; color: var(--texto-suave); }
  .dia .ev {
    font-size: 11px; color: #6B6558; line-height: 1.3;
    overflow: hidden; overflow-wrap: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  }
  .dia.fuera { cursor: default; }
  .dia.fuera .num { color: #C0B8A6; }
  .dia.cierre { background: var(--aviso-fondo); border-color: var(--aviso-borde); }
  .dia.cierre .num { color: var(--aviso-titulo); }
  .dia.cierre .ev { color: #8A7530; }
  .dia.compe { background: #EDF7E4; border-color: #C3E39B; }
  .dia.compe .num { color: #5B8B33; }
  .dia.compe .ev { color: #4C7A28; }
  /* "Hoy" manda sobre el resto de estados: es la referencia de la página */
  .dia.hoy { background: var(--azul-suave); border-color: var(--azul); }
  .dia.hoy .num { color: var(--azul-oscuro); font-weight: 700; }
  .dia.hoy .ev { color: var(--azul-oscuro); }
  .dia.sel { outline: 2px solid var(--azul-oscuro); outline-offset: 1px; }

  /* Columna lateral */
  .cal-lado { display: flex; flex-direction: column; gap: 14px; }

  /* Próximos eventos (lista desde base de datos) */
  #proximos-eventos .hora { width: 56px; text-transform: uppercase; }
  .abierta {
    display: inline-block; margin-top: 2px;
    font-family: var(--fuente-mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #4C7A28;
  }

  /* Tarjeta del día seleccionado */
  .dia-detalle {
    background: #fff; border: 1px solid var(--crema-media);
    border-radius: 16px; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 22px 44px -36px rgba(46,66,86,0.5);
  }
  .dia-detalle .cabeza { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .dia-detalle .cabeza h2 {
    font-family: var(--fuente-titulo); font-weight: 700; font-size: 24px;
    text-transform: uppercase; color: var(--navy);
  }
  .dia-detalle .cabeza .conteo { font-family: var(--fuente-mono); font-size: 11px; color: var(--texto-tenue); white-space: nowrap; }
  .actividad { display: flex; gap: 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--crema-banda); }
  .actividad:last-child { padding-bottom: 0; border-bottom: 0; }
  .actividad .hora { font-family: var(--fuente-mono); font-size: 12px; color: var(--azul-oscuro); width: 48px; flex-shrink: 0; }
  .actividad .que { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .actividad .que .titulo-act { font-size: 15px; color: var(--navy); overflow-wrap: anywhere; }
  .actividad .que .lugar { font-size: 12px; color: var(--texto-suave); overflow-wrap: anywhere; }

  /* Estado vacío / de carga dentro de las tarjetas de la columna */
  .vacio { font-size: 14px; color: var(--texto-suave); margin: 0; }

  /* Tarjeta de próxima competición */
  .proxima {
    background: var(--crema-banda); border: 1px solid var(--linea-borde);
    border-radius: 16px; padding: 20px 22px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .proxima .etq { font-family: var(--fuente-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--aviso-titulo); }
  .proxima h2 { font-family: var(--fuente-titulo); font-weight: 700; font-size: 28px; text-transform: uppercase; color: var(--navy); line-height: 1; overflow-wrap: anywhere; }
  .proxima .datos { font-size: 14px; color: #6B6558; }
  .proxima .btn { margin-top: 4px; width: 100%; }

  /* Leyenda */
  .leyenda {
    display: flex; flex-wrap: wrap; gap: 14px; padding: 0 4px;
    font-family: var(--fuente-mono); font-size: 11px; color: var(--texto-suave);
  }
  .leyenda span { display: flex; align-items: center; gap: 6px; }
  .leyenda .punto { width: 9px; height: 9px; border-radius: 5px; }

  /* Banda inferior: apuntarse desde el portal */
  .sync {
    background: #fff; border: 1px solid var(--crema-media); border-radius: 16px;
    padding: 24px 28px; display: flex; align-items: center; justify-content: space-between; gap: 30px;
  }
  .sync p { margin: 0; font-size: 16px; color: var(--texto); }
  .sync .btn { flex-shrink: 0; }

  /* ===========================================================
     RESPONSIVE
     =========================================================== */
  @media (max-width: 900px) {
    .cal-cab { align-items: flex-start; }
    .filtros { justify-content: flex-start; }
    .cal-grid { grid-template-columns: 1fr; }
    .sync { flex-direction: column; align-items: flex-start; }
    .sync .btn { width: 100%; }
  }
  @media (max-width: 560px) {
    .cal-tabla { padding: 14px 10px; }
    .cal-dias-cab, .cal-dias { gap: 4px; }
    .cal-dias-cab { font-size: 9px; letter-spacing: 0.04em; }
    .dia { height: 74px; padding: 5px; border-radius: 8px; }
    .dia .ev { font-size: 9px; -webkit-line-clamp: 2; }
    .filtro { padding: 8px 13px; font-size: 13px; }
  }
</style>
</head>
<body>

<apolana-cabecera activo="calendario"></apolana-cabecera>

<main>

  <section class="seccion">
    <div class="contenedor">

      <!-- ================= CABECERA DEL MES + FILTROS ================= -->
      <div class="cal-cab">
        <div>
          <span class="eyebrow">Entrenamientos y competiciones</span>
          <div class="mes-fila">
            <h1 class="display mes" id="cal-mes">Calendario</h1>
            <div class="mes-nav">
              <button type="button" id="mes-prev" aria-label="Mes anterior">←</button>
              <button type="button" id="mes-hoy">Hoy</button>
              <button type="button" id="mes-sig" aria-label="Mes siguiente">→</button>
            </div>
          </div>
        </div>
        <div class="filtros" id="cal-filtros" role="group" aria-label="Filtrar el calendario"></div>
      </div>

      <!-- ================= CALENDARIO + COLUMNA LATERAL ================= -->
      <div class="cal-grid">

        <!-- Calendario del mes -->
        <div class="cal-tabla">
          <div class="cal-dias-cab">
            <span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span>
          </div>
          <div class="cal-dias" id="cal-dias"></div>
        </div>

        <!-- Columna lateral -->
        <div class="cal-lado">

          <!-- Día seleccionado -->
          <div class="dia-detalle" id="dia-detalle">
            <div class="cabeza"><h2>Cargando…</h2></div>
          </div>

          <!-- Próxima competición -->
          <div class="proxima" id="proxima-competicion" hidden></div>

          <!-- Próximos eventos y competiciones -->
          <div class="dia-detalle" id="proximos-eventos">
            <div class="cabeza"><h2>Próximos eventos</h2></div>
            <p class="vacio">Cargando…</p>
          </div>

          <!-- Leyenda -->
          <div class="leyenda">
            <span><span class="punto" style="background: var(--azul);"></span>Hoy</span>
            <span><span class="punto" style="background: #7FBF4A;"></span>Competición</span>
            <span><span class="punto" style="background: #E8B84B;"></span>Cierre de inscripción</span>
          </div>

        </div>
      </div>

      <!-- ================= APUNTARSE DESDE EL PORTAL ================= -->
      <div class="sync" style="margin-top: clamp(28px, 4vw, 40px);">
        <p>¿Quieres apuntarte a un entrenamiento, a una clase de El Cubo o a una competición? Se hace desde tu zona del portal, con tu cuenta.</p>
        <a class="btn btn--fantasma" href="../portal/calendario/">Entra para apuntarte</a>
      </div>

    </div>
  </section>

</main>

<apolana-pie></apolana-pie>

<!-- Calendario en directo desde Supabase. Sin datos o sin conexión: estado vacío. -->
<script>
(function () {
  'use strict';

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  var ETIQUETA_SECCION = {
    escuela: 'Escuela', running: 'Running', competicion: 'Pista',
    natacion: 'Natación', montana: 'Montaña', triatlon: 'Triatlón'
  };
  var ETIQUETA_TIPO = {
    natacion: 'Natación', pista: 'Pista', gym: 'Gimnasio', continuo: 'Rodaje',
    activacion: 'Activación', competicion: 'Competición'
  };

  var hoyKey = null;        // 'AAAA-MM-DD' de hoy, con la fecha real del navegador
  var mesVista = null;      // Date apuntando al día 1 del mes que se muestra
  var diaSel = null;        // clave del día seleccionado
  var filtro = 'todo';
  var porDia = {};          // clave de día -> lista de actividades
  var cierres = {};         // clave de día -> true si ese día cierra alguna inscripción
  var proximos = [];        // competiciones y eventos futuros, ordenados
  var proxCompeticion = null;
  var seccionesConDatos = {};
  var hayCompeticiones = false, hayCubo = false;

  /* ---------- ayudantes de fecha (sin zonas horarias raras) ---------- */
  function dosCifras(n) { return (n < 10 ? '0' : '') + n; }
  function claveDe(d) { return d.getFullYear() + '-' + dosCifras(d.getMonth() + 1) + '-' + dosCifras(d.getDate()); }
  function deClave(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function claveDeMarca(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? null : claveDe(d); }
  function horaDeMarca(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return dosCifras(d.getHours()) + ':' + dosCifras(d.getMinutes());
  }
  function horaCorta(h) { return h ? String(h).slice(0, 5) : null; }
  function fechaLarga(clave) {
    var d = deClave(clave);
    return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
  }
  function fechaCorta(clave) {
    var d = deClave(clave);
    return d.getDate() + ' ' + MESES_CORTO[d.getMonth()];
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function limpio(s) { return (s == null ? '' : String(s)).trim(); }

  /* ---------- guardar una actividad en su día ---------- */
  function apuntar(clave, act) {
    if (!clave) return;
    if (!porDia[clave]) porDia[clave] = [];
    porDia[clave].push(act);
    if (act.seccion) seccionesConDatos[act.seccion] = true;
    if (act.compe) hayCompeticiones = true;
    if (act.clase === 'cubo') hayCubo = true;
  }

  /* Reparte una actividad de varios días entre todos los días que ocupa. */
  function apuntarRango(claveIni, claveFin, act) {
    if (!claveIni) return;
    if (!claveFin || claveFin <= claveIni) { apuntar(claveIni, act); return; }
    var d = deClave(claveIni), fin = deClave(claveFin), tope = 0;
    while (d <= fin && tope < 21) {
      var copia = {}; for (var k in act) copia[k] = act[k];
      if (tope > 0) copia.hora = null;
      apuntar(claveDe(d), copia);
      d.setDate(d.getDate() + 1); tope++;
    }
  }

  /* ---------- carga de datos ---------- */
  async function cargar() {
    var sb = window.APOLANA_DB;
    if (!sb) return false;
    var ok = false;

    /* Entrenamientos publicados: la vista pública sesiones_agenda.
       (La tabla `sesiones` no es legible sin cuenta; la vista sí.) */
    try {
      var rs = await sb.from('sesiones_agenda')
        .select('fecha,hora,titulo,tipo,lugar,grupo,seccion,abierta_inscripcion,plazas,libres')
        .order('fecha', { ascending: true }).limit(2000);
      if (rs.error) { console.warn('[Apolana] agenda:', rs.error.message); }
      else if (rs.data) {
        ok = true;
        rs.data.forEach(function (s) {
          if (s.tipo === 'descanso') return;                 // día de descanso, no es una actividad
          var titulo = limpio(s.titulo) || limpio(s.grupo) || ETIQUETA_TIPO[s.tipo] || 'Entrenamiento';
          var sub = [limpio(s.lugar), limpio(s.grupo)].filter(Boolean).join(' · ');
          apuntar(s.fecha, {
            hora: horaCorta(s.hora), titulo: titulo, sub: sub,
            seccion: s.seccion || null, clase: 'sesion', compe: s.tipo === 'competicion'
          });
        });
      }
    } catch (e) { console.warn('[Apolana] agenda (excepción):', e); }

    /* Competiciones del club */
    try {
      var rc = await sb.from('competiciones')
        .select('nombre,sede,fecha_inicio,fecha_fin,ambito,coste,inscripcion_abierta,fecha_limite_interna')
        .order('fecha_inicio', { ascending: true }).limit(500);
      if (rc.error) { console.warn('[Apolana] competiciones:', rc.error.message); }
      else if (rc.data) {
        ok = true;
        rc.data.forEach(function (c) {
          if (!c.fecha_inicio) return;
          apuntarRango(c.fecha_inicio, c.fecha_fin, {
            hora: null, titulo: limpio(c.nombre) || 'Competición', sub: limpio(c.sede),
            seccion: c.ambito === 'natacion' ? 'natacion' : 'competicion',
            clase: 'competicion', compe: true
          });
          if (c.inscripcion_abierta && c.fecha_limite_interna) {
            var kl = claveDeMarca(c.fecha_limite_interna);
            if (kl) cierres[kl] = true;
          }
          if (c.fecha_inicio >= hoyKey) {
            proximos.push({ clave: c.fecha_inicio, titulo: limpio(c.nombre), sub: limpio(c.sede), abierta: !!c.inscripcion_abierta });
            if (!proxCompeticion) proxCompeticion = c;
          }
        });
      }
    } catch (e) { console.warn('[Apolana] competiciones (excepción):', e); }

    /* Eventos del club */
    try {
      var re = await sb.from('eventos')
        .select('titulo,tipo,fecha_inicio,fecha_fin,lugar,seccion,inscripcion_abierta')
        .order('fecha_inicio', { ascending: true }).limit(500);
      if (re.error) { console.warn('[Apolana] eventos:', re.error.message); }
      else if (re.data) {
        ok = true;
        re.data.forEach(function (v) {
          var ki = claveDeMarca(v.fecha_inicio);
          if (!ki) return;
          var kf = v.fecha_fin ? claveDeMarca(v.fecha_fin) : null;
          var sec = (v.seccion && v.seccion.length) ? v.seccion[0] : null;
          apuntarRango(ki, kf, {
            hora: horaDeMarca(v.fecha_inicio), titulo: limpio(v.titulo) || 'Evento del club',
            sub: limpio(v.lugar), seccion: sec, clase: 'evento', compe: v.tipo === 'competicion'
          });
          if (ki >= hoyKey) proximos.push({ clave: ki, titulo: limpio(v.titulo), sub: limpio(v.lugar), abierta: !!v.inscripcion_abierta });
        });
      }
    } catch (e) { console.warn('[Apolana] eventos (excepción):', e); }

    /* Clases de El Cubo */
    try {
      var rq = await sb.from('cubo_clases_ocupacion')
        .select('fecha,hora_inicio,titulo,activa,plazas,libres,monitor')
        .order('fecha', { ascending: true }).limit(1000);
      if (rq.error) { console.warn('[Apolana] El Cubo:', rq.error.message); }
      else if (rq.data) {
        ok = true;
        rq.data.forEach(function (c) {
          if (c.activa === false || !c.fecha) return;
          var sub = ['El Cubo', limpio(c.monitor)].filter(Boolean).join(' · ');
          apuntar(c.fecha, {
            hora: horaCorta(c.hora_inicio), titulo: limpio(c.titulo) || 'Clase de El Cubo',
            sub: sub, seccion: null, clase: 'cubo', compe: false
          });
        });
      }
    } catch (e) { console.warn('[Apolana] El Cubo (excepción):', e); }

    proximos.sort(function (a, b) { return a.clave < b.clave ? -1 : (a.clave > b.clave ? 1 : 0); });
    return ok;
  }

  /* ---------- filtros ---------- */
  function pasa(act) {
    if (filtro === 'todo') return true;
    if (filtro === 'competiciones') return !!act.compe;
    if (filtro === 'cubo') return act.clase === 'cubo';
    return act.seccion === filtro;
  }
  /* Una misma competición puede llegar por dos vías (sesión del grupo y evento
     del club). Se agrupan por título y se queda la versión más informativa. */
  function claveTitulo(t) {
    return String(t || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .split('·')[0].replace(/\s+/g, ' ').trim();
  }
  function sinRepetidos(lista) {
    var vistos = {}, salida = [];
    lista.forEach(function (a) {
      var k = claveTitulo(a.titulo);
      if (!k) { salida.push(a); return; }
      var ya = vistos[k];
      if (ya === undefined) { vistos[k] = salida.length; salida.push(a); return; }
      var previo = salida[ya];
      var mejor = (a.hora && !previo.hora) ||
                  (!!a.hora === !!previo.hora && (a.sub || '').length > (previo.sub || '').length);
      if (mejor) salida[ya] = a;
    });
    return salida;
  }

  function delDia(clave) {
    var lista = sinRepetidos((porDia[clave] || []).filter(pasa));
    return lista.slice().sort(function (a, b) {
      if (!a.hora && !b.hora) return 0;
      if (!a.hora) return 1;
      if (!b.hora) return -1;
      return a.hora < b.hora ? -1 : (a.hora > b.hora ? 1 : 0);
    });
  }

  function pintarFiltros() {
    var cont = document.getElementById('cal-filtros');
    if (!cont) return;
    var opciones = [{ id: 'todo', txt: 'Todo' }];
    ['escuela', 'running', 'competicion', 'natacion', 'montana', 'triatlon'].forEach(function (s) {
      if (seccionesConDatos[s]) opciones.push({ id: s, txt: ETIQUETA_SECCION[s] });
    });
    if (hayCompeticiones) opciones.push({ id: 'competiciones', txt: 'Competiciones' });
    if (hayCubo) opciones.push({ id: 'cubo', txt: 'El Cubo' });

    cont.innerHTML = opciones.map(function (o) {
      return '<button type="button" class="filtro" data-f="' + esc(o.id) + '" aria-pressed="' +
        (o.id === filtro ? 'true' : 'false') + '">' + esc(o.txt) + '</button>';
    }).join('');

    Array.prototype.forEach.call(cont.querySelectorAll('.filtro'), function (b) {
      b.addEventListener('click', function () {
        filtro = b.getAttribute('data-f');
        Array.prototype.forEach.call(cont.querySelectorAll('.filtro'), function (o) {
          o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
        });
        pintarMes(); pintarDia();
      });
    });
  }

  /* ---------- rejilla del mes ---------- */
  function pintarMes() {
    var cont = document.getElementById('cal-dias');
    var rot = document.getElementById('cal-mes');
    if (!cont || !mesVista) return;

    var y = mesVista.getFullYear(), m = mesVista.getMonth();
    if (rot) rot.textContent = MESES[m].charAt(0).toUpperCase() + MESES[m].slice(1) + ' ' + y;

    var primero = new Date(y, m, 1);
    var hueco = (primero.getDay() + 6) % 7;            // semana que empieza en lunes
    var dias = new Date(y, m + 1, 0).getDate();
    var celdas = Math.ceil((hueco + dias) / 7) * 7;

    var html = '';
    for (var i = 0; i < celdas; i++) {
      var d = new Date(y, m, 1 + i - hueco);
      var clave = claveDe(d);
      var fuera = d.getMonth() !== m;
      var lista = fuera ? [] : delDia(clave);
      var compe = lista.filter(function (a) { return a.compe; });

      var clases = ['dia'];
      if (fuera) clases.push('fuera');
      if (!fuera && compe.length) clases.push('compe');
      else if (!fuera && cierres[clave]) clases.push('cierre');
      if (clave === hoyKey) clases.push('hoy');
      if (!fuera && clave === diaSel) clases.push('sel');

      var texto = '';
      if (!fuera) {
        if (compe.length) texto = compe[0].titulo;
        else if (lista.length === 1) texto = lista[0].titulo;
        else if (lista.length > 1) texto = lista.length + ' actividades';
        else if (cierres[clave]) texto = 'Cierra inscripción';
      }

      html += '<button type="button" class="' + clases.join(' ') + '" data-d="' + clave + '"' +
        (fuera ? ' disabled' : '') + '>' +
        '<span class="num">' + d.getDate() + '</span>' +
        (texto ? '<span class="ev">' + esc(texto) + '</span>' : '') +
        '</button>';
    }
    cont.innerHTML = html;

    Array.prototype.forEach.call(cont.querySelectorAll('.dia:not(.fuera)'), function (b) {
      b.addEventListener('click', function () {
        diaSel = b.getAttribute('data-d');
        pintarMes(); pintarDia();
      });
    });
  }

  /* ---------- panel del día seleccionado ---------- */
  function pintarDia() {
    var cont = document.getElementById('dia-detalle');
    if (!cont || !diaSel) return;
    var lista = delDia(diaSel);
    var d = deClave(diaSel);
    var titulo = DIAS[d.getDay()] + ' ' + d.getDate();
    titulo = titulo.charAt(0).toUpperCase() + titulo.slice(1);
    var conteo = lista.length === 0 ? 'SIN ACTIVIDADES' : (lista.length === 1 ? '1 ACTIVIDAD' : lista.length + ' ACTIVIDADES');

    var html = '<div class="cabeza"><h2>' + esc(titulo) + '</h2><span class="conteo">' + conteo + '</span></div>';
    if (!lista.length) {
      html += '<p class="vacio">No hay nada programado para este día' +
        (filtro === 'todo' ? '' : ' en este filtro') + '.</p>';
    } else {
      html += lista.map(function (a) {
        return '<div class="actividad">' +
          '<span class="hora">' + esc(a.hora || '—') + '</span>' +
          '<div class="que"><span class="titulo-act">' + esc(a.titulo) + '</span>' +
          (a.sub ? '<span class="lugar">' + esc(a.sub) + '</span>' : '') +
          '</div></div>';
      }).join('');
    }
    cont.innerHTML = html;
  }

  /* ---------- próxima competición ---------- */
  function pintarProxima() {
    var cont = document.getElementById('proxima-competicion');
    if (!cont) return;
    if (!proxCompeticion) { cont.hidden = true; return; }
    var c = proxCompeticion;
    var datos = [fechaLarga(c.fecha_inicio), limpio(c.sede)].filter(Boolean).join(' · ');
    var coste = (c.coste != null && +c.coste > 0) ? ' · ' + (+c.coste).toFixed(2).replace('.', ',') + ' €' : '';
    var plazo = '';
    if (c.inscripcion_abierta && c.fecha_limite_interna) {
      var kl = claveDeMarca(c.fecha_limite_interna);
      if (kl) plazo = '<span class="datos">Plazo del club hasta el ' + esc(fechaLarga(kl)) + '</span>';
    }
    cont.hidden = false;
    cont.innerHTML =
      '<span class="etq">Próxima competición</span>' +
      '<h2>' + esc(limpio(c.nombre) || 'Competición') + '</h2>' +
      '<span class="datos">' + esc(datos + coste) + '</span>' + plazo +
      '<a class="btn btn--primario" href="../portal/calendario/">' +
      (c.inscripcion_abierta ? 'Entra para apuntarte' : 'Entra para ver los detalles') + '</a>';
  }

  /* ---------- próximos eventos y competiciones ---------- */
  function pintarProximos() {
    var cont = document.getElementById('proximos-eventos');
    if (!cont) return;
    var html = '<div class="cabeza"><h2>Próximos eventos</h2></div>';
    /* Una misma cita puede llegar por dos vías (competición y evento del club):
       se agrupan por día + título y se queda la versión más informativa. */
    var vistos = {}, unicos = [];
    proximos.forEach(function (e) {
      var k = e.clave + '|' + claveTitulo(e.titulo);
      var ya = vistos[k];
      if (ya === undefined) { vistos[k] = unicos.length; unicos.push(e); return; }
      var previo = unicos[ya];
      var mejor = (e.abierta && !previo.abierta) ||
                  (!!e.abierta === !!previo.abierta && (e.sub || '').length > (previo.sub || '').length);
      if (mejor) unicos[ya] = e;
    });
    var filas = unicos.slice(0, 6);
    if (!filas.length) {
      html += '<p class="vacio">Todavía no hay nada apuntado en el calendario del club.</p>';
    } else {
      html += filas.map(function (e) {
        return '<div class="actividad">' +
          '<span class="hora">' + esc(fechaCorta(e.clave)) + '</span>' +
          '<div class="que"><span class="titulo-act">' + esc(e.titulo) + '</span>' +
          (e.sub ? '<span class="lugar">' + esc(e.sub) + '</span>' : '') +
          (e.abierta ? '<span class="abierta">Inscripción abierta</span>' : '') +
          '</div></div>';
      }).join('');
    }
    cont.innerHTML = html;
  }

  /* ---------- sin datos: estado vacío digno ---------- */
  function sinDatos() {
    var cont = document.getElementById('dia-detalle');
    if (cont) {
      cont.innerHTML = '<div class="cabeza"><h2>Calendario</h2></div>' +
        '<p class="vacio">Ahora mismo no podemos cargar el calendario. Vuelve a intentarlo en un rato o escríbenos.</p>' +
        '<a class="enlace-flecha" href="../contacto/">Contactar con el club →</a>';
    }
    var pe = document.getElementById('proximos-eventos');
    if (pe) pe.innerHTML = '<div class="cabeza"><h2>Próximos eventos</h2></div>' +
      '<p class="vacio">No disponible en este momento.</p>';
  }

  /* ---------- arranque ---------- */
  function navegar(meses) {
    mesVista = new Date(mesVista.getFullYear(), mesVista.getMonth() + meses, 1);
    pintarMes();
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var ahora = new Date();
    hoyKey = claveDe(ahora);
    diaSel = hoyKey;
    mesVista = new Date(ahora.getFullYear(), ahora.getMonth(), 1);

    var prev = document.getElementById('mes-prev');
    var sig = document.getElementById('mes-sig');
    var hoyBtn = document.getElementById('mes-hoy');
    if (prev) prev.addEventListener('click', function () { navegar(-1); });
    if (sig) sig.addEventListener('click', function () { navegar(1); });
    if (hoyBtn) hoyBtn.addEventListener('click', function () {
      diaSel = hoyKey;
      mesVista = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      pintarMes(); pintarDia();
    });

    pintarMes();   // rejilla del mes real, aunque todavía no haya datos

    var ok = await cargar();
    if (!ok) { sinDatos(); return; }

    pintarFiltros();
    pintarMes();
    pintarDia();
    pintarProxima();
    pintarProximos();
  });
})();
</script>

</body>
</html>
