<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipación de natación · Club Atletismo Apolana</title>
<meta name="description" content="Pide la equipación de natación del club para esta temporada.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js?v=a02b231d" defer></script>
<script src="../../assets/js/db.js?v=4fd9379b" defer></script>
<style>
  body{ background:var(--crema,#FBF9F4); margin:0; font-family:var(--fuente-texto,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif); color:var(--navy,#2E4256); }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 16px 120px; }
  .cab{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .cab img{ height:44px; width:auto; }
  .cab b{ font-family:var(--fuente-titulo); font-weight:700; font-size:18px; }
  h1{ font-family:var(--fuente-titulo); font-size:clamp(24px,5.5vw,32px); margin:0 0 8px; line-height:1.1; }
  h2{ font-family:var(--fuente-titulo); font-size:20px; margin:26px 0 10px; }
  p{ line-height:1.6; color:#3f3f46; margin:0 0 12px; }
  .caja{ background:#fff; border:1px solid var(--linea,#EDE6D7); border-radius:18px; box-shadow:0 18px 40px -26px rgba(46,66,86,.5); padding:20px 18px; margin-bottom:14px; }
  .nad h3{ font-family:var(--fuente-titulo); font-size:19px; margin:0 0 2px; }
  .nad .sub{ font-size:13px; color:var(--texto-suave,#6E6656); margin-bottom:12px; }
  .chip-nuevo{ display:inline-block; background:#EDF5EE; color:#3F7A4C; border:1px solid #CBE0CE; border-radius:99px; font-size:12px; font-weight:700; padding:1px 8px; margin-left:6px; vertical-align:middle; }
  .art{ border-top:1px solid var(--linea,#EDE6D7); padding:12px 0 4px; }
  .art-t{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-weight:700; font-size:15px; margin-bottom:8px; }
  .art-t small{ font-weight:700; font-size:13px; color:#3F7A4C; white-space:nowrap; }
  .art-t small.pago{ color:#2F6FA8; }
  .opciones{ display:flex; flex-wrap:wrap; gap:6px; }
  .opciones button{ font:inherit; font-weight:700; font-size:14px; min-height:42px; min-width:46px; padding:6px 12px; border-radius:11px; border:1px solid var(--linea-borde,#D4CBB9); background:#fff; color:var(--navy,#2E4256); cursor:pointer; }
  .opciones button[aria-pressed="true"]{ background:var(--navy,#2E4256); border-color:var(--navy,#2E4256); color:#fff; }
  .opciones button.no{ font-weight:600; color:#6E6656; }
  .opciones button.no[aria-pressed="true"]{ background:#6E6656; border-color:#6E6656; color:#fff; }
  .falta{ border-radius:12px; outline:2px solid #E0A82E; outline-offset:4px; }
  .rejilla{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .prod{ background:#fff; border:1px solid var(--linea,#EDE6D7); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  .prod .foto{ aspect-ratio:4/5; background:#F1EADC; }
  .prod .foto img{ width:100%; height:100%; object-fit:cover; display:block; }
  .prod .cu{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .prod .nom{ font-weight:700; font-size:15px; line-height:1.25; }
  .prod .pre{ font-family:var(--fuente-titulo); font-size:18px; font-weight:700; }
  .prod select{ font:inherit; font-size:15px; min-height:42px; border:1px solid var(--linea-borde,#D4CBB9); border-radius:10px; padding:6px 8px; background:#fff; color:var(--navy,#2E4256); width:100%; }
  .prod .fila{ display:flex; gap:6px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; background:#2F6FA8; color:#fff; border:0; text-decoration:none; min-height:48px; padding:0 22px; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; font-family:inherit; }
  .btn.peq{ min-height:42px; font-size:14px; padding:0 14px; }
  .btn.claro{ background:#fff; color:var(--navy,#2E4256); border:1px solid var(--linea-borde,#D4CBB9); }
  .btn[disabled]{ opacity:.6; cursor:default; }
  .aviso{ background:#FDF5DF; border:1px solid #EBDCAE; color:#4A4335; border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.55; margin:0 0 12px; }
  .ok{ background:#EAF3E3; color:#2E6B3A; border-radius:12px; padding:14px 16px; line-height:1.6; margin-bottom:12px; }
  .mal{ background:#FBEAE8; color:#B3261E; border-radius:12px; padding:14px 16px; line-height:1.6; }
  .err{ color:#B3261E; font-size:14px; margin-top:10px; min-height:1.2em; }
  .fotos-eq{ display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:8px; margin:0 0 12px; }
  .fotos-eq figure{ margin:0; background:#fff; border:1px solid var(--linea,#EDE6D7); border-radius:12px; overflow:hidden; }
  .fotos-eq img{ display:block; width:100%; height:110px; object-fit:contain; background:#fff; }
  .fotos-eq figcaption{ font-size:12px; font-weight:700; text-align:center; padding:4px 0 6px; color:#6E6656; }
  .cesta-l{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid #F1EADC; font-size:14.5px; }
  .cesta-l .q{ color:#6E6656; font-size:13px; }
  .cesta-l button{ font:inherit; font-size:13px; background:none; border:0; color:#B3261E; text-decoration:underline; cursor:pointer; padding:0 0 0 8px; }
  .total{ display:flex; justify-content:space-between; font-family:var(--fuente-titulo); font-size:20px; font-weight:700; padding-top:10px; }
  .compromiso{ display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.5; margin:12px 0 4px; background:#F6F9FC; border:1px solid #D2E4F3; border-radius:12px; padding:10px 12px; }
  .compromiso input{ width:20px; height:20px; margin-top:2px; flex:none; }
  .barra{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--linea,#EDE6D7); box-shadow:0 -10px 30px -20px rgba(46,66,86,.5); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .barra .in{ max-width:720px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .barra .t{ font-size:13px; color:#6E6656; line-height:1.3; }
  .barra .t b{ display:block; font-family:var(--fuente-titulo); font-size:20px; color:var(--navy,#2E4256); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cab">
      <img src="../../assets/img/favicon-escudo.png" alt="Escudo Apolana">
      <b>Club Atletismo Apolana · Natación</b>
    </div>
    <div id="app"><div class="caja"><p style="margin:0">Cargando…</p></div></div>
  </div>
  <div class="barra" id="barra" hidden></div>
<script>
/* /natacion/equipacion/?t=… · pedido de equipación de natación 2026/27, un
   enlace por familia (mig 436). Camiseta y gorro gratis; sudadera gratis a los
   nuevos y de pago a las renovaciones; bañadores y extras de pago. Se paga al
   llegar la ropa. Los precios los pone la base; aquí solo se enseñan. */
(function () {
  var app = document.getElementById('app'), barra = document.getElementById('barra');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function eur(n){ var v=Math.round(Number(n||0)*100)/100; return v.toLocaleString('es-ES',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €'; }
  var SB = 'https://icaxokjsvhlreuwpyxeb.supabase.co', KEY = 'sb_publishable_ABwJ5L9azzN30mqKg6igxA_zq6pB3MH';
  function rpc(n, cuerpo){
    return fetch(SB + '/rest/v1/rpc/' + n, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) })
      .then(function (r) { return r.json().catch(function(){ return null; }).then(function (d) { return { ok: r.ok, d: d }; }); });
  }
  function img(v){ return /^https?:/.test(v||'') ? v : '../../assets/img/' + v; }
  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var D = null, N = {}, EXTRAS = [], compromiso = false, editando = false, intento = false;

  function nombreCorto(n){ return String(n||'').split(' ')[0]; }
  function desdeLineas(){
    N = {}; EXTRAS = [];
    D.nadadores.forEach(function (n) { N[n.id] = { camiseta: D.respondido ? 'no' : null, gorro: D.respondido ? false : true, sudadera: (D.respondido || !n.nuevo) ? 'no' : null }; });
    D.lineas.forEach(function (l) {
      var x = N[l.nadador_id];
      if (l.articulo === 'camiseta' && x) x.camiseta = l.talla;
      else if (l.articulo === 'gorro' && x) x.gorro = true;
      else if (l.articulo === 'sudadera' && x) x.sudadera = l.talla;
      else if (l.articulo === 'producto') EXTRAS.push({ producto_id: l.producto_id, talla: l.talla || '', cantidad: l.cantidad, nadador_id: l.nadador_id || '' });
    });
    compromiso = !!D.compromiso;
  }
  function prod(id){ return (D.productos || []).filter(function (p) { return p.id === id; })[0]; }
  function precioSudadera(n){ return n.nuevo ? 0 : Number(D.precio_sudadera || 35); }
  function cesta(){
    var L = [];
    D.nadadores.forEach(function (n) {
      var x = N[n.id]; if (!x) return;
      if (x.camiseta && x.camiseta !== 'no') L.push({ t: 'Camiseta oficial · talla ' + x.camiseta, q: nombreCorto(n.nombre), p: 0 });
      if (x.gorro) L.push({ t: 'Gorro de natación', q: nombreCorto(n.nombre), p: 0 });
      if (x.sudadera && x.sudadera !== 'no') L.push({ t: 'Chaqueta · talla ' + x.sudadera, q: nombreCorto(n.nombre), p: precioSudadera(n) });
    });
    EXTRAS.forEach(function (e, i) {
      var p = prod(e.producto_id); if (!p) return;
      var para = D.nadadores.filter(function (n) { return n.id === e.nadador_id; })[0];
      L.push({ t: e.cantidad + ' × ' + p.nombre + (e.talla && e.talla !== 'ÚNICA' ? ' · talla ' + e.talla : ''), q: para ? nombreCorto(para.nombre) : '', p: Number(p.precio) * e.cantidad, i: i, ban: p.banador });
    });
    return L;
  }
  function total(){ return cesta().reduce(function (a, l) { return a + l.p; }, 0); }
  function hayBanador(){ return EXTRAS.some(function (e) { var p = prod(e.producto_id); return p && p.banador; }); }
  function faltan(){
    var f = [];
    D.nadadores.forEach(function (n) { var x = N[n.id]; if (!x.camiseta) f.push(n.id + ':camiseta'); if (n.nuevo && !x.sudadera) f.push(n.id + ':sudadera'); });
    return f;
  }

  // ---------- pintar ----------
  function botones(clave, nid, valores, actual, textoNo){
    return '<div class="opciones" data-campo="' + clave + '" data-n="' + nid + '">' +
      valores.map(function (v) { return '<button type="button" data-v="' + esc(v) + '" aria-pressed="' + (actual === v ? 'true' : 'false') + '">' + esc(v) + '</button>'; }).join('') +
      (textoNo ? '<button type="button" class="no" data-v="no" aria-pressed="' + (actual === 'no' ? 'true' : 'false') + '">' + esc(textoNo) + '</button>' : '') + '</div>';
  }
  function tarjetaNadador(n){
    var x = N[n.id], f = intento ? faltan() : [];
    var ps = precioSudadera(n);
    return '<div class="caja nad"><h3>' + esc(n.nombre) + (n.nuevo ? '<span class="chip-nuevo">Nuevo/a este año</span>' : '') + '</h3>' +
      '<div class="sub">' + esc(n.tipo === 'Máster' ? 'Máster' : 'Escuela de natación') + '</div>' +
      '<div class="art' + (f.indexOf(n.id + ':camiseta') >= 0 ? ' falta' : '') + '"><div class="art-t">Camiseta oficial del club <small>Gratis</small></div>' +
        botones('camiseta', n.id, D.tallas, x.camiseta, 'No la necesito') + '</div>' +
      '<div class="art"><div class="art-t">Gorro de natación <small>Gratis</small></div>' +
        '<div class="opciones" data-campo="gorro" data-n="' + n.id + '"><button type="button" data-v="si" aria-pressed="' + (x.gorro ? 'true' : 'false') + '">Sí, lo necesito</button>' +
        '<button type="button" class="no" data-v="no" aria-pressed="' + (!x.gorro ? 'true' : 'false') + '">No</button></div></div>' +
      '<div class="art' + (f.indexOf(n.id + ':sudadera') >= 0 ? ' falta' : '') + '"><div class="art-t">Chaqueta del club (con capucha) ' +
        (ps === 0 ? '<small>Gratis (te incorporas este año)</small>' : '<small class="pago">' + eur(ps) + ' · opcional</small>') + '</div>' +
        botones('sudadera', n.id, D.tallas, x.sudadera, ps === 0 ? 'No la necesito' : 'No, gracias') + '</div>' +
    '</div>';
  }
  function tarjetaProducto(p){
    var tallas = (p.tallas || []).filter(function (t) { return t; });
    var unica = !tallas.length || (tallas.length === 1 && tallas[0] === 'ÚNICA');
    return '<div class="prod" data-p="' + p.id + '"><div class="foto">' + (p.imagen ? '<img src="' + esc(img(p.imagen)) + '" alt="' + esc(p.nombre) + '" loading="lazy">' : '') + '</div>' +
      '<div class="cu"><div class="nom">' + esc(p.nombre) + '</div><div class="pre">' + eur(p.precio) + '</div>' +
      (unica ? '' : '<select data-talla aria-label="Talla"><option value="">Talla…</option>' + tallas.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select>') +
      (D.nadadores.length > 1 ? '<select data-para aria-label="Para quién">' + D.nadadores.map(function (n) { return '<option value="' + n.id + '">Para ' + esc(nombreCorto(n.nombre)) + '</option>'; }).join('') + '</select>' : '') +
      '<div class="fila"><select data-cant aria-label="Unidades" style="width:80px">' + [1,2,3,4,5].map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select>' +
      '<button type="button" class="btn peq" data-anadir style="flex:1">Añadir</button></div></div></div>';
  }
  function cestaHtml(){
    var L = cesta();
    return '<div class="caja" id="cesta"><h2 style="margin-top:0">Tu cesta</h2>' +
      (L.length ? L.map(function (l) {
        return '<div class="cesta-l"><span>' + esc(l.t) + (l.q ? ' <span class="q">· ' + esc(l.q) + '</span>' : '') +
          (l.i != null ? '<button type="button" data-quitar="' + l.i + '">quitar</button>' : '') + '</span><b>' + (l.p ? eur(l.p) : 'Gratis') + '</b></div>';
      }).join('') : '<p style="margin:0">Todavía no has elegido nada.</p>') +
      '<div class="total"><span>A pagar cuando llegue</span><span>' + eur(total()) + '</span></div>' +
      (hayBanador() ? '<label class="compromiso"><input type="checkbox" id="compromiso"' + (compromiso ? ' checked' : '') + '><span><b>Me comprometo a la compra</b> de los bañadores que encargo: se hacen por encargo para el club y no se pueden devolver.</span></label>' : '') +
      '<p style="font-size:13px;color:#6E6656;margin:10px 0 0">No pagas nada ahora. Cuando llegue la ropa te avisamos y lo pagas (con tarjeta desde el enlace que te mandamos, o en la oficina) antes de recogerla.</p></div>';
  }
  function pintarBarra(){
    if (!D || !(editando || !D.respondido) || ['pendiente','pedido'].indexOf(D.estado) < 0) { barra.hidden = true; return; }
    barra.hidden = false;
    barra.innerHTML = '<div class="in"><div class="t">A pagar cuando llegue<b>' + eur(total()) + '</b></div>' +
      '<button class="btn" id="enviar" type="button">' + (D.respondido ? 'Guardar cambios' : 'Enviar mi pedido') + '</button></div>';
    document.getElementById('enviar').addEventListener('click', enviar);
  }
  function formulario(){
    var ban = (D.productos || []).filter(function (p) { return p.banador; }), otros = (D.productos || []).filter(function (p) { return !p.banador; });
    app.innerHTML =
      '<h1>Equipación de natación 2026/27</h1>' +
      '<p>' + (D.contacto ? 'Hola, ' + esc(D.contacto) + '. ' : '') + 'Elige la talla de lo que os corresponde y, si queréis, añadid bañadores o algo más de la tienda del club. ' +
        '<b>La camiseta y el gorro son gratis para todos</b>; la chaqueta, gratis para quien se incorpora este año (al resto le sale a ' + eur(D.precio_sudadera || 35) + ' si la quiere).</p>' +
      '<div class="fotos-eq"><figure><img src="../../assets/img/natacion-camiseta.jpg" alt="Camiseta del club de natación"><figcaption>Camiseta</figcaption></figure>' +
        '<figure><img src="../../assets/img/tienda-chaqueta-chandal.jpg" alt="Chaqueta del club"><figcaption>Chaqueta</figcaption></figure>' +
        '<figure><img src="../../assets/img/natacion-gorro.jpg" alt="Gorro de natación del club"><figcaption>Gorro</figcaption></figure></div>' +
      '<p class="aviso"><b>Rellénalo antes del 2 de noviembre</b>: ese día hacemos el pedido. Si necesitáis probar tallas, las tenéis en la piscina de Vía Parque cuando vengáis a nadar.</p>' +
      D.nadadores.map(tarjetaNadador).join('') +
      (ban.length ? '<h2>Bañadores del club</h2><p class="aviso">Hay un <b>muestrario de bañadores en la piscina de Vía Parque</b> para probar la talla. Se fabrican por encargo: una vez pedidos no se pueden devolver.</p><div class="rejilla">' + ban.map(tarjetaProducto).join('') + '</div>' : '') +
      (otros.length ? '<h2>Algo más de la tienda del club</h2><div class="rejilla">' + otros.map(tarjetaProducto).join('') + '</div>' : '') +
      '<div style="height:16px"></div>' + cestaHtml() + '<p class="err" id="err"></p>';
    pintarBarra();
  }
  function resumen(){
    var L = cesta();
    var cab = '';
    if (D.pagado) cab = '<div class="ok"><b>✓ Pagado.</b> Te avisaremos de cuándo y dónde recogerlo.</div>';
    else if (D.estado === 'llegado' && D.pago_enlace) cab = '<div class="ok"><b>¡Ya ha llegado tu pedido!</b> Págalo antes de recogerlo:<br><a class="btn" style="margin-top:10px" href="' + esc(D.pago_enlace) + '">Pagar ' + eur(D.total) + ' con tarjeta →</a></div>';
    else if (D.estado === 'llegado') cab = '<div class="ok"><b>¡Ya ha llegado tu pedido!</b> Te avisaremos de cuándo recogerlo.</div>';
    else if (D.estado === 'entregado') cab = '<div class="ok"><b>✓ Entregado.</b> ¡Gracias!</div>';
    else cab = '<div class="ok"><b>¡Pedido recibido!</b> Te avisaremos cuando llegue la ropa para que lo pagues y lo recojas.</div>';
    app.innerHTML = '<h1>Equipación de natación 2026/27</h1>' + cab +
      '<div class="caja"><h2 style="margin-top:0">Tu pedido</h2>' + (L.length ? L.map(function (l) {
        return '<div class="cesta-l"><span>' + esc(l.t) + (l.q ? ' <span class="q">· ' + esc(l.q) + '</span>' : '') + '</span><b>' + (l.p ? eur(l.p) : 'Gratis') + '</b></div>'; }).join('') : '<p style="margin:0">No has pedido nada.</p>') +
      '<div class="total"><span>Total</span><span>' + eur(D.total) + '</span></div></div>' +
      (['pendiente','pedido'].indexOf(D.estado) >= 0 ? '<button class="btn claro" id="cambiar" type="button">Cambiar mi pedido</button><p style="font-size:13px;color:#6E6656;margin-top:8px">Puedes cambiarlo hasta que hagamos el pedido al proveedor.</p>' : '');
    var c = document.getElementById('cambiar'); if (c) c.addEventListener('click', function () { editando = true; formulario(); });
    pintarBarra();
  }
  function pintar(){ if (!D) return; if (D.respondido && !editando) resumen(); else formulario(); }

  // ---------- eventos ----------
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.opciones button');
    if (b) {
      var g = b.parentNode, campo = g.getAttribute('data-campo'), nid = g.getAttribute('data-n'), v = b.getAttribute('data-v');
      if (campo === 'gorro') N[nid].gorro = v === 'si'; else N[nid][campo] = v;
      formularioConScroll(); return;
    }
    var a = ev.target.closest && ev.target.closest('[data-anadir]');
    if (a) {
      var card = a.closest('.prod'), p = prod(card.getAttribute('data-p'));
      var ts = card.querySelector('[data-talla]'), pa = card.querySelector('[data-para]'), ca = card.querySelector('[data-cant]');
      var talla = ts ? ts.value : ((p.tallas || [])[0] || '');
      if (ts && !talla) { ts.focus(); ts.style.outline = '2px solid #E0A82E'; return; }
      EXTRAS.push({ producto_id: p.id, talla: talla, cantidad: Number(ca.value) || 1, nadador_id: pa ? pa.value : (D.nadadores[0] || {}).id });
      a.textContent = 'Añadido ✓'; setTimeout(function () { formularioConScroll(); }, 500); return;
    }
    var q = ev.target.closest && ev.target.closest('[data-quitar]');
    if (q) { EXTRAS.splice(Number(q.getAttribute('data-quitar')), 1); formularioConScroll(); return; }
  });
  app.addEventListener('change', function (ev) { if (ev.target.id === 'compromiso') compromiso = ev.target.checked; });
  function formularioConScroll(){ var y = window.scrollY; formulario(); window.scrollTo(0, y); }

  function enviar(){
    var b = document.getElementById('enviar'), err = document.getElementById('err');
    intento = true;
