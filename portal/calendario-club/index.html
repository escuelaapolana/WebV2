<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario del club · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<link rel="stylesheet" href="../../assets/css/panel-piezas.css">
<script>window.APOLANA_BASE="../../";
  window.APOLANA_MUNDO = { world:(new URLSearchParams(location.search).get('world')||'general'), screen:'calendario', contentSel:'#cc' };</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/mundos.js" defer></script>
<script src="../../assets/js/panel-piezas.js" defer></script>
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace); }
  body { background:var(--crema,#FBF9F4); }
  .cc-wrap { max-width:880px; margin:0 auto; padding:clamp(16px,4vw,26px) clamp(12px,4vw,26px) 48px; }
  .cc-h1 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-.01em;
           font-size:clamp(23px,5.2vw,32px); line-height:1.02; color:var(--navy,#26374B); margin:2px 0 2px; }
  .cc-sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 14px; }
  .cc-chips { display:flex; gap:7px; flex-wrap:wrap; margin:0 0 14px; }
  .cc-chip { min-height:36px; padding:0 13px; border-radius:11px; border:1px solid var(--linea-marcada,#E4DCCB);
             background:#fff; font:inherit; font-weight:600; font-size:13.5px; color:var(--texto,#333); cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .cc-chip .pt { width:9px; height:9px; border-radius:50%; flex:none; }
  .cc-chip.on { color:#fff; border-color:transparent; }
  .cc-nav { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .cc-nav b { font-family:var(--ap-titulo); font-size:18px; color:var(--navy,#26374B); text-transform:capitalize; min-width:150px; }
  .cc-nav button { border:1px solid var(--linea-marcada,#E4DCCB); background:#fff; border-radius:10px; min-height:38px; min-width:38px; padding:0 12px; font:inherit; font-weight:600; color:var(--navy); cursor:pointer; }
  .cc-nav .hoy { margin-left:auto; }
  .cc-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cc-dow { text-align:center; font-size:11.5px; font-weight:700; color:var(--texto-suave,#8A816E); text-transform:uppercase; padding:2px 0; }
  .cc-cel { background:#fff; border:1px solid var(--linea,#EDE6D7); border-radius:10px; min-height:62px; padding:5px 5px 6px; cursor:pointer; display:flex; flex-direction:column; gap:3px; overflow:hidden; }
  .cc-cel.otro { opacity:.42; }
  .cc-cel.hoy { border-color:#2F6FA8; box-shadow:0 0 0 1px #2F6FA8 inset; }
  .cc-cel.sel { box-shadow:0 0 0 2px #26374B inset; border-color:#26374B; }
  .cc-cel .dnum { font-size:12.5px; font-weight:700; color:var(--navy,#26374B); line-height:1; }
  .cc-dots { display:flex; flex-wrap:wrap; gap:3px; margin-top:1px; }
  .cc-dot { width:7px; height:7px; border-radius:50%; }
  .cc-dot.canc { outline:1.5px solid #B23B3B; outline-offset:-1px; background:#fff !important; }
  .cc-cel .cnt { margin-top:auto; font-size:10.5px; color:var(--texto-suave,#8A816E); font-weight:600; }
  .cc-cel .fest { font-size:10px; color:#B23B3B; font-weight:700; line-height:1.1; }
  .cc-det { margin-top:16px; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; padding:14px 15px; }
  .cc-det h2 { font-family:var(--ap-titulo); font-size:17px; color:var(--navy); margin:0 0 3px; text-transform:capitalize; }
  .cc-det .vacio { color:var(--texto-suave,#8A816E); font-size:14px; margin:6px 0; }
  .cc-ses { display:flex; align-items:center; gap:10px; padding:9px 2px; border-top:1px solid var(--linea,#F0EADD); }
  .cc-ses:first-of-type { border-top:none; }
  .cc-ses .hr { font-family:var(--dato); font-size:14px; font-weight:600; color:var(--navy); min-width:46px; }
  .cc-ses .pt { width:10px; height:10px; border-radius:50%; flex:none; }
  .cc-ses .nm { flex:1 1 auto; font-size:14px; color:var(--texto,#333); min-width:0; }
  .cc-ses .nm small { color:var(--texto-suave,#8A816E); }
  .cc-ses .ap { font-family:var(--dato); font-size:13px; color:var(--texto-suave,#6E6656); font-weight:600; white-space:nowrap; }
  .cc-ses.canc .nm, .cc-ses.canc .hr { text-decoration:line-through; color:#A58B86; }
  .cc-ses.cero { opacity:.5; }
  .cc-ses .cx { font-size:11px; color:#B23B3B; font-weight:700; }
  .cc-acc { display:flex; gap:9px; flex-wrap:wrap; margin-top:13px; padding-top:12px; border-top:1px solid var(--linea,#EDE6D7); }
  .cc-btn { border:none; border-radius:10px; min-height:40px; padding:0 15px; font:inherit; font-weight:600; font-size:14px; cursor:pointer; }
  .cc-btn.canc { border:1px solid #D9B38C; background:#fff; color:#9A5B23; }
  .cc-btn.react { background:#26374B; color:#fff; }
  .cc-vacio { color:var(--texto-suave,#8A816E); text-align:center; padding:34px 10px; }
  .cc-toast { position:fixed; left:50%; bottom:26px; transform:translate(-50%,10px); background:#26374B; color:#fff; padding:11px 18px; border-radius:11px; font-size:14px; opacity:0; transition:.22s; z-index:70; }
  .cc-toast.ver { opacity:1; transform:translate(-50%,0); }
  .cc-toast.err { background:#B23B3B; }
  @media (max-width:560px){ .cc-cel { min-height:54px; } .cc-cel .cnt { display:none; } }
</style>
</head>
<body>
  <div class="cc-wrap" id="cc"></div>
<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cc');

  var SEC = [
    { k:'natacion',        n:'Natación',          c:'#2F6FA8' },
    { k:'escuela-natacion',n:'Escuela natación',  c:'#2E8C86' },
    { k:'cubo',            n:'El Cubo',           c:'#C27A3E' },
    { k:'escuela',         n:'Escuela atletismo', c:'#3E8E5A' },
    { k:'competicion',     n:'Competición',       c:'#7A4FB0' },
    { k:'running',         n:'Running',           c:'#B06A2C' }
  ];
  var COL = {}; SEC.forEach(function(s){ COL[s.k]=s.c; });
  var NOM = {}; SEC.forEach(function(s){ NOM[s.k]=s.n; });
  var DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var DOW  = ['L','M','X','J','V','S','D'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function hoyISO(){ return iso(new Date()); }
  function fechaLarga(s){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); var wd=(d.getDay()+6)%7; return DIAS[wd]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  function toast(m,t){ var e=document.createElement('div'); e.className='cc-toast'+(t==='err'?' err':''); e.textContent=m; document.body.appendChild(e);
    requestAnimationFrame(function(){ e.classList.add('ver'); }); setTimeout(function(){ e.classList.remove('ver'); setTimeout(function(){ e.remove(); },240); },2200); }

  // --- Quién entra: admin/staff ven todo; responsable solo sus secciones ---
  var esAdmin=false, esStaff=false, misSec=[];
  try { var ra=await sb.rpc('es_admin'); esAdmin = !!(ra&&!ra.error&&ra.data===true); } catch(e){}
  try { var rs=await sb.rpc('es_staff'); esStaff = !!(rs&&!rs.error&&rs.data===true); } catch(e){}
  try { var rm=await sb.rpc('mis_secciones_responsable'); misSec = (rm&&!rm.error&&Array.isArray(rm.data))?rm.data:[]; } catch(e){}
  var verTodo = esAdmin || esStaff;

  var MIS = verTodo ? SEC.slice() : SEC.filter(function(s){ return misSec.indexOf(s.k)!==-1; });
  if (!verTodo && !MIS.length){
    wrap.innerHTML = '<h1 class="cc-h1">Calendario del club</h1><div class="cc-vacio">No tienes acceso al calendario. Si crees que deberías, pídeselo al club.</div>';
    return;
  }

  // Estado
  var hoy = new Date();
  var mes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  var secFiltro = verTodo ? null : MIS[0].k;   // null = todo el club
  var DATA = {};      // fechaISO -> [sesiones]
  var diaSel = hoyISO();

  function rangoMes(){
    var primero = new Date(mes.getFullYear(), mes.getMonth(), 1);
    var off = (primero.getDay()+6)%7;                 // lunes=0
    var ini = new Date(primero); ini.setDate(1-off);
    var fin = new Date(ini); fin.setDate(ini.getDate()+41);
    return { ini:ini, fin:fin };
  }

  async function cargar(){
    var r = rangoMes();
    DATA = {};
    var q = await sb.rpc('calendario_club', { p_desde: iso(r.ini), p_hasta: iso(r.fin), p_seccion: secFiltro });
    var arr = (q && !q.error && Array.isArray(q.data)) ? q.data : [];
    arr.forEach(function(s){ (DATA[s.fecha]=DATA[s.fecha]||[]).push(s); });
  }

  function diaCancelado(fISO){
    var l = DATA[fISO]||[]; return l.length>0 && l.every(function(s){ return s.cancelado; });
  }

  function pintar(){
    var r = rangoMes();
    // Chips de sección
    var chips = '';
    if (verTodo) chips += '<button class="cc-chip'+(secFiltro===null?' on':'')+'" data-sec="" '+(secFiltro===null?'style="background:#26374B"':'')+'>Todo el club</button>';
    chips += MIS.map(function(s){
      var on = secFiltro===s.k;
      return '<button class="cc-chip'+(on?' on':'')+'" data-sec="'+s.k+'"'+(on?' style="background:'+s.c+'"':'')+'>'+
        '<span class="pt" style="background:'+s.c+'"></span>'+esc(s.n)+'</button>';
    }).join('');

    // Rejilla del mes
    var cel = '';
    for (var i=0;i<42;i++){
      var d = new Date(r.ini); d.setDate(r.ini.getDate()+i);
      var fISO = iso(d);
      var otro = d.getMonth()!==mes.getMonth();
      var ses = DATA[fISO]||[];
      var canc = diaCancelado(fISO);
      var dots = ses.slice(0,8).map(function(s){ return '<span class="cc-dot'+(s.cancelado?' canc':'')+'" style="background:'+(COL[s.seccion]||'#9aa')+'"></span>'; }).join('');
      cel += '<div class="cc-cel'+(otro?' otro':'')+(fISO===hoyISO()?' hoy':'')+(fISO===diaSel?' sel':'')+'" data-dia="'+fISO+'">'+
        '<span class="dnum">'+d.getDate()+'</span>'+
        (ses.length?'<div class="cc-dots">'+dots+'</div>':'')+
        (canc?'<span class="fest">cancelado</span>':(ses.length?'<span class="cnt">'+ses.length+' ses.</span>':''))+
      '</div>';
    }

    // Detalle del día seleccionado
    var det = '';
    if (diaSel){
      var lst = (DATA[diaSel]||[]).slice().sort(function(a,b){ return String(a.hora).localeCompare(String(b.hora)); });
      var filas = lst.length ? lst.map(function(s){
        return '<div class="cc-ses'+(s.cancelado?' canc':'')+((!s.cancelado && (s.apuntados===0||s.apuntados==null))?' cero':'')+'">'+
          '<span class="hr">'+esc(String(s.hora||'').slice(0,5))+'</span>'+
          '<span class="pt" style="background:'+(COL[s.seccion]||'#9aa')+'"></span>'+
          '<span class="nm">'+esc(s.grupo)+' <small>· '+esc(NOM[s.seccion]||s.seccion||'')+'</small>'+(s.cancelado&&s.motivo?' <span class="cx">· '+esc(s.motivo)+'</span>':'')+'</span>'+
          '<span class="ap">'+(s.apuntados!=null?s.apuntados+' 👤':'')+'</span>'+
        '</div>';
      }).join('') : '<p class="vacio">No hay sesiones ese día'+(secFiltro?' en '+esc(NOM[secFiltro]):'')+'.</p>';

      // Botón cancelar/reactivar (según filtro)
      var ambito = secFiltro ? NOM[secFiltro] : 'todo el club';
      var puedeAmbito = verTodo || (secFiltro && MIS.some(function(m){return m.k===secFiltro;}));
      var yaCanc = diaCancelado(diaSel);
      var acc = '';
      if (puedeAmbito && (lst.length || secFiltro)){
        acc = '<div class="cc-acc">'+
          (yaCanc
            ? '<button class="cc-btn react" id="cc-react">Reactivar este día ('+esc(ambito)+')</button>'
            : '<button class="cc-btn canc" id="cc-canc">Cancelar este día ('+esc(ambito)+')</button>')+
        '</div>';
      }
      det = '<div class="cc-det"><h2>'+esc(fechaLarga(diaSel))+'</h2>'+filas+acc+'</div>';
    }

    wrap.innerHTML =
      '<h1 class="cc-h1">Calendario del club</h1>'+
      '<p class="cc-sub">'+(verTodo?'Todas las secciones. Toca un día para ver sus sesiones y cancelarlo si es festivo.':'Tu sección. Toca un día para ver las sesiones y cancelarlo si cierra.')+'</p>'+
      '<div class="cc-chips">'+chips+'</div>'+
      '<div class="cc-nav"><button data-mes="-1">‹</button><b>'+MESES[mes.getMonth()]+' '+mes.getFullYear()+'</b><button data-mes="1">›</button><button class="hoy" data-hoy="1">Hoy</button></div>'+
      '<div class="cc-grid">'+DOW.map(function(x){return '<div class="cc-dow">'+x+'</div>';}).join('')+cel+'</div>'+
      det;
  }

  async function recargar(){ await cargar(); pintar(); }

  // --- Interacción ---
  wrap.addEventListener('click', async function(ev){
    var t = ev.target;
    var ch = t.closest ? t.closest('[data-sec]') : null;
    if (ch){ secFiltro = ch.getAttribute('data-sec') || null; await recargar(); return; }
    var nm = t.closest ? t.closest('[data-mes]') : null;
    if (nm){ mes = new Date(mes.getFullYear(), mes.getMonth()+(+nm.getAttribute('data-mes')), 1); await recargar(); return; }
    if (t.closest && t.closest('[data-hoy]')){ mes = new Date(hoy.getFullYear(), hoy.getMonth(), 1); diaSel = hoyISO(); await recargar(); return; }
    var cd = t.closest ? t.closest('[data-dia]') : null;
    if (cd){ diaSel = cd.getAttribute('data-dia'); pintar(); return; }

    if (t.closest && t.closest('#cc-canc')){
      var motivo = window.prompt('Motivo de la cancelación (festivo, cierre, puente…):', 'Festivo');
      if (motivo === null) return;
      var rc = await sb.rpc('calendario_cancelar_dia', { p_fecha: diaSel, p_seccion: secFiltro, p_motivo: motivo || 'Festivo', p_fecha_fin: null });
      if (rc.error || (rc.data && rc.data.ok===false)){ toast((rc.data&&rc.data.msg)||'No se pudo cancelar','err'); return; }
      toast('Día cancelado'); await recargar(); return;
    }
    if (t.closest && t.closest('#cc-react')){
      var rr = await sb.rpc('calendario_reactivar_dia', { p_fecha: diaSel, p_seccion: secFiltro });
      if (rr.error || (rr.data && rr.data.ok===false)){ toast((rr.data&&rr.data.msg)||'No se pudo reactivar','err'); return; }
      toast('Día reactivado'); await recargar(); return;
    }
  });

  await recargar();
});
</script>
</body>
</html>
