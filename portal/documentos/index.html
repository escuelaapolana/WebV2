<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentos · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .doc-wrap { max-width: 900px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }

  /* Cabecera de pantalla (kit 30h): migas a 14 px, título a 28 px, sobre crema. */
  .migas { display:inline-flex; align-items:center; min-height:44px; margin-bottom:4px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:14px; padding:0 2px 0 0; }
  .doc-wrap h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; line-height:1.05; color: var(--navy); margin: 0 0 4px; }
  .doc-wrap .sub { font-size:14px; color: var(--texto-suave); }

  .tarjeta { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; padding: clamp(14px,3vw,20px) 0 2px; margin-top:18px; box-shadow: 0 4px 10px rgba(30,45,65,.10), 0 16px 32px -8px rgba(30,45,65,.34); }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 clamp(16px,3vw,20px) 6px; }
  .tarjeta .estado-caja { padding: 0 clamp(16px,3vw,20px) clamp(14px,3vw,18px); }

  /* Lista de descarga: un contenedor con separadores y la fila entera pulsable. */
  .doc { display:flex; align-items:center; gap:14px; min-height:48px; box-sizing:border-box;
         padding:12px clamp(16px,3vw,20px); border-top:1px solid var(--linea);
         text-decoration:none; color: var(--navy); }
  .doc:hover { background: var(--crema); }
  .doc .info { flex:1; min-width:0; }
  .doc .tit { display:block; font-size:15px; font-weight:600; color: var(--navy); }
  .doc .desc { display:block; font-size:14px; line-height:1.45; color: var(--texto-suave); margin-top:2px; }
  .doc .meta { display:block; font-size:13px; color: var(--texto-suave); margin-top:2px; }
  .doc .baja { flex:0 0 auto; display:flex; color: #6E6656; }
  .etq { font-size:13px; background: var(--crema-media); color: var(--texto-suave);
         padding:2px 8px; border-radius:999px; margin-left:6px; font-weight:400; white-space:nowrap; }
  /* El azul se reserva a lo que se pulsa: una etiqueta va en navy (carácter 31a). */
  .etq.socios { background:#fff; border:1px solid var(--linea-borde); color: var(--navy); }

  /* --- Recursos del grupo: una tarjeta por recurso (maqueta de recursos) ---
     El contenedor deja de ser una tarjeta y pasa a ser un envoltorio
     transparente; cada recurso es su propia tarjeta blanca con profundidad. */
  .rec-grupo { background:transparent !important; border:0 !important; box-shadow:none !important; padding:0 !important; margin-top:18px; }
  .rec-grupo h2 { color: var(--azul-oscuro); margin: 0 2px 8px; }
  .rec-filtros { display:flex; flex-wrap:wrap; gap:8px; padding: 0 2px 12px; }
  .rec-chip {
    border:1px solid var(--linea-borde); background:#fff; color: var(--navy);
    border-radius:999px; padding:8px 14px; min-height:38px; font: inherit; font-size:14px; cursor:pointer;
  }
  .rec-chip:hover { border-color: var(--azul-filete, #3B85C0); }
  .rec-chip.activo { background: var(--navy); border-color: var(--navy); color:#fff; font-weight:600; }
  .rec-cat[hidden] { display:none; }
  .rec-cat-tit {
    font-size:13px; text-transform:uppercase; letter-spacing:.02em; color: var(--texto-tenue);
    margin: 14px 2px 8px; font-weight:600;
  }
  /* Cada recurso, su propia tarjeta blanca con profundidad (maqueta) */
  .doc--rec { align-items:center; background:#fff; border:1px solid var(--linea-marcada); border-top:1px solid var(--linea-marcada);
    border-radius:16px; padding:14px 16px; margin-bottom:10px;
    box-shadow: 0 4px 10px rgba(30,45,65,.10), 0 16px 32px -8px rgba(30,45,65,.34); }
  .doc--rec:hover { background:#fff; border-color: var(--azul-filete, #3B85C0); }
  .doc-ico {
    flex:0 0 auto; width:44px; height:44px; border-radius:12px; background: var(--crema-media);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="doc-wrap" id="doc-wrap">
    <a class="migas" href="../">← Volver al portal</a>
    <h1>Documentos del club</h1><span class="sub">Impresos, normativa y circulares</span>
    <div class="tarjeta"><div class="estado-caja"><div class="ap-esq" data-esq="filas:4"></div></div></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('doc-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function tam(b){ if(!b) return ''; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1).replace('.',',')+' MB'; }

  /* Icono de descarga del kit (30a), a la derecha de cada fila. */
  var BAJA = '<span class="baja">' +
             ((window.APOLANA_UI && APOLANA_UI.icono) ? APOLANA_UI.icono('descargar', 22) : '↓') +
             '</span>';
  function caja(contenido) { return '<div class="tarjeta"><div class="estado-caja">' + contenido + '</div></div>'; }

  var html = '<a class="migas" href="../">← Volver al portal</a>' +
             '<h1>Documentos del club</h1><span class="sub">Impresos, normativa y circulares</span>';

  /* Los documentos reservados no guardan enlace: guardan la ruta dentro del
     cubo cerrado `documentos-socios`. El enlace se pide en el momento de
     pulsar y dura un minuto, así no queda nada que se pueda reenviar. */
  var CUBO_SOCIOS = 'documentos-socios';
  function esReservado(v) { return !!v && !/^https?:\/\//i.test(v); }

  /* Los recursos de grupo se piden igual que todo lo demás: las reglas de la
     base ya deciden cuáles llegan —solo los de TUS grupos— y aquí no hay que
     volver a comprobar quién eres. Pedir el `grupo_id` sirve para agruparlos
     aparte al pintarlos, no para filtrarlos. */
  var r = await sb.from('documentos').select('titulo,descripcion,categoria,archivo_url,nombre_archivo,tipo_mime,tamano_bytes,visibilidad,orden,grupo_id')
    .eq('activo', true).order('categoria').order('orden');
  /* El nombre del grupo, para poder titular su bloque: «Recursos de Grupo A»
     dice mucho más que «Recursos de tu grupo» cuando llevas dos. */
  var NOMBRE_GRUPO = {};
  try {
    var gs = await sb.from('grupos').select('id,nombre');
    if (gs.data) gs.data.forEach(function (g) { NOMBRE_GRUPO[g.id] = g.nombre; });
  } catch (e) { /* sin nombres, el bloque se titula en genérico */ }

  /* Sin sesión no se enseña ni el nombre de un documento reservado.
     (A esta pantalla no se llega sin entrar, pero el filtro va igual.) */
  var sesion = null;
  try { var s0 = await sb.auth.getSession(); sesion = s0 && s0.data && s0.data.session; } catch (e) {}
  if (r.data) r.data = r.data.filter(function (d) { return d.visibilidad === 'publico' || !!sesion; });

  if (r.error) {
    html += caja(APOLANA_UI.error('No hemos podido cargar los documentos',
      'Puede ser tu conexión. Los documentos del club siguen ahí; vuelve a intentarlo en un momento.'));
  } else if (!r.data.length) {
    html += caja(APOLANA_UI.vacio('Todavía no hay documentos publicados',
      'Aquí irán los impresos, la normativa y las circulares del club. En cuanto el club suba el primero, aparecerá en esta pantalla.',
      APOLANA_UI.volver()));
  } else {
    /* Un emoji por tipo de recurso: lo hace VISUAL de un vistazo, que es lo
       que pidió Andrés. Solo se usa en los recursos de grupo; la normativa
       del club se queda con su icono de archivo de siempre. */
    var ICONO_CAT = {
      'fuerza': '💪', 'gomas': '➰', 'movilidad': '🧘', 'core': '🌀',
      'técnica': '🎯', 'tecnica': '🎯', 'calentamiento': '🔥', 'vídeo': '▶️',
      'video': '▶️', 'rutina': '📋', 'otros': '📄'
    };
    function iconoCat(cat) { return ICONO_CAT[String(cat || '').toLowerCase()] || '📄'; }
    /* Color del recuadro del emoji, por categoría (maqueta de recursos) */
    var COLOR_CAT = { 'fuerza':'#E7F1F9','gomas':'#E9F6EC','movilidad':'#F3ECF8','core':'#E4F4F1',
      'técnica':'#FBF1E0','tecnica':'#FBF1E0','calentamiento':'#FBEAE5','vídeo':'#FBEAE5','video':'#FBEAE5',
      'rutina':'#E7F1F9','otros':'#EFEAF0' };
    function colorCat(cat) { return COLOR_CAT[String(cat || '').toLowerCase()] || '#EFEAF0'; }

    /* Un documento, en HTML. Reutilizado por los recursos de grupo y por la
       normativa del club. Con `icono`, sale grande a la izquierda. */
    function docHTML(d, conIcono) {
      var ext = (d.nombre_archivo || '').split('.').pop().toUpperCase();
      var meta = [ext && ext.length <= 5 ? ext : '', tam(d.tamano_bytes)].filter(Boolean).join(' · ');
      var abre = esReservado(d.archivo_url)
        ? 'href="#" data-reservado="' + esc(d.archivo_url) + '"'
        : 'href="' + esc(d.archivo_url) + '" target="_blank" rel="noopener" download';
      return '<a class="doc' + (conIcono ? ' doc--rec' : '') + '" ' + abre + '>' +
        (conIcono ? '<span class="doc-ico" style="background:' + colorCat(d.categoria) + '" aria-hidden="true">' + iconoCat(d.categoria) + '</span>' : '') +
        '<span class="info">' +
          '<span class="tit">' + esc(d.titulo) + (d.visibilidad === 'socios' ? '<span class="etq socios">solo socios</span>' : '') + '</span>' +
          (d.descripcion ? '<span class="desc">' + esc(d.descripcion) + '</span>' : '') +
          (meta ? '<span class="meta">' + esc(meta) + '</span>' : '') +
        '</span>' + BAJA + '</a>';
    }

    /* Los recursos del grupo van SEPARADOS y primero: es lo que el atleta
       viene a buscar (su rutina de fuerza, sus gomas), no la normativa del
       club. Y dentro, agrupados por su categoría —Fuerza, Gomas, Movilidad—
       con unos filtros arriba para quedarse solo con un tipo. */
    var deGrupo = r.data.filter(function (d) { return d.visibilidad === 'grupo'; });
    var delClub = r.data.filter(function (d) { return d.visibilidad !== 'grupo'; });

    if (deGrupo.length) {
      var porCat = {};
      deGrupo.forEach(function (d) { var c = d.categoria || 'Otros'; (porCat[c] = porCat[c] || []).push(d); });
      var cats = Object.keys(porCat).sort(function (a, b) { return a.localeCompare(b, 'es'); });

      var nombreG = NOMBRE_GRUPO[deGrupo[0].grupo_id] || 'tu grupo';
      var chips = '';
      /* Los filtros solo salen si hay más de un tipo: con uno solo, filtrar
         no filtra nada y estorba. */
      if (cats.length > 1) {
        chips = '<div class="rec-filtros"><button type="button" class="rec-chip activo" data-cat="">Todo</button>' +
          cats.map(function (c) { return '<button type="button" class="rec-chip" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
          '</div>';
      }
      html += '<div class="tarjeta rec-grupo"><h2>Recursos de ' + esc(nombreG) + '</h2>' + chips +
        cats.map(function (c) {
          return '<div class="rec-cat" data-cat="' + esc(c) + '">' +
            (cats.length > 1 ? '<h3 class="rec-cat-tit">' + esc(c) + '</h3>' : '') +
            porCat[c].map(function(d){ return docHTML(d, true); }).join('') + '</div>';
        }).join('') + '</div>';
    }

    if (delClub.length) {
      var orden = ['Estatutos','Normativa interna','Reglamento','Protocolos','Autorizaciones','Circulares','Otros'];
      var grupos = {};
      delClub.forEach(function (d) { var c = d.categoria || 'Otros'; (grupos[c] = grupos[c] || []).push(d); });
      Object.keys(grupos).sort(function (a, b) {
        var ia = orden.indexOf(a), ib = orden.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      }).forEach(function (c) {
        html += '<div class="tarjeta"><h2>' + esc(c) + '</h2>' + grupos[c].map(docHTML).join('') + '</div>';
      });
    }
  }
  wrap.innerHTML = html;

  /* Al pulsar un documento reservado se pide su enlace temporal. La pestaña se
     abre dentro de la pulsación, si no el navegador la toma por un anuncio. */
  /* Los filtros de los recursos de grupo: al pulsar un tipo, se esconden las
     demás categorías. Es solo mostrar y ocultar; no vuelve a pedir nada. */
  wrap.addEventListener('click', function (ev) {
    var chip = ev.target && ev.target.closest ? ev.target.closest('.rec-chip') : null;
    if (!chip) return;
    var tarjeta = chip.closest('.rec-grupo'); if (!tarjeta) return;
    var cat = chip.getAttribute('data-cat');
    tarjeta.querySelectorAll('.rec-chip').forEach(function (b) { b.classList.toggle('activo', b === chip); });
    tarjeta.querySelectorAll('.rec-cat').forEach(function (bloque) {
      bloque.hidden = !!cat && bloque.getAttribute('data-cat') !== cat;
    });
  });

  wrap.addEventListener('click', async function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest('a[data-reservado]') : null;
    if (!a) return;
    ev.preventDefault();
    var v = window.open('', '_blank');
    var s = await sb.storage.from(CUBO_SOCIOS).createSignedUrl(a.getAttribute('data-reservado'), 60);
    if (!s || s.error || !s.data || !s.data.signedUrl) {
      if (v) v.close();
      if (window.APX) APX.toast('No hemos podido abrir el documento', 'error', { detalle: 'Prueba otra vez en un momento.' });
      return;
    }
    if (v) v.location.href = s.data.signedUrl; else window.location.href = s.data.signedUrl;
  });
});
</script>

</body>
</html>
