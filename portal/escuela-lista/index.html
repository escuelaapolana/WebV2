<!DOCTYPE html>

<style>
  /* Pasar lista · ESCUELA DE ATLETISMO (grupos de martes y jueves 17:30).
     Mismo diseño que portal/cubo-lista (assets/css/pasar-lista.css) más lo
     propio de la escuela, sacado de la maqueta aprobada
     portal/_maqueta-escuela-lista: color del grupo, edad, «Solo martes»,
     avisos de salud, «📞 Familia» y los niños apagados el día que no les toca. */
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); }
  .el-wrap { max-width:680px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 40px; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(24px,5.5vw,34px); line-height:1.02; color:var(--navy,#26374B); margin:4px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 14px; }
  .el-tit { margin-bottom:2px; }

  /* Color del grupo (Rojo / Azul / Verde): bolita en el chip, franja en los bloques */
  .el-bola { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c,#B9AE97); flex:0 0 10px; }
  .pl-chip.on .el-bola { box-shadow:0 0 0 2px #fff; }
  .el-color { border-top:5px solid var(--c,#B9AE97); }
  .el-color > .cab b { display:inline-flex; align-items:center; gap:7px; }

  /* Pastillas propias de la escuela */
  .el-p-obs { background:#FDECEA; color:#9A2F26; white-space:normal; }
  .el-p-dia { background:#EEF2F6; color:#4A5A6B; }
  .el-p-pr { background:#E9DDFB; color:#4B2C86; border:1px solid #C9B3EE; }
  .el-edad { font-variant-numeric:tabular-nums; }
  .pl-fila.fuera { opacity:.5; }
  .pl-fila.fuera .pl-info .n { text-decoration:none; color:var(--pl-navy); }

  /* Día sin entrenamiento de la escuela / sin grupo */
  .el-caja { text-align:center; background:#fff; border:1px solid var(--pl-linea); border-radius:18px; box-shadow:var(--pl-sombra);
             padding:24px 18px; margin:6px 0 14px; color:var(--pl-navy); }
  .el-caja .ic { font-size:30px; line-height:1; margin-bottom:8px; }
  .el-caja b { display:block; font-size:17px; }
  .el-caja p { color:var(--pl-suave); font-size:14px; margin:6px 0 0; }
  .el-caja button { margin-top:14px; min-height:46px; padding:0 18px; border-radius:999px; border:0; background:var(--pl-navy); color:#fff;
                    font:inherit; font-weight:700; font-size:14.5px; cursor:pointer; }

  /* Más */
  .fila-mas { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
              background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
              padding:15px 16px; margin-bottom:11px; font:inherit; color:var(--navy,#26374B); cursor:pointer; text-decoration:none; }
  .fila-mas b { display:block; font-size:15.5px; font-weight:600; }
  .fila-mas small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }

  /* «Guardar lista» va al FINAL de la página, debajo del último niño, y no
     flotando (Andrés 28-oct: el pie flotante le tapaba el último a Laura). */
  .pl-pie { position:static; margin-top:18px; }

  .el-toast { position:fixed; left:50%; bottom:170px; transform:translate(-50%,14px); opacity:0; transition:.24s;
              background:var(--navy,#26374B); color:#fff; font-size:14px; padding:10px 16px; border-radius:999px; z-index:60;
              box-shadow:0 10px 24px -8px rgba(30,45,65,.5); max-width:calc(100vw - 32px); box-sizing:border-box; text-align:center; }
  .el-toast.ver { opacity:1; transform:translate(-50%,0); }
  .el-toast.err { background:#B23B3B; }
</style>

<body>

  <div class="el-wrap" id="el"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('el');
  var b = window.APOLANA_BASE || '../../';
  var UI = window.APOLANA_UI;

  /* Los grupos que entran: escuela de atletismo, 1er turno (17:30) de lunes y
     miércoles y de martes y jueves (Andrés, 20-oct-2026). Cada día salen los
     grupos que entrenan ESE día (Azul 2 de L/X y Azul 2 de M/J no se mezclan). */
  var RE_TURNO = /^(lunes y mi[eé]rcoles|martes y jueves) 17:30/i;
  function diasDe(g){ return /^lunes y mi/i.test((g && g.horario) || '') ? [1, 3] : [2, 4]; }   // 1=lunes … 7=domingo
  var TODOS = [];                        // todos mis grupos de la escuela (los dos turnos)
  var COLOR_GRUPO = { rojo:'#C8473B', azul:'#2F6FA8', verde:'#2E8B57' };
  var ORDEN_COLOR = { rojo:0, azul:1, verde:2 };

  var GRUPOS = [], NINOS = {}, EN_GRUPO = {}, ENTRENADOR = {}, sel = null, fecha = hoyISO(), ASIS = {}, AUS = {},
      cargado = false, CANCEL = {cancelado:false}, esAdmin = false, otrosGrupos = false;

  function pad(n){ return (n<10?'0':'')+n; }
  function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MES_C=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fechaLarga(s){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  function fechaCorta(s){ var p=String(s||'').split('-'); if(p.length<3) return ''; return (+p[2])+' '+MES_C[+p[1]-1]; }
  function pl(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  /* Día de la semana de una fecha ISO: 1=lunes … 7=domingo. */
  function diaSem(s){ var p=String(s).split('-'); var js=new Date(+p[0],+p[1]-1,+p[2]).getDay(); return js===0?7:js; }
  function diaSemFecha(){ return diaSem(fecha); }
  function diasEscuela(){ var u = []; TODOS.forEach(function(g){ diasDe(g).forEach(function(d){ if(u.indexOf(d) === -1) u.push(d); }); }); return u; }
  function hayEscuela(){ return diasEscuela().indexOf(diaSemFecha()) !== -1; }
  /* GRUPOS = los que entrenan el día elegido (si ese día no entrena ninguno, todos). */
  function ajustarDia(){
    var d = diaSemFecha();
    var hoyG = TODOS.filter(function(g){ return diasDe(g).indexOf(d) !== -1; });
    GRUPOS = hoyG.length ? hoyG : TODOS.slice();
    if(!GRUPOS.some(function(g){ return g.id === sel; })){
      var con = GRUPOS.filter(function(x){ return (EN_GRUPO[x.id] || []).some(function(id){ return NINOS[id]; }); })[0];
      sel = GRUPOS.length ? (con || GRUPOS[0]).id : null;
    }
  }
  function moverDia(n, desde){ var p=(desde||fecha).split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  /* El último martes o jueves (anterior a la fecha elegida). */
  function ultimoDiaEscuela(){ var u = diasEscuela(), f = fecha; for(var i=0;i<7;i++){ f = moverDia(-1, f); if(u.indexOf(diaSem(f)) !== -1) return f; } return fecha; }
  function colorKey(g){ return String((g && g.nombre) || '').trim().split(/\s+/)[0].toLowerCase(); }
  function colorDe(g){ return COLOR_GRUPO[colorKey(g)] || '#8A816E'; }
  function toast(msg,tipo){ var t=document.createElement('div'); t.className='el-toast'+(tipo==='err'?' err':''); t.textContent=msg;
    document.body.appendChild(t); requestAnimationFrame(function(){ t.classList.add('ver'); });
    setTimeout(function(){ t.classList.remove('ver'); setTimeout(function(){ t.remove(); },260); },2000); }

  // Nombres escritos TODO EN MAYÚSCULAS (vienen así de las fichas) → «Azahara Vidal Faiz».
  function bonito(n){
    n = String(n||'').trim();
    if (!n || n !== n.toUpperCase() || !/[A-ZÁÉÍÓÚÑÜ]/.test(n)) return n;
    return n.toLowerCase().split(/\s+/).map(function(w, i){
      if (i && /^(de|del|la|las|los|y|i)$/.test(w)) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }
  var COL = ['#2F6FA8','#2E8C86','#B5714A','#6E5AA6','#3F7A4C','#C6892F'];
  function iniciales(n){ return String(n||'').trim().split(/\s+/).slice(0,2).map(function(x){ return x.charAt(0).toUpperCase(); }).join(''); }
  function color(n){ var h=0; String(n||'').split('').forEach(function(c){ h=(h*31+c.charCodeAt(0))>>>0; }); return COL[h%COL.length]; }
  function cuando(ts){
    if(!ts || ts === true) return '';
    var d = new Date(ts), hoy = new Date(), ay = new Date(); ay.setDate(ay.getDate()-1);
    if(isNaN(d.getTime())) return '';
    function iso(x){ return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }
    var h = pad(d.getHours())+':'+pad(d.getMinutes());
    if(iso(d)===iso(hoy)) return ' hoy a las '+h;
    if(iso(d)===iso(ay)) return ' ayer a las '+h;
    return ' el '+d.getDate()+' de '+MESES[d.getMonth()]+' a las '+h;
  }
  /* Edad el día de la lista. */
  function edad(fn){
    var p = String(fn||'').split('-'); if(p.length<3) return null;
    var q = fecha.split('-'), e = (+q[0]) - (+p[0]);
    if((+q[1]) < (+p[1]) || ((+q[1]) === (+p[1]) && (+q[2]) < (+p[2]))) e--;
    return (e >= 0 && e < 100) ? e : null;
  }
  function nombreDias(lst){ var n = lst.map(function(d){ return DIAS[d===7?0:d]; }); return n.length > 1 ? n.slice(0,-1).join(', ')+' y '+n[n.length-1] : (n[0]||''); }
  /* escuela_dias: si tiene valor, los días que viene (de los de su grupo). Null = todos. */
  function diasPropios(a){
    var d = (a && a.escuela_dias && a.escuela_dias.length) ? a.escuela_dias.map(Number) : null;
    if(!d) return null;
    var dg = diasDe(grupoSel());
    var dentro = dg.filter(function(x){ return d.indexOf(x) !== -1; });
    return dentro.length === dg.length ? null : d;   // viene todos los días del grupo: nada que avisar
  }
  function leToca(a){ var d = diasPropios(a); return !d || d.indexOf(diaSemFecha()) !== -1; }

  async function cargar(){
    var rolAct = (perfil && (perfil.rol_activo || perfil.rol)) || '';
    /* Manda el papel ACTIVO: quien es admin pero ha entrado como entrenador ve
       solo SUS grupos (Andrés, 20-oct: «¿qué sentido tiene que vea los demás?»).
       es_admin() de la base ya mira coalesce(rol_activo, rol). */
    esAdmin = rolAct === 'admin';
    if(!esAdmin && !(perfil && perfil.rol_activo)){ try { var ra = await sb.rpc('es_admin'); esAdmin = !!(ra && !ra.error && ra.data === true); } catch(e){} }

    var g = await sb.from('grupos').select('id,nombre,horario,seccion,entrenador_id,activo')
      .eq('seccion','escuela').eq('activo',true).order('nombre');
    var todos = (g.error ? [] : (g.data||[])).filter(function(x){ return RE_TURNO.test(x.horario || ''); });
    GRUPOS = esAdmin ? todos : todos.filter(function(x){ return perfil && x.entrenador_id === perfil.id; });
    GRUPOS.sort(function(x, y){
      var cx = ORDEN_COLOR.hasOwnProperty(colorKey(x)) ? ORDEN_COLOR[colorKey(x)] : 9, cy = ORDEN_COLOR.hasOwnProperty(colorKey(y)) ? ORDEN_COLOR[colorKey(y)] : 9;
      return (cx - cy) || String(x.nombre).localeCompare(String(y.nombre), 'es', { numeric:true });
    });
    TODOS = GRUPOS.slice();

    /* ¿Lleva además grupos que no son de la escuela? (para el enlace de vuelta en «Más») */
    if(perfil && perfil.id) try {
      var og = await sb.from('grupos').select('id,seccion').eq('entrenador_id', perfil.id);
      otrosGrupos = !og.error && (og.data||[]).some(function(x){ return x.seccion !== 'escuela'; });
    } catch(e){}

    /* Quién entrena cada grupo (nombre en la cabecera del bloque). */
    var idsEnt = []; GRUPOS.forEach(function(x){ if(x.entrenador_id && idsEnt.indexOf(x.entrenador_id) === -1) idsEnt.push(x.entrenador_id); });
    /* Solo el nombre de pila: con el apellido no cabe en la cabecera del móvil. */
    if(perfil && perfil.id) ENTRENADOR[perfil.id] = perfil.nombre || '';
    if(idsEnt.length && esAdmin){
      try { var rp = await sb.from('perfiles').select('id,nombre').in('id', idsEnt);
        if(!rp.error) (rp.data||[]).forEach(function(p){ ENTRENADOR[p.id] = p.nombre || ''; }); } catch(e){}
    }

    /* Niños de esos grupos: atleta_grupos → atletas (sin las bajas). */
    NINOS = {}; EN_GRUPO = {};
    var gids = GRUPOS.map(function(x){ return x.id; });
    if(gids.length){
      var rg = await sb.from('atleta_grupos').select('atleta_id,grupo_id').in('grupo_id', gids);
      var ids = [];
      if(!rg.error) (rg.data||[]).forEach(function(x){
        (EN_GRUPO[x.grupo_id] = EN_GRUPO[x.grupo_id] || []).push(x.atleta_id);
        if(ids.indexOf(x.atleta_id) === -1) ids.push(x.atleta_id);
      });
      /* En tandas, para no hacer una dirección enorme cuando se ven todos los grupos. */
      for(var i = 0; i < ids.length; i += 80){
        var ra2 = await sb.from('atletas')
          .select('id,nombre,apellidos,fecha_nacimiento,estado,fecha_prueba_fin,telefono_tutor,nombre_tutor,escuela_dias,aviso_salud')
          .in('id', ids.slice(i, i+80));
        if(!ra2.error) (ra2.data||[]).forEach(function(a){ if(a.estado !== 'baja') NINOS[a.id] = a; });
      }
    }
    /* ?g=<grupo>&f=<fecha>: viene de «Pasar lista» de la pantalla del entrenador. */
    if(!sel && GRUPOS.length){
      var qs = new URLSearchParams(location.search), qg = qs.get('g'), qf = qs.get('f');
      if(qg && GRUPOS.some(function(x){ return x.id === qg; })) sel = qg;
      if(qf && /^\d{4}-\d{2}-\d{2}$/.test(qf) && qf <= hoyISO()) fecha = qf;
    }
    /* Al entrar: el grupo pedido si entrena ese día; si no, el primero (por color y nombre) con niños. */
    ajustarDia();
    if(!sel && GRUPOS.length){
      var conNinos = GRUPOS.filter(function(x){ return (EN_GRUPO[x.id] || []).some(function(id){ return NINOS[id]; }); })[0];
      sel = (conNinos || GRUPOS[0]).id;
    }
    cargado = true;
  }

  async function cargarAsis(){
    ASIS = {}; AUS = {}; CANCEL = {cancelado:false};
    if(!sel || !hayEscuela()) return;
    try { var rc = await sb.rpc('dia_cancelado', { p_fecha: fecha, p_seccion: 'escuela' }); if(rc && !rc.error && rc.data) CANCEL = rc.data; } catch(e){}
    var ids = (EN_GRUPO[sel] || []).filter(function(id){ return NINOS[id]; });
    if(ids.length){
      /* Los avisos de falta que han dejado las familias para ese día. */
      var ra = await sb.from('ausencias').select('atleta_id,fecha,motivo,avisado_por_nombre,created_at').in('atleta_id', ids).eq('fecha', fecha);
      if(!ra.error) (ra.data||[]).forEach(function(x){ AUS[x.atleta_id] = x; });
    }
    var r = await sb.from('asistencia').select('atleta_id,presente').eq('grupo_id', sel).eq('fecha', fecha);
    if(!r.error) (r.data||[]).forEach(function(x){ ASIS[x.atleta_id] = !!x.presente; });
  }

  function g0Turno(){ var g = grupoSel(); return g ? (/^lunes/i.test(g.horario||'') ? 'lunes y miércoles 17:30' : 'martes y jueves 17:30') : '17:30'; }
  function grupoSel(){ return GRUPOS.filter(function(g){ return g.id===sel; })[0] || null; }
  /* Cuántos niños le tocan ese día a un grupo (para el chip). */
  function cuenta(g){ return (EN_GRUPO[g.id] || []).filter(function(id){ var a = NINOS[id]; return a && leToca(a); }).length; }

  /* Niños del grupo elegido:
       { id, nombre, a (la ficha), aviso (fila de ausencias o null), fuera, guardado, est }
     · fuera = ese día no le toca (escuela_dias) y no tiene nada guardado: sale
       apagado, sin botones, y no cuenta.
     · est = 'si' | 'no' | '' (sin marcar). Lo guardado manda; si no hay nada
       guardado y la familia avisó, sale ya como «no». */
  function miembros(){
    var g = grupoSel(); if(!g) return [];
    var arr = (EN_GRUPO[g.id] || []).map(function(id){ return NINOS[id]; }).filter(Boolean).map(function(a){
      var m = { id:a.id, a:a, nombre:(bonito(a.nombre)+' '+bonito(a.apellidos)).replace(/\s+/g,' ').trim(), aviso:AUS[a.id] || null };
      m.guardado = ASIS.hasOwnProperty(a.id) ? (ASIS[a.id] ? 'si' : 'no') : null;
      m.fuera = !leToca(a) && !m.guardado;
      m.est = m.fuera ? '' : (m.guardado || (m.aviso ? 'no' : ''));
      return m;
    });
    return arr.sort(function(x, y){
      return ((x.fuera?1:0) - (y.fuera?1:0)) || x.nombre.localeCompare(y.nombre, 'es');
    });
  }
  function cuentas(lst){
    var c = { si:0, no:0, sin:0, av:0, tot:0, fuera:0 };
    lst.forEach(function(m){ if(m.fuera){ c.fuera++; return; } c.tot++; if(m.est==='si') c.si++; else if(m.est==='no') c.no++; else c.sin++; if(m.aviso) c.av++; });
    return c;
  }

  // Guarda la marca de varios niños de golpe (true = vino, false = no vino, null = quitar).
  async function guardarMarcas(lista, valor){
    if(!lista.length) return true;
    var keys = lista.map(function(m){ return m.id; }), r;
    r = valor === null
      ? await sb.from('asistencia').delete().in('atleta_id', keys).eq('grupo_id', sel).eq('fecha', fecha)
      : await sb.from('asistencia').upsert(keys.map(function(k){ return { atleta_id:k, grupo_id:sel, fecha:fecha, presente:valor, registrado_por:(perfil&&perfil.id)||null }; }), { onConflict:'atleta_id,fecha,grupo_id' });
    if(r.error){ toast('No se pudo guardar: '+r.error.message,'err'); return false; }
    keys.forEach(function(k){ if(valor === null) delete ASIS[k]; else ASIS[k] = valor; });
    return true;
  }

  // ✓ / ✗ de un niño: se guarda al momento. Tocar el que ya está puesto lo quita.
  async function marcar(id, v, filaEl){
    var m = miembros().filter(function(x){ return x.id===id; })[0];
    if(!m || m.fuera) return;
    if(filaEl) filaEl.setAttribute('aria-busy','true');
    var quitar = (m.guardado === v);
    await guardarMarcas([m], quitar ? null : (v === 'si'));
    pintarLista();
  }
  async function restoVienen(){
    var pend = miembros().filter(function(m){ return !m.fuera && !m.est; });
    if(!pend.length) return;
    if(await guardarMarcas(pend, true)) toast(pl(pend.length,'niño marcado','niños marcados')+' ✓');
    pintarLista();
  }
  async function borrarMarcas(){
    var cons = miembros().filter(function(m){ return m.guardado; });
    if(!cons.length){ toast('No hay marcas guardadas este día'); return; }
    if(!window.confirm('¿Borrar todas las marcas de este grupo este día?')) return;
    await guardarMarcas(cons, null);
    pintarLista();
  }
  // «Guardar lista»: lo que queda sin marcar (y los avisados, si aún no se había
  // guardado nada) se guarda como que NO vino. Lo demás ya estaba guardado.
  async function guardarLista(){
    var lst = miembros().filter(function(m){ return !m.fuera; });
    var sin = lst.filter(function(m){ return !m.est; });
    if(sin.length && !window.confirm('Quedan '+pl(sin.length,'niño','niños')+' sin marcar: se guardan como que no han venido.\n\n¿Guardar la lista?')) return;
    var noGuardados = lst.filter(function(m){ return !m.guardado && m.est !== 'si'; });
    if(await guardarMarcas(noGuardados, false)){
      var c = cuentas(miembros());
      toast('Lista guardada ✓ · '+c.si+' '+(c.si===1?'vino':'vinieron'));
    }
    pintarLista();
  }

  function filaHTML(m){
    var a = m.a, meta = [], extra = '';
    var e = edad(a.fecha_nacimiento);
    if(e != null) meta.push('<span class="el-edad">'+pl(e,'año','años')+'</span>');
    var dp = diasPropios(a);
    if(dp) meta.push('<span class="pl-pill el-p-dia">Solo '+esc(nombreDias(dp))+(m.fuera ? (fecha===hoyISO() ? ' · hoy no le toca' : ' · este día no le toca') : '')+'</span>');
    if(a.estado === 'prueba'){
      var fin = a.fecha_prueba_fin ? String(a.fecha_prueba_fin).slice(0,10) : '';
      meta.push('<span class="pl-pill el-p-pr">'+(fin ? (fin >= hoyISO() ? 'De prueba · hasta '+esc(fechaCorta(fin)) : 'De prueba · terminó el '+esc(fechaCorta(fin))) : 'De prueba')+'</span>');
    }
    if(a.aviso_salud) meta.push('<span class="pl-pill el-p-obs">⚠︎ '+esc(a.aviso_salud)+'</span>');
    if(m.aviso && !m.fuera){
      meta.push('<span class="pl-pill pl-p-av">🔔 Avisó</span>');
      var quien = String(m.aviso.avisado_por_nombre || '').trim() || 'La familia';
      extra = '<div class="pl-aviso-txt">'+esc(quien)+' avisó'+esc(cuando(m.aviso.created_at))+(m.aviso.motivo ? ' · «'+esc(m.aviso.motivo)+'»' : '')+'</div>';
    }
    if(!m.fuera && a.telefono_tutor){
      var tl = String(a.telefono_tutor).replace(/[^\d+]/g,'');
      if(tl) meta.push('<a class="pl-tel" href="tel:'+esc(tl)+'"'+(a.nombre_tutor ? ' title="'+esc(a.nombre_tutor)+'"' : '')+'>📞 Familia</a>');
    }
    var cls = 'pl-fila '+(m.fuera?'fuera':m.est==='si'?'si':m.est==='no'?'no':'sin')+(m.aviso && !m.fuera?' aviso':'');
    return '<div class="'+cls+'">'+
      '<div class="pl-av" style="background:'+color(m.nombre)+'">'+esc(iniciales(m.nombre))+'</div>'+
      '<div class="pl-info"><div class="n">'+esc(m.nombre)+'</div>'+(meta.length?'<div class="m">'+meta.join(' ')+'</div>':'')+extra+'</div>'+
      (m.fuera ? '' :
        '<div class="pl-est"><button type="button" class="si" data-a="'+esc(m.id)+'" data-v="si" aria-label="Vino">✓</button>'+
        '<button type="button" class="no" data-a="'+esc(m.id)+'" data-v="no" aria-label="No vino">✗</button></div>')+
    '</div>';
  }

  function cabecera(){
    var hoy = hoyISO(), entrena = hayEscuela();
    var chips = GRUPOS.map(function(x){
      return '<button type="button" class="pl-chip'+(x.id===sel?' on':'')+'" data-g="'+esc(x.id)+'" aria-pressed="'+(x.id===sel?'true':'false')+'">'+
        '<div class="h"><span class="el-bola" style="--c:'+colorDe(x)+'"></span>'+esc(x.nombre)+(entrena?' <span class="pl-tag">'+(fecha===hoy?'Hoy':'Este día')+'</span>':'')+'</div>'+
        '<div class="s">'+(entrena ? pl(cuenta(x), 'niño', 'niños') : pl((EN_GRUPO[x.id]||[]).filter(function(id){ return NINOS[id]; }).length, 'niño', 'niños'))+'</div></button>';
    }).join('');
    return '<h1 class="pl-tit el-tit">Pasar lista</h1>'+
      '<p class="sub">Escuela de atletismo · '+esc(g0Turno())+'</p>'+
      '<div class="pl-fecha">'+
        '<button type="button" data-dia="-1" aria-label="Día anterior">‹</button>'+
        '<label class="dia">'+(fecha===hoy?'Hoy · ':'')+esc(fechaLarga(fecha))+
          '<input type="date" id="el-fecha" value="'+esc(fecha)+'" max="'+esc(hoy)+'" aria-label="Elegir día"></label>'+
        '<button type="button" data-dia="1" aria-label="Día siguiente"'+(fecha>=hoy?' disabled':'')+'>›</button>'+
      '</div>'+
      '<div class="pl-chips">'+chips+'</div>';
  }

  function pintarLista(){
    var g = grupoSel();
    var chipsAntes = wrap.querySelector('.pl-chips'), scrollChips = chipsAntes ? chipsAntes.scrollLeft : null;

    if(!TODOS.length){
      wrap.innerHTML = '<h1 class="pl-tit el-tit">Pasar lista</h1><p class="sub">Escuela de atletismo · 17:30</p>'+
        '<div class="el-caja"><div class="ic">🏃</div><b>Aún no tienes grupo asignado</b><p>Avisa al club.</p></div>';
      return;
    }
    var cab = cabecera();

    if(!hayEscuela()){
      var ult = ultimoDiaEscuela();
      wrap.innerHTML = cab +
        '<div class="el-caja"><div class="ic">📅</div><b>Tus grupos de la escuela entrenan '+esc(nombreDias(diasEscuela().sort()))+'</b>'+
          '<p>Este día no hay entrenamiento: no hace falta pasar lista.</p>'+
          '<button type="button" data-ir="'+esc(ult)+'">Ir al '+esc(fechaLarga(ult))+'</button></div>';
      restaurarChips(scrollChips);
      return;
    }
    if(CANCEL.cancelado){
      wrap.innerHTML = cab +
        '<div style="text-align:center;background:#FBEDEA;border:1px solid #E7C3BB;border-radius:14px;padding:24px 16px;margin-top:6px">'+
          '<div style="font-size:30px;line-height:1;margin-bottom:6px">🚫</div>'+
          '<div style="font-weight:700;color:#9A3B3B;font-size:17px">Entrenamiento cancelado</div>'+
          '<div style="color:#7A4A44;margin-top:3px">'+esc(CANCEL.motivo||'Festivo')+'</div>'+
          '<div style="color:#8A816E;font-size:12.5px;margin-top:8px">Este día no hay entrenamiento de la escuela. No hace falta pasar lista.</div>'+
        '</div>';
      restaurarChips(scrollChips);
      return;
    }

    var lst = miembros(), c = cuentas(lst);
    var pct = c.tot ? Math.round((c.si+c.no)/c.tot*100) : 0;
    var titG = g ? esc(g.nombre) : '';
    var ent = g && g.entrenador_id && ENTRENADOR[g.entrenador_id] ? ENTRENADOR[g.entrenador_id] : '';
    var bola = '<span class="el-bola" style="--c:'+colorDe(g)+'"></span>';
    var subG = pl(c.tot,'niño','niños')+(c.fuera ? ' · a '+c.fuera+' no '+(c.fuera===1?'le':'les')+' toca' : '');

    var vacio = UI && UI.vacio
      ? UI.vacio('Nadie en este grupo', 'Cuando el club meta niños en este grupo, aparecerán aquí.')
      : '<p class="pl-vacio">Nadie en este grupo todavía.</p>';

    var resumen = !lst.length ? '' :
      '<div class="pl-res el-color" style="--c:'+colorDe(g)+'">'+
        '<div class="cab"><b>'+bola+titG+' · 17:30</b><small>'+esc(subG)+'</small></div>'+
        '<div class="cuerpo">'+
          '<div class="pl-anillo" style="--p:'+pct+'"><i>'+(c.si+c.no)+'/'+c.tot+'</i></div>'+
          '<div class="pl-cifras">'+
            '<div class="pl-c-ok"><b>'+c.si+'</b>'+(c.si===1?'vino':'vinieron')+'</div>'+
            '<div class="pl-c-ko"><b>'+c.no+'</b>no '+(c.no===1?'vino':'vinieron')+'</div>'+
            '<div class="pl-c-av"><b>'+c.av+'</b>'+(c.av===1?'avisó':'avisaron')+'</div>'+
            '<div class="pl-c-az"><b>'+c.sin+'</b>sin marcar</div>'+
          '</div>'+
        '</div>'+
        '<div class="pl-todos">'+
          '<button type="button" class="pl-b-ok" id="el-resto"'+(c.sin?'':' disabled')+'>✓ El resto, vinieron</button>'+
          '<button type="button" class="pl-b-lim" id="el-borrar">Borrar marcas</button>'+
        '</div>'+
      '</div>';

    var bloque = lst.length
      ? '<div class="pl-blq el-color" style="--c:'+colorDe(g)+'"><div class="cab"><b>'+bola+titG+(ent ? ' · '+esc(ent) : '')+'</b><span>'+(c.sin ? pl(c.sin,'sin marcar','sin marcar') : 'todo marcado')+'</span></div>'+lst.map(filaHTML).join('')+'</div>'
      : vacio;

    var pie = !c.tot ? '' :
      '<div class="pl-pie"><div class="txt">'+
        (c.sin ? '<b>'+c.sin+'</b> sin marcar · '+c.si+' '+(c.si===1?'vino':'vinieron')+' · '+c.no+' no' : '<b>Todo marcado</b> · '+c.si+' '+(c.si===1?'vino':'vinieron')+' · '+c.no+' no')+
      '</div><button type="button" id="el-guardar">Guardar lista</button></div>';

    wrap.innerHTML = cab + (lst.length ? '<p class="pl-nota">Cada marca se guarda al momento.</p>' : '') + resumen + bloque + pie;
    restaurarChips(scrollChips);
  }
  // La fila de grupos: dejar a la vista el elegido (o donde estaba, si solo se repinta).
  function restaurarChips(scrollChips){
    var fila = wrap.querySelector('.pl-chips'), on = fila && fila.querySelector('.pl-chip.on');
    if(!fila) return;
    var pad0 = parseFloat(getComputedStyle(fila).paddingLeft) || 0;
    /* Posición del chip dentro de la fila (sin depender de quién sea su offsetParent). */
    function izq(){ return on.getBoundingClientRect().left - fila.getBoundingClientRect().left + fila.scrollLeft; }
    if(scrollChips != null) fila.scrollLeft = scrollChips;
    else if(on) fila.scrollLeft = Math.max(0, izq() - pad0);
    /* Si el elegido se ha quedado medio fuera (al tocar uno del borde), se trae a la vista. */
    if(on){ var x = izq() - fila.scrollLeft;
      if(x < 0 || x + on.offsetWidth > fila.clientWidth) fila.scrollLeft = Math.max(0, izq() - pad0); }
  }

  function pintarMas(){
    wrap.innerHTML =
      '<h1 class="saludo">Más</h1>'+
      '<p class="sub">'+esc(perfil && perfil.nombre ? perfil.nombre : 'Lista de la escuela')+'</p>'+
      (otrosGrupos ? '<a class="fila-mas" href="'+b+'portal/entrenador/"><span><b>Mis otros grupos</b><small>El portal del entrenador.</small></span></a>' : '')+
      '<a class="fila-mas" href="'+b+'portal/documentos/"><span><b>Documentos del club</b></span></a>'+
      '<a class="fila-mas" href="'+b+'portal/perfil/"><span><b>Mi perfil</b><small>Cambiar la contraseña.</small></span></a>'+
      '<button type="button" class="fila-mas" id="el-salir"><span><b>Cerrar sesión</b></span></button>';
  }

  async function pintar(){
    if(!cargado){ if(UI) wrap.innerHTML = '<div class="ap-esq" data-esq="filas:4"></div>'; await cargar(); }
    if((location.hash||'') === '#mas'){ pintarMas(); return; }
    ajustarDia();
    await cargarAsis();
    pintarLista();
  }
  function cambiarFecha(nueva){
    var hoy = hoyISO(); fecha = nueva || hoy; if(fecha > hoy) fecha = hoy;
    pintar();
  }

  wrap.addEventListener('click', function(ev){
    var t = ev.target; if(!t || !t.closest) return;
    var ch = t.closest('.pl-chip[data-g]');
    if(ch){ sel = ch.getAttribute('data-g'); pintar(); return; }
    var dd = t.closest('[data-dia]');
    if(dd){ if(!dd.disabled) cambiarFecha(moverDia(+dd.getAttribute('data-dia'))); return; }
    var ir = t.closest('[data-ir]');
    if(ir){ cambiarFecha(ir.getAttribute('data-ir')); return; }
    var bt = t.closest('.pl-est button[data-a]');
    if(bt){ marcar(bt.getAttribute('data-a'), bt.getAttribute('data-v'), bt.closest('.pl-fila')); return; }
    if(t.closest('#el-resto')){ restoVienen(); return; }
    if(t.closest('#el-borrar')){ borrarMarcas(); return; }
    if(t.closest('#el-guardar')){ guardarLista(); return; }
    var sal = t.closest('#el-salir');
    if(sal){ try { sb.auth.signOut().then(function(){ location.href = b; }); } catch(e){ location.href = b; } return; }
  });
  wrap.addEventListener('change', function(ev){
    if(ev.target && ev.target.id==='el-fecha'){ cambiarFecha(ev.target.value); }
  });
  window.addEventListener('hashchange', pintar);

  pintar();
});
</script>
</body>
</html>
