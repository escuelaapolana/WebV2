<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia AC98 · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">
<script>
  window.APOLANA_BASE="../../";
  (function(){
    var v = new URLSearchParams(location.search).get('v');
    window.APOLANA_MUNDO = { world:'academia', screen: (v==='semana' ? 'semana' : v==='feedback' ? 'feedback' : 'resumen'), contentSel:'#ac', plegar: v==='semana' };
  })();
</script>
<script src="../../assets/js/supabase.js?v=a02b231d" defer></script>
<script src="../../assets/js/db.js?v=4fd9379b" defer></script>
<script src="../../assets/js/portal-auth.js?v=0f941fcf"></script>
<script src="../../assets/js/portal-tabbar.js?v=f353584b" defer></script>
<script src="../../assets/js/mundos.js?v=6a3be92d" defer></script>
<style>
  /* Academia AC98 · Hoy y Semana (v1 funcional).
     Criterios (docs/mundo-academia.md): el color solo para información, los
     estados siempre con texto, menos cajas y sombras, texto secundario legible. */
  :root{ --mm-acento:#3D55A0; --ac:#3D55A0; --ac-suave:#EEF1F8; --t2:#4F493D; --t3:#5E574A; --borde:#E2DACB; --fila:#EFE9DD; }
  body{ background:#FAF8F3; }
  #ac{ max-width:1500px; margin:0 auto; padding:clamp(14px,3vw,22px) clamp(12px,3vw,22px) 60px; color:var(--texto,#2B2A26); font-size:15px; }
  /* La barra flotante del móvil no tapa ni impide pulsar la última tarjeta. */
  body.mm-tab-on #ac{ padding-bottom:calc(170px + env(safe-area-inset-bottom)); }
  #ac *{ box-sizing:border-box; }
  .ac-nada{ color:var(--t3); font-size:14.5px; padding:24px 4px; text-align:center; }

  /* cabecera */
  .ac-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .ac-top h1{ font-family:var(--fuente-titulo); font-size:clamp(23px,4vw,28px); line-height:1.1; color:var(--navy); margin:0; text-transform:none; font-weight:700; }
  .ac-sub{ color:var(--t2); font-size:14.5px; margin:4px 0 12px; line-height:1.45; }
  .ac-prueba{ display:inline-block; background:#FFF6D9; color:#6F5300; border:1px solid #EAD58F; border-radius:8px; font-size:13px; font-weight:600; padding:3px 9px; }
  .ac-vistas{ margin-left:auto; }

  /* controles */
  .ac-barra{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .ac-btn{ font:inherit; font-size:14px; font-weight:600; border-radius:9px; padding:8px 12px; min-height:38px; border:1px solid var(--borde); background:#fff; color:var(--navy); cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .ac-btn:hover{ border-color:#C9BFAC; }
  .ac-btn.pri{ background:var(--ac); border-color:var(--ac); color:#fff; }
  .ac-btn.pel{ color:#8F3F24; }
  .ac-btn:disabled{ opacity:.5; cursor:default; }
  .ac-btn.mini{ font-size:13px; padding:5px 10px; min-height:32px; }
  .ac-seg{ display:inline-flex; border:1px solid var(--borde); border-radius:9px; overflow:hidden; background:#fff; }
  .ac-seg button{ font:inherit; font-size:14px; font-weight:600; color:var(--t3); background:none; border:0; padding:8px 12px; min-height:36px; cursor:pointer; }
  .ac-seg button.on{ background:var(--navy); color:#fff; }
  .ac-sel{ font:inherit; font-size:14px; padding:8px 10px; min-height:38px; border:1px solid var(--borde); border-radius:9px; background:#fff; color:var(--navy); max-width:100%; }
  .ac-esp{ flex:1; }

  /* estados con TEXTO (el color acompaña, no sustituye) */
  .ac-tag{ display:inline-block; max-width:100%; font-size:12px; font-weight:600; line-height:1.35; border-radius:6px; padding:1px 6px; margin:3px 3px 0 0; border:1px solid transparent; white-space:normal; overflow-wrap:break-word; vertical-align:top; }
  .t-bor{ border:1px dashed #8EA0C8; color:#34478A; background:#fff; }
  .t-hecha{ background:#EAF3EC; color:#2F6A3D; }
  .t-parcial{ background:#FBF0DC; color:#8A5A0B; }
  .t-nohecha{ background:#F7E7E1; color:#8F3F24; }
  .t-sind{ background:#F1EDE3; color:#5E574A; }
  .t-rev{ background:#FFF6D9; color:#6F5300; border-color:#EAD58F; }
  .t-nuevo{ background:#E7EEFB; color:#2F4E92; }
  .t-v{ background:#EEF1F8; color:#3D55A0; }

  /* casilla de sesión */
  .ac-cs{ display:block; width:100%; text-align:left; font:inherit; color:inherit; border:1px solid #DCE2EF; border-radius:8px; padding:5px 7px; margin:0 0 5px; background:#fff; cursor:pointer; overflow-wrap:break-word; }
  .ac-cs:last-child{ margin-bottom:0; }
  .ac-cs:hover{ border-color:#9AAAD0; }
  .ac-cs:focus-visible{ outline:2px solid var(--ac); outline-offset:1px; }
  .ac-cs.borr{ border-style:dashed; border-color:#9AAAD0; }
  .ac-cs .mo{ display:block; font-size:11px; font-weight:700; color:var(--t3); text-transform:uppercase; letter-spacing:.05em; }
  .ac-cs .ti{ display:block; font-weight:700; color:var(--navy); line-height:1.25; font-size:13.5px; }
  /* Lo prioritario de la casilla: series, ritmos, recuperaciones y calzado,
     una línea por fila del plan (la exigencia va en el detalle). */
  .ac-cs .l2{ display:block; color:var(--t2); line-height:1.3; font-size:13px; margin-top:2px; }
  .ac-cs .l2 .ln{ display:block; margin-top:1px; }
  .ac-cs .l2 .mas{ display:block; color:var(--t3); font-size:12px; margin-top:1px; }
  .ac-cs .l3{ display:block; color:var(--t3); font-size:12.5px; line-height:1.3; margin-top:1px; }
  .ac-cs.des{ background:#F4F1EA; border-color:#F4F1EA; color:var(--t3); cursor:default; font-size:13px; }
  .ac-cs.aus{ background:#FBF4EC; border-color:#EAD9C2; }
  .ac-cs.sust{ background:#F7F5F0; border-color:#E6E0D3; opacity:.85; }
  .ac-cs.sust .ti{ color:var(--t3); text-decoration:line-through; }
  .ac-cs.sin{ border:1px dotted #CFC6B4; color:var(--t3); text-align:center; background:transparent; cursor:default; font-size:12.5px; }
  .compacta .ac-cs .l2, .compacta .ac-cs .l3{ display:none; }
  .ac-cs.sel{ box-shadow:0 0 0 2px var(--ac); }

  /* tabla Semana */
  .ac-scroll{ overflow:auto; max-height:calc(100vh - 250px); min-height:320px; border:1px solid var(--borde); border-radius:12px; background:#fff; }
  table.ac-sem{ border-collapse:separate; border-spacing:0; width:100%; min-width:1120px; table-layout:fixed; font-size:13.5px; }
  .ac-sem th{ position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid var(--borde); padding:8px; text-align:left; font-weight:700; color:var(--navy); font-size:13.5px; }
  .ac-sem th small{ display:block; font-weight:500; color:var(--t3); font-size:12px; }
  .ac-sem td{ border-bottom:1px solid var(--fila); border-right:1px solid #F3EFE6; padding:6px; vertical-align:top; }
  .ac-sem .at{ position:sticky; left:0; z-index:1; background:#fff; width:148px; border-right:1px solid var(--borde); }
  .ac-sem th.at{ z-index:3; }
  .ac-sem td.hoy{ background:#F5F7FC; }
  .ac-sem th.hoy{ background:#EEF1F8; }
  .ac-sem tfoot td{ position:sticky; bottom:0; z-index:1; background:#FAF8F3; font-size:12.5px; color:var(--t2); border-top:1px solid var(--borde); line-height:1.4; }
  .ac-sem tfoot td.at{ z-index:3; font-weight:700; color:var(--navy); }
  .ac-nom{ font-weight:700; color:var(--navy); font-size:14.5px; line-height:1.2; overflow-wrap:anywhere; }
  .ac-nom small{ display:block; font-weight:500; color:var(--t3); font-size:12.5px; margin-top:2px; }
  .ac-nom .modo{ display:block; font-weight:600; color:#6F5300; font-size:11.5px; margin-top:3px; }
  button.ac-nom{ font:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; color:var(--navy); font-weight:700; font-size:14.5px; }
  .ac-regent{ background:#F5F7FC; border:1px solid #DCE2EF; border-radius:10px; padding:9px 12px; margin-top:4px; }
  .ac-radios{ display:flex; gap:12px; flex-wrap:wrap; margin:6px 0; }
  .ac-radios label{ display:flex; gap:6px; align-items:center; font-size:14.5px; color:var(--navy); }
  .ac-segm{ display:grid; gap:8px; }
  .ac-segm .fila{ display:flex; gap:10px; align-items:center; justify-content:space-between; border-top:1px solid var(--fila); padding-top:8px; }
  .ac-segm .fila b{ color:var(--navy); }
  .ac-ley{ font-size:13px; color:var(--t2); margin-top:10px; line-height:1.65; }
  .ac-ley summary{ cursor:pointer; font-weight:600; color:var(--navy); }

  /* Hoy */
  .ac-cifras{ display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .ac-cifra{ border:1px solid var(--borde); background:#fff; border-radius:10px; padding:7px 12px; font-size:14px; color:var(--t2); }
  .ac-cifra b{ font-family:var(--fuente-display); font-size:20px; color:var(--navy); margin-right:4px; }
  .ac-grid2{ display:grid; grid-template-columns:minmax(0,1.75fr) minmax(0,1fr); gap:14px; align-items:start; }
  .ac-caja{ background:#fff; border:1px solid var(--borde); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .ac-caja > h2{ margin:0; padding:10px 14px; font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--t2); border-bottom:1px solid var(--borde); display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; font-family:inherit; }
  .ac-caja > h2 small{ margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; font-size:13px; }
  table.ac-lst{ width:100%; border-collapse:collapse; font-size:14px; }
  .ac-lst th{ text-align:left; font-size:12.5px; color:var(--t3); font-weight:600; padding:8px 12px; border-bottom:1px solid var(--borde); }
  .ac-lst td{ padding:9px 12px; border-bottom:1px solid var(--fila); vertical-align:top; }
  .ac-lst tr:last-child td{ border-bottom:0; }
  .ac-lst .ac-cs{ margin-bottom:4px; }
  .ac-acc{ white-space:nowrap; }
  .ac-link{ font:inherit; background:none; border:0; padding:0; color:var(--azul,#2F6FA8); font-weight:600; font-size:13.5px; cursor:pointer; text-decoration:none; margin-right:12px; }
  .ac-pend ul{ margin:0; padding:0; }
  .ac-pend li{ list-style:none; padding:10px 14px; border-bottom:1px solid var(--fila); font-size:14px; line-height:1.4; }
  .ac-pend li:last-child{ border-bottom:0; }
  .ac-pend .o{ display:block; color:var(--t3); font-size:13px; margin-top:2px; }
  .ac-pend .q{ display:block; color:var(--t2); font-size:13.5px; margin-top:2px; }
  .ac-pend .bt{ display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; }
  .ac-pend .vacio{ color:var(--t3); }
  .ac-grp{ border-bottom:1px solid var(--fila); }
  .ac-grp:last-child{ border-bottom:0; }
  .ac-grp > summary{ list-style:none; padding:11px 14px; cursor:pointer; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .ac-grp > summary::-webkit-details-marker{ display:none; }
  .ac-grp > summary::before{ content:'▸'; color:var(--t3); font-size:12px; }
  .ac-grp[open] > summary::before{ content:'▾'; }
  .ac-grp > summary b{ color:var(--navy); }
  .ac-grp .quien{ color:var(--t2); font-size:14px; }
  .ac-grp .dentro{ padding:0 14px 12px 32px; font-size:14px; color:var(--t2); }
  .ac-dif{ margin:6px 0 0; padding:0; }
  .ac-dif li{ list-style:none; padding:3px 0; }
  .ac-sug{ background:#FAF8F3; }
  .ac-form{ padding:12px 14px; border-top:1px solid var(--fila); display:grid; gap:8px; }
  .ac-form label{ font-size:13.5px; color:var(--t2); }
  .ac-form input[type=text], .ac-form textarea{ font:inherit; font-size:14.5px; border:1px solid var(--borde); border-radius:9px; padding:8px 10px; width:100%; color:var(--navy); background:#fff; }
  .ac-checks{ display:grid; gap:4px; }
  .ac-checks label{ display:flex; gap:8px; align-items:baseline; color:var(--navy); }

  /* Detalle (lateral en PC, pantalla completa en móvil) */
  .ac-lado{ position:fixed; z-index:650; top:0; right:0; bottom:0; width:min(460px,100%); background:#fff; border-left:1px solid var(--borde); box-shadow:-16px 0 30px -26px rgba(46,66,86,.45); overflow:auto; overscroll-behavior:contain; }
  .ac-lado[hidden]{ display:none; }
  .ac-lado .cab{ display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid var(--borde); position:sticky; top:0; background:#fff; z-index:2; }
  .ac-lado .cab .x{ margin-left:auto; }
  .ac-lado .in{ padding:14px 16px 40px; }
  .ac-lado h3{ margin:2px 0 4px; font-family:var(--fuente-titulo); font-size:22px; line-height:1.15; color:var(--navy); }
  .ac-quien{ color:var(--t3); font-size:14px; }
  .ac-sec{ border-top:1px solid var(--fila); padding:12px 0; font-size:14.5px; line-height:1.45; }
  .ac-sec > b.r{ display:block; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--t3); margin-bottom:5px; }
  .ac-sec .nota{ color:var(--t3); font-size:13px; margin-top:6px; }
  .ac-cita{ color:var(--t2); }
  .ac-aviso{ background:#FFF8E6; border:1px solid #EBD9A6; border-radius:10px; padding:9px 12px; font-size:14px; margin:10px 0 0; color:#4F3E00; }
  .ac-ausbox{ background:#FBF4EC; border:1px solid #EAD9C2; border-radius:10px; padding:9px 12px; font-size:14px; margin:10px 0 0; }
  .ac-plan{ font-size:14px; }
  .ac-bl{ margin:0 0 9px; }
  .ac-bl > b{ display:block; color:var(--navy); font-size:13.5px; }
  .ac-bl ul{ margin:3px 0 0; padding:0 0 0 16px; }
  .ac-bl li{ margin:2px 0; color:var(--t2); }
  .ac-bl li .ex{ color:var(--t3); font-size:13px; }
  .ac-bl li .det{ display:block; color:var(--t3); font-size:13px; }
  .ac-bl li .hz{ display:inline-block; margin-left:6px; font-size:12px; font-weight:600; color:#2F6A3D; background:#EAF3EC; border-radius:6px; padding:0 6px; }
  .ac-bl .pie{ color:var(--t3); font-size:13px; margin-top:3px; font-style:italic; }
  .ac-dif2 > summary{ cursor:pointer; color:var(--azul,#2F6FA8); font-weight:600; }
  .ac-menos{ background:#FBEDE8; color:#8F3F24; text-decoration:line-through; padding:2px 5px; border-radius:4px; display:block; margin-top:4px; font-size:13.5px; }
  .ac-mas{ background:#E9F4EC; color:#2F6A3D; padding:2px 5px; border-radius:4px; display:block; margin-top:3px; font-size:13.5px; }
  .ac-int{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:8px; }
  .ac-int label{ font-size:13px; color:var(--t3); display:grid; gap:3px; }
  .ac-int input, .ac-int select{ font:inherit; font-size:14px; border:1px solid var(--borde); border-radius:8px; padding:7px 9px; color:var(--navy); background:#fff; width:100%; }
  .ac-int .ancho{ grid-column:1 / -1; }
  .ac-obs{ border-left:3px solid #D9D2C3; padding:2px 0 2px 9px; margin:6px 0; color:var(--t2); }
  .ac-obs small{ display:block; color:var(--t3); font-size:12.5px; }
  .ac-fondo{ position:fixed; inset:0; z-index:640; background:rgba(46,66,86,.35); }
  .ac-fondo[hidden]{ display:none; }

  /* Diálogo (publicar, imprimir) */
  .ac-dlg{ position:fixed; z-index:720; left:50%; top:50%; transform:translate(-50%,-50%); width:min(520px,calc(100% - 24px)); max-height:calc(100vh - 40px); overflow:auto; background:#fff; border-radius:14px; box-shadow:0 24px 60px -20px rgba(30,45,65,.55); padding:18px 18px 16px; }
  .ac-dlg h3{ margin:0 0 6px; font-family:var(--fuente-titulo); color:var(--navy); font-size:20px; }
  .ac-dlg p, .ac-dlg li{ font-size:14.5px; color:var(--t2); line-height:1.45; }
  .ac-dlg .pie{ display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  .ac-dlg label.op{ display:flex; gap:8px; align-items:flex-start; font-size:14.5px; color:var(--navy); margin:8px 0; }
  .ac-dlg-fondo{ position:fixed; inset:0; z-index:710; background:rgba(46,66,86,.45); }

  .ac-toast{ position:fixed; left:50%; bottom:28px; transform:translate(-50%,14px); opacity:0; transition:.22s; z-index:800; background:var(--navy,#2E4256); color:#fff; font-size:14px; padding:10px 18px; border-radius:999px; max-width:calc(100% - 32px); text-align:center; pointer-events:none; }
  .ac-toast.ver{ opacity:1; transform:translate(-50%,0); } .ac-toast.err{ background:#B0563A; }
  body.mm-tab-on .ac-toast{ bottom:104px; }

  /* ===== Móvil ===== */
  .ac-dias{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; margin:0 0 10px; }
  .ac-dias button{ font:inherit; border:1px solid var(--borde); background:#fff; border-radius:10px; padding:6px 2px; font-weight:700; color:var(--t2); font-size:13.5px; text-align:center; cursor:pointer; min-height:48px; }
  .ac-dias button small{ display:block; font-weight:500; font-size:12px; color:var(--t3); }
  .ac-dias button.hoy{ border-color:var(--ac); }
  .ac-dias button.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .ac-dias button.on small{ color:#D6DCE8; }
  .ac-fila-m{ background:#fff; border:1px solid var(--borde); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .ac-fila-m > .ac-nom{ margin-bottom:6px; }
  .ac-dia-m{ font-weight:700; color:var(--navy); font-size:14px; margin:12px 0 5px; }
  .ac-cond{ margin:0 0 10px; }
  .ac-cond > summary{ cursor:pointer; font-weight:600; color:var(--navy); font-size:14.5px; padding:6px 0; }
  .ac-cond .ac-barra{ margin-top:6px; }
  .ac-avisos-m{ background:#fff; border:1px solid var(--borde); border-radius:12px; margin:0 0 12px; }
  .ac-avisos-m > summary{ cursor:pointer; padding:11px 14px; font-weight:700; color:var(--navy); list-style:none; }
  .ac-avisos-m > summary::-webkit-details-marker{ display:none; }
  .ac-avisos-m > summary small{ display:block; font-weight:500; color:var(--t3); font-size:13px; margin-top:2px; }
  .ac-avisos-m .ac-caja{ border:0; border-top:1px solid var(--borde); border-radius:0; margin:0; }
  @media (max-width:759px){
    .ac-grid2{ grid-template-columns:minmax(0,1fr); }
    .ac-top h1{ font-size:23px; }
    .ac-barra .ac-btn{ padding:8px 10px; }
    .ac-vistas{ margin-left:0; }
    .ac-lado{ width:100%; border-left:0; }
    .ac-int{ grid-template-columns:minmax(0,1fr); }
    .ac-grp .dentro{ padding-left:14px; }
    .ac-top{ gap:8px; margin-bottom:8px; }
    .ac-top h1{ font-size:20px; }
    .ac-prueba{ font-size:11.5px; padding:1px 7px; }
    .ac-fila2{ display:flex; gap:6px; align-items:center; margin:0 0 8px; }
    .ac-fila2 .ac-sel{ flex:1 1 0; width:0; min-width:0; min-height:36px; font-size:13.5px; padding:6px 8px; }
    .ac-fila2 .ac-seg{ flex:0 0 auto; }
    .ac-fila2 .ac-seg button{ padding:7px 10px; min-height:34px; font-size:13.5px; }
    .ac-barra{ gap:6px; margin-bottom:8px; }
    .ac-barra .ac-btn{ min-height:36px; padding:6px 10px; font-size:13.5px; }
    .ac-barra .ac-seg button{ padding:6px 10px; min-height:34px; font-size:13.5px; }
    .ac-cifras-m{ display:flex; flex-wrap:wrap; gap:2px 12px; font-size:13.5px; color:var(--t2); margin:0 0 8px; }
    .ac-cifras-m b{ color:var(--navy); font-family:var(--fuente-display); font-size:16px; margin-right:3px; }
    .ac-dias{ margin-bottom:6px; }
    .ac-dias button{ min-height:44px; padding:4px 2px; }
    .ac-filtros-m{ background:#fff; border:1px solid var(--borde); border-radius:12px; padding:10px; margin:0 0 10px; }
    .ac-acciones .ac-btn{ flex:1 1 auto; justify-content:center; }
    .ac-caja.hoy-c{ border:0; background:transparent; }
    .ac-caja.hoy-c > h2{ padding:6px 2px 8px; border-bottom:0; }
    .ac-hoy{ padding:0; }
    .hg-in{ padding:0 10px 10px; }

  /* ===== Hoy: el entrenamiento completo, la lista y los avisos ===== */

  .ac-tm-f{ color:var(--navy); font-size:14px; }

  /* Editor: el planificador, encima de la semana (no se pierde la posición) */
  .ac-ed{ position:fixed; z-index:1000; inset:0; background:rgba(46,66,86,.38); display:flex; justify-content:flex-end; }

  .ac-lista-pub label small{ display:block; color:var(--t3); font-size:12.5px; }
  .ac-res{ margin:10px 0 0; padding:0; }
  .ac-res li{ list-style:none; border-top:1px solid var(--fila); padding:8px 2px; font-size:14px; color:var(--t2); }
  .ac-res li b{ color:var(--navy); }
  .ac-res .salta{ color:#8F3F24; }
  .ac-res .acc{ display:block; font-size:13px; color:var(--t3); margin-top:2px; }
  .ac-mini-nota{ font-size:13px; color:var(--t3); margin:6px 0 0; line-height:1.4; }

  /* Impresión: solo el entrenamiento del día */
  #ac-imp{ display:none; }

    @page{ margin:12mm; }
  }
</style>

<body>
  <div id="ac"><p class="ac-nada">Cargando…</p></div>
  <div class="ac-fondo" id="ac-fondo" hidden></div>

  <div class="ac-toma" id="ac-toma" hidden><div class="ac-toma-caja" role="dialog" aria-modal="true" aria-label="Apuntar en pista"><div id="ac-toma-in"></div></div></div>
  <div class="ac-ed" id="ac-ed" hidden><div class="ac-ed-caja" role="dialog" aria-modal="true" aria-label="Editor de la sesión"><div class="ac-ed-cargando" id="ac-ed-carga">Abriendo el editor…</div></div></div>
  <div class="ac-toast" id="ac-toast" role="status" aria-live="polite"></div>
  <div id="ac-imp"></div>
<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('ac');
  var lado = document.getElementById('ac-lado');
  var fondo = document.getElementById('ac-fondo');
  var toastEl = document.getElementById('ac-toast');
  var imp = document.getElementById('ac-imp');
  var Q = new URLSearchParams(location.search);

  /* ---------- utilidades ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function leer(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function guardar(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var _t; function avisar(m,err){ toastEl.textContent=m; toastEl.className='ac-toast ver'+(err?' err':''); clearTimeout(_t); _t=setTimeout(function(){ toastEl.className='ac-toast'; }, err?4200:2200); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function isoDe(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function deISO(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function sumar(s,n){ var d=deISO(s); d.setDate(d.getDate()+n); return isoDe(d); }
  function lunesDe(s){ var d=deISO(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return isoDe(d); }
  function hoyISO(){ return isoDe(new Date()); }
  var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var MES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DS=['dom','lun','mar','mié','jue','vie','sáb'];
  var DS_L=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var DS_I=['D','L','M','X','J','V','S'];
  function fCorta(s){ var d=deISO(s); return DS[d.getDay()]+' '+d.getDate(); }
  function fMedia(s){ var d=deISO(s); return d.getDate()+' '+MES[d.getMonth()]; }
  function fLarga(s){ var d=deISO(s); return DS_L[d.getDay()]+' '+d.getDate()+' de '+MES_L[d.getMonth()]; }
  function hhmm(t){ return t ? String(t).slice(0,5) : ''; }
  function fechaHora(ts){ if(!ts) return ''; var d=new Date(ts); return d.getDate()+' '+MES[d.getMonth()]+' · '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function plural(n, uno, varios){ return n+' '+(n===1?uno:varios); }
  function capital(s){ s=String(s||'').trim(); if(!s) return s; if(s===s.toUpperCase()) s=s.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase();}); return s; }
  function esMovil(){ return window.innerWidth < 760; }
  /* Que no se partan números ni distancias: «34‑35″», «20 m». Sobre texto ya escapado. */

  /* ---------- consultas sobre los datos ---------- */

  /* Plazo del feedback: el día (más los días de margen) a la hora límite, y

  /* ---------- texto del plan ---------- */
  function filaPartes(f){
    var ex = [];
    if (f.series) ex.push(f.distancia ? f.series+'×'+f.distancia : f.series+' series');
    else if (f.distancia) ex.push(f.distancia);
    if (f.ritmo) ex.push(f.ritmo);
    if (f.carga) ex.push(f.carga);
    if (f.descanso) ex.push('rec. '+f.descanso);
    if (f.calzado) ex.push(f.calzado);
    return { main:String(f.ejercicio||'').trim(), extra:ex.join(' · '), det:String(f.detalle||'').trim() };
  }
  function filaTxt(f){ var p=filaPartes(f); return [p.main, p.extra].filter(Boolean).join(' · '); }
  var NO_PRINC = /calentamiento|vuelta a la calma|enfriamiento|activaci/i;
  /* Lo de la casilla: la parte principal resumida, sin cálculos. Solo junta
     «Bloque 1/2 … Bloque 2/2» cuando dicen exactamente lo mismo. */
  function principal(s){
    var b = s.bloques||[];
    var pp = b.filter(function(x){ return /principal/i.test(x.etiqueta||''); });
    if (!pp.length) pp = b.filter(function(x){ return !NO_PRINC.test(x.etiqueta||''); });
    if (!pp.length) pp = b;
    var L = [];
    pp.forEach(function(x){ (x.filas||[]).forEach(function(f){ var t=filaTxt(f); if(t) L.push(t); }); });
    return compactar(L);
  }
  function compactar(L){
    var out = [], i = 0;
    while (i < L.length){
      var m = /^Bloque\s+1\/(\d+):\s*(.+)$/i.exec(L[i]);
      if (m){
        var n = +m[1], resto = m[2], ok = n>1 && i+n<=L.length;
        for (var k=1; ok && k<n; k++){ var mk=/^Bloque\s+(\d+)\/(\d+):\s*(.+)$/i.exec(L[i+k]); ok = !!mk && +mk[1]===k+1 && +mk[2]===n && mk[3]===resto; }
        if (ok){ out.push(n+' bloques: '+resto); i+=n; continue; }
      }
      out.push(L[i]); i++;

    return out;
  }
  /* Objetivo + título, sin repetir lo mismo dos veces («Preventivos ·
     Preventivo + 15′ CC» → solo el título; «Técnica de vallas · Vallas» →
     solo el objetivo). */
  function tituloDe(s){
    var t = String(s.titulo||'').trim(), o = String(s.objetivo||'').trim();
    var tl = t.toLowerCase(), ol = o.toLowerCase();
    if (!o) return t || 'Sesión';
    if (!t) return o;
    if (tl===ol || tl.indexOf(ol)!==-1 || tl.indexOf(ol.slice(0,6))===0) return t;
    if (ol.indexOf(tl)!==-1) return o;
    return o+' · '+t;
  }
  /* En la casilla, corta: «Exigencia alta · neuromuscular» (el nivel de cada
     componente solo si difiere del global). El detalle lleva la completa. */
  function exigCorta(s){
    if (!s.exigencia && !s.exigencia_neuro && !s.exigencia_meta) return '';
    var g = s.exigencia, c = [];
    if (s.exigencia_neuro) c.push(s.exigencia_neuro===g ? 'neuromuscular' : 'neuromuscular '+s.exigencia_neuro);
    if (s.exigencia_meta) c.push(s.exigencia_meta===g ? 'metabólica' : 'metabólica '+s.exigencia_meta);
    return (g ? 'Exigencia '+g : 'Exigencia') + (c.length ? ' · '+c.join(' y ') : '');
  }
  function exigTxt(s){
    if (!s.exigencia && !s.exigencia_neuro && !s.exigencia_meta) return '';

    if (s.exigencia) p.push('exigencia '+s.exigencia);
    if (s.exigencia_neuro) p.push('neuromuscular '+s.exigencia_neuro);
    if (s.exigencia_meta) p.push('metabólica '+s.exigencia_meta);

  /* ---------- estados (tres dimensiones, con texto) ---------- */
  function tag(cls, txt){ return '<span class="ac-tag '+cls+'">'+esc(txt)+'</span>'; }
  function estado(s, aid){
    var r = D.reg[s.id+'|'+aid] || null, au = ausDeSesion(s, aid), rv = revDe(s.id);
    var t = [];
    if (s.archivada_en) t.push(tag('t-sind','Sesión archivada'));
    // 1. Publicación
    if (!s.publicada && !s.archivada_en) t.push(tag('t-bor','Borrador'));
    if (rv) t.push(tag('t-rev','Revisión pendiente'));
    if (s.sustituye_a && D.sesPorId[s.sustituye_a]) t.push(tag('t-v','Sustituye a «'+tituloDe(D.sesPorId[s.sustituye_a])+'»'));
    // 2. Ejecución y 3. Revisión
    var re = D.regEnt[s.id+'|'+aid] || null, modo = modoDe(aid);
    var ej = null, pend = false, pendEnt = false;
    if (r){
      ej = r.estado==='a_medias' ? 'parcial' : r.estado==='no_hecho' ? 'nohecha' : 'hecha';
      if (ej==='hecha') t.push(tag('t-hecha','Realizada'));

      if (re) t.push(tag('t-v','También tu registro'));
    } else if (re){

      ej = re.estado==='a_medias' ? 'parcial' : re.estado==='no_hecho' ? 'nohecha' : 'hecha';
      t.push(tag(ej==='hecha'?'t-hecha':ej==='parcial'?'t-parcial':'t-nohecha',
        (ej==='hecha'?'Realizada':ej==='parcial'?'Parcial'+(re.completado_pct!=null?' · '+re.completado_pct+' %':''):'No realizada')+' · registro del entrenador'));
    } else if (au){

    // Apuntar en pista NO cambia la ejecución: solo se dice que hay datos tuyos.
    if (tomaDe(s.id, aid).length) t.push(tag('t-v','Datos de pista'));
    return { r:r, re:re, au:au, rv:rv, ej:ej, pend:pend, pendEnt:pendEnt, modo:modo, tags:t.join('') };
  }

  /* ---------- casillas ---------- */
  function casillaSesion(s, aid, opts){
    opts = opts || {};
    var mo = MOMENTO[s.momento] ? MOMENTO[s.momento]+(s.hora?' · '+hhmm(s.hora):'') : (s.hora && opts.varias ? hhmm(s.hora) : '');
    var sel = abierto && abierto.sid===s.id && abierto.aid===aid ? ' sel' : '';
    var data = ' data-abrir="'+s.id+'|'+aid+'"';
    if (s.clase_dia==='descanso') return '<button type="button" class="ac-cs des'+sel+'"'+data+'>'+(mo?'<span class="mo">'+esc(mo)+'</span>':'')+'Descanso'+(!s.publicada?' '+tag('t-bor','Borrador'):'')+(revDe(s.id)?' '+tag('t-rev','Revisión pendiente'):'')+'</button>';
    if (D.sust[s.id]) return '<button type="button" class="ac-cs sust'+sel+'"'+data+'>'+(mo?'<span class="mo">'+esc(mo)+'</span>':'')+'<span class="ti">'+esc(tituloDe(s))+'</span><span class="l3">Sustituida por «'+esc(tituloDe(D.sust[s.id]))+'»</span></button>';
    var e = estado(s, aid);
    if (s.clase_dia==='ausencia' || e.au){
      var mot = e.au ? (MOTIVO_AUS[e.au.motivo_tipo] || e.au.motivo || 'sin motivo') : '';
      return '<button type="button" class="ac-cs aus'+sel+'"'+data+'>'+(mo?'<span class="mo">'+esc(mo)+'</span>':'')+
        '<span class="ti">Ausente'+(mot?' · '+esc(mot):'')+'</span>'+
        (s.clase_dia!=='ausencia' ? '<span class="l3">Previsto: '+esc(tituloDe(s))+'</span>' : '<span class="l3">'+esc(s.titulo||'')+'</span>')+
        (e.r ? e.tags : tag('t-nohecha','No realizada · ausencia'))+'</button>';
    }
    var pr = principal(s), MAXL = 6;
    var lineas = pr.slice(0, MAXL).map(function(x){ return '<span class="ln">'+nb(esc(x))+'</span>'; }).join('')+
      (pr.length>MAXL ? '<span class="mas">+'+(pr.length-MAXL)+' más en el detalle</span>' : '');
    return '<button type="button" class="ac-cs'+(s.publicada?'':' borr')+sel+'"'+data+'>'+(mo?'<span class="mo">'+esc(mo)+'</span>':'')+
      '<span class="ti">'+nb(esc(tituloDe(s)))+'</span>'+
      (pr.length ? '<span class="l2">'+lineas+'</span>' : '')+
      e.tags+'</button>';
  }
  function casilla(aid, f){
    var L = sesDe(aid, f), A = ausDia(aid, f);
    if (!L.length){
      if (A.length){ var x=A[0]; return '<div class="ac-cs aus" style="cursor:default"><span class="ti">Ausente · '+esc(MOTIVO_AUS[x.motivo_tipo]||x.motivo||'sin motivo')+'</span><span class="l3">Sin sesión prevista</span></div>'; }
      // Un hueco se planifica desde aquí: abre el editor con ese atleta y ese día.
      return '<button type="button" class="ac-cs sin" data-nueva="'+aid+'|'+f+'" aria-label="Planificar '+esc(nombreDe(aid))+' el '+esc(fCorta(f))+'" title="Planificar este día">Sin planificar<span class="pl">＋ Planificar</span></button>';
    }
    return L.map(function(s){ return casillaSesion(s, aid, { varias:L.length>1 }); }).join('');
  }
  function resumenDia(f, atls){
    var at=0, ses=0, des=0, aus=0, sin=0, bor=0;
    atls.forEach(function(a){
      var L = sesDe(a.id, f), A = ausDia(a.id, f);
      var ok = L.filter(function(s){ return esEntreno(s) && !ausDeSesion(s, a.id); });
      if (ok.length){ at++; ses += ok.length; }
      if (L.some(function(s){ return s.clase_dia==='descanso'; })) des++;
      if (A.length || L.some(function(s){ return s.clase_dia==='ausencia'; })) aus++;
      if (!L.length && !A.length) sin++;
      bor += L.filter(function(s){ return !s.publicada && !s.archivada_en; }).length;
    });
    return { at:at, ses:ses, des:des, aus:aus, sin:sin, bor:bor };
  }
  function resumenTxt(x){
    var p = [];
    if (x.at) p.push(plural(x.at,'atleta entrena','atletas entrenan')+' · '+plural(x.ses,'sesión','sesiones'));
    if (x.des) p.push(plural(x.des,'descanso','descansos'));
    if (x.aus) p.push(plural(x.aus,'ausencia','ausencias'));
    if (x.sin) p.push(x.sin+' sin planificar');
    if (x.bor) p.push(plural(x.bor,'borrador','borradores'));
    return p.join(' · ') || '—';
  }

  /* ---------- filtros ---------- */
  function atletasFiltrados(){
    var L = D.atl;
    if (ST.fAtleta) L = L.filter(function(a){ return a.id===ST.fAtleta; });
    if (ST.fGT){
      var sids = D.gtm.filter(function(m){ return m.grupo_trabajo_id===ST.fGT; }).map(function(m){ return m.sesion_id; });
      var quien = {}; sids.forEach(function(id){ var s=D.sesPorId[id]; if(s) atletasDe(s).forEach(function(a){ quien[a]=1; }); });
      L = L.filter(function(a){ return quien[a.id]; });
    }
    return L;
  }

  /* ---------- cabecera común ---------- */
  function cabecera(titulo, sub){

      (sub?'<p class="ac-sub">'+sub+'</p>':'');

  function diasSemana(){ var L=[]; for (var i=0;i<7;i++) L.push(sumar(ST.semana,i)); return L; }
  function pintarSemana(){

    var optG = D.gt.length ? '<option value="">Todos los grupos de trabajo</option>'+D.gt.map(function(g){ return '<option value="'+g.id+'"'+(g.id===ST.fGT?' selected':'')+'>'+esc(g.nombre)+' · '+fCorta(g.fecha)+'</option>'; }).join('') : '';

      '<span class="ac-seg" role="group" aria-label="Detalle de las casillas"><button type="button" data-modo="compacta" class="'+(ST.modo==='compacta'?'on':'')+'">Compacta</button><button type="button" data-modo="detallada" class="'+(ST.modo==='detallada'?'on':'')+'">Detallada</button></span>';
    var publicar = borr.length ? '<button type="button" class="ac-btn pri" data-publicar="1">Publicar borradores ('+borr.length+')…</button>' : '';
    var segBtn = '<button type="button" class="ac-btn" data-seguimiento="1">Seguimiento…</button>';
    var copiarBtn = '<button type="button" class="ac-btn" data-copiar="1">Copiar semana…</button>';
    var leyenda = '<b>Planificar:</b> toca un hueco («Sin planificar») para crear la sesión de ese atleta ese día; toca una sesión para verla, editarla o publicarla. · <b>Publicación:</b> «Borrador» (borde discontinuo) o publicada (sin etiqueta). · <b>Ejecución</b> (lo que dice el atleta): realizada · parcial · no realizada · sin datos. «Sin datos» no es «no hecha». · <b>Revisión:</b> feedback nuevo (sin revisar) · «sin datos · feedback pendiente» (solo cuando ya pasó el plazo: '+hhmm(ST.g.feedback_hora_limite)+' del día, y nunca antes de que acabe la sesión) · revisar (con su motivo). · «Plan cambiado después»: el atleta respondió una versión anterior. · Los descansos y las ausencias no cuentan como sesiones.';

    if (esMovil()){
      if (!ST.diaMovil || dias.indexOf(ST.diaMovil)===-1) ST.diaMovil = dias.indexOf(hoy)!==-1 ? hoy : dias[0];
      var d = ST.diaMovil;
      var navM = '<button type="button" class="ac-btn" data-sem="-1" aria-label="Semana anterior">‹</button><button type="button" class="ac-btn" data-sem="0">Esta semana</button><button type="button" class="ac-btn" data-sem="1" aria-label="Semana siguiente">›</button>'+
        '<span class="ac-esp"></span><button type="button" class="ac-btn" data-filtrosm="1" aria-expanded="'+(!!ST.filtrosM)+'">Filtros '+(ST.filtrosM?'▴':'▾')+'</button>';
      var h = cabecera(fMedia(dias[0])+' – '+fMedia(dias[6]), '')+
        '<div class="ac-barra">'+navM+'</div>'+
        (ST.filtrosM ? '<div class="ac-filtros-m"><div class="ac-barra">'+filtros+'</div>'+
          '<div class="ac-barra"><select class="ac-sel" id="ac-movat" aria-label="Ver la semana de un atleta"><option value="">Ver la semana de un atleta…</option>'+D.atl.map(function(a){ return '<option value="'+a.id+'"'+(a.id===ST.movAtleta?' selected':'')+'>'+esc(a._n)+'</option>'; }).join('')+'</select>'+segBtn+'</div>'+
          '<div class="ac-barra">'+copiarBtn+publicar+'</div>'+'<details class="ac-ley"><summary>Qué significa cada etiqueta</summary>'+leyenda+'</details></div>' : '');
      if (ST.movAtleta){
        var a = atleta(ST.movAtleta);
        h += '<div class="ac-barra"><button type="button" class="ac-btn" data-movat="">‹ Volver a los días</button></div>'+
          '<div class="ac-fila-m '+ST.modo+'"><div class="ac-nom">'+esc(a._n)+'<small>Su semana</small></div>'+
          dias.map(function(f){ return '<div class="ac-dia-m">'+fCorta(f)+(f===hoy?' · hoy':'')+'</div>'+casilla(a.id, f); }).join('')+'</div>';
      } else {
        h += '<div class="ac-dias" role="tablist" aria-label="Día de la semana">'+dias.map(function(f){
            var dd = deISO(f);
            return '<button type="button" role="tab" aria-selected="'+(f===d)+'" data-diam="'+f+'" class="'+(f===d?'on ':'')+(f===hoy?'hoy':'')+'">'+DS_I[dd.getDay()]+'<small>'+dd.getDate()+(f===hoy?' · hoy':'')+'</small></button>'; }).join('')+'</div>'+
          '<p class="ac-sub" style="margin:0 0 8px;font-size:13.5px">'+esc(fCorta(d))+' · '+esc(resumenTxt(resumenDia(d, atls)))+'</p>'+
          '<div class="'+ST.modo+'">'+(atls.length ? atls.map(function(a){ return '<div class="ac-fila-m"><button type="button" class="ac-nom" data-movat="'+a.id+'" aria-label="Ver la semana de '+esc(a._n)+'">'+esc(a._n)+' ›</button>'+casilla(a.id, d)+'</div>'; }).join('') : '<p class="ac-nada">Nadie con ese filtro.</p>')+'</div>';
      }
      wrap.innerHTML = h;

    }

    var h = cabecera(tit, 'Atletas en filas, días en columnas. Toca una sesión para verla, editarla o publicarla; un hueco, para planificarlo.')+
      '<div class="ac-barra">'+nav+filtros+segBtn+'<span class="ac-esp"></span>'+copiarBtn+publicar+'</div>'+
      '<div class="ac-scroll '+ST.modo+'"><table class="ac-sem"><thead><tr><th class="at">Atleta</th>'+
      dias.map(function(f){ return '<th class="'+(f===hoy?'hoy':'')+'">'+fCorta(f)+' '+MES[deISO(f).getMonth()]+(f===hoy?'<small>Hoy</small>':'')+'</th>'; }).join('')+'</tr></thead><tbody>';
    if (!atls.length) h += '<tr><td class="at"></td><td colspan="7" class="ac-nada">Nadie con ese filtro.</td></tr>';
    atls.forEach(function(a){
      var pr = (a.pruebas_principales||[]).slice(0,3).join(' · ');
      var md = modoDe(a.id);
      h += '<tr><td class="at"><div class="ac-nom">'+esc(a._n)+(pr?'<small>'+esc(pr)+'</small>':'')+(md!=='feedback_atleta'?'<span class="modo">'+esc(MODOS[md][0])+'</span>':'')+'</div></td>'+
        dias.map(function(f){ return '<td class="'+(f===hoy?'hoy':'')+'">'+casilla(a.id, f)+'</td>'; }).join('')+'</tr>';
    });
    h += '</tbody><tfoot><tr><td class="at">Resumen</td>'+dias.map(function(f){ return '<td class="'+(f===hoy?'hoy':'')+'">'+esc(resumenTxt(resumenDia(f, atls)))+'</td>'; }).join('')+'</tr></tfoot></table></div>'+
      '<details class="ac-ley"><summary>Qué significa cada etiqueta</summary>'+leyenda+'</details>';
    wrap.innerHTML = h;
    ajustarAlto();
  }
  /* La tabla cabe en lo que queda de pantalla: el pie (resumen) siempre a la
     vista y sin tapar la última fila al bajar. */
  function ajustarAlto(){
    var sc = wrap.querySelector('.ac-scroll'); if (!sc) return;
    var top = sc.getBoundingClientRect().top + window.scrollY;
    sc.style.maxHeight = Math.max(320, window.innerHeight - top - 16) + 'px';
  }

  function nombreDe(aid){ return atleta(aid)._n; }
  /* ================= HOY · dirigir la sesión en pista =================
     Una sesión PREVISTA no es asistencia ni entrenamiento realizado:
       · la asistencia es la de «Pasar lista» (asistencia + ausencias, la misma
         función apo_pasar_lista que usa el panel del entrenador);
       · lo realizado sale de los registros (del atleta o del entrenador).
     Agrupar organiza la pantalla: no modifica ni copia prescripciones. */
  var MOM_ORDEN = ['manana','unica','tarde','sin_especificar'];
  var MOM_TIT = { manana:'Mañana', unica:'Sesión única', tarde:'Tarde', sin_especificar:'Sin especificar el momento' };
  var DISPO = { disponible:'disponible', tocado:'tocado', baja:'de baja' };
  var ASIS = {};   // estado de guardado de la asistencia por atleta: {estado, msg, op}

  function esEntrenoDia(s){ return s.clase_dia==='entreno' && !s.archivada_en && !D.sust[s.id]; }
  function entrenosDelDia(d){
    var L = [];
    D.atl.forEach(function(a){ sesDe(a.id, d).forEach(function(s){ if (esEntrenoDia(s)) L.push({ s:s, aid:a.id }); }); });
    return L;
  }
  function momentosDelDia(d){
    var vis = {}; entrenosDelDia(d).forEach(function(x){ vis[x.s.momento||'unica'] = 1; });
    return MOM_ORDEN.filter(function(m){ return vis[m]; });
  }
  function nombreMom(m){ return MOM_TIT[m||'unica'] || ''; }

  /* ---------- asistencia (la de Pasar lista) ---------- */
  function asisDe(aid){
    var x = D.asis && D.asis[aid];
    if (x && x.presente) return 'presente';
    if ((x && x.presente===false) || ausDia(aid, ST.dia).length) return 'ausente';
    return 'pendiente';
  }
  function asisHTML(aid){
    var e = asisDe(aid), st = ASIS[aid] || {}, au = ausDia(aid, ST.dia)[0], ocupado = st.estado==='guardando';
    var bt = function(v, t){ return '<button type="button" class="'+(e===v?'on '+v:'')+'" data-asis="'+aid+'|'+v+'" aria-pressed="'+(e===v)+'"'+(ocupado?' disabled':'')+'>'+t+'</button>'; };
    return '<span class="ac-asis" role="group" aria-label="Asistencia de '+esc(nombreDe(aid))+'">'+bt('pendiente','<span class="lg">Pendiente</span><span class="ct" aria-hidden="true">Pend.</span>')+bt('presente','Presente')+bt('ausente','Ausente')+'</span>'+
      (e==='ausente' ? '<span class="ac-asis-mot">'+(au ? esc(MOTIVO_AUS[au.motivo_tipo]||au.motivo||'sin motivo')+(au.nota?' · '+esc(au.nota):'') : 'sin motivo apuntado')+'</span>' : '')+
      (st.estado==='guardando' ? '<span class="ac-gd">Guardando…</span>'
        : st.estado==='guardado' ? '<span class="ac-gd ok">Guardado</span>'
        : st.estado==='error' ? '<span class="ac-gd err">No se ha guardado ('+esc(st.msg)+'). <button type="button" class="ac-link" data-asis-reint="'+aid+'">Reintentar</button></span>' : '')+
      '<div class="ac-asis-f" id="asis-f-'+aid+'" hidden></div>';
  }
  function formAusenciaHoy(aid){
    var au = ausDia(aid, ST.dia)[0];
    return '<div class="ac-form" style="padding:8px 0 0;border:0"><label>Motivo <select class="ac-sel" id="asis-mot-'+aid+'">'+Object.keys(MOTIVO_AUS).map(function(k){ return '<option value="'+k+'"'+(au && au.motivo_tipo===k?' selected':'')+'>'+esc(MOTIVO_AUS[k])+'</option>'; }).join('')+'</select></label>'+
      '<label>Nota (opcional)<input type="text" id="asis-nota-'+aid+'" maxlength="300" value="'+esc(au && au.nota || '')+'"></label>'+
      '<div class="ac-mini-nota" style="margin-top:0">El plan previsto se conserva. Si al final viene, márcalo presente.</div>'+
      '<div><button type="button" class="ac-btn pri mini" data-asis-aus-ok="'+aid+'">Guardar ausencia</button></div></div>';
  }
  /* Guarda la asistencia de un atleta. Si falla, no se da por guardado y se
     puede reintentar: la ausencia se actualiza en vez de duplicarse (una por
     atleta y día) y la lista es un «upsert» por atleta, día y grupo. */
  async function guardarAsis(aid, valor, aus){
    ASIS[aid] = { estado:'guardando', op:[valor, aus] }; pintar();
    try {
      var a0 = ausDia(aid, ST.dia)[0];
      if (aus==='quitar'){ if (a0){ var rd = await sb.from('ausencias').delete().eq('id', a0.id); if (rd.error) throw rd.error; } }
      else if (aus){
        var ra = a0 ? await sb.from('ausencias').update({ motivo_tipo:aus.motivo_tipo, nota:aus.nota }).eq('id', a0.id)
                    : await sb.from('ausencias').insert({ atleta_id:aid, fecha:ST.dia, motivo_tipo:aus.motivo_tipo, nota:aus.nota, registrado_por: perfil && perfil.id });
        if (ra.error) throw ra.error;
      }
      var m = {}; m[aid] = valor;
      var s0 = sesDe(aid, ST.dia).filter(esEntrenoDia)[0];
      var r = await sb.rpc('apo_pasar_lista', { p_grupo:ST.g.grupo_id, p_fecha:ST.dia, p_marcas:m, p_sesion: s0 ? s0.id : null });
      if (r.error) throw r.error;
      ASIS[aid] = { estado:'guardado' };
      await recargar();
    } catch(err){
      ASIS[aid] = { estado:'error', msg:(err && err.message) || 'sin conexión', op:[valor, aus] };
      pintar();
    }
  }

  /* ---------- restricciones (Lesiones y disponibilidad) ---------- */
  function restrDe(aid){ return (D.les||[]).filter(function(l){ return l.atleta_id===aid; }); }
  function restrTxt(l){
    return [l.zona, DISPO[l.disponibilidad] || l.disponibilidad].filter(Boolean).join(' · ') + (l.restriccion ? ': «'+l.restriccion+'»' : '');
  }
  function restrBadge(aid){
    var L = restrDe(aid); if (!L.length) return '';
    var baja = L.some(function(l){ return l.disponibilidad==='baja'; });
    return '<span class="ac-restr'+(baja?' baja':'')+'" title="'+esc(L.map(restrTxt).join(' | '))+'">'+(baja?'De baja':'Restricción')+': '+esc(L.map(function(l){ return l.zona; }).filter(Boolean).join(', ') || 'ver avisos')+'</span>';
  }

  /* ---------- el plan, completo y en su orden ---------- */
  function recTxt(seg){ seg = Math.round(+seg||0); if (!seg) return ''; var m = Math.floor(seg/60), s = seg%60; return m ? m+'′'+(s?(s<10?'0':'')+s+'″':'') : s+'″'; }
  function recBloque(b){ var r = b && b.rec_bloque; return recTxt(r && typeof r==='object' ? r.segundos : r); }
  function lineasDe(b){
    return compactar((b.filas||[]).map(function(f){
      var p = filaPartes(f), t = filaTxt(f);
      if (f.rir) t += ' · RIR '+f.rir;
      if (p.det) t += ' — '+p.det;
      if (f.observaciones) t += ' · '+f.observaciones;
      return t;
    }).filter(Boolean));
  }
  function firmaBloque(b){ return JSON.stringify([lineasDe(b), b.matiz||'', b.nota_cab||'', b.nota_pie||'', recBloque(b)]); }
  function bloqueCuerpoHTML(b){
    var L = lineasDe(b), rb = recBloque(b);
    return (b.nota_cab?'<div class="hb-n">'+esc(b.nota_cab)+'</div>':'')+
      (L.length?'<ul>'+L.map(function(l){ return '<li>'+nb(esc(l))+'</li>'; }).join('')+'</ul>':'<div class="hb-n">Sin contenido escrito.</div>')+
      (b.nota_pie?'<div class="hb-n">'+esc(b.nota_pie)+'</div>':'')+
      (rb?'<div class="hb-rec">Descanso después del bloque: '+esc(rb)+'</div>':'');
  }
  function bloqueHTML(b, extra){
    return '<div class="hb"><div class="hb-cab"><b>'+esc(b.etiqueta||'Sesión')+'</b>'+(b.matiz?' <span class="mz">— '+esc(b.matiz)+'</span>':'')+(extra||'')+'</div>'+bloqueCuerpoHTML(b)+'</div>';
  }
  /* Etiquetas de bloque de varias sesiones, respetando el orden del plan. */
  function ordenEtiquetas(lista){
    var out = [];
    lista.forEach(function(s){ var prev = -1; (s.bloques||[]).forEach(function(b){ var e = b.etiqueta||''; var i = out.indexOf(e); if (i===-1){ out.splice(prev+1, 0, e); prev = prev+1; } else prev = i; }); });
    return out;
  }
  function bloqueDe(s, e){ return (s.bloques||[]).filter(function(b){ return (b.etiqueta||'')===e; })[0] || null; }

  /* ---------- tarjeta de un grupo de trabajo ---------- */
  function grupoDeBloque(m, e, gExcepto){
    var gs = D.gt.filter(function(g){ return g.fecha===ST.dia && g.id!==gExcepto; });
    for (var i=0;i<gs.length;i++){
      var mm = D.gtm.filter(function(x){ return x.grupo_trabajo_id===gs[i].id && x.sesion_id===m.s.id; })[0];
      if (mm && (!mm.bloque || mm.bloque===e)) return gs[i];
    }
    return null;
  }
  function tarjetaGrupo(g, abierta){
    var todos = miembrosGT(g, true), ms = todos.filter(function(m){ return !ausDeSesion(m.s, m.aid); });
    var bloque = todos.length && todos.every(function(m){ return m.bloque===todos[0].bloque; }) ? todos[0].bloque : null;
    var moms = []; todos.forEach(function(m){ var mo = m.s.momento||'unica'; if (moms.indexOf(mo)===-1) moms.push(mo); });
    var h = '<details class="hg"'+(abierta?' open':'')+' data-gt="'+g.id+'"><summary><b>'+esc(g.nombre)+'</b>'+
      (bloque?'<span class="quien">· solo «'+esc(bloque)+'»</span>':'')+'<span class="quien">'+plural(todos.length,'atleta','atletas')+'</span>'+
      (moms.length>1?'<span class="quien">· mañana y tarde</span>':'')+'</summary><div class="hg-in">';
    h += '<div class="hg-at">'+todos.map(function(m){
      return '<div class="hg-a"><button type="button" class="ac-link hg-n" data-abrir="'+m.s.id+'|'+m.aid+'">'+esc(nombreDe(m.aid))+'</button>'+restrBadge(m.aid)+asisHTML(m.aid)+'</div>'; }).join('')+'</div>';
    // Objetivo: una vez si es el mismo; si no, el de cada uno
    var obj = agruparIguales(ms.map(function(m){ return { aid:m.aid, txt:[m.s.objetivo||'—'] }; }));
    if (obj.length===1 && obj[0].txt[0]!=='—') h += '<div class="hg-obj"><span>Objetivo</span> '+esc(obj[0].txt[0])+'</div>';
    else if (obj.length>1) h += '<div class="hg-obj"><span>Objetivo</span> '+obj.map(function(o){ return '<b>'+esc(o.quien)+'</b>: '+esc(o.txt[0]); }).join(' · ')+'</div>';
    // Bloques en el orden del plan: lo común una vez SOLO si es igual de verdad
    ordenEtiquetas(ms.map(function(m){ return m.s; })).forEach(function(e){
      var aqui = [], solos = [], otros = [];
      ms.forEach(function(m){
        var b = bloqueDe(m.s, e); if (!b) return;
        if (!bloque || bloque===e) aqui.push({ m:m, b:b });
        else { var g2 = grupoDeBloque(m, e, g.id); if (g2) otros.push({ m:m, g:g2 }); else solos.push({ m:m, b:b }); }
      });
      if (aqui.length){
        var firmas = {}; aqui.forEach(function(x){ var k = firmaBloque(x.b); (firmas[k] = firmas[k] || []).push(x); });
        var ks = Object.keys(firmas);
        if (ks.length===1) h += bloqueHTML(aqui[0].b, aqui.length>1 ? ' <span class="hb-tag">igual para todos</span>' : '');
        else h += '<div class="hb hb-dif"><div class="hb-cab"><b>'+esc(e||'Sesión')+'</b> <span class="hb-tag dif">cada uno lo suyo</span></div>'+ks.map(function(k){
          var xs = firmas[k];
          return '<div class="hb-ind"><div class="hb-quien">'+esc(xs.map(function(x){ return nombreDe(x.m.aid); }).join(', '))+(xs[0].b.matiz?' <span class="mz">— '+esc(xs[0].b.matiz)+'</span>':'')+'</div>'+bloqueCuerpoHTML(xs[0].b)+'</div>';
        }).join('')+'</div>';
      }
      // Lo que cada uno hace por su cuenta: junto si es exactamente igual
      var fs = {}; solos.forEach(function(x){ var k = firmaBloque(x.b); (fs[k] = fs[k] || []).push(x); });
      Object.keys(fs).forEach(function(k){ var xs = fs[k]; h += '<div class="hb-solo">'+bloqueHTML(xs[0].b, ' <span class="hb-tag">'+esc(xs.map(function(x){ return nombreDe(x.m.aid); }).join(', '))+' · '+(xs.length>1?'cada uno por su cuenta':'por su cuenta')+'</span>')+'</div>'; });
      otros.forEach(function(x){ h += '<div class="hb-otro"><b>'+esc(e)+'</b> · '+esc(nombreDe(x.m.aid))+': con «'+esc(x.g.nombre)+'»</div>'; });
    });
    var aus = todos.filter(function(m){ return ausDeSesion(m.s, m.aid); });
    if (aus.length) h += '<div class="hb-otro">Ausentes: '+esc(aus.map(function(m){ return nombreDe(m.aid); }).join(', '))+' · su plan se conserva (tócalo para verlo).</div>';
    h += avisosGrupo(ms, ST.dia);
    h += '<div class="hg-acc"><button type="button" class="ac-btn mini pri" data-tm-gt="'+g.id+'">Apuntar en pista…</button><button type="button" class="ac-link" data-gt-ajustar="'+g.id+'">Ajustar el grupo</button>'+
      (ms.length>1 ? '<button type="button" class="ac-link" data-aplicar-gt="'+g.id+'">Aplicar la de '+esc(nombreDe(ms[0].aid))+' al resto…</button>' : '')+
      '<button type="button" class="ac-link" data-gt-quitar="'+g.id+'" style="color:#8F3F24">Deshacer el grupo</button></div>'+
      '<div id="gt-aj-'+g.id+'" hidden></div></div></details>';
    return h;
  }

  /* ---------- tarjeta de un atleta (su día completo) ---------- */
  function tarjetaAtleta(aid, d, sesiones, abierta){
    var L = sesiones || sesDe(aid, d), A = ausDia(aid, d);
    var tieneEntreno = L.some(esEntrenoDia);
    var resumen = L.length ? L.map(function(s){ return s.clase_dia==='descanso' ? 'Descanso' : (MOMENTO[s.momento]?MOMENTO[s.momento]+': ':'')+tituloDe(s); }).join(' + ') : (A.length ? 'Ausente · sin sesión' : 'Sin planificar');
    var h = '<details class="hg ha"'+(abierta?' open':'')+'><summary><b>'+esc(nombreDe(aid))+'</b><span class="quien">'+nb(esc(resumen))+'</span>'+
      ((tieneEntreno || A.length) && asisDe(aid)!=='pendiente' ? tag(asisDe(aid)==='presente'?'t-hecha':'t-nohecha', asisDe(aid)==='presente'?'Presente':'Ausente') : '')+restrBadge(aid)+'</summary><div class="hg-in">';
    if (tieneEntreno || A.length) h += '<div class="hg-at"><div class="hg-a">'+asisHTML(aid)+'</div></div>';
    L.forEach(function(s){
      if (s.clase_dia==='descanso'){ h += '<div class="hb-otro">'+(MOMENTO[s.momento]?esc(MOMENTO[s.momento])+': ':'')+'Descanso</div>'; return; }
      var e = estado(s, aid), U = usosGT(d), parte = U.bloques[s.id+'|'+aid] || [], entera = U.entera[s.id+'|'+aid];
      h += '<div class="ha-s"><div class="ha-t">'+(MOMENTO[s.momento]?'<span class="mo">'+esc(MOMENTO[s.momento])+(s.hora?' · '+hhmm(s.hora):'')+'</span>':'')+
        '<button type="button" class="ac-link" data-abrir="'+s.id+'|'+aid+'">'+nb(esc(tituloDe(s)))+'</button>'+e.tags+
        '<button type="button" class="ac-btn mini" data-tm-ses="'+s.id+'|'+aid+'" style="margin-left:auto">Apuntar…</button></div>'+
        (s.objetivo?'<div class="hg-obj"><span>Objetivo</span> '+esc(s.objetivo)+'</div>':'')+
        (entera ? '<div class="hb-otro">Toda la sesión con su grupo de trabajo.</div>' : '')+
        (s.bloques||[]).map(function(b){ return bloqueHTML(b, parte.indexOf(b.etiqueta||'')!==-1 ? ' <span class="hb-tag">con su grupo</span>' : ''); }).join('')+'</div>';
    });
    if (!L.length) h += '<div class="hb-otro">'+(A.length?'Ausencia apuntada; no tiene sesión prevista.':'Sin planificar este día.')+'</div>';
    return h+'</div></details>';
  }

  /* ---------- vistas ---------- */
  function seccionMomento(m, varios, html){ return varios ? '<div class="ac-mom"><h3>'+esc(nombreMom(m))+'</h3>'+html+'</div>' : html; }
  function vistaGrupos(d){
    var moms = momentosDelDia(d), varios = moms.length>1;
    var gts = D.gt.filter(function(g){ return g.fecha===d; });
    var enGrupo = {};
    gts.forEach(function(g){ miembrosGT(g, true).forEach(function(m){ enGrupo[m.s.id+'|'+m.aid] = 1; }); });
    var html = '', primero = true;
    (moms.length ? moms : ['unica']).forEach(function(mo){
      var h = '';
      gts.forEach(function(g){
        var ms = miembrosGT(g, true); if (!ms.length) return;
        if ((ms[0].s.momento||'unica')!==mo) return;
        h += tarjetaGrupo(g, primero); primero = false;
      });
      var sueltos = entrenosDelDia(d).filter(function(x){ return (x.s.momento||'unica')===mo && !enGrupo[x.s.id+'|'+x.aid]; });
      var porAt = {}; sueltos.forEach(function(x){ (porAt[x.aid] = porAt[x.aid] || []).push(x.s); });
      var ids = Object.keys(porAt);
      if (ids.length) h += (gts.length ? '<div class="ac-sub2">Sin grupo de trabajo</div>' : '')+ids.map(function(aid){ var t = tarjetaAtleta(aid, d, porAt[aid], primero && !gts.length); primero = false; return t; }).join('');
      if (h) html += seccionMomento(mo, varios, h);
    });
    // Quien no entrena hoy: una línea
    var des = [], ausSin = [], sinPlan = [];
    D.atl.forEach(function(a){
      var L = sesDe(a.id, d);
      if (L.some(esEntrenoDia)) return;
      if (L.some(function(s){ return s.clase_dia==='descanso'; })) des.push(a._n);
      else if (ausDia(a.id, d).length || L.some(function(s){ return s.clase_dia==='ausencia'; })) ausSin.push(a._n);
      else sinPlan.push(a._n);
    });
    var pie = [des.length?'Descanso: '+des.join(', '):'', ausSin.length?'Ausentes sin sesión: '+ausSin.join(', '):'', sinPlan.length?'Sin planificar: '+sinPlan.join(', '):''].filter(Boolean).join(' · ');
    return '<div class="ac-caja hoy-c"><h2>Por grupos de trabajo <small>agrupar organiza la pantalla: no cambia la prescripción de nadie</small></h2><div class="ac-hoy">'+
      (html || '<p class="ac-nada" style="text-align:left;padding:12px 4px">Nadie entrena este día.</p>')+
      (pie?'<p class="ac-mini-nota">'+esc(pie)+'.</p>':'')+'</div>'+formGrupos(d)+'</div>';
  }
  function vistaIndividual(d){
    var moms = momentosDelDia(d), varios = moms.length>1, html = '';
    if (varios){
      (moms).forEach(function(mo){
        var ids = []; entrenosDelDia(d).forEach(function(x){ if ((x.s.momento||'unica')===mo && ids.indexOf(x.aid)===-1) ids.push(x.aid); });
        html += seccionMomento(mo, true, ids.map(function(aid){ return tarjetaAtleta(aid, d, sesDe(aid, d).filter(function(s){ return (s.momento||'unica')===mo; }), false); }).join(''));
      });
      var resto = D.atl.filter(function(a){ return !sesDe(a.id, d).some(esEntrenoDia); });
      if (resto.length) html += '<div class="ac-mom"><h3>Sin entrenamiento</h3>'+resto.map(function(a){ return tarjetaAtleta(a.id, d, null, false); }).join('')+'</div>';
    } else html = D.atl.map(function(a){ return tarjetaAtleta(a.id, d, null, false); }).join('');
    return '<div class="ac-caja hoy-c"><h2>Por atleta <small>las diferencias de cada uno, completas</small></h2><div class="ac-hoy">'+(html || '<p class="ac-nada">Nadie en el grupo.</p>')+'</div></div>';
  }
  /* Crear grupos del día (por sesión o por un bloque) y sugerencias. */
  function formGrupos(d){
    var U = usosGT(d), sueltos = [];
    entrenosDelDia(d).forEach(function(x){ if (!ausDeSesion(x.s, x.aid) && !U.entera[x.s.id+'|'+x.aid] && !U.bloques[x.s.id+'|'+x.aid]) sueltos.push(x); });
    var porClave = {};
    sueltos.forEach(function(x){ var k = (String(x.s.objetivo||'').trim()+'|'+String(x.s.titulo||'').trim()).toLowerCase(); (porClave[k]=porClave[k]||[]).push(x); });
    var sugs = Object.keys(porClave).map(function(k){ return porClave[k]; }).filter(function(L){ return L.length>1; });
    wrap._sugs = sugs;
    var sugHtml = sugs.map(function(L, i){
      return '<div style="margin:6px 0">«'+esc(L[0].s.objetivo || L[0].s.titulo)+'»: '+esc(L.map(function(x){ return nombreDe(x.aid); }).join(', '))+' tienen la misma sesión prevista. '+
        '<button type="button" class="ac-link" data-sug="'+i+'">Crear este grupo</button></div>';
    }).join('');
    var sesDia = entrenosDelDia(d).filter(function(x){ return !ausDeSesion(x.s, x.aid); });
    var etiqs = {}; sesDia.forEach(function(x){ (x.s.bloques||[]).forEach(function(b){ if (b.etiqueta) etiqs[b.etiqueta]=1; }); });
    return (sugHtml ? '<div class="ac-sug" style="padding:8px 14px;border-top:1px solid var(--fila);font-size:14px;color:var(--t2)"><b style="color:var(--navy)">Sugerencias</b> (no se crean solas)'+sugHtml+'</div>' : '')+
      (sesDia.length>1 ? '<details class="ac-grp"><summary><b>Nuevo grupo de trabajo</b><span class="quien">lo decides tú</span></summary><div class="ac-form">'+
        '<label>Nombre <input type="text" id="gt-nombre" maxlength="60" placeholder="p. ej. Ritmo 400"></label>'+
        '<label>Qué comparten <select class="ac-sel" id="gt-bloque"><option value="">Toda la sesión</option>'+Object.keys(etiqs).map(function(e){ return '<option>'+esc(e)+'</option>'; }).join('')+'</select></label>'+
        '<div class="ac-mini-nota" style="margin-top:0">Si solo comparten un bloque (p. ej. la parte principal), elígelo: el resto de cada uno sigue por su cuenta.</div>'+
        '<div class="ac-checks">'+sesDia.map(function(x){ return '<label><input type="checkbox" class="gt-ses" value="'+x.s.id+'">'+esc(nombreDe(x.aid))+' · '+(MOMENTO[x.s.momento]?esc(MOMENTO[x.s.momento].toLowerCase())+' · ':'')+esc(tituloDe(x.s))+'</label>'; }).join('')+'</div>'+
        '<div><button type="button" class="ac-btn pri mini" data-gt-crear="1">Crear grupo</button></div></div></details>' : '');
  }
  function formAjustarGrupo(g){
    var ms = miembrosGT(g, true), sids = ms.map(function(m){ return m.s.id; });
    var bloque = ms.length ? ms[0].bloque : null;
    var sesDia = entrenosDelDia(g.fecha);
    var etiqs = {}; sesDia.forEach(function(x){ (x.s.bloques||[]).forEach(function(b){ if (b.etiqueta) etiqs[b.etiqueta]=1; }); });
    return '<div class="ac-form" style="padding:10px 0 0;border:0"><label>Nombre <input type="text" id="gta-nombre-'+g.id+'" maxlength="60" value="'+esc(g.nombre)+'"></label>'+
      '<label>Qué comparten <select class="ac-sel" id="gta-bloque-'+g.id+'"><option value="">Toda la sesión</option>'+Object.keys(etiqs).map(function(e){ return '<option'+(e===bloque?' selected':'')+'>'+esc(e)+'</option>'; }).join('')+'</select></label>'+
      '<div class="ac-checks">'+sesDia.map(function(x){ return '<label><input type="checkbox" class="gta-ses-'+g.id+'" value="'+x.s.id+'"'+(sids.indexOf(x.s.id)!==-1?' checked':'')+'>'+esc(nombreDe(x.aid))+' · '+esc(tituloDe(x.s))+'</label>'; }).join('')+'</div>'+
      '<div><button type="button" class="ac-btn pri mini" data-gta-ok="'+g.id+'">Guardar el grupo</button></div></div>';
  }

  /* ---------- avisos antes de empezar ---------- */
  function avisosHoy(){
    var hoy = ST.dia, A = { restr:[], rev:[], inc:[], nuevo:[], sinreg:[], sinfb:[] };
    (D.les||[]).forEach(function(l){
      var vencida = l.fecha_revision && l.fecha_revision <= hoy;
      A.restr.push('<li><b>'+esc(nombreDe(l.atleta_id))+'</b> · '+esc(restrTxt(l))+
        '<span class="o">Lesiones y disponibilidad · '+(l.origen==='atleta'?'avisó el atleta':'apuntado por el equipo')+(l.fecha_inicio?' · desde el '+esc(fMedia(l.fecha_inicio)):'')+'</span>'+
        (vencida ? '<span class="q"><b>Decisión pendiente de revisar</b> desde el '+esc(fMedia(l.fecha_revision))+': sigue vigente hasta que se revise en Lesiones.</span>' : (l.fecha_revision?'<span class="o">Revisar el '+esc(fMedia(l.fecha_revision))+'</span>':''))+'</li>');
    });
    REVS.forEach(function(rv){
      var s = rv.sesiones || {}, aid = (s.atletas_ids||[])[0];
      A.rev.push('<li><b>'+esc(aid?nombreDe(aid):'Sesión')+'</b> · revisión pendiente de «'+esc(s.titulo||'')+'» ('+fCorta(s.fecha)+')'+
        '<span class="o">'+(rv.motivo?esc(rv.motivo)+' · ':'')+'propuesta '+(rv.via?'desde '+esc(rv.via)+' ':'')+'el '+fechaHora(rv.creada_en)+' sobre la versión '+rv.version_base+'</span>'+
        '<span class="bt"><button type="button" class="ac-link" data-abrir="'+rv.sesion_id+'|'+(aid||'')+'">Ver y decidir</button></span></li>');
    });
    // Feedback sin revisar, de CUALQUIER fecha: no desaparece por salir de los 7 días
    (D.abiertos||[]).forEach(function(r){
      var s = r.sesiones || {}, aid = r.atleta_id;
      var mol = molestiaTxt(r), parcial = r.estado==='a_medias' || r.estado==='no_hecho';
      var ej = r.estado==='a_medias' ? 'parcial'+(r.completado_pct!=null?' ('+r.completado_pct+' %)':'') : r.estado==='no_hecho' ? 'no realizada'+(r.motivo_no_hecho?' por '+(NO_HECHO[r.motivo_no_hecho]||r.motivo_no_hecho):'') : 'realizada';
      var queEs = mol || (parcial ? ej : '') || (r.revision_anterior_en ? 'feedback cambiado tras revisarlo' : 'feedback nuevo');
      var li = '<li><b>'+esc(nombreDe(aid))+'</b> · '+esc(queEs)+(r.revision_anterior_en && (mol||parcial)?' (cambiado tras revisarlo)':'')+
        '<span class="o">Feedback del atleta de «'+esc(s.titulo||'')+'» ('+esc(s.fecha?fCorta(s.fecha)+' '+MES[deISO(s.fecha).getMonth()]:'')+') · '+ej+(r.rpe?' · RPE '+r.rpe:'')+' · enviado '+fechaHora(r.created_at)+'</span>'+
        (r.notas_atleta?'<span class="q">«'+esc(r.notas_atleta)+'»</span>':'')+
        '<span class="bt"><button type="button" class="ac-link" data-revisar="'+r.id+'">Marcar revisado</button><button type="button" class="ac-link" data-abrir="'+r.sesion_id+'|'+aid+'">Abrir</button></span></li>';
      if (mol || parcial || r.revision_anterior_en) A.inc.push(li); else A.nuevo.push(li);
    });
    // Sin respuesta (plazo vencido) y registros del entrenador que faltan: la última semana
    D.ses.filter(function(s){ return s.fecha<=hoy; }).forEach(function(s){
      atletasDe(s).forEach(function(aid){
        if (!D.atl.some(function(a){ return a.id===aid; })) return;
        if (D.reg[s.id+'|'+aid] || !s.publicada || !esEntreno(s) || ausDeSesion(s, aid) || !vencido(s)) return;
        var modo = modoDe(aid);
        if (D.regEnt[s.id+'|'+aid] || modo==='no_requerido') return;
        var li = '<li><b>'+esc(nombreDe(aid))+'</b> · '+(modo==='registro_entrenador'?'falta tu registro':'sin feedback')+' de «'+esc(tituloDe(s))+'» ('+fCorta(s.fecha)+')'+
          '<span class="o">'+(modo==='registro_entrenador'?'Lo registras tú (declaración del entrenador). ':'No se da por hecha ni por no hecha. ')+'Plazo: '+txtPlazo(s)+'</span>'+
          '<span class="bt"><button type="button" class="ac-link" data-abrir="'+s.id+'|'+aid+'">'+(modo==='registro_entrenador'?'Registrar':'Abrir')+'</button></span></li>';
        (modo==='registro_entrenador' ? A.sinreg : A.sinfb).push(li);
      });
    });
    return A;
  }
  function cajaAvisos(A, sinTitulo){
    var sec = function(tit, L, nota, plegado){
      if (!L.length) return '';
      var cuerpo = (nota?'<div class="o" style="padding:0 14px 6px;color:var(--t3);font-size:13px">'+nota+'</div>':'')+'<ul>'+L.join('')+'</ul>';
      return plegado ? '<details class="ac-grp"'+(L.length<=2?' open':'')+'><summary><b>'+tit+'</b><span class="quien">'+L.length+'</span></summary>'+cuerpo+'</details>'
                     : '<div class="ac-av"><div class="ac-av-t">'+tit+' <span class="quien">'+L.length+'</span></div>'+cuerpo+'</div>';
    };
    var n = A.restr.length + A.rev.length + A.inc.length;

  /* Compara las sesiones de un grupo bloque a bloque: lo común una vez y lo

  function comunYDiferencias(miembros){
    // miembros: [{s, aid, bloque}]
    var porEtiq = {}, orden = [];
    miembros.forEach(function(m){
      filasBloque(m.s, m.bloque).forEach(function(b){
        var k = b.etiqueta||'';
        if (!porEtiq[k]){ porEtiq[k] = []; orden.push(k); }
        porEtiq[k].push({ aid:m.aid, txt:compactar((b.filas||[]).map(filaTxt)), b:b });
      });
    });
    return orden.map(function(k){
      var L = porEtiq[k], base = JSON.stringify(L[0].txt);
      var iguales = L.length===miembros.length && L.every(function(x){ return JSON.stringify(x.txt)===base; });
      return { etiqueta:k, iguales:iguales, items:L };
    });

  function marcaFila(t){
    if (!t || typeof t!=='object') return '';
    var vals = (t.tiempos||[]).filter(function(v){ return v!=null && v!=='' && v!=='hecha' && v!==true; });
    if (vals.length) return vals.join(' · ')+(t.unidad?' '+t.unidad:'');
    var hechas = (t.series||[]).filter(function(x){ return x && x.hecha; }).length;
    if (hechas || (t.tiempos||[]).indexOf('hecha')!==-1) return '✓ hecho';

  function lineasPlan(d){
    var L = [];
    if (d.titulo) L.push('Título: '+d.titulo);
    if (d.objetivo) L.push('Objetivo: '+d.objetivo);
    var ex = exigTxt(d); if (ex) L.push('Exigencia prevista: '+ex);
    if (d.hora) L.push('Hora: '+hhmm(d.hora));
    if (MOMENTO[d.momento]) L.push('Momento: '+MOMENTO[d.momento]);
    (d.bloques||[]).forEach(function(b){
      (b.filas||[]).forEach(function(f){ var p=filaPartes(f); L.push((b.etiqueta?b.etiqueta+': ':'')+filaTxt(f)+(p.det?' ('+p.det+')':'')); });
      if (b.nota_pie) L.push((b.etiqueta?b.etiqueta+' · ':'')+'nota: '+b.nota_pie);
    });
    return L;
  }
  function diffLineas(a, b){
    var n=a.length, m=b.length, T=[], i, j;
    for (i=0;i<=n;i++){ T.push(new Array(m+1).fill(0)); }
    for (i=n-1;i>=0;i--) for (j=m-1;j>=0;j--) T[i][j] = a[i]===b[j] ? T[i+1][j+1]+1 : Math.max(T[i+1][j], T[i][j+1]);
    var out=[]; i=0; j=0;
    while (i<n && j<m){ if (a[i]===b[j]){ i++; j++; } else if (T[i+1][j]>=T[i][j+1]) out.push(['-',a[i++]]); else out.push(['+',b[j++]]); }
    while (i<n) out.push(['-',a[i++]]); while (j<m) out.push(['+',b[j++]]);
    // Antes/ahora emparejados: cada línea quitada junto a la que la sustituye
    var par = [], k = 0;
    while (k < out.length){
      var menos = [], mas = [];
      while (k < out.length){ if (out[k][0]==='-') menos.push(out[k]); else mas.push(out[k]); k++; }
      for (var x=0; x<Math.max(menos.length, mas.length); x++){ if (menos[x]) par.push(menos[x]); if (mas[x]) par.push(mas[x]); }
    }
    return par;
  }
  function diffHTML(a, b){
    var df = diffLineas(lineasPlan(a), lineasPlan(b));
    if (!df.length) return { n:0, html:'<div class="nota">Sin cambios en el contenido (solo cambió la publicación u otro dato interno).</div>' };
    return { n:df.length, html: df.map(function(x){ return '<span class="'+(x[0]==='-'?'ac-menos':'ac-mas')+'">'+(x[0]==='-'?'Antes: ':'Ahora: ')+esc(x[1])+'</span>'; }).join('') };
  }

  function pintarDetalle(s, aid, versiones, notas, priv){

    var h = '<div class="in"><div class="ac-quien">'+esc(a._n)+' · '+esc(fLarga(s.fecha))+(MOMENTO[s.momento]?' · '+MOMENTO[s.momento]:'')+(s.hora?' · '+hhmm(s.hora):'')+'</div>'+

      tag(s.publicada?'t-v':'t-bor', (s.publicada?'Publicada':'Borrador')+' · versión '+s.version)+e.tags.replace(tag('t-bor','Borrador'), '')+
      (FB && EST_FB[estadoFb(s, aid)] ? ' '+tag(EST_FB[estadoFb(s, aid)][1], EST_FB[estadoFb(s, aid)][0]) : '');

      (e.au.nota?'<div>'+esc(e.au.nota)+'</div>':'')+(e.au.avisado_por_nombre?'<div class="nota">Avisó: '+esc(e.au.avisado_por_nombre)+'</div>':'')+

    else if (!s.archivada_en && s.clase_dia==='entreno' && !FB) h += '<div style="margin-top:8px"><button type="button" class="ac-link" data-aus="1">Marcar ausencia de '+esc(a._n)+' este día</button><div id="ac-aus-f" hidden></div></div>';

      (s.objetivo||exigTxt(s) ? esc(s.objetivo||'Sin objetivo')+(exigTxt(s)?' · <span style="color:var(--t2)">'+esc(exigTxt(s))+'</span>':'') : '<span style="color:var(--t3)">Sin objetivo ni exigencia prevista.</span>')+
      (s.archivada_en || s.clase_dia==='descanso' ? '' : ' <button type="button" class="ac-link" data-int="1">Editar</button>')+

    // Revisión pendiente

      h += '<div class="ac-sec"><b class="r">Revisión pendiente · sobre la versión '+e.rv.version_base+'</b>'+
        (e.rv.motivo?'<div>'+esc(e.rv.motivo)+'</div>':'')+'<div class="nota">Propuesta '+(e.rv.via?'desde '+esc(e.rv.via)+' ':'')+'el '+fechaHora(e.rv.creada_en)+'.</div>'+

    }

    // Lo realizado + plan respondido
    if (r){
      var est = r.estado==='a_medias' ? 'Parcial'+(r.completado_pct!=null?' · '+r.completado_pct+' %':'') : r.estado==='no_hecho' ? 'No realizada'+(r.motivo_no_hecho?' · '+(NO_HECHO[r.motivo_no_hecho]||r.motivo_no_hecho):'') : 'Realizada';
      var datos = [est];
      if (r.rpe) datos.push('RPE '+r.rpe);
      if (r.duracion_min) datos.push(r.duracion_min+'′');
      var mol = molestiaTxt(r); datos.push(mol ? mol.charAt(0).toUpperCase()+mol.slice(1) : 'sin molestias');
      var tiempos = r.tiempos_reales && typeof r.tiempos_reales==='object' && Object.keys(r.tiempos_reales).some(function(k){ var t=r.tiempos_reales[k]; return t && t.tiempos && t.tiempos.some(function(v){ return v && v!=='hecha'; }); });
      h += '<div class="ac-sec"><b class="r">Lo que hizo · respondió la versión '+(r.version_vista||'?')+'</b>'+esc(datos.join(' · '))+
        (r.nota_no_hecho?'<div class="ac-cita">'+esc(r.nota_no_hecho)+'</div>':'')+
        (r.notas_atleta?'<div class="ac-cita">«'+esc(r.notas_atleta)+'»</div>':'')+

        (r.marcas_texto?'<div style="margin-top:6px;white-space:pre-wrap">'+esc(r.marcas_texto)+'</div>':'')+

        // Datos antiguos: la limitación de correspondencia con el plan, siempre a la vista
        (r.version_garantia==='sin_garantia' || r.version_garantia==='sobrescrita' ? '<div class="ac-aviso">Correspondencia con el plan: '+esc(GARANTIA[r.version_garantia])+' Compáralo con prudencia.</div>' : '')+
        (r.revision_anterior_en && !r.revisado_en
          ? '<div class="ac-aviso">El atleta cambió este feedback después de que '+(quienRevisa(r.revision_anterior_por)==='tú' ? 'lo revisaras tú' : 'lo revisara '+esc(quienRevisa(r.revision_anterior_por)))+' (el '+fechaHora(r.revision_anterior_en)+'): vuelve a estar pendiente. Lo anterior queda en el historial de correcciones.</div>' : '')+

          : '<button type="button" class="ac-btn pri mini" data-revisar="'+r.id+'">Marcar como revisado</button>'+(FB ? ' <button type="button" class="ac-btn mini" data-revisar-sig="'+r.id+'">Revisado y siguiente ›</button>' : ''))+

        (r.corregido_veces || r.revision_anterior_en ? '<div style="margin-top:6px"><button type="button" class="ac-link" data-fb-hist="'+r.id+'">Ver lo que respondió antes de corregirlo</button><div id="ac-fb-hist" hidden></div></div>' : '')+'</div></div>';
      var planResp = (vResp && vResp.datos) || null;
      var cuerpoPlan = (planResp ? planHTML(planResp, r) : '<div class="nota">No se guardó la versión que vio (registro anterior al historial). Se muestra el plan actual como referencia.</div>'+planHTML(actual, r));
      h += FB ? '<div class="ac-sec"><details class="ac-dif2"><summary>Plan que respondió'+(vResp?' · versión '+vResp.version:'')+' (completo, con sus tiempos)</summary>'+cuerpoPlan+'</details></div>'
              : '<div class="ac-sec"><b class="r">Plan que respondió'+(vResp?' · versión '+vResp.version:'')+'</b>'+cuerpoPlan+'</div>';
      if (planResp && vResp.version!==s.version){
        var df = diffHTML(planResp, actual);
        h += '<div class="ac-sec"><details class="ac-dif2"'+(Q.get('cambios')==='1'?' open':'')+'><summary>Ver cambios respecto al plan respondido ('+df.n+')</summary>'+df.html+
          '<div class="nota">Versión '+s.version+(vAct?' desde el '+fechaHora(vAct.vigente_desde):'')+'. El resto es igual.</div></details>'+
          '<details class="ac-dif2" style="margin-top:8px"><summary>Plan actual · versión '+s.version+'</summary>'+planHTML(actual)+'</details></div>';
      }
    } else if (s.clase_dia!=='descanso'){
      h += FB ? '<div class="ac-sec"><b class="r">Sin feedback del atleta</b>'+esc((EST_FB[estadoFb(s, aid)]||['—'])[0])+(e.pend?' · el plazo venció el '+txtPlazo(s)+'. No se da por hecha ni por no hecha.':'')+
                '<details class="ac-dif2" style="margin-top:6px"><summary>Plan · versión '+s.version+'</summary>'+planHTML(actual)+'</details></div>'
              : '<div class="ac-sec"><b class="r">Plan · versión '+s.version+' · '+(s.publicada?'publicada':'borrador')+'</b>'+planHTML(actual)+
        (e.pend?'<div class="nota">Sin feedback: el plazo venció el '+txtPlazo(s)+'. No se da por hecha ni por no hecha.</div>':'')+'</div>';
    }
    // Datos tomados en pista por el entrenador (aparte del feedback del atleta)
    if (s.clase_dia!=='descanso'){
      var sg = seguimientoHTML(s, aid, r, versiones);
      if (FB){
        var nT = tomaDe(s.id, aid).length, nD = r ? discrepancias(s, aid, r).pares.length : 0;
        sg = nT ? '<details class="ac-sec ac-fbd"'+(nD?' open':'')+'><summary>Tus datos de pista · '+plural(nT,'dato','datos')+(nD?' · '+plural(nD,'discrepancia','discrepancias'):'')+'</summary>'+sg+'</details>' : '';
      }
      h += sg;
    }
    // Registro del entrenador: si el seguimiento de este atleta lo pide, o si ya hay uno.
    if (s.clase_dia!=='descanso' && !s.archivada_en && (e.modo==='registro_entrenador' || e.re)) h += seccionRegistroEntrenador(e.re);
    // Las instrucciones las lee el atleta en su app; la nota privada, solo los entrenadores.
    if (s.nota_razonamiento) h += '<div class="ac-sec"><b class="r">Instrucciones para el atleta</b><div style="white-space:pre-wrap;color:var(--t2)">'+esc(s.nota_razonamiento)+'</div><div class="nota">Las lee en su app, debajo del entrenamiento.</div></div>';
    if (priv && priv.nota) h += '<div class="ac-sec"><b class="r">Nota privada · solo entrenadores</b><div style="white-space:pre-wrap;color:var(--t2)">'+esc(priv.nota)+'</div></div>';

    // Observaciones del entrenador (notas privadas del día)
    h += '<div class="ac-sec"><b class="r">Tus observaciones de este día</b>'+
      (notas.length ? notas.map(function(n){ return '<div class="ac-obs">'+esc(n.texto)+'<small>'+fechaHora(n.created_at)+'</small></div>'; }).join('') : '<span style="color:var(--t3)">Sin observaciones.</span>')+
      ' <button type="button" class="ac-link" data-obs="1">Añadir</button><div id="ac-obs-f" hidden></div></div>';

    h += '<div class="ac-sec"><b class="r">Seguimiento de '+esc(a._n)+'</b>'+selectorModo(aid, 'ac-modo-at')+
      '<div class="nota">'+esc(MODOS[modoDe(aid)][1])+'</div></div>';
    h += '<div class="ac-sec" style="display:flex;gap:8px;flex-wrap:wrap"><a class="ac-btn mini" href="'+B+'admin/atletas/?ficha='+aid+'">Ver ficha de '+esc(a._n)+'</a></div>';
    h += '</div>';
    lado.innerHTML = cab + h;
    lado.scrollTop = 0;
  }
  function selectorModo(aid, id){

  }
  async function guardarModo(aid, modo){
