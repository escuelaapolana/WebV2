  /* ================= IMPRIMIR para la pista =================
     Todo el día, un grupo o unos atletas. La prescripción PUBLICADA vigente
     (una revisión pendiente no la sustituye). Un borrador solo si se pide, y
     marcado como tal. Sin notas privadas ni datos de salud salvo que se marque.
     Casillas vacías opcionales para tiempos y observaciones (cuántas, las
     decide quien imprime: la app no deduce repeticiones del texto). */
  function dialogoImprimir(){
    var d = ST.dia, gts = D.gt.filter(function(g){ return g.fecha===d && miembrosGT(g, true).length; });
    var ent = entrenosDelDia(d), ats = []; ent.forEach(function(x){ if (ats.indexOf(x.aid)===-1) ats.push(x.aid); });
    var nBor = ent.filter(function(x){ return !x.s.publicada; }).length;
    var dlg = dialogo('<h3>Imprimir el entrenamiento</h3><p>'+esc(fLarga(d))+'. Se imprime la versión <b>publicada</b> de cada sesión; una revisión pendiente no la sustituye.</p>'+
      '<h4>Qué</h4>'+
      '<label class="op"><input type="radio" name="imp-que" value="todo" checked> Todo el día</label>'+
      (gts.length ? '<label class="op"><input type="radio" name="imp-que" value="grupo"> Un grupo: <select class="ac-sel" id="imp-gt">'+gts.map(function(g){ return '<option value="'+g.id+'">'+esc(g.nombre)+'</option>'; }).join('')+'</select></label>' : '')+
      '<label class="op"><input type="radio" name="imp-que" value="atletas"> Estos atletas:</label><div class="ac-chips" style="margin-left:26px">'+ats.map(function(aid){ return '<label><input type="checkbox" class="imp-at" value="'+aid+'">'+esc(nombreDe(aid))+'</label>'; }).join('')+'</div>'+
      '<h4>Opciones</h4>'+
      '<label class="op"><input type="checkbox" id="imp-cas"> Dejar casillas vacías para tiempos y observaciones · <input type="number" id="imp-ncas" class="ac-sel" min="1" max="12" value="6" style="width:70px;min-height:32px;padding:4px 6px"> por bloque</label>'+
      (nBor ? '<label class="op"><input type="checkbox" id="imp-bor"> Incluir '+plural(nBor,'borrador','borradores')+' (salen marcados «BORRADOR · no publicado»)</label>' : '')+
      '<label class="op"><input type="checkbox" id="imp-priv"> Incluir avisos de salud y notas privadas <span style="color:var(--t3)">(desactivado por defecto)</span></label>'+
      '<div class="pie"><button type="button" class="ac-btn" data-dlg-no="1">Cancelar</button><button type="button" class="ac-btn pri" data-imp-ok="1">Imprimir</button></div>');
    dlg.classList.add('ancho');
    dlg.addEventListener('change', function(ev){ if (ev.target.classList.contains('imp-at')) dlg.querySelector('input[name="imp-que"][value="atletas"]').checked = true; });
    dlg.addEventListener('click', async function(ev){
      if (ev.target.closest('[data-dlg-no]')){ cerrarDialogo(); return; }
      if (!ev.target.closest('[data-imp-ok]')) return;
      var que = (dlg.querySelector('input[name="imp-que"]:checked')||{}).value || 'todo';
      var o = { que:que, gt: que==='grupo' ? document.getElementById('imp-gt').value : null,
        atletas: Array.prototype.map.call(dlg.querySelectorAll('.imp-at:checked'), function(c){ return c.value; }),
        casillas: document.getElementById('imp-cas').checked, ncas: Math.max(1, Math.min(12, +document.getElementById('imp-ncas').value || 6)),
        borradores: !!(document.getElementById('imp-bor') && document.getElementById('imp-bor').checked),
        privado: document.getElementById('imp-priv').checked };
      if (que==='atletas' && !o.atletas.length){ avisar('Marca a quién imprimir.', true); return; }
      cerrarDialogo();
      await imprimir(o);
    });
  }
  async function imprimir(o){
    var d = ST.dia;
    var vale = function(s){ return esEntrenoDia(s) && (s.publicada || o.borradores); };
    var privadas = {};
    if (o.privado){
      var ids = entrenosDelDia(d).map(function(x){ return x.s.id; });
      if (ids.length){ var rp = await sb.from('sesiones_nota_privada').select('sesion_id,nota').in('sesion_id', ids); (rp.data||[]).forEach(function(x){ privadas[x.sesion_id] = x.nota; }); }
    }
    var casillas = function(nombres){
      if (!o.casillas || !nombres.length) return '';
      var th = ''; for (var i=1;i<=o.ncas;i++) th += '<th>'+i+'</th>';
      return '<table class="imp-cas"><tr><th class="n"></th>'+th+'<th class="obs">Observaciones</th></tr>'+nombres.map(function(n){ var td=''; for (var i=0;i<o.ncas;i++) td+='<td></td>'; return '<tr><td class="n">'+esc(n)+'</td>'+td+'<td class="obs"></td></tr>'; }).join('')+'</table>';
    };
    // Las casillas, donde se toman tiempos: no en el calentamiento ni en la vuelta a la calma.
    var conCasillas = function(b){ return lineasDe(b).length && !NO_PRINC.test(b.etiqueta||''); };
    var lineasTxt = function(b){ return lineasDe(b).map(function(l){ return '<div>'+esc(l)+'</div>'; }).join('')+(b.nota_pie?'<div><i>'+esc(b.nota_pie)+'</i></div>':''); };
    var cabBloque = function(b){ var rb = recBloque(b); return '<b>'+esc(b.etiqueta||'Sesión')+'</b>'+(b.matiz?' — '+esc(b.matiz):'')+(rb?'<br><small>Descanso después: '+esc(rb)+'</small>':''); };
    var marcaBor = function(s){ return s.publicada ? '' : ' <span class="imp-bor">BORRADOR · no publicado</span>'; };
    var salud = function(aid){
      if (!o.privado) return '';
      var r = restrDe(aid).map(restrTxt), ay = []; sesDe(aid, sumar(d,-1)).forEach(function(s){ var m = molestiaTxt(D.reg[s.id+'|'+aid]); if (m) ay.push('ayer '+m); });
      return (r.length||ay.length) ? '<div class="imp-q"><i>Salud: '+esc(r.concat(ay).join(' · '))+'</i></div>' : '';
    };
    var secciones = [];
    // Un grupo de trabajo, en tabla: bloque | lo común o lo de cada uno
    function seccionGrupo(g){
      var ms = miembrosGT(g, true).filter(function(m){ return !ausDeSesion(m.s, m.aid) && vale(m.s); });
      if (!ms.length) return '';
      var bloque = ms.every(function(m){ return m.bloque===ms[0].bloque; }) ? ms[0].bloque : null;
      var filas = ordenEtiquetas(ms.map(function(m){ return m.s; })).map(function(e){
        var aqui = ms.map(function(m){ return { m:m, b:bloqueDe(m.s, e) }; }).filter(function(x){ return x.b && (!bloque || bloque===e); });
        var solos = ms.map(function(m){ return { m:m, b:bloqueDe(m.s, e) }; }).filter(function(x){ return x.b && bloque && bloque!==e; });
        var celda = '';
        if (aqui.length){
          var firmas = {}; aqui.forEach(function(x){ var k = firmaBloque(x.b); (firmas[k] = firmas[k] || []).push(x); });
          var ks = Object.keys(firmas);
          celda = ks.length===1 ? lineasTxt(aqui[0].b) : ks.map(function(k){ return '<div class="imp-ind"><b>'+esc(firmas[k].map(function(x){ return nombreDe(x.m.aid); }).join(', '))+':</b>'+lineasTxt(firmas[k][0].b)+'</div>'; }).join('');
        }

        ms.map(function(m){ return salud(m.aid); }).join('')+

    /* Una sesión individual. Si varios atletas tienen EXACTAMENTE la misma
       (sin grupo de trabajo), sale una vez con sus nombres y una fila de

  /* ================= FEEDBACK · una bandeja para revisar =================
     Una fila por sesión y atleta del rango: lo que respondió, tus datos de
     pista, tus observaciones, discrepancias y cambios posteriores. Se abre
     con el MISMO detalle y se revisa con la MISMA función
     (academia_marcar_revisado). Revisar = haberlo leído: no cierra una
     incidencia ni da el entrenamiento por hecho. */
  var EST_FB = {
    recibido:          ['Recibido · sin revisar', 't-nuevo'],
    corregido:         ['Corregido después de revisarlo', 't-nuevo'],
    revisado:          ['Revisado', 't-hecha'],
    pendiente_vencido: ['Pendiente de recibir · plazo vencido', 't-rev'],
    pendiente_plazo:   ['Pendiente de recibir · en plazo', 't-sind'],
    no_requerido:      ['Feedback no requerido', 't-sind'],
    registro_falta:    ['Registro del entrenador · falta el tuyo', 't-rev'],
    registro_plazo:    ['Registro del entrenador · aún en plazo', 't-sind'],
    registro_hecho:    ['Registro del entrenador · hecho', 't-v'],
    ausente:           ['Ausente · no se pide feedback', 't-sind']
  };
  var FILTROS_FB = [['por_revisar','Por revisar (recibido o corregido)'],['recibido','Recibido sin revisar'],['corregido','Corregido después de revisarlo'],
    ['pendiente','Pendiente de recibir'],['revisado','Revisado'],['no_requerido','Feedback no requerido'],['registro','Registro del entrenador'],['ausente','Ausente'],['todos','Todos']];
  function estadoFb(s, aid){
    var r = D.reg[s.id+'|'+aid];
    if (r) return r.revisado_en ? 'revisado' : (r.revision_anterior_en ? 'corregido' : 'recibido');
    if (ausDeSesion(s, aid)) return 'ausente';
    var modo = modoDe(aid);
    // En «registro del entrenador» no se pide nada al atleta: no hay «falta su feedback».
    if (modo==='registro_entrenador') return D.regEnt[s.id+'|'+aid] ? 'registro_hecho' : (vencido(s) ? 'registro_falta' : 'registro_plazo');
    if (modo==='no_requerido') return 'no_requerido';
    return vencido(s) ? 'pendiente_vencido' : 'pendiente_plazo';
  }
  function pasaFiltroFb(est, f){
    f = f || ST.fb.estado;
    if (f==='todos') return true;
    if (f==='por_revisar') return est==='recibido' || est==='corregido';
    if (f==='pendiente') return est==='pendiente_vencido' || est==='pendiente_plazo';
    if (f==='registro') return est.indexOf('registro_')===0;
    return est===f;
  }
  function listaFb(){
    var L = [], hoy = hoyISO();

      if (s.clase_dia!=='entreno' || D.sust[s.id] || s.fecha > hoy) return;
      if (!s.publicada && !tieneRegistro(s)) return;      // un borrador no se ha pedido a nadie
      atletasDe(s).forEach(function(aid){ if (D.atl.some(function(a){ return a.id===aid; })) L.push({ s:s, aid:aid, est:estadoFb(s, aid) }); });
    });
    L.sort(function(a,b){ return b.s.fecha.localeCompare(a.s.fecha) || nombreDe(a.aid).localeCompare(nombreDe(b.aid),'es') || (ORD_MOM[a.s.momento]||1)-(ORD_MOM[b.s.momento]||1); });
    return L;
  }
  function listaFbFiltrada(){ return listaFb().filter(function(x){ return (!ST.fb.atleta || x.aid===ST.fb.atleta) && pasaFiltroFb(x.est); }); }
  function filaFbHTML(x){
    var s = x.s, aid = x.aid, r = D.reg[s.id+'|'+aid], e = EST_FB[x.est] || [x.est,'t-sind'];

    var dsc = r ? discrepancias(s, aid, r).pares.length : 0; if (dsc) m.push(plural(dsc,'discrepancia','discrepancias'));
    var no = (D.notas||[]).filter(function(n){ return n.atleta_id===aid && n.fecha===s.fecha; }).length; if (no) m.push(plural(no,'observación tuya','observaciones tuyas'));
    if (r && r.version_vista && r.version_vista < s.version) m.push('plan cambiado después (v'+r.version_vista+' → v'+s.version+')');
    if (r && (r.version_garantia==='sin_garantia' || r.version_garantia==='sobrescrita')) m.push('registro antiguo: sin garantía de qué versión vio');

      (r && r.notas_atleta ? '<span class="fb-cm">«'+esc(r.notas_atleta)+'»</span>' : '')+
      (m.length ? '<span class="fb-m">'+esc(m.join(' · '))+'</span>' : '')+'</button>';
  }
  function pintarFeedback(){

    var nota = '<p class="ac-mini-nota">Revisar es haberlo leído: no cierra restricciones ni incidencias y no da el entrenamiento por hecho. Los atletas en «registro del entrenador» no generan avisos de falta de feedback.</p>';

      '<div class="ac-cifras"><span class="ac-cifra"><b>'+cuenta.por_revisar+'</b>por revisar</span><span class="ac-cifra"><b>'+cuenta.pendiente+'</b>pendientes de recibir</span><span class="ac-cifra"><b>'+cuenta.revisado+'</b>revisados</span>'+

  /* El historial de lo que el atleta respondió (sus correcciones, guardadas por la base). */
  async function historialFeedback(r){

    }).join('')+'</ul>';

  /* ================= APUNTAR EN PISTA (datos del entrenador) =================
     Lo que el entrenador apunta va a academia_toma_datos (mig 468), aparte del
     feedback del atleta, que no se toca. Cada dato se ata a la sesión, a su
     versión y al id de la FILA del plan (nunca a su nombre ni a su posición),
     con serie, repetición, parte («250», «150»), tramo y magnitud.
     Apuntar NO completa nada: lo que no se apunta queda «sin dato». */
  var METODOS = [['no_consta','No consta'],['manual','Manual'],['fotocelulas','Fotocélulas'],['electronico_competicion','Electrónico de competición'],['video','Vídeo'],['otro','Otro']];
  var METODO_TXT = {}; METODOS.forEach(function(m){ METODO_TXT[m[0]] = m[1]; });
  var ESTADOS_T = { realizado:'Realizado', parcial:'Parcial', no_realizado:'No realizado' };
  var COLS_TOMA = 'id,sesion_id,sesion_version,atleta_id,fila_id,bloque,alcance,serie,repeticion,parte,tramo,magnitud,valor_texto,valor_num,unidad,ambiguo,metodo,carga_modo,lado,estado,ejercicio_realizado,adicional,nota,version,autor_perfil_id,creado_en,actualizado_por,actualizado_en';

  /* Lo mismo que academia_leer_valor (la base manda; esto es para avisar al momento). */
  function leerValor(t, mag){
    t = String(t||'').replace(/\s+/g,' ').trim();
    if (!t || ['tiempo','carga','repeticiones','distancia'].indexOf(mag)===-1) return { num:null, ambiguo:false };
    var m;
    if (mag==='tiempo'){
      t = t.replace(/\s*(s|seg|segundos)$/i, '');
      if (/^\d{1,3}([.,]\d{1,3})?(″|"|'')?$/.test(t)) return { num:+t.replace(/(″|"|'')$/,'').replace(',','.'), unidad:'s' };
      if ((m = /^(\d{1,3})(?:″|"|'')(\d{1,3})$/.exec(t))) return { num:+(m[1]+'.'+m[2]), unidad:'s' };
      if ((m = /^(\d{1,3}):(\d{2})(?:[.,](\d{1,3}))?$/.exec(t))) return +m[2]>=60 ? { num:null, ambiguo:true, motivo:'los segundos pasan de 59' } : { num:+m[1]*60 + +(m[2]+(m[3]?'.'+m[3]:'')), unidad:'s' };
      if ((m = /^(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?$/.exec(t))) return (+m[2]>=60 || +m[3]>=60) ? { num:null, ambiguo:true, motivo:'minutos o segundos pasan de 59' } : { num:+m[1]*3600 + +m[2]*60 + +(m[3]+(m[4]?'.'+m[4]:'')), unidad:'s' };
      if ((m = /^(\d{1,2})(?:′|')(\d{2})(?:(?:″|"|'')(\d{0,3}))?$/.exec(t))) return +m[2]>=60 ? { num:null, ambiguo:true, motivo:'los segundos pasan de 59' } : { num:+m[1]*60 + +(m[2]+(m[3]?'.'+m[3]:'')), unidad:'s' };
      return { num:null, ambiguo:true, motivo:'no se entiende como tiempo (34,52 · 1:28,5)' };
    }
    if (mag==='carga'){ t = t.replace(/\s*kg$/i, ''); return /^\d{1,3}([.,]\d{1,2})?$/.test(t) ? { num:+t.replace(',','.'), unidad:'kg' } : { num:null, ambiguo:true, motivo:'no se entiende como kg' }; }
    if (mag==='repeticiones') return /^\d{1,3}$/.test(t) ? { num:+t, unidad:'reps' } : { num:null, ambiguo:true, motivo:'no es un número de repeticiones' };
    t = t.replace(/\s*m$/i, ''); return /^\d{1,5}([.,]\d{1,2})?$/.test(t) ? { num:+t.replace(',','.'), unidad:'m' } : { num:null, ambiguo:true, motivo:'no se entiende como metros' };
  }
  function fmtNum(n, u){ if (n==null) return ''; if (u==='s' && n>=60){ var mi = Math.floor(n/60), s = n - mi*60; return mi+':'+(s<10?'0':'')+String(Math.round(s*100)/100).replace('.',','); } return String(Math.round(n*100)/100).replace('.',',')+(u==='s'?' s':u==='kg'?' kg':u==='m'?' m':''); }

  /* Cuántas tomas y qué partes sugiere el texto de una fila (solo para dibujar
     las casillas: nunca se rellena nada). */
  function estructuraFila(f){

  async function guardarToma(){
    if (!TOMA) return;
    var claves = Object.keys(TOMA.celdas).filter(function(k){ return TOMA.celdas[k].est==='sucio' || TOMA.celdas[k].est==='error'; });
    if (!claves.length) return;
    var items = [], porId = {};
    var borrando = {};
    claves.forEach(function(k){
      // Vacía = sin dato (se anula si estaba guardada). El trabajo adicional se quita a propósito.
      var c = TOMA.celdas[k], it = itemDato(c);
      if (!it){ c.est = ''; return; }
      if (it.anular) borrando[it.id] = 1;
      c.est = 'guardando'; c.enviado = c.texto; items.push(it); porId[c.id] = k;
    });
    refrescarEstadoToma();
    if (!items.length) return;
    var r;
    try { r = await sb.rpc('academia_toma_guardar', { p_datos: items }); if (r.error) throw r.error; }
    catch(err){
      items.forEach(function(it){ var c = TOMA && TOMA.celdas[porId[it.id]]; if (c){ c.est = 'error'; c.msg = (err && err.message) || 'sin conexión'; } });
      if (TOMA){ pintarTomaConservando(); }
      return;
    }
    ((r.data && r.data.resultados) || []).forEach(function(x){
      var k = porId[x.id]; if (!k || !TOMA) return; var c = TOMA.celdas[k];
      if (x.ok){
        var d = x.dato || {};
        // Se quería borrar algo cuyo alta sí había llegado: ahora se borra con su versión.
        if (x.repetido && borrando[x.id]){ c.id = d.id; c.version = d.version; c.dato = d; c.est = 'sucio'; return; }
        if (d.anulado_en){ c.id = null; c.version = null; c.dato = null; c.srv = ''; }
        else { c.id = d.id; c.version = d.version; c.dato = d; c.srv = c.enviado; }
        c.est = (c.texto||'') === (c.enviado||'') ? (d.anulado_en ? '' : 'guardado') : 'sucio';
        c.metodoNuevo = null;
        // el dato en memoria de la página, para que el detalle lo vea al cerrar
        D.toma = (D.toma||[]).filter(function(t){ return t.id!==d.id; }); if (!d.anulado_en && d.id) D.toma.push(d);
      } else {
        var su = x.dato || {};
        c.est = 'conflicto'; c.suyo = su.magnitud==='estado' ? su.estado : su.magnitud==='sustitucion' ? su.ejercicio_realizado : su.magnitud==='nota' ? su.nota : su.valor_texto;
        c.suDato = su;
        if (x.conflicto==='otra_pantalla') c.id = null;   // la casilla ya existe con otro id
      }
    });
    pintarTomaConservando();
    var sinNombre = [];
    Object.keys(TOMA.celdas).forEach(function(k){ var su = TOMA.celdas[k].suDato; var id = su && (su.actualizado_por || su.autor_perfil_id); if (TOMA.celdas[k].est==='conflicto' && id && !NOMBRES[id] && !(perfil && id===perfil.id) && sinNombre.indexOf(id)===-1) sinNombre.push(id); });
    if (sinNombre.length){ var rn = await sb.from('perfiles').select('id,nombre').in('id', sinNombre); (rn.data||[]).forEach(function(x){ NOMBRES[x.id] = x.nombre; }); if (TOMA) pintarTomaConservando(); }
    if (TOMA && pendientesToma().some(function(k){ return TOMA.celdas[k].est==='sucio'; })) { clearTimeout(_tmT); _tmT = setTimeout(guardarToma, 400); }
  }

  /* ---------- el seguimiento en el detalle: plan, datos de pista y feedback ---------- */
  function filaDeVersion(fid, versiones){
    var f0 = null, v0 = null;
    (versiones||[]).forEach(function(v){ ((v.datos && v.datos.bloques) || []).forEach(function(b){ (b.filas||[]).forEach(function(f){ if (f.id===fid){ f0 = f; v0 = v.version; } }); }); });
    return f0 ? { f:f0, version:v0 } : null;
  }
  function valorDato(t){
    if (t.magnitud==='estado') return ESTADOS_T[t.estado]||t.estado;
    if (t.magnitud==='sustitucion') return 'hizo «'+t.ejercicio_realizado+'»';
    if (t.magnitud==='nota') return '«'+t.nota+'»';
    var v = t.valor_texto + (t.unidad && t.valor_num!=null && !/[a-z″"′':]/i.test(t.valor_texto) ? (t.unidad==='s'?' s':t.unidad==='kg'?' kg':t.unidad==='reps'?' reps':' m') : '');
    if (t.ambiguo) v += ' (sin interpretar: aclarar)';
    if (t.magnitud==='carga' && t.carga_modo==='por_mancuerna') v += ' por mancuerna';
    return v;
  }
  function etiquetaDato(t){
    return [t.serie ? (t.alcance==='serie'?'serie ':'toma ')+t.serie : '', t.parte || '', t.tramo && t.tramo!=='total' ? t.tramo : '', t.lado || ''].filter(Boolean).join(' · ');
  }
  /* Discrepancias: SOLO cuando es la misma fila, la misma toma, tramo total, sin
     lado y tiempo — lo que el atleta apunta por toma en su app. Lo demás que el
     atleta escribió (texto libre, otras partes) queda «pendiente de vincular». */
  function discrepancias(s, aid, r){
    var out = { pares:[], pendientes:[] };
    var tr = r && r.tiempos_reales && typeof r.tiempos_reales==='object' ? r.tiempos_reales : {};
    tomaDe(s.id, aid).forEach(function(t){
      if (t.magnitud!=='tiempo' || t.adicional || !t.fila_id || t.valor_num==null) return;
      var ta = tr[t.fila_id], vals = ta && Array.isArray(ta.tiempos) ? ta.tiempos : [];
      var va = t.serie ? vals[t.serie-1] : null, la = va!=null && va!=='' && va!=='hecha' ? leerValor(va, 'tiempo') : null;
      if (!la || la.num==null) return;
      // Con tramos, lados o partes (250 + 150) el atleta da UN valor por toma y no se sabe de qué es.
      if (t.tramo!=='total' || t.lado || t.repeticion){ out.pendientes.push({ t:t, va:va }); return; }
      if (Math.abs(la.num - t.valor_num) > 0.004) out.pares.push({ t:t, va:String(va) });
    });
    return out;
  }

  /* ================= EDITOR (el planificador, encima de la semana) =================

  var ED = { fr:null };

      }).join('')+'</div><div id="pub-res"></div>'+
      '<div class="pie"><button type="button" class="ac-btn" data-dlg-no="1">Cancelar</button><button type="button" class="ac-btn pri" data-pub-ok="1">Publicar</button></div>');
    d.classList.add('ancho');
    var cuenta = function(){ var n = d.querySelectorAll('.pub-chk:checked').length; d.querySelector('[data-pub-ok]').textContent = n===1 ? 'Publicar 1 sesión' : 'Publicar '+n+' sesiones'; d.querySelector('[data-pub-ok]').disabled = !n; };
