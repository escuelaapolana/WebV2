    dlg.addEventListener('click', async function(ev){
      if (ev.target.closest('[data-dlg-no]')){ cerrarDialogo(); return; }
      if (!ev.target.closest('[data-imp-ok]')) return;

  async function imprimir(o){
    var d = ST.dia;
    var vale = function(s){ return esEntrenoDia(s) && (s.publicada || o.borradores); };
    var privadas = {};
    if (o.privado){
      var ids = entrenosDelDia(d).map(function(x){ return x.s.id; });
      if (ids.length){ var rp = await sb.from('sesiones_nota_privada').select('sesion_id,nota').in('sesion_id', ids); (rp.data||[]).forEach(function(x){ privadas[x.sesion_id] = x.nota; }); }
    }
    var casillas = function(nombres){
      if (!o.casillas || !nombres.length) return '';
      var th = ''; for (var i=1;i<=o.ncas;i++) th += '<th>'+i+'</th>';
      return '<table class="imp-cas"><tr><th class="n"></th>'+th+'<th class="obs">Observaciones</th></tr>'+nombres.map(function(n){ var td=''; for (var i=0;i<o.ncas;i++) td+='<td></td>'; return '<tr><td class="n">'+esc(n)+'</td>'+td+'<td class="obs"></td></tr>'; }).join('')+'</table>';
    };
    // Las casillas, donde se toman tiempos: no en el calentamiento ni en la vuelta a la calma.
    var conCasillas = function(b){ return lineasDe(b).length && !NO_PRINC.test(b.etiqueta||''); };
    var lineasTxt = function(b){ return lineasDe(b).map(function(l){ return '<div>'+esc(l)+'</div>'; }).join('')+(b.nota_pie?'<div><i>'+esc(b.nota_pie)+'</i></div>':''); };
    var cabBloque = function(b){ var rb = recBloque(b); return '<b>'+esc(b.etiqueta||'Sesión')+'</b>'+(b.matiz?' — '+esc(b.matiz):'')+(rb?'<br><small>Descanso después: '+esc(rb)+'</small>':''); };
    var marcaBor = function(s){ return s.publicada ? '' : ' <span class="imp-bor">BORRADOR · no publicado</span>'; };
    var salud = function(aid){
      if (!o.privado) return '';
      var r = restrDe(aid).map(restrTxt), ay = []; sesDe(aid, sumar(d,-1)).forEach(function(s){ var m = molestiaTxt(D.reg[s.id+'|'+aid]); if (m) ay.push('ayer '+m); });
      return (r.length||ay.length) ? '<div class="imp-q"><i>Salud: '+esc(r.concat(ay).join(' · '))+'</i></div>' : '';
    };
    var secciones = [];
    // Un grupo de trabajo, en tabla: bloque | lo común o lo de cada uno
    function seccionGrupo(g){
      var ms = miembrosGT(g, true).filter(function(m){ return !ausDeSesion(m.s, m.aid) && vale(m.s); });
      if (!ms.length) return '';
      var bloque = ms.every(function(m){ return m.bloque===ms[0].bloque; }) ? ms[0].bloque : null;
      var filas = ordenEtiquetas(ms.map(function(m){ return m.s; })).map(function(e){
        var aqui = ms.map(function(m){ return { m:m, b:bloqueDe(m.s, e) }; }).filter(function(x){ return x.b && (!bloque || bloque===e); });
        var solos = ms.map(function(m){ return { m:m, b:bloqueDe(m.s, e) }; }).filter(function(x){ return x.b && bloque && bloque!==e; });
        var celda = '';
        if (aqui.length){
          var firmas = {}; aqui.forEach(function(x){ var k = firmaBloque(x.b); (firmas[k] = firmas[k] || []).push(x); });
          var ks = Object.keys(firmas);
          celda = ks.length===1 ? lineasTxt(aqui[0].b) : ks.map(function(k){ return '<div class="imp-ind"><b>'+esc(firmas[k].map(function(x){ return nombreDe(x.m.aid); }).join(', '))+':</b>'+lineasTxt(firmas[k][0].b)+'</div>'; }).join('');
        }
        celda += solos.map(function(x){ return '<div class="imp-ind"><b>'+esc(nombreDe(x.m.aid))+' (por su cuenta):</b>'+lineasTxt(x.b)+'</div>'; }).join('');
        var b0 = (aqui[0] || solos[0]).b;
        return '<tr><th>'+cabBloque(b0)+'</th><td>'+celda+(aqui.length && conCasillas(b0) ? casillas(aqui.map(function(x){ return nombreDe(x.m.aid); })) : '')+'</td></tr>';
      }).join('');
      var obj = agruparIguales(ms.map(function(m){ return { aid:m.aid, txt:[m.s.objetivo||''] }; })).filter(function(x){ return x.txt[0]; });
      return '<div class="imp-g"><h2>'+esc(g.nombre)+(bloque?' · '+esc(bloque):'')+(ms.some(function(m){ return !m.s.publicada; })?' <span class="imp-bor">incluye BORRADOR</span>':'')+'</h2>'+
        '<div class="imp-q">'+esc(ms.map(function(m){ return nombreDe(m.aid); }).join(', '))+(obj.length?' · Objetivo: '+esc(obj.map(function(x){ return (obj.length>1?x.quien+': ':'')+x.txt[0]; }).join(' · ')):'')+'</div>'+
        ms.map(function(m){ return salud(m.aid); }).join('')+
        '<table class="imp-t">'+filas+'</table></div>';
    }
    /* Una sesión individual. Si varios atletas tienen EXACTAMENTE la misma
       (sin grupo de trabajo), sale una vez con sus nombres y una fila de
       casillas para cada uno. */
    function firmaSesion(s, aid){
      var U = usosGT(d);
      return JSON.stringify([s.momento, s.hora, s.titulo, s.objetivo, exigTxt(s), s.publicada, s.nota_razonamiento||'', (s.bloques||[]).map(firmaBloque), U.bloques[s.id+'|'+aid] || [], o.privado ? privadas[s.id]||'' : '']);
    }
    function seccionSesion(s, aids){
      var U = usosGT(d), parte = U.bloques[s.id+'|'+aids[0]] || [], nombres = aids.map(nombreDe);
      return '<div class="imp-g"><h2>'+esc(nombres.join(', '))+' · '+esc(tituloDe(s))+(MOMENTO[s.momento]?' ('+esc(MOMENTO[s.momento].toLowerCase())+(s.hora?' '+hhmm(s.hora):'')+')':'')+marcaBor(s)+'</h2>'+
        (s.objetivo||exigTxt(s) ? '<div class="imp-q">'+esc([s.objetivo, exigTxt(s)].filter(Boolean).join(' · '))+'</div>' : '')+aids.map(salud).join('')+
        '<table class="imp-t">'+(s.bloques||[]).map(function(b){
          return '<tr><th>'+cabBloque(b)+'</th><td>'+(parte.indexOf(b.etiqueta||'')!==-1 ? '<i>Con su grupo de trabajo.</i>' : lineasTxt(b)+(conCasillas(b)?casillas(nombres):''))+'</td></tr>';
        }).join('')+'</table>'+
        (s.nota_razonamiento ? '<div class="imp-q">Instrucciones: '+esc(s.nota_razonamiento)+'</div>' : '')+
        (o.privado && privadas[s.id] ? '<div class="imp-q"><i>Nota privada: '+esc(privadas[s.id])+'</i></div>' : '')+'</div>';
    }
    var gts = D.gt.filter(function(g){ return g.fecha===d; });
    if (o.que==='grupo'){ var g1 = gts.filter(function(g){ return g.id===o.gt; })[0]; if (g1) secciones.push(seccionGrupo(g1)); }
    else {
      var enGrupo = {};
      if (o.que==='todo'){
        gts.forEach(function(g){ var h = seccionGrupo(g); if (h){ secciones.push(h); miembrosGT(g, true).forEach(function(m){ if (!m.bloque) enGrupo[m.s.id+'|'+m.aid] = 1; }); } });
      }
      var quien = o.que==='atletas' ? o.atletas : D.atl.map(function(a){ return a.id; });
      var juntas = [], porFirma = {};
      quien.forEach(function(aid){
        sesDe(aid, d).filter(function(s){ return vale(s) && !enGrupo[s.id+'|'+aid] && !ausDeSesion(s, aid); }).forEach(function(s){
          var k = firmaSesion(s, aid);
          if (!porFirma[k]){ porFirma[k] = { s:s, aids:[] }; juntas.push(porFirma[k]); }
          porFirma[k].aids.push(aid);
        });
      });
      juntas.forEach(function(j){ secciones.push(seccionSesion(j.s, j.aids)); });
    }
    var descansos = [], ausentes = [];
    D.atl.forEach(function(a){
      var L = sesDe(a.id, d);
      if (L.some(function(s){ return s.clase_dia==='descanso'; }) && !L.some(esEntrenoDia)) descansos.push(a._n);
      if (ausDia(a.id, d).length) ausentes.push(a._n);
    });
    var fl = fLarga(d);
    imp.innerHTML = '<h1>'+esc(ST.g.nombre)+' · '+esc(fl.charAt(0).toUpperCase()+fl.slice(1))+'</h1>'+
      '<div class="imp-sub">Z = zapatillas · C = clavos · // = recuperación'+(o.privado?' · INCLUYE avisos de salud y notas privadas':'')+(o.borradores?' · incluye borradores marcados':'')+'</div>'+
      (secciones.join('') || '<p>No hay nada publicado que imprimir con esa selección.'+(entrenosDelDia(d).some(function(x){ return !x.s.publicada; })?' Hay borradores: márcalos para incluirlos.':'')+'</p>')+
      '<div class="imp-pie">'+(descansos.length?'Descanso: '+esc(descansos.join(', '))+'. ':'')+(ausentes.length?'Ausentes: '+esc(ausentes.join(', '))+'. ':'')+'Impreso el '+fechaHora(new Date().toISOString())+'.</div>';
    document.body.classList.add('ac-imprimiendo');
    var fin = function(){ document.body.classList.remove('ac-imprimiendo'); window.removeEventListener('afterprint', fin); };
    window.addEventListener('afterprint', fin);
    setTimeout(function(){ window.print(); }, 50);
  }

  /* ================= FEEDBACK · una bandeja para revisar =================
     Una fila por sesión y atleta del rango: lo que respondió, tus datos de
     pista, tus observaciones, discrepancias y cambios posteriores. Se abre
     con el MISMO detalle y se revisa con la MISMA función
     (academia_marcar_revisado). Revisar = haberlo leído: no cierra una
     incidencia ni da el entrenamiento por hecho. */
  var EST_FB = {
    recibido:          ['Recibido · sin revisar', 't-nuevo'],
    corregido:         ['Corregido después de revisarlo', 't-nuevo'],
    revisado:          ['Revisado', 't-hecha'],
    pendiente_vencido: ['Pendiente de recibir · plazo vencido', 't-rev'],
    pendiente_plazo:   ['Pendiente de recibir · en plazo', 't-sind'],
    no_requerido:      ['Feedback no requerido', 't-sind'],
    registro_falta:    ['Registro del entrenador · falta el tuyo', 't-rev'],
    registro_plazo:    ['Registro del entrenador · aún en plazo', 't-sind'],
    registro_hecho:    ['Registro del entrenador · hecho', 't-v'],
    ausente:           ['Ausente · no se pide feedback', 't-sind']
  };
  var FILTROS_FB = [['por_revisar','Por revisar (recibido o corregido)'],['recibido','Recibido sin revisar'],['corregido','Corregido después de revisarlo'],
    ['pendiente','Pendiente de recibir'],['revisado','Revisado'],['no_requerido','Feedback no requerido'],['registro','Registro del entrenador'],['ausente','Ausente'],['todos','Todos']];
  function estadoFb(s, aid){
    var r = D.reg[s.id+'|'+aid];
    if (r) return r.revisado_en ? 'revisado' : (r.revision_anterior_en ? 'corregido' : 'recibido');
    if (ausDeSesion(s, aid)) return 'ausente';
    var modo = modoDe(aid);
    // En «registro del entrenador» no se pide nada al atleta: no hay «falta su feedback».
    if (modo==='registro_entrenador') return D.regEnt[s.id+'|'+aid] ? 'registro_hecho' : (vencido(s) ? 'registro_falta' : 'registro_plazo');
    if (modo==='no_requerido') return 'no_requerido';
    return vencido(s) ? 'pendiente_vencido' : 'pendiente_plazo';
  }
  function pasaFiltroFb(est, f){
    f = f || ST.fb.estado;
    if (f==='todos') return true;
    if (f==='por_revisar') return est==='recibido' || est==='corregido';
    if (f==='pendiente') return est==='pendiente_vencido' || est==='pendiente_plazo';
    if (f==='registro') return est.indexOf('registro_')===0;
    return est===f;
  }
  function listaFb(){
    var L = [], hoy = hoyISO();
    D.ses.forEach(function(s){
      if (s.clase_dia!=='entreno' || D.sust[s.id] || s.fecha > hoy) return;
      if (!s.publicada && !tieneRegistro(s)) return;      // un borrador no se ha pedido a nadie
      atletasDe(s).forEach(function(aid){ if (D.atl.some(function(a){ return a.id===aid; })) L.push({ s:s, aid:aid, est:estadoFb(s, aid) }); });
    });
    L.sort(function(a,b){ return b.s.fecha.localeCompare(a.s.fecha) || nombreDe(a.aid).localeCompare(nombreDe(b.aid),'es') || (ORD_MOM[a.s.momento]||1)-(ORD_MOM[b.s.momento]||1); });
    return L;
  }
  function listaFbFiltrada(){ return listaFb().filter(function(x){ return (!ST.fb.atleta || x.aid===ST.fb.atleta) && pasaFiltroFb(x.est); }); }
  function filaFbHTML(x){
    var s = x.s, aid = x.aid, r = D.reg[s.id+'|'+aid], e = EST_FB[x.est] || [x.est,'t-sind'];
    var lo = [];
    if (r){
      lo.push(r.estado==='a_medias' ? 'Parcial'+(r.completado_pct!=null?' '+r.completado_pct+' %':'') : r.estado==='no_hecho' ? 'No realizada'+(r.motivo_no_hecho?' ('+(NO_HECHO[r.motivo_no_hecho]||r.motivo_no_hecho)+')':'') : 'Realizada');
      if (r.rpe) lo.push('RPE '+r.rpe);
      var mol = molestiaTxt(r); if (mol) lo.push(mol);
    } else if (D.regEnt[s.id+'|'+aid]){ var re = D.regEnt[s.id+'|'+aid]; lo.push((EST_RE[re.estado]||re.estado)+' (tu registro)'); }
    var m = [];

  /* ================= APUNTAR EN PISTA (datos del entrenador) =================
     Lo que el entrenador apunta va a academia_toma_datos (mig 468), aparte del

  var METODOS = [['no_consta','No consta'],['manual','Manual'],['fotocelulas','Fotocélulas'],['electronico_competicion','Electrónico de competición'],['video','Vídeo'],['otro','Otro']];
  var METODO_TXT = {}; METODOS.forEach(function(m){ METODO_TXT[m[0]] = m[1]; });
  var ESTADOS_T = { realizado:'Realizado', parcial:'Parcial', no_realizado:'No realizado' };
  var COLS_TOMA = 'id,sesion_id,sesion_version,atleta_id,fila_id,bloque,alcance,serie,repeticion,parte,tramo,magnitud,valor_texto,valor_num,unidad,ambiguo,metodo,carga_modo,lado,estado,ejercicio_realizado,adicional,nota,version,autor_perfil_id,creado_en,actualizado_por,actualizado_en';

  /* Lo mismo que academia_leer_valor (la base manda; esto es para avisar al momento). */
  function leerValor(t, mag){
    t = String(t||'').replace(/\s+/g,' ').trim();
    if (!t || ['tiempo','carga','repeticiones','distancia'].indexOf(mag)===-1) return { num:null, ambiguo:false };
    var m;
    if (mag==='tiempo'){
      t = t.replace(/\s*(s|seg|segundos)$/i, '');
      if (/^\d{1,3}([.,]\d{1,3})?(″|"|'')?$/.test(t)) return { num:+t.replace(/(″|"|'')$/,'').replace(',','.'), unidad:'s' };
      if ((m = /^(\d{1,3})(?:″|"|'')(\d{1,3})$/.exec(t))) return { num:+(m[1]+'.'+m[2]), unidad:'s' };
      if ((m = /^(\d{1,3}):(\d{2})(?:[.,](\d{1,3}))?$/.exec(t))) return +m[2]>=60 ? { num:null, ambiguo:true, motivo:'los segundos pasan de 59' } : { num:+m[1]*60 + +(m[2]+(m[3]?'.'+m[3]:'')), unidad:'s' };
      if ((m = /^(\d{1,2}):(\d{2}):(\d{2})(?:[.,](\d{1,3}))?$/.exec(t))) return (+m[2]>=60 || +m[3]>=60) ? { num:null, ambiguo:true, motivo:'minutos o segundos pasan de 59' } : { num:+m[1]*3600 + +m[2]*60 + +(m[3]+(m[4]?'.'+m[4]:'')), unidad:'s' };
      if ((m = /^(\d{1,2})(?:′|')(\d{2})(?:(?:″|"|'')(\d{0,3}))?$/.exec(t))) return +m[2]>=60 ? { num:null, ambiguo:true, motivo:'los segundos pasan de 59' } : { num:+m[1]*60 + +(m[2]+(m[3]?'.'+m[3]:'')), unidad:'s' };
      return { num:null, ambiguo:true, motivo:'no se entiende como tiempo (34,52 · 1:28,5)' };
    }
    if (mag==='carga'){ t = t.replace(/\s*kg$/i, ''); return /^\d{1,3}([.,]\d{1,2})?$/.test(t) ? { num:+t.replace(',','.'), unidad:'kg' } : { num:null, ambiguo:true, motivo:'no se entiende como kg' }; }
    if (mag==='repeticiones') return /^\d{1,3}$/.test(t) ? { num:+t, unidad:'reps' } : { num:null, ambiguo:true, motivo:'no es un número de repeticiones' };
    t = t.replace(/\s*m$/i, ''); return /^\d{1,5}([.,]\d{1,2})?$/.test(t) ? { num:+t.replace(',','.'), unidad:'m' } : { num:null, ambiguo:true, motivo:'no se entiende como metros' };
  }
  function fmtNum(n, u){ if (n==null) return ''; if (u==='s' && n>=60){ var mi = Math.floor(n/60), s = n - mi*60; return mi+':'+(s<10?'0':'')+String(Math.round(s*100)/100).replace('.',','); } return String(Math.round(n*100)/100).replace('.',',')+(u==='s'?' s':u==='kg'?' kg':u==='m'?' m':''); }

  /* Cuántas tomas y qué partes sugiere el texto de una fila (solo para dibujar
     las casillas: nunca se rellena nada). */
  function estructuraFila(f){
    var txt = String((f && f.ejercicio) || '').replace(/^Bloque\s+\d+\s*\/\s*\d+\s*:\s*/i, '');
    var nucleo = txt.split('//')[0];
    var n = parseInt(f && f.series, 10), m;
    if (!(n > 0) && (m = /^\s*(\d{1,2})\s*[x×]\s*/.exec(nucleo))) n = +m[1];
    if (!(n > 0)) n = 1;
    nucleo = nucleo.replace(/^\s*\d{1,2}\s*[x×]\s*/, '').trim().replace(/^\((.*)\)$/, '$1');
    var piezas = nucleo.split('+').map(function(p){ return p.trim(); });
    var partes = (piezas.length>=2 && piezas.length<=4 && piezas.every(function(p){ return /^\d/.test(p); })) ? piezas.map(function(p){ return (/^\d+(?:[.,]\d+)?\s*m?/.exec(p)||[''])[0].trim(); }) : [''];
    var carga = !!(f && f.carga) || /\bkg\b|%\s*rm|\brm\b|\brir\b|press|sentadilla|peso muerto|hip thrust|remo|dominada|zancada|cargada|arrancada/i.test(txt);
    if (carga && !(parseInt(f && f.series, 10) > 0) && (m = /(\d{1,2})\s*[x×]\s*\d/.exec(txt))) n = +m[1];
    return { n:Math.min(n, 12), partes:partes, medir: carga ? 'carga' : 'tiempo' };
  }
  function bloqueDeEstructura(b){ return (b.filas||[]).map(function(f){ var e = estructuraFila(f); return e.n+'|'+e.partes.length+'|'+e.medir; }).join(';'); }

  var TOMA = null;   // la hoja abierta
  /* Lo que no ha llegado a la base se guarda TAMBIÉN en este aparato
     (localStorage) hasta que se guarde o se descarte: sobrevive a cerrar la
     hoja o recargar, pero SOLO en este navegador. Si el navegador no lo
     permite (p. ej. modo privado), se dice: entonces cerrar sí lo pierde. */
  var CLAVE_PEND = 'ac-toma-pendientes';
  function leerPend(){ try { var x = JSON.parse(localStorage.getItem(CLAVE_PEND) || '{}'); return x && typeof x==='object' ? x : {}; } catch(e){ return {}; } }
  function escribirPend(m){ try { if (Object.keys(m).length) localStorage.setItem(CLAVE_PEND, JSON.stringify(m)); else localStorage.removeItem(CLAVE_PEND); return true; } catch(e){ return false; } }
  var RESPALDO_OK = escribirPend(leerPend());
  function respaldarToma(){
    if (!TOMA) return;
    var m = leerPend();
    Object.keys(TOMA.celdas).forEach(function(k){
      var c = TOMA.celdas[k], o = c.o || c.dato; if (!o) return;
      var kk = (o.sesion_id||'')+'·'+k;
      if (['sucio','guardando','error','conflicto','bloqueado'].indexOf(c.est)!==-1)
        m[kk] = { k:k, o:o, texto:c.texto||'', id:c.id||null, version:c.version||null, quitar:!!c.quitar,
                  cuenta: perfil && perfil.id, problema: c.est==='bloqueado' ? (c.msg||'') : (m[kk] && m[kk].problema) || null,
                  metodo: o.magnitud==='tiempo' ? (c.metodoNuevo || (c.dato && c.dato.metodo) || TOMA.metodo) : null,
                  grupo:ST.g.grupo_id, fecha:(TOMA.miembros[0] && TOMA.miembros[0].s.fecha) || ST.dia, en:new Date().toISOString() };
      else delete m[kk];
    });
    RESPALDO_OK = escribirPend(m);
  }
  // Solo lo que creó ESTA cuenta en ESTE grupo: lo de otra cuenta ni se enseña ni se envía.
  function pendDelGrupo(){ var m = leerPend(), yo = perfil && perfil.id; return Object.keys(m).filter(function(kk){ return m[kk] && yo && m[kk].cuenta===yo && m[kk].grupo===ST.g.grupo_id; }).map(function(kk){ return Object.assign({ kk:kk }, m[kk]); }); }
  var PROBLEMA = { archivada:'la sesión se archivó', sin_permiso:'ya no tienes permiso sobre esa sesión', no_existe:'la sesión ya no existe' };
  /* El dato que se manda a la base para una casilla (alta, cambio o borrado). */
  function itemDato(c){
    var o = c.o || c.dato; if (!o) return null;
    var vacio = c.quitar || (!c.texto && !o.adicional);
    if (vacio && !c.id) return null;
    if (!c.id) c.id = uuidNuevo();
    var it = { id:c.id };
    if (c.version) it.version_base = c.version;
    if (vacio){ it.anular = true; return it; }
    Object.assign(it, { sesion_id:o.sesion_id, atleta_id:o.atleta_id, fila_id:o.fila_id||null, bloque:o.bloque, alcance:o.alcance, serie:o.serie, repeticion:o.repeticion, parte:o.parte, tramo:o.tramo||'total', magnitud:o.magnitud, lado:o.lado, carga_modo:o.carga_modo, adicional:!!o.adicional, ejercicio_realizado:o.ejercicio_realizado||null });

    else if (o.magnitud==='nota') it.nota = o.adicional ? (c.texto||null) : c.texto;
    else it.valor_texto = c.texto;
    if (o.adicional && o.magnitud==='nota') it.valor_texto = null;
    if (o.magnitud==='tiempo') it.metodo = c.metodoNuevo || (c.dato && c.dato.metodo && c.version ? c.dato.metodo : null) || (TOMA ? TOMA.metodo : 'no_consta');
    return it;
  }
  function uuidNuevo(){ try { if (crypto.randomUUID) return crypto.randomUUID(); } catch(e){} return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, function(){ return (Math.random()*16|0).toString(16); }); }
  function claveDato(o){ return [o.atleta_id, o.sesion_id, o.fila_id||'', o.alcance, o.serie||0, o.repeticion||0, o.tramo||'total', o.magnitud, o.lado||''].join('|'); }
  function tomaDe(sid, aid){ return (D.toma||[]).filter(function(t){ return t.sesion_id===sid && t.atleta_id===aid; }); }

  /* Abre la hoja para unos atletas y unos bloques (cada atleta con SU sesión
     y SUS filas: en un grupo cada uno conserva su prescripción). */
  function abrirToma(etiquetas, miembros, titulo){
    var celdas = {};
    miembros.forEach(function(m){ tomaDe(m.s.id, m.aid).forEach(function(t){ if (!t.adicional) celdas[claveDato(t)] = { dato:t, id:t.id, version:t.version, texto: t.magnitud==='estado' ? t.estado : t.magnitud==='sustitucion' ? t.ejercicio_realizado : t.magnitud==='nota' ? t.nota : t.valor_texto, srv:null, est:'guardado' }; }); });
    Object.keys(celdas).forEach(function(k){ celdas[k].srv = celdas[k].texto; });
    TOMA = { etiquetas:etiquetas, miembros:miembros, titulo:titulo, celdas:celdas, opc:{}, metodo: (leer('ac-metodo') || 'no_consta') };
    // El trabajo adicional no tiene casilla fija: cada uno con su id
    miembros.forEach(function(m){ tomaDe(m.s.id, m.aid).forEach(function(t){ if (t.adicional) celdas['adic|'+t.id] = { dato:t, id:t.id, version:t.version, texto:t.valor_texto||'', srv:t.valor_texto||'', est:'guardado', o:{ sesion_id:t.sesion_id, atleta_id:t.atleta_id, bloque:t.bloque, alcance:t.alcance, magnitud:t.magnitud, adicional:true, ejercicio_realizado:t.ejercicio_realizado } }; }); });
    var sids = {}; miembros.forEach(function(m){ sids[m.s.id+'|'+m.aid] = 1; });
    var rec = pendDelGrupo().filter(function(e){ return e.o && sids[e.o.sesion_id+'|'+e.o.atleta_id]; });
    rec.forEach(function(e){

      var ses = D.sesPorId[e.o.sesion_id];
      c.o = e.o; c.texto = e.texto; c.quitar = e.quitar;
      if (e.problema || (ses && ses.archivada_en)){ c.est = 'bloqueado'; c.msg = e.problema || PROBLEMA.archivada; }
      else c.est = 'sucio';
      if (e.id) c.id = e.id; if (e.version) c.version = e.version;   // con la versión de entonces: si alguien cambió algo, saldrá el conflicto
      if (e.metodo && e.o.magnitud==='tiempo') c.metodoNuevo = e.metodo;
    });
    TOMA.recuperados = rec.length;
    pintarToma();
    document.getElementById('ac-toma').hidden = false;
    document.body.classList.add('ac-ed-abierto');
    if (rec.length) guardarToma();
  }
  /* Opciones de cada fila de la hoja (tomas, partes, tramos, qué se mide). */
  function opcFila(k, f){
    if (!TOMA.opc[k]){
      var e = estructuraFila(f);
      TOMA.opc[k] = { n:e.n, partes:e.partes, medir:e.medir, tramos:['total'], lados:false, carga_modo:'total' };
      // si ya hay datos guardados con más tomas o más tramos, se respetan
      Object.keys(TOMA.celdas).forEach(function(c){ var d = TOMA.celdas[c].dato; if (!d) return;
        if (TOMA.filaDeClave && TOMA.filaDeClave[k] && TOMA.filaDeClave[k].indexOf(d.fila_id)!==-1){
          if (d.serie && d.serie > TOMA.opc[k].n) TOMA.opc[k].n = d.serie;
          if (d.tramo && TOMA.opc[k].tramos.indexOf(d.tramo)===-1 && (d.magnitud==='tiempo' || d.magnitud==='distancia')) TOMA.opc[k].tramos.push(d.tramo);
          if (d.lado) TOMA.opc[k].lados = true;
          if (d.magnitud==='carga' || d.magnitud==='repeticiones') TOMA.opc[k].medir = d.magnitud==='carga' ? 'carga' : (TOMA.opc[k].medir==='carga'?'carga':'repeticiones');
          if (d.carga_modo) TOMA.opc[k].carga_modo = d.carga_modo;
        } });
    }
    return TOMA.opc[k];
  }
  function celdaHTML(base, extra, mag, label){
    var o = Object.assign({}, base, extra, { magnitud:mag }), k = claveDato(o), c = TOMA.celdas[k] || {};
    var est = c.est || '', v = c.texto==null ? '' : c.texto;
    var lv = (mag==='tiempo'||mag==='carga'||mag==='repeticiones') && v ? leerValor(v, mag) : null;

  async function guardarToma(){
    if (!TOMA) return;
    var claves = Object.keys(TOMA.celdas).filter(function(k){ return TOMA.celdas[k].est==='sucio' || TOMA.celdas[k].est==='error'; });
    if (!claves.length) return;
    var items = [], porId = {};
    var borrando = {};
    claves.forEach(function(k){
      // Vacía = sin dato (se anula si estaba guardada). El trabajo adicional se quita a propósito.
      var c = TOMA.celdas[k], it = itemDato(c);
      if (!it){ c.est = ''; return; }
      if (it.anular) borrando[it.id] = 1;
      c.est = 'guardando'; c.enviado = c.texto; items.push(it); porId[c.id] = k;
    });
    refrescarEstadoToma();
    if (!items.length) return;
    var r;
    try { r = await sb.rpc('academia_toma_guardar', { p_datos: items }); if (r.error) throw r.error; }
    catch(err){
      items.forEach(function(it){ var c = TOMA && TOMA.celdas[porId[it.id]]; if (c){ c.est = 'error'; c.msg = (err && err.message) || 'sin conexión'; } });
      if (TOMA){ pintarTomaConservando(); }
      return;
    }
    ((r.data && r.data.resultados) || []).forEach(function(x){
      var k = porId[x.id]; if (!k || !TOMA) return; var c = TOMA.celdas[k];
      if (x.ok){
        var d = x.dato || {};
        // Se quería borrar algo cuyo alta sí había llegado: ahora se borra con su versión.
        if (x.repetido && borrando[x.id]){ c.id = d.id; c.version = d.version; c.dato = d; c.est = 'sucio'; return; }
        if (d.anulado_en){ c.id = null; c.version = null; c.dato = null; c.srv = ''; }
        else { c.id = d.id; c.version = d.version; c.dato = d; c.srv = c.enviado; }
        c.est = (c.texto||'') === (c.enviado||'') ? (d.anulado_en ? '' : 'guardado') : 'sucio';
        c.metodoNuevo = null;
        // el dato en memoria de la página, para que el detalle lo vea al cerrar
        D.toma = (D.toma||[]).filter(function(t){ return t.id!==d.id; }); if (!d.anulado_en && d.id) D.toma.push(d);
      } else if (PROBLEMA[x.conflicto]){
        c.est = 'bloqueado'; c.msg = PROBLEMA[x.conflicto];
      } else {
        var su = x.dato || {};
        c.est = 'conflicto'; c.suyo = su.magnitud==='estado' ? su.estado : su.magnitud==='sustitucion' ? su.ejercicio_realizado : su.magnitud==='nota' ? su.nota : su.valor_texto;
        c.suDato = su;
        if (x.conflicto==='otra_pantalla') c.id = null;   // la casilla ya existe con otro id
      }
    });
    pintarTomaConservando();
    var sinNombre = [];
    Object.keys(TOMA.celdas).forEach(function(k){ var su = TOMA.celdas[k].suDato; var id = su && (su.actualizado_por || su.autor_perfil_id); if (TOMA.celdas[k].est==='conflicto' && id && !NOMBRES[id] && !(perfil && id===perfil.id) && sinNombre.indexOf(id)===-1) sinNombre.push(id); });
    if (sinNombre.length){ var rn = await sb.from('perfiles').select('id,nombre').in('id', sinNombre); (rn.data||[]).forEach(function(x){ NOMBRES[x.id] = x.nombre; }); if (TOMA) pintarTomaConservando(); }
    if (TOMA && pendientesToma().some(function(k){ return TOMA.celdas[k].est==='sucio'; })) { clearTimeout(_tmT); _tmT = setTimeout(guardarToma, 400); }
  }

  /* Tramo canónico: «0-30», «0–30», «0 a 30» → «0-30»; «total»; si no, el texto tal cual. */
  function tramoCanon(t){
    t = String(t==null ? 'total' : t).trim().toLowerCase(); if (!t || t==='total') return 'total';
    var m = /(\d+(?:[.,]\d+)?)\s*(?:m\s*)?(?:-|–|—|a)\s*(\d+(?:[.,]\d+)?)/.exec(t);
    return m ? Number(m[1].replace(',', '.'))+'-'+Number(m[2].replace(',', '.')) : t;
  }
  /* Discrepancias, dato a dato y nunca por posición:
     · si el atleta identificó el tiempo (fila, serie, repetición y tramo), se compara con el
       mismo dato del entrenador, también por tramos;
     · si no, solo la toma entera (tramo total, sin lado ni repetición) contra su tiempo de esa serie;
     · lo demás queda «pendiente de vincular». */
  function discrepancias(s, aid, r){
    var out = { pares:[], pendientes:[] };
    var tr = r && r.tiempos_reales && typeof r.tiempos_reales==='object' ? r.tiempos_reales : {};
    var ta = r && Array.isArray(r.tramos_atleta) ? r.tramos_atleta : [];
    tomaDe(s.id, aid).forEach(function(t){
      if (t.magnitud!=='tiempo' || t.adicional || !t.fila_id || t.valor_num==null) return;
      var idA = ta.filter(function(x){ return x.fila_id===t.fila_id && Number(x.serie||0)===Number(t.serie||0) && Number(x.repeticion||0)===Number(t.repeticion||0) && tramoCanon(x.tramo || (x.desde_m!=null && x.hasta_m!=null ? x.desde_m+'-'+x.hasta_m : 'total'))===tramoCanon(t.tramo) && !t.lado; })[0];
      if (idA){
        var li = leerValor(idA.valor_texto, 'tiempo');
        if (li && li.num!=null && Math.abs(li.num - t.valor_num) > 0.004) out.pares.push({ t:t, va:String(idA.valor_texto), metodoA:idA.metodo||null, tramo:tramoCanon(t.tramo) });
        return;
      }
      var tf = tr[t.fila_id], vals = tf && Array.isArray(tf.tiempos) ? tf.tiempos : [];
      var va = t.serie ? vals[t.serie-1] : null, la = va!=null && va!=='' && va!=='hecha' ? leerValor(va, 'tiempo') : null;
      if (!la || la.num==null){ if (t.tramo!=='total' && ta.length) out.pendientes.push({ t:t, va:null }); return; }
      // Con tramos, lados o partes (250 + 150) el atleta da UN valor por toma y no se sabe de qué es.
      if (t.tramo!=='total' || t.lado || t.repeticion){ out.pendientes.push({ t:t, va:va }); return; }
      if (Math.abs(la.num - t.valor_num) > 0.004) out.pares.push({ t:t, va:String(va), metodoA:null, tramo:'total' });
    });
    return out;
  }

        return '<div class="ac-disc">'+esc(etiquetaDato(p.t)||'toma')+' · tramo '+esc(p.tramo==='total'?'total':p.tramo)+': atleta <b>'+esc(p.va)+'</b> (método: '+esc(METODO_TXT[p.metodoA]||'no consta')+') · entrenador <b>'+esc(p.t.valor_texto)+'</b> ('+esc(METODO_TXT[p.t.metodo]||'')+')'+

  /* ================= EDITOR (el planificador, encima de la semana) =================
     Es el mismo editor de Planificar (portal/entrenador/), abierto en un marco
     con ?embebido=academia. La semana no se mueve: al guardar se recarga en el
     mismo sitio y se abre el detalle de lo guardado. El marco se queda cargado
     para que la siguiente vez se abra al momento. */
  var ED = { fr:null };
  function abrirEditor(p){
    var caja = document.getElementById('ac-ed'), carga = document.getElementById('ac-ed-carga');
    caja.hidden = false; carga.hidden = false; document.body.classList.add('ac-ed-abierto');
    var datos = Object.assign({ g:ST.g.grupo_id }, p);
    if (!ED.fr){
      var q = new URLSearchParams({ embebido:'academia' });
      Object.keys(datos).forEach(function(k){ if (datos[k]) q.set(k, datos[k]); });
      ED.fr = document.createElement('iframe');
      ED.fr.title = 'Editor de la sesión';
      var url = window.APOLANA_EDITOR || ((window.APOLANA_BASE || '../../')+'portal/entrenador/');
      ED.fr.src = url + (url.indexOf('?')===-1 ? '?' : '&') + q.toString();
      caja.querySelector('.ac-ed-caja').appendChild(ED.fr);
    } else {
      ED.fr.contentWindow.postMessage({ academia:'abrir', p:datos }, location.origin);
    }
  }
  function cerrarEditor(){ document.getElementById('ac-ed').hidden = true; document.body.classList.remove('ac-ed-abierto'); }

  window.addEventListener('message', async function(ev){

      avisar(m.academia==='borrada' ? (m.archivada ? 'Archivada: sale del plan y se guarda lo que registró' : 'Sesión borrada')
           : m.modo==='revision' ? 'Guardado como revisión pendiente: aplícala cuando quieras'
           : m.modo==='nota' ? 'Nota privada guardada (la sesión no cambia)'
           : (m.ids && m.ids.length>1 ? plural(m.ids.length,'borrador creado','borradores creados') : 'Borrador guardado'));
      await recargar();
      if (m.academia==='guardado' && m.ids && m.ids.length){
        var s0 = D.sesPorId[m.ids[0]];

    }
  });

  /* ================= APLICAR A OTROS ATLETAS ================= */
  /* Trozos del texto de un bloque que son ritmos («34-35″», «1:05», «85%»). */
  function ritmosEnTexto(b){
    var out = [];
    (b.filas||[]).forEach(function(f){ var t = String((f && (f.ejercicio||'')+' '+(f.detalle||'')) || ''); var m = t.match(/\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?\s*(?:″|"|'')|\d+:\d\d|\d+(?:[.,]\d+)?\s*%/g); if (m) out = out.concat(m); });
    return out;
  }

      (etiquetas.length ? '<h4>Bloques (se sustituye el bloque con el mismo nombre)</h4><div class="ac-chips">'+etiquetas.map(function(e){ return '<label><input type="checkbox" class="ap-bloque" value="'+esc(e)+'">'+esc(e)+'</label>'; }).join('')+'</div>'+
        '<label class="op" style="margin-top:8px"><input type="checkbox" id="ap-conservar" checked> <span>Conservar las columnas «Ritmo» y «Observaciones» de cada uno, fila a fila. <b>No</b> conserva los ritmos escritos dentro del texto.</span></label>'+
        '<div id="ap-aviso-ritmos"></div>' : '')+
      '<h4>A quién</h4><div class="ac-chips">'+D.atl.filter(function(a){ return a.id!==aid0; }).map(function(a){ return '<label><input type="checkbox" class="ap-at" value="'+a.id+'"'+(conGT[a.id]?' checked':'')+'>'+esc(a._n)+'</label>'; }).join('')+'</div>'+
      '<div id="ap-res"></div>'+
      '<div class="pie"><button type="button" class="ac-btn" data-dlg-no="1">Cancelar</button><button type="button" class="ac-btn" data-ap-sim="1">Ver a quién afecta</button><button type="button" class="ac-btn pri" data-ap-ok="1" hidden>Aplicar</button></div>');
    d.classList.add('ancho');
    var esperado = null;
    var leer = function(sel){ return Array.prototype.map.call(d.querySelectorAll(sel+':checked'), function(c){ return c.value; }); };
    var olvidar = function(){ esperado = null; d.querySelector('#ap-res').innerHTML = ''; d.querySelector('[data-ap-ok]').hidden = true; avisoRitmos(); };
    /* Si un bloque marcado lleva los ritmos DENTRO del texto («250 (34-35″)»),
       se dice claro: al aplicarlo se sustituyen los de cada atleta. */
    function avisoRitmos(){
      var caja = d.querySelector('#ap-aviso-ritmos'); if (!caja) return;
      var marc = leer('.ap-bloque');

        '. Al aplicarlo, cada atleta pasa a tener los de '+esc(nombreDe(aid0))+'. La opción de conservar solo afecta a las columnas Ritmo y Observaciones. Si cada uno debe mantener los suyos, cambia lo común a mano en cada sesión.</div>' : '';

      nota_privada: function(x){ return 'Está publicada: solo cambia su nota privada (no la ve).'; },

    d.addEventListener('click', async function(ev){

      (sim||ok).disabled = false;

      var x = r.data || {};
      if (x.ok===false){ d.querySelector('#ap-res').innerHTML = '<div class="ac-aviso">'+esc(x.mensaje)+'</div>'; d.querySelector('[data-ap-ok]').hidden = true; esperado = null; return; }

          else if (!t && y.accion==='crear') dif = lineasPlan(Object.assign({ momento:s0.momento }, cam)).map(function(l){ return '<span class="ac-mas">Ahora: '+esc(l)+'</span>'; }).join('');
          var campos = Object.keys(cam).filter(function(k){ return k!=='exigencia_neuro' && k!=='exigencia_meta' && k!=='hora'; }).map(function(k){ return ({titulo:'título',objetivo:'objetivo',exigencia:'exigencia',momento:'momento',nota_razonamiento:'instrucciones',bloques:'bloques'})[k]||k; });
          if (y.nota_privada) campos.push('nota privada');
          var pierde = t && cam.bloques ? (s0.bloques||[]).filter(function(b){ var tb = bloqueDe(t, b.etiqueta||''); return ritmosEnTexto(b).length && tb && JSON.stringify(lineasDe(tb))!==JSON.stringify(lineasDe(b)); }).map(function(b){ return b.etiqueta; }) : [];
          return '<li'+(y.accion==='saltar'?' class="salta"':'')+'><b>'+esc(nombreDe(y.atleta_id))+'</b>'+(campos.length && y.accion!=='saltar' && y.accion!=='sin_cambios' ? ' · '+esc(campos.join(', ')) : '')+
            '<span class="acc">'+esc(ACC[y.accion] ? ACC[y.accion](y) : y.accion)+'</span>'+
            (pierde.length && y.accion!=='saltar' ? '<span class="acc salta"><b>Se sustituyen sus ritmos</b> de «'+esc(pierde.join('», «'))+'» por los de '+esc(nombreDe(aid0))+'.</span>' : '')+(y.accion!=='saltar' && dif ? '<details class="ac-dif2" style="margin-top:4px"><summary>Antes / ahora</summary>'+dif+'</details>' : '')+'</li>';
        }).join('')+'</ul>';

        return;

  /* Filas de objetivos: las pruebas del perfil (su texto original, leído con el catálogo)
     y las que ya tienen objetivo. Una prueba sin confirmar sale con su texto y avisa. */
  function filasObjetivos(a){
    var L = [], vistos = {};
    var add = function(texto, tipoP, pid0){
      if (!pid0 && tipoP!=='otra'){   // un uso del perfil decidido en el Catálogo
        var nn = normPrueba(String(texto).replace(/\s*\([0-9.,\s]+\)\s*$/, '')), u = (TM.usos||[]).filter(function(x){ return x.origen==='perfil' && x.registro_id===a.id && x.texto_norm===nn; })[0];
        if (u){ if (u.decision==='prueba') u.prueba_ids.forEach(function(id){ add(texto, tipoP, id); }); return; }
      }
      var pr = pid0 ? { id:pid0, p:TM.pid[pid0], estado:'catalogo' } : pruebaDe({ prueba:texto });
      var k = pr.id || 't:'+normPrueba(texto); if (vistos[k]) return; vistos[k] = 1;
      L.push({ k:k, pid:pr.id||null, texto: pr.p ? pr.p.nombre : texto, original:texto, tipoP:tipoP, estado:pr.estado });
    };
    (a.pruebas_principales||[]).forEach(function(t){ if (t) add(t, 'principal'); });
    (a.pruebas_secundarias||[]).forEach(function(t){ if (t) add(t, 'secundaria'); });
    TM.obj.filter(function(o){ return o.atleta_id===a.id; }).forEach(function(o){ add(o.prueba, 'con objetivo', o.prueba_id); });
    return L;
  }

  /* Enlace a la ficha de Academia de un atleta (desde Semana y desde el detalle). */
  function urlFicha(aid){ return location.pathname+'?v=ficha&a='+encodeURIComponent(aid)+(ST.grupos.length>1 ? '&g='+ST.g.grupo_id : ''); }

      ev.preventDefault();
      var dest = document.getElementById(b.getAttribute('href').slice(1)), sec = dest && dest.closest('details.fx-sec');

    }

    if (ds.anVer && AN && AN.det[ds.anVer]){ var dv = dialogo(AN.det[ds.anVer]+'<div class="pie"><button type="button" class="ac-btn" data-dlg-no="1">Cerrar</button></div>'); dv.classList.add('ancho'); dv.addEventListener('click', function(e2){ if (e2.target.closest('[data-dlg-no]')) cerrarDialogo(); }); return true; }

    if (ds.anModelo && AN && AN.obj){ var ob = Object.assign({}, AN.obj, { temporada: AN.tem ? AN.tem.nombre : '' }); dlgModelo(ob); return true; }
    if (ds.fxSemana){ ST.vista = 'semana'; ST.semana = lunesDe(hoyISO()); ST.fAtleta = FX.aid; ST.movAtleta = FX.aid; ST.diaMovil = null; cerrar(); window.scrollTo(0,0); await recargar(); return true; }
    if (ds.fxFeedback){ ST.vista = 'feedback'; ST.fb.atleta = FX.aid; ST.fb.estado = 'todos'; ST.fb.desde = ST.fx.desde; ST.fb.hasta = ST.fx.hasta; cerrar(); window.scrollTo(0,0); await recargar(); return true; }
    if (ds.fxPerfil){ dialogoPerfil(); return true; }
    if (ds.fxObsOk){
      var otx = (document.getElementById('fxo-obs-txt').value||'').trim(), ofe = document.getElementById('fxo-obs-fecha').value || hoyISO();
      if (!otx){ avisar('Escribe la observación.', true); return true; }
      b.disabled = true;
      var ro = await sb.from('notas_atleta').insert({ atleta_id:FX.aid, autor_id:perfil && perfil.id, texto:otx, fecha:ofe, tipo:'otro', grupo_id:ST.g.grupo_id });
      if (ro.error){ b.disabled = false; avisar('No se pudo guardar: '+ro.error.message, true); return true; }
      FX_ABIERTAS.observaciones = true; avisar('Observación guardada'); await recargar(); return true;
    }
    if (ds.fxObj){ var i = ds.fxObj.lastIndexOf('|'); dialogoObjetivo(ds.fxObj.slice(0,i), ds.fxObj.slice(i+1)); return true; }
    if (ds.fxDecNueva){ var fn = document.getElementById('fx-dec-nueva'); fn.hidden = !fn.hidden; if (!fn.hidden){ fn.innerHTML = formDecision(null); document.getElementById('fxd-txt').focus(); } return true; }
    if (ds.fxdOk){
      var v = function(id){ return (document.getElementById(id).value||'').trim(); };
      if (!v('fxd-txt')){ avisar('Escribe la decisión.', true); return true; }
      if (v('fxd-fin') && v('fxd-fin') < v('fxd-ini')){ avisar('El «hasta» es anterior al «desde».', true); return true; }

      if (await guardarDecision({ id:dR.id, version_base:dR.version, nota_revision:nr, revision:nx })){ avisar('Revisión guardada · sigue vigente'); recargar(); }

      var idD = ds.fxDecFin || ds.fxDecAnular, dF = FX.dec.filter(function(x){ return x.id===idD; })[0]; if (!dF) return true;

      if (await guardarDecision(fin ? { id:dF.id, version_base:dF.version, estado:'finalizada', fin:(dF.fin && dF.fin < hoyISO() ? dF.fin : hoyISO()) } : { id:dF.id, version_base:dF.version, estado:'anulada' })){ avisar(fin ? 'Decisión finalizada' : 'Decisión anulada'); recargar(); }
      return true;

  /* ================= TESTS Y MARCAS =================
     Resultados (marcas_atleta: competición, test o entreno, estimado), tests con
     su protocolo y sus intentos, RM medidos y estimados, y los objetivos al lado
     (atleta_objetivos), que siguen siendo objetivos. Los mismos datos y el mismo
     dibujo para el grupo (?v=marcas) y para la ficha de cada atleta.
     Reglas: lo que no consta dice «no consta»; nada se compara si cambian la
     prueba, el protocolo, las condiciones o el método (se ve junto, con su
     limitación); ningún texto original se reescribe. */
  var TM = null;
  var PROC_M = { competicion:'Competición', entreno:'Test o entreno', estimado:'Estimado' };
  var METODO_M = { manual:'manual', fotocelulas:'fotocélulas', electronico_competicion:'electrónico de competición', video:'vídeo', plataforma:'plataforma', app:'app', otro:'otro', no_consta:'no consta' };
  var COND_M = { altura_valla_m:['altura','m'], separacion_m:['separación','m'], distancia_primera_m:['a la 1.ª','m'], distancia_final_m:['final cronometrado','m'], altura_obstaculo_m:['obstáculo','m'], peso_kg:['implemento','kg'] };
  var ALTURAS = ['1,067','0,991','0,914','0,838','0,762','0,700'];
  var EST_INT = { valido:'válido', nulo:'nulo', incompleto:'incompleto' };
  var SALIDA = { tacos:'desde tacos', de_pie:'de pie', agachado:'agachado', lanzada:'lanzada', no_aplica:'no aplica' };

  function normPrueba(t){
    var a = 'áéíóúüàèìòùâêîôûç', b = 'aeiouuaeiouaeiouc';
    return String(t||'').trim().toLowerCase().replace(/[áéíóúüàèìòùâêîôûç]/g, function(c){ return b.charAt(a.indexOf(c)); })
      .replace(/(\d)\.(\d)/g, '$1$2').replace(/(metros|metro|mts|mt)/g, 'm').replace(/[\s\-_]+/g, '');
  }
  function numES(n, dec){ if (n==null || n==='' || isNaN(n)) return '—'; var x = Number(n); return (dec!=null ? x.toFixed(dec) : String(x)).replace('.', ','); }
  function fmtValor(n, unidad){
    if (n==null || isNaN(n)) return '—';
    n = Number(n);
    if (unidad==='s' && n >= 60){ var m = Math.floor(n/60), s = n - m*60; return m+':'+(s<10?'0':'')+s.toFixed(2).replace('.', ','); }
    return numES(n, unidad==='puntos' ? 0 : 2)+(unidad==='s' ? ' s' : unidad==='m' ? ' m' : unidad==='puntos' ? ' pts' : '');
  }
  function fAnio(f){ return f ? fMedia(f)+' '+String(f).slice(0,4) : 'sin fecha'; }
  function condTxt(c){
    c = c || {}; var L = [];
    Object.keys(COND_M).forEach(function(k){ if (c[k]!=null && c[k]!=='') L.push(COND_M[k][0]+' '+numES(c[k])+' '+COND_M[k][1]); });
    Object.keys(c).forEach(function(k){ if (!COND_M[k] && c[k]!=null && c[k]!=='' && typeof c[k]!=='object') L.push(k.replace(/_/g,' ')+' '+c[k]); });
    return L.join(' · ');
  }

  /* Categoría federativa en una fecha: la misma regla que categoria_federativa() en la base. */
  function catFed(fnac, fecha){
    if (!fnac) return { cat:null, motivo:'sin fecha de nacimiento' };
    if (!fecha) return { cat:null, motivo:'sin fecha' };
    var t = +String(fecha).slice(0,4), anios = {}; (TM.catfed||[]).forEach(function(r){ anios[r.temporada] = 1; });
    var base = anios[t] ? t : Object.keys(anios).map(Number).sort(function(x,y){ return Math.abs(x-t)-Math.abs(y-t) || y-x; })[0];
    if (base==null) return { cat:null, motivo:'sin regla cargada' };
    var desf = t - base, nac = +String(fnac).slice(0,4) - desf, filas = TM.catfed.filter(function(r){ return r.temporada===base; });
    var cumple = function(n){ return (+String(fnac).slice(0,4)+n)+String(fnac).slice(4,10); };
    var c = filas.filter(function(r){ return r.edad_desde!=null && String(fecha) >= cumple(r.edad_desde); })[0]
         || filas.filter(function(r){ return r.edad_desde==null && (r.nacidos_desde==null || nac >= r.nacidos_desde) && (r.nacidos_hasta==null || nac <= r.nacidos_hasta); }).sort(function(x,y){ return x.orden-y.orden; })[0];
    return { cat: c ? c.categoria : null, verificada: desf===0, motivo: desf===0 ? (c ? c.fuente : '') : 'provisional: regla de '+base+' (falta la circular de '+t+')' };
  }

  /* ---------- parciales reales y modelo objetivo ----------
     Reales: solo lo medido, por intento (nunca se mezclan). Un subtramo forma parte
     de su tramo (no se suma dos veces). Lo calculado de dos pasos se dice. Las sumas
     y diferencias son aritmética a la vista, no se guardan. El modelo objetivo se
     escribe a mano y se marca como modelo, nunca como medición. */
  var CUADRA = 0.005;
  function sTxt(n){ return n==null || isNaN(n) ? '—' : fmtValor(Math.round(n*100)/100, 's').replace(' s',''); }
  function difTxt(a, b){ var d = Math.round((a-b)*100)/100; return Math.abs(a-b) <= CUADRA ? '<span class="tm-ok">cuadra</span>' : '<span class="fx-warn tm-inl">'+(d>0?'+':'')+numES(d)+' s: no cuadra</span>'; }
  function tramosArbol(L){
    // Tramos medidos: los de arriba son los que no están dentro de otro; los demás cuelgan de su tramo.
    var T = L.filter(function(x){ return x.medida==='tramo'; }).slice().sort(function(a,b){ return a.desde_m-b.desde_m || (b.hasta_m-b.desde_m)-(a.hasta_m-a.desde_m); });
    var top = T.filter(function(x){ return !T.some(function(y){ return y!==x && y.desde_m<=x.desde_m && y.hasta_m>=x.hasta_m && (y.hasta_m-y.desde_m)>(x.hasta_m-x.desde_m); }); });
    return top.map(function(p){ return { p:p, hijos:T.filter(function(x){ return x!==p && x.desde_m>=p.desde_m && x.hasta_m<=p.hasta_m && top.indexOf(x)===-1; }) }; });
  }
  function seguidos(L, desde, hasta){
    // ¿Cubren [desde, hasta] sin huecos ni solapes?
    var x = desde; L.slice().sort(function(a,b){ return a.desde_m-b.desde_m; }).forEach(function(t){ x = (x!==null && Number(t.desde_m)===x) ? Number(t.hasta_m) : null; });
    return x===hasta;
  }
  function parcialesHTML(L, total, distancia){
    if (!L.length) return '';
    var arbol = tramosArbol(L), pasos = L.filter(function(x){ return x.medida==='paso'; }).sort(function(a,b){ return a.hasta_m-b.hasta_m; });
    var m0 = L[0], h = [];
    var tops = arbol.map(function(n){ return n.p; });
    if (tops.length){
      var linea = tops.map(function(t){ return numES(t.desde_m)+'–'+numES(t.hasta_m)+' <b>'+sTxt(t.tiempo_s)+'</b>'; }).join(' · ');
      var suma = tops.reduce(function(s, t){ return s + Number(t.tiempo_s); }, 0);
      var cub = distancia && seguidos(tops, 0, distancia);
      h.push('<div>Tramos: '+linea+(cub && total!=null ? ' → suma '+sTxt(suma)+' frente al total '+sTxt(total)+': '+difTxt(suma, total) : cub ? ' → suma '+sTxt(suma) : ' <span class="fx-sin">(no cubren toda la distancia: no se suman)</span>')+'</div>');

        var sh = n.hijos.reduce(function(s, t){ return s + Number(t.tiempo_s); }, 0), ok = seguidos(n.hijos, Number(n.p.desde_m), Number(n.p.hasta_m));

          (ok ? ' → suma '+sTxt(sh)+' frente a '+sTxt(n.p.tiempo_s)+': '+difTxt(sh, Number(n.p.tiempo_s)) : ' <span class="fx-sin">(no cubren el tramo entero: no se suman)</span>')+'</div>');
      });
    }
    if (pasos.length){
      var ini = pasos[0].desde_m;
      h.push('<div>Pasos (acumulado desde '+numES(ini)+' m): '+pasos.map(function(t, i){

        return numES(t.hasta_m)+' m <b>'+sTxt(t.tiempo_s)+'</b>'+(calc!=null ? ' <small class="fx-sin">(tramo '+numES(prev.hasta_m)+'–'+numES(t.hasta_m)+' calculado: '+sTxt(calc)+')</small>' : '');
      }).join(' · ')+'</div>');

  }

  /* Modelo objetivo: total, tramos y subdivisiones, pasos acumulados, suma y diferencia. */

  /* Modelo de parciales: lo define y lo aprueba Andrés; una propuesta (también la de
     ChatGPT) nunca es vigente sin aprobación, y cambiarlo le quita la aprobación. */
  function estadoModelo(mo){
    if (!mo) return '';
    if (mo.estado==='vigente') return 'aprobado'+(mo.aprobado_en ? ' el '+fechaHora(mo.aprobado_en) : '')+(mo.aprobado_por ? ' por '+quienRevisa(mo.aprobado_por) : '')+' · versión '+mo.aprobado_version;
    if (mo.origen==='chatgpt_simulado') return 'PRUEBA: origen ChatGPT simulado · '+(mo.estado==='borrador' ? 'borrador' : 'propuesta')+' sin aprobar';
    var org = mo.origen==='chatgpt' ? 'de ChatGPT' : mo.origen==='otro' ? 'de otra fuente' : 'del entrenador';
    return (mo.estado==='borrador' ? 'borrador' : 'propuesta')+' '+org+' · sin aprobar';
  }

      '<h3>Marcas y resultados <small>por prueba; cada grupo, con sus condiciones y su método</small></h3>'+marcasH+

  /* ---------- protocolos ---------- */
  /* Lo que le falta a un protocolo para poder comparar sus resultados: lo mismo que
     protocolo_faltan() en la base. Lo «recomendable» no impide marcarlo completo. */
  var TIPO_PROTO = { carrera:'Carrera cronometrada', salto:'Salto', lanzamiento:'Lanzamiento', fuerza:'Fuerza', otro:'Otro' };
  function protoFaltan(p){
    var e = p.especificos||{}, t = p.tipo, f = [], vac = function(v){ return v==null || String(v).trim()===''; };
    if (!t) return ['tipo de test'];
    if (t==='carrera'){ if (vac(p.salida)) f.push('salida'); if (p.tramo_desde_m==null || p.tramo_hasta_m==null) f.push('tramo medido');
      if (p.salida==='lanzada' && p.distancia_entrada_m==null) f.push('distancia de entrada'); if (vac(p.inicio_crono)) f.push('inicio del cronometraje'); if (vac(p.fin_crono)) f.push('final del cronometraje'); }
    if ((t==='carrera' || t==='salto') && vac(e.sistema_medida)) f.push('sistema de medida');
    if ((t==='carrera' || t==='salto' || t==='lanzamiento') && vac(p.superficie)) f.push('superficie');
    if ((t==='carrera' || t==='salto') && vac(p.calzado)) f.push('calzado');
    if (t==='salto'){ if (vac(e.variante)) f.push('cómo es el salto'); if (vac(e.brazos)) f.push('brazos'); if (vac(e.calculo)) f.push('qué se calcula');
      if (vac(e.caida)) f.push('si hay caída desde cajón'); else if (e.caida==='si' && vac(e.cajon_cm)) f.push('altura del cajón'); }
    if (t==='lanzamiento'){ if (vac(e.implemento_kg)) f.push('peso del implemento'); if (vac(e.posicion)) f.push('posición y técnica'); if (vac(e.medicion)) f.push('desde dónde se mide'); }
    if (t==='fuerza'){ if (vac(e.ejercicio)) f.push('ejercicio'); if (vac(e.variante)) f.push('variante'); if (vac(e.recorrido)) f.push('recorrido'); if (vac(e.lateralidad)) f.push('uni o bilateral');
      if (vac(e.criterio_valida)) f.push('criterio de repetición válida'); if (vac(e.material)) f.push('material'); }
    if (t==='otro' && (vac(p.descripcion) || p.descripcion==='Por completar')) f.push('descripción');
    return f;
  }
  function protoRecom(p){ var f = []; if (p.intentos_previstos==null) f.push('intentos'); if (!p.recuperacion) f.push('recuperación'); if (!p.orden_intentos) f.push('orden de los intentos'); return f; }
  function protoEstadoHTML(p){
    var f = protoFaltan(p);
    return p.completo ? tag('t-hecha','completo') : f.length ? '<span class="fx-warn tm-inl">Falta para comparar: '+esc(f.join(', '))+'</span>' : tag('t-nuevo','sin marcar como completo');
  }
  function tmProtocolosHTML(){
    var porClave = {}, orden = []; TM.protocolos.forEach(function(p){ if (!porClave[p.clave]){ porClave[p.clave] = []; orden.push(p.clave); } porClave[p.clave].push(p); });
    var usos = {}; TM.tests.forEach(function(t){ if (t.protocolo_id) usos[t.protocolo_id] = (usos[t.protocolo_id]||0)+1; });
    var sinP = TM.tests.filter(function(t){ return !t.protocolo_id; }).length;
    return '<p class="nota">Cada tipo de test pide lo suyo. Mientras falte algo, sus resultados se guardan pero no se comparan con seguridad. Nada se deduce: un protocolo solo queda «completo» cuando una persona lo marca. Los tests antiguos siguen con «protocolo no consta'+(sinP ? '» ('+sinP+')' : '»')+' hasta que haya pruebas de cómo se hicieron.</p>'+
      '<div class="tm-acc"><button type="button" class="ac-btn mini" data-tm-proto="nuevo">＋ Protocolo</button></div>'+
      '<table class="fx-t fx-w tm-t"><tr><th>Test</th><th>Tipo · versión</th><th>Para comparar</th><th>Recomendable</th><th></th></tr>'+orden.map(function(k){
        return porClave[k].map(function(p, i){
          var rec = protoRecom(p);
          return '<tr'+(i?' class="tm-sub"':'')+'><td>'+(i?'':'<b>'+esc(p.nombre)+'</b><small>'+esc(p.unidad||'')+(p.menos_es_mejor?' · menos es mejor':'')+'</small>')+'</td>'+
            '<td>'+esc(TIPO_PROTO[p.tipo]||'tipo sin elegir')+' · v'+p.version+(usos[p.id]?'<small>'+plural(usos[p.id],'resultado','resultados')+'</small>':'')+'</td>'+
            '<td>'+protoEstadoHTML(p)+'</td><td>'+(rec.length ? '<span class="fx-sin">falta: '+esc(rec.join(', '))+'</span>' : '<span class="tm-ok">al día</span>')+'</td>'+
            '<td><button type="button" class="ac-link" data-tm-proto="'+p.id+'">'+(usos[p.id]?'Nueva versión…':'Completar…')+'</button></td></tr>';
        }).join('');
      }).join('')+'</table><p class="nota">Un protocolo con resultados no se reescribe: se crea otra versión, y versiones distintas no se comparan.</p>';
  }

  /* ---------- catálogo: correspondencias y temporadas ---------- */
  var EST_CORR = { ambigua:['Ambigua: se decide uso a uso','t-rev'], propuesta:['Propuesta: falta confirmarla','t-nuevo'], sin_catalogo:['No está en el catálogo','t-sind'], exacta:['Exacta','t-hecha'], confirmada:['Confirmada para todos sus usos','t-hecha'], descartada:['Descartada','t-sind'] };
  var ORIGEN_U = { perfil:'Perfil', marcas:'Resultado', objetivos:'Objetivo', competiciones:'Inscripción' };
  function usosDecididos(n){ return (TM.usos||[]).filter(function(u){ return u.texto_norm===n; }); }

    var orden = ['ambigua','propuesta','sin_catalogo','confirmada','exacta','descartada'];

    var h = '<p class="nota">El texto original no se cambia en ningún sitio: aquí se dice a qué prueba del catálogo corresponde. «Ver usos» enseña dónde aparece cada texto y deja decidir caso a caso. Lo ambiguo («60» puede ser lisos o vallas) solo se decide uso a uso; tampoco se aplica a todos un texto que ya tiene usos decididos de distinta manera.</p>'+

        var pro = c.prueba_id && TM.pid[c.prueba_id] ? TM.pid[c.prueba_id].nombre : '';
        var dec = usosDecididos(c.texto_norm), distintas = {}; dec.forEach(function(u){ distintas[u.decision+':'+(u.prueba_ids||[]).join(',')] = 1; });
        var global = (e==='propuesta' || e==='sin_catalogo') && Object.keys(distintas).length<=1;
        var cand = (c.candidatos||[]).map(function(id){ return TM.pid[id] ? TM.pid[id].nombre : null; }).filter(Boolean);
        return '<tr><td><b>'+esc(c.texto)+'</b><small>'+tag(EST_CORR[e][1], EST_CORR[e][0])+'</small></td><td>'+esc((c.origenes||[]).map(function(o){ return (ORIGEN_U[o]||o).toLowerCase(); }).join(', '))+'<small>'+plural(c.apariciones,'uso','usos')+(dec.length ? ' · '+dec.length+' decidido'+(dec.length>1?'s':'')+' caso a caso' : '')+'</small></td>'+
          '<td>'+(e==='ambigua' ? '<span class="fx-sin">puede ser: '+esc(cand.join(' · ') || 'varias')+'</span>' : e==='exacta' ? esc(pro) : global ? '<select class="ac-sel" data-tm-corr-sel="'+c.id+'">'+opcP(c.prueba_id, null)+'</select>' : esc(pro || '—'))+(c.motivo?'<small>'+esc(c.motivo)+'</small>':'')+'</td>'+
          '<td><button type="button" class="ac-link" data-tm-usos="'+c.id+'">Ver usos…</button>'+(global ? ' <button type="button" class="ac-link" data-tm-corr-ok="'+c.id+'">Confirmar para todos</button>'+(e!=='descartada' && !dec.some(function(u){ return u.decision==='prueba'; }) ? ' <button type="button" class="ac-link" data-tm-corr-no="'+c.id+'">Descartar</button>' : '') : '')+'</td></tr>';
      }).join('')+'</table></details>';
    });
    h += '<h3>Temporadas de planificación <small>no son el año federativo; la categoría sale de la fecha de cada resultado</small></h3>'+
      '<p class="nota">Mientras no se confirmen, son provisionales. Cambiar sus fechas no mueve nada: cada objetivo se queda en la temporada en la que se guardó y cada resultado conserva su fecha. Si alguna fecha de referencia queda fuera, se avisa antes de guardar.</p>'+
      '<table class="fx-t fx-w tm-t"><tr><th>Temporada</th><th>Desde</th><th>Hasta</th><th>Estado</th><th></th></tr>'+TM.temporadas.map(function(t){
      return '<tr><td><b>'+esc(t.nombre)+'</b>'+((t.historial||[]).length ? '<small>'+plural(t.historial.length,'cambio','cambios')+': antes '+esc(t.historial.slice(-1)[0].inicio)+' – '+esc(t.historial.slice(-1)[0].fin)+'</small>' : '')+'</td>'+
        '<td><input type="date" class="ac-sel" data-tm-tem-ini="'+t.id+'" value="'+esc(t.inicio)+'"></td><td><input type="date" class="ac-sel" data-tm-tem-fin="'+t.id+'" value="'+esc(t.fin)+'"></td>'+
        '<td><label class="cp-solo"><input type="checkbox" data-tm-tem-conf="'+t.id+'"'+(t.confirmada?' checked':'')+'> confirmada</label>'+(t.confirmada ? '' : '<small>provisional</small>')+'</td>'+

    return h;
  }
  async function dlgUsos(c){

    if (r.error){ avisar('No se pudo: '+r.error.message, true); return; }

        '<button type="button" class="ac-link" data-uso-ok="'+i+'">Es esta</button> <button type="button" class="ac-link" data-uso-no="'+i+'">No es una prueba</button></div>')+'</div>';
    };
    var d = dialogo('<h3>«'+esc(c.texto)+'»: dónde aparece</h3><p>Cada uso se decide por separado y el texto original no cambia. En un resultado, objetivo o inscripción, la prueba elegida se guarda en ese registro (con su historial).'+(c.estado==='ambigua' ? ' Este texto es ambiguo: no hay equivalencia para todos.' : '')+'</p>'+

    var part = r[0]||[], ids = {}; part.forEach(function(x){ if (x.competicion_id) ids[x.competicion_id] = 1; });
    var k = Object.keys(ids);
    var rc = await sb.from('competiciones').select('id,nombre,sede,fecha_inicio,fecha_fin,ambito,estado,version,historial,circular_url,notas,fecha_por_confirmar,organizador,referencia_oficial,es_prueba')
      .or('ambito.in.(pista,atletismo)'+(k.length ? ',id.in.('+k.join(',')+')' : '')).order('fecha_inicio');
    if (rc.error) throw rc.error;
    var rpc = CP && CP.puedeCal != null ? { data:CP.puedeCal } : await sb.rpc('puedo_editar_calendario');
    // Las competiciones de prueba (no se publican) solo se ven con el grupo de prueba.
    var comps = (rc.data||[]).filter(function(c){ return !c.es_prueba || ST.g.es_prueba; });
    CP = { comps:comps, part:part, plan:r[1]||[], prio:r[2].data||[], minimas: r[3] && r[3].data ? r[3].data : (CP && CP.minimas || []), cid:{}, puedeCal: !!(rpc && rpc.data) };
    CP.comps.forEach(function(c){ CP.cid[c.id] = c; });
  }
  function partDe(cid, aid){ return CP.part.filter(function(x){ return x.competicion_id===cid && (!aid || x.atleta_id===aid); }).sort(function(a,b){ return (a.dia||'').localeCompare(b.dia||'') || hhmmT(a.hora).localeCompare(hhmmT(b.hora)) || String(a.prueba).localeCompare(String(b.prueba)); }); }
  function planDe(cid, aid){ return CP.plan.filter(function(x){ return x.competicion_id===cid && x.atleta_id===aid; })[0] || null; }
  function prioDe(k){ return CP.prio.filter(function(x){ return x.clave===k; })[0] || null; }
  function prioTag(k){ return k ? '<span class="cp-p cp-p'+k+'" title="'+esc((prioDe(k)||{}).significado||'')+'">'+esc(k)+'</span>' : ''; }
  function propTxt(pl){ return pl && pl.proposito ? (pl.proposito==='otro' ? (pl.proposito_texto||'otro') : PROPOSITO[pl.proposito]) : ''; }
  function diasA(f){ return Math.round((deISO(f) - deISO(hoyISO()))/86400000); }
  function diasTxt(f){ var d = diasA(f); return d===0 ? 'hoy' : d===1 ? 'mañana' : d>1 ? 'en '+d+' días' : d===-1 ? 'ayer' : 'hace '+(-d)+' días'; }
  function fComp(c){
    if (!c.fecha_inicio) return 'sin fecha';
    var a = c.fecha_inicio.slice(0,4)!==hoyISO().slice(0,4) ? ' '+c.fecha_inicio.slice(0,4) : '';
    return fLarga(c.fecha_inicio)+(c.fecha_fin && c.fecha_fin!==c.fecha_inicio ? ' – '+fLarga(c.fecha_fin) : '')+a;
  }
  function diaDe(x){ var c = CP.cid[x.competicion_id] || {}; return x.dia || c.fecha_inicio || ''; }
  // ¿La competición (o una prueba sin día) cae en la fecha f?
  function enFecha(x, f){ if (x.dia) return x.dia===f; var c = CP.cid[x.competicion_id]||{}; return !!c.fecha_inicio && c.fecha_inicio<=f && (c.fecha_fin||c.fecha_inicio)>=f; }
  function estadoTxt(c){ return c.estado==='cancelada' ? 'Cancelada' : c.estado==='aplazada' ? (c.fecha_por_confirmar ? 'Aplazada · nueva fecha por confirmar' : 'Aplazada') : ''; }
  function puedoCambiar(c){ return c.es_prueba ? true : CP.puedeCal; }
  function cambioFecha(c){ return (c.historial||[]).filter(function(h){ return h.fecha_inicio && h.fecha_inicio!==c.fecha_inicio; }).slice(-1)[0] || null; }

  // Avisos de horario de un atleta (no se resuelve nada): dos pruebas el mismo día muy juntas o
  // que se pisan, y dos competiciones distintas el mismo día.
  function conflictos(aid){
    var L = CP.part.filter(function(x){ return x.atleta_id===aid && activa(x) && (CP.cid[x.competicion_id]||{}).estado!=='cancelada'; }), av = [];
    for (var i=0;i<L.length;i++) for (var j=i+1;j<L.length;j++){
      var a = L[i], b = L[j], da = diaDe(a), db = diaDe(b);
      if (a.competicion_id!==b.competicion_id){
        var ca = CP.cid[a.competicion_id]||{}, cb = CP.cid[b.competicion_id]||{};
        var sa = a.dia || ca.fecha_inicio, ea = a.dia || ca.fecha_fin || ca.fecha_inicio, sb2 = b.dia || cb.fecha_inicio, eb = b.dia || cb.fecha_fin || cb.fecha_inicio;
        if (sa && sb2 && sa<=eb && sb2<=ea && !av.some(function(v){ return v.comps && v.comps.indexOf(a.competicion_id)!==-1 && v.comps.indexOf(b.competicion_id)!==-1; }))
          av.push({ ids:[a.id,b.id], comps:[a.competicion_id,b.competicion_id], txt:'Coinciden en fecha «'+(ca.nombre||'')+'» y «'+(cb.nombre||'')+'».' });
        continue;
      }
      if (!da || da!==db || !a.hora || !b.hora) continue;
      var ia = minutos(a.hora), ib = minutos(b.hora), fa = a.hora_fin ? minutos(a.hora_fin) : null, fb = b.hora_fin ? minutos(b.hora_fin) : null;
      if (fa!=null && fb!=null){ if (ia < fb && ib < fa) av.push({ ids:[a.id,b.id], txt:a.prueba+' ('+hhmmT(a.hora)+'–'+hhmmT(a.hora_fin)+') y '+b.prueba+' ('+hhmmT(b.hora)+'–'+hhmmT(b.hora_fin)+') se pisan.' }); continue; }
      var gap = Math.abs(ia-ib);
      if (gap < MIN_HUECO) av.push({ ids:[a.id,b.id], txt:a.prueba+' a las '+hhmmT(a.hora)+' y '+b.prueba+' a las '+hhmmT(b.hora)+': '+(gap ? gap+' min entre una y otra' : 'a la misma hora')+'.' });
    }
    return av;
  }

  // Mejor marca oficial comparable (misma prueba y condiciones, de competición; la no oficial no cuenta).
  function mejorOficial(aid, pid, cond){
    var p = TM.pid[pid]; if (!p) return null;
    var L = TM.marcas.filter(function(m){ if (m.atleta_id!==aid || m.contexto!=='competicion' || m.oficial===false || m.tipo==='objetivo') return false; var pr = pruebaDe(m); return pr.id===pid && condTxt(pr.cond)===condTxt(cond); });
    L.sort(function(a,b){ return p.mas_es_mejor ? b.tiempo_segundos-a.tiempo_segundos : a.tiempo_segundos-b.tiempo_segundos; });
    return L[0] || null;
  }
  function minimaPara(c, aid, x){
    var at = TM.atl[aid]||{}, cat = catFed(at.fecha_nacimiento, x.dia || c.fecha_inicio).cat;
    var L = CP.minimas.filter(function(m){ return m.competicion_id===c.id && m.prueba_id===x.prueba_id; });
    if (!L.length) return { e:'sin_cargar' };
    // La mínima de un campeonato absoluto vale para cualquier categoría que pueda correrlo.
    var cat2 = L.filter(function(m){ return m.categoria===cat || m.categoria==='Absoluto'; });
    if (!cat2.length) return { e:'otra_categoria', cat:cat };
    var sx = cat2.filter(function(m){ return !m.sexo || (at.sexo && m.sexo===at.sexo); });
    if (!sx.length) return { e: at.sexo ? 'otro_sexo' : 'sin_sexo' };
    var m = sx.filter(function(m){ return condTxt(m.condiciones)===condTxt(x.condiciones); })[0];
    return m ? { e:m.estado, m:m } : { e:'otras_condiciones', m:sx[0] };
  }
  function minimaHTML(c, aid, x){
    if (!x.prueba_id) return '<span class="fx-sin">sin prueba del catálogo</span>';
    var r = minimaPara(c, aid, x), m = r.m;
    var nueva = ' <button type="button" class="ac-link" data-cp-minima-nueva="'+c.id+'|'+x.prueba_id+'|'+aid+'">＋ mínima…</button>';
    if (r.e==='sin_cargar') return '<span class="fx-sin">sin registrar para esta competición</span>'+nueva;
    if (r.e==='otra_categoria') return '<span class="fx-sin">registrada para otra categoría (la suya: '+esc(r.cat||'no consta')+')</span>'+nueva;
    if (r.e==='sin_sexo') return '<span class="fx-sin">el sexo del atleta no consta: no se puede elegir</span>';
    if (r.e==='otro_sexo') return '<span class="fx-sin">registrada solo para el otro sexo</span>'+nueva;
    if (r.e==='otras_condiciones') return '<span class="fx-sin">la registrada es con otras condiciones ('+esc(condTxt(m.condiciones)||'sin condiciones')+')</span>'+nueva;
    var fuente = (m.fuente_url ? '<a class="ac-link" href="'+esc(m.fuente_url)+'" target="_blank" rel="noopener">fuente ↗</a> ' : '')+(m.fuente_texto ? esc(m.fuente_texto)+' ' : '')+(m.comprobada_en ? '· comprobada el '+esc(fAnio(m.comprobada_en)) : '');
    if (r.e==='pendiente') return tag('t-rev','pendiente de publicación')+'<small>'+esc(m.campeonato)+' '+m.temporada_federativa+': no se usan las de otro año</small>';
    if (r.e==='no_exige') return 'No exige mínima<small>'+fuente+(m.criterio ? ' · criterio: '+esc(m.criterio) : '')+'</small>';
    var val = '<b>'+esc(m.valor_texto || fmtValor(m.valor, TM.pid[m.prueba_id] && TM.pid[m.prueba_id].unidad==='tiempo' ? 's' : 'm'))+'</b>';
    return val+'<small>'+esc(m.categoria)+(m.sexo?' · '+esc(m.sexo):'')+(m.validez_desde||m.validez_hasta ? ' · válida del '+esc(m.validez_desde ? fAnio(m.validez_desde) : '…')+' al '+esc(m.validez_hasta ? fAnio(m.validez_hasta) : '…') : ' · periodo de validez no consta')+'</small>'+
      (m.criterio ? '<small>Criterio: '+esc(m.criterio)+'</small>' : '')+'<small>'+fuente+'</small>';
  }
  // Lectura prudente: compara, pero nunca dice «clasificado».
  function lecturaMinima(c, aid, x, mp){
    var r = minimaPara(c, aid, x); if (r.e!=='publicada' || !mp) return '';
    var m = r.m, p = TM.pid[x.prueba_id] || {}, mejor = p.mas_es_mejor ? mp.tiempo_segundos >= m.valor : mp.tiempo_segundos <= m.valor;
    var dentro = (!m.validez_desde || (mp.fecha && mp.fecha >= m.validez_desde)) && (!m.validez_hasta || (mp.fecha && mp.fecha <= m.validez_hasta));
    var falta = [];
    if (!m.validez_desde && !m.validez_hasta) falta.push('el periodo de validez (no consta)');
    else if (!dentro) falta.push('su marca es de fuera del periodo de validez');
    if (!mp.metodo || mp.metodo==='no_consta') falta.push('el método de cronometraje de su marca (no consta)');
    if (m.criterio) falta.push('el criterio: «'+m.criterio+'»');
    falta.push('las condiciones de validez de la marca en la fuente');
    var d = Math.round(Math.abs(mp.tiempo_segundos - m.valor)*100)/100;
    return '<div class="cp-lect">'+(mejor ? 'Su mejor marca oficial registrada es igual o mejor que la mínima.' : 'Su mejor marca oficial registrada está a '+esc(numES(d))+(p.unidad==='tiempo'?' s':' m')+' de la mínima.')+
      ' <b>No es una clasificación.</b> Falta comprobar: '+esc(falta.join('; '))+'.</div>';
  }

  /* ---------- un atleta dentro de una competición ---------- */
  function bloqueAtletaCP(c, aid){
    var at = TM.atl[aid]||{}, pl = planDe(c.id, aid), L = partDe(c.id, aid), f = c.fecha_inicio;
    var cf = catFed(at.fecha_nacimiento, f);
    var cat = cf.cat ? esc(cf.cat)+(cf.verificada ? '' : ' <span class="fx-sin">(provisional: falta la circular de '+esc(String(f).slice(0,4))+')</span>') : '<span class="fx-sin">categoría no consta ('+esc(cf.motivo||'')+')</span>';
    var tem = f ? temporadaDeFecha(f) : null;
    var av = conflictos(aid).filter(function(a){ return a.ids.some(function(id){ return L.some(function(x){ return x.id===id; }); }); });
    // Si la competición cambió de fecha, el día apuntado en cada prueba no se mueve solo: se avisa.
    L.forEach(function(x){ if (x.dia && activa(x) && f && (x.dia < f || x.dia > (c.fecha_fin||f))) av.push({ ids:[x.id], txt:x.prueba+': su día ('+fAnio(x.dia)+') queda fuera de las fechas de la competición. Revísalo.' }); });
    var filas = L.map(function(x){
      var mp = x.prueba_id ? mejorOficial(aid, x.prueba_id, x.condiciones) : null;
      var ac = tem && x.prueba_id ? objetivosDe(aid, x.prueba_id, tem.id).filter(function(o){ return o.tipo==='acordado'; })[0] : null;
      var res = TM.marcas.filter(function(m){ return m.participacion_id===x.id; }).sort(function(a,b){ return (b.oficial===true) - (a.oficial===true); });
      var e = EST_PART[x.estado] || [x.estado,'t-sind'];
      return '<div class="cp-pr'+(activa(x)?'':' off')+'"><div class="cp-pr-t"><b>'+esc(x.prueba||'—')+'</b>'+(condTxt(x.condiciones)?' <span class="fx-sin">'+esc(condTxt(x.condiciones))+'</span>':'')+(x.prueba_id?'':' '+tag('t-rev','sin prueba del catálogo'))+
          ' '+tag(e[1], e[0])+(x.motivo?' <span class="fx-sin">«'+esc(x.motivo)+'»</span>':'')+'</div>'+
        '<div class="cp-pr-d"><span><i>Horario</i>'+(x.hora ? esc((x.dia && x.dia!==f ? fCorta(x.dia)+' ' : '')+hhmmT(x.hora)+(x.hora_fin?'–'+hhmmT(x.hora_fin):'')) : '<span class="fx-sin">no consta</span>')+'</span>'+
          '<span><i>Mejor marca oficial</i>'+(mp ? '<b>'+esc(mp.tiempo_display || fmtValor(mp.tiempo_segundos, mp.unidad))+'</b> <small>'+esc(fAnio(mp.fecha))+' · '+esc(METODO_M[mp.metodo]||'método no consta')+'</small>' : '<span class="fx-sin">sin registrar</span>')+'</span>'+
          '<span><i>Objetivo acordado'+(tem?' '+esc(tem.nombre):'')+'</i>'+(ac ? '<b>'+esc(ac.objetivo_texto||'—')+'</b>' : '<span class="fx-sin">sin registrar</span>')+'</span>'+
          '<span><i>Mínima</i>'+minimaHTML(c, aid, x)+'</span></div>'+
        lecturaMinima(c, aid, x, mp)+
        (res.length ? '<div class="cp-res">'+res.map(function(m){
            return '<div>'+(m.oficial===true ? tag('t-hecha','Oficial') : m.oficial===false ? tag('t-sind','No oficial') : tag('t-sind','Oficial: no consta'))+' <b>'+esc(m.tiempo_display || fmtValor(m.tiempo_segundos, m.unidad))+'</b> '+
              '<span class="fx-sin">'+esc([RONDA[m.ronda], METODO_M[m.metodo] || 'método no consta', m.viento!=null ? 'viento '+numES(m.viento) : ''].filter(Boolean).join(' · '))+'</span> <button type="button" class="ac-link" data-tm-res="'+m.id+'">Corregir</button></div>'; }).join('')+'</div>' : '')+
        '<div class="cp-acc">'+(x.prueba_id && activa(x) ? '<button type="button" class="ac-link" data-cp-res="'+x.id+'">＋ Resultado</button>' : '')+'</div></div>';
    }).join('');
    return '<div class="cp-at"><div class="cp-at-t"><b>'+esc(nombreTM(aid))+'</b> <span class="cp-cat">'+cat+'</span>'+
        '<span class="cp-plan">'+(pl && pl.prioridad ? prioTag(pl.prioridad)+esc((prioDe(pl.prioridad)||{}).nombre||'') : '<span class="fx-sin">prioridad sin registrar</span>')+' · '+(propTxt(pl) ? 'propósito: '+esc(propTxt(pl).toLowerCase()) : '<span class="fx-sin">propósito sin registrar</span>')+'</span>'+
        '<button type="button" class="ac-link" data-cp-part="'+c.id+'|'+aid+'">Editar…</button></div>'+
      (pl && pl.nota ? '<p class="nota">'+esc(pl.nota)+'</p>' : '')+
      (av.length ? '<div class="cp-av">'+av.map(function(a){ return '<div>⚠ '+esc(a.txt)+' <span class="fx-sin">Aviso: no se cambia nada.</span></div>'; }).join('')+'</div>' : '')+
      (filas || '<p class="fx-sin">Sin pruebas apuntadas.</p>')+'</div>';
  }

  function filtroAtletas(c){
    var L = partDe(c.id).map(function(x){ return x.atleta_id; }).filter(function(v, i, a){ return a.indexOf(v)===i && D.atl.some(function(z){ return z.id===v; }); });
    if (ST.cp.aid) L = L.filter(function(a){ return a===ST.cp.aid; });
    if (ST.cp.cat) L = L.filter(function(a){ var at = TM.atl[a]||{}; return catFed(at.fecha_nacimiento, c.fecha_inicio).cat===ST.cp.cat; });
    return L.sort(function(a,b){ return nombreTM(a).localeCompare(nombreTM(b), 'es'); });
  }
  function cuerpoComp(c){
    var aids = filtroAtletas(c), cf = cambioFecha(c);
    // Lo público del evento (lo ve la web) y lo interno de Academia (no se publica), por separado.
    var pub = [c.organizador ? 'organiza '+c.organizador : '', c.referencia_oficial ? 'ref. '+c.referencia_oficial : ''].filter(Boolean).join(' · ');
    return '<div class="cp-pub"><b>'+(c.es_prueba ? 'Competición de prueba' : 'Datos públicos del evento')+'</b> <span class="fx-sin">'+(c.es_prueba ? 'ficticia: no se ve en la web' : 'se ven en el calendario de la web')+'</span>'+
        (estadoTxt(c) ? '<div class="ac-aviso" style="margin:6px 0 0">'+esc(estadoTxt(c))+'. Se queda en el calendario con esa etiqueta; las inscripciones se conservan tal cual: cambia cada una si hace falta.</div>' : '')+
        (cf ? '<p class="nota">Antes era el '+esc(fAnio(cf.fecha_inicio))+(cf.sede && cf.sede!==c.sede ? ' en '+esc(cf.sede) : '')+'.</p>' : '')+
        (pub ? '<p class="nota">'+esc(pub)+'</p>' : '')+
        '<div class="cp-acc">'+(puedoCambiar(c) ? '<button type="button" class="ac-btn mini" data-cp-comp="'+c.id+'">Nombre, fecha, lugar o estado…</button>' : '<span class="fx-sin">Lo cambian administración y comunicación.</span>')+
        (c.circular_url ? '<a class="ac-link" href="'+esc(c.circular_url)+'" target="_blank" rel="noopener">Circular ↗</a>' : '')+
        ((c.historial||[]).length ? '<span class="fx-sin">'+plural(c.historial.length,'cambio','cambios')+' en el historial</span>' : '')+'</div></div>'+
      '<div class="cp-int"><b>Academia</b> <span class="fx-sin">participación, pruebas, prioridad, propósito y notas: no se publican</span></div>'+
      (aids.length ? aids.map(function(a){ return bloqueAtletaCP(c, a); }).join('') : '<p class="fx-sin">'+(ST.cp.aid||ST.cp.cat ? 'Nadie con ese filtro.' : 'Nadie del grupo apuntado.')+'</p>')+
      '<div class="cp-acc"><button type="button" class="ac-btn mini" data-cp-part="'+c.id+'|">＋ Atleta…</button></div>';
  }
  function itemComp(c){
    var aids = filtroAtletas(c), d = diasA(c.fecha_inicio), cf = cambioFecha(c);
    var chips = aids.map(function(a){
      var pl = planDe(c.id, a), L = partDe(c.id, a), est = {}; L.forEach(function(x){ est[x.estado] = 1; });
      var k = Object.keys(est), e = k.length===1 ? EST_PART[k[0]] : null;
      return '<span class="cp-chip">'+prioTag(pl && pl.prioridad)+esc(nombreTM(a))+(e ? ' <small>'+esc(e[0].toLowerCase())+'</small>' : k.length ? ' <small>varios estados</small>' : '')+'</span>';
    }).join('');

    return '<details class="cp-item'+(c.estado==='cancelada'?' canc':'')+'" data-cp-item="'+c.id+'"'+(ST.cp.abiertas[c.id]?' open':'')+'><summary>'+
      '<span class="cp-f"><b>'+dt.getDate()+'</b><small>'+MES[dt.getMonth()]+'</small></span>'+
      '<span class="cp-q"><b>'+esc(c.nombre)+'</b><small>'+esc(fComp(c))+(c.sede?' · '+esc(c.sede):'')+' · '+esc(diasTxt(c.fecha_inicio))+'</small>'+
        (c.es_prueba ? tag('t-bor','Prueba · no se publica')+' ' : '')+(estadoTxt(c) ? tag(c.estado==='cancelada'?'t-nohecha':'t-rev', estadoTxt(c)) : '')+(cf ? ' '+tag('t-rev','fecha cambiada') : '')+
        (chips ? '<span class="cp-chips">'+chips+'</span>' : '')+'</span></summary>'+
      '<div class="cp-in">'+cuerpoComp(c)+'</div></details>';
  }
  function compsEn(desde, hasta){
    return CP.comps.filter(function(c){
      if (!c.fecha_inicio) return false;
      if (desde && (c.fecha_fin||c.fecha_inicio) < desde) return false;
      if (hasta && c.fecha_inicio > hasta) return false;
      if ((ST.cp.aid || ST.cp.cat || ST.cp.solo) && !filtroAtletas(c).length) return false;
      return true;
    });
  }
  function categoriasCP(){
    var y = Math.max.apply(null, TM.catfed.map(function(r){ return r.temporada; }));
    return TM.catfed.filter(function(r){ return r.temporada===y; }).sort(function(a,b){ return a.orden-b.orden; }).map(function(r){ return r.categoria; });
  }

  function mesHTML(){
    var m = ST.cp.mes, ini = m+'-01', d0 = deISO(ini), fin = isoDe(new Date(d0.getFullYear(), d0.getMonth()+1, 0));
    var L = compsEn(ini, fin);
    var nav = '<div class="ac-barra"><button type="button" class="ac-btn" data-cp-mes="-1" aria-label="Mes anterior">‹</button><b class="cp-mes">'+esc(MES_L[d0.getMonth()])+' '+d0.getFullYear()+'</b><button type="button" class="ac-btn" data-cp-mes="1" aria-label="Mes siguiente">›</button><button type="button" class="ac-btn" data-cp-mes="0">Este mes</button></div>';
    if (esMovil()) return nav+(L.length ? L.map(itemComp).join('') : '<p class="fx-sin">Ninguna competición este mes'+(ST.cp.aid||ST.cp.cat||ST.cp.solo?' con ese filtro':'')+'.</p>');
