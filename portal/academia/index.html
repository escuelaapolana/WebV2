  /* ================= CARGA Y CONTENIDOS (primera versión, solo grupo PRUEBA) =================
     Por atleta y semana: previsto, confirmado, opcional, adicional, no realizado,
     sin concretar, sin datos y en discrepancia, por familia, objetivo y medio, con
     la cobertura de cada magnitud. Cada cifra abre las filas y registros de los que
     sale. El motor (assets/js/academia-carga.js) lee las filas y cruza lo apuntado;
     la lectura que propone la app se puede revisar o corregir (plan_filas_estructura).
     Sin índices globales, recomendaciones, proyecciones ni clasificación hacia atrás. */
  var CG = null;
  var CGC = window.APOLANA_CARGA;
  var COL_CG = [['previsto','Previsto'],['confirmado','Confirmado'],['global','«Completa» (declaración global)'],['no_realizado','No realizado'],['sin_concretar','Sin concretar'],['sin_datos','Sin datos'],
                ['discrepancia','En discrepancia'],['opcional_previsto','Opcional previsto'],['opcional_confirmado','Opcional hecho'],['adicional','Adicional']];
  var CLASIF_TXT = { declarada:['Declarada','t-hecha'], propuesta:['Propuesta','t-rev'], revisada:['Revisada','t-hecha'], manual:['Corregida','t-hecha'], pendiente:['Pendiente','t-sind'] };
  var EST_X = { confirmado:'confirmado', global:'solo por «completa» (declaración global)', no_realizado:'no realizado', sin_concretar:'sin concretar', sin_datos:'sin datos', discrepancia:'en discrepancia', adicional:'adicional' };
  function objTxt(k){ return k==='pendiente' || !k ? 'Objetivo pendiente' : (CGC.OBJ[k] ? CGC.OBJ[k][0] : k); }
  function cifra(v, mag){
    if (!v) return '0';
    var n = Math.round(v*10)/10;
    var t = String(n).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return t + (mag==='m' ? ' m' : mag==='min' ? ' min' : '');
  }

  function construirCarga(aid, desde, hasta){
    var dias = diasSemana(), hoy = hoyISO();
    desde = desde || dias[0]; hasta = hasta || dias[6];
    var L = D.ses.filter(function(s){ return s.fecha >= desde && s.fecha <= hasta && atletasDe(s).indexOf(aid)!==-1 && esEntreno(s) && s.publicada; })
      .sort(function(a,b){ return (a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')); });
    var todas = [], porSesion = {}, sesiones = [];
    L.forEach(function(s){
      var reg = D.reg[s.id+'|'+aid] || null, regEnt = D.regEnt[s.id+'|'+aid] || null;
      var toma = (D.toma||[]).filter(function(t){ return t.sesion_id===s.id && t.atleta_id===aid; });
      // Plan de referencia: la versión que respondió; sin registro, el plan vigente (dicho así).
      var vr = reg && reg.sesion_version_id ? (D.versiones||{})[reg.sesion_version_id] : null;
      var datos = vr && vr.datos ? vr.datos : s, vnum = vr ? vr.version : s.version;
      var ref = vr ? 'versión ' + vnum + ' (la que respondió)' : reg ? 'plan vigente (su registro no dice qué versión vio)' : 'plan vigente, sin respuesta';
      var dec = CGC.objetivoSesion(datos.objetivo || s.objetivo);
      var refRitmo = dec && dec.clave==='ritmo' && (D.objAt||[]).some(function(o){ return o.atleta_id===aid && o.tipo==='acordado' && o.estado==='vigente' && String(o.prueba||'').indexOf(dec.detalle)!==-1; });
      var filas = [];
      (datos.bloques||[]).forEach(function(b){
        (b.filas||[]).forEach(function(f){
          if (!f || !f.id || !(f.ejercicio || f.detalle)) return;
          // El objetivo escrito en el bloque es declarado; el de la sesión, solo una propuesta.
          var E = CGC.leerFila(f, { posicion:CGC.posicionDeBloque(b.etiqueta), objetivoBloque:CGC.objetivoSesion(b.etiqueta), objetivoSesion:dec, referenciaRitmo:refRitmo });
          var st = (D.estructuras||[]).filter(function(e){ return e.sesion_id===s.id && e.sesion_version===vnum && e.fila_id===f.id; })[0];
          if (st){
            if (st.huella === E.texto) E = Object.assign({}, st.estructura, { fila_id:f.id, texto:E.texto, estado:st.estado, _st:st });
            else E.dudas = ['La fila cambió desde que se revisó su lectura: revísala otra vez.'].concat(E.dudas||[]);
          }
          filas.push({ estructura:E, atomos:CGC.atomos(E, { sid:s.id }), bloque:b.etiqueta, fila:f });
        });
      });
      var X = CGC.ejecutar(filas, { reg:reg, toma:toma, regEnt:regEnt });
      X.forEach(function(x){ x.s = s; });
      var S = { id:s.id, s:s, ref:ref, vnum:vnum, reg:reg, regEnt:regEnt, toma:toma, filas:filas, vencida:vencido(s), futura:s.fecha > hoy };
      sesiones.push(S); porSesion[s.id] = X; todas = todas.concat(X);
    });
    var R = CGC.resumir(todas);
    var cob = CGC.cobertura(sesiones, porSesion, { modo: modoDe(aid) });
    return { aid:aid, sesiones:sesiones, X:todas, R:R, cob:cob, porSesion:porSesion };
  }

  /* ---------- Análisis del atleta (v1: solo grupos de prueba) ----------
     Reglas: docs/definiciones-analisis-atleta.md. Solo lee: el motor
     (assets/js/academia-analisis.js) ordena lo registrado y aquí se pinta. Cada
     frase dice su periodo y abre los datos de los que sale; lo que falta se ve
     como hueco, nunca como cero. No puntúa, no diagnostica, no deduce causas y no
     propone decisiones. «0» es cero de verdad, «—» no aplica y «sin dato» es que
     no hay registro. */
  var ANC = window.APOLANA_ANALISIS;
  var AN = null;
  function vientoCuenta(p){ return !!p && ((p.disciplina==='velocidad' || p.disciplina==='vallas') && Number(p.distancia_m) > 0 && Number(p.distancia_m) <= 200 || /longitud|triple/i.test(p.nombre||'')); }
  function conParciales(p){ return !!p && p.unidad==='tiempo' && Number(p.distancia_m) > 0; }
  function listaPruebas(v){ return Array.isArray(v) ? v : String(v||'').split(/[,;]/).map(function(x){ return x.trim(); }).filter(Boolean); }
  /* Pruebas que se pueden analizar: las del perfil (principal o secundaria) que
     están en el catálogo y las de sus objetivos acordados de la temporada. */
  function pruebasAnalisis(a, tem){
    var L = [], ya = {};
    var add = function(pid, tipo, txt){ if (!pid){ L.push({ id:null, tipo:tipo, txt:txt }); return; } if (ya[pid]) return; ya[pid] = 1; L.push({ id:pid, tipo:tipo, txt:TM.pid[pid].nombre }); };
    listaPruebas(a.pruebas_principales).forEach(function(t){ add(pruebaDe({ prueba:t }).id, 'principal', t); });
    listaPruebas(a.pruebas_secundarias).forEach(function(t){ add(pruebaDe({ prueba:t }).id, 'secundaria', t); });
    if (tem) FX.obj.filter(function(o){ return o.atleta_id===a.id && o.temporada_id===tem.id && o.tipo==='acordado' && o.estado!=='descartado' && o.prueba_id && TM.pid[o.prueba_id]; })
      .forEach(function(o){ add(o.prueba_id, 'objetivo', o.prueba); });
    return L;
  }
  function construirAnalisis(){
    var a = FX.a, aid = a.id, hoy = ANC.hoyMadrid(), tem = temporadaHoy(), lu = lunesDe(hoy);
    var semanas = [sumar(lu, -21), sumar(lu, -14), sumar(lu, -7), lu];
