<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Más · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/cubo-cuota.js" defer></script>
<style>
  :root{ --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif;
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body{ background:var(--crema,#FBF9F4); }
  .mas-wrap{ max-width:640px; margin:0 auto; padding:clamp(16px,4vw,26px) clamp(14px,4vw,22px) 48px; }
  .mas-h{ font-family:var(--ap-titulo); font-weight:800; text-transform:uppercase; font-size:clamp(26px,6vw,34px);
          line-height:.98; color:var(--navy,#26374B); margin:2px 0 14px; }
  .mas-rot{ font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:12px; letter-spacing:.08em;
            color:var(--texto-tenue,#9A927F); margin:20px 2px 9px; }

  .fila-mas{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB);
             border-radius:14px; padding:14px 16px; margin-bottom:9px; text-decoration:none; color:inherit;
             box-shadow:0 10px 22px -18px rgba(46,66,86,.5); }
  .fila-mas .fm-icbox{ flex:0 0 38px; width:38px; height:38px; border-radius:11px; background:var(--crema-media,#EDE6D7); display:grid; place-items:center; }
  .fila-mas .fm-icbox svg{ width:20px; height:20px; color:var(--navy,#26374B); }
  .fila-mas .tx{ flex:1; min-width:0; }
  .fila-mas .tx b{ display:block; font-size:15px; color:var(--navy,#26374B); font-weight:600; }
  .fila-mas .tx small{ display:block; font-size:12.5px; color:var(--texto-suave,#6E6656); }
  .fila-mas .chev{ color:var(--texto-tenue,#9A927F); font-size:20px; line-height:1; }
  .mas-salir{ display:block; width:100%; text-align:center; margin-top:22px; background:none; border:0;
              color:var(--texto-suave,#6E6656); font:inherit; font-size:14px; padding:12px; cursor:pointer; text-decoration:underline; }

  /* Tarjeta de la cuota del Cubo (misma que en cubo-atleta; la pinta cubo-cuota.js) */
  .cuota{ background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); padding:16px 18px; margin-bottom:14px; }
  .cuota h2{ font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:15px; color:var(--navy,#26374B); margin:0 0 6px; }
  .cuota p{ font-size:14px; line-height:1.5; color:var(--texto-suave,#6E6656); margin:0 0 12px; }
  .cuota .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 18px; border-radius:999px;
               background:var(--crema-media,#F1EADC); border:1px solid var(--linea-borde,#E4DCCB); color:var(--texto-suave,#6E6656); font-weight:600; font-size:14px; }
  .cuota .btn.activo{ background:var(--navy,#26374B); border-color:var(--navy,#26374B); color:#fff; cursor:pointer; }
  .cuota .btn.activo:disabled{ opacity:.62; cursor:progress; }
  .cuota .pago-msg{ margin:10px 0 0; font-size:13.5px; color:#B23B3B; }
  .cuota .fina{ font-size:12.5px; color:var(--texto-tenue,#9A927F); margin:10px 0 0; }
  .cuota .enlace{ background:none; border:0; padding:0; font:inherit; color:var(--azul,#2F6FA8); text-decoration:underline; cursor:pointer; }
  .cuota .enlace:hover{ color:var(--azul-hover,#1E4E78); }
  .cuota .pagos{ display:flex; flex-wrap:wrap; gap:10px; margin:2px 0 4px; }
  .cuota .pago{ flex:1 1 130px; background:var(--crema-media,#F1EADC); border-radius:10px; padding:9px 12px; }
  .cuota .pago span{ display:block; font-size:12px; color:var(--texto-suave,#6E6656); }
  .cuota .pago b{ font-size:14px; color:var(--navy,#26374B); }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="mas-wrap" id="ms"><div class="ap-esq" data-esq="filas:3"></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var b = (window.APOLANA_BASE || '../../');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function svg(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'; }
  var IC = {
    ficha:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6.5 8-6.5S20 17 20 21"/>',
    mensajes:'<path d="M20 12a7 7 0 0 1-10 6.3L4 20l1.7-4.2A7 7 0 1 1 20 12z"/>',
    documentos:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h4"/>',
    tienda:'<path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    contacto:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    recursos:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>',
    pagos:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
    retos:'<circle cx="12" cy="14" r="5"/><path d="M9 9.5 7 3M15 9.5 17 3"/>',
    liga:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
    carga:'<path d="M3 12h4l2 6 4-13 2 8 2-3h4"/>',
    lesiones:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
    noticias:'<path d="M4 5h13v14H4z"/><path d="M17 8h3v9a2 2 0 0 1-2 2h-1z"/><path d="M7 8h7M7 11h7M7 14h4"/>'
  };
  function fila(titulo, sub, href, icon) {
    return '<a class="fila-mas" href="' + esc(href) + '"><span class="fm-icbox">' + svg(icon || IC.documentos) + '</span>' +
      '<span class="tx"><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
      '<span class="chev" aria-hidden="true">›</span></a>';
  }

  // ¿Es atleta (algún grupo NO-Cubo)? ¿Academia? → para mostrar sus cosas en «Más»
  var esAtleta = false, esAcademia = false;
  try {
    var m = await APOLANA_PORTAL.misAtletas(perfil.id);
    var mis = (m && m.data || []).filter(function (a) { return a && a.perfil_id === perfil.id; });
    var gids = mis.map(function (a) { return a.grupo_id; }).filter(Boolean);
    var aids = mis.map(function (a) { return a.id; }).filter(Boolean);
    if (aids.length) {
      var rag = await sb.from('atleta_grupos').select('grupo_id').in('atleta_id', aids);
      if (rag && !rag.error && rag.data) rag.data.forEach(function (x) { gids.push(x.grupo_id); });
    }
    if (gids.length) {
      var rg = await sb.from('grupos').select('id,nombre,seccion').in('id', gids);
      if (rg && !rg.error && rg.data) rg.data.forEach(function (g) {
        if (g.seccion && g.seccion !== 'cubo') esAtleta = true;
        if (g.nombre && /academia|ac98/i.test(g.nombre)) esAcademia = true;
      });
    }
  } catch (e) {}

  // ¿Está activa la domiciliación? (hay un texto de mandato activo). Solo
  // entonces se ofrece «Domiciliación bancaria»: si no, llevaría a un callejón.
  var sepaActiva = false;
  try {
    var rsep = await sb.from('sepa_mandato_texto').select('id').eq('activo', true).limit(1);
    sepaActiva = !!(rsep && rsep.data && rsep.data.length);
  } catch (e) {}
  // ¿Es socio? La domiciliación es de SOCIOS (cuota anual) y cuotas de pista/
  // escuela, NO del Cubo (que se paga con tarjeta). A los del Cubo-solo NO se les
  // ofrece «Domiciliación bancaria»: metían ahí su IBAN pensando que así pagaban.
  var esSocio = false;
  try {
    var _rr = (perfil && (perfil.roles || (perfil.rol ? [perfil.rol] : []))) || [];
    esSocio = _rr.indexOf('socio') !== -1;
  } catch (e) {}
  var ofreceSepa = sepaActiva && (esAtleta || esSocio);

  var html = '<h1 class="mas-h">Más</h1>' +
    '<div id="ms-cubo"><div id="ms-cuota"></div></div>';

  if (esAtleta) {
    html += '<div class="mas-rot">Tu entreno</div>' +
      fila('Recursos del grupo', 'Material y recursos', b + 'portal/atleta/#recursos', IC.recursos) +
      fila('Pagos y recibos', 'Tus recibos y cuotas', b + 'portal/atleta/#pagos', IC.pagos) +
      fila('Mis retos y medallas', 'Logros y medallas', b + 'portal/retos/', IC.retos) +
      fila('Liga Apolana', 'Tus pruebas y el ranking', b + 'portal/liga/', IC.liga) +
      fila('Carga y bienestar', 'Tu diario de entreno', b + 'portal/carga/', IC.carga) +
      (esAcademia ? fila('Lesiones y disponibilidad', 'Tu parte de lesiones', b + 'portal/lesiones/', IC.lesiones) : '');
  }

  html += '<div class="mas-rot">Tú</div>' +
      fila('Mi ficha y mis datos', 'Tus datos personales', b + 'portal/perfil/', IC.ficha) +
      (ofreceSepa ? fila('Domiciliación bancaria', 'Domicilia tus cuotas en tu cuenta', b + 'domiciliacion/?origen=portal', IC.pagos) : '') +
      fila('Mis mensajes', 'Avisos y mensajes del club', b + 'portal/mensajes/', IC.mensajes) +
      fila('Documentos', 'Circulares y documentos', b + 'portal/documentos/', IC.documentos) +
    '<div class="mas-rot">Del club</div>' +
      fila('Noticias', 'Novedades del club', b + 'noticias/', IC.noticias) +
      fila('Tienda del club', 'Equipación y ropa', b + 'tienda/', IC.tienda) +
      fila('Contacto', 'Escríbenos', b + 'contacto/', IC.contacto) +
    '<button type="button" class="mas-salir" id="ms-salir">Cerrar sesión</button>';

  document.getElementById('ms').innerHTML = html;

  // --- Cuota del Cubo (solo si la persona tiene alta en el Cubo) ---
  var sec = document.getElementById('ms-cubo');
  try {
    if (window.APOLANA_CUBO_CUOTA) {
      var ok = await APOLANA_CUBO_CUOTA.render(sb, perfil, document.getElementById('ms-cuota'));
      if (ok) sec.insertAdjacentHTML('afterbegin', '<div class="mas-rot">El Cubo</div>');
      else sec.parentNode.removeChild(sec);   // no es del Cubo: no se muestra nada de cuota
    } else {
      sec.parentNode.removeChild(sec);
    }
  } catch (e) {
    if (sec && sec.parentNode) sec.parentNode.removeChild(sec);
  }

  // --- Cerrar sesión (mismo patrón que la hoja de papeles) ---
  var salir = document.getElementById('ms-salir');
  if (salir) salir.addEventListener('click', function () {
    try { sb.auth.signOut().then(function () { location.href = b; }, function () { location.href = b; }); }
    catch (e) { location.href = b; }
  });
});
</script>

</body>
</html>
