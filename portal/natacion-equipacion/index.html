<style>

  /* filtros */

  .cu-resumen small{ display:block; color:var(--texto-suave,#6E6656); font-size:13px; margin-top:4px; }
  .cu-hoja .cu-acc{ margin-top:16px; }

  .cu-toast{ position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--navy,#26374B); color:#fff;

  <div id="cuotas"><p class="cu-msg">Cargando…</p></div>

<script>
/* Natación · Equipación 2026/27 (mig 436). El pedido de cada familia: quién ha
   contestado, qué ha pedido, «nuevo» por nadador (la sudadera es gratis a los
   nuevos), «ha llegado» (crea el enlace de pago), pagado y entregado; correo y
   WhatsApp con el enlace de cada familia; Excel para el proveedor. */
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cuotas');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function norm(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
  function eur(n){ var v=Math.round(Number(n||0)*100)/100; return v.toLocaleString('es-ES',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €'; }
  function capital(s){ return String(s||'').toLowerCase().replace(/(^|[\s-])(\p{L})/gu, function(_, a, b){ return a + b.toUpperCase(); }); }
  function pila(s){ return capital(String(s||'').trim().split(/\s+/)[0] || ''); }
  var toastTmr = null;
  function toast(t){ var el = document.querySelector('.cu-toast'); if (!el){ el = document.createElement('div'); el.className = 'cu-toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent = t; el.style.display = ''; clearTimeout(toastTmr); toastTmr = setTimeout(function(){ el.style.display = 'none'; }, 2800); }
  async function copiar(txt, aviso){ try { await navigator.clipboard.writeText(txt); toast(aviso || 'Copiado'); } catch (e) { prompt('Cópialo:', txt); } }
  function telWa(t){ var d = String(t||'').replace(/[^\d+]/g,''); if (!d) return ''; if (d.charAt(0) === '+') return d.slice(1); if (d.length === 9) return '34' + d; return d; }

  var rp = await sb.rpc('natacion_cuotas_puede');
  if (rp.error || !rp.data){ wrap.innerHTML = '<div class="cu-card"><h2>Equipación</h2><div class="cu-cuerpo"><p style="margin:0">Esta pantalla es para quien lleva la natación.</p></div></div>'; return; }

  var S = { lista: null, err: null, q: '', estado: '', abiertos: {}, ocupado: {} };
  var ESTADOS = { pendiente: ['pend', 'Sin contestar'], pedido: ['camino', 'Pedido hecho'], llegado: ['activa', 'Ha llegado'], pagado: ['activa', 'Pagado'], entregado: ['cerrado', 'Entregado'] };
  async function cargar(){
    var r = await sb.rpc('natacion_equip_listar');
    if (r.error){ S.err = r.error.message || 'No se pudo cargar.'; S.lista = []; } else {
      S.err = null; S.lista = r.data || [];
      // Pagado por el enlace (el webhook marca el recibo): cuenta como «Pagado». Solo se paga con tarjeta (Mario, 22-oct).
      S.lista.forEach(function (f) { if (f.estado === 'llegado' && f.pago_estado === 'pagado') f.estado = 'pagado'; });
    }
  }
  function estadoDe(f){
    if ((f.estado === 'llegado') && f.pago_estado === 'pagado') return ['activa', 'Pagado'];
    if (f.estado === 'llegado' && Number(f.total) > 0) return ['pend', 'Ha llegado · sin pagar'];
    return ESTADOS[f.estado] || ['sin', f.estado];
  }
  function nombresDe(f){ return (f.nadadores || []).map(function (n) { return capital(n.nombre); }).join(', '); }
  function filtrados(){
    var q = norm(S.q);
    return (S.lista || []).filter(function (f) {
      if (S.estado && f.estado !== S.estado) return false;
      if (q && norm((f.contacto || '') + ' ' + f.email + ' ' + nombresDe(f)).indexOf(q) < 0) return false;
      return true;
    });
  }
  function mensajeWa(f, pago){
    var hola = '¡Hola' + (f.contacto ? ', ' + pila(f.contacto) : '') + '! 👋';
    if (pago) return hola + '\n\nYa ha llegado la *equipación de natación* 🏊. Antes de recogerla, podéis pagar *' + eur(f.total) + '* con tarjeta aquí:\n' + pago + '\n\n¡Gracias!';
    return hola + '\n\nEstamos preparando los pedidos de *equipación de natación* 🏊. Aquí podéis elegir las tallas de ' + ((f.nadadores || []).map(function (n) { return pila(n.nombre); }).join(' y ') || 'vuestro nadador') +
      ' (camiseta y gorro gratis; chaqueta gratis para quien se incorpora este año) y encargar bañadores si queréis. *Antes del 2 de noviembre*:\n' + f.enlace + '\n\nNo se paga nada ahora: se paga al llegar la ropa. ¡Gracias!';
  }

  function cab(){
    var L = S.lista || [], n = L.length;
    var cont = L.filter(function (f) { return f.respondido_en; }).length;
    var sinAviso = L.filter(function (f) { return !f.avisado_en; }).length;
    var porCobrar = L.reduce(function (a, f) { return a + (f.pago_estado === 'pagado' || f.estado === 'pagado' || f.estado === 'entregado' ? 0 : Number(f.total || 0)); }, 0);
    var nuevos = L.reduce(function (a, f) { return a + (f.nadadores || []).filter(function (x) { return x.nuevo; }).length; }, 0);
    return '<div class="cu-cab"><div class="cu-eyebrow">Natación</div><h1>Equipación 2026/27</h1>' +
      '<p>Cada familia elige las tallas con su enlace (camiseta y gorro gratis; chaqueta gratis a los <b>nuevos</b> y 35 € al resto) y puede encargar bañadores o algo más de la tienda. Se paga con tarjeta por el enlace cuando llega la ropa.</p></div>' +
      '<div class="cu-card"><div class="cu-cuerpo">' +
        '<div class="eq-res"><span><b>' + cont + '</b> de <b>' + n + '</b> familias han contestado</span><span>· <b>' + nuevos + '</b> nadadores nuevos</span><span>· <b>' + eur(porCobrar) + '</b> por cobrar</span></div>' +
        '<div class="eq-acc">' +
          (sinAviso ? '<button type="button" class="cu-btn" data-enviar>Mandar el enlace por correo (' + sinAviso + ' familias)</button>' : '<button type="button" class="cu-btn sec" data-recordar>Recordatorio a las que no han contestado</button>') +
          '<button type="button" class="cu-btn sec" data-excel>Descargar Excel</button></div>' +
        '<div class="cu-cobro-det" style="margin-top:10px">Antes de mandar los enlaces, revisa abajo quién es <b>nuevo</b> (la casilla de cada nadador): a los nuevos la chaqueta les sale gratis.</div>' +
      '</div></div>' +
      '<div class="cu-card"><div class="cu-cuerpo">' +
        '<input type="search" class="cu-input" id="eq-q" autocomplete="off" placeholder="Buscar familia o nadador" value="' + esc(S.q) + '">' +
        '<div class="cu-filtros">' + [['', 'Todas'], ['pendiente', 'Sin contestar'], ['pedido', 'Pedido hecho'], ['llegado', 'Ha llegado'], ['pagado', 'Pagado'], ['entregado', 'Entregado']].map(function (o) {
          var c = o[0] ? (S.lista || []).filter(function (f) { return f.estado === o[0]; }).length : (S.lista || []).length;
          return '<button type="button" class="cu-chip' + (S.estado === o[0] ? ' on' : '') + '" data-est="' + o[0] + '">' + esc(o[1]) + ' · ' + c + '</button>'; }).join('') + '</div>' +
      '</div></div>';
  }
  function fila(f){
    var e = estadoDe(f), ab = !!S.abiertos[f.id];
    var h = '<div class="cu-item' + (ab ? ' abierto' : '') + '" data-fila="' + f.id + '">' +
      '<button type="button" class="cu-row" data-abrir="' + f.id + '"><span class="q"><b>' + esc(capital(f.contacto || f.email)) + '</b><small>' + esc(nombresDe(f)) + '</small></span>' +
      '<span class="d"><span class="imp">' + (Number(f.total) ? esc(eur(f.total)) : '') + '</span><span class="cu-estado ' + e[0] + '">' + esc(e[1]) + '</span></span><span class="chev" aria-hidden="true">▼</span></button>';
    if (ab) {
      h += '<div class="cu-fila" style="display:block;padding:4px 18px 16px">';
      h += '<div class="cu-sec-lab">Nadadores</div>' + (f.nadadores || []).map(function (n) {
        return '<div class="eq-nad"><span>' + esc(capital(n.nombre)) + ' <small style="color:var(--texto-suave)">· ' + esc(n.tipo || '') + '</small></span>' +
          '<label><input type="checkbox" data-nuevo="' + n.id + '"' + (n.nuevo ? ' checked' : '') + '> Nuevo este año</label></div>'; }).join('');
      var L = f.lineas || [];
      h += '<div class="cu-sec-lab" style="margin-top:10px">Pedido</div>' + (L.length ? L.map(function (l) {
        var n = (f.nadadores || []).filter(function (x) { return x.id === l.nadador_id; })[0];
        return '<div class="eq-l"><span>' + esc((l.cantidad > 1 ? l.cantidad + ' × ' : '') + l.nombre + (l.talla && l.talla !== 'ÚNICA' ? ' · ' + l.talla : '')) + (n ? ' <span class="q">· ' + esc(pila(n.nombre)) + '</span>' : '') + '</span><b>' + (Number(l.precio) ? esc(eur(l.precio * l.cantidad)) : 'Gratis') + '</b></div>'; }).join('') +
        '<div class="eq-l" style="border:0"><b>Total</b><b>' + esc(eur(f.total)) + '</b></div>' : '<div class="cu-cobro-det" style="margin-top:0">' + (f.respondido_en ? 'No ha pedido nada.' : 'Todavía no ha contestado.') + '</div>');
      var tel = telWa(f.telefono), pago = f.estado === 'llegado' && f.pago_estado !== 'pagado' ? f.pago_enlace : null;
      h += '<div class="cu-acc">' +
        '<button type="button" class="cu-btn peq sec" data-copiar="' + f.id + '">Copiar su enlace</button>' +
        '<a class="cu-btn peq wa" style="text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="https://wa.me/' + esc(tel) + '?text=' + encodeURIComponent(mensajeWa(f, pago)) + '">WhatsApp' + (pago ? ' (pago)' : '') + '</a>';
      if (f.estado === 'pedido') h += '<button type="button" class="cu-btn peq" data-estado="llegado" data-id="' + f.id + '"' + (S.ocupado[f.id] ? ' disabled' : '') + '>Ha llegado · avisar</button>';
      if (f.estado === 'llegado' || f.estado === 'pagado') h += '<button type="button" class="cu-btn peq verde" data-estado="entregado" data-id="' + f.id + '">Entregado</button>';
      if (pago) h += '<button type="button" class="cu-btn peq sec" data-copiar-pago="' + f.id + '">Copiar enlace de pago</button>';
      h += '</div><div class="cu-cobro-det">' + esc(f.email) + (f.telefono ? ' · ' + esc(f.telefono) : '') + (f.avisado_en ? ' · enlace enviado' : ' · enlace sin enviar') + '</div></div>';
    }
    return h + '</div>';
  }
  function lista(){
    if (S.lista == null) return '<p class="cu-msg">Cargando…</p>';
    if (S.err) return '<div class="cu-card"><div class="cu-cuerpo"><div class="cu-mal" style="margin:0">' + esc(S.err) + '</div></div></div>';
    var L = filtrados();
    return '<div class="cu-card"><h2>Familias <small>' + L.length + '</small></h2><div id="cu-filas">' + (L.length ? L.map(fila).join('') : '<div class="cu-cuerpo"><p class="cu-msg" style="padding:14px 0">No hay ninguna con esos filtros.</p></div>') + '</div></div>';
  }
  function pintar(){
    var foco = document.activeElement && document.activeElement.id === 'eq-q';
    wrap.innerHTML = cab() + '<div id="eq-lista">' + lista() + '</div>';
    if (foco){ var b = document.getElementById('eq-q'); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
  }
  function porId(id){ return (S.lista || []).filter(function (f) { return f.id === id; })[0]; }

  async function correo(cuerpo){
    var r = await sb.functions.invoke('natacion-equipacion-correo', { body: cuerpo });
    var d = r && r.data; if (!d && r && r.error && r.error.context && r.error.context.json) d = await r.error.context.json().catch(function(){ return null; });
    return d || {};
  }
  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  function cargarXlsx(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = XLSX_URL; s.onload = function(){ ok(window.XLSX); }; s.onerror = ko; document.head.appendChild(s); }); }
  var ORD = ['4','6','8','10','12','14','XS','S','M','L','XL','XXL','ÚNICA'];
  async function excel(){
    var X = await cargarXlsx();
    var suma = {}, det = [];
    (S.lista || []).forEach(function (f) {
      (f.lineas || []).forEach(function (l) {
        var n = (f.nadadores || []).filter(function (x) { return x.id === l.nadador_id; })[0];
        var k = l.nombre + '|' + (l.talla || '');
        if (!suma[k]) suma[k] = { 'Artículo': l.nombre, 'Talla': l.talla || '—', 'Unidades': 0, _o: ORD.indexOf(String(l.talla || '').toUpperCase()) };
        suma[k]['Unidades'] += Number(l.cantidad) || 1;
        det.push({ 'Familia': capital(f.contacto || ''), 'Correo': f.email, 'Teléfono': f.telefono || '', 'Nadador': n ? capital(n.nombre) : '', 'Nuevo': n && n.nuevo ? 'Sí' : '',
          'Artículo': l.nombre, 'Talla': l.talla || '', 'Unidades': Number(l.cantidad) || 1, 'Importe (€)': Math.round(Number(l.precio) * (Number(l.cantidad) || 1) * 100) / 100, 'Estado': estadoDe(f)[1] });
      });
    });
    var prov = Object.keys(suma).map(function (k) { return suma[k]; }).sort(function (a, b) { return a['Artículo'].localeCompare(b['Artículo'], 'es') || a._o - b._o; })
      .map(function (r) { return { 'Artículo': r['Artículo'], 'Talla': r['Talla'], 'Unidades': r['Unidades'] }; });
    var fams = (S.lista || []).map(function (f) { return { 'Familia': capital(f.contacto || ''), 'Nadadores': nombresDe(f), 'Correo': f.email, 'Teléfono': f.telefono || '', 'Estado': estadoDe(f)[1], 'Total (€)': Number(f.total) || 0, 'Enlace': f.enlace }; });
    var wb = X.utils.book_new();
    var h1 = X.utils.json_to_sheet(prov.length ? prov : [{ 'Artículo': 'Todavía no hay pedidos' }]); h1['!cols'] = [{ wch: 30 }, { wch: 8 }, { wch: 10 }];
    var h2 = X.utils.json_to_sheet(det.length ? det : [{ 'Familia': '—' }]); h2['!cols'] = [{ wch: 26 }, { wch: 28 }, { wch: 13 }, { wch: 26 }, { wch: 7 }, { wch: 28 }, { wch: 7 }, { wch: 9 }, { wch: 11 }, { wch: 16 }];
    var h3 = X.utils.json_to_sheet(fams); h3['!cols'] = [{ wch: 26 }, { wch: 32 }, { wch: 28 }, { wch: 13 }, { wch: 18 }, { wch: 9 }, { wch: 60 }];
    X.utils.book_append_sheet(wb, h1, 'Para el proveedor');
    X.utils.book_append_sheet(wb, h2, 'Por nadador');
    X.utils.book_append_sheet(wb, h3, 'Familias');
    X.writeFile(wb, 'Equipación natación 2026-27.xlsx');
  }

  wrap.addEventListener('click', async function (ev) {
    var t = ev.target; if (!t || !t.closest) return; var b;
    if ((b = t.closest('[data-abrir]'))){ var id = b.getAttribute('data-abrir'); if (S.abiertos[id]) delete S.abiertos[id]; else S.abiertos[id] = true; document.getElementById('eq-lista').innerHTML = lista(); return; }
    if ((b = t.closest('[data-est]'))){ S.estado = b.getAttribute('data-est'); pintar(); return; }
    if ((b = t.closest('[data-copiar]'))){ var f = porId(b.getAttribute('data-copiar')); if (f) copiar(f.enlace, 'Enlace copiado'); return; }
    if ((b = t.closest('[data-copiar-pago]'))){ var fp = porId(b.getAttribute('data-copiar-pago')); if (fp && fp.pago_enlace) copiar(fp.pago_enlace, 'Enlace de pago copiado'); return; }
    if ((b = t.closest('[data-excel]'))){ excel().catch(function(){ toast('No se pudo hacer el Excel'); }); return; }
    if ((b = t.closest('[data-enviar]')) || (b = t.closest('[data-recordar]'))){
      var rec = b.hasAttribute('data-recordar');
      var n = rec ? (S.lista || []).filter(function (f) { return f.avisado_en && !f.respondido_en && f.estado === 'pendiente'; }).length : (S.lista || []).filter(function (f) { return !f.avisado_en; }).length;
      if (!n) { toast('No hay ninguna a la que mandárselo'); return; }
      if (!confirm((rec ? '¿Mandar un recordatorio por correo a ' : '¿Mandar el enlace por correo a ') + n + ' familias?')) return;
      b.disabled = true; b.textContent = 'Enviando…';
      var d = await correo(rec ? { recordar: true } : { enviar: true });
      toast(d.ok ? 'Enviados ' + d.enviados + ' de ' + d.total : (d.mensaje || 'No se pudo enviar'));
      await cargar(); pintar(); return;
    }
    if ((b = t.closest('[data-estado]'))){
      var fid = b.getAttribute('data-id'), est = b.getAttribute('data-estado'), fam = porId(fid);
      if (est === 'llegado' && !confirm('¿Marcar que ha llegado el pedido de ' + capital(fam.contacto || fam.email) + ' y avisarle por correo' + (Number(fam.total) > 0 ? ' con el enlace para pagar ' + eur(fam.total) : '') + '?')) return;
      if (est === 'entregado' && !confirm('¿Marcar como entregado?')) return;
      S.ocupado[fid] = true; b.disabled = true;
      var r = await sb.rpc('natacion_equip_estado_set', { p_familia: fid, p_estado: est, p_metodo: b.getAttribute('data-metodo') || null });
      delete S.ocupado[fid];
      if (r.error) { toast(r.error.message || 'No se pudo'); b.disabled = false; return; }
      if (est === 'llegado') { var dc = await correo({ llegado: fid }); toast(dc.ok ? 'Marcado y avisado por correo' : 'Marcado (el correo no salió: mándale el WhatsApp)'); }
      else toast(est === 'pagado' ? 'Apuntado como pagado' : 'Entregado');
      await cargar(); pintar(); return;
    }
  });
  wrap.addEventListener('change', async function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute('data-nuevo');
    if (!id) return;
    var r = await sb.rpc('natacion_equip_nuevo_set', { p_nadador: id, p_nuevo: ev.target.checked });
    if (r.error) { toast(r.error.message || 'No se pudo'); ev.target.checked = !ev.target.checked; return; }
    toast(ev.target.checked ? 'Marcado como nuevo: chaqueta gratis' : 'Quitado: la chaqueta le sale a 35 €');
    await cargar(); pintar();
  });
  var qT = null;
  wrap.addEventListener('input', function (ev) { if (ev.target.id === 'eq-q') { S.q = ev.target.value; clearTimeout(qT); qT = setTimeout(function () { document.getElementById('eq-lista').innerHTML = lista(); }, 150); } });

  pintar();
  await cargar();
  pintar();
});
</script>
</body>
</html>
