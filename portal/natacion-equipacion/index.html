<style>

  /* filtros */

  .cu-row{ display:flex; align-items:center; gap:10px; width:100%; min-height:62px; box-sizing:border-box; padding:10px 12px 10px 18px;

  .cu-hoja > h2{ margin:0; padding:15px 18px; background:var(--crema-media,#F4EEE1); border-bottom:1px solid var(--linea-marcada,#E4DCCB);

  .cu-hoja > h2 button{ margin-left:auto; font:inherit; font-size:22px; line-height:1; background:none; border:0; cursor:pointer; color:var(--texto-suave,#6E6656); padding:4px 8px; }

  .cu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }

  .cu-resumen small{ display:block; color:var(--texto-suave,#6E6656); font-size:13px; margin-top:4px; }
  .cu-hoja .cu-acc{ margin-top:16px; }

<script>
/* Natación · Equipación 2026/27 (mig 436). El pedido de cada familia: quién ha
   contestado, qué ha pedido, «nuevo» por nadador (la sudadera es gratis a los
   nuevos), «ha llegado» (crea el enlace de pago), pagado y entregado; correo y
   WhatsApp con el enlace de cada familia; Excel para el proveedor. */
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cuotas');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function norm(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
  function eur(n){ var v=Math.round(Number(n||0)*100)/100; return v.toLocaleString('es-ES',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €'; }
  function capital(s){ return String(s||'').toLowerCase().replace(/(^|[\s-])(\p{L})/gu, function(_, a, b){ return a + b.toUpperCase(); }); }
  function pila(s){ return capital(String(s||'').trim().split(/\s+/)[0] || ''); }
  var toastTmr = null;
  function toast(t){ var el = document.querySelector('.cu-toast'); if (!el){ el = document.createElement('div'); el.className = 'cu-toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
    el.textContent = t; el.style.display = ''; clearTimeout(toastTmr); toastTmr = setTimeout(function(){ el.style.display = 'none'; }, 2800); }

      var ta = document.getElementById('eq-cu'), ins = b.getAttribute('data-ins'), i = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
      ta.value = ta.value.slice(0, i) + ins + ta.value.slice(ta.selectionEnd != null ? ta.selectionEnd : i);
      ta.focus(); ta.setSelectionRange(i + ins.length, i + ins.length);
      ED.cuerpo = ta.value; ED.guardado = false; previa(); return;
    }
    if (t.closest('[data-ed-guardar]')) { guardarTexto().then(function (ok) { if (ok) edMsg('cu-ok', 'Texto guardado' + (ED.fam ? ' para los próximos nuevos.' : '.')); }); return; }
    if ((b = t.closest('[data-ed-prueba]'))) { pruebaEd(b); return; }
    if ((b = t.closest('[data-ed-enviar]'))) { enviarEd(b); return; }
  });
  document.addEventListener('input', function (ev) {
    if (!ED) return;
    if (ev.target.id === 'eq-as') { ED.asunto = ev.target.value; ED.guardado = false; previa(); }
    else if (ev.target.id === 'eq-cu') { ED.cuerpo = ev.target.value; ED.guardado = false; previa(); }
  });
  document.addEventListener('keydown', function (ev) { if (ED && ev.key === 'Escape') cerrarEditor(); });

  var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  function cargarXlsx(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise(function (ok, ko) { var s = document.createElement('script'); s.src = XLSX_URL; s.onload = function(){ ok(window.XLSX); }; s.onerror = ko; document.head.appendChild(s); }); }
  var ORD = ['4','6','8','10','12','14','XS','S','M','L','XL','XXL','ÚNICA'];
  async function excel(){
    var X = await cargarXlsx();
    var suma = {}, det = [];
    (S.lista || []).forEach(function (f) {
      (f.lineas || []).forEach(function (l) {
        var n = (f.nadadores || []).filter(function (x) { return x.id === l.nadador_id; })[0];
        var k = l.nombre + '|' + (l.talla || '');
        if (!suma[k]) suma[k] = { 'Artículo': l.nombre, 'Talla': l.talla || '—', 'Unidades': 0, _o: ORD.indexOf(String(l.talla || '').toUpperCase()) };
        suma[k]['Unidades'] += Number(l.cantidad) || 1;
        det.push({ 'Familia': capital(f.contacto || ''), 'Correo': f.email, 'Teléfono': f.telefono || '', 'Nadador': n ? capital(n.nombre) : '', 'Nuevo': n && n.nuevo ? 'Sí' : '',
          'Artículo': l.nombre, 'Talla': l.talla || '', 'Unidades': Number(l.cantidad) || 1, 'Importe (€)': Math.round(Number(l.precio) * (Number(l.cantidad) || 1) * 100) / 100, 'Estado': estadoDe(f)[1] });
      });
    });
    // Lo que se sirve del stock (mig 465: unidades reservadas a una familia) no se pide al proveedor.
    var rs = await sb.rpc('natacion_ropa_stock_listar'), delStock = [];
    ((rs.data && rs.data.stock) || []).forEach(function (u) {
      if (!u.familia_id || !u.producto) return;
      var k = u.producto + '|' + (u.talla || '');
      if (suma[k]) suma[k]['Unidades'] = Math.max(0, suma[k]['Unidades'] - (Number(u.cantidad) || 1));
      delStock.push({ 'Artículo': u.producto, 'Talla': u.talla || '—', 'Unidades': Number(u.cantidad) || 1, 'Para': capital(u.familia || '') });
    });
    var prov = Object.keys(suma).map(function (k) { return suma[k]; }).filter(function (r) { return r['Unidades'] > 0; }).sort(function (a, b) { return a['Artículo'].localeCompare(b['Artículo'], 'es') || a._o - b._o; })
      .map(function (r) { return { 'Artículo': r['Artículo'], 'Talla': r['Talla'], 'Unidades': r['Unidades'] }; });
    var fams = (S.lista || []).map(function (f) { return { 'Familia': capital(f.contacto || ''), 'Nadadores': nombresDe(f), 'Correo': f.email, 'Teléfono': f.telefono || '', 'Estado': estadoDe(f)[1], 'Total (€)': Number(f.total) || 0, 'Enlace': f.enlace }; });
    var wb = X.utils.book_new();
    var h1 = X.utils.json_to_sheet(prov.length ? prov : [{ 'Artículo': 'Todavía no hay pedidos' }]); h1['!cols'] = [{ wch: 30 }, { wch: 8 }, { wch: 10 }];
    var h2 = X.utils.json_to_sheet(det.length ? det : [{ 'Familia': '—' }]); h2['!cols'] = [{ wch: 26 }, { wch: 28 }, { wch: 13 }, { wch: 26 }, { wch: 7 }, { wch: 28 }, { wch: 7 }, { wch: 9 }, { wch: 11 }, { wch: 16 }];
    var h3 = X.utils.json_to_sheet(fams); h3['!cols'] = [{ wch: 26 }, { wch: 32 }, { wch: 28 }, { wch: 13 }, { wch: 18 }, { wch: 9 }, { wch: 60 }];
    X.utils.book_append_sheet(wb, h1, 'Para el proveedor');
    X.utils.book_append_sheet(wb, h2, 'Por nadador');
    X.utils.book_append_sheet(wb, h3, 'Familias');
    if (delStock.length) { var h4 = X.utils.json_to_sheet(delStock); h4['!cols'] = [{ wch: 30 }, { wch: 8 }, { wch: 10 }, { wch: 26 }]; X.utils.book_append_sheet(wb, h4, 'Se sirve del stock'); }
    X.writeFile(wb, 'Equipación natación 2026-27.xlsx');
  }

  wrap.addEventListener('click', async function (ev) {
    var t = ev.target; if (!t || !t.closest) return; var b;
    if ((b = t.closest('[data-editor]'))){ abrirEditor(b.getAttribute('data-editor'), b.getAttribute('data-fam'), b.hasAttribute('data-solo-texto')); return; }
    if ((b = t.closest('[data-abrir]'))){ var id = b.getAttribute('data-abrir'); if (S.abiertos[id]) delete S.abiertos[id]; else S.abiertos[id] = true; document.getElementById('eq-lista').innerHTML = lista(); return; }
    if ((b = t.closest('[data-est]'))){ S.estado = b.getAttribute('data-est'); pintar(); return; }
    if ((b = t.closest('[data-copiar]'))){ var f = porId(b.getAttribute('data-copiar')); if (f) copiar(f.enlace, 'Enlace copiado'); return; }
    if ((b = t.closest('[data-copiar-pago]'))){ var fp = porId(b.getAttribute('data-copiar-pago')); if (fp && fp.pago_enlace) copiar(fp.pago_enlace, 'Enlace de pago copiado'); return; }
    if ((b = t.closest('[data-excel]'))){ excel().catch(function(){ toast('No se pudo hacer el Excel'); }); return; }
    if ((b = t.closest('[data-recordar]'))){
      var n = (S.lista || []).filter(function (f) { return f.avisado_en && !f.respondido_en && f.estado === 'pendiente'; }).length;
      if (!n) { toast('No hay ninguna a la que mandárselo'); return; }
      if (!confirm('¿Mandar un recordatorio por correo a ' + n + ' familias?')) return;
      b.disabled = true; b.textContent = 'Enviando…';
      var d = await correo({ recordar: true });
      toast(d.ok ? 'Enviados ' + d.enviados + ' de ' + d.total : (d.mensaje || 'No se pudo enviar'));
      await cargar(); pintar(); return;
    }
    if ((b = t.closest('[data-estado]'))){
      var fid = b.getAttribute('data-id'), est = b.getAttribute('data-estado'), fam = porId(fid);
      if (est === 'llegado' && !confirm('¿Marcar que ha llegado el pedido de ' + capital(fam.contacto || fam.email) + ' y avisarle por correo' + (Number(fam.total) > 0 ? ' con el enlace para pagar ' + eur(fam.total) : '') + '?')) return;
      if (est === 'entregado' && !confirm('¿Marcar como entregado?')) return;
      S.ocupado[fid] = true; b.disabled = true;
      var r = await sb.rpc('natacion_equip_estado_set', { p_familia: fid, p_estado: est, p_metodo: b.getAttribute('data-metodo') || null });
      delete S.ocupado[fid];
      if (r.error) { toast(r.error.message || 'No se pudo'); b.disabled = false; return; }
      if (est === 'llegado') { var dc = await correo({ llegado: fid }); toast(dc.ok ? 'Marcado y avisado por correo' : 'Marcado (el correo no salió: mándale el WhatsApp)'); }
      else toast(est === 'pagado' ? 'Apuntado como pagado' : 'Entregado');
      await cargar(); pintar(); return;
    }
  });
  wrap.addEventListener('change', async function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute('data-nuevo');
    if (!id) return;
    var r = await sb.rpc('natacion_equip_nuevo_set', { p_nadador: id, p_nuevo: ev.target.checked });
    if (r.error) { toast(r.error.message || 'No se pudo'); ev.target.checked = !ev.target.checked; return; }
    toast(ev.target.checked ? 'Marcado como nuevo: chaqueta gratis' : 'Quitado: la chaqueta le sale a 35 €');
    await cargar(); pintar();
  });
  var qT = null;
  wrap.addEventListener('input', function (ev) { if (ev.target.id === 'eq-q') { S.q = ev.target.value; clearTimeout(qT); qT = setTimeout(function () { document.getElementById('eq-lista').innerHTML = lista(); }, 150); } });

  pintar();
  // Quien se haya incorporado a natación desde la última vez entra en la lista (idempotente).
  await sb.rpc('natacion_equip_preparar');
  await Promise.all([cargar(), cargarTextos()]);
  pintar();
});
</script>
