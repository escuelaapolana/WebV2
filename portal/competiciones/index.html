<html lang="es">

<style>
  body { background: var(--crema-media); }
  .cp-wrap { max-width: 900px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  /* Cabecera de pantalla (kit 30h): migas a 14 px, título a 28 px, sobre crema. */
  .cp-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:32px; line-height:1; color: var(--navy); margin: 0 0 4px; }
  .cp-cab .sub { font-size:14px; color: var(--texto-suave); }
  .migas { display:inline-flex; align-items:center; min-height:44px; margin-bottom:4px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:14px; padding:0 2px 0 0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(18px,3vw,26px); margin-bottom:18px; scroll-margin-top: 18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 6px; }
  /* Rótulo de bloque pequeño: Plex Sans 15/600 y navy, nunca azul de enlace. */
  .tarjeta h3 { font-size:15px; font-weight:600; color: var(--navy); margin:18px 0 6px; }
  .tarjeta.destacada { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(46,66,86,.12); }

  .comp-cab { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .comp-datos { font-size:14px; color: var(--texto-suave); margin:2px 0 10px; }
  .comp-notas { font-size:14px; line-height:1.5; color: var(--texto); background: var(--crema); border-left:3px solid var(--navy); padding:10px 12px; border-radius:10px; margin:10px 0; }

  /* Bloque de inscripción oficial (siempre fuera de la app: enlace de la organización) */
  .insc { margin:14px 0 2px; padding:14px; background: var(--crema); border:1px solid var(--linea); border-radius:10px; }
  /* Los precios que se leen dentro de una frase van en la letra normal (fundamentos 28c). */
  .insc .btn, .insc .btn--apagado { display:inline-flex; align-items:center; justify-content:center; min-height:44px; text-decoration:none; }
  .btn--apagado { background: var(--crema-media); border:1px solid var(--linea-borde); color: var(--texto-suave); border-radius:999px; padding:11px 20px; font-family: var(--fuente-texto); font-size:15px; font-weight:600; cursor:default; }
  .letra-chica { display:block; font-size:13px; color: var(--texto-suave); line-height:1.5; margin-top:8px; }
  .letra-chica b { color: var(--navy); }
  .insc p.te-apunta { margin:0; font-size:15px; color: var(--navy); line-height:1.5; }
  .ics-fila { margin-top:12px; }
  .ics-fila .btn { min-height:44px; }

  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-size:13px; font-weight:600; color: var(--texto-suave); }

  .pill { font-size:13px; font-weight:600; padding:3px 10px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); white-space:nowrap; }
  /* Verde solo para «está hecho»; que un plazo cierre no es culpa de nadie: ámbar. */
  .pill.ok { background:#EDF5EE; color:#3F7A4C; }
  .pill.abierta { background:#fff; border:1px solid var(--linea-borde); color: var(--navy); }
  .pill.aviso { background:#F6EBD6; color:#8A5307; }
  .pill.cerrado { background:#F6EBD6; color:#8A5307; }

  .plazo { font-size:13px; font-weight:600; color: var(--navy); }
  .plazo.cerrado { color:#8A5307; }
  /* Que un plazo esté cerrado no es un error del socio: va en ámbar, no en rojo. */
  .bloqueado { background: var(--ambar-fondo,#FDF3E3); border:1px solid var(--ambar-borde,#EBD9B8); color:#6B5227; font-size:14px; line-height:1.5; padding:10px 12px; border-radius:10px; margin-top:10px; }

  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  .apuntarme { display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:end; margin-top:6px; }
  @media (max-width:600px){ .apuntarme { grid-template-columns:1fr; } }
  .btn { cursor:pointer; }
  .btn--mini { padding:9px 16px; font-size:14px; }
  /* «Quitarme» deshace algo que el club ya ha dado por hecho: 44 px como
     cualquier otro botón, nunca la pastilla diminuta de antes (kit 30f). */
  .btn--peligro { display:inline-flex; align-items:center; justify-content:center; min-height:44px;
                  background: transparent; border: 1px solid #e0b4b0; color: #b3261e; padding: 0 18px;
                  border-radius: 999px; font-family: var(--fuente-texto); font-size:15px; font-weight:600; cursor:pointer; }
  .btn--peligro:hover { background: #fbeceb; }
  /* Rojo solo para lo que se ha escrito mal; si falla el aviso, ámbar. */
  .msg { font-size:14px; margin-top:8px; display:block; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; } .msg.fallo { color:#B96F09; }

  .mis-pruebas { list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:6px; }
  .mis-pruebas li { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px; box-sizing:border-box;
                    background: var(--crema); border-radius:10px; padding:8px 12px; font-size:14px; }
  .sel-atleta { max-width:340px; }
</style>
<script>
/* Avisos suaves y confirmaciones no bloqueantes del portal (APX). */
(function(){
  if (window.APX) return;
  var css =
    '.apx-host{position:fixed;left:0;right:0;bottom:18px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}'+
    '.apx-toast{pointer-events:auto;max-width:440px;background:var(--navy,#2E4256);color:#fff;font-family:var(--fuente-texto,system-ui);font-size:14px;line-height:1.4;padding:12px 16px;border-radius:10px;box-shadow:0 16px 34px -18px rgba(46,66,86,.7);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}'+
    '.apx-toast.apx-in{opacity:1;transform:none}'+
    '.apx-toast.apx-error{background:#B23A38}'+
    '.apx-toast.apx-ok{background:#2F6FA8}'+
    '.apx-ov{position:fixed;inset:0;z-index:10000;background:rgba(30,42,56,.5);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .2s}'+
    '.apx-ov.apx-in{opacity:1}'+
    '.apx-dlg{background:var(--crema,#FBF9F4);border:1px solid var(--linea,#EAE3D5);border-radius:14px;box-shadow:0 34px 60px -30px rgba(46,66,86,.6);max-width:400px;width:100%;padding:22px 22px 18px;transform:translateY(8px) scale(.98);transition:transform .2s}'+
    '.apx-ov.apx-in .apx-dlg{transform:none}'+
    '.apx-dlg-msg{margin:0 0 18px;font-family:var(--fuente-texto,system-ui);font-size:15px;line-height:1.5;color:var(--texto,#4A4437)}'+
    '.apx-dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}'+
    '.apx-btn{font-family:var(--fuente-texto,system-ui);font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--linea-borde,#E0D8C8);background:#fff;color:var(--navy,#2E4256);cursor:pointer;min-height:44px}'+
    '.apx-btn:hover{border-color:#C9D9E7}'+
    '.apx-ok{background:var(--azul, #2F6FA8);border-color:var(--azul, #2F6FA8);color:#fff}'+
    '.apx-ok:hover{background:var(--azul-hover, #1E4E78)}'+
    '.apx-ok.apx-danger{background:#B23A38;border-color:#B23A38}'+
    '.apx-ok.apx-danger:hover{background:#8f2c2b}'+
    '@media(max-width:420px){.apx-dlg-btns{flex-direction:column-reverse}.apx-btn{width:100%}}';
  var st=document.createElement('style'); st.textContent=css; (document.head||document.documentElement).appendChild(st);
  var host=null;
  function ensureHost(){ if(!host){ host=document.createElement('div'); host.className='apx-host'; document.body.appendChild(host);} return host; }
  function toast(msg,tipo){
    ensureHost();
    var el=document.createElement('div'); el.className='apx-toast'+(tipo?' apx-'+tipo:''); el.textContent=msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('apx-in'); });
    var vida=(tipo==='error')?4600:3000;
    setTimeout(function(){ el.classList.remove('apx-in'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); }, vida);
  }
  function confirmar(msg,opts){
    opts=opts||{};
    return new Promise(function(resolve){
      var ov=document.createElement('div'); ov.className='apx-ov';
      var dlg=document.createElement('div'); dlg.className='apx-dlg'; dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true');
      var p=document.createElement('p'); p.className='apx-dlg-msg'; p.textContent=msg; dlg.appendChild(p);
      var btns=document.createElement('div'); btns.className='apx-dlg-btns';
      var bc=document.createElement('button'); bc.type='button'; bc.className='apx-btn'; bc.textContent=opts.cancelar||'Cancelar';
      var bo=document.createElement('button'); bo.type='button'; bo.className='apx-btn apx-ok'; bo.textContent=opts.aceptar||'Aceptar';
      if(opts.peligro) bo.classList.add('apx-danger');
      btns.appendChild(bc); btns.appendChild(bo); dlg.appendChild(btns); ov.appendChild(dlg);
      document.body.appendChild(ov);
      requestAnimationFrame(function(){ ov.classList.add('apx-in'); });
      function cerrar(v){ ov.classList.remove('apx-in'); document.removeEventListener('keydown',onkey); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); resolve(v); }
      function onkey(e){ if(e.key==='Escape'){ e.preventDefault(); cerrar(false);} else if(e.key==='Enter'){ e.preventDefault(); cerrar(true);} }
      bc.addEventListener('click',function(){ cerrar(false); });
      bo.addEventListener('click',function(){ cerrar(true); });
      ov.addEventListener('click',function(e){ if(e.target===ov) cerrar(false); });
      document.addEventListener('keydown',onkey);
      setTimeout(function(){ bo.focus(); },40);
    });
  }
  window.APX={ toast:toast, confirm:confirmar };
})();
</script>
</head>
<body>

<div id="portal-contenido">
  <div class="cp-wrap" id="cp-wrap">
    <a class="migas" href="../">← Volver al portal</a>
    <div class="cp-cab"><h1>Competiciones</h1></div>
    <div class="tarjeta"><div class="ap-esq" data-esq="tarjeta"></div></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cp-wrap');
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function eur(n){ var v=parseFloat(n); return (isNaN(v)?0:v).toFixed(2).replace('.',',')+' €'; }
  function pad(n){ return (n<10?'0':'')+n; }
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  function fechaLarga(iso){ if(!iso) return 'fecha por confirmar'; var d=new Date(String(iso).indexOf('T')>-1?iso:iso+'T00:00:00'); if(isNaN(d.getTime())) return String(iso); return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  function fechaHora(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d.getTime())) return String(iso); var base=DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; if(d.getHours()||d.getMinutes()) base+=' a las '+pad(d.getHours())+':'+pad(d.getMinutes()); return base; }
  function pasado(iso){ if(!iso) return false; var d=new Date(iso); return !isNaN(d.getTime()) && d.getTime() < Date.now(); }

  /* ===========================================================
     AÑADIR A MI CALENDARIO (.ics)
     El archivo se arma aquí, en el navegador, y se descarga sin
     pasar por ningún servidor. Es una copia fija de la competición:
     si luego cambia la fecha, hay que volver a añadirla.
     Las horas van en UTC (sufijo Z) para que las acepte cualquier
     calendario sin arrastrar la definición de la zona horaria.
     =========================================================== */
  function icsEsc(s){
    return String(s==null?'':s)
      .replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,')
      .replace(/\r?\n/g,'\\n');
  }
  function icsDia(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
  function icsUTC(d){
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+
           pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
  }
  /* Las líneas largas se parten como manda el formato (75 caracteres) */
  function icsPlegar(linea){
    if (linea.length <= 74) return linea;
    var salida = linea.slice(0,74), resto = linea.slice(74);
    while (resto.length) { salida += '\r\n ' + resto.slice(0,73); resto = resto.slice(73); }
    return salida;
  }
  function icsNombreArchivo(titulo){
    var t = String(titulo||'evento').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/^apolana-/,'').slice(0,60);
    return 'apolana-' + (t || 'evento') + '.ics';
  }
  function icsTexto(ev){
    var p = String(ev.fecha).split('-');
    var ini, fin, dtIni, dtFin;
    if (ev.hora) {
      var hi = String(ev.hora).split(':');
      ini = new Date(+p[0], +p[1]-1, +p[2], +hi[0]||0, +hi[1]||0);
      fin = new Date(ini.getTime() + 90*60000);
      dtIni = 'DTSTART:' + icsUTC(ini);
      dtFin = 'DTEND:' + icsUTC(fin);
    } else {
      ini = new Date(+p[0], +p[1]-1, +p[2]);
      fin = new Date(ini.getTime()); fin.setDate(fin.getDate()+1);
      dtIni = 'DTSTART;VALUE=DATE:' + icsDia(ini);
      dtFin = 'DTEND;VALUE=DATE:' + icsDia(fin);
    }
    var l = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Club Atletismo Apolana//ES',
             'CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT'];
    l.push('UID:' + icsEsc(ev.uid || (ev.fecha + '-' + ev.titulo)) + '@apolana');
    l.push('DTSTAMP:' + icsUTC(new Date()));
    l.push(dtIni, dtFin);
    l.push('SUMMARY:' + icsEsc(ev.titulo));
    if (ev.lugar) l.push('LOCATION:' + icsEsc(ev.lugar));
    if (ev.descripcion) l.push('DESCRIPTION:' + icsEsc(ev.descripcion));
    l.push('END:VEVENT','END:VCALENDAR');
    return l.map(icsPlegar).join('\r\n') + '\r\n';
  }
  function icsDescargar(ev){
    var blob = new Blob([icsTexto(ev)], { type:'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = icsNombreArchivo(ev.titulo);
    document.body.appendChild(a); a.click();
    setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 400);
  }
  function icsDeCompeticion(c){
    var partes = [];
    if (c.sede) partes.push(c.sede);
    if (parseFloat(c.coste)) partes.push('Inscripción: ' + eur(c.coste) + ' (se paga en la web de la organización)');
    if (c.fecha_limite_interna) partes.push('El plazo del club cierra el ' + fechaHora(c.fecha_limite_interna));
    if (c.notas) partes.push(c.notas);
    if (c.circular_url) partes.push('Inscripción: ' + c.circular_url);
    return {
      uid: 'competicion-' + c.id,
      titulo: 'Apolana · ' + (c.nombre || 'Competición'),
      fecha: String(c.fecha_inicio || '').slice(0,10), hora: '',
      lugar: c.sede || '', descripcion: partes.join('\n')
    };
  }

  // Competición concreta pedida por la URL: .../competiciones/?id=<uuid>
  var PEDIDA = '';
  try { PEDIDA = (new URLSearchParams(window.location.search)).get('id') || ''; } catch(e) { PEDIDA = ''; }

  var MIGAS = '<a class="migas" href="../">← Volver al portal</a>';
  function pantalla(contenido) {
    return MIGAS + '<div class="cp-cab"><h1>Competiciones</h1></div><div class="tarjeta">' + contenido + '</div>';
  }

  if (!perfil) {
    wrap.innerHTML = pantalla(APOLANA_UI.vacio('Todavía no encontramos tu ficha en el club',
      'Has entrado bien, pero tu ficha aún no está enlazada con esta cuenta. Avisa al club y lo dejan listo enseguida.',
      APOLANA_UI.boton('Volver al portal', '../')));
    return;
  }

  // ---------- datos base ----------
  var ra = await sb.from('atletas').select('id,nombre,apellidos,categoria,especialidades').order('nombre');
  if (ra.error) {
    wrap.innerHTML = pantalla(APOLANA_UI.error('No hemos podido cargar tus competiciones',
      'Puede ser tu conexión. Las inscripciones siguen ahí; vuelve a intentarlo en un momento.'));
    return;
  }
  var MIS_ATLETAS = (ra.data || []);
  if (!MIS_ATLETAS.length) {
    wrap.innerHTML = pantalla(APOLANA_UI.vacio('Todavía no vemos tu ficha de atleta',
      'Tu cuenta aún no está enlazada con ninguna ficha de atleta, y las competiciones se apuntan por ficha. Avisa al club y lo dejan listo.',
      APOLANA_UI.boton('Volver al portal', '../')));
    return;
  }
  var atleta = MIS_ATLETAS[0];

  var CATALOGO = [], falloCatalogo = false;
  var pc = await sb.from('pruebas').select('nombre,disciplina,ambito').eq('activa', true).order('orden');
  if (pc.error) falloCatalogo = true; else CATALOGO = pc.data || [];

  var COMPS = [], INSCRIPCIONES = [];
  /* Cada lista sabe si se ha podido leer. Sin esto, un fallo de conexión se
     veía igual que un calendario vacío: «no hay competiciones» a alguien que
     tiene una el sábado. */
  var falloComps = false, falloInscr = false;

  /* Reintentar solo lo que ha fallado, sin recargar la página. */
  var REINTENTOS = {}, nRe = 0;
  function htmlError(titulo, texto, fn){
    var k = 'r' + (++nRe);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="' + k + '">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (fn) fn();
  });
  async function recargar(){ await cargarDatos(); pintar(); }

  async function cargarDatos(){
    var hoy = new Date(); hoy.setHours(0,0,0,0);
    var desde = new Date(hoy.getTime() - 7*24*3600*1000).toISOString().slice(0,10);
    var filtro = 'fecha_inicio.gte.' + desde + ',fecha_inicio.is.null';
    // Si vienen a una competición concreta desde el calendario, que salga aunque ya haya pasado.
    if (/^[0-9a-f-]{36}$/i.test(PEDIDA)) filtro += ',id.eq.' + PEDIDA;
    var c = await sb.from('competiciones')
      .select('id,nombre,sede,fecha_inicio,ambito,coste,circular_url,fecha_limite_interna,inscripcion_abierta,notas')
      .or(filtro)
      .order('fecha_inicio', { ascending: true });
    falloComps = !!c.error;
    COMPS = (c.error ? [] : (c.data || []));

    var i = await sb.from('competicion_atleta').select('id,competicion_id,prueba,estado').eq('atleta_id', atleta.id);
    falloInscr = !!i.error;
    INSCRIPCIONES = (i.error ? [] : (i.data || []));
  }

  // Desplegable de pruebas: primero las suyas, luego el catálogo del ámbito
  function opcionesPruebas(ambito){
    var lista = CATALOGO.filter(function(p){ return !ambito || p.ambito === ambito; });
    var mias = (atleta.especialidades || []).filter(function(n){
      return lista.some(function(p){ return p.nombre === n; });
    });
    var grupos = {}, orden = [];
    lista.forEach(function(p){
      var g = (p.disciplina || 'otras');
      if (!grupos[g]) { grupos[g] = []; orden.push(g); }
      grupos[g].push(p.nombre);
    });
    var top = mias.length ? '<optgroup label="★ Mis pruebas">' + mias.map(function(n){ return '<option>'+esc(n)+'</option>'; }).join('') + '</optgroup>' : '';
    return '<option value="">— elige tu prueba —</option>' + top +
      orden.map(function(g){
        return '<optgroup label="'+esc(g)+'">' + grupos[g].map(function(n){ return '<option>'+esc(n)+'</option>'; }).join('') + '</optgroup>';
      }).join('');
  }

  // ---------- pintar ----------
  function tarjetaComp(c){
    var mias = INSCRIPCIONES.filter(function(x){ return x.competicion_id === c.id && x.estado !== 'cancelada'; });
    var plazoOff = pasado(c.fecha_limite_interna);
    var abierta = !!c.inscripcion_abierta && !plazoOff;
    var coste = parseFloat(c.coste) || 0;

    var estadoPill = abierta
      ? '<span class="pill abierta">Inscripción abierta</span>'
      : (plazoOff ? '<span class="pill cerrado">Plazo cerrado</span>' : '<span class="pill">Aún no abierta</span>');

    var destacada = (PEDIDA && c.id === PEDIDA);
    var html = '<div class="tarjeta'+(destacada?' destacada':'')+'" id="comp-'+esc(c.id)+'">' +
      '<div class="comp-cab"><h2>'+esc(c.nombre)+'</h2>'+estadoPill+'</div>' +
      '<p class="comp-datos">' + esc(fechaLarga(c.fecha_inicio)) +
        (c.sede ? ' · ' + esc(c.sede) : '') + '</p>';

    if (c.notas) html += '<p class="comp-notas">'+esc(c.notas)+'</p>';

    // ---- Inscripción oficial: siempre fuera de la app ----
    html += '<div class="insc">';
    if (c.circular_url) {
      html += plazoOff
        ? '<span class="btn--apagado">Plazo cerrado</span>'
        : '<a class="btn btn--primario" href="'+esc(c.circular_url)+'" target="_blank" rel="noopener">Ir a la inscripción</a>';
      if (coste) {
        html += '<span class="letra-chica">Inscripción: <b>'+esc(eur(coste))+'</b> — se paga en la web de la organización.</span>';
      }
      if (c.fecha_limite_interna) {
        html += '<span class="letra-chica">' +
          (plazoOff ? 'El plazo del club cerró el ' + esc(fechaHora(c.fecha_limite_interna)) + '.'
                    : 'El plazo del club cierra el ' + esc(fechaHora(c.fecha_limite_interna)) + '.') + '</span>';
      } else if (plazoOff) {
        html += '<span class="letra-chica">El plazo del club ya está cerrado.</span>';
      }
    } else {
      html += '<p class="te-apunta">Te apunta el club: avisa a tu entrenador' +
        (c.fecha_limite_interna ? ' antes del ' + esc(fechaHora(c.fecha_limite_interna)) : ' cuanto antes') + '.</p>' +
        '<span class="letra-chica"><a href="../mensajes/">Escribir a tu entrenador</a></span>';
    }
    if (c.fecha_inicio) {
      html += '<div class="ics-fila"><button type="button" class="btn btn--neutro btn--mini" data-ics="'+esc(c.id)+'">Añadir a mi calendario</button></div>';
    }
    html += '</div>';

    // Mis pruebas en esta competición
    html += '<h3>Mis pruebas aquí</h3>';
    if (falloInscr) {
      /* Decir «no te has apuntado a nada» cuando no se ha podido mirar es lo
         que hace que alguien se apunte dos veces. */
      html += htmlError('No hemos podido comprobar tus pruebas',
        'Puede ser tu conexión. Si ya le habías dicho al club que vas, sigue apuntado: no vuelvas a hacerlo hasta verlo aquí.',
        recargar);
    } else if (!mias.length) {
      html += '<p class="letra-chica" style="margin:0 0 4px">Todavía no le has dicho al club a qué pruebas vas aquí.</p>';
    } else {
      html += '<ul class="mis-pruebas">' + mias.map(function(x){
        var quitar = (abierta && x.estado === 'apuntado')
          ? '<button class="btn--peligro" data-quitar="'+x.id+'">Quitarme</button>'
          : '<span class="pill">'+(x.estado === 'confirmada' ? 'ya en la federación' : 'bloqueada')+'</span>';
        return '<li><span>'+esc(x.prueba)+' ' +
          (x.estado === 'confirmada' ? '<span class="pill ok">El club te cuenta</span>' : '<span class="pill aviso">Avisado</span>') +
          '</span>' + quitar + '</li>';
      }).join('') + '</ul>';
    }

    // Decirle al club que voy (control interno: no es la inscripción oficial)
    if (abierta && falloCatalogo) {
      /* Sin catálogo de pruebas el desplegable saldría vacío y el botón no
         haría nada: mejor decir que no se ha podido cargar y dar una salida. */
      html += '<h3>Decirle al club que voy</h3>' +
        htmlError('No hemos podido cargar la lista de pruebas',
          'Puede ser tu conexión. La inscripción sigue abierta: vuelve a intentarlo, o díselo a tu entrenador por mensaje.',
          recargar);
    } else if (abierta) {
      html += '<h3>Decirle al club que voy</h3>' +
        '<p class="letra-chica" style="margin-top:0;">Así el club sabe con quién cuenta y en qué pruebas. ' +
          (c.circular_url ? 'La inscripción oficial se hace en el enlace de arriba.' : 'De la inscripción oficial se encarga el club.') + '</p>' +
        '<div class="apuntarme">' +
          '<div><label for="sel-'+c.id+'">Prueba</label><select id="sel-'+c.id+'">'+opcionesPruebas(c.ambito)+'</select></div>' +
          '<div><button class="btn btn--fantasma btn--mini" data-apuntar="'+c.id+'">Decir que voy</button></div>' +
        '</div>' +
        '<span class="msg" id="msg-'+c.id+'"></span>';
    } else if (plazoOff) {
      /* Que el plazo está cerrado ya lo dicen la pastilla de arriba y la línea
         de la fecha: aquí solo hace falta decir qué se puede hacer ahora. */
      html += '<div class="bloqueado">Si necesitas entrar o salir de esta competición, habla directamente con tu entrenador.</div>';
    } else {
      html += '<div class="bloqueado">El club todavía no ha abierto esta competición. Cuando la abra, podrás decir aquí a qué pruebas vas.</div>';
    }

    return html + '</div>';
  }

  function pintar(){
    var nombre = ((atleta.nombre||'')+' '+(atleta.apellidos||'')).trim();
    var selector = '';
    if (MIS_ATLETAS.length > 1) {
      selector = '<div class="tarjeta"><label for="sel-atleta">¿De quién quieres ver las competiciones?</label>' +
        '<select id="sel-atleta" class="sel-atleta">' + MIS_ATLETAS.map(function(a){
          return '<option value="'+a.id+'"'+(a.id===atleta.id?' selected':'')+'>'+esc(((a.nombre||'')+' '+(a.apellidos||'')).trim())+'</option>';
        }).join('') + '</select></div>';
    }

    var cab = MIGAS + '<div class="cp-cab"><h1>Competiciones</h1>' +
      '<span class="sub">'+esc(nombre)+(atleta.categoria?' · '+esc(atleta.categoria):'')+'</span></div>';

    // Si llegan con ?id=..., esa competición va la primera
    var lista = COMPS.slice();
    if (PEDIDA) {
      lista.sort(function(a,b){ return (b.id === PEDIDA ? 1 : 0) - (a.id === PEDIDA ? 1 : 0); });
    }
    var comps;
    if (lista.length) {
      comps = lista.map(tarjetaComp).join('');
    } else if (falloComps) {
      comps = '<div class="tarjeta">' + htmlError('No hemos podido cargar las competiciones',
        'Puede ser tu conexión. No es que no haya ninguna: es que no hemos podido preguntarlo. ' +
        'Si tienes una cerca, mira el calendario del club o pregunta a tu entrenador.',
        recargar) + '</div>';
    } else {
      comps = '<div class="tarjeta">' + APOLANA_UI.vacio('Todavía no hay competiciones publicadas',
        'Cuando el club abra la próxima, aparecerá aquí con su fecha, el plazo del club y el enlace para inscribirte.',
        APOLANA_UI.boton('Ver el calendario del club', '../calendario/')) + '</div>';
    }

    wrap.innerHTML = cab + selector + comps;

    // Deep link: abrir la competición concreta que venía en la URL
    if (PEDIDA) {
      var diana = document.getElementById('comp-' + PEDIDA);
      if (diana) {
        try { diana.scrollIntoView({ behavior:'smooth', block:'start' }); } catch(e) { diana.scrollIntoView(); }
      }
    }

    if (MIS_ATLETAS.length > 1) {
      $('sel-atleta').addEventListener('change', async function(){
        var id = this.value;
        atleta = MIS_ATLETAS.filter(function(a){ return a.id === id; })[0] || atleta;
        wrap.innerHTML = MIGAS + '<div class="cp-cab"><h1>Competiciones</h1></div>' +
          '<div class="tarjeta">' + APOLANA_UI.cargando('tarjeta') + '</div>';
        await cargarDatos(); pintar();
      });
    }
  }

  // ---------- acciones ----------
  wrap.addEventListener('click', async function(e){
    var apuntar = e.target.getAttribute && e.target.getAttribute('data-apuntar');
    var quitar = e.target.getAttribute && e.target.getAttribute('data-quitar');
    var ics = e.target.getAttribute && e.target.getAttribute('data-ics');

    if (ics) {
      var comp = COMPS.filter(function(x){ return x.id === ics; })[0];
      if (comp) icsDescargar(icsDeCompeticion(comp));
      return;
    }

    if (apuntar) {
      var sel = $('sel-' + apuntar), msg = $('msg-' + apuntar);
      var prueba = sel ? sel.value.trim() : '';
      if (!prueba) { msg.textContent = 'Elige primero la prueba.'; msg.className = 'msg error'; return; }
      msg.textContent = 'Avisando al club…'; msg.className = 'msg';
      var r = await sb.from('competicion_atleta').insert({
        competicion_id: apuntar, atleta_id: atleta.id, prueba: prueba, estado: 'apuntado'
      });
      if (r.error) {
        var yaEsta = (r.error.code === '23505');
        msg.textContent = yaEsta
          ? 'El club ya sabe que vas a esa prueba.'
          : 'No hemos podido avisar al club. Puede que el plazo se haya cerrado, o ser tu conexión: inténtalo otra vez.';
        msg.className = 'msg ' + (yaEsta ? 'error' : 'fallo');
        return;
      }
      await cargarDatos(); pintar();
      return;
    }

    if (quitar) {
      if (!await APX.confirm('¿Decirle al club que ya no vas a esta prueba?', { aceptar:'Quitarme', peligro:true })) return;
      var d = await sb.from('competicion_atleta').delete().eq('id', quitar);
      if (d.error) { APX.toast('No hemos podido quitarte de esa prueba', 'error', { detalle:'Puede ser tu conexión: inténtalo otra vez.' }); return; }
      await cargarDatos(); pintar();
    }
  });

  await cargarDatos();
  pintar();
});
</script>

</body>
</html>
