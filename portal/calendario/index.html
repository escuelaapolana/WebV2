<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema); }

  .cal-wrap { max-width: 1200px; margin: 0 auto; padding: clamp(14px,3vw,28px) clamp(14px,4vw,40px) 48px; }
  .volver { display:inline-block; margin-bottom:10px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:15px; min-height:44px; line-height:44px; }

  /* ---- cabecera: periodo + navegación ---- */
  .cal-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .cal-cab .rotulo { font-size:13px; color: var(--texto-tenue); display:block; }
  .cal-cab h1 { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase;
                font-size: clamp(32px,6.5vw,58px); line-height:.94; color: var(--navy); margin:4px 0 0; }
  .mes-nav { display:flex; align-items:center; gap:8px; }
  .mes-nav button { background:#fff; border:1px solid var(--linea-borde); color: var(--navy); border-radius:999px;
                    min-height:44px; padding:10px 16px; font-family:inherit; font-size:15px; line-height:1; cursor:pointer; }
  .mes-nav button:hover { border-color: var(--azul); }

  /* ---- barra: vista (mes/semana/día) + filtrar ---- */
  .cal-barra { margin-top:18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .seg { display:inline-flex; background:#fff; border:1px solid var(--linea-borde); border-radius:999px; padding:4px; gap:2px; }
  .seg button { border:0; background:transparent; border-radius:999px; min-height:40px; padding:9px 20px;
                font-family:inherit; font-size:15px; color: var(--texto); cursor:pointer; line-height:1; }
  .seg button[aria-pressed="true"] { background: var(--azul-oscuro); color:#fff; font-weight:600; }

  .btn-filtrar { display:inline-flex; align-items:center; gap:9px; min-height:44px; padding:10px 18px;
                 border-radius:999px; background:#fff; border:1px solid var(--linea-borde); color: var(--navy);
                 font-family:inherit; font-size:15px; line-height:1; cursor:pointer; }
  .btn-filtrar:hover { border-color: var(--azul); }
  .btn-filtrar .cuenta { display:none; background: var(--azul); color:#fff; border-radius:999px; min-width:21px;
                         padding:2px 7px; font-size:12px; font-weight:700; text-align:center; }
  .btn-filtrar.con-filtros { border-color: var(--azul); }
  .btn-filtrar.con-filtros .cuenta { display:inline-block; }

  /* ---- rejilla + columna lateral ---- */
  .cal-cuerpo { margin-top:18px; display:grid; grid-template-columns: 1.6fr 1fr; gap:22px; align-items:start; }
  .cal-cuerpo > * { min-width:0; }
  @media (max-width: 900px) { .cal-cuerpo { grid-template-columns: 1fr; } }

  .rejilla { background:#fff; border:1px solid var(--crema-media); border-radius:18px; padding: clamp(12px,2vw,22px);
             box-shadow: var(--sombra-suave); max-width:100%; overflow:hidden; }

  .filtro-aviso { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
                  background: var(--azul-suave); border-radius:12px; padding:10px 14px; margin-bottom:14px;
                  font-size:14px; color: var(--azul-oscuro); }
  .filtro-aviso button { min-height:40px; padding:9px 15px; border-radius:999px; background:#fff;
                         border:1px solid var(--azul); color: var(--azul-oscuro); font-family:inherit; font-size:14px; cursor:pointer; }

  /* ---- vista MES ---- */
  .semana-cab, .dias { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap:6px; }
  .semana-cab { font-size:11px; color: var(--texto-tenue); text-align:center; padding-bottom:10px; }
  .dia { min-height:92px; border-radius:10px; background: var(--crema); border:1px solid var(--crema-banda);
         padding:8px; display:flex; flex-direction:column; gap:4px; text-align:left; font-family:inherit;
         cursor:pointer; overflow:hidden; min-width:0; }
  .dia:hover { border-color: var(--azul); }
  .dia .num { font-size:12px; color: var(--texto-suave); }
  .dia .et { font-size:11px; color:#6B6558; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dia .mas { font-size:11px; color: var(--texto-tenue); }
  .dia.fuera { cursor:default; background:transparent; border-color:transparent; }
  .dia.fuera .num { color:#C0B8A6; }
  .dia.comp { background:#EDF7E4; border-color:#C3E39B; }
  .dia.comp .num { color:#5B8B33; }
  .dia.hoy { background: var(--azul-suave); border-color: var(--azul); }
  .dia.hoy .num { font-weight:700; color: var(--azul-oscuro); }
  .dia .puntos { display:flex; gap:3px; flex-wrap:wrap; margin-top:auto; }
  .dia .puntos i { width:7px; height:7px; border-radius:4px; display:block; }
  .p-entreno { background: var(--azul); } .p-cubo { background:#8A6BB8; }
  .p-competicion { background:#7FBF4A; } .p-cierre { background:#E8B84B; } .p-evento { background:#A79F8E; }

  /* ---- vistas SEMANA y DÍA (con horas) ---- */
  .sem { display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width: 901px) { .sem--semana { grid-template-columns:1fr 1fr; gap:14px 22px; align-items:start; } }
  .col-dia { min-width:0; display:flex; flex-direction:column; gap:8px; }
  .col-dia > h3 { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase; font-size:17px;
                  color: var(--navy); padding-bottom:6px; border-bottom:1px solid var(--crema-banda);
                  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .col-dia > h3 .hoy-eti { font-family: var(--fuente-texto); font-weight:400; text-transform:none; font-size:13px; color: var(--texto-tenue); }
  .col-dia.es-hoy > h3 { color: var(--azul-oscuro); border-bottom-color: var(--azul); }
  .col-dia .nada { font-size:13px; color: var(--texto-tenue); margin:0; padding:2px 0 4px; }

  .linea { display:flex; gap:12px; align-items:center; width:100%; text-align:left;
           background: var(--crema); border:1px solid var(--crema-banda); border-left-width:4px;
           border-radius:12px; padding:11px 13px; min-height:46px; font-family:inherit; cursor:pointer; }
  .linea:hover { background:#fff; border-color: var(--azul); }
  .linea .hh { font-size:14px; font-weight:600; color: var(--azul-oscuro); flex:0 0 46px; }
  .linea .et { font-size:15px; color: var(--navy); line-height:1.3; min-width:0; overflow-wrap:break-word; }
  .linea .marca { margin-left:auto; flex-shrink:0; }
  .linea.k-entreno { border-left-color: var(--azul); }
  .linea.k-cubo { border-left-color:#8A6BB8; }
  .linea.k-competicion { border-left-color:#7FBF4A; }
  .linea.k-cierre { border-left-color:#E8B84B; }
  .linea.k-evento { border-left-color:#A79F8E; }
  .linea.mia { background: var(--azul-suave); border-color: var(--azul); }

  .pill { font-size:12px; padding:3px 10px; border-radius:999px; background: var(--crema-media);
          color: var(--texto-suave); white-space:nowrap; display:inline-block; }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }
  .pill.mia { background:#fff; color: var(--azul-oscuro); border:1px solid var(--azul); }
  .pill.no { background:#fbeceb; color:#b3261e; }
  .pill.espera { background: var(--aviso-fondo); color: var(--aviso-titulo); }

  /* ---- columna lateral ---- */
  .lateral { display:flex; flex-direction:column; gap:14px; }

  .bonos { background: var(--navy); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .bonos .eti { font-size:12px; color: rgba(255,255,255,.72); }
  .bonos .par { display:flex; gap:18px; flex-wrap:wrap; }
  .bonos .cel { flex:1; min-width:120px; display:flex; flex-direction:column; gap:2px; }
  .bonos .cifra { font-family: var(--fuente-titulo); font-weight:700; font-size:40px; color:#fff; line-height:1; }
  .bonos .cifra.mal { color:#F2B8B5; }
  .bonos .txt { font-size:13px; color: rgba(255,255,255,.78); line-height:1.35; }
  .bonos select { width:100%; min-height:44px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.35);
                  background: rgba(255,255,255,.1); color:#fff; font-family:inherit; font-size:15px; }
  .bonos select option { color: var(--navy); }
  .bonos a { color:#cfe2f2; font-size:14px; text-decoration:underline; }

  .proxima { background: var(--crema-banda); border:1px solid var(--linea-borde); border-radius:16px;
             padding:18px 20px; display:flex; flex-direction:column; gap:8px; }
  .proxima .eti { font-size:12px; color: var(--aviso-titulo); }
  .proxima h3 { font-family: var(--fuente-titulo); font-weight:700; font-size:26px; text-transform:uppercase; color: var(--navy); line-height:1; overflow-wrap:anywhere; }
  .proxima .datos { font-size:14px; color:#6B6558; }
  .proxima .btn { margin-top:4px; width:100%; text-align:center; }

  .leyenda { display:flex; flex-wrap:wrap; gap:12px 16px; font-size:12px; color: var(--texto-suave); padding:0 4px; }
  .leyenda span { display:flex; align-items:center; gap:6px; }
  .leyenda i { width:9px; height:9px; border-radius:5px; display:block; }

  .pie-cal { margin-top:26px; background:#fff; border:1px solid var(--crema-media); border-radius:16px;
             padding:20px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .pie-cal p { font-size:15px; color: var(--texto); margin:0; }
  .pie-cal .enlaces { display:flex; gap:10px; flex-wrap:wrap; }

  .vacio { color: var(--texto-suave); font-size:14px; margin:0; }

  /* ===========================================================
     VENTANA EMERGENTE (patrón del proyecto)
     =========================================================== */
  .modal { position:fixed; inset:0; z-index:9500; background:rgba(46,66,86,.45);
           display:flex; align-items:flex-start; justify-content:center;
           padding:clamp(16px,5vh,60px) 16px; overflow:auto;
           -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  .modal[hidden] { display:none; }
  .modal-caja { background:#fff; border:1px solid var(--linea); border-radius:18px;
                box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:24px;
                width:min(520px,100%); animation:modal-sube .2s ease; }
  @keyframes modal-sube { from { transform:translateY(12px); opacity:.6; } to { transform:none; opacity:1; } }
  .modal-cab { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .modal-cab h2 { font-family: var(--fuente-titulo); font-weight:700; font-size:30px; line-height:1.02;
                  text-transform:uppercase; color: var(--navy); overflow-wrap:anywhere; }
  .modal-cerrar { flex-shrink:0; width:44px; height:44px; margin:-8px -8px 0 0; border-radius:50%;
                  border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave);
                  font-family:inherit; font-size:20px; line-height:1; cursor:pointer; }
  .modal-cerrar:hover { border-color: var(--azul); color: var(--navy); }
  .modal-eti { display:inline-block; align-self:flex-start; margin-bottom:6px; font-size:12px;
               color: var(--azul-oscuro); background: var(--azul-suave); border-radius:999px; padding:4px 11px; }
  .modal-eti.verde { background:#EDF7E4; color:#4C7A28; }
  .modal-eti.morada { background:#F1ECF8; color:#6B4F94; }
  .modal-eti.ambar { background: var(--aviso-fondo); color: var(--aviso-titulo); }
  .modal-eti.gris { background: var(--crema-media); color: var(--texto-suave); }

  .modal-datos { margin-top:16px; display:flex; flex-direction:column; }
  .modal-datos .fila { display:flex; gap:14px; padding:10px 0; border-bottom:1px solid var(--crema-banda); }
  .modal-datos .fila:last-child { border-bottom:0; }
  .modal-datos .cual { flex:0 0 92px; font-size:13px; color: var(--texto-tenue); }
  .modal-datos .valor { font-size:15px; color: var(--navy); min-width:0; overflow-wrap:anywhere; }

  .modal-pie { margin-top:18px; padding-top:16px; border-top:1px solid var(--crema-banda); }
  .modal-pie p { margin:0 0 12px; font-size:15px; color: var(--texto); }
  .modal-pie p.error { color:#b3261e; }
  .modal-pie p.ok { color:#1e7a3d; }
  .modal-pie .botones { display:flex; gap:10px; flex-wrap:wrap; }
  .modal-pie .btn { flex:1 1 auto; text-align:center; cursor:pointer; font-family:inherit; }
  .modal-pie .btn[disabled] { opacity:.6; cursor:default; }

  .filtro-bloque + .filtro-bloque { margin-top:18px; }
  .filtro-bloque > h3 { font-size:13px; color: var(--texto-tenue); margin-bottom:10px; font-weight:400; }
  .filtro-ops { display:flex; flex-wrap:wrap; gap:8px; }
  .filtro-ops button { min-height:44px; padding:10px 16px; border-radius:999px; background:#fff;
                       border:1px solid var(--linea-borde); color: var(--texto); font-family:inherit;
                       font-size:15px; line-height:1; cursor:pointer; }
  .filtro-ops button:hover { border-color: var(--azul); }
  .filtro-ops button[aria-pressed="true"] { background: var(--azul-oscuro); border-color: var(--azul-oscuro); color:#fff; font-weight:600; }

  @media (max-width: 620px) {
    .seg { flex:1 1 auto; }
    .seg button { flex:1 1 0; padding:9px 8px; font-size:14px; }
    .btn-filtrar { flex:0 0 auto; padding:10px 15px; }
    .semana-cab, .dias { gap:4px; }
    .dia { min-height:62px; padding:5px; border-radius:8px; gap:3px; }
    .dia .et, .dia .mas { display:none; }
    .modal-caja { padding:20px 18px; }
    .modal-cab h2 { font-size:26px; }
    .modal-datos .cual { flex:0 0 80px; }
    .modal-pie .btn { flex:1 1 100%; }
    .pie-cal .btn { width:100%; text-align:center; }
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="cal-wrap" id="cal-wrap"><p class="vacio">Cargando el calendario…</p></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cal-wrap');
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  /* La sección "competicion" es el grupo de pista: se llama "Pista" para que
     no se confunda con el filtro de Competiciones (antes salían los dos). */
  var SEC_NOMBRE = { escuela:'Escuela', competicion:'Pista', running:'Running', natacion:'Natación',
                     triatlon:'Triatlón', montana:'Montaña', pista:'Pista', marcha:'Marcha',
                     cubo:'El Cubo', 'escuela-natacion':'Escuela de natación',
                     'escuela-municipal':'Escuela municipal', 'deporte-adaptado':'Deporte adaptado' };
  var COLOR_ETIQUETA = { entreno:'', cubo:'morada', competicion:'verde', evento:'gris', cierre:'ambar' };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fecha(s) { var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }
  function euros(n) { var v = parseFloat(n); return (isNaN(v) ? 0 : v).toFixed(2).replace('.', ',') + ' €'; }
  function seccionNombre(s) { if (!s) return ''; return SEC_NOMBRE[s] || (s.charAt(0).toUpperCase() + s.slice(1)); }
  function mayus(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function fechaLarga(s) { var d = fecha(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function lunesDe(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }

  var HOY = new Date(); HOY.setHours(0, 0, 0, 0);
  var HOY_ISO = iso(HOY);

  // ---------- estado de la pantalla ----------
  var ancla = new Date(HOY.getFullYear(), HOY.getMonth(), HOY.getDate());
  var vista = 'mes';                    // 'mes' | 'semana' | 'dia'
  try { var g = localStorage.getItem('apolana-cal-vista'); if (g === 'mes' || g === 'semana' || g === 'dia') vista = g; } catch (e) { /* modo privado */ }

  var fTipos = {}, fSecs = {}, ambito = 'todo';   // filtros
  var atletas = [], atleta = null;
  var GRUPOS = {}, SECCIONES = [];
  var ACTIVIDADES = [], PROXIMA = null;
  var USOS_CUBO = 0, HAY_CUBO = false, SALDO_COMP = 0;
  var ventanaCargada = '';
  var modalClave = null, modalAviso = '';
  var ultimoFoco = null;

  // ---------- periodo visible y ventana de carga ----------
  function periodo() {
    if (vista === 'mes') {
      return { ini: new Date(ancla.getFullYear(), ancla.getMonth(), 1),
               fin: new Date(ancla.getFullYear(), ancla.getMonth() + 1, 0) };
    }
    if (vista === 'semana') {
      var l = lunesDe(ancla);
      return { ini: l, fin: new Date(l.getFullYear(), l.getMonth(), l.getDate() + 6) };
    }
    return { ini: new Date(ancla), fin: new Date(ancla) };
  }
  /* Se cargan meses enteros: así una semana a caballo entre dos meses sale completa. */
  function ventana() {
    var p = periodo();
    return { desde: iso(new Date(p.ini.getFullYear(), p.ini.getMonth(), 1)),
             hasta: iso(new Date(p.fin.getFullYear(), p.fin.getMonth() + 1, 0)) };
  }
  function claveVentana() { var v = ventana(); return v.desde + '|' + v.hasta; }

  // ============================================================
  //  CARGA DE DATOS · un solo calendario, cinco fuentes
  // ============================================================
  async function cargar() {
    var v = ventana(), desde = v.desde, hasta = v.hasta;
    ventanaCargada = claveVentana();
    var acts = [];

    // --- grupos (lectura pública): nombres y secciones para los filtros ---
    try {
      var rg = await sb.from('grupos').select('id,nombre,seccion');
      if (!rg.error && rg.data) {
        GRUPOS = {}; var secs = {};
        rg.data.forEach(function (g) { GRUPOS[g.id] = g; if (g.seccion && g.seccion !== 'cubo') secs[g.seccion] = true; });
        SECCIONES = Object.keys(secs).sort(function (a, b) {
          return seccionNombre(a).localeCompare(seccionNombre(b), 'es');
        });
      }
    } catch (e) { /* sin grupos, el calendario sigue funcionando */ }

    // --- 1) MIS entrenamientos (tabla `sesiones`, con su permiso de siempre) ---
    var mias = {};
    try {
      var rm = await sb.from('sesiones')
        .select('id,fecha,hora,titulo,tipo,rol,lugar,grupo_id,atletas_ids')
        .eq('publicada', true).gte('fecha', desde).lte('fecha', hasta);
      if (!rm.error && rm.data) {
        rm.data.forEach(function (s) {
          var deMiGrupo = atleta && s.grupo_id && s.grupo_id === atleta.grupo_id;
          var paraMi = atleta && s.atletas_ids && s.atletas_ids.indexOf(atleta.id) >= 0;
          if (deMiGrupo || paraMi) mias[s.id] = s;
        });
      }
    } catch (e) { /* nada */ }

    // --- 2) LO QUE HACE TODO EL CLUB (vista `sesiones_agenda`) ---
    var vistas = {};
    try {
      var ra = await sb.from('sesiones_agenda').select('*').gte('fecha', desde).lte('fecha', hasta);
      if (!ra.error && ra.data) ra.data.forEach(function (s) { vistas[s.sesion_id] = s; });
    } catch (e) { /* si la vista aún no está, se ven solo las propias */ }

    // Mis apuntados a entrenamientos abiertos
    var misEntrenos = {};
    if (atleta) {
      try {
        var ri = await sb.from('sesion_inscripciones').select('sesion_id').eq('atleta_id', atleta.id);
        if (!ri.error && ri.data) ri.data.forEach(function (x) { misEntrenos[x.sesion_id] = true; });
      } catch (e) { /* nada */ }
    }

    var miSeccion = (atleta && atleta.grupo_id && GRUPOS[atleta.grupo_id]) ? GRUPOS[atleta.grupo_id].seccion : null;

    // Unimos las dos lecturas de entrenamientos por id
    var ids = {};
    Object.keys(vistas).forEach(function (k) { ids[k] = true; });
    Object.keys(mias).forEach(function (k) { ids[k] = true; });

    Object.keys(ids).forEach(function (id) {
      var v2 = vistas[id] || {}, m = mias[id] || {};
      if ((v2.tipo || m.tipo) === 'descanso') return;          // día de descanso, no es una actividad
      var grupo = GRUPOS[v2.grupo_id || m.grupo_id] || null;
      var mio = !!mias[id];
      var abierta = !!v2.abierta_inscripcion;
      var apuntado = !!misEntrenos[id];
      var f = v2.fecha || m.fecha;

      var seccionOk = !v2.abierta_a || v2.abierta_a.indexOf(miSeccion) >= 0;
      var completa = (v2.plazas != null && v2.libres != null && v2.libres <= 0);

      var estado, clase, accion = null, nota = '';
      if (apuntado) {

      } else if (!seccionOk) {

        estado = 'Completa'; clase = 'no';

      acts.push({

    // --- 3) EL CUBO (si ya existe; si no, el calendario no se rompe) ---
    HAY_CUBO = false;

    // --- 4) COMPETICIONES (se apunta en /portal/competiciones/) ---
    var misComps = {};
    if (atleta) {
      try {

        if (!rca.error && rca.data) rca.data.forEach(function (x) {
          if (x.estado !== 'cancelada') (misComps[x.competicion_id] = misComps[x.competicion_id] || []).push(x.prueba);
        });
      } catch (e) { /* nada */ }
    }

    PROXIMA = null;
    try {
      var rcp = await sb.from('competiciones')

      if (!rcp.error && rcp.data) {

          if (!PROXIMA && c.fecha_inicio && c.fecha_inicio >= HOY_ISO) {

          }

          // La competición, el día que se corre
          if (c.fecha_inicio && c.fecha_inicio >= desde && c.fecha_inicio <= hasta) {
            var estado, clase, accion = null, nota = '';
            if (apuntado) { estado = 'Ya apuntado'; clase = 'ok'; nota = 'Tus pruebas: ' + misComps[c.id].filter(Boolean).join(', ') + '.'; }
            else if (abierta) {
              estado = 'Abierta'; clase = 'ok';
              accion = { tipo: 'enlace', href: '../competiciones/', texto: coste ? 'Inscribirme · ' + euros(coste) : 'Inscribirme', estilo: 'primario' };
              nota = 'Eliges tu prueba en la página de competiciones.';
            } else if (plazoPasado) { estado = 'Cerrada'; clase = 'no'; nota = 'El plazo para apuntarse ya pasó.'; }
            else { estado = 'Cerrada'; clase = ''; nota = 'La inscripción todavía no está abierta.'; }

            acts.push({
              fuente: 'competicion', id: c.id, fecha: c.fecha_inicio, hora: '',
              titulo: c.nombre, tipoTexto: 'Competición',
              grupo: '', lugar: c.sede || '', seccion: null,
              coste: coste, limite: c.fecha_limite_interna ? String(c.fecha_limite_interna).slice(0, 10) : null,
              mio: apuntado, puedo: !!accion,
              estado: estado, pillClase: clase, nota: nota, accion: accion,
              contacto: { href: '../competiciones/', texto: 'Ver las competiciones' }
            });
          }

          // El día en que se cierra la inscripción
          if (c.fecha_limite_interna) {
            var fl = String(c.fecha_limite_interna).slice(0, 10);
            if (fl >= desde && fl <= hasta) {
              acts.push({
                fuente: 'cierre', id: c.id + '-cierre', fecha: fl,
                hora: hhmm(String(c.fecha_limite_interna).slice(11, 16)),
                titulo: 'Cierra la inscripción · ' + c.nombre,
                tipoTexto: 'Último día para apuntarse',
                grupo: '', lugar: c.sede || '', seccion: null,
                mio: apuntado, puedo: abierta && !apuntado,
                estado: plazoPasado ? 'Cerrada' : (apuntado ? 'Ya apuntado' : 'Abierta'),
                pillClase: plazoPasado ? 'no' : (apuntado ? 'ok' : 'espera'),
                nota: 'La competición es el ' + fechaLarga(c.fecha_inicio) + '.',
                accion: (abierta && !apuntado)
                  ? { tipo: 'enlace', href: '../competiciones/', texto: 'Apuntarme antes de que cierre', estilo: 'primario' }
                  : null,
                contacto: { href: '../competiciones/', texto: 'Ver las competiciones' }
              });
            }
          }
        });
      }
    } catch (e) { /* nada */ }

    // --- 5) EVENTOS DEL CLUB ---
    var misEventos = {};
    if (atleta) {
      try {
        var rie = await sb.from('inscripciones_eventos').select('evento_id,estado').eq('atleta_id', atleta.id);
        if (!rie.error && rie.data) rie.data.forEach(function (x) { if (x.estado !== 'baja') misEventos[x.evento_id] = true; });
      } catch (e) { /* nada */ }
    }
    try {
      var re = await sb.from('eventos').select('id,titulo,descripcion,tipo,fecha_inicio,lugar,seccion,inscripcion_abierta')
        .gte('fecha_inicio', desde + 'T00:00:00').lte('fecha_inicio', hasta + 'T23:59:59');
      if (!re.error && re.data) {
        re.data.forEach(function (v3) {
          var f = String(v3.fecha_inicio).slice(0, 10);
          var h = String(v3.fecha_inicio).slice(11, 16);
          var apuntado = !!misEventos[v3.id];
          acts.push({
            fuente: v3.tipo === 'competicion' ? 'competicion' : 'evento', id: v3.id, fecha: f,
            hora: (h === '00:00' ? '' : h),
            titulo: v3.titulo, tipoTexto: v3.tipo === 'competicion' ? 'Competición' : 'Evento del club',
            grupo: (v3.seccion || []).map(seccionNombre).filter(Boolean).join(', '),
            lugar: v3.lugar || '',
            seccion: (v3.seccion && v3.seccion.length === 1) ? v3.seccion[0] : null,
            descripcion: v3.descripcion || '',
            mio: apuntado, puedo: false,
            estado: apuntado ? 'Ya apuntado' : (v3.inscripcion_abierta ? 'Abierta' : 'Cerrada'),
            pillClase: apuntado ? 'ok' : (v3.inscripcion_abierta ? 'ok' : ''),
            nota: (!apuntado && v3.inscripcion_abierta) ? 'Avisa al club o a tu entrenador para entrar.' : '',
            accion: null,
            contacto: { href: '../mensajes/', texto: 'Escribir al club' }
          });
        });
      }
    } catch (e) { /* nada */ }

    ACTIVIDADES = acts;
    ACTIVIDADES.forEach(function (a, i) { a.i = i; a.clave = a.fuente + '|' + a.id + '|' + a.fecha; });

    // --- bonos ---
    USOS_CUBO = 0; SALDO_COMP = 0;
    if (atleta) {
      try {
        var rb = await sb.from('cubo_bono_saldo').select('activo,caducado,usos_disponibles').eq('atleta_id', atleta.id);
        if (!rb.error && rb.data) rb.data.forEach(function (b) {
          if (b.activo && !b.caducado) USOS_CUBO += (b.usos_disponibles || 0);
        });
      } catch (e) { /* nada */ }
      try {
        var rs = await sb.from('bono_saldo').select('saldo').eq('atleta_id', atleta.id).maybeSingle();
        if (!rs.error && rs.data) SALDO_COMP = parseFloat(rs.data.saldo) || 0;
      } catch (e) { /* nada */ }
    }
  }

  // ============================================================
  //  FILTROS
  // ============================================================
  function algunoDe(o) { var l = []; for (var k in o) if (o[k]) l.push(k); return l; }
  function numFiltros() { return algunoDe(fTipos).length + algunoDe(fSecs).length + (ambito === 'todo' ? 0 : 1); }

  function pasaFiltro(a) {
    var t = algunoDe(fTipos);
    if (t.length) {
      var f = a.fuente === 'cierre' ? 'competicion' : a.fuente;
      if (t.indexOf(f) < 0) return false;
    }
    var s = algunoDe(fSecs);
    if (s.length && (!a.seccion || s.indexOf(a.seccion) < 0)) return false;
    if (ambito === 'mio' && !a.mio) return false;
    if (ambito === 'abierto' && !a.puedo) return false;
    return true;
  }

  /* Una misma cita puede llegar por dos vías (la tabla de competiciones y la
     de eventos del club). Se agrupan por día y título y se queda la más útil. */
  function claveTitulo(t) {
    return String(t || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .split('·')[0].replace(/\s+/g, ' ').trim();
  }
  function sinRepetidos(lista) {
    var vistos = {}, salida = [];
    lista.forEach(function (a) {
      var k = a.fuente + '|' + claveTitulo(a.titulo);
      var ya = vistos[k];
      if (ya === undefined) { vistos[k] = salida.length; salida.push(a); return; }
      var previo = salida[ya];
      var mejor = (!!a.accion && !previo.accion) ||
                  (!!a.accion === !!previo.accion && (a.lugar || '').length > (previo.lugar || '').length);
      if (mejor) salida[ya] = a;
    });
    return salida;
  }

  function porDia() {
    var m = {};
    ACTIVIDADES.filter(pasaFiltro).forEach(function (a) { (m[a.fecha] = m[a.fecha] || []).push(a); });
    Object.keys(m).forEach(function (k) {
      m[k] = sinRepetidos(m[k]);
      m[k].sort(function (x, y) {
        if (!x.hora && y.hora) return 1;
        if (x.hora && !y.hora) return -1;
        return x.hora < y.hora ? -1 : (x.hora > y.hora ? 1 : 0);
      });
    });
    return m;
  }

  // ============================================================
  //  ETIQUETAS · en la rejilla solo lo básico
  // ============================================================
  function etiquetaCorta(a) {
    if (a.fuente === 'cubo') return 'El Cubo';
    if (a.fuente === 'competicion') return 'Competición';
    if (a.fuente === 'cierre') return 'Cierra la inscripción';
    if (a.fuente === 'evento') return 'Evento del club';
    var quien = a.grupo || seccionNombre(a.seccion);
    return quien ? 'Entrenamiento · ' + quien : 'Entrenamiento';
  }
  function etiquetaMini(a) {
    if (a.fuente === 'cubo') return 'El Cubo';
    if (a.fuente === 'competicion') return 'Competición';
    if (a.fuente === 'cierre') return 'Cierra inscripción';
    if (a.fuente === 'evento') return 'Evento del club';
    return a.grupo || seccionNombre(a.seccion) || 'Entrenamiento';
  }

  // ============================================================
  //  PINTAR
  // ============================================================
  function rotulo() {
    if (vista === 'mes') return mayus(MESES[ancla.getMonth()]) + ' ' + ancla.getFullYear();
    if (vista === 'dia') return mayus(DIAS[ancla.getDay()]) + ' ' + ancla.getDate() + ' de ' + MESES[ancla.getMonth()];
    var p = periodo();
    if (p.ini.getMonth() === p.fin.getMonth()) return p.ini.getDate() + '–' + p.fin.getDate() + ' de ' + MESES[p.fin.getMonth()];
    return p.ini.getDate() + ' ' + MESES_CORTO[p.ini.getMonth()] + ' – ' + p.fin.getDate() + ' ' + MESES_CORTO[p.fin.getMonth()];
  }

  function pintarMes(mapa) {
    var y = ancla.getFullYear(), m = ancla.getMonth();
    var pd = new Date(y, m, 1), ud = new Date(y, m + 1, 0);
    var hueco = (pd.getDay() + 6) % 7;
    var celdas = Math.ceil((hueco + ud.getDate()) / 7) * 7;

    var h = '<div class="semana-cab"><span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span>' +
            '<span>VIE</span><span>SÁB</span><span>DOM</span></div><div class="dias">';

    for (var i = 0; i < celdas; i++) {
      var n = i - hueco + 1;
      if (n < 1 || n > ud.getDate()) {
        var otra = new Date(y, m, n);
        h += '<div class="dia fuera"><span class="num">' + otra.getDate() + '</span></div>';
        continue;
      }
      var f = y + '-' + pad(m + 1) + '-' + pad(n);
      var lista = mapa[f] || [];
      var cls = 'dia';
      if (lista.some(function (a) { return a.fuente === 'competicion'; })) cls += ' comp';
      if (f === HOY_ISO) cls += ' hoy';

      var puntos = '', vistos = {};
      lista.forEach(function (a) { if (!vistos[a.fuente]) { vistos[a.fuente] = true; puntos += '<i class="p-' + a.fuente + '"></i>'; } });

      var orden = [], cuenta = {};
      lista.forEach(function (a) {
        var e = etiquetaMini(a);
        if (cuenta[e] === undefined) { cuenta[e] = 0; orden.push(e); }
        cuenta[e]++;
      });
      var ets = orden.slice(0, 2).map(function (e) {
        return '<span class="et">' + esc(cuenta[e] > 1 ? e + ' ×' + cuenta[e] : e) + '</span>';
      }).join('');
      if (orden.length > 2) ets += '<span class="mas">+' + (orden.length - 2) + ' más</span>';

      h += '<button type="button" class="' + cls + '" data-dia="' + f + '" ' +
           'aria-label="' + esc(mayus(fechaLarga(f)) + ': ' + (lista.length ? lista.length + ' actividades' : 'sin actividades')) + '">' +
           '<span class="num">' + n + '</span>' + ets +
           (puntos ? '<span class="puntos">' + puntos + '</span>' : '') + '</button>';
    }
    return h + '</div>';
  }

  function columnaDia(mapa, f, corta) {
    var lista = mapa[f] || [];
    var d = fecha(f);
    var titulo = mayus(DIAS[d.getDay()]) + ' ' + d.getDate() + (corta ? ' ' + MESES_CORTO[d.getMonth()] : ' de ' + MESES[d.getMonth()]);
    var h = '<div class="col-dia' + (f === HOY_ISO ? ' es-hoy' : '') + '"><h3>' + esc(titulo) +
            (f === HOY_ISO ? ' <span class="hoy-eti">hoy</span>' : '') + '</h3>';
    if (!lista.length) {
      h += '<p class="nada">Nada programado' + (numFiltros() ? ' con estos filtros' : '') + '.</p>';
    } else {
      h += lista.map(function (a) {
        var marca = '';
        if (a.mio) marca = '<span class="pill mia">Lo mío</span>';
        else if (a.puedo) marca = '<span class="pill ok">Puedo apuntarme</span>';
        return '<button type="button" class="linea k-' + a.fuente + (a.mio ? ' mia' : '') + '" data-act="' + a.i + '">' +
          '<span class="hh">' + esc(a.hora || '—') + '</span>' +
          '<span class="et">' + esc(etiquetaCorta(a)) + '</span>' +
          (marca ? '<span class="marca">' + marca + '</span>' : '') + '</button>';
      }).join('');
    }
    return h + '</div>';
  }

  function pintarSemana(mapa) {
    var p = periodo(), h = '<div class="sem sem--semana">';
    for (var i = 0; i < 7; i++) {
      var d = new Date(p.ini.getFullYear(), p.ini.getMonth(), p.ini.getDate() + i);
      h += columnaDia(mapa, iso(d), true);
    }
    return h + '</div>';
  }

  function pintarDiaSolo(mapa) { return '<div class="sem">' + columnaDia(mapa, iso(ancla), false) + '</div>'; }

  function pintarBonos() {
    if (!atleta) {
      return '<div class="bonos"><span class="eti">Tus bonos · lo que te queda</span>' +
             '<span class="txt">Tu cuenta todavía no está enlazada a ninguna ficha de atleta, así que aquí no ' +

      h += '<select id="sel-atleta" aria-label="Elegir a quién ves">' + atletas.map(function (a) {
        return '<option value="' + a.id + '"' + (atleta && a.id === atleta.id ? ' selected' : '') + '>' +
               esc(((a.nombre || '') + ' ' + (a.apellidos || '')).trim()) + '</option>';
      }).join('') + '</select>';
    }
    h += '<div class="par">' +
      '<span class="cel"><span class="cifra' + (USOS_CUBO ? '' : ' mal') + '">' + USOS_CUBO + '</span>' +
      '<span class="txt">usos del bono de El Cubo' + (HAY_CUBO ? '' : ' (aún sin clases publicadas)') + '</span></span>' +
      '<span class="cel"><span class="cifra' + (SALDO_COMP > 0 ? '' : ' mal') + '">' + esc(euros(SALDO_COMP)) + '</span>' +
      '<span class="txt">de bono para competiciones</span></span>' +
      '</div>' +
      '<span class="txt">Cada clase de El Cubo gasta un uso. Las competiciones se descuentan del bono en euros cuando el club confirma tu inscripción. ' +
      'Los entrenamientos del club no gastan bono.</span>' +
      '<a href="../cubo/">Ver mi bono de El Cubo</a></div>';
    return h;
  }

  function pintarProxima() {
    if (!PROXIMA) {
      return '<div class="proxima"><span class="eti">Próxima competición</span>' +
             '<p class="datos" style="margin:0">Todavía no hay ninguna competición publicada. Cuando el club suba la circular, aparecerá aquí.</p></div>';
    }
    var c = PROXIMA.c;
    var datos = [mayus(fechaLarga(c.fecha_inicio)), c.sede || '', PROXIMA.coste ? euros(PROXIMA.coste) + ' del bono' : ''].filter(Boolean).join(' · ');
    var boton;
    if (PROXIMA.apuntado) boton = '<a class="btn btn--fantasma btn--sm" href="../competiciones/">Ya estás apuntado · ver tus pruebas</a>';
    else if (PROXIMA.abierta) boton = '<a class="btn btn--primario btn--sm" href="../competiciones/">' +
        (PROXIMA.coste ? 'Inscribirme · ' + euros(PROXIMA.coste) : 'Inscribirme') + '</a>';
    else boton = '<a class="btn btn--fantasma btn--sm" href="../competiciones/">La inscripción no está abierta</a>';

    return '<div class="proxima"><span class="eti">Próxima competición</span>' +
           '<h3>' + esc(c.nombre) + '</h3>' +
           '<span class="datos">' + esc(datos) + '</span>' + boton + '</div>';
  }

  /* ---- armazón de la página (se pinta una sola vez) ---- */
  function armazon() {
    return '<a class="volver" href="../">← Volver al portal</a>' +
      '<div class="cal-cab"><div>' +
        '<span class="rotulo">Entrenamientos, clases y competiciones</span>' +
        '<h1 id="cal-periodo">Calendario</h1></div>' +
        '<div class="mes-nav">' +
          '<button type="button" data-paso="-1" aria-label="Anterior">←</button>' +
          '<button type="button" data-paso="0">Hoy</button>' +
          '<button type="button" data-paso="1" aria-label="Siguiente">→</button>' +
        '</div></div>' +

      '<div class="cal-barra">' +
        '<div class="seg" id="cal-vistas" role="group" aria-label="Cómo ver el calendario">' +
          '<button type="button" data-v="mes">Mes</button>' +
          '<button type="button" data-v="semana">Semana</button>' +
          '<button type="button" data-v="dia">Día</button>' +
        '</div>' +
        '<button type="button" class="btn-filtrar" id="abrir-filtros" aria-haspopup="dialog">' +
          'Filtrar <span class="cuenta" id="filtros-cuenta">0</span></button>' +
      '</div>' +

      '<div class="cal-cuerpo">' +
        '<div class="rejilla" id="cal-vista"></div>' +
        '<div class="lateral">' +
          '<div id="lado-bonos"></div><div id="lado-proxima"></div>' +
          '<div class="leyenda">' +
            '<span><i class="p-entreno"></i>Entrenamiento</span>' +
            '<span><i class="p-cubo"></i>El Cubo</span>' +
            '<span><i class="p-competicion"></i>Competición</span>' +
            '<span><i class="p-evento"></i>Evento del club</span>' +
            '<span><i class="p-cierre"></i>Cierre de inscripción</span>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="pie-cal"><p>Lo que ves aquí es lo mismo que ve el club: los entrenamientos los publica tu entrenador, ' +
        'las clases las abre El Cubo y las competiciones salen en cuanto llega la circular. Pincha en cualquier actividad para ver el detalle y apuntarte.</p>' +
        '<div class="enlaces"><a class="btn btn--fantasma btn--sm" href="../cubo/">El Cubo</a>' +
        '<a class="btn btn--fantasma btn--sm" href="../competiciones/">Competiciones</a></div></div>' +

      '<div class="modal" id="modal-act" hidden role="dialog" aria-modal="true" aria-labelledby="modal-act-titulo">' +
        '<div class="modal-caja" id="modal-act-caja"></div></div>' +

      '<div class="modal" id="modal-filtros" hidden role="dialog" aria-modal="true" aria-labelledby="modal-filtros-titulo">' +
        '<div class="modal-caja">' +
          '<div class="modal-cab"><h2 id="modal-filtros-titulo">Filtrar</h2>' +
            '<button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">×</button></div>' +
          '<div id="filtros-cuerpo"></div>' +
          '<div class="modal-pie"><div class="botones">' +
            '<button type="button" class="btn btn--fantasma btn--sm" id="filtros-limpiar">Quitar filtros</button>' +
            '<button type="button" class="btn btn--primario btn--sm" data-cerrar>Ver el calendario</button>' +
          '</div></div>' +
        '</div></div>';
  }

  function pintar() {
    var mapa = porDia();
    document.getElementById('cal-periodo').textContent = rotulo();

    var aviso = numFiltros()
      ? '<div class="filtro-aviso"><span>Estás viendo el calendario filtrado.</span>' +
        '<button type="button" id="quitar-filtros-vista">Quitar filtros</button></div>'
      : '';
    document.getElementById('cal-vista').innerHTML = aviso +
      (vista === 'mes' ? pintarMes(mapa) : (vista === 'semana' ? pintarSemana(mapa) : pintarDiaSolo(mapa)));

    Array.prototype.forEach.call(document.querySelectorAll('#cal-vistas button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-v') === vista ? 'true' : 'false');
    });
    var n = numFiltros();
    document.getElementById('abrir-filtros').classList.toggle('con-filtros', n > 0);
    document.getElementById('filtros-cuenta').textContent = n;

    document.getElementById('lado-bonos').innerHTML = pintarBonos();
    document.getElementById('lado-proxima').innerHTML = pintarProxima();
  }

  // ============================================================
  //  VENTANAS EMERGENTES
  // ============================================================
  function abrirModal(id) {
    ultimoFoco = document.activeElement;
    var m = document.getElementById(id);
    if (!m) return;
    m.hidden = false;
    document.body.style.overflow = 'hidden';
    var c = m.querySelector('.modal-cerrar');
    if (c) c.focus();
  }
  function cerrarModales() {
    ['modal-act', 'modal-filtros'].forEach(function (id) {
      var m = document.getElementById(id);
      if (m) m.hidden = true;
    });
    document.body.style.overflow = '';
    modalClave = null; modalAviso = '';
    if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
    ultimoFoco = null;
  }
  function fila(cual, valor) {
    if (!valor) return '';
    return '<div class="fila"><span class="cual">' + esc(cual) + '</span><span class="valor">' + valor + '</span></div>';
  }

  function contenidoActividad(a) {
    var cuando = mayus(fechaLarga(a.fecha));
    if (a.hora) cuando += ' · ' + a.hora + (a.horaFin ? '–' + a.horaFin : '');

    var quien = a.grupo || seccionNombre(a.seccion);
    var plazas = '';
    if (a.plazas != null) {
      var libres = (a.libres != null) ? a.libres : Math.max(0, a.plazas - (a.apuntados || 0));
      plazas = libres > 0
        ? esc(libres + (libres === 1 ? ' plaza libre' : ' plazas libres') + ' de ' + a.plazas)
        : esc('Completo (' + a.plazas + ' plazas)');
    }
    var abiertaA = (a.abiertaA && a.abiertaA.length) ? esc(a.abiertaA.map(seccionNombre).filter(Boolean).join(', ')) : '';

    var h = '<div class="modal-cab"><div>' +
      '<span class="modal-eti ' + (COLOR_ETIQUETA[a.fuente] || '') + '">' + esc(a.tipoTexto || '') + '</span>' +
      '<h2 id="modal-act-titulo">' + esc(a.titulo) + '</h2></div>' +
      '<button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">×</button></div>';

    h += '<div class="modal-datos">' +
      fila('Cuándo', esc(cuando)) +
      fila('Dónde', esc(a.lugar || '')) +
      fila('Quién', esc(quien)) +
      fila('Abierto a', abiertaA) +
      fila('Plazas', plazas) +
      fila('Coste', a.coste ? esc(euros(a.coste) + ' del bono') : '') +
      fila('Estado', '<span class="pill ' + (a.pillClase || '') + '">' + esc(a.estado || '') + '</span>') +
      fila('Nota', esc(a.nota || a.descripcion || '')) +
      '</div>';

    h += '<div class="modal-pie">';
    if (modalAviso) {
      h += '<p class="' + (modalAviso.charAt(0) === '!' ? 'error' : 'ok') + '">' + esc(modalAviso.replace(/^!/, '')) + '</p>';
    }
    if (!atleta) {
      h += '<p>Tu cuenta todavía no está enlazada a una ficha de atleta, así que no puedes apuntarte desde aquí. Avisa al club y lo enlazan.</p>' +
           '<div class="botones"><a class="btn btn--fantasma btn--sm" href="../mensajes/">Escribir al club</a></div>';
    } else if (a.accion && a.accion.tipo === 'enlace') {
      h += '<div class="botones"><a class="btn btn--' + a.accion.estilo + ' btn--sm" href="' + esc(a.accion.href) + '">' +
           esc(a.accion.texto) + '</a></div>';
    } else if (a.accion) {
      h += '<div class="botones"><button type="button" class="btn btn--' + a.accion.estilo + ' btn--sm" ' +
           'data-accion="' + a.accion.tipo + '" data-id="' + esc(a.accion.id) + '">' + esc(a.accion.texto) + '</button></div>';
    } else {
      var porQue = a.estado === 'Completa'
        ? 'Ya no quedan plazas. Si te interesa, escribe a quien la lleva por si se libera alguna.'
        : (a.estado === 'Cerrada'
            ? 'Esta actividad ya está cerrada. Si tienes una duda, escribe a quien la lleva.'
            : 'Aquí no puedes apuntarte tú. Si quieres ir o tienes una duda, escribe a quien la lleva.');
      h += '<p>' + esc(porQue) + '</p>' +
           '<div class="botones"><a class="btn btn--fantasma btn--sm" href="' + esc(a.contacto.href) + '">' +
           esc(a.contacto.texto) + '</a></div>';
    }
    h += '</div>';
    return h;
  }

  function abrirActividad(a) {
    if (!a) return;
    modalClave = a.clave;
    document.getElementById('modal-act-caja').innerHTML = contenidoActividad(a);
    abrirModal('modal-act');
  }
  function refrescarModal() {
    if (!modalClave) return;
    var a = ACTIVIDADES.filter(function (x) { return x.clave === modalClave; })[0];
    if (!a) { cerrarModales(); return; }
    document.getElementById('modal-act-caja').innerHTML = contenidoActividad(a);
  }

  function pintarFiltros() {
    var tipos = [
      { id: 'entreno', txt: 'Entrenamientos' },
      { id: 'cubo', txt: 'El Cubo' },
      { id: 'competicion', txt: 'Competiciones' },
      { id: 'evento', txt: 'Eventos del club' }
    ];
    var h = '<div class="filtro-bloque"><h3>Qué quieres ver</h3><div class="filtro-ops" data-grupo="tipo">' +
      tipos.map(function (o) {
        return '<button type="button" data-id="' + esc(o.id) + '" aria-pressed="' + (fTipos[o.id] ? 'true' : 'false') + '">' + esc(o.txt) + '</button>';
      }).join('') + '</div></div>';

    if (SECCIONES.length) {
      h += '<div class="filtro-bloque"><h3>De qué grupo o sección</h3><div class="filtro-ops" data-grupo="sec">' +
        SECCIONES.map(function (s) {
          return '<button type="button" data-id="' + esc(s) + '" aria-pressed="' + (fSecs[s] ? 'true' : 'false') + '">' + esc(seccionNombre(s)) + '</button>';
        }).join('') + '</div></div>';
    }

    h += '<div class="filtro-bloque"><h3>Para quién</h3><div class="filtro-ops" data-grupo="ambito">' +
      [{ id: 'todo', txt: 'Todo el club' }, { id: 'mio', txt: 'Lo mío' }, { id: 'abierto', txt: 'Donde puedo apuntarme' }]
        .map(function (o) {
          return '<button type="button" data-id="' + esc(o.id) + '" aria-pressed="' + (ambito === o.id ? 'true' : 'false') + '">' + esc(o.txt) + '</button>';
        }).join('') + '</div></div>';

    document.getElementById('filtros-cuerpo').innerHTML = h;
  }

  // ============================================================
  //  NAVEGACIÓN Y ACCIONES
  // ============================================================
  function mover(paso) {
    if (paso === 0) { var n = new Date(); ancla = new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
    else if (vista === 'mes') ancla = new Date(ancla.getFullYear(), ancla.getMonth() + paso, 1);
    else if (vista === 'semana') ancla = new Date(ancla.getFullYear(), ancla.getMonth(), ancla.getDate() + 7 * paso);
    else ancla = new Date(ancla.getFullYear(), ancla.getMonth(), ancla.getDate() + paso);
  }

  async function refrescarSiHaceFalta() {
    if (claveVentana() !== ventanaCargada) {
      document.getElementById('cal-vista').innerHTML = '<p class="vacio">Cargando el calendario…</p>';
      await cargar();
    }
    pintar();
  }

  function mensajeError(e) {
    var m = (e && e.message) ? e.message : 'No se ha podido guardar.';
    if (e && e.code === '23505') return 'Ya estabas apuntado.';
    if (m.indexOf('row-level security') >= 0) return 'No puedes apuntarte a esta actividad.';
    return m;
  }

  wrap.addEventListener('click', async function (ev) {
    var t = ev.target.closest ? ev.target.closest(
      '[data-cerrar],[data-accion],[data-act],[data-dia],[data-paso],[data-v],[data-id],' +
      '#abrir-filtros,#filtros-limpiar,#quitar-filtros-vista') : null;

    // cerrar pulsando el fondo de una ventana emergente
    if (ev.target.classList && ev.target.classList.contains('modal')) { cerrarModales(); return; }
    if (!t) return;

    if (t.hasAttribute('data-cerrar')) { cerrarModales(); return; }

    if (t.hasAttribute('data-v')) {
      vista = t.getAttribute('data-v');
      try { localStorage.setItem('apolana-cal-vista', vista); } catch (e) { /* modo privado */ }
      await refrescarSiHaceFalta();
      return;
    }

    if (t.hasAttribute('data-paso')) { mover(+t.getAttribute('data-paso')); await refrescarSiHaceFalta(); return; }

    if (t.hasAttribute('data-dia')) {
      ancla = fecha(t.getAttribute('data-dia'));
      vista = 'dia';
      try { localStorage.setItem('apolana-cal-vista', vista); } catch (e) { /* modo privado */ }
      pintar();
      return;
    }

    if (t.hasAttribute('data-act')) {
      abrirActividad(ACTIVIDADES[+t.getAttribute('data-act')]);
      return;
    }

    // filtros
    if (t.id === 'abrir-filtros') { pintarFiltros(); abrirModal('modal-filtros'); return; }
    if (t.id === 'filtros-limpiar') { fTipos = {}; fSecs = {}; ambito = 'todo'; pintarFiltros(); pintar(); return; }
    if (t.id === 'quitar-filtros-vista') { fTipos = {}; fSecs = {}; ambito = 'todo'; pintar(); return; }
    if (t.hasAttribute('data-id') && t.parentNode && t.parentNode.getAttribute('data-grupo')) {
      var grupo = t.parentNode.getAttribute('data-grupo');
      var id = t.getAttribute('data-id');
      if (grupo === 'ambito') {
        ambito = id;
        Array.prototype.forEach.call(t.parentNode.querySelectorAll('button'), function (b) {
          b.setAttribute('aria-pressed', b === t ? 'true' : 'false');
        });
      } else {
        var mapa = grupo === 'tipo' ? fTipos : fSecs;
        mapa[id] = !mapa[id];
        t.setAttribute('aria-pressed', mapa[id] ? 'true' : 'false');
      }
      pintar();
      return;
    }

    // apuntarse / quitarse
    var acc = t.getAttribute('data-accion');
    if (!acc) return;
    var idAcc = t.getAttribute('data-id');
    if (!atleta) { modalAviso = '!Tu cuenta todavía no tiene ficha de atleta. Avisa al club.'; refrescarModal(); return; }
    t.disabled = true; t.textContent = 'Un momento…';

    var r;
    if (acc === 'apuntar-sesion') {
      r = await sb.from('sesion_inscripciones').insert({ sesion_id: idAcc, atleta_id: atleta.id });
      modalAviso = r.error ? '!' + mensajeError(r.error) : 'Apuntado. Ya estás en la lista.';
    } else if (acc === 'quitar-sesion') {
      r = await sb.from('sesion_inscripciones').delete().eq('sesion_id', idAcc).eq('atleta_id', atleta.id);
      modalAviso = r.error ? '!' + mensajeError(r.error) : 'Te has quitado.';
    } else if (acc === 'apuntar-cubo') {
      r = await sb.rpc('cubo_apuntarme', { p_clase: idAcc, p_atleta: atleta.id });
      if (r.error) modalAviso = '!' + mensajeError(r.error);
      else modalAviso = (r.data === 'lista_espera')
        ? 'La clase está completa: te hemos puesto en la lista de espera. Si queda una plaza, te avisamos.'
        : 'Apuntado. Se te descuenta un uso del bono.';
    } else if (acc === 'quitar-cubo') {
      r = await sb.rpc('cubo_desapuntarme', { p_clase: idAcc, p_atleta: atleta.id });
      modalAviso = r.error ? '!' + mensajeError(r.error) : 'Te has quitado de la clase.';
    } else { return; }

    await cargar();
    pintar();
    refrescarModal();
  });

  wrap.addEventListener('change', async function (ev) {
    if (!ev.target || ev.target.id !== 'sel-atleta') return;
    var id = ev.target.value;
    atleta = atletas.filter(function (a) { return a.id === id; })[0] || atleta;
    document.getElementById('cal-vista').innerHTML = '<p class="vacio">Cargando el calendario…</p>';
    await cargar(); pintar();
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') cerrarModales(); });

  // ============================================================
  //  ARRANQUE
  // ============================================================
  try {
    var raa = await sb.from('atletas').select('id,nombre,apellidos,grupo_id').order('nombre');
    atletas = raa.error ? [] : (raa.data || []);
  } catch (e) { atletas = []; }
  atleta = atletas.length ? atletas[0] : null;

  wrap.innerHTML = armazon();
  await cargar();
  pintar();
});
</script>

</body>
</html>
