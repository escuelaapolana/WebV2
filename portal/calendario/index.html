<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  body { background: var(--crema); }
  /* En el móvil todo lo que se toca mide 44px de alto como mínimo */
  .btn, .btn--sm { min-height: 44px; }

  /* Colores por tipo de actividad: la competición es la que se ve de lejos,
     el entrenamiento es fondo. (Mismo criterio que la web pública.) */
  :root {
    --c-competicion: #B0563A;
    --c-competicion-suave: #FBEFEA;
    --c-competicion-borde: #E8C9BF;
    --c-evento: #2F6FA8;
    --c-cierre: #B96F09;
    --c-cierre-suave: #FDF3E3;
    --c-cierre-borde: #EBD9B8;
    --c-cubo: #6B5B8A;
    --c-entreno: #DDD5C5;
  }

  .cal-wrap { max-width: 1200px; margin: 0 auto; padding: clamp(14px,3vw,28px) clamp(14px,4vw,40px) 48px; }
  .volver { display:inline-block; margin-bottom:10px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:15px; min-height:44px; line-height:44px; }

  /* ---- cabecera: periodo + navegación ---- */
  /* Cabecera de pantalla: sobre crema y sin barra de color. Migas a 14 px
     arriba y título a 28 px debajo. */
  .cal-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .cal-cab .rotulo { font-size:14px; color: var(--texto-suave); display:block; }
  .cal-cab h1 { font-family: var(--fuente-titulo); font-weight:700; text-transform: uppercase;
                font-size:32px; line-height:.96; color: var(--navy); margin:4px 0 0; }
  .mes-nav { display:flex; align-items:center; gap:8px; }
  .mes-nav[hidden] { display:none; }
  .mes-nav button { background:#fff; border:1px solid var(--linea-borde); color: var(--navy); border-radius:999px;
                    min-height:44px; padding:10px 16px; font-family:inherit; font-size:15px; line-height:1; cursor:pointer; }
  .mes-nav button.flecha { width:44px; padding:0; color: var(--texto-suave); }
  .mes-nav button:hover { border-color: var(--azul-filete, #3B85C0); }

  /* ---- selector de vista: Agenda · Semana · Mes ---- */
  .vistas { margin-top:16px; display:flex; gap:6px; }
  .vistas button {
    flex:1; min-height:44px; border:0; border-radius:10px; background: var(--crema-banda);
    color: var(--texto); font-family:inherit; font-size:15px; line-height:1; cursor:pointer;
  }
  .vistas button:hover { background: var(--crema-media); color: var(--navy); }
  .vistas button[aria-pressed="true"] { background: var(--navy); color:#fff; font-weight:600; }

  /* ---- foco: Todo · Competiciones · Lo mío + botón Filtrar ---- */
  .focos { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .focos button {
    min-height:44px; padding:10px 15px; border-radius:999px; background:#fff;
    border:1px solid var(--linea-borde); color: var(--texto);
    font-family:inherit; font-size:14px; line-height:1; cursor:pointer;
  }
  .focos button:hover { border-color: var(--azul-filete, #3B85C0); }
  .focos button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color:#fff; font-weight:600; }
  .focos .separa-flex { flex:1; }

  .btn-filtrar { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:10px 16px;
                 border-radius:999px; background:#fff; border:1px solid var(--linea-borde); color: var(--navy);
                 font-family:inherit; font-size:14px; line-height:1; cursor:pointer; }
  .btn-filtrar:hover { border-color: var(--azul-filete, #3B85C0); }
  .btn-filtrar.con-filtros { background: var(--navy); border-color: var(--navy); color:#fff; font-weight:600; }

  /* chip de un filtro puesto, con su aspa */
  .chip-filtro { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:10px 15px;
                 border-radius:999px; background: var(--crema-banda); border:0; color: var(--texto);
                 font-family:inherit; font-size:14px; line-height:1; cursor:pointer; }
  .chip-filtro:hover { background: var(--crema-media); color: var(--navy); }
  .chip-filtro .aspa { color: var(--texto-suave); }
  .enlace-quitar { background:none; border:0; padding:10px 4px; min-height:44px; font-family:inherit;
                   font-size:14px; font-weight:600; color: var(--azul-oscuro); cursor:pointer; }
  .enlace-quitar:hover { text-decoration:underline; }

  /* ---- cuerpo + columna lateral ---- */
  .cal-cuerpo { margin-top:16px; display:grid; grid-template-columns: 1.6fr 1fr; gap:22px; align-items:start; }
  .cal-cuerpo > * { min-width:0; }
  @media (max-width: 900px) { .cal-cuerpo { grid-template-columns: 1fr; } }

  /* ===========================================================
     VISTA AGENDA · lista continua, saltando los días vacíos
     =========================================================== */
  .agenda { display:flex; flex-direction:column; gap:8px; }
  .sep-dia { display:flex; align-items:center; gap:10px; padding:10px 2px 2px; }
  .sep-dia span.txt { font-size:14px; color: var(--texto-suave); border-bottom:2px solid transparent; padding-bottom:2px; }
  /* Hoy se marca con subrayado de 2 px, no solo con un cambio de color (34c) */
  .sep-dia.hoy span.txt { color: var(--navy); font-weight:600; border-bottom-color: var(--navy); }
  .sep-dia .raya { flex:1; height:1px; background: var(--crema-media); }

  /* Se pulsa entera, así que lleva las tres señales juntas: sombra baja, borde
     marcado y chevron. Así se sabe qué se puede tocar sin tener que probar. */
  .tarj {
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#fff; border:1px solid var(--linea-marcada); border-radius:14px;
    padding:14px 16px; min-height:60px; font-family:inherit; cursor:pointer;
    box-shadow: 0 12px 24px -18px rgba(46,66,86,0.5);
  }
  .tarj:hover { border-color: var(--azul-filete, #3B85C0); }
  /* La hora, en la parrilla, es un dato que se compara en columna */
  .tarj .hh { font-family: var(--fuente-dato); font-size:13px; color: var(--navy); width:46px; flex-shrink:0; }
  .tarj .med { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .tarj .tit { font-size:15px; font-weight:600; color: var(--navy); overflow-wrap:anywhere; }
  .tarj .sub { font-size:13px; color: var(--texto-suave); overflow-wrap:anywhere; }
  /* El chevron nunca va en azul: se leería como un enlace distinto de la fila */
  .tarj .chev { color: var(--texto-suave); font-size:18px; flex-shrink:0; }

  /* Lo mío: la tarjeta oscura, que es lo primero que buscas */
  .tarj.mia { background: var(--navy); border-color: var(--navy); }
  .tarj.mia .hh { color:#8FC0E8; }
  .tarj.mia .tit { color:#fff; }
  .tarj.mia .sub { color: rgba(255,255,255,.65); }
  .tarj.mia .chev { color: rgba(255,255,255,.5); }

  /* Competición: borde rojo a la izquierda */
  .tarj.k-competicion { border-left:4px solid var(--c-competicion); }
  .tarj.k-competicion .hh { color: var(--c-competicion); }
  .tarj.k-competicion .sub { color: var(--c-competicion); }
  .tarj.k-competicion.mia { border-left-color: var(--c-competicion); }

  /* Cierre de inscripción: ámbar, y te dice si estás dentro */
  .tarj.k-cierre { background: var(--c-cierre-suave); border-color: var(--c-cierre-borde); }
  .tarj.k-cierre .hh { color: var(--c-cierre); }
  .tarj.k-cierre .sub { color: var(--c-cierre); font-weight:600; }
  .tarj.k-cierre .sub.dentro { color:#1e7a3d; }

  .tarj.k-cubo { border-left:4px solid var(--c-cubo); }
  .tarj.k-evento { border-left:4px solid var(--c-evento); }

  /* ===========================================================
     VISTA SEMANA · una fila por día
     =========================================================== */
  .semana { display:flex; flex-direction:column; gap:7px; }
  .fila-dia { display:flex; gap:12px; align-items:flex-start; background:#fff;
              border:1px solid var(--crema-media); border-radius:14px; padding:11px 14px; }
  .fila-dia.hoy { background: var(--crema-banda); border-color:#E4DCCB; }
  .fila-dia .cual { width:46px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:1px; }
  .fila-dia .cual .dd { font-size:13px; color: var(--texto-suave); }
  .fila-dia .cual .nn { font-family: var(--fuente-titulo); font-weight:700; font-size:21px; line-height:1; color: var(--navy); }
  .fila-dia.hoy .cual .dd, .fila-dia.hoy .cual .nn { color: var(--azul-oscuro); }
  .fila-dia .lista { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .fila-dia .nada { font-size:13px; color: var(--texto-suave); padding:4px 0; }
  .lin {
    display:flex; gap:9px; align-items:baseline; width:100%; text-align:left; background:none; border:0;
    padding:7px 4px; min-height:44px; font-family:inherit; font-size:14px; color: var(--navy);
    border-radius:10px; cursor:pointer; min-width:0;
  }
  .lin:hover { background: var(--crema); }
  .lin .hh { font-family: var(--fuente-dato); font-size:13px; color: var(--navy); flex:0 0 42px; }
  .lin .tt { min-width:0; overflow-wrap:anywhere; line-height:1.35; }
  .lin.mia .tt { font-weight:600; }
  .lin.k-competicion .hh, .lin.k-competicion .tt { color: var(--c-competicion); }
  .lin.k-cierre .hh, .lin.k-cierre .tt { color: var(--c-cierre); }

  /* ===========================================================
     VISTA MES · solo puntos, y debajo el día elegido
     La rejilla es para navegar, no para leer.
     =========================================================== */
  /* Sin sombra: la rejilla no se pulsa entera, lo pulsable son sus días (34c) */
  .rejilla { background:#fff; border:1px solid var(--linea); border-radius:14px;
             padding: clamp(12px,2vw,20px); max-width:100%; overflow:hidden; }
  .semana-cab, .dias { display:grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap:4px; }
  .semana-cab { font-size:13px; color: var(--texto-suave); text-align:center; padding-bottom:8px; }
  .dia {
    min-height:48px; border-radius:10px; border:1px solid transparent; background:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font-family:inherit; font-size:14px; color: var(--navy); cursor:pointer; min-width:0; padding:4px 2px;
  }
  .dia:hover { background: var(--crema); }
  .dia.fuera { color:#D5CDBC; cursor:default; }
  /* El día de hoy, con subrayado de 2 px bajo la cifra */
  .dia.hoy { color: var(--navy); font-weight:700; box-shadow: inset 0 -2px 0 0 var(--navy); }
  .dia.elegido { background: var(--azul-suave); border-color: var(--azul-filete, #3B85C0); }
  .dia .puntos { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; min-height:5px; }
  .dia .puntos i { width:5px; height:5px; border-radius:999px; display:block; }
  .p-entreno { background: var(--c-entreno); } .p-cubo { background: var(--c-cubo); }
  .p-competicion { background: var(--c-competicion); } .p-cierre { background: var(--c-cierre); }
  .p-evento { background: var(--c-evento); }

  .detalle-dia { margin-top:16px; display:flex; flex-direction:column; gap:8px; }

  /* ---- columna lateral ---- */
  .lateral { display:flex; flex-direction:column; gap:14px; }

  .bonos { background: var(--navy); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .bonos .eti { font-size:13px; color: rgba(255,255,255,.72); }
  .bonos .par { display:flex; gap:18px; flex-wrap:wrap; }
  .bonos .cel { flex:1; min-width:120px; display:flex; flex-direction:column; gap:2px; }
  .bonos .cifra { font-family: var(--fuente-dato); font-weight:700; font-size:36px; color:#fff; line-height:1; }
  .bonos .cifra.mal { color:#F2B8B5; }
  .bonos .txt { font-size:13px; color: rgba(255,255,255,.78); line-height:1.35; }
  .bonos select { width:100%; min-height:44px; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.35);
                  background: rgba(255,255,255,.1); color:#fff; font-family:inherit; font-size:15px; }
  .bonos select option { color: var(--navy); }
  .bonos a { color:#cfe2f2; font-size:14px; text-decoration:underline;
             display:inline-flex; align-items:center; min-height:44px; align-self:flex-start; }

  .proxima { background: var(--crema-banda); border:1px solid var(--linea-borde); border-radius:14px;
             padding:18px 20px; display:flex; flex-direction:column; gap:8px; }
  .proxima .eti { font-size:13px; color: var(--c-competicion); }
  .proxima h3 { font-family: var(--fuente-titulo); font-weight:700; font-size:28px; text-transform:uppercase; color: var(--navy); line-height:1; overflow-wrap:anywhere; }
  .proxima .datos { font-size:14px; color:#6E6656; }
  .proxima .btn { margin-top:4px; width:100%; text-align:center; }

  .leyenda { display:flex; flex-wrap:wrap; gap:12px 16px; font-size:13px; color: var(--texto-suave); padding:0 4px; }
  .leyenda span { display:flex; align-items:center; gap:6px; }
  .leyenda i { width:9px; height:9px; border-radius:10px; display:block; }

  .pie-cal { margin-top:26px; background:#fff; border:1px solid var(--crema-media); border-radius:14px;
             padding:20px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .pie-cal p { font-size:15px; color: var(--texto); margin:0; }
  .pie-cal .enlaces { display:flex; gap:10px; flex-wrap:wrap; }

  .vacio { color: var(--texto-suave); font-size:14px; margin:0; }

  .pill { font-size:13px; padding:3px 10px; border-radius:999px; background: var(--crema-media);
          color: var(--texto-suave); white-space:nowrap; display:inline-block; }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }
  .pill.mia { background:#fff; color: var(--azul-oscuro); border:1px solid var(--azul-filete, #3B85C0); }
  .pill.no { background:#fbeceb; color:#b3261e; }
  .pill.espera { background: var(--aviso-fondo); color: var(--aviso-titulo); }

  /* ===========================================================
     VENTANA EMERGENTE (patrón del proyecto)
     =========================================================== */
  .modal { position:fixed; inset:0; z-index:9500; background:rgba(46,66,86,.45);
           display:flex; align-items:flex-start; justify-content:center;
           padding:clamp(16px,5vh,60px) 16px; overflow:auto;
           -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  .modal[hidden] { display:none; }
  .modal-caja { background:#fff; border:1px solid var(--linea); border-radius:14px;
                box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:24px;
                width:min(520px,100%); animation:modal-sube .2s ease; }
  @keyframes modal-sube { from { transform:translateY(12px); opacity:.6; } to { transform:none; opacity:1; } }
  .modal-cab { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .modal-cab h2 { font-family: var(--fuente-titulo); font-weight:700; font-size:28px; line-height:1.02;
                  text-transform:uppercase; color: var(--navy); overflow-wrap:anywhere; }
  .modal-cerrar { flex-shrink:0; width:44px; height:44px; margin:-8px -8px 0 0; border-radius:50%;
                  border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave);
                  font-family:inherit; font-size:20px; line-height:1; cursor:pointer; }
  .modal-cerrar:hover { border-color: var(--azul-filete, #3B85C0); color: var(--navy); }
  .modal-eti { display:inline-block; align-self:flex-start; margin-bottom:6px; font-size:13px;
               color: var(--azul-oscuro); background: var(--azul-suave); border-radius:999px; padding:4px 11px; }
  .modal-eti.roja { background: var(--c-competicion-suave); color: var(--c-competicion); }
  .modal-eti.morada { background:#F1ECF8; color: var(--c-cubo); }
  .modal-eti.ambar { background: var(--c-cierre-suave); color: var(--c-cierre); }
  .modal-eti.gris { background: var(--crema-media); color: var(--texto-suave); }

  .modal-datos { margin-top:16px; display:flex; flex-direction:column; }
  .modal-datos .fila { display:flex; gap:14px; padding:10px 0; border-bottom:1px solid var(--crema-banda); }
  .modal-datos .fila:last-child { border-bottom:0; }
  .modal-datos .cual { flex:0 0 92px; font-size:13px; color: var(--texto-suave); }
  .modal-datos .valor { font-size:15px; color: var(--navy); min-width:0; overflow-wrap:anywhere; }

  /* ---- ficha de competición: dorsal, cajón y quién más va ---- */
  .ficha-comp { margin-top:16px; display:flex; flex-direction:column; gap:12px; }
  .ficha-caja { background: var(--crema); border:1px solid var(--crema-media); border-radius:14px;
                padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .ficha-caja .arriba { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .ficha-caja .eti { font-size:13px; color: var(--texto-suave); }
  .cifras { display:flex; gap:22px; flex-wrap:wrap; }
  .cifras .cel { display:flex; flex-direction:column; gap:1px; }
  .cifras .num { font-family: var(--fuente-dato); font-weight:700; font-size:28px; line-height:1; color: var(--navy); }
  .cifras .que { font-size:13px; color: var(--texto-suave); }

  .gente { display:flex; align-items:center; }
  .gente .av {
    width:34px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    font-family: var(--fuente-titulo); font-weight:700; font-size:13px; color:#fff;
    border:2px solid var(--crema); flex-shrink:0;
  }
  .gente .av + .av { margin-left:-8px; }
  .gente .av.resto { background:#fff; color: var(--texto); font-family: var(--fuente-texto); font-weight:500; font-size:13px; }

  .modal-pie { margin-top:18px; padding-top:16px; border-top:1px solid var(--crema-banda); }
  .modal-pie p { margin:0 0 12px; font-size:15px; color: var(--texto); }
  .modal-pie p.error { color:#b3261e; }
  .modal-pie p.ok { color:#1e7a3d; }
  .modal-pie .botones { display:flex; gap:10px; flex-wrap:wrap; }
  .modal-pie .btn { flex:1 1 auto; text-align:center; cursor:pointer; font-family:inherit; min-height:44px; }
  .modal-pie .btn[disabled] { opacity:.6; cursor:default; }
  /* Botón apagado: el plazo del club ya está cerrado */
  .modal-pie .btn--apagado { flex:1 1 auto; }
  .btn--apagado { display:inline-flex; align-items:center; justify-content:center; min-height:44px;
                  padding:11px 20px; border-radius:999px; background: var(--crema-media);
                  border:1px solid var(--linea-borde); color: var(--texto-suave);
                  font-family:inherit; font-size:15px; font-weight:600; cursor:default; }
  .modal-pie .botones.ics { margin-top:10px; }
  .modal-pie .botones.ics .btn { min-height:44px; }
  /* Anular la inscripción no es un botón más: va discreto y en rojo */
  .btn-anular { display:block; width:100%; margin-top:10px; min-height:44px; background:none; border:0;
                font-family:inherit; font-size:14px; color: var(--c-competicion); cursor:pointer; }
  .btn-anular:hover { text-decoration:underline; }
  .btn-anular[disabled] { opacity:.6; cursor:default; text-decoration:none; }
  .modal-pie .letra-chica { display:block; margin:12px 0 0; font-size:13px; color: var(--texto-suave); line-height:1.5; }
  .modal-pie .letra-chica b { color: var(--navy); }

  .filtro-bloque + .filtro-bloque { margin-top:18px; }
  .filtro-bloque > h3 { font-size:13px; color: var(--texto-suave); margin-bottom:10px; font-weight:400; }
  .filtro-ops { display:flex; flex-wrap:wrap; gap:8px; }
  .filtro-ops button { min-height:44px; padding:10px 16px; border-radius:999px; background:#fff;
                       border:1px solid var(--linea-borde); color: var(--texto); font-family:inherit;
                       font-size:15px; line-height:1; cursor:pointer; }
  .filtro-ops button:hover { border-color: var(--azul-filete, #3B85C0); }
  /* Chip encendido: navy relleno, igual que en el resto del portal */
  .filtro-ops button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color:#fff; font-weight:600; }

  @media (max-width: 620px) {
    .focos .separa-flex { display:none; }
    .btn-filtrar { flex:1 1 100%; justify-content:center; }
    .modal-caja { padding:20px 18px; }
    .modal-cab h2 { font-size:28px; }
    .modal-datos .cual { flex:0 0 80px; }
    .modal-pie .btn, .modal-pie .btn--apagado { flex:1 1 100%; }
    .pie-cal .btn { width:100%; text-align:center; }
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="cal-wrap" id="cal-wrap"><div class="ap-esq" data-esq="filas:5"></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cal-wrap');
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var DIAS_CORTO = ['dom','lun','mar','mié','jue','vie','sáb'];

  /* La sección "competicion" es el grupo de pista: se llama "Pista" para que
     no se confunda con el filtro de Competiciones (antes salían los dos). */
  var SEC_NOMBRE = { escuela:'Escuela', competicion:'Pista', running:'Running', natacion:'Natación',
                     triatlon:'Triatlón', montana:'Montaña', pista:'Pista', marcha:'Marcha',
                     cubo:'El Cubo', 'escuela-natacion':'Escuela de natación',
                     'escuela-municipal':'Escuela municipal', 'deporte-adaptado':'Deporte adaptado' };
  var COLOR_ETIQUETA = { entreno:'', cubo:'morada', competicion:'roja', evento:'', cierre:'ambar' };
  var NOMBRE_TIPO = { entreno:'Entrenamientos', cubo:'El Cubo', competicion:'Competiciones', evento:'Eventos del club' };
  /* El ámbito de una competición, dicho como se dice. "atletismo" no se enseña:
     es lo normal y no aporta nada. */
  var NOMBRE_AMBITO = { natacion:'natación', montana:'montaña', triatlon:'triatlón',
                        ruta:'ruta', cross:'cross', trail:'trail', marcha:'marcha', pista:'pista' };
  /* Colores de los avatares: solo para distinguirlos de un vistazo */
  /* Las iniciales van en blanco encima, así que cada fondo tiene que dar
     4,5:1 con el blanco. El azul claro del escudo se quedaba en 3,96:1. */
  var COLOR_AVATAR = ['#2E4256', '#2F6FA8', '#6B5B8A', '#7A9450', '#B0563A'];

  /* Columnas que puede o no tener la base. Si el club todavía no las ha
     añadido, esa línea de la ficha sencillamente no se enseña. */
  var COL_SALIDA   = ['punto_salida', 'lugar_salida', 'salida'];
  var COL_QUEDADA  = ['hora_quedada', 'punto_quedada', 'quedada'];
  var COL_DORSALES = ['reparto_dorsales', 'recogida_dorsales', 'dorsales'];
  var COL_DORSAL   = ['dorsal', 'numero_dorsal'];
  var COL_CAJON    = ['cajon', 'cajon_salida', 'box'];

  function primerDato(obj, claves) {
    if (!obj) return '';
    for (var i = 0; i < claves.length; i++) {
      var v = obj[claves[i]];
      if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
    }
    return '';
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fecha(s) { var p = String(s).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function hhmm(t) { return t ? String(t).slice(0, 5) : ''; }
  function euros(n) { var v = parseFloat(n); return (isNaN(v) ? 0 : v).toFixed(2).replace('.', ',') + ' €'; }
  function seccionNombre(s) { if (!s) return ''; return SEC_NOMBRE[s] || (s.charAt(0).toUpperCase() + s.slice(1)); }
  function mayus(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function fechaLarga(s) { var d = fecha(s); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function fechaCorta(s) { var d = fecha(s); return DIAS_CORTO[d.getDay()] + ' ' + d.getDate() + ' ' + MESES_CORTO[d.getMonth()]; }
  /* ===========================================================
     AÑADIR A MI CALENDARIO (.ics)
     El archivo se arma aquí, en el navegador, y se descarga sin
     pasar por ningún servidor. Es una copia fija del evento: si
     luego cambia la hora, hay que volver a añadirlo.
     Las horas van en UTC (sufijo Z) para que las acepte cualquier
     calendario sin arrastrar la definición de la zona horaria.
     =========================================================== */
  function icsEsc(s) {
    return String(s == null ? '' : s)
      .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }
  function icsDia(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function icsUTC(d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
           pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  }
  /* Las líneas largas se parten como manda el formato (75 caracteres) */
  function icsPlegar(linea) {
    if (linea.length <= 74) return linea;
    var salida = linea.slice(0, 74), resto = linea.slice(74);
    while (resto.length) { salida += '\r\n ' + resto.slice(0, 73); resto = resto.slice(73); }
    return salida;
  }
  function icsNombreArchivo(titulo) {
    var t = String(titulo || 'evento').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').replace(/^apolana-/, '').slice(0, 60);
    return 'apolana-' + (t || 'evento') + '.ics';
  }
  /* ev: { uid, titulo, fecha 'AAAA-MM-DD', hora 'HH:MM' (opcional),
          horaFin 'HH:MM' (opcional), lugar, descripcion } */
  function icsTexto(ev) {
    var p = String(ev.fecha).split('-');
    var ini, fin, dtIni, dtFin;
    if (ev.hora) {
      var hi = String(ev.hora).split(':');
      ini = new Date(+p[0], +p[1] - 1, +p[2], +hi[0] || 0, +hi[1] || 0);
      if (ev.horaFin) {
        var hf = String(ev.horaFin).split(':');
        fin = new Date(+p[0], +p[1] - 1, +p[2], +hf[0] || 0, +hf[1] || 0);
        if (fin <= ini) fin = new Date(ini.getTime() + 60 * 60000);
      } else fin = new Date(ini.getTime() + 90 * 60000);
      dtIni = 'DTSTART:' + icsUTC(ini);
      dtFin = 'DTEND:' + icsUTC(fin);
    } else {
      ini = new Date(+p[0], +p[1] - 1, +p[2]);
      fin = new Date(ini.getTime()); fin.setDate(fin.getDate() + 1);
      dtIni = 'DTSTART;VALUE=DATE:' + icsDia(ini);
      dtFin = 'DTEND;VALUE=DATE:' + icsDia(fin);
    }
    var l = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Club Atletismo Apolana//ES',
             'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT'];
    l.push('UID:' + icsEsc(ev.uid || (ev.fecha + '-' + ev.titulo)) + '@apolana');
    l.push('DTSTAMP:' + icsUTC(new Date()));
    l.push(dtIni, dtFin);
    l.push('SUMMARY:' + icsEsc(ev.titulo));
    if (ev.lugar) l.push('LOCATION:' + icsEsc(ev.lugar));
    if (ev.descripcion) l.push('DESCRIPTION:' + icsEsc(ev.descripcion));
    l.push('END:VEVENT', 'END:VCALENDAR');
    return l.map(icsPlegar).join('\r\n') + '\r\n';
  }
  function icsDescargar(ev) {
    var blob = new Blob([icsTexto(ev)], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = icsNombreArchivo(ev.titulo);
    document.body.appendChild(a); a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 400);
  }

  /* "jueves 14 de agosto" y, si la hora importa, "… a las 20:00" */
  function plazoLargo(marca) {
    if (!marca) return '';
    var d = new Date(marca);
    if (isNaN(d.getTime())) return fechaLarga(marca);
    var t = DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    if (String(marca).indexOf('T') > -1 && (d.getHours() || d.getMinutes())) t += ' a las ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    return t;
  }
  function lunesDe(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }

  var HOY = new Date(); HOY.setHours(0, 0, 0, 0);
  var HOY_ISO = iso(HOY);

  // ---------- estado de la pantalla ----------
  var ancla = new Date(HOY.getFullYear(), HOY.getMonth(), HOY.getDate());
  var vista = 'agenda';                 // 'agenda' | 'semana' | 'mes' — la agenda manda
  /* Clave propia: la web pública guarda su vista aparte y allí no hay agenda */
  var CLAVE_VISTA = 'apolana-portal-cal-vista';
  try {
    var g = localStorage.getItem(CLAVE_VISTA);
    if (g === 'agenda' || g === 'semana' || g === 'mes') vista = g;
  } catch (e) { /* modo privado */ }

  var foco = 'todo';                    // 'todo' | 'competiciones' | 'mio'
  var fTipos = {}, fSecs = {}, soloAbiertas = false;
  var diaElegido = HOY_ISO;             // el día que se lee debajo de la rejilla del mes
  var atletas = [], atleta = null, falloFichas = false;
  var GRUPOS = {}, SECCIONES = [];
  var ACTIVIDADES = [], PROXIMA = null;
  var USOS_CUBO = 0, HAY_CUBO = false, FALLO_BONO = false;
  var ventanaCargada = '';
  var modalClave = null, modalAviso = '';
  var ultimoFoco = null;
  var FICHAS = {};                      // datos extra de una competición, ya consultados

  // ---------- periodo visible y ventana de carga ----------
  function periodo() {
    if (vista === 'mes') {
      return { ini: new Date(ancla.getFullYear(), ancla.getMonth(), 1),
               fin: new Date(ancla.getFullYear(), ancla.getMonth() + 1, 0) };
    }
    var l = lunesDe(ancla);
    return { ini: l, fin: new Date(l.getFullYear(), l.getMonth(), l.getDate() + 6) };
  }
  /* Se cargan meses enteros: así una semana a caballo entre dos meses sale
     completa. La agenda mira hacia delante: de hoy a cuatro meses vista. */
  function ventana() {
    if (vista === 'agenda') {
      return { desde: HOY_ISO, hasta: iso(new Date(HOY.getFullYear(), HOY.getMonth() + 4, 0)) };
    }
    var p = periodo();
    return { desde: iso(new Date(p.ini.getFullYear(), p.ini.getMonth(), 1)),
             hasta: iso(new Date(p.fin.getFullYear(), p.fin.getMonth() + 1, 0)) };
  }
  function claveVentana() { var v = ventana(); return v.desde + '|' + v.hasta; }

  // ============================================================
  //  CARGA DE DATOS · un solo calendario, cinco fuentes
  // ============================================================
  /* Qué fuentes no se han podido leer en la última carga. Un calendario vacío
     porque ha fallado la consulta se veía exactamente igual que un calendario
     sin nada apuntado, y eso hace que alguien no vaya a un entreno que sí hay. */
  var FALLOS = [];

  async function cargar() {
    var v = ventana(), desde = v.desde, hasta = v.hasta;
    ventanaCargada = claveVentana();
    var acts = [];
    FALLOS = [];
    function falla(que) { if (FALLOS.indexOf(que) === -1) FALLOS.push(que); }

    // --- grupos (lectura pública): nombres y secciones para los filtros ---
    try {
      var rg = await sb.from('grupos').select('id,nombre,seccion');
      if (!rg.error && rg.data) {
        GRUPOS = {}; var secs = {};
        rg.data.forEach(function (g2) { GRUPOS[g2.id] = g2; if (g2.seccion && g2.seccion !== 'cubo') secs[g2.seccion] = true; });
        SECCIONES = Object.keys(secs).sort(function (a, b) {
          return seccionNombre(a).localeCompare(seccionNombre(b), 'es');
        });
      }
    } catch (e) { /* sin grupos, el calendario sigue funcionando */ }

    // --- 1) MIS entrenamientos (tabla `sesiones`, con su permiso de siempre) ---
    var mias = {};
    try {
      var rm = await sb.from('sesiones')
        .select('id,fecha,hora,titulo,tipo,rol,lugar,grupo_id,atletas_ids')
        .eq('publicada', true).gte('fecha', desde).lte('fecha', hasta);
      if (rm.error) falla('los entrenamientos');
      else (rm.data || []).forEach(function (s) {
        var deMiGrupo = atleta && s.grupo_id && s.grupo_id === atleta.grupo_id;
        var paraMi = atleta && s.atletas_ids && s.atletas_ids.indexOf(atleta.id) >= 0;
        if (deMiGrupo || paraMi) mias[s.id] = s;
      });
    } catch (e) { falla('los entrenamientos'); }

    // --- 2) LO QUE HACE TODO EL CLUB (vista `sesiones_agenda`) ---
    var vistas = {};
    try {
      var ra = await sb.from('sesiones_agenda').select('*').gte('fecha', desde).lte('fecha', hasta);
      if (!ra.error && ra.data) ra.data.forEach(function (s) { vistas[s.sesion_id] = s; });
    } catch (e) { /* si la vista aún no está, se ven solo las propias */ }

    // Mis apuntados a entrenamientos abiertos
    var misEntrenos = {};
    if (atleta) {
      try {
        var ri = await sb.from('sesion_inscripciones').select('sesion_id').eq('atleta_id', atleta.id);
        if (!ri.error && ri.data) ri.data.forEach(function (x) { misEntrenos[x.sesion_id] = true; });
      } catch (e) { /* nada */ }
    }

    var miSeccion = (atleta && atleta.grupo_id && GRUPOS[atleta.grupo_id]) ? GRUPOS[atleta.grupo_id].seccion : null;

    // Unimos las dos lecturas de entrenamientos por id
    var ids = {};
    Object.keys(vistas).forEach(function (k) { ids[k] = true; });
    Object.keys(mias).forEach(function (k) { ids[k] = true; });

    Object.keys(ids).forEach(function (id) {
      var v2 = vistas[id] || {}, m = mias[id] || {};
      if ((v2.tipo || m.tipo) === 'descanso') return;          // día de descanso, no es una actividad
      var grupo = GRUPOS[v2.grupo_id || m.grupo_id] || null;
      var mio = !!mias[id];
      var abierta = !!v2.abierta_inscripcion;
      var apuntado = !!misEntrenos[id];
      var f = v2.fecha || m.fecha;
      var pasado = f < HOY_ISO;
      var seccionOk = !v2.abierta_a || v2.abierta_a.indexOf(miSeccion) >= 0;
      var completa = (v2.plazas != null && v2.libres != null && v2.libres <= 0);

      var estado, clase, accion = null, nota = '';
      if (apuntado) {
        estado = 'Ya apuntado'; clase = 'ok';
        if (!pasado) accion = { tipo: 'quitar-sesion', id: id, texto: 'Quitarme', estilo: 'fantasma' };
      } else if (mio) {
        estado = 'Tu entreno'; clase = 'mia';
      } else if (!abierta) {
        estado = 'Solo para su grupo'; clase = '';
      } else if (pasado) {
        estado = 'Cerrada'; clase = 'no';
      } else if (!seccionOk) {
        estado = 'Solo para tu grupo'; clase = '';
        nota = 'Abierto solo a: ' + (v2.abierta_a || []).map(seccionNombre).filter(Boolean).join(', ') + '.';
      } else if (completa) {
        estado = 'Completa'; clase = 'no';
        nota = 'Ya no quedan plazas.';
      } else {
        estado = 'Abierta'; clase = 'ok';
        accion = { tipo: 'apuntar-sesion', id: id, texto: 'Me apunto', estilo: 'primario' };
      }

      acts.push({
        fuente: 'entreno', id: id, fecha: f, hora: hhmm(v2.hora || m.hora),
        titulo: v2.titulo || m.titulo || 'Entrenamiento',
        tipoTexto: 'Entrenamiento',
        grupo: grupo ? grupo.nombre : '', lugar: v2.lugar || m.lugar || '',
        seccion: grupo ? grupo.seccion : null,
        plazas: v2.plazas, apuntados: v2.apuntados, libres: v2.libres,
        abiertaA: v2.abierta_a || null,
        mio: mio || apuntado, puedo: !!accion && accion.tipo === 'apuntar-sesion',
        estado: estado, pillClase: clase, nota: nota, accion: accion,
        contacto: { href: '../mensajes/', texto: 'Escribir a tu entrenador' }
      });
    });

    // --- 3) EL CUBO (si ya existe; si no, el calendario no se rompe) ---
    HAY_CUBO = false;
    var reservas = {};
    try {
      var rc = await sb.from('cubo_clases_ocupacion').select('*')
        .eq('activa', true).gte('fecha', desde).lte('fecha', hasta);
      if (rc.error) falla('las clases de El Cubo');
      if (!rc.error && rc.data) {
        HAY_CUBO = true;
        if (atleta) {
          var rr = await sb.from('cubo_reservas').select('clase_id,estado').eq('atleta_id', atleta.id);
          if (!rr.error && rr.data) rr.data.forEach(function (x) { reservas[x.clase_id] = x.estado; });
        }
        var ahora = new Date();
        rc.data.forEach(function (c) {
          var mi = reservas[c.clase_id];
          var apuntado = (mi === 'reservada' || mi === 'asistida');
          var enEspera = (mi === 'lista_espera');
          var empezada = (new Date(c.fecha + 'T' + (c.hora_inicio || '00:00:00')) < ahora);
          var completa = (c.libres <= 0);

          var estado, clase, accion = null, nota = '';
          if (apuntado) {
            estado = 'Ya apuntado'; clase = 'ok';
            if (!empezada) accion = { tipo: 'quitar-cubo', id: c.clase_id, texto: 'Quitarme', estilo: 'fantasma' };
          } else if (enEspera) {
            estado = 'En lista de espera'; clase = 'espera';
            if (!empezada) accion = { tipo: 'quitar-cubo', id: c.clase_id, texto: 'Salir de la lista', estilo: 'fantasma' };
          } else if (empezada) {
            estado = 'Cerrada'; clase = 'no';
          } else if (completa) {
            estado = 'Completa'; clase = 'no';
            accion = { tipo: 'apuntar-cubo', id: c.clase_id, texto: 'Apuntarme a la lista de espera', estilo: 'fantasma' };
          } else {
            estado = 'Abierta'; clase = 'ok';
            accion = { tipo: 'apuntar-cubo', id: c.clase_id, texto: 'Me apunto · gasta 1 uso', estilo: 'primario' };
            nota = 'Apuntarte gasta un uso de tu bono de El Cubo.';
          }

          acts.push({
            fuente: 'cubo', id: c.clase_id, fecha: c.fecha, hora: hhmm(c.hora_inicio), horaFin: hhmm(c.hora_fin),
            titulo: c.titulo || 'Clase de El Cubo', tipoTexto: 'Clase de El Cubo',
            grupo: c.monitor ? 'Con ' + c.monitor : '', lugar: 'El Cubo · sala del club', seccion: null,
            plazas: c.plazas, apuntados: c.ocupadas, libres: c.libres,
            descripcion: c.notas || '',
            mio: apuntado || enEspera, puedo: !!accion && accion.tipo === 'apuntar-cubo' && !completa,
            estado: estado, pillClase: clase, nota: nota, accion: accion,
            contacto: { href: '../cubo/', texto: 'Ver mi bono de El Cubo' }
          });
        });
      }
    } catch (e) { HAY_CUBO = false; falla('las clases de El Cubo'); }

    // --- 4) COMPETICIONES (se apunta en /portal/competiciones/) ---
    var misComps = {};
    if (atleta) {
      try {
        var rca = await sb.from('competicion_atleta').select('id,competicion_id,prueba,estado').eq('atleta_id', atleta.id);
        if (!rca.error && rca.data) rca.data.forEach(function (x) {
          if (x.estado !== 'cancelada') (misComps[x.competicion_id] = misComps[x.competicion_id] || []).push(x);
        });
      } catch (e) { /* nada */ }
    }

    PROXIMA = null;
    try {
      var rcp = await sb.from('competiciones')
        .select('id,nombre,sede,fecha_inicio,ambito,coste,fecha_limite_interna,inscripcion_abierta,circular_url')
        .order('fecha_inicio', { ascending: true });
      if (rcp.error) falla('las competiciones');
      if (!rcp.error && rcp.data) {
        rcp.data.forEach(function (c) {
          var plazoFin = c.fecha_limite_interna ? new Date(c.fecha_limite_interna) : null;
          var plazoPasado = plazoFin ? (plazoFin.getTime() < Date.now()) : false;
          var abierta = !!c.inscripcion_abierta && !plazoPasado;
          var apuntado = !!misComps[c.id];
          var coste = parseFloat(c.coste) || 0;

          if (!PROXIMA && c.fecha_inicio && c.fecha_inicio >= HOY_ISO) {
            PROXIMA = { c: c, abierta: abierta, apuntado: apuntado, coste: coste };
          }

          // La competición, el día que se corre
          if (c.fecha_inicio && c.fecha_inicio >= desde && c.fecha_inicio <= hasta) {
            var estado, clase, accion = null, nota = '';
            if (plazoPasado) { estado = 'Cerrada'; clase = 'no'; nota = 'El plazo del club ya pasó.'; }
            else if (abierta) { estado = 'Abierta'; clase = 'ok'; }
            else { estado = 'Cerrada'; clase = ''; nota = 'El club todavía no ha abierto esta competición.'; }
            if (apuntado) {
              estado = 'Le has dicho al club que vas'; clase = 'ok';
              nota = 'Tus pruebas: ' + misComps[c.id].map(function (x) { return x.prueba; }).filter(Boolean).join(', ') + '.';
            }

            // El botón lleva a la inscripción real de la organización; si no hay enlace, a la ficha del club.
            if (c.circular_url && !plazoPasado) {
              accion = { tipo: 'enlace', href: c.circular_url, texto: 'Ir a la inscripción', estilo: 'primario', fuera: true };
            } else if (!plazoPasado) {
              accion = { tipo: 'enlace', href: '../competiciones/?id=' + c.id, texto: 'Ver esta competición', estilo: 'primario' };
            }

            acts.push({
              fuente: 'competicion', id: c.id, compId: c.id, fecha: c.fecha_inicio, hora: '',
              titulo: c.nombre, tipoTexto: 'Competición', ambito: c.ambito || '',
              grupo: '', lugar: c.sede || '', seccion: null,
              coste: coste, circular: c.circular_url || '',
              limite: c.fecha_limite_interna || null, plazoPasado: plazoPasado,
              mio: apuntado, puedo: !plazoPasado && abierta,
              inscripcion: apuntado ? misComps[c.id] : null,
              estado: estado, pillClase: clase, nota: nota, accion: accion,
              contacto: { href: '../competiciones/?id=' + c.id, texto: 'Ver esta competición' }
            });
          }

          // El día en que se cierra la inscripción
          if (c.fecha_limite_interna) {
            var fl = String(c.fecha_limite_interna).slice(0, 10);
            if (fl >= desde && fl <= hasta) {
              acts.push({
                fuente: 'cierre', id: c.id + '-cierre', compId: c.id, fecha: fl,
                hora: hhmm(String(c.fecha_limite_interna).slice(11, 16)),
                titulo: 'Cierra la inscripción · ' + c.nombre,
                tipoTexto: 'Último día para apuntarse',
                grupo: '', lugar: c.sede || '', seccion: null,
                coste: coste, circular: c.circular_url || '',
                limite: c.fecha_limite_interna, plazoPasado: plazoPasado,
                mio: apuntado, puedo: abierta && !apuntado,
                inscripcion: apuntado ? misComps[c.id] : null,
                estado: plazoPasado ? 'Cerrada' : (apuntado ? 'Le has dicho al club que vas' : 'Abierta'),
                pillClase: plazoPasado ? 'no' : (apuntado ? 'ok' : 'espera'),
                nota: 'La competición es el ' + fechaLarga(c.fecha_inicio) + '.',
                accion: plazoPasado ? null : (
                  c.circular_url
                    ? { tipo: 'enlace', href: c.circular_url, texto: 'Ir a la inscripción', estilo: 'primario', fuera: true }
                    : { tipo: 'enlace', href: '../competiciones/?id=' + c.id, texto: 'Ver esta competición', estilo: 'primario' }
                ),
                contacto: { href: '../competiciones/?id=' + c.id, texto: 'Ver esta competición' }
              });
            }
          }
        });
      }
    } catch (e) { falla('las competiciones'); }

    // --- 5) EVENTOS DEL CLUB ---
    var misEventos = {};
    if (atleta) {
      try {
        var rie = await sb.from('inscripciones_eventos').select('evento_id,estado').eq('atleta_id', atleta.id);
        if (!rie.error && rie.data) rie.data.forEach(function (x) { if (x.estado !== 'baja') misEventos[x.evento_id] = true; });
      } catch (e) { /* nada */ }
    }
    try {
      var re = await sb.from('eventos').select('id,titulo,descripcion,tipo,fecha_inicio,lugar,seccion,inscripcion_abierta')
        .gte('fecha_inicio', desde + 'T00:00:00').lte('fecha_inicio', hasta + 'T23:59:59');
      if (re.error) falla('los eventos del club');
      if (!re.error && re.data) {
        re.data.forEach(function (v3) {
          var f = String(v3.fecha_inicio).slice(0, 10);
          var h = String(v3.fecha_inicio).slice(11, 16);
          var apuntado = !!misEventos[v3.id];
          acts.push({
            fuente: v3.tipo === 'competicion' ? 'competicion' : 'evento', id: v3.id, fecha: f,
            hora: (h === '00:00' ? '' : h),
            titulo: v3.titulo, tipoTexto: v3.tipo === 'competicion' ? 'Competición' : 'Evento del club',
            grupo: (v3.seccion || []).map(seccionNombre).filter(Boolean).join(', '),
            lugar: v3.lugar || '',
            seccion: (v3.seccion && v3.seccion.length === 1) ? v3.seccion[0] : null,
            descripcion: v3.descripcion || '',
            mio: apuntado, puedo: false,
            estado: apuntado ? 'Ya apuntado' : (v3.inscripcion_abierta ? 'Abierta' : 'Cerrada'),
            pillClase: apuntado ? 'ok' : (v3.inscripcion_abierta ? 'ok' : ''),
            nota: (!apuntado && v3.inscripcion_abierta) ? 'Avisa al club o a tu entrenador para entrar.' : '',
            accion: null,
            contacto: { href: '../mensajes/', texto: 'Escribir al club' }
          });
        });
      }
    } catch (e) { falla('los eventos del club'); }

    ACTIVIDADES = acts;
    ACTIVIDADES.forEach(function (a, i) { a.i = i; a.clave = a.fuente + '|' + a.id + '|' + a.fecha; });
    fundirCompeticiones();

    // --- bonos ---
    USOS_CUBO = 0;
    FALLO_BONO = false;
    if (atleta) {
      try {
        var rb = await sb.from('cubo_bono_saldo').select('activo,caducado,usos_disponibles').eq('atleta_id', atleta.id);
        /* Decir «todavía no tienes bono» cuando ha fallado la consulta puede
           acabar en un segundo bono comprado sin necesidad. */
        if (rb.error) FALLO_BONO = true;
        else (rb.data || []).forEach(function (b) {
          if (b.activo && !b.caducado) USOS_CUBO += (b.usos_disponibles || 0);
        });
      } catch (e) { FALLO_BONO = true; }
    }
  }

  // ============================================================
  //  FICHA DE COMPETICIÓN · lo que hace falta el día de la carrera
  //  Solo se enseña lo que EXISTE en la base. Si el club todavía no
  //  ha rellenado un dato (o la columna no está), esa línea no sale.
  // ============================================================
  async function fichaCompeticion(compId) {
    if (!compId) return null;
    if (FICHAS[compId]) return FICHAS[compId];

    var f = { comp: null, total: 0, mia: null, avatares: [], sinNombre: 0 };

    try {
      var rc = await sb.from('competiciones').select('*').eq('id', compId).limit(1);
      if (!rc.error && rc.data && rc.data.length) f.comp = rc.data[0];
    } catch (e) { /* nada */ }

    /* Quién más va: se pide con el nombre del atleta y, si el permiso no lo
       deja, se reintenta sin nombres (así al menos sale el recuento). */
    var filas = null;
    try {
      var rj = await sb.from('competicion_atleta')
        .select('*,atletas(nombre,apellidos)').eq('competicion_id', compId);
      if (!rj.error && rj.data) filas = rj.data;
    } catch (e) { /* nada */ }
    if (!filas) {
      try {
        var rp = await sb.from('competicion_atleta').select('*').eq('competicion_id', compId);
        if (!rp.error && rp.data) filas = rp.data;
      } catch (e) { /* nada */ }
    }

    if (filas) {
      var porAtleta = {};
      filas.forEach(function (x) {
        if (x.estado === 'cancelada') return;
        if (!porAtleta[x.atleta_id]) porAtleta[x.atleta_id] = x;
        if (atleta && x.atleta_id === atleta.id) f.mia = x;
      });
      var claves = Object.keys(porAtleta);
      f.total = claves.length;
      claves.forEach(function (k) {
        var p = porAtleta[k].atletas;
        var nom = p ? ((p.nombre || '') + ' ' + (p.apellidos || '')).trim() : '';
        if (nom) f.avatares.push(iniciales(nom));
        else f.sinNombre++;
      });
    }

    FICHAS[compId] = f;
    return f;
  }

  function iniciales(nombre) {
    var partes = String(nombre).trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return '·';
    if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
    return (partes[0].charAt(0) + partes[1].charAt(0)).toUpperCase();
  }

  // ============================================================
  //  FILTROS
  // ============================================================
  function algunoDe(o) { var l = []; for (var k in o) if (o[k]) l.push(k); return l; }
  function numFiltros() {
    return algunoDe(fTipos).length + algunoDe(fSecs).length +
           (foco === 'todo' ? 0 : 1) + (soloAbiertas ? 1 : 0);
  }

  function esCompeticion(a) { return a.fuente === 'competicion' || a.fuente === 'cierre'; }

  function pasaFiltro(a) {
    if (foco === 'competiciones' && !esCompeticion(a)) return false;
    if (foco === 'mio' && !a.mio) return false;
    var t = algunoDe(fTipos);
    if (t.length) {
      var f = a.fuente === 'cierre' ? 'competicion' : a.fuente;
      if (t.indexOf(f) < 0) return false;
    }
    var s = algunoDe(fSecs);
    if (s.length && (!a.seccion || s.indexOf(a.seccion) < 0)) return false;
    if (soloAbiertas && !a.puedo) return false;
    return true;
  }

  /* Una misma cita puede llegar por dos vías (la tabla de competiciones y la
     de eventos del club). Se agrupan por día y título y se queda la más útil. */
  function claveTitulo(t) {
    return String(t || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .split('·')[0].replace(/\s+/g, ' ').trim();
  }
  /* Una competición puede llegar por dos vías (tabla de competiciones y eventos
     del club). Repartimos el enlace de inscripción, el coste y el plazo a todas
     las copias para que el botón no se pierda por el camino. */
  function fundirCompeticiones() {
    var ficha = {};
    ACTIVIDADES.forEach(function (a) {
      if (a.fuente !== 'competicion') return;
      var f = ficha[claveTitulo(a.titulo)] || (ficha[claveTitulo(a.titulo)] = {});
      if (!f.compId && a.compId) f.compId = a.compId;
      if (!f.circular && a.circular) f.circular = a.circular;
      if (!f.coste && a.coste) f.coste = a.coste;
      if (!f.limite && a.limite) { f.limite = a.limite; f.plazoPasado = a.plazoPasado; }
    });
    ACTIVIDADES.forEach(function (a) {
      if (a.fuente !== 'competicion') return;
      var f = ficha[claveTitulo(a.titulo)];
      if (!f) return;
      if (!a.compId) a.compId = f.compId;
      if (!a.circular) a.circular = f.circular;
      if (!a.coste) a.coste = f.coste;
      if (!a.limite && f.limite) { a.limite = f.limite; a.plazoPasado = f.plazoPasado; }
      if (!a.accion && !a.plazoPasado && (a.circular || a.compId)) {
        a.accion = a.circular
          ? { tipo: 'enlace', href: a.circular, texto: 'Ir a la inscripción', estilo: 'primario', fuera: true }
          : { tipo: 'enlace', href: '../competiciones/?id=' + a.compId, texto: 'Ver esta competición', estilo: 'primario' };
      }
    });
  }

  function sinRepetidos(lista) {
    var vistos = {}, salida = [];
    lista.forEach(function (a) {
      var k = a.fuente + '|' + claveTitulo(a.titulo);
      var ya = vistos[k];
      if (ya === undefined) { vistos[k] = salida.length; salida.push(a); return; }
      var previo = salida[ya];
      var mejor = (!!a.accion && !previo.accion) ||
                  (!!a.accion === !!previo.accion && (a.lugar || '').length > (previo.lugar || '').length);
      if (mejor) salida[ya] = a;
    });
    return salida;
  }

  function porDia() {
    var m = {};
    ACTIVIDADES.filter(pasaFiltro).forEach(function (a) { (m[a.fecha] = m[a.fecha] || []).push(a); });
    Object.keys(m).forEach(function (k) {
      m[k] = sinRepetidos(m[k]);
      m[k].sort(function (x, y) {
        if (!x.hora && y.hora) return 1;
        if (x.hora && !y.hora) return -1;
        return x.hora < y.hora ? -1 : (x.hora > y.hora ? 1 : 0);
      });
    });
    return m;
  }

  // ============================================================
  //  ETIQUETAS
  // ============================================================
  /* Primera línea: quién y qué ("La Tribu · series"). */
  function etiquetaCorta(a) {
    if (a.fuente === 'cubo') return a.titulo || 'El Cubo';
    if (a.fuente === 'competicion') return a.titulo || 'Competición';
    if (a.fuente === 'cierre') return a.titulo || 'Cierra la inscripción';
    if (a.fuente === 'evento') return a.titulo || 'Evento del club';
    var quien = a.grupo || seccionNombre(a.seccion);
    var que = a.titulo || 'Entrenamiento';
    if (!quien) return que;
    if (claveTitulo(quien) === claveTitulo(que)) return quien;   // no se repite el nombre
    return quien + ' · ' + que;
  }

  /* Segunda línea: dónde, o qué clase de cita es. */
  function subtitulo(a) {
    if (a.fuente === 'competicion') {
      return [a.tipoTexto, NOMBRE_AMBITO[a.ambito] || '', a.lugar].filter(Boolean).join(' · ');
    }
    if (a.fuente === 'cierre') return '';   // el cierre lleva su propio aviso
    if (a.fuente === 'cubo') return [a.lugar, a.grupo].filter(Boolean).join(' · ');
    return a.lugar || '';
  }

  /* En un cierre de inscripción lo único que importa es si estás dentro */
  function avisoCierre(a) {
    if (a.plazoPasado) return { txt: 'El plazo ya cerró', dentro: false };
    if (a.mio) return { txt: 'Ya le has dicho al club que vas', dentro: true };
    return { txt: 'Todavía no te has apuntado', dentro: false };
  }

  // ============================================================
  //  PINTAR
  // ============================================================
  function rotulo() {
    if (vista === 'agenda') return 'Calendario';
    if (vista === 'mes') return mayus(MESES[ancla.getMonth()]) + ' ' + ancla.getFullYear();
    var p = periodo();
    if (p.ini.getMonth() === p.fin.getMonth()) return p.ini.getDate() + '–' + p.fin.getDate() + ' de ' + MESES[p.fin.getMonth()];
    return p.ini.getDate() + ' ' + MESES_CORTO[p.ini.getMonth()] + ' – ' + p.fin.getDate() + ' ' + MESES_CORTO[p.fin.getMonth()];
  }

  /* ---- una tarjeta de la agenda ---- */
  function tarjeta(a) {
    var clases = ['tarj', 'k-' + a.fuente];
    if (a.mio && a.fuente !== 'cierre') clases.push('mia');
    var sub = subtitulo(a);
    var subHtml = '';
    if (a.fuente === 'cierre') {
      var av = avisoCierre(a);
      subHtml = '<span class="sub' + (av.dentro ? ' dentro' : '') + '">' + esc(av.txt) + '</span>';
    } else if (sub) {
      subHtml = '<span class="sub">' + esc(sub) + '</span>';
    }
    /* Sin hora, la columna se queda en blanco: un guion no dice nada y la
       alineación se mantiene igual, que es para lo que está la columna. */
    return '<button type="button" class="' + clases.join(' ') + '" data-act="' + a.i + '">' +
      '<span class="hh">' + esc(a.hora || '') + '</span>' +
      '<span class="med"><span class="tit">' + esc(etiquetaCorta(a)) + '</span>' + subHtml + '</span>' +
      '<span class="chev" aria-hidden="true">›</span></button>';
  }

  /* ---- AGENDA: lista continua, saltando los días vacíos ---- */
  function pintarAgenda(mapa) {
    var claves = Object.keys(mapa).filter(function (k) { return k >= HOY_ISO && mapa[k].length; }).sort();
    if (!claves.length) {
      /* Con una consulta caída no se dice que no hay nada apuntado: eso ya lo
         explica el aviso de arriba, y aquí sería contradecirlo. */
      if (FALLOS.length && !numFiltros()) return '';
      return numFiltros()
        ? APOLANA_UI.vacio('Con estos filtros no queda nada por delante',
            'Hay más cosas en el calendario, pero se quedan fuera de lo que has elegido ver. ' +
            'Los filtros que tienes puestos están aquí arriba: quítalos y vuelve a verlo todo.')
        : APOLANA_UI.vacio('Todavía no hay nada apuntado',
            'Aquí irán apareciendo los entrenos, las clases de El Cubo y las competiciones en cuanto el club las publique. Lo que se repite cada semana está en «El día en el club».',
            APOLANA_UI.boton('Ver el día en el club', '../../horarios/'));
    }
    var h = '<div class="agenda">';
    claves.forEach(function (k) {
      var esHoy = (k === HOY_ISO);
      h += '<div class="sep-dia' + (esHoy ? ' hoy' : '') + '">' +
        '<span class="txt">' + esc(esHoy ? 'Hoy · ' + fechaCorta(k) : mayus(fechaCorta(k))) + '</span>' +
        '<span class="raya"></span></div>';
      h += mapa[k].map(tarjeta).join('');
    });
    return h + '</div>';
  }

  /* ---- SEMANA: una fila por día ---- */
  function pintarSemana(mapa) {
    var p = periodo(), h = '<div class="semana">';
    for (var i = 0; i < 7; i++) {
      var d = new Date(p.ini.getFullYear(), p.ini.getMonth(), p.ini.getDate() + i);
      var f = iso(d);
      var lista = mapa[f] || [];
      var esHoy = (f === HOY_ISO);
      h += '<div class="fila-dia' + (esHoy ? ' hoy' : '') + '">' +
        '<div class="cual"><span class="dd">' + esc(esHoy ? 'Hoy' : mayus(DIAS_CORTO[d.getDay()])) + '</span>' +
        '<span class="nn">' + d.getDate() + '</span></div><div class="lista">';
      if (!lista.length) {
        h += '<span class="nada">Nada programado' + (numFiltros() ? ' con estos filtros' : '') + '.</span>';
      } else {
        h += lista.map(function (a) {
          return '<button type="button" class="lin k-' + a.fuente + (a.mio ? ' mia' : '') + '" data-act="' + a.i + '">' +
            '<span class="hh">' + esc(a.hora || '') + '</span>' +
            '<span class="tt">' + esc(etiquetaCorta(a)) + '</span></button>';
        }).join('');
      }
      h += '</div></div>';
    }
    return h + '</div>';
  }

  /* ---- MES: solo puntos, y debajo el día elegido ---- */
  function pintarMes(mapa) {
    var y = ancla.getFullYear(), m = ancla.getMonth();
    var pd = new Date(y, m, 1), ud = new Date(y, m + 1, 0);
    var hueco = (pd.getDay() + 6) % 7;
    var celdas = Math.ceil((hueco + ud.getDate()) / 7) * 7;

    var h = '<div class="rejilla"><div class="semana-cab">' +
      ['L','M','X','J','V','S','D'].map(function (d) { return '<span>' + d + '</span>'; }).join('') +
      '</div><div class="dias">';

    for (var i = 0; i < celdas; i++) {
      var n = i - hueco + 1;
      if (n < 1 || n > ud.getDate()) {
        var otra = new Date(y, m, n);
        h += '<span class="dia fuera">' + otra.getDate() + '</span>';
        continue;
      }
      var f = y + '-' + pad(m + 1) + '-' + pad(n);
      var lista = mapa[f] || [];
      var puntos = '';
      ['competicion', 'cierre', 'evento', 'cubo', 'entreno'].forEach(function (k) {
        if (lista.some(function (a) { return a.fuente === k; })) puntos += '<i class="p-' + k + '"></i>';
      });
      var cls = 'dia' + (f === HOY_ISO ? ' hoy' : '') + (f === diaElegido ? ' elegido' : '');
      h += '<button type="button" class="' + cls + '" data-elegir="' + f + '" ' +
        'aria-label="' + esc(mayus(fechaLarga(f)) + ': ' + (lista.length ? lista.length + ' actividades' : 'sin actividades')) + '">' +
        n + '<span class="puntos">' + puntos + '</span></button>';
    }
    h += '</div></div>';

    /* La rejilla es para navegar; para leer, el detalle de abajo */
    var sel = mapa[diaElegido] || [];
    h += '<div class="detalle-dia">' +
      '<div class="sep-dia' + (diaElegido === HOY_ISO ? ' hoy' : '') + '">' +
      '<span class="txt">' + esc(mayus(fechaLarga(diaElegido)) + (diaElegido === HOY_ISO ? ' · hoy' : '')) + '</span>' +
      '<span class="raya"></span></div>';
    if (sel.length) {
      h += sel.map(tarjeta).join('');
    } else if (numFiltros()) {
      h += APOLANA_UI.vacio('Ese día no hay nada con estos filtros',
        'Puede que sí haya algo fuera de lo que has elegido ver. Los filtros puestos están arriba, ' +
        'sobre la rejilla: quítalos y mira otra vez.');
    } else if (!FALLOS.length) {
      /* Con una consulta caída no se dice que ese día no hay nada: eso ya lo
         explica el aviso de arriba, y aquí sería contradecirlo. */
      h += APOLANA_UI.vacio('Ese día no hay nada apuntado',
        'Toca otro día de la rejilla, o mira los entrenos que se repiten cada semana.',
        APOLANA_UI.boton('Ver el día en el club', '../../horarios/'));
    }
    return h + '</div>';
  }

  function pintarBonos() {
    if (!atleta && falloFichas) {
      return '<div class="bonos"><span class="eti">Tu bono de El Cubo</span>' +
             '<span class="txt">No hemos podido cargar tu ficha: puede ser tu conexión. No significa que no la ' +
             'tengas, solo que ahora no podemos enseñarte tu bono ni dejarte apuntarte. Vuelve a entrar en un ' +
             'momento.</span></div>';
    }
    if (!atleta) {
      return '<div class="bonos"><span class="eti">Tu bono de El Cubo</span>' +
             '<span class="txt">Tu cuenta todavía no está unida a ninguna ficha de atleta, así que aquí no ' +
             'podemos enseñarte bonos ni dejarte apuntarte. Escríbenos y la unimos. Mientras tanto puedes ' +
             'ver todo lo que hace el club en el calendario.</span>' +
             '<a href="../mensajes/">Escribir al club</a></div>';
    }
    var h = '<div class="bonos"><span class="eti">Tu bono de El Cubo</span>';
    if (atletas.length > 1) {
      h += '<select id="sel-atleta" aria-label="Elegir a quién ves">' + atletas.map(function (a) {
        return '<option value="' + a.id + '"' + (atleta && a.id === atleta.id ? ' selected' : '') + '>' +
               esc(((a.nombre || '') + ' ' + (a.apellidos || '')).trim()) + '</option>';
      }).join('') + '</select>';
    }
    /* Un cero suelto transmite abandono. Sin usos se dice qué es un bono y
       dónde se saca; con usos, la cifra en monoespaciada y su rótulo debajo. */
    if (USOS_CUBO) {
      h += '<div class="par">' +
        '<span class="cel"><span class="cifra">' + USOS_CUBO + '</span>' +
        '<span class="txt">usos del bono de El Cubo' + (HAY_CUBO ? '' : ' (aún sin clases publicadas)') + '</span></span>' +
        '</div>' +
        '<span class="txt">El bono es solo de El Cubo: cada clase gasta un uso. Los entrenamientos del club no gastan bono, ' +
        'y las competiciones se pagan en la web de quien las organiza, nunca aquí.</span>';
    } else if (FALLO_BONO) {
      h += '<span class="txt">No hemos podido consultar tu bono: puede ser tu conexión. Si tenías usos, ahí siguen. ' +
        'Antes de sacar otro, entra otra vez y compruébalo.</span>';
    } else {
      h += '<span class="txt">Todavía no tienes bono. El bono es solo de El Cubo: se compra por usos y cada clase ' +
        'gasta uno. Los entrenamientos del club no gastan bono, y las competiciones se pagan en la web de quien ' +
        'las organiza.</span>';
    }

  function pintarProxima() {

      return '<div class="proxima"><span class="eti">Próxima competición</span>' +
             '<p class="datos" style="margin:0">Todavía no hay ninguna competición publicada. En cuanto el club suba ' +

             '<a class="btn btn--fantasma btn--sm" href="../competiciones/">Ver las competiciones</a></div>';

      ? '<a class="btn btn--primario btn--sm" href="' + esc(c.circular_url) + '" target="_blank" rel="noopener">Ir a la inscripción</a>'

      (c.fecha_limite_interna ? ' antes del ' + plazoLargo(c.fecha_limite_interna) : ' cuanto antes') + '.';

    return '<div class="proxima"><span class="eti">Próxima competición</span>' +
           '<h3>' + esc(c.nombre) + '</h3>' +
           '<span class="datos">' + esc(datos) + '</span>' +
           (pie ? '<span class="datos">' + esc(pie) + '</span>' : '') + boton + '</div>';
