  function pintarChips() {
    var cont = document.getElementById('cal-chips');
    var texto = document.getElementById('filtros-texto');
    var boton = document.getElementById('abrir-filtros');
    var n = algunoDe(fTipos).length + algunoDe(fSecs).length + (soloAbiertas ? 1 : 0);

    /* El botón no cuenta filtros: se dice qué está puesto, y eso se ve en los
       chips de aquí abajo, cada uno con su aspa. */
    texto.textContent = 'Filtrar';
    boton.classList.toggle('con-filtros', n > 0);

    if (!n) { cont.innerHTML = ''; return; }
    var h = '';
    algunoDe(fTipos).forEach(function (id) {
      var t = NOMBRE_TIPO[id] || mayus(id);
      h += '<button type="button" class="chip-filtro" data-quitar="tipo" data-id="' + esc(id) + '" ' +
        'aria-label="' + esc('Quitar el filtro ' + t) + '">' + esc(t) + ' <span class="aspa" aria-hidden="true">✕</span></button>';
    });
    algunoDe(fSecs).forEach(function (id) {
      var t2 = seccionNombre(id);
      h += '<button type="button" class="chip-filtro" data-quitar="sec" data-id="' + esc(id) + '" ' +
        'aria-label="' + esc('Quitar el filtro ' + t2) + '">' + esc(t2) + ' <span class="aspa" aria-hidden="true">✕</span></button>';
    });
    if (soloAbiertas) {
      h += '<button type="button" class="chip-filtro" data-quitar="abierto" data-id="abierto" ' +
        'aria-label="Quitar el filtro Donde puedo apuntarme">Donde puedo apuntarme <span class="aspa" aria-hidden="true">✕</span></button>';
    }
    h += '<button type="button" class="enlace-quitar" id="quitar-filtros-barra">Quitar filtros</button>';
    cont.innerHTML = h;
  }

  /* Lo que no se ha podido leer se dice arriba del calendario, con un botón
     que vuelve a pedir SOLO los datos: recargar la página entera devolvería a
     la vista de agenda y al mes de hoy, perdiendo dónde estaba mirando. */
  var REINTENTOS = {}, nRe = 0;
  function htmlError(titulo, texto, fn) {
    var k = 'r' + (++nRe);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="' + k + '">Volver a intentarlo</button>' : null);
  }
  async function recargar() {
    document.getElementById('cal-vista').innerHTML = APOLANA_UI.cargando('filas', 5);
    ventanaCargada = '';
    await cargar();
    pintar();
  }
  function htmlFallos() {
    if (!FALLOS.length) return '';
    var que = FALLOS.length === 1 ? FALLOS[0]
      : FALLOS.slice(0, -1).join(', ') + ' ni ' + FALLOS[FALLOS.length - 1];
    return htmlError('Falta parte del calendario',
      'No hemos podido leer ' + que + ': puede ser tu conexión. Lo que ves aquí no está completo, ' +
      'así que no des por hecho que un día está libre.', recargar);
  }

  function pintar() {
    var mapa = porDia();
    document.getElementById('cal-periodo').textContent = rotulo();
    document.getElementById('mes-nav').hidden = (vista === 'agenda');

    /* Antes había TRES botones de «Quitar filtros» a la vez: esta franja, el
       de la fila de chips y el del estado vacío. Queda uno solo, el de la fila
       de chips, que es donde se ve qué filtros hay puestos y se quitan de uno
       en uno con su aspa. */
    document.getElementById('cal-vista').innerHTML = htmlFallos() +
      (vista === 'agenda' ? pintarAgenda(mapa) : (vista === 'semana' ? pintarSemana(mapa) : pintarMes(mapa)));

    Array.prototype.forEach.call(document.querySelectorAll('#cal-vistas button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-v') === vista ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#cal-focos button[data-foco]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-foco') === foco ? 'true' : 'false');
    });
    pintarChips();

    document.getElementById('lado-bonos').innerHTML = pintarBonos();
    document.getElementById('lado-proxima').innerHTML = pintarProxima();
  }

  // ============================================================
  //  VENTANAS EMERGENTES
  // ============================================================
  function abrirModal(id) {
    ultimoFoco = document.activeElement;
    var m = document.getElementById(id);
    if (!m) return;
    m.hidden = false;
    document.body.style.overflow = 'hidden';
    var c = m.querySelector('.modal-cerrar');
    if (c) c.focus();
  }
  function cerrarModales() {
    ['modal-act', 'modal-filtros'].forEach(function (id) {
      var m = document.getElementById(id);
      if (m) m.hidden = true;
    });
    document.body.style.overflow = '';
    modalClave = null; modalAviso = '';
    if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
    ultimoFoco = null;
  }
  function fila(cual, valor) {
    if (!valor) return '';
    return '<div class="fila"><span class="cual">' + esc(cual) + '</span><span class="valor">' + valor + '</span></div>';
  }

  /* La ficha de la competición: dorsal, cajón, cuántos van, salida, quedada,
     cómo se reparten los dorsales y quién más va. Solo lo que hay en la base. */
  function bloqueCompeticion(a, f) {
    if (!f) return '';
    var h = '';

    var dorsal = primerDato(f.mia, COL_DORSAL);
    var cajon = primerDato(f.mia, COL_CAJON);
    var cifras = '';
    if (dorsal) cifras += '<span class="cel"><span class="num">' + esc(dorsal) + '</span><span class="que">Dorsal</span></span>';
    if (cajon) cifras += '<span class="cel"><span class="num">' + esc(cajon) + '</span><span class="que">Cajón</span></span>';
    if (f.total) cifras += '<span class="cel"><span class="num">' + f.total + '</span><span class="que">Del club</span></span>';

    if (cifras) {
      var estadoMia = f.mia ? (f.mia.estado === 'confirmada' ? 'Confirmada' : 'Apuntado') : '';
      h += '<div class="ficha-caja"><div class="arriba">' +
        '<span class="eti">' + (f.mia ? 'Tu inscripción' : 'La carrera') + '</span>' +
        (estadoMia ? '<span class="pill ok">' + esc(estadoMia) + '</span>' : '') +
        '</div><div class="cifras">' + cifras + '</div></div>';
    }

    var salida = primerDato(f.comp, COL_SALIDA);
    var quedada = primerDato(f.comp, COL_QUEDADA);
    var dorsales = primerDato(f.comp, COL_DORSALES);
    if (salida || quedada || dorsales) {
      h += '<div class="ficha-caja"><div class="modal-datos" style="margin:0">' +
        fila('Salida', esc(salida)) +
        fila('Quedada', esc(quedada)) +
        fila('Dorsales', esc(dorsales)) +
        '</div></div>';
    }

    if (f.total && (f.avatares.length || f.sinNombre)) {
      var av = f.avatares.slice(0, 4).map(function (t, i) {
        return '<span class="av" style="background:' + COLOR_AVATAR[i % COLOR_AVATAR.length] + '">' + esc(t) + '</span>';
      }).join('');
      var resto = f.total - Math.min(4, f.avatares.length);
      if (resto > 0) av += '<span class="av resto">+' + resto + '</span>';
      h += '<div class="ficha-caja"><span class="eti">Del club · ' + f.total +
        (f.total === 1 ? ' inscrito' : ' inscritos') + '</span>' +
        '<div class="gente">' + av + '</div></div>';
    }

    return h ? '<div class="ficha-comp">' + h + '</div>' : '';
  }

  function contenidoActividad(a, f) {
    var cuando = mayus(fechaLarga(a.fecha));
    if (a.hora) cuando += ' · ' + a.hora + (a.horaFin ? '–' + a.horaFin : '');

    var quien = a.grupo || seccionNombre(a.seccion);
    var plazas = '';
    if (a.plazas != null) {
      var libres = (a.libres != null) ? a.libres : Math.max(0, a.plazas - (a.apuntados || 0));
      plazas = libres > 0
        ? esc(libres + (libres === 1 ? ' plaza libre' : ' plazas libres') + ' de ' + a.plazas)
        : esc('Completo (' + a.plazas + ' plazas)');
    }
    var abiertaA = (a.abiertaA && a.abiertaA.length) ? esc(a.abiertaA.map(seccionNombre).filter(Boolean).join(', ')) : '';

    var h = '<div class="modal-cab"><div>' +
      '<span class="modal-eti ' + (COLOR_ETIQUETA[a.fuente] || '') + '">' + esc(a.tipoTexto || '') + '</span>' +
      '<h2 id="modal-act-titulo">' + esc(a.titulo) + '</h2></div>' +
      '<button type="button" class="modal-cerrar" data-cerrar aria-label="Cerrar">×</button></div>';

    var esComp = (a.fuente === 'competicion' || a.fuente === 'cierre');
    if (esComp) h += bloqueCompeticion(a, f);

    h += '<div class="modal-datos">' +
      fila('Cuándo', esc(cuando)) +
      fila('Dónde', esc(a.lugar || '')) +
      fila('Quién', esc(quien)) +
      fila('Abierto a', abiertaA) +
      fila('Plazas', plazas) +
      fila('Inscripción', a.coste ? esc(euros(a.coste)) : '') +
      fila('Plazo del club', a.limite ? esc(plazoLargo(a.limite)) : '') +
      fila('Estado', '<span class="pill ' + (a.pillClase || '') + '">' + esc(a.estado || '') + '</span>') +
      fila('Nota', esc(a.nota || a.descripcion || (f && f.comp ? (f.comp.notas || '') : ''))) +
      '</div>';

    /* Enlace a la ficha de esa competición concreta (solo si sabemos cuál es) */
    var verFicha = (esComp && a.compId)
      ? '<a class="btn btn--fantasma btn--sm" href="../competiciones/?id=' + esc(a.compId) + '">Ver esta competición</a>'
      : '<a class="btn btn--fantasma btn--sm" href="../competiciones/">Ver las competiciones</a>';

    h += '<div class="modal-pie">';
    if (modalAviso) {
      h += '<p class="' + (modalAviso.charAt(0) === '!' ? 'error' : 'ok') + '">' + esc(modalAviso.replace(/^!/, '')) + '</p>';
    }
    if (esComp) {
      /* En competiciones el club no cobra por la app: se va al enlace de la organización. */
      if (a.plazoPasado) {
        h += '<p>' + (a.limite ? 'El plazo del club cerró el ' + esc(plazoLargo(a.limite)) + '.' : 'El plazo del club ya está cerrado.') + '</p>' +
             '<div class="botones"><span class="btn--apagado">Plazo cerrado</span>' + verFicha + '</div>';
      } else if (a.circular) {
        h += '<div class="botones"><a class="btn btn--primario btn--sm" href="' + esc(a.circular) + '" target="_blank" rel="noopener">Ir a la inscripción</a>' + verFicha + '</div>' +
             '<p class="letra-chica">' +
               (a.coste ? 'Inscripción: <b>' + esc(euros(a.coste)) + '</b> — se paga en la web de la organización.<br>' : '') +
               (a.limite ? 'El plazo del club cierra el ' + esc(plazoLargo(a.limite)) + '.' : '') +
             '</p>';
      } else {
        h += '<p>Te apunta el club: avisa a tu entrenador' + (a.limite ? ' antes del ' + esc(plazoLargo(a.limite)) : ' cuanto antes') + '.</p>' +
             '<div class="botones"><a class="btn btn--primario btn--sm" href="../mensajes/">Escribir a tu entrenador</a>' + verFicha + '</div>';
      }
    } else if (!atleta) {
      h += '<p>Tu cuenta todavía no está enlazada a una ficha de atleta, así que no puedes apuntarte desde aquí. Avisa al club y lo enlazan.</p>' +
           '<div class="botones"><a class="btn btn--fantasma btn--sm" href="../mensajes/">Escribir al club</a></div>';
    } else if (a.accion && a.accion.tipo === 'enlace') {
      h += '<div class="botones"><a class="btn btn--' + a.accion.estilo + ' btn--sm" href="' + esc(a.accion.href) + '"' +
           (a.accion.fuera ? ' target="_blank" rel="noopener"' : '') + '>' + esc(a.accion.texto) + '</a></div>';
    } else if (a.accion) {
      h += '<div class="botones"><button type="button" class="btn btn--' + a.accion.estilo + ' btn--sm" ' +
           'data-accion="' + a.accion.tipo + '" data-id="' + esc(a.accion.id) + '">' + esc(a.accion.texto) + '</button></div>';
    } else {
      var porQue = a.estado === 'Completa'
        ? 'Ya no quedan plazas. Si te interesa, escribe a quien la lleva por si se libera alguna.'
        : (a.estado === 'Cerrada'
            ? 'Esta actividad ya está cerrada. Si tienes una duda, escribe a quien la lleva.'
            : 'Aquí no puedes apuntarte tú. Si quieres ir o tienes una duda, escribe a quien la lleva.');
      h += '<p>' + esc(porQue) + '</p>' +
           '<div class="botones"><a class="btn btn--fantasma btn--sm" href="' + esc(a.contacto.href) + '">' +
           esc(a.contacto.texto) + '</a></div>';
    }
    /* Copia fija del evento para el calendario del móvil */
    h += '<div class="botones ics"><button type="button" class="btn btn--neutro btn--sm" data-ics="' + a.i + '">Añadir a mi calendario</button></div>';

    /* Anular la inscripción: solo si de verdad se puede (apuntado y en plazo) */
    if (esComp && f && f.mia && !a.plazoPasado) {
      if (f.mia.estado === 'apuntado') {
        h += '<button type="button" class="btn-anular" data-accion="anular-competicion" data-id="' + esc(f.mia.id) + '">Anular mi inscripción</button>';
      } else {
        h += '<p class="letra-chica">Tu inscripción ya está confirmada por el club: para anularla, avisa a tu entrenador.</p>';
      }
    }
    h += '</div>';
    return h;
  }

  /* Arma el evento .ics a partir de una actividad del calendario */
  function icsDeActividad(a) {
    var partes = [];
    if (a.grupo) partes.push(a.grupo);
    else if (a.seccion) partes.push(seccionNombre(a.seccion));
    if (a.plazas != null) partes.push(a.plazas + (a.plazas === 1 ? ' plaza' : ' plazas'));
    if (a.coste) partes.push('Inscripción: ' + euros(a.coste) + ' (se paga en la web de la organización)');
    if (a.limite) partes.push('El plazo del club cierra el ' + plazoLargo(a.limite));
    if (a.descripcion) partes.push(a.descripcion);
    if (a.circular) partes.push('Inscripción: ' + a.circular);
    return {
      uid: (a.compId || a.fuente + '-' + a.id) + '-' + a.fecha,
      titulo: 'Apolana · ' + (a.titulo || 'Actividad'),
      fecha: a.fecha, hora: a.hora || '', horaFin: a.horaFin || '',
      lugar: a.lugar || '', descripcion: partes.join('\n')
    };
  }

  async function abrirActividad(a) {
    if (!a) return;
    modalClave = a.clave;
    var caja = document.getElementById('modal-act-caja');
    caja.innerHTML = contenidoActividad(a, null);
    abrirModal('modal-act');
    /* La ficha de la competición se pide después: la ventana se abre al toque */
    if ((a.fuente === 'competicion' || a.fuente === 'cierre') && a.compId) {
      var f = await fichaCompeticion(a.compId);
      if (modalClave === a.clave) caja.innerHTML = contenidoActividad(a, f);
    }
  }
  async function refrescarModal() {
    if (!modalClave) return;
    var a = ACTIVIDADES.filter(function (x) { return x.clave === modalClave; })[0];
    if (!a) { cerrarModales(); return; }
    var caja = document.getElementById('modal-act-caja');
    var esComp = (a.fuente === 'competicion' || a.fuente === 'cierre') && a.compId;
    caja.innerHTML = contenidoActividad(a, esComp ? (FICHAS[a.compId] || null) : null);
    /* Si la ficha se ha quedado sin datos (por ejemplo, al anular), se repite la consulta */
    if (esComp && !FICHAS[a.compId]) {
      var f = await fichaCompeticion(a.compId);
      if (modalClave === a.clave) caja.innerHTML = contenidoActividad(a, f);
    }
  }

  function pintarFiltros() {
    var tipos = [
      { id: 'competicion', txt: 'Competiciones' },
      { id: 'evento', txt: 'Eventos del club' },
      { id: 'cubo', txt: 'El Cubo' },
      { id: 'entreno', txt: 'Entrenamientos' }
    ];
    var h = '<div class="filtro-bloque"><h3>Qué quieres ver</h3><div class="filtro-ops" data-grupo="tipo">' +
      tipos.map(function (o) {
        return '<button type="button" data-id="' + esc(o.id) + '" aria-pressed="' + (fTipos[o.id] ? 'true' : 'false') + '">' + esc(o.txt) + '</button>';
      }).join('') + '</div></div>';

    if (SECCIONES.length) {
      h += '<div class="filtro-bloque"><h3>De qué grupo o sección</h3><div class="filtro-ops" data-grupo="sec">' +
        SECCIONES.map(function (s) {
          return '<button type="button" data-id="' + esc(s) + '" aria-pressed="' + (fSecs[s] ? 'true' : 'false') + '">' + esc(seccionNombre(s)) + '</button>';
        }).join('') + '</div></div>';
    }

    h += '<div class="filtro-bloque"><h3>Solo lo que puedo reservar</h3><div class="filtro-ops" data-grupo="abierto">' +
      '<button type="button" data-id="abierto" aria-pressed="' + (soloAbiertas ? 'true' : 'false') + '">Donde puedo apuntarme</button>' +
      '</div></div>';

    document.getElementById('filtros-cuerpo').innerHTML = h;
  }

  function limpiarFiltros() {
    fTipos = {}; fSecs = {}; soloAbiertas = false; foco = 'todo';
    pintarFiltros(); pintar();
  }

  // ============================================================
  //  NAVEGACIÓN Y ACCIONES
  // ============================================================
  function mover(paso) {
    if (paso === 0) {
      var n = new Date();
      ancla = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      diaElegido = HOY_ISO;
    }
    else if (vista === 'mes') {
      ancla = new Date(ancla.getFullYear(), ancla.getMonth() + paso, 1);
      diaElegido = iso(ancla);
    }
    else ancla = new Date(ancla.getFullYear(), ancla.getMonth(), ancla.getDate() + 7 * paso);
  }

  async function refrescarSiHaceFalta() {
    if (claveVentana() !== ventanaCargada) {
      document.getElementById('cal-vista').innerHTML = APOLANA_UI.cargando('filas', 5);
      await cargar();
    }
    pintar();
  }

  function mensajeError(e) {
    var m = (e && e.message) ? e.message : 'No se ha podido guardar.';
    if (e && e.code === '23505') return 'Ya estabas apuntado.';
    if (m.indexOf('row-level security') >= 0) return 'No puedes apuntarte a esta actividad.';
    return m;
  }

  wrap.addEventListener('click', async function (ev) {
    var t = ev.target.closest ? ev.target.closest(
      '[data-cerrar],[data-accion],[data-ics],[data-act],[data-elegir],[data-paso],[data-v],[data-foco],' +
      '[data-quitar],[data-id],[data-reintento],#abrir-filtros,#filtros-limpiar,#quitar-filtros-barra') : null;

    // cerrar pulsando el fondo de una ventana emergente
    if (ev.target.classList && ev.target.classList.contains('modal')) { cerrarModales(); return; }
    if (!t) return;

    if (t.hasAttribute('data-ics')) {
      var aIcs = ACTIVIDADES[+t.getAttribute('data-ics')];
      if (aIcs) icsDescargar(icsDeActividad(aIcs));
      return;
    }

    if (t.hasAttribute('data-reintento')) {
      var fnRe = REINTENTOS[t.getAttribute('data-reintento')];
      if (fnRe) await fnRe();
      return;
    }

    if (t.hasAttribute('data-cerrar')) { cerrarModales(); return; }

    if (t.hasAttribute('data-v')) {
      vista = t.getAttribute('data-v');
      try { localStorage.setItem(CLAVE_VISTA, vista); } catch (e) { /* modo privado */ }
      await refrescarSiHaceFalta();
      return;
    }

    if (t.hasAttribute('data-foco')) { foco = t.getAttribute('data-foco'); pintar(); return; }

    if (t.hasAttribute('data-paso')) { mover(+t.getAttribute('data-paso')); await refrescarSiHaceFalta(); return; }

    /* En la vista de mes la rejilla solo elige el día; se lee abajo */
    if (t.hasAttribute('data-elegir')) { diaElegido = t.getAttribute('data-elegir'); pintar(); return; }

    if (t.hasAttribute('data-act')) { await abrirActividad(ACTIVIDADES[+t.getAttribute('data-act')]); return; }

    // filtros
    if (t.id === 'abrir-filtros') { pintarFiltros(); abrirModal('modal-filtros'); return; }
    if (t.id === 'filtros-limpiar' || t.id === 'quitar-filtros-barra') { limpiarFiltros(); return; }
    if (t.hasAttribute('data-quitar')) {
      var q = t.getAttribute('data-quitar');
      if (q === 'abierto') soloAbiertas = false;
      else delete (q === 'tipo' ? fTipos : fSecs)[t.getAttribute('data-id')];
      pintarFiltros(); pintar();
      return;
    }
    if (t.hasAttribute('data-id') && t.parentNode && t.parentNode.getAttribute('data-grupo')) {
      var grupo = t.parentNode.getAttribute('data-grupo');
      var id = t.getAttribute('data-id');
      if (grupo === 'abierto') {
        soloAbiertas = !soloAbiertas;
        t.setAttribute('aria-pressed', soloAbiertas ? 'true' : 'false');
      } else {
        var mapa = grupo === 'tipo' ? fTipos : fSecs;
        mapa[id] = !mapa[id];
        t.setAttribute('aria-pressed', mapa[id] ? 'true' : 'false');
      }
      pintar();
      return;
    }

    // apuntarse / quitarse
    var acc = t.getAttribute('data-accion');
    if (!acc) return;
    var idAcc = t.getAttribute('data-id');
    if (!atleta) { modalAviso = '!Tu cuenta todavía no tiene ficha de atleta. Avisa al club.'; await refrescarModal(); return; }
    t.disabled = true; t.textContent = 'Un momento…';

    var r;
    if (acc === 'apuntar-sesion') {
      r = await sb.from('sesion_inscripciones').insert({ sesion_id: idAcc, atleta_id: atleta.id });
      modalAviso = r.error ? '!' + mensajeError(r.error) : 'Apuntado. Ya estás en la lista.';
    } else if (acc === 'quitar-sesion') {
      r = await sb.from('sesion_inscripciones').delete().eq('sesion_id', idAcc).eq('atleta_id', atleta.id);
      modalAviso = r.error ? '!' + mensajeError(r.error) : 'Te has quitado.';
    } else if (acc === 'apuntar-cubo') {
      r = await sb.rpc('cubo_apuntarme', { p_clase: idAcc, p_atleta: atleta.id });
      if (r.error) modalAviso = '!' + mensajeError(r.error);
      else modalAviso = (r.data === 'lista_espera')
        ? 'La clase está completa: te hemos puesto en la lista de espera. Si queda una plaza, te avisamos.'
        : 'Apuntado. Se te descuenta un uso del bono.';
    } else if (acc === 'quitar-cubo') {
      r = await sb.rpc('cubo_desapuntarme', { p_clase: idAcc, p_atleta: atleta.id });
      modalAviso = r.error ? '!' + mensajeError(r.error) : 'Te has quitado de la clase.';
    } else if (acc === 'anular-competicion') {
      r = await sb.from('competicion_atleta').delete().eq('id', idAcc).eq('atleta_id', atleta.id);
      modalAviso = r.error ? '!' + mensajeError(r.error) : 'Has anulado tu inscripción. Avisa a tu entrenador si es de última hora.';
      FICHAS = {};   // la ficha cambia: se vuelve a pedir
    } else { return; }

    await cargar();
    pintar();
    await refrescarModal();
  });

  wrap.addEventListener('change', async function (ev) {
    if (!ev.target || ev.target.id !== 'sel-atleta') return;
    var id = ev.target.value;
    atleta = atletas.filter(function (a) { return a.id === id; })[0] || atleta;
    FICHAS = {};
    document.getElementById('cal-vista').innerHTML = APOLANA_UI.cargando('filas', 5);
    await cargar(); pintar();
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') cerrarModales(); });

  // ============================================================
  //  ARRANQUE
  // ============================================================
  try {
    var raa = await sb.from('atletas').select('id,nombre,apellidos,grupo_id').order('nombre');
    /* Si la consulta falla no se dice que la cuenta no tiene ficha: eso hace
       escribir al club por un problema que no existe. */
    falloFichas = !!raa.error;
    atletas = raa.error ? [] : (raa.data || []);
  } catch (e) { atletas = []; falloFichas = true; }
  atleta = atletas.length ? atletas[0] : null;

  wrap.innerHTML = armazon();
  await cargar();
  pintar();
});
</script>

</body>
</html>
