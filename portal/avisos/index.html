<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos al móvil · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/avisos.js" defer></script>
<style>
  /* ============================================================
     AVISOS DEL SOCIO
     ------------------------------------------------------------
     Dos pantallas en una dirección:

       …/avisos/          → el historial: sin leer, leídos, y los que
                            ya pasaron (tachados, nunca borrados).
       …/avisos/?id=…     → un aviso abierto, que es a donde lleva el
                            aviso del móvil al tocarlo.

     Y debajo, siempre, los ajustes: de qué te avisamos y el botón de
     activarlos. Ese orden no es capricho (maqueta 44b): el permiso
     del teléfono se pide UNA VEZ EN LA VIDA, así que primero se elige
     de qué y solo después se pide.

     LOS TRES NIVELES · maqueta «4 · Avisos y pagos», apartado A
       informativo  #6E8CA6 sobre #FBF9F4 · novedades y crónicas
       importante   #E08A18 sobre #FDF6EA · te cambia la semana
       grave        #B3261E sobre #FBECEB · seguridad y nada más

     REGLA QUE NO SE SALTA: el color nunca va solo. Cada aviso lleva
     SIEMPRE la palabra escrita —«Importante», «Aviso grave»— porque
     una parte de los socios no distingue bien el ámbar del rojo.

     NO HAY TARJETA NAVY EN EL AVISO. El navy es para bloques de una
     línea; un texto que hay que leer entero pide fondo claro.
     ============================================================ */
  body { background: var(--crema); }

  .av { --pad: clamp(14px,4vw,28px);
        max-width: 560px; margin: 0 auto; padding: 0 var(--pad) 8px; }
  /* Los bloques que van de lado a lado, como en la maqueta. */
  .ancho { margin-inline: calc(-1 * var(--pad)); }

  /* ---------- cabecera de navegación · 54 px ---------- */
  .cab { display:flex; align-items:center; gap:14px; height:54px; box-sizing:border-box;
         padding:0 var(--pad); border-bottom:1px solid var(--linea-marcada);
         margin-inline: calc(-1 * var(--pad)); text-decoration:none; }
  .cab .flecha { font-size:20px; line-height:1; color: var(--azul-oscuro); }
  .cab h1 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px;
            line-height:1; color: var(--navy); margin:0; font-weight:700; }

  /* Rótulos: 13 px, minúscula, sin espaciado (fundamentos, punto 0). */
  .rotulo { font-size:13px; line-height:1.4; color: var(--texto-suave); margin: 18px 2px 8px; }
  .rotulo .guardado { color: var(--verde); margin-left:8px; opacity:0; transition:opacity .2s; }
  .rotulo .guardado.si { opacity:1; }

  /* ---------- 1 · el trato, la única tarjeta navy ---------- */
  .trato { background: var(--navy); border-radius:14px; padding:16px 18px; margin-top:16px; }
  .trato h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:24px; line-height:1.05;
              color:#fff; margin:0 0 9px; }
  .trato p { margin:0; font-size:15px; line-height:1.5; color: rgba(255,255,255,.82); }

  /* ============================================================
     EL AVISO ABIERTO
     ============================================================ */
  .lectura { --n-color:#6E8CA6; --n-fondo:#FBF9F4; --n-borde:#DCD3C0; --n-chip:#141C24; }
  .lectura[data-nivel="importante"] { --n-color:#E08A18; --n-fondo:#FDF6EA; --n-borde:#EBD9B8; --n-chip:#141C24; }
  .lectura[data-nivel="grave"]      { --n-color:#B3261E; --n-fondo:#FBECEB; --n-borde:#E7C4C1; --n-chip:#fff; }

  .lectura .franja { background: var(--n-fondo); border-bottom:1px solid var(--n-borde);
                  padding: 22px var(--pad) 20px; display:flex; flex-direction:column; gap:13px; }
  .lectura .quien { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  /* La palabra del nivel. Nunca falta: es la mitad del mensaje. */
  .lectura .marca { padding:5px 11px; border-radius:999px; background: var(--n-color); color: var(--n-chip);
                 font-size:12px; font-weight:500; letter-spacing:.04em; text-transform:uppercase; line-height:1; }
  .lectura .de-que { font-size:14px; line-height:1; color: var(--texto-suave); }
  .lectura h2 { font-family: var(--fuente-titulo); font-weight:700; font-size:33px; line-height:.98;
              text-transform:uppercase; color: var(--navy); margin:0; overflow-wrap:anywhere; }
  /* La fecha va ARRIBA, con el remitente: es contexto para leer, no un
     pie de página. */
  .lectura .cuando { font-size:14px; line-height:1.4; color: var(--texto-suave); }

  .lectura .cuerpo { padding: 20px var(--pad); display:flex; flex-direction:column; gap:14px; }
  .lectura .cuerpo p { margin:0; font-size:16px; line-height:1.6; color: var(--texto); overflow-wrap:anywhere; }
  /* Un solo botón, y con el azul de la casa: el #3B85C0 de la maqueta
     no llega a 4,5:1 con texto blanco encima y aquí lleva texto. */
  .lectura .ir { display:flex; align-items:center; justify-content:center; min-height:50px;
               border-radius:999px; background: var(--azul); color:#fff; text-decoration:none;
               font-size:16px; font-weight:500; margin-top:4px; }
  .lectura .ir:hover { background: var(--azul-hover); color:#fff; }
  /* Ojo con el orden: `.lectura .cuerpo p` también alcanza a esta línea
     y pesa más, así que aquí se nombra el elemento a propósito. */
  .lectura .cuerpo p.envio { border-top:1px solid #EFE9DC; padding-top:14px; font-size:14px;
                             line-height:1.5; color: var(--texto-suave); }
  /* Un aviso que ya no vale se dice, no se esconde. */
  .lectura .paso { display:block; margin-top:2px; font-size:14px; line-height:1.5; color: var(--texto-suave); }

  .no-esta { margin:16px 0 0; background:#fff; border:1px solid var(--linea-marcada); border-radius:14px;
             padding:15px 17px; }
  .no-esta h2 { font-size:15px; font-weight:600; line-height:1.35; color: var(--navy); margin:0 0 6px; }
  .no-esta p { margin:0; font-size:15px; line-height:1.5; color: var(--texto); }

  /* ---------- «Anteriores», al pie del aviso abierto ---------- */
  .anteriores { background: var(--crema-banda); border-top:1px solid var(--linea-marcada); }
  .anteriores h3 { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase;
                   font-size:20px; line-height:1; color: var(--navy);
                   padding:16px var(--pad) 12px; margin:0; }
  .anteriores .hfila:hover { background:#EAE1CE; }
  .anteriores .rotulo-hist { padding-top:8px; }
  /* Sobre la banda crema el azul de enlace se queda en 4,4:1. Aquí va
     el tono oscuro, que llega de sobra. */
  .anteriores .marcar,
  .anteriores .pie-hist button { color: var(--azul-hover); }

  /* ---------- 2 · los interruptores ---------- */
  /* Un solo contenedor con separadores: diez tarjetas no son una lista (kit 30d). */
  .tipos { background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; overflow:hidden; }
  .tipo { display:flex; align-items:center; gap:14px; padding:13px 15px; min-height:48px; box-sizing:border-box;
          border-bottom:1px solid var(--linea); cursor:pointer; }
  .tipo:last-child { border-bottom:0; }
  .tipo:hover { background: var(--crema); }
  .tipo input { position:absolute; opacity:0; width:1px; height:1px; }
  .tipo .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .tipo .txt b { font-size:15px; font-weight:400; line-height:1.35; color: var(--navy); }
  /* La frecuencia va escrita en cada uno: lo que da miedo no es el aviso,
     es no saber cuántos van a llegar. */
  .tipo .txt small { font-size:14px; line-height:1.4; color: var(--texto-suave); }
  .palanca { flex:0 0 52px; width:52px; height:30px; border-radius:999px; background:#E2DCCE; position:relative;
             transition:background .15s; }
  .palanca::after { content:''; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:999px;
                    background:#fff; transition:transform .15s; }
  .tipo input:checked + .palanca { background: var(--azul); }
  .tipo input:checked + .palanca::after { transform: translateX(22px); }
  .tipo input:focus-visible + .palanca { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:3px; }
  .tipo input:disabled + .palanca { opacity:.55; }

  /* ---------- avisos y explicaciones ---------- */
  .banda { background: var(--crema-banda); border-radius:14px; padding:13px 15px; display:flex; align-items:center;
           gap:12px; margin-top:12px; }
  .banda .ic { flex:0 0 20px; width:20px; height:20px; color: var(--texto); }
  .banda p { margin:0; font-size:14px; line-height:1.45; color: var(--texto); }

  .caja { background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; padding:15px 17px;
          display:flex; flex-direction:column; gap:10px; }
  .caja h2 { font-size:15px; font-weight:600; line-height:1.35; color: var(--navy); }
  .caja p { margin:0; font-size:15px; line-height:1.5; color: var(--texto); }
  .caja .aparato { font-size:14px; color: var(--texto-suave); }

  /* Lo que no se puede arreglar desde aquí va en ámbar, nunca en rojo:
     el rojo se reserva para cuando la persona se ha equivocado. */
  .caja--ambar { background: var(--ambar-fondo); border-color: var(--ambar-borde); }
  .caja--ambar h2, .caja--ambar p, .caja--ambar a { color:#6B5227; }
  .caja--ambar .ruta { font-size:15px; font-weight:600; color:#6B5227; }

  /* ---------- 3 · el pie, que es lo último que se ve ---------- */
  .acciones { margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .bot { display:flex; align-items:center; justify-content:center; width:100%; box-sizing:border-box;
         min-height:52px; padding:13px 22px; border:0; border-radius:999px; cursor:pointer;
         font-family:inherit; font-size:16px; font-weight:600; line-height:1.2;
         background: var(--azul); color:#fff; text-decoration:none; }
  .bot:hover { background: var(--azul-hover, #1E4E78); color:#fff; }
  .bot[disabled] { opacity:.6; cursor:default; }
  .bot--borde { background:#fff; color: var(--navy); border:1px solid #C9C0AE; min-height:46px; font-size:15px; }
  .bot--borde:hover { background: var(--crema); color: var(--navy); }
  .caja--ambar .bot--borde { border-color:#E0CDA8; color:#6B5227; }
  .caja--ambar .bot--borde:hover { background:#fff; color:#6B5227; }
  /* «Ahora no», nunca «No, gracias»: sin culpa y sin letra pequeña. */
  .ahora-no { display:flex; align-items:center; justify-content:center; min-height:44px; background:none; border:0;
              font-family:inherit; font-size:15px; color: var(--texto-suave); text-decoration:none; cursor:pointer; }
  .ahora-no:hover { color: var(--navy); }

  /* ============================================================
     EL HISTORIAL · sin leer y leídos
     ------------------------------------------------------------
     Es EL MISMO DISEÑO con tres cambios, no dos tarjetas distintas:
     el punto de color, el peso del título y —si es importante o
     grave— el fondo de la fila.
     ============================================================ */
  .rotulo-hist { padding: 18px var(--pad) 8px; font-size:12px; font-weight:500; letter-spacing:.09em;
             text-transform:uppercase; color: var(--texto-suave); }
  /* Se toca con el pulgar y va justo encima de la lista de avisos: por debajo de
     44 px se acaba abriendo el primer aviso sin querer (kit 30f). */
  .marcar { display:inline-flex; align-items:center; min-height:44px; background:none; border:0;
            padding:0 0 0 12px; margin:-11px 0; font-family:inherit; font-size:15px;
            color: var(--azul-oscuro); cursor:pointer; text-transform:none; letter-spacing:0; float:right; }
  .marcar:hover { color: var(--azul-hover); text-decoration:underline; }

  /* Cada fila se abre: es la misma pantalla del aviso a la que lleva el
     móvil, así que aquí también se toca y se lee entero. */
  .hfila { display:flex; gap:12px; padding:14px var(--pad); border-top:1px solid #EFE9DC;
           text-decoration:none; color:inherit; }
  .hfila:last-of-type { border-bottom:1px solid #EFE9DC; }
  .hfila:hover { background: var(--crema-media); }
  .hfila .punto { flex:none; width:8px; height:8px; border-radius:999px; margin-top:6px; background:transparent; }
  .hfila .txt { flex:1; min-width:0; }
  .hfila .tit { display:block; font-size:16px; line-height:1.35; color: var(--texto);
                overflow-wrap:anywhere; }
  .hfila .meta { display:block; margin-top:4px; font-size:14px; line-height:1.4; color: var(--texto-suave); }

  /* Sin leer: punto del color del nivel y título en semibold. */
  .hfila.nueva .tit { font-weight:600; color: var(--navy); }
  .hfila.nueva[data-nivel="informativo"] .punto { background:#6E8CA6; }
  .hfila.nueva[data-nivel="importante"]  .punto { background:#E08A18; }
  .hfila.nueva[data-nivel="grave"]       .punto { background:#B3261E; }
  /* Y si además pesa, la fila entera va sobre su fondo. */
  .hfila.nueva[data-nivel="importante"] { background:#FDF6EA; border-color:#EBD9B8; }
  .hfila.nueva[data-nivel="importante"] + .hfila { border-top-color:#EBD9B8; }
  .hfila.nueva[data-nivel="grave"] { background:#FBECEB; border-color:#E7C4C1; }
  .hfila.nueva[data-nivel="grave"] + .hfila { border-top-color:#E7C4C1; }

  /* Ya pasó: se tacha, no se borra. Borrarlo hace dudar de si lo
     leíste o te lo inventaste. */
  .hfila.paso .tit { color: var(--texto-suave); text-decoration:line-through;
                     text-decoration-color:#C6BEAE; text-decoration-thickness:1px; }

  .pie-hist { padding: 18px var(--pad) 6px; display:flex; flex-direction:column; gap:6px; }
  .pie-hist button { display:inline-flex; align-items:center; align-self:flex-start; min-height:44px;
                     background:none; border:0; padding:0; font-family:inherit;
                     font-size:15px; line-height:1.4; color: var(--azul-oscuro); cursor:pointer; }
  .pie-hist button:hover { color: var(--azul-hover); text-decoration:underline; }
  .pie-hist small { font-size:13px; line-height:1.45; color: var(--texto-suave); }

  /* Donde acaban los avisos y empiezan los ajustes. Una raya basta. */
  .ajustes { margin-top:20px; padding-top:4px; border-top:1px solid var(--linea); }
  .nota { margin:8px 2px 0; font-size:14px; line-height:1.45; color: var(--texto-suave); }
</style>
</head>
<body>

<div id="portal-contenido">
  <main class="av">
    <a class="cab" id="av-volver" href="../"><span class="flecha" aria-hidden="true">←</span><h1>Avisos</h1></a>
    <div id="av-cuerpo"><div class="ap-esq" data-esq="tarjeta"></div></div>
  </main>
</div>

<script>
/* ============================================================
   Esta pantalla NO usa `APOLANA_AVISOS.montar()`: montar pinta el
   botón antes que nada, y aquí el orden es justo el contrario
   (primero se elige, después se pide). Sí usa todo lo demás del
   módulo —estado, activar, desactivar, preferencias— que es donde
   viven la detección de aparato y el permiso.
   ============================================================ */
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var cuerpo = document.getElementById('av-cuerpo');
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function ic(n, t) { return (window.APOLANA_UI && APOLANA_UI.icono) ? APOLANA_UI.icono(n, t || 20) : ''; }

  /* Cuenta sin ficha del club: no hay dónde guardar nada, así que se
     dice y se para. Mejor eso que unos interruptores que no guardan. */
  if (!perfil || !perfil.id) {
    cuerpo.innerHTML = APOLANA_UI.vacio('Todavía no encontramos tu ficha en el club',
      'Has entrado bien, pero tu cuenta aún no está enlazada con una ficha, y los avisos van a la ficha. Avisa al club y lo dejan listo.',
      APOLANA_UI.boton('Escribir al club', '../../contacto/'));
    return;
  }

  /* --------------------------------------------------------------
     LOS CINCO TIPOS, con la frecuencia escrita y el valor de fábrica
     que pide la maqueta 44b. Las claves son las de `avisos.js` y las
     de la tabla `avisos_preferencias` (migración 054).
     ⚠️ «Mis retos» va apagado de fábrica; en la base de datos el
     valor por defecto todavía es «encendido». Mientras no se cambie
     allí, esta pantalla lo enseña apagado y lo guarda apagado en
     cuanto la persona toca algo o activa los avisos.
     -------------------------------------------------------------- */
  var TIPOS = [
    /* Aquí va también la respuesta a una plaza pedida: «tienes plaza» o
       «no ha podido ser». Es lo que le cambia el día a quien la pidió,
       así que vive con los cambios de entrenamiento y no en un
       interruptor propio que nadie sabría distinguir de este. */
    { clave: 'entrenos',      titulo: 'Cambios en mi entrenamiento', frecuencia: 'Cancelaciones, cambios de hora y respuestas a una plaza', defecto: true  },
    { clave: 'competiciones', titulo: 'Competiciones',         frecuencia: 'Cuando cierra una inscripción',   defecto: true  },
    { clave: 'pagos',         titulo: 'Pagos',                 frecuencia: 'Solo si algo sale mal',           defecto: true  },
    { clave: 'noticias',      titulo: 'Noticias del club',     frecuencia: 'Como mucho una a la semana',      defecto: false },
    { clave: 'retos',         titulo: 'Mis retos',             frecuencia: 'Cuando consigues uno',            defecto: false },
    /* Este solo lo ven quienes tienen algo que revisar: las altas y los
       pedidos, administración y contabilidad; las peticiones de plaza,
       quien lleva las actividades. Al resto no se le enseña: sería un
       interruptor de algo que no le va a llegar nunca.
       Y apagarlo NO es dejar de enterarse: las altas se siguen viendo
       al entrar al panel, en «Necesita tu atención», y las peticiones de
       plaza en su pantalla. Lo que se apaga es el ruido, no el trabajo. */
    { clave: 'gestion',       titulo: 'Lo que tienes que revisar', frecuencia: 'Altas, pedidos y peticiones de plaza · uno por bandeja', defecto: true,
      papeles: ['admin', 'contabilidad', 'entrenador', 'coordinador'] }
  ].filter(function (t) {
    if (!t.papeles) return true;
    var mios = (perfil && perfil.roles && perfil.roles.length)
      ? perfil.roles
      : (perfil && perfil.rol ? [perfil.rol] : []);
    return t.papeles.some(function (p) { return mios.indexOf(p) !== -1; });
  });

  var PREFS = {};
  TIPOS.forEach(function (t) { PREFS[t.clave] = t.defecto; });

  async function cargarPreferencias() {
    /* Se pide la fila guardada UNA vez. Antes se preguntaba dos veces por
       lo mismo: `preferencias()` para los valores y otra consulta aparte
       solo para saber si la fila existía. Ahora `preferenciasGuardadas()`
       devuelve la fila tal cual, o null si esta persona todavía no ha
       tocado nada, que es justo lo que hace falta saber.
       Sin fila mandan los valores de fábrica de esta pantalla, que ya
       están puestos en PREFS. */
    var fila = null;
    try { fila = await APOLANA_AVISOS.preferenciasGuardadas(); } catch (e) { fila = null; }
    if (!fila) return;
    TIPOS.forEach(function (t) {
      if (typeof fila[t.clave] === 'boolean') PREFS[t.clave] = fila[t.clave];
    });
  }

  var guardando = null;
  function guardarPronto() {
    clearTimeout(guardando);
    guardando = setTimeout(async function () {
      var r = await APOLANA_AVISOS.guardarPreferencias(PREFS);
      var m = document.getElementById('av-guardado');
      if (r && r.ok) {
        if (m) { m.textContent = 'Guardado'; m.classList.add('si'); setTimeout(function () { m.classList.remove('si'); }, 1800); }
      } else if (window.APX) {
        APX.toast((r && r.mensaje) || 'No se ha podido guardar.', 'error');
      }
    }, 500);
  }

  /* --------------------------------------------------------------
     LAS PIEZAS DE LA PÁGINA
     -------------------------------------------------------------- */
  function trato() {
    return '<div class="trato">' +
      '<h2>Te avisamos de lo que no te puedes perder</h2>' +
      '<p>Si se cancela un entrenamiento por lluvia, si cierra la inscripción de una carrera o si hay un recibo devuelto. Nada más.</p>' +
    '</div>';
  }

  function lista(rotulo) {
    return '<p class="rotulo">' + esc(rotulo) + '<span class="guardado" id="av-guardado" role="status"></span></p>' +
      '<div class="tipos">' + TIPOS.map(function (t) {
        return '<label class="tipo">' +
          '<span class="txt"><b>' + esc(t.titulo) + '</b><small>' + esc(t.frecuencia) + '</small></span>' +
          '<input type="checkbox" data-tipo="' + t.clave + '"' + (PREFS[t.clave] ? ' checked' : '') + '>' +
          '<span class="palanca"></span>' +
        '</label>';
      }).join('') + '</div>';
  }

  function banda(texto) {
    return '<div class="franja">' + ic('aviso', 20) + '<p>' + esc(texto) + '</p></div>';
  }

  function correo() {
    var dir = (perfil && perfil.email) ? perfil.email : '';
    return '<div class="caja" style="margin-top:12px">' +
      '<h2>Mientras tanto, por correo</h2>' +
      '<p>Lo importante te lo mandamos ' + (dir ? 'a ' + esc(dir) : 'a tu correo') + '. Llega más tarde, pero llega.</p>' +
      '<p class="aparato">Si ese no es tu correo, se cambia en <a href="../perfil/">Mi perfil</a>.</p>' +
    '</div>';
  }

  /* --------------------------------------------------------------
     LO RECIBIDO · los avisos quedan aquí aunque no suenen en el móvil
     ---------------------------------------------------------------
     Los trae `mis_avisos()` (migraciones 082 y 083), que es la única
     forma de que una persona vea SUS avisos: la tabla `avisos_enviados`
     solo la lee el equipo del club. La función respeta a quién iba cada
     aviso y lo que cada uno ha elegido recibir, así que aquí no puede
     asomarse el aviso de otro.
     -------------------------------------------------------------- */
  var CATEGORIA = {
    entrenos: 'Entrenamientos', competiciones: 'Competiciones', pagos: 'Pagos',
    noticias: 'Noticias del club', retos: 'Mis retos', gestion: 'Lo que hay que revisar'
  };

  /* El color nunca va solo. Esta es la palabra que lo acompaña siempre,
     tanto en la banda del aviso abierto como en la lista. */
  var NIVEL = {
    informativo: { chip: 'Informativo', lista: 'Informativo' },
    importante:  { chip: 'Importante',  lista: 'Importante'  },
    grave:       { chip: 'Aviso grave', lista: 'Aviso grave' }
  };
  function nivelDe(f) { return NIVEL[f.nivel] ? f.nivel : 'informativo'; }

  function cuando(iso) {
    var d = new Date(iso);
    var dias = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 86400000);
    if (dias <= 0) return 'hoy ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (dias === 1) return 'ayer ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  }

  /* En el aviso abierto la fecha va entera: quien llega aquí desde el
     móvil quiere saber si esto es de esta tarde o de la semana pasada. */
  function cuandoLargo(iso) {
    var d = new Date(iso);
    var hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    var dias = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(iso).setHours(0, 0, 0, 0)) / 86400000);
    if (dias <= 0) return 'Hoy a las ' + hora;
    if (dias === 1) return 'Ayer a las ' + hora;
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' }) + ' a las ' + hora;
  }

  function dia(fecha) {
    try {
      return new Date(fecha + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
    } catch (e) { return fecha; }
  }

  var MESES = 3;                 /* la ventana que se enseña de entrada */

  /* Reintentar solo esta pantalla, sin recargar la página: lo que la persona
     haya tocado en los interruptores ya está guardado, pero recargar la manda
     al principio de la lista y hace perder el aviso que estaba leyendo. */
  var REINTENTOS = {}, nRe = 0;
  function htmlError(titulo, texto, fn) {
    var k = 'r' + (++nRe);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="' + k + '">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (fn) fn();
  });

  /* Devuelve SIEMPRE si ha podido mirar o no. Antes, cuando la consulta
     fallaba, esto devolvía una lista vacía y la pantalla se quedaba muda: la
     persona veía la promesa de «te avisamos» y ni uno de sus avisos, sin saber
     que había habido un fallo. */
  async function mis(opciones) {
    try {
      var r = await sb.rpc('mis_avisos', opciones || {});
      if (r && r.error) return { fallo: true, filas: [] };
      return { fallo: false, filas: (r && r.data) ? r.data : [] };
    } catch (e) { return { fallo: true, filas: [] }; }
  }

  /* --------------------------------------------------------------
     UNA FILA DE LA LISTA
     ---------------------------------------------------------------
     Es el mismo diseño con tres cambios —punto, peso del título y
     fondo—, no dos tarjetas distintas.
     -------------------------------------------------------------- */
  function fila(f) {
    var niv = nivelDe(f);
    var clases = 'hfila' + (f.leido ? '' : ' nueva') + (f.caducado ? ' paso' : '');
    /* Un aviso que ya no está en pie no se borra: se tacha y se dice
       por qué. */
    var meta = (f.caducado ? 'Ya pasó · ' : NIVEL[niv].lista + ' · ') +
               (f.publico_texto || CATEGORIA[f.categoria] || 'Aviso del club') + ' · ' + cuando(f.created_at);
    return '<a class="' + clases + '" data-nivel="' + niv + '" href="?id=' + encodeURIComponent(f.id) + '">' +
      '<span class="punto" aria-hidden="true"></span>' +
      '<span class="txt"><span class="tit">' + esc(f.titulo) + '</span>' +
      '<span class="meta">' + esc(meta) + '</span></span></a>';
  }

  /* La lista entera, partida en dos: sin leer arriba, leídos debajo. */
  function listaAvisos(filas) {
    var sinLeer = filas.filter(function (f) { return !f.leido; });
    var leidos  = filas.filter(function (f) { return f.leido; });
    var html = '';

    if (sinLeer.length) {
      html += '<p class="rotulo-hist">Sin leer' +
        (sinLeer.length > 1 ? '<button type="button" class="marcar" id="av-marcar">Marcar leídos</button>' : '') +
        '</p>' + sinLeer.map(fila).join('');
    }
    if (leidos.length) {
      html += '<p class="rotulo-hist">Leídos</p>' +
        leidos.map(fila).join('');
    }
    return html;
  }

  function pieHistorial() {
    /* Se guardan un año, y hasta ahí se puede mirar. Después se
       archivan solos. */
    return '<div class="pie-hist">' +
      (MESES < 12
        ? '<button type="button" id="av-mas">Ver los de meses anteriores</button>'
        : '<small>Estos son todos los del último año.</small>') +
      '<small>Los avisos se guardan un año. Aquí quedan aunque no te suenen en el móvil.</small>' +
    '</div>';
  }

  async function historial(abierto, titulo) {
    var r = await mis({ p_limite: 40, p_meses: MESES });
    if (r.fallo) {
      var caja = htmlError('No hemos podido cargar tus avisos',
        'Puede ser tu conexión. Tus avisos siguen guardados: no se ha borrado ninguno.', pintar);
      return titulo
        ? '<div class="anteriores ancho"><h3>' + esc(titulo) + '</h3><div style="padding:0 var(--pad) 16px">' + caja + '</div></div>'
        : '<div style="margin-top:16px">' + caja + '</div>';
    }
    var filas = r.filas;
    /* «Anteriores» son los OTROS: el que se está leyendo ya está
       arriba, entero. Repetirlo debajo solo hace ruido. */
    if (abierto) filas = filas.filter(function (f) { return f.id !== abierto; });
    if (!filas.length) return '';
    var lista = listaAvisos(filas) + pieHistorial();
    /* Al pie de un aviso abierto la lista va sobre la banda crema y con
       su rótulo; en la pantalla de avisos va sobre el fondo de página. */
    return titulo
      ? '<div class="anteriores ancho"><h3>' + esc(titulo) + '</h3>' + lista + '</div>'
      : '<div class="ancho">' + lista + '</div>';
  }

  /* --------------------------------------------------------------
     EL AVISO ABIERTO · lo que se ve al tocar el aviso en el móvil
     ---------------------------------------------------------------
     El aviso llega con su propia dirección (…/avisos/?id=…), así que
     tocarlo abre el aviso y no el portal a secas. Ocupa el sitio de la
     tarjeta navy: en modo consulta hay una sola.
     -------------------------------------------------------------- */
  function idPedido() {
    try { return new URLSearchParams(location.search).get('id') || ''; }
    catch (e) { return ''; }
  }

  /* El enlace dice A DÓNDE lleva, que es lo que la persona necesita
     saber antes de tocarlo. Son las mismas ocho pantallas que ofrece el
     panel al escribir el aviso; cualquier otra se queda en genérico. */
  var A_DONDE = [
    ['portal/calendario/',    'Ver el calendario'],
    ['portal/entreno/',       'Ver el entrenamiento de hoy'],
    ['portal/competiciones/', 'Ver las competiciones'],
    ['portal/recibos/',       'Ver mis recibos'],
    ['portal/marcas/',        'Ver mis marcas'],
    ['noticias/',             'Ver las noticias del club'],
    ['horarios/',             'Ver los horarios'],
    ['portal/',               'Ir al inicio de la app']
  ];

  function aDonde(url) {
    for (var i = 0; i < A_DONDE.length; i++) {
      if (url.indexOf(A_DONDE[i][0]) !== -1) return A_DONDE[i][1];
    }
    return 'Abrir la página de este aviso';
  }

  /* --------------------------------------------------------------
     EL AVISO, DE ARRIBA ABAJO
       banda del nivel · chip + tipo y grupo · titular · fecha y quien
       lo manda → texto → botón si lo hay → a quién se mandó
     -------------------------------------------------------------- */
  function pintarAviso(a) {
    /* El enlace solo se enseña si lleva a OTRA pantalla: uno que llevara
       aquí mismo sería un botón que no hace nada. */
    var lleva = (a.url && a.url.indexOf('portal/avisos/') === -1) ? a.url : '';
    var niv = nivelDe(a);

    /* Al lado del chip, de qué va y a quién iba. */
    var contexto = [CATEGORIA[a.categoria], a.publico_texto].filter(Boolean).join(' · ');
    /* Y debajo, cuándo y quién: es contexto para leer. */
    var firma = cuandoLargo(a.created_at) + (a.remitente ? ' · ' + a.remitente : '');

    /* El texto llega en un solo campo; los saltos de línea son párrafos. */
    var parrafos = String(a.cuerpo || '').split(/\n+/).filter(function (t) { return t.trim(); });

    var envio = a.publico_texto
      ? 'Enviado a ' + a.publico_texto + (a.personas ? ' · ' + a.personas + (a.personas === 1 ? ' persona' : ' personas') : '')
      : '';

    return '<article class="lectura ancho" data-nivel="' + niv + '">' +
      '<div class="franja">' +
        '<p class="quien"><span class="marca">' + esc(NIVEL[niv].chip) + '</span>' +
          (contexto ? '<span class="de-que">' + esc(contexto) + '</span>' : '') + '</p>' +
        '<h2>' + esc(a.titulo) + '</h2>' +
        '<p class="cuando">' + esc(firma) + '</p>' +
      '</div>' +
      '<div class="cuerpo">' +
        parrafos.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') +
        (lleva ? '<a class="ir" href="' + esc(lleva) + '">' + esc(aDonde(lleva)) + '</a>' : '') +
        (envio || a.caduca_el
          ? '<p class="envio">' + esc(envio) +
            (a.caduca_el
              ? '<span class="paso">' + (a.caducado
                  ? 'Ya pasó: valía hasta el ' + esc(dia(a.caduca_el)) + '.'
                  : 'Vale hasta el ' + esc(dia(a.caduca_el)) + '.') + '</span>'
              : '') +
            '</p>'
          : '') +
      '</div>' +
    '</article>';
  }

  function noEncontrado() {
    return '<div class="no-esta"><h2>Ese aviso ya no está aquí</h2>' +
      '<p>Puede que fuera para otra persona o que sea de hace mucho. Los últimos que te han llegado los tienes más abajo.</p></div>';
  }

  async function cabecera() {
    var id = idPedido();
    if (!id) return '';
    var r = await mis({ p_id: id });
    /* Si no se ha podido preguntar, el aviso NO es que no exista: decir «ese
       aviso ya no está» cuando lo que falla es la conexión hace pensar que el
       club lo ha borrado. */
    if (r.fallo) {
      return '<div style="margin-top:16px">' + htmlError('No hemos podido abrir este aviso',
        'Puede ser tu conexión. El aviso sigue ahí: vuelve a intentarlo en un momento.', pintar) + '</div>';
    }
    var filas = r.filas;
    if (!filas.length) return noEncontrado();
    /* Abrirlo es leerlo. Se marca sin preguntar y sin esperar: si
       fallara, lo único que pasa es que sigue en «sin leer». */
    try { await sb.rpc('avisos_marcar_leido', { p_id: id }); } catch (e) { /* da igual */ }
    return pintarAviso(filas[0]);
  }

  /* --------------------------------------------------------------
     PINTAR
     ---------------------------------------------------------------
     El orden de la página cambia según a qué se ha venido:

       con un aviso abierto → el aviso, «Anteriores», y los ajustes al
         final. Quien llega tocando el móvil viene a leer, no a
         configurar.
       sin nada abierto → el historial primero y los ajustes debajo.
         Y si todavía no hay ningún aviso, manda la maqueta 44b: el
         trato, los interruptores y solo entonces el botón.
     -------------------------------------------------------------- */
  async function pintar() {
    var e;
    try { e = await APOLANA_AVISOS.estado(); }
    catch (err) { e = { puede: false, activo: false, motivo: 'error', texto: '' }; }

    var abierto = idPedido();
    var cabeza = '', hist = '';
    try { cabeza = await cabecera(); } catch (err) { cabeza = ''; }
    try { hist = await historial(abierto, abierto ? 'Anteriores' : ''); } catch (err) { hist = ''; }

    /* El trato solo cuando no hay nada que leer todavía: con avisos en
       pantalla, repetir la promesa sobra. */
    var promesa = (!cabeza && !hist) ? trato() : '';
    var ajustes = '';

    if (e.motivo === 'apagado') {
      /* El club todavía no ha puesto sus claves: nunca un botón que no hace nada. */
      ajustes = '<div class="caja" style="margin-top:12px"><h2>Los avisos todavía no están en marcha</h2>' +
        '<p>El club los está preparando. Cuando estén, aquí aparecerá el botón para activarlos. Mientras tanto puedes dejar elegido de qué quieres que te avisemos.</p></div>' +
        lista('De qué te avisamos');

    } else if (e.motivo === 'bloqueado') {
      /* No se puede desbloquear desde la web: se dice en una línea dónde se
         arregla, se ofrece el correo, y los avisos se quedan en la pantalla. */
      ajustes = '<div class="caja caja--ambar" style="margin-top:12px"><h2>Tu teléfono tiene los avisos bloqueados</h2>' +
        '<p>Se decide en los ajustes del móvil, no aquí.</p>' +
        '<p class="ruta">Ajustes → Apolana → Notificaciones</p></div>' +
        correo() +
        lista('De qué te avisaremos cuando lo desbloquees');

    } else if (e.motivo === 'instalar') {
      /* iPhone y iPad sin la app en la pantalla de inicio: es cosa de Apple,
         no del club, y se dice sin que parezca una avería. */
      ajustes = '<div class="caja" style="margin-top:12px"><h2>En el iPhone hace falta tener la app</h2>' +
        '<p>Los avisos solo llegan si Apolana está instalada en la pantalla de inicio: con Safari a secas, Apple no los deja pasar. Se instala en un minuto y desde aquí mismo se activan después.</p>' +
        '<a class="bot bot--borde" href="../../app/">Cómo instalar la app</a></div>' +
        correo() +
        lista('De qué te avisaremos cuando la instales');

    } else if (!e.puede) {
      /* Navegador sin avisos, sin https, sin sesión… se explica y ya. */
      ajustes = '<div class="caja" style="margin-top:12px"><h2>Aquí no se pueden activar</h2>' +
        '<p>' + esc(e.texto || 'Este navegador no sabe recibir avisos.') + '</p></div>' +
        correo() +
        lista('De qué te avisamos');

    } else if (e.activo) {
      ajustes = lista('De qué te avisamos') +
        banda('Puedes cambiarlo cuando quieras desde aquí.') +
        '<p class="rotulo">Este aparato</p>' +
        '<div class="caja"><h2>Los avisos están activados</h2>' +
        '<p class="aparato">' + esc(e.texto) + '</p>' +
        '<button type="button" class="bot bot--borde" id="av-quitar">Dejar de recibir avisos aquí</button></div>';

    } else {
      /* El caso normal: se puede activar. Los interruptores van ANTES del
         botón, porque quien llega abajo ya ha dicho que sí de hecho. */
      ajustes = lista('Elige de qué, y luego lo activamos') +
        banda('Puedes cambiarlo cuando quieras desde aquí.') +
        '<div class="acciones">' +
          '<button type="button" class="bot" id="av-activar">Activar los avisos</button>' +
          '<a class="ahora-no" href="../">Ahora no</a>' +
        '</div>';
    }

    cuerpo.innerHTML = cabeza + promesa + hist +
      ((cabeza || hist) ? '<div class="ajustes">' + ajustes + '</div>' : ajustes);

    /* La flecha de arriba lleva a donde toca: desde un aviso, a la lista
       de avisos; desde la lista, a «Más». */
    var volver = document.getElementById('av-volver');
    if (volver) volver.setAttribute('href', abierto ? './' : '../');

    enganchar();
  }

  function enganchar() {
    cuerpo.querySelectorAll('.tipo input').forEach(function (inp) {
      inp.addEventListener('change', function () {
        PREFS[inp.getAttribute('data-tipo')] = inp.checked;
        guardarPronto();
      });
    });

    /* «Marcar leídos»: los pone todos en su sitio de una vez. */
    var marcar = document.getElementById('av-marcar');
    if (marcar) {
      marcar.addEventListener('click', async function () {
        marcar.disabled = true;
        marcar.textContent = 'Un momento…';
        try { await sb.rpc('avisos_marcar_leido'); } catch (err) { /* se reintenta al recargar */ }
        await pintar();
      });
    }

    /* «Ver los de meses anteriores»: hasta el año, que es lo que se
       guardan. */
    var mas = document.getElementById('av-mas');
    if (mas) {
      mas.addEventListener('click', async function () {
        MESES = 12;
        mas.disabled = true;
        mas.textContent = 'Buscando…';
        await pintar();
      });
    }

    var act = document.getElementById('av-activar');
    if (act) {
      act.addEventListener('click', async function () {
        act.disabled = true;
        act.textContent = 'Un momento…';
        /* Se guarda lo elegido ANTES de pedir el permiso: si el diálogo del
           sistema recarga o interrumpe, sus decisiones ya están puestas. */
        clearTimeout(guardando);
        await APOLANA_AVISOS.guardarPreferencias(PREFS);
        var r = await APOLANA_AVISOS.activar();
        if (window.APX) APX.toast(r.mensaje || (r.ok ? 'Listo.' : 'No ha podido ser.'), r.ok ? 'ok' : 'error');
        await pintar();
      });
    }

    var quit = document.getElementById('av-quitar');
    if (quit) {
      quit.addEventListener('click', async function () {
        var seguro = window.APX ? await APX.confirm('Dejarás de recibir avisos en este aparato. Lo que elijas seguirá guardado.', { aceptar: 'Dejar de recibirlos' }) : true;
        if (!seguro) return;
        quit.disabled = true;
        quit.textContent = 'Quitando…';
        var r = await APOLANA_AVISOS.desactivar();
        if (window.APX) APX.toast(r.mensaje || (r.ok ? 'Hecho.' : 'No ha podido ser.'), r.ok ? 'ok' : 'error');
        await pintar();
      });
    }
  }

  await cargarPreferencias();
  await pintar();
});
</script>

</body>
</html>
