<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retos del club · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>

<style>
  /* ============================================================
     RETOS DEL CLUB · zona del atleta
     El club propone, el sistema cuenta solo y los puntos suben.
     Pensada para el móvil (375 px sin scroll lateral) y con
     objetivos táctiles de 44 px o más.
     ============================================================ */
  body { background: var(--crema); }

  .rt-wrap { max-width: 520px; margin: 0 auto; padding: 12px 0 44px; }
  .rt-pad { padding: 0 clamp(16px,4.5vw,22px); }

  .volver { display:inline-flex; align-items:center; gap:7px; min-height:44px; margin:0 clamp(16px,4.5vw,22px);
            color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:14px; }
  .volver i { font-style:normal; font-size:17px; line-height:1; }

  h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px;
       line-height:.98; color: var(--navy); margin:2px 0 4px; }
  .rt-sub { font-size:14px; color: var(--texto-suave); line-height:1.5; margin:0 0 16px; max-width:46ch; }

  .rt-eti { font-size:13px; line-height:1.4; color: var(--texto-suave); }
  h2.rt-h { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; color: var(--navy);
            margin:26px 0 10px; }
  /* El recuento va al lado del título y en mono: es una cifra que se compara
     de una sección a otra, no un rótulo (kit 30h). */
  h2.rt-h .cuenta { font-family: var(--fuente-dato); font-size:13px; font-weight:400; color: var(--texto-suave);
                    text-transform:none; margin-left:8px; }

  /* ---- elegir de quién son los retos (familias) ---- */
  .rt-quien { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px; }
  .rt-quien button { min-height:44px; padding:0 15px; border-radius:999px; border:1px solid var(--linea-borde);
                     background:#fff; color: var(--texto); font:inherit; font-size:14px; cursor:pointer; }
  .rt-quien button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color:#fff; }

  /* ---- tarjeta grande de rango ----
     El rango es de las cosas que dan orgullo, no de las que se pulsan: va en
     ámbar, que es el color del club como institución (31a). Sobre navy, el
     ámbar claro #E0A33C. El azul se queda solo para lo que se toca. */
  .rt-rango { background: var(--navy); border-radius:14px; padding:18px 20px 20px; color:#fff; margin-bottom:14px; }
  .rt-rango .fila { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .rt-rango .eti { font-size:13px; color:rgba(255,255,255,.72); display:block; margin-bottom:2px; }
  .rt-rango .nombre { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:28px; line-height:1; color:#E0A33C; }
  .rt-rango .pts { text-align:right; }
  .rt-rango .pts b { font-family: var(--fuente-dato); font-size:36px; line-height:1; display:block; color:#fff; }
  .rt-rango .barra { margin-top:14px; height:8px; border-radius:999px; background:rgba(255,255,255,.22); overflow:hidden; }
  .rt-rango .barra i { display:block; height:100%; border-radius:999px; background:#E0A33C; }
  .rt-rango .falta { margin-top:8px; font-size:13px; color:rgba(255,255,255,.82); line-height:1.45; }

  .rt-mini { display:flex; gap:10px; margin-bottom:6px; }
  .rt-mini div { flex:1; min-width:0; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:11px 11px; }
  .rt-mini b { display:block; font-family: var(--fuente-dato); font-size:28px; line-height:1.05; color: var(--navy); }
  .rt-mini span { display:block; font-size:13px; color: var(--texto-suave); line-height:1.3; }

  /* ---- tarjeta de reto ---- */
  .rt-card { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:15px 16px; margin-bottom:10px; }
  .rt-card.hecho { background:#F4F9EF; border-color:#CDE5B4; }
  .rt-card .cab { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .rt-card .tit { font-size:15px; font-weight:600; color: var(--navy); line-height:1.35; }
  .rt-card .val { flex:0 0 auto; text-align:right; }
  /* Los puntos son lo que sube de rango: ámbar, no azul (31a) */
  .rt-card .val b { font-family: var(--fuente-dato); font-size:21px; line-height:1; color:#8A5307; display:block; }
  .rt-card.hecho .val b { color:#4C7A28; }
  .rt-card .val span { font-size:13px; color: var(--texto-suave); display:block; }
  .rt-card .desc { font-size:13px; color: var(--texto); line-height:1.5; margin:6px 0 0; }
  .rt-card .cuando { font-size:13px; color: var(--texto-suave); margin-top:5px; }

  .rt-barra { margin-top:11px; height:9px; border-radius:999px; background: var(--crema-media); overflow:hidden; }
  .rt-barra i { display:block; height:100%; border-radius:999px; background:#B96F09; transition:width .4s ease; }
  .rt-card.hecho .rt-barra i { background:#6FA83F; }
  .rt-cifra { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:7px; }
  .rt-cifra .n { font-size:13px; color: var(--navy); font-weight:600; }
  .rt-cifra .p { font-size:13px; color: var(--texto-suave); }

  .rt-premio { margin-top:11px; background: var(--aviso-fondo); border:1px solid var(--aviso-borde); border-radius:10px;
               padding:9px 12px; font-size:13px; color: var(--aviso-texto); line-height:1.45; }
  .rt-premio b { color: var(--aviso-titulo); font-weight:600; }

  /* ---- medallas ----
     Las medallas van en ámbar y en trazo, nunca en bloque de fondo: así no se
     confunden con un aviso, que siempre lleva icono y fondo #FDF3E3 (31a). */
  .rt-medallas { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; }
  .rt-med { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:12px 8px; text-align:center; }
  .rt-med.no { opacity:.5; }
  .rt-med .disco { width:44px; height:44px; margin:0 auto 7px; border-radius:50%; display:flex; align-items:center; justify-content:center;
                   background:none; border:1.5px solid var(--linea-borde); color: var(--texto-suave); }
  .rt-med.si .disco { border:2px solid #B96F09; color:#B96F09; }
  .rt-med .n { font-size:13px; color: var(--navy); font-weight:600; line-height:1.3; }
  .rt-med.si .n { color:#8A5307; }
  .rt-med .d { font-size:13px; color: var(--texto-suave); line-height:1.35; margin-top:3px; }

  /* ---- clasificación ---- */
  .rt-tabla { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; }
  .rt-fila { display:flex; align-items:center; gap:11px; padding:10px 13px; border-bottom:1px solid var(--linea); min-height:56px; }
  .rt-fila:last-child { border-bottom:0; }
  .rt-fila.yo { background:#F6EBD6; }
  /* Las posiciones son cifras: navy, no azul (31a) */
  .rt-fila .pos { flex:0 0 26px; text-align:center; font-family: var(--fuente-dato); font-size:21px; color: var(--texto-suave); }
  .rt-fila.top1 .pos, .rt-fila.top2 .pos, .rt-fila.top3 .pos { color: var(--navy); font-weight:700; }
  .rt-fila .cara { flex:0 0 38px; width:38px; height:38px; border-radius:50%; background: var(--crema-media); color: var(--texto-suave);
                   display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; overflow:hidden; }
  .rt-fila .cara img { width:100%; height:100%; object-fit:cover; display:block; }
  .rt-fila .qui { flex:1; min-width:0; }
  .rt-fila .qui b { display:block; font-size:14px; color: var(--navy); font-weight:600;
                    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rt-fila .qui span { display:block; font-size:13px; color: var(--texto-suave); }
  .rt-fila .rg { font-style:normal; font-weight:600; color:#8A5307; }
  .rt-fila .num { flex:0 0 auto; font-family: var(--fuente-dato); font-size:21px; color: var(--navy); }
  .rt-corte { padding:9px 13px; font-size:13px; color: var(--texto-suave); background: var(--crema); border-bottom:1px solid var(--linea); }
  .rt-tabla .rt-corte:last-child { border-bottom:0; }

  /* ---- buscador de gente del club ---- */
  .rt-buscar { width:100%; box-sizing:border-box; padding:12px 14px; min-height:48px; margin-bottom:10px;
               border:1px solid var(--linea-borde); border-radius:10px; font-size:16px; font-family:inherit;
               background:#fff; color: var(--navy); }
  .rt-buscar:focus { outline:2px solid var(--azul); border-color: var(--azul); }
  a.rt-fila { text-decoration:none; -webkit-tap-highlight-color:transparent; }
  a.rt-fila:hover { background: var(--azul-suave); }
  .rt-fila .chev { flex:0 0 auto; font-size:22px; line-height:1; color: var(--texto-suave); padding-left:2px; }

  /* ---- ficha de una persona ---- */
  .rt-ficha { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--linea);
              border-radius:14px; padding:16px; }
  .rt-ficha .cara-g { flex:0 0 72px; width:72px; height:72px; border-radius:50%; background: var(--crema-media);
                      overflow:hidden; display:flex; align-items:center; justify-content:center;
                      color: var(--texto-suave); font-size:21px; font-weight:600; }
  .rt-ficha .cara-g img { width:100%; height:100%; object-fit:cover; display:block; }
  .rt-ficha .quien { min-width:0; }
  .rt-ficha .quien b { display:block; font-family: var(--fuente-titulo); text-transform:uppercase; font-size:28px;
                       line-height:1.05; color: var(--navy); }
  /* El rango, en ámbar: es de lo que da orgullo, no de lo que se pulsa (31a) */
  .rt-ficha .quien span { display:block; font-size:13px; font-weight:600; color:#8A5307; margin-top:2px; }

  /* ---- ajustes ---- */
  .rt-ajustes { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:16px; }
  .rt-ajustes p.intro { font-size:13px; color: var(--texto-suave); line-height:1.5; margin:0 0 14px; }
  .rt-sw { display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:48px; cursor:pointer; }
  .rt-sw .txt b { display:block; font-size:15px; color: var(--navy); font-weight:600; }
  .rt-sw .txt span { display:block; font-size:13px; color: var(--texto-suave); line-height:1.4; }
  .rt-sw input { position:absolute; opacity:0; width:0; height:0; }
  .rt-sw .palanca { flex:0 0 52px; width:52px; height:30px; border-radius:14px; background:#D9D2C4; position:relative; transition:background .18s; }
  .rt-sw .palanca::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
                           background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.22); transition:transform .18s; }
  .rt-sw input:checked + .palanca { background: var(--azul); }
  .rt-sw input:checked + .palanca::after { transform:translateX(22px); }
  .rt-sw input:focus-visible + .palanca { outline:2px solid var(--azul-oscuro); outline-offset:2px; }

  .rt-sep { height:1px; background: var(--linea); margin:16px 0; }

  /* Enlace a «Mi perfil»: la foto y el nombre se cambian allí, no aquí */
  .rt-enlace { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px;
               text-decoration:none; color: var(--texto); }
  .rt-enlace b { display:block; font-size:15px; color: var(--navy); font-weight:600; margin-bottom:2px; }
  .rt-enlace span { font-size:13px; color: var(--texto-suave); line-height:1.4; }
  .rt-enlace .fl { flex:0 0 auto; font-size:21px; line-height:1; color: var(--texto-suave); }
  .rt-enlace:hover b { color: var(--azul-oscuro); }

  .btn-l { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 17px; border-radius:999px;
           border:1px solid var(--linea-borde); background:#fff; color: var(--texto); font:inherit; font-size:14px; cursor:pointer; }
  .btn-l:hover { border-color:#C9D9E7; }

  .rt-nota { background: var(--aviso-fondo); border:1px solid var(--aviso-borde); border-radius:14px; padding:14px 16px;
             font-size:13px; color: var(--aviso-texto); line-height:1.55; margin-bottom:14px; }
  .rt-nota b { display:block; font-size:15px; color: var(--aviso-titulo); margin-bottom:4px; }

  /* Los estados vacío, de carga y de error vienen del kit (fundamentos 28f):
     .ap-esq, .ap-vacio y .ap-error los pone portal-auth.js. */

  /* avisos flotantes */
  .apx-host { position:fixed; left:0; right:0; bottom:18px; z-index:9999; display:flex; flex-direction:column;
              align-items:center; gap:8px; pointer-events:none; padding:0 14px; }
  .apx { pointer-events:auto; background: var(--navy); color:#fff; border-radius:999px; padding:11px 18px; font-size:14px;
         box-shadow:0 14px 30px -16px rgba(46,66,86,.8); max-width:100%; }
  .apx.err { background:#8E3A34; }
  .apx.ok  { background:#3E6B24; }

  .oculto { display:none !important; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="rt-wrap" id="rt-wrap"><div class="rt-pad"><div class="ap-esq" data-esq="tarjeta"></div></div></div>
</div>

<script>
/* Avisos flotantes propios de esta pantalla (no bloquean nada). */
(function(){
  if (window.APX) return;
  var host = null;
  function ensureHost(){ if(!host){ host=document.createElement('div'); host.className='apx-host'; document.body.appendChild(host); } return host; }
  window.APX = { toast: function(msg, tipo){
    var t=document.createElement('div');
    t.className='apx'+(tipo==='error'?' err':(tipo==='ok'?' ok':''));
    t.setAttribute('role', tipo==='error'?'alert':'status');
    t.textContent=msg;
    ensureHost().appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, tipo==='error'?5200:3400);
  } };
})();
</script>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  "use strict";

  var wrap = document.getElementById('rt-wrap');
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function aviso(m,t){ if(window.APX) APX.toast(m,t); }

  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fCorta(iso){
    if(!iso) return '';
    var p = String(iso).slice(0,10).split('-');
    return p.length===3 ? (parseInt(p[2],10)+' '+MESES[parseInt(p[1],10)-1]) : String(iso);
  }
  function nDe(v){ var n = Number(v||0); return Math.round(n*100)/100; }
  function iniciales(a){
    var n=(a.nombre||'').trim(), ap=(a.apellidos||'').trim();
    return ((n?n[0]:'')+(ap?ap[0]:'')).toUpperCase() || '·';
  }
  function inicialesTxt(t){
    var p = String(t||'').trim().split(/\s+/);
    return ((p[0]?p[0][0]:'')+(p[1]?p[1][0]:'')).toUpperCase() || '·';
  }
  /* LAS FOTOS · vienen de «Mi perfil», que las guarda en un almacén
     privado: no hay URL fija, hay que pedir una firmada que caduca a la
     hora. Se piden todas de una vez y se guardan aquí, para que pintar
     una lista siga siendo instantáneo. Sin foto se ven las iniciales. */
  var CUBO_FOTOS = 'fotos-perfil', FIRMA_S = 3600, FOTOS = {};

  async function firmarFotos(rutas){
    var faltan = [];
    (rutas || []).forEach(function(r){
      if(r && !FOTOS[r] && !/^(https?:|data:)/.test(r) && faltan.indexOf(r) === -1) faltan.push(r);
    });
    if(!faltan.length) return;
    try {
      var r = await sb.storage.from(CUBO_FOTOS).createSignedUrls(faltan, FIRMA_S);
      if(!r.error) (r.data || []).forEach(function(x){ if(x && x.signedUrl) FOTOS[x.path] = x.signedUrl; });
    } catch(e){ /* si el almacén no contesta, se ven las iniciales y ya está */ }
  }

  function fotoUrl(v){
    if(!v) return '';
    if(/^(https?:|data:)/.test(v)) return v;
    return FOTOS[v] || '';
  }

  function esMenor(fnac){
    if(!fnac) return true;                       /* sin fecha, se protege */
    var f = new Date(String(fnac).slice(0,10));
    var limite = new Date(); limite.setFullYear(limite.getFullYear()-18);
    return f > limite;
  }

  /* ---- cómo se lee cada métrica en cristiano ---- */
  var UNIDAD = {
    asistencias:          ['entreno','entrenos'],
    racha_asistencias:    ['entreno seguido','entrenos seguidos'],
    entrenos_registrados: ['entreno contado','entrenos contados'],
    cubo_clases:          ['clase de El Cubo','clases de El Cubo'],
    competiciones:        ['competición','competiciones'],
    marcas:               ['marca','marcas'],
    mejores_personales:   ['mejor marca','mejores marcas'],
    tests:                ['batería de tests','baterías de tests']
  };
  function unidad(metrica, n){
    var u = UNIDAD[metrica] || ['', ''];
    return n === 1 ? u[0] : u[1];
  }
  function cuando(r){
    if(r.periodo === 'fechas') return 'Del ' + fCorta(r.fecha_inicio) + ' al ' + fCorta(r.fecha_fin);
    if(r.periodo === 'semana') return 'Esta semana';
    if(r.periodo === 'mes') return 'Este mes';
    if(r.periodo === 'temporada') return 'Esta temporada';
    return '';
  }

  var ICONO_MEDALLA = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14.5" r="6"/>' +
    '<path d="M8.5 8.6 6 2.5h12l-2.5 6.1M12 12v5M9.6 14.5h4.8"/></svg>';

  /* ============================================================
     ESTADO
     ============================================================ */
  var FICHAS = [], ATLETA = null;
  var RETOS = [], PROGRESO = {}, LOGROS = {}, MEDALLAS = [], MIAS = {}, RANGOS = [], TABLA = [], PJ = null;
  var MIEMBROS = [], BUSCA = '';
  var RANKING = false;   /* la clasificación viene apagada: la enciende el club */

  /* ============================================================
     CARGA
     ============================================================ */
  async function cargarFichas(){
    var r = await sb.from('atletas').select('id,nombre,apellidos,fecha_nacimiento')
      .or('perfil_id.eq.' + perfil.id + ',perfil_padre_id.eq.' + perfil.id)
      .order('nombre');
    FICHAS = r.error ? [] : (r.data || []);
  }

  async function cargarTodo(){
    var id = ATLETA.id;

    var rr = await sb.from('retos')
      .select('id,titulo,descripcion,metrica,objetivo,periodo,fecha_inicio,fecha_fin,puntos,premio')
      .eq('activo', true).order('created_at');
    RETOS = rr.error ? [] : (rr.data || []);

    PROGRESO = {};
    var rp = await sb.rpc('retos_progreso_atleta', { p_atleta: id });
    if(!rp.error) (rp.data || []).forEach(function(x){ PROGRESO[x.reto_id] = Number(x.valor || 0); });

    LOGROS = {};
    var rl = await sb.from('reto_logros').select('reto_id,valor_alcanzado,completado_en,puntos_otorgados').eq('atleta_id', id);
    if(!rl.error) (rl.data || []).forEach(function(x){ LOGROS[x.reto_id] = x; });

    var rm = await sb.from('medallas').select('id,clave,titulo,descripcion,criterio,umbral,orden')
      .eq('activa', true).order('orden');
    MEDALLAS = rm.error ? [] : (rm.data || []);

    MIAS = {};
    var ra = await sb.from('atleta_medallas').select('medalla_id,conseguida_en').eq('atleta_id', id);
    if(!ra.error) (ra.data || []).forEach(function(x){ MIAS[x.medalla_id] = x.conseguida_en; });

    var rg = await sb.from('juego_rangos').select('clave,nombre,desde_puntos,orden').order('desde_puntos');
    RANGOS = rg.error ? [] : (rg.data || []);

    var rj = await sb.from('perfil_juego')
      .select('atleta_id,participa,autoriza_parental_en,puntos').eq('atleta_id', id).maybeSingle();
    PJ = (rj && !rj.error && rj.data) ? rj.data : null;

    /* La clasificación solo se pide si el club la tiene encendida. */
    var rk = await sb.from('juego_ajustes').select('ranking_publico').eq('id', 1).maybeSingle();
    RANKING = !!(rk && !rk.error && rk.data && rk.data.ranking_publico);
    TABLA = RANKING ? await cargarTabla() : [];

    MIEMBROS = await cargarMiembros();

    await firmarFotos(MIEMBROS.map(function(x){ return x.foto_ruta; })
      .concat(TABLA.map(function(x){ return x.foto_ruta; })));
  }

  async function cargarMiembros(){
    var r = await sb.from('miembros_juego')
      .select('atleta_id,nombre,foto_ruta,puntos,medallas,retos,rango')
      .order('nombre').limit(400);
    return r.error ? [] : (r.data || []);
  }

  async function cargarTabla(){
    var rc = await sb.from('clasificacion_retos')
      .select('atleta_id,nombre,foto_ruta,puntos,medallas,rango,puesto')
      .order('puntos', { ascending: false }).limit(60);
    return rc.error ? [] : (rc.data || []);
  }

  /* ============================================================
     PUNTOS Y RANGO
     ============================================================ */
  function misPuntos(){
    if(PJ && PJ.puntos != null) return Number(PJ.puntos);
    var s = 0;
    for(var k in LOGROS) if(Object.prototype.hasOwnProperty.call(LOGROS,k)) s += Number(LOGROS[k].puntos_otorgados||0);
    return s;
  }
  function rangoDe(p){
    var actual = RANGOS.length ? RANGOS[0] : { nombre:'Debutante', desde_puntos:0 }, siguiente = null;
    for(var i=0;i<RANGOS.length;i++){
      if(p >= RANGOS[i].desde_puntos) actual = RANGOS[i];
      else { siguiente = RANGOS[i]; break; }
    }
    return { actual: actual, siguiente: siguiente };
  }

  /* ============================================================
     PINTADO
     ============================================================ */
  function pintarCabecera(){
    var h = '<a class="volver" href="../atleta/#mas"><i>&larr;</i>Volver</a>' +
      '<div class="rt-pad"><h1>Mis retos</h1>' +
      '<p class="rt-sub">El club propone, tú entrenas y la cuenta se lleva sola con lo que ya queda apuntado. ' +
      'Esto es cosa tuya: tu progreso, tus puntos y tus medallas. ' +
      (RANKING ? 'Los puntos suben de rango y desbloquean los premios del club.'
               : 'La competición del club es la Liga Apolana; aquí no se compara a nadie con nadie.') + '</p>';
    if(FICHAS.length > 1){
      h += '<div class="rt-quien">' + FICHAS.map(function(f){
        return '<button type="button" data-ficha="' + esc(f.id) + '" aria-pressed="' + (f.id===ATLETA.id) + '">' +
               esc((f.nombre||'') + ' ' + (f.apellidos||'')).trim() + '</button>';
      }).join('') + '</div>';
    }
    h += '</div>';
    return h;
  }

  function pintarRango(){
    var p = misPuntos(), r = rangoDe(p);
    var hechos = Object.keys(LOGROS).length;
    var medallas = Object.keys(MIAS).length;
    var enCurso = RETOS.filter(function(x){ return !LOGROS[x.id]; }).length;
    var pct = 100, falta = 'Has llegado a lo más alto de la escala. Ahora toca mantenerlo.';
    if(r.siguiente){
      var base = r.actual.desde_puntos, techo = r.siguiente.desde_puntos;
      pct = techo > base ? Math.max(0, Math.min(100, Math.round((p - base) * 100 / (techo - base)))) : 0;
      var quedan = techo - p;
      falta = 'Te ' + (quedan===1 ? 'queda 1 punto' : ('quedan ' + quedan + ' puntos')) + ' para ' + r.siguiente.nombre + '.';
    }
    return '<div class="rt-pad">' +
      '<div class="rt-rango"><div class="fila">' +
        '<div><span class="eti">tu rango</span><div class="nombre">' + esc(r.actual.nombre) + '</div></div>' +
        '<div class="pts"><span class="eti">puntos</span><b>' + p + '</b></div>' +
      '</div>' +
      '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
      '<p class="falta">' + esc(falta) + '</p></div>' +
      '<div class="rt-mini">' +
        '<div><b>' + enCurso + '</b><span>' + (enCurso===1?'reto abierto':'retos abiertos') + '</span></div>' +
        '<div><b>' + hechos + '</b><span>' + (hechos===1?'conseguido':'conseguidos') + '</span></div>' +
        '<div><b>' + medallas + '</b><span>' + (medallas===1?'medalla':'medallas') + '</span></div>' +
      '</div></div>';
  }

  function tarjetaReto(r, hecho){
    var obj = Number(r.objetivo||0);
    var val = hecho ? Math.max(Number(LOGROS[r.id].valor_alcanzado||0), obj) : Number(PROGRESO[r.id]||0);
    var pct = obj > 0 ? Math.max(0, Math.min(100, Math.round(val*100/obj))) : 0;
    var vTxt = nDe(Math.min(val, obj));
    var h = '<div class="rt-card' + (hecho?' hecho':'') + '">' +
      '<div class="cab"><div><div class="tit">' + esc(r.titulo) + '</div>' +
        '<div class="cuando">' + esc(cuando(r)) + '</div></div>' +
        '<div class="val"><b>+' + Number(r.puntos||0) + '</b><span>puntos</span></div></div>';
    if(r.descripcion) h += '<p class="desc">' + esc(r.descripcion) + '</p>';
    h += '<div class="rt-barra"><i style="width:' + pct + '%"></i></div>' +
      '<div class="rt-cifra"><span class="n">' + vTxt + ' de ' + nDe(obj) + ' ' + esc(unidad(r.metrica, nDe(obj))) + '</span>' +
      /* Ya llegó pero el club aún no ha pasado el repaso: se dice, para que
         nadie piense que la barra llena no ha servido de nada. */
      '<span class="p">' + (hecho ? ('Conseguido el ' + fCorta(LOGROS[r.id].completado_en))
                                  : (pct >= 100 ? 'Ya está, falta que el club lo apunte' : (pct + ' %'))) + '</span></div>';
    if(r.premio) h += '<div class="rt-premio"><b>Premio del club:</b> ' + esc(r.premio) + '</div>';
    return h + '</div>';
  }

  function pintarRetos(){
    var enCurso = RETOS.filter(function(r){ return !LOGROS[r.id]; });
    var hechos  = RETOS.filter(function(r){ return !!LOGROS[r.id]; });
    var h = '<div class="rt-pad"><h2 class="rt-h">En curso' +
            (enCurso.length ? '<span class="cuenta">' + enCurso.length + '</span>' : '') + '</h2>';
    h += enCurso.length
      ? enCurso.map(function(r){ return tarjetaReto(r, false); }).join('')
      : APOLANA_UI.vacio('Ahora mismo no hay ningún reto abierto',
          'El club irá proponiendo retos nuevos a lo largo de la temporada. Mientras tanto, todo lo que entrenas ' +
          'se sigue apuntando y cuenta igual.');
    if(hechos.length){
      h += '<h2 class="rt-h">Conseguidos<span class="cuenta">' + hechos.length + '</span></h2>' +
           hechos.map(function(r){ return tarjetaReto(r, true); }).join('');
    }
    return h + '</div>';
  }

  function pintarMedallas(){
    var tengo = MEDALLAS.filter(function(m){ return !!MIAS[m.id]; });
    var faltan = MEDALLAS.filter(function(m){ return !MIAS[m.id]; });
    var lista = tengo.concat(faltan);
    var h = '<div class="rt-pad"><h2 class="rt-h">Medallas<span class="cuenta">' + tengo.length + ' de ' + MEDALLAS.length + '</span></h2>';
    if(!lista.length) return h + APOLANA_UI.vacio('Todavía no hay medallas',
      'El club aún no ha creado ninguna. En cuanto las tenga, aparecerán aquí y se irán encendiendo solas ' +
      'según vayas cumpliendo cosas.') + '</div>';
    h += '<div class="rt-medallas">' + lista.map(function(m){
      var si = !!MIAS[m.id];
      return '<div class="rt-med ' + (si?'si':'no') + '" title="' + esc(m.descripcion||'') + '">' +
        '<div class="disco">' + ICONO_MEDALLA + '</div>' +
        '<div class="n">' + esc(m.titulo) + '</div>' +
        '<div class="d">' + esc(si ? fCorta(MIAS[m.id]) : (m.descripcion||'')) + '</div></div>';
    }).join('') + '</div></div>';
    return h;
  }

  function filaTabla(f, yo){
    var foto = fotoUrl(f.foto_ruta);
    var cara = foto ? '<img src="' + esc(foto) + '" alt="">' : esc(inicialesTxt(f.nombre));
    return '<div class="rt-fila' + (yo?' yo':'') + (f.puesto<=3?(' top'+f.puesto):'') + '">' +
      '<span class="pos">' + Number(f.puesto) + '</span>' +
      '<span class="cara">' + cara + '</span>' +
      '<span class="qui"><b>' + esc(f.nombre) + '</b><span>' +
      (f.rango ? '<i class="rg">' + esc(f.rango) + '</i>' : '') +
      (Number(f.medallas)>0 ? (f.rango ? ' · ' : '') + f.medallas + (Number(f.medallas)===1?' medalla':' medallas') : '') + '</span></span>' +
      '<span class="num">' + Number(f.puntos) + '</span></div>';
  }

  function pintarTabla(){
    /* Apagada por defecto: el club compite en la Liga Apolana, no aquí. */
    if(!RANKING) return '';
    var h = '<div class="rt-pad"><h2 class="rt-h">Clasificación del club</h2>';
    if(!TABLA.length){
      return h + APOLANA_UI.vacio('Todavía no hay nadie en la clasificación',
        'En cuanto la gente del club diga que quiere participar, esto se llena solo. Tú puedes ser la primera ' +
        'persona: se activa aquí abajo, en tus ajustes.') + '</div>';
    }
    var top = TABLA.slice(0, 20);
    var yoDentro = top.some(function(f){ return f.atleta_id === ATLETA.id; });
    var yoFila = null;
    for(var i=0;i<TABLA.length;i++) if(TABLA[i].atleta_id === ATLETA.id) yoFila = TABLA[i];

    h += '<div class="rt-tabla">' + top.map(function(f){ return filaTabla(f, f.atleta_id===ATLETA.id); }).join('');
    if(yoFila && !yoDentro){
      h += '<div class="rt-corte">Tu posición</div>' + filaTabla(yoFila, true);
    }
    h += '</div>';
    if(!yoFila){
      h += '<p class="rt-sub" style="margin:10px 0 0;">Ahora mismo no sales en la tabla. Puedes entrar desde los ajustes de aquí abajo.</p>';
    }
    return h + '</div>';
  }

  /* ============================================================
     BUSCADOR DE MIEMBROS
     ------------------------------------------------------------
     Solo salen quienes se dejan ver. La lista la filtra la base de
     datos, aquí solo se busca por nombre sobre lo que ya llegó.
     ============================================================ */
  function filaMiembro(m){
    var foto = fotoUrl(m.foto_ruta);
    var cara = foto ? '<img src="' + esc(foto) + '" alt="">' : esc(inicialesTxt(m.nombre));
    var bajo = [];
    if(Number(m.medallas) > 0) bajo.push(m.medallas + (Number(m.medallas)===1 ? ' medalla' : ' medallas'));
    if(Number(m.retos) > 0) bajo.push(m.retos + (Number(m.retos)===1 ? ' reto' : ' retos'));
    /* El rango, en ámbar; el recuento, en el gris de siempre (31a) */
    var linea = (m.rango ? '<i class="rg">' + esc(m.rango) + '</i>' : '') +
                (bajo.length ? (m.rango ? ' · ' : '') + esc(bajo.join(' · ')) : '');
    return '<a class="rt-fila mini" href="?atleta=' + encodeURIComponent(m.atleta_id) + '">' +
      '<span class="cara">' + cara + '</span>' +
      '<span class="qui"><b>' + esc(m.nombre) + '</b><span>' + linea + '</span></span>' +
      '<span class="chev">&rsaquo;</span></a>';
  }

  function pintarBuscador(){
    var h = '<div class="rt-pad"><h2 class="rt-h">Gente del club</h2>' +
      '<p class="rt-sub" style="margin-bottom:12px;">Busca a alguien del club y mira sus medallas y los retos que ha cumplido. ' +
      'Solo aparece quien ha dicho que quiere dejarse ver.</p>';
    if(!MIEMBROS.length){
      return h + APOLANA_UI.vacio('Todavía no se deja ver nadie',
        'Nadie del club ha dicho aún que quiera que le abran la ficha. Tú puedes ser la primera persona: ' +
        'se activa aquí abajo, en tus ajustes.') + '</div>';
    }
    h += '<input type="search" id="bs-txt" class="rt-buscar" placeholder="Buscar por nombre…" autocomplete="off" ' +
         'value="' + esc(BUSCA) + '">' +
         '<div class="rt-tabla" id="bs-lista">' + listaMiembros() + '</div></div>';
    return h;
  }

  function listaMiembros(){
    var t = BUSCA.trim().toLowerCase();
    var lista = t
      ? MIEMBROS.filter(function(m){ return String(m.nombre||'').toLowerCase().indexOf(t) !== -1; })
      : MIEMBROS;
    if(!lista.length) return '<div class="rt-corte">Nadie con ese nombre.</div>';
    return lista.slice(0, 40).map(filaMiembro).join('') +
      (lista.length > 40 ? '<div class="rt-corte">Hay ' + (lista.length-40) + ' más. Afina la búsqueda.</div>' : '');
  }

  /* ============================================================
     FICHA DE UNA PERSONA (?atleta=…)
     ------------------------------------------------------------
     Se enseña lo que esa persona ha elegido enseñar y nada más.
     Si no se deja ver, la ficha sencillamente no se abre.
     ============================================================ */
  async function abrirFicha(id, esMia){
    wrap.innerHTML = '<div class="rt-pad">' + APOLANA_UI.cargando('tarjeta') + '</div>';

    var rm = await sb.from('miembros_juego')
      .select('atleta_id,nombre,foto_ruta,puntos,medallas,retos,rango').eq('atleta_id', id).maybeSingle();
    var m = (rm && !rm.error && rm.data) ? rm.data : null;

    var volver = '<a class="volver" href="./"><i>&larr;</i>' + (esMia ? 'Volver a mis retos' : 'Volver') + '</a>';

    if(!m){
      wrap.innerHTML = volver + '<div class="rt-pad"><h1>Ficha</h1>' +
        APOLANA_UI.vacio('Esta ficha no se puede abrir',
          'Puede que esa persona haya preferido no dejarse ver, o que sea menor y todavía no conste el permiso ' +
          'de su familia.',
          APOLANA_UI.boton('Volver a los retos', './')) + '</div>';
      return;
    }

    await firmarFotos([m.foto_ruta]);

    var rmed = await sb.from('medallas_publicas')
      .select('medalla_id,titulo,descripcion,orden,conseguida_en').eq('atleta_id', id).order('orden');
    var meds = (rmed && !rmed.error) ? (rmed.data || []) : [];

    var rlog = await sb.from('logros_publicos')
      .select('reto_id,titulo,descripcion,puntos_otorgados,completado_en')
      .eq('atleta_id', id).order('completado_en', { ascending:false });
    var logs = (rlog && !rlog.error) ? (rlog.data || []) : [];

    var foto = fotoUrl(m.foto_ruta);
    var cara = foto ? '<img src="' + esc(foto) + '" alt="">' : esc(inicialesTxt(m.nombre));
    var h = volver + '<div class="rt-pad">';

    if(esMia){
      h += '<div class="rt-nota" style="margin-bottom:14px;"><b>Así te ven los demás</b>' +
        'Esto es exactamente lo que enseña tu ficha al resto del club: ni una cosa más. ' +
        'Se cambia o se apaga desde tus ajustes, en la pantalla anterior.</div>';
    }

    h += '<div class="rt-ficha">' +
        '<span class="cara-g">' + cara + '</span>' +
        '<div class="quien"><b>' + esc(m.nombre) + '</b>' +
        '<span>' + esc(m.rango || '') + '</span></div>' +
      '</div>' +
      '<div class="rt-mini" style="margin-top:12px;">' +
        '<div><b>' + Number(m.puntos||0) + '</b><span>puntos</span></div>' +
        '<div><b>' + Number(m.medallas||0) + '</b><span>' + (Number(m.medallas)===1?'medalla':'medallas') + '</span></div>' +
        '<div><b>' + Number(m.retos||0) + '</b><span>' + (Number(m.retos)===1?'reto':'retos') + '</span></div>' +
      '</div>';

    h += '<h2 class="rt-h">Medallas</h2>';
    h += meds.length
      ? '<div class="rt-medallas">' + meds.map(function(x){
          return '<div class="rt-med si" title="' + esc(x.descripcion||'') + '">' +
            '<div class="disco">' + ICONO_MEDALLA + '</div>' +
            '<div class="n">' + esc(x.titulo) + '</div>' +
            '<div class="d">' + esc(fCorta(x.conseguida_en)) + '</div></div>';
        }).join('') + '</div>'
      : APOLANA_UI.vacio('Todavía no tiene ninguna medalla',
          'Cuando consiga la primera aparecerá aquí, con el día en que la ganó.');

    h += '<h2 class="rt-h">Retos cumplidos' + (logs.length ? '<span class="cuenta">' + logs.length + '</span>' : '') + '</h2>';
    h += logs.length
      ? logs.map(function(x){
          return '<div class="rt-card hecho"><div class="cab"><div>' +
            '<div class="tit">' + esc(x.titulo) + '</div>' +
            '<div class="cuando">Conseguido el ' + esc(fCorta(x.completado_en)) + '</div></div>' +
            '<div class="val"><b>+' + Number(x.puntos_otorgados||0) + '</b><span>puntos</span></div></div>' +
            (x.descripcion ? '<p class="desc">' + esc(x.descripcion) + '</p>' : '') + '</div>';
        }).join('')
      : APOLANA_UI.vacio('Todavía no ha cumplido ningún reto',
          'En cuanto el club dé por bueno el primero, saldrá en esta lista con los puntos que sumó.');

    wrap.innerHTML = h + '</div>';
  }

  function pintarAjustes(){
    var menor = esMenor(ATLETA.fecha_nacimiento);
    var autorizado = !!(PJ && PJ.autoriza_parental_en);
    var participa = !!(PJ && PJ.participa);
    var visible = participa && (!menor || autorizado);

    var h = '<div class="rt-pad"><h2 class="rt-h">Quién puede verte</h2>';

    if(menor && !autorizado){
      h += '<div class="rt-nota"><b>Falta el permiso de tu familia</b>' +
        'Eres menor de edad, así que tu nombre y tu foto no se publican en ninguna lista del club hasta que tu padre, ' +
        'tu madre o quien te tutele lo autorice. Díselo al club y lo dejan registrado en un momento: es solo un trámite, ' +
        'y mientras tanto tus retos, tus puntos y tus medallas siguen contando igual para ti.</div>';
    }

    h += '<div class="rt-ajustes">' +
      '<p class="intro">Tus retos son tuyos y los ves siempre. Esto es solo para decidir si el resto del club ' +
      'puede abrir tu ficha. Se apaga cuando quieras y desapareces al momento.</p>' +

      '<label class="rt-sw"><span class="txt"><b>Que otros socios puedan ver mi perfil</b>' +
        '<span>Verían tu nombre, tu foto, tu rango, tus medallas y los retos que has cumplido. Nada más.' +
        (RANKING ? ' Y saldrías en la clasificación del club.'
                 : ' Si algún día el club enciende la clasificación, también saldrías en ella.') + '</span></span>' +
        '<input type="checkbox" id="aj-participa"' + (participa?' checked':'') + '><span class="palanca"></span></label>' +

      (visible
        ? '<button type="button" class="btn-l" id="aj-ver" style="margin-top:14px;">Ver mi ficha como la ven los demás</button>'
        : '<p class="intro" style="margin:14px 0 0;">Ahora mismo tu ficha no se puede abrir: no sales en el buscador del club.</p>') +

      '<div class="rt-sep"></div>' +

      '<a class="rt-enlace" href="../perfil/"><span><b>Tu foto y tu nombre</b>' +
        'Se cambian en Mi perfil, junto con el resto de tus datos.</span><span class="fl">&rsaquo;</span></a>' +
    '</div></div>';
    return h;
  }

  function pintar(){
    wrap.innerHTML = pintarCabecera() + pintarRango() + pintarRetos() + pintarMedallas() +
                     pintarTabla() + pintarBuscador() + pintarAjustes();
    enganchar();
  }

  /* ============================================================
     INTERACCIÓN
     ============================================================ */
  function enganchar(){
    Array.prototype.forEach.call(wrap.querySelectorAll('[data-ficha]'), function(b){
      b.addEventListener('click', async function(){
        var id = b.getAttribute('data-ficha');
        if(id === ATLETA.id) return;
        for(var i=0;i<FICHAS.length;i++) if(FICHAS[i].id === id) ATLETA = FICHAS[i];
        wrap.innerHTML = '<div class="rt-pad">' + APOLANA_UI.cargando('tarjeta') + '</div>';
        await cargarTodo(); pintar();
      });
    });

    /* Un solo interruptor: se guarda al momento, sin botón de por medio. */
    $('aj-participa').addEventListener('change', function(){ guardarParticipa(this); });

    var ver = $('aj-ver');
    if(ver) ver.addEventListener('click', function(){ irAFicha(ATLETA.id); });

    var bs = $('bs-txt');
    if(bs) bs.addEventListener('input', function(){
      BUSCA = this.value || '';
      var lista = $('bs-lista');
      if(lista) lista.innerHTML = listaMiembros();
    });
  }

  async function guardarParticipa(chk){
    var quiere = chk.checked;
    chk.disabled = true;
    var r = await sb.from('perfil_juego')
      .upsert({ atleta_id: ATLETA.id, participa: quiere }, { onConflict: 'atleta_id' })
      .select('atleta_id,participa,autoriza_parental_en,puntos').maybeSingle();
    chk.disabled = false;
    if(r.error){
      chk.checked = !quiere;
      aviso('No hemos podido guardar el cambio. Puede ser tu conexión: vuelve a intentarlo.', 'error');
      return;
    }
    PJ = r.data || PJ;
    aviso(quiere ? 'Hecho: ya puedes salir en el club.' : 'Hecho: has dejado de ser visible.', 'ok');

    /* Lo que se deja ver cambia al momento: se vuelven a pedir las listas. */
    if(RANKING) TABLA = await cargarTabla();
    MIEMBROS = await cargarMiembros();
    await firmarFotos(MIEMBROS.map(function(x){ return x.foto_ruta; })
      .concat(TABLA.map(function(x){ return x.foto_ruta; })));
    pintar();
  }

  /* La ficha vive en ?atleta=… : así se puede enlazar y el botón de
     «atrás» del móvil vuelve exactamente donde estabas. */
  function irAFicha(id){ location.href = '?atleta=' + encodeURIComponent(id); }

  /* ============================================================
     ARRANQUE
     ============================================================ */
  await cargarFichas();
  if(!FICHAS.length){
    wrap.innerHTML = '<a class="volver" href="../"><i>&larr;</i>Volver al portal</a>' +
      '<div class="rt-pad"><h1>Retos del club</h1>' +
      APOLANA_UI.vacio('Esta pantalla es para los atletas del club',
        'Tu cuenta no tiene ninguna ficha de atleta asociada, y los retos se cuentan por atleta. Si crees que ' +
        'es un error, escríbele al club y lo miran.',
        APOLANA_UI.boton('Volver al portal', '../')) + '</div>';
    return;
  }
  ATLETA = FICHAS[0];

  /* ¿Venimos a ver la ficha de alguien? Entonces solo eso. */
  var pedido = new URLSearchParams(location.search).get('atleta');
  if(pedido){
    var mia = FICHAS.some(function(f){ return f.id === pedido; });
    await abrirFicha(pedido, mia);
    return;
  }

  await cargarTodo();
  pintar();
});
</script>

</body>
</html>
