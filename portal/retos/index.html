<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis retos · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/retos.js" defer></script>
<style>
  /* ============================================================
     RETOS, RANGOS Y MEDALLAS · zona del atleta
     Maqueta 29a (los siete rangos) y 29b (la tarjeta de reto).

     LA REGLA DEL RITMO: cabecera oscura a sangre con el dato duro,
     secciones alternando crema flojo y crema fuerte —a sangre y sin
     radio— y cierre oscuro abajo.

     EL COLOR: ámbar para el club como institución (rangos, puntos,
     medallas) siempre en texto o en trazo y nunca en bloque de
     fondo, que es como se dibuja un aviso. Azul solo para lo que se
     pulsa, y un solo botón azul por pantalla. Verde solo para
     «conseguido». Navy para títulos y datos.

     Móvil primero (375 px sin scroll lateral) y 44 px de zona
     pulsable en todo lo que se toca.
     ============================================================ */
  body { background: var(--crema); }
  /* Con la barra de pestañas puesta, el hueco que queda bajo el cierre
     va también en oscuro: el pie no se despega. */
  body.pt-con-tabbar { background: var(--navy); }

  /* ---- bandas a sangre, sin radio ---- */
  .rt-banda { padding: 24px 0 28px; }
  .rt-dentro { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 480px) { .rt-dentro { padding: 0 22px; } }
  .rt-b1 { background: #FBF9F4; }
  .rt-b2 { background: #F1EADC; }
  .rt-cab, .rt-cierre { background: var(--navy); color: #fff; }

  h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 36px;
       line-height: 1; color: #fff; margin: 2px 0 6px; }
  .rt-h { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 28px;
          line-height: 1.05; color: var(--navy); margin: 0 0 12px; }
  /* El recuento va al lado del título y en mono: es una cifra que se
     compara de una sección a otra, no un rótulo (kit 30h). */
  .rt-h .cuenta { font-family: var(--fuente-dato); font-size: 14px; font-weight: 400;
                  color: var(--texto-suave); text-transform: none; margin-left: 9px; }
  .rt-nota-sec { font-size: 14px; line-height: 1.5; color: var(--texto); margin: -4px 0 14px; max-width: 54ch; }

  /* ---- cabecera oscura ---- */
  .rt-cab { padding: 6px 0 26px; }
  .rt-volver { display: inline-flex; align-items: center; gap: 7px; min-height: 44px;
               color: rgba(255,255,255,.82); text-decoration: none; font-size: 15px; }
  .rt-volver:hover { color: #fff; }
  .rt-volver i { font-style: normal; font-size: 17px; line-height: 1; }
  .rt-lema { font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.78); margin: 0 0 16px; max-width: 46ch; }

  .rt-quien { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .rt-quien button { min-height: 44px; padding: 0 15px; border-radius: 999px;
                     border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff;
                     font: inherit; font-size: 15px; cursor: pointer; }
  .rt-quien button[aria-pressed="true"] { background: #fff; border-color: #fff; color: var(--navy); font-weight: 600; }

  .rt-rango { display: flex; align-items: center; gap: 14px; }
  .rt-rango-txt { flex: 1; min-width: 0; }
  .rt-rango .eti { display: block; font-size: 13px; line-height: 1.4; color: rgba(255,255,255,.68); }
  /* El rango es de lo que da orgullo, no de lo que se pulsa: ámbar (31a) */
  .rt-rango .nombre { display: block; font-family: var(--fuente-titulo); text-transform: uppercase;
                      font-size: 28px; line-height: 1.05; color: #E0A33C; }
  .rt-rango-pts { flex: 0 0 auto; text-align: right; }
  .rt-rango-pts b { display: block; font-family: var(--fuente-dato); font-size: 30px; line-height: 1; color: #fff; }

  .rt-datos { display: flex; gap: 10px; margin-top: 18px; }
  .rt-datos div { flex: 1; min-width: 0; border-top: 2px solid rgba(255,255,255,.24); padding-top: 8px; }
  .rt-datos b { display: block; font-family: var(--fuente-dato); font-size: 26px; line-height: 1; color: #fff; }
  .rt-datos span { display: block; font-size: 13px; line-height: 1.35; color: rgba(255,255,255,.7); margin-top: 4px; }

  .rt-falta { margin: 9px 0 0; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.84); }

  /* ---- barra de progreso (cabecera y tarjetas) ---- */
  .rt-progreso { height: 8px; border-radius: 999px; background: rgba(255,255,255,.22); overflow: hidden; margin-top: 14px; }
  .rt-progreso i { display: block; height: 100%; border-radius: 999px; background: #E0A33C; transition: width .4s ease; }

  /* ---- el disco del rango · maqueta 29a ----
     Color plano y número romano. Ni dorados brillantes ni degradados.
     El color va pegado a la clave del rango (I…VII), no a su nombre. */
  .disco { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
           font-family: var(--fuente-titulo); font-weight: 700; line-height: 1; letter-spacing: .02em;
           border: 3px solid transparent; flex: 0 0 auto; box-sizing: border-box; }
  .disco--s { width: 30px; height: 30px; font-size: 13px; border-width: 2px; }
  .disco--m { width: 48px; height: 48px; font-size: 19px; }
  .disco--g { width: 64px; height: 64px; font-size: 26px; }
  @media (min-width: 430px) { .disco--g { width: 84px; height: 84px; font-size: 34px; } }

  .rg-I   { background: #EFEAE0; border-color: #DCD3C1; color: #7A7365; }
  .rg-II  { background: #E6D2BC; border-color: #C08F63; color: #7A5230; }
  .rg-III { background: #E2E5E8; border-color: #A9B1B9; color: #4F5A64; }
  .rg-IV  { background: #EFE0B8; border-color: #C9A961; color: #755B14; }
  .rg-V   { background: #DDE6E5; border-color: #8FAFAC; color: #3A5754; }
  .rg-VI  { background: #DCE4EF; border-color: #89A0C2; color: #334F79; }
  .rg-VII { background: #2E4256; border-color: #2E4256; color: #fff; }
  .rg-x   { background: #EFEAE0; border-color: #DCD3C1; color: #7A7365; }
  /* Sobre navy, el último rango no puede ir en navy: se le da la vuelta. */
  .rg-VII.rg-oscuro { background: rgba(255,255,255,.14); border-color: #E7ECF2; color: #fff; }

  /* ---- la escala entera ---- */
  .rt-escala { list-style: none; margin: 0; padding: 0; display: grid;
               grid-template-columns: repeat(4, 1fr); gap: 16px 8px; align-items: start; }
  @media (min-width: 560px) { .rt-escala { grid-template-columns: repeat(7, 1fr); } }
  .rt-escala li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .rt-escala .n { font-size: 14px; font-weight: 600; line-height: 1.2; color: var(--texto); }
  .rt-escala .d { font-family: var(--fuente-dato); font-size: 13px; color: var(--texto-suave); }
  .rt-escala li.porllegar .disco { opacity: .5; }
  .rt-escala li.mio .n { color: #8A5307; }
  .rt-escala .tuyo { font-size: 13px; font-weight: 600; color: #8A5307; }

  .rt-porques { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--linea); display: grid; gap: 13px; }
  @media (min-width: 640px) { .rt-porques { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  .rt-porques b { display: block; font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 3px; }
  .rt-porques span { font-size: 14px; line-height: 1.5; color: var(--texto); }

  /* ---- la tarjeta de reto · maqueta 29b ----
     Sobre crema, la tarjeta va en blanco. Cuatro estados: normal,
     «te queda poco», conseguido y sin datos. El azul se reserva para
     lo que se pulsa, así que «te queda poco» se marca con trazo navy
     de 3 px, que es la voz de los datos. */
  .rt-reto { background: #fff; border: 1px solid var(--linea); border-radius: 14px;
             padding: 14px 16px; margin-bottom: 10px; }
  .rt-reto.cerca { border: 3px solid var(--navy); padding: 12px 14px; }
  .rt-reto.hecho { background: var(--verde-fondo); border: 3px solid var(--verde-borde); padding: 12px 14px; }
  .rt-reto .cab { display: flex; align-items: flex-start; gap: 12px; }
  .ic-caja { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 10px; background: var(--crema-media);
             color: var(--texto-suave); display: flex; align-items: center; justify-content: center; }
  .rt-reto.hecho .ic-caja { background: #D3E7D6; color: var(--verde); }
  .rt-reto .tit { flex: 1; min-width: 0; }
  .rt-reto h3 { font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
                font-size: 21px; line-height: 1.1; color: var(--navy); margin: 0; }
  .rt-reto .tit p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: var(--texto); }
  /* Los puntos son lo que sube de rango: ámbar en texto (31a) */
  .rt-reto .pts { flex: 0 0 auto; font-family: var(--fuente-dato); font-size: 15px; color: #8A5307; }
  .rt-reto.hecho .pts { color: #2F5A36; }
  .rt-reto .rt-progreso { background: #EBE4D6; margin-top: 12px; }
  .rt-reto .rt-progreso i { background: #B96F09; }
  .rt-reto .pie { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 7px; }
  .rt-reto .pie .n { font-size: 14px; font-weight: 600; color: var(--navy); }
  .rt-reto .pie .p { font-size: 13px; color: var(--texto-suave); text-align: right; }
  .rt-reto .hecho-pie { margin: 10px 0 0; font-size: 14px; line-height: 1.45; color: var(--texto); }
  .rt-reto .hecho-pie b { color: #2F5A36; font-weight: 600; }
  /* El premio, con filete ámbar: nunca en bloque de fondo ámbar, que es
     como se dibuja un aviso. */
  .rt-reto .premio { margin: 12px 0 0; padding-left: 11px; border-left: 3px solid #B96F09;
                     font-size: 14px; line-height: 1.5; color: var(--texto); }
  .rt-reto .premio b { color: #8A5307; font-weight: 600; }

  /* ---- medallas ----
     En ámbar y en trazo, nunca en bloque de fondo. Ni dorados ni emojis. */
  .rt-medallas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .rt-med { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 13px 10px;
            display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .rt-med .disco-med { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center;
                       justify-content: center; background: none; border: 2px dashed var(--linea-borde);
                       color: var(--texto-suave); box-sizing: border-box; }
  .rt-med.si .disco-med { border: 3px solid #B96F09; color: #B96F09; }
  .rt-med .n { font-size: 14px; font-weight: 600; line-height: 1.25; color: var(--navy); }
  .rt-med.si .n { color: #8A5307; }
  .rt-med .d { font-size: 13px; line-height: 1.4; color: var(--texto-suave); }

  /* ---- listas de gente · un contenedor con separadores (kit 30d) ---- */
  .rt-lista { background: #fff; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  .rt-fila { display: flex; align-items: center; gap: 11px; padding: 10px 13px; min-height: 56px;
             box-sizing: border-box; border-bottom: 1px solid var(--linea); text-decoration: none; color: var(--texto); }
  .rt-fila:last-child { border-bottom: 0; }
  a.rt-fila { -webkit-tap-highlight-color: transparent; }
  a.rt-fila:hover { background: var(--azul-suave); }
  .rt-fila .cara { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
                   background: var(--crema-media); color: var(--texto-suave); display: flex;
                   align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .rt-fila .cara img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rt-fila .qui { flex: 1; min-width: 0; }
  .rt-fila .qui b { display: block; font-size: 15px; font-weight: 600; color: var(--navy);
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-fila .qui span { display: block; font-size: 13px; color: var(--texto-suave);
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-fila .rg { font-style: normal; font-weight: 600; color: #8A5307; }
  /* El chevron nunca en azul: se leería como un enlace distinto de la fila (kit 30a) */
  .rt-fila .chev { flex: 0 0 auto; display: flex; color: var(--texto-suave); }
  .rt-fila .pos { flex: 0 0 26px; text-align: center; font-family: var(--fuente-dato);
                  font-size: 19px; color: var(--texto-suave); }
  .rt-fila .num { flex: 0 0 auto; font-family: var(--fuente-dato); font-size: 19px; color: var(--navy); }
  .rt-fila.yo { background: #F6EBD6; }
  .rt-corte { padding: 10px 13px; font-size: 13px; color: var(--texto-suave);
              background: var(--crema); border-bottom: 1px solid var(--linea); }
  .rt-lista .rt-corte:last-child { border-bottom: 0; }

  .rt-buscar { width: 100%; box-sizing: border-box; padding: 12px 14px; min-height: 48px; margin-bottom: 10px;
               border: 1px solid var(--linea-borde); border-radius: 10px; font-size: 16px; font-family: inherit;
               background: #fff; color: var(--navy); }
  .rt-buscar:focus { outline: 2px solid var(--azul); border-color: var(--azul); }

  /* ---- aviso dentro de la página (no es un toast) ---- */
  .rt-aviso { display: flex; gap: 12px; background: var(--ambar-fondo); border: 1px solid var(--ambar-borde);
              border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .rt-aviso .ic-caja { background: #F4E4C6; color: #8A5307; }
  .rt-aviso b { display: block; font-size: 15px; font-weight: 600; color: #6B5227; margin-bottom: 3px; }
  .rt-aviso p { margin: 0; font-size: 14px; line-height: 1.5; color: #6B5227; }

  /* ---- ajustes ---- */
  .rt-ajustes { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 16px; }
  .rt-ajustes p.intro { font-size: 14px; color: var(--texto); line-height: 1.5; margin: 0 0 14px; }
  .rt-sw { display: flex; align-items: center; justify-content: space-between; gap: 14px;
           min-height: 48px; cursor: pointer; }
  .rt-sw .txt b { display: block; font-size: 15px; color: var(--navy); font-weight: 600; }
  .rt-sw .txt span { display: block; font-size: 13px; color: var(--texto-suave); line-height: 1.45; margin-top: 2px; }
  .rt-sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  .rt-sw .palanca { flex: 0 0 52px; width: 52px; height: 30px; border-radius: 999px; background: #D9D2C4;
                    position: relative; transition: background .18s; }
  .rt-sw .palanca::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
                           border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.22);
                           transition: transform .18s; }
  .rt-sw input:checked + .palanca { background: var(--azul); }
  .rt-sw input:checked + .palanca::after { transform: translateX(22px); }
  .rt-sw input:focus-visible + .palanca { outline: 2px solid var(--azul-oscuro); outline-offset: 2px; }

  /* El único botón azul de la pantalla. La sombra, solo en lo pulsable. */
  .rt-btn-azul { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
                 margin-top: 14px; padding: 11px 22px; border: 0; border-radius: 999px; background: var(--azul);
                 color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
                 box-shadow: 0 12px 24px -18px rgba(46,66,86,.5); }
  .rt-btn-azul:hover { background: var(--azul-oscuro); }

  .rt-sep { height: 1px; background: var(--linea); margin: 16px 0; }
  .rt-enlace { display: flex; align-items: center; justify-content: space-between; gap: 12px;
               min-height: 56px; text-decoration: none; color: var(--texto); }
  .rt-enlace b { display: block; font-size: 15px; color: var(--navy); font-weight: 600; margin-bottom: 2px; }
  .rt-enlace span { font-size: 13px; line-height: 1.45; }
  .rt-enlace .fl { flex: 0 0 auto; display: flex; color: var(--texto-suave); }
  .rt-enlace:hover b { color: var(--azul-oscuro); }

  /* ---- ficha de una persona ---- */
  .rt-ficha { display: flex; align-items: center; gap: 14px; margin-top: 4px; }
  .rt-ficha .cara-g { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
                      background: rgba(255,255,255,.14); color: #fff; display: flex; align-items: center;
                      justify-content: center; font-size: 19px; font-weight: 600; }
  .rt-ficha .cara-g img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rt-ficha .quien { flex: 1; min-width: 0; }
  .rt-ficha h1 { font-size: 28px; margin: 0; }
  .rt-ficha .rg { display: block; font-size: 14px; font-weight: 600; color: #E0A33C; margin-top: 3px; }

  /* ---- cierre oscuro, pegado al pie ---- */
  .rt-cierre { padding: 26px 0 32px; }
  .rt-cierre h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 28px;
                  line-height: 1.05; color: #fff; margin: 0 0 8px; }
  .rt-cierre p { margin: 0 0 9px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,.8); }
  .rt-cierre p:last-child { margin-bottom: 0; }
  .rt-cierre .fino { font-size: 14px; color: rgba(255,255,255,.68); }
  /* «Liga Apolana» es nombre propio del club: ámbar (31c) */
  .rt-cierre a { color: #E0A33C; text-decoration: underline; }
  .rt-cierre a:hover { color: #F0BE6A; }

  /* Los cuatro estados salen del kit (fundamentos 28f): .ap-esq, .ap-vacio
     y .ap-error los pone portal-auth.js. En la banda de crema fuerte el
     vacío se pinta en blanco, que si no se confunde con el fondo. */
  .rt-b2 .ap-vacio { background: #fff; border: 1px solid var(--linea); }
  .rt-cab .ap-esq .ap-l { background: rgba(255,255,255,.2); }
</style>
</head>
<body>

<div id="portal-contenido">
  <div id="rt-wrap">
    <header class="rt-banda rt-cab"><div class="rt-dentro">
      <a class="rt-volver" href="../atleta/#mas"><i aria-hidden="true">&larr;</i>Volver</a>
      <h1>Mis retos</h1>
      <div class="ap-esq" data-esq="tarjeta"></div>
    </div></header>
    <section class="rt-banda rt-b1"><div class="rt-dentro">
      <div class="ap-esq" data-esq="filas:3"></div>
    </div></section>
  </div>
</div>

</body>
</html>
