<style>
  /* ============================================================
     MIS RETOS · rangos, retos del club y los que se pone uno mismo
     Maquetas 38a a 38d (29a para la escala de los siete rangos)

     UNA SOLA PANTALLA con cuatro partes y en este orden: la tarjeta
     del rango, los retos DEL CLUB (ámbar, con icono y con puntos), los
     MÍOS (navy, sin icono y sin puntos) y los CONSEGUIDOS, colapsados
     en filas con visto verde.

     MODO CONSULTA: en el móvil no hay bandas a sangre. Fondo crema
     y UNA SOLA tarjeta navy —la del rango—, que es el ancla. Nunca
     dos bloques navy en una pantalla de consulta: dejan de anclar.
     La pantalla de subir de rango sí es navy entera, pero es otra
     pantalla y solo sale siete veces en la vida de un atleta.

     EL COLOR: ámbar para el club como institución (rango, puntos,
     medallas), siempre en texto o en trazo. Azul solo para lo que
     se pulsa, un botón por pantalla. Verde solo «conseguido».
     Navy para títulos y datos.

     Móvil primero (375 px sin scroll lateral) y 44 px de zona
     pulsable en todo lo que se toca.
     ============================================================ */
  body { background: var(--crema); }

  .rt-wrap { max-width: 560px; margin: 0 auto; padding: 6px 16px 40px; }
  @media (min-width: 480px) { .rt-wrap { padding: 6px 22px 44px; } }

  /* ---- cabecera de pantalla (kit 30h): migas y título, sin barra de color ---- */
  .rt-migas { display: inline-flex; align-items: center; gap: 9px; min-height: 44px;
              color: var(--texto-suave); text-decoration: none; font-size: 14px; }
  .rt-migas:hover { color: var(--navy); }
  .rt-migas .fl { display: flex; color: var(--texto); }
  h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 30px; line-height: 1;
       color: var(--navy); margin: 2px 0 6px; padding-left: 33px; }

  /* Rótulo de sección: 14 px, minúscula y sin espaciado (fundamentos 0) */
  .rt-rot { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
            margin: 22px 2px 8px; font-size: 14px; color: var(--texto-suave); }
  .rt-rot b { font-weight: 400; }
  .rt-rot .cifra { font-family: var(--fuente-dato); font-size: 13px; }
  .rt-nota-sec { font-size: 14px; line-height: 1.5; color: var(--texto); margin: -2px 2px 10px; max-width: 54ch; }

  .rt-quien { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .rt-quien button { min-height: 44px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--linea-borde);
                     background: #fff; color: var(--texto); font: inherit; font-size: 15px; cursor: pointer; }
  .rt-quien button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }

  /* ---- LA MEDALLA DEL RANGO · ámbar en trazo, nunca en bloque ----
     Lleva el número romano de la clave estable del rango (I…VII), no
     su nombre: el club puede renombrarlo sin que la medalla cambie. */
  .medalla { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
             background: #F6EBD6; border: 3px solid #E0A33C; color: #8A5307; box-sizing: border-box;
             font-family: var(--fuente-titulo); font-weight: 700; line-height: 1; flex: 0 0 auto; }
  .medalla--s { width: 40px; height: 40px; font-size: 15px; border-width: 2px; }
  .medalla--m { width: 52px; height: 52px; font-size: 18px; }
  .medalla--g { width: 112px; height: 112px; font-size: 40px; border-width: 4px; }

  /* ---- LA ÚNICA TARJETA NAVY: el rango · 38a ---- */
  .rt-rango { background: var(--navy); border-radius: 14px; padding: 16px 18px; color: #fff;
              display: flex; flex-direction: column; gap: 13px; }
  .rt-rango .fila { display: flex; align-items: center; gap: 14px; }
  .rt-rango .quien { flex: 1; min-width: 0; }
  .rt-rango .nombre { display: block; font-family: var(--fuente-titulo); text-transform: uppercase;
                      font-size: 28px; line-height: 1; color: #fff; }
  .rt-rango .sub { display: block; font-size: 15px; line-height: 1.4; color: rgba(255,255,255,.72); margin-top: 2px; }
  .rt-rango .barra { height: 8px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; }
  .rt-rango .barra i { display: block; height: 100%; border-radius: 999px; background: #E0A33C; }
  .rt-rango .cotas { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
                     margin-top: 7px; font-size: 14px; color: rgba(255,255,255,.6); }

  /* ---- LA TARJETA DE RETO · 38a ----
     Todas las barras en ámbar: el azul es solo para lo que se pulsa.
     El primero —al que menos le falta— con borde ámbar de 2 px y con
     lo que falta escrito: eso convierte el reto en un plan. */
  .rt-reto { background: #fff; border: 1px solid var(--linea); border-radius: 14px;
             padding: 13px 15px; margin-bottom: 8px; }
  .rt-reto.cerca { border: 2px solid #E0A33C; padding: 12px 14px; }
  .rt-reto .cab { display: flex; align-items: flex-start; gap: 12px; }
  .ic-caja { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 10px; background: var(--crema-media);
             color: var(--texto-suave); display: flex; align-items: center; justify-content: center; }
  .rt-reto.cerca .ic-caja { background: #F6EBD6; color: #8A5307; }
  .rt-reto .tit { flex: 1; min-width: 0; }
  .rt-reto h2 { font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
                font-size: 20px; line-height: 1.1; color: var(--navy); margin: 0; }
  .rt-reto .tit p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: var(--texto); }
  .rt-reto .pts { flex: 0 0 auto; font-family: var(--fuente-dato); font-size: 14px; color: var(--texto-suave); }
  .rt-reto.cerca .pts { color: #8A5307; }
  .rt-reto .barra { display: block; height: 7px; border-radius: 999px; background: var(--crema-banda);
                    overflow: hidden; margin-top: 9px; }
  .rt-reto .barra i { display: block; height: 100%; border-radius: 999px; background: #E0A33C; transition: width .4s ease; }
  .rt-reto .pie { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 7px; }
  .rt-reto .pie .n { font-size: 14px; color: var(--texto); }
  .rt-reto .pie .p { font-size: 14px; color: var(--texto-suave); text-align: right; }
  .rt-reto.cerca .pie .n { font-weight: 600; color: var(--navy); }
  .rt-reto.cerca .pie .p { color: #8A5307; }
  /* El premio, con filete ámbar: nunca en bloque de fondo ámbar, que
     es como se dibuja un aviso. */
  .rt-reto .premio { margin: 11px 0 0; padding-left: 11px; border-left: 3px solid #B96F09;
                     font-size: 14px; line-height: 1.5; color: var(--texto); }
  .rt-reto .premio b { color: #8A5307; font-weight: 600; }

  /* ============================================================
     LOS RETOS QUE SE PONE UNO MISMO · 38c
     ------------------------------------------------------------
     La regla que los distingue de un vistazo, sin rótulos largos:
     LOS TUYOS EN NAVY, LOS DEL CLUB EN ÁMBAR. Y los tuyos, además,
     SIN ICONO Y SIN PUNTOS — porque no dan puntos, a propósito.

     Ojo: la tarjeta es blanca con el borde y la barra en navy, no un
     bloque navy. La única tarjeta navy de la pantalla sigue siendo la
     del rango; si hubiera dos, ninguna anclaría.
     ============================================================ */
  .rt-rot--boton { align-items: center; }
  .rt-nuevo { min-height: 44px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--linea-borde);
              background: #fff; color: var(--navy); font: inherit; font-size: 14px; font-weight: 600;
              cursor: pointer; flex: 0 0 auto; }
  .rt-nuevo:hover { border-color: #C9D9E7; }
  .rt-nuevo[disabled] { opacity: .5; cursor: default; }

  .rt-mio { background: #fff; border: 1px solid var(--linea); border-radius: 14px;
            padding: 13px 15px; margin-bottom: 8px; }
  .rt-mio.cerca { border: 2px solid var(--navy); padding: 12px 14px; }
  /* Un reto al que se le pasó el plazo se queda apagado, nunca en rojo:
     no es un error de nadie. Y sigue teniendo su lápiz para quitarlo. */
  .rt-mio.cerrado { background: var(--crema); }
  .rt-mio.cerrado h2 { color: var(--texto-suave); }
  .rt-mio .cab { display: flex; align-items: flex-start; gap: 12px; }
  .rt-mio .tit { flex: 1; min-width: 0; }
  .rt-mio h2 { font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
               font-size: 21px; line-height: 1.1; color: var(--navy); margin: 0; }
  .rt-mio .tit p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: var(--texto-suave); }
  /* El lápiz: 40 px de caja, 44 de zona pulsable con el relleno del botón */
  .rt-mio .editar { flex: 0 0 44px; width: 44px; height: 44px; margin: -2px -4px -2px 0; padding: 0;
                    border: 0; background: none; color: var(--texto); cursor: pointer;
                    display: flex; align-items: center; justify-content: center; }
  .rt-mio .editar i { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
                      border: 1px solid var(--linea-marcada); border-radius: 10px; }
  .rt-mio .editar:hover i { border-color: #C9D9E7; color: var(--azul-oscuro); }
  .rt-mio .barra { display: block; height: 8px; border-radius: 999px; background: var(--crema-banda);
                   overflow: hidden; margin-top: 10px; }
  .rt-mio .barra i { display: block; height: 100%; border-radius: 999px; background: var(--navy);
                     transition: width .4s ease; }
  .rt-mio.cerrado .barra i { background: var(--linea-borde); }
  .rt-mio .pie { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 7px; }
  .rt-mio .pie .n { font-size: 15px; font-weight: 600; color: var(--navy); }
  .rt-mio .pie .p { font-size: 14px; color: var(--texto-suave); text-align: right; }
  .rt-mio.cerrado .pie .n { font-weight: 400; color: var(--texto-suave); }

  /* ---- ponerme un reto · tres toques · 38b ---- */
  .rt-campo { display: flex; flex-direction: column; gap: 9px; }
  .rt-campo + .rt-campo { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--linea); }
  .rt-campo > .eti { font-size: 14px; color: var(--texto-suave); padding-left: 2px; }
  .rt-campo .pista { font-size: 14px; line-height: 1.45; color: var(--texto-suave); padding-left: 2px; margin: 0; }
  .rt-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .rt-chips button { min-height: 44px; padding: 0 17px; border-radius: 999px; border: 1px solid var(--linea-borde);
                     background: #fff; color: var(--texto); font: inherit; font-size: 15px; cursor: pointer; }
  .rt-chips button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy);
                                          color: #fff; font-weight: 600; }
  /* La cifra en monoespaciada: es un dato que se compara con el historial */
  .rt-cifra { display: flex; align-items: baseline; gap: 10px; background: #fff; border: 2px solid var(--azul-filete, #3B85C0);
              border-radius: 14px; padding: 12px 16px; }
  .rt-cifra input { flex: 0 1 auto; width: 5.5ch; min-width: 3ch; border: 0; padding: 0; background: none;
                    font-family: var(--fuente-dato); font-size: 30px; font-weight: 700; line-height: 1.3;
                    color: var(--navy); -moz-appearance: textfield; }
  .rt-cifra input::-webkit-outer-spin-button,
  .rt-cifra input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .rt-cifra input:focus { outline: none; }
  .rt-cifra:focus-within { border-color: var(--azul-oscuro); }
  .rt-cifra .u { font-size: 16px; color: var(--texto-suave); }

  /* Nota en crema fuerte: dice lo que más tranquiliza y no gasta un navy */
  .rt-privado { background: var(--crema-banda); border-radius: 14px; padding: 14px 16px; margin-top: 18px; }
  .rt-privado b { display: block; font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
  .rt-privado p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--texto); }

  /* El único botón azul de la pantalla de poner un reto */
  .rt-pie { margin-top: 20px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
  .rt-pie .principal { width: 100%; min-height: 52px; border: 0; border-radius: 999px; background: var(--azul);
                       color: #fff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
                       box-shadow: 0 12px 24px -18px rgba(46,66,86,.5); }
  .rt-pie .principal:hover { background: var(--azul-hover, #1E4E78); }
  .rt-pie .principal[disabled] { opacity: .6; cursor: default; }
  .rt-pie .quitar { min-height: 44px; border: 0; background: none; color: var(--azul-oscuro);
                    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .rt-pie .quitar:hover { color: var(--azul-hover); }

  /* ---- conseguidos: colapsados en filas con visto verde ---- */
  .rt-filas { background: #fff; border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  .rt-fila { display: flex; align-items: center; gap: 12px; padding: 12px 15px; min-height: 48px;
             box-sizing: border-box; border-bottom: 1px solid var(--linea);
             text-decoration: none; color: var(--texto); }
  .rt-fila:last-child { border-bottom: 0; }
  a.rt-fila { -webkit-tap-highlight-color: transparent; }
  a.rt-fila:hover { background: var(--azul-suave); }
  .rt-fila .visto { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 999px; background: var(--verde-fondo);
                    color: var(--verde); display: flex; align-items: center; justify-content: center; }
  .rt-fila .t { flex: 1; min-width: 0; font-size: 15px; color: var(--navy);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-fila .f { flex: 0 0 auto; font-size: 14px; color: var(--texto-suave); }
  .rt-fila .cara { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
                   background: var(--crema-media); color: var(--texto-suave); display: flex;
                   align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .rt-fila .cara img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rt-fila .qui { flex: 1; min-width: 0; }
  .rt-fila .qui b { display: block; font-size: 15px; font-weight: 600; color: var(--navy);
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-fila .qui span { display: block; font-size: 13px; color: var(--texto-suave);
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-fila .rg { font-style: normal; font-weight: 600; color: #8A5307; }
  /* El chevron nunca en azul: se leería como un enlace distinto de la fila (kit 30a) */
  .rt-fila .chev { flex: 0 0 auto; display: flex; color: var(--texto-suave); }
  /* El lápiz también en la fila de conseguidos: un reto propio se puede
     quitar desde donde se vea, sin dar explicaciones. */
  .rt-fila .editar { flex: 0 0 44px; width: 44px; height: 44px; margin: -6px -6px -6px 0; padding: 0;
                     border: 0; background: none; color: var(--texto-suave); cursor: pointer;
                     display: flex; align-items: center; justify-content: center; }
  .rt-fila .editar:hover { color: var(--azul-oscuro); }
  .rt-corte { padding: 11px 15px; font-size: 13px; color: var(--texto-suave);
              background: var(--crema); border-bottom: 1px solid var(--linea); }
  .rt-filas .rt-corte:last-child { border-bottom: 0; }

  /* ---- la escala de los siete rangos · 29a ----
     Aquí sí van los siete colores planos, uno por rango: es la escala
     entera, no la medalla de nadie. Ni dorados brillantes ni degradados. */
  .rt-escala { list-style: none; margin: 0; padding: 0; display: grid;
               grid-template-columns: repeat(4, 1fr); gap: 15px 8px; align-items: start; }
  @media (min-width: 560px) { .rt-escala { grid-template-columns: repeat(7, 1fr); } }
  .rt-escala li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .rt-escala .n { font-size: 14px; font-weight: 600; line-height: 1.2; color: var(--texto); }
  .rt-escala .d { font-family: var(--fuente-dato); font-size: 13px; color: var(--texto-suave); }
  .rt-escala li.porllegar .disco { opacity: .5; }
  .rt-escala li.mio .n { color: #8A5307; }
  .rt-escala .tuyo { font-size: 13px; font-weight: 600; color: #8A5307; }

  .disco { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
           font-family: var(--fuente-titulo); font-weight: 700; font-size: 18px; line-height: 1;
           width: 46px; height: 46px; border: 3px solid transparent; box-sizing: border-box; flex: 0 0 auto; }
  .rg-I   { background: #EFEAE0; border-color: #DCD3C1; color: #7A7365; }
  .rg-II  { background: #E6D2BC; border-color: #C08F63; color: #7A5230; }
  .rg-III { background: #E2E5E8; border-color: #A9B1B9; color: #4F5A64; }
  .rg-IV  { background: #EFE0B8; border-color: #C9A961; color: #755B14; }
  .rg-V   { background: #DDE6E5; border-color: #8FAFAC; color: #3A5754; }
  .rg-VI  { background: #DCE4EF; border-color: #89A0C2; color: #334F79; }
  .rg-VII { background: #2E4256; border-color: #2E4256; color: #fff; }
  .rg-x   { background: #EFEAE0; border-color: #DCD3C1; color: #7A7365; }

  .rt-porques { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--linea); display: grid; gap: 13px; }
  @media (min-width: 640px) { .rt-porques { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  .rt-porques b { display: block; font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 3px; }
  .rt-porques span { font-size: 14px; line-height: 1.5; color: var(--texto); }

  /* ---- medallas · rejilla de cuatro, aro ámbar (38b) ---- */
  /* minmax(0,1fr): sin esto, un nombre largo ensancha su columna y los aros
     salen de tamaños distintos. */
  .rt-medallas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 10px; align-items: start; }
  .rt-med { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .rt-med .aro { width: 100%; aspect-ratio: 1; border-radius: 999px; background: #F6EBD6;
                 border: 2px solid #E0A33C; color: #8A5307; display: flex; align-items: center;
                 justify-content: center; box-sizing: border-box; }
  .rt-med.no .aro { background: none; border: 2px dashed var(--linea-borde); color: var(--texto-suave); }
  .rt-med .n { font-size: 13px; line-height: 1.3; color: var(--texto); text-align: center; overflow-wrap: anywhere; }
  .rt-med.no .n { color: var(--texto-suave); }

  /* ---- buscador ---- */
  .rt-buscar { width: 100%; box-sizing: border-box; padding: 12px 14px; min-height: 48px; margin-bottom: 9px;
               border: 1px solid var(--linea-borde); border-radius: 10px; font-size: 16px; font-family: inherit;
               background: #fff; color: var(--navy); }
  .rt-buscar:focus { outline: 2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }

  /* ---- aviso dentro de la página (no es un toast) ---- */
  .rt-aviso { display: flex; gap: 12px; background: var(--ambar-fondo); border: 1px solid var(--ambar-borde);
              border-radius: 14px; padding: 14px 15px; margin-bottom: 10px; }
  .rt-aviso .ic-caja { background: #F4E4C6; color: #8A5307; }
  .rt-aviso b { display: block; font-size: 15px; font-weight: 600; color: #6B5227; margin-bottom: 3px; }
  .rt-aviso p { margin: 0; font-size: 14px; line-height: 1.5; color: #6B5227; }

  /* ---- nota en crema fuerte: cierra la pantalla sin un segundo navy ---- */
  .rt-cierre { background: var(--crema-banda); border-radius: 14px; padding: 14px 16px; margin-top: 22px; }
  .rt-cierre b { display: block; font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
  .rt-cierre p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--texto); }
  .rt-cierre p + p { margin-top: 7px; }
  /* «Liga Apolana» es nombre propio del club: ámbar (31c) */
  .rt-cierre a { color: #8A5307; font-weight: 600; text-decoration: underline; }

  /* ---- quién puede verte ----
     Ya no hay interruptor aquí: el perfil entre socios se decide en «Mi
     perfil», que es donde se cambian la foto y el nombre. Tener dos
     interruptores para lo mismo hacía que se encendiera uno y no pasara
     nada. Aquí queda la explicación y el camino. */
  .rt-ajustes { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 15px 17px; }
