<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal del club · Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/apolana.css">
<script>window.APOLANA_BASE="../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../assets/js/db.js" defer></script>
<script src="../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .portal-wrap { max-width: 820px; margin: 0 auto; padding: clamp(24px,5vw,48px) clamp(16px,4vw,40px); }
  .portal-wrap h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(30px,6vw,44px); color: var(--navy); margin: 0 0 6px; }
  .portal-wrap .rol { font-family: var(--fuente-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--texto-tenue); margin-bottom: 24px; display: inline-block; }
  .zonas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 16px; }
  .zona { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio-grande); padding: 26px; box-shadow: var(--sombra-suave); text-decoration: none; display: block; }
  .zona:hover { border-color: #C9D9E7; }
  .zona h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 24px; color: var(--navy); margin: 0 0 6px; }
  .zona p { margin: 0; color: var(--texto); font-size: 15px; }
  .zona .ir { display: inline-block; margin-top: 12px; font-weight: 600; color: var(--azul-oscuro); }
  .aviso-portal { background: var(--aviso-fondo); border: 1px solid var(--aviso-borde); border-radius: 12px; padding: 16px 18px; color: var(--aviso-texto); }

  .sep-club { display: flex; align-items: center; gap: 12px; margin: 32px 0 14px; }
  .sep-club span { font-family: var(--fuente-mono); font-size: 10px; letter-spacing: .14em; color: var(--texto-tenue); text-transform: uppercase; }
  .sep-club i { flex: 1; height: 1px; background: var(--linea); display: block; }
  .publico { display: flex; flex-direction: column; gap: 8px; }
  .publico a { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--navy); text-decoration: none; }
  .publico a:hover { border-color: #C9D9E7; }
  .publico a i { color: var(--texto-tenue); font-style: normal; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="portal-wrap" id="portal-wrap">
    <p class="intro">Cargando…</p>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(function (sb, perfil) {
  var wrap = document.getElementById('portal-wrap');
  var base = window.APOLANA_BASE || '../';
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  /* Accesos del club que no dependen del rol (maqueta 19b, bloque «sin cuenta»). */
  var PUBLICO =
    '<div class="sep-club"><i></i><span>Del club</span><i></i></div>' +
    '<div class="publico">' +
      '<a href="' + base + 'noticias/">Noticias y calendario del club<i>&rsaquo;</i></a>' +
      '<a href="' + base + '">Grupos, horarios y precios<i>&rsaquo;</i></a>' +
      '<a href="' + base + 'documentos/">Documentos del club<i>&rsaquo;</i></a>' +
    '</div>';

  if (!perfil) {
    wrap.innerHTML = '<h1>Hola</h1>' +
      '<div class="aviso-portal">Has entrado, pero todavía no encontramos tu ficha en el club (o faltan permisos por activar). Avisa al club para que lo revise.</div>' +
      PUBLICO;
    return;
  }

  var rol = perfil.rol || '';
  var ROLES = {
    atleta:      'Atleta',
    padre:       'Familia',
    entrenador:  'Entrenador/a',
    coordinador: 'Coordinación',
    admin:       'Administración'
  };
  var ZONAS = {
    atleta:      { titulo: 'Mi zona de atleta',      desc: 'Tu entreno, tus marcas, tu bono y tus pagos.',   url: base + 'portal/atleta/' },
    familia:     { titulo: 'Zona de familias',       desc: 'Fichas de tus hijos, asistencia y pagos.',       url: base + 'portal/familia/' },
    entrenador:  { titulo: 'Zona de entrenador',     desc: 'Tus grupos: planificar y leer el feedback.',     url: base + 'portal/entrenador/' },
    coordinador: { titulo: 'Coordinación',           desc: 'Los grupos de tu sección.',                      url: base + 'portal/coordinador/' },
    admin:       { titulo: 'Panel de administración', desc: 'Web, cobros, contenido y usuarios.',            url: base + 'admin/' }
  };

  function tarjetas(claves, descs) {
    return claves.map(function (c) {
      var z = ZONAS[c];
      if (!z) return '';
      var d = (descs && descs[c]) || z.desc;
      return '<a class="zona" href="' + z.url + '"><h2>' + esc(z.titulo) + '</h2><p>' + esc(d) + '</p><span class="ir">Entrar →</span></a>';
    }).join('');
  }

  function pintar(claves, descs) {
    var html = '<h1>Hola, ' + esc(perfil.nombre || '') + '</h1>' +
               '<span class="rol">' + esc(ROLES[rol] || rol) + '</span>';
    if (claves.length) {
      html += '<div class="zonas">' + tarjetas(claves, descs) + '</div>';
      if (claves.length > 1) {
        html += '<p style="margin:14px 0 0;font-size:14px;color:var(--texto-suave)">' +
                'Tienes más de un papel en el club con el mismo correo. Puedes cambiar de panel cuando quieras, sin cerrar sesión.</p>';
      }
    } else {
      html += '<div class="aviso-portal">Tu rol es «' + esc(rol) + '». Aún no hay una zona para él; lo montaremos pronto.</div>';
    }
    wrap.innerHTML = html + PUBLICO;
  }

  /* Primer pintado, inmediato, con el rol de la ficha. */
  var BASICO = { atleta: ['atleta'], padre: ['familia'], entrenador: ['entrenador'],
                 coordinador: ['coordinador'], admin: ['admin'] };
  pintar(BASICO[rol] || []);

  /* Segundo pintado: papeles deducidos de los datos (ficha propia de atleta,
     hijos a cargo, grupos que entrena…). portal-auth.js los calcula. */
  if (typeof APOLANA_PORTAL.papeles === 'function') {
    APOLANA_PORTAL.papeles().then(function (lista) {
      if (!lista || !lista.length) return;
      var claves = [], descs = {};
      lista.forEach(function (p) { claves.push(p.clave); descs[p.clave] = p.desc; });
      pintar(claves, descs);
    }).catch(function () { /* se queda el pintado básico */ });
  }
});
</script>

</body>
</html>
