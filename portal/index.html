<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal del club · Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/apolana.css">
<script>window.APOLANA_BASE="../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../assets/js/db.js" defer></script>
<script src="../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .portal-wrap { max-width: 820px; margin: 0 auto; padding: clamp(24px,5vw,48px) clamp(16px,4vw,40px); }

  /* Cabecera de pantalla (kit 30h): sobre crema, sin barra de color. */
  .portal-wrap h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; line-height:1.05; color: var(--navy); margin: 0 0 4px; }
  .portal-wrap .rol { font-size:13px; color: var(--texto-suave); display: inline-block; }

  /* Rótulo de bloque: Plex Sans, nunca Barlow (fundamentos 28b). */
  .rotulo { font-size:15px; font-weight: 600; color: var(--navy); margin: 48px 0 10px; }
  @media (max-width: 600px) { .rotulo { margin-top: 32px; } }

  /* Fila de lista (kit 30d): un contenedor con separadores, no tarjetas sueltas. */
  .filas { background: #fff; border: 1px solid var(--linea-marcada); border-radius: 14px; overflow: hidden; }
  .filas a { display: flex; align-items: center; gap: 14px; min-height: 48px; box-sizing: border-box;
             padding: 12px 16px; text-decoration: none; color: var(--navy);
             border-bottom: 1px solid var(--linea); }
  .filas a:last-child { border-bottom: 0; }
  .filas a:hover { background: var(--crema); }
  .filas .txt { flex: 1; min-width: 0; }
  .filas b { display: block; font-size:15px; font-weight: 600; color: var(--navy); }
  .filas small { display: block; font-size:13px; line-height: 1.4; color: var(--texto-suave); margin-top: 2px; }
  /* Nombres propios del club: van en ámbar, y solo en texto (carácter 31a). */
  .marca { color: #8A5307; }
  /* El chevron nunca va en azul: se leería como un enlace distinto del resto de la fila. */
  .filas .chev { flex: 0 0 auto; display: flex; color: #6E6656; }

  .nota { margin: 10px 2px 0; font-size:14px; line-height: 1.5; color: var(--texto-suave); }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="portal-wrap" id="portal-wrap">
    <div class="ap-esq" data-esq="filas:4"></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(function (sb, perfil) {
  var wrap = document.getElementById('portal-wrap');
  var base = window.APOLANA_BASE || '../';
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  /* Chevron del kit (30a): el único icono que va a la derecha de una fila. */
  var CHEV = '<span class="chev">' +
             ((window.APOLANA_UI && APOLANA_UI.icono) ? APOLANA_UI.icono('entrar', 20) : '&rsaquo;') +
             '</span>';
  /* La Tribu, Madre Tierra, El Cubo… tienen nombre propio y se distinguen del
     resto, que son categorías (carácter 31c). */
  var NOMBRES_PROPIOS = ['El Cubo', 'La Tribu', 'Madre Tierra', 'Kilómetro Cero',
                         'Vertical Apolana', 'Familia Apolana', 'Liga Apolana'];
  function marcar(html) {
    NOMBRES_PROPIOS.forEach(function (n) { html = html.split(n).join('<span class="marca">' + n + '</span>'); });
    return html;
  }
  function fila(url, titulo, desc) {
    return '<a href="' + url + '"><span class="txt"><b>' + marcar(esc(titulo)) + '</b>' +
           (desc ? '<small>' + esc(desc) + '</small>' : '') + '</span>' + CHEV + '</a>';
  }
  function bloque(rotulo, filas) {
    return '<p class="rotulo">' + esc(rotulo) + '</p><div class="filas">' + filas + '</div>';
  }

  /* Accesos del club que no dependen del rol (maqueta 19b, bloque «sin cuenta»). */
  var PUBLICO = bloque('Del club',
    fila(base + 'noticias/', 'Noticias y calendario del club', 'Lo que pasa en el club, semana a semana.') +
    fila(base, 'Grupos, horarios y precios', 'Dónde y cuándo entrena cada grupo.') +
    fila(base + 'familias/', 'Familia Apolana', 'Cómo baja la cuota cuando hay varios en casa.'));

  /* Pantallas del portal que comparten varios roles. Se pintan como filas
     debajo de las zonas para que se pueda llegar a todas desde aquí. */
  var ACCESOS = {
    perfil:       { titulo: 'Mi perfil',             desc: 'Tu foto, cómo te llamamos, tus datos y tu contraseña.',      url: base + 'portal/perfil/' },
    avisos:       { titulo: 'Avisos al móvil',       desc: 'Que te llegue al teléfono si mañana no hay entreno.',        url: base + 'portal/avisos/' },
    calendario:   { titulo: 'Calendario del club',   desc: 'Entrenos, El Cubo, competiciones y eventos, con apuntarse.', url: base + 'portal/calendario/' },
    cubo:         { titulo: 'El Cubo',               desc: 'Clases abiertas, tu bono y los usos que te quedan.',         url: base + 'portal/cubo/' },
    liga:         { titulo: 'Liga Apolana',          desc: 'Comunica tus pruebas y mira cómo vas en la liga del club.', url: base + 'portal/liga/' },
    mensajes:     { titulo: 'Mensajes',              desc: 'Habla con tu entrenador o con el club.',                    url: base + 'portal/mensajes/' },
    competiciones:{ titulo: 'Competiciones',         desc: 'Calendario de competiciones e inscripciones.',               url: base + 'portal/competiciones/' },
    documentos:   { titulo: 'Documentos',            desc: 'Normativa, autorizaciones y papeles del club.',              url: base + 'portal/documentos/' },
    tienda:       { titulo: 'Tienda del club',       desc: 'Equipación oficial y pedidos de ropa.',                      url: base + 'tienda/' },
    calles:       { titulo: 'Calles de la piscina',  desc: 'Reparto de calles y trabajo de cada grupo.',                 url: base + 'portal/calles/' },
    lesiones:     { titulo: 'Lesiones y disponibilidad', desc: 'Molestias, bajas y quién está disponible para entrenar.', url: base + 'portal/lesiones/' },
    carga:        { titulo: 'Carga y bienestar',     desc: 'Cómo llevas la carga de entrenamiento y cómo te encuentras.', url: base + 'portal/carga/' },
    redes:        { titulo: 'Proponer un post',      desc: 'Sugiere una foto o idea para el Instagram del club.',        url: base + 'portal/redes/' },
    tests:        { titulo: 'Batería de tests',      desc: 'Tus pruebas físicas y cómo vas mejorando.',                  url: base + 'portal/tests/' }
  };
  /* «Mi perfil» va el primero en todos los roles: es de todo el mundo. */
  var ACCESOS_ROL = {
    atleta:      ['perfil', 'avisos', 'liga', 'mensajes', 'calendario', 'cubo', 'competiciones', 'tests', 'lesiones', 'carga', 'redes', 'documentos', 'tienda'],
    familia:     ['perfil', 'avisos', 'liga', 'mensajes', 'calendario', 'cubo', 'competiciones', 'tests', 'redes', 'documentos', 'tienda'],
    entrenador:  ['perfil', 'avisos', 'liga', 'mensajes', 'calendario', 'cubo', 'competiciones', 'tests', 'calles', 'lesiones', 'carga', 'documentos', 'tienda'],
    coordinador: ['perfil', 'avisos', 'calendario', 'competiciones', 'documentos'],
    admin:       ['perfil', 'avisos', 'calendario', 'competiciones', 'calles', 'documentos', 'tienda']
  };

  function accesos(claves) {
    var vistos = [];
    (claves || []).forEach(function (c) {
      (ACCESOS_ROL[c] || []).forEach(function (a) { if (vistos.indexOf(a) === -1) vistos.push(a); });
    });
    if (!vistos.length) return '';
    return bloque('En el portal', vistos.map(function (a) {
      var z = ACCESOS[a];
      return fila(z.url, z.titulo, z.desc);
    }).join(''));
  }

  if (!perfil) {
    wrap.innerHTML = '<h1>Hola</h1>' +
      '<p class="rotulo" style="margin-top:18px">Tu cuenta está dentro</p>' +
      APOLANA_UI.vacio('Todavía no encontramos tu ficha en el club',
        'Has entrado bien, pero tu ficha aún no está enlazada con esta cuenta (o faltan permisos por activar). Avisa al club y lo dejan listo enseguida.',
        APOLANA_UI.boton('Escribir al club', base + 'contacto/')) +
      PUBLICO;
    return;
  }

  var rol = perfil.rol || '';
  var ROLES = {
    atleta:      'Atleta',
    padre:       'Familia',
    entrenador:  'Entrenador/a',
    coordinador: 'Coordinación',
    admin:       'Administración'
  };
  var ZONAS = {
    atleta:      { titulo: 'Mi zona de atleta',      desc: 'Tu entreno, feedback, marcas, clases y bono.',        url: base + 'portal/atleta/' },
    familia:     { titulo: 'Zona de familias',       desc: 'Ficha de tus hijos, faltas, pagos y tienda.',         url: base + 'portal/familia/' },
    entrenador:  { titulo: 'Zona de entrenador',     desc: 'Tus grupos: planificar, pasar lista y leer feedback.', url: base + 'portal/entrenador/' },
    coordinador: { titulo: 'Coordinación',           desc: 'Todos los grupos de tu sección y sus técnicos.',      url: base + 'portal/coordinador/' },
    admin:       { titulo: 'Panel de administración', desc: 'Cobros, contenido web, estadísticas y usuarios.',    url: base + 'admin/' }
  };

  function zonas(claves, descs) {
    return claves.map(function (c) {
      var z = ZONAS[c];
      if (!z) return '';
      return fila(z.url, z.titulo, (descs && descs[c]) || z.desc);
    }).join('');
  }

  function pintar(claves, descs) {
    var html = '<h1>Hola, ' + esc(perfil.nombre || '') + '</h1>' +
               '<span class="rol">' + esc(ROLES[rol] || rol) + '</span>';
    if (claves.length) {
      html += bloque(claves.length > 1 ? 'Tus zonas' : 'Tu zona', zonas(claves, descs));
      if (claves.length > 1) {
        html += '<p class="nota">Tienes más de un papel en el club con el mismo correo. Puedes cambiar de zona cuando quieras, sin cerrar sesión.</p>';
      }
    } else {
      html += '<p class="rotulo">Tu zona</p>' +
        APOLANA_UI.vacio('Todavía no hay una zona para tu papel en el club',
          'Tu cuenta figura como «' + (ROLES[rol] || rol) + '». Estamos montando esa pantalla; mientras tanto, desde aquí abajo llegas a todo lo demás.');
    }
    wrap.innerHTML = html + accesos(claves) + PUBLICO;
  }

  /* Primer pintado, inmediato, con el rol de la ficha. */
  var BASICO = { atleta: ['atleta'], padre: ['familia'], entrenador: ['entrenador'],
                 coordinador: ['coordinador'], admin: ['admin'] };
  pintar(BASICO[rol] || []);

  /* Segundo pintado: papeles deducidos de los datos (ficha propia de atleta,
     hijos a cargo, grupos que entrena…). portal-auth.js los calcula. */
  if (typeof APOLANA_PORTAL.papeles === 'function') {
    APOLANA_PORTAL.papeles().then(function (lista) {
      if (!lista || !lista.length) return;
      /* Login único: si solo tienes un papel, al portal no: directo a tu zona. */
      if (lista.length === 1 && lista[0].url) { location.replace(lista[0].url); return; }
      var claves = [], descs = {};
      lista.forEach(function (p) { claves.push(p.clave); descs[p.clave] = p.desc; });
      pintar(claves, descs);
    }).catch(function () { /* se queda el pintado básico */ });
  }
});
</script>

</body>
</html>
