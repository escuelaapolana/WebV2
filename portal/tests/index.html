<!DOCTYPE html>

<style>
  /* ============================================================
     BATERÍA DE TESTS · toma de datos a pie de pista
     Pensada para el móvil, con una mano y a pleno sol:
     nada por debajo de 12 px, botones de 48 px o más y
     contraste alto sobre crema.
     ============================================================ */
  body { background: var(--crema); }
  .tt-wrap { max-width: 720px; margin: 0 auto; padding: 0 0 40px; }
  .tt-pad { padding: clamp(16px,4vw,26px); }
  .volver { display:inline-flex; align-items:center; gap:7px; min-height:48px; color: var(--azul-oscuro);
            font-weight:600; text-decoration:none; font-size:15px; }
  .volver i { font-style:normal; font-size:21px; line-height:1; }

  h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px;
       line-height:1; color: var(--navy); margin:0 0 6px; }
  .sub { font-size:15px; color: var(--texto-suave); line-height:1.5; margin:0 0 18px; max-width:56ch; }

  /* Radio de tarjeta: 14 px (kit 30b) */
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px;
             padding: clamp(16px,4vw,24px); box-shadow: var(--sombra-suave); margin-bottom:16px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; color: var(--navy); margin:0 0 4px; }
  .tarjeta .ctx { font-size:14px; color: var(--texto-suave); margin:0 0 14px; line-height:1.5; }

  label { display:block; font-size:14px; font-weight:600; color: var(--navy); margin:14px 0 6px; }
  label .apunte { font-weight:400; color: var(--texto-suave); }
  input, select, textarea {
    width:100%; box-sizing:border-box; padding:12px 14px; min-height:48px;
    border:1px solid var(--linea-borde); border-radius:10px; font-size:16px;
    font-family: var(--fuente-texto); background:#fff; color: var(--navy);
  }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }
  textarea { min-height:72px; resize:vertical; }
  .rejilla2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  @media (max-width:420px){ .rejilla2 { grid-template-columns:1fr; } }

  .btn-grande { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    min-height:54px; border:0; border-radius:999px; background: var(--azul); color:#fff;
    font-family:inherit; font-size:17px; font-weight:600; cursor:pointer; margin-top:18px; }
  .btn-grande:hover { background: var(--azul-hover, #1E4E78); }
  .btn-linea { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 20px;
    border:1px solid var(--linea-borde); border-radius:999px; background:#fff; color: var(--texto);
    font-family:inherit; font-size:15px; cursor:pointer; }
  .btn-linea:hover { border-color:#C9D9E7; }
  .btn-linea.marcado { background: var(--navy); border-color: var(--navy); color:#fff; }

  /* --- Baterías guardadas ---
     Un solo contenedor con separadores, no diez tarjetas sueltas
     (kit 30d): así diez baterías se leen como una lista. */
  .caja-filas { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; }
  .bat { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff;
         border:0; border-bottom:1px solid var(--linea); border-radius:0; padding:12px 14px;
         min-height:64px; font-family:inherit; cursor:pointer; }
  .bat:last-child { border-bottom:0; }
  .bat:hover { background: var(--crema); }
  .bat .dia { flex:0 0 62px; text-align:center; background: var(--crema-banda); border-radius:10px; padding:6px 4px; }
  .bat .dia b { display:block; font-family: var(--fuente-titulo); font-size:21px; line-height:1; color: var(--navy); }
  .bat .dia span { display:block; font-size:13px; color: var(--texto-suave); }
  .bat .qué { flex:1; min-width:0; }
  .bat .qué b { display:block; font-size:16px; color: var(--navy); font-weight:600; }
  .bat .qué span { display:block; font-size:13px; color: var(--texto-suave); }
  .bat em { font-style:normal; color: var(--texto-suave); font-size:21px; }

  /* --- Cabecera de la toma --- */
  .cab-toma { background: var(--navy); color:#fff; padding: 14px clamp(14px,4vw,22px) 16px; }
  .cab-toma .fila1 { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .cab-toma .atras { background:none; border:0; color:#fff; font-family:inherit; font-size:15px;
                     min-height:48px; padding:0 10px 0 0; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .cab-toma .atras i { font-style:normal; font-size:21px; }
  /* Contador de la toma: cifra que se mira de reojo mientras se avanza */
  .cab-toma .cuenta { font-family: var(--fuente-dato); font-size:13px; color:#E0A33C; white-space:nowrap; }
  .cab-toma h2 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:28px;
                 line-height:1; color:#fff; margin:8px 0 4px; }
  .cab-toma .cond { font-size:13px; color:rgba(255,255,255,.62); line-height:1.5; }
  /* 44 px de zona pulsable también aquí: a pie de pista se toca con el
     pulgar y con la otra mano ocupada (28g). Lo que crece es el relleno. */
  .cab-toma .cond button { background:none; border:0; color:#8FC0E8; font-family:inherit; font-size:15px;
                           text-decoration:underline; cursor:pointer; min-height:44px;
                           display:inline-flex; align-items:center; padding:0 8px; margin-left:2px; }

  /* --- Chips de test --- */
  .chips { display:flex; gap:8px; overflow-x:auto; padding: 14px clamp(14px,4vw,22px) 4px;
           -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chips button { flex:0 0 auto; min-height:48px; padding:0 16px; border:1px solid var(--linea-borde);
    border-radius:999px; background:#fff; color: var(--texto); font-family:inherit; font-size:15px;
    white-space:nowrap; cursor:pointer; }
  .chips button.activo { background: var(--navy); border-color: var(--navy); color:#fff; font-weight:600; }

  .ayuda-test { padding: 8px clamp(14px,4vw,22px) 0; font-size:13px; color: var(--texto-suave); line-height:1.5; }

  /* --- Formato del RSI --- */
  .formato { display:flex; gap:8px; padding: 12px clamp(14px,4vw,22px) 0; }
  .formato button { flex:1; min-height:60px; border:1px solid var(--linea-borde); border-radius:14px;
    background:#fff; font-family:inherit; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; color: var(--navy); }
  .formato button b { font-family: var(--fuente-titulo); font-size:28px; line-height:1; }
  .formato button span { font-size:13px; color: var(--texto-suave); }
  .formato button.activo { background: var(--navy); border-color: var(--navy); color:#fff; }
  .formato button.activo span { color:rgba(255,255,255,.7); }

  /* --- Lista de atletas --- */
  .lista { padding: 14px clamp(14px,4vw,22px) 0; }
  /* La fila entera es pulsable, no solo un trozo (kit 30d y 28g):
     a pie de pista se acierta con el dedo sin mirar. */
  .at { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff;
        border:0; border-bottom:1px solid var(--linea); border-radius:0; padding:11px 14px;
        min-height:64px; font-family:inherit; cursor:pointer; }
  .at:last-child { border-bottom:0; }
  .at:hover { background: var(--crema); }
  .at.falta { background: var(--crema-media); }
  .at .ini { flex:0 0 44px; height:44px; border-radius:999px; background: var(--crema-banda);
             color: var(--navy); display:flex; align-items:center; justify-content:center;
             font-family: var(--fuente-titulo); font-weight:700; font-size:17px; }
  .at .quien { flex:1; min-width:0; }
  .at .quien b { display:block; font-size:16px; font-weight:600; color: var(--navy);
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .at .quien span { display:block; font-size:13px; color: var(--texto-suave); }
  /* El resultado del test —30 m, CMJ, RSI— es el dato que se compara en
     columna de un atleta a otro y de una batería a la siguiente: va en
     monoespaciada (28c). La unidad y el rótulo, no. */
  .at .marca { flex:0 0 auto; text-align:right; }
  .at .marca b { display:block; font-family: var(--fuente-dato); font-size:21px; font-weight:700; color: var(--navy); font-variant-numeric: tabular-nums; }
  .at .marca b u { font-family: var(--fuente-texto); text-decoration:none; font-size:13px; font-weight:400; color: var(--texto-suave); margin-left:2px; }
  .at .marca .dif { display:block; font-family: var(--fuente-dato); font-size:13px; }
  .at .marca .dif.igual { font-family: var(--fuente-texto); }
  .at .marca .sin { font-size:14px; color: var(--texto-suave); }
  /* Verde solo para la mejora sobre la marca anterior (31a) */
  .mejor { color:#3F7A4C; } .peor { color:#B0563A; } .igual { color: var(--texto-suave); }

  .resumen-toma { padding: 4px clamp(14px,4vw,22px) 0; font-size:13px; color: var(--texto-suave); }

  /* --- Hoja de entrada --- */
  .hoja { position:fixed; inset:0; z-index:1200; background: var(--crema); display:flex; flex-direction:column; }
  .hoja[hidden] { display:none; }
  .hoja .h-cab { background: var(--navy); color:#fff; padding: 14px clamp(14px,4vw,22px) 16px; }
  .hoja .h-cab .fila1 { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hoja .h-cab button.cerrar { background:none; border:0; color:#fff; font-family:inherit; font-size:15px;
                               min-height:48px; padding:0 8px 0 0; cursor:pointer; }
  .hoja .h-cab .cuenta { font-family: var(--fuente-dato); font-size:13px; color:#E0A33C; }
  .hoja .h-cab .quien { display:flex; align-items:center; gap:12px; margin-top:6px; }
  .hoja .h-cab .ini { flex:0 0 44px; height:44px; border-radius:999px; background:rgba(255,255,255,.14);
                      color:#fff; display:flex; align-items:center; justify-content:center;
                      font-family: var(--fuente-titulo); font-weight:700; font-size:17px; }
  .hoja .h-cab .quien .txt { flex:1; min-width:0; }
  .hoja .h-cab .quien .txt b { display:block; font-family: var(--fuente-titulo); text-transform:uppercase;
                          font-size:28px; line-height:1.05; color:#fff; font-weight:700; }
  .hoja .h-cab .quien .txt span { display:block; font-size:13px; color:rgba(255,255,255,.6); }
  .hoja .h-cuerpo { flex:1; overflow-y:auto; padding: 14px clamp(14px,4vw,22px) 0; }
  .hoja .h-pie { padding: 10px clamp(14px,4vw,22px) calc(14px + env(safe-area-inset-bottom));
                 display:flex; gap:10px; border-top:1px solid var(--linea); background: var(--crema); }
  .hoja .h-pie .btn-linea { flex:0 0 auto; }
  .hoja .h-pie .btn-grande { margin-top:0; flex:1; }

  .caja-valor { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px 16px 12px; }
  .caja-valor .cv-cab { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .caja-valor .cv-cab b { font-family: var(--fuente-titulo); text-transform:uppercase; font-weight:700;
                          font-size:28px; line-height:1; color: var(--navy); }
  .caja-valor .cv-cab span { font-size:13px; color: var(--texto-suave); white-space:nowrap; }
  .caja-valor .cv-num { display:flex; align-items:baseline; gap:8px; margin-top:8px; position:relative; }
  /* El número que se está tomando: es EL dato de la pantalla, en
     monoespaciada, para que 4,12 y 4,09 se lean como en un cronómetro. */
  .caja-valor input.grande, .caja-valor .medida {
    flex:0 0 auto; width:4.2ch; border:0; padding:0; min-height:0; border-radius:0;
    font-family: var(--fuente-dato); font-weight:700; font-size:52px; line-height:1.05;
    color: var(--navy); background:transparent; letter-spacing:0;
  }
  /* Copia invisible del número: sirve para que el hueco del campo mida
     exactamente lo que ocupa la cifra y la unidad quede pegada a ella. */
  .caja-valor .medida { position:absolute; left:0; top:0; visibility:hidden; white-space:pre; width:auto; pointer-events:none; }
  .caja-valor input.grande:focus { outline:0; box-shadow:0 3px 0 var(--azul-filete, #3B85C0); }
  .caja-valor input.grande::placeholder { color:#CFC7B6; }
  .caja-valor .uni { font-size:21px; color: var(--texto-suave); }
  .caja-valor .dif-grande { margin-left:auto; font-family: var(--fuente-dato); font-size:16px; font-weight:700; }
  .caja-valor .dif-grande .igual { font-family: var(--fuente-texto); font-weight:400; }
  .caja-valor .cv-pie { display:flex; align-items:center; justify-content:space-between; gap:10px;
                        border-top:1px solid var(--linea); margin-top:10px; padding-top:10px; }
  .caja-valor .cv-pie span { font-size:13px; color: var(--texto-suave); }
  /* El dato derivado (velocidad, índice elástico) también es dato: navy */
  .caja-valor .cv-pie .calc { color: var(--navy); font-weight:600; }

  .intentos { display:flex; gap:8px; margin-top:12px; }
  .intentos button { flex:1; min-height:56px; border:1px solid var(--linea-borde); border-radius:10px;
    background: var(--crema-banda); font-family:inherit; cursor:pointer; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:2px; color: var(--navy); }
  /* La cifra del intento sí es mono; el rótulo «Intento 2», no */
  .intentos button b { font-family: var(--fuente-dato); font-size:17px; font-weight:700; }
  .intentos button span { font-size:13px; color: var(--texto-suave); }
  .intentos button.activo { border-color: var(--azul-filete, #3B85C0); box-shadow:inset 0 0 0 1px var(--azul-filete, #3B85C0); background:#fff; }
  .intentos button.gana { background: var(--navy); border-color: var(--navy); color:#fff; }
  .intentos button.gana span { color:rgba(255,255,255,.7); }
  .intentos button.gana.activo { box-shadow:inset 0 0 0 2px var(--azul-filete, #3B85C0); }
  .intentos button.vacio { background:#fff; border-style:dashed; color: var(--texto-suave); }

  .serie { margin-top:12px; }
  .serie h4 { font-size:13px; font-weight:600; color: var(--texto-suave); margin:0 0 8px; }
  .serie .rejilla { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px; }
  .serie .rejilla button { min-height:56px; border:1px solid var(--linea-borde); border-radius:10px;
    background:#fff; font-family:inherit; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; color: var(--navy); }
  .serie .rejilla button b { font-family: var(--fuente-dato); font-size:16px; font-weight:700; }
  .serie .rejilla button span { font-size:13px; color: var(--texto-suave); }
  .serie .rejilla button.activo { border-color: var(--azul-filete, #3B85C0); box-shadow:inset 0 0 0 1px var(--azul-filete, #3B85C0); }
  .serie .rejilla button.vacio b { color: var(--texto-suave); font-weight:400; }
  .serie .barras { display:flex; align-items:flex-end; gap:5px; background:#fff;
    border:1px solid var(--linea); border-radius:14px; padding:14px 12px 10px; margin-top:10px; }
  .serie .barras > span { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end; }
  .serie .barras i { display:block; width:100%; background:#C3CCD6; border-radius:10px 6px 0 0; }
  .serie .barras i.top { background: var(--navy); }
  .serie .barras em { font-style:normal; font-family: var(--fuente-dato); font-size:13px; color: var(--texto-suave); }

  .medias { display:flex; gap:16px; flex-wrap:wrap; border-top:1px solid var(--linea); margin-top:10px; padding-top:10px; }
  .medias div b { display:block; font-family: var(--fuente-dato); font-size:16px; font-weight:700; color: var(--navy); }
  .medias div span { display:block; font-size:13px; color: var(--texto-suave); }

  /* --- Teclado --- */
  .teclado { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 16px; }
  .teclado button { min-height:58px; border:1px solid var(--linea-borde); border-radius:10px; background:#fff;
    font-family: var(--fuente-display); font-weight:700; font-size:21px; color: var(--navy); cursor:pointer; }
  .teclado button:active { background: var(--azul-suave); }
  .teclado button.aux { background: var(--crema-banda); font-family: var(--fuente-texto);
                        font-size:17px; color: var(--texto-suave); }

  .aviso-falta { background: var(--crema-banda); border:1px solid var(--linea-borde); border-radius:14px;
                 padding:14px 16px; margin-top:12px; font-size:14px; color: var(--texto); line-height:1.5; }

  .guardado { font-size:13px; color:#3F7A4C; min-height:20px; margin-top:10px; }
  .guardado.error { color:#B0563A; }

  .vacio { font-size:14px; color: var(--texto-suave); background:#fff; border:1px dashed var(--linea-borde);
           border-radius:14px; padding:22px 16px; text-align:center; }
  .oculto { display:none !important; }
</style>
<script>
/* Avisos suaves del portal (APX), iguales que en el resto de pantallas. */
(function(){
  if (window.APX) return;
  var css =
    '.apx-host{position:fixed;left:0;right:0;bottom:18px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}'+
    '.apx-toast{pointer-events:auto;max-width:440px;background:var(--navy,#2E4256);color:#fff;font-family:var(--fuente-texto,system-ui);font-size:14px;line-height:1.4;padding:12px 16px;border-radius:10px;box-shadow:0 16px 34px -18px rgba(46,66,86,.7);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}'+
    '.apx-toast.apx-in{opacity:1;transform:none}'+
    '.apx-toast.apx-error{background:#B23A38}'+
    '.apx-toast.apx-ok{background:#2F6FA8}';
  var st=document.createElement('style'); st.textContent=css; (document.head||document.documentElement).appendChild(st);
  var host=null;
  function ensureHost(){ if(!host){ host=document.createElement('div'); host.className='apx-host'; document.body.appendChild(host);} return host; }
  function toast(msg,tipo){
    ensureHost();
    var el=document.createElement('div'); el.className='apx-toast'+(tipo?' apx-'+tipo:''); el.textContent=msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('apx-in'); });
    var vida=(tipo==='error')?4600:2600;
    setTimeout(function(){ el.classList.remove('apx-in'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); }, vida);
  }
  window.APX={ toast:toast };
})();
</script>

<body>

<div id="portal-contenido">
  <div class="tt-wrap" id="tt-wrap"><div class="tt-pad"><div class="ap-esq" data-esq="tarjeta"></div></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  "use strict";

  // ============================================================
  // 0 · UTILIDADES
  // ============================================================
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function pad(n){ return (n<10?'0':'')+n; }
  function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fCorta(iso){
    if(!iso) return '—';
    var p = String(iso).slice(0,10).split('-');
    return p.length===3 ? (parseInt(p[2],10)+' '+MESES[parseInt(p[1],10)-1]) : String(iso);
  }
  function iniciales(a){
    var n=(a.nombre||'').trim(), ap=(a.apellidos||'').trim();
    return ((n?n[0]:'')+(ap?ap[0]:'')).toUpperCase() || '·';
  }
  function nombreAt(a){ return ((a.nombre||'')+' '+(a.apellidos||'')).trim(); }
  function aviso(m,t){ if(window.APX) APX.toast(m,t); }

  // ============================================================
  // 1 · LOS SIETE TESTS
  // ------------------------------------------------------------
  // Unidad, precisión e intentos salen de aquí y de ningún otro
  // sitio: si algún día cambia un test, se cambia solo esta lista.
  // ============================================================
  var TESTS = [
    { k:'30_lanzado', corto:'30 lanz.', nombre:'30 m lanzado', unidad:'s', dec:2, intentos:2, menosMejor:true,
      grupo:'Velocidad', ayuda:'Velocidad máxima ya en carrera: se entra con 20 m de impulso y solo se cronometran los 30 m centrales.' },
    { k:'30_parado', corto:'30 parado', nombre:'30 m parado', unidad:'s', dec:2, intentos:2, menosMejor:true,
      grupo:'Velocidad', ayuda:'Aceleración desde parado. Salida sin tacos, a la voz.' },
    { k:'150m', corto:'150 m', nombre:'150 m', unidad:'s', dec:2, intentos:1, menosMejor:true,
      grupo:'Velocidad', ayuda:'Resistencia a la velocidad. Un solo intento por sesión: el segundo nunca sale limpio.' },
    { k:'cmj', corto:'CMJ', nombre:'CMJ', unidad:'cm', dec:1, intentos:3, menosMejor:false,
      grupo:'Saltos', ayuda:'Salto con contramovimiento: bajas y subes en un gesto, manos en la cintura.' },
    { k:'sj', corto:'SJ', nombre:'SJ', unidad:'cm', dec:1, intentos:3, menosMejor:false,
      grupo:'Saltos', ayuda:'Squat jump: media sentadilla quieta tres segundos, sin rebote.' },
    { k:'abalakov', corto:'Abalakov', nombre:'Abalakov', unidad:'cm', dec:1, intentos:3, menosMejor:false,
      grupo:'Saltos', ayuda:'Como el CMJ pero con brazos libres.' },
    { k:'rsi', corto:'RSI', nombre:'RSI', unidad:'', unidadLarga:'índice', dec:2, intentos:6, menosMejor:false,
      grupo:'Saltos', serie:true, ayuda:'Saltos continuos. El formato de la serie (6 o 10) se elige al empezar y se guarda con el resultado.' }
  ];
  function testPorClave(k){ for(var i=0;i<TESTS.length;i++){ if(TESTS[i].k===k) return TESTS[i]; } return TESTS[0]; }

  function nDec(v,d){ return (v==null||isNaN(v)) ? '' : Number(v).toFixed(d).replace('.',','); }
  // La unidad va SIEMPRE pegada al dato.
  function conUnidad(v,t){
    if(v==null || isNaN(v)) return '—';
    var n = nDec(v,t.dec);
    return t.unidad ? (n+'&nbsp;<u>'+t.unidad+'</u>') : (n+'&nbsp;<u>'+(t.unidadLarga||'')+'</u>');
  }
  function textoConUnidad(v,t){
    if(v==null || isNaN(v)) return '—';
    return nDec(v,t.dec) + (t.unidad ? ' '+t.unidad : (t.unidadLarga?' '+t.unidadLarga:''));
  }

  // El mejor de una serie de intentos: en tiempos el más bajo, en
  // saltos el más alto y en el RSI la media de la serie quitando el
  // peor salto.
  function calcularMejor(t, intentos){
    var v = (intentos||[]).map(Number).filter(function(x){ return !isNaN(x) && x>0; });
    if(!v.length) return null;
    if(t.serie){
      if(v.length===1) return Math.round(v[0]*100)/100;
      var orden = v.slice().sort(function(a,b){ return a-b; }).slice(1);
      var suma = orden.reduce(function(a,b){ return a+b; }, 0);
      return Math.round((suma/orden.length)*100)/100;
    }
    return t.menosMejor ? Math.min.apply(null,v) : Math.max.apply(null,v);
  }

  // Diferencia contra la marca anterior, ya coloreada.
  // OJO: en tiempos MENOS es mejor; en saltos y RSI, MÁS es mejor.
  function difHTML(t, ahora, antes){
    if(ahora==null || antes==null || isNaN(ahora) || isNaN(antes)) return '';
    var d = ahora - antes;
    var r = Math.pow(10,t.dec);
    d = Math.round(d*r)/r;
    if(d===0) return '<span class="dif igual">igual que antes</span>';
    var buena = t.menosMejor ? (d<0) : (d>0);
    var signo = d>0 ? '+' : '−';
    return '<span class="dif '+(buena?'mejor':'peor')+'">'+signo+nDec(Math.abs(d),t.dec)+'</span>';
  }

  // ============================================================
  // 2 · ESTADO DE LA PANTALLA
  // ============================================================
  var GRUPOS = [], BATERIA = null, ATLETAS = [], TEST = TESTS[0], FORMATO_RSI = 6;
  var RES = {};        // 'atletaId|test' -> fila guardada
  var ANT = {};        // 'atletaId|test' o 'atletaId|rsi|6' -> marca anterior
  var ACTIVO = null;   // atleta abierto en la hoja
  var BORRADOR = [];   // intentos que se están tecleando
  var POS = 0;         // intento activo
  var REEMPLAZA = true;// al entrar en un intento ya escrito, la primera tecla lo sustituye
  var guardando = null;

  var wrap = $('tt-wrap');

  function clave(atletaId, t, formato){
    return atletaId+'|'+t.k + (t.serie ? '|'+(formato||FORMATO_RSI) : '');
  }
  function claveRes(atletaId, k){ return atletaId+'|'+k; }

  // ============================================================
  // 3 · CARGA INICIAL: grupos y baterías recientes
  // ============================================================
  async function arrancar(){
    var g = await sb.from('grupos').select('id,nombre,seccion,activo').order('nombre');
    if(g.error){ pantallaError(); return; }
    GRUPOS = (g.data||[]).filter(function(x){ return x.activo !== false; });

  }

  // crudo de la base de datos no se enseña a pie de pista (28f).

  // ============================================================
  // 4 · LA TOMA
  // ============================================================
  async function abrirBateria(id){
    // Un bloque con la forma de la lista de atletas que va a llegar,
    // para que la pantalla no pegue un salto (28f).
    wrap.innerHTML = '<div class="tt-pad">'+ APOLANA_UI.cargando('filas', 6) +'</div>';

    var b = await sb.from('test_baterias')
      .select('id,fecha,grupo_id,sede,temperatura,viento,notas').eq('id',id).single();
    if(b.error){ pantallaError(); return; }
    BATERIA = b.data;

    var qa = sb.from('atletas').select('id,nombre,apellidos,categoria,estado,grupo_id')
      .neq('estado','baja').order('apellidos').order('nombre');
    qa = BATERIA.grupo_id ? qa.eq('grupo_id', BATERIA.grupo_id) : qa.limit(200);
    var a = await qa;
    if(a.error){ pantallaError(); return; }
    ATLETAS = a.data || [];

    RES = {}; ANT = {};
    if(ATLETAS.length){
      var ids = ATLETAS.map(function(x){ return x.id; });

      var rr = await sb.from('test_resultados')
        .select('id,atleta_id,test,intentos,mejor,formato_rsi,no_asiste')
        .eq('bateria_id', BATERIA.id);
      (rr.data||[]).forEach(function(f){
        RES[claveRes(f.atleta_id, f.test)] = f;
        // Si esta batería ya lleva RSI empezado, se abre con ese formato.
        if(f.test==='rsi' && f.formato_rsi) FORMATO_RSI = f.formato_rsi;
      });

      // Marca anterior de cada atleta en cada test (la más reciente de
      // una batería anterior a esta).
      var ra = await sb.from('test_resultados')
        .select('atleta_id,test,mejor,formato_rsi,no_asiste,test_baterias(fecha)')
        .in('atleta_id', ids).neq('bateria_id', BATERIA.id)
        .eq('no_asiste', false).not('mejor','is',null);
      var previos = (ra.data||[]).filter(function(f){
        var fe = f.test_baterias && f.test_baterias.fecha;
        return fe && String(fe) <= String(BATERIA.fecha);
      });
      previos.sort(function(x,y){
        var fx = x.test_baterias.fecha, fy = y.test_baterias.fecha;
        return fx < fy ? 1 : (fx > fy ? -1 : 0);
      });
      previos.forEach(function(f){
        var t = testPorClave(f.test);
        var k = f.atleta_id+'|'+f.test + (t.serie ? '|'+f.formato_rsi : '');
        if(ANT[k]==null) ANT[k] = { valor:Number(f.mejor), fecha:f.test_baterias.fecha };
      });
    }

    pintarToma();
  }

    $('t-atras').addEventListener('click', pantallaInicio);

    }).join('');
    chips.querySelectorAll('[data-t]').forEach(function(b){
      b.addEventListener('click', function(){

        pintarLista();
      });
    });

    $('t-formato').querySelectorAll('[data-f]').forEach(function(b){
      b.addEventListener('click', function(){
        FORMATO_RSI = parseInt(b.getAttribute('data-f'),10);

    pintarLista();

  function pintarLista(){
    $('t-ayuda').textContent = TEST.ayuda;
    var caja = $('t-formato');
    caja.classList.toggle('oculto', !TEST.serie);
    if(TEST.serie){
      caja.querySelectorAll('[data-f]').forEach(function(b){
        b.classList.toggle('activo', parseInt(b.getAttribute('data-f'),10)===FORMATO_RSI);
      });
    }

    var lista = $('t-lista');
    if(!ATLETAS.length){
      lista.innerHTML = APOLANA_UI.vacio('Este grupo no tiene a nadie en activo',
        'No hay atletas de alta en el grupo de esta batería, así que no hay a quién medir. Cambia de grupo o revisa las altas en el panel.');
      $('t-cuenta').textContent = '';
      $('t-resumen').textContent = '';
      return;
    }

    var hechos = 0, faltan = 0;
    lista.innerHTML = '<div class="caja-filas">' + ATLETAS.map(function(a){
      var f = RES[claveRes(a.id, TEST.k)];
      var mismoFormato = !TEST.serie || !f || f.formato_rsi === FORMATO_RSI;
      var derecha;
      if(f && f.no_asiste){
        faltan++;
        derecha = '<span class="sin">No asiste</span>';
      } else if(f && f.mejor!=null && mismoFormato){
        hechos++;
        var ant = ANT[clave(a.id, TEST, FORMATO_RSI)];
        derecha = '<b>'+conUnidad(Number(f.mejor), TEST)+'</b>'+ difHTML(TEST, Number(f.mejor), ant?ant.valor:null);
      } else {
        var ant2 = ANT[clave(a.id, TEST, FORMATO_RSI)];
        derecha = '<span class="sin">'+(ant2 ? 'antes '+textoConUnidad(ant2.valor,TEST) : 'sin dato')+'</span>';
      }
      return '<button type="button" class="at'+((f&&f.no_asiste)?' falta':'')+'" data-at="'+a.id+'">'+
        '<span class="ini">'+esc(iniciales(a))+'</span>'+
        '<span class="quien"><b>'+esc(nombreAt(a))+'</b><span>'+esc(a.categoria||'sin categoría')+'</span></span>'+
        '<span class="marca">'+derecha+'</span>'+
      '</button>';
    }).join('') + '</div>';

    $('t-cuenta').textContent = hechos+' / '+ATLETAS.length;
    $('t-resumen').textContent = TEST.nombre + ' · ' + hechos + ' con marca' +
      (faltan ? ', '+faltan+(faltan===1?' que no asiste':' que no asisten') : '') +
      ' · quedan ' + Math.max(0, ATLETAS.length - hechos - faltan);

    lista.querySelectorAll('[data-at]').forEach(function(b){
      b.addEventListener('click', function(){ abrirHoja(b.getAttribute('data-at')); });
    });
  }

  // ============================================================
  // 5 · LA HOJA DE ENTRADA (un atleta, un test)
  // ============================================================
  function abrirHoja(atletaId){
    ACTIVO = ATLETAS.filter(function(x){ return x.id===atletaId; })[0];
    if(!ACTIVO) return;
    var f = RES[claveRes(ACTIVO.id, TEST.k)];
    var n = TEST.serie ? FORMATO_RSI : TEST.intentos;
    BORRADOR = [];
    for(var i=0;i<n;i++) BORRADOR.push('');
    if(f && Array.isArray(f.intentos) && (!TEST.serie || f.formato_rsi===FORMATO_RSI)){
      f.intentos.forEach(function(v,i){ if(i<n && v!=null) BORRADOR[i] = nDec(Number(v), TEST.dec); });
    }
    POS = 0;
    for(var j=0;j<BORRADOR.length;j++){ if(BORRADOR[j]===''){ POS=j; break; } POS=j; }
    REEMPLAZA = true;
    $('hoja').hidden = false;              // visible antes de pintar: si no, no se
    document.body.style.overflow = 'hidden'; // puede medir el ancho del número
    pintarHoja();
  }

  function cerrarHoja(){
    $('hoja').hidden = true;
    document.body.style.overflow = '';
    ACTIVO = null;
    pintarLista();
  }

  function numeros(){
    return BORRADOR.map(function(v){
      var n = Number(String(v).replace(',','.'));
      return (v==='' || isNaN(n)) ? null : n;
    });
  }

  function pintarHoja(){
    var hoja = $('hoja');
    var f = RES[claveRes(ACTIVO.id, TEST.k)];
    var noAsiste = !!(f && f.no_asiste);
    var vals = numeros().filter(function(x){ return x!=null; });
    var mejor = calcularMejor(TEST, vals);
    var ant = ANT[clave(ACTIVO.id, TEST, FORMATO_RSI)];
    var idx = ATLETAS.indexOf(ACTIVO);

    var precision = TEST.dec + (TEST.dec===1?' decimal':' decimales');
    var etiquetaUnidad = TEST.unidad === 's' ? 'segundos' : (TEST.unidad === 'cm' ? 'centímetros' : 'índice');

    var cuerpo;
    if(noAsiste){
      cuerpo =
        '<div class="aviso-falta"><b>'+esc(nombreAt(ACTIVO))+' no asiste</b> a esta batería. '+
        'No es lo mismo que no tener dato: así queda claro que no se le ha medido porque no vino.<br><br>'+
        'Si al final sí lo hace, vuelve a tocar «No asiste» y podrás anotar los intentos.</div>';
    } else {
      // Tarjeta del valor
      var difG = difHTML(TEST, mejor, ant?ant.valor:null);
      var derivado = '';
      if(TEST.k==='30_lanzado' && mejor) derivado = '<span class="calc">'+nDec(30/mejor,2)+' m/s de velocidad máxima</span>';
      if(TEST.k==='cmj' || TEST.k==='sj'){
        var cmj = TEST.k==='cmj' ? mejor : valorGuardado('cmj');
        var sj  = TEST.k==='sj'  ? mejor : valorGuardado('sj');
        if(cmj && sj) derivado = '<span class="calc">índice elástico '+nDec((cmj-sj)/sj*100,1)+' %</span>';
      }
      if(TEST.k==='abalakov'){
        var cmj2 = valorGuardado('cmj');
        if(cmj2 && mejor) derivado = '<span class="calc">uso de brazos '+nDec((mejor-cmj2)/cmj2*100,1)+' %</span>';
      }

      cuerpo =
        '<div class="caja-valor">'+
          '<div class="cv-cab"><b>'+esc(TEST.nombre)+'</b><span>'+esc(etiquetaUnidad)+' · '+esc(precision)+'</span></div>'+
          '<div class="cv-num">'+
            '<input class="grande" id="h-valor" type="text" inputmode="decimal" autocomplete="off" '+
              'placeholder="'+(TEST.dec===1?'0,0':'0,00')+'" aria-label="Valor del intento" value="'+esc(BORRADOR[POS]||'')+'">'+
            '<span class="medida" id="h-medida" aria-hidden="true"></span>'+
            '<span class="uni">'+esc(TEST.unidad || (TEST.unidadLarga||''))+'</span>'+
            (difG ? '<span class="dif-grande">'+difG+'</span>' : '')+
          '</div>'+
          '<div class="cv-pie">'+
            '<span>'+(ant ? 'Anterior '+esc(textoConUnidad(ant.valor,TEST))+' · '+esc(fCorta(ant.fecha)) : 'Sin marca anterior')+'</span>'+
            (derivado || '<span></span>')+
          '</div>'+
        '</div>';

      cuerpo += TEST.serie ? htmlSerie() : htmlIntentos();
      cuerpo += htmlTeclado();
    }

    hoja.innerHTML =
      '<div class="h-cab">'+
        '<div class="fila1">'+
          '<button type="button" class="cerrar" id="h-cerrar">‹ Lista</button>'+
          '<span class="cuenta">'+(idx+1)+' de '+ATLETAS.length+'</span>'+
        '</div>'+
        '<div class="quien">'+
          '<span class="ini">'+esc(iniciales(ACTIVO))+'</span>'+
          '<span class="txt"><b>'+esc(nombreAt(ACTIVO))+'</b><span>'+esc([ACTIVO.categoria, TEST.nombre].filter(Boolean).join(' · '))+'</span></span>'+
        '</div>'+
      '</div>'+
      '<div class="h-cuerpo">'+cuerpo+'<div class="guardado" id="h-msg"></div></div>'+
      '<div class="h-pie">'+
        '<button type="button" class="btn-linea'+(noAsiste?' marcado':'')+'" id="h-falta">No asiste</button>'+
        '<button type="button" class="btn-grande" id="h-siguiente">'+(idx+1<ATLETAS.length?'Guardar y siguiente':'Guardar y cerrar')+'</button>'+
      '</div>';

    $('h-cerrar').addEventListener('click', async function(){ await guardar(); cerrarHoja(); });
    $('h-falta').addEventListener('click', marcarNoAsiste);
    $('h-siguiente').addEventListener('click', siguienteAtleta);

    var inp = $('h-valor');
    if(inp){
      anchoValor();
      // Con la tipografía recién cargada el ancho cambia: se recalcula.
      requestAnimationFrame(anchoValor);
      inp.addEventListener('focus', function(){ REEMPLAZA = false; setTimeout(function(){ inp.select(); },0); });
      inp.addEventListener('input', function(){
        REEMPLAZA = false;
        BORRADOR[POS] = inp.value.replace(/[^0-9.,]/g,'').replace('.',',');
        if(inp.value !== BORRADOR[POS]) inp.value = BORRADOR[POS];
        refrescarHoja();
      });
    }
    hoja.querySelectorAll('[data-int]').forEach(function(b){
      b.addEventListener('click', function(){ POS = parseInt(b.getAttribute('data-int'),10); REEMPLAZA = true; pintarHoja(); });
    });
    hoja.querySelectorAll('[data-fmt]').forEach(function(b){
      b.addEventListener('click', async function(){
        var nuevo = parseInt(b.getAttribute('data-fmt'),10);
        if(nuevo === FORMATO_RSI) return;
        await guardar();
        FORMATO_RSI = nuevo;
        abrirHoja(ACTIVO.id);
      });
    });
    hoja.querySelectorAll('[data-tec]').forEach(function(b){
      b.addEventListener('mousedown', function(e){ e.preventDefault(); });
      b.addEventListener('click', function(){ teclear(b.getAttribute('data-tec')); });
    });
  }

  // La unidad va pegada al número: el hueco del número crece con lo que
  // se teclea para que la «s» o los «cm» no se queden lejos.
  function anchoValor(){
    var inp = $('h-valor'), med = $('h-medida');
    if(!inp || !med) return;
    med.textContent = inp.value || inp.placeholder || '0,00';
    inp.style.width = (med.offsetWidth + 2) + 'px';
  }

  // El mejor ya guardado de otro test del mismo atleta (para los índices).
  function valorGuardado(k){
    var f = RES[claveRes(ACTIVO.id, k)];
    return (f && !f.no_asiste && f.mejor!=null) ? Number(f.mejor) : null;
  }

  function htmlIntentos(){
    var vals = numeros();
    var mejor = calcularMejor(TEST, vals.filter(function(x){ return x!=null; }));
    var html = '<div class="intentos">';
    for(var i=0;i<BORRADOR.length;i++){
      var v = vals[i];
      var gana = (v!=null && mejor!=null && v===mejor);
      var cls = 'intento'+(i===POS?' activo':'')+(v==null?' vacio':(gana?' gana':''));
      html += '<button type="button" class="'+cls+'" data-int="'+i+'">'+
        '<b>'+(v!=null?nDec(v,TEST.dec):'—')+'</b><span>Intento '+(i+1)+(gana?' ✓':'')+'</span></button>';
    }
    html += '</div>';
    if(BORRADOR.length===1) html = html.replace('class="intentos"','class="intentos" style="max-width:220px"');
    return html;
  }

  function htmlSerie(){
    var vals = numeros();
    var puestos = vals.filter(function(x){ return x!=null; });
    var max = puestos.length ? Math.max.apply(null,puestos) : 1;
    var min = puestos.length ? Math.min.apply(null,puestos) : 0;
    var mejorSalto = puestos.length ? max : null;

    // El formato se elige AL EMPEZAR el test y se guarda con el resultado.
    var html = '<div class="serie">'+
      '<h4>Formato de la serie</h4>'+
      '<div class="formato" style="padding:0">'+
        '<button type="button" data-fmt="6" class="'+(FORMATO_RSI===6?'activo':'')+'"><b>6</b><span>saltos</span></button>'+
        '<button type="button" data-fmt="10" class="'+(FORMATO_RSI===10?'activo':'')+'"><b>10</b><span>saltos</span></button>'+
      '</div>'+
      '<h4 style="margin-top:12px">Serie de '+FORMATO_RSI+' saltos · toca un salto para escribirlo</h4>'+
      '<div class="rejilla">';
    for(var i=0;i<BORRADOR.length;i++){
      var v = vals[i];
      html += '<button type="button" class="'+(i===POS?'activo':'')+(v==null?' vacio':'')+'" data-int="'+i+'">'+
        '<b>'+(v!=null?nDec(v,TEST.dec):'—')+'</b><span>Salto '+(i+1)+'</span></button>';
    }
    html += '</div>';

    if(puestos.length>=2){
      var base = Math.max(0.01, max-min);
      html += '<div class="barras">';
      for(var j=0;j<vals.length;j++){
        var vv = vals[j];
        var alt = vv==null ? 2 : Math.round(20 + ((vv-min)/base)*58);
        html += '<span><i class="'+(vv!=null && vv===mejorSalto?'top':'')+'" style="height:'+alt+'px"></i>'+
                '<em>'+(vv!=null?nDec(vv,TEST.dec):'—')+'</em></span>';
      }
      html += '</div>';

      var media = calcularMejor(TEST, puestos);
      html += '<div class="medias">'+
        '<div><b>'+nDec(media,2)+'</b><span>RSI de la serie</span></div>'+
        '<div><b>'+nDec(max,2)+'</b><span>Mejor salto</span></div>'+
        '<div><b>'+nDec(min,2)+'</b><span>Peor salto</span></div>'+
      '</div>'+
      '<p class="ayuda-test" style="padding:10px 0 0">El RSI de la serie es la media de los saltos descartando el peor. '+
      'Una serie de 6 y una de 10 no se comparan entre sí.</p>';
    }
    html += '</div>';
    return html;
  }

  function htmlTeclado(){
    var teclas = ['1','2','3','4','5','6','7','8','9',',','0','borrar'];
    return '<div class="teclado">'+teclas.map(function(t){
      if(t==='borrar') return '<button type="button" class="aux" data-tec="borrar" aria-label="Borrar">⌫</button>';
      if(t===',') return '<button type="button" class="aux" data-tec="," aria-label="Coma decimal">,</button>';
      return '<button type="button" data-tec="'+t+'">'+t+'</button>';
    }).join('')+'</div>';
  }

  function teclear(t){
    // Si se entra en un intento que ya tenía número, la primera tecla
    // lo sustituye entero: corregir es más rápido que borrar dígito a dígito.
    if(REEMPLAZA && t!=='borrar'){ BORRADOR[POS] = ''; }
    REEMPLAZA = false;
    var v = BORRADOR[POS] || '';
    if(t==='borrar') v = v.slice(0,-1);
    else if(t===','){ if(v.indexOf(',')===-1) v = (v===''?'0':v)+','; }
    else {
      var partes = v.split(',');
      if(partes.length===2 && partes[1].length >= TEST.dec) return;   // no más decimales de los que admite el test
      if(partes.length===1 && v.replace('-','').length >= 4) return;  // ni números absurdos
      v = v + t;
    }
    BORRADOR[POS] = v;
    var inp = $('h-valor'); if(inp) inp.value = v;
    refrescarHoja();
  }

  // Refresca lo que cambia al teclear sin volver a montar la hoja
  // entera (así el cursor no salta y no parpadea al sol).
  function refrescarHoja(){
    anchoValor();
    var vals = numeros();
    var puestos = vals.filter(function(x){ return x!=null; });
    var mejor = calcularMejor(TEST, puestos);
    var ant = ANT[clave(ACTIVO.id, TEST, FORMATO_RSI)];

    var difEl = document.querySelector('#hoja .dif-grande');
    var d = difHTML(TEST, mejor, ant?ant.valor:null);
    if(difEl) difEl.innerHTML = d; else if(d){
      var cont = document.querySelector('#hoja .cv-num');
      if(cont){ var s=document.createElement('span'); s.className='dif-grande'; s.innerHTML=d; cont.appendChild(s); }
    }
    document.querySelectorAll('#hoja [data-int]').forEach(function(b){
      var i = parseInt(b.getAttribute('data-int'),10), v = vals[i];
      var gana = (v!=null && mejor!=null && v===mejor && !TEST.serie);
      b.classList.toggle('vacio', v==null);
      b.classList.toggle('gana', gana);
      b.classList.toggle('activo', i===POS);
      var bb=b.querySelector('b'); if(bb) bb.textContent = (v!=null?nDec(v,TEST.dec):'—');
      var sp=b.querySelector('span');
      if(sp && !TEST.serie) sp.textContent = 'Intento '+(i+1)+(gana?' ✓':'');
    });
    guardarConRetraso();
  }

  // ============================================================
  // 6 · GUARDAR
  // ============================================================
  function guardarConRetraso(){
    if(guardando) clearTimeout(guardando);
    var msg = $('h-msg'); if(msg){ msg.className='guardado'; msg.textContent='Guardando…'; }
    guardando = setTimeout(function(){ guardar(); }, 700);
  }

  async function guardar(){
    if(guardando){ clearTimeout(guardando); guardando = null; }
    if(!ACTIVO) return true;
    var f = RES[claveRes(ACTIVO.id, TEST.k)];
    if(f && f.no_asiste) return true;

    var vals = numeros().filter(function(x){ return x!=null; });
    var msg = $('h-msg');
    if(!vals.length){
      // Sin ningún intento no hay nada que guardar; si había una fila
      // de antes, se retira para que vuelva a quedar "sin dato".
      // Salvo que sea un RSI de OTRO formato: ese no se toca, porque
      // una serie de 6 y una de 10 son dos pruebas distintas.
      if(TEST.serie && f && f.formato_rsi !== FORMATO_RSI) return true;
      if(f){
        var d = await sb.from('test_resultados').delete().eq('id', f.id);
        if(!d.error) delete RES[claveRes(ACTIVO.id, TEST.k)];
      }
      if(msg){ msg.className='guardado'; msg.textContent=''; }
      return true;
    }

    var fila = {
      bateria_id: BATERIA.id,
      atleta_id: ACTIVO.id,
      test: TEST.k,
      intentos: vals,
      mejor: calcularMejor(TEST, vals),
      formato_rsi: TEST.serie ? FORMATO_RSI : null,
      no_asiste: false
    };
    var r = await sb.from('test_resultados')
      .upsert(fila, { onConflict:'bateria_id,atleta_id,test' })
      .select('id,atleta_id,test,intentos,mejor,formato_rsi,no_asiste').single();
    if(r.error){
      if(msg){ msg.className='guardado error'; msg.textContent='No se ha podido guardar este dato. Sigue sin cobertura; vuelve a tocar el número dentro de un momento.'; }
      return false;
    }
    RES[claveRes(ACTIVO.id, TEST.k)] = r.data;
    if(msg){ msg.className='guardado'; msg.textContent='Guardado ✓ '+textoConUnidad(Number(r.data.mejor), TEST); }
    return true;
  }

  async function marcarNoAsiste(){
    var f = RES[claveRes(ACTIVO.id, TEST.k)];
    var msg = $('h-msg');
    if(guardando){ clearTimeout(guardando); guardando = null; }
    if(f && f.no_asiste){
      var d = await sb.from('test_resultados').delete().eq('id', f.id);
      if(d.error){ if(msg){ msg.className='guardado error'; msg.textContent='No se ha podido deshacer. Vuelve a intentarlo en un momento.'; } return; }
      delete RES[claveRes(ACTIVO.id, TEST.k)];
      BORRADOR = BORRADOR.map(function(){ return ''; });
      POS = 0;
      pintarHoja();
      aviso('Vuelve a quedar sin dato');
      return;
    }
    var r = await sb.from('test_resultados')
      .upsert({ bateria_id:BATERIA.id, atleta_id:ACTIVO.id, test:TEST.k,
                intentos:[], mejor:null, formato_rsi: TEST.serie?FORMATO_RSI:null, no_asiste:true },
              { onConflict:'bateria_id,atleta_id,test' })
      .select('id,atleta_id,test,intentos,mejor,formato_rsi,no_asiste').single();
    if(r.error){ if(msg){ msg.className='guardado error'; msg.textContent='No se ha podido guardar. Vuelve a intentarlo en un momento.'; } return; }
    RES[claveRes(ACTIVO.id, TEST.k)] = r.data;
    BORRADOR = BORRADOR.map(function(){ return ''; });
    pintarHoja();
    aviso('Anotado: no asiste','ok');
  }

  async function siguienteAtleta(){
    var ok = await guardar();
    if(!ok) return;
    var i = ATLETAS.indexOf(ACTIVO);
    if(i+1 < ATLETAS.length){
      pintarLista();
      abrirHoja(ATLETAS[i+1].id);
    } else {
      aviso('Última ficha guardada','ok');
      cerrarHoja();
    }
  }

  // Si se cierra la página a medias, no se pierde lo tecleado.
  window.addEventListener('beforeunload', function(){ if(guardando) guardar(); });

  await arrancar();
});
</script>

</body>
</html>
