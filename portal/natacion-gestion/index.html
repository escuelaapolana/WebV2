<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de natación · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<link rel="stylesheet" href="../../assets/css/panel-piezas.css">
<script>window.APOLANA_BASE="../../";
  window.APOLANA_MUNDO = { world:'natacion', screen:'franjas', contentSel:'#ng' };</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/mundos.js" defer></script>
<script src="../../assets/js/panel-piezas.js" defer></script>
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif;
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.20); }
  body { background:var(--crema,#FBF9F4); }
  .ng-wrap { max-width:760px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 46px; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(23px,5.5vw,32px); line-height:1.02; color:var(--navy,#26374B); margin:4px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 16px; }
  select, input[type=text], input[type=number] { font:inherit; font-size:14px; color:var(--navy,#26374B);
            border:1px solid var(--linea-borde,#C9C0AE); border-radius:9px; padding:7px 9px; background:#fff; }
  /* chips de día */
  .ng-tipos { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .ng-tipo { min-height:40px; padding:0 16px; border-radius:12px; border:1px solid var(--linea-marcada,#E4DCCB); background:#fff; font:inherit; font-weight:600; font-size:14px; color:var(--texto,#333); cursor:pointer; }
  .ng-tipo.on { background:#2F6FA8; color:#fff; border-color:#2F6FA8; }
  .ng-dias { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
  .ng-dia { min-width:44px; min-height:44px; padding:0 10px; border-radius:12px; border:1px solid var(--linea-marcada,#E4DCCB);
            background:#fff; font:inherit; font-weight:700; font-size:14px; color:var(--navy,#26374B); cursor:pointer;
            display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; }
  .ng-dia small { font-weight:600; font-size:10.5px; color:var(--texto-tenue,#9A927F); }
  .ng-dia[aria-pressed=true] { background:var(--navy,#26374B); color:#fff; border-color:var(--navy,#26374B); }
  .ng-dia[aria-pressed=true] small { color:#c9d4de; }
  .ng-dia[disabled] { opacity:.4; cursor:default; }
  .ng-dia.hoy::after { content:""; width:5px; height:5px; border-radius:50%; background:#2E7D6B; margin-top:2px; }
  .ng-dia[aria-pressed=true].hoy::after { background:#8fd8c4; }
  /* acordeón */
  .ng-acc { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); margin-bottom:13px; overflow:hidden; }
  .ng-cab { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
            background:none; border:0; padding:15px 16px; font:inherit; cursor:pointer; }
  .ng-cab .sem { width:14px; height:14px; border-radius:50%; flex-shrink:0; border:1px solid rgba(0,0,0,.12); }
  .sem-verde{background:#38a169} .sem-ambar{background:#DD9B1E} .sem-rojo{background:#D64545} .sem-gris{background:#CFC8B8}
  .ng-cab .info { flex:1; min-width:0; }
  .ng-cab .info b { display:block; font-family:var(--ap-titulo); font-size:17px; font-weight:700; color:var(--navy,#26374B); letter-spacing:-.01em; }
  .ng-cab .info span { font-size:13px; color:var(--texto-suave,#6E6656); }
  .ng-cab .chev { flex-shrink:0; color:var(--texto-suave,#6E6656); transition:transform .18s; }
  .ng-acc[open] .ng-cab .chev { transform:rotate(90deg); }
  .ng-cuerpo { padding:2px 16px 16px; border-top:1px solid var(--linea,#EFEAE0); }
  .ng-blq { margin-top:14px; }
  .ng-blq h4 { font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-tenue,#9A927F); font-weight:700; margin:0 0 9px; }
  /* cupos */
  .ng-cupos { display:flex; flex-wrap:wrap; gap:10px; }
  .ng-cupo { display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--navy,#26374B); }
  .ng-cupo input { width:58px; text-align:center; }
  .ng-vac { font-size:13px; color:var(--texto-suave,#6E6656); margin-top:9px; }
  .ng-vac b.rojo{color:#B23B3B} .ng-vac b.verde{color:#2E7D6B} .ng-vac b.ambar{color:#B07A2E}
  /* semáforo forzar */
  .ng-sem-op { display:inline-flex; align-items:center; gap:6px; margin:0 14px 6px 0; font-size:13.5px; cursor:pointer; }
  /* calles / roster */
  .ng-calle-tit { font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-tenue,#9A927F); font-weight:700; margin:14px 0 7px; }
  .ng-fila { border:1px solid var(--linea-marcada,#E4DCCB); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .ng-fila .nom { font-size:15px; font-weight:600; color:var(--navy,#26374B); }
  .ng-fila .tag { font-size:11px; font-weight:600; color:var(--texto-suave,#6E6656); background:var(--crema,#F4EEE1); border-radius:999px; padding:1px 8px; margin-left:6px; }
  .ng-fila .ctrl { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; align-items:center; }
  .ng-quitar { font:inherit; font-size:12.5px; color:#B3261E; background:#FBE3E1; border:1px solid #F1C7C3; border-radius:9px; padding:6px 10px; cursor:pointer; margin-left:auto; }
  .ng-add { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  .ng-add input[type=text] { flex:1 1 150px; }
  .ng-btn { font:inherit; font-weight:600; font-size:14px; background:var(--navy,#26374B); color:#fff; border:none; border-radius:10px; padding:9px 15px; cursor:pointer; }
  .ng-toast { position:fixed; left:50%; bottom:86px; transform:translate(-50%,14px); opacity:0; transition:.24s;
              background:var(--navy,#26374B); color:#fff; font-size:14px; padding:10px 16px; border-radius:999px; z-index:60; }
  .ng-toast.ver { opacity:1; transform:translate(-50%,0); }
  .ng-toast.err { background:#B23B3B; }
  .ng-vacio { color:var(--texto-suave,#6E6656); text-align:center; padding:26px 10px; }
  /* alta de un nadador nuevo */
  .ng-nuevo { display:inline-flex; align-items:center; gap:7px; margin-bottom:16px; background:#2E7D6B; }
  .nf-bg { position:fixed; inset:0; background:rgba(46,66,86,.5); z-index:80; display:flex; align-items:flex-start;
           justify-content:center; padding:clamp(14px,5vh,54px) 14px; overflow:auto; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  .nf-bg[hidden] { display:none; }
  .nf-caja { background:#fff; border-radius:16px; box-shadow:0 30px 70px -25px rgba(46,66,86,.6); width:min(560px,100%); padding:20px 20px 22px; }
  .nf-caja h2 { font-family:var(--ap-titulo); text-transform:uppercase; font-size:22px; color:var(--navy,#26374B); margin:0 0 3px; }
  .nf-caja p.ayuda { font-size:13px; color:var(--texto-suave,#6E6656); margin:0 0 14px; line-height:1.4; }
  .nf-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .nf-campo { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .nf-campo.ancho { grid-column:1 / -1; }
  .nf-campo label { font-size:12px; font-weight:600; color:var(--texto-suave,#6E6656); }
  .nf-campo input, .nf-campo select { width:100%; box-sizing:border-box; }
  .nf-franjas { border:1px solid var(--linea-marcada,#E4DCCB); border-radius:11px; padding:10px; max-height:190px;
                overflow:auto; display:flex; flex-direction:column; gap:6px; }
  .nf-fr { display:flex; align-items:center; gap:9px; font-size:14px; color:var(--navy,#26374B); cursor:pointer; }
  .nf-fr input { width:auto; }
  .nf-acc { display:flex; gap:10px; margin-top:16px; }
  .nf-acc .ng-btn { flex:1; }
  .nf-cancelar { flex:1; font:inherit; font-weight:600; font-size:14px; background:var(--crema-media,#EFE9DC);
                 color:var(--navy,#26374B); border:1px solid var(--linea-borde,#C9C0AE); border-radius:10px; padding:9px 15px; cursor:pointer; }
  .nf-req { color:#B23B3B; }
</style>
</head>
<body>

  <div class="ng-wrap" id="ng"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('ng');
  var FR = [], INS = [], cargado = false;
  var DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  var DIAS_C = ['', 'L', 'M', 'X', 'J', 'V', 'S', 'D'];
  var NIVELES = ['Iniciación', 'Desarrollo', 'Perfeccionamiento'];
  var TIPOS = ['Escuela', 'Máster'];
  var ORDEN_CALLE = { 'C1':1, 'C2':2, 'C3':3, 'C4':4, 'Vaso':9 };

  // ?tipo=Escuela | Máster (viene de la tarjeta del hub). Sin él, todo.
  var params = new URLSearchParams(location.search);
  var TIPO = params.get('tipo');
  if (TIPO !== 'Escuela' && TIPO !== 'Máster') TIPO = null;

  var hoyD = (new Date().getDay() === 0) ? 7 : new Date().getDay();
  var diaSel = hoyD;
  var abierta = null;   // id de la franja desplegada

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(msg, tipo){ var t=document.createElement('div'); t.className='ng-toast'+(tipo==='err'?' err':''); t.textContent=msg;
    document.body.appendChild(t); requestAnimationFrame(function(){ t.classList.add('ver'); });
    setTimeout(function(){ t.classList.remove('ver'); setTimeout(function(){ t.remove(); },260); }, 2000); }
  function hhmm(h){ return String(h).slice(0,5); }
  function opciones(lista, val){ return lista.map(function(o){ return '<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; }).join(''); }
  function callesDe(f){ var c=[]; for (var k=1; k<=(f.calles||1); k++) c.push('C'+k); if (f.tiene_vaso) c.push('Vaso'); return c; }
  function insDe(f){ return INS.filter(function(m){ return m.franja_id===f.id; }); }

  // Tipos que tiene una franja (por sus inscritos; si está vacía, por el nombre del grupo).
  function tiposDe(f){
    // Unión SIEMPRE de los tipos por inscritos + por el nombre del grupo: así una
    // franja mixta ("Escuela + Máster") que de momento solo tenga inscritos de un
    // tipo no se le oculta al responsable del otro (podría no ver ni meter al 1º).
    var t = {}; insDe(f).forEach(function(m){ if(m.tipo) t[m.tipo]=true; });
    if (/m[aá]ster/i.test(f.grupo||'')) t['Máster']=true;
    if (/escuela|perfeccion/i.test(f.grupo||'')) t['Escuela']=true;
    return t;
  }
  function enTipo(f){ return !TIPO || !!tiposDe(f)[TIPO]; }
  function cupoTotal(f){ var c=f.cupos||{}, s=0; for (var k in c){ var n=parseInt(c[k],10); if(!isNaN(n)) s+=n; } return s; }

  async function cargar(){
    var f = await sb.from('natacion_franjas').select('id,dia,hora,orden,grupo,calles,tiene_vaso,semaforo,semaforo_forzado,cupos,admite_niveles,criterio').order('dia').order('hora');
    FR = f.error ? [] : (f.data || []);
    await recargarIns();
    cargado = true;
  }
  async function recargarIns(){
    var i = await sb.from('natacion_inscripciones').select('id,franja_id,calle,nombre,tipo,nivel,atleta_id,acceso_id').eq('activa', true);
    if (!i.error) INS = i.data || [];
  }
  async function mut(prom, msgOk){
    var r = await prom;
    if (r && r.error){ toast('No se pudo guardar: ' + r.error.message, 'err'); return false; }
    if (msgOk) toast(msgOk);
    var f = await sb.from('natacion_franjas').select('id,dia,hora,orden,grupo,calles,tiene_vaso,semaforo,semaforo_forzado,cupos,admite_niveles,criterio').order('dia').order('hora');
    FR = f.error ? FR : (f.data || []);
    await recargarIns(); pintar(); return true;
  }

  function diasConFranjas(){
    var d = {}; FR.forEach(function(f){ if (enTipo(f)) d[f.dia]=true; });
    return Object.keys(d).map(Number).sort(function(a,b){ return a-b; });
  }

  function franjaAcc(f){
    var calles = callesDe(f);
    var todos = insDe(f);
    // El roster se acota al tipo (escuela/adultos) para no mezclar; los CUPOS y
    // las VACANTES cuentan a TODOS (las calles son físicas y compartidas).
    var suyos = TIPO ? todos.filter(function(m){ return m.tipo === TIPO; }) : todos;
    var ct = cupoTotal(f);
    var libres = ct - todos.length;
    var semClass = f.semaforo==='verde'?'sem-verde':f.semaforo==='ambar'?'sem-ambar':f.semaforo==='rojo'?'sem-rojo':'sem-gris';
    var resumen = todos.length + (ct? ' / '+ct : '') + ' nadadores' + (f.semaforo_forzado? ' · forzado' : '');
    var abierto = (abierta === f.id);

    // roster por calle
    var porCalle = {}; suyos.forEach(function(m){ (porCalle[m.calle]=porCalle[m.calle]||[]).push(m); });
    var callesOrden = Object.keys(porCalle).sort(function(a,b){ return (ORDEN_CALLE[a]||9)-(ORDEN_CALLE[b]||9); });
    var moverOpts = FR.filter(function(x){ return x.id!==f.id; }).map(function(x){ return '<option value="'+esc(x.id)+'">'+esc(DIAS[x.dia]+' '+hhmm(x.hora))+'</option>'; }).join('');
    var roster = callesOrden.length ? callesOrden.map(function(c){
      var filas = porCalle[c].sort(function(a,b){ return (a.nombre||'').toLowerCase()<(b.nombre||'').toLowerCase()?-1:1; }).map(function(m){
        return '<div class="ng-fila">' +
          '<span class="nom">'+esc(m.nombre)+'</span><span class="tag">'+esc(m.tipo)+'</span>' +
          '<div class="ctrl">' +
            '<select class="ng-sel-nivel" data-id="'+esc(m.id)+'" title="Nivel">'+opciones(NIVELES, m.nivel)+'</select>' +
            '<select class="ng-sel-calle" data-id="'+esc(m.id)+'" title="Calle">'+opciones(calles, m.calle)+'</select>' +
            '<select class="ng-sel-mover" data-id="'+esc(m.id)+'" title="Mover"><option value="">Mover a…</option>'+moverOpts+'</select>' +
            '<button type="button" class="ng-quitar" data-id="'+esc(m.id)+'">Quitar</button>' +
          '</div></div>';
      }).join('');
      var cupC = (f.cupos && f.cupos[c] != null) ? (' · cupo '+f.cupos[c]) : '';
      return '<div class="ng-calle-tit">Calle '+esc(c)+' · '+porCalle[c].length+esc(cupC)+'</div>'+filas;
    }).join('') : '<p class="ng-vacio" style="padding:14px">Todavía no hay nadie en esta franja.</p>';

    var forz = f.semaforo_forzado || '';
    var cuerpo = !abierto ? '' :
      '<div class="ng-cuerpo">' +
        '<div class="ng-blq">' +
          '<h4>Plazas por calle</h4>' +
          '<div class="ng-cupos">' + calles.map(function(c){
            var v = (f.cupos && f.cupos[c]!=null) ? f.cupos[c] : '';
            return '<label class="ng-cupo">'+esc(c)+' <input type="number" min="0" max="30" class="ng-cupo-in" data-franja="'+esc(f.id)+'" data-calle="'+esc(c)+'" value="'+esc(v)+'"></label>';
          }).join('') + '</div>' +
          '<div class="ng-vac">' + (ct
              ? ('Vacantes: <b class="'+(libres<=0?'rojo':libres<=2?'ambar':'verde')+'">'+Math.max(0,libres)+'</b> de '+ct)
              : 'Pon el cupo de cada calle para calcular las vacantes solas.') + '</div>' +
        '</div>' +
        '<div class="ng-blq">' +
          '<h4>Semáforo de la web</h4>' +
          '<label class="ng-sem-op"><input type="radio" name="forz-'+esc(f.id)+'" class="ng-forz" data-franja="'+esc(f.id)+'" value=""'+(forz===''?' checked':'')+'> Automático</label>' +
          '<label class="ng-sem-op"><input type="radio" name="forz-'+esc(f.id)+'" class="ng-forz" data-franja="'+esc(f.id)+'" value="verde"'+(forz==='verde'?' checked':'')+'> 🟢</label>' +
          '<label class="ng-sem-op"><input type="radio" name="forz-'+esc(f.id)+'" class="ng-forz" data-franja="'+esc(f.id)+'" value="ambar"'+(forz==='ambar'?' checked':'')+'> 🟠</label>' +
          '<label class="ng-sem-op"><input type="radio" name="forz-'+esc(f.id)+'" class="ng-forz" data-franja="'+esc(f.id)+'" value="rojo"'+(forz==='rojo'?' checked':'')+'> 🔴</label>' +
        '</div>' +
        '<div class="ng-blq">' +
          '<h4>Nadadores</h4>' + roster +
          '<div class="ng-add">' +
            '<input type="text" class="ng-nom" list="ng-nombres" data-franja="'+esc(f.id)+'" placeholder="Nombre y apellidos" autocomplete="off">' +
            '<select class="ng-add-tipo">'+opciones(TIPOS, TIPO || (/escuela|perfeccion/i.test(f.grupo||'')?'Escuela':'Máster'))+'</select>' +
            '<select class="ng-add-nivel">'+opciones(NIVELES, NIVELES[0])+'</select>' +
            '<select class="ng-add-calle">'+opciones(calles, calles[0])+'</select>' +
            '<button type="button" class="ng-anadir ng-btn" data-franja="'+esc(f.id)+'">Añadir</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    return '<div class="ng-acc"'+(abierto?' open':'')+'>' +
      '<button type="button" class="ng-cab" data-abrir="'+esc(f.id)+'">' +
        '<span class="sem '+semClass+'" aria-hidden="true"></span>' +
        '<span class="info"><b>'+esc(hhmm(f.hora)+' · '+f.grupo)+'</b><span>'+esc(resumen)+'</span></span>' +
        '<span class="chev" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>' +
      '</button>' + cuerpo +
    '</div>';
  }

  function pintar(){
    var titulo = TIPO==='Escuela' ? 'Escuela de natación' : TIPO==='Máster' ? 'Natación adultos' : 'Gestión de natación';
    var dias = diasConFranjas();
    if (dias.length && dias.indexOf(diaSel) === -1) diaSel = (dias.indexOf(hoyD)!==-1 ? hoyD : dias[0]);

    var chips = [1,2,3,4,5,6,7].map(function(d){
      var hay = dias.indexOf(d) !== -1;
      return '<button type="button" class="ng-dia'+(d===hoyD?' hoy':'')+'" data-dia="'+d+'" aria-pressed="'+(d===diaSel)+'"'+(hay?'':' disabled')+'>' +
        DIAS_C[d]+'<small>'+(d===hoyD?'hoy':'')+'</small></button>';
    }).join('');

    var delDia = FR.filter(function(f){ return f.dia===diaSel && enTipo(f); })
                   .sort(function(a,b){ return hhmm(a.hora)<hhmm(b.hora)?-1:1; });
    var cuerpo = delDia.length ? delDia.map(franjaAcc).join('')
      : '<p class="ng-vacio">No hay franjas'+(TIPO?' de '+(TIPO==='Escuela'?'escuela':'adultos'):'')+' el '+DIAS[diaSel].toLowerCase()+'.</p>';

    // Conmutador Todos / Escuela / Adultos: en las franjas donde escuela y
    // máster comparten hora (y a veces calle), «Todos» los enseña juntos.
    var tipos = '<div class="ng-tipos">' +
      [['','Todos'],['Escuela','Escuela'],['Máster','Adultos']].map(function(t){
        return '<button type="button" class="ng-tipo'+(((TIPO||'')===t[0])?' on':'')+'" data-tipo="'+esc(t[0])+'">'+esc(t[1])+'</button>';
      }).join('') + '</div>';
    wrap.innerHTML =
      '<h1 class="saludo">'+esc(titulo)+'</h1>' +
      '<p class="sub">Elige qué ver y el día; despliega cada franja para sus calles, cupos y nadadores.</p>' +
      '<button type="button" class="ng-btn ng-nuevo">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
        ' Nuevo nadador</button>' +
      tipos +
      '<div class="ng-dias">'+chips+'</div>' + cuerpo + datalistNombres();
  }

  // Lista de nombres que YA tienen ficha en natación, para el desplegable del
  // campo «Añadir»: si eliges uno de estos, la fila nueva se enlaza a su ficha
  // (no sale «separado»). Si es alguien nuevo de verdad, se escribe a mano.
  function datalistNombres(){
    var vistos = {}, ops = [];
    for (var i = 0; i < INS.length; i++){
      var n = (INS[i].nombre || '').trim();
      var k = n.toLowerCase();
      if (n && INS[i].atleta_id && !vistos[k]){ vistos[k] = 1; ops.push('<option value="'+esc(n)+'">'); }
    }
    return '<datalist id="ng-nombres">' + ops.join('') + '</datalist>';
  }

  function semClaseDe(sem){ return 'sem ' + (sem==='verde'?'sem-verde':sem==='ambar'?'sem-ambar':sem==='rojo'?'sem-rojo':'sem-gris'); }

  // Refresca EN SITIO la cabecera (semáforo + resumen) y la línea de vacantes de
  // una franja, sin repintar todo el panel (para no perder el foco al saltar
  // entre las calles al poner cupos).
  function refrescarFranja(f){
    var cab = document.querySelector('[data-abrir="'+f.id+'"]');
    if (!cab) return;
    var acc = cab.closest('.ng-acc');
    var ct = cupoTotal(f), libres = ct - insDe(f).length;
    var sem = cab.querySelector('.sem'); if (sem) sem.className = semClaseDe(f.semaforo);
    var info = cab.querySelector('.info span'); if (info) info.textContent = insDe(f).length + (ct? ' / '+ct : '') + ' nadadores' + (f.semaforo_forzado? ' · forzado' : '');
    var vac = acc && acc.querySelector('.ng-vac');
    if (vac) vac.innerHTML = ct
      ? ('Vacantes: <b class="'+(libres<=0?'rojo':libres<=2?'ambar':'verde')+'">'+Math.max(0,libres)+'</b> de '+ct)
      : 'Pon el cupo de cada calle para calcular las vacantes solas.';
  }

  // Guardar los cupos de una franja (todos sus inputs) SIN repintar todo.
  async function guardarCupos(franjaId){
    var ins = document.querySelectorAll('.ng-cupo-in[data-franja="'+franjaId+'"]');
    var cupos = {};
    [].forEach.call(ins, function(el){ var v=el.value.trim(); if (v!=='' && !isNaN(parseInt(v,10))) cupos[el.getAttribute('data-calle')] = parseInt(v,10); });
    var r = await sb.from('natacion_franjas').update({ cupos: cupos }).eq('id', franjaId);
    if (r && r.error){ toast('No se pudo guardar: '+r.error.message,'err'); return; }
    toast('Plazas guardadas');
    // El trigger recalculó el semáforo: releo SOLO esta franja y refresco en sitio.
    var rf = await sb.from('natacion_franjas').select('id,dia,hora,orden,grupo,calles,tiene_vaso,semaforo,semaforo_forzado,cupos,admite_niveles,criterio').eq('id', franjaId).maybeSingle();
    if (rf && !rf.error && rf.data){
      for (var i=0;i<FR.length;i++){ if (FR[i].id===franjaId){ FR[i]=rf.data; break; } }
      refrescarFranja(rf.data);
    }
  }

  // Si esa persona YA está en natación (misma escritura del nombre), devuelve su
  // identidad: el CÓDIGO de acceso (acceso_id, que es como agrupan por familia
  // las listas «Niños y niñas» / distribución) y la ficha (atleta_id). Así la
  // fila nueva se une a ella y NO sale «separada». Era el fallo de Leonardo: el
  // alta a mano creaba una fila suelta, sin código ni ficha.
  function fichaDe(nombre){
    var n = (nombre || '').trim().toLowerCase();
    if (!n) return null;
    var acc = null, atl = null;
    for (var i = 0; i < INS.length; i++){
      if ((INS[i].nombre || '').trim().toLowerCase() !== n) continue;
      if (!acc && INS[i].acceso_id) acc = INS[i].acceso_id;
      if (!atl && INS[i].atleta_id) atl = INS[i].atleta_id;
    }
    return (acc || atl) ? { acceso_id: acc, atleta_id: atl } : null;
  }

  async function anadir(franjaId){
    var caja = document.querySelector('.ng-nom[data-franja="'+franjaId+'"]');
    var nombre = (caja && caja.value || '').trim();
    if (!nombre){ toast('Pon el nombre', 'err'); return; }
    var acc = caja.closest('.ng-acc');
    var tipo = acc.querySelector('.ng-add-tipo').value;
    var nivel = acc.querySelector('.ng-add-nivel').value;
    var calle = acc.querySelector('.ng-add-calle').value;
    var fila = { franja_id: franjaId, nombre: nombre, tipo: tipo, nivel: nivel, calle: calle, activa: true };
    var id = fichaDe(nombre);   // si ya existe, se reutilizan su código y su ficha
    if (id){ if (id.acceso_id) fila.acceso_id = id.acceso_id; if (id.atleta_id) fila.atleta_id = id.atleta_id; }
    await mut(sb.from('natacion_inscripciones').insert(fila), 'Añadido');
  }

  // ============================================================
  //  ALTA DE UN NADADOR NUEVO (ficha + acceso + franjas + correo)
  //  ------------------------------------------------------------
  //  Hace el alta COMPLETA en un paso (RPC natacion_crear_nadador) y
  //  SIEMPRE manda un correo a la familia: si no tiene cuenta, la
  //  invitación para crearla (familia-invitar); si ya la tiene, sus
  //  horarios (correo-natacion-horarios). La ficha se ata a la familia
  //  sola, por el correo del tutor, cuando abren el enlace.
  // ============================================================
  function franjaLabel(f){ return DIAS[f.dia] + ' ' + hhmm(f.hora) + ' · ' + (f.grupo || ''); }

  function abrirForm(){
    var frOrden = FR.slice().sort(function(a,b){ return (a.dia-b.dia) || (hhmm(a.hora)<hhmm(b.hora)?-1:1); });
    var checks = frOrden.map(function(f){
      return '<label class="nf-fr"><input type="checkbox" class="nf-fr-in" value="'+esc(f.id)+'"> '+esc(franjaLabel(f))+'</label>';
    }).join('') || '<span class="sub">No hay franjas creadas.</span>';
    var bg = document.createElement('div'); bg.className = 'nf-bg'; bg.id = 'nf-bg';
    bg.innerHTML =
      '<div class="nf-caja">' +
        '<h2>Nuevo nadador</h2>' +
        '<p class="ayuda">Se crea su ficha, su código de acceso y sus franjas. Y le llega un correo a la familia: ' +
          'si no tiene cuenta, el enlace para crearla; si ya la tiene, sus horarios.</p>' +
        '<div class="nf-grid">' +
          '<div class="nf-campo ancho"><label>Tipo</label><select id="nf-tipo">' +
            '<option value="Escuela">Escuela de natación (menor)</option>' +
            '<option value="Máster">Máster (adulto)</option></select></div>' +
          '<div class="nf-campo"><label>Nombre <span class="nf-req">*</span></label><input type="text" id="nf-nombre" autocomplete="off"></div>' +
          '<div class="nf-campo"><label>Apellidos</label><input type="text" id="nf-apellidos" autocomplete="off"></div>' +
          '<div class="nf-campo"><label>DNI</label><input type="text" id="nf-dni" autocomplete="off"></div>' +
          '<div class="nf-campo"><label>Fecha de nacimiento</label><input type="date" id="nf-nac"></div>' +
          '<div class="nf-campo ancho"><label id="nf-email-lab">Correo del tutor <span class="nf-req">*</span></label><input type="text" id="nf-email" inputmode="email" autocomplete="off" placeholder="correo@ejemplo.com"></div>' +
          '<div class="nf-campo" id="nf-campo-tutor"><label>Nombre del tutor</label><input type="text" id="nf-tutor" autocomplete="off"></div>' +
          '<div class="nf-campo"><label>Teléfono</label><input type="text" id="nf-tel" inputmode="tel" autocomplete="off"></div>' +
          '<div class="nf-campo"><label>Nivel</label><select id="nf-nivel">'+opciones(NIVELES, NIVELES[2])+'</select></div>' +
          '<div class="nf-campo"><label>Calle</label><select id="nf-calle">'+opciones(['C1','C2','C3','C4'],'C1')+'</select></div>' +
          '<div class="nf-campo ancho"><label>Franjas <span class="nf-req">*</span></label><div class="nf-franjas">'+checks+'</div></div>' +
        '</div>' +
        '<div class="nf-acc">' +
          '<button type="button" class="nf-cancelar" id="nf-cancelar">Cancelar</button>' +
          '<button type="button" class="ng-btn" id="nf-crear">Crear y avisar</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', function(e){ if (e.target===bg) cerrarForm(); });
    document.getElementById('nf-cancelar').addEventListener('click', cerrarForm);
    document.getElementById('nf-crear').addEventListener('click', crearNadador);

    // Escuela vs Máster: en máster el correo es el del PROPIO nadador (adulto,
    // sin tutor) y la calle suele ser C2. Se precarga según el filtro de arriba.
    var selTipo = document.getElementById('nf-tipo');
    if (selTipo){
      selTipo.value = (TIPO === 'Máster') ? 'Máster' : 'Escuela';
      var ajustar = function(){
        var esMas = selTipo.value === 'Máster';
        var lab = document.getElementById('nf-email-lab');
        if (lab) lab.innerHTML = (esMas ? 'Correo del nadador' : 'Correo del tutor') + ' <span class="nf-req">*</span>';
        var ct = document.getElementById('nf-campo-tutor');
        if (ct) ct.style.display = esMas ? 'none' : '';
        var cal = document.getElementById('nf-calle');
        if (cal && esMas && cal.value === 'C1') cal.value = 'C2';
        if (cal && !esMas && cal.value === 'C2') cal.value = 'C1';
      };
      selTipo.addEventListener('change', ajustar);
      ajustar();
    }

    var n = document.getElementById('nf-nombre'); if (n) n.focus();
  }
  function cerrarForm(){ var bg = document.getElementById('nf-bg'); if (bg) bg.remove(); }

  async function crearNadador(){
    var g = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var nombre = g('nf-nombre'), email = g('nf-email').toLowerCase();
    var tipo = g('nf-tipo') || 'Escuela';
    var esMas = tipo === 'Máster';
    var franjas = [].map.call(document.querySelectorAll('.nf-fr-in:checked'), function(c){ return c.value; });
    if (!nombre){ toast('Pon el nombre', 'err'); return; }
    if (!email || email.indexOf('@') < 1){ toast(esMas ? 'Pon el correo del nadador' : 'Pon el correo del tutor', 'err'); return; }
    if (!franjas.length){ toast('Elige al menos una franja', 'err'); return; }
    var btn = document.getElementById('nf-crear'); if (btn){ btn.disabled = true; btn.textContent = 'Creando…'; }

    var r = await sb.rpc('natacion_crear_nadador', {
      p_nombre: nombre, p_apellidos: g('nf-apellidos') || null, p_dni: g('nf-dni') || null,
      p_fecha_nac: g('nf-nac') || null, p_email_tutor: email, p_nombre_tutor: esMas ? null : (g('nf-tutor') || null),
      p_telefono_tutor: g('nf-tel') || null, p_franjas: franjas, p_nivel: g('nf-nivel'),
      p_calle: g('nf-calle') || (esMas ? 'C2' : 'C1'), p_tipo: tipo
    });
    if (r.error){
      toast('No se pudo crear: ' + r.error.message, 'err');
      if (btn){ btn.disabled = false; btn.textContent = 'Crear y avisar'; }
      return;
    }
    var res = r.data || {};

    // Correo SIEMPRE: invitación si no tiene cuenta, horarios si ya la tiene.
    var correoOk = false, correoMsg = '';
    try {
      if (res.ya_tiene_cuenta){
        var rc = await sb.functions.invoke('correo-natacion-horarios', { body:{ codigo: res.codigo } });
        correoOk = !(rc && rc.error); correoMsg = 'horarios';
      } else {
        var ri = await sb.functions.invoke('familia-invitar', { body:{ modo:'real', publico: esMas ? 'master' : 'familia', solo_a: res.email_tutor, forzar:true, confirmar:true } });
        correoOk = !!(ri && !ri.error && ri.data && ri.data.ok); correoMsg = 'invitación para crear cuenta';
      }
    } catch (e){ correoOk = false; }

    cerrarForm();
    if (correoOk) toast(nombre.split(' ')[0] + ' creada · correo enviado (' + correoMsg + ')');
    else toast(nombre.split(' ')[0] + ' creada · ⚠ el correo no salió, reintenta con «Horarios»', 'err');

    await recargarIns();
    var f2 = await sb.from('natacion_franjas').select('id,dia,hora,orden,grupo,calles,tiene_vaso,semaforo,semaforo_forzado,cupos,admite_niveles,criterio').order('dia').order('hora');
    if (!f2.error) FR = f2.data || FR;
    pintar();
  }

  // --- eventos ---
  wrap.addEventListener('click', function(ev){
    if (ev.target.closest && ev.target.closest('.ng-nuevo')){ abrirForm(); return; }
    var cab = ev.target.closest ? ev.target.closest('[data-abrir]') : null;
    if (cab){ var id = cab.getAttribute('data-abrir'); abierta = (abierta===id) ? null : id; pintar(); return; }
    var q = ev.target.closest ? ev.target.closest('.ng-quitar') : null;
    if (q){ if (confirm('¿Quitar a este nadador de la franja?')) mut(sb.from('natacion_inscripciones').update({ activa:false }).eq('id', q.getAttribute('data-id')), 'Quitado'); return; }
    var a = ev.target.closest ? ev.target.closest('.ng-anadir') : null;
    if (a){ anadir(a.getAttribute('data-franja')); return; }
  });
  wrap.addEventListener('change', function(ev){
    var t = ev.target;
    if (t.classList.contains('ng-cupo-in')){ guardarCupos(t.getAttribute('data-franja')); return; }
    if (t.classList.contains('ng-forz')){ mut(sb.from('natacion_franjas').update({ semaforo_forzado: t.value || null }).eq('id', t.getAttribute('data-franja')), 'Semáforo guardado'); return; }
    if (t.classList.contains('ng-sel-nivel')){ mut(sb.from('natacion_inscripciones').update({ nivel: t.value }).eq('id', t.getAttribute('data-id'))); return; }
    if (t.classList.contains('ng-sel-calle')){ mut(sb.from('natacion_inscripciones').update({ calle: t.value }).eq('id', t.getAttribute('data-id'))); return; }
    if (t.classList.contains('ng-sel-mover') && t.value){ mut(sb.from('natacion_inscripciones').update({ franja_id: t.value }).eq('id', t.getAttribute('data-id')), 'Movido de franja'); return; }
  });
  // los chips de día
  wrap.addEventListener('click', function(ev){
    var d = ev.target.closest ? ev.target.closest('.ng-dia') : null;
    if (d && !d.disabled){ diaSel = parseInt(d.getAttribute('data-dia'),10); abierta = null; pintar(); return; }
    var tp = ev.target.closest ? ev.target.closest('.ng-tipo') : null;
    if (tp){ TIPO = tp.getAttribute('data-tipo') || null; abierta = null; pintar(); return; }
  });

  if (!cargado){ wrap.innerHTML = '<div class="ap-esq" data-esq="filas:4"></div>'; await cargar(); }
  // abrir la primera franja del día por defecto
  var prim = FR.filter(function(f){ return f.dia===diaSel && enTipo(f); }).sort(function(a,b){ return hhmm(a.hora)<hhmm(b.hora)?-1:1; })[0];
  if (prim) abierta = prim.id;
  pintar();
});
</script>
</body>
</html>
