<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsable · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  :root{ --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif;
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.22); }
  body{ background:var(--crema,#FBF9F4); }
  .rp-wrap{ max-width:820px; margin:0 auto; padding:clamp(18px,4vw,28px) clamp(14px,4vw,26px) 48px; }
  .rp-fecha{ font-size:14px; color:var(--texto-suave,#6E6656); margin:2px 0 2px; text-transform:capitalize; }
  .rp-saludo{ font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-.01em;
    font-size:clamp(26px,6vw,38px); line-height:1; color:var(--navy,#26374B); margin:0; }
  .rp-rol{ display:inline-flex; align-items:center; gap:7px; margin-top:11px; font-size:13.5px; font-weight:600;
    color:#1c5a49; background:#DEF1EA; border:1px solid #BFE3D7; border-radius:999px; padding:5px 12px; }
  .rp-rol svg{ width:15px; height:15px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .rp-grupo-tit{ font-family:var(--ap-titulo); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
    color:var(--texto-tenue,#9A927F); margin:32px 0 13px; display:flex; align-items:center; gap:10px; }
  .rp-grupo-tit::after{ content:""; flex:1; height:1px; background:var(--linea-marcada,#E4DCCB); }
  .rp-rej{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
  .rp-tar{ display:block; text-align:left; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px;
    box-shadow:var(--s1); padding:16px 18px; cursor:pointer; text-decoration:none; color:inherit; transition:transform .12s, box-shadow .12s; }
  .rp-tar:hover{ transform:translateY(-2px); box-shadow:0 6px 14px rgba(30,45,65,.14),0 18px 30px -8px rgba(30,45,65,.28); }
  .rp-tar:focus-visible{ outline:2px solid var(--azul,#2F6FA8); outline-offset:2px; }
  .rp-ico{ width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .rp-ico svg{ width:23px; height:23px; stroke:currentColor; stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .rp-tar h3{ font-family:var(--ap-titulo); font-size:17px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em; color:var(--navy,#26374B); }
  .rp-tar p{ font-size:13.5px; line-height:1.4; color:var(--texto-suave,#6E6656); margin:0 0 12px; }
  .rp-pie{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--navy,#26374B); }
  .rp-pie .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .i-azul{ background:#EAF2F9; color:#2F6FA8 } .i-verde{ background:#E3F1EA; color:#2E7D6B }
  .i-ambar{ background:#FBEEDA; color:#B07A2E } .i-lila{ background:#EEEBF6; color:#5B4E97 }
  .rp-nota{ margin-top:32px; background:var(--crema-banda,#F1EADC); border-radius:14px; padding:14px 16px; font-size:13.5px; color:#5a5344; line-height:1.5; }
  .rp-nota b{ color:var(--navy,#26374B); }
  .rp-vacio{ color:var(--texto-suave,#6E6656); text-align:center; padding:40px 12px; line-height:1.5; }
</style>
</head>
<body>
  <div class="rp-wrap" id="rp"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('rp');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // Iconos
  var IC = {
    lista: '<svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18M8 6v12"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
    sem:   '<svg viewBox="0 0 24 24"><rect x="7.5" y="2.5" width="9" height="19" rx="4.5"/><circle cx="12" cy="6" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="18" r="2.2"/></svg>',
    olas:  '<svg viewBox="0 0 24 24"><path d="M2 12c1.5 0 1.5-1.4 3-1.4s1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4"/><path d="M2 17c1.5 0 1.5-1.4 3-1.4s1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4"/></svg>'
  };

  // Config de secciones conocidas → cómo se pinta su grupo de tarjetas.
  var NATA = {
    'natacion':         { titulo: 'Natación adultos',    tipo: 'Máster'  },
    'escuela-natacion': { titulo: 'Escuela de natación', tipo: 'Escuela' }
  };
  var TIT_ROL = { 'natacion':'natación', 'escuela-natacion':'natación (escuela)', 'escuela-atletismo':'escuela de atletismo' };

  // 1 · ¿De qué soy responsable?
  var rs = await sb.rpc('mis_secciones_responsable');
  var secciones = (rs && !rs.error && Array.isArray(rs.data))
    ? rs.data.map(function(x){ return (x && typeof x === 'object') ? (x.mis_secciones_responsable || Object.values(x)[0]) : x; })
    : [];

  var hoy = new Date();
  var fechaTxt = hoy.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
  var nombre = (perfil && perfil.nombre) ? perfil.nombre : 'responsable';

  if (!secciones.length) {
    wrap.innerHTML = '<p class="rp-fecha">'+esc(fechaTxt)+'</p>' +
      '<h1 class="rp-saludo">Hola, '+esc(nombre)+'</h1>' +
      '<p class="rp-vacio">Todavía no tienes ninguna sección asignada.<br>Cuando el club te ponga al frente de una, la verás aquí.</p>';
    return;
  }

  // 2 · Datos de natación (solo si lleva alguna sección de natación).
  var seccNata = secciones.filter(function(s){ return NATA[s]; });
  var FR = [], INS = [];
  if (seccNata.length) {
    var rf = await sb.from('natacion_franjas').select('id,dia,grupo,semaforo,activa');
    FR = (rf && !rf.error && rf.data) ? rf.data : [];
    var ri = await sb.from('natacion_inscripciones').select('franja_id,tipo,activa').eq('activa', true);
    INS = (ri && !ri.error && ri.data) ? ri.data : [];
  }
  var diaHoy = (hoy.getDay() === 0) ? 7 : hoy.getDay();   // franjas: 1=lunes … 7=domingo

  function statsTipo(tipo){
    var insT = INS.filter(function(m){ return m.tipo === tipo; });
    var fset = {}; insT.forEach(function(m){ fset[m.franja_id] = true; });
    var franjas = Object.keys(fset);
    var vac = FR.filter(function(f){ return fset[f.id] && f.semaforo === 'verde'; }).length;
    var franjasHoy = FR.filter(function(f){ return fset[f.id] && Number(f.dia) === diaHoy; }).length;
    return { franjas: franjas.length, nadadores: insT.length, hoy: franjasHoy, vacantes: vac };
  }

  function tarjeta(clase, ico, titulo, texto, dot, pie, href){
    return '<a class="rp-tar" href="'+esc(href)+'">' +
      '<span class="rp-ico '+clase+'">'+ico+'</span>' +
      '<h3>'+esc(titulo)+'</h3><p>'+esc(texto)+'</p>' +
      '<span class="rp-pie"><span class="dot" style="background:'+dot+'"></span>'+esc(pie)+'</span></a>';
  }

  function grupoNatacion(seccion){
    var cfg = NATA[seccion];
    var st = statsTipo(cfg.tipo);
    var q = '?tipo=' + encodeURIComponent(cfg.tipo);
    var quien = (cfg.tipo === 'Escuela') ? 'niños' : 'nadadores';
    return '<div class="rp-grupo-tit">'+esc(cfg.titulo)+'</div><div class="rp-rej">' +
      tarjeta('i-azul', IC.lista, 'Franjas y calles',
        'Horarios, niveles y quién nada en cada calle. Altas, bajas y mover.',
        '#2F6FA8', st.franjas+' franjas · '+st.nadadores+' '+quien, '../natacion-gestion/'+q) +
      tarjeta('i-verde', IC.check, 'Quién falta hoy',
        'Pasa lista por franja. Marca las ausencias del día.',
        '#2E7D6B', st.hoy ? ('Hoy: '+st.hoy+(st.hoy===1?' franja':' franjas')) : 'Hoy no toca', '../natacion-asistencia/'+q) +
      tarjeta('i-ambar', IC.sem, 'Plazas y vacantes',
        'El semáforo que ve la web: verde, ámbar o completo.',
        '#B07A2E', st.vacantes+(st.vacantes===1?' con plaza':' con plaza'), '../natacion-gestion/'+q) +
      '</div>';
  }

  function grupoGenerico(seccion){
    return '<div class="rp-grupo-tit">'+esc(TIT_ROL[seccion] || seccion)+'</div>' +
      '<div class="rp-rej">' +
      tarjeta('i-lila', IC.lista, 'Gestión',
        'La gestión de esta sección estará aquí en cuanto la montemos.',
        '#5B4E97', 'Próximamente', '#') +
      '</div>';
  }

  // 3 · Pintar
  var rolTxt = secciones.map(function(s){ return TIT_ROL[s] || s; })
    .filter(function(v,i,a){ return a.indexOf(v)===i; }).join(' y ');
  var cuerpo = secciones.map(function(s){ return NATA[s] ? grupoNatacion(s) : grupoGenerico(s); }).join('');

  wrap.innerHTML =
    '<p class="rp-fecha">'+esc(fechaTxt)+'</p>' +
    '<h1 class="rp-saludo">Hola, '+esc(nombre)+'</h1>' +
    '<span class="rp-rol"><svg viewBox="0 0 24 24"><path d="M2 12c1.5 0 1.5-1.4 3-1.4s1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4"/><path d="M2 17c1.5 0 1.5-1.4 3-1.4s1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4 1.5-1.4 3-1.4 1.5 1.4 3 1.4"/></svg> Responsable de '+esc(rolTxt)+'</span>' +
    cuerpo +
    '<div class="rp-nota"><b>Solo lo tuyo.</b> Ves y gestionas únicamente tus secciones. Cada área sale en su propio grupo de tarjetas; nada se mezcla.</div>';
});
</script>
</body>
</html>
