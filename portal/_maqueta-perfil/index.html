<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Mi perfil (atleta)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<style>
  /* MAQUETA · Mi perfil: datos del atleta, su grupo y entrenador, y ajustes. */
  :root {
    --ap-titulo: 'Bricolage Grotesque', system-ui, sans-serif;
    --dato: var(--fuente-dato, 'IBM Plex Mono', monospace);
    --s1: 0 1px 2px rgba(30,45,65,.07), 0 14px 30px -13px rgba(30,45,65,.30);
    --s2: 0 2px 6px rgba(30,45,65,.10), 0 28px 50px -18px rgba(30,45,65,.42);
    --curva: cubic-bezier(.2,.7,.2,1);
  }
  body { background: var(--crema, #FBF9F4); margin: 0; }

  .ap-top { position: sticky; top: 0; z-index: 40; color: #fff;
    background: linear-gradient(180deg,#2E4258,#25354A);
    box-shadow: 0 3px 14px rgba(20,30,42,.20); border-bottom: 1px solid rgba(255,255,255,.06); }
  .ap-top__acc { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .ap-top .ir-web { display: inline-flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 7px 13px; transition: background .15s ease; }
  .ap-top .ir-web:hover { background: rgba(255,255,255,.18); }
  .ap-top .ir-web svg { width: 15px; height: 15px; }
  .ap-top__in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 11px clamp(14px,4vw,28px); min-height: 54px; box-sizing: border-box; }
  .ap-top .volver { display: inline-flex; align-items: center; gap: 7px; color: #fff; text-decoration: none; font-size: 14.5px; font-weight: 600; }
  .ap-top .volver svg { width: 18px; height: 18px; }

  .ap-wrap { max-width: 720px; margin: 0 auto; padding: clamp(18px,4vw,26px) clamp(14px,4vw,28px) 60px; }
  .rotulo { font-family: var(--ap-titulo); font-weight: 700; text-transform: uppercase; font-size: 15px; color: var(--navy,#26374B); margin: 26px 0 12px; }

  /* Cabecera de perfil */
  .cab { position: relative; overflow: hidden; border-radius: 22px; color: #fff; box-shadow: var(--s2); padding: clamp(24px,5vw,30px); margin-top: 16px; text-align: center;
    background: radial-gradient(120% 130% at 50% -30%, rgba(59,133,192,.5), transparent 55%), linear-gradient(160deg,#2E4258,#1E2D3D); }
  .cab .foto { width: 84px; height: 84px; margin: 0 auto 12px; border-radius: 50%; background: linear-gradient(135deg,#3B85C0,#2E4256); display: grid; place-items: center; font-family: var(--ap-titulo); font-weight: 700; font-size: 34px; box-shadow: 0 6px 18px rgba(0,0,0,.28); border: 3px solid rgba(255,255,255,.22); }
  .cab h1 { font-family: var(--ap-titulo); font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; font-size: clamp(24px,5.5vw,32px); margin: 0; color: #fff; }
  .cab .sub { margin: 6px 0 0; font-size: 14px; color: rgba(255,255,255,.82); }
  .cab .grupo { display: inline-block; margin-top: 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 14px; }

  /* Datos */
  .datos { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 18px; box-shadow: var(--s1); overflow: hidden; }
  .dato { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--linea,#EDE6D7); }
  .dato:last-child { border-bottom: 0; }
  .dato .k { font-size: 14px; color: var(--texto-suave,#6E6656); }
  .dato .v { font-size: 14px; font-weight: 600; color: var(--navy,#26374B); text-align: right; }
  .dato .v small { display: block; font-weight: 500; font-size: 12px; color: var(--texto-suave,#6E6656); }

  /* Ajustes (lista tocable) */
  .lista { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 18px; box-shadow: var(--s1); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 13px; padding: 15px 16px; border-bottom: 1px solid var(--linea,#EDE6D7); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; font: inherit; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: #FBFAF6; }
  .item .ic { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; background: var(--azul-suave,#E7F1F9); color: var(--azul-oscuro,#2F6FA8); display: grid; place-items: center; }
  .item .ic svg { width: 19px; height: 19px; }
  .item .tx { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; color: var(--navy,#26374B); }
  .item .tx small { display: block; font-weight: 400; font-size: 12.5px; color: var(--texto-suave,#6E6656); }
  .item .fl { flex: 0 0 auto; color: var(--texto-tenue,#9A927F); }
  .item .fl svg { width: 18px; height: 18px; }
  .item.salir .ic { background: #F7E7E2; color: #B0563A; }
  .item.salir .tx { color: #B0563A; font-weight: 600; }
  /* Interruptor */
  .sw { flex: 0 0 auto; width: 46px; height: 27px; border-radius: 999px; background: var(--azul-filete,#3B85C0); position: relative; border: 0; cursor: pointer; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: transform .2s var(--curva); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .sw.off { background: #D4CDBC; }
  .sw.off::after { transform: translateX(0); }
  .sw:not(.off)::after { transform: translateX(19px); }

  .nota-maqueta { margin: 26px 0 0; text-align: center; font-size: 12.5px; color: var(--texto-tenue,#9A927F); }
  .nota-maqueta a { color: var(--azul-oscuro,#2F6FA8); font-weight: 600; }
</style>
</head>
<body>

<header class="ap-top">
  <div class="ap-top__in">
    <a class="volver" href="../_maqueta/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg> Mi zona</a>
    <div class="ap-top__acc">
      <a class="ir-web" href="../../" title="Ir a la web del club"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg> Web</a>
    </div>
  </div>
</header>

<main class="ap-wrap">
  <!-- Cabecera -->
  <section class="cab">
    <div class="foto">A</div>
    <h1>Andrés Clavero</h1>
    <p class="sub">Sub-20 · desde 2019</p>
    <span class="grupo">Academia AC98</span>
  </section>

  <!-- Datos -->
  <p class="rotulo">Mis datos</p>
  <section class="datos">
    <div class="dato"><span class="k">Grupo</span><span class="v">Academia AC98<small>Velocistas</small></span></div>
    <div class="dato"><span class="k">Entrenador</span><span class="v">Andrés</span></div>
    <div class="dato"><span class="k">Categoría</span><span class="v">Sub-20</span></div>
    <div class="dato"><span class="k">Licencia</span><span class="v">A-12345</span></div>
    <div class="dato"><span class="k">Cuota</span><span class="v">Al día<small>110 € / año</small></span></div>
  </section>

  <!-- Ajustes -->
  <p class="rotulo">Ajustes</p>
  <section class="lista">
    <div class="item">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
      <span class="tx">Avisos<small>Entreno de hoy, competiciones</small></span>
      <button type="button" class="sw" onclick="this.classList.toggle('off')" aria-label="Avisos"></button>
    </div>
    <button type="button" class="item">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <span class="tx">Cambiar contraseña</span>
      <span class="fl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
    <button type="button" class="item">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .8-1 1.7M12 17h.01"/></svg></span>
      <span class="tx">Ayuda<small>Dudas con la app</small></span>
      <span class="fl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
    <button type="button" class="item salir">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 17l5-5-5-5M21 12H9M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg></span>
      <span class="tx">Cerrar sesión</span>
    </button>
  </section>

  <p class="nota-maqueta">Maqueta con datos de ejemplo · <a href="../_maqueta/">Mi zona</a></p>
</main>

</body>
</html>
