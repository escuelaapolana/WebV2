<style>
  body { background: var(--crema-media); }
  .cg-wrap { max-width: 1080px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  .cg-wrap h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(28px,6vw,42px); color: var(--navy); margin: 0 0 4px; line-height:1; }
  .cg-wrap .sub { display:block; font-family: var(--fuente-mono); font-size: 12px; letter-spacing:.03em; text-transform:none; color: var(--texto-tenue); }
  .volver { display:inline-block; margin-bottom:14px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:14px; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(16px,3vw,24px); box-shadow: var(--sombra-suave); margin-top:16px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 21px; color: var(--navy); margin: 0 0 4px; }
  .tarjeta h3 { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.08em; text-transform:none; color: var(--azul-oscuro); margin:0 0 8px; font-weight:500; }
  .tarjeta .pie-tarjeta { font-size:13px; color: var(--texto-suave); margin:10px 0 0; }
  .vacio { color: var(--texto-suave); font-size:14px; margin:6px 0 0; }

  /* pestañas de papel (atleta / grupo) */
  .pestanas { display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 0; }
  .pestanas button { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:none; padding:10px 16px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); cursor:pointer; line-height:1; }
  .pestanas button:hover { border-color: var(--azul); color: var(--navy); }
  .pestanas button.activa { background: var(--navy); border-color: var(--navy); color:#fff; }

  select { padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); max-width:100%; }
  .barra-sel { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .barra-sel label { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:none; color: var(--texto-tenue); }

  /* cifras grandes */
  .cifras { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .cifra { background: var(--crema); border:1px solid var(--linea); border-radius:14px; padding:12px 14px; }
  .cifra b { display:block; font-family: var(--fuente-titulo); font-weight:700; font-size:30px; line-height:1.05; color: var(--navy); }
  .cifra span { display:block; font-family: var(--fuente-mono); font-size:10px; letter-spacing:.03em; text-transform:none; color: var(--texto-tenue); margin-top:2px; }
  .cifra small { display:block; font-size:12px; color: var(--texto-suave); margin-top:4px; }

  /* semáforo de lectura */
  .lectura { border-radius:14px; padding:14px 16px; border:1px solid; }
  .lectura .et { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.03em; text-transform:none; display:block; margin-bottom:3px; }
  .lectura b { display:block; font-family: var(--fuente-titulo); text-transform:uppercase; font-size:22px; line-height:1.05; margin-bottom:5px; }
  .lectura p { margin:0; font-size:14px; line-height:1.5; }
  .lectura.ok    { background:#e9f5ec; border-color:#c3e2cd; color:#1d5c33; }
  .lectura.ok .et, .lectura.ok b { color:#1e7a3d; }
  .lectura.ojo   { background: var(--aviso-fondo); border-color: var(--aviso-borde); color: var(--aviso-texto); }
  .lectura.ojo .et, .lectura.ojo b { color: var(--aviso-titulo); }
  .lectura.alto  { background:#fbeceb; border-color:#e6c3bf; color:#7a1f18; }
  .lectura.alto .et, .lectura.alto b { color:#b3261e; }
  .lectura.baja  { background: var(--azul-suave); border-color:#C9D9E7; color: var(--navy); }
  .lectura.baja .et, .lectura.baja b { color: var(--azul-oscuro); }
  .lectura.neutra{ background: var(--crema); border-color: var(--linea); color: var(--texto); }
  .lectura.neutra .et, .lectura.neutra b { color: var(--texto-suave); }

  /* gráficos */
  .graficos { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:12px; }
  .grafico { border:1px solid var(--linea); border-radius:14px; padding:8px 8px 4px; background: var(--crema); }
  .grafico svg { width:100%; height:auto; display:block; }
  .grafico .leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color: var(--texto-suave); padding:2px 4px 6px; }
  .grafico .leyenda i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  .grafico .sin { font-size:13px; color: var(--texto-suave); padding:26px 10px; text-align:center; }
  .ancho { grid-column: 1 / -1; }

  /* tablas */
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; vertical-align:top; }
  th { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.08em; text-transform:none; color: var(--texto-tenue); white-space:nowrap; }
  td.num, th.num { text-align:right; font-family: var(--fuente-mono); }
  .tabla-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  tr.fila-at { cursor:pointer; }
  tr.fila-at:hover td { background: var(--crema); }
  tr.fila-at.sel td { background: var(--azul-suave); }
  .nom-at { font-weight:600; color: var(--navy); white-space:nowrap; }

  /* señales */
  .senales { display:flex; flex-wrap:wrap; gap:4px; }
  .senal { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.03em; text-transform:none; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .senal.n3 { background:#fbeceb; color:#b3261e; }
  .senal.n2 { background: var(--aviso-fondo); color:#8a7328; }
  .senal.n1 { background: var(--crema-media); color: var(--texto-suave); }
  .senal.ok { background:#e9f5ec; color:#1e7a3d; }

  .ordenar { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px; }
  .ordenar button { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.05em; text-transform:none; padding:7px 12px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); cursor:pointer; line-height:1; }
  .ordenar button.activa { border-color: var(--azul); color: var(--azul-oscuro); font-weight:700; }

  .lista-pend { list-style:none; margin:8px 0 0; padding:0; }
  .lista-pend li { display:flex; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--linea); font-size:14px; }
  .lista-pend li:last-child { border-bottom:0; }
  .lista-pend .f { font-family: var(--fuente-mono); font-size:11px; color: var(--texto-tenue); min-width:64px; text-transform:none; }

  .molestias li { display:flex; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--linea); font-size:14px; }
  .molestias { list-style:none; margin:8px 0 0; padding:0; }
  .molestias li:last-child { border-bottom:0; }
  .molestias .veces { font-family: var(--fuente-mono); font-size:11px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .molestias .veces.rep { background:#fbeceb; color:#b3261e; }
  .molestias .txt { color: var(--texto); }

  .barra-cumpl { height:8px; border-radius:4px; background: var(--crema-media); overflow:hidden; margin-top:6px; }
  .barra-cumpl i { display:block; height:100%; background: var(--azul); }

  .nota-metodo { background: var(--crema); border-left:3px solid var(--azul); border-radius:8px; padding:11px 13px; font-size:13px; color: var(--texto); line-height:1.5; margin-top:12px; }
  .nota-metodo b { color: var(--navy); }
  .aviso-medico { background: var(--aviso-fondo); border:1px solid var(--aviso-borde); border-radius:12px; padding:14px 16px; margin-top:16px; }
  .aviso-medico .et { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.03em; text-transform:none; color: var(--aviso-titulo); display:block; margin-bottom:4px; }
  .aviso-medico p { margin:0 0 6px; font-size:14px; line-height:1.5; color: var(--aviso-texto); }
  .aviso-medico p:last-child { margin-bottom:0; }

  @media (max-width:620px){
    th,td { padding:8px 6px; font-size:13px; }
    .cifra b { font-size:26px; }
  }
</style>

<div id="portal-contenido">
  <div class="cg-wrap" id="cg-wrap"><p class="intro">Cargando…</p></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cg-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  // Nombre de la sección tal y como se dice (en la base se guarda el identificador sin acentos)
  var SECCIONES = {
    escuela:'Escuela', competicion:'Competición', running:'Running', natacion:'Natación',
    'escuela-natacion':'Escuela de natación', triatlon:'Triatlón', montana:'Montaña',
    cubo:'El Cubo', pista:'Pista', 'escuela-municipal':'Escuela municipal', 'deporte-adaptado':'Deporte adaptado'
  };
  function nombreSeccion(s){ return SECCIONES[s] || s; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  /* ==================================================================
     FECHAS
     ================================================================== */
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  function addDias(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MESES[d.getMonth()]; }
  function fechaDia(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb']; return di[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]; }

  var HOY = isoDe(new Date());
  var SEMANAS_GRAFICO = 12;                       // lo que se dibuja
  var DESDE = addDias(lunesDe(HOY), -7 * 15);     // se piden 3 semanas más para poder calcular la media de 28 días

  /* ==================================================================
     CARGA DE ENTRENAMIENTO (método sRPE)
     Carga de una sesión = esfuerzo (RPE 1-10) × minutos de sesión.
     Si la sesión no tiene la duración apuntada, se estima por el tipo
     y se avisa en pantalla. Nunca se estima en silencio.
     ================================================================== */
  var DUR_ESTIMADA = { pista:90, natacion:75, gym:60, continuo:60, activacion:40, competicion:120, descanso:0 };
  var DUR_POR_DEFECTO = 75;
  function duracionDe(ses){
    if (ses && ses.duracion_min > 0) return { min: ses.duracion_min, estimada:false };
    var t = ses && ses.tipo ? ses.tipo : '';
    var m = (DUR_ESTIMADA[t] != null) ? DUR_ESTIMADA[t] : DUR_POR_DEFECTO;
    return { min: m, estimada:true };
  }
  function num(v){ var n = (v==null || v==='') ? null : Number(v); return (n==null || isNaN(n)) ? null : n; }
  function redon(v, d){ if(v==null) return null; var p=Math.pow(10,d||0); return Math.round(v*p)/p; }
  function mil(v){ if(v==null) return '—'; return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function coma(v,d){ if(v==null) return '—'; return redon(v,d).toFixed(d).replace('.',','); }

  /* ==================================================================
     ANÁLISIS DE UN ATLETA
     ================================================================== */
  function analiza(regs, sesiones){
    // regs: [{fecha,rpe,sensacion,sueno,peso,molestias,tipo,titulo,dur,estimada,carga}]
    // sesiones: las publicadas que le tocaban (ya filtradas), con fecha <= hoy
    var porDia = {}, i, k;
    for (i=0;i<regs.length;i++){ porDia[regs[i].fecha] = (porDia[regs[i].fecha]||0) + regs[i].carga; }

    var dias = [];
    for (var f = DESDE; f <= HOY; f = addDias(f,1)) dias.push({ f:f, c: porDia[f]||0 });

    var aguda = [], cronica = [], ratio = [];
    for (i=0;i<dias.length;i++){
      var s7=0, s28=0;
      for (k=Math.max(0,i-6); k<=i; k++) s7 += dias[k].c;
      for (k=Math.max(0,i-27); k<=i; k++) s28 += dias[k].c;
      aguda.push(s7);
      var cr = (i>=27) ? s28/4 : null;
      cronica.push(cr);
      ratio.push((cr && cr>0) ? s7/cr : null);
    }

    // Carga por semana (lunes a domingo), últimas SEMANAS_GRAFICO
    var porSem = {};
    for (i=0;i<regs.length;i++){ var L=lunesDe(regs[i].fecha); porSem[L]=(porSem[L]||0)+regs[i].carga; }
    var semanas = [];
    var lunHoy = lunesDe(HOY);
    for (i=SEMANAS_GRAFICO-1;i>=0;i--){
      var L2 = addDias(lunHoy, -7*i);
      semanas.push({ lunes:L2, carga: porSem[L2]||0 });
    }
    var conDatos = 0;
    for (i=0;i<semanas.length;i++) if (semanas[i].carga>0) conDatos++;

    // Medias recientes de bienestar
    function ventana(dd){
      var lim = addDias(HOY, -dd+1), out=[];
      for (var j=0;j<regs.length;j++) if (regs[j].fecha >= lim) out.push(regs[j]);
      return out;
    }
    function media(arr, campo){
      var s=0, n=0;
      for (var j=0;j<arr.length;j++){ var v=arr[j][campo]; if (v!=null){ s+=v; n++; } }
      return n ? s/n : null;
    }
    var v7 = ventana(7), v14 = ventana(14), v28 = ventana(28);
    var molest14 = 0;
    for (i=0;i<v14.length;i++) if (v14[i].molestias && String(v14[i].molestias).trim()) molest14++;

    // Bienestar semana a semana (para los gráficos)
    var bien = [];
    for (i=0;i<semanas.length;i++){
      var L3 = semanas[i].lunes, fin = addDias(L3,6), dentro=[];
      for (k=0;k<regs.length;k++) if (regs[k].fecha>=L3 && regs[k].fecha<=fin) dentro.push(regs[k]);
      bien.push({
        lunes:L3,
        rpe: media(dentro,'rpe'),
        sensacion: media(dentro,'sensacion'),
        sueno: media(dentro,'sueno'),
        peso: media(dentro,'peso'),
        n: dentro.length
      });
    }

    // Cumplimiento: de lo publicado, ¿cuánto ha rellenado?
    var hechas = {};
    for (i=0;i<regs.length;i++) hechas[regs[i].sesion_id] = true;
    var lim28 = addDias(HOY,-27);
    var esperadas=[], pendientes=[], esperadas28=0, hechas28=0;
    for (i=0;i<sesiones.length;i++){
      var s = sesiones[i];
      if (s.tipo === 'descanso') continue;
      if (s.fecha > HOY) continue;
      esperadas.push(s);
      if (!hechas[s.id]) pendientes.push(s);
      if (s.fecha >= lim28){ esperadas28++; if (hechas[s.id]) hechas28++; }
    }
    pendientes.sort(function(a,b){ return a.fecha<b.fecha?1:-1; });

    // Molestias agrupadas por zona
    var ZONAS = [
      ['Gemelo / sóleo', /gemelo|s[oó]leo/i],
      ['Isquiotibiales', /isquio/i],
      ['Tendón de Aquiles', /aquiles/i],
      ['Cuádriceps', /cu[aá]driceps/i],
      ['Aductor', /aductor|ingle/i],
      ['Rodilla', /rodilla/i],
      ['Zona lumbar', /lumbar/i],
      ['Espalda', /espalda|dorsal/i],
      ['Hombro', /hombro/i],
      ['Tobillo', /tobillo/i],
      ['Pie', /pie|planta|fascia|rozadur/i],
      ['Cadera', /cadera|psoas/i],
      ['Cuello', /cuello|cervical/i]
    ];
    var mol = {}, molSueltas = [];
    for (i=0;i<regs.length;i++){
      var t = regs[i].molestias;
      if (!t || !String(t).trim()) continue;
      var puesta = false;
      for (k=0;k<ZONAS.length;k++){
        if (ZONAS[k][1].test(t)){
          var z = ZONAS[k][0];
          if (!mol[z]) mol[z] = { zona:z, veces:0, ultima:null, textos:[] };
          mol[z].veces++;
          if (!mol[z].ultima || regs[i].fecha > mol[z].ultima) mol[z].ultima = regs[i].fecha;
          if (mol[z].textos.indexOf(t) < 0 && mol[z].textos.length < 3) mol[z].textos.push(t);
          puesta = true;
          break;
        }
      }
      if (!puesta) molSueltas.push({ fecha: regs[i].fecha, texto: t });
    }
    var molLista = [];
    for (var z2 in mol) if (Object.prototype.hasOwnProperty.call(mol,z2)) molLista.push(mol[z2]);
    molLista.sort(function(a,b){ return b.veces - a.veces; });
    molSueltas.sort(function(a,b){ return a.fecha<b.fecha?1:-1; });

    var estimadas = 0;
    for (i=0;i<regs.length;i++) if (regs[i].estimada) estimadas++;

    var ult = dias.length-1;
    var cargaSem = semanas.length ? semanas[semanas.length-1].carga : 0;
    var cargaPrev = semanas.length>1 ? semanas[semanas.length-2].carga : 0;

    return {
      regs: regs, dias: dias, aguda: aguda, cronica: cronica,
      semanas: semanas, semanasConDatos: conDatos, bienestar: bien,
      carga7: aguda[ult], cronicaHoy: cronica[ult], ratio: ratio[ult],
      cargaSemana: cargaSem, cargaSemanaPrevia: cargaPrev,
      rpe7: media(v7,'rpe'), rpe28: media(v28,'rpe'), regs7: v7.length,
      sueno14: media(v14,'sueno'), sensacion14: media(v14,'sensacion'),
      pesoUlt: (function(){ for (var j=regs.length-1;j>=0;j--) if (regs[j].peso!=null) return regs[j].peso; return null; })(),
      molestias14: molest14, molestiasZonas: molLista, molestiasSueltas: molSueltas,
      esperadas: esperadas.length, hechasN: esperadas.length - pendientes.length,
      pendientes: pendientes,
      cumpl28: esperadas28 ? Math.round(hechas28*100/esperadas28) : null,
      esperadas28: esperadas28,
      cumpl: esperadas.length ? Math.round((esperadas.length-pendientes.length)*100/esperadas.length) : null,
      duracionesEstimadas: estimadas, totalRegs: regs.length
    };
  }

  /* ==================================================================
     LECTURA EN LENGUAJE LLANO DE LA RELACIÓN AGUDA / CRÓNICA
     ================================================================== */
  // «tercera» = el texto lo lee el entrenador, hablando del atleta.
  function lecturaCarga(m, tercera){
    function T(tu, el){ return tercera ? el : tu; }
    if (m.totalRegs === 0)
      return { clase:'neutra', et:'Sin datos',
               tit: T('Todavía no has apuntado nada', 'Todavía no ha apuntado nada'),
               txt: T('En cuanto empieces a registrar tus sesiones (esfuerzo, sueño y sensaciones) esta pantalla se llena sola.',
                      'No ha registrado ninguna sesión en estas semanas, así que aquí no hay nada que medir. Lo primero es que empiece a rellenarlas.') };
    if (m.semanasConDatos < 3 || m.ratio == null)
      return { clase:'neutra', et:'Falta historial',
               tit:'Aún no hay con qué comparar',
               txt: T('Hacen falta unas tres o cuatro semanas seguidas de sesiones apuntadas para poder decir si estás subiendo demasiado deprisa. Mientras tanto, la carga por semana ya se ve abajo.',
                      'Hacen falta tres o cuatro semanas seguidas de sesiones registradas para poder decir si está subiendo demasiado deprisa. Mientras tanto, la carga por semana ya se ve abajo.') };
    var r = m.ratio;
    if (r < 0.6)
      return { clase:'baja', et:'Muy por debajo',
               tit: T('Has parado bastante', 'Ha parado bastante'),
               txt: T('Esta semana estás muy por debajo de lo que venías haciendo. Si es descanso buscado o vuelta de una lesión, perfecto. Si no, mejor recuperar el ritmo poco a poco: volver de golpe al nivel de antes es lo que más lesiona.',
                      'Esta semana está muy por debajo de lo que venía haciendo. Si es descarga buscada o vuelta de una lesión, perfecto. Si no, conviene que recupere el ritmo poco a poco: volver de golpe al nivel de antes es lo que más lesiona.') };
    if (r < 0.8)
      return { clase:'baja', et:'Por debajo',
               tit: T('Has bajado el ritmo', 'Ha bajado el ritmo'),
               txt: T('Estás entrenando algo menos de lo normal para ti. Una semana suave viene bien; si se alargan varias, se pierde parte de lo ganado.',

                    'Ha subido mucho de golpe respecto a sus últimas cuatro semanas. Es justo el momento en el que más molestias y lesiones aparecen. Merece la pena preguntarle cómo está y aflojar unos días.') };
  }

  /* ==================================================================
     GRÁFICOS EN SVG, DIBUJADOS A MANO
     ================================================================== */
  var gradN = 0;
  function grafico(o){
    var W = 360, H = o.H || 178;
    var padL = 36, padR = 12, padT = o.titulo ? 34 : 14, padB = 24;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var i, j, vals = [];
    for (i=0;i<o.series.length;i++)
      for (j=0;j<o.series[i].valores.length;j++){
        var v = o.series[i].valores[j];
        if (v != null && !isNaN(v)) vals.push(v);
      }
    if (!vals.length) return '<div class="grafico"><div class="sin">'+esc(o.titulo||'')+(o.titulo?'<br>':'')+'Todavía no hay datos.</div></div>';

    var min = (o.minY != null) ? o.minY : Math.min.apply(null, vals);
    var max = (o.maxY != null) ? o.maxY : Math.max.apply(null, vals);
    if (max === min) { max = min + (Math.abs(min)*0.1 || 1); }
    var span = max - min;
    if (o.minY == null) min = min - span*0.14;
    if (o.maxY == null) max = max + span*0.16;
    if (o.desdeCero) min = 0;

    var n = o.etiquetas.length;
    function X(k){ return padL + (n<=1 ? plotW/2 : plotW*k/(n-1)); }
    function Y(v){ return padT + plotH*(1-(v-min)/(max-min)); }
    var fmt = o.formato || function(v){ return String(Math.round(v)); };

    // rejilla suave con los valores del eje
    var g, gy, gv, rejilla = '';
    for (g=0; g<=2; g++){
      gy = padT + plotH*g/2;
      gv = max - (max-min)*g/2;
      rejilla += '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--linea)" stroke-width="1" stroke-dasharray="2 5"></line>' +
                 '<text x="'+(padL-5)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#A79F8E">'+esc(fmt(gv))+'</text>';
    }

    var cuerpo = '', defs = '';
    for (i=0;i<o.series.length;i++){
      var s = o.series[i];
      var color = s.color || 'var(--azul)';
      // se parte en tramos para no unir por encima de los huecos
      var tramos = [], actual = [];
      for (j=0;j<s.valores.length;j++){
        var vv = s.valores[j];
        if (vv == null || isNaN(vv)) { if (actual.length) { tramos.push(actual); actual=[]; } }
        else actual.push({ x:X(j), y:Y(vv), i:j, v:vv });
      }
      if (actual.length) tramos.push(actual);

      if (s.area && tramos.length){
        var gid = 'cg-grad-' + (gradN++);
        defs += '<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0" stop-color="'+color+'" stop-opacity="0.30"></stop>' +
                '<stop offset="1" stop-color="'+color+'" stop-opacity="0"></stop></linearGradient>';
        for (j=0;j<tramos.length;j++){
          var tr = tramos[j];
          if (tr.length < 2) continue;
          var d = 'M'+tr[0].x.toFixed(1)+','+(padT+plotH).toFixed(1);
          for (var q=0;q<tr.length;q++) d += ' L'+tr[q].x.toFixed(1)+','+tr[q].y.toFixed(1);
          d += ' L'+tr[tr.length-1].x.toFixed(1)+','+(padT+plotH).toFixed(1)+' Z';
          cuerpo += '<path d="'+d+'" fill="url(#'+gid+')"></path>';
        }
      }
      for (j=0;j<tramos.length;j++){
        var tr2 = tramos[j];
        if (tr2.length < 2){
          if (tr2.length === 1) cuerpo += '<circle cx="'+tr2[0].x.toFixed(1)+'" cy="'+tr2[0].y.toFixed(1)+'" r="3" fill="'+color+'"></circle>';
          continue;
        }
        var pts = [];
        for (var q2=0;q2<tr2.length;q2++) pts.push(tr2[q2].x.toFixed(1)+','+tr2[q2].y.toFixed(1));
        cuerpo += '<polyline fill="none" stroke="'+color+'" stroke-width="'+(s.grosor||2.4)+'"' +
                  (s.discontinua ? ' stroke-dasharray="5 4"' : '') +
                  ' stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(' ')+'"></polyline>';
      }
      if (s.puntos && n <= 14){
        for (j=0;j<tramos.length;j++)
          for (var q3=0;q3<tramos[j].length;q3++){
            var p = tramos[j][q3];
            cuerpo += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="#fff" stroke="'+color+'" stroke-width="2"></circle>';
          }
      }
    }

    // etiquetas del eje de abajo (como mucho seis, para que se lean en el móvil)
    var conEtiqueta = [];
    for (i=0;i<n;i++) if (o.etiquetas[i]) conEtiqueta.push(i);
    var paso = Math.max(1, Math.ceil(conEtiqueta.length/6)), ejeX = '';
    for (i=0;i<conEtiqueta.length;i++){
      if (i % paso !== 0 && i !== conEtiqueta.length-1) continue;
      var xi = conEtiqueta[i];
      ejeX += '<text x="'+X(xi).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="8.5" fill="#9a958c">'+esc(o.etiquetas[xi])+'</text>';
    }

    var cab = '';
    if (o.titulo) cab += '<text x="'+padL+'" y="19" font-size="12.5" font-weight="700" fill="var(--navy)">'+esc(o.titulo)+'</text>';
    if (o.dato)   cab += '<text x="'+(W-padR)+'" y="19" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--azul-oscuro)">'+esc(o.dato)+'</text>';

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(o.titulo||'Gráfico')+'">' +
              (defs ? '<defs>'+defs+'</defs>' : '') + rejilla + cuerpo + ejeX + cab + '</svg>';

    var ley = '';
    if (o.leyenda && o.leyenda.length){
      ley = '<div class="leyenda">';
      for (i=0;i<o.leyenda.length;i++)
        ley += '<span><i style="background:'+o.leyenda[i].color+'"></i>'+esc(o.leyenda[i].texto)+'</span>';
      ley += '</div>';
    } else if (o.nota) {
      ley = '<div class="leyenda">'+esc(o.nota)+'</div>';
    }
    return '<div class="grafico'+(o.ancho?' ancho':'')+'">'+svg+ley+'</div>';
  }

  function graficoSemanal(m){
    var et = [], val = [];
    for (var i=0;i<m.semanas.length;i++){
      et.push(fechaCorta(m.semanas[i].lunes));
      val.push(m.semanas[i].carga);
    }
    return grafico({
      titulo: 'Carga por semana',
      dato: 'Esta semana ' + mil(m.cargaSemana),
      ancho: true, H: 196, desdeCero: true, minY: 0, formato: function(v){ return mil(v); },
      etiquetas: et,
      series: [{ valores: val, color:'var(--azul)', area:true, puntos:true }],
      nota: 'Suma de esfuerzo × minutos de cada sesión de la semana (lunes a domingo).'
    });
  }

  function graficoFatiga(m){
    // últimas 8 semanas de la relación entre lo de esta semana y lo del último mes
    var desde = Math.max(0, m.dias.length - 56);
    var et=[], ag=[], cr=[];
    for (var i=desde;i<m.dias.length;i++){
      et.push((i-desde) % 7 === 0 ? fechaCorta(m.dias[i].f) : '');
      ag.push(m.aguda[i]);
      cr.push(m.cronica[i]);
    }
    return grafico({
      titulo: 'Fatiga y forma',
      dato: m.ratio != null ? (Math.round(m.ratio*100)+'% de lo normal') : '',
      ancho: true, H: 196, minY: 0, desdeCero: true, formato: function(v){ return mil(v); },
      etiquetas: et,
      series: [
        { valores: cr, color:'var(--navy)', discontinua:true, grosor:2 },
        { valores: ag, color:'var(--azul)', area:true }
      ],
      leyenda: [
        { color:'var(--azul)', texto:'Lo de los últimos 7 días' },
        { color:'var(--navy)', texto:'Media de las últimas 4 semanas' }
      ]
    });
  }

  function graficosBienestar(m){
    var et=[], sue=[], sen=[], rpe=[], pes=[], i;
    for (i=0;i<m.bienestar.length;i++){
      et.push(fechaCorta(m.bienestar[i].lunes));
      sue.push(m.bienestar[i].sueno);
      sen.push(m.bienestar[i].sensacion);
      rpe.push(m.bienestar[i].rpe);
      pes.push(m.bienestar[i].peso);
    }
    var unaCifra = function(v){ return (Math.round(v*10)/10).toFixed(1).replace('.',','); };
    return grafico({ titulo:'Horas de sueño', H:168, etiquetas:et, formato:unaCifra,
                     dato: m.sueno14!=null ? coma(m.sueno14,1)+' h' : '',
                     series:[{ valores:sue, color:'var(--azul)', area:true, puntos:true }],
                     nota:'Media de cada semana.' }) +
           grafico({ titulo:'Cómo te sientes (1-10)', H:168, etiquetas:et, minY:0, maxY:10, formato:unaCifra,
                     dato: m.sensacion14!=null ? coma(m.sensacion14,1) : '',
                     series:[{ valores:sen, color:'#1e7a3d', area:true, puntos:true }],
                     nota:'10 = de maravilla. Media de cada semana.' }) +
           grafico({ titulo:'Esfuerzo medio (RPE)', H:168, etiquetas:et, minY:0, maxY:10, formato:unaCifra,
                     dato: m.rpe7!=null ? coma(m.rpe7,1) : '',
                     series:[{ valores:rpe, color:'#A08A3C', area:true, puntos:true }],
                     nota:'10 = al límite. Media de cada semana.' }) +
           grafico({ titulo:'Peso (kg)', H:168, etiquetas:et, formato:unaCifra,
                     dato: m.pesoUlt!=null ? coma(m.pesoUlt,1)+' kg' : '',
                     series:[{ valores:pes, color:'var(--navy)', area:true, puntos:true }],
                     nota:'Media de cada semana. Solo si lo apuntas.' });
  }

  /* ==================================================================
     SEÑALES ORIENTATIVAS (nunca un diagnóstico)
     ================================================================== */
  function senalesDe(m){
    var s = [];
    if (m.semanasConDatos >= 3 && m.ratio != null){
      if (m.ratio > 1.5)      s.push({ t:'Subida brusca de carga', n:3 });
      else if (m.ratio > 1.3) s.push({ t:'Sube rápido', n:2 });
      else if (m.ratio < 0.6) s.push({ t:'Ha bajado mucho', n:1 });
    }
    if (m.rpe7 != null && m.regs7 >= 3 && m.rpe7 >= 8) s.push({ t:'Esfuerzo alto varios días', n:2 });
    if (m.sueno14 != null && m.sueno14 < 6.5)          s.push({ t:'Duerme poco', n:2 });
    if (m.molestias14 >= 2)                            s.push({ t:'Molestias repetidas', n:2 });
    if (m.esperadas28 >= 4 && m.cumpl28 != null && m.cumpl28 < 60) s.push({ t:'Rellena pocas sesiones', n:1 });
    return s;
  }
  function riesgoDe(sen){ var r=0; for (var i=0;i<sen.length;i++) r += sen[i].n; return r; }

  /* ==================================================================
     TEXTOS COMPARTIDOS
     ================================================================== */
  var TXT_METODO =
    '<div class="nota-metodo"><b>Cómo se calcula.</b> La carga de una sesión es el <b>esfuerzo que apunta el atleta ' +
    '(RPE, del 1 al 10) multiplicado por los minutos de la sesión</b>. Es el método sRPE, el más sencillo y el más ' +
    'contrastado. Sumando las sesiones sale la carga de la semana. Después se compara lo de los <b>últimos 7 días</b> ' +
    'con la <b>media semanal del último mes</b>: si lo de esta semana se dispara respecto a lo que venías haciendo, ' +
    'salta el aviso, porque ahí es donde aparecen la mayoría de las lesiones.</div>';

  var TXT_MEDICO =
    '<div class="aviso-medico"><span class="et">Léelo antes de usarlo</span>' +
    '<p><b>Esto no es un diagnóstico médico ni sustituye a nadie.</b> Son señales orientativas calculadas con lo que ' +

  function notaEstimacion(m){
    if (!m.duracionesEstimadas) return '';
    return '<p class="pie-tarjeta"><b>Duración estimada.</b> ' + m.duracionesEstimadas + ' de las ' + m.totalRegs +
           ' sesiones apuntadas no tienen la duración escrita, así que se ha estimado por el tipo de sesión ' +
           '(pista 90 min, natación 75, gimnasio 60, rodaje 60, activación 40, competición 120). En cuanto el ' +
           'entrenador escriba la duración real, los números se afinan solos.</p>';
  }

  /* ==================================================================
     DATOS: registros y sesiones de un atleta
     ================================================================== */
  function normaliza(filas){
    var out = [];
    for (var i=0;i<filas.length;i++){
      var r = filas[i], s = r.sesiones;
      if (!s || !s.fecha) continue;
      var d = duracionDe(s);
      var rpe = num(r.rpe);
      out.push({
        sesion_id: r.sesion_id, fecha: s.fecha, tipo: s.tipo || '', titulo: s.titulo || '',
        rpe: rpe, sensacion: num(r.sensacion_general), sueno: num(r.horas_sueno), peso: num(r.peso_kg),
        molestias: r.molestias || '', notas: r.notas_atleta || '',
        dur: d.min, estimada: d.estimada,
        carga: (rpe != null && d.min > 0) ? rpe * d.min : 0
      });
    }
    out.sort(function(a,b){ return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0); });
    return out;
  }

  var CAMPOS_REG = 'sesion_id,rpe,sensacion_general,horas_sueno,peso_kg,molestias,notas_atleta,' +
                   'sesiones!inner(id,fecha,tipo,titulo,duracion_min,grupo_id)';

  async function registrosDe(idsAtletas){
    var r = await sb.from('registros_sesion')
      .select('atleta_id,' + CAMPOS_REG)
      .in('atleta_id', idsAtletas)
      .gte('sesiones.fecha', DESDE)
      .lte('sesiones.fecha', HOY);
    if (r.error) throw r.error;
    return r.data || [];
  }

  async function sesionesPublicadas(gruposIds){
    var q = sb.from('sesiones')
      .select('id,fecha,tipo,titulo,duracion_min,grupo_id,atletas_ids')
      .eq('publicada', true)
      .gte('fecha', DESDE).lte('fecha', HOY);
    if (gruposIds && gruposIds.length) q = q.in('grupo_id', gruposIds);
    var r = await q;
    if (r.error) throw r.error;
    return r.data || [];
  }

  function sesionesDe(todas, atleta){
    var out = [];
    for (var i=0;i<todas.length;i++){
      var s = todas[i];
      var lista = s.atletas_ids;
      if (lista && lista.length) { if (lista.indexOf(atleta.id) > -1) out.push(s); }
      else if (s.grupo_id && s.grupo_id === atleta.grupo_id) out.push(s);
    }
    return out;
  }

  function nombreDe(a){ return ((a.nombre||'') + ' ' + (a.apellidos||'')).trim() || 'Atleta'; }

  /* ==================================================================
     VISTA A · MI CARGA (atleta / familia)
     ================================================================== */
  function pintaAtleta(cont, ficha, m){

    var h = '';

    h += '<div class="tarjeta"><h2>Cómo vas</h2>' +
         '<div class="lectura ' + lec.clase + '" style="margin:10px 0 14px">' +
         '<span class="et">' + esc(lec.et) + '</span><b>' + esc(lec.tit) + '</b><p>' + esc(lec.txt) + '</p></div>' +
         '<div class="cifras">' +
           '<div class="cifra"><b>' + mil(m.cargaSemana) + '</b><span>Carga esta semana</span>' +
             '<small>' + (m.cargaSemanaPrevia ? (m.cargaSemana >= m.cargaSemanaPrevia ? '▲ ' : '▼ ') +
               Math.abs(Math.round((m.cargaSemana - m.cargaSemanaPrevia) * 100 / m.cargaSemanaPrevia)) + '% que la semana pasada' : 'Sin semana anterior con la que comparar') + '</small></div>' +
           '<div class="cifra"><b>' + (m.ratio != null ? Math.round(m.ratio*100) + '%' : '—') + '</b><span>De lo normal en ti</span>' +
             '<small>100 % = lo mismo que el último mes</small></div>' +
           '<div class="cifra"><b>' + coma(m.rpe7,1) + '</b><span>Esfuerzo medio (7 días)</span>' +
             '<small>Sobre 10</small></div>' +
           '<div class="cifra"><b>' + coma(m.sueno14,1) + '</b><span>Horas de sueño (14 días)</span>' +
             '<small>' + (m.sueno14 != null && m.sueno14 < 6.5 ? 'Por debajo de lo recomendable' : 'Media de lo que apuntas') + '</small></div>' +
         '</div>' + TXT_METODO + notaEstimacion(m) + '</div>';

    h += '<div class="tarjeta"><h2>Tu carga semana a semana</h2>' +
         '<p class="vacio">Últimas ' + SEMANAS_GRAFICO + ' semanas. Cuanto más alto, más has entrenado esa semana.</p>' +
         '<div class="graficos" style="margin-top:12px">' + graficoSemanal(m) + graficoFatiga(m) + '</div>' +
         '<p class="pie-tarjeta">La línea azul es lo que llevas encima ahora mismo (últimos 7 días). La línea marina ' +
         'de puntos es tu media de las últimas 4 semanas: lo que tu cuerpo tiene asimilado. Cuando el azul se despega ' +
         'mucho por encima del marino, es cuando hay que tener cuidado.</p></div>';

    h += '<div class="tarjeta"><h2>Tu bienestar</h2>' +
         '<p class="vacio">Lo que apuntas al terminar cada sesión, semana a semana.</p>' +
         '<div class="graficos" style="margin-top:12px">' + graficosBienestar(m) + '</div></div>';

    // molestias
    h += '<div class="tarjeta"><h2>Molestias que has apuntado</h2>';
    if (!m.molestiasZonas.length && !m.molestiasSueltas.length){
      h += '<p class="vacio">No has apuntado ninguna molestia en estas semanas. Perfecto.</p>';
    } else {
      h += '<ul class="molestias">';
      for (var i=0;i<m.molestiasZonas.length;i++){
        var z = m.molestiasZonas[i], rep = z.veces >= 3;
        h += '<li><span class="veces' + (rep ? ' rep' : '') + '">' + z.veces + ' ' + (z.veces===1?'vez':'veces') + '</span>' +
             '<span class="txt"><b>' + esc(z.zona) + '</b>' + (rep ? ' — se repite, coméntalo con tu entrenador' : '') +
             '<br><small style="color:var(--texto-suave)">Última vez: ' + esc(fechaDia(z.ultima)) + '. «' + esc(z.textos[0]) + '»</small></span></li>';
      }
      for (var j=0;j<Math.min(m.molestiasSueltas.length,6);j++){
        h += '<li><span class="veces">1 vez</span><span class="txt">' + esc(m.molestiasSueltas[j].texto) +
             '<br><small style="color:var(--texto-suave)">' + esc(fechaDia(m.molestiasSueltas[j].fecha)) + '</small></span></li>';
      }
      h += '</ul>';
    }
    h += '</div>';

    // cumplimiento
    h += '<div class="tarjeta"><h2>Sesiones que has rellenado</h2>';
    if (!m.esperadas){
      h += '<p class="vacio">No hay sesiones publicadas para ti en estas semanas.</p>';
    } else {
      h += '<div class="cifras"><div class="cifra"><b>' + m.cumpl + '%</b><span>De lo publicado</span>' +
           '<small>' + m.hechasN + ' de ' + m.esperadas + ' sesiones</small>' +
           '<div class="barra-cumpl"><i style="width:' + m.cumpl + '%"></i></div></div>' +
           '<div class="cifra"><b>' + (m.cumpl28 != null ? m.cumpl28 + '%' : '—') + '</b><span>Último mes</span>' +
           '<small>' + m.esperadas28 + ' sesiones publicadas</small></div></div>';
      if (m.pendientes.length){
        h += '<h3 style="margin-top:16px">Te faltan por rellenar (' + m.pendientes.length + ')</h3><ul class="lista-pend">';
        for (var k=0;k<Math.min(m.pendientes.length,12);k++){
          var p = m.pendientes[k];

        }
        h += '</ul>';
        if (m.pendientes.length > 12) h += '<p class="pie-tarjeta">Y ' + (m.pendientes.length-12) + ' más.</p>';
        h += '<p class="pie-tarjeta">Se rellenan desde <a href="../atleta/">Mi zona</a>, en la sesión de cada día.</p>';
      } else {
        h += '<p class="pie-tarjeta">Las tienes todas al día. Así los números de arriba valen de verdad.</p>';
      }
    }
    h += '</div>';

    h += TXT_MEDICO;
    cont.innerHTML = h;
  }

  /* ==================================================================
     VISTA B · CARGA DEL GRUPO (entrenador / admin)
     ================================================================== */
  function pintaGrupo(cont, atletas, mapa, orden, seleccionado){
    var filas = [], i;
    for (i=0;i<atletas.length;i++){
      var a = atletas[i], m = mapa[a.id];
      var sen = senalesDe(m);
      filas.push({ a:a, m:m, sen:sen, riesgo:riesgoDe(sen) });
    }
    if (orden === 'nombre')      filas.sort(function(x,y){ return nombreDe(x.a).localeCompare(nombreDe(y.a),'es'); });
    else if (orden === 'carga')  filas.sort(function(x,y){ return y.m.carga7 - x.m.carga7; });
    else if (orden === 'cumpl')  filas.sort(function(x,y){ return (x.m.cumpl28==null?101:x.m.cumpl28) - (y.m.cumpl28==null?101:y.m.cumpl28); });
    else filas.sort(function(x,y){ if (y.riesgo !== x.riesgo) return y.riesgo - x.riesgo; return nombreDe(x.a).localeCompare(nombreDe(y.a),'es'); });

    var conAviso = 0;
    for (i=0;i<filas.length;i++) if (filas[i].riesgo >= 2) conAviso++;

    var h = '<div class="tarjeta"><h2>Tus atletas</h2>' +
            '<p class="vacio">' + filas.length + ' atletas · ' + conAviso + ' con alguna señal que mirar. ' +
            'Pulsa un nombre para ver su detalle.</p>' +
            '<div class="ordenar">' +
              '<button data-orden="riesgo" class="' + (orden==='riesgo'?'activa':'') + '">Por señales</button>' +
              '<button data-orden="carga"  class="' + (orden==='carga' ?'activa':'') + '">Por carga</button>' +
              '<button data-orden="cumpl"  class="' + (orden==='cumpl' ?'activa':'') + '">Por cumplimiento</button>' +
              '<button data-orden="nombre" class="' + (orden==='nombre'?'activa':'') + '">Por nombre</button>' +
            '</div>' +
            '<div class="tabla-scroll"><table><thead><tr>' +
            '<th>Atleta</th><th class="num">Carga 7 días</th><th class="num">De lo normal</th>' +
            '<th class="num">RPE</th><th class="num">Sueño</th><th class="num">Relleno</th><th>Señales</th>' +
            '</tr></thead><tbody>';

    for (i=0;i<filas.length;i++){
      var f = filas[i], mm = f.m;
      var pct = mm.ratio != null ? Math.round(mm.ratio*100) : null;
      var colorPct = 'var(--texto)';
      if (pct != null && pct > 150) colorPct = '#b3261e';
      else if (pct != null && pct > 130) colorPct = '#A08A3C';
      else if (pct != null && pct < 60) colorPct = 'var(--azul-oscuro)';
      var chips = '';
      if (f.sen.length){
        for (var s2=0;s2<f.sen.length;s2++) chips += '<span class="senal n' + f.sen[s2].n + '">' + esc(f.sen[s2].t) + '</span>';
      } else if (mm.totalRegs) {
        chips = '<span class="senal ok">Sin señales</span>';
      } else {
        chips = '<span class="senal n1">Sin datos</span>';
      }
      h += '<tr class="fila-at' + (seleccionado===f.a.id?' sel':'') + '" data-at="' + esc(f.a.id) + '">' +
           '<td><span class="nom-at">' + esc(nombreDe(f.a)) + '</span>' +
             (f.a.estado && f.a.estado !== 'activo' ? '<br><small style="color:var(--texto-tenue)">' + esc(f.a.estado) + '</small>' : '') + '</td>' +
           '<td class="num">' + mil(mm.carga7) + '</td>' +
           '<td class="num" style="color:' + colorPct + ';font-weight:600">' + (pct != null ? pct + '%' : '—') + '</td>' +
           '<td class="num">' + coma(mm.rpe7,1) + '</td>' +
           '<td class="num">' + coma(mm.sueno14,1) + '</td>' +
           '<td class="num">' + (mm.cumpl28 != null ? mm.cumpl28 + '%' : '—') + '</td>' +
           '<td><div class="senales">' + chips + '</div></td></tr>';
    }
    h += '</tbody></table></div>' +
         '<p class="pie-tarjeta"><b>Cómo leer la tabla.</b> «Carga 7 días» es la suma de esfuerzo × minutos de la última ' +
         'semana. «De lo normal» compara esa semana con su media del último mes: 100 % es seguir igual, por encima de ' +
         '130 % está subiendo rápido y por encima de 150 % ha subido de golpe. «Relleno» es cuántas de las sesiones ' +
         'publicadas ha apuntado en el último mes: si es bajo, el resto de columnas valen poco.</p>' +
         TXT_METODO + '</div>';

    h += '<div id="cg-detalle"></div>' + TXT_MEDICO;
    cont.innerHTML = h;

    var bts = cont.querySelectorAll('.ordenar button');
    for (i=0;i<bts.length;i++){
      bts[i].addEventListener('click', function(){
        pintaGrupo(cont, atletas, mapa, this.getAttribute('data-orden'), seleccionado);
      });
    }
    var trs = cont.querySelectorAll('tr.fila-at');
    for (i=0;i<trs.length;i++){
      trs[i].addEventListener('click', function(){
        var id = this.getAttribute('data-at');
        pintaGrupo(cont, atletas, mapa, orden, id === seleccionado ? null : id);
      });
    }
    if (seleccionado && mapa[seleccionado]){
      var at = null;
      for (i=0;i<atletas.length;i++) if (atletas[i].id === seleccionado) at = atletas[i];
      pintaDetalle($('cg-detalle'), at, mapa[seleccionado]);
      $('cg-detalle').scrollIntoView({ behavior:'smooth', block:'start' });
    }
  }

  function pintaDetalle(cont, at, m){
    var lec = lecturaCarga(m, true);
    var h = '<div class="tarjeta"><h2>' + esc(nombreDe(at)) + '</h2>' +
            '<div class="lectura ' + lec.clase + '" style="margin:10px 0 14px">' +
            '<span class="et">' + esc(lec.et) + '</span><b>' + esc(lec.tit) + '</b><p>' + esc(lec.txt) + '</p></div>' +
            '<div class="cifras">' +
              '<div class="cifra"><b>' + mil(m.cargaSemana) + '</b><span>Carga esta semana</span></div>' +
              '<div class="cifra"><b>' + (m.ratio != null ? Math.round(m.ratio*100)+'%' : '—') + '</b><span>De lo normal en él/ella</span></div>' +
              '<div class="cifra"><b>' + coma(m.rpe7,1) + '</b><span>Esfuerzo (7 días)</span></div>' +
              '<div class="cifra"><b>' + coma(m.sueno14,1) + '</b><span>Sueño (14 días)</span></div>' +
              '<div class="cifra"><b>' + (m.cumpl28 != null ? m.cumpl28+'%' : '—') + '</b><span>Relleno último mes</span>' +
                '<small>' + m.esperadas28 + ' sesiones publicadas</small></div>' +
            '</div>' +
            '<div class="graficos" style="margin-top:14px">' + graficoSemanal(m) + graficoFatiga(m) + graficosBienestar(m) + '</div>' +
            notaEstimacion(m);

    if (m.molestiasZonas.length || m.molestiasSueltas.length){
      h += '<h3 style="margin-top:18px">Molestias que ha apuntado</h3><ul class="molestias">';
      for (var i=0;i<m.molestiasZonas.length;i++){
        var z = m.molestiasZonas[i], rep = z.veces >= 3;
        h += '<li><span class="veces' + (rep?' rep':'') + '">' + z.veces + ' ' + (z.veces===1?'vez':'veces') + '</span>' +
             '<span class="txt"><b>' + esc(z.zona) + '</b>' + (rep ? ' — se repite' : '') +
             '<br><small style="color:var(--texto-suave)">Última vez: ' + esc(fechaDia(z.ultima)) + '. «' + esc(z.textos[0]) + '»</small></span></li>';
      }
      for (var j=0;j<Math.min(m.molestiasSueltas.length,5);j++){
        h += '<li><span class="veces">1 vez</span><span class="txt">' + esc(m.molestiasSueltas[j].texto) +
             '<br><small style="color:var(--texto-suave)">' + esc(fechaDia(m.molestiasSueltas[j].fecha)) + '</small></span></li>';
      }
      h += '</ul>';
    } else {
      h += '<h3 style="margin-top:18px">Molestias</h3><p class="vacio">No ha apuntado ninguna en estas semanas.</p>';
    }

    if (m.pendientes.length){
      h += '<h3 style="margin-top:18px">Sesiones sin rellenar (' + m.pendientes.length + ')</h3><ul class="lista-pend">';
      for (var k=0;k<Math.min(m.pendientes.length,8);k++)
        h += '<li><span class="f">' + esc(fechaCorta(m.pendientes[k].fecha)) + '</span><span>' + esc(m.pendientes[k].titulo || 'Sesión') + '</span></li>';
      h += '</ul>';
    }
    h += '</div>';
    cont.innerHTML = h;
  }

  /* ==================================================================
     ARRANQUE
     ================================================================== */
  var cabecera = '<a class="volver" href="../">← Volver al portal</a>' +
                 '<span class="sub">Entrenar mejor, lesionarse menos</span>' +
                 '<h1>Carga y bienestar</h1>';

  var papeles = [];
  try { if (APOLANA_PORTAL.papeles) papeles = (await APOLANA_PORTAL.papeles()) || []; } catch (e) { papeles = []; }
  var claves = {};
  for (var pi=0; pi<papeles.length; pi++) claves[papeles[pi].clave] = true;
  if (!papeles.length && perfil.rol) claves[perfil.rol === 'padre' ? 'familia' : perfil.rol] = true;

  var puedeGrupo  = !!(claves.entrenador || claves.admin || perfil.rol === 'admin' || perfil.rol === 'entrenador');
  var puedeAtleta = !!(claves.atleta || claves.familia);

  wrap.innerHTML = cabecera + '<div class="tarjeta"><p class="vacio">Cargando tus datos…</p></div>';

  // --- fichas de atleta a las que tengo acceso como atleta o familia ---
  var misFichas = [];
  if (puedeAtleta){
    var rf = await sb.from('atletas').select('id,nombre,apellidos,grupo_id,estado')
      .or('perfil_id.eq.' + perfil.id + ',perfil_padre_id.eq.' + perfil.id);
    if (!rf.error && rf.data) misFichas = rf.data;
    if (!misFichas.length) puedeAtleta = false;
  }

  // --- grupos que puedo mirar como entrenador o admin ---
  var misGrupos = [];
  if (puedeGrupo){
    var qg = sb.from('grupos').select('id,nombre,seccion,entrenador_id').eq('activo', true);
    if (!(claves.admin || perfil.rol === 'admin')) qg = qg.eq('entrenador_id', perfil.id);
    var rg = await qg.order('seccion').order('nombre');
    if (!rg.error && rg.data) misGrupos = rg.data;
    if (!misGrupos.length) puedeGrupo = false;
  }

  if (!puedeAtleta && !puedeGrupo){
    wrap.innerHTML = cabecera +
      '<div class="tarjeta"><p class="vacio">Esta pantalla es para atletas (su propia carga), familias (la de sus hijos) ' +
      'y entrenadores (la de sus grupos). Con tu cuenta no hay nada que mostrar aquí.</p></div>';
    return;
  }

  var vista = puedeAtleta ? 'atleta' : 'grupo';

  function marco(){
    var h = cabecera;
    if (puedeAtleta && puedeGrupo){
      h += '<div class="pestanas">' +
           '<button id="cg-tab-atleta" class="' + (vista==='atleta'?'activa':'') + '">Mi carga</button>' +
           '<button id="cg-tab-grupo" class="'  + (vista==='grupo' ?'activa':'') + '">Carga del grupo</button></div>';
    }
    h += '<div id="cg-selector"></div><div id="cg-cuerpo"><div class="tarjeta"><p class="vacio">Cargando…</p></div></div>';
    wrap.innerHTML = h;
    if (puedeAtleta && puedeGrupo){
      $('cg-tab-atleta').addEventListener('click', function(){ vista='atleta'; marco(); arrancaVista(); });
      $('cg-tab-grupo').addEventListener('click',  function(){ vista='grupo';  marco(); arrancaVista(); });
    }
  }

  var fichaSel = misFichas.length ? misFichas[0].id : null;
  var grupoSel = misGrupos.length ? misGrupos[0].id : null;

  async function vistaAtleta(){
    var sel = $('cg-selector'), cuerpo = $('cg-cuerpo');
    if (misFichas.length > 1){
      var op = '';
      for (var i=0;i<misFichas.length;i++)
        op += '<option value="' + esc(misFichas[i].id) + '"' + (misFichas[i].id===fichaSel?' selected':'') + '>' + esc(nombreDe(misFichas[i])) + '</option>';
      sel.innerHTML = '<div class="barra-sel"><label for="cg-ficha">Ficha</label><select id="cg-ficha">' + op + '</select></div>';
      $('cg-ficha').addEventListener('change', function(){ fichaSel = this.value; vistaAtleta(); });
    } else { sel.innerHTML = ''; }

    var ficha = null;
    for (var j=0;j<misFichas.length;j++) if (misFichas[j].id === fichaSel) ficha = misFichas[j];
    if (!ficha) { cuerpo.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu ficha de atleta.</p></div>'; return; }

    cuerpo.innerHTML = '<div class="tarjeta"><p class="vacio">Calculando tu carga…</p></div>';
    try {
      var filas = await registrosDe([ficha.id]);
      var todas = await sesionesPublicadas(ficha.grupo_id ? [ficha.grupo_id] : null);
      var m = analiza(normaliza(filas), sesionesDe(todas, ficha));
      pintaAtleta(cuerpo, ficha, m);
    } catch (err) {
      cuerpo.innerHTML = '<div class="tarjeta"><p class="vacio">No se pudieron cargar tus datos: ' + esc(err.message || err) + '</p></div>';
    }
  }

  async function vistaGrupo(){
    var sel = $('cg-selector'), cuerpo = $('cg-cuerpo');
    var op = '';
    for (var i=0;i<misGrupos.length;i++)
      op += '<option value="' + esc(misGrupos[i].id) + '"' + (misGrupos[i].id===grupoSel?' selected':'') + '>' +
            esc(misGrupos[i].nombre) + (misGrupos[i].seccion ? ' · ' + esc(nombreSeccion(misGrupos[i].seccion)) : '') + '</option>';
    sel.innerHTML = '<div class="barra-sel"><label for="cg-grupo">Grupo</label><select id="cg-grupo">' + op + '</select></div>';
    $('cg-grupo').addEventListener('change', function(){ grupoSel = this.value; vistaGrupo(); });

    cuerpo.innerHTML = '<div class="tarjeta"><p class="vacio">Calculando la carga del grupo…</p></div>';
    try {
      var ra = await sb.from('atletas').select('id,nombre,apellidos,grupo_id,estado').eq('grupo_id', grupoSel);
      if (ra.error) throw ra.error;
      var atletas = (ra.data || []).filter(function(a){ return a.estado !== 'baja'; });
      if (!atletas.length){ cuerpo.innerHTML = '<div class="tarjeta"><p class="vacio">Este grupo no tiene atletas dados de alta.</p></div>'; return; }

      var ids = atletas.map(function(a){ return a.id; });
      var filas = await registrosDe(ids);
      var todas = await sesionesPublicadas([grupoSel]);

      var porAtleta = {};
      for (var k=0;k<ids.length;k++) porAtleta[ids[k]] = [];
      for (var f=0;f<filas.length;f++) if (porAtleta[filas[f].atleta_id]) porAtleta[filas[f].atleta_id].push(filas[f]);

      var mapa = {};
      for (var a=0;a<atletas.length;a++)
        mapa[atletas[a].id] = analiza(normaliza(porAtleta[atletas[a].id]), sesionesDe(todas, atletas[a]));

      pintaGrupo(cuerpo, atletas, mapa, 'riesgo', null);
    } catch (err) {
      cuerpo.innerHTML = '<div class="tarjeta"><p class="vacio">No se pudo cargar el grupo: ' + esc(err.message || err) + '</p></div>';
    }
  }

  function arrancaVista(){ if (vista === 'atleta') vistaAtleta(); else vistaGrupo(); }

  marco();
  arrancaVista();
});
</script>

</body>
</html>
