<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natación · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>
  window.APOLANA_BASE = "../../";
  /* Este mundo, para la barra lateral (se lee al cargar mundos.js). */
  (function(){
    var p = new URLSearchParams(location.search).get('p');
    window.APOLANA_MUNDO = { world:'natacion', screen: (p==='nadadores'?'nadadores':'resumen'), contentSel:'#nat' };
  })();
</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/mundos.js" defer></script>
<style>
  :root{ --mm-acento:#2F6FA8; }
  body{ background:var(--crema,#FBF9F4); }
  /* En móvil el contenedor se centra; en PC la rejilla de mundos.js le da el ancho. */
  #nat{ max-width:820px; margin:0 auto; padding:clamp(16px,4vw,26px) clamp(14px,4vw,24px) 40px; }

  .na-cab{ margin:2px 0 20px; }
  .na-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--mm-acento); margin-bottom:8px; }
  .na-cab h1{ font-family:var(--fuente-titulo); text-transform:uppercase; font-size:clamp(27px,5vw,38px);
    line-height:1; color:var(--navy); margin:0; display:flex; align-items:center; gap:12px; }
  .na-cab h1 .pt-g{ width:15px; height:15px; border-radius:50%; background:var(--mm-acento); flex:0 0 auto;
    box-shadow:0 0 0 4px color-mix(in srgb, var(--mm-acento) 18%, transparent); }
  .na-cab p{ font-size:15.5px; color:var(--texto-suave); margin:10px 0 0; max-width:64ch; line-height:1.5; }

  .na-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:13px; margin-bottom:24px; }
  .na-stat{ background:#fff; border-radius:var(--radio,14px); box-shadow:var(--sombra-suave,0 10px 22px -16px rgba(46,66,86,.5));
    padding:17px 18px 15px; position:relative; overflow:hidden; }
  .na-stat::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--mm-acento); opacity:.9; }
  .na-stat b{ font-family:var(--fuente-titulo); font-weight:700; font-size:clamp(28px,3.4vw,38px); color:var(--navy); line-height:1; display:block; }
  .na-stat span{ font-size:12.5px; color:var(--texto-suave); margin-top:6px; display:block; }

  .na-hubtit{ font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--texto-suave); margin:0 0 12px; }
  .na-hub{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:14px; }
  .na-card{ display:flex; flex-direction:column; text-decoration:none; background:#fff; border-radius:var(--radio,14px);
    box-shadow:var(--sombra-suave,0 10px 22px -16px rgba(46,66,86,.5)); padding:17px;
    transition:transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s cubic-bezier(.2,.7,.2,1); color:inherit; }
  .na-card:hover{ transform:translateY(-4px); box-shadow:0 1px 2px rgba(30,45,65,.06),0 12px 22px -12px rgba(30,45,65,.2),0 26px 46px -28px rgba(30,45,65,.24); }
  .na-card .ico{ width:42px; height:42px; border-radius:var(--radio-dentro,10px); display:grid; place-items:center;
    background:var(--azul-suave,#EAF2F9); background:color-mix(in srgb, var(--mm-acento) 13%, #fff); color:var(--mm-acento); margin-bottom:13px; }
  .na-card .ico svg{ width:22px; height:22px; }
  .na-card h3{ font-family:var(--fuente-titulo); font-weight:700; text-transform:uppercase; font-size:17px; color:var(--navy); margin:0 0 5px; line-height:1.05; }
  .na-card .d{ font-size:13.5px; color:var(--texto-suave); line-height:1.45; margin:0; flex:1 1 auto; }
  .na-card .pie{ display:flex; align-items:center; gap:8px; margin-top:13px; }
  .na-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--mm-acento);
    background:var(--azul-suave,#EAF2F9); background:color-mix(in srgb, var(--mm-acento) 12%, #fff); border-radius:999px; padding:4px 11px; line-height:1; }
  .na-pill b{ font-family:var(--fuente-dato); }
  .na-flecha{ margin-left:auto; color:var(--mm-acento); font-weight:600; font-size:13.5px; }

  /* Pantalla Nadadores */
  .na-subcab{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:2px 0 16px; }
  .na-volver{ display:inline-flex; align-items:center; gap:7px; text-decoration:none; background:#fff; border:1px solid var(--linea-borde,#D4CBB9);
    color:var(--texto); font-size:14px; font-weight:600; min-height:40px; padding:8px 14px 8px 12px; border-radius:999px; }
  .na-volver:hover{ background:var(--crema-media,#EFE9DC); }
  .na-subcab h2{ font-family:var(--fuente-titulo); text-transform:uppercase; font-size:clamp(22px,3.2vw,28px); color:var(--navy); margin:0; }
  .na-cuenta{ margin-left:auto; font-family:var(--fuente-dato); font-size:13px; color:var(--texto-suave); }
  .na-cuenta b{ color:var(--navy); }
  .na-filtros{ display:flex; gap:10px; margin-bottom:14px; }
  .na-filtros input{ flex:1 1 220px; max-width:340px; min-height:44px; padding:10px 16px; border:1px solid var(--linea-borde,#D4CBB9);
    border-radius:999px; background:#fff; font:inherit; font-size:15px; color:var(--navy); }
  .na-personas{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:12px; }
  .na-p{ background:#fff; border-radius:var(--radio,14px); box-shadow:var(--sombra-suave,0 10px 22px -16px rgba(46,66,86,.5)); padding:14px 15px; }
  .na-p .fila{ display:flex; align-items:center; gap:11px; }
  .na-p .ava{ width:40px; height:40px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; color:#fff; font-weight:700; font-size:14px; font-family:var(--fuente-titulo); background:var(--mm-acento); }
  .na-p .nom{ flex:1 1 auto; min-width:0; }
  .na-p .nom b{ display:block; font-size:15.5px; color:var(--navy); line-height:1.15; }
  .na-p .cod{ flex:0 0 auto; font-family:var(--fuente-dato); font-size:11.5px; color:var(--texto-tenue); background:var(--crema,#FBF9F4); border:1px solid var(--linea,#EAE3D5); border-radius:8px; padding:4px 8px; }
  .na-fr{ margin-top:11px; padding-top:10px; border-top:1px dashed var(--linea,#EAE3D5); display:flex; flex-direction:column; gap:5px; }
  .na-fr .l{ display:flex; align-items:baseline; gap:9px; font-size:13px; }
  .na-fr .d{ font-weight:600; color:var(--navy); min-width:118px; }
  .na-fr .x{ color:var(--texto-suave); }
  .na-msg{ color:var(--texto-suave); text-align:center; padding:28px 10px; }
</style>
</head>
<body>

  <div id="nat"><p class="na-msg">Cargando…</p></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('nat');
  var DIAS = ['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var B = window.APOLANA_BASE || '../../';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hhmm(h){ return String(h).slice(0,5); }
  function ini(n){ var p=String(n||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
  var IC = {
    people:'<circle cx="9" cy="8" r="3.1"/><path d="M3.6 19c0-3 2.4-5 5.4-5s5.4 2 5.4 5"/><circle cx="17" cy="9" r="2.3"/><path d="M15.6 14.1c2.5.2 4.4 2.1 4.4 4.7"/>',
    calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2.2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>',
    check:'<circle cx="12" cy="12" r="8.5"/><path d="M8.4 12.3l2.5 2.4 4.7-5"/>',
    signal:'<rect x="8" y="2.5" width="8" height="19" rx="4"/><circle cx="12" cy="7" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="17" r="1.5"/>'
  };
  function ico(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>'; }

  // ---- Datos reales (RLS: admin/staff/responsable de natación) ----
  var rf = await sb.from('natacion_franjas').select('id,dia,hora,grupo');
  var ri = await sb.from('natacion_inscripciones').select('nombre,tipo,calle,nivel,acceso_id,franja_id').eq('activa', true);
  var ra = await sb.from('natacion_accesos').select('id,codigo,nombre');
  if (rf.error || ri.error) {
    wrap.innerHTML = '<p class="na-msg">No hemos podido cargar la natación. Recarga en un momento.</p>';
    return;
  }
  var FR = {}; (rf.data||[]).forEach(function(f){ FR[f.id]=f; });
  var COD = {}; (ra.error?[]:(ra.data||[])).forEach(function(a){ COD[a.id]=a.codigo; });

  // Este mundo = Natación adultos/máster. (La escuela de natación será su propio mundo.)
  var insMaster = (ri.data||[]).filter(function(m){ return m.tipo==='Máster'; });

  // Personas (por código de familia; si no, por nombre)
  var pers = {};
  insMaster.forEach(function(m){
    var k = m.acceso_id || ('nom:'+m.nombre);
    var p = pers[k] || (pers[k] = { nombre:m.nombre, codigo:COD[m.acceso_id]||'', franjas:[] });
    var f = FR[m.franja_id];
    if (f) p.franjas.push({ dia:f.dia, hora:hhmm(f.hora), calle:m.calle, nivel:m.nivel });
  });
  var PERSONAS = Object.keys(pers).map(function(k){ return pers[k]; });
  PERSONAS.forEach(function(p){ p.franjas.sort(function(a,b){ return a.dia!==b.dia ? a.dia-b.dia : (a.hora<b.hora?-1:1); }); });
  PERSONAS.sort(function(a,b){ return (a.nombre||'').toLowerCase()<(b.nombre||'').toLowerCase()?-1:1; });

  var nNad = PERSONAS.length;
  var nFranjas = (rf.data||[]).filter(function(f){ return f.grupo==='Máster'; }).length;
  var nCalles = (function(){ var s={}; insMaster.forEach(function(m){ if(m.calle) s[m.calle]=1; }); return Object.keys(s).length; })();

  // ---------- Vistas ----------
  function resumen(){
    var stats = [
      { n:nNad, l:'nadadores' },
      { n:nFranjas, l:'franjas' },
      { n:nCalles, l:'calles en uso' }
    ];
    var cards = [
      { t:'Nadadores', i:'people', d:'Los de adultos y máster, con su franja, calle y nivel.', pill:'<b>'+nNad+'</b>', url:B+'portal/natacion/?p=nadadores' },
      { t:'Franjas y cupos', i:'calendar', d:'Días, horas y calles con su cupo por nivel; altas y bajas.', pill:nFranjas+' franjas', url:B+'portal/natacion-gestion/?tipo=M%C3%A1ster' },
      { t:'Asistencia', i:'check', d:'Quién viene hoy y quién ha avisado que falta.', pill:'Hoy', url:B+'portal/natacion-asistencia/?tipo=M%C3%A1ster' },
      { t:'Ver en la web', i:'signal', d:'Cómo se ve la natación en la web pública, con el semáforo de plazas.', pill:'Web ↗', url:B+'natacion/', ext:true }
    ];
    wrap.innerHTML =
      '<div class="na-cab"><div class="na-eyebrow">Mundo</div>'+
      '<h1><span class="pt-g"></span>Natación</h1>'+
      '<p>Adultos y máster. Franjas, calles, cupos y quién falta, todo en un sitio.</p></div>'+
      '<div class="na-stats">'+ stats.map(function(s){ return '<div class="na-stat"><b>'+esc(s.n)+'</b><span>'+esc(s.l)+'</span></div>'; }).join('') +'</div>'+
      '<p class="na-hubtit">Herramientas de este mundo</p>'+
      '<div class="na-hub">'+ cards.map(function(c){
        return '<a class="na-card" href="'+esc(c.url)+'"'+(c.ext?' target="_blank" rel="noopener"':'')+'><span class="ico">'+ico(c.i)+'</span>'+
          '<h3>'+esc(c.t)+'</h3><p class="d">'+esc(c.d)+'</p>'+
          '<span class="pie"><span class="na-pill">'+c.pill+'</span><span class="na-flecha">'+(c.ext?'Ver ↗':'Abrir →')+'</span></span></a>';
      }).join('') +'</div>';
  }

  function nadadores(){
    var busca = '';
    function pinta(){
      var q = busca.trim().toLowerCase();
      var vis = PERSONAS.filter(function(p){ return !q || (p.nombre||'').toLowerCase().indexOf(q)!==-1; });
      var cards = vis.length ? vis.map(function(p){
        var fr = p.franjas.map(function(f){ return '<span class="l"><span class="d">'+esc(DIAS[f.dia]+' '+f.hora)+'</span><span class="x">'+esc(f.calle)+' · '+esc(f.nivel||'—')+'</span></span>'; }).join('');
        return '<div class="na-p"><div class="fila">'+
          '<span class="ava">'+esc(ini(p.nombre).toUpperCase())+'</span>'+
          '<span class="nom"><b>'+esc(p.nombre)+'</b></span>'+
          (p.codigo?'<span class="cod" title="Código de familia">'+esc(p.codigo)+'</span>':'')+
          '</div><div class="na-fr">'+fr+'</div></div>';
      }).join('') : '<p class="na-msg">Nadie con ese nombre.</p>';
      wrap.innerHTML =
        '<div class="na-subcab"><a class="na-volver" href="'+B+'portal/natacion/">← Resumen</a>'+
        '<h2>Nadadores</h2><span class="na-cuenta"><b>'+nNad+'</b> en total · mostrando '+vis.length+'</span></div>'+
        '<div class="na-filtros"><input type="search" id="na-q" placeholder="Buscar por nombre…" value="'+esc(busca)+'"></div>'+
        '<div class="na-personas">'+cards+'</div>';
      var qi = document.getElementById('na-q');
      if (qi){ qi.addEventListener('input', function(){ busca=qi.value; var pos=qi.selectionStart; pinta(); var n=document.getElementById('na-q'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }); }
    }
    pinta();
  }

  var p = new URLSearchParams(location.search).get('p');
  if (p==='nadadores') nadadores(); else resumen();
});
</script>
</body>
</html>
