<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  /* Inicio COMÚN del portal: lo mismo para todos (noticias + actividades del
     club). Lo que hace cada persona (entrenos, clases) vive en «Lo mío». */
  :root{ --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif;
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body{ background:var(--crema,#FBF9F4); }
  .in-wrap{ max-width:640px; margin:0 auto; padding:clamp(16px,4vw,26px) clamp(14px,4vw,22px) 48px; }
  .in-saludo{ font-family:var(--ap-titulo); font-weight:800; text-transform:uppercase; letter-spacing:-0.01em;
              font-size:clamp(26px,6vw,34px); line-height:1.0; color:var(--navy,#26374B); margin:2px 0 1px; }
  .in-sub{ font-size:13px; color:var(--texto-suave,#6E6656); margin:0 0 6px; }
  .in-rot{ font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:14px;
           color:var(--navy,#26374B); margin:22px 0 10px; }

  /* «Tu entreno de hoy» (adaptativo): solo sale a quien entrena hoy */
  .in-hoy{ background:var(--navy,#26374B); color:#fff; border-radius:16px; padding:16px; margin:14px 0 4px; border-left:4px solid #4A5FA6; box-shadow:var(--s1); }
  .in-hoy .eti{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:#4A5FA6; padding:3px 9px; border-radius:6px; }
  .in-hoy .tit{ font-family:var(--ap-titulo); font-weight:800; font-size:24px; line-height:1.02; margin:8px 0 3px; }
  .in-hoy .meta{ font-size:13px; color:rgba(255,255,255,.72); }
  .in-hoy .btn{ display:inline-flex; align-items:center; min-height:40px; padding:0 16px; border-radius:999px; background:#fff; color:var(--navy,#26374B); font-size:13.5px; font-weight:600; text-decoration:none; margin-top:12px; }

  /* Actividad abierta a inscripción */
  .act{ display:block; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px;
        box-shadow:var(--s1); padding:15px 17px; margin-bottom:12px; }
  .act .cab{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .act h2{ font-family:var(--ap-titulo); font-weight:700; font-size:17px; line-height:1.15; color:var(--navy,#26374B); margin:0; }
  .act .cuando{ font-size:13px; color:#8A5307; font-weight:700; white-space:nowrap; }
  .act p{ font-size:14px; line-height:1.5; color:var(--texto-suave,#6E6656); margin:8px 0 0; }
  .act .lugar{ font-size:13px; color:var(--texto-tenue,#9A927F); margin-top:5px; }
  .act .btn{ display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 18px; margin-top:12px;
             background:var(--navy,#26374B); color:#fff; border-radius:999px; font-weight:600; font-size:14px; text-decoration:none; }

  /* Noticia */
  .noti{ display:block; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px;
         box-shadow:var(--s1); overflow:hidden; margin-bottom:14px; text-decoration:none; color:inherit; }
  .noti img{ display:block; width:100%; height:auto; background:var(--crema-media,#F1EADC); }
  .noti .tx{ padding:13px 16px 15px; }
  .noti .cat{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#8A5307; }
  .noti h2{ font-family:var(--ap-titulo); font-weight:700; font-size:18px; line-height:1.2; color:var(--navy,#26374B); margin:3px 0 5px; }
  .noti p{ font-size:14px; line-height:1.5; color:var(--texto-suave,#6E6656); margin:0; }
  .noti .fecha{ font-size:12.5px; color:var(--texto-tenue,#9A927F); margin-top:7px; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="in-wrap" id="in"><div class="ap-esq" data-esq="filas:3"></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var b = (window.APOLANA_BASE || '../../');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  function fechaLarga(iso){ if(!iso) return ''; var p=String(iso).slice(0,10).split('-'); if(p.length!==3) return esc(iso); return (+p[2])+' de '+MESES[(+p[1])-1]; }
  var HOY = new Date();
  var saludoFecha = DIAS[HOY.getDay()]+' '+HOY.getDate()+' de '+MESES[HOY.getMonth()];
  var nombre = (perfil && perfil.nombre) ? String(perfil.nombre).split(' ')[0] : '';

  // --- Datos (mismo patrón que la página del socio) ---
  async function actividades() {
    var hoy = new Date().toISOString().slice(0, 10);
    var r = await sb.from('eventos')
      .select('titulo,descripcion,fecha_inicio,lugar,inscripcion_abierta,url')
      .eq('inscripcion_abierta', true)
      .gte('fecha_inicio', hoy)
      .order('fecha_inicio', { ascending: true })
      .limit(20);
    return r.error ? { error: r.error.message, data: [] } : { error: '', data: r.data || [] };
  }
  async function noticias() {
    var r = await sb.from('noticias')
      .select('id,titulo,excerpt,categoria,foto_portada,fecha_publicacion')
      .eq('publicada', true)
      .order('fecha_publicacion', { ascending: false })
      .limit(20);
    return r.error ? { error: r.error.message, data: [] } : { error: '', data: r.data || [] };
  }

  function actHTML(a) {
    var url = (a.url && String(a.url).indexOf('http') === 0) ? a.url : '';
    var cta = url
      ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Apuntarme →</a>'
      : '<a class="btn" href="' + b + 'contacto/">Escribir al club para apuntarme</a>';
    return '<article class="act">' +
      '<div class="cab"><h2>' + esc(a.titulo || 'Actividad') + '</h2>' +
        '<span class="cuando">' + esc(fechaLarga(a.fecha_inicio)) + '</span></div>' +
      (a.lugar ? '<div class="lugar">' + esc(a.lugar) + '</div>' : '') +
      (a.descripcion ? '<p>' + esc(a.descripcion) + '</p>' : '') +
      cta +
    '</article>';
  }
  function noticiaHTML(x) {
    var src = (window.APOLANA_IMG ? window.APOLANA_IMG(x.foto_portada) : x.foto_portada);
    return '<a class="noti" href="' + b + 'noticias/">' +
      (src ? '<img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      '<div class="tx">' +
        (x.categoria ? '<span class="cat">' + esc(x.categoria) + '</span>' : '') +
        '<h2>' + esc(x.titulo) + '</h2>' +
        (x.excerpt ? '<p>' + esc(x.excerpt) + '</p>' : '') +
        '<div class="fecha">' + esc(fechaLarga(x.fecha_publicacion)) + '</div>' +
      '</div></a>';
  }

  /* «Tu entreno de hoy» (adaptativo): SOLO la sesión asignada a la persona.
     En Academia cada atleta tiene su fila con el mismo grupo_id, así que se
     prioriza la sesión cuya `atletas_ids` me incluye (no la primera del grupo). */
  async function entrenoDeHoy() {
    try {
      var m = await APOLANA_PORTAL.misAtletas(perfil.id);
      var fichas = (m && m.data || []).filter(function (a) { return a && (a.perfil_id === perfil.id || a.perfil_padre_id === perfil.id); });
      var gids = [], aids = fichas.map(function (a) { return a.id; }).filter(Boolean);
      fichas.forEach(function (a) { if (a.grupo_id) gids.push(a.grupo_id); });
      if (aids.length) {
        var rag = await sb.from('atleta_grupos').select('grupo_id').in('atleta_id', aids);
        if (rag && !rag.error && rag.data) rag.data.forEach(function (x) { gids.push(x.grupo_id); });
      }
      var hy = new Date();
      var hyISO = hy.getFullYear() + '-' + ('0' + (hy.getMonth() + 1)).slice(-2) + '-' + ('0' + hy.getDate()).slice(-2);
      var rs = await sb.from('sesiones').select('id,titulo,hora,lugar,grupo_id,atletas_ids,tipo,papel_dia')
        .eq('publicada', true).eq('fecha', hyISO);
      if (!rs || rs.error || !rs.data) return null;
      var noDescanso = function (s) { return (s.papel_dia || s.tipo) !== 'descanso'; };
      var paraMi = function (s) { return s.atletas_ids && s.atletas_ids.length && aids.some(function (id) { return s.atletas_ids.indexOf(id) >= 0; }); };
      var personal = rs.data.filter(function (s) { return noDescanso(s) && paraMi(s); });
      var grupal = rs.data.filter(function (s) { return noDescanso(s) && !paraMi(s) && (!s.atletas_ids || !s.atletas_ids.length) && s.grupo_id && gids.indexOf(s.grupo_id) >= 0; });
      return personal[0] || grupal[0] || null;
    } catch (e) { return null; }
  }

  var caja = document.getElementById('in');
  caja.innerHTML =
    '<h1 class="in-saludo">Hola' + (nombre ? ', ' + esc(nombre) : '') + '</h1>' +
    '<p class="in-sub">' + esc(saludoFecha) + '</p>' +
    '<div id="in-hoy"></div>' +
    '<div id="in-act"></div>' +
    '<div class="in-rot">Noticias del club</div>' +
    '<div id="in-noti"><div class="ap-esq" data-esq="filas:2"></div></div>';

  var res = await Promise.all([actividades(), noticias(), entrenoDeHoy()]);
  var act = res[0], noti = res[1], hoy = res[2];

  // Entreno de hoy (solo si la persona entrena hoy)
  var cH = document.getElementById('in-hoy');
  if (hoy) {
    var metaH = [(hoy.hora ? String(hoy.hora).slice(0, 5) : ''), hoy.lugar].filter(Boolean).join(' · ');
    cH.innerHTML = '<div class="in-hoy"><span class="eti">Tu entreno de hoy</span>' +
      '<div class="tit">' + esc(hoy.titulo || 'Entrenamiento') + '</div>' +
      (metaH ? '<div class="meta">' + esc(metaH) + '</div>' : '') +
      '<a class="btn" href="' + b + 'portal/atleta/#entreno">Abrir el entrenamiento</a></div>';
  } else { cH.innerHTML = ''; }

  var cA = document.getElementById('in-act');
  cA.innerHTML = (act.data && act.data.length)
    ? '<div class="in-rot" style="margin-top:16px">Actividades para apuntarte</div>' + act.data.map(actHTML).join('')
    : '';

  var cN = document.getElementById('in-noti');
  cN.innerHTML = (noti.data && noti.data.length)
    ? noti.data.map(noticiaHTML).join('')
    : (window.APOLANA_UI
        ? APOLANA_UI.vacio('Todavía no hay noticias', 'Cuando el club publique algo, aparecerá aquí.')
        : '<p class="in-sub">Todavía no hay noticias.</p>');
});
</script>

</body>
</html>
