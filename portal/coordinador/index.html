<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinación · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .co-wrap { max-width: 1000px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }

  /* Cabecera de pantalla (kit 30h): migas a 14 px, título a 28 px, sobre crema. */
  .migas { display:inline-flex; align-items:center; min-height:44px; margin-bottom:4px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:14px; padding:0 2px 0 0; }
  .co-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; line-height:1.05; color: var(--navy); margin: 0 0 4px; }
  .co-cab .sub { font-size:14px; color: var(--texto-suave); }

  .tarjeta { background: #fff; border: 1px solid var(--linea); border-radius:14px; padding: clamp(18px,3vw,26px); margin-top: 18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 4px; }
  .tarjeta .pie-nota { font-size:13px; line-height:1.5; color: var(--texto-suave); margin: 12px 0 0; }
  .tarjeta > .intro-tarjeta { font-size:14px; color: var(--texto-suave); margin: 0 0 14px; }

  table { width: 100%; border-collapse: collapse; }
  .tabla-scroll { margin: 0 -2px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--linea); font-size:14px; vertical-align: top; }
  /* Rótulos de columna: 13 px, minúscula y sin espaciado (fundamentos 28b). */
  th { font-size:13px; font-weight: 600; color: var(--texto-suave); }
  /* Mono solo en lo que se compara en columna: contadores y horas (fundamentos 28c). */
  td.num, td.hora { font-family: var(--fuente-dato); font-size:13px; }
  .sub-linea { display:block; color: var(--texto-suave); font-size:13px; line-height:1.4; margin-top:2px; }

  /* Por debajo de 720 px la tabla se vuelve ficha: nunca desplazamiento horizontal (kit 30e). */
  @media (max-width: 720px) {
    .tabla-scroll { margin: 0; }
    table, tbody, tr, td { display: block; }
    thead { display: none; }
    tr { position: relative; background: var(--crema); border: 1px solid var(--linea-marcada);
         border-radius: 14px; padding: 12px 14px 11px; margin-top: 10px; }
    td { border-bottom: 0; padding: 0; display: inline; }
    td.principal { display: block; font-size:15px; font-weight: 600; color: var(--navy);
                   padding-right: 92px; margin-bottom: 3px; }
    td.estado { position: absolute; top: 12px; right: 14px; }
    td.dato { color: var(--texto-suave); }
    td.dato + td.dato::before { content: ' · '; }
    td.num, td.hora { font-size:13px; }
  }

  .pill { font-size:13px; padding: 2px 9px; border-radius: 999px; background: var(--crema-media); color: var(--texto-suave); display: inline-block; }
  /* Ni verde ni rojo: el verde es «está hecho» y el rojo, lo que se ha hecho mal.
     Lo que pide una vuelta del coordinador va en ámbar (carácter 31a). */
  .pill.si { background: #fff; border: 1px solid var(--linea-borde); color: var(--navy); }
  .pill.no { background: #F6EBD6; color: #8A5307; }
  /* Nombres propios del club, solo en texto. */
  .marca { color: #8A5307; }

  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; }
  .cifra { background: var(--crema); border: 1px solid var(--linea); border-radius:10px; padding: 14px 16px; }
  /* Cifra de contador: mono, que se comparan en columna. */
  .cifra b { display: block; font-family: var(--fuente-dato); font-weight: 700; font-size:28px; line-height: 1; color: var(--navy); }
  .cifra span { display: block; font-size:13px; color: var(--texto-suave); margin-top: 6px; }

  .lista-fechas { list-style: none; margin: 0; padding: 0; }
  .lista-fechas li { display: flex; gap: 14px; align-items: center; min-height: 48px; box-sizing: border-box;
                     padding: 11px 0; border-bottom: 1px solid var(--linea); font-size:14px; }
  .lista-fechas li:last-child { border-bottom: 0; }
  /* Fecha en frase corta: Plex Sans con cifras de ancho fijo, no mono (fundamentos 28c). */
  .lista-fechas .fecha { font-size:13px; font-variant-numeric: tabular-nums; color: var(--texto-suave); flex: 0 0 96px; }
  .lista-fechas .que { flex: 1; min-width: 0; color: var(--navy); font-size:15px; }
  .lista-fechas .que small { display: block; color: var(--texto-suave); font-size:13px; margin-top:2px; }

  .accesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 10px; }
  .accesos a { background: var(--crema); border: 1px solid var(--linea); border-radius:10px; min-height:48px; box-sizing:border-box;
               padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-decoration: none; color: var(--navy); }
  .accesos a:hover { border-color: var(--linea-marcada); background: #fff; }
  .accesos a b { display: block; font-size:15px; font-weight: 600; }
  .accesos a small { display: block; color: var(--texto-suave); font-size:13px; line-height:1.4; margin-top: 2px; }
  .accesos .chev { flex:0 0 auto; display:flex; color: #6E6656; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="co-wrap" id="co-wrap">
    <a class="migas" href="../">← Volver al portal</a>
    <div class="co-cab"><h1>Coordinación</h1></div>
    <div class="tarjeta"><div class="ap-esq" data-esq="cifras:4"></div></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(function (sb, perfil) {
  var wrap = document.getElementById('co-wrap');

  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function icono(n, t) { return (window.APOLANA_UI && APOLANA_UI.icono) ? APOLANA_UI.icono(n, t || 24) : ''; }
  var CHEV = '<span class="chev">' + (icono('entrar', 20) || '&rsaquo;') + '</span>';
  var MIGAS = '<a class="migas" href="../">← Volver al portal</a>';

  /* Reintentar solo el bloque que ha fallado, sin recargar la página entera. */
  var REINTENTOS = {}, nRe = 0;
  function htmlError(titulo, texto, fn) {
    var k = 'r' + (++nRe);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="' + k + '">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (fn) fn();
  });

  var SECCIONES = {
    escuela: 'Escuela', competicion: 'Competición', running: 'Running',
    triatlon: 'Triatlón', natacion: 'Natación', gimnasio: 'Gimnasio', adultos: 'Adultos',
    cubo: 'El Cubo', montana: 'Montaña', pista: 'Pista',
    'escuela-natacion': 'Escuela de natación', 'escuela-municipal': 'Escuela municipal',
    'deporte-adaptado': 'Deporte adaptado'
  };
  function nombreSeccion(s) { return SECCIONES[s] || (s || 'Sin sección'); }
  /* Los nombres propios del club se distinguen de las categorías (carácter 31c). */
  var NOMBRES_PROPIOS = ['El Cubo', 'La Tribu', 'Madre Tierra', 'Kilómetro Cero',
                         'Vertical Apolana', 'Familia Apolana', 'Liga Apolana'];
  function marcar(html) {
    NOMBRES_PROPIOS.forEach(function (n) { html = html.split(n).join('<span class="marca">' + n + '</span>'); });
    return html;
  }

  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fechaCorta(v) {
    if (!v) return 'sin fecha';
    var d = new Date(v);
    if (isNaN(d.getTime())) return 'sin fecha';
    return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
  }

  if (!perfil) {
    wrap.innerHTML = MIGAS + '<div class="co-cab"><h1>Coordinación</h1></div>' +
      '<div class="tarjeta">' + APOLANA_UI.vacio('Todavía no encontramos tu ficha en el club',
        'Has entrado bien, pero tu ficha aún no está enlazada con esta cuenta. Avisa al club y lo dejan listo enseguida.',
        APOLANA_UI.boton('Volver al portal', '../')) + '</div>';
    return;
  }

  /* El papel activo, no el principal: si has entrado como atleta, esta
     pantalla no es la tuya aunque además coordines. Así lo que dice la
     franja de arriba y lo que enseña la pantalla van a una. */
  var rol = perfil.rol_activo || perfil.rol || '';
  if (rol !== 'coordinador' && rol !== 'admin') {
    wrap.innerHTML = MIGAS + '<div class="co-cab"><h1>Coordinación</h1></div>' +
      '<div class="tarjeta">' + APOLANA_UI.vacio('Esta pantalla es del equipo de coordinación',
        'Tu cuenta está como «' + (rol || 'sin papel asignado') + '», así que aquí no hay nada para ti. Desde el portal llegas a tu zona.',
        APOLANA_UI.boton('Volver al portal', '../')) + '</div>';
    return;
  }

  var miSeccion = perfil.seccion || null;

  /* Tablero: cinco tarjetas, cada una con su esqueleto mientras llegan los datos. */
  wrap.innerHTML = MIGAS +
    '<div class="co-cab">' +
      '<h1>Coordinación</h1>' +
      '<span class="sub">' + marcar(esc(miSeccion ? nombreSeccion(miSeccion) : 'Todas las secciones')) + '</span>' +
    '</div>' +
    '<div class="tarjeta" id="co-resumen"><h2>Resumen</h2>' + APOLANA_UI.cargando('cifras', 4) + '</div>' +
    '<div class="tarjeta" id="co-grupos"><h2>Grupos</h2>' + APOLANA_UI.cargando('filas', 4) + '</div>' +
    '<div class="tarjeta" id="co-atletas"><h2>Atletas por grupo</h2>' + APOLANA_UI.cargando('filas', 3) + '</div>' +
    '<div class="tarjeta" id="co-fechas"><h2>Próximas fechas</h2>' + APOLANA_UI.cargando('filas', 4) + '</div>' +
    /* Los documentos del club NO se repiten aquí: se llega a ellos por el enlace
       de «Del portal», que lleva a la pantalla de Documentos. Antes estaban las
       dos cosas —la lista entera y, tres líneas más abajo, el enlace a la misma
       lista— y no había forma de saber cuál era la buena. */
    '<div class="tarjeta">' +
      '<h2>Del portal</h2>' +
      '<p class="intro-tarjeta">Las pantallas del club a las que llegas desde aquí.</p>' +
      '<div class="accesos">' +
        '<a href="../calendario/"><span><b>Calendario del club</b>' +
          '<small>Entrenamientos, El Cubo, competiciones y eventos.</small></span>' + CHEV + '</a>' +
        '<a href="../competiciones/"><span><b>Competiciones</b>' +
          '<small>Fechas, circulares e inscripciones.</small></span>' + CHEV + '</a>' +
        '<a href="../documentos/"><span><b>Documentos</b>' +
          '<small>Normativa, impresos y circulares del club.</small></span>' + CHEV + '</a>' +
      '</div>' +
    '</div>';

  cargar();

  async function cargar() {
    /* ---------- GRUPOS (lectura pública en la base de datos) ---------- */
    var grupos = [];
    var errGrupos = null;
    try {
      var q = sb.from('grupos').select('id,nombre,seccion,entrenador_id,horario,descripcion,activo,turno')
        .order('nombre').order('turno', { nullsFirst: true });
      if (miSeccion) q = q.eq('seccion', miSeccion);
      var rg = await q;
      if (rg.error) errGrupos = rg.error.message; else grupos = rg.data || [];
      /* En la escuela el mismo grupo existe dos veces por semana, con el
         mismo nombre y niños distintos. En una tabla que va grupo por
         grupo, dos «Azul 2» seguidos y sin nada que los separe no se
         pueden mirar: se les añaden los días. */
      grupos.forEach(function (g) {
        if (g.turno && window.APOLANA_GRUPO_NOMBRE) g.nombre = window.APOLANA_GRUPO_NOMBRE(g);
      });
    } catch (e) { errGrupos = 'No se pudo consultar los grupos.'; }

    /* ---------- TÉCNICOS ----------
       Se intenta poner nombre a cada entrenador_id. Hoy las reglas de la
       base de datos solo dejan leer tu propia ficha de `perfiles` (salvo
       administración), así que lo normal es que no llegue ningún nombre:
       en ese caso la tabla lo dice en vez de inventarlo. */
    var tecnicos = {};
    try {
      var ids = [];
      grupos.forEach(function (g) { if (g.entrenador_id && ids.indexOf(g.entrenador_id) === -1) ids.push(g.entrenador_id); });
      if (ids.length) {
        var rt = await sb.from('perfiles').select('id,nombre,apellidos').in('id', ids);
        if (!rt.error && rt.data) {
          rt.data.forEach(function (p) { tecnicos[p.id] = ((p.nombre || '') + ' ' + (p.apellidos || '')).trim(); });
        }
      }
    } catch (e) { /* sin permisos: se queda vacío */ }

    pintarGrupos(grupos, errGrupos, tecnicos);

    /* ---------- ATLETAS ----------
       Hoy las reglas de la base de datos solo dejan leer los atletas
       propios (los tuyos, los de tus hijos o los que entrenas). Se pide
       lo que haya y se cuenta lo que llega de verdad. */
    var atletas = [], errAtletas = false;
    try {
      var idsGrupos = grupos.map(function (g) { return g.id; });
      if (idsGrupos.length) {
        var ra = await sb.from('atletas')
          .select('id,nombre,apellidos,grupo_id,estado,categoria')
          .in('grupo_id', idsGrupos);
        /* Si la consulta falla no llega ningún atleta, y eso NO es «no hay
           atletas»: es que no hemos podido mirar. Se dicen cosas distintas. */
        if (ra.error) errAtletas = true; else atletas = ra.data || [];
      }
    } catch (e) { errAtletas = true; }

    pintarAtletas(grupos, atletas, errAtletas);
    pintarResumen(grupos, atletas, errGrupos);
    pintarFechas();
  }

  /* ---------------- Resumen ---------------- */
  function pintarResumen(grupos, atletas, err) {
    var caja = document.getElementById('co-resumen');
    if (err) {
      caja.innerHTML = '<h2>Resumen</h2>' +
        htmlError('No hemos podido contar los grupos',
          'Puede ser tu conexión. Vuelve a intentarlo y, si sigue igual, avisa al club.', cargar);
      return;
    }
    if (!grupos.length) {
      caja.innerHTML = '<h2>Resumen</h2>' +
        APOLANA_UI.vacio('Todavía no hay nada que contar',
          'En cuanto el club dé de alta el primer grupo' + (miSeccion ? ' de ' + nombreSeccion(miSeccion) : '') +
          ', aquí verás cuántos hay, cuántos están activos y cuáles tienen técnico.',
          APOLANA_UI.boton('Ver el calendario del club', '../calendario/'));
      return;
    }
    var activos = grupos.filter(function (g) { return g.activo !== false; }).length;
    var conTecnico = grupos.filter(function (g) { return !!g.entrenador_id; }).length;
    caja.innerHTML =
      '<h2>Resumen</h2>' +
      '<p class="intro-tarjeta">' + (miSeccion
        ? 'Lo que hay hoy en ' + esc(nombreSeccion(miSeccion)) + '.'
        : 'Tu perfil no tiene sección asignada, así que ves todo el club.') + '</p>' +
      '<div class="cifras">' +
        '<div class="cifra"><b>' + grupos.length + '</b><span>grupos</span></div>' +
        '<div class="cifra"><b>' + activos + '</b><span>activos</span></div>' +
        '<div class="cifra"><b>' + conTecnico + '</b><span>con técnico</span></div>' +
        '<div class="cifra"><b>' + (grupos.length - conTecnico) + '</b><span>sin técnico</span></div>' +
      '</div>';
  }

  /* ---------------- Grupos ---------------- */
  function pintarGrupos(grupos, err, tecnicos) {
    tecnicos = tecnicos || {};
    var caja = document.getElementById('co-grupos');
    var html = '<h2>Grupos</h2>';
    if (err) {
      html += htmlError('No hemos podido cargar los grupos',
        'Puede ser tu conexión. Los grupos siguen ahí; vuelve a intentarlo en un momento.', cargar);
      caja.innerHTML = html; return;
    }
    if (!grupos.length) {
      html += APOLANA_UI.vacio('Todavía no hay grupos dados de alta' + (miSeccion ? ' en ' + nombreSeccion(miSeccion) : ''),
        'Cuando el club los cree, aquí verás el nombre de cada grupo, su horario, quién lo lleva y si está activo.',
        APOLANA_UI.boton('Ver los horarios del club', '../../horarios/'));
      caja.innerHTML = html; return;
    }
    html += '<p class="intro-tarjeta">Nombre, horario y estado de cada grupo.</p>' +
      '<div class="tabla-scroll"><table><thead><tr><th>grupo</th>' + (miSeccion ? '' : '<th>sección</th>') +
      '<th>horario</th><th>técnico</th><th>estado</th></tr></thead><tbody>';
    var faltaAlgunNombre = false;
    grupos.forEach(function (g) {
      var tec;
      if (!g.entrenador_id) { tec = '<span class="pill no">Sin asignar</span>'; }
      else if (tecnicos[g.entrenador_id]) { tec = esc(tecnicos[g.entrenador_id]); }
      else { tec = '<span class="pill si">Asignado</span>'; faltaAlgunNombre = true; }
      html += '<tr>' +
        '<td class="principal">' + marcar(esc(g.nombre)) + (g.descripcion ? '<span class="sub-linea">' + esc(g.descripcion) + '</span>' : '') + '</td>' +
        (miSeccion ? '' : '<td class="dato">' + marcar(esc(nombreSeccion(g.seccion))) + '</td>') +
        '<td class="dato hora">' + esc(g.horario || 'sin horario') + '</td>' +
        '<td class="dato">' + tec + '</td>' +
        '<td class="estado">' + (g.activo === false ? '<span class="pill no">Inactivo</span>' : '<span class="pill si">Activo</span>') + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    if (faltaAlgunNombre) {
      html += '<p class="pie-nota">El nombre de algún técnico todavía no se puede enseñar aquí: ' +
        'está pendiente de que el club abra esa ficha a coordinación. Mientras tanto se ve si el grupo tiene técnico o no.</p>';
    }
    caja.innerHTML = html;
  }

  /* ---------------- Atletas por grupo ---------------- */
  function pintarAtletas(grupos, atletas, err) {
    var caja = document.getElementById('co-atletas');
    var html = '<h2>Atletas por grupo</h2>';
    if (err) {
      html += htmlError('No hemos podido cargar los atletas',
        'Puede ser tu conexión. No es que los grupos estén vacíos: es que no hemos podido preguntarlo.', cargar);
      caja.innerHTML = html; return;
    }
    if (!atletas.length) {
      html += (rol === 'admin')
        ? APOLANA_UI.vacio('Todavía no hay atletas en estos grupos',
            'En cuanto el club asigne atletas a un grupo, aquí verás cuántos hay en cada uno y quiénes son.',
            APOLANA_UI.boton('Ver los grupos del club', '../../horarios/'))
        : APOLANA_UI.vacio('Todavía no podemos enseñarte esta lista',
            'Ahora mismo solo se ven las fichas de los atletas que entrenas tú o que son de tu familia, no las de toda la sección. ' +
            'Está pendiente de que el club lo abra a coordinación.',
            APOLANA_UI.boton('Escribir al club', '../mensajes/'));
      caja.innerHTML = html; return;
    }
    var porGrupo = {};
    atletas.forEach(function (a) {
      var k = a.grupo_id || 'sin';
      (porGrupo[k] = porGrupo[k] || []).push(a);
    });
    html += '<p class="intro-tarjeta">Solo aparecen los atletas que tu cuenta puede ver hoy.</p>' +
      '<div class="tabla-scroll"><table><thead><tr><th>grupo</th><th>atletas</th><th>nombres</th></tr></thead><tbody>';
    grupos.forEach(function (g) {
      var l = porGrupo[g.id] || [];
      if (!l.length) return;
      var nombres = l.map(function (a) { return esc(((a.nombre || '') + ' ' + (a.apellidos || '')).trim()); }).join(', ');
      html += '<tr><td class="principal">' + marcar(esc(g.nombre)) + '</td>' +
        '<td class="dato num">' + l.length + '</td><td class="dato">' + nombres + '</td></tr>';
    });
    html += '</tbody></table></div>';
    caja.innerHTML = html;
  }

  /* ---------------- Próximas fechas ---------------- */
  async function pintarFechas() {
    var caja = document.getElementById('co-fechas');
    var filas = [];
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var falloEventos = false, falloComps = false;

    try {
      var re = await sb.from('eventos').select('id,titulo,tipo,fecha_inicio,lugar,seccion').order('fecha_inicio');
      if (re.error) falloEventos = true;
      else if (re.data) {
        re.data.forEach(function (ev) {
          if (!ev.fecha_inicio || new Date(ev.fecha_inicio) < hoy) return;
          if (miSeccion && Array.isArray(ev.seccion) && ev.seccion.length && ev.seccion.indexOf(miSeccion) === -1) return;
          filas.push({ f: ev.fecha_inicio, t: ev.titulo, d: [ev.tipo, ev.lugar].filter(Boolean).join(' · ') });
        });
      }
    } catch (e) { falloEventos = true; }

    try {
      var rc = await sb.from('competiciones').select('id,nombre,sede,fecha_inicio,nivel').order('fecha_inicio');
      if (rc.error) falloComps = true;
      else if (rc.data) {
        rc.data.forEach(function (c) {
          if (!c.fecha_inicio || new Date(c.fecha_inicio) < hoy) return;
          filas.push({ f: c.fecha_inicio, t: c.nombre, d: [c.nivel, c.sede].filter(Boolean).join(' · ') });
        });
      }
    } catch (e) { falloComps = true; }

    filas.sort(function (a, b) { return String(a.f).localeCompare(String(b.f)); });
    filas = filas.slice(0, 12);

    var html = '<h2>Próximas fechas</h2>';
    /* «No hay nada por delante» solo se dice cuando se ha podido mirar las dos
       listas. Si falla una, lo que sale no es todo lo que hay, y decir que no
       hay nada haría dejar de mirar el calendario. */
    var queFalta = falloEventos && falloComps ? 'ni los eventos ni las competiciones'
                 : (falloEventos ? 'los eventos del club' : 'las competiciones');
    if (!filas.length && (falloEventos || falloComps)) {
      html += htmlError('No hemos podido cargar el calendario',
        'Puede ser tu conexión: no hemos podido leer ' + queFalta + '. Vuelve a intentarlo en un momento.',
        pintarFechas);
    } else if (!filas.length) {
      html += APOLANA_UI.vacio('No hay nada apuntado por delante',
        'Cuando el club publique el próximo evento o la próxima competición, aparecerá aquí con su fecha.',
        APOLANA_UI.boton('Ver el calendario del club', '../calendario/'));
    } else {
      html += '<ul class="lista-fechas">' + filas.map(function (x) {
        return '<li><span class="fecha">' + esc(fechaCorta(x.f)) + '</span>' +
               '<span class="que">' + esc(x.t) + (x.d ? '<small>' + esc(x.d) + '</small>' : '') + '</span></li>';
      }).join('') + '</ul>';
      if (falloEventos || falloComps) {
        html += htmlError('Falta parte del calendario',
          'Esto no es todo: no hemos podido leer ' + queFalta + '. Puede ser tu conexión.', pintarFechas);
      }
    }
    caja.innerHTML = html;
  }

});
</script>

</body>
</html>
