<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lo mío · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  /* «Lo mío»: el hogar de lo que hace cada persona en el club. Se adapta: si
     haces Cubo ves Cubo; natación, natación; los dos, los dos. Reúne las mismas
     fuentes que el calendario, pero como bloques de acceso (no como agenda). */
  :root{
    --lm-cubo:#B5714A; --lm-natacion:#2E8C86; --lm-atletismo:#4A5FA6; --lm-tests:#2F6FA8;
  }
  body{ background:var(--crema,#FBF9F4); }
  .lm-wrap{ max-width:640px; margin:0 auto; padding:clamp(16px,4vw,26px) clamp(14px,4vw,22px) 48px; }
  .lm-saludo{ font-size:13px; color:var(--texto-suave,#6E6656); margin:2px 0 1px; }
  .lm-h{ font-family:var(--fuente-titulo,'Bricolage Grotesque',system-ui,sans-serif); font-weight:800;
         text-transform:uppercase; font-size:clamp(26px,6vw,34px); line-height:.98; color:var(--navy,#26374B); margin:0 0 14px; }
  .lm-rot{ font-family:var(--fuente-titulo,'Bricolage Grotesque',system-ui,sans-serif); font-weight:700;
           text-transform:uppercase; font-size:12px; letter-spacing:.08em; color:var(--texto-tenue,#9A927F); margin:20px 2px 9px; }

  /* Bloque de una actividad tuya (Cubo, natación, atletismo) */
  .lm-bloque{ background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px;
              box-shadow:0 12px 24px -18px rgba(46,66,86,.5); padding:15px 16px; margin-bottom:12px;
              border-left:4px solid var(--pc,var(--lm-atletismo)); }
  .lm-bloque .cab{ display:flex; align-items:center; gap:10px; }
  .lm-bloque .pin{ width:34px; height:34px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center;
                   color:#fff; background:var(--pc,var(--lm-atletismo)); }
  .lm-bloque .pin svg{ width:19px; height:19px; }
  .lm-bloque h2{ font-family:var(--fuente-titulo,'Bricolage Grotesque',system-ui,sans-serif); font-weight:700;
                 font-size:19px; line-height:1.05; color:var(--navy,#26374B); margin:0; text-transform:uppercase; }
  .lm-bloque .sub{ font-size:12.5px; color:var(--texto-suave,#6E6656); margin-top:1px; }
  .lm-lineas{ margin:11px 0 0; display:flex; flex-direction:column; gap:6px; }
  .lm-linea{ display:flex; gap:10px; align-items:baseline; font-size:14px; color:var(--navy,#26374B); }
  .lm-linea .dd{ font-family:var(--fuente-dato,ui-monospace,monospace); font-size:13px; color:var(--pc,var(--lm-atletismo)); flex:0 0 auto; min-width:78px; }
  .lm-linea .qq{ color:var(--texto-suave,#6E6656); }
  .lm-acc{ display:flex; flex-wrap:wrap; gap:8px; margin-top:13px; }
  .lm-btn{ display:inline-flex; align-items:center; min-height:40px; padding:0 15px; border-radius:999px;
           background:var(--navy,#26374B); color:#fff; font-size:13.5px; font-weight:600; text-decoration:none; }
  .lm-btn.ghost{ background:transparent; color:var(--navy,#26374B); border:1px solid var(--linea-borde,#E4DCCB); }

  /* Entreno de hoy (destacado, arriba) */
  .lm-hoy{ background:var(--navy,#26374B); color:#fff; border-radius:16px; padding:16px; margin-bottom:14px;
           border-left:4px solid var(--lm-atletismo); }
  .lm-hoy .eti{ display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
                color:#fff; background:var(--lm-atletismo); padding:3px 9px; border-radius:6px; }
  .lm-hoy .tit{ font-family:var(--fuente-titulo,'Bricolage Grotesque',system-ui,sans-serif); font-weight:800;
                font-size:24px; line-height:1.02; margin:8px 0 3px; }
  .lm-hoy .meta{ font-size:13px; color:rgba(255,255,255,.72); }
  .lm-hoy .lm-btn{ background:#fff; color:var(--navy,#26374B); margin-top:12px; }

  /* Tarjetas de acceso (tests, calendario) */
  .lm-tarj{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB);
            border-radius:14px; padding:13px 15px; margin-bottom:9px; text-decoration:none; border-left:4px solid var(--pc,var(--lm-tests)); }
  .lm-tarj .pin{ width:32px; height:32px; border-radius:9px; flex:0 0 auto; display:grid; place-items:center; color:#fff; background:var(--pc,var(--lm-tests)); }
  .lm-tarj .pin svg{ width:18px; height:18px; }
  .lm-tarj .tx{ flex:1; min-width:0; }
  .lm-tarj .tx b{ display:block; font-size:14.5px; color:var(--navy,#26374B); font-weight:600; }
  .lm-tarj .tx small{ display:block; font-size:12.5px; color:var(--texto-suave,#6E6656); }
  .lm-tarj .chev{ color:var(--texto-tenue,#9A927F); font-size:18px; }

  /* Estado vacío (socio sin actividades) */
  .lm-vacio{ background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; padding:22px 18px; text-align:center; }
  .lm-vacio p{ font-size:14px; color:var(--texto-suave,#6E6656); line-height:1.5; margin:0 0 14px; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="lm-wrap" id="lm"><div class="ap-esq" data-esq="filas:4"></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var b = (window.APOLANA_BASE || '../../');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function hhmm(t){ return t ? String(t).slice(0,5) : ''; }
  var DIA_CORTO = ['','Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];   // dia_semana 1..7
  var nombre = (perfil && perfil.nombre) ? String(perfil.nombre).split(' ')[0] : '';

  function svg(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'; }
  var IC = {
    cubo:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/>',
    agua:'<path d="M12 3s6 6.5 6 10.5A6 6 0 0 1 6 13.5C6 9.5 12 3 12 3z"/>',
    correr:'<circle cx="15" cy="5" r="2"/><path d="M9 21l2.5-5 2-2 2 3 3 1M6 12l3-2 3 1 1.5 3"/>',
    diana:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/>',
    cal:'<rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>',
    chev:'<path d="M9 6l6 6-6 6"/>'
  };

  // ---- fecha de hoy (local) ----
  function pad(n){ return (n<10?'0':'')+n; }
  var HOY = new Date();
  var HOY_ISO = HOY.getFullYear()+'-'+pad(HOY.getMonth()+1)+'-'+pad(HOY.getDate());
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var saludoFecha = DIAS[HOY.getDay()]+' '+HOY.getDate()+' de '+MESES[HOY.getMonth()];

  // ============================================================
  //  QUÉ HACE ESTA PERSONA · sus fichas → sus grupos → secciones
  // ============================================================
  var fichas = [];
  try {
    var m = await APOLANA_PORTAL.misAtletas(perfil.id);
    // Solo lo MÍO: mi ficha y la de mis hijos (no los atletas que entreno).
    fichas = (m && m.data || []).filter(function (a) {
      return a && (a.perfil_id === perfil.id || a.perfil_padre_id === perfil.id);
    });
  } catch (e) { /* sin fichas: seguirá con natación (RPC) y estado vacío */ }

  var gids = [], aids = fichas.map(function (a) { return a.id; }).filter(Boolean);
  fichas.forEach(function (a) { if (a.grupo_id) gids.push(a.grupo_id); });
  if (aids.length) {
    try {
      var rag = await sb.from('atleta_grupos').select('grupo_id').in('atleta_id', aids);
      if (rag && !rag.error && rag.data) rag.data.forEach(function (x) { gids.push(x.grupo_id); });
    } catch (e) {}
  }
  gids = gids.filter(function (v, i) { return v && gids.indexOf(v) === i; });

  var GRUPOS = {};
  if (gids.length) {
    try {
      var rg = await sb.from('grupos').select('id,nombre,seccion,turno').in('id', gids);
      if (rg && !rg.error && rg.data) rg.data.forEach(function (g) {
        if (g.turno && window.APOLANA_GRUPO_NOMBRE) g.nombre = window.APOLANA_GRUPO_NOMBRE(g);
        GRUPOS[g.id] = g;
      });
    } catch (e) {}
  }
  var SEC_ATL = ['competicion','pista','escuela','running','triatlon','montana','marcha'];
  var gCubo = gids.filter(function (id) { return GRUPOS[id] && GRUPOS[id].seccion === 'cubo'; });
  var gAtl  = gids.filter(function (id) { return GRUPOS[id] && SEC_ATL.indexOf(GRUPOS[id].seccion) >= 0; });

  // ---- horarios del Cubo (para mostrar los días) ----
  var cuboHoras = [];
  if (gCubo.length) {
    try {
      var rgh = await sb.from('grupo_horarios').select('grupo_id,dia_semana,hora_inicio,lugar').in('grupo_id', gCubo).eq('activo', true);
      if (rgh && !rgh.error && rgh.data) cuboHoras = rgh.data;
    } catch (e) {}
  }

  // ---- natación (mis franjas y las de mis hijos) ----
  var plazas = [];
  try {
    var rp = await sb.rpc('natacion_mis_plazas');
    if (rp && !rp.error && Array.isArray(rp.data)) plazas = rp.data;
  } catch (e) {}

  // ---- entreno de hoy (sesiones de mis grupos / asignadas a mí) ----
  var entrenoHoy = null;
  try {
    var rs = await sb.from('sesiones').select('id,titulo,hora,lugar,grupo_id,atletas_ids,tipo,papel_dia')
      .eq('publicada', true).eq('fecha', HOY_ISO);
    if (rs && !rs.error && rs.data) {
      var mias = rs.data.filter(function (s) {
        if ((s.papel_dia || s.tipo) === 'descanso') return false;
        var deGrupo = s.grupo_id && gids.indexOf(s.grupo_id) >= 0;
        var paraMi = s.atletas_ids && aids.some(function (id) { return s.atletas_ids.indexOf(id) >= 0; });
        return deGrupo || paraMi;
      });
      if (mias.length) entrenoHoy = mias[0];
    }
  } catch (e) {}

  // ============================================================
  //  RENDER
  // ============================================================
  function resumenHoras(rows) {
    var byHora = {};
    rows.forEach(function (r) { var h = hhmm(r.hora_inicio); (byHora[h] = byHora[h] || []).push(+r.dia_semana); });
    return Object.keys(byHora).sort().map(function (h) {
      var dias = byHora[h].slice().sort(function (a, c) { return a - c; }).map(function (d) { return DIA_CORTO[d] || '?'; }).join(', ');
      return { dd: dias, qq: h };
    });
  }
  function bloque(color, icon, titulo, sub, lineas, acciones) {
    var lin = lineas.map(function (l) {
      return '<div class="lm-linea"><span class="dd">' + esc(l.dd) + '</span><span class="qq">' + esc(l.qq) + '</span></div>';
    }).join('');
    var acc = acciones.map(function (a) {
      return '<a class="lm-btn' + (a.ghost ? ' ghost' : '') + '" href="' + esc(a.href) + '">' + esc(a.txt) + '</a>';
    }).join('');
    return '<div class="lm-bloque" style="--pc:' + color + '">' +
      '<div class="cab"><span class="pin">' + svg(icon) + '</span>' +
        '<span><h2>' + esc(titulo) + '</h2>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</span></div>' +
      (lin ? '<div class="lm-lineas">' + lin + '</div>' : '') +
      (acc ? '<div class="lm-acc">' + acc + '</div>' : '') +
    '</div>';
  }
  function tarjeta(color, icon, titulo, sub, href) {
    return '<a class="lm-tarj" style="--pc:' + color + '" href="' + esc(href) + '">' +
      '<span class="pin">' + svg(icon) + '</span>' +
      '<span class="tx"><b>' + esc(titulo) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' +
      '<span class="chev">' + svg(IC.chev) + '</span></a>';
  }

  var html = '<p class="lm-saludo">' + esc(saludoFecha) + '</p><h1 class="lm-h">Lo mío</h1>';
  var hayAlgo = false;

  // Entreno de hoy, destacado arriba
  if (entrenoHoy) {
    hayAlgo = true;
    var meta = [hhmm(entrenoHoy.hora), entrenoHoy.lugar].filter(Boolean).join(' · ');
    html += '<div class="lm-hoy"><span class="eti">Tu entreno de hoy</span>' +
      '<div class="tit">' + esc(entrenoHoy.titulo || 'Entrenamiento') + '</div>' +
      (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
      '<a class="lm-btn" href="' + b + 'portal/atleta/">Abrir el entrenamiento</a></div>';
  }

  // El Cubo
  if (gCubo.length) {
    hayAlgo = true;
    var nombreCubo = (gCubo.length === 1 && GRUPOS[gCubo[0]]) ? GRUPOS[gCubo[0]].nombre : '';
    /* El Cubo es UN bloque más de «Lo mío», no una app aparte: por eso NO lleva
       un «Abrir El Cubo» que salte a otra zona. Su cuota/baja vivirán en «Más»
       del mismo portal cuando se absorba la zona cubo-atleta (renovación). */
    html += bloque('var(--lm-cubo)', IC.cubo, 'El Cubo', nombreCubo || 'Tus clases de fuerza',
      resumenHoras(cuboHoras),
      [ { txt: 'En el calendario', href: b + 'portal/calendario/', ghost: true } ]);
  }

  // Natación
  if (plazas.length) {
    hayAlgo = true;
    var lineasNat = plazas.slice().sort(function (a, c) { return (Number(a.dia) - Number(c.dia)) || String(a.hora).localeCompare(String(c.hora)); })
      .map(function (p) {
        /* «C1/C2/C3» son calles → «Calle C1». «Vaso» (iniciación, todo el vaso)
           NO es una calle numerada → se muestra tal cual, sin el prefijo. */
        var calleTxt = p.calle
          ? (/^c?\d+$/i.test(String(p.calle).trim()) ? 'Calle ' + p.calle : p.calle)
          : '';
        var q = [hhmm(p.hora), calleTxt, p.nivel].filter(Boolean).join(' · ');
        return { dd: DIA_CORTO[Number(p.dia)] || '?', qq: q };
      });
    html += bloque('var(--lm-natacion)', IC.agua, 'Natación', 'Tus franjas',
      lineasNat,
      [ { txt: 'En el calendario', href: b + 'portal/calendario/', ghost: true } ]);
  }

  // Atletismo (pista, escuela, running, academia…)
  if (gAtl.length) {
    hayAlgo = true;
    var nombresAtl = gAtl.map(function (id) { return GRUPOS[id] && GRUPOS[id].nombre; }).filter(Boolean).join(' · ');
    html += bloque('var(--lm-atletismo)', IC.correr, 'Atletismo', nombresAtl || 'Tu grupo',
      [],
      [ { txt: 'Tu entreno', href: b + 'portal/atleta/' },
        { txt: 'Tus marcas', href: b + 'portal/atleta/#marcas', ghost: true } ]);
  }

  // Accesos siempre útiles
  html += '<div class="lm-rot">Siempre a mano</div>';
  html += tarjeta('var(--lm-tests)', IC.cal, 'Mi calendario', 'Semana y mes de todo lo tuyo', b + 'portal/calendario/');
  if (gAtl.length || plazas.length) {
    html += tarjeta('var(--lm-tests)', IC.diana, 'Mis tests y marcas', 'Apunta tus tiempos y marcas', b + 'portal/tests/');
  }

  // Estado vacío (p. ej. socio sin actividades)
  if (!hayAlgo) {
    html = '<p class="lm-saludo">' + esc(saludoFecha) + '</p><h1 class="lm-h">Lo mío</h1>' +
      '<div class="lm-vacio"><p>De momento no tienes ninguna actividad activa en el club.<br>' +
      'Cuando te apuntes a algo (El Cubo, natación, la escuela…), aquí verás tus clases y horarios.</p>' +
      '<a class="lm-btn" href="' + b + 'portal/calendario/">Ver el calendario del club</a></div>';
  }

  document.getElementById('lm').innerHTML = html;
});
</script>

</body>
</html>
