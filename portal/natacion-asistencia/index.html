<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistencia de natación · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">

<link rel="stylesheet" href="../../assets/css/pasar-lista.css?v=0b79665b">
<script>window.APOLANA_BASE="../../";
  window.APOLANA_MUNDO = { world:'natacion', screen:'asistencia', contentSel:'#na' };</script>
<script src="../../assets/js/supabase.js?v=a02b231d" defer></script>
<script src="../../assets/js/db.js?v=4fd9379b" defer></script>

<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; }
  body { background:var(--crema,#FBF9F4); }
  .na-wrap { max-width:680px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 40px; }
  .na-toast { position:fixed; left:50%; bottom:170px; transform:translate(-50%,14px); opacity:0; transition:.24s;
              background:var(--navy,#26374B); color:#fff; font-size:14px; padding:10px 16px; border-radius:999px; z-index:60; }
  .na-toast.ver { opacity:1; transform:translate(-50%,0); }
  .na-toast.err { background:#B23B3B; }
  /* «Cancelar este día»: al final de la página, lejos del dedo, y con confirmación. */
  .na-zona-cancelar { margin-top:26px; padding:14px 16px; border:1px dashed #D9B38C; border-radius:14px; text-align:center; }
  .na-zona-cancelar p { margin:0 0 8px; font-size:13.5px; color:var(--texto-suave,#6E6656); }
  .na-cancelar { border:1px solid #D9B38C; background:#fff; color:#9A5B23; font:inherit; font-size:14px; font-weight:600; border-radius:10px; padding:10px 16px; min-height:44px; cursor:pointer; }
  .na-cancel { text-align:center; background:#FBEDEA; border:1px solid #E7C3BB; border-radius:14px; padding:26px 18px; margin-top:14px; }
  .na-cancel .nc-ic { font-size:34px; line-height:1; margin-bottom:8px; }
  .na-cancel h2 { margin:0 0 4px; color:#9A3B3B; font-size:18px; }
  .na-cancel p { margin:0 0 16px; color:#7A4A44; }
  .na-reactivar { border:none; background:#26374B; color:#fff; font-size:14px; font-weight:600; border-radius:10px; padding:10px 16px; cursor:pointer; }
  .na-addwrap { margin:2px 2px 0; }
  .na-add { background:none; border:0; color:#2F6FA8; font:inherit; font-weight:600; font-size:14px; cursor:pointer; padding:0 2px; min-height:44px; display:inline-flex; align-items:center; }
  .na-addform { gap:8px; flex-wrap:wrap; margin-top:4px; align-items:center; }
  .na-addform:not([hidden]) { display:flex; }
  .na-addform select { flex:1 1 140px; min-height:44px; border:1px solid var(--linea,#EAE3D5); border-radius:10px; padding:6px 10px; font:inherit; font-size:16px; background:#fff; color:var(--navy,#26374B); }
  .na-add-ok { background:#2F6FA8; color:#fff; border:0; border-radius:10px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; min-height:44px; }
</style>
</head>
<body>

  <div class="na-wrap" id="na"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('na');
  var UI = window.APOLANA_UI;
  var fecha = hoyISO(), FRANJAS = [], INSCR = [], AUS = {}, LISTA = {}, RES = {}, HUE = {}, ACC = [], CANCEL = {cancelado:false};
  var SEL = null;          // franja que se está mirando
  var MARCAS = {};         // ✓ (y ✗ de los que vienen por bono) puestos en este móvil: 'i:<inscripción>' | 'r:<reserva>' → 'si' | 'no'
  // ?tipo=Escuela | Máster (viene de la tarjeta del hub). Sin él, todo.
  var TIPO = new URLSearchParams(location.search).get('tipo');
  if (TIPO !== 'Escuela' && TIPO !== 'Máster') TIPO = null;

  var DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var ORDEN_CALLE = { 'C1':1,'C2':2,'C3':3,'C4':4,'Vaso':9 };
  var COL = ['#2F6FA8','#2E8C86','#B5714A','#6E5AA6','#3F7A4C','#C6892F'];
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function hoyISO(){ return iso(new Date()); }
  function deISO(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function diaDe(s){ return deISO(s).getDay(); }
  function fechaLarga(s){ var d=deISO(s); return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  function moverDia(n){ var d=deISO(fecha); d.setDate(d.getDate()+n); return iso(d); }
  function pl(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
  var DURA_MIN = 60;
  function minDe(h){ var p = String(h||'').split(':'); return (+p[0]||0)*60 + (+p[1]||0); }
  function ahoraMin(){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
  function esHoy(){ return fecha === hoyISO(); }
  function yaPaso(f){ return esHoy() && minDe(f.hora) + DURA_MIN <= ahoraMin(); }
  function enCurso(f){ var now = ahoraMin(); return esHoy() && minDe(f.hora) <= now && now < minDe(f.hora) + DURA_MIN; }
  // La franja que toca: la que está en curso o, si no, la siguiente; si ya pasaron todas, la última.
  function franjaObjetivo(){
    if (!FRANJAS.length) return null;
    if (!esHoy()) return FRANJAS[0];
    var now = ahoraMin();
    var cur = FRANJAS.filter(enCurso);
    if (cur.length) return cur[cur.length-1];
    return FRANJAS.filter(function(f){ return minDe(f.hora) > now; })[0] || FRANJAS[FRANJAS.length-1];
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  // Nombres escritos TODO EN MAYÚSCULAS (vienen así de las fichas) → «Enzo Garrido Ibos»: ocupan menos y se leen mejor.
  function bonito(n){
    n = String(n||'').trim();
    if (!n || n !== n.toUpperCase() || !/[A-ZÁÉÍÓÚÑÜ]/.test(n)) return n;
    return n.toLowerCase().split(/\s+/).map(function(w, i){
      if (i && /^(de|del|la|las|los|y|i)$/.test(w)) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }
  function iniciales(n){ return String(n||'').trim().split(/\s+/).slice(0,2).map(function(x){ return x.charAt(0).toUpperCase(); }).join(''); }
  function color(n){ var h=0; String(n||'').split('').forEach(function(c){ h=(h*31+c.charCodeAt(0))>>>0; }); return COL[h%COL.length]; }
  function nombreCalle(c){ var m=/^C(\d+)$/i.exec(c||''); return m ? 'Calle '+m[1] : (c && c!=='—' ? c : 'Sin calle'); }
  function toast(msg,tipo){ var t=document.createElement('div'); t.className='na-toast'+(tipo==='err'?' err':''); t.textContent=msg;
    document.body.appendChild(t); requestAnimationFrame(function(){ t.classList.add('ver'); });
    setTimeout(function(){ t.classList.remove('ver'); setTimeout(function(){ t.remove(); },260); },2200); }
  // Hora local de una marca de tiempo («10:36»), no la UTC que guarda la base.
  function horaDe(ts){ var d = new Date(ts); return isNaN(d) ? '' : pad(d.getHours())+':'+pad(d.getMinutes()); }
  // «Avisó ayer a las 21:14»
  function cuando(ts){
    if (!ts) return '';
    var d = new Date(ts), hoy = new Date(), ay = new Date(); ay.setDate(ay.getDate()-1);
    var h = pad(d.getHours())+':'+pad(d.getMinutes());
    if (iso(d)===iso(hoy)) return 'hoy a las '+h;
    if (iso(d)===iso(ay)) return 'ayer a las '+h;
    return 'el '+d.getDate()+' de '+MESES[d.getMonth()]+' a las '+h;
  }

  // Los ✓ se guardan en este móvil (en natación lo que queda en la base es quién
  // NO viene, y al guardar, que la lista está pasada).
  function claveMarcas(){ return 'apolana-lista-nat-'+fecha; }
  function leerMarcas(){ try { MARCAS = JSON.parse(localStorage.getItem(claveMarcas()) || '{}') || {}; } catch(e){ MARCAS = {}; } }
  function guardarMarcas(){ try { localStorage.setItem(claveMarcas(), JSON.stringify(MARCAS)); } catch(e){} }

  async function cargar(){
    FRANJAS = []; INSCR = []; AUS = {}; LISTA = {}; RES = {}; HUE = {}; ACC = []; CANCEL = {cancelado:false};
    leerMarcas();
    try { var rc = await sb.rpc('natacion_dia_cancelado', { p_fecha: fecha }); if (rc && !rc.error && rc.data) CANCEL = rc.data; } catch(e){}
    var dia = diaDe(fecha);
    if (dia >= 1 && dia <= 6){
      var f = await sb.from('natacion_franjas').select('id,dia,hora,grupo,monitores').eq('dia', dia).eq('activa', true).order('hora');
      FRANJAS = f.error ? [] : (f.data||[]);
      if (FRANJAS.length){
        var ids = FRANJAS.map(function(x){ return x.id; });
        var i = await sb.from('natacion_inscripciones').select('id,franja_id,acceso_id,nombre,calle,nivel,tipo').in('franja_id', ids).eq('activa', true);
        INSCR = i.error ? [] : (i.data||[]);
        var a = await sb.from('natacion_ausencias').select('acceso_id,franja_id,origen,created_at').eq('fecha', fecha);
        if (!a.error) (a.data||[]).forEach(function(x){ AUS[x.acceso_id+'|'+x.franja_id] = x; });
        // Filtro escuela/adultos: quedarse con las franjas del tipo y, en las
        // mixtas, con los nadadores de ese tipo (nada de escuela en adultos).
        if (TIPO){
          var tf = {}; INSCR.forEach(function(m){ (tf[m.franja_id]=tf[m.franja_id]||{})[m.tipo]=true; });
          FRANJAS = FRANJAS.filter(function(f){
            var byName = TIPO==='Máster' ? /m[aá]ster/i.test(f.grupo||'') : /escuela|perfeccion/i.test(f.grupo||'');
            return byName || (tf[f.id] && !!tf[f.id][TIPO]);
          });
          var idsT = FRANJAS.map(function(x){ return x.id; });
          INSCR = INSCR.filter(function(m){ return m.tipo===TIPO && idsT.indexOf(m.franja_id)!==-1; });
        }
        // Incorporaciones del día (bono/cambio de horario) + huecos por franja.
        // natacion_reservas solo la lee un gestor (RLS); por eso van por RPC
        // SECURITY DEFINER con el mismo permiso que pasar lista (incluye monitor).
        try {
          var rr = await sb.rpc('natacion_reservas_dia', { p_fecha: fecha });
          if (rr && !rr.error && Array.isArray(rr.data)) rr.data.forEach(function(r){ (RES[r.franja_id]=RES[r.franja_id]||[]).push(r); });
        } catch(e){}
        try {
          var rhu = await sb.rpc('natacion_huecos', { p_fecha: fecha });
          if (rhu && !rhu.error && Array.isArray(rhu.data)) rhu.data.forEach(function(h){ HUE[h.franja_id]=h; });
        } catch(e){}
        // Lista de nadadores para «añadir a mano» a quien aparece sin reserva.
        try {
          var rac = await sb.from('natacion_accesos').select('id,nombre').eq('activo', true).order('nombre');
          if (!rac.error) ACC = rac.data || [];
        } catch(e){}
      }
    }
    // Estado de «lista pasada» por franja de este día (quién y cuándo).
    try {
      var rl = await sb.rpc('natacion_lista_dia', { p_fecha: fecha });
      if (rl && !rl.error && Array.isArray(rl.data)) rl.data.forEach(function(x){ LISTA[x.franja_id] = x; });
    } catch(e){}
    if (!SEL || !FRANJAS.some(function(x){ return x.id===SEL; })){ var o = franjaObjetivo(); SEL = o ? o.id : null; }
  }

  function franjaSel(){ return FRANJAS.filter(function(f){ return f.id===SEL; })[0] || null; }
  function ausDe(m){ return m.acceso_id ? AUS[m.acceso_id+'|'+m.franja_id] : null; }
  function esAviso(a){ return !!a && a.origen !== 'monitor'; }   // lo avisó el nadador o su familia

  // Personas de una franja, cada una con su estado: 'si' | 'no' | '' (sin marcar).
  // Si la lista ya se pasó, quien no tiene falta cuenta como que vino.
  function filasDe(f){
    var pasada = !!(LISTA[f.id] && LISTA[f.id].pasada);
    var out = INSCR.filter(function(m){ return m.franja_id===f.id; }).map(function(m){
      var a = ausDe(m), k = 'i:'+m.id;
      return { k:k, tipo:'ins', m:m, nombre:bonito(m.nombre), calle:m.calle||'—', nivel:m.nivel, aus:a,
               est: a ? 'no' : (MARCAS[k] || (pasada ? 'si' : '')) };
    });
    (RES[f.id]||[]).forEach(function(r){
      var k = 'r:'+r.id;
      out.push({ k:k, tipo:'res', r:r, nombre:bonito(r.nombre), calle:r.calle||'—', est: MARCAS[k] || (pasada ? 'si' : '') });
    });
    return out;
  }
  function cuentas(filas){
    var c = { si:0, no:0, sin:0, av:0, tot:filas.length };
    filas.forEach(function(x){ if (x.est==='si') c.si++; else if (x.est==='no') c.no++; else c.sin++; if (esAviso(x.aus)) c.av++; });
    return c;
  }

  function pintar(){
    var dia = diaDe(fecha);
    var cab =
      '<h1 class="pl-tit">Pasar lista</h1>'+
      '<div class="pl-modo" role="tablist">'+
        [['','Todos'],['Escuela','Escuela'],['Máster','Adultos']].map(function(t){
          return '<button type="button" class="'+(((TIPO||'')===t[0])?'on':'')+'" data-tipo="'+esc(t[0])+'">'+esc(t[1])+'</button>';
        }).join('')+
      '</div>'+
      '<div class="pl-fecha">'+
        '<button type="button" data-dia="-1" aria-label="Día anterior">‹</button>'+
        '<label class="dia">'+(esHoy()?'Hoy · ':'')+esc(fechaLarga(fecha).toLowerCase())+
          '<input type="date" id="na-fecha" value="'+esc(fecha)+'" aria-label="Elegir día"></label>'+
        '<button type="button" data-dia="1" aria-label="Día siguiente">›</button>'+
      '</div>';

    if (CANCEL && CANCEL.cancelado){
      wrap.innerHTML = cab + '<div class="na-cancel"><div class="nc-ic">🚫</div><h2>Natación cancelada este día</h2>'+
        '<p>'+esc(CANCEL.motivo||'Festivo')+'</p><button type="button" class="na-reactivar" id="na-reactivar">Reactivar este día</button></div>';
      return;
    }
    if (dia === 0){ wrap.innerHTML = cab + '<p class="pl-vacio">El domingo no hay natación.</p>'; return; }
    if (!FRANJAS.length){ wrap.innerHTML = cab + '<p class="pl-vacio">No hay franjas de natación este día. (Si no ves nada y deberías, quizá no tienes permiso.)</p>'; return; }

    var chips = '<div class="pl-chips" id="na-chips">'+FRANJAS.map(function(f){
      var L = LISTA[f.id], n = INSCR.filter(function(m){ return m.franja_id===f.id; }).length + (RES[f.id]||[]).length;
      var tag = enCurso(f) ? ' <span class="pl-tag">Ahora</span>'
              : (L && L.pasada) ? ' <span class="pl-tag ok">✓</span>'
              : yaPaso(f) ? ' <span class="pl-tag pend">Sin pasar</span>' : '';
      if (enCurso(f) && L && L.pasada) tag += ' <span class="pl-tag ok">✓</span>';
      return '<button type="button" class="pl-chip'+(f.id===SEL?' on':'')+'" data-f="'+esc(f.id)+'">'+
        '<div class="h">'+esc(String(f.hora).slice(0,5))+tag+'</div>'+
        '<div class="s">'+esc(f.grupo||'')+' · '+((L && L.pasada) ? 'lista pasada' : pl(n,'nadador','nadadores'))+'</div></button>';
    }).join('')+'</div>';

    var f = franjaSel();
    var filas = filasDe(f), c = cuentas(filas), L = LISTA[f.id];
    var hue = HUE[f.id] ? HUE[f.id].huecos : null, nres = (RES[f.id]||[]).length;
    var sub = pl(filas.length - nres,'nadador','nadadores')+(nres?' · +'+nres+' por bono':'')+
              (hue!=null ? ' · '+(hue>0 ? pl(hue,'hueco','huecos') : 'completo') : '')+(f.monitores?' · '+esc(f.monitores):'');
    var pct = c.tot ? Math.round((c.si+c.no)/c.tot*100) : 0;
    var resumen =
      '<div class="pl-res">'+
        '<div class="cab"><b>'+esc(String(f.hora).slice(0,5))+' · '+esc(f.grupo||'')+'</b><small>'+sub+'</small></div>'+
        '<div class="cuerpo">'+
          '<div class="pl-anillo" style="--p:'+pct+'"><i>'+(c.si+c.no)+'/'+c.tot+'</i></div>'+
          '<div class="pl-cifras">'+
            '<div class="pl-c-ok"><b>'+c.si+'</b>'+(c.si===1?'viene':'vienen')+'</div>'+
            '<div class="pl-c-ko"><b>'+c.no+'</b>no '+(c.no===1?'viene':'vienen')+'</div>'+
            '<div class="pl-c-av"><b>'+c.av+'</b>'+(c.av===1?'avisó':'avisaron')+'</div>'+
            '<div class="pl-c-az"><b>'+c.sin+'</b>sin marcar</div>'+
          '</div>'+
        '</div>'+
        (L && L.pasada ? '<div class="pl-pasada">✓ Lista pasada'+(L.pasada_por?' por '+esc(L.pasada_por):'')+(L.pasada_en?' · '+esc(horaDe(L.pasada_en)):'')+'. Si cambias algo, vuelve a guardar.</div>' : '')+
        '<div class="pl-todos">'+
          '<button type="button" class="pl-b-ok" id="na-resto"'+(c.sin?'':' disabled')+'>✓ El resto, vienen</button>'+
          '<button type="button" class="pl-b-lim" id="na-borrar">Borrar marcas</button>'+
        '</div>'+
      '</div>';

    // Bloques por calle
    var porCalle = {};
    filas.forEach(function(x){ (porCalle[x.calle]=porCalle[x.calle]||[]).push(x); });
    var calles = Object.keys(porCalle).sort(function(a,b){ return (ORDEN_CALLE[a]||9)-(ORDEN_CALLE[b]||9) || (a<b?-1:1); });
    var bloques = calles.map(function(cl){
      var lst = porCalle[cl].sort(function(a,b){ return (a.nombre||'').toLowerCase() < (b.nombre||'').toLowerCase() ? -1 : 1; });
      var bono = lst.filter(function(x){ return x.tipo==='res'; }).length;
      return '<div class="pl-blq"><div class="cab"><b>'+esc(nombreCalle(cl))+'</b><span>'+pl(lst.length-bono,'nadador','nadadores')+(bono?' · +'+bono+' bono':'')+'</span></div>'+
        lst.map(filaHTML).join('')+'</div>';
    }).join('') || '<p class="pl-vacio">Nadie apuntado a esta franja.</p>';

    var accOpts = ACC.map(function(a){ return '<option value="'+esc(a.id)+'">'+esc(a.nombre)+'</option>'; }).join('');
    var calleOpts = Object.keys(ORDEN_CALLE).map(function(cc){ return '<option value="'+esc(cc)+'">'+esc(nombreCalle(cc))+'</option>'; }).join('');
    var anadir =
      '<div class="na-addwrap">'+
        '<button type="button" class="na-add" id="na-add">+ Añadir a alguien que ha venido</button>'+
        '<div class="na-addform" id="na-addform" hidden>'+
          '<select class="na-add-who"><option value="">— ¿quién? —</option>'+accOpts+'</select>'+
          '<select class="na-add-calle"><option value="">Calle…</option>'+calleOpts+'</select>'+
          '<button type="button" class="na-add-ok" id="na-add-ok">Añadir</button>'+
        '</div>'+
      '</div>';

    var pie =
      '<div class="pl-pie"><div class="txt">'+
        (c.sin ? '<b>'+c.sin+'</b> sin marcar · '+c.si+' '+(c.si===1?'viene':'vienen')+' · '+c.no+' no' : '<b>Todo marcado</b> · '+c.si+' '+(c.si===1?'viene':'vienen')+' · '+c.no+' no')+
      '</div><button type="button" id="na-guardar"'+(c.tot?'':' disabled')+'>'+(L && L.pasada ? 'Guardar otra vez' : 'Guardar lista')+'</button></div>';

    var cancelar = (dia>=1 && dia<=6)
      ? '<div class="na-zona-cancelar"><p>¿Este día no hay natación (festivo, cierre de la piscina…)?</p>'+
          '<button type="button" class="na-cancelar" id="na-cancelar">Cancelar este día…</button></div>' : '';

    var chipsAntes = wrap.querySelector('#na-chips'), scrollChips = chipsAntes ? chipsAntes.scrollLeft : null;
    wrap.innerHTML = cab + chips + resumen + bloques + anadir + pie + cancelar;
    // La fila de franjas: dejar a la vista la elegida (o donde estaba, si solo se repinta).
    var fila = wrap.querySelector('#na-chips'), on = fila && fila.querySelector('.pl-chip.on');
    if (fila){
      if (scrollChips != null) fila.scrollLeft = scrollChips;
      else if (on) fila.scrollLeft = Math.max(0, on.offsetLeft - (parseFloat(getComputedStyle(fila).paddingLeft)||0));
    }
  }

  function filaHTML(x){
    var pills = '', extra = '', meta = '';
    if (x.tipo==='res'){
      meta = '<span class="pl-pill pl-p-rec">★ Por bono</span>';
    } else {
      meta = x.nivel ? esc(x.nivel) : '';
      if (!x.m.acceso_id) pills += ' <span class="pl-pill pl-p-gris">Ficha sin enlazar</span>';
      if (esAviso(x.aus)){
        pills += ' <span class="pl-pill pl-p-av">🔔 '+(x.aus.origen==='familia'?'Avisó la familia':'Avisó')+'</span>';
        extra = '<div class="pl-aviso-txt">'+(x.aus.origen==='familia'?'La familia avisó ':'Avisó ')+esc(cuando(x.aus.created_at))+'</div>';
      }
    }
    var cls = 'pl-fila '+(x.est==='si'?'si':x.est==='no'?'no':'sin')+(esAviso(x.aus)?' aviso':'');
    var botones = (x.tipo==='ins' && !x.m.acceso_id)
      ? '<button type="button" class="pl-enlazar" data-enlazar="'+esc(x.m.id)+'">Enlazar</button>'
      : '<div class="pl-est"><button type="button" class="si" data-k="'+esc(x.k)+'" data-v="si" aria-label="Viene">✓</button>'+
        '<button type="button" class="no" data-k="'+esc(x.k)+'" data-v="no" aria-label="No viene">✗</button></div>';
    return '<div class="'+cls+'" data-fila="'+esc(x.k)+'">'+
      '<div class="pl-av" style="background:'+color(x.nombre)+'">'+esc(iniciales(x.nombre))+'</div>'+
      '<div class="pl-info"><div class="n">'+esc(x.nombre)+'</div>'+
        ((meta||pills) ? '<div class="m">'+meta+pills+'</div>' : '')+extra+'</div>'+
      botones+'</div>';
  }

  function buscar(k){ var f = franjaSel(); return f ? filasDe(f).filter(function(x){ return x.k===k; })[0] : null; }

  // Marcar ✓ / ✗. Tocar el que ya está puesto lo quita. Las faltas se guardan al
  // momento (como hasta ahora); los ✓ son de este móvil hasta «Guardar lista».
  async function marcar(k, v, filaEl){
    var x = buscar(k); if (!x) return;
    if (x.tipo==='res'){ if (MARCAS[k]===v) delete MARCAS[k]; else MARCAS[k]=v; guardarMarcas(); pintar(); return; }
    var m = x.m;
    if (filaEl) filaEl.setAttribute('aria-busy','true');
    try {
      if (v==='si'){
        if (x.aus){
          var rd = await sb.from('natacion_ausencias').delete().eq('acceso_id', m.acceso_id).eq('franja_id', m.franja_id).eq('fecha', fecha);
          if (rd.error){ toast('No se pudo guardar','err'); return; }
          delete AUS[m.acceso_id+'|'+m.franja_id];
          MARCAS[k] = 'si';
        } else if (MARCAS[k]==='si') delete MARCAS[k];
        else MARCAS[k] = 'si';
      } else {
        if (x.aus){
          var rd2 = await sb.from('natacion_ausencias').delete().eq('acceso_id', m.acceso_id).eq('franja_id', m.franja_id).eq('fecha', fecha);
          if (rd2.error){ toast('No se pudo guardar','err'); return; }
          delete AUS[m.acceso_id+'|'+m.franja_id];
        } else {
          var ru = await sb.from('natacion_ausencias').upsert(
            { acceso_id:m.acceso_id, franja_id:m.franja_id, fecha:fecha, origen:'monitor' },
            { onConflict:'acceso_id,franja_id,fecha' });
          if (ru.error){ toast('No se pudo guardar: '+ru.error.message,'err'); return; }
          AUS[m.acceso_id+'|'+m.franja_id] = { acceso_id:m.acceso_id, franja_id:m.franja_id, origen:'monitor', created_at:new Date().toISOString() };
          delete MARCAS[k];
        }
      }
      guardarMarcas();
    } finally { pintar(); }
  }

  function restoVienen(){
    var f = franjaSel(); if (!f) return;
    filasDe(f).forEach(function(x){ if (!x.est && !(x.tipo==='ins' && !x.m.acceso_id)) MARCAS[x.k] = 'si'; });
    guardarMarcas(); pintar();
  }

  async function borrarMarcas(){
    var f = franjaSel(); if (!f) return;
    if (!window.confirm('¿Borrar las marcas de esta franja?\n\nLos avisos de los nadadores («no voy») se quedan.')) return;
    filasDe(f).forEach(function(x){ delete MARCAS[x.k]; });
    guardarMarcas();
    var rd = await sb.from('natacion_ausencias').delete().eq('franja_id', f.id).eq('fecha', fecha).eq('origen', 'monitor');
    if (rd.error) toast('No se pudieron quitar las faltas','err');
    await pintarTodo();
  }

  async function guardar(){
    var f = franjaSel(); if (!f) return;
    var c = cuentas(filasDe(f));
    if (c.sin && !window.confirm('Quedan '+pl(c.sin,'persona','personas')+' sin marcar: cuentan como que han venido.\n\n¿Guardar la lista?')) return;
    var btn = document.getElementById('na-guardar'); if (btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
    var r = await sb.rpc('natacion_pasar_lista', { p_franja: f.id, p_fecha: fecha, p_todos_presentes: (c.no===0), p_no_vienen: c.no });
    if (r.error || (r.data && r.data.ok === false)){ toast((r.error && r.error.message) || (r.data && r.data.motivo) || 'No se pudo pasar lista', 'err'); pintar(); return; }
    LISTA[f.id] = { franja_id: f.id, pasada: true, pasada_por: (r.data && r.data.pasada_por) || '', pasada_en: (r.data && r.data.pasada_en) || null, todos_presentes: (c.no===0), no_vienen: c.no };
    toast(c.no ? 'Lista guardada ✓ · '+pl(c.no,'no vino','no vinieron') : 'Lista guardada ✓ · todos presentes');
    pintar();
  }

  async function addManual(){
    var form = document.getElementById('na-addform'), f = franjaSel(); if (!form || !f) return;
    var who = form.querySelector('.na-add-who'), calle = form.querySelector('.na-add-calle');
    var accId = who && who.value;
    if (!accId){ toast('Elige a quién añadir', 'err'); return; }
    var r = await sb.rpc('natacion_incorporar_manual', { p_franja: f.id, p_fecha: fecha, p_acceso_id: accId, p_calle: (calle && calle.value) || null });
    if (r.error || (r.data && r.data.ok === false)){ toast((r.data && r.data.msg) || (r.error && r.error.message) || 'No se pudo añadir', 'err'); return; }
    toast((r.data && r.data.msg) || 'Añadido ✓');
    await pintarTodo();
  }

  async function enlazar(id){
    var m = INSCR.filter(function(x){ return x.id===id; })[0]; if (!m) return;
    var ok = window.confirm('La ficha de ' + (m.nombre || 'esta persona') + ' no está enlazada (sin código de acceso), por eso no se le puede marcar falta. ¿La enlazo ahora?');
    if (!ok) return;
    var r = await sb.rpc('natacion_enlazar_ficha', { p_inscripcion: m.id });
    if (r.error || (r.data && r.data.ok === false)){ toast((r.data && r.data.msg) || 'No se pudo enlazar', 'err'); return; }
    toast('Ficha enlazada ✓'); await pintarTodo();
  }

  async function pintarTodo(){
    if (UI && !wrap.innerHTML) wrap.innerHTML = '<div class="ap-esq" data-esq="filas:4"></div>';
    await cargar();
    pintar();
  }
  function cambiarFecha(nueva){ fecha = nueva || hoyISO(); SEL = null; wrap.innerHTML = UI ? '<div class="ap-esq" data-esq="filas:4"></div>' : ''; pintarTodo(); }

  async function cancelarDia(){
    if (!window.confirm('¿Cancelar la natación del '+fechaLarga(fecha).toLowerCase()+'?\n\nSe cancelan todas las franjas de ese día. Se puede reactivar después.')) return;
    var motivo = window.prompt('Motivo de la cancelación (se verá ese día):', 'Festivo');
    if (motivo === null) return;
    var r = await sb.rpc('natacion_cancelar_dia', { p_fecha: fecha, p_motivo: motivo || 'Festivo' });
    if (r.error || (r.data && r.data.ok === false)){ toast((r.data && r.data.msg) || 'No se pudo cancelar', 'err'); return; }
    toast('Día cancelado'); pintarTodo();
  }
  async function reactivarDia(){
    var r = await sb.rpc('natacion_reactivar_dia', { p_fecha: fecha });
    if (r.error || (r.data && r.data.ok === false)){ toast((r.data && r.data.msg) || 'No se pudo reactivar', 'err'); return; }
    toast('Día reactivado'); pintarTodo();
  }

  wrap.addEventListener('click', function(ev){
    var t = ev.target.closest ? ev.target : null; if (!t) return;
    var tp = t.closest('.pl-modo [data-tipo]');
    if (tp){ TIPO = tp.getAttribute('data-tipo') || null; SEL = null; cambiarFecha(fecha); return; }
    var dd = t.closest('[data-dia]');
    if (dd){ cambiarFecha(moverDia(+dd.getAttribute('data-dia'))); return; }
    var ch = t.closest('.pl-chip[data-f]');
    if (ch){ SEL = ch.getAttribute('data-f'); pintar(); return; }
    var bt = t.closest('.pl-est button[data-k]');
    if (bt){ marcar(bt.getAttribute('data-k'), bt.getAttribute('data-v'), bt.closest('.pl-fila')); return; }
    var en = t.closest('[data-enlazar]');
    if (en){ enlazar(en.getAttribute('data-enlazar')); return; }
    if (t.closest('#na-resto')){ restoVienen(); return; }
    if (t.closest('#na-borrar')){ borrarMarcas(); return; }
    if (t.closest('#na-guardar')){ guardar(); return; }
    if (t.closest('#na-add')){ var fm = document.getElementById('na-addform'); if (fm) fm.hidden = !fm.hidden; return; }
    if (t.closest('#na-add-ok')){ addManual(); return; }
    if (t.closest('#na-cancelar')){ cancelarDia(); return; }
    if (t.closest('#na-reactivar')){ reactivarDia(); return; }
  });
  wrap.addEventListener('change', function(ev){
    if (ev.target && ev.target.id==='na-fecha'){ cambiarFecha(ev.target.value); }
  });

  pintarTodo();
});
</script>
</body>
</html>
