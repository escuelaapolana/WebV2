<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Pasar lista (entrenador)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<style>
  /* MAQUETA · Pasar lista: por defecto todos presentes, tocas quien falta.
     Presente (verde) → Falta (rojo) → Justificada (ámbar) → Presente. */
  :root {
    --ap-titulo: 'Bricolage Grotesque', system-ui, sans-serif;
    --dato: var(--fuente-dato, 'IBM Plex Mono', monospace);
    --s1: 0 1px 2px rgba(30,45,65,.07), 0 14px 30px -13px rgba(30,45,65,.30);
    --s2: 0 2px 6px rgba(30,45,65,.10), 0 28px 50px -18px rgba(30,45,65,.42);
    --curva: cubic-bezier(.2,.7,.2,1);
  }
  body { background: var(--crema, #FBF9F4); margin: 0; }

  .ap-top { position: sticky; top: 0; z-index: 40; color: #fff;
    background: linear-gradient(180deg,#2E4258,#25354A);
    box-shadow: 0 3px 14px rgba(20,30,42,.20); border-bottom: 1px solid rgba(255,255,255,.06); }
  .ap-top__acc { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .ap-top .ir-web { display: inline-flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 7px 13px; transition: background .15s ease; }
  .ap-top .ir-web:hover { background: rgba(255,255,255,.18); }
  .ap-top .ir-web svg { width: 15px; height: 15px; }
  .ap-top__in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 11px clamp(14px,4vw,28px); min-height: 54px; box-sizing: border-box; }
  .ap-top .volver { display: inline-flex; align-items: center; gap: 7px; color: #fff; text-decoration: none; font-size: 14.5px; font-weight: 600; }
  .ap-top .volver svg { width: 18px; height: 18px; }
  .ap-top .paso { font-size: 13px; color: rgba(255,255,255,.7); }

  .ap-wrap { max-width: 720px; margin: 0 auto; padding: clamp(18px,4vw,26px) clamp(14px,4vw,28px) 100px; }
  .cab h1 { font-family: var(--ap-titulo); font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; font-size: clamp(26px,5vw,36px); color: var(--navy,#26374B); margin: 4px 0 10px; }
  .sesion { display: flex; flex-wrap: wrap; gap: 7px; }
  .sesion span { font-size: 13px; color: var(--texto-suave,#6E6656); background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 5px 12px; box-shadow: var(--s1); }

  .grupos { display: flex; gap: 8px; margin: 16px 0 4px; flex-wrap: wrap; }
  .grupos button { font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 8px 16px; color: var(--texto-suave,#6E6656); box-shadow: var(--s1); }
  .grupos button.sel { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }

  .barra { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 12px; flex-wrap: wrap; }
  .barra .cuenta { font-size: 14px; color: var(--texto-suave,#6E6656); }
  .barra .cuenta b { font-family: var(--dato); color: var(--navy,#26374B); font-size: 16px; }
  .barra .todos { font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 9px 15px; color: var(--azul-oscuro,#2F6FA8); box-shadow: var(--s1); }

  .lista { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 18px; box-shadow: var(--s1); overflow: hidden; }
  .at { display: flex; align-items: center; gap: 13px; padding: 12px 15px; border-bottom: 1px solid var(--linea,#EDE6D7); }
  .at:last-child { border-bottom: 0; }
  .at .av { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 50%; background: linear-gradient(135deg,#3B85C0,#2E4256); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .at .nom { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--navy,#26374B); }
  .estado { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    font-size: 13px; font-weight: 700; border-radius: 999px; padding: 7px 14px; border: 1px solid transparent; min-width: 104px; justify-content: center; }
  .estado svg { width: 15px; height: 15px; }
  .estado.presente { background: #EAF3E3; color: #4E8A3E; }
  .estado.falta    { background: #F7E7E2; color: #B0563A; }
  .estado.justif   { background: #F4EAD6; color: #8A5307; }

  .pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-top: 1px solid var(--linea-marcada,#E4DCCB); }
  .pie__in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px clamp(14px,4vw,28px); }
  .pie .prog { flex: 1; font-size: 13px; color: var(--texto-suave,#6E6656); }
  .pie .prog b { color: var(--navy,#26374B); }
  .pie .ok { color: #4E8A3E; font-weight: 600; }
  .pie button { background: var(--navy,#26374B); color: #fff; border: 0; border-radius: 999px; padding: 12px 26px; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 46px; }

  .nota-maqueta { margin: 26px 0 0; text-align: center; font-size: 12.5px; color: var(--texto-tenue,#9A927F); }
  .nota-maqueta a { color: var(--azul-oscuro,#2F6FA8); font-weight: 600; }
</style>
</head>
<body>

<header class="ap-top">
  <div class="ap-top__in">
    <a class="volver" href="../_maqueta-entrenador/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg> Volver</a>
    <div class="ap-top__acc">
      <span class="paso">Se guarda solo ✓</span>
      <a class="ir-web" href="../../" title="Ir a la web del club"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg> Web</a>
    </div>
  </div>
</header>

<main class="ap-wrap">
  <div class="cab"><h1>Pasar lista</h1></div>
  <div class="sesion"><span>Jueves 19 · 18:30</span><span>Estadio Joaquín Villar</span></div>

  <div class="grupos">
    <button type="button" class="sel">Velocidad</button>
    <button type="button">Fondo-Mediofondo</button>
  </div>

  <div class="barra">
    <span class="cuenta"><b id="np">8</b> de 8 presentes</span>
    <button type="button" class="todos" onclick="todosPresentes()">Todos presentes</button>
  </div>

  <section class="lista" id="lista">
    <div class="at"><span class="av">JP</span><span class="nom">Juan Pérez</span><span class="estado presente" onclick="ciclo(this)"></span></div>
    <div class="at"><span class="av">ML</span><span class="nom">María López</span><span class="estado presente" onclick="ciclo(this)"></span></div>
    <div class="at"><span class="av">CR</span><span class="nom">Carlos Ruiz</span><span class="estado falta" onclick="ciclo(this)"></span></div>
    <div class="at"><span class="av">AG</span><span class="nom">Ana Gómez</span><span class="estado presente" onclick="ciclo(this)"></span></div>
    <div class="at"><span class="av">DM</span><span class="nom">Diego Martín</span><span class="estado justif" onclick="ciclo(this)"></span></div>
    <div class="at"><span class="av">LS</span><span class="nom">Lucía Sánchez</span><span class="estado presente" onclick="ciclo(this)"></span></div>
    <div class="at"><span class="av">PT</span><span class="nom">Pablo Torres</span><span class="estado presente" onclick="ciclo(this)"></span></div>
    <div class="at"><span class="av">SD</span><span class="nom">Sara Díaz</span><span class="estado presente" onclick="ciclo(this)"></span></div>
  </section>

  <p class="nota-maqueta">Maqueta con datos de ejemplo · <a href="../_maqueta-entrenador/">Zona de entrenador</a></p>
</main>

<div class="pie">
  <div class="pie__in">
    <span class="prog"><span class="ok">✓ Se guarda solo</span> · <b id="np2">8</b> presentes</span>
    <button type="button">Terminar</button>
  </div>
</div>

<script>
  var ICO = {
    presente: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg> Presente',
    falta:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg> Falta',
    justif:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg> Justif.'
  };
  var ORDEN = ['presente','falta','justif'];
  function pinta(el){ var e = el.classList.contains('falta')?'falta':el.classList.contains('justif')?'justif':'presente'; el.innerHTML = ICO[e]; }
  function ciclo(el){
    var e = el.classList.contains('falta')?'falta':el.classList.contains('justif')?'justif':'presente';
    var sig = ORDEN[(ORDEN.indexOf(e)+1)%3];
    el.className = 'estado ' + sig; pinta(el); contar();
  }
  function todosPresentes(){ Array.prototype.forEach.call(document.querySelectorAll('.estado'), function(el){ el.className='estado presente'; pinta(el); }); contar(); }
  function contar(){ var n = document.querySelectorAll('.estado.presente').length; document.getElementById('np').textContent=n; document.getElementById('np2').textContent=n; }
  Array.prototype.forEach.call(document.querySelectorAll('.estado'), pinta);
  contar();
</script>

</body>
</html>
