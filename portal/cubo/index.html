<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Cubo · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<!-- Cómo se paga (cuenta y contacto salen de la base) y el pago con tarjeta -->
<script src="../../assets/js/info-pagos.js" defer></script>
<script src="../../assets/js/pago-tarjeta.js" defer></script>
<style>
  body { background: var(--crema); }

  .cubo-wrap { max-width: 480px; margin: 0 auto; padding: 14px 0 40px; }
  /* La banda navy del pago hecho llega hasta arriba: es lo primero
     que se lee, no una tarjeta con aire alrededor. */
  .cubo-wrap.al-borde { padding-top: 0; }

  /* ---- cabecera ---- */
  .cab { padding: 10px 20px 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .cab .rotulo { font-size:13px; color: var(--texto-suave); }
  /* «El Cubo» es un nombre propio del club: va en ámbar y solo en texto (carácter 31a). */
  .cab .titulo-cubo { font-family: var(--fuente-titulo); font-weight: 700; font-size:28px; text-transform: uppercase; color: #8A5307; line-height: 1; }
  /* El relleno y el margen negativo se compensan: el enlace se ve donde
     estaba, pero la zona que responde al dedo mide 44 px. */
  .cab a, .cab button.enlace { font-size:14px; color: var(--azul-oscuro); font-weight: 600; text-decoration: none;
                               background: none; border: 0; padding: 14px 6px; margin: -14px -6px;
                               cursor: pointer; font-family: inherit; }
  .cab a:focus-visible, .cab button.enlace:focus-visible { outline: 2px solid var(--azul-filete);
                               outline-offset: 0; border-radius:10px; }

  /* ---- tarjeta del bono (pantalla de clases) ---- */
  /* La cifra manda y se dice UNA vez: antes salía el número arriba («Te
     quedan 3») y otra vez en grande al lado. Debajo, cuándo caducan. Y la
     norma de las 3 horas va aquí, pegada al número, no escondida en un
     desplegable: es la que explica por qué el número baja. */
  /* Tarjeta del bono en degradado morado (aubergine), como la maqueta de El Cubo */
  .bono-tira { margin: 0 16px; border-radius:16px; padding: 16px; box-shadow: 0 18px 40px -18px rgba(58,49,85,.6);
    background: radial-gradient(120% 140% at 88% -20%, rgba(150,120,195,.45), transparent 55%), linear-gradient(155deg, #322A48, #473C66);
               display: flex; align-items: flex-start; gap: 16px; }
  .bono-tira .col { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .bono-tira .eti { font-size:13px; color: rgba(255,255,255,.75); }
  /* Nombre propio sobre navy: el ámbar claro del sistema. */
  .marca { color: #E0A33C; }
  .bono-tira .txt { font-size:14px; color: #fff; }
  .bono-tira .cifra { font-family: var(--fuente-dato); font-weight: 700; font-size:44px; color: #fff; line-height: .95; flex: 0 0 auto; }
  .bono-tira .norma { font-size:13px; line-height:1.45; color: rgba(255,255,255,.75); margin-top: 6px; }

  /* ---- pestañas ---- */
  .pestanas { padding: 16px 20px 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  /* Se pulsan con el pulgar y de pie: 44 px de alto como todo lo pulsable. */
  .pestanas button { display: inline-flex; align-items: center; min-height: 44px; box-sizing: border-box;
                     padding: 7px 15px; border-radius: 999px; background: #fff; border: 1px solid #E4DCCB;
                     color: var(--texto); font-size:13px; cursor: pointer; font-family: inherit; }
  .pestanas button[aria-selected="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ---- tarjetas de clase ---- */
  .clases-lista { padding: 6px 16px; display: flex; flex-direction: column; gap: 10px; }
  .clase-t { background: #fff; border: 1px solid var(--crema-media); border-radius:14px; padding: 14px 16px; box-shadow: 0 4px 10px rgba(30,45,65,.10), 0 16px 32px -8px rgba(30,45,65,.34);
             display: flex; flex-direction: column; gap: 8px; }
  .clase-t.mia { background: #EDF7E4; border-color: #C3E39B; }
  .clase-t.completa { opacity: .75; }
  .clase-t .arriba { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  /* Lista corta de horario: cifras de ancho fijo, sin aire de cronómetro (fundamentos 28c). */
  .clase-t .hora { font-size:13px; font-variant-numeric: tabular-nums; color: var(--navy); }
  .clase-t.mia .hora { color: #4C7A28; }
  .clase-t.completa .hora { color: var(--texto-suave); }
  .clase-t .estado { font-size:13px; color: var(--texto-suave); }
  .clase-t .estado.si { color: #4C7A28; }
  .clase-t .estado.no { color: #8A5307; }
  .clase-t .nombre { font-size:16px; font-weight: 600; color: var(--navy); }
  .clase-t .quien { font-size:13px; color: var(--texto); }
  .clase-t .notas { font-size:13px; color: var(--texto-suave); }

  .accion { display: flex; align-items: center; justify-content: center; min-height: 44px; box-sizing: border-box;
            text-align: center; padding: 10px 16px; border-radius: 999px; font-size:14px; font-weight: 600;
            border: 1px solid transparent; cursor: pointer; font-family: inherit; width: 100%; }
  .accion--apuntar { background: var(--azul); color: #fff; }
  .accion--quitar  { background: transparent; border-color: #A8453F; color: #A8453F; }
  .accion--espera  { background: transparent; border-color: var(--linea-borde); color: var(--texto); font-weight: 400; }
  .accion[disabled] { opacity: .6; cursor: default; }

  /* ---- nota de reglas, plegada ----
     Cómo funciona el bono se lee una vez y luego estorba todos los días.
     El texto sigue entero: solo se pliega, con un título que dice qué hay. */
  .plegable { margin: 16px 16px 0; background: var(--crema-banda); border: 1px solid #E4DCCB;
              border-radius:10px; overflow: hidden; }
  .plegable > summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 44px;
                        box-sizing: border-box; padding: 10px 14px; cursor: pointer;
                        font-size:14px; font-weight: 600; color: var(--navy); }
  .plegable > summary::-webkit-details-marker { display: none; }
  .plegable > summary::marker { content: ""; }
  .plegable > summary:focus-visible { outline: 2px solid var(--azul-filete); outline-offset: -2px; }
  /* La flecha del sistema: cuadrado girado, como en «Cómo se paga» */
  .plegable .fl { flex: none; margin-left: auto; width: 9px; height: 9px; margin-right: 4px;
                  border-right: 2px solid var(--texto-suave); border-bottom: 2px solid var(--texto-suave);
                  transform: rotate(45deg); transition: transform .15s; }
  .plegable[open] .fl { transform: rotate(-135deg); }
  .plegable .cuerpo { padding: 0 14px 13px; font-size:13px; color: #6E6656; line-height: 1.45; }

  /* ---- pantalla del bono ---- */
  .bono-caja { margin: 0 16px; border-radius:16px; padding: 22px 24px; box-shadow: 0 18px 40px -18px rgba(58,49,85,.6);
    background: radial-gradient(120% 140% at 88% -20%, rgba(150,120,195,.45), transparent 55%), linear-gradient(155deg, #322A48, #473C66);
               display: flex; flex-direction: column; gap: 14px; }
  .bono-caja .eti { font-size:13px; color: rgba(255,255,255,.7); }
  .bono-caja .fila-cifra { display: flex; align-items: baseline; gap: 10px; }
  .bono-caja .cifra { font-family: var(--fuente-dato); font-weight: 700; font-size:52px; color: #fff; line-height: .9; }
  .bono-caja .cifra-txt { font-size:16px; color: rgba(255,255,255,.75); }
  .puntos { display: flex; gap: 3px; }
  .puntos span { flex: 1; height: 6px; border-radius:10px; background: rgba(255,255,255,.25); }
  .puntos span.on { background: #7FBF4A; }
  .bono-caja .pie-bono { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .bono-caja .pie-bono span { font-size:13px; color: rgba(255,255,255,.7); }

  .cab-sec { padding: 18px 20px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .cab-sec .eti { font-size:13px; color: var(--texto-suave); }
  /* «Ver todos» y «Ayuda» también se pulsan: 44 px, compensados con margen
     negativo para que se sigan viendo donde estaban. */
  .cab-sec button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; margin: -11px -6px;
                    font-size:13px; color: var(--azul-oscuro); background: none; border: 0; cursor: pointer; font-family: inherit; }

  .movs { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .mov { background: #fff; border: 1px solid var(--crema-media); border-radius:12px; padding: 13px 15px; box-shadow: 0 3px 8px rgba(30,45,65,.09), 0 12px 22px -6px rgba(30,45,65,.26);
         display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .mov .con { font-size:15px; color: var(--navy); }
  .mov .cuando { font-size:13px; color: var(--texto-suave); }
  /* Usos que entran y salen del bono: cifra que se compara, en mono. */
  .mov .n { font-family: var(--fuente-dato); font-size:13px; color: var(--navy); }
  .mov .n.mas { color: #3F7A4C; }

  /* ---- botones grandes, compartidos por las pantallas de compra ---- */
  .btn-grande { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px;
                padding: 14px 22px; box-sizing: border-box; border: 0; border-radius: 999px;
                background: var(--azul); color: #fff; font-family: inherit; font-size:16px; font-weight: 500;
                text-align: center; text-decoration: none; cursor: pointer; }
  .btn-grande:hover { background: var(--azul-hover); color: #fff; }
  .btn-grande:focus-visible, .btn-linea:focus-visible { outline: 2px solid var(--azul-filete); outline-offset: 2px; }
  .btn-linea { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px;
               padding: 13px 22px; box-sizing: border-box; border: 1.5px solid #B9CFE2; border-radius: 999px;
               background: transparent; color: var(--azul-oscuro); font-family: inherit; font-size:16px;
               font-weight: 500; text-align: center; cursor: pointer; }
  .btn-linea:hover { background: var(--azul-suave); }

  /* ---- comprar más usos: la entrada, desde la pantalla del bono ---- */
  .comprar { margin-top: 22px; padding: 16px 16px 0; border-top: 1px solid var(--linea);
             display: flex; flex-direction: column; gap: 10px; }
  .comprar .eti { font-size:13px; color: var(--texto-suave); padding: 0 4px; }
  .comprar .nota-pie { font-size:13px; color: var(--texto-suave); padding: 0 4px; line-height: 1.5; }

  /* Aviso de un pago que no salió, cuando ya no sabemos qué se estaba
     comprando y hay que volver a elegir. Ámbar, nunca rojo. */
  .aviso-ambar { margin: 16px 16px 0; background: #FDF6EA; border: 1px solid var(--ambar-borde);
                 border-left: 5px solid #E08A18; border-radius:12px; padding: 15px 16px;
                 display: flex; flex-direction: column; gap: 7px; }
  .aviso-ambar b { font-weight: 600; font-size:16px; line-height: 1.35; color: var(--navy); }
  .aviso-ambar p { margin: 0; font-size:15px; line-height: 1.45; color: var(--texto); }

  /* ---- elegir el bono · pantalla 1 de la compra ----
     Dos tarjetas con radio. La elegida se marca con el filete azul de
     2 px; el relleno se ajusta 1 px para que la tarjeta no dé un salto
     al cambiar de opción. */
  .elegir-cab { padding: 18px 16px 0; display: flex; flex-direction: column; gap: 6px; }
  .elegir-cab .tit { font-family: var(--fuente-titulo); font-weight: 700; font-size:26px; line-height: 1;
                     text-transform: uppercase; color: var(--navy); }
  .elegir-cab .est { font-size:14px; line-height: 1.45; color: var(--texto-suave); }
  .opciones { padding: 16px; display: flex; flex-direction: column; gap: 11px; }
  .op { display: flex; align-items: center; gap: 13px; padding: 15px 16px; background: #fff;
        border: 1px solid var(--linea-marcada); border-radius:14px; cursor: pointer;
        box-shadow: 0 4px 10px rgba(30,45,65,.10), 0 16px 32px -8px rgba(30,45,65,.34); }
  .op:hover { background: var(--crema); }
  .op--on { border: 2px solid var(--azul-filete); padding: 14px 15px; background: #fff; }
  .op:focus-within { outline: 2px solid var(--azul-filete); outline-offset: 2px; }
  .op input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
  .op .pt { flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 999px;
            border: 1.5px solid #C6BEAE; }
  .op--on .pt { border: 6px solid var(--azul-filete); }
  .op .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .op .nom { font-size:17px; font-weight: 500; line-height: 1.25; color: var(--navy); }
  .op .sub { font-size:13px; line-height: 1.3; color: var(--texto-suave); }
  .op .sub.ahorro { color: var(--verde); }
  /* Cifra grande: Barlow Condensed, no monoespaciada. */
  .op .precio { font-family: var(--fuente-titulo); font-weight: 700; font-size:26px; line-height: 1;
                color: var(--navy); white-space: nowrap; }
  .elegir-pie { padding: 0 16px 18px; display: flex; flex-direction: column; gap: 11px; }
  .elegir-pie .letra { font-size:13px; line-height: 1.5; color: var(--texto-suave); }

  /* ---- pago hecho · la vuelta de la pasarela ----
     No dice «gracias por tu compra»: dice cuántos usos hay ahora. */
  .hecho-banda { background: var(--navy); padding: 30px 20px 26px; display: flex; flex-direction: column; gap: 12px; }
  .hecho-banda .rot { font-size:12px; font-weight: 500; line-height: 1; letter-spacing: 0.09em;
                      text-transform: uppercase; color: #8FC0E8; }
  .hecho-banda .tit { font-family: var(--fuente-titulo); font-weight: 700; font-size:34px; line-height: .98;
                      text-transform: uppercase; color: #fff; }
  .hecho-banda .sub { font-size:15px; line-height: 1.45; color: rgba(255,255,255,.85); }
  .hecho-acciones { padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .recibo { margin: 0 16px 4px; background: #fff; border: 1px solid var(--linea-marcada); border-radius:10px;
            padding: 6px 15px; }
  .recibo .fila { display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
                  padding: 9px 0; font-size:14px; line-height: 1.4; }
  .recibo .fila + .fila { border-top: 1px solid var(--crema-media); }
  .recibo .k { color: var(--texto-suave); }
  .recibo .v { color: var(--navy); text-align: right; overflow-wrap: anywhere; }

  /* ---- historial de pagos, sobre la banda crema ---- */
  .pagos-hist { margin-top: 4px; padding: 4px 16px 20px; background: var(--crema-banda);
                border-top: 1px solid var(--linea-marcada); }
  .pagos-hist .tit { padding: 15px 0 11px; font-family: var(--fuente-titulo); font-weight: 700; font-size:19px;
                     line-height: 1; text-transform: uppercase; color: var(--navy); }
  .pagos-hist .fila { padding: 12px 0; border-top: 1px solid #E0D7C4; display: flex;
                      justify-content: space-between; align-items: baseline; gap: 12px; }
  .pagos-hist .con { font-size:15px; line-height: 1.3; color: var(--navy); }
  .pagos-hist .cuando { display: block; margin-top: 3px; font-size:13px; line-height: 1.3; color: var(--texto-suave); }
  .pagos-hist .imp { font-size:15px; line-height: 1.3; color: var(--navy); white-space: nowrap; }

  .mensaje { margin: 10px 16px 0; font-size:14px; line-height:1.5; }
  /* Si algo no se ha podido guardar va en ámbar: el rojo es para lo que hace mal el socio. */
  .mensaje.fallo { color: #B96F09; }
  .mensaje.ok { color: #1e7a3d; }
  .caja-estado { margin: 12px 16px 0; }
  .elegir-atleta { padding: 0 16px 6px; }
  .elegir-atleta select { width: 100%; min-height: 44px; box-sizing: border-box; padding: 10px 12px;
                          border: 1px solid var(--linea-borde); border-radius:10px;
                          font-family: inherit; font-size:15px; background: #fff; color: var(--navy); }
  .oculto { display: none !important; }
  .migas { display: inline-flex; align-items:center; min-height:44px; margin: 0 20px 2px; padding: 0 2px 0 0; color: var(--azul-oscuro); font-weight: 600; text-decoration: none; font-size:14px; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="cubo-wrap" id="cubo-wrap">
    <a class="migas" href="../">← Volver al portal</a>
    <div class="cab"><div><span class="rotulo">Abierto a socios</span>
      <div class="titulo-cubo">El Cubo</div></div></div>
    <div class="caja-estado"><div class="ap-esq" data-esq="filas:3"></div></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cubo-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  var DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  function d(f) { var p = String(f).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function hhmm(t) { return t ? String(t).slice(0,5) : ''; }
  function cabFecha(f, h) { var x = d(f); return DIAS[x.getDay()] + ' ' + x.getDate() + ' · ' + hhmm(h); }
  function iso(x) { return x.getFullYear() + '-' + ('0'+(x.getMonth()+1)).slice(-2) + '-' + ('0'+x.getDate()).slice(-2); }
  function lunes(x) { var y = new Date(x); var dw = (y.getDay() + 6) % 7; y.setDate(y.getDate() - dw); y.setHours(0,0,0,0); return y; }
  function euros(n) { return Number(n).toFixed(2).replace(/[.,]00$/,'').replace('.', ',') + ' €'; }

  // ---- estado de la pantalla ----
  var atletas = [], atletaId = null, clases = [], reservas = {}, bonos = [], movs = [];
  var pestana = 'semana', vista = 'clases', verTodos = false, aviso = '';
  /* Una bandera por consulta. Sin ellas, una consulta caída y una lista de
     verdad vacía se ven igual, y la pantalla acaba diciendo «no tienes bono»
     a quien sí lo tiene. En dinero eso no puede pasar. */
  var falloCarga = false, falloReservas = false, falloBonos = false, falloMovs = false;
  /* Lo que se puede comprar. Los precios NO se escriben aquí: salen del
     catálogo de la base, que es de donde los lee también el servidor al
     cobrar. Así no puede haber dos precios distintos. */
  var bonosVenta = [], claveElegida = null;
  /* La compra: el aviso ámbar si el pago falló o se dejó a medias, el
     pago del que volvemos y el bono que ha traído. */
  var avisoPago = null, pagoVuelta = null, bonoNuevo = null, pagosHechos = [], verRecibo = false;

  /* Lo elegido se guarda antes de salir a la pasarela y se recupera al
     volver: así el pago que falla vuelve a la MISMA pantalla con la
     selección intacta, nunca a una en blanco ni al principio. */
  var GUARDADO = 'apolana-cubo-compra';
  function guardarEleccion() {
    try {
      sessionStorage.setItem(GUARDADO, JSON.stringify({ clave: claveElegida, atleta_id: atletaId }));
    } catch (e) { /* sin sessionStorage se sigue igual, con la referencia */ }
  }
  function leerEleccion() {
    try { return JSON.parse(sessionStorage.getItem(GUARDADO) || 'null'); } catch (e) { return null; }
  }
  function olvidarEleccion() {
    try { sessionStorage.removeItem(GUARDADO); } catch (e) { /* da igual */ }
  }

  function atletaActual() {
    for (var i = 0; i < atletas.length; i++) if (atletas[i].id === atletaId) return atletas[i];
    return null;
  }
  function nombreDe(a) { return a ? (a.nombre + ' ' + (a.apellidos || '')).trim() : ''; }
  /* En la pantalla de El Cubo, «· El Cubo» en cada bono sobra. */
  function tituloCorto(t) { return String(t || '').replace(/\s*·\s*el cubo\s*$/i, ''); }
  /* Y bajo el rótulo «Tu bono», «Bono de» tampoco hace falta: las dos
     opciones se leen «10 usos» y «20 usos», que es lo que se compara. */
  function nombreOpcion(t) { return tituloCorto(t).replace(/^bono de\s+/i, ''); }

  /* ---------- el error de un bloque, con salida ----------
     El botón NO recarga la página: repite solo la consulta que ha fallado,
     así no se pierde la pestaña abierta ni lo que se estuviera mirando. */
  var REINTENTOS = {}, nReintento = 0;
  function htmlError(titulo, texto, fn) {
    var k = 'r' + (++nReintento);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="' + k + '">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (!fn) return;
    b.disabled = true; b.textContent = 'Un momento…';
    fn();
  });
  async function reintentarDatos() { await cargarTodo(); pintar(); }

  // ---------- datos ----------
  async function cargarTodo() {
    var hoy = iso(new Date());

    var rc = await sb.from('cubo_clases_ocupacion').select('*')
      .eq('activa', true).gte('fecha', hoy).order('fecha').order('hora_inicio');
    /* Si la consulta falla no se enseña una lista vacía como si no hubiera clases. */
    falloCarga = !!rc.error;
    clases = rc.error ? [] : (rc.data || []);

    reservas = {};
    var rr = await sb.from('cubo_reservas').select('id,clase_id,estado').eq('atleta_id', atletaId);
    falloReservas = !!rr.error;
    if (!rr.error) (rr.data || []).forEach(function (x) { reservas[x.clase_id] = x.estado; });

    var rb = await sb.from('cubo_bono_saldo').select('*').eq('atleta_id', atletaId)
      .order('caducidad', { ascending: true, nullsFirst: false });
    falloBonos = !!rb.error;
    bonos = rb.error ? [] : (rb.data || []);

    var rm = await sb.from('cubo_movimientos').select('tipo,usos,concepto,fecha')
      .eq('atleta_id', atletaId).neq('tipo', 'alta').order('fecha', { ascending: false }).limit(40);
    falloMovs = !!rm.error;
    movs = rm.error ? [] : (rm.data || []);
  }

  /* Los bonos que están a la venta, con su precio ya resuelto. Se pide
     una sola vez por visita. */
  async function cargarVenta() {
    if (!window.APOLANA_PAGO) { bonosVenta = []; return; }
    var lista = await APOLANA_PAGO.catalogo('bono');
    bonosVenta = (lista || []).filter(function (a) { return /^bono-cubo-/.test(a.clave); });
  }

  function bonoVigente() {
    for (var i = 0; i < bonos.length; i++) {
      if (bonos[i].activo && !bonos[i].caducado && bonos[i].usos_disponibles > 0) return bonos[i];
    }
    for (var j = 0; j < bonos.length; j++) if (bonos[j].activo && !bonos[j].caducado) return bonos[j];
    return bonos.length ? bonos[0] : null;
  }
  function usosTotalesDisponibles() {
    return bonos.reduce(function (s, b) { return s + ((b.activo && !b.caducado) ? b.usos_disponibles : 0); }, 0);
  }

  // ---------- pantalla de clases ----------
  function clasesDePestana() {
    var hoy = new Date(); hoy.setHours(0,0,0,0);
    var l0 = lunes(hoy), l1 = new Date(l0); l1.setDate(l0.getDate() + 7);
    var l2 = new Date(l0); l2.setDate(l0.getDate() + 14);

    return clases.filter(function (c) {
      var f = d(c.fecha);
      if (pestana === 'semana') return f >= hoy && f < l1;
      if (pestana === 'siguiente') return f >= l1 && f < l2;
      return ['reservada','lista_espera','asistida'].indexOf(reservas[c.clase_id]) >= 0;
    });
  }

  function tarjetaClase(c) {
    var mio = reservas[c.clase_id];
    var apuntado = (mio === 'reservada' || mio === 'asistida');
    var enEspera = (mio === 'lista_espera');
    var completa = c.libres <= 0;

    var estado, clsEstado;
    if (apuntado)      { estado = 'Apuntado';  clsEstado = 'si'; }
    else if (enEspera) { estado = 'En espera'; clsEstado = ''; }
    else if (completa) { estado = 'Completa';  clsEstado = 'no'; }
    // «libre(s)», no «plazas»: justo debajo se lee «2 de 12 plazas» y con la misma
    // palabra parecía que se contradecían.
    else               { estado = c.libres + (c.libres === 1 ? ' libre' : ' libres'); clsEstado = ''; }

    var boton;
    if (apuntado)      boton = '<button class="accion accion--quitar" data-quitar="' + c.clase_id + '">Desapuntarme</button>';
    else if (enEspera) boton = '<button class="accion accion--quitar" data-quitar="' + c.clase_id + '">Salir de la lista de espera</button>';
    else if (completa) boton = '<button class="accion accion--espera" data-apuntar="' + c.clase_id + '">Entrar en lista de espera</button>';
    else               boton = '<button class="accion accion--apuntar" data-apuntar="' + c.clase_id + '">Apuntarme · 1 uso</button>';

    return '<div class="clase-t' + (apuntado || enEspera ? ' mia' : '') + (completa && !apuntado && !enEspera ? ' completa' : '') + '">' +
      '<div class="arriba"><span class="hora">' + esc(cabFecha(c.fecha, c.hora_inicio)) + '</span>' +
      '<span class="estado ' + clsEstado + '">' + esc(estado) + '</span></div>' +
      '<span class="nombre">' + esc(c.titulo) + '</span>' +
      '<span class="quien">' + esc((c.monitor ? c.monitor + ' · ' : '') + c.ocupadas + ' de ' + c.plazas + ' plazas') + '</span>' +
      (c.notas ? '<span class="notas">' + esc(c.notas) + '</span>' : '') +
      boton +
    '</div>';
  }

  function pintarClases() {
    var b = bonoVigente();
    var quedan = usosTotalesDisponibles();

    var h = '<a class="migas" href="../">← Volver al portal</a>';

    h += '<div class="cab"><div><span class="rotulo">Abierto a socios</span>' +
         '<div class="titulo-cubo">El Cubo</div></div>' +
         '<button class="enlace" id="ir-bono">Mi bono</button></div>';

    if (atletas.length > 1) {
      h += '<div class="elegir-atleta"><select id="sel-atleta">' + atletas.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === atletaId ? ' selected' : '') + '>' +
               esc(a.nombre + ' ' + (a.apellidos || '')) + '</option>';
      }).join('') + '</select></div>';
    }

    /* Si no hemos podido leer el bono NO se enseña la tira con un 0: un fallo
       de conexión no puede leerse como «no te quedan usos». */
    if (falloBonos) {
      h += '<div class="caja-estado">' + htmlError('No hemos podido ver tu bono',
        'Puede ser tu conexión. Tus usos siguen guardados: esto no quiere decir que no te queden.',
        reintentarDatos) + '</div>';
    } else if (b) {
      var cad = b.caducidad ? 'Caducan en ' + MESES[d(b.caducidad).getMonth()] : 'Sin fecha de caducidad';
      h += '<div class="bono-tira">' +
           '<span class="cifra">' + quedan + '</span>' +
           '<div class="col">' +
             '<span class="txt">' + (quedan === 1 ? 'uso te queda' : 'usos te quedan') +
               ', de un bono de ' + b.usos_totales + '</span>' +
             '<span class="eti">' + esc(cad) + '</span>' +
             '<span class="norma">Cada clase gasta un uso, que se descuenta al empezar. Si te desapuntas con más de 3 horas, se te devuelve; con menos, se pierde.</span>' +
           '</div></div>';
    } else {
      h += '<div class="bono-tira">' +
           '<span class="cifra">0</span>' +
           '<div class="col">' +
             '<span class="txt">Todavía no tienes bono</span>' +
             '<span class="eti">Pídelo en <span class="marca">El Cubo</span> y podrás apuntarte a las clases.</span>' +
           '</div></div>';
    }

    h += '<div class="pestanas">' +
         '<button data-pestana="semana" aria-selected="' + (pestana === 'semana') + '">Esta semana</button>' +
         '<button data-pestana="siguiente" aria-selected="' + (pestana === 'siguiente') + '">Siguiente</button>' +
         '<button data-pestana="mias" aria-selected="' + (pestana === 'mias') + '">Mis clases</button>' +
         '</div>';

    if (aviso) h += '<p class="mensaje ' + (aviso.charAt(0) === '!' ? 'fallo' : 'ok') + '">' + esc(aviso.replace(/^!/, '')) + '</p>';

    var lista = clasesDePestana();
    /* Sin poder leer las reservas, una clase a la que ya estás apuntado se
       vería como si no lo estuvieras. Se avisa antes de la lista. */
    if (falloReservas) {
      h += '<div class="caja-estado">' + htmlError('No hemos podido ver tus reservas',
        'Puede ser tu conexión. Tus plazas siguen guardadas; mientras tanto, aquí abajo puede que alguna clase ' +
        'se vea como si no estuvieras apuntado.', reintentarDatos) + '</div>';
    }
    if (falloCarga) {
      h += '<div class="caja-estado">' + htmlError('No hemos podido cargar las clases',
        'Puede ser tu conexión. Tu bono y tus plazas siguen guardados; vuelve a intentarlo en un momento.',
        reintentarDatos) + '</div>';
    } else if (!lista.length && !(pestana === 'mias' && falloReservas)) {
      h += '<div class="caja-estado">' + (pestana === 'mias'
        ? APOLANA_UI.vacio('Todavía no estás apuntado a ninguna clase',
            'Cuando reserves una plaza aparecerá aquí, con el día y la hora.')
        : pestana === 'semana'
          ? APOLANA_UI.vacio('Esta semana no hay clases abiertas',
              'El Cubo abre las clases con unos días de antelación. Mira en «Siguiente» a ver si ya están las de la semana que viene.')
          : APOLANA_UI.vacio('La semana que viene todavía no hay clases abiertas',
              'En cuanto El Cubo las publique, podrás apuntarte desde aquí con un uso de tu bono.')) + '</div>';
    } else if (lista.length) {
      h += '<div class="clases-lista">' + lista.map(tarjetaClase).join('') + '</div>';
    }

    /* El desplegable «Cómo funcionan los usos» ya no hace falta: lo que decía
       está ahora junto al número, que es donde se pregunta. */

    wrap.innerHTML = h;
    conectarClases();
  }

  function conectarClases() {
    var sel = document.getElementById('sel-atleta');
    if (sel) sel.addEventListener('change', async function () {
      atletaId = sel.value; aviso = ''; await cargarTodo(); pintar();
    });
    document.getElementById('ir-bono').addEventListener('click', function () { vista = 'bono'; aviso = ''; pintar(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-pestana]'), function (b) {
      b.addEventListener('click', function () { pestana = b.getAttribute('data-pestana'); aviso = ''; pintar(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-apuntar],[data-quitar]'), function (b) {
      b.addEventListener('click', function () {
        var ap = b.getAttribute('data-apuntar'), qu = b.getAttribute('data-quitar');
        b.disabled = true; b.textContent = 'Un momento…';
        accion(ap ? 'cubo_apuntarme' : 'cubo_desapuntarme', ap || qu);
      });
    });
  }

  async function accion(fn, claseId) {
    var r = await sb.rpc(fn, { p_clase: claseId, p_atleta: atletaId });
    if (r.error) {
      aviso = '!No hemos podido guardar el cambio. Puede que la clase se haya llenado o ser tu conexión: vuelve a intentarlo.';
    } else if (fn === 'cubo_apuntarme') {
      aviso = (r.data === 'lista_espera')
        ? 'La clase está completa: estás en la lista de espera. Te avisamos si queda una plaza libre.'
        : 'Ya tienes tu plaza. Se te descontará un uso al empezar la clase.';
    } else {
      aviso = 'Te has desapuntado.';
    }
    await cargarTodo();
    pintar();
  }

  /* ---------- comprar más usos · la entrada ----------
     Desde la pantalla del bono se pasa a la de elegir. El resumen de
     precios sale del catálogo, nunca escrito a mano. */
  function porSesion(a) {
    return a.bono_usos ? Math.round(a.importe_centimos / a.bono_usos) : null;
  }

  /* Lo que se ahorra un bono comparado con el que sale más caro por
     sesión: (precio por sesión más caro × usos) − lo que cuesta. Es
     una cuenta, no un número escrito a mano. */
  function ahorroDe(a) {
    if (!a.bono_usos || bonosVenta.length < 2) return 0;
    var caro = 0;
    bonosVenta.forEach(function (x) { var p = porSesion(x); if (p && p > caro) caro = p; });
    return caro * a.bono_usos - a.importe_centimos;
  }

  function resumenVenta() {
    var usos = [], barato = Infinity;
    bonosVenta.forEach(function (a) {
      if (a.bono_usos) usos.push(a.bono_usos);
      var p = porSesion(a);
      if (p && p < barato) barato = p;
    });
    var lista = usos.length > 1
      ? usos.slice(0, -1).join(', ') + ' y ' + usos[usos.length - 1]
      : String(usos[0] || '');
    return 'Bonos de ' + lista + ' usos' +
      (isFinite(barato) ? ', desde ' + APOLANA_PAGO.euros(barato) + ' por clase' : '') + '.';
  }

  function bloqueComprar() {
    if (!bonosVenta.length) {
      return '<div class="comprar"><span class="eti">comprar más usos</span>' +
        '<span class="nota-pie">Ahora mismo no hay bonos a la venta desde aquí. ' +
        'Pídelo en El Cubo o al club y te lo activan ellos.</span></div>';
    }
    return '<div class="comprar"><span class="eti">comprar más usos</span>' +
      '<button type="button" class="btn-grande" id="ir-comprar">Comprar más usos</button>' +
      '<span class="nota-pie">' + esc(resumenVenta()) +
      ' Verás el desglose y el total antes de pagar nada.</span></div>';
  }

  /* ---------- 1 · elegir ----------
     Arriba, lo que ya tienes. Debajo, las dos tarjetas con el precio
     por sesión y el ahorro, que hacen la comparación solas. Y el
     botón con el importe: nunca un «Continuar» a ciegas. */
  function caducidadMasCercana() {
    var f = null;
    bonos.forEach(function (b) {
      if (!b.activo || b.caducado || b.usos_disponibles <= 0 || !b.caducidad) return;
      if (!f || b.caducidad < f) f = b.caducidad;
    });
    return f;
  }

  /* Con varias fichas a cargo, el bono es de una persona concreta y hay
     que decirlo: si no, «te quedan 2 usos» no se sabe de quién es. */
  function tituloElegir() {
    return atletas.length > 1 ? 'Bono de ' + (atletaActual() || {}).nombre : 'Tu bono';
  }

  function lineaEstado() {
    var propio = atletas.length <= 1;
    var quedan = usosTotalesDisponibles();
    /* Con la consulta caída no se sabe cuántos usos quedan: se dice así, y
       nunca «no te quedan», que aquí empujaría a comprar sin necesidad. */
    if (falloBonos) return 'No hemos podido comprobar los usos que ' + (propio ? 'te quedan.' : 'le quedan.');
    if (!quedan) return propio ? 'Ahora mismo no te quedan usos.' : 'Ahora mismo no le quedan usos.';
    var cad = caducidadMasCercana();
    var mismoAnio = cad && d(cad).getFullYear() === new Date().getFullYear();
    return (propio ? 'Te ' : 'Le ') + (quedan === 1 ? 'queda 1 uso' : 'quedan ' + quedan + ' usos') + '.' +
      (cad ? ' ' + (quedan === 1 ? 'Caduca' : 'Caducan') + ' el ' +
             APOLANA_PAGO.fechaLarga(cad, !mismoAnio) + '.' : '');
  }

  function letraPequena() {
    var dias = null, iguales = true;
    bonosVenta.forEach(function (a) {
      if (dias === null) dias = a.bono_caducidad_dias;
      else if (dias !== a.bono_caducidad_dias) iguales = false;
    });
    var meses = (iguales && dias) ? Math.round(dias / 30.44) : null;
    return (meses ? 'Los bonos caducan a los ' + meses + ' meses. ' : '') +
      'Se pueden usar en cualquier clase de El Cubo.';
  }

  function pintarElegir() {
    if (!claveElegida || !bonosVenta.some(function (a) { return a.clave === claveElegida; })) {
      claveElegida = bonosVenta.length ? bonosVenta[0].clave : null;
    }

    var h = '<div class="cab" style="align-items:center;">' +
            '<button class="enlace" id="volver-bono">← Mi bono</button></div>';

    /* Si volvemos de un pago que no salió y ya no se sabe qué se
       estaba comprando, se dice aquí: nunca se vuelve al principio
       como si no hubiera pasado nada. */
    if (avisoPago) {
      h += '<div class="aviso-ambar" role="alert"><b>' + esc(avisoPago.titulo) + '</b>' +
           '<p>' + esc(avisoPago.texto).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>') + '</p></div>';
    }

    h += '<div class="elegir-cab"><div class="tit">' + esc(tituloElegir()) + '</div>' +
         '<span class="est">' + esc(lineaEstado()) + '</span></div>';

    h += '<div class="opciones" role="radiogroup" aria-label="Elige un bono">' +
      bonosVenta.map(function (a) {
        var elegida = a.clave === claveElegida;
        var p = porSesion(a);
        var ahorro = ahorroDe(a);
        var sub = (p ? APOLANA_PAGO.euros(p) + ' por clase' : '') +
                  (ahorro >= 100 ? ' · ahorras ' + APOLANA_PAGO.eurosCorto(ahorro) : '');
        return '<label class="op' + (elegida ? ' op--on' : '') + '">' +
          '<input type="radio" name="bono" value="' + esc(a.clave) + '"' + (elegida ? ' checked' : '') + '>' +
          '<span class="pt" aria-hidden="true"></span>' +
          '<span class="col"><span class="nom">' + esc(nombreOpcion(a.titulo)) + '</span>' +
            (sub ? '<span class="sub' + (ahorro >= 100 ? ' ahorro' : '') + '">' + esc(sub) + '</span>' : '') +
          '</span>' +
          '<span class="precio">' + esc(APOLANA_PAGO.eurosCorto(a.importe_centimos)) + '</span>' +
        '</label>';
      }).join('') + '</div>';

    var elegido = bonosVenta.filter(function (a) { return a.clave === claveElegida; })[0];
    h += '<div class="elegir-pie">' +
      '<span class="letra">' + esc(letraPequena()) + '</span>' +
      '<button type="button" class="btn-grande" id="ir-confirmar">Continuar · ' +
        esc(APOLANA_PAGO.eurosCorto(elegido ? elegido.importe_centimos : 0)) + '</button>' +
    '</div>';

    wrap.innerHTML = h;

    document.getElementById('volver-bono').addEventListener('click', function () {
      avisoPago = null; vista = 'bono'; pintar();
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.op input'), function (r) {
      r.addEventListener('change', function () {
        claveElegida = r.value;
        pintarElegir();
        /* Al repintar se pierde el foco; se devuelve a la opción que
           acaba de marcarse para que con teclado no haya que empezar
           otra vez desde arriba. */
        var vuelve = wrap.querySelector('.op input:checked');
        if (vuelve) vuelve.focus();
      });
    });
    document.getElementById('ir-confirmar').addEventListener('click', function () {
      avisoPago = null; vista = 'confirmar'; pintar();
    });
  }

  /* ---------- 2 · confirmar (y 4 · el pago falla, y 5 · sin Stripe) ----------
     La pantalla la pinta el módulo compartido, que es el mismo que
     usarán la licencia y la ropa. Con el pago con tarjeta apagado se
     ve igual (concepto, desglose y total) pero el último paso no
     cobra: avisa de que todavía no está en marcha y enseña la vía de
     verdad. Si el pago falla o se deja a medias, es ESTA misma
     pantalla con la selección intacta y un aviso ámbar arriba. */
  function pintarConfirmar() {
    var a = atletaActual();
    var deQuien = nombreDe(a);
    var quienPaga = perfil ? (perfil.nombre + ' ' + (perfil.apellidos || '')).trim() : '';

    /* Se guarda antes de salir: al volver de la pasarela, la pantalla
       vuelve a montarse con lo mismo elegido. */
    guardarEleccion();

    wrap.innerHTML = '<div id="pago-pantalla"></div>';
    APOLANA_PAGO.confirmar({
      contenedor: document.getElementById('pago-pantalla'),
      clave: claveElegida,
      atleta_id: atletaId,
      /* Solo si el bono no es para quien paga: si no, sobra. */
      aNombreDe: (deQuien && deQuien !== quienPaga) ? deQuien : '',
      atleta: a,
      pagador: perfil ? { nombre: quienPaga, email: perfil.email } : null,
      aviso: avisoPago,
      alVolver: function () { avisoPago = null; vista = 'elegir'; pintar(); }
    });
  }

  /* ---------- 3 · la vuelta, pago hecho ----------
     No dice «gracias por tu compra»: dice cuántos usos hay ahora,
     sumados a los que quedaban, y ofrece lo siguiente de verdad. */
  function pintarHecho() {
    var quedan = usosTotalesDisponibles();
    var nuevos = bonoNuevo ? bonoNuevo.usos_totales
      : (pagoVuelta && pagoVuelta.metadatos ? Number(pagoVuelta.metadatos.usos) || 0 : 0);
    var antes = quedan - (bonoNuevo ? nuevos : 0);

    var propio = atletas.length <= 1;
    var titulo, sub;
    /* Si el saldo no se ha podido leer no se canta un total: se dice que el
       pago está hecho y que los usos están llegando. Nunca «ya tienes 0». */
    if (bonoNuevo && !falloBonos) {
      titulo = (propio ? 'Ya tienes ' : (atletaActual() || {}).nombre + ' ya tiene ') +
               quedan + (quedan === 1 ? ' uso' : ' usos');
      sub = (antes > 0
              ? 'Los ' + nuevos + ' nuevos y ' +
                (antes === 1 ? 'el que ' + (propio ? 'te quedaba' : 'le quedaba')
                             : 'los ' + antes + ' que ' + (propio ? 'te quedaban' : 'le quedaban'))
              : 'Los ' + nuevos + ' del bono que acabas de comprar') +
            (bonoNuevo.caducidad
              ? '. ' + (nuevos === 1 ? 'Caduca' : 'Caducan') + ' el ' + APOLANA_PAGO.fechaLarga(bonoNuevo.caducidad) + '.'
              : '.');
    } else {
      /* Cobrado sí, pero los usos todavía no han llegado. Se dice tal
         cual: es peor prometer un número que no está. */
      titulo = 'Pago recibido';
      sub = 'Estamos añadiendo' + (nuevos ? ' los ' + nuevos + ' usos' : ' los usos') +
            (propio ? ' a tu bono' : ' al bono') +
            '. Suele tardar unos segundos; si no los ves, vuelve a entrar en un momento.';
    }

    var h = '<div class="hecho-banda"><span class="rot">Pago hecho</span>' +
            '<h1 class="tit">' + esc(titulo) + '</h1>' +
            '<span class="sub">' + esc(sub) + '</span></div>';

    h += '<div class="hecho-acciones">' +
         '<button type="button" class="btn-grande" id="ir-reservar">Reservar mi próxima clase</button>' +
         '<button type="button" class="btn-linea" id="ver-recibo" aria-expanded="' + verRecibo + '">' +
           (verRecibo ? 'Ocultar el recibo' : 'Ver el recibo') + '</button></div>';

    if (verRecibo && pagoVuelta) {
      var f = pagoVuelta.pagado_en || pagoVuelta.creado_en;
      h += '<div class="recibo">' +
        fila('Concepto', pagoVuelta.concepto) +
        fila('Importe', APOLANA_PAGO.euros(pagoVuelta.importe_centimos)) +
        fila('Fecha', f ? APOLANA_PAGO.fechaLarga(String(f).slice(0, 10)) : '') +
        fila('Forma de pago', 'Tarjeta') +
        fila('Referencia', pagoVuelta.referencia) +
      '</div>';
    }

    if (pagosHechos.length) {
      h += '<div class="pagos-hist"><div class="tit">Tus pagos</div>' +
        pagosHechos.map(function (p) {
          var f = p.pagado_en || p.creado_en;
          var x = f ? new Date(f) : null;
          var hoy = x && (iso(x) === iso(new Date()));
          var cuando = hoy ? 'Hoy' : (x ? x.getDate() + ' ' + MESES_C[x.getMonth()] : '');
          /* «Bono de 10 usos · El Cubo» → el nombre arriba y la sede
             abajo, junto a la fecha: es contexto, no título. */
          var trozos = String(p.concepto || '').split(' · ');
          var titulo = trozos.shift();
          if (trozos.length) cuando += (cuando ? ' · ' : '') + trozos.join(' · ');
          return '<div class="fila"><span><span class="con">' + esc(titulo) + '</span>' +
            '<span class="cuando">' + esc(cuando) + '</span></span>' +
            '<span class="imp">' + esc(APOLANA_PAGO.euros(p.importe_centimos)) + '</span></div>';
        }).join('') + '</div>';
    }

    wrap.innerHTML = h;

    document.getElementById('ir-reservar').addEventListener('click', function () {
      vista = 'clases'; pestana = 'semana'; aviso = ''; pintar();
    });
    document.getElementById('ver-recibo').addEventListener('click', function () {
      verRecibo = !verRecibo; pintar();
    });
  }

  function fila(k, v) {
    return v ? '<div class="fila"><span class="k">' + esc(k) + '</span>' +
               '<span class="v">' + esc(v) + '</span></div>' : '';
  }

  // ---------- pantalla del bono ----------
  function pintarBono() {
    var b = bonoVigente();
    var quedan = usosTotalesDisponibles();

    var h = '<div class="cab" style="align-items:center;">' +
            '<button class="enlace" id="volver-clases">← Clases</button>' +
            '<button class="enlace" id="ayuda">Ayuda</button></div>';

    /* Primero se mira si se ha podido mirar. «Todavía no tienes bono» solo
       se dice cuando la consulta ha ido bien y de verdad no hay ninguno. */
    if (falloBonos) {
      h += '<div class="caja-estado">' + htmlError('No hemos podido ver tu bono',
        'Puede ser tu conexión. Tus usos siguen guardados: esto no quiere decir que no te queden.',
        reintentarDatos) + '</div>';
    } else if (!b) {
      h += '<div class="caja-estado">' + APOLANA_UI.vacio('Todavía no tienes bono de El Cubo',
        'El bono se pide en El Cubo o al club: te lo activan ellos y se cobra con la cuota del mes siguiente. Aquí verás los usos que te quedan.') + '</div>';
    } else {
      var puntos = '';
      for (var i = 0; i < b.usos_totales; i++) puntos += '<span' + (i < b.usos_disponibles ? ' class="on"' : '') + '></span>';
      var comp = 'Comprado el ' + d(b.fecha_compra).getDate() + ' de ' + MESES[d(b.fecha_compra).getMonth()] +
                 (b.precio != null ? ' · ' + euros(b.precio) : '');
      var cad = b.caducidad ? 'Caduca ' + d(b.caducidad).getDate() + ' ' + MESES_C[d(b.caducidad).getMonth()] : 'Sin caducidad';

      h += '<div class="bono-caja">' +
           '<span class="eti">bono de <span class="marca">El Cubo</span> · ' + b.usos_totales + ' usos</span>' +
           '<div class="fila-cifra"><span class="cifra">' + quedan + '</span>' +
           '<span class="cifra-txt">' + (quedan === 1 ? 'uso disponible' : 'usos disponibles') + '</span></div>' +
           '<div class="puntos">' + puntos + '</div>' +
           '<div class="pie-bono"><span>' + esc(comp) + '</span><span>' + esc(cad) + '</span></div>' +
           '</div>';
    }

    h += '<div class="cab-sec"><span class="eti">últimos usos</span>' +
         (movs.length > 4 ? '<button id="ver-todos">' + (verTodos ? 'Ver menos' : 'Ver todos') + '</button>' : '') +
         '</div>';

    if (falloMovs) {
      h += '<div class="caja-estado">' + htmlError('No hemos podido cargar tus últimos usos',
        'Puede ser tu conexión. Lo que hayas gastado sigue apuntado; vuelve a intentarlo en un momento.',
        reintentarDatos) + '</div>';
    } else if (!movs.length) {
      h += '<div class="caja-estado">' + APOLANA_UI.vacio('Todavía no has gastado ningún uso',
        'Cada clase a la que vayas descuenta un uso, y aquí queda apuntado con el día y la hora.') + '</div>';
    } else {
      var lista = verTodos ? movs : movs.slice(0, 4);
      h += '<div class="movs">' + lista.map(function (m) {
        var f = new Date(m.fecha);
        var cuando = DIAS[f.getDay()] + ' ' + f.getDate() + ' · ' +
                     ('0'+f.getHours()).slice(-2) + ':' + ('0'+f.getMinutes()).slice(-2);
        return '<div class="mov"><div><div class="con">' + esc(m.concepto) + '</div>' +
               '<div class="cuando">' + esc(cuando) + '</div></div>' +
               '<span class="n' + (m.usos > 0 ? ' mas' : '') + '">' + (m.usos > 0 ? '+' + m.usos : '−' + Math.abs(m.usos)) + '</span></div>';
      }).join('') + '</div>';
    }

    if (aviso) h += '<p class="mensaje ' + (aviso.charAt(0) === '!' ? 'fallo' : 'ok') + '">' + esc(aviso.replace(/^!/, '')) + '</p>';

    h += bloqueComprar();

    wrap.innerHTML = h;

    document.getElementById('volver-clases').addEventListener('click', function () { vista = 'clases'; aviso = ''; pintar(); });
    document.getElementById('ayuda').addEventListener('click', function () {
      aviso = 'Cada clase gasta un uso del bono. Si te desapuntas con más de 3 horas, se te devuelve. Si la clase está completa entras en lista de espera y no gastas nada hasta que te den la plaza.';
      pintar();
    });
    var vt = document.getElementById('ver-todos');
    if (vt) vt.addEventListener('click', function () { verTodos = !verTodos; pintar(); });
    var ic = document.getElementById('ir-comprar');
    if (ic) ic.addEventListener('click', function () { vista = 'elegir'; aviso = ''; pintar(); });
  }

  function pintar() {
    wrap.classList.toggle('al-borde', vista === 'hecho');
    if (vista === 'hecho') pintarHecho();
    else if (vista === 'confirmar') pintarConfirmar();
    else if (vista === 'elegir') pintarElegir();
    else if (vista === 'bono') pintarBono();
    else pintarClases();
  }

  // ---------- arranque ----------
  /* La cabecera sola, para las dos pantallas que no llegan a tener datos. */
  function cabSola() {
    return '<a class="migas" href="../">← Volver al portal</a>' +
      '<div class="cab"><div><span class="rotulo">Abierto a socios</span>' +
      '<div class="titulo-cubo">El Cubo</div></div></div>';
  }

  function esMio(id) {
    for (var i = 0; i < atletas.length; i++) if (atletas[i].id === id) return true;
    return false;
  }

  async function cargarPago(referencia) {
    try {
      var r = await sb.from('pagos_online')
        .select('id,referencia,atleta_id,concepto,tipo,importe_centimos,estado,metadatos,creado_en,pagado_en')
        .eq('referencia', referencia).maybeSingle();
      return (r.error || !r.data) ? null : r.data;
    } catch (e) { return null; }
  }

  /* El bono que ha traído ese pago concreto. Si todavía no está, es que
     el aviso de Stripe no ha llegado: se dice, no se inventa. */
  async function bonoDelPago(pagoId) {
    try {
      var r = await sb.from('cubo_bonos').select('id,usos_totales,caducidad,fecha_compra')
        .eq('pago_online_id', pagoId).maybeSingle();
      return (r.error || !r.data) ? null : r.data;
    } catch (e) { return null; }
  }

  /* Todo el arranque va en una función para que el botón de «volver a
     intentarlo» pueda repetirlo entero sin recargar la página. */
  async function arrancar() {
    wrap.innerHTML = cabSola() + '<div class="caja-estado"><div class="ap-esq" data-esq="filas:3"></div></div>';

    /* `tipo_membresia` y `fecha_nacimiento` no se pintan: sirven para saber
       qué cuenta y qué contacto le tocan si hay que pagar por transferencia
       (escuela → Adrián o Andrés; socios y adultos → Isabel). */
    /* Aquí solo van los del bolsillo: uno mismo y sus hijos. La pantalla
       pedía la lista sin filtrar y se fiaba de que la base recortara, pero
       la base entiende «mis atletas» de forma más ancha —incluye a los que
       uno entrena—, así que a un entrenador le salía en el desplegable su
       grupo entero, con sus bonos, y podía gastarlos. Eso son usos que ha
       pagado otra familia. Ahora se pide por identificador, y la base
       además lo cierra por su cuenta (migración 125). */
    var rMios = await sb.rpc('mis_atletas_bolsillo');
    var idsMios = (!rMios.error && rMios.data)
      ? rMios.data.map(function (x) { return (x && x.mis_atletas_bolsillo) || x; })
      : null;
    /* Y si esa pregunta se cae, aquí no se sigue adelante: antes había una
       salida de emergencia que volvía a pedir la lista entera, o sea que un
       fallo de red devolvía a la pantalla el desplegable con el grupo. Una
       puerta que se abre sola cuando algo falla no es una puerta. Se prefiere
       enseñar el aviso de «vuelve a intentarlo», que es lo que de verdad pasa. */
    var ra = !idsMios
      ? { error: (rMios.error || { message: 'no se ha podido saber de quién son las fichas' }) }
      : (idsMios.length
          ? await sb.from('atletas').select('id,nombre,apellidos,tipo_membresia,fecha_nacimiento').in('id', idsMios).order('nombre')
          : { data: [] });

    /* Si la consulta se cae, `data` viene vacío. Decir «no vemos tu ficha»
       sería mentir y mandar a la gente a llamar al club para nada. */
    if (ra.error) {
      wrap.innerHTML = cabSola() + '<div class="caja-estado">' +
        htmlError('No hemos podido cargar tu ficha',
          'Puede ser tu conexión. Tu bono y tus reservas siguen guardados; vuelve a intentarlo en un momento.',
          arrancar) + '</div>';
      return;
    }
    atletas = ra.data || [];

    if (!atletas.length) {
      wrap.innerHTML = cabSola() +
        '<div class="caja-estado">' + APOLANA_UI.vacio('Todavía no vemos tu ficha de atleta',
          'Tu cuenta aún no está enlazada con ninguna ficha, y las clases se reservan por ficha. Avisa al club y lo dejan listo enseguida.',
          APOLANA_UI.volver()) + '</div>';
      return;
    }

    atletaId = atletas[0].id;

    /* ---------- la vuelta de la pasarela ----------
       Stripe trae la referencia del pago. Con ella se sabe de quién era,
       qué se compraba y en qué quedó, así que ni el pago hecho ni el que
       falla dependen de que el navegador se acuerde de nada. */
    var qs = new URLSearchParams(location.search);
    var vuelta = qs.get('pago');
    var ref = (qs.get('ref') || '').trim();
    var guardado = leerEleccion();
    if (vuelta) history.replaceState(null, '', location.pathname);

    var pago = (vuelta && ref) ? await cargarPago(ref) : null;
    if (pago && pago.atleta_id && esMio(pago.atleta_id)) atletaId = pago.atleta_id;
    else if (guardado && guardado.atleta_id && esMio(guardado.atleta_id)) atletaId = guardado.atleta_id;

    await cargarTodo();
    await cargarVenta();

    if (vuelta === 'hecho') {
      pagoVuelta = pago;
      bonoNuevo = pago ? await bonoDelPago(pago.id) : null;
      /* Solo los cobrados: un intento fallido no es «un pago tuyo». */
      pagosHechos = (await APOLANA_PAGO.misPagos(12) || [])
        .filter(function (p) { return p.estado === 'pagado'; }).slice(0, 5);
      olvidarEleccion();
      vista = 'hecho';
    } else if (vuelta === 'cancelado') {
      /* Ni pantalla en blanco ni volver al principio: la misma pantalla
         de confirmar, con lo elegido, y el aviso ámbar arriba. */
      claveElegida = (pago && pago.metadatos && pago.metadatos.clave) ||
                     (guardado && guardado.clave) || null;
      avisoPago = (pago && pago.estado === 'fallido')
        ? { titulo: 'El pago no se ha completado',
            texto: 'Tu banco no lo ha autorizado. **No se te ha cobrado nada** y el bono sigue sin comprar.' }
        : { titulo: 'Dejaste el pago sin terminar',
            texto: 'Volviste antes de acabar en el banco. **No se te ha cobrado nada** y el bono sigue sin comprar.' };
      vista = claveElegida ? 'confirmar' : 'elegir';
    }

    pintar();

    /* El bono se apunta cuando Stripe avisa al club, y eso puede tardar
       unos segundos. Si al pintar no estaba, se vuelve a mirar una vez y
       la pantalla se corrige sola. */
    if (vista === 'hecho' && pago && !bonoNuevo) {
      setTimeout(async function () {
        bonoNuevo = await bonoDelPago(pago.id);
        if (!bonoNuevo || vista !== 'hecho') return;
        await cargarTodo();
        if (vista === 'hecho') pintar();
      }, 2500);
    }
  }

  await arrancar();
});
</script>

</body>
</html>
