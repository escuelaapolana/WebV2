<style>
  /* Cabecera de pantalla: sobre crema y sin barra de color. El navy se reserva
     para las pantallas de trabajo (el entreno del día). */
  body { background: var(--crema); }
  .at-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  /* El margen inferior evita que la primera tarjeta se pegue al titular y le corte la coma. */
  .at-cab[hidden] { display:none; }
  .at-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:16px; }
  .at-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:32px; color: var(--navy); margin: 0; line-height:1; }
  .at-cab .sub { display:block; font-size:14px; color: var(--texto-suave); margin-bottom:4px; }
  /* Iniciales, no un número: el círculo con el día parecía un contador de avisos.
     Plano y sin sombra: no se pulsa, así que no lleva sombra. */
  .at-cab .at-ini { flex:none; width:40px; height:40px; border-radius:999px; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:15px; }
  /* Acción de la cabecera (Añadir marca): botón de borde, alineado con la base del título */
  .at-cab .at-acc { flex:none; min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; padding:0 16px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto); font:inherit; font-size:14px; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .at-cab .at-acc:hover { border-color: var(--azul); color: var(--navy); }
  .at-cab .at-acc[aria-expanded="true"] { background: var(--navy); border-color: var(--navy); color:#fff; }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 200px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:2px; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:8px; }
  /* El activo se marca con subrayado de 2 px, no con una píldora de fondo */
  .side nav a { cursor:pointer; font-size:15px; color: var(--texto-suave); padding:11px 12px; border-radius:10px; text-decoration:none; border-bottom:2px solid transparent; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { color: var(--navy); font-weight:600; border-bottom-color: var(--navy); border-radius:0; }
  .cont { flex:1 1 auto; min-width:0; }

  /* Sin sombra: una tarjeta que no se pulsa lleva borde, no sombra */
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(18px,3vw,26px); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 12px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:13px; padding:3px 9px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }

  /* Estado vacío con cuerpo: icono de línea, frase corta y, si aplica, una acción. */
  .vacio-caja { text-align:center; padding: clamp(20px,4vw,28px) 16px; }
  .vacio-caja .vc-ic { width:46px; height:46px; border-radius:50%; background: var(--crema-media); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .vacio-caja .vc-ic svg { width:24px; height:24px; }
  .vacio-caja h3 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; color: var(--navy); margin:0 0 6px; }
  .vacio-caja p { color: var(--texto-suave); font-size:14px; margin:0 0 14px; max-width:34ch; margin-left:auto; margin-right:auto; }
  .vacio-caja .btn { min-height:44px; display:inline-flex; align-items:center; }

  /* gráficos */
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .grafico { border:1px solid var(--linea); border-radius:14px; padding:10px 8px 4px; background: var(--crema); }
  .grafico svg { width:100%; height:auto; display:block; }
  .grafico .leyenda { font-size:13px; color: var(--texto-suave); padding:2px 4px 4px; }
  .grafico .mejora { color:#1e7a3d; font-weight:600; }
  /* MARCAS (maqueta 37b) · una sola tarjeta navy por pantalla: tu mejor marca.
     El resto de los datos van en listas de filas sobre crema. */
  .mejor { background: var(--navy); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:11px; margin-bottom:14px; }
  .mejor .mj-et { font-size:14px; color: rgba(255,255,255,.62); }
  .mejor .mj-cifra { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .mejor .mj-dato { font-family: var(--fuente-dato); font-size:42px; font-weight:700; line-height:1; color:#fff; }
  .mejor .mj-prueba { font-size:16px; color: rgba(255,255,255,.7); }
  .mejor .mj-pie { display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,.16); padding-top:11px; }
  .mejor .mj-mejora { font-size:14px; color:#7FC08D; }
  .mejor .mj-donde { flex:1; text-align:right; font-size:14px; color: rgba(255,255,255,.6); }

  /* Lista de datos: UN solo contenedor con separadores, no diez tarjetas sueltas */
  .lista-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 7px; padding:0 2px; }
  .lista-tit .et { font-size:14px; color: var(--texto-suave); }
  .lista-tit .enl { background:none; border:0; padding:0; font:inherit; font-size:14px; font-weight:600; color: var(--azul-oscuro); cursor:pointer; text-decoration:none; white-space:nowrap; }
  .lista-tit .enl:hover { color: var(--azul-hover); }
  .lista-caja { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; margin-bottom:14px; }
  .lista-fila { display:flex; align-items:center; gap:12px; min-height:48px; box-sizing:border-box; width:100%;
    padding:11px 15px; border:0; border-bottom:1px solid var(--linea); text-align:left; font:inherit; background:none; color:inherit; }
  .lista-fila:last-child { border-bottom:none; }
  button.lista-fila, a.lista-fila { cursor:pointer; text-decoration:none; -webkit-tap-highlight-color:transparent; }
  button.lista-fila:hover, a.lista-fila:hover { background: var(--crema); }
  .lista-fila .lf-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .lista-fila .lf-nom { font-size:15px; color: var(--navy); overflow-wrap:anywhere; }
  /* Máximo dos líneas por fila: si hiciera falta una tercera, sería una tarjeta */
  .lista-fila .lf-sub { font-size:14px; color: var(--texto-suave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lista-fila .lf-dato { flex:none; font-family: var(--fuente-dato); font-size:16px; color: var(--navy); }
  .lista-fila .lf-dia { flex:none; width:52px; font-size:15px; font-weight:600; color: var(--navy); font-variant-numeric: tabular-nums; }
  .lista-fila .lf-hora { flex:none; font-size:14px; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .lista-fila .lf-dif { flex:none; width:56px; text-align:right; font-size:14px; color: var(--texto-suave); }
  .lista-fila .lf-dif.mejora { color: var(--verde); font-weight:600; }
  /* «sin marca», nunca un guion: el guion se lee como un dato que falta */
  .lista-fila .lf-sin { flex:none; font-size:15px; color:#C4BCA9; }
  .lista-fila.sin .lf-nom { color: var(--texto-suave); }

  /* Marcas: filtrar entre competición y entrenamiento (las antiguas, sin dato, salen en «Todas»).
     Segmentado: los tres ocupan el ancho y el activo va en navy relleno. */
  .mk-filtro { display:flex; gap:6px; margin:0 0 14px; }
  .mk-f { flex:1 1 0; min-width:0; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 8px; box-sizing:border-box;
    border-radius:10px; border:0; background: var(--crema-banda); color: var(--texto); white-space:nowrap; overflow:hidden;
    font:inherit; font-size:14px; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .mk-f:hover { color: var(--navy); }
  .mk-f .n { font-size:13px; color: var(--texto-suave); }
  .mk-f[aria-pressed="true"] { background: var(--navy); color:#fff; font-weight:600; }
  .mk-f[aria-pressed="true"] .n { color: rgba(255,255,255,.7); }

  /* Un recibo pendiente se marca en el texto, nunca con un bloque de color */
  .lista-fila.pend .lf-sub { color:#8A5307; }

  /* entreno */
  .entreno-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .entreno-cab h2 { margin:0; }
  .fecha-pill { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; background: var(--navy); color:#fff; padding:5px 11px; border-radius:999px; }
  .entreno-titulo { font-size:17px; font-weight:600; color: var(--navy); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-family: var(--fuente-mono); font-size:13px; text-transform:none;  background: var(--crema-media); color: var(--texto-suave); padding:4px 10px; border-radius:999px; }
  .nota { font-size:14px; color: var(--texto); background: var(--crema); border-left:3px solid var(--azul); padding:10px 12px; border-radius:10px; margin:0 0 16px; }
  /* Bloques plegables: en el móvil el entreno entero era una lista larguísima.
     Ahora cada parte (calentamiento, principal, vuelta a la calma) se abre y se cierra. */
  .bloques { display:flex; flex-direction:column; gap:10px; }
  .bloque { border:1px solid var(--linea); border-radius:14px; background: var(--crema); overflow:hidden; }
  .bloque[open] { background:#fff; border-color: var(--linea-borde); }
  /* La cabecera es el botón: 52px de alto, se toca con prisa y con guantes */
  .bl-cab { list-style:none; display:flex; align-items:center; gap:10px; min-height:52px; padding:9px 14px; box-sizing:border-box; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .bl-cab::-webkit-details-marker { display:none; }
  .bl-cab::marker { content:''; }
  .bl-cab:hover { background: var(--crema-media); }
  .bloque[open] .bl-cab { border-bottom:1px solid var(--linea); }
  .bloque[open] .bl-cab:hover { background: var(--crema); }
  .bl-cab:focus-visible { outline:2px solid var(--azul); outline-offset:-2px; }
  .bl-fl { flex:none; width:18px; height:18px; color: var(--azul-oscuro); transition: transform .15s; }
  .bloque[open] .bl-fl { transform: rotate(90deg); }
  .bl-mid { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .bl-tit { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; line-height:1.05; color: var(--navy); }
  .bl-res { font-size:13px; line-height:1.3; color: var(--texto-suave); }
  .bl-prog { flex:none; font-size:13px; line-height:1.1; color: var(--azul-oscuro); background: var(--azul-suave); border-radius:999px; padding:5px 10px; white-space:nowrap; }
  .bl-prog.lleno { background:#e6f4ea; color:#1e7a3d; font-weight:600; }
  .bl-prog[hidden] { display:none; }
  .bl-cuerpo { padding:2px 14px 8px; }
  /* El descanso entre bloques: el separador que faltaba. Si el bloque no lo
     lleva, no se pinta nada — un «—» hace dudar de si falta el dato. */
  .bl-sep { display:flex; align-items:center; gap:10px; padding:2px 6px; }
  .bl-sep i { flex:1; height:1px; background: var(--linea); }
  .bl-sep span { font-size:13px; color: var(--texto-suave); white-space:nowrap; }
  .bl-entre { font-size:13px; color: var(--texto-suave); padding:8px 0 2px; }
  /* Volumen y tiempo, separados: se planifica con el tiempo, no con los metros */
  .ses-cifras { display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .ses-cifra { flex:1 1 0; min-width:120px; background: var(--crema-banda); border-radius:10px; padding:9px 12px; display:flex; flex-direction:column; gap:1px; }
  .ses-cifra b { font-family: var(--fuente-dato); font-weight:700; font-size:17px; color: var(--navy); }
  .ses-cifra span { font-size:13px; color: var(--texto-suave); }
  .fchip.nat { font-weight:600; }

  /* Un ejercicio: su línea de datos y, justo debajo, sus huecos para anotar */
  .ejer { padding:11px 0; border-bottom:1px solid var(--linea); }
  .ejer:last-child { border-bottom:none; }
  .fila { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:0; }
  .fila .ej { font-size:15px; color: var(--navy); font-weight:600; }
  .fila .fparams { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { font-size:13px; color: var(--texto-suave); background: var(--crema-media); padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .fchip.mio { background: var(--azul); color:#fff; font-weight:600; }
  .serie-cap { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:11px 0 7px; }
  .serie-cap b { font-size:14px; font-weight:600; color: var(--navy); }
  .serie-cap span { font-size:14px; color: var(--texto-suave); white-space:nowrap; }
  /* El tiempo se apunta EN LA PROPIA SERIE (maqueta 37c): cada repetición es una
     fila —hecha con su tiempo y su diferencia, la actual con borde azul, las que
     faltan en discontinuo—. Así se ve de un vistazo por dónde vas. */
  .serie-inputs { display:flex; flex-direction:column; gap:8px; padding:0; border:0; margin:0; }
  /* El borde es siempre de 2 px (transparente cuando no toca): así al escribir
     el tiempo la fila no da un salto de un píxel. */
  .serie-hueco { display:flex; align-items:center; gap:13px; margin:0; font-weight:400; box-sizing:border-box;
    min-height:52px; padding:5px 11px; border-radius:12px; background: var(--crema); border:2px solid transparent; }
  .serie-hueco .s-n { flex:none; width:22px; font-family: var(--fuente-dato); font-size:14px; color: var(--texto-suave); }
  /* Los tiempos por serie se comparan en columna: van en monoespaciada */
  .serie-in { flex:1 1 auto; min-width:0; box-sizing:border-box; min-height:40px; padding:6px 0; border:0; background:none;
    font-size:21px; font-weight:700; font-family: var(--fuente-dato); color: var(--navy); }
  .serie-in::placeholder { color: var(--texto-suave); font-weight:400; font-size:15px; font-family: var(--fuente-texto); }
  .serie-in:focus { outline:none; }
  .serie-hueco .s-dif { flex:none; font-size:14px; color: var(--texto-suave); white-space:nowrap; }
  .serie-hueco .s-dif.mejora { color: var(--verde); font-weight:600; }
  .serie-hueco .s-dif.peor { color:#B0563A; }
  /* pendiente: ni fondo ni peso, solo el hueco marcado en discontinuo */
  .serie-hueco.pendiente { background:none; border:2px dashed var(--linea); }
  .serie-hueco.pendiente .s-n, .serie-hueco.pendiente .serie-in::placeholder { color: var(--texto-suave); }
  /* la que toca ahora */
  .serie-hueco.actual { background:#fff; border-color: var(--azul); }
  .serie-hueco.actual .serie-in::placeholder { color: var(--azul-oscuro); font-weight:600; }
  .serie-hueco:focus-within { border-color: var(--azul); border-style:solid; }
  .fb-sucio { font-size:13px; color:#B96F09; }
  .fb-sucio[hidden] { display:none; }
  .chip.personal { background: var(--azul-suave); color: var(--azul-oscuro); font-weight:700; }

  /* semana: tira de días y navegación */
  .sem-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .sem-cab h2 { margin:0; }
  .sem-nav { display:flex; gap:6px; flex-wrap:wrap; }
  /* 44px de alto: son botones que se tocan con prisa */
  .sem-btn { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; min-height:44px; padding:8px 14px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); cursor:pointer; line-height:1; display:inline-flex; align-items:center; }
  .sem-btn:hover { border-color: var(--azul); color: var(--navy); }
  .sem-btn.ahora { border-color: var(--azul); color: var(--azul-oscuro); font-weight:700; }
  .sem-rango { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); margin:10px 0 8px; }
  .dias { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .dias.cargando { opacity:.45; }
  .dia { flex:1 1 0; min-width:58px; min-height:78px; box-sizing:border-box; font:inherit; -webkit-appearance:none; appearance:none; background: var(--crema); border:1px solid var(--linea); border-radius:10px; padding:8px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .dia:hover { border-color: var(--azul); }
  .dia .d-nom { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); }
  .dia .d-num { font-family: var(--fuente-titulo); font-size:21px; font-weight:700; line-height:1; color: var(--navy); }
  .dia .d-tipo { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .dia .d-punto { width:7px; height:7px; border-radius:50%; background: var(--azul); }
  .dia .d-punto.personal { background: var(--navy); }
  .dia.vacio { background:#fff; }
  .dia.vacio .d-num { color: var(--texto-suave); font-weight:600; }
  .dia.vacio .d-tipo { color: var(--texto-suave); }
  .dia.hoy { border-color: var(--azul); border-width:2px; padding:7px 3px; }
  .dia.hoy .d-nom { color: var(--azul-oscuro); font-weight:700; }
  .dia.sel { background: var(--navy); border-color: var(--navy); box-shadow: var(--sombra-suave); }
  .dia.sel .d-nom, .dia.sel .d-num, .dia.sel .d-tipo { color:#fff; }
  .dia.sel .d-punto, .dia.sel .d-punto.personal { background:#fff; }
  .dia.hoy.sel { border-color: var(--azul); }

  /* ---- INICIO (maqueta 37b) · pantalla de consulta:
         crema con UNA sola tarjeta navy, la del entreno de hoy. ---- */
  /* Franja ámbar: recibo pendiente. Desaparece si está al día.
     Lleva icono y fondo ámbar suave: así el ámbar de aviso no se confunde
     con el ámbar de marca del club (la medalla del rango, aquí debajo). */
  .franja { display:flex; align-items:center; flex-wrap:wrap; gap:6px 11px; background: var(--ambar-fondo); border:1px solid var(--ambar-borde); border-radius:10px; padding:11px 13px; margin-bottom:11px; min-height:48px; box-sizing:border-box; cursor:pointer; }
  .franja .fr-ic { flex:none; width:20px; height:20px; color:#B96F09; display:flex; }
  .franja .fr-ic svg { width:20px; height:20px; }
  /* El texto manda; si la acción es larga, baja a su propia línea a la derecha
     en vez de estrangular el aviso a cuatro palabras por renglón. */
  .franja .fr-txt { flex:1 1 200px; min-width:0; font-size:14px; line-height:1.4; color:#6B5227; }
  .franja .fr-acc { flex:none; margin-left:auto; font-size:14px; font-weight:600; color:#8A5307; }
  .franja.azul { background: var(--azul-suave); border-color:#CFE2F1; }
  .franja.azul .fr-ic { color: var(--azul-oscuro); }
  .franja.azul .fr-txt { color: var(--navy); }
  .franja.azul .fr-acc { color: var(--azul-oscuro); }

  /* La tarjeta navy: es el ancla de la pantalla. Sin sombra (no se pulsa
     entera: lo que se pulsa es el botón azul de dentro). */
  .hoy-card { background: var(--navy); border-radius:14px; padding:18px 20px; color:#fff; display:flex; flex-direction:column; gap:13px; margin-bottom:11px; }
  .hoy-card .hc-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hoy-card .hc-grupo { font-size:14px; color: rgba(255,255,255,.62); }
  /* La hora del entreno: cifra de ancho fijo, en el azul claro del sistema */
  .hoy-card .hc-hora { font-size:15px; font-weight:600; font-variant-numeric: tabular-nums; color:#8FC0E8; white-space:nowrap; }
  .hoy-card .hc-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:38px; line-height:.96; color:#fff; margin:0; text-transform: uppercase; }
  .hoy-card .hc-det { font-size:15px; color: rgba(255,255,255,.75); margin-top:4px; }
  /* Los nombres propios del club (La Tribu, Madre Tierra, El Cubo) van en ámbar */
  .hoy-card .hc-det .propio { color:#E0A33C; }
  .hoy-card .hc-cifras { display:flex; gap:8px; }
  .hoy-card .hc-cifra { flex:1 1 0; min-width:0; background: rgba(255,255,255,.12); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:1px; }
  /* Series, ritmo y recuperación: cifras que se comparan de un día para otro */
  .hoy-card .hc-cifra b { font-family: var(--fuente-dato); font-weight:600; font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hoy-card .hc-cifra span { font-size:13px; color: rgba(255,255,255,.6); }
  /* Un solo botón azul por pantalla, y es este */
  .hoy-card .hc-cta { width:100%; box-sizing:border-box; background: var(--azul); color:#fff; border:0; border-radius:999px; min-height:52px; padding:14px; font:inherit; font-weight:600; font-size:16px; cursor:pointer; }
  .hoy-card .hc-cta:hover { background:#4C93CB; }
  .hoy-card .hc-ok { width:100%; min-height:44px; background:none; border:0; padding:0; font:inherit; font-size:15px; font-weight:600; color:#8FC0E8; cursor:pointer; margin-top:-4px; }
  .hoy-card .hc-ok:hover { color:#fff; }
  .hoy-card .hc-ok.hecho { color:#7FC08D; }

  /* Fila del rango: la medalla en ámbar y, debajo, lo que falta para el siguiente */
  .rango-fila { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left; font:inherit;
    background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; padding:13px 15px; min-height:48px; margin-bottom:11px;
    text-decoration:none; cursor:pointer; box-shadow: var(--sombra-suave); -webkit-tap-highlight-color:transparent; }
  .rango-fila:hover { border-color: var(--azul); }
  .rango-fila .rg-med { flex:none; width:38px; height:38px; border-radius:999px; background:#F6EBD6; border:2px solid #E0A33C;
    display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:14px; color:#8A5307; }
  .rango-fila .rg-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .rango-fila .rg-nom { font-size:15px; color: var(--navy); }
  .rango-fila .rg-falta { font-size:14px; color:#8A5307; }
  .rango-fila .rg-chev { flex:none; color: var(--texto-suave); font-size:18px; line-height:1; }

  /* Dos tarjetas: próxima carrera y última marca */
  .minis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .mini { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:13px 15px; display:flex; flex-direction:column; gap:3px; text-decoration:none; cursor:pointer; min-height:48px; }
  .mini:hover { border-color: var(--azul); }
  .mini .mi-et { font-size:13px; color: var(--texto-suave); }
  .mini .mi-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:20px; line-height:1; text-transform:uppercase; color: var(--navy); overflow-wrap:anywhere; }
  /* Una marca es un dato que se compara: va en monoespaciada, no en condensada */
  .mini .mi-tit.dato { font-family: var(--fuente-dato); font-size:20px; text-transform:none; }
  .mini .mi-pie { font-size:14px; color: var(--texto-suave); }
  .mini .mi-pie.bien { color: var(--verde); font-weight:600; }
  .mini .mi-pie.pronto { color:#B0563A; }

  .hoy-vacio { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(22px,4vw,30px) 20px; text-align:center; margin-bottom:14px; }
  .hoy-vacio .luna { width:58px; height:58px; border-radius:999px; background: var(--crema-media); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .hoy-vacio .luna svg { width:28px; height:28px; }
  .hoy-vacio h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; color: var(--navy); margin:0 0 8px; }
  .hoy-vacio p { color: var(--texto-suave); font-size:14px; margin:0 0 16px; }
  .hoy-vacio .btn { min-height:44px; display:inline-flex; align-items:center; }

  /* ---- MÁS (maqueta 22b): perfil y tres bloques ---- */
  .ml-perfil { display:flex; align-items:center; gap:12px; background: var(--crema-banda); border-radius:14px; padding:12px 16px; margin-bottom:14px; }
  .ml-avatar { flex:none; width:40px; height:40px; border-radius:999px; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:15px; }
  .ml-quien { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .ml-quien b { font-size:15px; font-weight:600; color: var(--navy); }
  .ml-quien span { font-size:14px; color: var(--texto-suave); }
  .ml-bloque { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .ml-tit { font-size:14px; color: var(--texto-suave); padding-left:4px; }
  .ml-caja { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; }
  .ml-fila { display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:52px; box-sizing:border-box; border-bottom:1px solid #F4EFE4; text-decoration:none; color: var(--navy); }
  .ml-fila:last-child { border-bottom:none; }
  .ml-fila[href], .ml-fila[data-sec-ir], .ml-fila.salir { cursor:pointer; }
  .ml-fila[href]:hover, .ml-fila[data-sec-ir]:hover, .ml-fila.salir:hover { background: var(--crema); }
  .ml-fila .ml-txt { flex:1; min-width:0; font-size:15px; color: var(--navy); }
  /* El chevron nunca va en azul: en azul se lee como un enlace aparte de la fila */
  .ml-fila .ml-chev { flex:none; font-size:18px; color: var(--texto-suave); line-height:1; }
  .ml-fila .ml-dato { flex:none; font-size:13px; color: var(--texto-suave); text-align:right; }
  .ml-fila .ml-dato.pend { font-family: var(--fuente-mono); font-size:13px; color:#B96F09; font-weight:600; }
  .ml-fila .ml-num { flex:none; background: var(--navy); color:#fff; font-family: var(--fuente-dato); font-size:13px; border-radius:999px; padding:3px 9px; }
  .ml-fila.salir .ml-txt { color:#B0563A; font-weight:600; }

  .enlace-accion { background:none; border:0; padding:0; font:inherit; font-weight:600; font-size:14px; color: var(--azul-oscuro); cursor:pointer; min-height:44px; display:inline-flex; align-items:center; }
  .enlace-accion:hover { color: var(--azul-hover); }

  /* Puntuar con fichas tocables en vez de dos desplegables fríos */
  .escala-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:14px 0 7px; }
  .escala-tit b { font-size:14px; font-weight:600; color: var(--navy); }
  .escala-tit span { font-size:13px; color: var(--texto-suave); }
  .escala { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  @media (min-width:560px){ .escala { grid-template-columns:repeat(10,1fr); } }
  .escala .esc { min-height:44px; font:inherit; font-size:15px; font-weight:600; color: var(--texto-suave); background:#fff; border:1px solid var(--linea-borde); border-radius:10px; cursor:pointer; padding:0; }
  .escala .esc:hover { border-color: var(--azul); color: var(--navy); }
  .escala .esc.sel { background: var(--azul); border-color: var(--azul); color:#fff; }
  .fb-mas { margin-top:16px; min-height:44px; display:inline-flex; align-items:center; gap:8px; background:none; border:0; padding:0; font:inherit; font-size:14px; font-weight:600; color: var(--azul-oscuro); cursor:pointer; }
  .fb-mas:hover { color: var(--azul-hover); }
  .fb-mas .fl { transition: transform .15s; display:inline-block; }
  .fb-mas.abierto .fl { transform: rotate(90deg); }
  .fb-detalles[hidden] { display:none; }
  .fb-detalles { border-top:1px solid var(--linea); margin-top:12px; padding-top:4px; }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; }
  .rango { display:flex; align-items:center; gap:10px; }
  .rango output { font-family: var(--fuente-dato); font-weight:700; color: var(--navy); min-width:26px; text-align:center; }

  /* ============================================================
     MODO TRABAJO (maqueta 37a y 37c) · el entreno es pantalla propia
     ------------------------------------------------------------
     Navy de arriba abajo, no solo la cabecera: cambia el registro y se
     lee al sol. Sin barra de pestañas —estás de pie en la pista y se
     pulsa sin querer— y con «Salir» arriba. Botones de 52 px.
     ============================================================ */
  body.trabajo { background:#22303D; }
  .tb-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .tb-cab .tb-quien { display:block; font-size:14px; color: rgba(255,255,255,.6); margin-bottom:3px; }
  .tb-cab .tb-quien .propio { color:#E0A33C; }
  .tb-cab h1 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:30px; line-height:1; color:#fff; margin:0; }
  .tb-salir { flex:none; min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; padding:0 16px;
    border-radius:999px; border:1px solid rgba(255,255,255,.35); background:none; color:#fff; font:inherit; font-size:14px; line-height:1; cursor:pointer; }
  .tb-salir:hover { background: rgba(255,255,255,.12); }

  body.trabajo .side nav { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
  body.trabajo .side nav a { color: rgba(255,255,255,.7); }
  body.trabajo .side nav a:hover { background: rgba(255,255,255,.1); color:#fff; }
  body.trabajo .side nav a.activo { color:#fff; border-bottom-color:#8FC0E8; }

  body.trabajo .tarjeta { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
  body.trabajo .tarjeta h2, body.trabajo .entreno-titulo { color:#fff; }
  body.trabajo .fecha-pill { background: rgba(255,255,255,.14); color:#fff; }
  body.trabajo .chip { background: rgba(255,255,255,.12); color: rgba(255,255,255,.78); }
  body.trabajo .chip.personal { background: rgba(143,192,232,.2); color:#8FC0E8; }
  body.trabajo .nota { background: rgba(255,255,255,.07); border-left-color:#8FC0E8; color: rgba(255,255,255,.78); }
  body.trabajo .vacio { color: rgba(255,255,255,.6); }

  body.trabajo .sem-rango { color: rgba(255,255,255,.62); }
  body.trabajo .sem-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); color:#fff; }
  body.trabajo .sem-btn:hover { border-color:#8FC0E8; }
  body.trabajo .sem-btn.ahora { border-color:#8FC0E8; color:#8FC0E8; }
  body.trabajo .dia { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); }
  body.trabajo .dia .d-nom, body.trabajo .dia .d-tipo { color: rgba(255,255,255,.6); }
  body.trabajo .dia .d-num { color:#fff; }
  body.trabajo .dia .d-punto { background:#8FC0E8; }
  body.trabajo .dia.vacio { background:none; border-style:dashed; }
  body.trabajo .dia.vacio .d-num { color: rgba(255,255,255,.5); }
  body.trabajo .dia.hoy { border-color:#8FC0E8; }
  body.trabajo .dia.hoy .d-nom { color:#8FC0E8; }
  body.trabajo .dia.sel { background:#fff; border-color:#fff; }
  body.trabajo .dia.sel .d-nom, body.trabajo .dia.sel .d-tipo { color: var(--texto-suave); }
  body.trabajo .dia.sel .d-num { color: var(--navy); }
  body.trabajo .dia.sel .d-punto { background: var(--azul-oscuro); }

  body.trabajo .bloque { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.14); }
  body.trabajo .bloque[open] { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
  body.trabajo .bl-cab:hover, body.trabajo .bloque[open] .bl-cab:hover { background: rgba(255,255,255,.06); }
  body.trabajo .bloque[open] .bl-cab { border-bottom-color: rgba(255,255,255,.14); }
  body.trabajo .bl-fl { color:#8FC0E8; }
  body.trabajo .bl-tit { color:#fff; }
  body.trabajo .bl-res { color: rgba(255,255,255,.6); }
  body.trabajo .bl-prog { background: rgba(143,192,232,.18); color:#8FC0E8; }
  body.trabajo .bl-prog.lleno { background: rgba(127,192,141,.2); color:#7FC08D; }
  body.trabajo .ejer { border-bottom-color: rgba(255,255,255,.12); }
  body.trabajo .bl-sep i { background: rgba(255,255,255,.16); }
  body.trabajo .bl-sep span, body.trabajo .bl-entre { color: rgba(255,255,255,.55); }
  body.trabajo .ses-cifra { background: rgba(255,255,255,.1); }
  body.trabajo .ses-cifra b { color:#fff; }
  body.trabajo .ses-cifra span { color: rgba(255,255,255,.6); }
  body.trabajo .fila .ej { color:#fff; }
  body.trabajo .fchip { background: rgba(255,255,255,.1); color: rgba(255,255,255,.72); }
  body.trabajo .fchip.mio { background: rgba(143,192,232,.22); color:#8FC0E8; }
  body.trabajo .serie-cap b { color:#fff; }
  body.trabajo .serie-cap span { color: rgba(255,255,255,.6); }
  body.trabajo .serie-hueco { background: rgba(255,255,255,.07); border-color: transparent; }
  body.trabajo .serie-hueco .s-n { color: rgba(255,255,255,.5); }
  body.trabajo .serie-in { color:#fff; }
  body.trabajo .serie-in::placeholder { color: rgba(255,255,255,.4); }
  body.trabajo .serie-hueco .s-dif { color: rgba(255,255,255,.5); }
  body.trabajo .serie-hueco .s-dif.mejora { color:#7FC08D; }
  body.trabajo .serie-hueco .s-dif.peor { color:#E8A48C; }
  body.trabajo .serie-hueco.pendiente { background:none; border:2px dashed rgba(255,255,255,.25); }
  body.trabajo .serie-hueco.pendiente .s-n { color: rgba(255,255,255,.35); }
  body.trabajo .serie-hueco.actual { background: rgba(255,255,255,.14); border-color: var(--azul); border-style:solid; }
  body.trabajo .serie-hueco.actual .serie-in::placeholder { color:#8FC0E8; }

  body.trabajo .escala-tit b { color:#fff; }
  body.trabajo .escala-tit span, body.trabajo label { color: rgba(255,255,255,.62); }
  body.trabajo .escala .esc { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.75); }
  body.trabajo .escala .esc.sel { background: var(--azul); border-color: var(--azul); color:#fff; }
  body.trabajo input, body.trabajo select, body.trabajo textarea { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.22); color:#fff; }
  body.trabajo .fb-mas, body.trabajo .enlace-accion { color:#8FC0E8; }
  body.trabajo .fb-detalles { border-top-color: rgba(255,255,255,.14); }
  body.trabajo .msg.ok { color:#7FC08D; }
  body.trabajo .msg.error { color:#E8A48C; }
  body.trabajo .fb-sucio { color:#E0A33C; }
  /* Estados compartidos del kit, en su versión oscura */
  body.trabajo .ap-vacio { background: rgba(255,255,255,.07); }
  body.trabajo .ap-vacio b { color:#fff; }
  body.trabajo .ap-vacio p { color: rgba(255,255,255,.7); }
  body.trabajo .ap-vacio .ap-btn { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.3); color:#fff; }
  body.trabajo .ap-esq .ap-l { background: rgba(255,255,255,.1); }
  body.trabajo .ap-esq .ap-fila { border-bottom-color: rgba(255,255,255,.12); }
  /* Los botones se agrandan a 52 px: se pulsan de pie y con prisa */
  body.trabajo .acciones .btn { min-height:52px; display:inline-flex; align-items:center; }

  /* --- Barra inferior única (maqueta 22c): Inicio · Entreno · Calendario · Marcas · Más.
         Iconos de línea de 24 px sin relleno; el activo se distingue por color y peso,
         no por una píldora de fondo. Objetivos táctiles de 48 px. --- */
  .tabbar { display:none; }
  @media (max-width:760px){
    /* En columna hay que estirar: si no, la columna se ajusta al contenido y sobresale */
    .layout { flex-direction:column; align-items:stretch; gap:0; }
    .cont { width:100%; }
    .side { display:none; }                  /* en móvil manda la barra de abajo */
    body { padding-bottom:88px; }            /* hueco para la barra fija */
    /* En modo trabajo no hay barra de pestañas: tampoco hace falta el hueco */
    body.trabajo { padding-bottom:26px; }
    .graficos { grid-template-columns:1fr; }
    .grid2 { grid-template-columns:1fr; }
    .tabbar { display:flex; align-items:stretch; position:fixed; left:0; right:0; bottom:0; z-index:600;
      background:rgba(251,249,244,.96); -webkit-backdrop-filter:saturate(1.3) blur(10px); backdrop-filter:saturate(1.3) blur(10px);
      border-top:1px solid var(--linea); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); }
    .tabbar a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
      min-height:48px; text-decoration:none; color: var(--texto-suave);
      font-size:11px;  text-transform:none; -webkit-tap-highlight-color:transparent; }
    .tabbar a .ic { width:24px; height:24px; }
    /* El activo cambia de color, nunca engorda el trazo del icono: el trazo es
       siempre de 1,9 px, esté encendida la pestaña o no. */
    .tabbar a.activo { color:#2F6FA8; }
    .tabbar a.activo span { font-weight:600; }
    .tabbar a.activo .ic { stroke-width:1.9; }
  }
</style>

<body>

<div id="portal-contenido">
  <div class="at-wrap" id="at-wrap"><div class="ap-esq" data-esq="tarjeta"></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('at-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) {
    wrap.innerHTML = APOLANA_UI.vacio('No encontramos tu ficha',
      'Tu cuenta está bien, pero todavía no la vemos unida a ninguna ficha del club. Escríbenos y la enlazamos en un momento.',
      APOLANA_UI.boton('Escribir al club', '../../contacto/'));
    return;
  }

  // ---------- helpers ----------
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){ var p=s.split(':'); if(p.length>=3) return (parseInt(p[0],10)||0)*3600+(parseInt(p[1],10)||0)*60+(parseFloat(p[2])||0); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); } var n=parseFloat(s); return isNaN(n)?null:n; }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function fechaLarga(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], me=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function iniciales(nom,ape){ var a=(nom||'').trim().charAt(0), b=(ape||'').trim().charAt(0); return ((a+b)||'·').toUpperCase(); }
  function eur(n){ var v=parseFloat(n); return (isNaN(v)?0:v).toFixed(2).replace('.',',')+' €'; }

  // ---------- fechas: semana de lunes a domingo ----------
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  function addDias(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  // Lunes de la semana de esa fecha (el domingo cuenta como final de su semana, no como principio)
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  function difDias(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }

  // ¿La prueba mide distancia (salto/lanzamiento)? Entonces MÁS es mejor.
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+me[d.getMonth()]; }
  function graficoPrueba(nombre, pts, masMejor, idx){
    var W=340,H=172,padL=14,padR=14,padT=38,padB=28;
    var ys=pts.map(function(p){return p.y;});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    var span=(max-min)||Math.max(Math.abs(max)*0.1,1); var lo=min-span*0.22, hi=max+span*0.22;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    function X(i){ return padL+(pts.length===1?plotW/2:plotW*i/(pts.length-1)); }
    function Y(v){ var t=(v-lo)/(hi-lo); return padT+plotH*(masMejor?(1-t):t); }
    var bestI=0; for(var b=1;b<pts.length;b++){ if(masMejor?pts[b].y>pts[bestI].y:pts[b].y<pts[bestI].y) bestI=b; }
    var gid='grad'+(idx||0);
    var grid=''; for(var g=0;g<=2;g++){ var gy=(padT+plotH*g/2).toFixed(1); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--linea)" stroke-width="1.9" stroke-dasharray="2 5"></line>'; }
    var coords=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.y).toFixed(1);});
    var area='M'+padL+','+(padT+plotH).toFixed(1)+' L'+coords.join(' L')+' L'+(W-padR)+','+(padT+plotH).toFixed(1)+' Z';
    var puntos=pts.map(function(p,i){ var x=X(i),y=Y(p.y); var best=(i===bestI&&pts.length>1);
      return (best?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="var(--azul)" opacity="0.16"></circle>':'')+
        '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(best?4.3:3)+'" fill="'+(best?'var(--azul-oscuro)':'#fff')+'" stroke="var(--azul)" stroke-width="1.9"></circle>'+
        '<text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(best?'var(--azul-oscuro)':'var(--navy)')+'">'+esc(p.disp)+'</text>'+
        '<text x="'+x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="8.5" fill="#9a958c">'+esc(fechaCorta(p.fecha))+'</text>';
    }).join('');
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de '+esc(nombre)+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--azul)" stop-opacity="0.28"></stop><stop offset="1" stop-color="var(--azul)" stop-opacity="0"></stop></linearGradient></defs>'+
      grid+'<path d="'+area+'" fill="url(#'+gid+')"></path>'+
      '<polyline fill="none" stroke="var(--azul)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" points="'+coords.join(' ')+'"></polyline>'+puntos+
      '<text x="'+padL+'" y="19" font-size="12.5" font-weight="700" fill="var(--navy)">'+esc(nombre)+'</text>'+
      '<text x="'+(W-padR)+'" y="19" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--azul-oscuro)">MMP '+esc(pts[bestI].disp)+'</text></svg>';
    var mej = masMejor ? (pts[pts.length-1].y - pts[0].y) : (pts[0].y - pts[pts.length-1].y);
    var u = masMejor ? ' m' : '', ley='';
    if(mej>0.001) ley='<span class="mejora">▲ '+mej.toFixed(2)+u+' mejor que al empezar</span>';
    else if(mej<-0.001) ley='▼ '+Math.abs(mej).toFixed(2)+u+' respecto al inicio';
    return '<div class="grafico">'+svg+(ley?'<div class="leyenda">'+ley+'</div>':'')+'</div>';
  }

  // ---- Ritmos personales: un "90%" se convierte en TU tiempo, según tu mejor marca ----
  var MMP = {};   // { 'nombre de prueba': {seg: 7.85, disp:'7.85'} }
  function segATexto(s){
    if(s==null||isNaN(s)) return '';
    if(s<60) return s.toFixed(2);                       // 7.85
    if(s<3600){                                          // 4:33.00
      var m=Math.floor(s/60), r=s-m*60;
      return m+':'+(r<10?'0':'')+r.toFixed(2);
    }
    var h=Math.floor(s/3600), mm=Math.floor((s-h*3600)/60), ss=Math.round(s-h*3600-mm*60);
    if(ss===60){ ss=0; mm++; }                           // 3:35:00 (maratón, ultras…)
    return h+':'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  }
  // Busca la mejor marca del atleta para la distancia de una fila (p. ej. "60 m" -> "60 m lisos")
  function mmpParaDistancia(dist){
    if(!dist) return null;
    var m=String(dist).match(/(\d[\d.,]*)\s*m/i); if(!m) return null;
    var metros=m[1].replace(/[.,]/g,'');
    var mejor=null;
    Object.keys(MMP).forEach(function(prueba){
      var pm=prueba.match(/(\d[\d.,]*)\s*m/i); if(!pm) return;
      if(pm[1].replace(/[.,]/g,'')===metros && (!mejor || MMP[prueba].seg<mejor.seg)) mejor=MMP[prueba];
    });
    return mejor;
  }
  // De "90%" o "90-95%" saca el tiempo objetivo. Menos % = más lento (tiempo = mmp / (%/100)).
  function ritmoPersonal(f){
    var r=f.ritmo; if(!r) return '';
    var pcts=String(r).match(/(\d{2,3})\s*%/g); if(!pcts||!pcts.length) return '';
    var base=mmpParaDistancia(f.distancia); if(!base) return '';
    var nums=pcts.map(function(p){ return parseFloat(p); }).filter(function(n){ return n>=40&&n<=110; });
    if(!nums.length) return '';
    var tiempos=nums.map(function(p){ return base.seg/(p/100); }).sort(function(a,b){ return a-b; });
    return tiempos.length>1 ? segATexto(tiempos[0])+'–'+segATexto(tiempos[tiempos.length-1]) : segATexto(tiempos[0]);
  }

  function esSerie(f){ var n=parseInt(f.series,10); return (n>0 && n<=30)?n:0; }
  // Para meter texto dentro de un atributo: esc() no toca las comillas y un nombre
  // como 3x300 "al 90%" rompería el data-eje que usa el guardado.
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
  /* Módulo compartido de descansos: es quien escribe «rec 2' trote», «salida 1'00"»
     o «desc. 2'» según la disciplina, para que las cinco pantallas digan lo mismo.
     Si por lo que sea no ha cargado, se sigue pintando con lo de siempre. */
  function DESC(){ return window.APOLANA_DESCANSOS || null; }
  function disciplinaDe(s){
    var D=DESC(); if(!D) return null;
    try { return D.disciplinaDe(s, GRUPO); } catch(e){ return null; }
  }
  /* Las piezas de una fila: serie, ritmo y recuperación. La recuperación no es
     un adorno, define la sesión: 6×800 con 90" no tiene nada que ver con 6×800
     con 3'. Si un bloque no lleva descanso, la pieza no se pinta (nunca un «—»). */
  function piezasFila(f, dis){
    var D=DESC();
    if(D && dis){ try { return D.partesFila(f, dis)||[]; } catch(e){} }
    var p=[];
    if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
    else if(f.series) p.push(f.series+' series'); else if(f.distancia) p.push(String(f.distancia));
    if(f.ritmo) p.push('ritmo '+f.ritmo);
    if(f.descanso) p.push('rec. '+f.descanso);
    return p;
  }
  /* En natación «salida cada X» y «descanso de X» son cosas distintas y se
     confunden: el módulo da la palabra y el color de cada una. */
  function chipNatacion(f, dis){
    var D=DESC(); if(!D || dis!=='natacion') return '';
    var et=null;
    try { et=D.etiquetaNatacion(D.recDeFila(f, dis)); } catch(e){ return ''; }
    if(!et) return '';
    return '<span class="fchip nat" title="'+escA(et.ayuda||'')+'" style="color:'+et.color+';background:'+et.fondo+';border:1px solid '+et.borde+'">'+
           esc(et.texto)+' '+esc(et.valor)+'</span>';
  }
  function filaHTML(f, key, dis){
    var main=esc(f.ejercicio||f.nombre||''); var parts=piezasFila(f, dis).slice();
    if(f.tiempo) parts.push(String(f.tiempo));
    if(f.detalle) parts.push(String(f.detalle));
    if(f.nota) parts.push(String(f.nota));
    var chips=parts.map(function(p){return '<span class="fchip">'+esc(p)+'</span>';}).join('');
    chips+=chipNatacion(f, dis);
    var tuyo=ritmoPersonal(f);
    if(tuyo) chips+='<span class="fchip mio" title="Calculado con tu mejor marca">tú: '+esc(tuyo)+'</span>';
    var html='<div class="fila"><span class="ej">'+main+'</span><span class="fparams">'+chips+'</span></div>';
    var n=esSerie(f);
    // Una fila por repetición: la hecha con su tiempo, la que toca marcada y las
    // que faltan en discontinuo. Se ve de un vistazo por dónde vas.
    if(n>0){
      var ins='';
      for(var i=0;i<n;i++){
        ins+='<label class="serie-hueco pendiente"><span class="s-n">'+(i+1)+'</span>'+
             '<input class="serie-in" data-key="'+key+'" data-i="'+i+'" inputmode="decimal" '+
             'placeholder="pendiente" aria-label="Serie '+(i+1)+' de '+n+' de '+escA(f.ejercicio||f.nombre||'')+'">'+
             '<span class="s-dif" aria-hidden="true"></span></label>';
      }
      var obj=tuyo && tuyo.indexOf('–')===-1 ? tuyo : '';
      html+='<div class="serie-cap"><b>Tus tiempos</b><span class="serie-cnt">0 de '+n+'</span></div>'+
            '<div class="serie-inputs" data-eje="'+escA(f.ejercicio||f.nombre||'')+'"'+
            (obj?' data-obj="'+escA(obj)+'"':'')+'>'+ins+'</div>';
    }
    return '<div class="ejer">'+html+'</div>';
  }
  // Lo que se lee en la cabecera de un bloque cerrado: cuánto hay y de qué va
  function resumenBloque(b, dis){
    var filas=(b.filas||[]); var p=[];
    if(b.matiz) p.push(String(b.matiz));
    if(!filas.length) return p.length?p.join(' · '):'Por definir';
    p.push(filas.length===1?'1 ejercicio':filas.length+' ejercicios');
    var f=null; filas.forEach(function(x){ if(!f && esSerie(x)) f=x; });
    if(f){
      var pi=piezasFila(f, dis);
      if(pi.length) p.push(pi[0]);
      // La recuperación va siempre en el resumen: es lo que de verdad define la sesión
      var D=DESC();
      if(D && dis){ try { var r=D.textoRec(D.recDeFila(f, dis), dis); if(r) p.push(r); } catch(e){} }
      else if(f.descanso) p.push('rec. '+f.descanso);
    }
    return p.join(' · ');
  }
  // Qué bloques quedan abiertos: lo que dejó el atleta la última vez y, si es la
  // primera, la parte principal (o el primer bloque si ninguno se llama así).
  function claveBloques(sid){ return 'apolana.entreno.bloques.'+sid; }
  function bloquesAbiertos(s, bloques){
    var g=null;
    try { var raw=window.localStorage.getItem(claveBloques(s.id)); if(raw) g=JSON.parse(raw); } catch(e){}
    if(Array.isArray(g)) return function(i){ return g.indexOf(i)>-1; };
    var pri=-1;
    bloques.forEach(function(b,i){ if(pri<0 && /principal/i.test(b.etiqueta||'')) pri=i; });
    if(pri<0) pri=0;
    return function(i){ return i===pri; };
  }
  function recordarBloques(caja){
    if(!caja) return;
    var sid=caja.getAttribute('data-sid'); if(!sid) return;
    var ab=[];
    caja.querySelectorAll('.bloque').forEach(function(d){ if(d.open) ab.push(parseInt(d.getAttribute('data-b'),10)); });
    try { window.localStorage.setItem(claveBloques(sid), JSON.stringify(ab)); } catch(e){}
  }
  var FLECHA='<svg class="bl-fl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  /* Volumen y tiempo, separados: «2.000 m» y «~55'». Las familias y los atletas
     planifican con el tiempo, no con los metros. Si el módulo no puede saber la
     duración, se enseña solo el volumen: no se inventa. */
  function cifrasSesionResumen(s, dis){
    var D=DESC(); if(!D) return [];
    var r=null;
    try { r=D.resumen(s, { disciplina: dis, grupo: GRUPO }); } catch(e){ return []; }
    if(!r) return [];
    var out=[];
    if(r.volumen) out.push({ v: r.volumen, l: r.volumen_parcial ? 'volumen (parte)' : 'volumen' });
    if(r.tiempo)  out.push({ v: r.tiempo,  l: r.estimado ? 'tiempo estimado' : 'duración' });
    return out;
  }
  function renderEntreno(s, todayISO){
    var esHoy=s.fecha===todayISO; var fechaTxt=(esHoy?'Hoy · ':'')+formatFecha(s.fecha);
    var dis=disciplinaDe(s);
    var chips=[s.tipo,(s.rol||'').replace(/_/g,' ')].filter(Boolean).map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('');
    if(s.atletas_ids) chips='<span class="chip personal" title="Este entreno lo ha preparado tu entrenador solo para ti">Solo para ti</span>'+chips;
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var abierto=bloquesAbiertos(s, bloques);
    var D=DESC();
    var bloquesHtml=bloques.map(function(b,bi){
      var filas=(b.filas||[]).map(function(f,fi){return filaHTML(f,'b'+bi+'f'+fi,dis);}).join('')||'<div class="ejer"><div class="fila"><span class="ej vacio">Por definir</span></div></div>';
      var entreEj='';
      if(D){ try { entreEj=D.textoEntreEjercicios(b)||''; } catch(e){} }
      var det='<details class="bloque" data-b="'+bi+'"'+(abierto(bi)?' open':'')+'>'+
        '<summary class="bl-cab">'+FLECHA+
          '<span class="bl-mid"><span class="bl-tit">'+esc(b.etiqueta||'Bloque')+'</span>'+
          '<span class="bl-res">'+esc(resumenBloque(b, dis))+'</span></span>'+
          '<span class="bl-prog" hidden></span>'+
        '</summary>'+
        '<div class="bl-cuerpo">'+filas+
        (entreEj?'<div class="bl-entre">'+esc(entreEj)+'</div>':'')+'</div></details>';

    function escala(destino, sel){

      return '<div class="escala" role="group">'+f+'</div>'+
             '<input type="hidden" class="'+destino+'" value="'+esc(sel!=null?sel:'')+'">';
    }
    var hayDetalles = !!(reg && (reg.como_me_siento||reg.molestias||reg.notas_atleta||reg.horas_sueno!=null||reg.peso_kg!=null));

      '<div class="escala-tit"><b>Sensación general</b><span>1 fatal · 10 genial</span></div>'+
      escala('fb-sensacion', reg&&reg.sensacion_general)+
      '<div class="escala-tit"><b>Esfuerzo (RPE)</b><span>1 muy suave · 10 al límite</span></div>'+
      escala('fb-rpe', reg&&reg.rpe)+
      '<button type="button" class="fb-mas'+(hayDetalles?' abierto':'')+'" aria-expanded="'+(hayDetalles?'true':'false')+'"><span class="fl">&rsaquo;</span>Añadir detalles</button>'+

          '<div><label>Peso (kg)</label><input class="fb-peso" inputmode="decimal" value="'+esc(reg&&reg.peso_kg!=null?reg.peso_kg:'')+'" placeholder="opcional"></div>'+

      '<p class="vacio" style="margin-top:10px;">Los tiempos de cada serie los escribes arriba, en su ejercicio. Se guardan junto a tus sensaciones.</p>'+
      '</div>';
  }

  // Vuelca los tiempos por serie ya guardados en los recuadros de esa sesión
  function prefillTiempos(s){
    var reg=REG[s.id]; if(!reg||!reg.tiempos_reales) return;
    var caja=wrap.querySelector('.entreno-uno[data-sid="'+s.id+'"]'); if(!caja) return;
    var tr=reg.tiempos_reales;
    Object.keys(tr).forEach(function(key){
      var arr=(tr[key]&&tr[key].tiempos)||[];
      caja.querySelectorAll('.serie-in[data-key="'+key+'"]').forEach(function(inp){
        var i=parseInt(inp.getAttribute('data-i'),10); if(arr[i]!=null) inp.value=arr[i];
      });
    });
  }

  // Cuántas series lleva anotadas: en la cabecera de cada bloque y en cada ejercicio
  function progresoBloques(raiz){
    if(!raiz) return;
    raiz.querySelectorAll('.bloque').forEach(function(d){
      var et=d.querySelector('.bl-prog'); if(!et) return;
      var ins=d.querySelectorAll('.serie-in');
      if(!ins.length){ et.hidden=true; return; }
      var hechas=0; ins.forEach(function(i){ if(i.value.trim()) hechas++; });
      var txt=hechas+' de '+ins.length+' anotadas';
      et.hidden=false; et.textContent=txt; et.title=txt;
      et.classList.toggle('lleno', hechas===ins.length);
    });
    // Cada repetición, en su estado: hecha (con su diferencia), la que toca
    // ahora (borde azul y «apuntar el tiempo») y las que faltan, en discontinuo.
    raiz.querySelectorAll('.serie-inputs').forEach(function(g){
      var ins=g.querySelectorAll('.serie-in'), hechas=0, primeraVacia=-1;
      var obj=tiempoANum(g.getAttribute('data-obj'));
      ins.forEach(function(inp, i){
        var v=inp.value.trim();
        if(v) hechas++; else if(primeraVacia<0) primeraVacia=i;
      });
      ins.forEach(function(inp, i){
        var v=inp.value.trim();
        var fila=inp.closest('.serie-hueco'); if(!fila) return;
        var actual=(i===primeraVacia);
        fila.classList.toggle('pendiente', !v && !actual);
        fila.classList.toggle('actual', actual);
        inp.classList.toggle('puesto', !!v);
        inp.placeholder = actual ? 'apuntar el tiempo' : 'pendiente';
        // La diferencia solo se enseña si hay un objetivo de verdad calculado
        // con tu mejor marca. Sin objetivo no se compara nada: no se inventa.
        var dif=fila.querySelector('.s-dif'); if(!dif) return;
        dif.className='s-dif'; dif.textContent='';
        if(!v || obj==null) return;
        var t=tiempoANum(v); if(t==null || isNaN(t)) return;
        var d=t-obj;
        if(Math.abs(d)<0.005){ dif.textContent='='; return; }
        dif.textContent=(d<0?'−':'+')+segATexto(Math.abs(d));
        dif.classList.add(d<0?'mejora':'peor');
      });
      var c=g.parentNode.querySelector('.serie-cnt');
      if(c) c.textContent=hechas+' de '+ins.length;
    });
  }

  // Aviso discreto de "esto todavía no está guardado"
  function marcarSucio(caja){
    if(!caja) return;
    caja.classList.add('sucio');
    var av=caja.querySelector('.fb-sucio'); if(av) av.hidden=false;
    var m=caja.querySelector('.fb-msg'); if(m && /ok/.test(m.className)){ m.textContent=''; m.className='msg fb-msg'; }
  }
  function limpiarSucio(caja){
    if(!caja) return;
    caja.classList.remove('sucio');
    var av=caja.querySelector('.fb-sucio'); if(av) av.hidden=true;
  }
  window.addEventListener('beforeunload', function(ev){
    if(!wrap.querySelector('.entreno-uno.sucio')) return;
    ev.preventDefault(); ev.returnValue='';

  // El título de la cabecera de trabajo es el del entreno que se está viendo
  function fijarTituloEntreno(lista, iso){
    tituloEntreno = (lista && lista.length===1) ? tituloSesion(lista[0])
      : (lista && lista.length>1 ? 'Entrenos del día'
        : (iso===todayISO ? 'Hoy no toca' : 'Sin entreno'));
    if(SEC==='entreno') pintarCabecera();
  }
  function pintarDia(iso){
    diaSel=iso;
    pintarSemana();
    var lista=sesionesDe(iso), cont=$('entreno-cont');
    fijarTituloEntreno(lista, iso);
    if(!lista.length){
      var haySemana=(SEM[lunesVis]||[]).length;
      var titulo = (iso===todayISO) ? 'Hoy no toca entreno' : 'Ese día no hay entreno';
      var aviso = haySemana ? 'Esta semana sí hay entrenos: toca otro día de la tira de arriba y lo verás.'
        : (at.grupo_id ? 'Tu entrenador todavía no ha publicado los entrenos de esta semana. Suelen aparecer unos días antes.'
                       : 'Todavía no estás en ningún grupo. En cuanto tu entrenador te asigne a uno, verás aquí tus entrenos.');
      var salida = haySemana ? '' : APOLANA_UI.boton('Ver el calendario del club', '../calendario/');
      cont.innerHTML='<div class="tarjeta">'+
        '<div class="entreno-cab"><h2>Mi entreno</h2><span class="fecha-pill">'+esc((iso===todayISO?'Hoy · ':'')+formatFecha(iso))+'</span></div>'+
        APOLANA_UI.vacio(titulo, aviso, salida)+'</div>';
      return;
    }
    cont.innerHTML=lista.map(function(s){
      return '<div class="entreno-uno" data-sid="'+esc(s.id)+'">'+renderEntreno(s,todayISO)+fichaFeedback(s)+'</div>';
    }).join('');
    lista.forEach(prefillTiempos);
    progresoBloques(cont);
  }

  // Día que se muestra al abrir una semana: el preferido si tiene entreno; si no, el más cercano
  function elegirDia(lunes, pref){
    var lista=SEM[lunes]||[];
    var base=(pref && difDias(pref,lunes)>=0 && difDias(pref,lunes)<=6) ? pref : lunes;
    if(lista.some(function(s){ return s.fecha===base; })) return base;
    var mejor=null;
    lista.forEach(function(s){
      var d=Math.abs(difDias(s.fecha,base));
      if(!mejor || d<mejor.d || (d===mejor.d && s.fecha>mejor.f)) mejor={d:d,f:s.fecha};
    });
    return mejor?mejor.f:base;
  }

  async function irSemana(lunes, pref){
    lunesVis=lunes;
    $('sem-rango').textContent=rangoTxt(lunes);
    $('sem-dias').classList.add('cargando');
    $('entreno-cont').innerHTML='<div class="tarjeta">'+APOLANA_UI.cargando('filas',4)+'</div>';
    await cargarSemana(lunes);
    $('sem-dias').classList.remove('cargando');
    pintarDia(elegirDia(lunes, pref));
  }

  $('sem-prev').addEventListener('click', function(){ irSemana(addDias(lunesVis,-7), null); });
  $('sem-next').addEventListener('click', function(){ irSemana(addDias(lunesVis,7), null); });
  $('sem-hoy').addEventListener('click', function(){ irSemana(lunesDe(todayISO), todayISO); });

  // Un único manejador para toda la sección: al repintar no se duplican los clics
  $('sec-entreno').addEventListener('click', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var dia=t.closest('.dia');
    if(dia){ pintarDia(dia.getAttribute('data-dia')); return; }
    // Ficha del 1 al 10: marca la elegida y la escribe en su campo oculto
    var esc10=t.closest('.esc');
    if(esc10){
      var grupo=esc10.parentNode, destino=esc10.getAttribute('data-esc'), v=esc10.getAttribute('data-v');
      var ya=esc10.classList.contains('sel');
      grupo.querySelectorAll('.esc').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
      if(!ya){ esc10.classList.add('sel'); esc10.setAttribute('aria-pressed','true'); }
      var campo=grupo.parentNode.querySelector('.'+destino);
      if(campo) campo.value = ya ? '' : v;
      marcarSucio(t.closest('.entreno-uno'));
      return;
    }
    var mas=t.closest('.fb-mas');
    if(mas){
      var det=mas.parentNode.querySelector('.fb-detalles');
      if(det){ det.hidden=!det.hidden; mas.classList.toggle('abierto',!det.hidden); mas.setAttribute('aria-expanded', det.hidden?'false':'true'); }
      return;
    }
    var btn=t.closest('.fb-guardar');
    if(btn) guardarFeedback(btn);
  });

  // El acordeón: 'toggle' no burbujea, por eso se escucha en fase de captura
  $('sec-entreno').addEventListener('toggle', function(ev){
    var d=ev.target;
    if(!d || !d.classList || !d.classList.contains('bloque')) return;
    recordarBloques(d.closest('.entreno-uno'));
  }, true);

  // Al escribir: se actualiza el contador del bloque y se avisa de que falta guardar
  $('sec-entreno').addEventListener('input', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var caja=t.closest('.entreno-uno'); if(!caja) return;
    if(t.classList.contains('serie-in')) progresoBloques(caja);
    marcarSucio(caja);
  });

  // ---------- guardar sensaciones + tiempos de la sesión que se está viendo ----------
  async function guardarFeedback(btn){
    var caja=btn.closest('.entreno-uno'); if(!caja) return;
    var sid=caja.getAttribute('data-sid');
    var msg=caja.querySelector('.fb-msg'); msg.textContent='Guardando…'; msg.className='msg fb-msg';
    function val(sel){ var e=caja.querySelector(sel); return e?e.value:''; }
    // recoger tiempos por serie (solo los de esta sesión)
    var tiempos={};
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var ins=g.querySelectorAll('.serie-in'); if(!ins.length) return;
      var key=ins[0].getAttribute('data-key'); var vals=[]; var hay=false;
      ins.forEach(function(inp){ var v=inp.value.trim(); vals.push(v); if(v) hay=true; });
      if(hay) tiempos[key]={ ejercicio:g.getAttribute('data-eje'), tiempos:vals };
    });
    function numOrNull(v){ v=(v||'').trim().replace(',','.'); if(!v) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
    function intOrNull(v){ if(!v) return null; var n=parseInt(v,10); return isNaN(n)?null:n; }
    var payload={
      sesion_id: sid, atleta_id: at.id,
      sensacion_general: intOrNull(val('.fb-sensacion')),
      rpe: intOrNull(val('.fb-rpe')),
      como_me_siento: val('.fb-siento').trim()||null,
      molestias: val('.fb-molestias').trim()||null,
      notas_atleta: val('.fb-notas').trim()||null,
      horas_sueno: numOrNull(val('.fb-sueno')),
      peso_kg: numOrNull(val('.fb-peso')),
      tiempos_reales: Object.keys(tiempos).length?tiempos:null
    };
    var up=await sb.from('registros_sesion').upsert(payload,{onConflict:'sesion_id,atleta_id'});
    if(up.error){ msg.textContent='Error: '+up.error.message; msg.className='msg fb-msg error'; }
    else { msg.textContent='Guardado ✓ ¡gracias!'; msg.className='msg fb-msg ok'; REG[sid]=payload; limpiarSucio(caja); pintarHoy(); }
  }

  // ---------- HOY: saludo, tira de semana, sesión destacada y aviso del club ----------
  var lunesHoy=lunesDe(todayISO);
  var PAGOS=[];            // recibos del atleta (para avisar de lo vencido en «Hoy»)
  var hoyPintado=false;
  function sesSemanaHoy(){ return SEM[lunesHoy]||[]; }
  function tituloSesion(s){ return s.titulo || (s.tipo==='descanso' ? 'Descanso' : 'Entreno'); }

  // Resumen corto de la sesión, al estilo «4 × 60 m · ritmo 90-95% · rec. 4 min»
  function resumenSesion(s){
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var principal=null;
    bloques.forEach(function(b){ if(!principal && /principal/i.test(b.etiqueta||'')) principal=b; });
    var filas=[];
    (principal?[principal]:bloques).forEach(function(b){ (b.filas||[]).forEach(function(f){ filas.push(f); }); });
    var f=null;
    filas.forEach(function(x){ if(!f && (x.series||x.ritmo)) f=x; });
    if(!f) f=filas[0];
    if(!f) return '';
    var p=[];
    if(f.ejercicio) p.push(f.ejercicio);
    if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
    else if(f.series) p.push(f.series+' series');
    else if(f.distancia) p.push(f.distancia);
    if(f.ritmo) p.push('ritmo '+f.ritmo);
    if(f.descanso) p.push('rec. '+f.descanso);
    if(p.length<2 && f.detalle) p.push(f.detalle);
    return p.join(' · ');
  }

  // Abrir un día concreto en «Mi semana» (y, si se pide, ir al formulario de sensaciones)
  async function verDia(iso, foco){
    activarSeccion('entreno');
    if(lunesDe(iso)===lunesVis) pintarDia(iso); else await irSemana(lunesDe(iso), iso);
    if(foco){ var c=wrap.querySelector('.entreno-uno[data-sid="'+foco+'"] .fb-card'); if(c){ c.scrollIntoView({block:'center'}); return; } }
    wrap.scrollIntoView({block:'start'});
  }

  // La fila que manda de una sesión: la del bloque principal con series o ritmo
  function filaClave(s){
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var principal=null;
    bloques.forEach(function(b){ if(!principal && /principal/i.test(b.etiqueta||'')) principal=b; });
    var filas=[];
    (principal?[principal]:bloques).forEach(function(b){ (b.filas||[]).forEach(function(f){ filas.push(f); }); });
    var f=null;
    filas.forEach(function(x){ if(!f && (x.series||x.ritmo)) f=x; });
    return f || filas[0] || null;
  }
  /* Los tres datos de la tarjeta de hoy (maqueta 37b): series, ritmo y
     RECUPERACIÓN. Antes salía el ritmo pero no la recuperación, que es lo que
     de verdad define la sesión: 6×800 con 90" no es 6×800 con 3'. */
  function cifrasSesion(s){
    var f=filaClave(s); if(!f) return [];
    var dis=disciplinaDe(s), D=DESC();
    var out=[];
    if(f.series && f.distancia) out.push({v:String(f.series)+' × '+String(f.distancia).replace(/\s*m$/i,''), l:'series'});
    else if(f.series) out.push({v:String(f.series), l:'series'});
    else if(f.distancia) out.push({v:String(f.distancia), l:'distancia'});
    if(f.ritmo) out.push({v:String(f.ritmo), l:'ritmo'});
    var rec='';
    if(D && dis){ try { rec=D.textoRecPlano ? D.textoRecPlano(D.recDeFila(f, dis), dis) : ''; } catch(e){}
      if(!rec){ try { rec=D.textoRec(D.recDeFila(f, dis), dis)||''; } catch(e){} } }
    if(!rec && f.descanso) rec=String(f.descanso);
    if(rec) out.push({v: rec, l:'recuperación'});
    else if(f.tiempo) out.push({v:String(f.tiempo), l:'tiempo'});
    return out.slice(0,3);
  }

  // Franja ámbar de aviso: lo único que puede aparecer por encima del entreno.
  // Lleva icono, que es lo que la distingue del ámbar de marca del club.
  function franja(texto, accion, attr){
    return '<div class="franja"'+(attr||'')+'><span class="fr-ic" aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>'+
      '<span class="fr-txt">'+texto+'</span>'+
      (accion?'<span class="fr-acc">'+esc(accion)+'</span>':'')+'</div>';
  }

  /* INICIO (maqueta 37b) · pantalla de consulta, en este orden:
     1 aviso de recibo · 2 tarjeta navy del entreno de hoy · 3 fila del rango ·
     4 próxima carrera y última marca · 5 resto de la semana.
     Una sola tarjeta navy: si hubiera dos, ninguna ancla. */
  function pintarHoy(){
    var sec=$('sec-hoy'), lista=sesSemanaHoy(), html='';

    // 1 · aviso de recibo pendiente arriba (desaparece si está al día)
    var deb=PAGOS.filter(function(x){ var e=(x.estado||'').toLowerCase(); return e!=='pagado' && e!=='cobrado'; });
    if(deb.length){
      var deuda=deb.reduce(function(a,x){ return a+(parseFloat(x.importe)||0); },0);
      var uno=deb[0];
      var txt=(deb.length===1 ? esc(uno.concepto||'Recibo pendiente') : deb.length+' recibos pendientes')+
              (deuda>0 ? ' · <span style="white-space:nowrap">'+esc(eur(deuda))+'</span>' : '');
      html+=franja(txt, 'Ver', ' data-sec-ir="pagos"');
    }
    // Aviso del club: misma franja, solo cuando el club tiene algo que decir
    if(AVISO){
      var enlA=AVISO.enlace ? (/^https?:\/\//.test(AVISO.enlace) ? AVISO.enlace : '../../'+String(AVISO.enlace).replace(/^\//,'')) : '';
      html+='<div class="franja azul"'+(enlA?' data-url="'+esc(enlA)+'"':'')+'>'+
        '<span class="fr-ic" aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>'+
        '<span class="fr-txt">'+esc(AVISO.texto)+'</span>'+
        (enlA?'<span class="fr-acc">'+esc(AVISO.texto_enlace||'Ver')+'</span>':'')+'</div>';
    }

    /* 2 · el entreno de hoy: la ÚNICA tarjeta navy de la pantalla. Si hoy hay
       dos sesiones (pista y gimnasio, por ejemplo) solo la primera va en navy;
       la otra baja a una fila. Con dos bloques navy ninguno ancla nada. */
    var hoySes=lista.filter(function(s){ return s.fecha===todayISO; });
    if(hoySes.length){
      html+=hoySes.slice(0,1).map(function(s){
        var hecho=!!REG[s.id];
        var cifras=cifrasSesion(s);
        // grupo · sitio · entrenador, con el nombre propio del grupo en ámbar
        var sub=[nombreGrupoHTML((GRUPO&&GRUPO.nombre)||''), esc(lugarGrupo()), esc(ENTRENA)].filter(Boolean).join(' · ');
        var hora=horaGrupo();
        return '<div class="hoy-card">'+
          '<div class="hc-top">'+
            '<span class="hc-grupo">Entreno de hoy'+(s.atletas_ids?' · solo para ti':'')+'</span>'+
            (hora?'<span class="hc-hora">'+esc(hora)+'</span>':'<span class="hc-hora">'+esc(tipoCorto(s.tipo))+'</span>')+
          '</div>'+
          '<div><h2 class="hc-tit">'+esc(tituloSesion(s))+'</h2>'+
            (sub?'<div class="hc-det">'+sub+'</div>':'')+'</div>'+
          (cifras.length?'<div class="hc-cifras">'+cifras.map(function(c){
            return '<span class="hc-cifra"><b>'+esc(c.v)+'</b><span>'+esc(c.l)+'</span></span>';
          }).join('')+'</div>':'')+
          '<button type="button" class="hc-cta" data-ir="'+todayISO+'">Empezar el entreno</button>'+
          '<button type="button" class="hc-ok'+(hecho?' hecho':'')+'" data-ir="'+todayISO+'" data-fb="'+esc(s.id)+'">'+
            (hecho?'Ya has contado cómo fue':'¿Cómo fue?')+'</button>'+
          '</div>';
      }).join('');
      // Las demás sesiones de hoy, en filas: nunca una segunda tarjeta navy
      if(hoySes.length>1){
        html+='<div class="lista-caja">'+hoySes.slice(1).map(function(s){
          return '<button type="button" class="lista-fila" data-ir="'+todayISO+'">'+
            '<span class="lf-txt"><span class="lf-nom">'+esc(tituloSesion(s))+'</span>'+
            '<span class="lf-sub">también hoy · '+esc(tipoCorto(s.tipo))+'</span></span>'+
            '<span class="lf-hora">&rsaquo;</span></button>';
        }).join('')+'</div>';
      }
    } else {
      var sig=null;
      lista.forEach(function(s){ if(s.fecha>todayISO && (!sig||s.fecha<sig.fecha)) sig=s; });
      var texto = sig ? 'La próxima, el '+formatFecha(sig.fecha)+': '+tituloSesion(sig)+'.'
                      : (at.grupo_id ? 'No hay sesión programada para hoy.'
                                     : 'Aún no estás asignado a un grupo. En cuanto tu entrenador te asigne, verás aquí tus entrenos.');
      html+='<div class="hoy-vacio"><div class="luna" aria-hidden="true">'+icLuna+'</div><h2>Hoy toca descansar</h2>'+
        '<p>'+esc(texto)+'</p>'+
        '<button type="button" class="btn btn--neutro" data-ir="'+(sig?sig.fecha:todayISO)+'">Ver mi entreno</button></div>';
    }

    /* 3 · el rango, como fila con la medalla en ámbar y qué falta para el
       siguiente reto. No un contador de puntos: una frase con algo que hacer.
       Solo aparece si el atleta participa en el juego de retos. */
    if(RANGO){
      var romano=['','I','II','III','IV','V','VI','VII'][RANGO.orden]||'·';
      var falta = RANGO.sigNombre
        ? 'Te faltan '+RANGO.sigFaltan+' puntos para '+RANGO.sigNombre
        : 'Has llegado al último rango del club';
      html+='<a class="rango-fila" href="../retos/">'+
        '<span class="rg-med" aria-hidden="true">'+esc(romano)+'</span>'+

  /* La mejor marca del año. Dos marcas de pruebas distintas no se pueden
     comparar entre sí, así que «la mejor» es la más reciente de este año que
     además sea tu mejor marca de esa prueba. Si este año no has batido
     ninguna, se enseña la última que apuntaste, dicha por su nombre.
     Nada se inventa: todo sale de lo que hay apuntado. */
  function mejorDelAnio(datos){
    var anio=String(new Date().getFullYear());
    var deEsteAnio=datos.filter(function(x){ return x.fecha && String(x.fecha).slice(0,4)===anio; });
    // la mejor de cada prueba, mirando TODAS las marcas
    var topes={};
    datos.forEach(function(x){
      var y=tiempoANum(x.tiempo_display); if(y==null||!x.prueba) return;
      var mas=catMasMejor(x.prueba);
      if(topes[x.prueba]==null || (mas?y>topes[x.prueba]:y<topes[x.prueba])) topes[x.prueba]=y;
    });
    function conDelta(x){
      var y=tiempoANum(x.tiempo_display); if(y==null) return null;
      var mas=catMasMejor(x.prueba), previa=null;
      datos.forEach(function(o){
        if(o===x || o.prueba!==x.prueba || !o.fecha || !x.fecha || o.fecha>=x.fecha) return;
        var oy=tiempoANum(o.tiempo_display); if(oy==null) return;
        if(previa==null || (mas?oy>previa:oy<previa)) previa=oy;
      });
      return { x:x, y:y, mas:mas, gana: previa!=null ? (mas?y-previa:previa-y) : null };
    }
    var recordsDelAnio=deEsteAnio.filter(function(x){
      var y=tiempoANum(x.tiempo_display);
      return y!=null && topes[x.prueba]!=null && Math.abs(y-topes[x.prueba])<0.0001;
    }).sort(function(a,b){ return a.fecha<b.fecha?1:-1; });
    if(recordsDelAnio.length){
      var r=conDelta(recordsDelAnio[0]); if(r){ r.et='Tu mejor marca del año'; return r; }
    }
    var resto=(deEsteAnio.length?deEsteAnio:datos).slice().sort(function(a,b){ return (a.fecha||'')<(b.fecha||'')?1:-1; });
    for(var i=0;i<resto.length;i++){
      var c=conDelta(resto[i]);
      if(c){ c.et='Tu última marca'; return c; }
    }
    return null;
  }
  function difTexto(seg, mas){
    var s=Math.abs(seg);
    return (mas?'+':'−')+(s<60?s.toFixed(2):segATexto(s));
  }

  function pintarMarcas(){
    var cont=$('marcas-cont');

    }

      cont.innerHTML=filtro+APOLANA_UI.vacio(
        mkFiltro==='competicion' ? 'Todavía no hay marcas de competición' : 'Todavía no hay marcas de entrenamiento',

        '<button type="button" class="ap-btn" data-mk-f="todas">Ver todas mis marcas</button>');
      return;
    }

    /* 1 · LA tarjeta navy de la pantalla: la mejor marca del año, a 42 px */
    var mj=mejorDelAnio(datos), mejorHtml='';
    if(mj){
      var donde=[mj.x.sede, fechaCorta(mj.x.fecha)].filter(Boolean).join(' · ');
      mejorHtml='<div class="mejor">'+
        '<span class="mj-et">'+esc(mj.et)+'</span>'+
        '<div class="mj-cifra"><span class="mj-dato">'+esc(mj.x.tiempo_display||'')+'</span>'+
