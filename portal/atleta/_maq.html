        ((mj.gana!=null&&mj.gana>0)||donde ?
          '<div class="mj-pie">'+
            ((mj.gana!=null&&mj.gana>0)?'<span class="mj-mejora">'+esc(difTexto(mj.gana, mj.mas))+' sobre la anterior</span>':'')+
            '<span class="mj-donde">'+esc(donde)+'</span>'+
          '</div>' : '')+
      '</div>';
    }

    /* 2 · Por prueba: la mejor de cada una, con su diferencia. Las pruebas que
       el atleta tiene como suyas y aún no tiene marca dicen «sin marca», nunca
       un guion: un guion hace dudar de si falta el dato. */
    var porPrueba={}; datos.forEach(function(x){ var k=x.prueba||'Prueba sin nombre'; (porPrueba[k]=porPrueba[k]||[]).push(x); });
    var claves=Object.keys(porPrueba).sort();
    var filasPorPrueba=claves.map(function(k){
      var mas=catMasMejor(k), best=null, segunda=null;
      porPrueba[k].forEach(function(x){
        var y=tiempoANum(x.tiempo_display); if(y==null) return;
        if(best==null||(mas?y>best.y:y<best.y)){ segunda=best; best={y:y,disp:x.tiempo_display||'',fecha:x.fecha}; }
        else if(segunda==null||(mas?y>segunda.y:y<segunda.y)) segunda={y:y,disp:x.tiempo_display||'',fecha:x.fecha};
      });
      if(!best) return '<div class="lista-fila sin"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
        '<span class="lf-sin">sin marca</span><span class="lf-dif"></span></div>';
      var dif='<span class="lf-dif">=</span>';
      if(segunda){
        var g = mas ? best.y-segunda.y : segunda.y-best.y;
        if(g>0.001) dif='<span class="lf-dif mejora">'+esc(difTexto(g, mas))+'</span>';
      } else dif='<span class="lf-dif"></span>';
      return '<div class="lista-fila"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
        '<span class="lf-dato">'+esc(best.disp)+'</span>'+dif+'</div>';
    });
    // Las pruebas que el atleta declara como suyas y todavía no tienen marca
    (at.especialidades||[]).forEach(function(n){
      if(porPrueba[n]) return;
      filasPorPrueba.push('<div class="lista-fila sin"><span class="lf-txt"><span class="lf-nom">'+esc(n)+'</span></span>'+
        '<span class="lf-sin">sin marca</span><span class="lf-dif"></span></div>');
    });
    var porPruebaHtml = filasPorPrueba.length
      ? '<div class="lista-tit"><span class="et">Por prueba</span></div><div class="lista-caja">'+filasPorPrueba.join('')+'</div>' : '';

    /* 3 · Últimas marcas, en filas */
    var tipoLabel={mmp:'MMP',temporada:'Temporada',objetivo:'Objetivo'};
    var tope = mkVerTodas ? datos.length : Math.min(5, datos.length);
    var ultimas='<div class="lista-tit"><span class="et">Últimas marcas</span>'+
      (datos.length>5 ? '<button type="button" class="enl" id="mk-todas">'+(mkVerTodas?'Ver menos':'Las '+datos.length)+'</button>' : '')+
      '</div><div class="lista-caja">'+datos.slice(0,tope).map(function(x){
        var etq=[fechaCorta(x.fecha), x.sede,
                 x.contexto==='competicion'?'competición':(x.contexto==='entreno'?'entrenamiento':''),
                 x.tipo?(tipoLabel[x.tipo]||x.tipo):''].filter(Boolean).join(' · ');
        return '<div class="lista-fila">'+
          '<span class="lf-txt"><span class="lf-nom">'+esc(x.prueba||'Prueba sin nombre')+'</span>'+
          (etq?'<span class="lf-sub">'+esc(etq)+'</span>':'')+'</span>'+
          (x.tiempo_display ? '<span class="lf-dato">'+esc(x.tiempo_display)+'</span>'
                            : '<span class="lf-sin">sin marca</span>')+'</div>';
      }).join('')+'</div>';

    /* 4 · Progresión: las gráficas de las pruebas con dos marcas o más */
    var graficos='', gi=0;
    claves.forEach(function(k){
      var arr=porPrueba[k].map(function(x){return {fecha:x.fecha||'',y:tiempoANum(x.tiempo_display),disp:x.tiempo_display||''};}).filter(function(p){return p.y!=null&&p.fecha;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});
      if(arr.length>=2){ graficos+=graficoPrueba(k,arr,catMasMejor(k),gi++); }
    });
    var progHtml = graficos
      ? '<div class="lista-tit"><span class="et">Progresión</span></div><div class="graficos">'+graficos+'</div>'
      : '<p class="vacio" style="margin-bottom:14px;">Con dos marcas o más de una misma prueba verás aquí tu evolución.</p>';

    cont.innerHTML=filtro+mejorHtml+porPruebaHtml+ultimas+progHtml;
  }

  (async function cargarPagos(){

      }).join('')+'</div>';

    cont.innerHTML=lista;

    // --- Cómo se paga --------------------------------------------------

          devueltos: dev.length
        });
        if(b){ cont.insertAdjacentHTML('beforeend', b); APOLANA_INFO_PAGOS.activar(cont); }
      } catch(e){ /* si falla, la lista de recibos se queda como estaba */ }
    }
  })();

  // ---------- llegar directo a una sección ----------
  // La barra inferior del resto de pantallas del portal enlaza aquí con
  // #entreno, #marcas, #pagos o #mas: se abre esa sección al entrar.
  (function(){
    function secDelHash(){
      var h=(location.hash||'').replace(/^#/,'');
      return SECCIONES.indexOf(h)!==-1 ? h : null;
    }
    var s=secDelHash();
    if(s && s!==SEC) activarSeccion(s);
    window.addEventListener('hashchange', function(){
      var x=secDelHash(); if(x && x!==SEC) activarSeccion(x);
    });
  })();

});
</script>

</body>
</html>
