<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi zona · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/datos.js" defer></script>
<script src="../../assets/js/info-pagos.js" defer></script>
<script src="../../assets/js/descansos.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  /* Cabecera de pantalla: sobre crema y sin barra de color. El navy se reserva
     para las pantallas de trabajo (el entreno del día). */
  body { background: var(--crema); }
  .at-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  /* El margen inferior evita que la primera tarjeta se pegue al titular y le corte la coma. */
  .at-cab[hidden] { display:none; }
  .at-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:16px; }
  .at-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:32px; color: var(--navy); margin: 0; line-height:1; }
  .at-cab .sub { display:block; font-size:14px; color: var(--texto-suave); margin-bottom:4px; }
  /* Iniciales, no un número: el círculo con el día parecía un contador de avisos.
     Plano y sin sombra: no se pulsa, así que no lleva sombra. */
  .at-cab .at-ini { flex:none; width:40px; height:40px; border-radius:999px; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:15px; }
  /* Acción de la cabecera (Añadir marca): botón de borde, alineado con la base del título */
  .at-cab .at-acc { flex:none; min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; padding:0 16px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto); font:inherit; font-size:14px; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .at-cab .at-acc:hover { border-color: var(--azul-filete, #3B85C0); color: var(--navy); }
  .at-cab .at-acc[aria-expanded="true"] { background: var(--navy); border-color: var(--navy); color:#fff; }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 200px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:2px; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:8px; }
  /* El activo se marca con subrayado de 2 px, no con una píldora de fondo */
  .side nav a { cursor:pointer; font-size:15px; color: var(--texto-suave); padding:11px 12px; border-radius:10px; text-decoration:none; border-bottom:2px solid transparent; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { color: var(--navy); font-weight:600; border-bottom-color: var(--navy); border-radius:0; }
  .cont { flex:1 1 auto; min-width:0; }

  /* Sin sombra: una tarjeta que no se pulsa lleva borde, no sombra */
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(18px,3vw,26px); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 12px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:13px; padding:3px 9px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }

  /* Estado vacío con cuerpo: icono de línea, frase corta y, si aplica, una acción. */
  .vacio-caja { text-align:center; padding: clamp(20px,4vw,28px) 16px; }
  .vacio-caja .vc-ic { width:46px; height:46px; border-radius:50%; background: var(--crema-media); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .vacio-caja .vc-ic svg { width:24px; height:24px; }
  .vacio-caja h3 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; color: var(--navy); margin:0 0 6px; }
  .vacio-caja p { color: var(--texto-suave); font-size:14px; margin:0 0 14px; max-width:34ch; margin-left:auto; margin-right:auto; }
  .vacio-caja .btn { min-height:44px; display:inline-flex; align-items:center; }

  /* gráficos */
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .grafico { border:1px solid var(--linea); border-radius:14px; padding:10px 8px 4px; background: var(--crema); }
  .grafico svg { width:100%; height:auto; display:block; }
  .grafico .leyenda { font-size:13px; color: var(--texto-suave); padding:2px 4px 4px; }
  .grafico .mejora { color:#1e7a3d; font-weight:600; }
  /* MARCAS (maqueta 37b) · una sola tarjeta navy por pantalla: tu mejor marca.
     El resto de los datos van en listas de filas sobre crema. */
  .mejor { background: var(--navy); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:11px; margin-bottom:14px; }
  .mejor .mj-et { font-size:14px; color: rgba(255,255,255,.62); }
  .mejor .mj-cifra { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .mejor .mj-dato { font-family: var(--fuente-dato); font-size:42px; font-weight:700; line-height:1; color:#fff; }
  .mejor .mj-prueba { font-size:16px; color: rgba(255,255,255,.7); }
  .mejor .mj-pie { display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,.16); padding-top:11px; }
  .mejor .mj-mejora { font-size:14px; color:#7FC08D; }
  .mejor .mj-donde { flex:1; text-align:right; font-size:14px; color: rgba(255,255,255,.6); }

  /* Lista de datos: UN solo contenedor con separadores, no diez tarjetas sueltas */
  .lista-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 7px; padding:0 2px; }
  .lista-tit .et { font-size:14px; color: var(--texto-suave); }
  .lista-tit .enl { background:none; border:0; padding:0; font:inherit; font-size:14px; font-weight:600; color: var(--azul-oscuro); cursor:pointer; text-decoration:none; white-space:nowrap; }
  .lista-tit .enl:hover { color: var(--azul-hover); }
  .lista-caja { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; margin-bottom:14px; }
  .lista-fila { display:flex; align-items:center; gap:12px; min-height:48px; box-sizing:border-box; width:100%;
    padding:11px 15px; border:0; border-bottom:1px solid var(--linea); text-align:left; font:inherit; background:none; color:inherit; }
  .lista-fila:last-child { border-bottom:none; }
  button.lista-fila, a.lista-fila { cursor:pointer; text-decoration:none; -webkit-tap-highlight-color:transparent; }
  button.lista-fila:hover, a.lista-fila:hover { background: var(--crema); }
  .lista-fila .lf-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .lista-fila .lf-nom { font-size:15px; color: var(--navy); overflow-wrap:anywhere; }
  /* Máximo dos líneas por fila: si hiciera falta una tercera, sería una tarjeta */
  .lista-fila .lf-sub { font-size:14px; color: var(--texto-suave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lista-fila .lf-dato { flex:none; font-family: var(--fuente-dato); font-size:16px; color: var(--navy); }
  .lista-fila .lf-dia { flex:none; width:52px; font-size:15px; font-weight:600; color: var(--navy); font-variant-numeric: tabular-nums; }
  .lista-fila .lf-hora { flex:none; font-size:14px; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
  .lista-fila .lf-dif { flex:none; width:56px; text-align:right; font-size:14px; color: var(--texto-suave); }
  .lista-fila .lf-dif.mejora { color: var(--verde); font-weight:600; }
  /* «sin marca», nunca un guion: el guion se lee como un dato que falta */
  .lista-fila .lf-sin { flex:none; font-size:15px; color:#C4BCA9; }
  .lista-fila.sin .lf-nom { color: var(--texto-suave); }

  /* Marcas: filtrar entre competición y entrenamiento (las antiguas, sin dato, salen en «Todas»).
     Segmentado: los tres ocupan el ancho y el activo va en navy relleno. */
  .mk-filtro { display:flex; gap:6px; margin:0 0 14px; }
  .mk-f { flex:1 1 0; min-width:0; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 8px; box-sizing:border-box;
    border-radius:10px; border:0; background: var(--crema-banda); color: var(--texto); white-space:nowrap; overflow:hidden;
    font:inherit; font-size:14px; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .mk-f:hover { color: var(--navy); }
  .mk-f .n { font-size:13px; color: var(--texto-suave); }
  .mk-f[aria-pressed="true"] { background: var(--navy); color:#fff; font-weight:600; }
  .mk-f[aria-pressed="true"] .n { color: rgba(255,255,255,.7); }

  /* Un recibo pendiente se marca en el texto, nunca con un bloque de color */
  .lista-fila.pend .lf-sub { color:#8A5307; }

  /* entreno · la cabecera del día: fecha en versalitas, título grande y las
     dos etiquetas. La fecha va arriba porque esta tarjeta se abre igual para
     hoy que para hace tres meses. */
  .entreno-cab { margin-bottom:12px; }
  .entreno-cab h2 { margin:0; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:0; }
  .chip { font-family: var(--fuente-mono); font-size:13px; text-transform:none;  background: var(--crema-media); color: var(--texto-suave); padding:4px 10px; border-radius:999px; }
  .nota { font-size:14px; color: var(--texto); background: var(--crema); border-left:3px solid var(--azul-filete, #3B85C0); padding:10px 12px; border-radius:10px; margin:0 0 16px; }
  /* Bloques plegables: en el móvil el entreno entero era una lista larguísima.
     Ahora cada parte (calentamiento, principal, vuelta a la calma) se abre y se cierra. */
  .bloques { display:flex; flex-direction:column; gap:10px; }
  .bloque { border:1px solid var(--linea); border-radius:14px; background: var(--crema); overflow:hidden; }
  .bloque[open] { background:#fff; border-color: var(--linea-borde); }
  /* La cabecera es el botón: 52px de alto, se toca con prisa y con guantes */
  .bl-cab { list-style:none; display:flex; align-items:center; gap:10px; min-height:52px; padding:9px 14px; box-sizing:border-box; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .bl-cab::-webkit-details-marker { display:none; }
  .bl-cab::marker { content:''; }
  .bl-cab:hover { background: var(--crema-media); }
  .bloque[open] .bl-cab { border-bottom:1px solid var(--linea); }
  .bloque[open] .bl-cab:hover { background: var(--crema); }
  .bl-cab:focus-visible { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:-2px; }
  .bl-fl { flex:none; width:18px; height:18px; color: var(--azul-oscuro); transition: transform .15s; }
  .bloque[open] .bl-fl { transform: rotate(90deg); }
  .bl-mid { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .bl-tit { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; line-height:1.05; color: var(--navy); }
  .bl-res { font-size:13px; line-height:1.3; color: var(--texto-suave); }
  .bl-prog { flex:none; font-size:13px; line-height:1.1; color: var(--azul-oscuro); background: var(--azul-suave); border-radius:999px; padding:5px 10px; white-space:nowrap; }
  .bl-prog.lleno { background:#e6f4ea; color:#1e7a3d; font-weight:600; }
  .bl-prog[hidden] { display:none; }
  .bl-cuerpo { padding:2px 14px 8px; }
  /* El descanso entre bloques: el separador que faltaba. Si el bloque no lo
     lleva, no se pinta nada — un «—» hace dudar de si falta el dato. */
  .bl-sep { display:flex; align-items:center; gap:10px; padding:2px 6px; }
  .bl-sep i { flex:1; height:1px; background: var(--linea); }
  .bl-sep span { font-size:13px; color: var(--texto-suave); white-space:nowrap; }
  .bl-entre { font-size:13px; color: var(--texto-suave); padding:8px 0 2px; }
  /* Volumen y tiempo, separados: se planifica con el tiempo, no con los metros */
  .ses-cifras { display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .ses-cifra { flex:1 1 0; min-width:120px; background: var(--crema-banda); border-radius:10px; padding:9px 12px; display:flex; flex-direction:column; gap:1px; }
  .ses-cifra b { font-family: var(--fuente-dato); font-weight:700; font-size:17px; color: var(--navy); }
  .ses-cifra span { font-size:13px; color: var(--texto-suave); }
  .fchip.nat { font-weight:600; }

  /* Un ejercicio: su línea de datos y, justo debajo, sus huecos para anotar */
  .ejer { padding:11px 0; border-bottom:1px solid var(--linea); }
  .ejer:last-child { border-bottom:none; }
  .fila { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:0; }
  .fila .ej { font-size:15px; color: var(--navy); font-weight:600; }
  .fila .fparams { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { font-size:13px; color: var(--texto-suave); background: var(--crema-media); padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .fchip.mio { background: var(--azul); color:#fff; font-weight:600; }
  .serie-cap { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:11px 0 7px; }
  .serie-cap b { font-size:14px; font-weight:600; color: var(--navy); }
  .serie-cap .serie-cnt { font-size:14px; color: var(--texto-suave); white-space:nowrap; }
  /* El conmutador de unidad: SOLO en atletismo, y solo cuando de verdad hay que
     elegir. En un mismo grupo conviven «6 × 150 m» y «rodaje de 12 km»; si el
     sistema lo adivinara por el tamaño del número acertaría casi siempre y
     fallaría justo en los casos raros, que son los que se notan. Se recuerda la
     última usada, así que quien pone series no lo toca nunca. */
  .s-unis { display:flex; gap:0; border:1px solid var(--linea-borde); border-radius:999px; overflow:hidden; background:#fff; }
  .s-unis button { min-width:46px; min-height:36px; padding:0 12px; border:0; background:none; cursor:pointer;
    font:inherit; font-size:14px; font-weight:500; color: var(--texto-suave); -webkit-tap-highlight-color:transparent; }
  .s-unis button[aria-pressed="true"] { background: var(--azul-suave); color: var(--azul-hover); font-weight:700; }
  /* «La última vez: 60 kg × 11». Es una PROPUESTA, no un dato guardado: hasta
     que el atleta no la confirma no es suya. Por eso se ve en gris y hay que
     tocarla. Apuntar una serie son cero toques si repites y uno si subes peso;
     si hubiera que teclearlo todo cada vez, esto se abandona a la tercera. */
  .s-ultima { display:flex; align-items:center; gap:8px; width:100%; min-height:44px; margin:0 0 8px;
    padding:0 12px; border:1px dashed var(--linea); border-radius:12px; background:none; cursor:pointer;
    font:inherit; font-size:14px; line-height:1.35; text-align:left; color: var(--texto-suave);
    white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  /* Lo que se recorta si no cabe es el número, no la palabra «Repetir»: sin
     «Repetir» a la vista nadie sabe que la propuesta se puede aceptar de un
     toque, que es de lo que va todo esto. */
  .s-ultima .s-val { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    font-weight:600; color: var(--navy); font-family: var(--fuente-dato); }
  .s-ultima .s-rep { margin-left:auto; flex:none; font-weight:600; color: var(--azul-oscuro); }
  .s-ultima:hover { border-color: var(--azul-filete, #3B85C0); }

  /* ------------------------------------------------------------
     «LO CAMBIÉ POR OTRA COSA»
     El entrenamiento decía press banca y el atleta hizo flexiones,
     porque no tenía banco. Si eso no se puede decir, el historial
     guarda «press banca» y EL DATO ES FALSO: ni el entrenador se
     entera de que en esa sala no hay banco, ni el atleta puede ver
     nunca su progresión en flexiones.

     Es un enlace discreto mientras no se usa —la inmensa mayoría
     de los días no se cambia nada y no debe estorbar— y una franja
     azul en cuanto se usa, porque entonces es de lo más importante
     que hay en ese ejercicio. 44 px de alto, como todo lo que se
     pulsa aquí de pie.
     ------------------------------------------------------------ */
  .cambio-btn { display:inline-flex; align-items:center; gap:6px; min-height:44px; margin:0 0 8px;
    padding:0; border:0; background:none; cursor:pointer; font:inherit; font-size:14px; font-weight:600;
    color: var(--azul-oscuro); -webkit-tap-highlight-color:transparent; }
  .cambio-btn:hover { color: var(--azul-hover); }
  .cambio-btn .cb-ic { font-size:16px; line-height:1; }
  .cambio-caja { margin:0 0 9px; }
  .cambio-caja[hidden] { display:none; }
  /* La etiqueta se deja como todas las demás de la app (13 px, seminegrita,
     navy): que un campo nuevo se vista distinto es lo que hace que una
     pantalla parezca hecha a trozos. Solo se ajusta el margen. */
  .cambio-caja label { margin:0 0 5px; }
  .cambio-caja .cambio-in { width:100%; box-sizing:border-box; min-height:44px; }
  /* Ya cambiado: se ve sin buscarlo, y se dice lo que estaba puesto
     y lo que se hizo, en ese orden, que es como se cuenta. */
  .cambio-hecho { display:flex; align-items:flex-start; gap:8px; margin:0 0 9px; padding:9px 12px;
    border-radius:10px; background:#EAF2F9; border:1px solid #C9DDEE; }
  /* `overflow-wrap` no es un detalle: el atleta escribe a mano y un día
     escribirá algo largo sin espacios. A 375 px eso desbordaría, y
     `apolana.css` lleva `overflow-x: hidden`, así que el texto no se
     vería cortado: se vería DESAPARECIDO. */
  .cambio-hecho .ch-txt { flex:1 1 auto; min-width:0; font-size:14px; line-height:1.45; color: var(--navy);
    overflow-wrap:anywhere; }
  .cambio-hecho .ch-txt b { font-weight:700; }
  /* «en vez de X» en su propia línea: en 375 px, encadenado con un punto
     medio, las dos cosas se enredaban en un párrafo y había que releerlo. */
  .cambio-hecho .ch-eq { display:block; color: var(--texto-suave); }
  .cambio-hecho .ch-editar { flex:none; min-height:44px; display:inline-flex; align-items:center; margin:-9px -6px -9px 0;
    padding:0 6px; background:none; border:0; cursor:pointer; font:inherit; font-size:14px; font-weight:600;
    color: var(--azul-oscuro); -webkit-tap-highlight-color:transparent; }
  /* En lectura (un día ya cerrado) manda lo que HIZO: el nombre grande
     es el suyo y debajo, en pequeño, lo que estaba puesto. */
  .ejer .ej-cambiado { display:block; font-size:13px; line-height:1.45; color: var(--texto-suave); margin-top:2px; }

  /* Cada repetición es una fila: su ✓, su número y lo que se apunta. El ✓ es lo
     natural y lo rápido a pie de máquina, y de paso resuelve lo de marcar lo no
     hecho: LA SERIE SIN ✓ ES LA QUE NO SE HIZO. No hace falta un botón aparte. */
  .serie-inputs { display:flex; flex-direction:column; gap:8px; padding:0; border:0; margin:0; }
  /* El borde es siempre de 2 px (transparente cuando no toca): así al escribir
     el tiempo la fila no da un salto de un píxel. */
  .serie-hueco { display:flex; align-items:center; gap:7px; margin:0; font-weight:400; box-sizing:border-box;
    min-height:56px; padding:5px 8px 5px 5px; border-radius:12px; background: var(--crema); border:2px solid transparent; }
  /* 44 px de lado: esto se usa a pie de pista, con el móvil en la mano y sudando */
  .s-ok { flex:none; width:44px; height:44px; padding:0; border-radius:50%; cursor:pointer;
    border:2px solid var(--linea-borde); background:#fff; color: var(--linea-borde);
    display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
  /* El ✓ se insinúa cuando está sin marcar y se enciende cuando lo marcas. Si
     se viera igual de nítido en los dos estados, una serie sin hacer parecería
     hecha, que es justo el error que esta pantalla viene a arreglar. */
  .s-ok svg { width:22px; height:22px; opacity:.28; }
  .s-ok[aria-pressed="true"] { background: var(--verde, #2E7D52); border-color: var(--verde, #2E7D52); color:#fff; }
  .s-ok[aria-pressed="true"] svg { opacity:1; }
  .s-ok:focus-visible { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:2px; }
  .serie-hueco .s-n { flex:none; width:14px; font-family: var(--fuente-dato); font-size:14px; color: var(--texto-suave); }
  /* Los campos de una serie: en fuerza son dos (kilos y repeticiones), en
     atletismo y natación uno (el tiempo). */
  .s-campos { flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:6px; }
  /* `flex:0 0 auto`: el campo no encoge nunca. Si encogiera, el número se
     comería el «kg» y quedarían pisados el uno sobre el otro. */
  .s-campo { flex:0 0 auto; min-width:0; display:flex; align-items:baseline; gap:3px; }
  .s-campo + .s-campo::before { content:'×'; align-self:center; margin-right:2px; color: var(--texto-suave); font-size:15px; }
  /* Los tiempos y los kilos se comparan en columna: van en monoespaciada.
     El número va alineado a la derecha y con ancho fijo para que la unidad
     quede PEGADA a él —«60 kg», no «60 ......... kg»—: si el hueco estirara,
     al escribir el 60 el «kg» se quedaría lejos y volvería a leerse como un
     número suelto. */
  .serie-in { flex:none; width:52px; min-width:0; box-sizing:border-box; min-height:44px; padding:6px 0; border:0; background:none;
    text-align:right; font-size:21px; font-weight:700; font-family: var(--fuente-dato); color: var(--navy); }
  /* El de tiempo es el único que puede necesitar más sitio («1:02.4») */
  .serie-inputs[data-medida="tiempo"] .serie-in { width:auto; flex:1 1 auto; text-align:left; }
  .serie-inputs[data-medida="tiempo"] .s-campo { flex:1 1 auto; }
  .serie-in::placeholder { color: var(--texto-suave); font-weight:400; font-size:15px; font-family: var(--fuente-texto); }
  .serie-in:focus { outline:none; }
  /* LA UNIDAD VA PEGADA AL NÚMERO, no en la cabecera de la columna: en el móvil
     se hace scroll y la cabecera se pierde de vista, y entonces el número
     vuelve a quedarse sin unidad. Un número sin unidad no es un dato. */
  .s-u { flex:none; font-size:14px; font-weight:500; color: var(--texto-suave); white-space:nowrap; }
  /* Los ejercicios en los que no se apunta ningún número (movilidad,
     estiramientos): el dato es el ✓, y al lado se repite lo que mandó el
     entrenador para no dejar la fila muda. */
  .s-solo { flex:1 1 auto; min-width:0; font-size:15px; color: var(--texto-suave); }
  /* La diferencia solo existe cuando se compara un tiempo con tu marca: en
     fuerza no se pinta y no reserva sitio, que en 375 px hace falta todo. */
  .serie-hueco .s-dif { flex:none; font-size:14px; color: var(--texto-suave); white-space:nowrap; }
  .serie-inputs:not([data-medida="tiempo"]) .s-dif { display:none; }
  .serie-hueco .s-dif.mejora { color: var(--verde); font-weight:600; }
  .serie-hueco .s-dif.peor { color:#B0563A; }
  /* pendiente: ni fondo ni peso, solo el hueco marcado en discontinuo */
  .serie-hueco.pendiente { background:none; border:2px dashed var(--linea); }
  .serie-hueco.pendiente .s-n, .serie-hueco.pendiente .serie-in::placeholder { color: var(--texto-suave); }
  /* la que toca ahora */
  .serie-hueco.actual { background:#fff; border-color: var(--azul-filete, #3B85C0); }
  .serie-hueco.actual .serie-in::placeholder { color: var(--azul-oscuro); font-weight:600; }
  .serie-hueco.hecha { background: var(--crema); border-color:transparent; }
  .serie-hueco:focus-within { border-color: var(--azul-filete, #3B85C0); border-style:solid; }

  /* Lo que se quedó sin hacer. Ni rojo ni regañina: es un dato, no una falta.
     Que se vea, que se entienda y que no dé vergüenza marcarlo. */
  .no-hecho { margin:12px 0 0; padding:13px 14px; border-radius:12px;
    background: var(--ambar-fondo); border:1px solid var(--ambar-borde); }
  .no-hecho p { margin:0 0 10px; font-size:15px; line-height:1.45; color:#6B4A0B; }
  .no-hecho p b { font-weight:700; }
  .nh-motivos { display:flex; flex-wrap:wrap; gap:8px; }
  .nh-motivos button { min-height:44px; padding:0 15px; border-radius:999px; cursor:pointer; font:inherit; font-size:15px;
    border:1px solid var(--ambar-borde); background:#fff; color:#6B4A0B; -webkit-tap-highlight-color:transparent; }
  .nh-motivos button[aria-pressed="true"] { background:#6B4A0B; border-color:#6B4A0B; color:#fff; font-weight:600; }
  .no-hecho .nh-nota { width:100%; box-sizing:border-box; margin-top:10px; min-height:44px; }
  .no-hecho .nh-nota[hidden] { display:none; }
  /* La franja del ejercicio que se dejó a medias, dentro del propio ejercicio */
  .ejer.medias .serie-cnt { color:#8A5307; font-weight:600; }
  /* «Cambios sin guardar» vive sobre crema (el entreno ya no es navy):
     #8A5307 es el ámbar de texto que sí pasa 4,5:1; #B96F09 se quedaba en 3,7. */
  .fb-sucio { font-size:13px; color:#8A5307; }
  .fb-sucio[hidden] { display:none; }
  .chip.personal { background: var(--azul-suave); color: var(--azul-oscuro); font-weight:700; }

  /* semana: tira de días y navegación */
  .sem-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  /* Con `display:flex` puesto, el atributo `hidden` no esconde nada por sí solo */
  .sem-cab[hidden], .sem-nav[hidden], .ent-pies[hidden], .conm[hidden] { display:none; }
  .sem-cab h2 { margin:0; }
  .sem-nav { display:flex; gap:6px; flex-wrap:wrap; }
  /* 44px de alto: son botones que se tocan con prisa */
  .sem-btn { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; min-height:44px; padding:8px 14px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); cursor:pointer; line-height:1; display:inline-flex; align-items:center; }
  .sem-btn:hover { border-color: var(--azul-filete, #3B85C0); color: var(--navy); }
  .sem-btn.ahora { border-color: var(--azul-filete, #3B85C0); color: var(--azul-oscuro); font-weight:700; }
  /* Los saltos de mes son el mando de fondo, no el de cada día: mismo
     tamaño para el dedo, un punto menos de peso a la vista. */
  .sem-btn.salto { padding:8px 11px; border-style:dashed; }
  .sem-rango { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); margin:10px 0 8px; }
  .dias { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .dias.cargando { opacity:.45; }
  .dia { flex:1 1 0; min-width:58px; min-height:78px; box-sizing:border-box; font:inherit; -webkit-appearance:none; appearance:none; background: var(--crema); border:1px solid var(--linea); border-radius:10px; padding:8px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .dia:hover { border-color: var(--azul-filete, #3B85C0); }
  .dia .d-nom { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); }
  .dia .d-num { font-family: var(--fuente-titulo); font-size:21px; font-weight:700; line-height:1; color: var(--navy); }
  .dia .d-tipo { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .dia .d-punto { width:7px; height:7px; border-radius:50%; background: var(--azul); }
  .dia .d-punto.personal { background: var(--navy); }
  /* El visto ocupa exactamente lo mismo que el punto (7 px de alto): al
     apuntar cómo te fue, la tira no da un salto. */
  .dia .d-hecho { height:7px; line-height:7px; font-size:12px; font-weight:700; color: var(--verde, #3F7A4C); }
  .dia .d-hecho.personal { color: var(--navy); }
  .dia.vacio { background:#fff; }
  .dia.vacio .d-num { color: var(--texto-suave); font-weight:600; }
  .dia.vacio .d-tipo { color: var(--texto-suave); }
  .dia.hoy { border-color: var(--azul-filete, #3B85C0); border-width:2px; padding:7px 3px; }
  .dia.hoy .d-nom { color: var(--azul-oscuro); font-weight:700; }
  .dia.sel { background: var(--navy); border-color: var(--navy); box-shadow: var(--sombra-suave); }
  .dia.sel .d-nom, .dia.sel .d-num, .dia.sel .d-tipo { color:#fff; }
  .dia.sel .d-punto, .dia.sel .d-punto.personal { background:#fff; }
  .dia.sel .d-hecho, .dia.sel .d-hecho.personal { color:#fff; }
  .dia.hoy.sel { border-color: var(--azul-filete, #3B85C0); }

  /* ---- INICIO (maqueta 37b) · pantalla de consulta:
         crema con UNA sola tarjeta navy, la del entreno de hoy. ---- */
  /* Franja ámbar: recibo pendiente. Desaparece si está al día.
     Lleva icono y fondo ámbar suave: así el ámbar de aviso no se confunde
     con el ámbar de marca del club (la medalla del rango, aquí debajo). */
  .franja { display:flex; align-items:center; flex-wrap:wrap; gap:6px 11px; background: var(--ambar-fondo); border:1px solid var(--ambar-borde); border-radius:10px; padding:11px 13px; margin-bottom:11px; min-height:48px; box-sizing:border-box; cursor:pointer; }
  .franja .fr-ic { flex:none; width:20px; height:20px; color:#B96F09; display:flex; }
  .franja .fr-ic svg { width:20px; height:20px; }
  /* El texto manda; si la acción es larga, baja a su propia línea a la derecha
     en vez de estrangular el aviso a cuatro palabras por renglón. */
  .franja .fr-txt { flex:1 1 200px; min-width:0; font-size:14px; line-height:1.4; color:#6B5227; }
  .franja .fr-acc { flex:none; margin-left:auto; font-size:14px; font-weight:600; color:#8A5307; }
  .franja.azul { background: var(--azul-suave); border-color:#CFE2F1; }
  .franja.azul .fr-ic { color: var(--azul-oscuro); }
  .franja.azul .fr-txt { color: var(--navy); }
  .franja.azul .fr-acc { color: var(--azul-oscuro); }

  /* La tarjeta navy: es el ancla de la pantalla. Sin sombra (no se pulsa
     entera: lo que se pulsa es el botón azul de dentro). */
  .hoy-card { background: var(--navy); border-radius:14px; padding:18px 20px; color:#fff; display:flex; flex-direction:column; gap:13px; margin-bottom:11px; }
  .hoy-card .hc-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hoy-card .hc-grupo { font-size:14px; color: rgba(255,255,255,.62); }
  /* La hora del entreno: cifra de ancho fijo, en el azul claro del sistema */
  .hoy-card .hc-hora { font-size:15px; font-weight:600; font-variant-numeric: tabular-nums; color:#8FC0E8; white-space:nowrap; }
  .hoy-card .hc-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:38px; line-height:.96; color:#fff; margin:0; text-transform: uppercase; }
  .hoy-card .hc-det { font-size:15px; color: rgba(255,255,255,.75); margin-top:4px; }
  /* Los nombres propios del club (La Tribu, Madre Tierra, El Cubo) van en ámbar */
  .hoy-card .hc-det .propio { color:#E0A33C; }
  .hoy-card .hc-cifras { display:flex; gap:8px; }
  .hoy-card .hc-cifra { flex:1 1 0; min-width:0; background: rgba(255,255,255,.12); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:1px; }
  /* Series, ritmo y recuperación: cifras que se comparan de un día para otro */
  .hoy-card .hc-cifra b { font-family: var(--fuente-dato); font-weight:600; font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hoy-card .hc-cifra span { font-size:13px; color: rgba(255,255,255,.6); }
  /* Un solo botón azul por pantalla, y es este */
  .hoy-card .hc-cta { width:100%; box-sizing:border-box; background: var(--azul); color:#fff; border:0; border-radius:999px; min-height:52px; padding:14px; font:inherit; font-weight:600; font-size:16px; cursor:pointer; }
  .hoy-card .hc-cta:hover { background:#4C93CB; }
  .hoy-card .hc-ok { width:100%; min-height:44px; background:none; border:0; padding:0; font:inherit; font-size:15px; font-weight:600; color:#8FC0E8; cursor:pointer; margin-top:-4px; }
  .hoy-card .hc-ok:hover { color:#fff; }
  .hoy-card .hc-ok.hecho { color:#7FC08D; }

  /* Fila del rango: la medalla en ámbar y, debajo, lo que falta para el siguiente */
  .rango-fila { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left; font:inherit;
    background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; padding:13px 15px; min-height:48px; margin-bottom:11px;
    text-decoration:none; cursor:pointer; box-shadow: var(--sombra-suave); -webkit-tap-highlight-color:transparent; }
  .rango-fila:hover { border-color: var(--azul-filete, #3B85C0); }
  .rango-fila .rg-med { flex:none; width:38px; height:38px; border-radius:999px; background:#F6EBD6; border:2px solid #E0A33C;
    display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:14px; color:#8A5307; }
  .rango-fila .rg-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .rango-fila .rg-nom { font-size:15px; color: var(--navy); }
  .rango-fila .rg-falta { font-size:14px; color:#8A5307; }
  .rango-fila .rg-chev { flex:none; color: var(--texto-suave); font-size:18px; line-height:1; }

  /* Dos tarjetas: próxima carrera y última marca */
  .minis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .mini { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:13px 15px; display:flex; flex-direction:column; gap:3px; text-decoration:none; cursor:pointer; min-height:48px; }
  .mini:hover { border-color: var(--azul-filete, #3B85C0); }
  .mini .mi-et { font-size:13px; color: var(--texto-suave); }
  .mini .mi-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:20px; line-height:1; text-transform:uppercase; color: var(--navy); overflow-wrap:anywhere; }
  /* Una marca es un dato que se compara: va en monoespaciada, no en condensada */
  .mini .mi-tit.dato { font-family: var(--fuente-dato); font-size:20px; text-transform:none; }
  .mini .mi-pie { font-size:14px; color: var(--texto-suave); }
  .mini .mi-pie.bien { color: var(--verde); font-weight:600; }
  .mini .mi-pie.pronto { color:#B0563A; }

  .hoy-vacio { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(22px,4vw,30px) 20px; text-align:center; margin-bottom:14px; }
  .hoy-vacio .luna { width:58px; height:58px; border-radius:999px; background: var(--crema-media); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .hoy-vacio .luna svg { width:28px; height:28px; }
  .hoy-vacio h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; color: var(--navy); margin:0 0 8px; }
  .hoy-vacio p { color: var(--texto-suave); font-size:14px; margin:0 0 16px; }
  .hoy-vacio .btn { min-height:44px; display:inline-flex; align-items:center; }

  /* ---- MÁS (maqueta 22b): perfil y tres bloques ---- */
  .ml-perfil { display:flex; align-items:center; gap:12px; background: var(--crema-banda); border-radius:14px; padding:12px 16px; margin-bottom:14px; }
  .ml-avatar { flex:none; width:40px; height:40px; border-radius:999px; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:15px; }
  .ml-quien { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .ml-quien b { font-size:15px; font-weight:600; color: var(--navy); }
  .ml-quien span { font-size:14px; color: var(--texto-suave); }
  .ml-bloque { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .ml-tit { font-size:14px; color: var(--texto-suave); padding-left:4px; }
  .ml-caja { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; }
  .ml-fila { display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:52px; box-sizing:border-box; border-bottom:1px solid #F4EFE4; text-decoration:none; color: var(--navy); }
  .ml-fila:last-child { border-bottom:none; }
  .ml-fila[href], .ml-fila[data-sec-ir], .ml-fila.salir { cursor:pointer; }
  .ml-fila[href]:hover, .ml-fila[data-sec-ir]:hover, .ml-fila.salir:hover { background: var(--crema); }
  .ml-fila .ml-txt { flex:1; min-width:0; font-size:15px; color: var(--navy); }
  /* El chevron nunca va en azul: en azul se lee como un enlace aparte de la fila */
  .ml-fila .ml-chev { flex:none; font-size:18px; color: var(--texto-suave); line-height:1; }
  .ml-fila .ml-dato { flex:none; font-size:13px; color: var(--texto-suave); text-align:right; }
  .ml-fila .ml-dato.pend { font-family: var(--fuente-mono); font-size:13px; color:#B96F09; font-weight:600; }
  .ml-fila .ml-num { flex:none; background: var(--navy); color:#fff; font-family: var(--fuente-dato); font-size:13px; border-radius:999px; padding:3px 9px; }
  .ml-fila.salir .ml-txt { color:#B0563A; font-weight:600; }

  /* Acceso a los tests desde Marcas. Es una fila de lista como las de «Más»,
     no una tarjeta azul: la tarjeta azul se reserva para lo de hoy y solo
     puede haber una por pantalla. */
  .mk-tests { display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:56px; box-sizing:border-box;
    background:#fff; border:1px solid var(--linea); border-radius:14px; margin-bottom:14px;
    text-decoration:none; color: var(--navy); }
  .mk-tests:hover { background: var(--crema); }
  .mk-tests .mk-tests-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .mk-tests .mk-tests-txt b { font-size:15px; font-weight:600; color: var(--navy); }
  .mk-tests .mk-tests-txt span { font-size:13px; line-height:1.4; color: var(--texto-suave); }
  .mk-tests .mk-tests-chev { flex:none; font-size:18px; color: var(--texto-suave); line-height:1; }

  .enlace-accion { background:none; border:0; padding:0; font:inherit; font-weight:600; font-size:14px; color: var(--azul-oscuro); cursor:pointer; min-height:44px; display:inline-flex; align-items:center; }
  .enlace-accion:hover { color: var(--azul-hover); }

  /* Puntuar con fichas tocables en vez de dos desplegables fríos */
  .escala-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:14px 0 7px; }
  .escala-tit b { font-size:14px; font-weight:600; color: var(--navy); }
  .escala-tit span { font-size:13px; color: var(--texto-suave); }
  .escala { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  @media (min-width:560px){ .escala { grid-template-columns:repeat(10,1fr); } }
  .escala .esc { min-height:44px; font:inherit; font-size:15px; font-weight:600; color: var(--texto-suave); background:#fff; border:1px solid var(--linea-borde); border-radius:10px; cursor:pointer; padding:0; }
  .escala .esc:hover { border-color: var(--azul-filete, #3B85C0); color: var(--navy); }
  .escala .esc.sel { background: var(--azul); border-color: var(--azul); color:#fff; }
  .fb-mas { margin-top:16px; min-height:44px; display:inline-flex; align-items:center; gap:8px; background:none; border:0; padding:0; font:inherit; font-size:14px; font-weight:600; color: var(--azul-oscuro); cursor:pointer; }
  .fb-mas:hover { color: var(--azul-hover); }
  .fb-mas .fl { transition: transform .15s; display:inline-block; }
  .fb-mas.abierto .fl { transform: rotate(90deg); }
  .fb-detalles[hidden] { display:none; }
  .fb-detalles { border-top:1px solid var(--linea); margin-top:12px; padding-top:4px; }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; }
  .rango { display:flex; align-items:center; gap:10px; }
  .rango output { font-family: var(--fuente-dato); font-weight:700; color: var(--navy); min-width:26px; text-align:center; }

  /* ============================================================
     MODO TRABAJO (maqueta 46) · el entreno es una pantalla propia
     ------------------------------------------------------------
     Cabecera navy, cuerpo crema —como el resto de la app—. El modo
     de trabajo NO lo marca el fondo: lo marcan quitar la barra de
     pestañas, poner un «Salir» y agrandar los datos. El navy a
     pantalla completa se leía peor al sol (navy sobre crema 10,9:1;
     blanco sobre navy, la mitad) y el salto a negro parecía haber
     salido de la app.
     ============================================================ */
  /* La franja navy de arriba es una tira de navegación y NO lleva título:
     con la pestaña de abajo llamándose «Entreno» y el primer conmutador
     «Sesión de hoy», un título «Entrenamiento» daría tres nombres al mismo
     sitio. Lleva la vuelta, el contexto (grupo · entrenador) y las flechas
     de día. Es la misma tira en los tres conmutadores: lo único que cambia
     es lo de debajo. El título del día vive donde tiene sentido: en la
     tarjeta del entrenamiento, junto a su fecha. */
  .tb-cab { display:flex; align-items:center; gap:12px;
    background: var(--navy); border-radius:14px; padding:6px 14px; margin-bottom:14px; }
  .tb-cab .tb-quien { flex:1; min-width:0; font-size:14px; color: rgba(255,255,255,.66);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb-cab .tb-quien .propio { color:#E0A33C; }
  /* «Inicio», no «Salir»: la barra de arriba del portal ya tiene un «Salir»
     que cierra la sesión, y en una tira estrecha los dos se confundían. */
  .tb-salir { flex:none; min-height:44px; box-sizing:border-box; display:inline-flex; align-items:center; padding:0 4px 0 0;
    border:0; background:none; color:#fff; font:inherit; font-size:15px; line-height:1; cursor:pointer; white-space:nowrap;
    -webkit-tap-highlight-color:transparent; }
  .tb-salir:hover { color:#8FC0E8; }
  /* Anterior y siguiente, en corto. El día escrito va al pie del entrenamiento. */
  .tb-flechas { flex:none; display:flex; gap:2px; }
  .tb-flechas button { min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center;
    border:0; background:none; padding:0; font:inherit; font-size:18px; line-height:1; color:#8FC0E8; cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .tb-flechas button:hover { color:#fff; }
  .tb-flechas button[disabled] { color: rgba(255,255,255,.28); cursor:default; }

  /* El cuerpo del entreno usa las MISMAS piezas que el resto de la app
     (tarjetas blancas sobre crema, huecos de serie, escala…): no hace
     falta ninguna versión oscura del componente. */
  /* Los botones se agrandan a 52 px: se pulsan de pie y con prisa */
  body.trabajo .acciones .btn { min-height:52px; display:inline-flex; align-items:center; }

  /* ============================================================
     ENTRENAMIENTO · el conmutador de tres (entrega 9, 3a)
     ------------------------------------------------------------
     El historial no es una pestaña más abajo: es el tercer paso
     de esta misma pantalla. Un «Más» escondería justo lo que
     queremos que el atleta mire, y las cinco pestañas de abajo
     no se tocan.
     ============================================================ */
  .conm { display:flex; gap:0; border-bottom:1px solid var(--linea-marcada); margin-bottom:14px; }
  .conm .cm { flex:none; min-height:44px; box-sizing:border-box; padding:0 3px 11px 0; margin-right:20px;
    border:0; border-bottom:3px solid transparent; background:none; font:inherit; font-size:16px; line-height:1;
    color: var(--texto-suave); cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent;
    display:inline-flex; align-items:flex-end; }
  .conm .cm:last-child { margin-right:0; }
  .conm .cm:hover { color: var(--navy); }
  .conm .cm[aria-selected="true"] { font-weight:500; color: var(--navy); border-bottom-color: var(--azul); }

  /* El resumen del historial: sobre banda crema, con la cifra grande arriba.
     La barra partida NO es un gráfico: la frase de debajo es la que se
     entiende, y la barra solo la respalda. */
  .hs-res { background: var(--crema-banda); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:11px; margin-bottom:12px; }
  .hs-cab { display:flex; align-items:baseline; justify-content:space-between; gap:10px; position:relative; }
  .hs-cab h2 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:22px; line-height:1; color: var(--navy); margin:0; }
  .hs-cambiar { flex:none; min-height:44px; display:inline-flex; align-items:center; background:none; border:0; padding:0 0 0 10px;
    font:inherit; font-size:14px; color: var(--azul-oscuro); cursor:pointer; }
  .hs-cambiar:hover { color: var(--azul-hover); }
  .hs-opts { position:absolute; right:0; top:calc(100% + 4px); z-index:20; background:#fff; border:1px solid var(--linea-borde);
    border-radius:10px; padding:4px; display:flex; flex-direction:column; min-width:180px; box-shadow: var(--sombra-suave); }
  .hs-opts[hidden] { display:none; }
  .hs-opts button { min-height:44px; text-align:left; background:none; border:0; border-radius:8px; padding:0 12px;
    font:inherit; font-size:15px; color: var(--navy); cursor:pointer; }
  .hs-opts button:hover { background: var(--crema); }
  .hs-opts button[aria-current="true"] { font-weight:600; }
  .hs-cifra { display:flex; align-items:baseline; gap:9px; }
  .hs-cifra b { font-family: var(--fuente-titulo); font-weight:700; font-size:44px; line-height:.9; color: var(--navy); }
  .hs-cifra span { font-size:16px; line-height:1.3; color: var(--texto); }
  /* «8 de ellos, a medias»: pegado a la cifra grande, porque es lo que impide
     que «41 días entrenados» se lea como 41 días enteros. En gris y en pequeño,
     no en rojo: es un dato, no una regañina. */
  .hs-cifra .hs-medias { display:block; font-style:normal; font-size:14px; line-height:1.3; color: var(--texto-suave); }
  .hs-barras { display:flex; flex-direction:column; gap:8px; }
  .hs-barra { display:flex; align-items:center; gap:11px; }
  /* Los deportes NO llevan color propio: chip neutro y barra navy. Cuatro
     colores nuevos chocarían con el verde y el ámbar, que en toda la app
     significan «bien» y «ojo». La longitud y el número ya distinguen. */
  .hs-barra .hs-et { flex:none; width:96px; font-size:15px; line-height:1.3; color: var(--texto); }
  .hs-barra .hs-carril { flex:1; min-width:0; height:10px; background:#E0D7C4; border-radius:2px; overflow:hidden; }
  .hs-barra .hs-carril i { display:block; height:10px; background: var(--navy); }
  .hs-barra .hs-n { flex:none; width:26px; text-align:right; font-size:15px; font-weight:500; line-height:1.3; color: var(--navy); }
  .hs-split { border-top:1px solid #E0D7C4; padding-top:11px; display:flex; flex-direction:column; gap:8px; }
  .hs-sb { display:flex; height:14px; border-radius:2px; overflow:hidden; }
  .hs-sb i { display:block; height:14px; }
  .hs-sb i.carga { background: var(--navy); }
  .hs-sb i.suave { background: var(--verde); }
  .hs-frase { margin:0; font-size:15px; line-height:1.45; color: var(--texto); }
  .hs-frase b { font-weight:600; }
  /* En escritorio la barra no se estira hasta el borde: un carril de mil
     píxeles con el relleno al tercio no se compara con nada. */
  @media (min-width:761px){ .hs-barra, .hs-split { max-width:620px; } }
  /* Sin regañar: se dice una vez, en pequeño y sin color de alarma. */
  .hs-pie { margin:0 0 16px; font-size:14px; line-height:1.45; color: var(--texto-suave); }

  /* La lista, agrupada por mes. Un día es una línea aunque haya dos deportes. */
  .hs-mes { padding:18px 0 8px; font-size:13px; font-weight:500; line-height:1; letter-spacing:0.08em;
    text-transform:uppercase; color: var(--texto-suave); }
  .hs-lista .hs-mes:first-child { padding-top:10px; }
  .hs-dia { display:flex; align-items:center; gap:13px; width:100%; box-sizing:border-box; text-align:left; font:inherit;
    background:none; border:0; border-top:1px solid var(--crema-media); padding:13px 0; min-height:48px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; }
  .hs-dia:hover { background: var(--crema); }
  .hs-dia .hd-fecha { flex:none; width:38px; }
  .hs-dia .hd-fecha b { display:block; font-family: var(--fuente-titulo); font-weight:700; font-size:20px; line-height:1; color: var(--navy); }
  .hs-dia .hd-fecha span { display:block; margin-top:2px; font-size:12px; line-height:1; color: var(--texto-suave); }
  .hs-dia .hd-mid { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .hs-dia .hd-chips { display:flex; gap:6px; flex-wrap:wrap; }
  .hs-dia .hd-chip { padding:3px 9px; border-radius:999px; border:1px solid var(--linea-borde);
    font-size:12px; font-weight:500; line-height:1.4; color: var(--texto); }
  /* El papel del día es lo que EXPLICA; el deporte solo clasifica. Por eso
     va en texto y con el tamaño de la fila, no en un chip pequeño. */
  .hs-dia .hd-papel { font-size:15px; line-height:1.3; color: var(--navy); overflow-wrap:anywhere; }
  /* La marca de constancia: relleno si lo apuntó, hueco si no. */
  .hs-dia .hd-punto { flex:none; width:22px; display:flex; justify-content:center; }
  .hs-dia .hd-punto i { width:11px; height:11px; border-radius:999px; background: var(--azul); display:block; box-sizing:border-box; }
  .hs-dia.sin .hd-punto i { background:none; border:1.5px solid var(--linea-borde); }
  .hs-dia.sin .hd-fecha b { color: var(--texto-suave); }
  .hs-dia.sin .hd-papel { color: var(--texto); }
  .hs-dia .hd-chev { flex:none; font-size:17px; line-height:1; color: var(--texto-suave); }

  /* ============================================================
     EL DETALLE DE UN DÍA (entrega 9, 3b)
     ------------------------------------------------------------
     La misma pantalla de siempre, con la fecha arriba y flechas
     de anterior y siguiente: así consultar el historial es un
     repaso y no hay que volver a la lista en cada día.
     ============================================================ */
  .ent-fecha { font-size:12px; font-weight:500; line-height:1; letter-spacing:0.09em; text-transform:uppercase;
    color: var(--texto-suave); margin-bottom:9px; }
  /* ⚠️ El selector lleva `.entreno-cab` delante por una razón, no por gusto:
     arriba hay un `.entreno-cab h2 { margin:0 }` que pesa más que un `.ent-tit`
     suelto (dos trozos contra uno) y se comía este margen entero. El resultado
     era el título y los chips pegados, sin un respiro entre medias.
     El aire es de 13 px y no de 9: bajo un titular de 32 px en mayúsculas con
     el interlineado apretado, 9 px no se leen como separación. */
  .entreno-cab .ent-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:32px;
    line-height:.98; text-transform:uppercase; color: var(--navy); margin:0 0 13px; }
  /* Los dos ejes se distinguen a la vista: el deporte en chip neutro y el
     papel del día en azul suave, que es el que cuenta la temporada. */
  .chip.deporte { background:#fff; border:1px solid var(--linea-borde); color: var(--texto); font-weight:500; }
  .chip.papel { background: var(--azul-suave); color: var(--azul-hover); font-weight:500; }
  /* «Para ti, 85 % son 44,8 s — desde tu 38,1 de mayo». La marca de
     referencia va a la vista: si no, el número parece inventado. Si no hay
     marca del atleta, esta línea no se pinta: no se inventa un objetivo. */
  .pct-tuyo { font-size:14px; line-height:1.45; color: var(--texto-suave); margin:4px 0 0; }
  .pct-tuyo b { font-weight:600; color: var(--texto); }
  /* Flechas del pie: el mismo salto que las de la cabecera, con el día escrito */
  .ent-pies { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:-4px 0 18px; }
  .ent-pies button { min-height:44px; background:none; border:0; padding:0; font:inherit; font-size:15px;
    color: var(--azul-oscuro); cursor:pointer; }
  .ent-pies button:hover { color: var(--azul-hover); }
  .ent-pies .hueco { visibility:hidden; }

  /* Lo que se apuntó aquel día es un hecho: en los días pasados el feedback
     se lee, no se edita. */
  .fb-leer { background: var(--crema-banda); border-radius:14px; padding:15px 16px; display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
  .fb-leer .fbl-et { font-size:12px; font-weight:500; line-height:1; letter-spacing:0.08em; text-transform:uppercase; color: var(--texto-suave); }
  .fb-leer .fbl-esf { font-size:16px; line-height:1.5; color: var(--navy); }
  .fb-leer .fbl-esf b { font-weight:600; }
  .fb-leer .fbl-chips { display:flex; gap:7px; flex-wrap:wrap; }
  .fb-leer .fbl-chip { padding:4px 11px; border-radius:999px; background: var(--navy); color:#fff; font-size:13px; font-weight:500; line-height:1.4; }
  .fb-leer .fbl-chip.ojo { background: var(--ambar-fondo); border:1px solid var(--ambar-borde); color:#8A5307; }
  .fb-leer .fbl-nota { font-size:16px; line-height:1.5; color: var(--navy); }
  .fb-leer .fbl-extra { font-size:14px; line-height:1.4; color: var(--texto-suave); }
  /* «Se quedó a medias — 7 de 10 series · no dio tiempo». Va lo primero de la
     tarjeta porque cambia cómo se lee todo lo demás: un RPE de 5 en un
     entrenamiento entero y en medio entrenamiento no significan lo mismo. */
  .fb-leer .fbl-medias { font-size:15px; line-height:1.45; font-weight:600; color:#8A5307;
    padding:8px 12px; border-radius:10px; background: var(--ambar-fondo); border:1px solid var(--ambar-borde); }
  /* Las series de un día cerrado: el tiempo que hizo, en columna y sin recuadro */
  .serie-leer { display:flex; flex-direction:column; margin-top:11px; border-top:1px solid var(--crema-media); }
  .serie-leer .sl-fila { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:11px 0; border-bottom:1px solid var(--crema-media); }
  .serie-leer .sl-fila:last-child { border-bottom:none; }
  .serie-leer .sl-n { font-size:15px; line-height:1.35; color: var(--texto-suave); }
  .serie-leer .sl-t { font-family: var(--fuente-dato); font-size:16px; font-weight:500; line-height:1.35; color: var(--navy); }

  /* ------------------------------------------------------------
     CORREGIR LO APUNTADO
     Hasta hoy un día pasado se leía y no había escape: un peso mal
     tecleado se quedaba mal para siempre. Ahora se corrige, y con
     criterio: lo del mismo día sin fricción (ahí ni aparece este
     botón, porque el día de hoy ya se edita), y lo de semanas
     atrás también, pero dejando dicho que se corrigió y cuándo.
     ------------------------------------------------------------ */
  .fb-leer .fbl-pie { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .fb-leer .fbl-corr { font-size:13px; line-height:1.4; color: var(--texto-suave); }
  .fb-corregir { min-height:44px; display:inline-flex; align-items:center; margin:-10px -8px; padding:0 8px;
    background:none; border:0; cursor:pointer; font:inherit; font-size:14px; font-weight:600;
    color: var(--azul-oscuro); -webkit-tap-highlight-color:transparent; }
  .fb-corregir:hover { color: var(--azul-hover); }
  /* Mientras se corrige un día viejo se dice, y se dice antes de tocar
     nada: no es lo mismo apuntar hoy que reescribir lo de hace un mes. */
  .aviso-corrigiendo { margin:0 0 14px; padding:11px 14px; border-radius:12px;
    background: var(--ambar-fondo); border:1px solid var(--ambar-borde);
    font-size:14px; line-height:1.45; color:#6B4A0B; }

  /* ------------------------------------------------------------
     EL COMENTARIO DEL ENTRENADOR
     Es lo que cierra «hablar con el atleta» sin que tengan que
     coincidir en la pista, y lo que hace que un chaval vuelva. Va
     al final del detalle del entrenamiento, con el nombre de quien
     lo escribe: un comentario sin cara detrás no se lee igual.
     Colores del maquetador: fondo #EAF2F9, borde #C9DDEE.
     ------------------------------------------------------------ */
  .coment-ent { background:#EAF2F9; border:1px solid #C9DDEE; border-radius:14px;
    padding:15px 16px; margin:0 0 18px; display:flex; flex-direction:column; gap:7px; }
  .coment-ent .ce-quien { font-size:14px; font-weight:700; line-height:1.35; color: var(--navy); }
  .coment-ent .ce-txt { font-size:16px; line-height:1.55; color: var(--navy); white-space:pre-wrap; overflow-wrap:anywhere; }
  .coment-ent .ce-cuando { font-size:13px; line-height:1.4; color: var(--texto-suave); }

  /* --- Barra inferior única (maqueta 22c): Inicio · Entreno · Calendario · Marcas · Más.
         Iconos de línea de 24 px sin relleno; el activo se distingue por color y peso,
         no por una píldora de fondo. Objetivos táctiles de 48 px. --- */
  .tabbar { display:none; }
  @media (max-width:760px){
    /* En columna hay que estirar: si no, la columna se ajusta al contenido y sobresale */
    .layout { flex-direction:column; align-items:stretch; gap:0; }
    .cont { width:100%; }
    .side { display:none; }                  /* en móvil manda la barra de abajo */
    body { padding-bottom:88px; }            /* hueco para la barra fija */
    /* En modo trabajo también hay barra, así que el hueco es el mismo. */
    .graficos { grid-template-columns:1fr; }
    .grid2 { grid-template-columns:1fr; }
    .tabbar { display:flex; align-items:stretch; position:fixed; left:0; right:0; bottom:0; z-index:600;
      background:rgba(251,249,244,.96); -webkit-backdrop-filter:saturate(1.3) blur(10px); backdrop-filter:saturate(1.3) blur(10px);
      border-top:1px solid var(--linea); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); }
    .tabbar a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
      min-height:48px; text-decoration:none; color: var(--texto-suave);
      font-size:11px;  text-transform:none; -webkit-tap-highlight-color:transparent; }
    .tabbar a .ic { width:24px; height:24px; }
    /* El activo cambia de color, nunca engorda el trazo del icono: el trazo es
       siempre de 1,9 px, esté encendida la pestaña o no. */
    .tabbar a.activo { color:#2F6FA8; }
    .tabbar a.activo span { font-weight:600; }
    .tabbar a.activo .ic { stroke-width:1.9; }
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="at-wrap" id="at-wrap"><div class="ap-esq" data-esq="tarjeta"></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('at-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) {
    /* Sin ficha no se pinta la pantalla, así que aquí no hay barra de abajo:
       la salida tiene que ir dentro del propio aviso. «Escribir al club» saca
       del portal, así que no vale como única salida. */
    wrap.innerHTML = APOLANA_UI.vacio('No encontramos tu ficha',
      'Tu cuenta está bien, pero todavía no la vemos unida a ninguna ficha del club. Escríbenos y la enlazamos en un momento.',
      APOLANA_UI.boton('Escribir al club', '../../contacto/') +
      APOLANA_UI.volver());
    return;
  }

  /* Reintentar SOLO el bloque que ha fallado. Aquí no se puede recargar la
     página: en esta pantalla se escriben los tiempos y el feedback del entreno,
     y una recarga se lo lleva por delante. */
  var REINTENTOS = {}, nRe = 0;
  function htmlError(titulo, texto, fn){
    var k = 'r' + (++nRe);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="' + k + '">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (fn) fn();
  });

  // ---------- helpers ----------
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){ var p=s.split(':'); if(p.length>=3) return (parseInt(p[0],10)||0)*3600+(parseInt(p[1],10)||0)*60+(parseFloat(p[2])||0); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); } var n=parseFloat(s); return isNaN(n)?null:n; }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function fechaLarga(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], me=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function iniciales(nom,ape){ var a=(nom||'').trim().charAt(0), b=(ape||'').trim().charAt(0); return ((a+b)||'·').toUpperCase(); }
  function eur(n){ var v=parseFloat(n); return (isNaN(v)?0:v).toFixed(2).replace('.',',')+' €'; }

  // ---------- fechas: semana de lunes a domingo ----------
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  /* El día de hoy, disponible en TODA la página. Antes se calculaba dentro
     de una función y la tira de la semana no lo veía, así que hoy nunca
     salía marcado en el calendario de arriba. */
  var HOY_ISO = isoDe(new Date());
  function addDias(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  // Lunes de la semana de esa fecha (el domingo cuenta como final de su semana, no como principio)
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  function difDias(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }

  // ¿La prueba mide distancia (salto/lanzamiento)? Entonces MÁS es mejor.
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+me[d.getMonth()]; }
  function graficoPrueba(nombre, pts, masMejor, idx){
    var W=340,H=172,padL=14,padR=14,padT=38,padB=28;
    var ys=pts.map(function(p){return p.y;});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    var span=(max-min)||Math.max(Math.abs(max)*0.1,1); var lo=min-span*0.22, hi=max+span*0.22;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    function X(i){ return padL+(pts.length===1?plotW/2:plotW*i/(pts.length-1)); }
    function Y(v){ var t=(v-lo)/(hi-lo); return padT+plotH*(masMejor?(1-t):t); }
    var bestI=0; for(var b=1;b<pts.length;b++){ if(masMejor?pts[b].y>pts[bestI].y:pts[b].y<pts[bestI].y) bestI=b; }
    var gid='grad'+(idx||0);
    var grid=''; for(var g=0;g<=2;g++){ var gy=(padT+plotH*g/2).toFixed(1); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--linea)" stroke-width="1.9" stroke-dasharray="2 5"></line>'; }
    var coords=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.y).toFixed(1);});
    var area='M'+padL+','+(padT+plotH).toFixed(1)+' L'+coords.join(' L')+' L'+(W-padR)+','+(padT+plotH).toFixed(1)+' Z';
    var puntos=pts.map(function(p,i){ var x=X(i),y=Y(p.y); var best=(i===bestI&&pts.length>1);
      return (best?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="var(--azul)" opacity="0.16"></circle>':'')+
        '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(best?4.3:3)+'" fill="'+(best?'var(--azul-oscuro)':'#fff')+'" stroke="var(--azul)" stroke-width="1.9"></circle>'+
        '<text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(best?'var(--azul-oscuro)':'var(--navy)')+'">'+esc(p.disp)+'</text>'+
        '<text x="'+x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="8.5" fill="#9a958c">'+esc(fechaCorta(p.fecha))+'</text>';
    }).join('');
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de '+esc(nombre)+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--azul)" stop-opacity="0.28"></stop><stop offset="1" stop-color="var(--azul)" stop-opacity="0"></stop></linearGradient></defs>'+
      grid+'<path d="'+area+'" fill="url(#'+gid+')"></path>'+
      '<polyline fill="none" stroke="var(--azul)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" points="'+coords.join(' ')+'"></polyline>'+puntos+
      '<text x="'+padL+'" y="19" font-size="12.5" font-weight="700" fill="var(--navy)">'+esc(nombre)+'</text>'+
      '<text x="'+(W-padR)+'" y="19" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--azul-oscuro)">MMP '+esc(pts[bestI].disp)+'</text></svg>';
    var mej = masMejor ? (pts[pts.length-1].y - pts[0].y) : (pts[0].y - pts[pts.length-1].y);
    var u = masMejor ? ' m' : '', ley='';
    if(mej>0.001) ley='<span class="mejora">▲ '+mej.toFixed(2)+u+' mejor que al empezar</span>';
    else if(mej<-0.001) ley='▼ '+Math.abs(mej).toFixed(2)+u+' respecto al inicio';
    return '<div class="grafico">'+svg+(ley?'<div class="leyenda">'+ley+'</div>':'')+'</div>';
  }

  // ---- Ritmos personales: un "90%" se convierte en TU tiempo, según tu mejor marca ----
  var MMP = {};   // { 'nombre de prueba': {seg: 7.85, disp:'7.85'} }
  function segATexto(s){
    if(s==null||isNaN(s)) return '';
    if(s<60) return s.toFixed(2);                       // 7.85
    if(s<3600){                                          // 4:33.00
      var m=Math.floor(s/60), r=s-m*60;
      return m+':'+(r<10?'0':'')+r.toFixed(2);
    }
    var h=Math.floor(s/3600), mm=Math.floor((s-h*3600)/60), ss=Math.round(s-h*3600-mm*60);
    if(ss===60){ ss=0; mm++; }                           // 3:35:00 (maratón, ultras…)
    return h+':'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  }
  // Busca la mejor marca del atleta para la distancia de una fila (p. ej. "60 m" -> "60 m lisos")
  function mmpParaDistancia(dist){
    if(!dist) return null;
    var m=String(dist).match(/(\d[\d.,]*)\s*m/i); if(!m) return null;
    var metros=m[1].replace(/[.,]/g,'');
    var mejor=null;
    Object.keys(MMP).forEach(function(prueba){
      var pm=prueba.match(/(\d[\d.,]*)\s*m/i); if(!pm) return;
      if(pm[1].replace(/[.,]/g,'')===metros && (!mejor || MMP[prueba].seg<mejor.seg)) mejor=MMP[prueba];
    });
    return mejor;
  }
  // De "90%" o "90-95%" saca el tiempo objetivo. Menos % = más lento (tiempo = mmp / (%/100)).
  function ritmoPersonal(f){
    var r=f.ritmo; if(!r) return '';
    var pcts=String(r).match(/(\d{2,3})\s*%/g); if(!pcts||!pcts.length) return '';
    var base=mmpParaDistancia(f.distancia); if(!base) return '';
    var nums=pcts.map(function(p){ return parseFloat(p); }).filter(function(n){ return n>=40&&n<=110; });
    if(!nums.length) return '';
    var tiempos=nums.map(function(p){ return base.seg/(p/100); }).sort(function(a,b){ return a-b; });
    return tiempos.length>1 ? segATexto(tiempos[0])+'–'+segATexto(tiempos[tiempos.length-1]) : segATexto(tiempos[0]);
  }
  /* Un tiempo escrito como se lee en España: coma decimal, y «s» cuando es
     de segundos sueltos («44,8 s»). Los minutos siguen como 4:33,00. */
  function tiempoBonito(seg){
    if(seg==null||isNaN(seg)) return '';
    if(seg<60) return seg.toFixed(1).replace('.',',')+' s';
    return segATexto(seg).replace('.',',');
  }
  function comaDecimal(txt){
    return /^\d+\.\d+$/.test(String(txt||'')) ? String(txt).replace('.',',') : String(txt||'');
  }
  var MESES_LARGOS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function mesLargo(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); return isNaN(d.getTime())?'':MESES_LARGOS[d.getMonth()]; }
  /* «Para ti, 85 % son 44,8 s — desde tu 38,1 de mayo».
     ------------------------------------------------------------
     El maquetador lo pidió con la marca de referencia A LA VISTA: si solo
     saliera el tiempo calculado, el número parece inventado. Devuelve null
     —y entonces no se pinta nada— cuando el atleta no tiene marca de esa
     distancia. El de pesas está justo debajo, en `porcentajeRM`. */
  function porcentajeTuyo(f){
    if(!f || !f.ritmo) return null;
    var pcts=String(f.ritmo).match(/(\d{2,3})\s*%/g); if(!pcts||!pcts.length) return null;
    var base=mmpParaDistancia(f.distancia); if(!base||!base.disp) return null;
    var nums=pcts.map(function(p){ return parseFloat(p); }).filter(function(n){ return n>=40&&n<=110; });
    if(!nums.length) return null;
    nums.sort(function(a,b){ return a-b; });
    var tiempos=nums.map(function(p){ return base.seg/(p/100); }).sort(function(a,b){ return a-b; });
    var pctTxt = nums.length>1 ? nums[0]+'–'+nums[nums.length-1]+' %' : nums[0]+' %';
    var tTxt   = tiempos.length>1 ? tiempoBonito(tiempos[0])+'–'+tiempoBonito(tiempos[tiempos.length-1]) : tiempoBonito(tiempos[0]);
    var desde  = 'desde tu '+comaDecimal(base.disp)+(mesLargo(base.fecha)?' de '+mesLargo(base.fecha):'');
    return '<p class="pct-tuyo">Para ti, '+esc(pctTxt)+' son <b>'+esc(tTxt)+'</b> — '+esc(desde)+'.</p>';
  }

  /* «Para ti, 85 % son 68 kg — desde tu RM de 80 kg de marzo».
     ------------------------------------------------------------
     ⚠️ EN PESAS SE MULTIPLICA. En pista el porcentaje es de ESFUERZO y
     se divide (al 85 % corres MÁS LENTO que tu marca); aquí es de CARGA
     y se multiplica (al 85 % levantas MENOS que tu máximo). Hacerlo al
     revés no da un error, da un número creíble: un RM de 80 kg
     dividido por 0,85 son 94 kg, que es un peso de gimnasio
     perfectamente normal, y alguien se pondría un 118 % de su máximo
     creyendo que hace una serie suave. La cuenta vive en el módulo
     compartido (`pesoDesdeRM`) con el mismo aviso escrito al lado.

     Y LA REFERENCIA SIEMPRE A LA VISTA, como en pista: sin el «desde
     tu RM de 80 kg de marzo» el número parece inventado, y además nadie
     se daría cuenta de que su RM es de hace ocho meses.

     Si el atleta no tiene RM de ese ejercicio, devuelve null y no se
     pinta nada. Nunca un peso estimado. */
  function porcentajeRM(f){
    var D=DESC(); if(!D || !D.pctsRMdeFila) return null;
    var pcts=null;
    try { pcts=D.pctsRMdeFila(f); } catch(e){ return null; }
    if(!pcts || !pcts.length) return null;
    var mio=(RM||{})[claveEjercicio(f&&(f.ejercicio||f.nombre)||'')];
    if(!mio || !(mio.kg>0)) return null;
    var kgTxt='', pctTxt='';
    try { kgTxt=D.textoPesosRM(mio.kg, pcts); pctTxt=D.textoPctRM(pcts); } catch(e){ return null; }
    if(!kgTxt) return null;
    var desde='desde tu RM de '+comaDecimal(String(mio.kg))+' kg'+(mesLargo(mio.fecha)?' de '+mesLargo(mio.fecha):'');
    return '<p class="pct-tuyo">Para ti, '+esc(pctTxt)+' son <b>'+esc(kgTxt)+'</b> — '+esc(desde)+'.</p>';
  }

  function esSerie(f){ var n=parseInt(f.series,10); return (n>0 && n<=30)?n:0; }
  // Para meter texto dentro de un atributo: esc() no toca las comillas y un nombre
  // como 3x300 "al 90%" rompería el data-eje que usa el guardado.
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
  /* Módulo compartido de descansos: es quien escribe «rec 2' trote», «salida 1'00"»
     o «desc. 2'» según la disciplina, para que las cinco pantallas digan lo mismo.
     Si por lo que sea no ha cargado, se sigue pintando con lo de siempre. */
  function DESC(){ return window.APOLANA_DESCANSOS || null; }
  function disciplinaDe(s){
    var D=DESC(); if(!D) return null;
    try { return D.disciplinaDe(s, GRUPO); } catch(e){ return null; }
  }
  /* Las piezas de una fila: serie, ritmo y recuperación. La recuperación no es
     un adorno, define la sesión: 6×800 con 90" no tiene nada que ver con 6×800
     con 3'. Si un bloque no lleva descanso, la pieza no se pinta (nunca un «—»). */
  function piezasFila(f, dis){
    var D=DESC();
    if(D && dis){ try { return D.partesFila(f, dis)||[]; } catch(e){} }
    var p=[];
    if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
    else if(f.series) p.push(f.series+' series'); else if(f.distancia) p.push(String(f.distancia));
    if(f.ritmo) p.push('ritmo '+f.ritmo);
    if(f.descanso) p.push('rec. '+f.descanso);
    return p;
  }
  /* En natación «salida cada X» y «descanso de X» son cosas distintas y se
     confunden: el módulo da la palabra y el color de cada una. */
  function chipNatacion(f, dis){
    var D=DESC(); if(!D || dis!=='natacion') return '';
    var et=null;
    try { et=D.etiquetaNatacion(D.recDeFila(f, dis)); } catch(e){ return ''; }
    if(!et) return '';
    return '<span class="fchip nat" title="'+escA(et.ayuda||'')+'" style="color:'+et.color+';background:'+et.fondo+';border:1px solid '+et.borde+'">'+
           esc(et.texto)+' '+esc(et.valor)+'</span>';
  }
  /* `leer` = día ya pasado y con lo suyo apuntado: entonces los tiempos se
     enseñan como lista, no como huecos para escribir. `hechos` son los que
     guardó ese día. */
  /* ------------------------------------------------------------
     QUÉ SE APUNTA EN CADA EJERCICIO
     La pantalla pedía «apuntar el tiempo» en TODOS los ejercicios,
     y en una sentadilla nadie apunta un tiempo: apunta los kilos y
     las repeticiones. El módulo compartido decide qué se pide, a
     partir del deporte del entrenamiento y de lo que el entrenador
     escribió en la fila. Si el módulo no ha cargado, se cae a lo de
     siempre (un tiempo), que es como estaba.
     ------------------------------------------------------------ */
  var MEDIDA_TIEMPO={ clave:'tiempo', campos:[{k:'tiempo', unidad:null, decimal:true}], unidades:null };
  function medidaDe(f, s){
    var D=DESC(); if(!D || !D.medidaDeFila) return MEDIDA_TIEMPO;
    try { return D.medidaDeFila(f, { deporte: (s&&s.deporte)||'' }) || MEDIDA_TIEMPO; }
    catch(e){ return MEDIDA_TIEMPO; }
  }
  /* La unidad elegida para un ejercicio de distancia. Se recuerda por grupo:
     quien pone series todo el rato no debería tocar el conmutador nunca.
     Metros por defecto, que es lo mayoritario en pista. */
  function claveUnidad(){ return 'apolana.entreno.unidad.'+(at&&at.grupo_id||'sin-grupo'); }
  function unidadRecordada(){
    try { var v=window.localStorage.getItem(claveUnidad()); if(v==='km'||v==='m') return v; } catch(e){}
    return 'm';
  }
  function recordarUnidad(u){
    if(u!=='m' && u!=='km') return;
    try { window.localStorage.setItem(claveUnidad(), u); } catch(e){}
  }
  var VISTO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg>';

  /* «La última vez: 60 kg × 11», la propuesta de lo que hiciste el otro día en
     ESTE mismo ejercicio. Se guarda por nombre de ejercicio, normalizado. */
  var ULTIMA_EJ={};
  function claveEjercicio(nom){
    var t=String(nom||'').toLowerCase();
    if(t.normalize) t=t.normalize('NFD').replace(/[̀-ͯ]/g,'');
    return t.replace(/\s+/g,' ').trim();
  }

  /* Cómo se llama la casilla de arriba: «Tus kilos», «Tus tiempos»… Es lo que
     avisa de un vistazo de que aquí no se apunta un tiempo. */
  function tituloCampos(med){
    if(med.clave==='peso_reps') return 'Peso y repeticiones';
    if(med.clave==='peso')      return 'Peso';
    /* Saltos y vallas: se cuentan repeticiones y no hay kilos que
       apuntar, que es lo que pidió el club para El Cubo. */
    if(med.clave==='reps')      return 'Repeticiones';
    if(med.clave==='distancia') return 'Lo que hiciste';
    if(med.clave==='hecho')     return '¿Lo hiciste?';
    return 'Tus tiempos';
  }
  /* El nombre largo del campo, para quien navega con lector de pantalla: ahí la
     unidad tiene que ir dicha, porque el «kg» de al lado no se lee solo. */
  function etiquetaCampo(c, uni, i, n, nom){
    var que = c.k==='peso' ? 'Peso en kilos' : c.k==='reps' ? 'Repeticiones'
            : c.k==='distancia' ? ('Distancia en '+(uni==='km'?'kilómetros':'metros')) : 'Tiempo';
    return que+' de la serie '+(i+1)+' de '+n+' de '+nom;
  }

  /* ------------------------------------------------------------
     ENCONTRAR LO QUE EL ATLETA APUNTÓ DE UNA FILA
     Primero por el id de la fila (migración 103), que no se mueve aunque el
     entrenador meta un ejercicio en medio. Si no está, por la llave de posición
     de siempre, que es como quedaron guardados los registros de antes.

     Y una comprobación más: si el nombre del ejercicio guardado no coincide con
     el de la fila, es que el entrenador cambió el ejercicio de sitio en esa
     misma fila. Entonces no se cuelga lo apuntado del ejercicio nuevo, porque
     sería atribuirle unos kilos que no son suyos.
     ------------------------------------------------------------ */
  function registroDeFila(hechos, f, key){
    if(!hechos) return null;
    var r = (f && f.id && hechos[f.id]) || hechos[key] || null;
    if(!r) return null;
    var guardadoNom=claveEjercicio(r.ejercicio||'');
    var filaNom=claveEjercicio(f&&(f.ejercicio||f.nombre)||'');
    /* Los registros viejos guardaban en `ejercicio` la serie («6 × 400»), no el
       nombre, así que un desacuerdo solo descarta cuando los dos son nombres
       de verdad y además la llave era la de posición. */
    if(!(f&&f.id&&hechos[f.id]) && guardadoNom && filaNom && guardadoNom!==filaNom
       && !/[×x]\s*\d/.test(r.ejercicio||'')) return null;
    return r;
  }

  /* Las series de un registro, normalizadas: la forma nueva (con su ✓ y sus
     campos) y la vieja (una lista de tiempos, donde un tiempo escrito quiere
     decir que esa serie se hizo). */
  function seriesDe(reg, n){
    var out=[];
    var D=DESC();
    var med = reg && reg.medida ? { clave: reg.medida } : null;
    for(var i=0;i<n;i++){
      var s=(reg && Array.isArray(reg.series) && reg.series[i]) || null;
      if(s){
        var txt='';
        if(D && D.textoSerieHecha && med){ try { txt=D.textoSerieHecha(s, med)||''; } catch(e){} }
        if(!txt && s.tiempo!=null) txt=String(s.tiempo);
        out.push({ hecha: !!s.hecha, txt: txt, val: s });
      } else {
        var v=(reg && Array.isArray(reg.tiempos) && reg.tiempos[i]!=null) ? String(reg.tiempos[i]).trim() : '';
        out.push({ hecha: !!v, txt: v, val: null });
      }
    }
    return out;
  }

  function filaHTML(f, key, dis, leer, hechos, s){
    var nomMandado=f.ejercicio||f.nombre||'';
    var parts=piezasFila(f, dis).slice();
    if(f.tiempo) parts.push(String(f.tiempo));
    if(f.detalle) parts.push(String(f.detalle));
    if(f.nota) parts.push(String(f.nota));
    var chips=parts.map(function(p){return '<span class="fchip">'+esc(p)+'</span>';}).join('');
    chips+=chipNatacion(f, dis);
    var tuyo=ritmoPersonal(f);
    var n=esSerie(f);
    var med=medidaDe(f, s);
