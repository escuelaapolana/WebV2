    if(sec==='marcas')
      return '<div class="at-cab"><h1>Marcas</h1>'+
        '<button type="button" class="at-acc" id="mk-abrir" aria-expanded="false" aria-controls="mk-form">Añadir</button></div>';
    if(sec==='pagos')
      return '<div class="at-cab"><div><span class="sub">Lo que el club te gira</span><h1>Pagos</h1></div></div>';
    if(sec==='recursos')
      return '<div class="at-cab"><div><span class="sub">Fuerza, gomas y movilidad de '+esc((GRUPO&&GRUPO.nombre)||'tu grupo')+'</span><h1>Recursos</h1></div></div>';
    if(sec==='mas') return '<div class="at-cab"><h1>Más</h1></div>';
    return '<div class="at-cab"><div><span class="sub">'+esc(fechaLarga(todayISO))+'</span>'+
      '<h1>Hola, '+esc(perfil.nombre||nombre)+'</h1></div>'+
      '<div class="at-ini" aria-hidden="true">'+esc(ini)+'</div></div>';
  }
  function pintarCabecera(){ $('cab-cont').innerHTML = cabeceraDe(SEC); }

  // ---------- RECURSOS DEL GRUPO ----------
  /* Su propia pantalla, no un cajón enterrado en «Más → Documentos». Trae solo
     el material del grupo del atleta (fuerza, gomas, movilidad…), agrupado por
     tipo y con un emoji grande para que se vea de un vistazo. La RLS ya deja
     llegar únicamente lo de SUS grupos, así que aquí no se vuelve a filtrar por
     quién eres. Se carga una sola vez, al entrar. */
  var RECURSOS_LISTOS=false;
  var REC_ICONO={ 'fuerza':'💪','gomas':'➰','movilidad':'🧘','core':'🌀',
    'técnica':'🎯','tecnica':'🎯','calentamiento':'🔥','vídeo':'▶️','video':'▶️',
    'rutina':'📋','otros':'📄' };
  function recIcono(c){ return REC_ICONO[String(c||'').toLowerCase()] || '📄'; }
  function recTam(b){ if(!b) return ''; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1).replace('.',',')+' MB'; }
  function recReservado(v){ return !!v && !/^https?:\/\//i.test(v); }

  async function entrarRecursos(){
    if(RECURSOS_LISTOS) return;
    RECURSOS_LISTOS=true;
    var cont=$('recursos-cont'); if(!cont) return;

    var r=await sb.from('documentos')
      .select('titulo,descripcion,categoria,archivo_url,nombre_archivo,tamano_bytes,visibilidad,orden,grupo_id')
      .eq('visibilidad','grupo').eq('activo',true).order('categoria').order('orden');

    if(r.error){
      RECURSOS_LISTOS=false;
      cont.innerHTML = APOLANA_UI.error('No hemos podido cargar los recursos',
        'Puede ser tu conexión. Vuelve a intentarlo en un momento.');
      return;
    }
    var docs=r.data||[];
    if(!docs.length){
      cont.innerHTML = APOLANA_UI.vacio('Todavía no hay recursos',
        'Aquí irá el material que cuelgue tu entrenador: fuerza, gomas, movilidad… En cuanto suba el primero, aparecerá aquí.');
      return;
    }

    function recDocHTML(d){
      var ext=(d.nombre_archivo||'').split('.').pop().toUpperCase();
      var meta=[ext && ext.length<=5 ? ext : '', recTam(d.tamano_bytes)].filter(Boolean).join(' · ');
      var abre=recReservado(d.archivo_url)
        ? 'href="#" data-reservado="'+escA(d.archivo_url)+'"'
        : 'href="'+escA(d.archivo_url)+'" target="_blank" rel="noopener" download';
      return '<a class="rec-doc" '+abre+'>'+
        '<span class="rec-doc-ico" aria-hidden="true">'+recIcono(d.categoria)+'</span>'+
        '<span class="rec-doc-info">'+
          '<span class="rec-doc-tit">'+esc(d.titulo)+'</span>'+
          (d.descripcion?'<span class="rec-doc-desc">'+esc(d.descripcion)+'</span>':'')+
          (meta?'<span class="rec-doc-meta">'+esc(meta)+'</span>':'')+
        '</span>'+
        '<span class="rec-doc-baja" aria-hidden="true">'+((window.APOLANA_UI&&APOLANA_UI.icono)?APOLANA_UI.icono('descargar',22):'↓')+'</span>'+
      '</a>';
    }

    var porCat={};
    docs.forEach(function(d){ var c=d.categoria||'Otros'; (porCat[c]=porCat[c]||[]).push(d); });
    var cats=Object.keys(porCat).sort(function(a,b){ return a.localeCompare(b,'es'); });

    var chips='';
    if(cats.length>1){
      chips='<div class="rec-filtros"><button type="button" class="rec-chip activo" data-cat="">Todo</button>'+
        cats.map(function(c){ return '<button type="button" class="rec-chip" data-cat="'+escA(c)+'">'+esc(c)+'</button>'; }).join('')+
        '</div>';
    }
    cont.innerHTML = chips + cats.map(function(c){
      return '<div class="rec-cat" data-cat="'+escA(c)+'">'+
        (cats.length>1?'<h3 class="rec-cat-tit">'+esc(c)+'</h3>':'')+
        porCat[c].map(recDocHTML).join('')+'</div>';
    }).join('');

    // Filtros: mostrar/ocultar categorías. No vuelve a pedir nada.
    cont.addEventListener('click', function(ev){
      var chip=ev.target && ev.target.closest ? ev.target.closest('.rec-chip') : null;
      if(!chip) return;
      var cat=chip.getAttribute('data-cat');
      cont.querySelectorAll('.rec-chip').forEach(function(b){ b.classList.toggle('activo', b===chip); });
      cont.querySelectorAll('.rec-cat').forEach(function(bl){ bl.hidden = !!cat && bl.getAttribute('data-cat')!==cat; });
    });

    // Recurso reservado: enlace temporal de un minuto, pedido en la pulsación.
    cont.addEventListener('click', async function(ev){
      var a=ev.target && ev.target.closest ? ev.target.closest('a[data-reservado]') : null;
      if(!a) return;
      ev.preventDefault();
      var v=window.open('','_blank');
      var s=await sb.storage.from('documentos-socios').createSignedUrl(a.getAttribute('data-reservado'),60);
      if(!s || s.error || !s.data || !s.data.signedUrl){
        if(v) v.close();
        if(window.APX) APX.toast('No hemos podido abrir el recurso','error',{detalle:'Prueba otra vez en un momento.'});
        return;
      }
      if(v) v.location.href=s.data.signedUrl; else window.location.href=s.data.signedUrl;
    });
  }

  // ---------- navegación por secciones ----------
  /* «Recursos del grupo» solo es una sección de verdad cuando el grupo tiene
     material colgado: si no hay nada, no se pinta ni el apartado ni su enlace,
     para no llevar a una pantalla vacía. */
  var SECCIONES = RECURSOS_GRUPO>0
    ? ['hoy','entreno','recursos','marcas','pagos','mas']
    : ['hoy','entreno','marcas','pagos','mas'];
  var SEC='hoy';
  /* La barra de abajo va SIEMPRE, en todas las secciones. Antes se quitaba al
     entrar en «entreno», para dejar la pantalla despejada, y el efecto era que
     desde ahí no se podía ir a ningún sitio: había que volver atrás a mano. */
  function pintarTabbar(){ $('tabbar-cont').innerHTML = tabbarHTML(SEC); }
  function activarSeccion(sec){
    SEC=sec;
    /* ⚠️ Y SE ESCRIBE EN LA DIRECCIÓN. Sin esto, recargar te devolvía al
       principio: el navegador no tenía forma de saber en qué apartado estabas,
       porque la dirección era la misma en todos. Con el móvil, donde recargar
       pasa solo —tirar hacia abajo, volver a la pestaña al rato— eso significa
       perder el sitio a cada rato.

       `replaceState` y no `pushState`: se quiere volver donde estabas al
       RECARGAR, no llenar el botón de atrás con cada apartado que hayas
       tocado. Atrás sigue sacándote del portal, que es lo que espera todo el
       mundo. */
    try { history.replaceState(null, '', '#'+sec); } catch(e){ /* sin historial, la pantalla va igual */ }
    wrap.querySelectorAll('.side nav a').forEach(function(x){ x.classList.toggle('activo', x.getAttribute('data-sec')===sec); });
    SECCIONES.forEach(function(s){ $('sec-'+s).hidden = (s!==sec); });
    document.body.classList.toggle('trabajo', sec==='entreno');
    pintarCabecera();
    /* La cabecera se vuelve a pintar entera, así que las flechas de día se
       han ido con ella: se devuelven en cuanto se vuelve al entrenamiento. */
    if(sec==='entreno' && diaSel) vecinosDe(diaSel).then(function(v){ pintarFlechas(diaSel, v); });
    if(sec==='entreno') pintarVerComo();
    if(sec==='mas') pintarMas();
    if(sec==='recursos') entrarRecursos();
    pintarTabbar();
  }
  pintarCabecera();
  pintarTabbar();
  // Un solo manejador: sirve para la barra lateral, para la barra inferior y
  // para el «Salir» de la cabecera de trabajo.
  wrap.addEventListener('click', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var salir=t.closest('#cab-cont [data-sec-ir]');
    if(salir){ activarSeccion(salir.getAttribute('data-sec-ir')); window.scrollTo(0,0); return; }
    // Las flechas de día de la tira navy: el mismo salto que las del pie
    var flecha=t.closest('#cab-cont [data-ir-dia]');
    if(flecha && flecha.getAttribute('data-ir-dia')){ abrirDiaHistorial(flecha.getAttribute('data-ir-dia')); return; }
    var abrir=t.closest('#mk-abrir');
    if(abrir){
      var f=$('mk-form'); if(!f) return;
      f.hidden=!f.hidden;
      abrir.setAttribute('aria-expanded', f.hidden?'false':'true');
      if(!f.hidden) $('mk-prueba').focus();
      return;
    }
    var a=t.closest('.side nav a[data-sec], .tabbar a[data-sec]');
    if(!a) return;
    activarSeccion(a.getAttribute('data-sec'));
    window.scrollTo(0,0);
  });

  // ---------- ENTRENO POR SEMANAS ----------
  var SEM={};              // { lunesISO: [sesiones de esa semana] }  (caché, una consulta por semana)
  var REG={};              // { sesion_id: registro de sensaciones ya guardado }
  var lunesVis=lunesDe(todayISO);   // lunes de la semana que se está viendo
  var diaSel=todayISO;              // día elegido en la tira
  var MODO='hoy';                   // conmutador: hoy · semana · historial

  /* ------------------------------------------------------------
     VER LA SEMANA DE CADA ATLETA (solo para el entrenador)
     El entrenador es también atleta, y el permiso del servidor le deja
     ver TODAS las sesiones de sus atletas. Aquí eso se ordena: por
     defecto se ve lo de UNO MISMO (`VIENDO = at.id`), que además arregla
     que antes se le colaban las sesiones de los demás. Y si entrena a
     alguien, un selector le deja mirar la semana de cada atleta como la
     ve él —en SOLO LECTURA, que no le va a apuntar el feedback en su
     nombre—. A un atleta normal `COACH_ATLETAS` viene vacío: ni ve el
     selector ni cambia nada, porque el servidor ya solo le manda lo suyo.
     ------------------------------------------------------------ */
  var VIENDO = at.id;               // de quién se está viendo la semana (en Entreno)
  var COACH_ATLETAS = [];           // [{id,nombre,apellidos}] atletas que entreno
  function esOtro(){ return VIENDO !== at.id; }
  function esDe(s, id){ return !s.atletas_ids || (s.atletas_ids.indexOf(id) !== -1); }
  function sesDe(lista, id){ return (lista||[]).filter(function(s){ return esDe(s, id); }); }

  /* ¿Entreno a alguien? Son los atletas cuya ficha me tiene como entrenador.
     ⚠️ Esta consulta va AQUÍ, justo DESPUÉS de `var COACH_ATLETAS = []`, no
     antes: si va antes, el `var … = []` de arriba se ejecuta después por el
     hoisting y vacía la lista recién cargada. (Ese fue el bug de que el
     selector no saliera.) A un atleta normal esto vuelve vacío y no cambia nada. */
  if(perfil && perfil.id){ try {
    /* Solo los atletas de los grupos que ENTRENO de verdad, no toda ficha que
       me tenga como entrenador (así no se cuelan cuentas de prueba de otras
       secciones). */
    var gq = await sb.from('grupos').select('id').eq('entrenador_id', perfil.id);
    var misG = (!gq.error && gq.data) ? gq.data.map(function(g){ return g.id; }) : [];
    if(misG.length){
      var caq = await sb.from('atletas').select('id,nombre,apellidos,grupo_id').eq('entrenador_id', perfil.id).order('apellidos');
      if(!caq.error && caq.data) COACH_ATLETAS = caq.data.filter(function(a){ return a.id !== at.id && misG.indexOf(a.grupo_id) !== -1; });
    }
  } catch(e){} }

  function rangoTxt(lunes){ return 'Semana del '+fechaCorta(lunes)+' – '+fechaCorta(addDias(lunes,6)); }
  /* Chip diminuto de la tira de días: aquí no cabe «entrenamiento», así que se
     dice el DEPORTE, que es lo que hace falta para saber qué meter en la bolsa.
     Cuando el día son dos deportes se dicen los dos, porque si solo pusiera
     «fuerza» uno se presenta sin las zapatillas de clavos. */
  /* `bici` y `otro` solo salen de lo que se apunta uno por su cuenta
     (migración 146): el club no planifica ciclismo, pero la gente sale
     con la bici. */
  var DEPORTE_CORTO={ atletismo:'atletismo', natacion:'natación', fuerza:'fuerza', cubo:'El Cubo',
                      bici:'bici', otro:'otro' };
  var TIPO_CORTO_VIEJO={ pista:'pista', gym:'fuerza', continuo:'rodaje', activacion:'activ.', competicion:'compe.', descanso:'descanso' };
  function deporteCorto(s){
    if(!s) return 'entren.';
    var a=DEPORTE_CORTO[s.deporte]||'', b=DEPORTE_CORTO[s.deporte_2]||'';
    if(a&&b) return a+' + '+b;
    if(a) return a;
    return tipoCorto(s.tipo);
  }
  function tipoCorto(t){
    return TIPO_CORTO_VIEJO[t]||(t?String(t).slice(0,8):'entren.');
  }
  function sesionesDe(iso){ return (SEM[lunesVis]||[]).filter(function(s){ return s.fecha===iso && esDe(s, VIENDO); }); }

  // Trae las sesiones publicadas de la semana. Sin filtrar por grupo: el permiso del
  // servidor ya devuelve solo lo mío, incluidos los entrenos preparados solo para mí.
  /* Semanas cuya consulta ha fallado. Sin esto, un fallo de conexión se veía
     igual que una semana sin entrenos: «hoy no toca» a alguien que sí tiene
     entreno, y a las siete de la tarde eso es quedarse en casa. */
  var SEM_FALLO={};
  async function cargarSemana(lunes){
    if(SEM[lunes]) return SEM[lunes];
    var lista=[];
    delete SEM_FALLO[lunes];
    try {
      var se=await sb.from('sesiones')
        .select('id,fecha,dia_semana,tipo,rol,deporte,deporte_2,papel_dia,titulo,nota_razonamiento,bloques,atletas_ids,origen')
        .eq('publicada',true).gte('fecha',lunes).lte('fecha',addDias(lunes,6))
        .order('fecha',{ascending:true});
      if(se.error) SEM_FALLO[lunes]=true; else lista=se.data||[];
    } catch(e){ SEM_FALLO[lunes]=true; }
    /* Una semana que ha fallado NO se guarda como cargada: así el reintento
       vuelve a preguntar de verdad en vez de devolver la lista vacía. */
    if(SEM_FALLO[lunes]) return lista;
    SEM[lunes]=lista;
    var ids=lista.map(function(s){ return s.id; });
    if(ids.length){ try {
      /* Se piden los campos por su nombre, no `*`. Son los nueve que se
         usan de verdad para rellenar el formulario de feedback; los otros
         tres (id, atleta_id y la hora en que se guardó) no los mira nadie
         en esta pantalla y viajaban por costumbre. */
      var rg=await sb.from('registros_sesion')
        .select('id,sesion_id,sensacion_general,rpe,tiempos_reales,como_me_siento,molestias,notas_atleta,horas_sueno,peso_kg,estado,series_hechas,series_previstas,motivo_no_hecho,nota_no_hecho,corregido_en,corregido_veces')
        .eq('atleta_id',at.id).in('sesion_id',ids);
      if(!rg.error && rg.data) rg.data.forEach(function(r){ REG[r.sesion_id]=r; });
      /* El `id` del registro se pide desde ahora porque es por donde cuelga
         el comentario del entrenador. Antes no lo miraba nadie y viajaba
         de más; ahora hace falta. */
      await cargarComentarios(lista);
    } catch(e){} }
    return lista;
  }

  /* ------------------------------------------------------------
     EL COMENTARIO DEL ENTRENADOR
     Lo que cierra «hablar con el atleta» sin que tengan que coincidir en
     la pista. Se pide junto con la semana y de una vez para todos los
     días: son dos o tres registros, no vale la pena una consulta por día.

     El permiso (migración 105) ya se encarga de que aquí solo llegue lo
     del propio atleta. Las familias no ven ni esto ni el entrenamiento.
     ------------------------------------------------------------ */
  var COMENT={};        // { sesion_id: { texto, quien, cuando, editado } }
  var NOMBRE_ENT={};    // { perfil_id: 'Nacho' }  (la vista pública, solo el nombre)
  async function cargarComentarios(lista){
    var porReg={}, regIds=[];
    (lista||[]).forEach(function(s){
      var r=REG[s.id];
      if(r && r.id){ porReg[r.id]=s.id; regIds.push(r.id); }
    });
    if(!regIds.length) return;
    try {
      var fq=await sb.from('feedback_entrenamientos')
        .select('registro_id,entrenador_id,comentario,created_at,editado_en')
        .in('registro_id',regIds).order('created_at',{ascending:true});
      if(fq.error || !fq.data) return;
      var faltan=[];
      fq.data.forEach(function(c){
        var sid=porReg[c.registro_id]; if(!sid || !c.comentario) return;
        COMENT[sid]={ texto:c.comentario, quien:c.entrenador_id, cuando:c.created_at, editado:c.editado_en };
        if(c.entrenador_id && !NOMBRE_ENT[c.entrenador_id] && faltan.indexOf(c.entrenador_id)===-1) faltan.push(c.entrenador_id);
      });
      /* El nombre sale de la vista pública de entrenadores: solo el nombre,
         ni correos ni teléfonos ni el resto de su ficha. */
      if(faltan.length){
        var eq=await sb.from('entrenadores_publicos').select('id,nombre').in('id',faltan);
        if(!eq.error && eq.data) eq.data.forEach(function(e){ NOMBRE_ENT[e.id]=e.nombre||''; });
      }
    } catch(e){}
  }

  /* «Nacho, tu entrenador» y debajo lo que te dijo. Va al final del
     detalle del entrenamiento: se lee después de ver lo que hiciste, que
     es cuando tiene sentido. Si no hay comentario, no hay hueco. */
  function comentarioHTML(s){
    var c=COMENT[s.id]; if(!c || !c.texto) return '';
    var nom=(c.quien && NOMBRE_ENT[c.quien]) || '';
    var quien = nom ? nom+', tu entrenador' : 'Tu entrenador';
    /* Que se sepa cuándo se dijo, y si se retocó más tarde: un comentario
       reescrito semanas después no es el mismo comentario. */
    var pie=[];
    if(c.cuando) pie.push(fechaDiaMes(String(c.cuando).slice(0,10)));
    if(c.editado) pie.push('corregido el '+fechaDiaMes(String(c.editado).slice(0,10)));
    return '<div class="coment-ent">'+
      '<div class="ce-quien">'+esc(quien)+'</div>'+
      '<div class="ce-txt">'+esc(c.texto)+'</div>'+
      (pie.length?'<div class="ce-cuando">'+esc(pie.join(' · '))+'</div>':'')+
      '</div>';
  }

  /* ------------------------------------------------------------
     LO QUE HICISTE LA ÚLTIMA VEZ EN ESE MISMO EJERCICIO
     Se pide una sola vez al entrar y se guarda por nombre de ejercicio. Es lo
     que hace que apuntar una serie sea cero toques si repites y uno si subes
     peso; si hubiera que teclearlo todo cada vez, esto se abandona a la tercera
     sesión y el historial se queda vacío.

     Es una PROPUESTA, no un dato: hasta que el atleta no la confirma, no es
     suya. Por eso se enseña en gris y hay que tocarla.
     ------------------------------------------------------------ */
  async function cargarUltimaVez(){
    try {
      var r=await sb.from('registros_sesion').select('tiempos_reales,created_at')
              .eq('atleta_id',at.id).not('tiempos_reales','is',null)
              .order('created_at',{ascending:false}).limit(40);
      if(r.error||!r.data) return;
      var D=DESC();
      r.data.forEach(function(reg){                 // del más reciente al más viejo
        var tr=reg.tiempos_reales; if(!tr || typeof tr!=='object') return;
        Object.keys(tr).forEach(function(k){
          var e=tr[k]; if(!e || !e.ejercicio) return;
          var clave=claveEjercicio(e.ejercicio); if(!clave) return;
          /* Tu tope en repeticiones, para los ejercicios corporales: las que
             más has hecho de TODO lo que has apuntado, no las del último día.
             Es un dato tuyo y no una estimación, y sale de aquí porque de las
             dominadas nadie toma una repetición máxima en kilos.
             Va antes del corte de abajo a propósito: si estuviera después,
             solo miraría el día más reciente de cada ejercicio. */
          if(Array.isArray(e.series)) e.series.forEach(function(x){
            if(!x || !x.hecha || x.peso) return;
            var rp=parseInt(x.reps,10);
            if(rp>0 && (!TOPE_REPS[clave] || rp>TOPE_REPS[clave])) TOPE_REPS[clave]=rp;
          });
          /* ⚠️ ESTO VA ANTES DEL CORTE. Debajo hay un `return` que salta los
             días más viejos de un ejercicio que ya tenemos: si el histórico se
             recogiera después, cada ejercicio tendría UN solo punto y no habría
             gráfica que dibujar. Mismo motivo que el tope de repeticiones. */
          if(Array.isArray(e.series)){
            var mejor=0;
            e.series.forEach(function(x){
              if(!x || !x.hecha) return;
              var kg=parseFloat(String(x.peso||'').replace(',','.'));
              if(kg>0 && kg>mejor) mejor=kg;
            });
            if(mejor>0){
              var dia=String(reg.created_at||'').slice(0,10);
              var lista=(HIST_FUERZA[clave]=HIST_FUERZA[clave]||[]);
              /* Un día, un punto: si se apuntó dos veces el mismo día se queda
                 el peso más alto. */
              var ya=null;
              for(var q=0;q<lista.length;q++) if(lista[q].fecha===dia){ ya=lista[q]; break; }
              if(ya){ if(mejor>ya.kg) ya.kg=mejor; }
              else lista.push({ fecha:dia, kg:mejor, nom:String(e.ejercicio) });
            }
          }
          if(ULTIMA_EJ[clave]) return;              // ya tenemos una más reciente
          /* La última serie que de verdad se hizo: si la última quedó sin hacer,
             proponerla en blanco no ayudaría a nadie. */
          var buena=null;
          if(Array.isArray(e.series)){
            for(var i=e.series.length-1;i>=0;i--){
              var s=e.series[i];
              if(s && s.hecha && (s.peso||s.reps||s.tiempo||s.distancia)){ buena=s; break; }
            }
          }
          if(!buena) return;
          var txt='';
          if(D && D.textoSerieHecha){ try { txt=D.textoSerieHecha(buena,{clave:e.medida||'tiempo'})||''; } catch(x){} }
          if(!txt) return;
          /* ⚠️ SE GUARDAN TODAS LAS SERIES, NO SOLO LA ÚLTIMA.
             Con una sola no se decide nada: «15 kg × 10» puede venir de
             11-10-10 —que es irse cayendo— o de 5-8-10, que es subir. Para
             saber si hoy toca subir peso hace falta ver la serie entera. */
          var todas=[];
          if(Array.isArray(e.series)) e.series.forEach(function(x){
            if(!x || !x.hecha) return;
            if(!(x.peso||x.reps||x.tiempo||x.distancia)) return;
            var t2='';
            if(D && D.textoSerieHecha){ try { t2=D.textoSerieHecha(x,{clave:e.medida||'tiempo'})||''; } catch(y){} }
            if(t2) todas.push(t2);
          });
          /* El nombre tal y como se escribe, además de la llave sin tildes: es
             lo que se enseña en las sugerencias de «los que ya haces». */
          ULTIMA_EJ[clave]={ txt: txt, todas: todas, fecha: (reg.created_at||''), campos: buena, nom: String(e.ejercicio) };
        });
      });
    } catch(e){}
  }

  function pintarSemana(){
    $('sem-rango').textContent=rangoTxt(lunesVis);
    var nom=['lun','mar','mié','jue','vie','sáb','dom'], html='';
    for(var i=0;i<7;i++){
      var iso=addDias(lunesVis,i), ses=sesionesDe(iso);
      var num=new Date(iso+'T00:00:00').getDate();
      var cls='dia'+(ses.length?'':' vacio')+(iso===HOY_ISO?' hoy':'')+(iso===diaSel?' sel':'');
      var marca, titulo;
      if(ses.length){
        var personal=ses.some(function(s){ return s.atletas_ids!=null; });
        var etiqueta=deporteCorto(ses[0])+(ses.length>1?' +'+(ses.length-1):'');
        /* Mirar hacia atrás sirve de poco si todos los días se ven igual.
           El día en el que apuntaste cómo te fue lleva un visto en vez del
           punto: de un vistazo se ve lo que hiciste y lo que se quedó sin
           contar. Es una forma distinta, no solo otro color. */
        var apuntado=ses.every(function(s){ return !!REG[s.id]; });
        marca=(apuntado
                ? '<span class="d-hecho'+(personal?' personal':'')+'" aria-hidden="true">✓</span>'
                : '<span class="d-punto'+(personal?' personal':'')+'"></span>')+
              '<span class="d-tipo">'+esc(etiqueta)+'</span>';
        titulo=formatFecha(iso)+': '+(ses[0].titulo||'entrenamiento')+(ses.length>1?' (y '+(ses.length-1)+' más)':(personal?' · solo para ti':''))+
               (apuntado?' · ya apuntaste cómo te fue':'');
      } else {
        marca='<span class="d-tipo">libre</span>';
        titulo=formatFecha(iso)+': sin entrenamiento';
      }
      html+='<button type="button" class="'+cls+'" data-dia="'+iso+'" title="'+esc(titulo)+'" aria-pressed="'+(iso===diaSel?'true':'false')+'">'+
        '<span class="d-nom">'+(iso===HOY_ISO?'hoy':nom[i])+'</span><span class="d-num">'+num+'</span>'+marca+'</button>';
    }
    $('sem-dias').innerHTML=html;
    /* La tira se desliza, y en una semana de siete días el domingo queda
       fuera de la vista: abrías la app un domingo y no veías el día en el
       que estabas. Se coloca sola en el día marcado. */
    var tira=$('sem-dias');
    var foco=tira && (tira.querySelector('.dia.sel') || tira.querySelector('.dia.hoy'));
    if(foco && tira.scrollWidth>tira.clientWidth){
      /* centrado, y sin animación: al abrir tiene que estar ya puesto */
      tira.scrollLeft = Math.max(0, foco.offsetLeft - (tira.clientWidth - foco.offsetWidth)/2);
    }
  }

  // Tarjeta "¿Cómo ha ido?" de UNA sesión, rellenada con lo que ya haya guardado.
  // Puntuar es tocar una ficha del 1 al 10; el resto del formulario queda plegado.
  function fichaFeedback(s){
    var reg=REG[s.id]||null;
    // Fila de fichas 1-10 que escribe en un campo oculto (así se guarda igual que antes)
    function escala(destino, sel){
      var f=''; for(var i=1;i<=10;i++) f+='<button type="button" class="esc'+(String(sel)===String(i)?' sel':'')+'" data-esc="'+destino+'" data-v="'+i+'" aria-pressed="'+(String(sel)===String(i)?'true':'false')+'">'+i+'</button>';
      return '<div class="escala" role="group">'+f+'</div>'+
             '<input type="hidden" class="'+destino+'" value="'+esc(sel!=null?sel:'')+'">';
    }
    var hayDetalles = !!(reg && (reg.como_me_siento||reg.molestias||reg.notas_atleta||reg.horas_sueno!=null||reg.peso_kg!=null));
    return '<div class="tarjeta fb-card"><h2>¿Cómo ha ido?</h2>'+
      '<div class="escala-tit"><b>Sensación general</b><span>1 fatal · 10 genial</span></div>'+
      escala('fb-sensacion', reg&&reg.sensacion_general)+
      '<div class="escala-tit"><b>Esfuerzo (RPE)</b><span>1 muy suave · 10 al límite</span></div>'+
      escala('fb-rpe', reg&&reg.rpe)+
      '<button type="button" class="fb-mas'+(hayDetalles?' abierto':'')+'" aria-expanded="'+(hayDetalles?'true':'false')+'"><span class="fl">&rsaquo;</span>Añadir detalles</button>'+
      '<div class="fb-detalles"'+(hayDetalles?'':' hidden')+'>'+
        '<label>¿Cómo te sientes?</label><input class="fb-siento" type="text" value="'+esc(reg&&reg.como_me_siento||'')+'" placeholder="con energía, cansado…">'+
        '<label>Molestias (si hay)</label><input class="fb-molestias" type="text" value="'+esc(reg&&reg.molestias||'')+'" placeholder="ninguna / gemelo derecho…">'+
        '<label>Notas para el entrenador</label><textarea class="fb-notas" placeholder="lo que quieras contar del entrenamiento">'+esc(reg&&reg.notas_atleta||'')+'</textarea>'+
        '<div class="grid2">'+
          '<div><label>Horas de sueño</label><input class="fb-sueno" inputmode="decimal" value="'+esc(reg&&reg.horas_sueno!=null?reg.horas_sueno:'')+'" placeholder="p. ej. 7.5"></div>'+
          '<div><label>Peso (kg)</label><input class="fb-peso" inputmode="decimal" value="'+esc(reg&&reg.peso_kg!=null?reg.peso_kg:'')+'" placeholder="opcional"></div>'+
        '</div>'+
      '</div>'+
      /* «Te han quedado 4 series sin hacer, ¿por qué?». Se pregunta UNA vez, al
         final, y solo si de verdad falta algo. Preguntarlo serie por serie
         sería insoportable y dejaría de marcarse a la tercera sesión. */
      '<div class="no-hecho" data-nh hidden></div>'+
      /* ------------------------------------------------------------
         UN SOLO BOTÓN, Y AZUL
         ------------------------------------------------------------
         Aquí había un «Guardar sensaciones» que en realidad guardaba TODO
         —las series, los kilos, el RIR y las sensaciones—, porque todo va a
         la misma fila. Con el «Terminar la sesión» de la maqueta al pie de
         la pantalla habría habido dos botones que hacen exactamente lo
         mismo con dos nombres distintos, y eso no se puede leer.

         Así que es uno. Y se llama como lo llamó el diseñador, que además
         es como se dice de verdad: se termina el entrenamiento y se apunta.

         LO QUE SE PIERDE: la palabra «guardar». Alguien que apunta a mitad
         de sesión podría dudar de si pulsar «Terminar» le cierra algo.
         Por eso debajo va dicho, en una línea y sin letra pequeña: se
         guarda lo apuntado y se puede volver a entrar y cambiarlo. Sin esa
         frase el cambio no valdría la pena.
         ------------------------------------------------------------ */
      '<div class="fb-cerrar">'+
        '<button type="button" class="fb-guardar">Terminar la sesión</button>'+
        '<p class="fb-nota">Guarda lo que has apuntado y cómo te fue. Puedes volver a entrar y cambiarlo.</p>'+
        '<div class="fb-estado"><span class="msg fb-msg"></span><span class="fb-sucio" hidden>Tienes cambios sin guardar</span></div>'+
      '</div>'+
      '</div>';
  }

  /* ------------------------------------------------------------
     LO QUE SE QUEDÓ SIN HACER
     La franja solo aparece cuando quedan series sin ✓. Ni regaña ni pone en
     rojo: que se quedara algo sin hacer es un dato, no una falta, y si marcarlo
     diera vergüenza nadie lo marcaría —y entonces el historial volvería a
     mentir hacia arriba, que es lo que se está arreglando—.

     El motivo «me molestaba» abre las molestias de siempre, que ya existen en
     este mismo formulario y ya las mira el equipo técnico: no se guarda dos
     veces la misma información en dos sitios distintos.
     ------------------------------------------------------------ */
  var MOTIVOS=[{k:'tiempo', t:'No dio tiempo'},{k:'molestia', t:'Me molestaba'},{k:'otro', t:'Otra cosa'}];
  function avisoNoHecho(raiz){
    if(!raiz) return;
    (raiz.querySelectorAll ? raiz.querySelectorAll('.entreno-uno') : []).forEach(pintarNoHecho);
    var propia=raiz.closest?raiz.closest('.entreno-uno'):null;
    if(propia) pintarNoHecho(propia);
  }
  function pintarNoHecho(caja){
    var caj=caja.querySelector('[data-nh]'); if(!caj) return;
    var filas=filasMandadas(caja);
    var faltan=0; filas.forEach(function(f){ if(!serieHecha(f)) faltan++; });
    if(!filas.length || !faltan){ caj.hidden=true; caj.innerHTML=''; return; }
    /* Se conserva lo que ya hubiera elegido: repintar no puede borrar una
       respuesta que el atleta acaba de dar. */
    var sel=caj.getAttribute('data-motivo')||'';
    var nota=caj.querySelector('.nh-nota');
    var notaTxt=nota?nota.value:(caj.getAttribute('data-nota')||'');
    var ejer=[];
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var fs=g.querySelectorAll('.ej-fila'), sin=0;
      fs.forEach(function(f){ if(!serieHecha(f)) sin++; });
      if(sin) ejer.push(g.getAttribute('data-eje')||'');
    });
    var cuales = ejer.filter(Boolean).slice(0,3).join(', ');
    caj.hidden=false;
    caj.innerHTML=
      '<p>Te '+(faltan===1?'ha quedado <b>1 serie</b> sin hacer':'han quedado <b>'+faltan+' series</b> sin hacer')+
      (cuales?' ('+esc(cuales)+(ejer.length>3?'…':'')+')':'')+'. ¿Por qué?</p>'+
      '<div class="nh-motivos" role="group">'+MOTIVOS.map(function(m){
        return '<button type="button" data-motivo="'+m.k+'" aria-pressed="'+(sel===m.k?'true':'false')+'">'+esc(m.t)+'</button>';
      }).join('')+'</div>'+
      '<input type="text" class="nh-nota" placeholder="si quieres, cuéntalo (opcional)" value="'+esc(notaTxt)+'"'+(sel?'':' hidden')+'>';
  }

  /* ------------------------------------------------------------
     CORREGIR LO APUNTADO
     ------------------------------------------------------------
     El club: «que se pueda corregir, eso es importantísimo». Hasta hoy
     un día pasado se leía y no había escape: si un chaval tecleaba mal
     un peso, se quedaba mal para siempre.

     CON CRITERIO, que es lo que pidió:
       · LO DEL MISMO DÍA, sin fricción. Ahí ni sale este botón: el día
         de hoy ya se edita tal cual, y escribir 60 y luego 65 sobre la
         marcha no es corregir, es apuntar.
       · LO DE HACE SEMANAS también se puede, pero se nota. Se avisa
         antes de tocar nada y, al guardar, la base deja el rastro
         (migración 104) que se lee luego en «corregido el 3 de agosto».
         Un dato de hace un mes que cambia sin dejar rastro es peor que
         uno equivocado: el equipo técnico decidió cosas mirando el
         número de antes.
     ------------------------------------------------------------ */
  var CORRIGIENDO={};       // { sesion_id: true } mientras se está corrigiendo
  function esLeer(s){
    if(!s || !REG[s.id]) return false;
    if(s.fecha >= todayISO) return false;
    return !CORRIGIENDO[s.id];
  }
  /* Que se sepa que se está reescribiendo algo viejo, y ANTES de tocarlo.
     No regaña: solo dice lo que va a pasar. */
  function avisoCorrigiendoHTML(s){
    if(!s || !CORRIGIENDO[s.id]) return '';
    return '<div class="aviso-corrigiendo">Estás corrigiendo lo que apuntaste el '+
      esc(fechaDiaMes(s.fecha))+'. Al guardar quedará dicho que se corrigió y cuándo.</div>';
  }

  /* ---------- «Cómo te fue», en modo lectura (entrega 9, 3b) ----------
     La misma tarjeta de «¿Cómo ha ido?» pero contada, no rellenada. Se usa
     en los días que ya pasaron: lo que se apuntó aquel día es un hecho.
     El número solo no dice nada —un 8 puede ser bueno o malo—, así que se
     lee con su palabra: «8 · Muy duro». */
  var PALABRA_RPE=['','Muy suave','Suave','Cómodo','Llevadero','Moderado','Algo duro','Duro','Muy duro','Durísimo','Al límite'];
  var PALABRA_SENSA=['','Fatal','Muy mal','Mal','Regular','Normal','Bien','Muy bien','Genial','Genial','Genial'];
  function palabraDe(tabla, n){ n=parseInt(n,10); return (n>=1&&n<=10)?tabla[n]:''; }
  /* «con energía, piernas cargadas» son dos cosas, y en chips se leen de un
     vistazo. Se parte por comas y por «·», que es como lo escribe la gente. */
  function trocear(txt){
    return String(txt||'').split(/[,;·]/).map(function(p){ return p.trim(); }).filter(Boolean).slice(0,6);
  }
  /* Cómo se dice el motivo cuando se lee, que no es como se pregunta: se
     pregunta «¿por qué?» y se lee «no dio tiempo». */
  var MOTIVO_LEER={ tiempo:'no dio tiempo', molestia:'algo molestaba', otro:'por otra cosa' };

  function fichaFeedbackLeer(s){
    var reg=REG[s.id]; if(!reg) return '';
    var partes='';
    /* Lo primero de todo, antes que el esfuerzo: si aquel día se quedó a
       medias, eso cambia cómo se lee todo lo demás. Un RPE de 5 en un
       entrenamiento entero y en medio entrenamiento no significan lo mismo. */
    if(reg.estado==='a_medias'||reg.estado==='no_hecho'){
      var cuantas = (reg.series_previstas>0)
        ? reg.series_hechas+' de '+reg.series_previstas+' series'
        : (reg.estado==='no_hecho'?'no llegaste a hacerlo':'se quedó a medias');
      var pq = reg.motivo_no_hecho ? ' · '+(MOTIVO_LEER[reg.motivo_no_hecho]||reg.motivo_no_hecho) : '';
      partes+='<div class="fbl-medias">'+
        esc(reg.estado==='no_hecho'?'No lo hiciste':'Se quedó a medias')+
        ' — '+esc(cuantas+pq)+'</div>';
      if(reg.nota_no_hecho) partes+='<div class="fbl-nota">«'+esc(reg.nota_no_hecho)+'»</div>';
    }
    var lectura = reg.rpe!=null ? reg.rpe+' · '+palabraDe(PALABRA_RPE, reg.rpe)
                : (reg.sensacion_general!=null ? reg.sensacion_general+' · '+palabraDe(PALABRA_SENSA, reg.sensacion_general) : '');
    if(lectura) partes+='<div class="fbl-esf"><b>'+esc(lectura)+'</b></div>';
    var chips=trocear(reg.como_me_siento).map(function(c){ return '<span class="fbl-chip">'+esc(c)+'</span>'; });
    if(reg.rpe!=null && reg.sensacion_general!=null)
      chips.unshift('<span class="fbl-chip">'+esc(palabraDe(PALABRA_SENSA, reg.sensacion_general))+'</span>');
    /* Las molestias van aparte y en ámbar: es lo único de aquel día sobre lo
       que alguien puede tener que hacer algo. */
    trocear(reg.molestias).forEach(function(m){ chips.push('<span class="fbl-chip ojo">'+esc(m)+'</span>'); });
    if(chips.length) partes+='<div class="fbl-chips">'+chips.join('')+'</div>';
    if(reg.notas_atleta) partes+='<div class="fbl-nota">«'+esc(reg.notas_atleta)+'»</div>';
    var extra=[];
    if(reg.horas_sueno!=null) extra.push(String(reg.horas_sueno).replace('.',',')+' h de sueño');
    if(reg.peso_kg!=null) extra.push(String(reg.peso_kg).replace('.',',')+' kg');
    if(extra.length) partes+='<div class="fbl-extra">'+esc(extra.join(' · '))+'</div>';
    /* El pie: por un lado la salida —que hasta hoy no existía y dejaba un
       dato mal tecleado mal para siempre—, y por otro el rastro de las
       correcciones anteriores, si las hubo.
       La tarjeta se pinta AUNQUE aquel día no se contara nada: si no, un
       día en el que solo se marcaron las series se quedaría otra vez sin
       salida para corregir, que es justo lo que se viene a arreglar. */
    if(!partes) partes='<div class="fbl-extra">Ese día no contaste cómo te fue.</div>';
    var rastro='';
    if(reg.corregido_en){
      var veces=(reg.corregido_veces>1) ? ' ('+reg.corregido_veces+' veces)' : '';
      rastro='<span class="fbl-corr">Corregido el '+esc(fechaDiaMes(String(reg.corregido_en).slice(0,10)))+veces+'</span>';
    }
    partes+='<div class="fbl-pie">'+rastro+
      '<button type="button" class="fb-corregir">Corregir lo apuntado</button></div>';
    /* Y, si tiene Strava conectado, el botón para llevárselo allí. Va AQUÍ
       —debajo de lo apuntado y no arriba del formulario— porque solo tiene
       sentido cuando ya hay algo que mandar. */
    partes+=stravaBotonHTML(s);
    return '<div class="fb-leer"><div class="fbl-et">Cómo te fue</div>'+partes+'</div>';
  }

  /* ============================================================
     LLEVARLO A STRAVA
     ------------------------------------------------------------
     El reloj ya subió la actividad con su GPS y sus vueltas; lo que no
     sabe es qué había puesto el entrenador, qué series salieron y cómo
     te sentiste. Eso es lo que se le añade: título y descripción.

     ⚠️ NO SE CREA NADA EN STRAVA. Si se creara, los días que llevas el
     Garmin tendrías dos actividades y habría que borrar una a mano cada
     día. Ver `supabase/functions/strava/index.ts`.

     El texto se monta AQUÍ y no en el servidor a propósito: cómo se lee
     una serie de este club ya está escrito y probado en la pantalla
     (`assets/js/descansos.js`). Que el servidor lo volviera a montar a
     su manera es garantizar que dentro de un mes digan cosas distintas.
     ============================================================ */
  var STRAVA_HAY = null;      // null = todavía no se sabe
  async function mirarStrava(){
    try {
      var r=await sb.rpc('strava_estoy_conectado');
      if(r.error){ STRAVA_HAY=false; return; }
      var e=Array.isArray(r.data)?r.data[0]:r.data;
      STRAVA_HAY = !!(e && e.conectado);
    } catch(e){ STRAVA_HAY=false; }
  }
  function stravaBotonHTML(s){
    if(!STRAVA_HAY) return '';
    return '<div class="fbl-strava">'+
      '<button type="button" class="fb-strava" data-sid="'+esc(s.id)+'" data-dia="'+esc(s.fecha)+'">Mandarlo a Strava</button>'+
      '<span class="fbs-msg"></span></div>';
  }
  /* Lo que se le escribe a la actividad. Se lee del registro guardado, no
     de los recuadros de la pantalla: así mandar un día de la semana pasada
     sale igual de completo que mandar el de hoy. */
  function stravaTextoDe(s){
    var reg=REG[s.id]; if(!reg) return '';
    var dis=disciplinaDe(s), lineas=[];
    (Array.isArray(s.bloques)?s.bloques:[]).forEach(function(b,bi){
      var filas=[];
      (b.filas||[]).forEach(function(f,fi){
        var hecho=hechoLinea(reg, f.id, 'b'+bi+'f'+fi, f, s);
        if(!hecho) return;                       // lo que no se hizo no se cuenta
        filas.push('· '+(f.ejercicio||'—')+': '+hecho);
      });
      if(filas.length) lineas.push((b.etiqueta||'Bloque')+'\n'+filas.join('\n'));
    });
    /* Y lo que añadió por su cuenta, marcado: en Strava, sin la marca,
       parecería que se lo puso el entrenador. */
    if(reg.tiempos_reales){
      var puestos={};
      (Array.isArray(s.bloques)?s.bloques:[]).forEach(function(b,bi){ (b.filas||[]).forEach(function(f,fi){
        if(f.id) puestos[f.id]=true; puestos['b'+bi+'f'+fi]=true; }); });
      var extras=[];
      Object.keys(reg.tiempos_reales).forEach(function(k){
        if(puestos[k]) return;
        var e=reg.tiempos_reales[k]; if(!e||!e.ejercicio) return;
        var h=hechoLinea(reg, k, null, {}, s);
        if(h) extras.push('· '+e.ejercicio+': '+h);
      });
      if(extras.length) lineas.push('Añadido por mí\n'+extras.join('\n'));
    }
    var cierre=[];
    if(reg.rpe!=null) cierre.push('Esfuerzo '+reg.rpe+'/10 ('+palabraDe(PALABRA_RPE, reg.rpe)+')');
    if(reg.sensacion_general!=null) cierre.push('Sensación '+reg.sensacion_general+'/10');
    if(reg.como_me_siento) cierre.push(reg.como_me_siento);
    /* Las molestias NO van a Strava. Es un dato de salud y Strava es una
       red social: una actividad puede estar a la vista de cualquiera, y
       nadie ha pedido publicar que le duele el hombro. Se quedan en el
       club, que es donde sirven para algo. */
    if(cierre.length) lineas.push(cierre.join(' · '));
    if(reg.notas_atleta) lineas.push('«'+reg.notas_atleta+'»');
    void dis;
    return lineas.join('\n\n');
  }

  /* Vuelca en los recuadros lo que ya está guardado de esa sesión: los valores,
     la unidad que se eligió y, sobre todo, el ✓ de cada serie. */
  function prefillTiempos(s){
    var reg=REG[s.id]; if(!reg||!reg.tiempos_reales) return;
    var caja=wrap.querySelector('.entreno-uno[data-sid="'+s.id+'"]'); if(!caja) return;
    var tr=reg.tiempos_reales;
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var fid=g.getAttribute('data-fid');
      var key=g.getAttribute('data-key');
      /* El id de la fila manda; la llave de posición es el respaldo para lo
         guardado antes de la migración 103. */
      var r=(fid&&tr[fid]) || (key&&tr[key]) || null;
      if(!r) return;
      var filas=g.querySelectorAll('.ej-fila');
      filas.forEach(function(fila, i){
        var sr=(Array.isArray(r.series)&&r.series[i])||null;
        var viejo=(Array.isArray(r.tiempos)&&r.tiempos[i]!=null)?String(r.tiempos[i]).trim():'';
        fila.querySelectorAll('input.s-cel').forEach(function(inp){
          var c=inp.getAttribute('data-c');
          if(sr && sr[c]!=null && sr[c]!==''){ inp.value=sr[c]; inp.setAttribute('data-tocado','1'); }
          /* Registros viejos: solo había un tiempo por serie y ese es el valor
             del único campo que tenían. */
          else if(!sr && viejo && c==='tiempo'){ inp.value=viejo; inp.setAttribute('data-tocado','1'); }
        });
        /* El RIR de esa serie. Los registros de antes lo guardaban UNO POR
           EJERCICIO (así estaba hecha la pantalla anterior); al abrirlos hoy
           se le cuelga a cada serie que se hizo, que es lo que quería decir
           «este ejercicio lo dejé a 2». */
        var rirCel=fila.querySelector('.rir-cel');
        var vRir = (sr && sr.rir!=null && sr.rir!=='') ? String(sr.rir)
                 : ((r.rir!=null && r.rir!=='' && sr && sr.hecha) ? String(r.rir) : '');
        if(rirCel && vRir) ponerRir(rirCel, vRir);
        if(sr && sr.hecha) fila.setAttribute('data-hecha','1');
        var ok=fila.querySelector('.s-ok');
        if(ok) ok.setAttribute('aria-pressed', (sr ? !!sr.hecha : !!viejo) ? 'true':'false');
      });
      /* La unidad que se usó aquel día, no la que se recuerda hoy: lo apuntado
         no se reinterpreta. */
      if(r.unidad) ponerUnidad(g, r.unidad, false);
      /* En qué bloque lo puso, para que al volver a guardar no se mueva */
      if(r.bloque!=null) g.setAttribute('data-bloque', r.bloque);
      /* Y el «lo cambié por…», si lo había: al volver a abrir el
         entrenamiento tiene que seguir puesto y a la vista. */
      var ejerP=g.closest('.ejer');
      var inP=ejerP?ejerP.querySelector('.cambio-in'):null;
      if(inP && r.cambiado_por) inP.value=r.cambiado_por;
    });
  }

  /* «− Serie» solo se ve si hay alguna añadida por el atleta. Si no la hay, el
     botón no existe: enseñar un botón que no puede hacer nada es peor que no
     tenerlo, porque invita a pulsarlo y no pasa nada. */
  function verMenosSerie(g){
    if(!g) return;
    var ejer=g.closest('.ejer'); if(!ejer) return;
    var boton=ejer.querySelector('.ej-menos-serie'); if(!boton) return;
    var mandadas=parseInt(g.getAttribute('data-mandadas'),10)||0;
    boton.hidden = g.querySelectorAll('.ej-fila').length <= mandadas;
  }

  /* Cambia la unidad de un ejercicio de distancia. `recordar` es false cuando se
     está volcando lo ya guardado: entonces se enseña la unidad de aquel día sin
     cambiar la preferencia de hoy. */
  function ponerUnidad(g, u, recordar){
    if(!g || (u!=='m' && u!=='km')) return;
    var ejer=g.closest('.ejer');
    var bot=ejer?ejer.querySelector('.ej-uni'):null;
    if(bot){
      var otra = u==='km' ? 'm' : 'km';
      bot.setAttribute('data-uni', otra);
      bot.innerHTML='<span class="uni-act">'+esc(u)+'</span> / '+esc(otra);
    }
    /* El rótulo de la columna es la unidad, así que cambia con ella */
    var cab=ejer?ejer.querySelector('.ej-cols'):null;
    if(cab && bot){
      var celda=cab.children[1];
      if(celda) celda.textContent=u;
    }
    /* Y el nombre largo de la casilla, que es lo único que oye quien navega con
       lector de pantalla: la cabecera de la columna no se lee junto al número.
       Si se queda en «metros» después de pasar a km, dice justo lo contrario de
       lo que pone la columna, y ahí no hay forma de darse cuenta. */
    var dicho = u==='km' ? 'kilómetros' : 'metros';
    if(g.querySelectorAll) g.querySelectorAll('.s-cel[data-c="distancia"]').forEach(function(inp){
      var et=inp.getAttribute('aria-label');
      if(et) inp.setAttribute('aria-label', et.replace(/Distancia en (kilómetros|metros)/, 'Distancia en '+dicho));
    });
    if(recordar) recordarUnidad(u);
  }

  /* ------------------------------------------------------------
     ¿SE HIZO ESTA SERIE?
     Donde hay casillas, lo que lo dice es que haya algo escrito en
     una de las que cuentan (las repeticiones, los kilos, el tiempo).
     El descanso y la distancia que ya venía en el plan NO cuentan:
     son el eco de lo que estaba puesto, no algo que haya hecho
     nadie, y si contaran una tabla recién abierta saldría entera.
     Donde no hay ninguna casilla (movilidad, estiramientos) manda
     el ✓, que ahí es el único dato que existe.
     ------------------------------------------------------------ */
  function serieHecha(fila){
    if(!fila) return false;
    var ok=fila.querySelector('.s-ok');
    if(ok) return ok.getAttribute('aria-pressed')==='true';
    /* «Apuntar solo el total» da por hechas las series que no se rellenan una
       a una: lo dijo el atleta, no lo ha supuesto la pantalla. */
    if(fila.getAttribute('data-hecha')==='1') return true;
    var hay=false;
    fila.querySelectorAll('[data-cuenta]').forEach(function(c){ if(valorCel(c)) hay=true; });
    return hay;
  }
  // El valor de una casilla, sea un campo de escribir o el botón del RIR
  function valorCel(c){
    if(!c) return '';
    return (c.tagName==='BUTTON' ? (c.getAttribute('data-v')||'') : String(c.value||'')).trim();
  }

  /* ------------------------------------------------------------
     EL ARRASTRE EN GRIS
     La serie siguiente viene rellenada con lo de la anterior, en
     gris, para que apuntar cueste dos toques y no ocho.

     DOS REGLAS QUE NO SON CAPRICHO:
       · No se arrastra NUNCA un tiempo. Un tiempo no se repite, se
         cronometra: por eso en un 4×300 solo se teclea el tiempo y
         la distancia viene puesta.
       · El arrastre solo sale de una serie que el atleta HAYA
         TOCADO. Si saliera de una serie que a su vez venía en gris,
         apuntar la primera daría por hechas las ocho, y el
         historial volvería a decir de más — que es justo el fallo
         que se arregló en la migración 103.
     ------------------------------------------------------------ */
  var NO_SE_ARRASTRA={ tiempo:1, rir:1 };
  function arrastrar(g){
    if(!g) return;
    var filas=g.querySelectorAll('.ej-fila'), previa=null;
    filas.forEach(function(fila){
      var tocada=!!fila.querySelector('[data-tocado="1"]');
      fila.querySelectorAll('input.s-cel').forEach(function(inp){
        if(inp.getAttribute('data-tocado')==='1'){ inp.classList.remove('arrastre'); return; }
        var k=inp.getAttribute('data-c'), v='';
        if(!NO_SE_ARRASTRA[k] && previa){
          var src=previa.querySelector('input.s-cel[data-c="'+k+'"]');
          if(src) v=String(src.value||'').trim();
        }
        if(!v) v=inp.getAttribute('data-plan')||'';
        /* ⚠️ EL ECO VA DE PLACEHOLDER, NUNCA DE VALOR.
           Antes se escribía en `value` y en gris, y peleaba con quien lo usaba:
           había que BORRAR el número antes de poner el tuyo, y al borrar el
           último dígito la casilla dejaba de contar como escrita, se
           recalculaba el eco… y el número se volvía a poner solo. Borrabas un
           10 y reaparecía un 10. En mitad de una serie, con el móvil en la
           mano, eso es insufrible.

           De placeholder se comporta como espera cualquiera: escribes encima
           sin borrar, el gris desaparece en cuanto tecleas, y si lo borras
           todo la casilla se queda vacía de verdad. Y de paso, un eco ya nunca
           puede colarse como si fuera un dato que apuntó el atleta: `value`
           vacío es vacío, sin tener que mirar de qué color estaba pintado. */
        inp.value='';
        inp.placeholder = v || '—';
        inp.classList.toggle('arrastre', !!v);
      });
      fila.classList.toggle('escrita', tocada);
      previa = tocada ? fila : null;
    });
  }

  /* ⚠️ LAS SERIES QUE MANDÓ EL ENTRENADOR, Y SOLO ESAS.
     Los ejercicios que añade el atleta se ven y se guardan, pero no entran en
     el «3 de 8 hechas» ni en el «te han quedado series sin hacer». Es la misma
     regla que aplica la base (migración 107) y por el mismo motivo: si
     contaran, media sesión saltada quedaría tapada por seis series de remo. */
  function filasMandadas(raiz){
    return raiz.querySelectorAll('.ejer:not([data-extra]) .ej-fila');
  }

  // Cuántas series lleva apuntadas: en la cabecera de cada bloque y en cada ejercicio
  function progresoBloques(raiz){
    if(!raiz) return;
    raiz.querySelectorAll('.serie-inputs').forEach(arrastrar);
    raiz.querySelectorAll('.bloque').forEach(function(d){
      var et=d.querySelector('.bl-prog'); if(!et) return;
      var filas=filasMandadas(d);
      if(!filas.length){ et.hidden=true; return; }
      var hechas=0; filas.forEach(function(f){ if(serieHecha(f)) hechas++; });
      var txt=hechas+' de '+filas.length+' hechas';
      et.hidden=false; et.textContent=txt; et.title=txt;
      et.classList.toggle('lleno', hechas===filas.length);
    });
    raiz.querySelectorAll('.serie-inputs').forEach(function(g){
      var filas=g.querySelectorAll('.ej-fila'), hechas=0;
      var obj=tiempoANum(g.getAttribute('data-obj'));
      filas.forEach(function(fila){ if(serieHecha(fila)) hechas++; });
      var ejer=g.closest('.ejer');
      if(ejer) ejer.classList.toggle('medias', hechas>0 && hechas<filas.length);
      /* La diferencia con tu marca, DEBAJO de la tabla y no dentro de la
         casilla: dentro no cabe sin comerse el número. Solo se enseña si hay
         un objetivo calculado con tu mejor marca y si lo que se apunta es un
         tiempo: comparar kilos con una marca de 400 m no significa nada. */
      var dif=ejer?ejer.querySelector('.s-dif'):null;
      if(!dif) return;
      dif.className='s-dif'; dif.textContent='';
      if(obj==null) return;
      var ult=null;
      filas.forEach(function(fila){
        var c=fila.querySelector('input.s-cel[data-c="tiempo"]');
        var v=c?String(c.value||'').trim():'';
        if(v && !c.classList.contains('arrastre')) ult=v;
      });
      if(!ult) return;
      var t=tiempoANum(ult); if(t==null || isNaN(t)) return;
      var d=t-obj;
      if(Math.abs(d)<0.005){ dif.textContent='Tu última serie va justo en el objetivo'; return; }
      dif.textContent='Tu última serie, '+(d<0?'−':'+')+segATexto(Math.abs(d))+' sobre el objetivo';
      dif.classList.add(d<0?'mejora':'peor');
    });
    /* Los metros de natación se recalculan aquí mismo: son una cuenta de lo que
       hay en pantalla, no un dato aparte que pudiera acabar diciendo otra cosa. */
    (raiz.querySelectorAll ? raiz.querySelectorAll('.entreno-uno') : []).forEach(pintarMetros);
    var propiaM=raiz.closest?raiz.closest('.entreno-uno'):null;
    if(propiaM) pintarMetros(propiaM);
    /* Y se decide si «− Serie» tiene que verse. Va aquí y no solo al pulsar
       «+ Serie», porque una sesión guardada con series de más se vuelve a
       pintar al abrirla y ahí también hay que poder quitarlas. */
    if(raiz.querySelectorAll) raiz.querySelectorAll('.serie-inputs').forEach(verMenosSerie);
    avisoNoHecho(raiz);
  }

  // Aviso discreto de "esto todavía no está guardado"
  function marcarSucio(caja){
    if(!caja) return;
    caja.classList.add('sucio');
    var av=caja.querySelector('.fb-sucio'); if(av) av.hidden=false;
    var m=caja.querySelector('.fb-msg'); if(m && /ok/.test(m.className)){ m.textContent=''; m.className='msg fb-msg'; }
  }
  function limpiarSucio(caja){
    if(!caja) return;
    caja.classList.remove('sucio');
    var av=caja.querySelector('.fb-sucio'); if(av) av.hidden=true;
  }
  window.addEventListener('beforeunload', function(ev){
    if(!wrap.querySelector('.entreno-uno.sucio')) return;
    ev.preventDefault(); ev.returnValue='';
  });

  /* ---------- anterior y siguiente día CON entrenamiento (entrega 9, 3b) ----------
     No es «el día de antes»: es el entrenamiento de antes, aunque sea de la
     semana pasada. Así el historial se recorre sin volver a la lista en cada
     día. Se pregunta una vez por día y se recuerda. */
  var VEC={};
  async function vecinosDe(iso){
    if(VEC[iso]) return VEC[iso];
    var v={ prev:null, next:null };
    try {
      var a=await sb.from('sesiones').select('fecha').eq('publicada',true).lt('fecha',iso)
              .order('fecha',{ascending:false}).limit(1);
      if(!a.error && a.data && a.data.length) v.prev=a.data[0].fecha;
      var b=await sb.from('sesiones').select('fecha').eq('publicada',true).gt('fecha',iso)
              .order('fecha',{ascending:true}).limit(1);
      if(!b.error && b.data && b.data.length) v.next=b.data[0].fecha;
    } catch(e){}
    VEC[iso]=v;
    return v;
  }
  /* Dos sitios para lo mismo: en corto arriba, para el pulgar, y con el día
     escrito al pie, que es donde se acaba de leer el entrenamiento. */
  function pintarFlechas(iso, v){
    if(diaSel!==iso) return;                 /* ha cambiado de día mientras se preguntaba */
    var arriba=$('tb-flechas');
    if(arriba && SEC==='entreno'){
      arriba.innerHTML = (MODO==='historial') ? '' :
        '<button type="button" data-ir-dia="'+esc(v.prev||'')+'"'+(v.prev?'':' disabled')+' aria-label="Entrenamiento anterior">&lsaquo;</button>'+
        '<button type="button" data-ir-dia="'+esc(v.next||'')+'"'+(v.next?'':' disabled')+' aria-label="Entrenamiento siguiente">&rsaquo;</button>';
    }
    var pie=$('ent-pies');
    if(pie){
      pie.innerHTML =
        (v.prev ? '<button type="button" data-ir-dia="'+esc(v.prev)+'">&lsaquo; '+esc(fechaDiaMes(v.prev))+'</button>'
                : '<button type="button" class="hueco" disabled>&nbsp;</button>')+
        (v.next ? '<button type="button" data-ir-dia="'+esc(v.next)+'">'+esc(fechaDiaMes(v.next))+' &rsaquo;</button>'
                : '<button type="button" class="hueco" disabled>&nbsp;</button>');
      pie.hidden = !(v.prev || v.next);
    }
  }
  // «1 de agosto», que es como se lee una fecha en voz alta
  function fechaDiaMes(iso){
    if(!iso) return '';
    var d=new Date(iso+'T00:00:00');
    return isNaN(d.getTime()) ? '' : d.getDate()+' de '+MESES_LARGOS[d.getMonth()];
  }
  // «lunes 3 de agosto»: la fecha entera, para la cabecera del entrenamiento
  function fechaDeDia(iso){
    if(!iso) return '';
    var d=new Date(iso+'T00:00:00');
    var di=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    return isNaN(d.getTime()) ? '' : di[d.getDay()]+' '+fechaDiaMes(iso);
  }
  function pintarDia(iso){
    diaSel=iso;
    pintarSemana();
    var lista=sesionesDe(iso), cont=$('entreno-cont');
    if(!lista.length){
      var cabDia='<div class="entreno-cab"><div class="ent-fecha">'+esc(fechaDeDia(iso))+'</div>'+
        '<h2 class="ent-tit">'+esc(iso===todayISO?'Hoy no toca':'Sin entrenamiento')+'</h2></div>';
      /* Si la semana no se ha podido leer, no se dice que no hay entreno: se
         dice que no lo sabemos y se ofrece volver a mirar. */
      if(SEM_FALLO[lunesVis]){
        cont.innerHTML='<div class="tarjeta">'+cabDia+
          htmlError('No hemos podido cargar tus entrenamientos',
            'Puede ser tu conexión. No sabemos si hoy tienes entrenamiento o no: vuelve a intentarlo, y si tienes dudas pregunta a tu entrenador.',
            async function(){ await cargarSemana(lunesVis); pintarDia(diaSel); })+'</div>';
        return;
      }
      var haySemana=sesDe(SEM[lunesVis], VIENDO).length;
      var titulo = (iso===todayISO) ? 'Hoy no toca entrenamiento' : 'Ese día no hay entrenamiento';
      var aviso = haySemana ? 'Esta semana sí hay entrenamientos: toca otro día de la tira de arriba y lo verás.'
        : (at.grupo_id ? 'Tu entrenador todavía no ha publicado los entrenamientos de esta semana. Suelen aparecer unos días antes.'
                       : 'Todavía no estás en ningún grupo. En cuanto tu entrenador te asigne a uno, verás aquí tus entrenamientos.');
      var salida = haySemana ? '' : APOLANA_UI.boton('Ver el calendario del club', '../calendario/');
      cont.innerHTML='<div class="tarjeta">'+cabDia+APOLANA_UI.vacio(titulo, aviso, salida)+'</div>'+
        '<div class="ent-pies" id="ent-pies" hidden></div>';
      vecinosDe(iso).then(function(v){ pintarFlechas(iso, v); });
      return;
    }
    cont.innerHTML=lista.map(function(s){
      /* Un día que ya pasó y que el atleta apuntó se lee, no se edita: lo que
         escribió aquel día es un hecho. Los que se quedaron sin apuntar siguen
         abiertos, porque apuntarlos tarde es lo que hace que esto sirva.
         Y si ha pedido corregirlo, se abre: hasta hoy un peso mal tecleado se
         quedaba mal para siempre, que es peor que cualquier otra cosa. */
      /* Al ver la semana de OTRO atleta (el entrenador) todo va en solo
         lectura: se muestra el plan, pero sin casillas ni formulario de
         feedback, para no apuntarle nada en su nombre. */
      var otro = esOtro();
      var leer = esLeer(s) || otro;
      /* El aviso de que se está corrigiendo va ARRIBA DEL TODO, antes que los
         ejercicios: si fuera abajo, para cuando se lee ya se han tocado los
         kilos. */
      return '<div class="entreno-uno" data-sid="'+esc(s.id)+'">'+
             (leer?'':avisoCorrigiendoHTML(s))+renderEntreno(s,todayISO,leer)+
             (otro ? '' : (leer ? fichaFeedbackLeer(s) : fichaFeedback(s)))+
             (otro ? '' : comentarioHTML(s))+'</div>';
    }).join('');
    cont.innerHTML += '<div class="ent-pies" id="ent-pies" hidden></div>';
    lista.forEach(function(s){ if(!esLeer(s) && !esOtro()) prefillTiempos(s); });
    progresoBloques(cont);
    vecinosDe(iso).then(function(v){ pintarFlechas(iso, v); });
  }

  /* El selector de «ver la semana de cada atleta». Solo se pinta si entreno a
     alguien; si no, queda oculto y no estorba a un atleta normal. Al cambiar de
     atleta se salta a un día con entreno suyo y se repinta todo en su nombre. */
  function pintarVerComo(){
    var cont=$('ver-como'); if(!cont) return;
    if(!COACH_ATLETAS.length){ cont.hidden=true; return; }
    cont.hidden=false;
    var ops='<option value="'+escA(at.id)+'"'+(VIENDO===at.id?' selected':'')+'>Tú</option>';
    COACH_ATLETAS.forEach(function(a){
      var nom=((a.nombre||'')+' '+(a.apellidos||'')).trim();
      ops+='<option value="'+escA(a.id)+'"'+(VIENDO===a.id?' selected':'')+'>'+esc(nom)+'</option>';
    });
    cont.innerHTML=
      '<span class="vc-ico" aria-hidden="true">👥</span>'+
      '<label class="vc-lab" for="vc-sel">Viendo la semana de</label>'+
      '<select id="vc-sel" class="vc-sel" aria-label="Elige de qué atleta ves la semana">'+ops+'</select>'+
      (esOtro()?'<span class="vc-badge">Solo lectura</span>':'');
    var sel=$('vc-sel');
    if(sel) sel.onchange=function(){
      VIENDO=sel.value;
      pintarVerComo();
      pintarDia(elegirDia(lunesVis, diaSel));
    };
  }

  // Día que se muestra al abrir una semana: el preferido si tiene entreno; si no, el más cercano
  function elegirDia(lunes, pref){
    var lista=sesDe(SEM[lunes], VIENDO);
    var base=(pref && difDias(pref,lunes)>=0 && difDias(pref,lunes)<=6) ? pref : lunes;
    if(lista.some(function(s){ return s.fecha===base; })) return base;
    var mejor=null;
    lista.forEach(function(s){
      var d=Math.abs(difDias(s.fecha,base));
      if(!mejor || d<mejor.d || (d===mejor.d && s.fecha>mejor.f)) mejor={d:d,f:s.fecha};
    });
    return mejor?mejor.f:base;
  }

  async function irSemana(lunes, pref){
    lunesVis=lunes;
    $('sem-rango').textContent=rangoTxt(lunes);
    $('sem-dias').classList.add('cargando');
    $('entreno-cont').innerHTML='<div class="tarjeta">'+APOLANA_UI.cargando('filas',4)+'</div>';
    await cargarSemana(lunes);
    $('sem-dias').classList.remove('cargando');
    pintarDia(elegirDia(lunes, pref));
  }

  $('sem-prev').addEventListener('click', function(){ irSemana(addDias(lunesVis,-7), null); });
  $('sem-next').addEventListener('click', function(){ irSemana(addDias(lunesVis,7), null); });
  $('sem-hoy').addEventListener('click', function(){ irSemana(lunesDe(todayISO), todayISO); });
  /* Cuatro semanas de golpe, no «el mismo día del mes anterior»: así la
     tira sigue empezando en lunes y no se salta ni se repite ninguna. */
  $('sem-mes-prev').addEventListener('click', function(){ irSemana(addDias(lunesVis,-28), null); });
  $('sem-mes-next').addEventListener('click', function(){ irSemana(addDias(lunesVis,28), null); });

  /* ============================================================
     IMPRIMIR LA SEMANA
     ------------------------------------------------------------
     Pedido para llevarle al fisio, al médico o al entrenador de fuera lo
     que se ha hecho de verdad: tiempos, series, pesos y sensaciones de
     los siete días, en un papel.

     ⚠️ SIN LIBRERÍA DE PDF, Y ES UNA DECISIÓN, NO UNA CARENCIA.
     Una librería de PDF en el navegador son casi dos megas que se
     descargarían SIEMPRE, también las cuatrocientas veces al año que
     nadie va a imprimir nada, y en el móvil de un chaval en la pista eso
     se paga en datos y en espera. `window.print()` no pesa nada, sale
     mejor compuesto —lo maqueta el navegador, con su tipografía y su
     partición de páginas— y en el diálogo de imprimir hay «Guardar como
     PDF» en todos los sistemas. El resultado es el mismo y el coste es
     cero.

     La hoja NO es la pantalla con otro CSS: se construye aparte. La
     pantalla está llena de recuadros para escribir, botones de ✓ y
     desplegables plegados, y todo eso en papel o sale en blanco o sale
     estorbando. Aquí se escribe lo que se hizo, en texto.
     ============================================================ */
  function planLinea(f, dis){
    var D=DESC();
    var t='';
    if(D && D.textoFila){ try { t=D.textoFila(f, dis)||''; } catch(e){} }
    return t;
  }
  /* Lo que apuntó, serie a serie. Se lee del registro guardado —no de los
     recuadros de la pantalla— para que imprimir un lunes de hace dos meses
     salga igual de completo que imprimir hoy. */
  function hechoLinea(reg, fid, key, f, s){
    if(!reg || !reg.tiempos_reales) return '';
    var tr=reg.tiempos_reales;
    var e=(fid && tr[fid]) || (key && tr[key]) || null;
    if(!e || !Array.isArray(e.series)) return '';
    var D=DESC();
    /* La misma medida que usó la pantalla al escribirlo —`medidaDe`, con el
       deporte de la sesión—, no una inventada aquí: si no, los kilos del
       gimnasio saldrían en el papel como si fueran tiempos. Y si el registro
       guardó la suya, esa manda: es de cuando se apuntó. */
    var medida = e.medida ? { clave: e.medida } : medidaDe(f, s);
    var partes=[];
    e.series.forEach(function(s){
      if(!s || !s.hecha) return;
      var t='';
      if(D && D.textoSerieHecha){ try { t=D.textoSerieHecha(s, medida)||''; } catch(y){} }
      if(t) partes.push(t);
    });
    return partes.join(' · ');
  }
  function hojaSemanaHTML(){
    var lista=sesDe(SEM[lunesVis], VIENDO).slice().sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
    var NOM=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
    var dias='';
    for(var i=0;i<7;i++){
      var iso=addDias(lunesVis,i);

      var cab='<h2>'+esc(NOM[i]+' '+d.getDate())+' <span>'+esc(mesLargo(iso))+'</span></h2>';
      if(!ses.length){ dias+='<section class="hj-dia vacio">'+cab+'<p>Sin entrenamiento.</p></section>'; continue; }
      var cuerpo=ses.map(function(s){
        var dis=disciplinaDe(s);
        var reg=REG[s.id]||null;
        var bloques=Array.isArray(s.bloques)?s.bloques:[];
        var filas='';
        bloques.forEach(function(b,bi){
          filas+='<tr class="hj-bl"><th colspan="3">'+esc(b.etiqueta||'Bloque')+'</th></tr>';
          (b.filas||[]).forEach(function(f,fi){
            var hecho=hechoLinea(reg, f.id, 'b'+bi+'f'+fi, f, s);
            filas+='<tr>'+
              '<td class="hj-ej">'+esc(f.ejercicio||'—')+'</td>'+
              '<td class="hj-plan">'+esc(planLinea(f,dis))+'</td>'+
              '<td class="hj-hecho">'+(hecho?esc(hecho):'<i>—</i>')+'</td></tr>';
          });
        });
        /* Los ejercicios que añadió él y que no estaban en el plan. Salen
           al final y marcados: en papel, sin la marca, parecería que el
           entrenador los puso y no los puso nadie. */
        if(reg && reg.tiempos_reales){
          var puestos={};
          bloques.forEach(function(b,bi){ (b.filas||[]).forEach(function(f,fi){
            if(f.id) puestos[f.id]=true; puestos['b'+bi+'f'+fi]=true; }); });
          Object.keys(reg.tiempos_reales).forEach(function(k){
            if(puestos[k]) return;

            var h=hechoLinea(reg, k, null, {}, s);
            filas+='<tr><td class="hj-ej">'+esc(e.ejercicio)+' <span class="hj-extra">añadido</span></td>'+
              '<td class="hj-plan"></td><td class="hj-hecho">'+(h?esc(h):'<i>—</i>')+'</td></tr>';
          });
        }
        var sensa=[];
        if(reg){
          if(reg.estado==='no_hecho') sensa.push('No lo hizo');
          else if(reg.estado==='a_medias') sensa.push('A medias'+(reg.series_previstas>0?' ('+reg.series_hechas+' de '+reg.series_previstas+' series)':''));
          if(reg.rpe!=null) sensa.push('Esfuerzo '+reg.rpe+'/10 · '+palabraDe(PALABRA_RPE, reg.rpe));
          if(reg.sensacion_general!=null) sensa.push('Sensación '+reg.sensacion_general+'/10 · '+palabraDe(PALABRA_SENSA, reg.sensacion_general));
          if(reg.horas_sueno!=null) sensa.push(String(reg.horas_sueno).replace('.',',')+' h de sueño');
          if(reg.peso_kg!=null) sensa.push(String(reg.peso_kg).replace('.',',')+' kg');
        }
        var notas=[];
        if(reg){
          if(reg.como_me_siento) notas.push(reg.como_me_siento);
          /* Las molestias van etiquetadas: es lo único de la hoja sobre lo
             que un fisio puede tener que hacer algo, y en blanco y negro no
             hay ámbar que lo destaque. */
          if(reg.molestias) notas.push('Molestias: '+reg.molestias);
          if(reg.notas_atleta) notas.push('«'+reg.notas_atleta+'»');
          if(reg.nota_no_hecho) notas.push('«'+reg.nota_no_hecho+'»');

        var c=COMENT[s.id];
        return '<article class="hj-ses">'+

          (sensa.length?'<p class="hj-sensa">'+esc(sensa.join(' · '))+'</p>':'')+
          (notas.length?'<p class="hj-notas">'+esc(notas.join(' · '))+'</p>':'')+
          (!reg?'<p class="hj-sinreg">Sin apuntar cómo fue.</p>':'')+
          (c&&c.texto?'<p class="hj-ent"><b>Entrenador:</b> '+esc(c.texto)+'</p>':'')+
        '</article>';
      }).join('');
      dias+='<section class="hj-dia">'+cab+cuerpo+'</section>';
    }
    var quien=[at.nombre, at.apellidos].filter(Boolean).join(' ');
    return '<div class="hoja" id="hoja">'+
      '<header class="hj-cab">'+
        '<div><b>'+esc(quien||'Atleta')+'</b><span>Club Atletismo Apolana</span></div>'+
        '<div class="hj-rango">'+esc(rangoTxt(lunesVis))+'</div>'+
      '</header>'+dias+
      /* De cuándo es el papel. Una hoja sin fecha de impresión, dentro de
         un mes, no se sabe si está al día o si le faltan dos entrenos que
         se apuntaron después. */
      '<footer class="hj-pie">Impreso el '+esc(fechaDiaMes(todayISO))+' desde el portal del club.</footer>'+
    '</div>';
  }
  $('sem-print').addEventListener('click', function(){
    var vieja=document.getElementById('hoja');
    if(vieja) vieja.remove();
    var caja=document.createElement('div');
    caja.innerHTML=hojaSemanaHTML();
    document.body.appendChild(caja.firstChild);
    /* Se limpia SIEMPRE, se imprima o se cancele: `afterprint` salta en los
       dos casos. Si no se limpiara, la hoja se quedaría escondida en el
       documento y la siguiente impresión sacaría dos. El `setTimeout` es
       para Safari, que dispara `afterprint` antes de tener el papel hecho. */
    function limpiar(){
      window.removeEventListener('afterprint', limpiar);
      setTimeout(function(){
        var h=document.getElementById('hoja'); if(h) h.remove();
      }, 300);
    }
    window.addEventListener('afterprint', limpiar);
    window.print();
  });

  /* ============================================================
     EL HISTORIAL (entrega 9, 3a)
     ------------------------------------------------------------
     Dos cosas en la misma pantalla, y en este orden: un resumen que
     contesta «¿de qué han ido estos tres meses?» en dos segundos, y
     debajo la lista larga que lo demuestra. La lista sola no convence
     a un chaval de catorce años; el resumen solo no tiene pruebas.
     ============================================================ */
  var HIST={};              // { periodo: [ {fecha, deportes, papel, texto, apuntado} ] }
  var HIST_PER='3m';        // periodo que se está viendo
  var HIST_REG=null;        // ids de sesión que el atleta ya apuntó
  var HIST_FALLO={};
  var PERIODOS={ mes:'Este mes', '3m':'Últimos 3 meses', temp:'Esta temporada' };

  function restarMeses(iso, n){
    var d=new Date(iso+'T00:00:00');
    var dia=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()-n);
    /* Del 31 de marzo hacia atrás no hay 31 de febrero: se queda en el
       último día del mes, que es lo que espera cualquiera. */
    var ultimo=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(dia, ultimo));
    return isoDe(d);
  }
  // La temporada del club empieza en septiembre, igual que en el ranking
  function inicioTemporada(iso){
    var d=new Date(iso+'T00:00:00');
    var anio = (d.getMonth()+1) >= 9 ? d.getFullYear() : d.getFullYear()-1;
    return anio+'-09-01';
  }
  function desdeDe(per){
    if(per==='mes')  return todayISO.slice(0,8)+'01';
    if(per==='temp') return inicioTemporada(todayISO);
    return restarMeses(todayISO, 3);
  }

  async function cargarHistorial(per){
    if(HIST[per]) return HIST[per];
    delete HIST_FALLO[per];
    var desde=desdeDe(per);
    var ses=[];
    try {
      /* Sin `bloques`: para la lista basta el título, y traerse el contenido
         entero de doscientos entrenamientos por una lista es tirar la
         conexión de un móvil. El permiso del servidor (migración 099) ya
         devuelve solo los entrenamientos de los que este atleta tiene
         registro, aunque haya cambiado de grupo. */
      var q=await sb.from('sesiones')
        .select('id,fecha,tipo,rol,deporte,deporte_2,papel_dia,titulo')
        .eq('publicada',true).gte('fecha',desde).lte('fecha',todayISO)
        .order('fecha',{ascending:false});
      if(q.error) { HIST_FALLO[per]=true; return null; }
      ses=q.data||[];
    } catch(e){ HIST_FALLO[per]=true; return null; }

    /* Lo que el atleta apuntó, una sola vez para todos los periodos. Se trae
       también el ESTADO, porque un día a medias y un día entero no son lo
       mismo y el resumen no puede contarlos igual. */
    if(HIST_REG===null){
      HIST_REG={};
      try {
        var rg=await sb.from('registros_sesion').select('sesion_id,estado').eq('atleta_id',at.id);
        if(!rg.error && rg.data) rg.data.forEach(function(r){ HIST_REG[r.sesion_id]={ estado:r.estado }; });
      } catch(e){}
    }
    /* Lo apuntado en esta visita, que todavía no estaba en esa consulta */
    Object.keys(REG).forEach(function(id){ HIST_REG[id]={ estado: REG[id].estado||null }; });

    /* Un día es una línea aunque haya dos deportes: el caso real —pesas y
       luego series como transferencia— fue un día de entrenar, no dos. */
    var porDia={}, orden=[];
    ses.forEach(function(s){
      if(!porDia[s.fecha]){ porDia[s.fecha]={ fecha:s.fecha, sesiones:[] }; orden.push(s.fecha); }
      porDia[s.fecha].sesiones.push(s);
    });
    HIST[per]=orden.map(function(f){
      var d=porDia[f], deportes=[], papel='', textos=[], apuntado=false, descanso=true, medias=false;
      d.sesiones.forEach(function(s){
        deportesDe(s).forEach(function(x){ if(deportes.indexOf(x)===-1) deportes.push(x); });
        if(!papel) papel=papelDe(s);
        if(s.titulo) textos.push(s.titulo);
        var reg=HIST_REG[s.id];
        if(reg){
          apuntado=true;
          /* «A medias» y «no hecho» se cuentan juntos aquí: los dos son días en
             los que el entrenamiento no se hizo entero, que es lo que el
             resumen no puede callarse. */
          if(reg.estado==='a_medias'||reg.estado==='no_hecho') medias=true;
        }
        if((s.papel_dia||s.tipo)!=='descanso') descanso=false;
      });
      return { fecha:f, deportes:deportes, papel:papel, texto:textos.join(' · '),
               apuntado:apuntado, descanso:descanso, medias:medias };
    });
    return HIST[per];
  }

  /* La frase escrita es lo que se entiende; la barra solo la respalda. Por eso
     la fracción se dice con palabras y se redondea a la de al lado: «dos de
     cada tres» se recuerda, «63,4 %» no dice nada. */
  var FRACCIONES=[
    { v:1/5, txt:'Uno de cada cinco días fue de carga' },
    { v:1/4, txt:'Uno de cada cuatro días fue de carga' },
    { v:1/3, txt:'Uno de cada tres días fue de carga' },
    { v:2/5, txt:'Dos de cada cinco días fueron de carga' },
    { v:1/2, txt:'La mitad de los días fueron de carga' },
    { v:3/5, txt:'Tres de cada cinco días fueron de carga' },
    { v:2/3, txt:'Dos de cada tres días fueron de carga' },
    { v:3/4, txt:'Tres de cada cuatro días fueron de carga' },
    { v:4/5, txt:'Cuatro de cada cinco días fueron de carga' }
  ];
  function fraseCarga(r){
    if(r<=0.02) return 'Ningún día fue de carga';
    if(r>=0.93) return 'Casi todos los días fueron de carga';
    var mejor=FRACCIONES[0];
    FRACCIONES.forEach(function(f){ if(Math.abs(f.v-r)<Math.abs(mejor.v-r)) mejor=f; });
    return mejor.txt;
  }
  /* Los días de apretar y los de dejar que el cuerpo asiente. No es una
     clasificación del club: es la lectura que pide el resumen, y por eso la
     frase de debajo nombra los papeles que de verdad ha habido. */
  var PAPEL_CARGA={ Carga:1, Impacto:1, 'Competición':1 };
  var NUMEROS=['cero','Un','Dos','Tres','Cuatro','Cinco','Seis','Siete','Ocho','Nueve'];
  function enPalabras(n){ return (n>=1 && n<=9) ? NUMEROS[n] : String(n); }
  // «recuperación, activación y ajuste», no «recuperación y activación y ajuste»
  function enumerar(l){
    if(!l.length) return '';
    if(l.length===1) return l[0];
    return l.slice(0,-1).join(', ')+' y '+l[l.length-1];
  }

  function resumenHistorial(dias){
    var entrenados=dias.filter(function(d){ return !d.descanso; });
    var total=entrenados.length;
    var porDeporte={}, ordenDep=[], carga=0, suaves={}, ordenSuave=[];
    entrenados.forEach(function(d){
      d.deportes.forEach(function(x){ if(!porDeporte[x]){ porDeporte[x]=0; ordenDep.push(x); } porDeporte[x]++; });
      if(!d.papel) return;
      if(PAPEL_CARGA[d.papel]) carga++;
      else { if(!suaves[d.papel]){ suaves[d.papel]=0; ordenSuave.push(d.papel); } suaves[d.papel]++; }
    });
    ordenDep.sort(function(a,b){ return porDeporte[b]-porDeporte[a]; });
    ordenSuave.sort(function(a,b){ return suaves[b]-suaves[a]; });
    var conPapel=carga; ordenSuave.forEach(function(p){ conPapel+=suaves[p]; });
    // Días ya pasados que se quedaron sin apuntar: la marca de constancia
    var sinApuntar=entrenados.filter(function(d){ return !d.apuntado; }).length;
    /* ------------------------------------------------------------
       LOS DÍAS QUE SE QUEDARON A MEDIAS, Y QUÉ SE HACE CON ELLOS
       DECISIÓN: un día a medias SIGUE CONTANDO como día entrenado, y se dice
       aparte, en su propia línea, justo debajo de la cifra grande.

       Por qué cuenta: el atleta se presentó y entrenó. Descontarlo diría que
       ese día no existió, y eso sería otra mentira, solo que hacia abajo.

       Por qué se dice aparte: «41 días entrenados» a secas, cuando ocho fueron
       a medias, miente HACIA ARRIBA —parece que entrenó más de lo que
       entrenó—, y ésa es la peor dirección. Con «8 de ellos, a medias» debajo,
       el número sigue siendo verdad y ya no engaña a nadie.

       Por qué no se cuenta «medio día»: medio día entrenado no es una cosa que
       exista. Inventar una cifra fraccionada para que cuadre sería añadir un
       número que nadie sabría leer, y este resumen se lee en dos segundos.
       ------------------------------------------------------------ */
    var medias=entrenados.filter(function(d){ return d.medias; }).length;
    return { total:total, deportes:ordenDep.map(function(x){ return { nombre:x, n:porDeporte[x] }; }),
             carga:carga, conPapel:conPapel, suaves:ordenSuave, sinApuntar:sinApuntar, medias:medias };
  }

  function resumenHTML(r){
    var html='<div class="hs-res">'+
      '<div class="hs-cab"><h2>'+esc(PERIODOS[HIST_PER])+'</h2>'+
        '<button type="button" class="hs-cambiar" id="hs-cambiar" aria-expanded="false">Cambiar &#9662;</button>'+
        '<div class="hs-opts" id="hs-opts" hidden>'+
          Object.keys(PERIODOS).map(function(k){
            return '<button type="button" data-per="'+k+'"'+(k===HIST_PER?' aria-current="true"':'')+'>'+esc(PERIODOS[k])+'</button>';
          }).join('')+
        '</div>'+
      '</div>'+
      '<div class="hs-cifra"><b>'+r.total+'</b><span>'+(r.total===1?'día entrenado':'días entrenados')+
        /* Los días a medias cuentan como día entrenado —el atleta se presentó y
