  /* ------------------------------------------------------------
     LO QUE LLEVAS HECHO · metros, kilómetros y esfuerzo por semana
     ------------------------------------------------------------
     Se pide APARTE de «la última vez», aunque las dos consultas miren la
     misma tabla, porque no piden lo mismo: aquella quiere los CUARENTA
     registros más recientes de cualquier fecha —para proponerte el peso
     que pusiste la última vez, sea de cuando sea—, y esta quiere DOCE
     SEMANAS enteras, aunque sean doscientos registros. Estirar la de
     arriba a doscientas filas para ahorrarse esta haría que cada vez que
     abres el entreno del día viajaran doscientos registros con sus
     series dentro, y eso se paga en el móvil, en la pista, con datos.

     Y hace falta la SESIÓN además del registro: el registro dice qué
     hiciste, pero de qué deporte era y de qué día lo dice la sesión.
     ------------------------------------------------------------ */
  var VOLUMEN=null;        // el resumen ya calculado, o null si no se pudo
  var VOLUMEN_FALLO=false;
  async function cargarVolumen(){
    if(VOLUMEN) return VOLUMEN;
    VOLUMEN_FALLO=false;
    try {
      var desde=addDias(todayISO,-7*13);   // trece semanas para que las doce salgan enteras
      var rg=await sb.from('registros_sesion')
        .select('sesion_id,created_at,tiempos_reales,rpe,sensacion_general')
        .eq('atleta_id',at.id).gte('created_at',desde)
        .order('created_at',{ascending:false}).limit(250);
      if(rg.error||!rg.data||!rg.data.length){ if(rg.error) VOLUMEN_FALLO=true; return null; }
      var ids=rg.data.map(function(r){ return r.sesion_id; })
               .filter(function(x,i,a){ return x && a.indexOf(x)===i; });
      var ses=[];
      if(ids.length){
        var q=await sb.from('sesiones').select('id,fecha,deporte,deporte_2').in('id',ids);
        if(q.error){ VOLUMEN_FALLO=true; return null; }
        ses=q.data||[];
      }
      VOLUMEN=window.APOLANA_ESTADISTICAS
        ? window.APOLANA_ESTADISTICAS.resumir(ses,rg.data,12) : null;
      return VOLUMEN;
    } catch(e){ VOLUMEN_FALLO=true; return null; }
  }
  /* Si la consulta falló NO se dice «todavía no hay nada»: eso sería dar por
     mirado lo que no se ha podido mirar. Se calla, que es lo honesto. */
  function volumenHTML(){
    if(VOLUMEN_FALLO || !VOLUMEN || !window.APOLANA_ESTADISTICAS) return '';
    return window.APOLANA_ESTADISTICAS.html(VOLUMEN,{ titulo:'Lo que llevas hecho · últimas semanas' });
  }

  async function cargarMarcas(){
    var cont=$('marcas-cont'); cont.innerHTML=APOLANA_UI.cargando('filas',5);
    var m=await pedirMarcas();
    if(m.error){
      /* Si ha fallado, se olvida: si no, el botón de «volver a intentarlo»
         devolvería el mismo error guardado en vez de preguntar de nuevo. */
      olvidarMarcas();
      cont.innerHTML=htmlError('No hemos podido cargar tus marcas',
        'Puede ser tu conexión. Tus marcas siguen guardadas: solo hay que volver a pedirlas.', cargarMarcas);
      return;
    }
    MARCAS=m.data||[];
    await cargarVolumen();
    if(!mkEscucha){
      mkEscucha=true;
      cont.addEventListener('click', function(ev){
        if(!ev.target.closest) return;
        var t=ev.target.closest('#mk-todas');
        if(t){ mkVerTodas=!mkVerTodas; pintarMarcas(); return; }
        var b=ev.target.closest('[data-mk-f]'); if(!b) return;
        mkFiltro=b.getAttribute('data-mk-f'); mkVerTodas=false;
        try { window.localStorage.setItem('apolana.marcas.filtro', mkFiltro); } catch(e){}
        pintarMarcas();
      });
    }
    pintarMarcas();
  }

  /* La mejor marca del año. Dos marcas de pruebas distintas no se pueden
     comparar entre sí, así que «la mejor» es la más reciente de este año que
     además sea tu mejor marca de esa prueba. Si este año no has batido
     ninguna, se enseña la última que apuntaste, dicha por su nombre.
     Nada se inventa: todo sale de lo que hay apuntado. */
  function mejorDelAnio(datos){
    var anio=String(new Date().getFullYear());
    var deEsteAnio=datos.filter(function(x){ return x.fecha && String(x.fecha).slice(0,4)===anio; });
    // la mejor de cada prueba, mirando TODAS las marcas
    var topes={};
    datos.forEach(function(x){
      var y=tiempoANum(x.tiempo_display); if(y==null||!x.prueba) return;
      var mas=catMasMejor(x.prueba);
      if(topes[x.prueba]==null || (mas?y>topes[x.prueba]:y<topes[x.prueba])) topes[x.prueba]=y;
    });
    function conDelta(x){
      var y=tiempoANum(x.tiempo_display); if(y==null) return null;
      var mas=catMasMejor(x.prueba), previa=null;
      datos.forEach(function(o){
        if(o===x || o.prueba!==x.prueba || !o.fecha || !x.fecha || o.fecha>=x.fecha) return;
        var oy=tiempoANum(o.tiempo_display); if(oy==null) return;
        if(previa==null || (mas?oy>previa:oy<previa)) previa=oy;
      });
      return { x:x, y:y, mas:mas, gana: previa!=null ? (mas?y-previa:previa-y) : null };
    }
    var recordsDelAnio=deEsteAnio.filter(function(x){
      var y=tiempoANum(x.tiempo_display);
      return y!=null && topes[x.prueba]!=null && Math.abs(y-topes[x.prueba])<0.0001;
    }).sort(function(a,b){ return a.fecha<b.fecha?1:-1; });
    if(recordsDelAnio.length){
      var r=conDelta(recordsDelAnio[0]); if(r){ r.et='Tu mejor marca del año'; return r; }
    }
    var resto=(deEsteAnio.length?deEsteAnio:datos).slice().sort(function(a,b){ return (a.fecha||'')<(b.fecha||'')?1:-1; });
    for(var i=0;i<resto.length;i++){
      var c=conDelta(resto[i]);
      if(c){ c.et='Tu última marca'; return c; }
    }
    return null;
  }
  function difTexto(seg, mas){
    var s=Math.abs(seg);
    return (mas?'+':'−')+(s<60?s.toFixed(2):segATexto(s));
  }

  function pintarMarcas(){
    var cont=$('marcas-cont');
    if(!MARCAS || !MARCAS.length){
      cont.innerHTML='<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icMarcas+'</div>'+
        '<h3>Todavía no hay marcas</h3>'+
        '<p>Apunta tus tiempos y distancias y verás aquí tus récords y cómo vas mejorando.</p>'+
        '<button type="button" class="btn btn--primario" id="mk-ir">Añadir tu primera marca</button></div>'+
        /* Sin marcas de competición, pero con entrenamientos apuntados, ya hay
           mucho que enseñar. Si esto no estuviera, quien no compite abriría
           esta pantalla y la encontraría vacía para siempre. */
        volumenHTML()+fuerzaHTML();
      var irMk=$('mk-ir');
      if(irMk) irMk.addEventListener('click', function(){
        var f=$('mk-form'), b=$('mk-abrir');
        if(f){ f.hidden=false; if(b) b.setAttribute('aria-expanded','true'); }
        var s=$('mk-prueba'); s.scrollIntoView({block:'center'}); s.focus();
      });
      return;
    }
    var filtro=filtroHTML();
    var datos=marcasDe(mkFiltro);
    if(!datos.length){
      cont.innerHTML=filtro+APOLANA_UI.vacio(
        mkFiltro==='competicion' ? 'Todavía no hay marcas de competición' : 'Todavía no hay marcas de entrenamiento',
        'Tus otras marcas siguen guardadas. Cuando apuntes una y digas dónde la hiciste, aparecerá en este apartado.',
        '<button type="button" class="ap-btn" data-mk-f="todas">Ver todas mis marcas</button>')+
        volumenHTML()+fuerzaHTML();
      return;
    }

    /* 1 · LA tarjeta navy de la pantalla: la mejor marca del año, a 42 px */
    var mj=mejorDelAnio(datos), mejorHtml='';
    if(mj){
      var donde=[mj.x.sede, fechaCorta(mj.x.fecha)].filter(Boolean).join(' · ');
      mejorHtml='<div class="mejor">'+
        '<span class="mj-et">'+esc(mj.et)+'</span>'+
        '<div class="mj-cifra"><span class="mj-dato">'+esc(mj.x.tiempo_display||'')+'</span>'+
        '<span class="mj-prueba">'+esc(mj.x.prueba||'')+'</span></div>'+
        ((mj.gana!=null&&mj.gana>0)||donde ?
          '<div class="mj-pie">'+
            ((mj.gana!=null&&mj.gana>0)?'<span class="mj-mejora">'+esc(difTexto(mj.gana, mj.mas))+' sobre la anterior</span>':'')+
            '<span class="mj-donde">'+esc(donde)+'</span>'+
          '</div>' : '')+
      '</div>';
    }

    /* 2 · Por prueba: la mejor de cada una, con su diferencia. Las pruebas que
       el atleta tiene como suyas y aún no tiene marca dicen «sin marca», nunca
       un guion: un guion hace dudar de si falta el dato. */
    var porPrueba={}; datos.forEach(function(x){ var k=x.prueba||'Prueba sin nombre'; (porPrueba[k]=porPrueba[k]||[]).push(x); });
    var claves=Object.keys(porPrueba).sort();
    var filasPorPrueba=claves.map(function(k){
      var mas=catMasMejor(k), best=null, segunda=null;
      porPrueba[k].forEach(function(x){
        var y=tiempoANum(x.tiempo_display); if(y==null) return;
        if(best==null||(mas?y>best.y:y<best.y)){ segunda=best; best={y:y,disp:x.tiempo_display||'',fecha:x.fecha}; }
        else if(segunda==null||(mas?y>segunda.y:y<segunda.y)) segunda={y:y,disp:x.tiempo_display||'',fecha:x.fecha};
      });
      if(!best) return '<div class="lista-fila sin"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
        '<span class="lf-sin">sin marca</span><span class="lf-dif"></span></div>';
      var dif='<span class="lf-dif">=</span>';
      if(segunda){
        var g = mas ? best.y-segunda.y : segunda.y-best.y;
        if(g>0.001) dif='<span class="lf-dif mejora">'+esc(difTexto(g, mas))+'</span>';
      } else dif='<span class="lf-dif"></span>';
      return '<div class="lista-fila"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
        '<span class="lf-dato">'+esc(best.disp)+'</span>'+dif+'</div>';
    });
    // Las pruebas que el atleta declara como suyas y todavía no tienen marca
    (at.especialidades||[]).forEach(function(n){
      if(porPrueba[n]) return;
      filasPorPrueba.push('<div class="lista-fila sin"><span class="lf-txt"><span class="lf-nom">'+esc(n)+'</span></span>'+
        '<span class="lf-sin">sin marca</span><span class="lf-dif"></span></div>');
    });
    var porPruebaHtml = filasPorPrueba.length
      ? '<div class="lista-tit"><span class="et">Por prueba</span></div><div class="lista-caja">'+filasPorPrueba.join('')+'</div>' : '';

    /* 3 · Últimas marcas, en filas */
    var tipoLabel={mmp:'MMP',temporada:'Temporada',objetivo:'Objetivo'};
    var tope = mkVerTodas ? datos.length : Math.min(5, datos.length);
    var ultimas='<div class="lista-tit"><span class="et">Últimas marcas</span>'+
      (datos.length>5 ? '<button type="button" class="enl" id="mk-todas">'+(mkVerTodas?'Ver menos':'Las '+datos.length)+'</button>' : '')+
      '</div><div class="lista-caja">'+datos.slice(0,tope).map(function(x){
        var etq=[fechaCorta(x.fecha), x.sede,
                 x.contexto==='competicion'?'competición':(x.contexto==='entreno'?'entrenamiento':''),
                 x.tipo?(tipoLabel[x.tipo]||x.tipo):''].filter(Boolean).join(' · ');
        return '<div class="lista-fila">'+
          '<span class="lf-txt"><span class="lf-nom">'+esc(x.prueba||'Prueba sin nombre')+'</span>'+
          (etq?'<span class="lf-sub">'+esc(etq)+'</span>':'')+'</span>'+
          (x.tiempo_display ? '<span class="lf-dato">'+esc(x.tiempo_display)+'</span>'
                            : '<span class="lf-sin">sin marca</span>')+'</div>';
      }).join('')+'</div>';

    /* 4 · Progresión: las gráficas de las pruebas con dos marcas o más */
    var graficos='', gi=0;
    claves.forEach(function(k){
      var arr=porPrueba[k].map(function(x){return {fecha:x.fecha||'',y:tiempoANum(x.tiempo_display),disp:x.tiempo_display||''};}).filter(function(p){return p.y!=null&&p.fecha;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});
      if(arr.length>=2){ graficos+=graficoPrueba(k,arr,catMasMejor(k),gi++); }
    });
    var progHtml = graficos
      ? '<div class="lista-tit"><span class="et">Progresión</span></div><div class="graficos">'+graficos+'</div>'
      : '<p class="vacio" style="margin-bottom:14px;">Con dos marcas o más de una misma prueba verás aquí tu evolución.</p>';

    cont.innerHTML=filtro+mejorHtml+porPruebaHtml+ultimas+progHtml+volumenHTML()+fuerzaHTML();
  }

  /* ------------------------------------------------------------
     LA PROGRESIÓN EN EL GIMNASIO
     ------------------------------------------------------------
     Las gráficas de esta pantalla eran solo de MARCAS de competición. Los
     kilos, que es lo que se apunta tres días por semana, no se dibujaban en
     ningún sitio: solo existían dentro de cada sesión, uno a uno.

     Se dibuja el peso de la mejor serie de cada día. No la media —una serie
     floja de calentamiento hundiría la línea— y no el volumen total, que sube
     al hacer más series aunque no levantes más.

     Sale de lo que ya está cargado (`HIST_FUERZA`), así que no cuesta ninguna
     consulta más: son los mismos registros de los que sale «la última vez».
     ------------------------------------------------------------ */
  function fuerzaHTML(){
    var ejercicios = Object.keys(HIST_FUERZA||{});
    if(!ejercicios.length) return '';
    /* Los que más se repiten primero: son los básicos, y son los que dicen si
       estás progresando. Uno que hiciste dos veces en marzo no. */
    ejercicios.sort(function(a,b){ return HIST_FUERZA[b].length - HIST_FUERZA[a].length; });
    var g='', i=0;
    ejercicios.forEach(function(k){
      var pts = HIST_FUERZA[k]
        .filter(function(x){ return x.kg>0 && x.fecha; })
        .sort(function(a,b){ return a.fecha<b.fecha?-1:1; })
        .map(function(x){ return { fecha:x.fecha, y:x.kg, disp: comaDecimal(String(x.kg))+' kg' }; });
      if(pts.length>=2 && i<6) g += graficoPrueba(HIST_FUERZA[k][0].nom || k, pts, true, 100+(i++));
    });
    if(!g) return '<div class="lista-tit"><span class="et">Gimnasio</span></div>'+
      '<p class="vacio">Cuando apuntes los kilos de un mismo ejercicio dos días distintos, verás aquí cómo va subiendo.</p>';
    return '<div class="lista-tit"><span class="et">Gimnasio · cómo van los kilos</span></div>'+
           '<div class="graficos">'+g+'</div>'+
           '<p class="vacio" style="margin-top:-6px;">El peso de tu mejor serie de cada día.</p>';
  }
  cargarMarcas();
  /* ¿Tiene Strava conectado? Una pregunta al entrar, y si dice que no, el
     botón no se pinta en ningún sitio. Enseñarlo a todo el mundo y que al
     pulsarlo diga «no lo tienes conectado» es enseñar una puerta pintada. */
  mirarStrava().then(function(){ if(STRAVA_HAY && diaSel) pintarDia(diaSel); });

  // Al elegir prueba, adaptar la etiqueta de la marca (tiempo / metros / puntos)
  $('mk-prueba').addEventListener('change', function(){ var p=catMap[this.value]; var lbl=$('mk-tiempo-lbl'), inp=$('mk-tiempo');
    if(p&&p.unidad==='distancia'){ lbl.textContent='Marca (metros)'; inp.placeholder='6.85'; }
    else if(p&&p.unidad==='puntos'){ lbl.textContent='Marca (puntos)'; inp.placeholder='5820'; }
    else { lbl.textContent='Marca (tiempo)'; inp.placeholder='7.85 · 1:02.3'; }
  });

  $('mk-guardar').addEventListener('click', async function(){
    var msg=$('mk-msg'); var prueba=$('mk-prueba').value.trim(), disp=$('mk-tiempo').value.trim();
    if(!prueba){ msg.textContent='Elige la prueba.'; msg.className='msg error'; return; }
    msg.textContent='Guardando…'; msg.className='msg';
    var payload={ atleta_id:at.id, prueba:prueba, tiempo_display:disp||null, tiempo_segundos:tiempoANum(disp), fecha:$('mk-fecha').value||null, sede:$('mk-sede').value.trim()||null, tipo:$('mk-tipo').value||null, contexto:$('mk-contexto').value||null };
    var ins=await sb.from('marcas_atleta').insert(payload);
    if(ins.error){ msg.textContent='Error: '+ins.error.message; msg.className='msg error'; return; }
    msg.textContent='Marca guardada ✓'; msg.className='msg ok';
    $('mk-prueba').value=''; $('mk-tiempo').value=''; $('mk-sede').value=''; $('mk-tipo').value=''; $('mk-contexto').value='';
    // Acaba de haber una marca nueva: aquí SÍ hay que volver a preguntar.
    olvidarMarcas();
    cargarMarcas();
  });

  /* ---------- BONO DE EL CUBO ----------
     Los usos que quedan se leen en la propia fila de «Más», sin entrar: es
     lo único que va por usos comprados y no por cuota, así que se consulta
     antes de cada sesión. Si la consulta falla no se dice «0 usos» — eso
     sería peor que no decir nada: se deja la fila sin cifra. */
  var USOS_CUBO = null;
  (async function cargarBonoCubo(){
    var r = await sb.from('cubo_bono_saldo').select('usos_disponibles,activo,caducado').eq('atleta_id', at.id);
    if (r.error || !r.data) return;
    USOS_CUBO = r.data.reduce(function(s, b){
      return s + ((b.activo && !b.caducado) ? (b.usos_disponibles || 0) : 0);
    }, 0);
    if (SEC === 'mas') pintarMas();
  })();

  // ---------- PAGOS ----------
  (async function cargarPagos(){
    var cont=$('pagos-cont');
    var p=await sb.from('pagos').select('concepto,importe,estado,fecha_vencimiento').eq('atleta_id',at.id).order('fecha_vencimiento',{ascending:false}).limit(40);
    if(p.error){
      /* «Sin recibos por ahora» con un recibo devuelto de por medio es una
         multa: aquí se dice que no se ha podido mirar, y se vuelve a mirar. */
      cont.innerHTML=htmlError('No hemos podido cargar tus recibos',
        'Puede ser tu conexión. Nada se ha cobrado ni se ha perdido: solo hay que volver a pedir la lista.', cargarPagos);
      return;
    }
    PAGOS = p.data || [];
    if(hoyPintado) pintarHoy();   // ya podemos avisar de un recibo vencido en «Hoy»

    var lista;
    if(!PAGOS.length){
      lista='<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icPagos+'</div>'+
        '<h3>Sin recibos por ahora</h3><p>Cuando el club emita un recibo a tu nombre lo verás aquí, con su estado y su fecha.</p></div>';
    } else {
      // Un recibo por fila, en un solo contenedor con separadores. El importe a
      // la derecha y en monoespaciada: son cifras que se suman con la vista.
      lista='<div class="lista-tit"><span class="et">Tus recibos</span></div>'+
        '<div class="lista-caja">'+PAGOS.map(function(x){
        var ok=(x.estado==='pagado'||x.estado==='cobrado');
        var cuando = x.fecha_vencimiento ? ((ok?'cobrado el ':'se cobra el ')+fechaCorta(x.fecha_vencimiento)) : '';
        var sub=[cuando, x.estado||''].filter(Boolean).join(' · ');
        return '<div class="lista-fila'+(ok?'':' pend')+'">'+
          '<span class="lf-txt"><span class="lf-nom">'+esc(x.concepto||'')+'</span>'+
          (sub?'<span class="lf-sub">'+esc(sub)+'</span>':'')+'</span>'+
          '<span class="lf-dato">'+(x.importe!=null?esc(eur(x.importe)):'')+'</span></div>';
      }).join('')+'</div>';
    }
    cont.innerHTML=lista;

    // --- Cómo se paga --------------------------------------------------
    // Antes aquí se veía el importe y ya está: nadie decía dónde pagarlo.
    // El bloque sale debajo de los recibos, con la cuenta que le toca a
    // esta persona (escuela o club) y a quién preguntar si algo falla.
    if(window.APOLANA_INFO_PAGOS){
      try {
        await APOLANA_INFO_PAGOS.cargar(sb);
        var pend = PAGOS.filter(function(x){ var e=(x.estado||'').toLowerCase(); return e==='pendiente'||e==='impagado'; });
        var dev  = PAGOS.filter(function(x){ var e=(x.estado||'').toLowerCase();
          return e==='impagado' || e==='devuelto' ||
                 (e==='pendiente' && x.fecha_vencimiento && x.fecha_vencimiento < isoDe(new Date())); });
        var b = APOLANA_INFO_PAGOS.bloque({
          clave: APOLANA_INFO_PAGOS.claveDe(at),
          pendientes: pend.length,
          devueltos: dev.length
        });
        if(b){ cont.insertAdjacentHTML('beforeend', b); APOLANA_INFO_PAGOS.activar(cont); }
      } catch(e){ /* si falla, la lista de recibos se queda como estaba */ }
    }
  })();

  // ---------- llegar directo a una sección ----------
  // La barra inferior del resto de pantallas del portal enlaza aquí con
  // #entreno, #marcas, #pagos o #mas: se abre esa sección al entrar.
  (function(){
    function secDelHash(){
      var h=(location.hash||'').replace(/^#/,'');
      return SECCIONES.indexOf(h)!==-1 ? h : null;
    }
    var s=secDelHash();
    if(s && s!==SEC) activarSeccion(s);
    window.addEventListener('hashchange', function(){
      var x=secDelHash(); if(x && x!==SEC) activarSeccion(x);
    });
  })();

});
</script>
