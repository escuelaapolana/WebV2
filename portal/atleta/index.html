  /* ---------- anterior y siguiente día CON entrenamiento (entrega 9, 3b) ----------
     No es «el día de antes»: es el entrenamiento de antes, aunque sea de la
     semana pasada. Así el historial se recorre sin volver a la lista en cada
     día. Se pregunta una vez por día y se recuerda. */
  var VEC={};
  async function vecinosDe(iso){
    if(VEC[iso]) return VEC[iso];
    var v={ prev:null, next:null };
    try {
      var a=await sb.from('sesiones').select('fecha').eq('publicada',true).lt('fecha',iso)
              .order('fecha',{ascending:false}).limit(1);
      if(!a.error && a.data && a.data.length) v.prev=a.data[0].fecha;
      var b=await sb.from('sesiones').select('fecha').eq('publicada',true).gt('fecha',iso)
              .order('fecha',{ascending:true}).limit(1);
      if(!b.error && b.data && b.data.length) v.next=b.data[0].fecha;
    } catch(e){}
    VEC[iso]=v;
    return v;
  }
  /* Dos sitios para lo mismo: en corto arriba, para el pulgar, y con el día
     escrito al pie, que es donde se acaba de leer el entrenamiento. */
  function pintarFlechas(iso, v){
    if(diaSel!==iso) return;                 /* ha cambiado de día mientras se preguntaba */
    var arriba=$('tb-flechas');
    if(arriba && SEC==='entreno'){
      arriba.innerHTML = (MODO==='historial') ? '' :
        '<button type="button" data-ir-dia="'+esc(v.prev||'')+'"'+(v.prev?'':' disabled')+' aria-label="Entrenamiento anterior">&lsaquo;</button>'+
        '<button type="button" data-ir-dia="'+esc(v.next||'')+'"'+(v.next?'':' disabled')+' aria-label="Entrenamiento siguiente">&rsaquo;</button>';
    }
    var pie=$('ent-pies');
    if(pie){
      pie.innerHTML =
        (v.prev ? '<button type="button" data-ir-dia="'+esc(v.prev)+'">&lsaquo; '+esc(fechaDiaMes(v.prev))+'</button>'
                : '<button type="button" class="hueco" disabled>&nbsp;</button>')+
        (v.next ? '<button type="button" data-ir-dia="'+esc(v.next)+'">'+esc(fechaDiaMes(v.next))+' &rsaquo;</button>'
                : '<button type="button" class="hueco" disabled>&nbsp;</button>');
      pie.hidden = !(v.prev || v.next);
    }
  }
  // «1 de agosto», que es como se lee una fecha en voz alta
  function fechaDiaMes(iso){
    if(!iso) return '';
    var d=new Date(iso+'T00:00:00');
    return isNaN(d.getTime()) ? '' : d.getDate()+' de '+MESES_LARGOS[d.getMonth()];
  }
  // «lunes 3 de agosto»: la fecha entera, para la cabecera del entrenamiento
  function fechaDeDia(iso){
    if(!iso) return '';
    var d=new Date(iso+'T00:00:00');
    var di=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    return isNaN(d.getTime()) ? '' : di[d.getDay()]+' '+fechaDiaMes(iso);
  }
  function pintarDia(iso){
    diaSel=iso;
    pintarSemana();
    var lista=sesionesDe(iso), cont=$('entreno-cont');
    if(!lista.length){
      var cabDia='<div class="entreno-cab"><div class="ent-fecha">'+esc(fechaDeDia(iso))+'</div>'+
        '<h2 class="ent-tit">'+esc(iso===todayISO?'Hoy no toca':'Sin entrenamiento')+'</h2></div>';
      /* Si la semana no se ha podido leer, no se dice que no hay entreno: se
         dice que no lo sabemos y se ofrece volver a mirar. */
      if(SEM_FALLO[lunesVis]){
        cont.innerHTML='<div class="tarjeta">'+cabDia+
          htmlError('No hemos podido cargar tus entrenamientos',
            'Puede ser tu conexión. No sabemos si hoy tienes entrenamiento o no: vuelve a intentarlo, y si tienes dudas pregunta a tu entrenador.',
            async function(){ await cargarSemana(lunesVis); pintarDia(diaSel); })+'</div>';
        return;
      }
      var haySemana=(SEM[lunesVis]||[]).length;
      var titulo = (iso===todayISO) ? 'Hoy no toca entrenamiento' : 'Ese día no hay entrenamiento';
      var aviso = haySemana ? 'Esta semana sí hay entrenamientos: toca otro día de la tira de arriba y lo verás.'
        : (at.grupo_id ? 'Tu entrenador todavía no ha publicado los entrenamientos de esta semana. Suelen aparecer unos días antes.'
                       : 'Todavía no estás en ningún grupo. En cuanto tu entrenador te asigne a uno, verás aquí tus entrenamientos.');
      var salida = haySemana ? '' : APOLANA_UI.boton('Ver el calendario del club', '../calendario/');
      cont.innerHTML='<div class="tarjeta">'+cabDia+APOLANA_UI.vacio(titulo, aviso, salida)+'</div>'+
        '<div class="ent-pies" id="ent-pies" hidden></div>';
      vecinosDe(iso).then(function(v){ pintarFlechas(iso, v); });
      return;
    }
    cont.innerHTML=lista.map(function(s){
      /* Un día que ya pasó y que el atleta apuntó se lee, no se edita: lo que
         escribió aquel día es un hecho. Los que se quedaron sin apuntar siguen
         abiertos, porque apuntarlos tarde es lo que hace que esto sirva.
         Y si ha pedido corregirlo, se abre: hasta hoy un peso mal tecleado se
         quedaba mal para siempre, que es peor que cualquier otra cosa. */
      var leer = esLeer(s);
      /* El aviso de que se está corrigiendo va ARRIBA DEL TODO, antes que los
         ejercicios: si fuera abajo, para cuando se lee ya se han tocado los
         kilos. */
      return '<div class="entreno-uno" data-sid="'+esc(s.id)+'">'+
             (leer?'':avisoCorrigiendoHTML(s))+renderEntreno(s,todayISO,leer)+
             (leer ? fichaFeedbackLeer(s) : fichaFeedback(s))+
             comentarioHTML(s)+'</div>';
    }).join('');
    cont.innerHTML += '<div class="ent-pies" id="ent-pies" hidden></div>';
    lista.forEach(function(s){ if(!esLeer(s)) prefillTiempos(s); });
    progresoBloques(cont);
    vecinosDe(iso).then(function(v){ pintarFlechas(iso, v); });
  }

  // Día que se muestra al abrir una semana: el preferido si tiene entreno; si no, el más cercano
  function elegirDia(lunes, pref){
    var lista=SEM[lunes]||[];
    var base=(pref && difDias(pref,lunes)>=0 && difDias(pref,lunes)<=6) ? pref : lunes;
    if(lista.some(function(s){ return s.fecha===base; })) return base;
    var mejor=null;
    lista.forEach(function(s){
      var d=Math.abs(difDias(s.fecha,base));
      if(!mejor || d<mejor.d || (d===mejor.d && s.fecha>mejor.f)) mejor={d:d,f:s.fecha};
    });
    return mejor?mejor.f:base;
  }

  async function irSemana(lunes, pref){
    lunesVis=lunes;
    $('sem-rango').textContent=rangoTxt(lunes);
    $('sem-dias').classList.add('cargando');
    $('entreno-cont').innerHTML='<div class="tarjeta">'+APOLANA_UI.cargando('filas',4)+'</div>';
    await cargarSemana(lunes);
    $('sem-dias').classList.remove('cargando');
    pintarDia(elegirDia(lunes, pref));
  }

  $('sem-prev').addEventListener('click', function(){ irSemana(addDias(lunesVis,-7), null); });
  $('sem-next').addEventListener('click', function(){ irSemana(addDias(lunesVis,7), null); });
  $('sem-hoy').addEventListener('click', function(){ irSemana(lunesDe(todayISO), todayISO); });
  /* Cuatro semanas de golpe, no «el mismo día del mes anterior»: así la
     tira sigue empezando en lunes y no se salta ni se repite ninguna. */
  $('sem-mes-prev').addEventListener('click', function(){ irSemana(addDias(lunesVis,-28), null); });
  $('sem-mes-next').addEventListener('click', function(){ irSemana(addDias(lunesVis,28), null); });

  /* ============================================================
     EL HISTORIAL (entrega 9, 3a)
     ------------------------------------------------------------
     Dos cosas en la misma pantalla, y en este orden: un resumen que
     contesta «¿de qué han ido estos tres meses?» en dos segundos, y
     debajo la lista larga que lo demuestra. La lista sola no convence
     a un chaval de catorce años; el resumen solo no tiene pruebas.
     ============================================================ */
  var HIST={};              // { periodo: [ {fecha, deportes, papel, texto, apuntado} ] }
  var HIST_PER='3m';        // periodo que se está viendo
  var HIST_REG=null;        // ids de sesión que el atleta ya apuntó
  var HIST_FALLO={};
  var PERIODOS={ mes:'Este mes', '3m':'Últimos 3 meses', temp:'Esta temporada' };

  function restarMeses(iso, n){
    var d=new Date(iso+'T00:00:00');
    var dia=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()-n);
    /* Del 31 de marzo hacia atrás no hay 31 de febrero: se queda en el
       último día del mes, que es lo que espera cualquiera. */
    var ultimo=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(dia, ultimo));
    return isoDe(d);
  }
  // La temporada del club empieza en septiembre, igual que en el ranking
  function inicioTemporada(iso){
    var d=new Date(iso+'T00:00:00');
    var anio = (d.getMonth()+1) >= 9 ? d.getFullYear() : d.getFullYear()-1;
    return anio+'-09-01';
  }
  function desdeDe(per){
    if(per==='mes')  return todayISO.slice(0,8)+'01';
    if(per==='temp') return inicioTemporada(todayISO);
    return restarMeses(todayISO, 3);
  }

  async function cargarHistorial(per){
    if(HIST[per]) return HIST[per];
    delete HIST_FALLO[per];
    var desde=desdeDe(per);
    var ses=[];
    try {
      /* Sin `bloques`: para la lista basta el título, y traerse el contenido
         entero de doscientos entrenamientos por una lista es tirar la
         conexión de un móvil. El permiso del servidor (migración 099) ya
         devuelve solo los entrenamientos de los que este atleta tiene
         registro, aunque haya cambiado de grupo. */
      var q=await sb.from('sesiones')
        .select('id,fecha,tipo,rol,deporte,deporte_2,papel_dia,titulo')
        .eq('publicada',true).gte('fecha',desde).lte('fecha',todayISO)
        .order('fecha',{ascending:false});
      if(q.error) { HIST_FALLO[per]=true; return null; }
      ses=q.data||[];
    } catch(e){ HIST_FALLO[per]=true; return null; }

    /* Lo que el atleta apuntó, una sola vez para todos los periodos. Se trae
       también el ESTADO, porque un día a medias y un día entero no son lo
       mismo y el resumen no puede contarlos igual. */
    if(HIST_REG===null){
      HIST_REG={};
      try {
        var rg=await sb.from('registros_sesion').select('sesion_id,estado').eq('atleta_id',at.id);
        if(!rg.error && rg.data) rg.data.forEach(function(r){ HIST_REG[r.sesion_id]={ estado:r.estado }; });
      } catch(e){}
    }
    /* Lo apuntado en esta visita, que todavía no estaba en esa consulta */
    Object.keys(REG).forEach(function(id){ HIST_REG[id]={ estado: REG[id].estado||null }; });

    /* Un día es una línea aunque haya dos deportes: el caso real —pesas y
       luego series como transferencia— fue un día de entrenar, no dos. */
    var porDia={}, orden=[];
    ses.forEach(function(s){
      if(!porDia[s.fecha]){ porDia[s.fecha]={ fecha:s.fecha, sesiones:[] }; orden.push(s.fecha); }
      porDia[s.fecha].sesiones.push(s);
    });
    HIST[per]=orden.map(function(f){
      var d=porDia[f], deportes=[], papel='', textos=[], apuntado=false, descanso=true, medias=false;
      d.sesiones.forEach(function(s){
        deportesDe(s).forEach(function(x){ if(deportes.indexOf(x)===-1) deportes.push(x); });
        if(!papel) papel=papelDe(s);
        if(s.titulo) textos.push(s.titulo);
        var reg=HIST_REG[s.id];
        if(reg){
          apuntado=true;
          /* «A medias» y «no hecho» se cuentan juntos aquí: los dos son días en
             los que el entrenamiento no se hizo entero, que es lo que el
             resumen no puede callarse. */
          if(reg.estado==='a_medias'||reg.estado==='no_hecho') medias=true;
        }
        if((s.papel_dia||s.tipo)!=='descanso') descanso=false;
      });
      return { fecha:f, deportes:deportes, papel:papel, texto:textos.join(' · '),
               apuntado:apuntado, descanso:descanso, medias:medias };
    });
    return HIST[per];
  }

  /* La frase escrita es lo que se entiende; la barra solo la respalda. Por eso
     la fracción se dice con palabras y se redondea a la de al lado: «dos de
     cada tres» se recuerda, «63,4 %» no dice nada. */
  var FRACCIONES=[
    { v:1/5, txt:'Uno de cada cinco días fue de carga' },
    { v:1/4, txt:'Uno de cada cuatro días fue de carga' },
    { v:1/3, txt:'Uno de cada tres días fue de carga' },
    { v:2/5, txt:'Dos de cada cinco días fueron de carga' },
    { v:1/2, txt:'La mitad de los días fueron de carga' },
    { v:3/5, txt:'Tres de cada cinco días fueron de carga' },
    { v:2/3, txt:'Dos de cada tres días fueron de carga' },
    { v:3/4, txt:'Tres de cada cuatro días fueron de carga' },
    { v:4/5, txt:'Cuatro de cada cinco días fueron de carga' }
  ];
  function fraseCarga(r){
    if(r<=0.02) return 'Ningún día fue de carga';
    if(r>=0.93) return 'Casi todos los días fueron de carga';
    var mejor=FRACCIONES[0];
    FRACCIONES.forEach(function(f){ if(Math.abs(f.v-r)<Math.abs(mejor.v-r)) mejor=f; });
    return mejor.txt;
  }
  /* Los días de apretar y los de dejar que el cuerpo asiente. No es una
     clasificación del club: es la lectura que pide el resumen, y por eso la
     frase de debajo nombra los papeles que de verdad ha habido. */
  var PAPEL_CARGA={ Carga:1, Impacto:1, 'Competición':1 };
  var NUMEROS=['cero','Un','Dos','Tres','Cuatro','Cinco','Seis','Siete','Ocho','Nueve'];
  function enPalabras(n){ return (n>=1 && n<=9) ? NUMEROS[n] : String(n); }
  // «recuperación, activación y ajuste», no «recuperación y activación y ajuste»
  function enumerar(l){
    if(!l.length) return '';
    if(l.length===1) return l[0];
    return l.slice(0,-1).join(', ')+' y '+l[l.length-1];
  }

  function resumenHistorial(dias){
    var entrenados=dias.filter(function(d){ return !d.descanso; });
    var total=entrenados.length;
    var porDeporte={}, ordenDep=[], carga=0, suaves={}, ordenSuave=[];
    entrenados.forEach(function(d){
      d.deportes.forEach(function(x){ if(!porDeporte[x]){ porDeporte[x]=0; ordenDep.push(x); } porDeporte[x]++; });
      if(!d.papel) return;
      if(PAPEL_CARGA[d.papel]) carga++;
      else { if(!suaves[d.papel]){ suaves[d.papel]=0; ordenSuave.push(d.papel); } suaves[d.papel]++; }
    });
    ordenDep.sort(function(a,b){ return porDeporte[b]-porDeporte[a]; });
    ordenSuave.sort(function(a,b){ return suaves[b]-suaves[a]; });
    var conPapel=carga; ordenSuave.forEach(function(p){ conPapel+=suaves[p]; });
    // Días ya pasados que se quedaron sin apuntar: la marca de constancia
    var sinApuntar=entrenados.filter(function(d){ return !d.apuntado; }).length;
    /* ------------------------------------------------------------
       LOS DÍAS QUE SE QUEDARON A MEDIAS, Y QUÉ SE HACE CON ELLOS
       DECISIÓN: un día a medias SIGUE CONTANDO como día entrenado, y se dice
       aparte, en su propia línea, justo debajo de la cifra grande.

       Por qué cuenta: el atleta se presentó y entrenó. Descontarlo diría que
       ese día no existió, y eso sería otra mentira, solo que hacia abajo.

       Por qué se dice aparte: «41 días entrenados» a secas, cuando ocho fueron
       a medias, miente HACIA ARRIBA —parece que entrenó más de lo que
       entrenó—, y ésa es la peor dirección. Con «8 de ellos, a medias» debajo,
       el número sigue siendo verdad y ya no engaña a nadie.

       Por qué no se cuenta «medio día»: medio día entrenado no es una cosa que
       exista. Inventar una cifra fraccionada para que cuadre sería añadir un
       número que nadie sabría leer, y este resumen se lee en dos segundos.
       ------------------------------------------------------------ */
    var medias=entrenados.filter(function(d){ return d.medias; }).length;
    return { total:total, deportes:ordenDep.map(function(x){ return { nombre:x, n:porDeporte[x] }; }),
             carga:carga, conPapel:conPapel, suaves:ordenSuave, sinApuntar:sinApuntar, medias:medias };
  }

  function resumenHTML(r){
    var html='<div class="hs-res">'+
      '<div class="hs-cab"><h2>'+esc(PERIODOS[HIST_PER])+'</h2>'+
        '<button type="button" class="hs-cambiar" id="hs-cambiar" aria-expanded="false">Cambiar &#9662;</button>'+
        '<div class="hs-opts" id="hs-opts" hidden>'+
          Object.keys(PERIODOS).map(function(k){
            return '<button type="button" data-per="'+k+'"'+(k===HIST_PER?' aria-current="true"':'')+'>'+esc(PERIODOS[k])+'</button>';
          }).join('')+
        '</div>'+
      '</div>'+
      '<div class="hs-cifra"><b>'+r.total+'</b><span>'+(r.total===1?'día entrenado':'días entrenados')+
        /* Los días a medias cuentan como día entrenado —el atleta se presentó y
           entrenó—, pero se dicen aquí mismo, pegados a la cifra: «41 días» a
           secas, cuando ocho fueron a medias, miente hacia arriba, y ésa es la
           peor dirección. Así el número sigue siendo verdad y ya no engaña. */
        (r.medias>0 ? '<i class="hs-medias">'+(r.medias===1?'uno de ellos, a medias':r.medias+' de ellos, a medias')+'</i>' : '')+
      '</span></div>';
    if(r.deportes.length && r.total){
      html+='<div class="hs-barras">'+r.deportes.map(function(d){
        var pc=Math.round(d.n*100/r.total);
        return '<div class="hs-barra"><span class="hs-et">'+esc(d.nombre)+'</span>'+
          '<span class="hs-carril"><i style="width:'+Math.max(pc,2)+'%"></i></span>'+
          '<span class="hs-n">'+d.n+'</span></div>';
      }).join('')+'</div>';
    }
    if(r.conPapel){
      var ratio=r.carga/r.conPapel;
      var pcCarga=Math.round(ratio*100);
      var resto = r.suaves.length
        ? ' El resto, '+enumerar(r.suaves.slice(0,3).map(function(p){ return p.toLowerCase(); }))+'.'
        : '';
      html+='<div class="hs-split">'+
        '<span class="hs-sb" aria-hidden="true"><i class="carga" style="width:'+pcCarga+'%"></i>'+
        '<i class="suave" style="width:'+(100-pcCarga)+'%"></i></span>'+
        '<p class="hs-frase"><b>'+esc(fraseCarga(ratio))+'.</b>'+esc(resto)+'</p></div>';
    }
    html+='</div>';
    /* Se dice una vez, en pequeño y sin regañar: apuntarlo es lo que hace que
       el historial sirva de algo, y quien no lo ha hecho ya lo sabe. */
    if(r.sinApuntar>0){
      html+='<p class="hs-pie">'+esc(enPalabras(r.sinApuntar))+' '+(r.sinApuntar===1?'día':'días')+
        ' sin apuntar nada. Apuntarlo es lo que hace que esto sirva.</p>';
    }
    return html;
  }

  var MESES_TIT=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  function listaHistorialHTML(dias){
    var nom=['dom','lun','mar','mié','jue','vie','sáb'];
    var html='<div class="hs-lista">', mesActual='';
    // Cuántos días entrenados lleva cada mes, para el encabezado
    var porMes={};
    dias.forEach(function(d){
      var k=d.fecha.slice(0,7);
      if(!porMes[k]) porMes[k]=0;
      if(!d.descanso) porMes[k]++;
    });
    dias.forEach(function(d){
      var f=new Date(d.fecha+'T00:00:00'), k=d.fecha.slice(0,7);
      if(k!==mesActual){
        mesActual=k;
        html+='<div class="hs-mes">'+esc(MESES_TIT[f.getMonth()])+' · '+porMes[k]+' '+(porMes[k]===1?'día':'días')+'</div>';
      }
      var chips=d.deportes.map(function(x){ return '<span class="hd-chip">'+esc(x)+'</span>'; }).join('');
      /* El papel del día es lo que explica; el deporte solo clasifica. */
      var linea=[d.papel, d.texto].filter(Boolean).join(' · ') || 'Entrenamiento';
      html+='<button type="button" class="hs-dia'+(d.apuntado?'':' sin')+'" data-hist-dia="'+esc(d.fecha)+'">'+
        '<span class="hd-fecha"><b>'+f.getDate()+'</b><span>'+esc(nom[f.getDay()])+'</span></span>'+
        '<span class="hd-mid">'+(chips?'<span class="hd-chips">'+chips+'</span>':'')+
          '<span class="hd-papel">'+esc(linea)+'</span></span>'+
        '<span class="hd-punto" aria-hidden="true"><i></i></span>'+
        '<span class="hd-chev" aria-hidden="true">&rsaquo;</span></button>';
    });
    return html+'</div>';
  }

  async function pintarHistorial(){
    var cont=$('hist-cont');
    if(!HIST[HIST_PER] && !HIST_FALLO[HIST_PER]){
      cont.innerHTML='<div class="tarjeta">'+APOLANA_UI.cargando('filas',5)+'</div>';
      await cargarHistorial(HIST_PER);
      if(MODO!=='historial') return;             /* se ha ido a otro sitio mientras cargaba */
    }
    if(HIST_FALLO[HIST_PER]){
      cont.innerHTML='<div class="tarjeta">'+htmlError('No hemos podido cargar tu historial',
        'Puede ser tu conexión. No se ha perdido nada: tus entrenamientos y lo que apuntaste siguen ahí.',
        async function(){ delete HIST_FALLO[HIST_PER]; await pintarHistorial(); })+'</div>';
      return;
    }
    var dias=HIST[HIST_PER]||[];
    if(!dias.length){
      cont.innerHTML='<div class="tarjeta">'+APOLANA_UI.vacio('Todavía no hay historial que mirar',
        'En cuanto entrenes unos cuantos días aparecerán aquí, agrupados por mes, con lo que hiciste y lo que apuntaste.')+'</div>';
      return;
    }
    cont.innerHTML=resumenHTML(resumenHistorial(dias))+listaHistorialHTML(dias);
  }

  /* El conmutador. «Sesión de hoy» y «Mi semana» comparten la tira de días;
     en el historial la tira desaparece porque allí se navega por meses. */
  function pintarModo(){
    var conm=$('ent-conm');
    if(conm) conm.querySelectorAll('.cm').forEach(function(b){
      b.setAttribute('aria-selected', b.getAttribute('data-modo')===MODO ? 'true' : 'false');
    });
    $('ent-semana').hidden   = (MODO==='historial');
    $('entreno-cont').hidden = (MODO==='historial');
    $('hist-cont').hidden    = (MODO!=='historial');
    // Los mandos de semana solo en «Mi semana»: en «Sesión de hoy» no se navega
    var cab=$('sem-cab'); if(cab) cab.hidden = (MODO!=='semana');
    var rango=$('sem-rango'); if(rango) rango.hidden = (MODO!=='semana');
    var flechas=$('tb-flechas'); if(flechas && MODO==='historial') flechas.innerHTML='';
  }
  function activarModo(modo){
    MODO=modo;
    pintarModo();
    if(modo==='historial'){ pintarHistorial(); return; }
    if(modo==='hoy' && diaSel!==todayISO){
      if(lunesVis===lunesHoy) pintarDia(todayISO); else irSemana(lunesHoy, todayISO);
    } else if(diaSel){
      vecinosDe(diaSel).then(function(v){ pintarFlechas(diaSel, v); });
    }
  }

  // Abrir un día del historial: se pasa a «Mi semana», que es donde vive el detalle
  async function abrirDiaHistorial(iso){
    activarModo('semana');
    if(lunesDe(iso)===lunesVis) pintarDia(iso); else await irSemana(lunesDe(iso), iso);
    window.scrollTo(0,0);
  }

  // Un único manejador para toda la sección: al repintar no se duplican los clics
  $('sec-entreno').addEventListener('click', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var cm=t.closest('.conm .cm');
    if(cm){ activarModo(cm.getAttribute('data-modo')); return; }
    var hd=t.closest('[data-hist-dia]');
    if(hd){ abrirDiaHistorial(hd.getAttribute('data-hist-dia')); return; }
    var camb=t.closest('#hs-cambiar');
    var op=$('hs-opts');
    if(camb){
      if(!op) return;
      op.hidden=!op.hidden;
      camb.setAttribute('aria-expanded', op.hidden?'false':'true');
      return;
    }
    var per=t.closest('#hs-opts [data-per]');
    if(per){ HIST_PER=per.getAttribute('data-per'); pintarHistorial(); return; }
    /* Tocar fuera cierra el desplegable del periodo: si no, se queda abierto
       tapando la primera fila de la lista. */
    if(op && !op.hidden){
      op.hidden=true;
      var bc=$('hs-cambiar'); if(bc) bc.setAttribute('aria-expanded','false');
    }
    var irDia=t.closest('[data-ir-dia]');
    if(irDia && irDia.getAttribute('data-ir-dia')){ abrirDiaHistorial(irDia.getAttribute('data-ir-dia')); return; }
    var dia=t.closest('.dia');
    /* Tocar un día de la tira desde «Sesión de hoy» es ya moverse por la
       semana: el conmutador se pone donde de verdad estás. */
    if(dia){
      if(MODO==='hoy') activarModo('semana');
      pintarDia(dia.getAttribute('data-dia'));
      return;
    }
    /* «Corregir lo apuntado»: abre otra vez el día que ya estaba cerrado.
       No borra nada —lo que había se vuelve a volcar en los huecos— y al
       guardar la base deja constancia de que se corrigió (migración 104). */
    var corr=t.closest('.fb-corregir');
    if(corr){
      var cajaCo=corr.closest('.entreno-uno');
      var sidCo=cajaCo&&cajaCo.getAttribute('data-sid');
      if(sidCo){ CORRIGIENDO[sidCo]=true; pintarDia(diaSel); }
      return;
    }
    /* «Lo cambié por otra cosa»: abre el campo y lleva el foco dentro, que si
       no hay que dar un segundo toque para escribir. Vale igual para el enlace
       de la primera vez y para el «Cambiar» de cuando ya hay algo puesto. */
    var abreCambio=t.closest('.cambio-btn') || t.closest('.ch-editar');
    if(abreCambio){
      var ejer=abreCambio.closest('.ejer');
      var cajaC=ejer&&ejer.querySelector('.cambio-caja');
      if(cajaC){
        cajaC.hidden=false;
        var inC=cajaC.querySelector('.cambio-in');
        if(inC){ inC.focus(); inC.setSelectionRange(inC.value.length, inC.value.length); }
      }
      return;
    }
    /* El ✓ de una serie. Es lo único que decide si esa serie se hizo: sin ✓,
       no se hizo. Al marcarla se cierra el teclado si estaba abierto. */
    var ok=t.closest('.s-ok');
    if(ok){
      var puesto=ok.getAttribute('aria-pressed')==='true';
      ok.setAttribute('aria-pressed', puesto?'false':'true');
      var cajaOk=t.closest('.entreno-uno');
      progresoBloques(cajaOk); marcarSucio(cajaOk);
      return;
    }
    /* El conmutador metros / kilómetros. Se recuerda para la próxima: quien
       pone series todo el rato no debería tocarlo nunca. */
    var uni=t.closest('.s-unis [data-uni]');
    if(uni){
      var grp=uni.closest('.serie-cap');
      var ins=grp?grp.parentNode.querySelector('.serie-inputs'):null;
      ponerUnidad(ins, uni.getAttribute('data-uni'), true);
      marcarSucio(t.closest('.entreno-uno'));
      return;
    }
    /* «Repetir» lo de la última vez: rellena las series que estén vacías y las
       da por hechas. Las que ya tengan algo escrito no se tocan, que sería
       pisarle al atleta lo que acaba de apuntar. */
    var rep=t.closest('[data-ultima]');
    if(rep){
      var ultima=ULTIMA_EJ[claveEjercicio(rep.getAttribute('data-ultima'))];
      var grupoIn=rep.parentNode.querySelector('.serie-inputs');
      if(ultima && grupoIn){
        grupoIn.querySelectorAll('.serie-hueco').forEach(function(fila){
          var vacia=true;
          fila.querySelectorAll('.serie-in').forEach(function(i){ if(i.value.trim()) vacia=false; });
          if(!vacia) return;
          fila.querySelectorAll('.serie-in').forEach(function(i){
            var v=ultima.campos&&ultima.campos[i.getAttribute('data-c')];
            if(v!=null && v!=='') i.value=v;
          });
          var b=fila.querySelector('.s-ok'); if(b) b.setAttribute('aria-pressed','true');
        });
        var cajaR=t.closest('.entreno-uno');
        progresoBloques(cajaR); marcarSucio(cajaR);
      }
      return;
    }
    /* Por qué se quedó a medias. Si es «me molestaba», se abren las molestias
       de siempre y se lleva ahí el foco: esa información ya tiene su sitio y no
       se guarda dos veces. */
    var mot=t.closest('.nh-motivos [data-motivo]');
    if(mot){
      var panel=mot.closest('[data-nh]');
      var k=mot.getAttribute('data-motivo');
      var yaSel=mot.getAttribute('aria-pressed')==='true';
      panel.querySelectorAll('[data-motivo]').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
      if(!yaSel) mot.setAttribute('aria-pressed','true');
      panel.setAttribute('data-motivo', yaSel?'':k);
      var nt=panel.querySelector('.nh-nota'); if(nt) nt.hidden=yaSel;
      if(!yaSel && k==='molestia'){
        var tarjeta=mot.closest('.fb-card');
        var det=tarjeta&&tarjeta.querySelector('.fb-detalles');
        var bot=tarjeta&&tarjeta.querySelector('.fb-mas');
        if(det&&det.hidden&&bot){ det.hidden=false; bot.classList.add('abierto'); bot.setAttribute('aria-expanded','true'); }
        var mm=tarjeta&&tarjeta.querySelector('.fb-molestias');
        if(mm){ mm.scrollIntoView({block:'center'}); mm.focus(); }
      }
      marcarSucio(t.closest('.entreno-uno'));
      return;
    }
    // Ficha del 1 al 10: marca la elegida y la escribe en su campo oculto
    var esc10=t.closest('.esc');
    if(esc10){
      var grupo=esc10.parentNode, destino=esc10.getAttribute('data-esc'), v=esc10.getAttribute('data-v');
      var ya=esc10.classList.contains('sel');
      grupo.querySelectorAll('.esc').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
      if(!ya){ esc10.classList.add('sel'); esc10.setAttribute('aria-pressed','true'); }
      var campo=grupo.parentNode.querySelector('.'+destino);
      if(campo) campo.value = ya ? '' : v;
      marcarSucio(t.closest('.entreno-uno'));
      return;
    }
    var mas=t.closest('.fb-mas');
    if(mas){
      var det=mas.parentNode.querySelector('.fb-detalles');
      if(det){ det.hidden=!det.hidden; mas.classList.toggle('abierto',!det.hidden); mas.setAttribute('aria-expanded', det.hidden?'false':'true'); }
      return;
    }
    var btn=t.closest('.fb-guardar');
    if(btn) guardarFeedback(btn);
  });

  // El acordeón: 'toggle' no burbujea, por eso se escucha en fase de captura
  $('sec-entreno').addEventListener('toggle', function(ev){

  /* Al escribir: se actualiza el contador y se avisa de que falta guardar.
     Y escribir algo en una serie la da por hecha sola: quien apunta 60 kg es
     porque los ha levantado, y obligarle además a tocar el ✓ sería pedirle dos
     gestos para decir una cosa. Se puede desmarcar a mano si se equivocó. */
  $('sec-entreno').addEventListener('input', function(ev){

  // ---------- guardar sensaciones + tiempos de la sesión que se está viendo ----------
  async function guardarFeedback(btn){
    var caja=btn.closest('.entreno-uno'); if(!caja) return;
    var sid=caja.getAttribute('data-sid');
    var msg=caja.querySelector('.fb-msg'); msg.textContent='Guardando…'; msg.className='msg fb-msg';
    function val(sel){ var e=caja.querySelector(sel); return e?e.value:''; }
    var D=DESC();
    /* Lo que se apuntó de cada ejercicio.
       LA LLAVE ES EL ID DE LA FILA (migración 103), no su posición: así lo que
       marcó el atleta sigue pegado a SU ejercicio aunque el entrenador reordene
       el entrenamiento o meta otro en medio. Solo se cae a la llave de posición
       cuando la fila todavía no tiene id.

       Y SE GUARDA EL EJERCICIO ENTERO AUNQUE NO SE HAYA TOCADO NADA: si no, un
       ejercicio que no se hizo desaparecería del registro y se perdería justo
       lo que el club quiere saber, que estaba puesto y no se hizo. Marcar sí,
       borrar no. */
    var tiempos={};
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var filas=g.querySelectorAll('.serie-hueco'); if(!filas.length) return;
      var llave=g.getAttribute('data-fid')||g.getAttribute('data-key');
      if(!llave) return;
      var clave=g.getAttribute('data-medida')||'tiempo';
      var uniSel=g.parentNode.querySelector('.s-unis [aria-pressed="true"]');
      var unidad=uniSel?uniSel.getAttribute('data-uni'):(clave==='peso_reps'||clave==='peso'?'kg':null);
      var series=[], planos=[], algo=false;
      filas.forEach(function(fila){
        var hecha=serieHecha(fila);
        var s={ hecha: hecha };
        fila.querySelectorAll('.serie-in').forEach(function(inp){
          var v=inp.value.trim(); if(!v) return;
          s[inp.getAttribute('data-c')]=v;
        });
        if(clave==='distancia' && unidad) s.unidad=unidad;
        /* El texto ya montado y con su unidad pegada («60 kg × 11»): lo leen las
           pantallas que todavía no entienden `series`, y así ninguna se queda en
           blanco. Un número sin unidad no es un dato. */
        var txt='';
        if(D && D.textoSerieHecha){ try { txt=D.textoSerieHecha(s, {clave:clave})||''; } catch(e){} }
        if(!txt && s.tiempo) txt=s.tiempo;
        planos.push(hecha?txt:'');
        series.push(s);
        if(hecha || txt) algo=true;
      });
      if(!algo && !filas.length) return;
      /* «Lo cambié por…»: lo que se hizo DE VERDAD. El nombre que mandó el
         entrenador se queda en `ejercicio` —los dos hacen falta: uno para que
         él vea que puso jalón y salieron dominadas, otro para que el atleta
         encuentre sus dominadas en el historial— y esto va aparte. */
      var ejerC=g.closest('.ejer');
      var inC=ejerC?ejerC.querySelector('.cambio-in'):null;
      var cambiado=(inC && inC.value.trim())||'';
      tiempos[llave]={
        fila_id: g.getAttribute('data-fid')||null,
        ejercicio: g.getAttribute('data-eje'),
        cambiado_por: cambiado||null,
        medida: clave,
        unidad: unidad,
        series: series,
        tiempos: planos
      };
    });
    /* El motivo, si quedó algo sin hacer. Se pregunta una vez al final y es
       opcional: obligar a explicarse es la forma más rápida de que se deje de
       marcar, y entonces el historial vuelve a mentir. */
    var panel=caja.querySelector('[data-nh]');
    var motivo=(panel && !panel.hidden && panel.getAttribute('data-motivo'))||null;
    var notaNH=panel?panel.querySelector('.nh-nota'):null;
    function numOrNull(v){ v=(v||'').trim().replace(',','.'); if(!v) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
    function intOrNull(v){ if(!v) return null; var n=parseInt(v,10); return isNaN(n)?null:n; }
    var payload={
      sesion_id: sid, atleta_id: at.id,
      sensacion_general: intOrNull(val('.fb-sensacion')),
      rpe: intOrNull(val('.fb-rpe')),
      como_me_siento: val('.fb-siento').trim()||null,
      molestias: val('.fb-molestias').trim()||null,
      notas_atleta: val('.fb-notas').trim()||null,
      horas_sueno: numOrNull(val('.fb-sueno')),
      peso_kg: numOrNull(val('.fb-peso')),
      tiempos_reales: Object.keys(tiempos).length?tiempos:null,
      motivo_no_hecho: motivo,
      nota_no_hecho: (motivo && notaNH && notaNH.value.trim())||null
    };
    /* Se pide de vuelta la fila ya guardada. La base calcula sola el estado
       del día y, si esto era la corrección de un día pasado, el rastro de la
       corrección (migración 104): pedirla es una vuelta que ya se estaba
       dando y evita que la pantalla se invente esos tres campos por su
       cuenta y acabe diciendo algo distinto de lo que hay guardado. */
    var up=await sb.from('registros_sesion').upsert(payload,{onConflict:'sesion_id,atleta_id'})
             .select('id,estado,series_hechas,series_previstas,corregido_en,corregido_veces').maybeSingle();
    if(up.error){ msg.textContent='Error: '+up.error.message; msg.className='msg fb-msg error'; }
    /* `pintarSemana` además del inicio: el visto del día tiene que aparecer
       en la tira en cuanto se guarda, no en la siguiente recarga. */
    else {
      if(up.data){
        payload.id              = up.data.id;
        payload.estado          = up.data.estado;
        payload.series_hechas   = up.data.series_hechas;
        payload.series_previstas= up.data.series_previstas;
        payload.corregido_en    = up.data.corregido_en;
        payload.corregido_veces = up.data.corregido_veces;
      } else {
        /* Si por lo que sea la fila no vuelve (una respuesta recortada, una
           red rara), se cuenta aquí lo mismo que cuenta la base —las series
           con ✓— para que el historial no siga diciendo «entero» un día que
           se acaba de marcar a medias. */
        var filasT=caja.querySelectorAll('.serie-hueco'), hechasT=0;
        filasT.forEach(function(f){ if(serieHecha(f)) hechasT++; });
        payload.estado = !filasT.length ? 'completo'
                       : (hechasT===0 ? 'no_hecho' : (hechasT<filasT.length ? 'a_medias' : 'completo'));
        payload.series_hechas=hechasT; payload.series_previstas=filasT.length;
        var antes=REG[sid]||{};
        payload.id=antes.id; payload.corregido_en=antes.corregido_en; payload.corregido_veces=antes.corregido_veces;
      }
      msg.textContent='Guardado ✓ ¡gracias!'; msg.className='msg fb-msg ok';
      REG[sid]=payload; limpiarSucio(caja); pintarHoy(); pintarSemana();
      /* El punto del historial tiene que cambiar de hueco a relleno ahora, no
         en la siguiente visita: se olvida lo que había calculado. */
      if(HIST_REG) HIST_REG[sid]={ estado: payload.estado };
      HIST={};
      /* Corregido y guardado: el día se vuelve a cerrar. Si se quedara
         abierto, al volver mañana seguiría en modo escritura y no se vería
         el «corregido el 3 de agosto» que se acaba de ganar. Se deja el
         aviso a la vista un momento antes de repintar. */
      if(CORRIGIENDO[sid]){
        setTimeout(function(){
          if(!CORRIGIENDO[sid]) return;
          delete CORRIGIENDO[sid];
          if(diaSel) pintarDia(diaSel);
        }, 1200);
      }
    }
  }

  // ---------- HOY: saludo, tira de semana, sesión destacada y aviso del club ----------
  var lunesHoy=lunesDe(todayISO);
  var PAGOS=[];            // recibos del atleta (para avisar de lo vencido en «Hoy»)
  var hoyPintado=false;
  function sesSemanaHoy(){ return SEM[lunesHoy]||[]; }
  /* Un día libre se llama «Descanso», no «Entrenamiento». Se mira el papel del
     día (migración 102) y, si no está, el tipo de siempre. */
  function tituloSesion(s){ return s.titulo || ((s.papel_dia||s.tipo)==='descanso' ? 'Descanso' : 'Entrenamiento'); }

  /* ------------------------------------------------------------
     EL RESUMEN DE LA TARJETA
     Antes salía SIEMPRE el primer ejercicio del bloque principal. En un día de
     correr eso funciona: un día de 6 × 800 se llama «6 × 800» y el resto es
     calentar y soltar. En un full body de ocho ejercicios distintos, no: la
     tarjeta resumía el día entero como «3 × 10-12 rep · 2' recuperación», que
     es el primer ejercicio y nada más.

     Lo que resume de verdad no es lo mismo en cada deporte, así que ahora lo
     decide el módulo compartido: en fuerza, el volumen y qué se trabaja
     («8 ejercicios · Tren superior y core», con las etiquetas que escribió el
     entrenador); en atletismo y natación, la serie principal, como siempre.

     Y SI NO HAY UN RESUMEN HONESTO, NO SE PONE NINGUNO: un hueco no engaña a
     nadie y un resumen que miente, sí.
     ------------------------------------------------------------ */
  function resumenSesion(s){
    var D=DESC();
    if(D && D.resumenCorto){
      try { return D.resumenCorto(s, { disciplina: disciplinaDe(s), grupo: GRUPO })||''; } catch(e){}
    }
    return '';
  }

  // Abrir un día concreto en «Mi semana» (y, si se pide, ir al formulario de sensaciones)
  async function verDia(iso, foco){
    activarSeccion('entreno');
    /* Si lo que se abre es lo de hoy, el conmutador se queda en «Sesión de
       hoy»; si es otro día, en «Mi semana», que es de donde viene. */
    MODO = (iso===todayISO) ? 'hoy' : 'semana';
    pintarModo();
    if(lunesDe(iso)===lunesVis) pintarDia(iso); else await irSemana(lunesDe(iso), iso);
    if(foco){ var c=wrap.querySelector('.entreno-uno[data-sid="'+foco+'"] .fb-card'); if(c){ c.scrollIntoView({block:'center'}); return; } }
    wrap.scrollIntoView({block:'start'});
  }

  /* «La fila que manda» vive ahora en el módulo compartido, junto al resto de
     decisiones sobre cómo se resume una sesión: si estuviera aquí, cada
     pantalla acabaría teniendo su propia idea de cuál es el ejercicio
     importante del día. */
  /* Los tres datos de la tarjeta de hoy (maqueta 37b). En atletismo y natación
     son la serie, el ritmo y la RECUPERACIÓN, que es lo que de verdad define la
     sesión: 6×800 con 90" no es 6×800 con 3'. En fuerza no: ahí lo que dice de
     qué va el día es el volumen —cuántos ejercicios y cuántas series—, y el
     primer ejercicio no representa a los otros siete. */
  function cifrasSesion(s){
    var D=DESC();
    if(D && D.cifrasDe){
      try { return D.cifrasDe(s, { disciplina: disciplinaDe(s), grupo: GRUPO })||[]; } catch(e){}
    }
    return [];
  }

  // Franja ámbar de aviso: lo único que puede aparecer por encima del entreno.
  // Lleva icono, que es lo que la distingue del ámbar de marca del club.
  function franja(texto, accion, attr){
    return '<div class="franja"'+(attr||'')+'><span class="fr-ic" aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>'+
      '<span class="fr-txt">'+texto+'</span>'+
      (accion?'<span class="fr-acc">'+esc(accion)+'</span>':'')+'</div>';
  }

  /* INICIO (maqueta 37b) · pantalla de consulta, en este orden:
     1 aviso de recibo · 2 tarjeta navy del entreno de hoy · 3 fila del rango ·
     4 próxima carrera y última marca · 5 resto de la semana.
     Una sola tarjeta navy: si hubiera dos, ninguna ancla. */
  function pintarHoy(){
    var sec=$('sec-hoy'), lista=sesSemanaHoy(), html='';

    // 1 · aviso de recibo pendiente arriba (desaparece si está al día)
    var deb=PAGOS.filter(function(x){ var e=(x.estado||'').toLowerCase(); return e!=='pagado' && e!=='cobrado'; });
    if(deb.length){
      var deuda=deb.reduce(function(a,x){ return a+(parseFloat(x.importe)||0); },0);
      var uno=deb[0];
      var txt=(deb.length===1 ? esc(uno.concepto||'Recibo pendiente') : deb.length+' recibos pendientes')+
              (deuda>0 ? ' · <span style="white-space:nowrap">'+esc(eur(deuda))+'</span>' : '');
      html+=franja(txt, 'Ver', ' data-sec-ir="pagos"');
    }
    // Aviso del club: misma franja, solo cuando el club tiene algo que decir
    if(AVISO){
      var enlA=AVISO.enlace ? (/^https?:\/\//.test(AVISO.enlace) ? AVISO.enlace : '../../'+String(AVISO.enlace).replace(/^\//,'')) : '';
      html+='<div class="franja azul"'+(enlA?' data-url="'+esc(enlA)+'"':'')+'>'+
        '<span class="fr-ic" aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>'+
        '<span class="fr-txt">'+esc(AVISO.texto)+'</span>'+
        (enlA?'<span class="fr-acc">'+esc(AVISO.texto_enlace||'Ver')+'</span>':'')+'</div>';
    }

    /* 2 · el entreno de hoy: la ÚNICA tarjeta navy de la pantalla. Si hoy hay
       dos sesiones (pista y gimnasio, por ejemplo) solo la primera va en navy;
       la otra baja a una fila. Con dos bloques navy ninguno ancla nada. */
    var hoySes=lista.filter(function(s){ return s.fecha===todayISO; });
    if(hoySes.length){
      html+=hoySes.slice(0,1).map(function(s){
        var hecho=!!REG[s.id];
        var cifras=cifrasSesion(s);
        // grupo · sitio · entrenador, con el nombre propio del grupo en ámbar
        var sub=[nombreGrupoHTML((GRUPO&&GRUPO.nombre)||''), esc(lugarGrupo()), esc(ENTRENA)].filter(Boolean).join(' · ');
        var hora=horaGrupo();
        return '<div class="hoy-card">'+
          '<div class="hc-top">'+
            '<span class="hc-grupo">Entrenamiento de hoy'+(s.atletas_ids?' · solo para ti':'')+'</span>'+
            (hora?'<span class="hc-hora">'+esc(hora)+'</span>':'<span class="hc-hora">'+esc(deporteCorto(s))+'</span>')+
          '</div>'+
          '<div><h2 class="hc-tit">'+esc(tituloSesion(s))+'</h2>'+
            (sub?'<div class="hc-det">'+sub+'</div>':'')+'</div>'+
          (cifras.length?'<div class="hc-cifras">'+cifras.map(function(c){
            return '<span class="hc-cifra"><b>'+esc(c.v)+'</b><span>'+esc(c.l)+'</span></span>';
          }).join('')+'</div>':'')+
          '<button type="button" class="hc-cta" data-ir="'+todayISO+'">Empezar el entrenamiento</button>'+
          '<button type="button" class="hc-ok'+(hecho?' hecho':'')+'" data-ir="'+todayISO+'" data-fb="'+esc(s.id)+'">'+
            (hecho?'Ya has contado cómo fue':'¿Cómo fue?')+'</button>'+
          '</div>';
      }).join('');
      // Las demás sesiones de hoy, en filas: nunca una segunda tarjeta navy
      if(hoySes.length>1){
        html+='<div class="lista-caja">'+hoySes.slice(1).map(function(s){
          return '<button type="button" class="lista-fila" data-ir="'+todayISO+'">'+
            '<span class="lf-txt"><span class="lf-nom">'+esc(tituloSesion(s))+'</span>'+
            '<span class="lf-sub">también hoy · '+esc(deporteCorto(s))+'</span></span>'+
            '<span class="lf-hora">&rsaquo;</span></button>';
        }).join('')+'</div>';
      }
    } else if(SEM_FALLO[lunesHoy]){
      /* «Hoy toca descansar» cuando lo que ha fallado es la consulta es la
         mentira más cara de todo el portal: te quedas en casa. Aquí se dice
         que no lo sabemos y se ofrece volver a mirar. */
      html+=htmlError('No hemos podido cargar tus entrenamientos',
        'Puede ser tu conexión, así que no sabemos si hoy tienes entrenamiento. No te fíes de esta pantalla hasta que cargue: si te queda duda, pregunta a tu entrenador.',
        async function(){ await cargarSemana(lunesHoy); pintarHoy(); });
    } else {
      var sig=null;
      lista.forEach(function(s){ if(s.fecha>todayISO && (!sig||s.fecha<sig.fecha)) sig=s; });
      var texto = sig ? 'La próxima, el '+formatFecha(sig.fecha)+': '+tituloSesion(sig)+'.'
                      : (at.grupo_id ? 'No hay ningún entrenamiento programado para hoy.'
                                     : 'Aún no estás asignado a un grupo. En cuanto tu entrenador te asigne, verás aquí tus entrenamientos.');
      html+='<div class="hoy-vacio"><div class="luna" aria-hidden="true">'+icLuna+'</div><h2>Hoy toca descansar</h2>'+
        '<p>'+esc(texto)+'</p>'+
        '<button type="button" class="btn btn--neutro" data-ir="'+(sig?sig.fecha:todayISO)+'">Ver mi entrenamiento</button></div>';
    }

    /* 3 · el rango, como fila con la medalla en ámbar y qué falta para el
       siguiente reto. No un contador de puntos: una frase con algo que hacer.
       Solo aparece si el atleta participa en el juego de retos. */
    if(RANGO){
      var romano=['','I','II','III','IV','V','VI','VII'][RANGO.orden]||'·';
      var falta = RANGO.sigNombre
        ? 'Te faltan '+RANGO.sigFaltan+' puntos para '+RANGO.sigNombre
        : 'Has llegado al último rango del club';
      html+='<a class="rango-fila" href="../retos/">'+
        '<span class="rg-med" aria-hidden="true">'+esc(romano)+'</span>'+
        '<span class="rg-txt"><span class="rg-nom">'+esc(RANGO.nombre)+' · '+RANGO.puntos+' puntos</span>'+
        '<span class="rg-falta">'+esc(falta)+'</span></span>'+
        '<span class="rg-chev" aria-hidden="true">&rsaquo;</span></a>';
    }

    // 4 · dos tarjetas: próxima carrera y última marca
    var tj='';
    if(PROXCOMP){
      var dias=difDias(PROXCOMP.fecha_inicio, todayISO);
      tj+='<a class="mini" href="../competiciones/"><span class="mi-et">Próxima carrera</span>'+
        '<span class="mi-tit">'+esc(PROXCOMP.nombre||'')+'</span>'+
        '<span class="mi-pie pronto">'+esc(dias<=0?'Hoy':(dias===1?'Mañana':'En '+dias+' días'))+'</span></a>';
    }
    if(ULTIMA){
      var esMejor = ULTIMA.prueba && MMP[ULTIMA.prueba] && String(MMP[ULTIMA.prueba].disp)===String(ULTIMA.tiempo_display||'');
      tj+='<a class="mini" data-sec-ir="marcas"><span class="mi-et">Última marca</span>'+
        '<span class="mi-tit dato">'+esc(ULTIMA.tiempo_display||'—')+'</span>'+
        '<span class="mi-pie'+(esMejor?' bien':'')+'">'+esc((esMejor?'Mejor personal · ':'')+(ULTIMA.prueba||''))+'</span></a>';
    }
    if(tj) html+='<div class="minis">'+tj+'</div>';

    // 5 · resto de la semana: dos filas, en un solo contenedor
    var futuras=lista.filter(function(s){ return s.fecha>todayISO; }).sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
    if(futuras.length){
      var nom=['dom','lun','mar','mié','jue','vie','sáb'];
      var hora=horaGrupo();
      html+='<div class="lista-tit"><span class="et">Resto de la semana</span>'+
        '<a class="enl" href="../calendario/">Calendario</a></div>';
      html+='<div class="lista-caja">'+futuras.slice(0,2).map(function(s){
        var d=new Date(s.fecha+'T00:00:00');
        return '<button type="button" class="lista-fila" data-ir="'+s.fecha+'">'+
          '<span class="lf-dia">'+esc(nom[d.getDay()]+' '+d.getDate())+'</span>'+
          '<span class="lf-txt"><span class="lf-nom">'+esc(tituloSesion(s))+'</span></span>'+
          (hora?'<span class="lf-hora">'+esc(hora)+'</span>':'')+'</button>';
      }).join('')+'</div>';
    }

    sec.innerHTML=html;
    hoyPintado=true;
  }

  var mkEscucha=false;

  async function cargarMarcas(){
    var cont=$('marcas-cont'); cont.innerHTML=APOLANA_UI.cargando('filas',5);
    var m=await pedirMarcas();
    if(m.error){
      /* Si ha fallado, se olvida: si no, el botón de «volver a intentarlo»
         devolvería el mismo error guardado en vez de preguntar de nuevo. */
      olvidarMarcas();
      cont.innerHTML=htmlError('No hemos podido cargar tus marcas',
        'Puede ser tu conexión. Tus marcas siguen guardadas: solo hay que volver a pedirlas.', cargarMarcas);
      return;

    MARCAS=m.data||[];
    if(!mkEscucha){

      cont.addEventListener('click', function(ev){

        if(t){ mkVerTodas=!mkVerTodas; pintarMarcas(); return; }
        var b=ev.target.closest('[data-mk-f]'); if(!b) return;
        mkFiltro=b.getAttribute('data-mk-f'); mkVerTodas=false;
        try { window.localStorage.setItem('apolana.marcas.filtro', mkFiltro); } catch(e){}
        pintarMarcas();
      });

  /* La mejor marca del año. Dos marcas de pruebas distintas no se pueden
     comparar entre sí, así que «la mejor» es la más reciente de este año que
     además sea tu mejor marca de esa prueba. Si este año no has batido
     ninguna, se enseña la última que apuntaste, dicha por su nombre.
     Nada se inventa: todo sale de lo que hay apuntado. */
  function mejorDelAnio(datos){
    var anio=String(new Date().getFullYear());
    var deEsteAnio=datos.filter(function(x){ return x.fecha && String(x.fecha).slice(0,4)===anio; });
    // la mejor de cada prueba, mirando TODAS las marcas
    var topes={};
    datos.forEach(function(x){
      var y=tiempoANum(x.tiempo_display); if(y==null||!x.prueba) return;
      var mas=catMasMejor(x.prueba);
      if(topes[x.prueba]==null || (mas?y>topes[x.prueba]:y<topes[x.prueba])) topes[x.prueba]=y;
    });
    function conDelta(x){
      var y=tiempoANum(x.tiempo_display); if(y==null) return null;
      var mas=catMasMejor(x.prueba), previa=null;
      datos.forEach(function(o){
        if(o===x || o.prueba!==x.prueba || !o.fecha || !x.fecha || o.fecha>=x.fecha) return;
        var oy=tiempoANum(o.tiempo_display); if(oy==null) return;
        if(previa==null || (mas?oy>previa:oy<previa)) previa=oy;
      });
      return { x:x, y:y, mas:mas, gana: previa!=null ? (mas?y-previa:previa-y) : null };
    }
    var recordsDelAnio=deEsteAnio.filter(function(x){
      var y=tiempoANum(x.tiempo_display);
      return y!=null && topes[x.prueba]!=null && Math.abs(y-topes[x.prueba])<0.0001;
    }).sort(function(a,b){ return a.fecha<b.fecha?1:-1; });
    if(recordsDelAnio.length){
      var r=conDelta(recordsDelAnio[0]); if(r){ r.et='Tu mejor marca del año'; return r; }
    }
    var resto=(deEsteAnio.length?deEsteAnio:datos).slice().sort(function(a,b){ return (a.fecha||'')<(b.fecha||'')?1:-1; });
    for(var i=0;i<resto.length;i++){
      var c=conDelta(resto[i]);
      if(c){ c.et='Tu última marca'; return c; }
    }
    return null;
  }
  function difTexto(seg, mas){
    var s=Math.abs(seg);
    return (mas?'+':'−')+(s<60?s.toFixed(2):segATexto(s));
  }

  function pintarMarcas(){
    var cont=$('marcas-cont');
    if(!MARCAS || !MARCAS.length){
      cont.innerHTML='<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icMarcas+'</div>'+
        '<h3>Todavía no hay marcas</h3>'+
        '<p>Apunta tus tiempos y distancias y verás aquí tus récords y cómo vas mejorando.</p>'+
        '<button type="button" class="btn btn--primario" id="mk-ir">Añadir tu primera marca</button></div>';
      var irMk=$('mk-ir');
      if(irMk) irMk.addEventListener('click', function(){
        var f=$('mk-form'), b=$('mk-abrir');
        if(f){ f.hidden=false; if(b) b.setAttribute('aria-expanded','true'); }
        var s=$('mk-prueba'); s.scrollIntoView({block:'center'}); s.focus();
      });
      return;
    }
    var filtro=filtroHTML();
    var datos=marcasDe(mkFiltro);
    if(!datos.length){
      cont.innerHTML=filtro+APOLANA_UI.vacio(
        mkFiltro==='competicion' ? 'Todavía no hay marcas de competición' : 'Todavía no hay marcas de entrenamiento',
        'Tus otras marcas siguen guardadas. Cuando apuntes una y digas dónde la hiciste, aparecerá en este apartado.',
        '<button type="button" class="ap-btn" data-mk-f="todas">Ver todas mis marcas</button>');
      return;
    }

    /* 1 · LA tarjeta navy de la pantalla: la mejor marca del año, a 42 px */
    var mj=mejorDelAnio(datos), mejorHtml='';
    if(mj){
      var donde=[mj.x.sede, fechaCorta(mj.x.fecha)].filter(Boolean).join(' · ');
      mejorHtml='<div class="mejor">'+
        '<span class="mj-et">'+esc(mj.et)+'</span>'+
        '<div class="mj-cifra"><span class="mj-dato">'+esc(mj.x.tiempo_display||'')+'</span>'+
        '<span class="mj-prueba">'+esc(mj.x.prueba||'')+'</span></div>'+
        ((mj.gana!=null&&mj.gana>0)||donde ?
          '<div class="mj-pie">'+
            ((mj.gana!=null&&mj.gana>0)?'<span class="mj-mejora">'+esc(difTexto(mj.gana, mj.mas))+' sobre la anterior</span>':'')+
            '<span class="mj-donde">'+esc(donde)+'</span>'+
          '</div>' : '')+
      '</div>';
    }

    /* 2 · Por prueba: la mejor de cada una, con su diferencia. Las pruebas que
       el atleta tiene como suyas y aún no tiene marca dicen «sin marca», nunca
       un guion: un guion hace dudar de si falta el dato. */
    var porPrueba={}; datos.forEach(function(x){ var k=x.prueba||'Prueba sin nombre'; (porPrueba[k]=porPrueba[k]||[]).push(x); });
    var claves=Object.keys(porPrueba).sort();
    var filasPorPrueba=claves.map(function(k){
      var mas=catMasMejor(k), best=null, segunda=null;
      porPrueba[k].forEach(function(x){
        var y=tiempoANum(x.tiempo_display); if(y==null) return;
        if(best==null||(mas?y>best.y:y<best.y)){ segunda=best; best={y:y,disp:x.tiempo_display||'',fecha:x.fecha}; }
        else if(segunda==null||(mas?y>segunda.y:y<segunda.y)) segunda={y:y,disp:x.tiempo_display||'',fecha:x.fecha};
      });
      if(!best) return '<div class="lista-fila sin"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
        '<span class="lf-sin">sin marca</span><span class="lf-dif"></span></div>';
      var dif='<span class="lf-dif">=</span>';
      if(segunda){
        var g = mas ? best.y-segunda.y : segunda.y-best.y;
        if(g>0.001) dif='<span class="lf-dif mejora">'+esc(difTexto(g, mas))+'</span>';
      } else dif='<span class="lf-dif"></span>';
      return '<div class="lista-fila"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
        '<span class="lf-dato">'+esc(best.disp)+'</span>'+dif+'</div>';
    });
    // Las pruebas que el atleta declara como suyas y todavía no tienen marca
    (at.especialidades||[]).forEach(function(n){
      if(porPrueba[n]) return;
      filasPorPrueba.push('<div class="lista-fila sin"><span class="lf-txt"><span class="lf-nom">'+esc(n)+'</span></span>'+
        '<span class="lf-sin">sin marca</span><span class="lf-dif"></span></div>');
    });
    var porPruebaHtml = filasPorPrueba.length
      ? '<div class="lista-tit"><span class="et">Por prueba</span></div><div class="lista-caja">'+filasPorPrueba.join('')+'</div>' : '';

    /* 3 · Últimas marcas, en filas */
    var tipoLabel={mmp:'MMP',temporada:'Temporada',objetivo:'Objetivo'};
    var tope = mkVerTodas ? datos.length : Math.min(5, datos.length);
    var ultimas='<div class="lista-tit"><span class="et">Últimas marcas</span>'+
      (datos.length>5 ? '<button type="button" class="enl" id="mk-todas">'+(mkVerTodas?'Ver menos':'Las '+datos.length)+'</button>' : '')+
      '</div><div class="lista-caja">'+datos.slice(0,tope).map(function(x){
        var etq=[fechaCorta(x.fecha), x.sede,
                 x.contexto==='competicion'?'competición':(x.contexto==='entreno'?'entrenamiento':''),
                 x.tipo?(tipoLabel[x.tipo]||x.tipo):''].filter(Boolean).join(' · ');
        return '<div class="lista-fila">'+
          '<span class="lf-txt"><span class="lf-nom">'+esc(x.prueba||'Prueba sin nombre')+'</span>'+
          (etq?'<span class="lf-sub">'+esc(etq)+'</span>':'')+'</span>'+
          (x.tiempo_display ? '<span class="lf-dato">'+esc(x.tiempo_display)+'</span>'
                            : '<span class="lf-sin">sin marca</span>')+'</div>';
      }).join('')+'</div>';

    /* 4 · Progresión: las gráficas de las pruebas con dos marcas o más */
    var graficos='', gi=0;
    claves.forEach(function(k){
      var arr=porPrueba[k].map(function(x){return {fecha:x.fecha||'',y:tiempoANum(x.tiempo_display),disp:x.tiempo_display||''};}).filter(function(p){return p.y!=null&&p.fecha;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});
      if(arr.length>=2){ graficos+=graficoPrueba(k,arr,catMasMejor(k),gi++); }
    });
    var progHtml = graficos
      ? '<div class="lista-tit"><span class="et">Progresión</span></div><div class="graficos">'+graficos+'</div>'
      : '<p class="vacio" style="margin-bottom:14px;">Con dos marcas o más de una misma prueba verás aquí tu evolución.</p>';

    cont.innerHTML=filtro+mejorHtml+porPruebaHtml+ultimas+progHtml;
  }
  cargarMarcas();

  // Al elegir prueba, adaptar la etiqueta de la marca (tiempo / metros / puntos)
  $('mk-prueba').addEventListener('change', function(){ var p=catMap[this.value]; var lbl=$('mk-tiempo-lbl'), inp=$('mk-tiempo');
    if(p&&p.unidad==='distancia'){ lbl.textContent='Marca (metros)'; inp.placeholder='6.85'; }
    else if(p&&p.unidad==='puntos'){ lbl.textContent='Marca (puntos)'; inp.placeholder='5820'; }
    else { lbl.textContent='Marca (tiempo)'; inp.placeholder='7.85 · 1:02.3'; }
  });

  $('mk-guardar').addEventListener('click', async function(){
    var msg=$('mk-msg'); var prueba=$('mk-prueba').value.trim(), disp=$('mk-tiempo').value.trim();
    if(!prueba){ msg.textContent='Elige la prueba.'; msg.className='msg error'; return; }
    msg.textContent='Guardando…'; msg.className='msg';
    var payload={ atleta_id:at.id, prueba:prueba, tiempo_display:disp||null, tiempo_segundos:tiempoANum(disp), fecha:$('mk-fecha').value||null, sede:$('mk-sede').value.trim()||null, tipo:$('mk-tipo').value||null, contexto:$('mk-contexto').value||null };
    var ins=await sb.from('marcas_atleta').insert(payload);
    if(ins.error){ msg.textContent='Error: '+ins.error.message; msg.className='msg error'; return; }
    msg.textContent='Marca guardada ✓'; msg.className='msg ok';
    $('mk-prueba').value=''; $('mk-tiempo').value=''; $('mk-sede').value=''; $('mk-tipo').value=''; $('mk-contexto').value='';
    // Acaba de haber una marca nueva: aquí SÍ hay que volver a preguntar.
    olvidarMarcas();
    cargarMarcas();
  });

  /* ---------- BONO DE EL CUBO ----------
     Los usos que quedan se leen en la propia fila de «Más», sin entrar: es
     lo único que va por usos comprados y no por cuota, así que se consulta
     antes de cada sesión. Si la consulta falla no se dice «0 usos» — eso
     sería peor que no decir nada: se deja la fila sin cifra. */
  var USOS_CUBO = null;
  (async function cargarBonoCubo(){
    var r = await sb.from('cubo_bono_saldo').select('usos_disponibles,activo,caducado').eq('atleta_id', at.id);
    if (r.error || !r.data) return;
    USOS_CUBO = r.data.reduce(function(s, b){
      return s + ((b.activo && !b.caducado) ? (b.usos_disponibles || 0) : 0);
    }, 0);
    if (SEC === 'mas') pintarMas();
  })();

  // ---------- PAGOS ----------
  (async function cargarPagos(){
    var cont=$('pagos-cont');
    var p=await sb.from('pagos').select('concepto,importe,estado,fecha_vencimiento').eq('atleta_id',at.id).order('fecha_vencimiento',{ascending:false}).limit(40);
    if(p.error){
      /* «Sin recibos por ahora» con un recibo devuelto de por medio es una
         multa: aquí se dice que no se ha podido mirar, y se vuelve a mirar. */
      cont.innerHTML=htmlError('No hemos podido cargar tus recibos',
        'Puede ser tu conexión. Nada se ha cobrado ni se ha perdido: solo hay que volver a pedir la lista.', cargarPagos);
      return;
    }
    PAGOS = p.data || [];
    if(hoyPintado) pintarHoy();   // ya podemos avisar de un recibo vencido en «Hoy»

    var lista;
    if(!PAGOS.length){
      lista='<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icPagos+'</div>'+
        '<h3>Sin recibos por ahora</h3><p>Cuando el club emita un recibo a tu nombre lo verás aquí, con su estado y su fecha.</p></div>';
    } else {
      // Un recibo por fila, en un solo contenedor con separadores. El importe a
      // la derecha y en monoespaciada: son cifras que se suman con la vista.
      lista='<div class="lista-tit"><span class="et">Tus recibos</span></div>'+
        '<div class="lista-caja">'+PAGOS.map(function(x){
        var ok=(x.estado==='pagado'||x.estado==='cobrado');
        var cuando = x.fecha_vencimiento ? ((ok?'cobrado el ':'se cobra el ')+fechaCorta(x.fecha_vencimiento)) : '';
        var sub=[cuando, x.estado||''].filter(Boolean).join(' · ');
        return '<div class="lista-fila'+(ok?'':' pend')+'">'+
          '<span class="lf-txt"><span class="lf-nom">'+esc(x.concepto||'')+'</span>'+
          (sub?'<span class="lf-sub">'+esc(sub)+'</span>':'')+'</span>'+
          '<span class="lf-dato">'+(x.importe!=null?esc(eur(x.importe)):'')+'</span></div>';
      }).join('')+'</div>';
    }
    cont.innerHTML=lista;

    // --- Cómo se paga --------------------------------------------------
    // Antes aquí se veía el importe y ya está: nadie decía dónde pagarlo.
    // El bloque sale debajo de los recibos, con la cuenta que le toca a
    // esta persona (escuela o club) y a quién preguntar si algo falla.
    if(window.APOLANA_INFO_PAGOS){
      try {
        await APOLANA_INFO_PAGOS.cargar(sb);
        var pend = PAGOS.filter(function(x){ var e=(x.estado||'').toLowerCase(); return e==='pendiente'||e==='impagado'; });
        var dev  = PAGOS.filter(function(x){ var e=(x.estado||'').toLowerCase();
          return e==='impagado' || e==='devuelto' ||
                 (e==='pendiente' && x.fecha_vencimiento && x.fecha_vencimiento < isoDe(new Date())); });
        var b = APOLANA_INFO_PAGOS.bloque({
          clave: APOLANA_INFO_PAGOS.claveDe(at),
          pendientes: pend.length,
          devueltos: dev.length
        });
        if(b){ cont.insertAdjacentHTML('beforeend', b); APOLANA_INFO_PAGOS.activar(cont); }
      } catch(e){ /* si falla, la lista de recibos se queda como estaba */ }
    }
  })();

  // ---------- llegar directo a una sección ----------
  // La barra inferior del resto de pantallas del portal enlaza aquí con
  // #entreno, #marcas, #pagos o #mas: se abre esa sección al entrar.
  (function(){
    function secDelHash(){
      var h=(location.hash||'').replace(/^#/,'');
      return SECCIONES.indexOf(h)!==-1 ? h : null;
    }
    var s=secDelHash();
    if(s && s!==SEC) activarSeccion(s);
    window.addEventListener('hashchange', function(){
      var x=secDelHash(); if(x && x!==SEC) activarSeccion(x);
    });
  })();

});
</script>

</body>
