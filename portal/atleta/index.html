<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi zona · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .at-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  .at-cab { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .at-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(28px,6vw,42px); color: var(--navy); margin: 0; line-height:1; }
  .at-cab .sub { display:block; font-family: var(--fuente-mono); font-size: 12px; letter-spacing:.1em; text-transform:uppercase; color: var(--texto-tenue); margin-bottom:5px; }
  .at-cab .dia-hoy { flex:none; width:42px; height:42px; border-radius:50%; border:2px solid var(--azul); display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:17px; color: var(--azul-oscuro); }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 200px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding:8px; box-shadow: var(--sombra-suave); }
  .side nav a { cursor:pointer; font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color: var(--texto-suave); padding:10px 12px; border-radius:10px; text-decoration:none; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { background: var(--navy); color:#fff; }
  .cont { flex:1 1 auto; min-width:0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(18px,3vw,26px); box-shadow: var(--sombra-suave); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--texto-tenue); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:11px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }

  /* gráficos */
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .grafico { border:1px solid var(--linea); border-radius:14px; padding:10px 8px 4px; background: var(--crema); }
  .grafico svg { width:100%; height:auto; display:block; }
  .grafico .leyenda { font-size:11px; color: var(--texto-suave); padding:2px 4px 4px; }
  .grafico .mejora { color:#1e7a3d; font-weight:600; }
  .records { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .record { background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); color:#fff; border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; box-shadow: var(--sombra-suave); }
  .record .r-prueba { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; opacity:.85; }
  .record .r-marca { font-family: var(--fuente-titulo); font-size:26px; font-weight:700; line-height:1.1; }
  .record .r-fecha { font-size:11px; opacity:.75; }

  /* entreno */
  .entreno-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .entreno-cab h2 { margin:0; }
  .fecha-pill { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; background: var(--azul); color:#fff; padding:4px 10px; border-radius:999px; }
  .entreno-titulo { font-size:18px; font-weight:600; color: var(--navy); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-family: var(--fuente-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; background: var(--crema-media); color: var(--texto-suave); padding:3px 9px; border-radius:999px; }
  .nota { font-size:14px; color: var(--texto); background: var(--crema); border-left:3px solid var(--azul); padding:10px 12px; border-radius:8px; margin:0 0 16px; }
  .bloque { margin-bottom:14px; }
  .bloque h3 { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color: var(--azul-oscuro); margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--linea); }
  .fila { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:7px 0; }
  .fila .ej { font-size:15px; color: var(--navy); font-weight:500; }
  .fila .fparams { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { font-size:12px; color: var(--texto-suave); background: var(--crema-media); padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .fchip.mio { background: var(--azul); color:#fff; font-weight:600; }
  .serie-inputs { display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 10px; border-bottom:1px dashed var(--linea); }
  .serie-in { width:58px; text-align:center; padding:7px 4px; border:1px solid var(--linea-borde); border-radius:8px; font-size:14px; font-family: var(--fuente-mono); color: var(--navy); }
  .serie-in:focus { outline:none; border-color: var(--azul); }
  .chip.personal { background: var(--azul-suave); color: var(--azul-oscuro); font-weight:700; }

  /* semana: tira de días y navegación */
  .sem-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .sem-cab h2 { margin:0; }
  .sem-nav { display:flex; gap:6px; flex-wrap:wrap; }
  .sem-btn { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:8px 12px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); cursor:pointer; line-height:1; }
  .sem-btn:hover { border-color: var(--azul); color: var(--navy); }
  .sem-btn.ahora { border-color: var(--azul); color: var(--azul-oscuro); font-weight:700; }
  .sem-rango { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--texto-tenue); margin:10px 0 8px; }
  .dias { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .dias.cargando { opacity:.45; }
  .dia { flex:1 1 0; min-width:58px; min-height:78px; box-sizing:border-box; font:inherit; -webkit-appearance:none; appearance:none; background: var(--crema); border:1px solid var(--linea); border-radius:12px; padding:8px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .dia:hover { border-color: var(--azul); }
  .dia .d-nom { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color: var(--texto-tenue); }
  .dia .d-num { font-family: var(--fuente-titulo); font-size:19px; font-weight:700; line-height:1; color: var(--navy); }
  .dia .d-tipo { font-family: var(--fuente-mono); font-size:9px; letter-spacing:.03em; text-transform:uppercase; color: var(--azul-oscuro); white-space:nowrap; }
  .dia .d-punto { width:7px; height:7px; border-radius:50%; background: var(--azul); }
  .dia .d-punto.personal { background: var(--navy); }
  .dia.vacio { background:#fff; }
  .dia.vacio .d-num { color: var(--texto-tenue); font-weight:600; }
  .dia.vacio .d-tipo { color: var(--texto-tenue); }
  .dia.hoy { border-color: var(--azul); border-width:2px; padding:7px 3px; }
  .dia.hoy .d-nom { color: var(--azul-oscuro); font-weight:700; }
  .dia.sel { background: var(--navy); border-color: var(--navy); box-shadow: var(--sombra-suave); }
  .dia.sel .d-nom, .dia.sel .d-num, .dia.sel .d-tipo { color:#fff; }
  .dia.sel .d-punto, .dia.sel .d-punto.personal { background:#fff; }
  .dia.hoy.sel { border-color: var(--azul); }

  /* ---- HOY: tira de semana, tarjeta de la sesión, esta semana y aviso ---- */
  .hoy-tira { display:flex; gap:6px; margin:0 0 18px; }
  .hoy-tira .hd { flex:1; min-width:0; background:none; border:0; font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:9px 0; border-radius:10px; }
  .hoy-tira .hd:hover { background: var(--crema-media); }
  .hoy-tira .hd .l { font-size:11px; color: var(--texto-tenue); }
  .hoy-tira .hd .p { width:7px; height:7px; border-radius:4px; background:#DED8CB; }
  .hoy-tira .hd .p.hay { background: var(--azul); }
  .hoy-tira .hd .p.personal { background: var(--navy); }
  .hoy-tira .hd.es-hoy { background:#16202B; }
  .hoy-tira .hd.es-hoy:hover { background:#16202B; }
  .hoy-tira .hd.es-hoy .l { color:#fff; font-weight:600; }
  .hoy-tira .hd.es-hoy .p { background:#fff; }

  .hoy-card { background:#16202B; border-radius:18px; padding: clamp(18px,3vw,24px); color:#fff; display:flex; flex-direction:column; gap:16px; margin-bottom:18px; box-shadow: var(--sombra-suave); }
  .hoy-card .hc-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hoy-card .hc-grupo { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#7FB6E0; }
  .hoy-card .hc-tipo { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#A9B4C0; }
  .hoy-card .hc-tit { font-family: var(--fuente-titulo); font-weight:700; font-size: clamp(28px,5vw,38px); line-height:.98; color:#fff; margin:0; text-transform:none; }
  .hoy-card .hc-det { font-size:14px; color:#A9B4C0; margin-top:6px; }
  .hoy-card .hc-lugar { display:flex; align-items:center; gap:8px; font-size:13px; color:#A9B4C0; }
  .hoy-card .hc-lugar .pt { flex:none; width:5px; height:5px; border-radius:3px; background: var(--azul); }
  .hoy-card .hc-btns { display:flex; gap:10px; margin-top:4px; }
  .hoy-card .hc-ver { flex:1; background: var(--azul); color:#fff; border:0; border-radius:10px; padding:13px; font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .hoy-card .hc-ver:hover { background: var(--azul-oscuro); }
  .hoy-card .hc-ok { flex:none; width:52px; border:1px solid rgba(255,255,255,.22); background:transparent; color:#fff; border-radius:10px; font-size:15px; cursor:pointer; font-family:inherit; }
  .hoy-card .hc-ok:hover { border-color:#fff; }
  .hoy-card .hc-ok.hecho { background: rgba(127,191,74,.16); border-color: rgba(127,191,74,.55); color:#c3e8a0; }

  .hoy-vacio { background:#fff; border:1px solid var(--linea); border-radius:18px; padding: clamp(22px,4vw,30px) 20px; text-align:center; margin-bottom:18px; box-shadow: var(--sombra-suave); }
  .hoy-vacio .z { width:56px; height:56px; border-radius:50%; background: var(--crema-media); color: var(--azul-oscuro); font-family: var(--fuente-titulo); font-weight:700; font-size:24px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .hoy-vacio h2 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size: clamp(22px,4vw,28px); color: var(--navy); margin:0 0 8px; }
  .hoy-vacio p { color: var(--texto-suave); font-size:14px; margin:0 0 16px; }

  .hoy-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 10px; }
  .hoy-tit h2 { font-family: var(--fuente-titulo); text-transform:uppercase; letter-spacing:.02em; font-size:20px; color: var(--navy); margin:0; }
  .hoy-tit .cnt { font-family: var(--fuente-mono); font-size:11px; color: var(--texto-tenue); }
  .hoy-lista { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .hoy-item { width:100%; text-align:left; font:inherit; background:#fff; border:1px solid var(--linea); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:14px; cursor:pointer; }
  .hoy-item:hover { border-color: var(--azul); }
  .hoy-item .d { flex:none; width:36px; font-family: var(--fuente-mono); font-size:11px; text-transform:uppercase; color: var(--texto-tenue); }
  .hoy-item .t { min-width:0; display:flex; flex-direction:column; gap:2px; }
  .hoy-item .t b { font-weight:600; font-size:15px; color: var(--navy); }
  .hoy-item .t span { font-size:12px; color: var(--texto-suave); }

  .aviso-club { background:#FDF5DF; border:1px solid #EBDCAE; border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:5px; margin-bottom:18px; }
  .aviso-club .et { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#A08A3C; }
  .aviso-club p { margin:0; font-size:14px; line-height:1.45; color:#4A4335; }
  .aviso-club a { font-size:13px; font-weight:600; }

  .pendiente { background:#fff; border:1px solid var(--linea); border-radius:12px; padding:14px 16px; margin-bottom:18px; }
  .pendiente .et { display:block; font-family: var(--fuente-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#A08A3C; margin-bottom:4px; }
  .pendiente p { margin:0 0 6px; font-size:14px; color: var(--texto); }
  .enlace-accion { background:none; border:0; padding:0; font:inherit; font-weight:600; font-size:14px; color: var(--azul-oscuro); cursor:pointer; }
  .enlace-accion:hover { color: var(--azul-hover); }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; }
  .rango { display:flex; align-items:center; gap:10px; }
  .rango output { font-family: var(--fuente-mono); font-weight:700; color: var(--azul-oscuro); min-width:26px; text-align:center; }

  @media (max-width:760px){
    .layout { flex-direction:column; }
    .side { position:static; flex-basis:auto; width:100%; }
    .side nav { flex-direction:row; overflow-x:auto; }
    .side nav a { white-space:nowrap; }
    .graficos { grid-template-columns:1fr; }
    .grid2 { grid-template-columns:1fr; }
  }
</style>
</head>

<div id="portal-contenido">
  <div class="at-wrap" id="at-wrap"><p class="intro">Cargando…</p></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('at-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  // ---------- helpers ----------
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){ var p=s.split(':'); if(p.length>=3) return (parseInt(p[0],10)||0)*3600+(parseInt(p[1],10)||0)*60+(parseFloat(p[2])||0); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); } var n=parseFloat(s); return isNaN(n)?null:n; }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function fechaLarga(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], me=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }

  // ---------- fechas: semana de lunes a domingo ----------
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  function addDias(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  // Lunes de la semana de esa fecha (el domingo cuenta como final de su semana, no como principio)
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  function difDias(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }

  // ¿La prueba mide distancia (salto/lanzamiento)? Entonces MÁS es mejor.
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+me[d.getMonth()]; }
  function graficoPrueba(nombre, pts, masMejor, idx){
    var W=340,H=172,padL=14,padR=14,padT=38,padB=28;
    var ys=pts.map(function(p){return p.y;});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    var span=(max-min)||Math.max(Math.abs(max)*0.1,1); var lo=min-span*0.22, hi=max+span*0.22;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    function X(i){ return padL+(pts.length===1?plotW/2:plotW*i/(pts.length-1)); }
    function Y(v){ var t=(v-lo)/(hi-lo); return padT+plotH*(masMejor?(1-t):t); }
    var bestI=0; for(var b=1;b<pts.length;b++){ if(masMejor?pts[b].y>pts[bestI].y:pts[b].y<pts[bestI].y) bestI=b; }
    var gid='grad'+(idx||0);
    var grid=''; for(var g=0;g<=2;g++){ var gy=(padT+plotH*g/2).toFixed(1); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--linea)" stroke-width="1" stroke-dasharray="2 5"></line>'; }
    var coords=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.y).toFixed(1);});
    var area='M'+padL+','+(padT+plotH).toFixed(1)+' L'+coords.join(' L')+' L'+(W-padR)+','+(padT+plotH).toFixed(1)+' Z';
    var puntos=pts.map(function(p,i){ var x=X(i),y=Y(p.y); var best=(i===bestI&&pts.length>1);
      return (best?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="var(--azul)" opacity="0.16"></circle>':'')+
        '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(best?4.3:3)+'" fill="'+(best?'var(--azul-oscuro)':'#fff')+'" stroke="var(--azul)" stroke-width="2"></circle>'+
        '<text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(best?'var(--azul-oscuro)':'var(--navy)')+'">'+esc(p.disp)+'</text>'+
        '<text x="'+x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="8.5" fill="#9a958c">'+esc(fechaCorta(p.fecha))+'</text>';
    }).join('');
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de '+esc(nombre)+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--azul)" stop-opacity="0.28"></stop><stop offset="1" stop-color="var(--azul)" stop-opacity="0"></stop></linearGradient></defs>'+
      grid+'<path d="'+area+'" fill="url(#'+gid+')"></path>'+

  // ---- Ritmos personales: un "90%" se convierte en TU tiempo, según tu mejor marca ----
  var MMP = {};   // { 'nombre de prueba': {seg: 7.85, disp:'7.85'} }
  function segATexto(s){
    if(s==null||isNaN(s)) return '';
    if(s<60) return s.toFixed(2);                       // 7.85
    if(s<3600){                                          // 4:33.00
      var m=Math.floor(s/60), r=s-m*60;
      return m+':'+(r<10?'0':'')+r.toFixed(2);
    }
    var h=Math.floor(s/3600), mm=Math.floor((s-h*3600)/60), ss=Math.round(s-h*3600-mm*60);
    if(ss===60){ ss=0; mm++; }                           // 3:35:00 (maratón, ultras…)
    return h+':'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  }
  // Busca la mejor marca del atleta para la distancia de una fila (p. ej. "60 m" -> "60 m lisos")
  function mmpParaDistancia(dist){
    if(!dist) return null;
    var m=String(dist).match(/(\d[\d.,]*)\s*m/i); if(!m) return null;
    var metros=m[1].replace(/[.,]/g,'');
    var mejor=null;
    Object.keys(MMP).forEach(function(prueba){
      var pm=prueba.match(/(\d[\d.,]*)\s*m/i); if(!pm) return;
      if(pm[1].replace(/[.,]/g,'')===metros && (!mejor || MMP[prueba].seg<mejor.seg)) mejor=MMP[prueba];
    });
    return mejor;
  }
  // De "90%" o "90-95%" saca el tiempo objetivo. Menos % = más lento (tiempo = mmp / (%/100)).
  function ritmoPersonal(f){
    var r=f.ritmo; if(!r) return '';
    var pcts=String(r).match(/(\d{2,3})\s*%/g); if(!pcts||!pcts.length) return '';
    var base=mmpParaDistancia(f.distancia); if(!base) return '';
    var nums=pcts.map(function(p){ return parseFloat(p); }).filter(function(n){ return n>=40&&n<=110; });
    if(!nums.length) return '';
    var tiempos=nums.map(function(p){ return base.seg/(p/100); }).sort(function(a,b){ return a-b; });
    return tiempos.length>1 ? segATexto(tiempos[0])+'–'+segATexto(tiempos[tiempos.length-1]) : segATexto(tiempos[0]);
  }

  function esSerie(f){ var n=parseInt(f.series,10); return (n>0 && n<=30)?n:0; }

  // ---------- ENTRENO POR SEMANAS ----------
  var SEM={};              // { lunesISO: [sesiones de esa semana] }  (caché, una consulta por semana)

  // Trae las sesiones publicadas de la semana. Sin filtrar por grupo: el permiso del

  // Día que se muestra al abrir una semana: el preferido si tiene entreno; si no, el más cercano
  function elegirDia(lunes, pref){
    var lista=SEM[lunes]||[];
    var base=(pref && difDias(pref,lunes)>=0 && difDias(pref,lunes)<=6) ? pref : lunes;
    if(lista.some(function(s){ return s.fecha===base; })) return base;
    var mejor=null;
    lista.forEach(function(s){
      var d=Math.abs(difDias(s.fecha,base));
      if(!mejor || d<mejor.d || (d===mejor.d && s.fecha>mejor.f)) mejor={d:d,f:s.fecha};

  $('sec-entreno').addEventListener('click', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var dia=t.closest('.dia');
    if(dia){ pintarDia(dia.getAttribute('data-dia')); return; }
    var btn=t.closest('.fb-guardar');
    if(btn) guardarFeedback(btn);
  });

  // ---------- guardar sensaciones + tiempos de la sesión que se está viendo ----------
  async function guardarFeedback(btn){
    var caja=btn.closest('.entreno-uno'); if(!caja) return;
    var sid=caja.getAttribute('data-sid');
    var msg=caja.querySelector('.fb-msg'); msg.textContent='Guardando…'; msg.className='msg fb-msg';
    function val(sel){ var e=caja.querySelector(sel); return e?e.value:''; }
    // recoger tiempos por serie (solo los de esta sesión)
    var tiempos={};
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var ins=g.querySelectorAll('.serie-in'); if(!ins.length) return;
      var key=ins[0].getAttribute('data-key'); var vals=[]; var hay=false;
      ins.forEach(function(inp){ var v=inp.value.trim(); vals.push(v); if(v) hay=true; });
      if(hay) tiempos[key]={ ejercicio:g.getAttribute('data-eje'), tiempos:vals };
    });
    function numOrNull(v){ v=(v||'').trim().replace(',','.'); if(!v) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
    function intOrNull(v){ if(!v) return null; var n=parseInt(v,10); return isNaN(n)?null:n; }
    var payload={
      sesion_id: sid, atleta_id: at.id,
      sensacion_general: intOrNull(val('.fb-sensacion')),
      rpe: intOrNull(val('.fb-rpe')),
      como_me_siento: val('.fb-siento').trim()||null,
      molestias: val('.fb-molestias').trim()||null,
      notas_atleta: val('.fb-notas').trim()||null,
      horas_sueno: numOrNull(val('.fb-sueno')),
      peso_kg: numOrNull(val('.fb-peso')),
      tiempos_reales: Object.keys(tiempos).length?tiempos:null
    };
    var up=await sb.from('registros_sesion').upsert(payload,{onConflict:'sesion_id,atleta_id'});
    if(up.error){ msg.textContent='Error: '+up.error.message; msg.className='msg fb-msg error'; }
    else { msg.textContent='Guardado ✓ ¡gracias!'; msg.className='msg fb-msg ok'; REG[sid]=payload; pintarHoy(); }
  }

  // ---------- HOY: saludo, tira de semana, sesión destacada y aviso del club ----------
  var lunesHoy=lunesDe(todayISO);
  function sesSemanaHoy(){ return SEM[lunesHoy]||[]; }
  function tituloSesion(s){ return s.titulo || (s.tipo==='descanso' ? 'Descanso' : 'Entreno'); }

  // Resumen corto de la sesión, al estilo «4 × 60 m · ritmo 90-95% · rec. 4 min»
  function resumenSesion(s){
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var principal=null;
    bloques.forEach(function(b){ if(!principal && /principal/i.test(b.etiqueta||'')) principal=b; });
    var filas=[];
    (principal?[principal]:bloques).forEach(function(b){ (b.filas||[]).forEach(function(f){ filas.push(f); }); });
    var f=null;
    filas.forEach(function(x){ if(!f && (x.series||x.ritmo)) f=x; });
    if(!f) f=filas[0];
    if(!f) return '';
    var p=[];
    if(f.ejercicio) p.push(f.ejercicio);
    if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
    else if(f.series) p.push(f.series+' series');
    else if(f.distancia) p.push(f.distancia);
    if(f.ritmo) p.push('ritmo '+f.ritmo);
    if(f.descanso) p.push('rec. '+f.descanso);
    if(p.length<2 && f.detalle) p.push(f.detalle);
    return p.join(' · ');
  }

  // Abrir un día concreto en «Mi semana» (y, si se pide, ir al formulario de sensaciones)
  async function verDia(iso, foco){
    activarSeccion('entreno');
    if(lunesDe(iso)===lunesVis) pintarDia(iso); else await irSemana(lunesDe(iso), iso);
    if(foco){ var c=wrap.querySelector('.entreno-uno[data-sid="'+foco+'"] .fb-sensacion'); if(c){ c.scrollIntoView({block:'center'}); return; } }
    wrap.scrollIntoView({block:'start'});
  }

  function pintarHoy(){
    var sec=$('sec-hoy'), lista=sesSemanaHoy(), html='';

    // 1 · tira de semana (L M X J V S D) con punto en los días que tienen entreno
    var letras=['L','M','X','J','V','S','D'];
    html+='<div class="hoy-tira">';
    for(var i=0;i<7;i++){
      var iso=addDias(lunesHoy,i);
      var ses=lista.filter(function(s){ return s.fecha===iso; });
      var personal=ses.some(function(s){ return s.atletas_ids!=null; });
      var t=formatFecha(iso)+(ses.length?': '+tituloSesion(ses[0]):': sin entreno');
      html+='<button type="button" class="hd'+(iso===todayISO?' es-hoy':'')+'" data-ir="'+iso+'" title="'+esc(t)+'">'+
        '<span class="l">'+letras[i]+'</span>'+
        '<span class="p'+(ses.length?' hay':'')+(personal?' personal':'')+'"></span></button>';
    }
    html+='</div>';

    // 2 · la sesión de hoy, destacada en azul oscuro
    var hoySes=lista.filter(function(s){ return s.fecha===todayISO; });
    if(hoySes.length){
      html+=hoySes.map(function(s){
        var hecho=!!REG[s.id];
        var det=resumenSesion(s);
        var lugar=(GRUPO&&GRUPO.horario)||'';
        return '<div class="hoy-card">'+
          '<div class="hc-top">'+
            '<span class="hc-grupo">Hoy · '+esc((GRUPO&&GRUPO.nombre)||'Mi grupo')+(s.atletas_ids?' · solo para ti':'')+'</span>'+
            '<span class="hc-tipo">'+esc(tipoCorto(s.tipo))+'</span>'+
          '</div>'+
          '<div><h2 class="hc-tit">'+esc(tituloSesion(s))+'</h2>'+
            (det?'<div class="hc-det">'+esc(det)+'</div>':'')+'</div>'+
          (lugar?'<div class="hc-lugar"><span class="pt"></span>'+esc(lugar)+'</div>':'')+
          '<div class="hc-btns">'+
            '<button type="button" class="hc-ver" data-ir="'+todayISO+'">Ver entreno</button>'+
            '<button type="button" class="hc-ok'+(hecho?' hecho':'')+'" data-ir="'+todayISO+'" data-fb="'+esc(s.id)+'" '+
              'title="'+(hecho?'Ya contaste cómo fue':'Contar cómo ha ido')+'" aria-label="'+(hecho?'Ya contaste cómo fue':'Contar cómo ha ido')+'">✓</button>'+
          '</div></div>';
      }).join('');
    } else {
      // Estado vacío de la maqueta: día de descanso, con la siguiente sesión y salida
      var sig=null;
      lista.forEach(function(s){ if(s.fecha>todayISO && (!sig||s.fecha<sig.fecha)) sig=s; });
      var texto = sig ? 'No hay sesión programada. El '+formatFecha(sig.fecha)+', '+tituloSesion(sig)+'.'
                      : (at.grupo_id ? 'No hay sesión programada para hoy.'
                                     : 'Aún no estás asignado a un grupo. En cuanto tu entrenador te asigne, verás aquí tus entrenos.');
      html+='<div class="hoy-vacio"><div class="z">Z</div><h2>Hoy toca descansar</h2>'+
        '<p>'+esc(texto)+'</p>'+
        '<button type="button" class="btn btn--neutro" data-ir="'+(sig?sig.fecha:todayISO)+'">Ver mi semana</button></div>';
    }

    // 3 · pendiente: entreno de esta semana ya pasado del que no contaste nada
    var pend=null;
    lista.forEach(function(s){
      if(s.fecha<todayISO && s.tipo!=='descanso' && !REG[s.id] && (!pend||s.fecha>pend.fecha)) pend=s;
    });
    if(pend){
      var ayer=(pend.fecha===addDias(todayISO,-1));
      html+='<div class="pendiente"><span class="et">'+(ayer?'Pendiente de ayer':'Pendiente')+'</span>'+
        '<p>No registraste el feedback de '+esc(tituloSesion(pend))+' del '+esc(formatFecha(pend.fecha))+'.</p>'+
        '<button type="button" class="enlace-accion" data-ir="'+pend.fecha+'" data-fb="'+esc(pend.id)+'">Registrarlo ahora →</button></div>';
    }

    // 4 · esta semana: lo que queda por delante
    var futuras=lista.filter(function(s){ return s.fecha>todayISO; }).sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
    html+='<div class="hoy-tit"><h2>Esta semana</h2><span class="cnt">'+lista.length+' '+(lista.length===1?'sesión':'sesiones')+'</span></div>';
    if(futuras.length){
      var nom=['dom','lun','mar','mié','jue','vie','sáb'];
      html+='<div class="hoy-lista">'+futuras.map(function(s){
        var d=nom[new Date(s.fecha+'T00:00:00').getDay()];
        var det=resumenSesion(s)||tipoCorto(s.tipo);
        return '<button type="button" class="hoy-item" data-ir="'+s.fecha+'">'+
          '<span class="d">'+esc(d)+'</span>'+
          '<span class="t"><b>'+esc(tituloSesion(s))+'</b><span>'+esc(det)+'</span></span></button>';
      }).join('')+'</div>';
    } else {
      html+='<p class="vacio" style="margin:0 0 18px;">No queda ninguna sesión más esta semana.</p>';
    }

    // 5 · aviso del club
    if(AVISO){
      var enl='';
      if(AVISO.enlace){
        var href=/^https?:\/\//.test(AVISO.enlace) ? AVISO.enlace : '../../'+String(AVISO.enlace).replace(/^\//,'');
        enl='<a href="'+esc(href)+'">'+esc(AVISO.texto_enlace||'Más información')+' →</a>';
      }
      html+='<div class="aviso-club"><span class="et">Aviso del club</span><p>'+esc(AVISO.texto)+'</p>'+enl+'</div>';
    }

    sec.innerHTML=html;
  }

  // Un solo manejador para toda la sección «Hoy»
  $('sec-hoy').addEventListener('click', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var b=t.closest('[data-ir]'); if(!b) return;
    verDia(b.getAttribute('data-ir'), b.getAttribute('data-fb'));
  });

  (async function(){
    await irSemana(lunesHoy, todayISO);
    pintarHoy();
  })();

  // ---------- MARCAS: cargar/refrescar ----------
  async function cargarMarcas(){
    var cont=$('marcas-cont'); cont.innerHTML='<p class="vacio">Cargando…</p>';
    var m=await sb.from('marcas_atleta').select('prueba,tiempo_display,fecha,sede,tipo,contexto').eq('atleta_id',at.id).order('fecha',{ascending:false}).limit(80);
    if(m.error){ cont.innerHTML='<p class="vacio">Error: '+esc(m.error.message)+'</p>'; return; }
    if(!m.data.length){ cont.innerHTML='<p class="vacio">Aún no hay marcas. Añade la primera arriba.</p>'; return; }
    var porPrueba={}; m.data.forEach(function(x){ var k=x.prueba||'—'; (porPrueba[k]=porPrueba[k]||[]).push(x); });
    var graficos='', gi=0;
    Object.keys(porPrueba).forEach(function(k){
      var arr=porPrueba[k].map(function(x){return {fecha:x.fecha||'',y:tiempoANum(x.tiempo_display),disp:x.tiempo_display||''};}).filter(function(p){return p.y!=null&&p.fecha;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});
      if(arr.length>=2){ graficos+=graficoPrueba(k,arr,catMasMejor(k),gi++); }
    });
    // Mis récords: mejor marca por prueba (MMP)
    var records=Object.keys(porPrueba).map(function(k){
      var mas=catMasMejor(k), best=null;
      porPrueba[k].forEach(function(x){ var y=tiempoANum(x.tiempo_display); if(y==null) return; if(best==null||(mas?y>best.y:y<best.y)) best={prueba:k,y:y,disp:x.tiempo_display||'',fecha:x.fecha}; });
      return best;
    }).filter(Boolean).sort(function(a,b){return a.prueba<b.prueba?-1:1;});
    var recordsHtml = records.length ? '<div class="records">'+records.map(function(r){
      return '<div class="record"><span class="r-prueba">'+esc(r.prueba)+'</span><span class="r-marca">'+esc(r.disp)+'</span><span class="r-fecha">'+esc(fechaCorta(r.fecha))+'</span></div>';
    }).join('')+'</div>' : '';

    var tipoLabel={mmp:'MMP',temporada:'Temporada',objetivo:'Objetivo'};
    var tabla='<table><thead><tr><th>Prueba</th><th>Marca</th><th>Dónde se hizo</th><th>Fecha</th><th>Lugar</th></tr></thead><tbody>'+
      m.data.map(function(x){ var t=x.tipo?' <span class="pill">'+esc(tipoLabel[x.tipo]||x.tipo)+'</span>':'';
        var ctx = x.contexto==='competicion'?'<span class="pill ok">Competición</span>':(x.contexto==='entreno'?'<span class="pill">Entreno</span>':'<span class="vacio">—</span>');
        return '<tr><td>'+esc(x.prueba)+t+'</td><td>'+esc(x.tiempo_display||'')+'</td><td>'+ctx+'</td><td>'+esc(x.fecha||'')+'</td><td>'+esc(x.sede||'')+'</td></tr>'; }).join('')+'</tbody></table>';
    cont.innerHTML=recordsHtml+(graficos?'<div class="graficos">'+graficos+'</div>':'<p class="vacio" style="margin-bottom:14px;">Con 2+ marcas de una misma prueba verás aquí tu evolución.</p>')+tabla;
  }
  cargarMarcas();

  // Al elegir prueba, adaptar la etiqueta de la marca (tiempo / metros / puntos)
  $('mk-prueba').addEventListener('change', function(){ var p=catMap[this.value]; var lbl=$('mk-tiempo-lbl'), inp=$('mk-tiempo');
    if(p&&p.unidad==='distancia'){ lbl.textContent='Marca (metros)'; inp.placeholder='6.85'; }
    else if(p&&p.unidad==='puntos'){ lbl.textContent='Marca (puntos)'; inp.placeholder='5820'; }
    else { lbl.textContent='Marca (tiempo)'; inp.placeholder='7.85 · 1:02.3'; }
  });

  $('mk-guardar').addEventListener('click', async function(){
    var msg=$('mk-msg'); var prueba=$('mk-prueba').value.trim(), disp=$('mk-tiempo').value.trim();
    if(!prueba){ msg.textContent='Elige la prueba.'; msg.className='msg error'; return; }
    msg.textContent='Guardando…'; msg.className='msg';
    var payload={ atleta_id:at.id, prueba:prueba, tiempo_display:disp||null, tiempo_segundos:tiempoANum(disp), fecha:$('mk-fecha').value||null, sede:$('mk-sede').value.trim()||null, tipo:$('mk-tipo').value||null, contexto:$('mk-contexto').value||null };
    var ins=await sb.from('marcas_atleta').insert(payload);
    if(ins.error){ msg.textContent='Error: '+ins.error.message; msg.className='msg error'; return; }
    msg.textContent='Marca guardada ✓'; msg.className='msg ok';
    $('mk-prueba').value=''; $('mk-tiempo').value=''; $('mk-sede').value=''; $('mk-tipo').value=''; $('mk-contexto').value='';
    cargarMarcas();
  });

  // ---------- PAGOS ----------
  (async function cargarPagos(){
    var cont=$('pagos-cont');
    var p=await sb.from('pagos').select('concepto,importe,estado,fecha_vencimiento').eq('atleta_id',at.id).order('fecha_vencimiento',{ascending:false}).limit(40);
    if(p.error){ cont.innerHTML='<p class="vacio">Error: '+esc(p.error.message)+'</p>'; return; }
    if(!p.data.length){ cont.innerHTML='<p class="vacio">No hay pagos registrados.</p>'; return; }
    cont.innerHTML='<table><thead><tr><th>Concepto</th><th>Importe</th><th>Estado</th><th>Vence</th></tr></thead><tbody>'+
      p.data.map(function(x){ var ok=(x.estado==='pagado'||x.estado==='cobrado'); return '<tr><td>'+esc(x.concepto||'')+'</td><td>'+(x.importe!=null?esc(x.importe)+' €':'')+'</td><td><span class="pill'+(ok?' ok':'')+'">'+esc(x.estado||'')+'</span></td><td>'+esc(x.fecha_vencimiento||'')+'</td></tr>'; }).join('')+'</tbody></table>';
  })();

});
</script>
