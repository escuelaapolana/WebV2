     ------------------------------------------------------------ */
  .fb-leer .fbl-pie { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .fb-leer .fbl-corr { font-size:13px; line-height:1.4; color: var(--texto-suave); }
  .fb-corregir { min-height:44px; display:inline-flex; align-items:center; margin:-10px -8px; padding:0 8px;
    background:none; border:0; cursor:pointer; font:inherit; font-size:14px; font-weight:600;
    color: var(--azul-oscuro); -webkit-tap-highlight-color:transparent; }
  .fb-corregir:hover { color: var(--azul-hover); }
  /* Mandarlo a Strava: un botón discreto y su recado al lado. No es una
     acción principal —lo principal ya está hecho, que es apuntarlo— así
     que ni azul ni ancho. */
  .fbl-strava { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;
                padding-top:10px; border-top:1px solid var(--linea); }
  .fb-strava { min-height:44px; padding:0 14px; border:1px solid var(--linea-borde); border-radius:999px;
               background:#fff; color: var(--navy); font:inherit; font-size:14px; font-weight:600;
               cursor:pointer; display:inline-flex; align-items:center; }
  .fb-strava:hover:not(:disabled) { border-color: var(--azul-filete); color: var(--azul-oscuro); }
  .fb-strava:disabled { opacity:.55; cursor:default; }
  .fbs-msg { flex:1; min-width:140px; font-size:13px; line-height:1.45; color: var(--texto-suave); }
  .fbs-msg.ok { color:#1e7a3d; }
  .fbs-msg.fallo { color:#B96F09; }
  /* Mientras se corrige un día viejo se dice, y se dice antes de tocar
     nada: no es lo mismo apuntar hoy que reescribir lo de hace un mes. */
  .aviso-corrigiendo { margin:0 0 14px; padding:11px 14px; border-radius:12px;
    background: var(--ambar-fondo); border:1px solid var(--ambar-borde);
    font-size:14px; line-height:1.45; color:#6B4A0B; }

  /* ------------------------------------------------------------
     EL COMENTARIO DEL ENTRENADOR
     Es lo que cierra «hablar con el atleta» sin que tengan que
     coincidir en la pista, y lo que hace que un chaval vuelva. Va
     al final del detalle del entrenamiento, con el nombre de quien
     lo escribe: un comentario sin cara detrás no se lee igual.
     Colores del maquetador: fondo #EAF2F9, borde #C9DDEE.
     ------------------------------------------------------------ */
  .coment-ent { background:#EAF2F9; border:1px solid #C9DDEE; border-radius:14px;
    padding:15px 16px; margin:0 0 18px; display:flex; flex-direction:column; gap:7px; }
  .coment-ent .ce-quien { font-size:14px; font-weight:700; line-height:1.35; color: var(--navy); }
  .coment-ent .ce-txt { font-size:16px; line-height:1.55; color: var(--navy); white-space:pre-wrap; overflow-wrap:anywhere; }
  .coment-ent .ce-cuando { font-size:13px; line-height:1.4; color: var(--texto-suave); }

  /* --- Barra inferior única (maqueta 22c): Inicio · Entreno · Calendario · Marcas · Más.
         Iconos de línea de 24 px sin relleno; el activo se distingue por color y peso,
         no por una píldora de fondo. Objetivos táctiles de 48 px. --- */
  .tabbar { display:none; }
  @media (max-width:760px){
    /* En columna hay que estirar: si no, la columna se ajusta al contenido y sobresale */
    .layout { flex-direction:column; align-items:stretch; gap:0; }
    .cont { width:100%; }
    .side { display:none; }                  /* en móvil manda la barra de abajo */
    body { padding-bottom:88px; }            /* hueco para la barra fija */
    /* En modo trabajo también hay barra, así que el hueco es el mismo. */
    .graficos { grid-template-columns:1fr; }
    .grid2 { grid-template-columns:1fr; }
    /* A 375 px la tabla del ejercicio necesita todo el ancho que haya: entre
       el margen de la página, la tarjeta, el bloque y la propia tarjeta del
       ejercicio se iban 100 px en huecos, y las casillas se quedaban en 50.
       Aquí se recortan los tres de fuera; los 16 px de dentro de la tarjeta
       del ejercicio son los de la maqueta y no se tocan. */
    .at-wrap { padding-left:12px; padding-right:12px; }
    .tarjeta { padding-left:12px; padding-right:12px; }
    .bl-cuerpo { padding-left:8px; padding-right:8px; }
    .tabbar { display:flex; align-items:stretch; position:fixed; left:0; right:0; bottom:0; z-index:600;
      background:rgba(251,249,244,.96); -webkit-backdrop-filter:saturate(1.3) blur(10px); backdrop-filter:saturate(1.3) blur(10px);
      border-top:1px solid var(--linea); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); }
    .tabbar a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
      min-height:48px; text-decoration:none; color: var(--texto-suave);
      font-size:11px;  text-transform:none; -webkit-tap-highlight-color:transparent; }
    .tabbar a .ic { width:24px; height:24px; }
    /* El activo cambia de color, nunca engorda el trazo del icono: el trazo es
       siempre de 1,9 px, esté encendida la pestaña o no. */
    .tabbar a.activo { color:#2F6FA8; }
    .tabbar a.activo span { font-weight:600; }
    .tabbar a.activo .ic { stroke-width:1.9; }
  }

  /* ============================================================
     LA HOJA DE IMPRIMIR
     ------------------------------------------------------------
     En pantalla no existe: se construye al pulsar «Imprimir la semana»,
     se pega al final del documento y se borra al terminar. Aquí está
     escondida a propósito, para que ni siquiera parpadee mientras el
     navegador prepara el papel.

     En papel se invierte todo: desaparece la web —cabecera, barras,
     menús, botones— y solo queda la hoja. Nada de colores de marca,
     que en una impresora de tinta se comen un cartucho para nada y en
     una láser salen grises indistinguibles: negro sobre blanco, que es
     como se lee un informe.
     ============================================================ */
  .hoja { display:none; }
  @media print {
    /* Nada de la aplicación llega al papel. */
    body > *:not(.hoja) { display:none !important; }
    body { background:#fff; padding:0; margin:0; }
    .hoja { display:block; color:#000; font-size:10.5pt; line-height:1.4; }
    .hj-cab { display:flex; justify-content:space-between; align-items:baseline;
      border-bottom:1.5pt solid #000; padding-bottom:6pt; margin-bottom:10pt; }
    .hj-cab b { font-size:14pt; display:block; }
    .hj-cab span { font-size:9pt; }
    .hj-rango { font-size:10pt; white-space:nowrap; }
    /* Un día no se parte entre dos hojas: leer el miércoles a caballo del
       salto de página es justo lo que hace que un informe no se lea. */
    .hj-dia { break-inside:avoid; page-break-inside:avoid; margin-bottom:9pt; }
    /* Solo la primera letra en alta. Con `capitalize` salía «Lunes 3 Agosto»,
       y en español el mes va en minúscula. */
    .hj-dia > h2 { font-size:11pt; margin:0 0 4pt;
      border-bottom:0.5pt solid #999; padding-bottom:2pt; }
    .hj-dia > h2::first-letter { text-transform:uppercase; }
    .hj-dia > h2 span { font-weight:400; font-size:9.5pt; }
    .hj-dia.vacio > h2 { color:#666; border-bottom-style:dotted; }
    .hj-dia.vacio p { margin:0 0 6pt; font-size:9.5pt; color:#666; }
    .hj-ses { margin:0 0 7pt; }
    .hj-ses h3 { font-size:10.5pt; margin:0 0 3pt; }
    .hj-ses h3 span { font-weight:400; font-size:9pt; color:#444; margin-left:6pt; }
    .hj-tabla { width:100%; border-collapse:collapse; font-size:9.5pt; }
    .hj-tabla th, .hj-tabla td { text-align:left; padding:1.5pt 4pt; vertical-align:top; }
    .hj-tabla thead th { font-size:8pt; text-transform:uppercase; letter-spacing:.05em;
      border-bottom:0.5pt solid #000; }
    .hj-tabla tbody tr { border-bottom:0.25pt solid #ddd; }
    .hj-bl th { font-size:8.5pt; text-transform:uppercase; letter-spacing:.05em;
      padding-top:5pt; border-bottom:0 !important; }
    .hj-ej { width:34%; }
    .hj-plan { width:33%; color:#444; }
    /* Lo HECHO es lo que se viene a leer, así que es lo único en negrita. */
    .hj-hecho { width:33%; font-weight:700; }
    .hj-hecho i { font-weight:400; color:#999; font-style:normal; }
    .hj-extra { font-size:8pt; color:#666; }
    .hj-sensa, .hj-notas, .hj-sinreg, .hj-ent { margin:3pt 0 0; font-size:9.5pt; }
    .hj-sinreg { color:#666; }
    .hj-ent { border-left:1.5pt solid #000; padding-left:5pt; }
    .hj-pie { margin-top:10pt; padding-top:5pt; border-top:0.5pt solid #999;
      font-size:8.5pt; color:#444; }
    @page { margin:14mm 12mm; }
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="at-wrap" id="at-wrap"><div class="ap-esq" data-esq="tarjeta"></div></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('at-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) {
    /* Sin ficha no se pinta la pantalla, así que aquí no hay barra de abajo:
       la salida tiene que ir dentro del propio aviso. «Escribir al club» saca
       del portal, así que no vale como única salida. */
    wrap.innerHTML = APOLANA_UI.vacio('No encontramos tu ficha',
      'Tu cuenta está bien, pero todavía no la vemos unida a ninguna ficha del club. Escríbenos y la enlazamos en un momento.',
      APOLANA_UI.boton('Escribir al club', '../../contacto/') +
      APOLANA_UI.volver());
    return;
  }

  /* Reintentar SOLO el bloque que ha fallado. Aquí no se puede recargar la
     página: en esta pantalla se escriben los tiempos y el feedback del entreno,
     y una recarga se lo lleva por delante. */
  var REINTENTOS = {}, nRe = 0;
  function htmlError(titulo, texto, fn){
    var k = 'r' + (++nRe);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="' + k + '">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (fn) fn();
  });

  // ---------- helpers ----------
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){ var p=s.split(':'); if(p.length>=3) return (parseInt(p[0],10)||0)*3600+(parseInt(p[1],10)||0)*60+(parseFloat(p[2])||0); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); } var n=parseFloat(s); return isNaN(n)?null:n; }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function fechaLarga(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], me=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function iniciales(nom,ape){ var a=(nom||'').trim().charAt(0), b=(ape||'').trim().charAt(0); return ((a+b)||'·').toUpperCase(); }
  function eur(n){ var v=parseFloat(n); return (isNaN(v)?0:v).toFixed(2).replace('.',',')+' €'; }

  // ---------- fechas: semana de lunes a domingo ----------
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  /* El día de hoy, disponible en TODA la página. Antes se calculaba dentro
     de una función y la tira de la semana no lo veía, así que hoy nunca
     salía marcado en el calendario de arriba. */
  var HOY_ISO = isoDe(new Date());
  function addDias(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  // Lunes de la semana de esa fecha (el domingo cuenta como final de su semana, no como principio)
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  function difDias(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }

  // ¿La prueba mide distancia (salto/lanzamiento)? Entonces MÁS es mejor.
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+me[d.getMonth()]; }
  function graficoPrueba(nombre, pts, masMejor, idx){
    var W=340,H=172,padL=14,padR=14,padT=38,padB=28;
    var ys=pts.map(function(p){return p.y;});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    var span=(max-min)||Math.max(Math.abs(max)*0.1,1); var lo=min-span*0.22, hi=max+span*0.22;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    function X(i){ return padL+(pts.length===1?plotW/2:plotW*i/(pts.length-1)); }
    function Y(v){ var t=(v-lo)/(hi-lo); return padT+plotH*(masMejor?(1-t):t); }
    var bestI=0; for(var b=1;b<pts.length;b++){ if(masMejor?pts[b].y>pts[bestI].y:pts[b].y<pts[bestI].y) bestI=b; }
    var gid='grad'+(idx||0);
    var grid=''; for(var g=0;g<=2;g++){ var gy=(padT+plotH*g/2).toFixed(1); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--linea)" stroke-width="1.9" stroke-dasharray="2 5"></line>'; }
    var coords=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.y).toFixed(1);});
    var area='M'+padL+','+(padT+plotH).toFixed(1)+' L'+coords.join(' L')+' L'+(W-padR)+','+(padT+plotH).toFixed(1)+' Z';
    var puntos=pts.map(function(p,i){ var x=X(i),y=Y(p.y); var best=(i===bestI&&pts.length>1);
      return (best?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="var(--azul)" opacity="0.16"></circle>':'')+
        '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(best?4.3:3)+'" fill="'+(best?'var(--azul-oscuro)':'#fff')+'" stroke="var(--azul)" stroke-width="1.9"></circle>'+
        '<text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(best?'var(--azul-oscuro)':'var(--navy)')+'">'+esc(p.disp)+'</text>'+
        '<text x="'+x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="8.5" fill="#9a958c">'+esc(fechaCorta(p.fecha))+'</text>';
    }).join('');
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de '+esc(nombre)+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--azul)" stop-opacity="0.28"></stop><stop offset="1" stop-color="var(--azul)" stop-opacity="0"></stop></linearGradient></defs>'+
      grid+'<path d="'+area+'" fill="url(#'+gid+')"></path>'+
      '<polyline fill="none" stroke="var(--azul)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" points="'+coords.join(' ')+'"></polyline>'+puntos+
      '<text x="'+padL+'" y="19" font-size="12.5" font-weight="700" fill="var(--navy)">'+esc(nombre)+'</text>'+
      '<text x="'+(W-padR)+'" y="19" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--azul-oscuro)">MMP '+esc(pts[bestI].disp)+'</text></svg>';
    var mej = masMejor ? (pts[pts.length-1].y - pts[0].y) : (pts[0].y - pts[pts.length-1].y);
    var u = masMejor ? ' m' : '', ley='';
    if(mej>0.001) ley='<span class="mejora">▲ '+mej.toFixed(2)+u+' mejor que al empezar</span>';
    else if(mej<-0.001) ley='▼ '+Math.abs(mej).toFixed(2)+u+' respecto al inicio';
    return '<div class="grafico">'+svg+(ley?'<div class="leyenda">'+ley+'</div>':'')+'</div>';
  }

  // ---- Ritmos personales: un "90%" se convierte en TU tiempo, según tu mejor marca ----
  var MMP = {};   // { 'nombre de prueba': {seg: 7.85, disp:'7.85'} }
  function segATexto(s){
    if(s==null||isNaN(s)) return '';
    if(s<60) return s.toFixed(2);                       // 7.85
    if(s<3600){                                          // 4:33.00
      var m=Math.floor(s/60), r=s-m*60;
      return m+':'+(r<10?'0':'')+r.toFixed(2);
    }
    var h=Math.floor(s/3600), mm=Math.floor((s-h*3600)/60), ss=Math.round(s-h*3600-mm*60);
    if(ss===60){ ss=0; mm++; }                           // 3:35:00 (maratón, ultras…)
    return h+':'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  }
  // Busca la mejor marca del atleta para la distancia de una fila (p. ej. "60 m" -> "60 m lisos")
  function mmpParaDistancia(dist){
    if(!dist) return null;
    var m=String(dist).match(/(\d[\d.,]*)\s*m/i); if(!m) return null;
    var metros=m[1].replace(/[.,]/g,'');
    var mejor=null;
    Object.keys(MMP).forEach(function(prueba){
      var pm=prueba.match(/(\d[\d.,]*)\s*m/i); if(!pm) return;
      if(pm[1].replace(/[.,]/g,'')===metros && (!mejor || MMP[prueba].seg<mejor.seg)) mejor=MMP[prueba];
    });
    return mejor;
  }
  // De "90%" o "90-95%" saca el tiempo objetivo. Menos % = más lento (tiempo = mmp / (%/100)).
  function ritmoPersonal(f){
    var r=f.ritmo; if(!r) return '';
    var pcts=String(r).match(/(\d{2,3})\s*%/g); if(!pcts||!pcts.length) return '';
    var base=mmpParaDistancia(f.distancia); if(!base) return '';
    var nums=pcts.map(function(p){ return parseFloat(p); }).filter(function(n){ return n>=40&&n<=110; });
    if(!nums.length) return '';
    var tiempos=nums.map(function(p){ return base.seg/(p/100); }).sort(function(a,b){ return a-b; });
    return tiempos.length>1 ? segATexto(tiempos[0])+'–'+segATexto(tiempos[tiempos.length-1]) : segATexto(tiempos[0]);
  }
  /* Un tiempo escrito como se lee en España: coma decimal, y «s» cuando es
     de segundos sueltos («44,8 s»). Los minutos siguen como 4:33,00. */
  function tiempoBonito(seg){
    if(seg==null||isNaN(seg)) return '';
    if(seg<60) return seg.toFixed(1).replace('.',',')+' s';
    return segATexto(seg).replace('.',',');
  }
  function comaDecimal(txt){
    return /^\d+\.\d+$/.test(String(txt||'')) ? String(txt).replace('.',',') : String(txt||'');
  }
  var MESES_LARGOS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function mesLargo(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); return isNaN(d.getTime())?'':MESES_LARGOS[d.getMonth()]; }
  /* «Para ti, 85 % son 44,8 s — desde tu 38,1 de mayo».
     ------------------------------------------------------------
     El maquetador lo pidió con la marca de referencia A LA VISTA: si solo
     saliera el tiempo calculado, el número parece inventado. Devuelve null
     —y entonces no se pinta nada— cuando el atleta no tiene marca de esa
     distancia. El de pesas está justo debajo, en `porcentajeRM`. */
  function porcentajeTuyo(f){
    if(!f || !f.ritmo) return null;
    var pcts=String(f.ritmo).match(/(\d{2,3})\s*%/g); if(!pcts||!pcts.length) return null;
    var base=mmpParaDistancia(f.distancia); if(!base||!base.disp) return null;
    var nums=pcts.map(function(p){ return parseFloat(p); }).filter(function(n){ return n>=40&&n<=110; });
    if(!nums.length) return null;
    nums.sort(function(a,b){ return a-b; });
    var tiempos=nums.map(function(p){ return base.seg/(p/100); }).sort(function(a,b){ return a-b; });
    var pctTxt = nums.length>1 ? nums[0]+'–'+nums[nums.length-1]+' %' : nums[0]+' %';
    var tTxt   = tiempos.length>1 ? tiempoBonito(tiempos[0])+'–'+tiempoBonito(tiempos[tiempos.length-1]) : tiempoBonito(tiempos[0]);
    var desde  = 'desde tu '+comaDecimal(base.disp)+(mesLargo(base.fecha)?' de '+mesLargo(base.fecha):'');
    return '<p class="pct-tuyo">Para ti, '+esc(pctTxt)+' son <b>'+esc(tTxt)+'</b> — '+esc(desde)+'.</p>';
  }

  /* «Para ti, 85 % son 68 kg — desde tu RM de 80 kg de marzo».
     ------------------------------------------------------------
     ⚠️ EN PESAS SE MULTIPLICA. En pista el porcentaje es de ESFUERZO y
     se divide (al 85 % corres MÁS LENTO que tu marca); aquí es de CARGA
     y se multiplica (al 85 % levantas MENOS que tu máximo). Hacerlo al
     revés no da un error, da un número creíble: un RM de 80 kg
     dividido por 0,85 son 94 kg, que es un peso de gimnasio
     perfectamente normal, y alguien se pondría un 118 % de su máximo
     creyendo que hace una serie suave. La cuenta vive en el módulo
     compartido (`pesoDesdeRM`) con el mismo aviso escrito al lado.

     Y LA REFERENCIA SIEMPRE A LA VISTA, como en pista: sin el «desde
     tu RM de 80 kg de marzo» el número parece inventado, y además nadie
     se daría cuenta de que su RM es de hace ocho meses.

     Si el atleta no tiene RM de ese ejercicio, devuelve null y no se
     pinta nada. Nunca un peso estimado. */
  function porcentajeRM(f){
    var D=DESC(); if(!D || !D.pctsRMdeFila) return null;
    var pcts=null;
    try { pcts=D.pctsRMdeFila(f); } catch(e){ return null; }
    if(!pcts || !pcts.length) return null;
    var mio=(RM||{})[claveEjercicio(f&&(f.ejercicio||f.nombre)||'')];
    if(!mio || !(mio.kg>0)) return null;
    var kgTxt='', pctTxt='';
    try { kgTxt=D.textoPesosRM(mio.kg, pcts); pctTxt=D.textoPctRM(pcts); } catch(e){ return null; }
    if(!kgTxt) return null;
    var desde='desde tu RM de '+comaDecimal(String(mio.kg))+' kg'+(mesLargo(mio.fecha)?' de '+mesLargo(mio.fecha):'');
    return '<p class="pct-tuyo">Para ti, '+esc(pctTxt)+' son <b>'+esc(kgTxt)+'</b> — '+esc(desde)+'.</p>';
  }

  function esSerie(f){ var n=parseInt(f.series,10); return (n>0 && n<=30)?n:0; }
  // Para meter texto dentro de un atributo: esc() no toca las comillas y un nombre
  // como 3x300 "al 90%" rompería el data-eje que usa el guardado.
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
  /* Módulo compartido de descansos: es quien escribe «rec 2' trote», «salida 1'00"»
     o «desc. 2'» según la disciplina, para que las cinco pantallas digan lo mismo.
     Si por lo que sea no ha cargado, se sigue pintando con lo de siempre. */
  function DESC(){ return window.APOLANA_DESCANSOS || null; }
  function disciplinaDe(s){
    var D=DESC(); if(!D) return null;
    try { return D.disciplinaDe(s, GRUPO); } catch(e){ return null; }
  }
  /* Las piezas de una fila: serie, ritmo y recuperación. La recuperación no es
     un adorno, define la sesión: 6×800 con 90" no tiene nada que ver con 6×800
     con 3'. Si un bloque no lleva descanso, la pieza no se pinta (nunca un «—»). */
  function piezasFila(f, dis){
    var D=DESC();
    if(D && dis){ try { return D.partesFila(f, dis)||[]; } catch(e){} }
    var p=[];
    if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
    else if(f.series) p.push(f.series+' series'); else if(f.distancia) p.push(String(f.distancia));
    if(f.ritmo) p.push('ritmo '+f.ritmo);
    if(f.descanso) p.push('rec. '+f.descanso);
    return p;
  }
  /* Aquí vivía `chipNatacion`, que pintaba «salida 1'00"» en su propio chip de
     color. Se ha ido con los chips: en la tarjeta de la maqueta el plan es una
     línea de texto, no una hilera de etiquetas. La diferencia entre «salida
     cada X» y «descanso de X» —que en natación son cosas distintas y se
     confunden— no se pierde: las PALABRAS las sigue poniendo el módulo
     compartido dentro del plan; lo único que se ha ido es el color. */
  /* `leer` = día ya pasado y con lo suyo apuntado: entonces los tiempos se
     enseñan como lista, no como huecos para escribir. `hechos` son los que
     guardó ese día. */
  /* ------------------------------------------------------------
     QUÉ SE APUNTA EN CADA EJERCICIO
     La pantalla pedía «apuntar el tiempo» en TODOS los ejercicios,
     y en una sentadilla nadie apunta un tiempo: apunta los kilos y
     las repeticiones. El módulo compartido decide qué se pide, a
     partir del deporte del entrenamiento y de lo que el entrenador
     escribió en la fila. Si el módulo no ha cargado, se cae a lo de
     siempre (un tiempo), que es como estaba.
     ------------------------------------------------------------ */
  var MEDIDA_TIEMPO={ clave:'tiempo', campos:[{k:'tiempo', unidad:null, decimal:true}], unidades:null };
  function medidaDe(f, s){
    var D=DESC(); if(!D || !D.medidaDeFila) return MEDIDA_TIEMPO;
    try { return D.medidaDeFila(f, { deporte: (s&&s.deporte)||'' }) || MEDIDA_TIEMPO; }
    catch(e){ return MEDIDA_TIEMPO; }
  }
  /* La unidad elegida para un ejercicio de distancia. Se recuerda por grupo:
     quien pone series todo el rato no debería tocar el conmutador nunca.
     Metros por defecto, que es lo mayoritario en pista. */
  function claveUnidad(){ return 'apolana.entreno.unidad.'+(at&&at.grupo_id||'sin-grupo'); }
  function unidadRecordada(){
    try { var v=window.localStorage.getItem(claveUnidad()); if(v==='km'||v==='m') return v; } catch(e){}
    return 'm';
  }
  function recordarUnidad(u){
    if(u!=='m' && u!=='km') return;
    try { window.localStorage.setItem(claveUnidad(), u); } catch(e){}
  }
  var VISTO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.2 5.2L20 7"/></svg>';

  /* «La última vez: 60 kg × 11», la propuesta de lo que hiciste el otro día en
     ESTE mismo ejercicio. Se guarda por nombre de ejercicio, normalizado. */
  var ULTIMA_EJ={};
  /* El histórico de kilos por ejercicio, para la gráfica del gimnasio. Se
     llena en la misma pasada que «la última vez», así que no cuesta ninguna
     consulta aparte: son los mismos registros. */
  var HIST_FUERZA={};
  function claveEjercicio(nom){
    var t=String(nom||'').toLowerCase();
    if(t.normalize) t=t.normalize('NFD').replace(/[̀-ͯ]/g,'');
    return t.replace(/\s+/g,' ').trim();
  }

  /* El nombre largo del campo, para quien navega con lector de pantalla: ahí la
     unidad tiene que ir dicha, porque el rótulo «Kg» de la cabecera de la
     columna no se lee junto al número. */
  function etiquetaCampo(k, uni, i, n, nom){
    var que = k==='peso' ? 'Peso en kilos' : k==='reps' ? 'Repeticiones'
            /* Dicho entero: «RIR» a secas no lo entiende un lector de
               pantalla, y tampoco un atleta que empieza. */
            : k==='rir' ? 'Repeticiones que te quedaban (RIR)'
            : k==='descanso' ? 'Descanso'
            : k==='distancia' ? ('Distancia en '+(uni==='km'?'kilómetros':'metros')) : 'Tiempo';
    return que+' de la serie '+(i+1)+' de '+n+' de '+nom;
  }

  /* ------------------------------------------------------------
     LO QUE PONÍA EL PLAN, PARA PONERLO EN GRIS EN SU CASILLA
     ------------------------------------------------------------
     ⚠️ UN RANGO NO SE METE NUNCA EN UNA CASILLA. «35-45 min» y
     «45-60 s» son el plan y se enseñan tal cual, en gris, ENCIMA de
     la tabla. Si se rellenara la casilla con la media del rango,
     después nadie sabría si el 40 lo puso el atleta o lo puso la
     app — y ese error ya se cometió una vez.
     ------------------------------------------------------------ */
  function sinRango(txt){
    var t=String(txt||'').trim();
    if(!t) return '';
    return /\d\s*[-–—]\s*\d|\ba\b\s*\d/.test(t) ? '' : t;
  }
  // «300 m» → «300». Los metros del plan, para no teclear cuatro veces lo mismo.
  function distanciaPlan(f){
    var D=DESC(); if(!D||!D.medidaDeDistancia) return '';
    if(!sinRango(f&&f.distancia)) return '';
    var m=null; try { m=D.medidaDeDistancia(f.distancia); } catch(e){ return ''; }
    if(!m || !(m.metros>0)) return '';
    return unidadRecordada()==='km' ? String(+(m.metros/1000).toFixed(2)).replace('.',',') : String(m.metros);
  }
  // El descanso que puso el entrenador, escrito como lo escribe él: «3'», «25"».
  function descansoPlan(f, dis){
    var D=DESC(); if(!D) return '';
    var t=''; try { t=D.textoRecPlano(D.recDeFila(f, dis), dis)||''; } catch(e){ return ''; }
    return sinRango(t);
  }
  /* Los kilos del plan, SOLO si el entrenador escribió unos kilos. De un
     «80 % RM» no sale nada: un peso calculado metido en la casilla parece
     un peso apuntado, y en una barra eso es una lesión esperando a pasar. */
  function pesoPlan(f){
    var m=String((f&&f.carga)||'').match(/(\d+(?:[.,]\d+)?)\s*kg/i);
    return m ? sinRango(f.carga) ? m[1].replace('.',',') : '' : '';
  }

  /* ------------------------------------------------------------
     LAS COLUMNAS LAS DECIDE EL BLOQUE, NO UN SELECTOR
     Fuerza: Reps · Kg · RIR. Pista: Dist · Tiempo · Desc, sin RIR,
     que ahí no significa nada. Natación: Metros · Tiempo · Desc, y
     el material en chips arriba (ver `materialHTML`).

     `cuenta` marca las columnas que dicen si la serie se hizo. El
     descanso y la distancia que ya venía en el plan NO cuentan: son
     el eco de lo que estaba puesto, no algo que haya hecho nadie.
     ------------------------------------------------------------ */
  function columnasDe(med, dis, f, s){
    var esNat = (dis==='natacion') || ((s&&s.deporte)==='natacion');
    var rec = descansoPlan(f, dis);
    if(med.clave==='peso_reps') return [
      { k:'reps', et:'Reps', cuenta:true },
      { k:'peso', et:'Kg',   cuenta:true, plan:pesoPlan(f) },
      { k:'rir',  et:'RIR',  rir:true } ];
    if(med.clave==='peso') return [
      { k:'peso', et:'Kg', cuenta:true, plan:pesoPlan(f) },
      { k:'rir',  et:'RIR', rir:true } ];
    if(med.clave==='reps') return [
      { k:'reps', et:'Reps', cuenta:true },
      { k:'rir',  et:'RIR', rir:true } ];
    /* Cuando hay que elegir entre metros y kilómetros, el rótulo de la columna
       ES la unidad: así el número de abajo nunca se queda sin ella. */
    if(med.clave==='distancia') return [
      { k:'distancia', et: unidadRecordada(), cuenta:true, uni:true },
      { k:'tiempo',    et:'Tiempo', cuenta:true },
      { k:'descanso',  et:'Desc', plan:rec } ];
    if(med.clave==='tiempo') return [
      { k:'distancia', et: esNat?'Metros':'Dist', plan:distanciaPlan(f) },
      { k:'tiempo',    et:'Tiempo', cuenta:true },
      { k:'descanso',  et:'Desc', plan:rec } ];
    return [];
  }

  /* ------------------------------------------------------------
     ENCONTRAR LO QUE EL ATLETA APUNTÓ DE UNA FILA
     Primero por el id de la fila (migración 103), que no se mueve aunque el
     entrenador meta un ejercicio en medio. Si no está, por la llave de posición
     de siempre, que es como quedaron guardados los registros de antes.

     Y una comprobación más: si el nombre del ejercicio guardado no coincide con
     el de la fila, es que el entrenador cambió el ejercicio de sitio en esa
     misma fila. Entonces no se cuelga lo apuntado del ejercicio nuevo, porque
     sería atribuirle unos kilos que no son suyos.
     ------------------------------------------------------------ */
  function registroDeFila(hechos, f, key){
    if(!hechos) return null;
    var r = (f && f.id && hechos[f.id]) || hechos[key] || null;
    if(!r) return null;
    var guardadoNom=claveEjercicio(r.ejercicio||'');
    var filaNom=claveEjercicio(f&&(f.ejercicio||f.nombre)||'');
    /* Los registros viejos guardaban en `ejercicio` la serie («6 × 400»), no el
       nombre, así que un desacuerdo solo descarta cuando los dos son nombres
       de verdad y además la llave era la de posición. */
    if(!(f&&f.id&&hechos[f.id]) && guardadoNom && filaNom && guardadoNom!==filaNom
       && !/[×x]\s*\d/.test(r.ejercicio||'')) return null;
    return r;
  }

  /* Las series de un registro, normalizadas: la forma nueva (con su ✓ y sus
     campos) y la vieja (una lista de tiempos, donde un tiempo escrito quiere
     decir que esa serie se hizo). */
  function seriesDe(reg, n){
    var out=[];
    var D=DESC();
    var med = reg && reg.medida ? { clave: reg.medida } : null;
    for(var i=0;i<n;i++){
      var s=(reg && Array.isArray(reg.series) && reg.series[i]) || null;
      if(s){
        var txt='';
        if(D && D.textoSerieHecha && med){ try { txt=D.textoSerieHecha(s, med)||''; } catch(e){} }
        if(!txt && s.tiempo!=null) txt=String(s.tiempo);
        out.push({ hecha: !!s.hecha, txt: txt, val: s });
      } else {
        var v=(reg && Array.isArray(reg.tiempos) && reg.tiempos[i]!=null) ? String(reg.tiempos[i]).trim() : '';
        out.push({ hecha: !!v, txt: v, val: null });
      }
    }
    return out;
  }

  /* El plan, escrito como lo escribe el club: «3×8×60 kg (RIR 2)» en fuerza,
     «4×300 al 85 % · desc. 3 min» en pista, «8×50 m · desc. 20-30 s» en
     natación. Va en gris bajo el nombre, y AQUÍ es donde los rangos se leen
     tal cual: «35-45 min» se queda «35-45 min». */
  function planHTML(f, dis, med, rirTxt){
    var partes;
    if(med && (med.clave==='peso_reps'||med.clave==='peso'||med.clave==='reps')){
      var n=parseInt(f.series,10)||0;
      var m=String(f.distancia||'').trim().match(/(\d+(?:\s*[-–]\s*\d+)?)\s*rep/i);
      var reps=m ? m[1].replace(/\s+/g,'') : String(f.distancia||'').trim();
      var uno=[];
      if(n>0 && reps) uno.push(n+'×'+reps); else if(n>0) uno.push(n+' series'); else if(reps) uno.push(reps);
      if(f.carga) uno.push(String(f.carga).trim());
      partes=[uno.join('×')+(rirTxt?' ('+rirTxt+')':'')];
      var D1=DESC();
      if(D1){ try { var rc=D1.textoRec(D1.recDeFila(f, dis), dis); if(rc) partes.push(rc); } catch(e){} }
    } else {
      partes=piezasFila(f, dis).slice();
    }
    if(f.tiempo) partes.push(String(f.tiempo));
    if(f.detalle) partes.push(String(f.detalle));
    if(f.nota) partes.push(String(f.nota));
    partes=partes.filter(function(p){ return String(p||'').trim(); });
    if(!partes.length) return '';
    return '<span class="ej-plan">Plan: <b>'+esc(partes[0])+'</b>'+
      (partes.length>1 ? ' · '+esc(partes.slice(1).join(' · ')) : '')+'</span>';
  }

  /* ------------------------------------------------------------
     TU TOPE · pieza 6 de la maqueta
     Un chip verde a la derecha del nombre, no un bloque: se mira de
     reojo al empezar la serie y no debe robar sitio.
     Sale SIEMPRE de un dato que existe —la repetición máxima que te
     tomaron en un test, las repeticiones que más has hecho en ese
     ejercicio, tu mejor marca de esa distancia— y nunca de una
     estimación. Si no hay dato, no hay chip.
     ------------------------------------------------------------ */
  var TOPE_REPS={};       // { 'dominadas': 11 }, de lo que ya has apuntado
  function topeDe(nom, med, f){
    var k=claveEjercicio(nom), cl=(med&&med.clave)||'';
    if(cl==='peso_reps'||cl==='peso'){
      var rm=RM[k];
      if(rm && rm.kg>0) return 'Tu tope '+comaDecimal(String(rm.kg));
    }
    if(cl==='reps'||cl==='peso_reps'){
      if(TOPE_REPS[k]>0) return 'Tu tope '+TOPE_REPS[k];
    }
    if(cl==='tiempo'){
      var mm=mmpParaDistancia(f&&f.distancia);
      if(mm && mm.disp) return 'Tu mejor '+comaDecimal(mm.disp);
    }
    return '';
  }

  /* ------------------------------------------------------------
     EL MATERIAL DE NATACIÓN, EN CHIPS Y NO EN UNA COLUMNA
     Las palas y el pull buoy se ponen una vez para las ocho series.
     La lista es la misma que usa el entrenador al planificar, para
     que «Pull-buoy» y «pull buoy» no acaben siendo dos cosas.
     ------------------------------------------------------------ */
  var MATERIAL=['Tabla','Pull-buoy','Palas','Aletas','Manoplas','Snorkel frontal','Goma elástica'];
  function materialHTML(f, dis, s, puestos, leer){
    var esNat=(dis==='natacion')||((s&&s.deporte)==='natacion')||((s&&s.deporte_2)==='natacion');
    if(!esNat) return '';
    var lista=puestos && puestos.length ? puestos
            : (Array.isArray(f.material) ? f.material : (f.material?[f.material]:[]));
    lista=lista.filter(function(x){ return String(x||'').trim(); });
    /* En un día ya cerrado se lee lo que se usó y no se ofrece añadir nada */
    if(leer && !lista.length) return '';
    return '<span class="ej-mat">'+
      lista.map(function(m){ return '<span class="mat">'+esc(m)+'</span>'; }).join('')+
      (leer?'':'<button type="button" class="mat-mas">+ material</button>')+'</span>';
  }

  /* `medHint` fuerza la medida: lo usan los ejercicios que añade el atleta, que
     no tienen fila del entrenador de la que deducirla. `abrir` deja el campo del
     nombre abierto, que es lo primero que hay que escribir en uno nuevo. */
  function filaHTML(f, key, dis, leer, hechos, s, medHint, abrir){
    var esExtra = String(key||'').indexOf('extra:')===0;
    var nomMandado=f.ejercicio||f.nombre||'';
    /* El RIR objetivo no es un parámetro más como la distancia: es la
       instrucción que le dice al atleta si la serie va bien o se está
       pasando. Va entre paréntesis dentro del plan, como lo escribe el club. */
    var rirTxt='';
    try { var D0=DESC(); if(D0 && D0.rirDeFila) rirTxt=D0.textoRir(D0.rirDeFila(f))||''; } catch(e){}
    var tuyo=ritmoPersonal(f);
    var n=esSerie(f);
    /* «Solo marcar»: un único ✓ para decir que se hizo, aunque el entrenador no
       haya puesto número de series. La medida ya viene como «hecho» (sin
       casillas), así que se pinta el ✓ y nada más. */
    if(f && f.solo_marcar && n<1) n=1;
    var med=medHint||medidaDe(f, s);
    /* Lo que el atleta apuntó de ESTA fila. Se busca por el id de la fila, que
       no cambia aunque el entrenador reordene el entrenamiento (migración 103);
       si no aparece, se cae a la llave de posición de siempre, que es como
       están guardados los registros de antes. */
    var guardado=registroDeFila(hechos, f, key);
    var cambio=(guardado && guardado.cambiado_por) ? String(guardado.cambiado_por).trim() : '';
    /* MANDA LO QUE HIZO, no lo que estaba puesto. Si el entrenamiento decía
       «jalón al pecho» y él hizo dominadas, el título de la tarjeta es
       DOMINADAS: si no, dentro de seis meses el historial dice que hace
       jalones que no ha hecho en su vida. Lo que tocaba no se pierde: se
       queda tachado en la banda de arriba, porque también es un dato — dice
       que en esa sala no había polea. */
    var hecho=cambio ? primeraParte(cambio) : '';
    var motivo=cambio ? segundaParte(cambio) : '';
    var titulo=hecho||nomMandado;
    /* En un ejercicio añadido no hay nada que estuviera puesto, así que no hay
       banda de «lo cambié»: lo que se dice, y en su sitio, es que lo añadió él. */
    var banda = (cambio && !esExtra)
      ? '<div class="ej-band"><span class="eb-et">Lo cambié</span>'+
        '<span class="eb-txt">tocaba <s>'+esc(nomMandado)+'</s></span></div>' : '';
    var tope=topeDe(titulo, med, f);
    var linea = esExtra
      ? '<span class="ej-plan ej-anadido">Lo añadiste tú · no estaba en el entrenamiento</span>'
      : planHTML(f, dis, med, rirTxt);
    /* En uno añadido, el motivo lo guarda su propia nota */
    if(esExtra) motivo=(guardado && guardado.nota) ? String(guardado.nota) : '';
    var nomExtra = esExtra ? (titulo+(motivo?' — '+motivo:'')) : '';
    var cab='<div class="ej-cab"><span class="ej-txt">'+
      '<span class="ej-nom">'+esc(titulo)+'</span>'+
      linea+
      ultimaVezHTML(titulo, med)+
      (motivo?'<span class="ej-plan ej-motivo">'+esc(motivo)+'</span>':'')+
      materialHTML(f, dis, s, guardado&&guardado.material, leer)+
      '</span>'+(tope?'<span class="ej-tope">'+esc(tope)+'</span>':'')+'</div>';
    /* «Para ti, 85 % son 44,8 s — desde tu 38,1 de mayo»: la marca que lo
       calcula, a la vista. Sin ella el número parece inventado. */
    var pcts='<div class="ej-pct">'+(porcentajeTuyo(f)||'')+(porcentajeRM(f)||'')+'</div>';
    if(!(porcentajeTuyo(f)||porcentajeRM(f))) pcts='';
    var html=banda+cab+pcts;

    if(n>0 && leer){
      /* Un día cerrado: lo que hizo, en columna y sin casillas. Si de ese
         ejercicio no apuntó nada no se pinta una lista de guiones: una columna
         de «—» no es un dato, es ruido. */
      var series=seriesDe(guardado, n);
      var hayAlguno=series.some(function(x){ return x && (x.hecha || x.txt); });
      if(!hayAlguno) return '<div class="ejer">'+html+'</div>';
      var filasL='', sinHacer=0;
      for(var j=0;j<n;j++){
        var sr=series[j]||{};
        if(!sr.hecha) sinHacer++;
        /* Lo que no se hizo se dice con palabras, no con un guion: un guion
           hace dudar de si falta el dato o de si de verdad no se hizo. */
        filasL+='<div class="sl-fila"><span class="sl-n">Serie '+(j+1)+'</span>'+
                '<span class="sl-t">'+esc(sr.hecha ? (sr.txt?comaDecimal(sr.txt):'hecha') : 'no la hice')+'</span></div>';
      }
      html+='<div class="serie-leer">'+filasL+'</div>';
      /* El RIR de aquel día, contado y no rellenado, con el objetivo al lado
         para que se lea si se pasó o le sobró sin tener que recordarlo. */
      if(rirTxt){
        var rirHecho=(guardado && guardado.rir!=null && guardado.rir!=='') ? String(guardado.rir) : '';
        html+='<div class="rir-leido">'+(rirHecho
          ? 'Te sobraron '+esc(rirHecho)+' <span>· te pedían '+esc(rirTxt)+'</span>'
          : '<span>No apuntaste el RIR · te pedían '+esc(rirTxt)+'</span>')+'</div>';
      }
      return '<div class="ejer'+(sinHacer?' medias':'')+'">'+html+'</div>';
    }

    if(n>0){
      var cols=columnasDe(med, dis, f, s);
      var uni=unidadRecordada();
      var ins='';
      if(!cols.length){
        /* Movilidad, estiramientos, respiración: no hay ningún número que
           apuntar y el dato ES el ✓. Es el único sitio donde el ✓ sigue
           existiendo; donde hay casillas, lo que dice que una serie se hizo
           es que tenga algo escrito. */
        for(var i0=0;i0<n;i0++){
          ins+='<div class="ej-fila" data-i="'+i0+'">'+
               '<button type="button" class="s-ok" aria-pressed="false" '+
               'aria-label="Marcar la serie '+(i0+1)+' de '+n+' de '+escA(titulo)+' como hecha">'+VISTO+'</button>'+
               '<span class="s-solo">'+esc(med.referencia||'Hecho')+'</span></div>';
        }
      } else {
        for(var i=0;i<n;i++){
          var celdas=cols.map(function(c){
            var cls='c-'+(c.rir?'rir':'flex');
            if(c.rir){
              /* El RIR no se teclea: se toca y sale su propio teclado. Vacío
                 se muestra «—» y nunca un cero, que significa «al fallo» y es
                 un dato distinto de no haberlo puesto. */
              return '<button type="button" class="s-cel rir-cel vacia '+cls+'" data-c="rir" data-v="" '+
                'aria-expanded="false" aria-label="'+escA(etiquetaCampo('rir', uni, i, n, titulo))+'">—</button>';
            }
            return '<input class="s-cel '+cls+'" data-c="'+c.k+'"'+
              (c.cuenta?' data-cuenta="1"':'')+
              (c.plan?' data-plan="'+escA(c.plan)+'"':'')+
              ' inputmode="'+(c.k==='reps'?'numeric':'decimal')+'" placeholder="—" '+
              'aria-label="'+escA(etiquetaCampo(c.k, uni, i, n, titulo))+'">';
          }).join('');
          ins+='<div class="ej-fila" data-i="'+i+'">'+
               '<span class="s-n c-n" aria-hidden="true">'+(i+1)+'</span>'+celdas+'</div>';
        }
      }
      var obj=(med.clave==='tiempo' && tuyo && tuyo.indexOf('–')===-1) ? tuyo : '';
      var cabCols = cols.length
        ? '<div class="ej-cols" aria-hidden="true"><span class="c-n">Ser</span>'+
          cols.map(function(c){ return '<span class="c-'+(c.rir?'rir':'flex')+'">'+esc(c.et)+'</span>'; }).join('')+
          '</div>' : '';
      html+=cabCols+
            /* La llave de posición va en el grupo y no solo en las casillas:
               hay ejercicios que no tienen ninguna (los que solo se marcan) y
               sin esto se quedarían sin guardar. */
            '<div class="serie-inputs" data-eje="'+escA(nomMandado)+'" data-medida="'+escA(med.clave)+'" data-key="'+key+'"'+
            /* Cuántas series mandó el entrenador. Se guarda para saber cuáles
               ha añadido el atleta con «+ Serie», que son las únicas que puede
               quitar: lo que mandó el entrenador no se toca, igual que no se
               puede borrar un ejercicio suyo. */
            ' data-mandadas="'+n+'"'+
            (f.id?' data-fid="'+escA(f.id)+'"':'')+
            /* El RIR que se pidió viaja con lo apuntado: así el entrenador lo
               compara sin otra consulta, y sobre todo queda la FOTO de lo que
               se le pidió aquel día. Si mañana cambia el objetivo de esa fila,
               lo que el atleta leyó el martes no se reescribe (migración 099). */
            (rirTxt?' data-rir="'+escA(rirTxt)+'"':'')+
            (obj?' data-obj="'+escA(obj)+'"':'')+
            (esExtra?' data-extra="1"':'')+'>'+ins+'</div>'+
            '<div class="s-dif" aria-live="polite"></div>'+
            totalHTML(n, f, med)+
            pieHTML(med, cols, esExtra)+
            /* En uno añadido, el campo viene con su propio nombre dentro: al
               abrirlo se corrige, no se empieza de cero, y darle a «Listo» sin
               tocar nada no lo borra. */
            cambioCajaHTML(nomMandado, esExtra?nomExtra:cambio, esExtra, abrir)+
            '<div class="ej-banco" hidden></div>';
    }
    return '<div class="ejer'+(esExtra?' extra" data-extra="1':'')+'">'+html+'</div>';
  }

  /* «dominadas — no había máquina» se guarda en un solo campo, pero se lee en
     dos sitios: el nombre manda en el título y el motivo baja a la línea de
     contexto. Un solo campo porque pedir dos cosas donde cabe una es la forma
     más rápida de que no se rellene ninguna. */
  function primeraParte(t){ return String(t||'').split(/\s+[—–-]\s+/)[0].trim(); }
  function segundaParte(t){
    var p=String(t||'').split(/\s+[—–-]\s+/);
    return p.length>1 ? p.slice(1).join(' — ').trim() : '';
  }

  /* «Quedan 6 series de 50 · apuntar solo el total». Ocho de 50 son ocho filas
     y nadie sale del agua a rellenar ocho. Solo aparece cuando el plan tiene
     más de cuatro series, que es donde empieza a doler. */
  function totalHTML(n, f, med){
    if(n<=4 || !med || med.clave==='hecho') return '';
    var qué=String(f.distancia||'').trim();
    return '<div class="ej-total">Quedan '+(n-1)+' series'+(qué?' de '+esc(qué):'')+
      '<button type="button" class="ej-solo-total">apuntar solo el total</button></div>';
  }

  /* El pie de la tarjeta: «+ Serie» y «Lo cambié», y donde de verdad hay que
     elegir la unidad, también «m / km» —en atletismo conviven «6 × 150 m» y
     «rodaje de 12 km», y adivinarlo por el tamaño del número acertaría casi
     siempre y fallaría justo en los casos raros—.

     La maqueta pone «Metros / km» EN LUGAR de «Lo cambié» en la tarjeta de
     pista. Aquí van los dos, y a propósito: cambiar un ejercicio por otro pasa
     constantemente y en todos los deportes —también se cambia una serie de 300
     por uno de 200 si la pista está ocupada—, y si en pista no hubiera por
     dónde decirlo, el historial volvería a guardar lo que no se hizo. Si no
     caben en una línea, bajan a la siguiente. */
  /* ------------------------------------------------------------
     LA ÚLTIMA VEZ QUE HICISTE ESTE EJERCICIO
     ------------------------------------------------------------
     Se recogía desde siempre y NO SE ENSEÑABA EN NINGÚN SITIO: el dato se
     guardaba en memoria y solo se usaba para sugerir nombres de ejercicios.
     Ahora sale debajo del plan, que es donde miras antes de cargar la barra.

     Van TODAS las series, no la última: «15 kg × 10» puede venir de 11-10-10
     —irse cayendo— o de 5-8-10, que es subir, y para decidir si hoy toca más
     peso hace falta ver la serie entera.
     ------------------------------------------------------------ */
  function haceCuanto(iso){
    if(!iso) return '';
    var d=Math.round((Date.now()-new Date(iso).getTime())/86400000);
    if(d<=0) return 'hoy';
    if(d===1) return 'ayer';
    if(d<7)  return 'hace '+d+' días';
    if(d<14) return 'hace una semana';
    if(d<31) return 'hace '+Math.round(d/7)+' semanas';
    return 'hace más de un mes';
  }
  function ultimaVezHTML(nombre, med){
    if(med && med.clave==='hecho') return '';      /* ahí no hay número que comparar */
    var u=ULTIMA_EJ[claveEjercicio(nombre)];
    if(!u) return '';
    var lista=(u.todas && u.todas.length) ? u.todas : (u.txt?[u.txt]:[]);
    if(!lista.length) return '';
    var cuando=haceCuanto(u.fecha);
    return '<span class="ej-plan ej-ultima">La última vez'+(cuando?' ('+esc(cuando)+')':'')+': '+
           '<b>'+lista.map(esc).join(' · ')+'</b></span>';
  }

  function pieHTML(med, cols, esExtra){
    var uni=unidadRecordada();
    var hayUni=cols.some(function(c){ return c.uni; });
    return '<div class="ej-pie">'+
      '<button type="button" class="ej-mas-serie">+ Serie</button>'+
      /* «− Serie» solo aparece cuando hay alguna añadida por el atleta, y solo
         quita esas. Antes se podía añadir y no había forma de quitar: una
         pulsación de más y te quedabas con una fila vacía para siempre, que
         encima contaba en el «3 de 19 hechas». */
      '<button type="button" class="ej-menos-serie" hidden>− Serie</button>'+
      /* En uno añadido no se «cambia» nada: se corrige el nombre. Y se puede
         quitar, que es lo justo con algo que has puesto tú — lo que mandó el
         entrenador sigue sin poder borrarse. */
      (esExtra
        ? '<button type="button" class="cambio-btn">Cambiar nombre</button>'+
          '<button type="button" class="ej-quitar">Quitar</button>'
        : '<button type="button" class="cambio-btn">Lo cambié</button>')+
      (hayUni
        ? '<button type="button" class="ej-uni" data-uni="'+(uni==='km'?'m':'km')+'" aria-label="Cambiar la unidad de la distancia">'+
          '<span class="uni-act">'+esc(uni)+'</span> / '+esc(uni==='km'?'m':'km')+'</button>'
        : '')+
      '</div>';
  }

  /* ------------------------------------------------------------
     «LO CAMBIÉ POR OTRA COSA» · pieza 5
     ------------------------------------------------------------
     De dónde sale: el entrenamiento decía sentadilla hack, press banca
     y jalón al pecho, y el entrenador —entrenando él mismo— hizo
     sentadillas normales, flexiones y dominadas, porque no tenía esas
     máquinas. Sus palabras: «venga, mete flexiones en vez de press
     banca. Porque me interesa más, o porque está más cansado, o por
     mil cosas. Entonces, que se pueda cambiar».

     EL EJERCICIO QUEDA HECHO. Cambiarlo no es saltárselo: las series se
     apuntan igual y el día sigue contando como completo. Lo único que
     cambia es QUÉ se hizo.

     EL CAMPO ES DE TEXTO LIBRE y las sugerencias solo ayudan: nunca
     cierran. Aquí se decía «nada de banco de ejercicios» y era verdad
     mientras el banco fuera un desplegable de doscientos nombres; con
     la lista pegada debajo del campo, que aparece a las dos letras y
     que se puede ignorar escribiendo, el banco ayuda en vez de
     encerrar. Lo que se escriba se guarda tal cual, esté o no.
     ------------------------------------------------------------ */
  function cambioCajaHTML(nomMandado, cambio, esExtra, abierta){
    var ayuda = esExtra ? '¿qué hiciste?' : '¿qué hiciste en su lugar?';
    var lector = esExtra ? 'Qué ejercicio has hecho de más'
                         : 'Qué hiciste en vez de '+nomMandado;
    /* Cerrada salvo que se acabe de abrir. Lo escrito ya se lee en el título y
       en la banda: dejar el campo abierto debajo repetiría lo mismo dos veces
       y empujaría la tabla hacia abajo justo cuando toca apuntar. */
    return '<div class="cambio-caja"'+(abierta?'':' hidden')+'>'+
      '<div class="cambio-linea">'+
        '<input type="text" class="cambio-in" value="'+escA(cambio||'')+'" '+
        'placeholder="'+escA(ayuda)+'" autocomplete="off" '+
        'aria-label="'+escA(lector)+'">'+
        '<button type="button" class="cambio-listo">Listo</button>'+
      '</div>'+
      '<div class="sug-caja"></div></div>';
  }

  /* ============================================================
     LO QUE EL ATLETA HIZO Y NADIE LE HABÍA PUESTO
     ------------------------------------------------------------
     El club, con estas palabras: «Remo con mancuernas, hay que
     añadirlo». Salía de un entrenamiento de verdad: hizo un remo que
     no estaba puesto, y hasta hoy eso solo cabía en las notas.

     No es rehacer el entrenamiento: es CONTAR LO QUE HIZO. Sigue sin
     poder borrar ni cambiar lo que puso el entrenador — añadir lo de
     más, sí; quitar lo que le mandaron, no.

     ⚠️ Y LO AÑADIDO NO COMPLETA LO MANDADO. Se guarda con la marca
     `anadido_por_atleta` y la base no lo cuenta al decidir si el día
     está entero (migración 107): si contara, alguien que se salta
     media sesión y luego hace seis series de remo por su cuenta
     saldría como que entrenó el día completo. Por eso aquí tampoco
     entra en el «3 de 8 hechas» del bloque ni en el «te han quedado
     series sin hacer»: esos dos números responden a otra pregunta.
     ============================================================ */
  function claveExtra(){
    /* Una llave que no puede chocar con ningún id de fila. Sin
       `crypto.randomUUID` en móviles viejos, la hora y un número al
       azar bastan: solo tiene que ser distinta dentro del mismo día. */
    var id;
    try { id = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : null; } catch(e){ id=null; }
    if(!id) id = Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
    return 'extra:'+id;
  }
  /* La medida de un ejercicio añadido: la misma que la del último del bloque.
     Lo decide el bloque y no un selector, igual que en todo lo demás — quien
     añade un remo en un bloque de pesas quiere kilos y repeticiones. */
  function medidaDelBloque(bl, s){
    var ult=null;
    if(bl) bl.querySelectorAll('.serie-inputs[data-medida]').forEach(function(g){ ult=g.getAttribute('data-medida'); });
    if(ult) return { clave: ult, campos: [], referencia: '' };
    return medidaDe({}, s);
  }

  /* Lo que se lee en la cabecera de un bloque cerrado: cuánto hay y de qué va.
     En un bloque de fuerza se queda en «3 ejercicios» y su matiz: los datos del
     primer ejercicio no representan a los otros dos, y en un bloque de ocho
     mucho menos. En pista sí, porque ahí el bloque suele ser una sola serie
     repetida y sus números son los del bloque entero. */
  function resumenBloque(b, dis, s){
    var filas=(b.filas||[]); var p=[];
    if(b.matiz) p.push(String(b.matiz));
    if(!filas.length) return p.length?p.join(' · '):'Por definir';
    p.push(filas.length===1?'1 ejercicio':filas.length+' ejercicios');
    var dep=(s&&s.deporte)||'';
    var variado = (dep==='fuerza'||dep==='cubo') && filas.length>1;
    var f=null; if(!variado) filas.forEach(function(x){ if(!f && esSerie(x)) f=x; });
    if(f){
      var pi=piezasFila(f, dis);
      if(pi.length) p.push(pi[0]);
      // La recuperación va siempre en el resumen: es lo que de verdad define la sesión
      var D=DESC();
      if(D && dis){ try { var r=D.textoRec(D.recDeFila(f, dis), dis); if(r) p.push(r); } catch(e){} }
      else if(f.descanso) p.push('rec. '+f.descanso);
    }
    return p.join(' · ');
  }
  // Qué bloques quedan abiertos: lo que dejó el atleta la última vez y, si es la
  // primera, la parte principal (o el primer bloque si ninguno se llama así).
  function claveBloques(sid){ return 'apolana.entreno.bloques.'+sid; }
  function bloquesAbiertos(s, bloques){
    var g=null;
    try { var raw=window.localStorage.getItem(claveBloques(s.id)); if(raw) g=JSON.parse(raw); } catch(e){}
    if(Array.isArray(g)) return function(i){ return g.indexOf(i)>-1; };
    var pri=-1;
    bloques.forEach(function(b,i){ if(pri<0 && /principal/i.test(b.etiqueta||'')) pri=i; });
    if(pri<0) pri=0;
    return function(i){ return i===pri; };
  }
  function recordarBloques(caja){
    if(!caja) return;
    var sid=caja.getAttribute('data-sid'); if(!sid) return;
    var ab=[];
    caja.querySelectorAll('.bloque').forEach(function(d){ if(d.open) ab.push(parseInt(d.getAttribute('data-b'),10)); });
    try { window.localStorage.setItem(claveBloques(sid), JSON.stringify(ab)); } catch(e){}
  }
  var FLECHA='<svg class="bl-fl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  /* Volumen y tiempo, separados: «2.000 m» y «~55'». Las familias y los atletas
     planifican con el tiempo, no con los metros. Si el módulo no puede saber la
     duración, se enseña solo el volumen: no se inventa. */
  function cifrasSesionResumen(s, dis){
    var D=DESC(); if(!D) return [];
    var r=null;
    try { r=D.resumen(s, { disciplina: dis, grupo: GRUPO }); } catch(e){ return []; }
    if(!r) return [];
    var out=[];
    if(r.volumen) out.push({ v: r.volumen, l: r.volumen_parcial ? 'volumen (parte)' : 'volumen' });
    if(r.tiempo)  out.push({ v: r.tiempo,  l: r.estimado ? 'tiempo estimado' : 'duración' });
    return out;
  }
  /* Cómo se dicen los dos ejes en pantalla. Los nombres del papel del día son
     los que el club ya usa en su planificación anual (ajuste, carga, impacto,
     recuperación, activación, tapering); los tres últimos se añadieron porque
     son días que existen y no encajaban en ninguno. */
  var NOMBRE_DEPORTE={ atletismo:'Atletismo', natacion:'Natación', fuerza:'Fuerza', cubo:'El Cubo' };
  var NOMBRE_PAPEL={ ajuste:'Ajuste', carga:'Carga', impacto:'Impacto', recuperacion:'Recuperación',
                     activacion:'Activación', tapering:'Tapering', competicion:'Competición',
                     descanso:'Descanso', rehabilitador:'Rehabilitador' };
  function bonito(mapa, v){
    if(!v) return '';
    return mapa[v] || String(v).replace(/_/g,' ').replace(/^./,function(c){return c.toUpperCase();});
  }
  /* Los deportes de un día, con su nombre bonito. Se usan igual en el detalle
     (chips) y en el historial (chips y barras), así que salen de un solo sitio. */
  function deportesDe(s){
    var out=[];
    /* Los dos deportes van en etiquetas separadas a propósito: así se ve que
       hacen falta las dos cosas, no una mezcla de las dos. */
    if(s.deporte) out.push(bonito(NOMBRE_DEPORTE, s.deporte));
    if(s.deporte_2) out.push(bonito(NOMBRE_DEPORTE, s.deporte_2));
    if(!out.length && s.tipo) out.push(bonito(NOMBRE_DEPORTE, s.tipo));
    return out;
  }
  function papelDe(s){ return bonito(NOMBRE_PAPEL, s.papel_dia || s.rol); }
  function etiquetasEntreno(s){
    var out=deportesDe(s).map(function(d){ return { txt:d, cls:'deporte' }; });
    var papel=papelDe(s);
    if(papel) out.push({ txt:papel, cls:'papel' });
    return out;
  }

  /* `leer` = el día ya pasó y el atleta apuntó cómo le fue: entonces los
     tiempos se enseñan, no se escriben. */
  /* Los ejercicios que el atleta añadió de su cuenta y que ya están guardados.
     Vuelven al bloque en el que los puso; si el bloque se ha ido (el entrenador
     reescribió el entrenamiento), caen en el último, que es preferible a que
     desaparezcan de la vista teniendo el dato guardado. */
  function extrasDeBloque(todos, bi, ultimo){
    var out=[];
    if(!todos) return out;
    Object.keys(todos).forEach(function(k){
      if(k.indexOf('extra:')!==0) return;
      var e=todos[k]; if(!e) return;
      var suyo = (e.bloque==null) ? ultimo : e.bloque;
      if(suyo!==bi) return;
      out.push({ clave:k, dato:e });
    });
    return out;
  }
  function extraHTML(clave, e, dis, leer, todos, s){
    var n=(Array.isArray(e.series) && e.series.length) || 1;
    var f={ ejercicio: e.ejercicio||'', series: n };
    var med={ clave: e.medida||'peso_reps', campos: [], referencia: '' };
    return filaHTML(f, clave, dis, leer, todos, s, med, false);
  }

  /* ------------------------------------------------------------
     EN NATACIÓN LA CIFRA ES EL VOLUMEN
     «2.400 m en total · 1.200 apuntados». Un nadador no cuenta
     ejercicios: cuenta metros, y lo que mira a mitad de sesión es
     cuánto le queda. Va bajo el título y solo en natación; en pista y
     en la sala el número que importa es otro y aquí no pinta nada.

     Los metros apuntados los recalcula `progresoBloques` a medida que
     se escribe: es una cuenta de lo que hay en pantalla, no un dato
     guardado aparte que pudiera acabar diciendo otra cosa.
     ------------------------------------------------------------ */
  function esNatacion(s, dis){
    return dis==='natacion' || (s&&s.deporte)==='natacion' || (s&&s.deporte_2)==='natacion';
  }
  function metrosHTML(s, dis, leer, todos){
    if(!esNatacion(s, dis)) return '';
    var D=DESC(); if(!D) return '';
    var r=null;
    try { r=D.resumen(s, { disciplina: dis, grupo: GRUPO }); } catch(e){ return ''; }
    if(!r || !(r.metros>0)) return '';
    /* En un día cerrado no hay casillas que sumar: la cifra sale de lo
       guardado, y así se queda quieta. */
    var hechos = leer ? metrosGuardados(todos) : 0;
    var txt = (hechos>0 && D.fmtMetros) ? D.fmtMetros(hechos)+' apuntados' : '0 apuntados';
    return '<div class="ses-metros"'+(leer?' data-fijo="1"':'')+' data-total="'+r.metros+'">'+
      esc(r.volumen)+' en total'+
      (r.volumen_parcial?' (de lo que se mide en metros)':'')+
      ' · <span class="mt-hechos">'+esc(txt)+'</span></div>';
  }
  function metrosGuardados(todos){
    var n=0;
    if(!todos) return 0;
    Object.keys(todos).forEach(function(k){
      var e=todos[k]; if(!e || !Array.isArray(e.series)) return;
      e.series.forEach(function(x){
        if(!x || !x.hecha) return;
        var v=parseFloat(String(x.distancia==null?'':x.distancia).replace(',','.'));
        if(isNaN(v) || v<=0) return;
        n += (x.unidad==='km' || e.unidad==='km') ? v*1000 : v;
      });
    });
    return Math.round(n);
  }
  // Los metros de una casilla, con la unidad que tenga puesta el ejercicio
  function metrosDeCelda(inp){
    var v=String(inp.value||'').trim().replace(',','.');
    if(!v) return 0;
    var n=parseFloat(v); if(isNaN(n) || n<=0) return 0;
    var ejer=inp.closest('.ejer');
    var uni=ejer?ejer.querySelector('.ej-uni .uni-act'):null;
    return (uni && uni.textContent.trim()==='km') ? n*1000 : n;
  }
  function pintarMetros(caja){
    var et=caja.querySelector('.ses-metros');
    if(!et || et.getAttribute('data-fijo')==='1') return;
    var hechos=0;
    caja.querySelectorAll('.ej-fila').forEach(function(fila){
      if(!serieHecha(fila)) return;
      var d=fila.querySelector('input.s-cel[data-c="distancia"]');
      if(d) hechos+=metrosDeCelda(d);
    });
    var D=DESC();
    var txt=(D && D.fmtMetros) ? D.fmtMetros(Math.round(hechos)) : Math.round(hechos)+' m';
    var dest=et.querySelector('.mt-hechos');
    /* «0 apuntados» de entrada, no «0 m»: lo que se cuenta es cuánto llevas del
       total de arriba, y repetir la unidad dos veces en la misma línea la hace
       más larga sin decir nada nuevo. */
    if(dest) dest.textContent = hechos>0 ? txt+' apuntados' : '0 apuntados';
  }

  /* `leer` = el día ya pasó y el atleta apuntó cómo le fue: entonces los
     tiempos se enseñan, no se escriben. */
  function renderEntreno(s, todayISO, leer){
    var dis=disciplinaDe(s);
    var hechos=(leer && REG[s.id] && REG[s.id].tiempos_reales) || null;
    /* Lo guardado se mira SIEMPRE, no solo en un día cerrado: los ejercicios
       añadidos no salen de los bloques del entrenador, así que si no se
       leyeran de aquí, al volver a abrir el día no estarían. */
    var todos=(REG[s.id] && REG[s.id].tiempos_reales) || null;
    /* Dos etiquetas y no una: el DEPORTE (a qué voy hoy) y el PAPEL DEL DÍA
       (qué pinta este entrenamiento en la temporada). Antes salían tal cual
       venían de la base —«continuo», «calidad fuerte»—, en minúscula y sin
       tildes, que parecía la pantalla a medio hacer. */
    var chips=etiquetasEntreno(s).map(function(c){return '<span class="chip '+c.cls+'">'+esc(c.txt)+'</span>';}).join('');
    if(s.origen==='atleta')
      chips='<span class="chip mio" title="Esto lo apuntaste tú, no es parte del plan de tu entrenador">Lo apunté yo</span>'+chips;
    else if(s.atletas_ids) chips='<span class="chip personal" title="Este entrenamiento lo ha preparado tu entrenador solo para ti">Solo para ti</span>'+chips;
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var abierto=bloquesAbiertos(s, bloques);
    var D=DESC();
    var ultimoBl=Math.max(0, bloques.length-1);
    var bloquesHtml=bloques.map(function(b,bi){
      var filas=(b.filas||[]).map(function(f,fi){return filaHTML(f,'b'+bi+'f'+fi,dis,leer,hechos,s);}).join('')||'<div class="ejer"><div class="fila"><span class="ej vacio">Por definir</span></div></div>';
      /* Y detrás, lo que añadió él por su cuenta */
      filas+=extrasDeBloque(todos, bi, ultimoBl).map(function(x){
        return extraHTML(x.clave, x.dato, dis, leer, todos, s);
      }).join('');
      var entreEj='';
      if(D){ try { entreEj=D.textoEntreEjercicios(b)||''; } catch(e){} }
      /* «+ Añadir un ejercicio»: la puerta por la que entra lo que el atleta
         hizo y nadie le había puesto. En un día ya cerrado no aparece — para
         corregirlo está «Corregir lo apuntado», que además deja rastro. */
      var mas = leer ? '' :
        '<button type="button" class="ej-anadir" data-bloque="'+bi+'">+ Añadir un ejercicio</button>';
      var det='<details class="bloque" data-b="'+bi+'"'+(abierto(bi)?' open':'')+'>'+
        '<summary class="bl-cab">'+FLECHA+
          '<span class="bl-mid"><span class="bl-tit">'+esc(b.etiqueta||'Bloque')+'</span>'+
          '<span class="bl-res">'+esc(resumenBloque(b, dis, s))+'</span></span>'+
          '<span class="bl-prog" hidden></span>'+
        '</summary>'+
        '<div class="bl-cuerpo">'+filas+mas+
        (entreEj?'<div class="bl-entre">'+esc(entreEj)+'</div>':'')+'</div></details>';
      // El descanso entre bloques: el separador que faltaba. Si no lo lleva, no se pinta.
      var entre='';
      if(D && bi<bloques.length-1){ try { entre=D.textoEntreBloques(b)||''; } catch(e){} }
      return det+(entre?'<div class="bl-sep"><i></i><span>'+esc(entre)+'</span><i></i></div>':'');
    }).join('');
    var res=cifrasSesionResumen(s, dis);
    var resHtml = res.length ? '<div class="ses-cifras">'+res.map(function(c){
      return '<span class="ses-cifra"><b>'+esc(c.v)+'</b><span>'+esc(c.l)+'</span></span>';

    /* La fecha entera manda en la cabecera, no un «Hoy»: esta pantalla se

  // ---------- datos ----------
  var at=null, falloFicha=false;

  try {
    var r=await APOLANA_PORTAL.misAtletas();

  if(!at){

  if(at.grupo_id){ try {

  var MARCAS_PROM=null;

      if(!MMP[x.prueba] || seg<MMP[x.prueba].seg) MMP[x.prueba]={seg:seg, disp:x.tiempo_display||'', fecha:x.fecha||''};

  var RM={};   // { 'sentadilla completa': { kg: 100, fecha: '2026-03-14' } }
  function claveRM(nom){ return claveEjercicio(nom); }

    var rmq=await sb.from('rm_atleta').select('ejercicio,peso_kg,fecha_test')

      var k=claveRM(x.ejercicio);

      if(!RM[k]) RM[k]={ kg:Number(x.peso_kg), fecha:x.fecha_test||'', nom:String(x.ejercicio) };

  // Próxima competición y noticias sin leer: alimentan Inicio y la pantalla «Más»

  try {

  var RECURSOS_GRUPO=0;
  try {
    var rg2=await sb.from('documentos').select('id').eq('visibilidad','grupo').eq('activo',true).limit(50);
    if(!rg2.error && rg2.data) RECURSOS_GRUPO=rg2.data.length;

  // Rango del juego de retos: la fila de Inicio con la medalla en ámbar y qué

      }

  // Catálogo de pruebas (atletismo + natación): para el desplegable y para saber si "más es mejor"
  var CAT=[]; try { var pc=await sb.from('pruebas').select('nombre,disciplina,ambito,unidad,mas_es_mejor').eq('activa',true).order('orden'); if(!pc.error&&pc.data) CAT=pc.data; } catch(e){}
  var catMap={}; CAT.forEach(function(p){ catMap[p.nombre]=p; });
  function catMasMejor(nombre){ var p=catMap[nombre]; return p?!!p.mas_es_mejor:pruebaEsDistancia(nombre); }

  wrap.innerHTML = layout;

  function cabeceraDe(sec){
