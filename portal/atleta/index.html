<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi zona · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .at-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  .at-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(28px,6vw,42px); color: var(--navy); margin: 0 0 4px; }
  .at-cab .sub { font-family: var(--fuente-mono); font-size: 12px; letter-spacing:.1em; text-transform:uppercase; color: var(--texto-tenue); }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 200px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding:8px; box-shadow: var(--sombra-suave); }
  .side nav a { cursor:pointer; font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color: var(--texto-suave); padding:10px 12px; border-radius:10px; text-decoration:none; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { background: var(--navy); color:#fff; }
  .cont { flex:1 1 auto; min-width:0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(18px,3vw,26px); box-shadow: var(--sombra-suave); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--texto-tenue); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:11px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }

  /* gráficos */
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .grafico { border:1px solid var(--linea); border-radius:14px; padding:10px 8px 4px; background: var(--crema); }
  .grafico svg { width:100%; height:auto; display:block; }
  .grafico .leyenda { font-size:11px; color: var(--texto-suave); padding:2px 4px 4px; }
  .grafico .mejora { color:#1e7a3d; font-weight:600; }
  .records { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .record { background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); color:#fff; border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; box-shadow: var(--sombra-suave); }
  .record .r-prueba { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; opacity:.85; }
  .record .r-marca { font-family: var(--fuente-titulo); font-size:26px; font-weight:700; line-height:1.1; }
  .record .r-fecha { font-size:11px; opacity:.75; }

  /* entreno */
  .entreno-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .entreno-cab h2 { margin:0; }
  .fecha-pill { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; background: var(--azul); color:#fff; padding:4px 10px; border-radius:999px; }
  .entreno-titulo { font-size:18px; font-weight:600; color: var(--navy); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-family: var(--fuente-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; background: var(--crema-media); color: var(--texto-suave); padding:3px 9px; border-radius:999px; }
  .nota { font-size:14px; color: var(--texto); background: var(--crema); border-left:3px solid var(--azul); padding:10px 12px; border-radius:8px; margin:0 0 16px; }
  .bloque { margin-bottom:14px; }
  .bloque h3 { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color: var(--azul-oscuro); margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--linea); }
  .fila { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:7px 0; }
  .fila .ej { font-size:15px; color: var(--navy); font-weight:500; }
  .fila .fparams { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { font-size:12px; color: var(--texto-suave); background: var(--crema-media); padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .serie-inputs { display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 10px; border-bottom:1px dashed var(--linea); }
  .serie-in { width:58px; text-align:center; padding:7px 4px; border:1px solid var(--linea-borde); border-radius:8px; font-size:14px; font-family: var(--fuente-mono); color: var(--navy); }
  .serie-in:focus { outline:none; border-color: var(--azul); }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; }
  .rango { display:flex; align-items:center; gap:10px; }
  .rango output { font-family: var(--fuente-mono); font-weight:700; color: var(--azul-oscuro); min-width:26px; text-align:center; }

  @media (max-width:760px){
    .layout { flex-direction:column; }
    .side { position:static; flex-basis:auto; width:100%; }
    .side nav { flex-direction:row; overflow-x:auto; }
    .side nav a { white-space:nowrap; }
    .graficos { grid-template-columns:1fr; }
    .grid2 { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="at-wrap" id="at-wrap"><p class="intro">Cargando…</p></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('at-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  // ---------- helpers ----------
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){var p=s.split(':'); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0);} var n=parseFloat(s); return isNaN(n)?null:n; }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }

  // ¿La prueba mide distancia (salto/lanzamiento)? Entonces MÁS es mejor.
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+me[d.getMonth()]; }
  function graficoPrueba(nombre, pts, masMejor, idx){
    var W=340,H=172,padL=14,padR=14,padT=38,padB=28;
    var ys=pts.map(function(p){return p.y;});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    var span=(max-min)||Math.max(Math.abs(max)*0.1,1); var lo=min-span*0.22, hi=max+span*0.22;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    function X(i){ return padL+(pts.length===1?plotW/2:plotW*i/(pts.length-1)); }
    function Y(v){ var t=(v-lo)/(hi-lo); return padT+plotH*(masMejor?(1-t):t); }
    var bestI=0; for(var b=1;b<pts.length;b++){ if(masMejor?pts[b].y>pts[bestI].y:pts[b].y<pts[bestI].y) bestI=b; }
    var gid='grad'+(idx||0);
    var grid=''; for(var g=0;g<=2;g++){ var gy=(padT+plotH*g/2).toFixed(1); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--linea)" stroke-width="1" stroke-dasharray="2 5"></line>'; }
    var coords=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.y).toFixed(1);});
    var area='M'+padL+','+(padT+plotH).toFixed(1)+' L'+coords.join(' L')+' L'+(W-padR)+','+(padT+plotH).toFixed(1)+' Z';
    var puntos=pts.map(function(p,i){ var x=X(i),y=Y(p.y); var best=(i===bestI&&pts.length>1);
      return (best?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="var(--azul)" opacity="0.16"></circle>':'')+
        '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(best?4.3:3)+'" fill="'+(best?'var(--azul-oscuro)':'#fff')+'" stroke="var(--azul)" stroke-width="2"></circle>'+
        '<text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(best?'var(--azul-oscuro)':'var(--navy)')+'">'+esc(p.disp)+'</text>'+
        '<text x="'+x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="8.5" fill="#9a958c">'+esc(fechaCorta(p.fecha))+'</text>';
    }).join('');
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de '+esc(nombre)+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--azul)" stop-opacity="0.28"></stop><stop offset="1" stop-color="var(--azul)" stop-opacity="0"></stop></linearGradient></defs>'+
      grid+'<path d="'+area+'" fill="url(#'+gid+')"></path>'+
      '<polyline fill="none" stroke="var(--azul)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+coords.join(' ')+'"></polyline>'+puntos+
      '<text x="'+padL+'" y="19" font-size="12.5" font-weight="700" fill="var(--navy)">'+esc(nombre)+'</text>'+
      '<text x="'+(W-padR)+'" y="19" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--azul-oscuro)">MMP '+esc(pts[bestI].disp)+'</text></svg>';
    var mej = masMejor ? (pts[pts.length-1].y - pts[0].y) : (pts[0].y - pts[pts.length-1].y);
    var u = masMejor ? ' m' : '', ley='';
    if(mej>0.001) ley='<span class="mejora">▲ '+mej.toFixed(2)+u+' mejor que al empezar</span>';
    else if(mej<-0.001) ley='▼ '+Math.abs(mej).toFixed(2)+u+' respecto al inicio';
    return '<div class="grafico">'+svg+(ley?'<div class="leyenda">'+ley+'</div>':'')+'</div>';
  }

  function esSerie(f){ var n=parseInt(f.series,10); return (n>0 && n<=30)?n:0; }
  function filaHTML(f, key){
    var main=esc(f.ejercicio||f.nombre||''); var parts=[];
    if(f.series&&f.distancia) parts.push(esc(f.series)+' × '+esc(f.distancia));
    else if(f.series) parts.push(esc(f.series)+' series'); else if(f.distancia) parts.push(esc(f.distancia));
    if(f.ritmo) parts.push('ritmo '+esc(f.ritmo));
    if(f.descanso) parts.push('desc. '+esc(f.descanso));
    if(f.tiempo) parts.push(esc(f.tiempo));
    if(f.detalle) parts.push(esc(f.detalle));
    if(f.nota) parts.push(esc(f.nota));
    var chips=parts.map(function(p){return '<span class="fchip">'+p+'</span>';}).join('');
    var html='<div class="fila"><span class="ej">'+main+'</span><span class="fparams">'+chips+'</span></div>';
    var n=esSerie(f);
    if(n>0){ var ins=''; for(var i=0;i<n;i++) ins+='<input class="serie-in" data-key="'+key+'" data-i="'+i+'" inputmode="decimal" placeholder="'+(i+1)+'ª">'; html+='<div class="serie-inputs" data-eje="'+main+'">'+ins+'</div>'; }
    return html;
  }
  function renderEntreno(s, todayISO){
    var esHoy=s.fecha===todayISO; var fechaTxt=(esHoy?'Hoy · ':'')+formatFecha(s.fecha);
    var chips=[s.tipo,(s.rol||'').replace(/_/g,' ')].filter(Boolean).map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('');
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var bloquesHtml=bloques.map(function(b,bi){
      var filas=(b.filas||[]).map(function(f,fi){return filaHTML(f,'b'+bi+'f'+fi);}).join('')||'<div class="fila"><span class="ej vacio">Por definir</span></div>';
      return '<div class="bloque"><h3>'+esc(b.etiqueta||'')+'</h3>'+filas+'</div>';
    }).join('');
    return '<div class="tarjeta">'+
      '<div class="entreno-cab"><h2>Mi entreno</h2><span class="fecha-pill">'+esc(fechaTxt)+'</span></div>'+
      (s.titulo?'<div class="entreno-titulo">'+esc(s.titulo)+'</div>':'')+
      (chips?'<div class="chips">'+chips+'</div>':'')+
      (s.nota_razonamiento?'<p class="nota">'+esc(s.nota_razonamiento)+'</p>':'')+
      '<div class="bloques">'+bloquesHtml+'</div></div>';
  }

  // ---------- datos ----------
  var at=null;
  try { var r=await sb.from('atletas').select('id,nombre,apellidos,categoria,grupo_id,estado,especialidades').eq('perfil_id',perfil.id).maybeSingle(); if(!r.error) at=r.data; } catch(e){}

  var nombre = at ? ((at.nombre||'')+' '+(at.apellidos||'')) : (perfil.nombre||'');
  var cab='<div class="at-cab"><h1>Hola, '+esc(perfil.nombre||nombre)+'</h1><span class="sub">'+((at&&at.categoria)?esc(at.categoria)+' · ':'')+'Mi zona de atleta</span></div>';

  if(!at){ wrap.innerHTML=cab+'<div class="tarjeta"><p class="vacio">Todavía no vemos tu ficha de atleta enlazada a tu cuenta. Avisa al club.</p></div>'; return; }

  // Entreno (sesión publicada de mi grupo)
  var ses=null;
  if(at.grupo_id){ try {
    var todayISO=new Date().toISOString().slice(0,10);
    var se=await sb.from('sesiones').select('id,fecha,dia_semana,tipo,rol,titulo,nota_razonamiento,bloques').eq('grupo_id',at.grupo_id).eq('publicada',true).order('fecha',{ascending:false}).limit(10);
    if(!se.error&&se.data&&se.data.length){ ses=se.data.filter(function(x){return x.fecha===todayISO;})[0]||se.data[0]; }
  } catch(e){} }

  // Registro de sensaciones existente para esa sesión
  var registro=null;
  if(ses){ try { var rg=await sb.from('registros_sesion').select('*').eq('sesion_id',ses.id).eq('atleta_id',at.id).maybeSingle(); if(!rg.error) registro=rg.data; } catch(e){} }

  // Catálogo de pruebas (atletismo + natación): para el desplegable y para saber si "más es mejor"
  var CAT=[]; try { var pc=await sb.from('pruebas').select('nombre,disciplina,ambito,unidad,mas_es_mejor').eq('activa',true).order('orden'); if(!pc.error&&pc.data) CAT=pc.data; } catch(e){}
  var catMap={}; CAT.forEach(function(p){ catMap[p.nombre]=p; });
  function catMasMejor(nombre){ var p=catMap[nombre]; return p?!!p.mas_es_mejor:pruebaEsDistancia(nombre); }
  function opcionesPruebas(){
    var groups={}, order=[];
    CAT.forEach(function(p){ var g=(p.ambito==='natacion'?'Natación':'Atletismo')+' · '+(p.disciplina||''); if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(p.nombre); });
    var mias=(at.especialidades||[]).filter(function(n){ return catMap[n]; });
    var top=mias.length?'<optgroup label="★ Mis pruebas">'+mias.map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'</optgroup>':'';
    return '<option value="">— elige prueba —</option>'+top+order.map(function(g){ return '<optgroup label="'+esc(g)+'">'+groups[g].map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'</optgroup>'; }).join('');
  }

  // ---------- construir UI ----------
  var todayISO=new Date().toISOString().slice(0,10);

  // Sección ENTRENO
  var entrenoSec='';
  if(ses){
    entrenoSec = renderEntreno(ses, todayISO);
    var opts=function(sel){ var o='<option value="">—</option>'; for(var i=1;i<=10;i++) o+='<option'+(String(sel)===String(i)?' selected':'')+'>'+i+'</option>'; return o; };
    entrenoSec += '<div class="tarjeta"><h2>¿Cómo ha ido?</h2>'+
      '<div class="grid2">'+
        '<div><label>Sensación general (1-10)</label><select id="fb-sensacion">'+opts(registro&&registro.sensacion_general)+'</select></div>'+
        '<div><label>Esfuerzo · RPE (1-10)</label><select id="fb-rpe">'+opts(registro&&registro.rpe)+'</select></div>'+
      '</div>'+
      '<label>¿Cómo te sientes?</label><input id="fb-siento" type="text" value="'+esc(registro&&registro.como_me_siento||'')+'" placeholder="con energía, cansado…">'+
      '<label>Molestias (si hay)</label><input id="fb-molestias" type="text" value="'+esc(registro&&registro.molestias||'')+'" placeholder="ninguna / gemelo derecho…">'+
      '<label>Notas para el entrenador</label><textarea id="fb-notas" placeholder="lo que quieras contar del entreno">'+esc(registro&&registro.notas_atleta||'')+'</textarea>'+
      '<div class="grid2">'+
        '<div><label>Horas de sueño</label><input id="fb-sueno" inputmode="decimal" value="'+esc(registro&&registro.horas_sueno!=null?registro.horas_sueno:'')+'" placeholder="p. ej. 7.5"></div>'+
        '<div><label>Peso (kg)</label><input id="fb-peso" inputmode="decimal" value="'+esc(registro&&registro.peso_kg!=null?registro.peso_kg:'')+'" placeholder="opcional"></div>'+
      '</div>'+
      '<div class="acciones"><button class="btn btn--primario" id="fb-guardar">Guardar sensaciones</button><span class="msg" id="fb-msg"></span></div>'+
      '<p class="vacio" style="margin-top:10px;">Los tiempos de cada serie los escribes arriba, en su ejercicio. Se guardan junto a tus sensaciones.</p>'+
      '</div>';
  } else {
    entrenoSec = '<div class="tarjeta"><h2>Mi entreno</h2><p class="vacio">'+(at.grupo_id?'No hay ningún entreno publicado para tu grupo todavía.':'Aún no estás asignado a un grupo. En cuanto tu entrenador te asigne, verás aquí el entreno del día.')+'</p></div>';
  }

  // Secciones MARCAS y PAGOS se rellenan con funciones (para poder refrescar)
  var layout = cab+
    '<div class="layout">'+
      '<aside class="side"><nav>'+
        '<a data-sec="entreno" class="activo">Entreno</a>'+
        '<a data-sec="marcas">Marcas</a>'+
        '<a data-sec="pagos">Pagos</a>'+
      '</nav></aside>'+
      '<main class="cont">'+
        '<section id="sec-entreno">'+entrenoSec+'</section>'+
        '<section id="sec-marcas" hidden>'+
          '<div class="tarjeta"><h2>Añadir marca</h2>'+
            '<div class="grid2">'+
              '<div><label>Prueba</label><select id="mk-prueba">'+opcionesPruebas()+'</select></div>'+
              '<div><label id="mk-tiempo-lbl">Marca</label><input id="mk-tiempo" placeholder="7.85 · 1:02.3 · 6.85"></div>'+
            '</div>'+
            '<div class="grid2">'+
              '<div><label>Fecha</label><input id="mk-fecha" type="date" value="'+todayISO+'"></div>'+
              '<div><label>Dónde</label><input id="mk-sede" placeholder="Estadio, pista cubierta…"></div>'+
            '</div>'+
            '<div class="grid2">'+
              '<div><label>¿Dónde se hizo?</label><select id="mk-contexto"><option value="">—</option><option value="competicion">Competición oficial</option><option value="entreno">Entrenamiento</option></select></div>'+
              '<div><label>Tipo</label><select id="mk-tipo"><option value="">Normal</option><option value="mmp">Mejor marca personal</option><option value="temporada">Mejor de la temporada</option><option value="objetivo">Objetivo</option></select></div>'+
            '</div>'+
            '<div class="acciones"><button class="btn btn--primario" id="mk-guardar">Guardar marca</button><span class="msg" id="mk-msg"></span></div>'+
          '</div>'+
          '<div class="tarjeta"><h2>Mis marcas</h2><div id="marcas-cont"><p class="vacio">Cargando…</p></div></div>'+
        '</section>'+
        '<section id="sec-pagos" hidden>'+
          '<div class="tarjeta"><h2>Mis pagos</h2><div id="pagos-cont"><p class="vacio">Cargando…</p></div></div>'+
        '</section>'+
      '</main>'+
    '</div>';
  wrap.innerHTML = layout;

  // ---------- navegación por secciones ----------
  var navLinks = wrap.querySelectorAll('.side nav a');
  navLinks.forEach(function(a){ a.addEventListener('click', function(){
    navLinks.forEach(function(x){ x.classList.remove('activo'); }); a.classList.add('activo');
    ['entreno','marcas','pagos'].forEach(function(sec){ $('sec-'+sec).hidden = (sec!==a.getAttribute('data-sec')); });
  }); });

  // ---------- prefill tiempos por serie ----------
  if(registro && registro.tiempos_reales){
    var tr = registro.tiempos_reales;
    Object.keys(tr).forEach(function(key){
      var arr = (tr[key] && tr[key].tiempos) || [];
      wrap.querySelectorAll('.serie-in[data-key="'+key+'"]').forEach(function(inp){
        var i=parseInt(inp.getAttribute('data-i'),10); if(arr[i]!=null) inp.value=arr[i];
      });
    });
  }

  // ---------- guardar sensaciones + tiempos ----------
  if(ses){ $('fb-guardar').addEventListener('click', async function(){
    var msg=$('fb-msg'); msg.textContent='Guardando…'; msg.className='msg';
    // recoger tiempos por serie
    var tiempos={};
    wrap.querySelectorAll('.serie-inputs').forEach(function(g){
      var ins=g.querySelectorAll('.serie-in'); if(!ins.length) return;
      var key=ins[0].getAttribute('data-key'); var vals=[]; var hay=false;
      ins.forEach(function(inp){ var v=inp.value.trim(); vals.push(v); if(v) hay=true; });
      if(hay) tiempos[key]={ ejercicio:g.getAttribute('data-eje'), tiempos:vals };
    });
    function numOrNull(v){ v=(v||'').trim().replace(',','.'); if(!v) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
    function intOrNull(v){ if(!v) return null; var n=parseInt(v,10); return isNaN(n)?null:n; }
    var payload={
      sesion_id: ses.id, atleta_id: at.id,
      sensacion_general: intOrNull($('fb-sensacion').value),
      rpe: intOrNull($('fb-rpe').value),
      como_me_siento: $('fb-siento').value.trim()||null,
      molestias: $('fb-molestias').value.trim()||null,
      notas_atleta: $('fb-notas').value.trim()||null,
      horas_sueno: numOrNull($('fb-sueno').value),
      peso_kg: numOrNull($('fb-peso').value),
      tiempos_reales: Object.keys(tiempos).length?tiempos:null
    };
    var up=await sb.from('registros_sesion').upsert(payload,{onConflict:'sesion_id,atleta_id'});
    if(up.error){ msg.textContent='Error: '+up.error.message; msg.className='msg error'; }
    else { msg.textContent='Guardado ✓ ¡gracias!'; msg.className='msg ok'; }
  }); }

  // ---------- MARCAS: cargar/refrescar ----------
  async function cargarMarcas(){
    var cont=$('marcas-cont'); cont.innerHTML='<p class="vacio">Cargando…</p>';
    var m=await sb.from('marcas_atleta').select('prueba,tiempo_display,fecha,sede,tipo,contexto').eq('atleta_id',at.id).order('fecha',{ascending:false}).limit(80);
    if(m.error){ cont.innerHTML='<p class="vacio">Error: '+esc(m.error.message)+'</p>'; return; }
    if(!m.data.length){ cont.innerHTML='<p class="vacio">Aún no hay marcas. Añade la primera arriba.</p>'; return; }
    var porPrueba={}; m.data.forEach(function(x){ var k=x.prueba||'—'; (porPrueba[k]=porPrueba[k]||[]).push(x); });
    var graficos='', gi=0;
    Object.keys(porPrueba).forEach(function(k){
      var arr=porPrueba[k].map(function(x){return {fecha:x.fecha||'',y:tiempoANum(x.tiempo_display),disp:x.tiempo_display||''};}).filter(function(p){return p.y!=null&&p.fecha;}).sort(function(a,b){return a.fecha<b.fecha?-1:1;});
      if(arr.length>=2){ graficos+=graficoPrueba(k,arr,catMasMejor(k),gi++); }
    });
    // Mis récords: mejor marca por prueba (MMP)
    var records=Object.keys(porPrueba).map(function(k){
      var mas=catMasMejor(k), best=null;
      porPrueba[k].forEach(function(x){ var y=tiempoANum(x.tiempo_display); if(y==null) return; if(best==null||(mas?y>best.y:y<best.y)) best={prueba:k,y:y,disp:x.tiempo_display||'',fecha:x.fecha}; });
      return best;
    }).filter(Boolean).sort(function(a,b){return a.prueba<b.prueba?-1:1;});
    var recordsHtml = records.length ? '<div class="records">'+records.map(function(r){
      return '<div class="record"><span class="r-prueba">'+esc(r.prueba)+'</span><span class="r-marca">'+esc(r.disp)+'</span><span class="r-fecha">'+esc(fechaCorta(r.fecha))+'</span></div>';
    }).join('')+'</div>' : '';

    var tipoLabel={mmp:'MMP',temporada:'Temporada',objetivo:'Objetivo'};
    var tabla='<table><thead><tr><th>Prueba</th><th>Marca</th><th>Dónde se hizo</th><th>Fecha</th><th>Lugar</th></tr></thead><tbody>'+
      m.data.map(function(x){ var t=x.tipo?' <span class="pill">'+esc(tipoLabel[x.tipo]||x.tipo)+'</span>':'';
        var ctx = x.contexto==='competicion'?'<span class="pill ok">Competición</span>':(x.contexto==='entreno'?'<span class="pill">Entreno</span>':'<span class="vacio">—</span>');
        return '<tr><td>'+esc(x.prueba)+t+'</td><td>'+esc(x.tiempo_display||'')+'</td><td>'+ctx+'</td><td>'+esc(x.fecha||'')+'</td><td>'+esc(x.sede||'')+'</td></tr>'; }).join('')+'</tbody></table>';
    cont.innerHTML=recordsHtml+(graficos?'<div class="graficos">'+graficos+'</div>':'<p class="vacio" style="margin-bottom:14px;">Con 2+ marcas de una misma prueba verás aquí tu evolución.</p>')+tabla;
  }
  cargarMarcas();

  // Al elegir prueba, adaptar la etiqueta de la marca (tiempo / metros / puntos)
  $('mk-prueba').addEventListener('change', function(){ var p=catMap[this.value]; var lbl=$('mk-tiempo-lbl'), inp=$('mk-tiempo');
    if(p&&p.unidad==='distancia'){ lbl.textContent='Marca (metros)'; inp.placeholder='6.85'; }
    else if(p&&p.unidad==='puntos'){ lbl.textContent='Marca (puntos)'; inp.placeholder='5820'; }
    else { lbl.textContent='Marca (tiempo)'; inp.placeholder='7.85 · 1:02.3'; }
  });

  $('mk-guardar').addEventListener('click', async function(){
    var msg=$('mk-msg'); var prueba=$('mk-prueba').value.trim(), disp=$('mk-tiempo').value.trim();
    if(!prueba){ msg.textContent='Elige la prueba.'; msg.className='msg error'; return; }
    msg.textContent='Guardando…'; msg.className='msg';
    var payload={ atleta_id:at.id, prueba:prueba, tiempo_display:disp||null, tiempo_segundos:tiempoANum(disp), fecha:$('mk-fecha').value||null, sede:$('mk-sede').value.trim()||null, tipo:$('mk-tipo').value||null, contexto:$('mk-contexto').value||null };
    var ins=await sb.from('marcas_atleta').insert(payload);
    if(ins.error){ msg.textContent='Error: '+ins.error.message; msg.className='msg error'; return; }
    msg.textContent='Marca guardada ✓'; msg.className='msg ok';
    $('mk-prueba').value=''; $('mk-tiempo').value=''; $('mk-sede').value=''; $('mk-tipo').value=''; $('mk-contexto').value='';
    cargarMarcas();
  });

  // ---------- PAGOS ----------
  (async function cargarPagos(){
    var cont=$('pagos-cont');
    var p=await sb.from('pagos').select('concepto,importe,estado,fecha_vencimiento').eq('atleta_id',at.id).order('fecha_vencimiento',{ascending:false}).limit(40);
    if(p.error){ cont.innerHTML='<p class="vacio">Error: '+esc(p.error.message)+'</p>'; return; }
    if(!p.data.length){ cont.innerHTML='<p class="vacio">No hay pagos registrados.</p>'; return; }
    cont.innerHTML='<table><thead><tr><th>Concepto</th><th>Importe</th><th>Estado</th><th>Vence</th></tr></thead><tbody>'+
      p.data.map(function(x){ var ok=(x.estado==='pagado'||x.estado==='cobrado'); return '<tr><td>'+esc(x.concepto||'')+'</td><td>'+(x.importe!=null?esc(x.importe)+' €':'')+'</td><td><span class="pill'+(ok?' ok':'')+'">'+esc(x.estado||'')+'</span></td><td>'+esc(x.fecha_vencimiento||'')+'</td></tr>'; }).join('')+'</tbody></table>';
  })();

});
</script>

</body>
</html>
