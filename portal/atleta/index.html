    /* Lo que el atleta apuntó de ESTA fila. Se busca por el id de la fila, que
       no cambia aunque el entrenador reordene el entrenamiento (migración 103);
       si no aparece, se cae a la llave de posición de siempre, que es como
       están guardados los registros de antes. */
    var guardado=registroDeFila(hechos, f, key);
    var cambio=(guardado && guardado.cambiado_por) ? String(guardado.cambiado_por).trim() : '';
    /* EN UN DÍA YA CERRADO MANDA LO QUE HIZO, no lo que estaba puesto.
       Si el entrenamiento decía «jalón al pecho» y él hizo dominadas, en
       su historial tiene que leer DOMINADAS: si no, dentro de seis meses
       el historial dice que hace jalones que no ha hecho en su vida. Lo
       que mandó el entrenador se queda debajo, en pequeño, porque
       también es un dato: dice que en esa sala no había polea. */
    var main = (leer && cambio) ? esc(cambio) : esc(nomMandado);
    var bajoTit = (leer && cambio)
      ? '<span class="ej-cambiado">en vez de '+esc(nomMandado)+'</span>' : '';
    var html='<div class="fila"><span class="ej">'+main+bajoTit+'</span><span class="fparams">'+chips+'</span></div>';
    /* El «tú: 44.80» era un chip diminuto al final de la línea y no decía de
       dónde salía. Ahora es una frase entera debajo, con la marca que lo
       calcula. Si el atleta no tiene esa marca, aquí no se pinta nada. */
    html+=(porcentajeTuyo(f)||'');
    /* Y lo mismo en pesas: «Para ti, 85 % son 68 kg — desde tu RM de 80 kg
       de marzo». Ojo, ahí se MULTIPLICA; ver `porcentajeRM`. */
    html+=(porcentajeRM(f)||'');
    var nomEj=nomMandado;
    if(n>0 && leer){
      /* Un día cerrado: lo que hizo, en columna y sin recuadros. Si de ese
         ejercicio no apuntó nada no se pinta una lista de guiones: una columna
         de «—» no es un dato, es ruido. */
      var series=seriesDe(guardado, n);
      var hayAlguno=series.some(function(x){ return x && (x.hecha || x.txt); });
      if(!hayAlguno) return '<div class="ejer">'+html+'</div>';
      var filasL='', sinHacer=0;
      for(var j=0;j<n;j++){
        var sr=series[j]||{};
        if(!sr.hecha) sinHacer++;
        /* Lo que no se hizo se dice con palabras, no con un guion: un guion
           hace dudar de si falta el dato o de si de verdad no se hizo. */
        filasL+='<div class="sl-fila"><span class="sl-n">Serie '+(j+1)+'</span>'+
                '<span class="sl-t">'+esc(sr.hecha ? (sr.txt?comaDecimal(sr.txt):'hecha') : 'no la hice')+'</span></div>';
      }
      html+='<div class="serie-leer">'+filasL+'</div>';
      return '<div class="ejer'+(sinHacer?' medias':'')+'">'+html+'</div>';
    }
    /* Una fila por repetición, cada una con su ✓. El ✓ es el gesto rápido a pie
       de máquina, y de paso dice lo que no se hizo: la serie sin ✓ es la que no
       se hizo. No hace falta un botón aparte de «no lo hice». */
    if(n>0){
      var ins='';
      for(var i=0;i<n;i++){
        /* Hay ejercicios en los que no se apunta ningún número —movilidad,
           estiramientos— y ahí el dato ES el ✓. En vez de un hueco vacío que
           invita a escribir algo que no existe, se repite lo que mandó el
           entrenador («8 min») al lado de la marca. */
        var campos = med.campos.length
          ? med.campos.map(function(c){
              var uni = (c.k==='distancia') ? unidadRecordada() : c.unidad;
              return '<label class="s-campo">'+
                '<input class="serie-in" data-key="'+key+'" data-i="'+i+'" data-c="'+c.k+'" '+
                'inputmode="'+(c.decimal?'decimal':'numeric')+'" '+
                'aria-label="'+escA(etiquetaCampo(c, uni, i, n, nomEj))+'">'+
                (uni?'<span class="s-u" data-u="'+c.k+'">'+esc(uni)+'</span>':'')+'</label>';
            }).join('')
          : '<span class="s-solo" data-key="'+key+'" data-i="'+i+'">'+esc(med.referencia||'')+'</span>';
        ins+='<div class="serie-hueco pendiente" data-i="'+i+'">'+
             '<button type="button" class="s-ok" aria-pressed="false" '+
             'aria-label="Marcar la serie '+(i+1)+' de '+n+' de '+escA(nomEj)+' como hecha">'+VISTO+'</button>'+
             '<span class="s-n" aria-hidden="true">'+(i+1)+'</span>'+
             '<span class="s-campos">'+campos+'</span>'+
             '<span class="s-dif" aria-hidden="true"></span></div>';
      }
      var obj=(med.clave==='tiempo' && tuyo && tuyo.indexOf('–')===-1) ? tuyo : '';
      /* El conmutador m/km solo donde de verdad hay que elegir: un rodaje se
         dice en kilómetros y una serie en metros, y adivinarlo por el tamaño
         del número fallaría justo en los casos raros. */
      var uniHtml='';
      if(med.unidades){
        var ua=unidadRecordada();
        uniHtml='<span class="s-unis" role="group" aria-label="Unidad de la distancia">'+
          med.unidades.map(function(u){
            return '<button type="button" data-uni="'+u+'" aria-pressed="'+(u===ua?'true':'false')+'">'+esc(u)+'</button>';
          }).join('')+'</span>';
      }
      /* La propuesta de la última vez: lo que hiciste en este mismo ejercicio el
         otro día. Es una propuesta, no un dato guardado: hasta que no la
         confirmes no es tuya. */
      var ult=ULTIMA_EJ[claveEjercicio(nomEj)];
      var ultHtml = (ult && ult.txt) ? '<button type="button" class="s-ultima" data-ultima="'+escA(nomEj)+'">'+
        'Última vez: <span class="s-val">'+esc(ult.txt)+'</span><span class="s-rep">Repetir</span></button>' : '';
      html+='<div class="serie-cap"><b>'+esc(tituloCampos(med))+'</b>'+uniHtml+
            '<span class="serie-cnt">0 de '+n+'</span></div>'+
            cambioHTML(nomMandado, cambio)+ultHtml+
            /* La llave de posición va en el grupo y no solo en los recuadros:
               hay ejercicios que no tienen ningún recuadro (los que solo se
               marcan) y sin esto se quedarían sin guardar. */
            '<div class="serie-inputs" data-eje="'+escA(nomEj)+'" data-medida="'+escA(med.clave)+'" data-key="'+key+'"'+
            (f.id?' data-fid="'+escA(f.id)+'"':'')+
            (obj?' data-obj="'+escA(obj)+'"':'')+'>'+ins+'</div>';
    }
    return '<div class="ejer">'+html+'</div>';
  }

  /* ------------------------------------------------------------
     «LO CAMBIÉ POR OTRA COSA»
     ------------------------------------------------------------
     De dónde sale: el entrenamiento decía sentadilla hack, press banca
     y jalón al pecho, y el entrenador —entrenando él mismo— hizo
     sentadillas normales, flexiones y dominadas, porque no tenía esas
     máquinas. Sus palabras: «venga, mete flexiones en vez de press
     banca. Porque me interesa más, o porque está más cansado, o por
     mil cosas. Entonces, que se pueda cambiar».

     EL EJERCICIO QUEDA HECHO. Cambiarlo no es saltárselo: las series
     llevan su ✓ igual y el día sigue contando como completo. Lo único
     que cambia es QUÉ se hizo.

     SE ESCRIBE A MANO Y YA ESTÁ, dicho por el club con esas palabras:
     nada de banco de ejercicios ni de listas por grupo muscular. Un
     desplegable de doscientos ejercicios no se maneja de pie, entre
     serie y serie, con una mano; y el día que alguien haga algo que no
     está en la lista se queda sin poder contarlo.

     UN SOLO CAMPO, no dos. El entrenador necesita saber qué se cambió
     Y POR QUÉ, pero pedir dos cosas donde cabe una es la forma más
     rápida de que no se rellene ninguna: se escribe «dominadas — no
     había polea» y ya están las dos.

     Y mientras no se usa es un enlace y nada más: la inmensa mayoría
     de los días no se cambia nada y esto no debe estorbar.
     ------------------------------------------------------------ */
  function cambioHTML(nomMandado, cambio){
    var caja='<div class="cambio-caja"'+(cambio?'':' hidden')+'>'+
      '<label>¿Qué hiciste en su lugar? Si quieres, di por qué.</label>'+
      '<input type="text" class="cambio-in" value="'+escA(cambio||'')+'" '+
      'placeholder="dominadas — no había polea" '+
      'aria-label="Qué hiciste en vez de '+escA(nomMandado)+'"></div>';
    if(cambio){
      return '<div class="cambio-hecho"><span class="ch-txt">Lo cambiaste por <b>'+esc(cambio)+'</b>'+
        '<span class="ch-eq">en vez de '+esc(nomMandado)+'</span></span>'+
        '<button type="button" class="ch-editar">Cambiar</button></div>'+caja;
    }
    return '<button type="button" class="cambio-btn"><span class="cb-ic" aria-hidden="true">⇄</span>Lo cambié por otra cosa</button>'+caja;
  }

  /* Lo que se lee en la cabecera de un bloque cerrado: cuánto hay y de qué va.
     En un bloque de fuerza se queda en «3 ejercicios» y su matiz: los datos del
     primer ejercicio no representan a los otros dos, y en un bloque de ocho
     mucho menos. En pista sí, porque ahí el bloque suele ser una sola serie
     repetida y sus números son los del bloque entero. */
  function resumenBloque(b, dis, s){
    var filas=(b.filas||[]); var p=[];
    if(b.matiz) p.push(String(b.matiz));
    if(!filas.length) return p.length?p.join(' · '):'Por definir';
    p.push(filas.length===1?'1 ejercicio':filas.length+' ejercicios');
    var dep=(s&&s.deporte)||'';
    var variado = (dep==='fuerza'||dep==='cubo') && filas.length>1;
    var f=null; if(!variado) filas.forEach(function(x){ if(!f && esSerie(x)) f=x; });
    if(f){
      var pi=piezasFila(f, dis);
      if(pi.length) p.push(pi[0]);
      // La recuperación va siempre en el resumen: es lo que de verdad define la sesión
      var D=DESC();
      if(D && dis){ try { var r=D.textoRec(D.recDeFila(f, dis), dis); if(r) p.push(r); } catch(e){} }
      else if(f.descanso) p.push('rec. '+f.descanso);
    }
    return p.join(' · ');
  }
  // Qué bloques quedan abiertos: lo que dejó el atleta la última vez y, si es la
  // primera, la parte principal (o el primer bloque si ninguno se llama así).
  function claveBloques(sid){ return 'apolana.entreno.bloques.'+sid; }
  function bloquesAbiertos(s, bloques){
    var g=null;
    try { var raw=window.localStorage.getItem(claveBloques(s.id)); if(raw) g=JSON.parse(raw); } catch(e){}
    if(Array.isArray(g)) return function(i){ return g.indexOf(i)>-1; };
    var pri=-1;
    bloques.forEach(function(b,i){ if(pri<0 && /principal/i.test(b.etiqueta||'')) pri=i; });
    if(pri<0) pri=0;
    return function(i){ return i===pri; };
  }
  function recordarBloques(caja){
    if(!caja) return;
    var sid=caja.getAttribute('data-sid'); if(!sid) return;
    var ab=[];
    caja.querySelectorAll('.bloque').forEach(function(d){ if(d.open) ab.push(parseInt(d.getAttribute('data-b'),10)); });
    try { window.localStorage.setItem(claveBloques(sid), JSON.stringify(ab)); } catch(e){}
  }
  var FLECHA='<svg class="bl-fl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  /* Volumen y tiempo, separados: «2.000 m» y «~55'». Las familias y los atletas
     planifican con el tiempo, no con los metros. Si el módulo no puede saber la
     duración, se enseña solo el volumen: no se inventa. */
  function cifrasSesionResumen(s, dis){
    var D=DESC(); if(!D) return [];
    var r=null;
    try { r=D.resumen(s, { disciplina: dis, grupo: GRUPO }); } catch(e){ return []; }
    if(!r) return [];
    var out=[];
    if(r.volumen) out.push({ v: r.volumen, l: r.volumen_parcial ? 'volumen (parte)' : 'volumen' });
    if(r.tiempo)  out.push({ v: r.tiempo,  l: r.estimado ? 'tiempo estimado' : 'duración' });
    return out;
  }
  /* Cómo se dicen los dos ejes en pantalla. Los nombres del papel del día son
     los que el club ya usa en su planificación anual (ajuste, carga, impacto,
     recuperación, activación, tapering); los tres últimos se añadieron porque
     son días que existen y no encajaban en ninguno. */
  var NOMBRE_DEPORTE={ atletismo:'Atletismo', natacion:'Natación', fuerza:'Fuerza', cubo:'El Cubo' };
  var NOMBRE_PAPEL={ ajuste:'Ajuste', carga:'Carga', impacto:'Impacto', recuperacion:'Recuperación',
                     activacion:'Activación', tapering:'Tapering', competicion:'Competición',
                     descanso:'Descanso', rehabilitador:'Rehabilitador' };
  function bonito(mapa, v){
    if(!v) return '';
    return mapa[v] || String(v).replace(/_/g,' ').replace(/^./,function(c){return c.toUpperCase();});
  }
  /* Los deportes de un día, con su nombre bonito. Se usan igual en el detalle
     (chips) y en el historial (chips y barras), así que salen de un solo sitio. */
  function deportesDe(s){
    var out=[];
    /* Los dos deportes van en etiquetas separadas a propósito: así se ve que
       hacen falta las dos cosas, no una mezcla de las dos. */
    if(s.deporte) out.push(bonito(NOMBRE_DEPORTE, s.deporte));
    if(s.deporte_2) out.push(bonito(NOMBRE_DEPORTE, s.deporte_2));
    if(!out.length && s.tipo) out.push(bonito(NOMBRE_DEPORTE, s.tipo));
    return out;
  }
  function papelDe(s){ return bonito(NOMBRE_PAPEL, s.papel_dia || s.rol); }
  function etiquetasEntreno(s){
    var out=deportesDe(s).map(function(d){ return { txt:d, cls:'deporte' }; });
    var papel=papelDe(s);
    if(papel) out.push({ txt:papel, cls:'papel' });
    return out;
  }

  /* `leer` = el día ya pasó y el atleta apuntó cómo le fue: entonces los
     tiempos se enseñan, no se escriben. */
  function renderEntreno(s, todayISO, leer){
    var dis=disciplinaDe(s);
    var hechos=(leer && REG[s.id] && REG[s.id].tiempos_reales) || null;
    /* Dos etiquetas y no una: el DEPORTE (a qué voy hoy) y el PAPEL DEL DÍA
       (qué pinta este entrenamiento en la temporada). Antes salían tal cual
       venían de la base —«continuo», «calidad fuerte»—, en minúscula y sin
       tildes, que parecía la pantalla a medio hacer. */
    var chips=etiquetasEntreno(s).map(function(c){return '<span class="chip '+c.cls+'">'+esc(c.txt)+'</span>';}).join('');
    if(s.atletas_ids) chips='<span class="chip personal" title="Este entrenamiento lo ha preparado tu entrenador solo para ti">Solo para ti</span>'+chips;
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var abierto=bloquesAbiertos(s, bloques);
    var D=DESC();
    var bloquesHtml=bloques.map(function(b,bi){
      var filas=(b.filas||[]).map(function(f,fi){return filaHTML(f,'b'+bi+'f'+fi,dis,leer,hechos,s);}).join('')||'<div class="ejer"><div class="fila"><span class="ej vacio">Por definir</span></div></div>';
      var entreEj='';
      if(D){ try { entreEj=D.textoEntreEjercicios(b)||''; } catch(e){} }
      var det='<details class="bloque" data-b="'+bi+'"'+(abierto(bi)?' open':'')+'>'+
        '<summary class="bl-cab">'+FLECHA+
          '<span class="bl-mid"><span class="bl-tit">'+esc(b.etiqueta||'Bloque')+'</span>'+
          '<span class="bl-res">'+esc(resumenBloque(b, dis, s))+'</span></span>'+
          '<span class="bl-prog" hidden></span>'+
        '</summary>'+
        '<div class="bl-cuerpo">'+filas+
        (entreEj?'<div class="bl-entre">'+esc(entreEj)+'</div>':'')+'</div></details>';
      // El descanso entre bloques: el separador que faltaba. Si no lo lleva, no se pinta.
      var entre='';
      if(D && bi<bloques.length-1){ try { entre=D.textoEntreBloques(b)||''; } catch(e){} }
      return det+(entre?'<div class="bl-sep"><i></i><span>'+esc(entre)+'</span><i></i></div>':'');
    }).join('');
    var res=cifrasSesionResumen(s, dis);
    var resHtml = res.length ? '<div class="ses-cifras">'+res.map(function(c){
      return '<span class="ses-cifra"><b>'+esc(c.v)+'</b><span>'+esc(c.l)+'</span></span>';
    }).join('')+'</div>' : '';
    /* La fecha entera manda en la cabecera, no un «Hoy»: esta pantalla se
       abre tanto para el entrenamiento de hoy como para el de hace un mes,
       y hay que saber sin pensar cuál se está mirando. */
    return '<div class="tarjeta">'+
      '<div class="entreno-cab"><div class="ent-fecha">'+esc(fechaDeDia(s.fecha))+'</div>'+
      '<h2 class="ent-tit">'+esc(tituloSesion(s))+'</h2>'+
      (chips?'<div class="chips">'+chips+'</div>':'')+'</div>'+
      resHtml+
      (s.nota_razonamiento?'<p class="nota">'+esc(s.nota_razonamiento)+'</p>':'')+
      '<div class="bloques">'+bloquesHtml+'</div></div>';
  }

  // ---------- datos ----------
  var at=null, falloFicha=false;
  /* La ficha NO se pide aquí: la pantalla de acceso (portal-auth.js) ya ha
     tenido que pedirla para saber que esta persona tiene zona de atleta, y
     la comparte. Antes se preguntaba dos veces lo mismo nada más entrar.
     Viene con todos los campos que hacen falta aquí; entre ellos
     fecha_nacimiento y tipo_membresia, para saber si le toca la cuenta de
     la escuela o la del club en el bloque «Cómo se paga».
     De las fichas que llegan (la suya y, si entrena, las de sus atletas)
     la suya es la que va a su nombre de usuario. */
  try {
    var r=await APOLANA_PORTAL.misAtletas();
    if(r.error) falloFicha=true;
    else {
      for (var iF=0; iF<r.data.length; iF++) {
        if (r.data[iF].perfil_id === perfil.id) { at = r.data[iF]; break; }
      }
    }
  } catch(e){ falloFicha=true; }

  var todayISO=isoDe(new Date());
  var nombre = at ? ((at.nombre||'')+' '+(at.apellidos||'')) : (perfil.nombre||'');
  // Cabecera de «Hoy»: la fecha pequeña, el saludo y las iniciales del atleta
  var ini = at ? iniciales(at.nombre, at.apellidos) : iniciales(perfil.nombre, perfil.apellidos);
  var cab='<div class="at-cab"><div><span class="sub">'+esc(fechaLarga(todayISO))+'</span>'+
          '<h1>Hola, '+esc(perfil.nombre||nombre)+'</h1></div>'+
          '<div class="at-ini" aria-hidden="true">'+esc(ini)+'</div></div>';

  if(!at){
    /* Si la consulta ha fallado no se dice que la ficha no existe: eso hace que
       una persona escriba al club por un problema que no tiene. */
    /* Aquí la pantalla se queda sin barra de abajo, así que la vuelta al
       portal va dentro del aviso: si no, desde este punto no se va a ningún
       sitio sin darle a atrás a mano. */
    wrap.innerHTML = cab + (falloFicha
      ? htmlError('No hemos podido cargar tu ficha',
          'Puede ser tu conexión. Tu ficha sigue ahí, con tus entrenamientos y tus marcas: vuelve a intentarlo en un momento.',
          function(){ location.reload(); })
      : APOLANA_UI.vacio('Tu cuenta aún no tiene ficha de atleta',
          'En cuanto el club enlace tu cuenta con tu ficha, verás aquí tus entrenamientos, tus marcas y tus recibos.',
          APOLANA_UI.boton('Escribir al club', '../../contacto/'))) +
      '<p style="margin-top:14px">' + APOLANA_UI.volver() + '</p>';
    return;
  }

  // Mi grupo: da nombre, horario, lugar y entrenador a la tarjeta de hoy
  var GRUPO=null, ENTRENA='';
  /* El nombre del grupo es lo que el atleta lee en su tarjeta de hoy. En la
     escuela hay un «Azul 2» de lunes y miércoles y otro de martes y jueves:
     leyendo solo «Azul 2» no sabría qué días le toca entrenar a él. */
  /* Los grupos tampoco se piden aquí: los trae la pantalla de acceso. Se
     copia la fila antes de tocarle el nombre, porque es la misma que ven
     las demás pantallas. */
  if(at.grupo_id){ try {
    var gq=await APOLANA_PORTAL.grupos();
    if(!gq.error) gq.data.forEach(function(x){
      if (x.id === at.grupo_id) GRUPO = { nombre:x.nombre, turno:x.turno, seccion:x.seccion, horario:x.horario, entrenador_id:x.entrenador_id };
    });
  } catch(e){} }
  if(GRUPO && GRUPO.turno && window.APOLANA_GRUPO_NOMBRE) GRUPO.nombre = window.APOLANA_GRUPO_NOMBRE(GRUPO);
  // El nombre de quien lleva el grupo sale de la vista pública: solo el nombre,
  // ni correos ni teléfonos ni el resto de la ficha del personal.
  if(GRUPO && GRUPO.entrenador_id){
    try {
      var eq=await sb.from('entrenadores_publicos').select('nombre').eq('id',GRUPO.entrenador_id).maybeSingle();
      if(!eq.error && eq.data) ENTRENA=eq.data.nombre||'';
    } catch(e){}
  }
  // De «Mar y Jue 18:00-20:00 · Estadio Joaquín Villar» salen la hora y el sitio
  function horaGrupo(){ var m=(GRUPO&&GRUPO.horario)?String(GRUPO.horario).match(/\d{1,2}[:.]\d{2}/):null; return m?m[0].replace('.',':'):''; }
  function lugarGrupo(){
    if(!GRUPO||!GRUPO.horario) return '';
    var p=String(GRUPO.horario).split('·');
    return p.length>1 ? p[p.length-1].trim() : '';
  }
  /* Los nombres propios del club (La Tribu, Madre Tierra, El Cubo…) van en ámbar;
     los genéricos, en navy. La diferencia de color enseña qué tiene identidad. */
  function esNombrePropio(n){ return /(la tribu|madre tierra|el cubo|familia apolana|vertical apolana|kil[óo]metro cero)/i.test(n||''); }
  function nombreGrupoHTML(n){
    if(!n) return '';
    return esNombrePropio(n) ? '<span class="propio">'+esc(n)+'</span>' : esc(n);
  }

  // Aviso del club: mismo criterio que la web pública (activo, el más reciente)
  var AVISO=null;
  try {
    var av=await sb.from('avisos').select('texto,tipo,enlace,texto_enlace').eq('activo',true).order('created_at',{ascending:false}).limit(1);
    if(!av.error && av.data && av.data.length && av.data[0].texto) AVISO=av.data[0];
  } catch(e){}

  /* ---------- MIS MARCAS, PEDIDAS UNA SOLA VEZ ----------
     Esta pantalla pedía las marcas dos veces seguidas al abrirse: una para
     saber tus mejores marcas (con ellas los «%» del entrenamiento se
     convierten en TU tiempo) y otra, un renglón después, para pintar la
     lista de la sección Marcas. Misma tabla, mismo atleta, dos viajes.
     Ahora se piden una vez, con todos los campos que necesitan las dos, y
     de la más reciente hacia atrás. Quien apunta una marca nueva sí vuelve
     a preguntar: para eso está `olvidarMarcas()`. */
  var MARCAS_PROM=null;
  function pedirMarcas(){
    if(!MARCAS_PROM){
      MARCAS_PROM = sb.from('marcas_atleta')
        .select('prueba,tiempo_display,tiempo_segundos,fecha,sede,tipo,contexto')
        .eq('atleta_id',at.id).order('fecha',{ascending:false}).limit(200);
    }
    return MARCAS_PROM;
  }
  function olvidarMarcas(){ MARCAS_PROM=null; }

  // Mis mejores marcas: sirven para convertir los "%" del entreno en TU tiempo
  var ULTIMA=null;   // la marca más reciente, para la tarjeta de Inicio
  try {
    var mm=await pedirMarcas();
    if(!mm.error&&mm.data) mm.data.forEach(function(x){
      if(x.fecha && (!ULTIMA || x.fecha>ULTIMA.fecha)) ULTIMA=x;
      var seg = (x.tiempo_segundos!=null) ? Number(x.tiempo_segundos) : tiempoANum(x.tiempo_display);
      if(seg==null||isNaN(seg)||!x.prueba) return;
      /* La fecha viaja con la marca porque en el entrenamiento se enseña de
         dónde sale el objetivo («desde tu 38,1 de mayo»): sin la referencia
         a la vista, el número calculado parece inventado. */
      if(!MMP[x.prueba] || seg<MMP[x.prueba].seg) MMP[x.prueba]={seg:seg, disp:x.tiempo_display||'', fecha:x.fecha||''};
    });
  } catch(e){}

  /* ------------------------------------------------------------
     MIS REPETICIONES MÁXIMAS
     Lo mismo que las marcas, pero en pesas: de aquí salen los kilos
     cuando el entrenamiento dice «80 % RM». Se guarda la del test
     MÁS RECIENTE de cada ejercicio: los tests anteriores siguen en
     la base (la progresión de la sentadilla a lo largo del año es
     justo lo que el club quiere poder mirar), pero para calcular el
     peso de hoy manda el último.

     Si no hay RM de un ejercicio, aquí no entra nada y en pantalla
     no se pinta nada. NUNCA un peso estimado: un número inventado
     en una barra es una lesión esperando a pasar.
     ------------------------------------------------------------ */
  var RM={};   // { 'sentadilla completa': { kg: 100, fecha: '2026-03-14' } }
  function claveRM(nom){ return claveEjercicio(nom); }
  try {
    var rmq=await sb.from('rm_atleta').select('ejercicio,peso_kg,fecha_test')
              .eq('atleta_id',at.id).order('fecha_test',{ascending:false, nullsFirst:false});
    if(!rmq.error && rmq.data) rmq.data.forEach(function(x){
      if(!x.ejercicio || x.peso_kg==null) return;
      var k=claveRM(x.ejercicio);
      /* Llegan de la más reciente a la más antigua, así que la primera
         que se ve de cada ejercicio es la que vale. */
      if(!RM[k]) RM[k]={ kg:Number(x.peso_kg), fecha:x.fecha_test||'' };
    });
  } catch(e){}

  // Próxima competición y noticias sin leer: alimentan Inicio y la pantalla «Más»
  var PROXCOMP=null;
  try {
    var cc=await sb.from('competiciones').select('nombre,sede,fecha_inicio').gte('fecha_inicio',todayISO).order('fecha_inicio').limit(1);
    if(!cc.error && cc.data && cc.data.length) PROXCOMP=cc.data[0];
  } catch(e){}
  var NOTIS=0;

    var nn=await sb.from('noticias').select('id').eq('publicada',true).gte('fecha_publicacion',addDias(todayISO,-30)).limit(20);
    if(!nn.error && nn.data) NOTIS=nn.data.length;
  } catch(e){}

  // Rango del juego de retos: la fila de Inicio con la medalla en ámbar y qué
  // falta para el siguiente. Solo si el atleta participa: si no, no hay fila.
  var RANGO=null;
  try {
    var pj=await sb.from('perfil_juego').select('participa,puntos').eq('atleta_id',at.id).maybeSingle();
    if(!pj.error && pj.data && pj.data.participa){
      var rg=await sb.from('juego_rangos').select('clave,nombre,desde_puntos,orden').order('desde_puntos');
      if(!rg.error && rg.data && rg.data.length){
        var pts=pj.data.puntos||0, actual=rg.data[0], siguiente=null;
        rg.data.forEach(function(r){
          if(pts>=r.desde_puntos) actual=r;
          else if(!siguiente) siguiente=r;
        });
        RANGO={ puntos:pts, nombre:actual.nombre, orden:actual.orden,
                sigNombre: siguiente?siguiente.nombre:'', sigFaltan: siguiente?(siguiente.desde_puntos-pts):0 };
      }

  } catch(e){}

  // Catálogo de pruebas (atletismo + natación): para el desplegable y para saber si "más es mejor"
  var CAT=[]; try { var pc=await sb.from('pruebas').select('nombre,disciplina,ambito,unidad,mas_es_mejor').eq('activa',true).order('orden'); if(!pc.error&&pc.data) CAT=pc.data; } catch(e){}
  var catMap={}; CAT.forEach(function(p){ catMap[p.nombre]=p; });
  function catMasMejor(nombre){ var p=catMap[nombre]; return p?!!p.mas_es_mejor:pruebaEsDistancia(nombre); }
  function opcionesPruebas(){
    var groups={}, order=[];
    CAT.forEach(function(p){ var g=(p.ambito==='natacion'?'Natación':'Atletismo')+' · '+(p.disciplina||''); if(!groups[g]){groups[g]=[];order.push(g);} groups[g].push(p.nombre); });
    var mias=(at.especialidades||[]).filter(function(n){ return catMap[n]; });
    var top=mias.length?'<optgroup label="★ Mis pruebas">'+mias.map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'</optgroup>':'';
    return '<option value="">— elige prueba —</option>'+top+order.map(function(g){ return '<optgroup label="'+esc(g)+'">'+groups[g].map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'</optgroup>'; }).join('');
  }

          '<a class="mk-tests" href="../tests/">' +

  // ---------- cabecera de pantalla ----------

  // Entreno es una pantalla de trabajo —cabecera navy, cuerpo crema y «Salir»—.
  function cabeceraDe(sec){
    if(sec==='entreno'){
      var quien=[nombreGrupoHTML((GRUPO&&GRUPO.nombre)||''), ENTRENA?esc(ENTRENA):''].filter(Boolean).join(' · ');
      /* Una tira y no un titular: la cabecera es la misma en los tres
         conmutadores y no le pone un tercer nombre a esta pantalla. Las

      return '<div class="at-cab"><div><span class="sub">Lo que el club te gira</span><h1>Pagos</h1></div></div>';
    if(sec==='mas') return '<div class="at-cab"><h1>Más</h1></div>';

  /* La barra de abajo va SIEMPRE, en todas las secciones. Antes se quitaba al
     entrar en «entreno», para dejar la pantalla despejada, y el efecto era que
     desde ahí no se podía ir a ningún sitio: había que volver atrás a mano. */
  function pintarTabbar(){ $('tabbar-cont').innerHTML = tabbarHTML(SEC); }
  function activarSeccion(sec){

    wrap.querySelectorAll('.side nav a').forEach(function(x){ x.classList.toggle('activo', x.getAttribute('data-sec')===sec); });
    SECCIONES.forEach(function(s){ $('sec-'+s).hidden = (s!==sec); });
    document.body.classList.toggle('trabajo', sec==='entreno');
    pintarCabecera();
    /* La cabecera se vuelve a pintar entera, así que las flechas de día se
       han ido con ella: se devuelven en cuanto se vuelve al entrenamiento. */
    if(sec==='entreno' && diaSel) vecinosDe(diaSel).then(function(v){ pintarFlechas(diaSel, v); });
    if(sec==='mas') pintarMas();

  // Un solo manejador: sirve para la barra lateral, para la barra inferior y

    if(salir){ activarSeccion(salir.getAttribute('data-sec-ir')); window.scrollTo(0,0); return; }
    // Las flechas de día de la tira navy: el mismo salto que las del pie
    var flecha=t.closest('#cab-cont [data-ir-dia]');

  // ---------- ENTRENO POR SEMANAS ----------
  var SEM={};              // { lunesISO: [sesiones de esa semana] }  (caché, una consulta por semana)
  var REG={};              // { sesion_id: registro de sensaciones ya guardado }
  var lunesVis=lunesDe(todayISO);   // lunes de la semana que se está viendo
  var diaSel=todayISO;              // día elegido en la tira
  var MODO='hoy';                   // conmutador: hoy · semana · historial

  function rangoTxt(lunes){ return 'Semana del '+fechaCorta(lunes)+' – '+fechaCorta(addDias(lunes,6)); }
  /* Chip diminuto de la tira de días: aquí no cabe «entrenamiento», así que se
     dice el DEPORTE, que es lo que hace falta para saber qué meter en la bolsa.
     Cuando el día son dos deportes se dicen los dos, porque si solo pusiera
     «fuerza» uno se presenta sin las zapatillas de clavos. */
  var DEPORTE_CORTO={ atletismo:'atletismo', natacion:'natación', fuerza:'fuerza', cubo:'El Cubo' };
  var TIPO_CORTO_VIEJO={ pista:'pista', gym:'fuerza', continuo:'rodaje', activacion:'activ.', competicion:'compe.', descanso:'descanso' };
  function deporteCorto(s){
    if(!s) return 'entren.';
    var a=DEPORTE_CORTO[s.deporte]||'', b=DEPORTE_CORTO[s.deporte_2]||'';
    if(a&&b) return a+' + '+b;
    if(a) return a;
    return tipoCorto(s.tipo);
  }
  function tipoCorto(t){
    return TIPO_CORTO_VIEJO[t]||(t?String(t).slice(0,8):'entren.');
  }
  function sesionesDe(iso){ return (SEM[lunesVis]||[]).filter(function(s){ return s.fecha===iso; }); }

  // Trae las sesiones publicadas de la semana. Sin filtrar por grupo: el permiso del
  // servidor ya devuelve solo lo mío, incluidos los entrenos preparados solo para mí.
  /* Semanas cuya consulta ha fallado. Sin esto, un fallo de conexión se veía
     igual que una semana sin entrenos: «hoy no toca» a alguien que sí tiene
     entreno, y a las siete de la tarde eso es quedarse en casa. */
  var SEM_FALLO={};
  async function cargarSemana(lunes){
    if(SEM[lunes]) return SEM[lunes];
    var lista=[];
    delete SEM_FALLO[lunes];
    try {
      var se=await sb.from('sesiones')
        .select('id,fecha,dia_semana,tipo,rol,deporte,deporte_2,papel_dia,titulo,nota_razonamiento,bloques,atletas_ids')
        .eq('publicada',true).gte('fecha',lunes).lte('fecha',addDias(lunes,6))
        .order('fecha',{ascending:true});
      if(se.error) SEM_FALLO[lunes]=true; else lista=se.data||[];
    } catch(e){ SEM_FALLO[lunes]=true; }
    /* Una semana que ha fallado NO se guarda como cargada: así el reintento
       vuelve a preguntar de verdad en vez de devolver la lista vacía. */
    if(SEM_FALLO[lunes]) return lista;
    SEM[lunes]=lista;
    var ids=lista.map(function(s){ return s.id; });
    if(ids.length){ try {
      /* Se piden los campos por su nombre, no `*`. Son los nueve que se
         usan de verdad para rellenar el formulario de feedback; los otros
         tres (id, atleta_id y la hora en que se guardó) no los mira nadie
         en esta pantalla y viajaban por costumbre. */
      var rg=await sb.from('registros_sesion')
        .select('id,sesion_id,sensacion_general,rpe,tiempos_reales,como_me_siento,molestias,notas_atleta,horas_sueno,peso_kg,estado,series_hechas,series_previstas,motivo_no_hecho,nota_no_hecho,corregido_en,corregido_veces')
        .eq('atleta_id',at.id).in('sesion_id',ids);
      if(!rg.error && rg.data) rg.data.forEach(function(r){ REG[r.sesion_id]=r; });
      /* El `id` del registro se pide desde ahora porque es por donde cuelga
         el comentario del entrenador. Antes no lo miraba nadie y viajaba
         de más; ahora hace falta. */
      await cargarComentarios(lista);
    } catch(e){} }
    return lista;
  }

  /* ------------------------------------------------------------
     EL COMENTARIO DEL ENTRENADOR
     Lo que cierra «hablar con el atleta» sin que tengan que coincidir en
     la pista. Se pide junto con la semana y de una vez para todos los
     días: son dos o tres registros, no vale la pena una consulta por día.

     El permiso (migración 105) ya se encarga de que aquí solo llegue lo
     del propio atleta. Las familias no ven ni esto ni el entrenamiento.
     ------------------------------------------------------------ */
  var COMENT={};        // { sesion_id: { texto, quien, cuando, editado } }
  var NOMBRE_ENT={};    // { perfil_id: 'Nacho' }  (la vista pública, solo el nombre)
  async function cargarComentarios(lista){
    var porReg={}, regIds=[];
    (lista||[]).forEach(function(s){
      var r=REG[s.id];
      if(r && r.id){ porReg[r.id]=s.id; regIds.push(r.id); }
    });
    if(!regIds.length) return;
    try {
      var fq=await sb.from('feedback_entrenamientos')
        .select('registro_id,entrenador_id,comentario,created_at,editado_en')
        .in('registro_id',regIds).order('created_at',{ascending:true});
      if(fq.error || !fq.data) return;
      var faltan=[];
      fq.data.forEach(function(c){
        var sid=porReg[c.registro_id]; if(!sid || !c.comentario) return;
        COMENT[sid]={ texto:c.comentario, quien:c.entrenador_id, cuando:c.created_at, editado:c.editado_en };
        if(c.entrenador_id && !NOMBRE_ENT[c.entrenador_id] && faltan.indexOf(c.entrenador_id)===-1) faltan.push(c.entrenador_id);
      });
      /* El nombre sale de la vista pública de entrenadores: solo el nombre,
         ni correos ni teléfonos ni el resto de su ficha. */
      if(faltan.length){
        var eq=await sb.from('entrenadores_publicos').select('id,nombre').in('id',faltan);
        if(!eq.error && eq.data) eq.data.forEach(function(e){ NOMBRE_ENT[e.id]=e.nombre||''; });
      }
    } catch(e){}
  }

  /* «Nacho, tu entrenador» y debajo lo que te dijo. Va al final del
     detalle del entrenamiento: se lee después de ver lo que hiciste, que
     es cuando tiene sentido. Si no hay comentario, no hay hueco. */
  function comentarioHTML(s){
    var c=COMENT[s.id]; if(!c || !c.texto) return '';
    var nom=(c.quien && NOMBRE_ENT[c.quien]) || '';
    var quien = nom ? nom+', tu entrenador' : 'Tu entrenador';
    /* Que se sepa cuándo se dijo, y si se retocó más tarde: un comentario
       reescrito semanas después no es el mismo comentario. */
    var pie=[];
    if(c.cuando) pie.push(fechaDiaMes(String(c.cuando).slice(0,10)));
    if(c.editado) pie.push('corregido el '+fechaDiaMes(String(c.editado).slice(0,10)));
    return '<div class="coment-ent">'+
      '<div class="ce-quien">'+esc(quien)+'</div>'+
      '<div class="ce-txt">'+esc(c.texto)+'</div>'+
      (pie.length?'<div class="ce-cuando">'+esc(pie.join(' · '))+'</div>':'')+
      '</div>';
  }

  /* ------------------------------------------------------------
     LO QUE HICISTE LA ÚLTIMA VEZ EN ESE MISMO EJERCICIO
     Se pide una sola vez al entrar y se guarda por nombre de ejercicio. Es lo
     que hace que apuntar una serie sea cero toques si repites y uno si subes
     peso; si hubiera que teclearlo todo cada vez, esto se abandona a la tercera
     sesión y el historial se queda vacío.

     Es una PROPUESTA, no un dato: hasta que el atleta no la confirma, no es
     suya. Por eso se enseña en gris y hay que tocarla.
     ------------------------------------------------------------ */
  async function cargarUltimaVez(){
    try {
      var r=await sb.from('registros_sesion').select('tiempos_reales,created_at')
              .eq('atleta_id',at.id).not('tiempos_reales','is',null)
              .order('created_at',{ascending:false}).limit(40);
      if(r.error||!r.data) return;
      var D=DESC();
      r.data.forEach(function(reg){                 // del más reciente al más viejo
        var tr=reg.tiempos_reales; if(!tr || typeof tr!=='object') return;
        Object.keys(tr).forEach(function(k){
          var e=tr[k]; if(!e || !e.ejercicio) return;
          var clave=claveEjercicio(e.ejercicio);
          if(!clave || ULTIMA_EJ[clave]) return;    // ya tenemos una más reciente
          /* La última serie que de verdad se hizo: si la última quedó sin hacer,
             proponerla en blanco no ayudaría a nadie. */
          var buena=null;
          if(Array.isArray(e.series)){
            for(var i=e.series.length-1;i>=0;i--){
              var s=e.series[i];
              if(s && s.hecha && (s.peso||s.reps||s.tiempo||s.distancia)){ buena=s; break; }
            }
          }
          if(!buena) return;
          var txt='';
          if(D && D.textoSerieHecha){ try { txt=D.textoSerieHecha(buena,{clave:e.medida||'tiempo'})||''; } catch(x){} }
          if(!txt) return;
          ULTIMA_EJ[clave]={ txt: txt, campos: buena };
        });
      });
    } catch(e){}
  }

  function pintarSemana(){
    $('sem-rango').textContent=rangoTxt(lunesVis);
    var nom=['lun','mar','mié','jue','vie','sáb','dom'], html='';
    for(var i=0;i<7;i++){
      var iso=addDias(lunesVis,i), ses=sesionesDe(iso);
      var num=new Date(iso+'T00:00:00').getDate();
      var cls='dia'+(ses.length?'':' vacio')+(iso===HOY_ISO?' hoy':'')+(iso===diaSel?' sel':'');
      var marca, titulo;
      if(ses.length){
        var personal=ses.some(function(s){ return s.atletas_ids!=null; });
        var etiqueta=deporteCorto(ses[0])+(ses.length>1?' +'+(ses.length-1):'');
        /* Mirar hacia atrás sirve de poco si todos los días se ven igual.
           El día en el que apuntaste cómo te fue lleva un visto en vez del
           punto: de un vistazo se ve lo que hiciste y lo que se quedó sin
           contar. Es una forma distinta, no solo otro color. */
        var apuntado=ses.every(function(s){ return !!REG[s.id]; });
        marca=(apuntado
                ? '<span class="d-hecho'+(personal?' personal':'')+'" aria-hidden="true">✓</span>'
                : '<span class="d-punto'+(personal?' personal':'')+'"></span>')+
              '<span class="d-tipo">'+esc(etiqueta)+'</span>';
        titulo=formatFecha(iso)+': '+(ses[0].titulo||'entrenamiento')+(ses.length>1?' (y '+(ses.length-1)+' más)':(personal?' · solo para ti':''))+
               (apuntado?' · ya apuntaste cómo te fue':'');
      } else {
        marca='<span class="d-tipo">libre</span>';
        titulo=formatFecha(iso)+': sin entrenamiento';
      }
      html+='<button type="button" class="'+cls+'" data-dia="'+iso+'" title="'+esc(titulo)+'" aria-pressed="'+(iso===diaSel?'true':'false')+'">'+
        '<span class="d-nom">'+(iso===HOY_ISO?'hoy':nom[i])+'</span><span class="d-num">'+num+'</span>'+marca+'</button>';
    }
    $('sem-dias').innerHTML=html;
    /* La tira se desliza, y en una semana de siete días el domingo queda
       fuera de la vista: abrías la app un domingo y no veías el día en el
       que estabas. Se coloca sola en el día marcado. */
    var tira=$('sem-dias');
    var foco=tira && (tira.querySelector('.dia.sel') || tira.querySelector('.dia.hoy'));
    if(foco && tira.scrollWidth>tira.clientWidth){
      /* centrado, y sin animación: al abrir tiene que estar ya puesto */
      tira.scrollLeft = Math.max(0, foco.offsetLeft - (tira.clientWidth - foco.offsetWidth)/2);
    }
  }

  // Tarjeta "¿Cómo ha ido?" de UNA sesión, rellenada con lo que ya haya guardado.
  // Puntuar es tocar una ficha del 1 al 10; el resto del formulario queda plegado.
  function fichaFeedback(s){

    // Fila de fichas 1-10 que escribe en un campo oculto (así se guarda igual que antes)

      return '<div class="escala" role="group">'+f+'</div>'+

      escala('fb-sensacion', reg&&reg.sensacion_general)+

      escala('fb-rpe', reg&&reg.rpe)+
      '<button type="button" class="fb-mas'+(hayDetalles?' abierto':'')+'" aria-expanded="'+(hayDetalles?'true':'false')+'"><span class="fl">&rsaquo;</span>Añadir detalles</button>'+
      '<div class="fb-detalles"'+(hayDetalles?'':' hidden')+'>'+
        '<label>¿Cómo te sientes?</label><input class="fb-siento" type="text" value="'+esc(reg&&reg.como_me_siento||'')+'" placeholder="con energía, cansado…">'+
        '<label>Molestias (si hay)</label><input class="fb-molestias" type="text" value="'+esc(reg&&reg.molestias||'')+'" placeholder="ninguna / gemelo derecho…">'+
        '<label>Notas para el entrenador</label><textarea class="fb-notas" placeholder="lo que quieras contar del entrenamiento">'+esc(reg&&reg.notas_atleta||'')+'</textarea>'+
        '<div class="grid2">'+
          '<div><label>Horas de sueño</label><input class="fb-sueno" inputmode="decimal" value="'+esc(reg&&reg.horas_sueno!=null?reg.horas_sueno:'')+'" placeholder="p. ej. 7.5"></div>'+
          '<div><label>Peso (kg)</label><input class="fb-peso" inputmode="decimal" value="'+esc(reg&&reg.peso_kg!=null?reg.peso_kg:'')+'" placeholder="opcional"></div>'+
        '</div>'+
      '</div>'+
      /* «Te han quedado 4 series sin hacer, ¿por qué?». Se pregunta UNA vez, al
         final, y solo si de verdad falta algo. Preguntarlo serie por serie
         sería insoportable y dejaría de marcarse a la tercera sesión. */
      '<div class="no-hecho" data-nh hidden></div>'+
      '<div class="acciones"><button type="button" class="btn btn--primario fb-guardar">Guardar sensaciones</button><span class="msg fb-msg"></span><span class="fb-sucio" hidden>Tienes cambios sin guardar</span></div>'+
      '<p class="vacio" style="margin-top:10px;">Lo que hiciste en cada serie lo marcas arriba, en su ejercicio. Se guarda junto a tus sensaciones.</p>'+

  /* ------------------------------------------------------------
     LO QUE SE QUEDÓ SIN HACER
     La franja solo aparece cuando quedan series sin ✓. Ni regaña ni pone en
     rojo: que se quedara algo sin hacer es un dato, no una falta, y si marcarlo
     diera vergüenza nadie lo marcaría —y entonces el historial volvería a
     mentir hacia arriba, que es lo que se está arreglando—.

     El motivo «me molestaba» abre las molestias de siempre, que ya existen en
     este mismo formulario y ya las mira el equipo técnico: no se guarda dos
     veces la misma información en dos sitios distintos.
     ------------------------------------------------------------ */
  var MOTIVOS=[{k:'tiempo', t:'No dio tiempo'},{k:'molestia', t:'Me molestaba'},{k:'otro', t:'Otra cosa'}];
  function avisoNoHecho(raiz){
    if(!raiz) return;
    (raiz.querySelectorAll ? raiz.querySelectorAll('.entreno-uno') : []).forEach(pintarNoHecho);
    var propia=raiz.closest?raiz.closest('.entreno-uno'):null;
    if(propia) pintarNoHecho(propia);
  }
  function pintarNoHecho(caja){
    var caj=caja.querySelector('[data-nh]'); if(!caj) return;
    var filas=caja.querySelectorAll('.serie-hueco');
    var faltan=0; filas.forEach(function(f){ if(!serieHecha(f)) faltan++; });
    if(!filas.length || !faltan){ caj.hidden=true; caj.innerHTML=''; return; }
    /* Se conserva lo que ya hubiera elegido: repintar no puede borrar una
       respuesta que el atleta acaba de dar. */
    var sel=caj.getAttribute('data-motivo')||'';
    var nota=caj.querySelector('.nh-nota');
    var notaTxt=nota?nota.value:(caj.getAttribute('data-nota')||'');
    var ejer=[];
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var fs=g.querySelectorAll('.serie-hueco'), sin=0;
      fs.forEach(function(f){ if(!serieHecha(f)) sin++; });
      if(sin) ejer.push(g.getAttribute('data-eje')||'');
    });
    var cuales = ejer.filter(Boolean).slice(0,3).join(', ');
    caj.hidden=false;
    caj.innerHTML=
      '<p>Te '+(faltan===1?'ha quedado <b>1 serie</b> sin hacer':'han quedado <b>'+faltan+' series</b> sin hacer')+
      (cuales?' ('+esc(cuales)+(ejer.length>3?'…':'')+')':'')+'. ¿Por qué?</p>'+
      '<div class="nh-motivos" role="group">'+MOTIVOS.map(function(m){
        return '<button type="button" data-motivo="'+m.k+'" aria-pressed="'+(sel===m.k?'true':'false')+'">'+esc(m.t)+'</button>';
      }).join('')+'</div>'+
      '<input type="text" class="nh-nota" placeholder="si quieres, cuéntalo (opcional)" value="'+esc(notaTxt)+'"'+(sel?'':' hidden')+'>';
  }

  /* ------------------------------------------------------------
     CORREGIR LO APUNTADO
     ------------------------------------------------------------
     El club: «que se pueda corregir, eso es importantísimo». Hasta hoy
     un día pasado se leía y no había escape: si un chaval tecleaba mal
     un peso, se quedaba mal para siempre.

     CON CRITERIO, que es lo que pidió:
       · LO DEL MISMO DÍA, sin fricción. Ahí ni sale este botón: el día
         de hoy ya se edita tal cual, y escribir 60 y luego 65 sobre la
         marcha no es corregir, es apuntar.
       · LO DE HACE SEMANAS también se puede, pero se nota. Se avisa
         antes de tocar nada y, al guardar, la base deja el rastro
         (migración 104) que se lee luego en «corregido el 3 de agosto».
         Un dato de hace un mes que cambia sin dejar rastro es peor que
         uno equivocado: el equipo técnico decidió cosas mirando el
         número de antes.
     ------------------------------------------------------------ */
  var CORRIGIENDO={};       // { sesion_id: true } mientras se está corrigiendo
  function esLeer(s){
    if(!s || !REG[s.id]) return false;
    if(s.fecha >= todayISO) return false;
    return !CORRIGIENDO[s.id];
  }
  /* Que se sepa que se está reescribiendo algo viejo, y ANTES de tocarlo.
     No regaña: solo dice lo que va a pasar. */
  function avisoCorrigiendoHTML(s){
    if(!s || !CORRIGIENDO[s.id]) return '';
    return '<div class="aviso-corrigiendo">Estás corrigiendo lo que apuntaste el '+
      esc(fechaDiaMes(s.fecha))+'. Al guardar quedará dicho que se corrigió y cuándo.</div>';
  }

  /* ---------- «Cómo te fue», en modo lectura (entrega 9, 3b) ----------
     La misma tarjeta de «¿Cómo ha ido?» pero contada, no rellenada. Se usa
     en los días que ya pasaron: lo que se apuntó aquel día es un hecho.
     El número solo no dice nada —un 8 puede ser bueno o malo—, así que se
     lee con su palabra: «8 · Muy duro». */
  var PALABRA_RPE=['','Muy suave','Suave','Cómodo','Llevadero','Moderado','Algo duro','Duro','Muy duro','Durísimo','Al límite'];
  var PALABRA_SENSA=['','Fatal','Muy mal','Mal','Regular','Normal','Bien','Muy bien','Genial','Genial','Genial'];
  function palabraDe(tabla, n){ n=parseInt(n,10); return (n>=1&&n<=10)?tabla[n]:''; }
  /* «con energía, piernas cargadas» son dos cosas, y en chips se leen de un
     vistazo. Se parte por comas y por «·», que es como lo escribe la gente. */
  function trocear(txt){
    return String(txt||'').split(/[,;·]/).map(function(p){ return p.trim(); }).filter(Boolean).slice(0,6);
  }
  /* Cómo se dice el motivo cuando se lee, que no es como se pregunta: se
     pregunta «¿por qué?» y se lee «no dio tiempo». */
  var MOTIVO_LEER={ tiempo:'no dio tiempo', molestia:'algo molestaba', otro:'por otra cosa' };

  function fichaFeedbackLeer(s){
    var reg=REG[s.id]; if(!reg) return '';
    var partes='';
    /* Lo primero de todo, antes que el esfuerzo: si aquel día se quedó a
       medias, eso cambia cómo se lee todo lo demás. Un RPE de 5 en un
       entrenamiento entero y en medio entrenamiento no significan lo mismo. */
    if(reg.estado==='a_medias'||reg.estado==='no_hecho'){
      var cuantas = (reg.series_previstas>0)
        ? reg.series_hechas+' de '+reg.series_previstas+' series'
        : (reg.estado==='no_hecho'?'no llegaste a hacerlo':'se quedó a medias');
      var pq = reg.motivo_no_hecho ? ' · '+(MOTIVO_LEER[reg.motivo_no_hecho]||reg.motivo_no_hecho) : '';
      partes+='<div class="fbl-medias">'+
        esc(reg.estado==='no_hecho'?'No lo hiciste':'Se quedó a medias')+
        ' — '+esc(cuantas+pq)+'</div>';
      if(reg.nota_no_hecho) partes+='<div class="fbl-nota">«'+esc(reg.nota_no_hecho)+'»</div>';
    }
    var lectura = reg.rpe!=null ? reg.rpe+' · '+palabraDe(PALABRA_RPE, reg.rpe)
                : (reg.sensacion_general!=null ? reg.sensacion_general+' · '+palabraDe(PALABRA_SENSA, reg.sensacion_general) : '');
    if(lectura) partes+='<div class="fbl-esf"><b>'+esc(lectura)+'</b></div>';
    var chips=trocear(reg.como_me_siento).map(function(c){ return '<span class="fbl-chip">'+esc(c)+'</span>'; });
    if(reg.rpe!=null && reg.sensacion_general!=null)
      chips.unshift('<span class="fbl-chip">'+esc(palabraDe(PALABRA_SENSA, reg.sensacion_general))+'</span>');
    /* Las molestias van aparte y en ámbar: es lo único de aquel día sobre lo
       que alguien puede tener que hacer algo. */
    trocear(reg.molestias).forEach(function(m){ chips.push('<span class="fbl-chip ojo">'+esc(m)+'</span>'); });
    if(chips.length) partes+='<div class="fbl-chips">'+chips.join('')+'</div>';
    if(reg.notas_atleta) partes+='<div class="fbl-nota">«'+esc(reg.notas_atleta)+'»</div>';
    var extra=[];
    if(reg.horas_sueno!=null) extra.push(String(reg.horas_sueno).replace('.',',')+' h de sueño');
    if(reg.peso_kg!=null) extra.push(String(reg.peso_kg).replace('.',',')+' kg');
    if(extra.length) partes+='<div class="fbl-extra">'+esc(extra.join(' · '))+'</div>';
    /* El pie: por un lado la salida —que hasta hoy no existía y dejaba un
       dato mal tecleado mal para siempre—, y por otro el rastro de las
       correcciones anteriores, si las hubo.
       La tarjeta se pinta AUNQUE aquel día no se contara nada: si no, un
       día en el que solo se marcaron las series se quedaría otra vez sin
       salida para corregir, que es justo lo que se viene a arreglar. */
    if(!partes) partes='<div class="fbl-extra">Ese día no contaste cómo te fue.</div>';
    var rastro='';
    if(reg.corregido_en){
      var veces=(reg.corregido_veces>1) ? ' ('+reg.corregido_veces+' veces)' : '';
      rastro='<span class="fbl-corr">Corregido el '+esc(fechaDiaMes(String(reg.corregido_en).slice(0,10)))+veces+'</span>';
    }
    partes+='<div class="fbl-pie">'+rastro+
      '<button type="button" class="fb-corregir">Corregir lo apuntado</button></div>';
    return '<div class="fb-leer"><div class="fbl-et">Cómo te fue</div>'+partes+'</div>';
  }

  /* Vuelca en los recuadros lo que ya está guardado de esa sesión: los valores,
     la unidad que se eligió y, sobre todo, el ✓ de cada serie. */
  function prefillTiempos(s){
    var reg=REG[s.id]; if(!reg||!reg.tiempos_reales) return;
    var caja=wrap.querySelector('.entreno-uno[data-sid="'+s.id+'"]'); if(!caja) return;
    var tr=reg.tiempos_reales;
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var fid=g.getAttribute('data-fid');
      var key=g.getAttribute('data-key');
      /* El id de la fila manda; la llave de posición es el respaldo para lo
         guardado antes de la migración 103. */
      var r=(fid&&tr[fid]) || (key&&tr[key]) || null;
      if(!r) return;
      var filas=g.querySelectorAll('.serie-hueco');
      filas.forEach(function(fila, i){
        var sr=(Array.isArray(r.series)&&r.series[i])||null;
        var viejo=(Array.isArray(r.tiempos)&&r.tiempos[i]!=null)?String(r.tiempos[i]).trim():'';
        fila.querySelectorAll('.serie-in').forEach(function(inp){
          var c=inp.getAttribute('data-c');
          if(sr && sr[c]!=null && sr[c]!=='') inp.value=sr[c];
          /* Registros viejos: solo había un tiempo por serie y ese es el valor
             del único campo que tenían. */
          else if(!sr && viejo && c==='tiempo') inp.value=viejo;
        });
        var ok=fila.querySelector('.s-ok');
        if(ok) ok.setAttribute('aria-pressed', (sr ? !!sr.hecha : !!viejo) ? 'true':'false');
      });
      /* La unidad que se usó aquel día, no la que se recuerda hoy: lo apuntado
         no se reinterpreta. */
      if(r.unidad) ponerUnidad(g, r.unidad, false);
      /* Y el «lo cambié por…», si lo había: al volver a abrir el
         entrenamiento tiene que seguir puesto y a la vista, no escondido
         detrás del enlace como si no se hubiera dicho nada. */
      var ejerP=g.closest('.ejer');
      var inP=ejerP?ejerP.querySelector('.cambio-in'):null;
      if(inP && r.cambiado_por){
        inP.value=r.cambiado_por;
        var cajaP=inP.closest('.cambio-caja'); if(cajaP) cajaP.hidden=false;
      }
    });
  }

  /* Cambia la unidad de un ejercicio de distancia. `recordar` es false cuando se
     está volcando lo ya guardado: entonces se enseña la unidad de aquel día sin
     cambiar la preferencia de hoy. */
  function ponerUnidad(g, u, recordar){
    if(!g) return;
    var cap=g.parentNode?g.parentNode.querySelector('.s-unis'):null;
    if(cap) cap.querySelectorAll('button').forEach(function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-uni')===u ? 'true':'false');
    });
    g.querySelectorAll('.s-u[data-u="distancia"]').forEach(function(e){ e.textContent=u; });
    if(recordar) recordarUnidad(u);
  }

  /* ¿Está marcada esta serie? El ✓ manda. */
  function serieHecha(fila){
    var ok=fila&&fila.querySelector('.s-ok');
    return !!(ok && ok.getAttribute('aria-pressed')==='true');
  }

  // Cuántas series lleva marcadas: en la cabecera de cada bloque y en cada ejercicio
  function progresoBloques(raiz){
    if(!raiz) return;
    raiz.querySelectorAll('.bloque').forEach(function(d){
      var et=d.querySelector('.bl-prog'); if(!et) return;
      var filas=d.querySelectorAll('.serie-hueco');
      if(!filas.length){ et.hidden=true; return; }
      var hechas=0; filas.forEach(function(f){ if(serieHecha(f)) hechas++; });
      var txt=hechas+' de '+filas.length+' hechas';
      et.hidden=false; et.textContent=txt; et.title=txt;
      et.classList.toggle('lleno', hechas===filas.length);
    });
    /* Cada repetición, en su estado: hecha (✓ y su diferencia), la que toca
       ahora (borde azul) y las que faltan, en discontinuo. */
    raiz.querySelectorAll('.serie-inputs').forEach(function(g){
      var filas=g.querySelectorAll('.serie-hueco'), hechas=0, primeraLibre=-1;
      var obj=tiempoANum(g.getAttribute('data-obj'));
      var esTiempo=(g.getAttribute('data-medida')||'tiempo')==='tiempo';
      filas.forEach(function(fila, i){
        if(serieHecha(fila)) hechas++; else if(primeraLibre<0) primeraLibre=i;
      });
      filas.forEach(function(fila, i){
        var hecha=serieHecha(fila);
        var actual=(i===primeraLibre);
        fila.classList.toggle('pendiente', !hecha && !actual);
        fila.classList.toggle('actual', actual && !hecha);
        fila.classList.toggle('hecha', hecha);
        /* EL «APUNTAR» SOLO EN EL HUECO ANCHO, QUE ES EL DEL TIEMPO.
           Todos los demás huecos miden 52 px fijos —a propósito, para que el
           «kg», el «m» o el «rep» queden PEGADOS al número— y ahí la palabra
           «apuntar» no cabe: se comía el hueco entero y quedaba pegada a la
           unidad, leyéndose «apuntaɪm». Parecía texto encima de texto.

           Antes la condición era «un solo campo», que es verdad tanto en el
           tiempo (ancho, cabe) como en la distancia y en las repeticiones
           (estrechos, no cabe). La condición buena es la medida, que es la
           que decide el ancho en el CSS. Donde no cabe ya lo dicen el borde
           azul y el título de arriba. */
        var campos=fila.querySelectorAll('.serie-in');
        var prim=campos[0];
        if(prim) prim.placeholder = (actual && esTiempo && campos.length===1) ? 'apuntar' : '';
        /* La diferencia solo se enseña si hay un objetivo de verdad calculado
           con tu mejor marca, y solo cuando lo que se apunta es un tiempo:
           comparar kilos con una marca de 400 m no significa nada. */
        var dif=fila.querySelector('.s-dif'); if(!dif) return;
        dif.className='s-dif'; dif.textContent='';
        if(!esTiempo || obj==null) return;
        var v=prim?prim.value.trim():''; if(!v) return;
        var t=tiempoANum(v); if(t==null || isNaN(t)) return;
        var d=t-obj;
        if(Math.abs(d)<0.005){ dif.textContent='='; return; }
        dif.textContent=(d<0?'−':'+')+segATexto(Math.abs(d));
        dif.classList.add(d<0?'mejora':'peor');
      });
      var c=g.parentNode.querySelector('.serie-cnt');
      if(c) c.textContent=hechas+' de '+filas.length;
      var ejer=g.closest('.ejer');
      if(ejer) ejer.classList.toggle('medias', hechas>0 && hechas<filas.length);
    });
    avisoNoHecho(raiz);
  }
