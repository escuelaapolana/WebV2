           entrenó—, pero se dicen aquí mismo, pegados a la cifra: «41 días» a
           secas, cuando ocho fueron a medias, miente hacia arriba, y ésa es la
           peor dirección. Así el número sigue siendo verdad y ya no engaña. */
        (r.medias>0 ? '<i class="hs-medias">'+(r.medias===1?'uno de ellos, a medias':r.medias+' de ellos, a medias')+'</i>' : '')+
      '</span></div>';
    if(r.deportes.length && r.total){
      html+='<div class="hs-barras">'+r.deportes.map(function(d){
        var pc=Math.round(d.n*100/r.total);
        return '<div class="hs-barra"><span class="hs-et">'+esc(d.nombre)+'</span>'+
          '<span class="hs-carril"><i style="width:'+Math.max(pc,2)+'%"></i></span>'+
          '<span class="hs-n">'+d.n+'</span></div>';
      }).join('')+'</div>';
    }
    if(r.conPapel){
      var ratio=r.carga/r.conPapel;
      var pcCarga=Math.round(ratio*100);
      var resto = r.suaves.length
        ? ' El resto, '+enumerar(r.suaves.slice(0,3).map(function(p){ return p.toLowerCase(); }))+'.'
        : '';
      html+='<div class="hs-split">'+
        '<span class="hs-sb" aria-hidden="true"><i class="carga" style="width:'+pcCarga+'%"></i>'+
        '<i class="suave" style="width:'+(100-pcCarga)+'%"></i></span>'+
        '<p class="hs-frase"><b>'+esc(fraseCarga(ratio))+'.</b>'+esc(resto)+'</p></div>';
    }
    html+='</div>';
    /* Se dice una vez, en pequeño y sin regañar: apuntarlo es lo que hace que
       el historial sirva de algo, y quien no lo ha hecho ya lo sabe. */
    if(r.sinApuntar>0){
      html+='<p class="hs-pie">'+esc(enPalabras(r.sinApuntar))+' '+(r.sinApuntar===1?'día':'días')+
        ' sin apuntar nada. Apuntarlo es lo que hace que esto sirva.</p>';
    }
    return html;
  }

  var MESES_TIT=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  function listaHistorialHTML(dias){
    var nom=['dom','lun','mar','mié','jue','vie','sáb'];
    var html='<div class="hs-lista">', mesActual='';
    // Cuántos días entrenados lleva cada mes, para el encabezado
    var porMes={};
    dias.forEach(function(d){
      var k=d.fecha.slice(0,7);
      if(!porMes[k]) porMes[k]=0;
      if(!d.descanso) porMes[k]++;
    });
    dias.forEach(function(d){
      var f=new Date(d.fecha+'T00:00:00'), k=d.fecha.slice(0,7);
      if(k!==mesActual){
        mesActual=k;
        html+='<div class="hs-mes">'+esc(MESES_TIT[f.getMonth()])+' · '+porMes[k]+' '+(porMes[k]===1?'día':'días')+'</div>';
      }
      var chips=d.deportes.map(function(x){ return '<span class="hd-chip">'+esc(x)+'</span>'; }).join('');
      /* El papel del día es lo que explica; el deporte solo clasifica. */
      var linea=[d.papel, d.texto].filter(Boolean).join(' · ') || 'Entrenamiento';
      html+='<button type="button" class="hs-dia'+(d.apuntado?'':' sin')+'" data-hist-dia="'+esc(d.fecha)+'">'+
        '<span class="hd-fecha"><b>'+f.getDate()+'</b><span>'+esc(nom[f.getDay()])+'</span></span>'+
        '<span class="hd-mid">'+(chips?'<span class="hd-chips">'+chips+'</span>':'')+
          '<span class="hd-papel">'+esc(linea)+'</span></span>'+
        '<span class="hd-punto" aria-hidden="true"><i></i></span>'+
        '<span class="hd-chev" aria-hidden="true">&rsaquo;</span></button>';
    });
    return html+'</div>';
  }

  async function pintarHistorial(){
    var cont=$('hist-cont');
    if(!HIST[HIST_PER] && !HIST_FALLO[HIST_PER]){
      cont.innerHTML='<div class="tarjeta">'+APOLANA_UI.cargando('filas',5)+'</div>';
      await cargarHistorial(HIST_PER);
      if(MODO!=='historial') return;             /* se ha ido a otro sitio mientras cargaba */
    }
    if(HIST_FALLO[HIST_PER]){
      cont.innerHTML='<div class="tarjeta">'+htmlError('No hemos podido cargar tu historial',
        'Puede ser tu conexión. No se ha perdido nada: tus entrenamientos y lo que apuntaste siguen ahí.',
        async function(){ delete HIST_FALLO[HIST_PER]; await pintarHistorial(); })+'</div>';
      return;
    }
    var dias=HIST[HIST_PER]||[];
    if(!dias.length){
      cont.innerHTML='<div class="tarjeta">'+APOLANA_UI.vacio('Todavía no hay historial que mirar',
        'En cuanto entrenes unos cuantos días aparecerán aquí, agrupados por mes, con lo que hiciste y lo que apuntaste.')+'</div>';
      return;
    }
    cont.innerHTML=resumenHTML(resumenHistorial(dias))+listaHistorialHTML(dias);
  }

  /* El conmutador. «Sesión de hoy» y «Mi semana» comparten la tira de días;
     en el historial la tira desaparece porque allí se navega por meses. */
  function pintarModo(diaEntrando){
    var conm=$('ent-conm');
    if(conm) conm.querySelectorAll('.cm').forEach(function(b){
      b.setAttribute('aria-selected', b.getAttribute('data-modo')===MODO ? 'true' : 'false');
    });
    /* La primera pestaña dice QUÉ DÍA estás haciendo, no siempre «hoy».
       Desde que se entra directo desde el inicio, aquí se puede estar en el
       jueves que viene, y llamarlo «Sesión de hoy» era mentir en la única
       palabra de la pantalla que dice dónde estás. */
    var pest = conm && conm.querySelector('.cm[data-modo="hoy"]');
    if(pest){
      /* Fuera de este modo la pestaña vuelve a decir «Sesión de hoy», que es
         a donde lleva: pulsarla te devuelve a hoy, así que tiene que
         prometer hoy. */
      var d = (MODO==='hoy') ? (diaEntrando || diaSel || todayISO) : todayISO;
      /* «7 ago» y no «7 de agosto»: son tres pestañas en un móvil de 375 px
         y la larga las parte en dos líneas. */
      pest.textContent = (d===todayISO) ? 'Sesión de hoy' : fechaCorta(d);
    }
    /* ⚠️ EN «Sesión de hoy» NO HAY CALENDARIO. Es todo el cambio: el
       calendario vive en el inicio, con sus flechas de semana, y aquí se
       viene a hacer el entrenamiento que ya elegiste. Quien quiera la
       rejilla la tiene en «Mi semana», que es su sitio. */
    $('ent-semana').hidden   = (MODO!=='semana');
    $('entreno-cont').hidden = (MODO==='historial');
    $('hist-cont').hidden    = (MODO!=='historial');
    var cab=$('sem-cab'); if(cab) cab.hidden = (MODO!=='semana');
    var rango=$('sem-rango'); if(rango) rango.hidden = (MODO!=='semana');
    var flechas=$('tb-flechas'); if(flechas && MODO==='historial') flechas.innerHTML='';
  }
  function activarModo(modo){
    MODO=modo;
    /* Pulsar la pestaña te lleva a HOY, así que la etiqueta se pone en hoy
       antes de que `pintarDia` mueva el día: si se dejara a `diaSel`, la
       pestaña se quedaría un instante con la fecha de la que vienes. */
    pintarModo(todayISO);
    if(modo==='historial'){ pintarHistorial(); return; }
    if(modo==='hoy' && diaSel!==todayISO){
      if(lunesVis===lunesHoy) pintarDia(todayISO); else irSemana(lunesHoy, todayISO);
    } else if(diaSel){
      vecinosDe(diaSel).then(function(v){ pintarFlechas(diaSel, v); });
    }
  }

  // Abrir un día del historial: se pasa a «Mi semana», que es donde vive el detalle
  async function abrirDiaHistorial(iso){
    activarModo('semana');
    if(lunesDe(iso)===lunesVis) pintarDia(iso); else await irSemana(lunesDe(iso), iso);
    window.scrollTo(0,0);
  }

  // Un único manejador para toda la sección: al repintar no se duplican los clics
  $('sec-entreno').addEventListener('click', async function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var cm=t.closest('.conm .cm');
    if(cm){ activarModo(cm.getAttribute('data-modo')); return; }
    var hd=t.closest('[data-hist-dia]');
    if(hd){ abrirDiaHistorial(hd.getAttribute('data-hist-dia')); return; }
    var camb=t.closest('#hs-cambiar');
    var op=$('hs-opts');
    if(camb){
      if(!op) return;
      op.hidden=!op.hidden;
      camb.setAttribute('aria-expanded', op.hidden?'false':'true');
      return;
    }
    var per=t.closest('#hs-opts [data-per]');
    if(per){ HIST_PER=per.getAttribute('data-per'); pintarHistorial(); return; }
    /* Tocar fuera cierra el desplegable del periodo: si no, se queda abierto
       tapando la primera fila de la lista. */
    if(op && !op.hidden){
      op.hidden=true;
      var bc=$('hs-cambiar'); if(bc) bc.setAttribute('aria-expanded','false');
    }
    var irDia=t.closest('[data-ir-dia]');
    if(irDia && irDia.getAttribute('data-ir-dia')){ abrirDiaHistorial(irDia.getAttribute('data-ir-dia')); return; }
    var dia=t.closest('.dia');
    /* Tocar un día de la tira desde «Sesión de hoy» es ya moverse por la
       semana: el conmutador se pone donde de verdad estás. */
    if(dia){
      if(MODO==='hoy') activarModo('semana');
      pintarDia(dia.getAttribute('data-dia'));
      return;
    }
    /* «Corregir lo apuntado»: abre otra vez el día que ya estaba cerrado.
       No borra nada —lo que había se vuelve a volcar en los huecos— y al
       guardar la base deja constancia de que se corrigió (migración 104). */
    var corr=t.closest('.fb-corregir');
    if(corr){
      var cajaCo=corr.closest('.entreno-uno');
      var sidCo=cajaCo&&cajaCo.getAttribute('data-sid');
      if(sidCo){ CORRIGIENDO[sidCo]=true; pintarDia(diaSel); }
      return;
    }
    /* «Mandarlo a Strava»: enriquece la actividad que ya subió el reloj.
       Se hace a mano y no solo al guardar, a propósito: cuando acabas de
       entrenar el reloj todavía no ha sincronizado, así que un envío
       automático fallaría casi siempre y en silencio. */
    var stv=t.closest('.fb-strava');
    if(stv){
      var msgSt=stv.parentNode.querySelector('.fbs-msg');
      var sidSt=stv.getAttribute('data-sid'), diaSt=stv.getAttribute('data-dia');
      var sSt=(SEM[lunesVis]||[]).filter(function(x){ return x.id===sidSt; })[0];
      if(!sSt) return;
      stv.disabled=true; msgSt.textContent='Buscando tu actividad…'; msgSt.className='fbs-msg';
      try {
        var envio=await sb.functions.invoke('strava', { body:{
          accion:'enviar', dia:diaSt,
          titulo: tituloSesion(sSt),
          descripcion: stravaTextoDe(sSt)
        }});
        if(envio.error){
          var det=null; try { det=await envio.error.context.json(); } catch(e){}
          throw new Error((det&&det.mensaje)||envio.error.message||'no ha salido');
        }
        var nom=(envio.data&&envio.data.actividad&&envio.data.actividad.nombre)||'';
        msgSt.textContent='Hecho'+(nom?' · «'+nom+'»':'')+'. Ya está en tu Strava.';
        msgSt.className='fbs-msg ok';
      } catch(e){
        msgSt.textContent=e.message||'No se ha podido mandar.';
        msgSt.className='fbs-msg fallo';
        stv.disabled=false;
      }
      return;
    }
    /* «Lo cambié»: abre el campo de texto libre y lleva el foco dentro, que si
       no hay que dar un segundo toque para escribir. */
    var abreCambio=t.closest('.cambio-btn');
    if(abreCambio){
      var ejer=abreCambio.closest('.ejer');
      var cajaC=ejer&&ejer.querySelector('.cambio-caja');
      if(cajaC){
        cajaC.hidden=false;
        var inC=cajaC.querySelector('.cambio-in');
        if(inC){ inC.focus(); inC.setSelectionRange(inC.value.length, inC.value.length); }
      }
      return;
    }
    /* «Listo»: se queda lo escrito, esté o no en el catálogo. Es el gesto que
       hace verdad lo de «escribir siempre gana». */
    var listo=t.closest('.cambio-listo');
    if(listo){ cerrarCambio(listo.closest('.ejer')); return; }
    /* Una sugerencia. En `mousedown` no hace falta: el campo no se cierra al
       perder el foco, así que aquí llega el click de siempre. */
    var sug=t.closest('.sug-it');
    if(sug){
      var cajaS=sug.closest('.cambio-caja');
      var inS=cajaS?cajaS.querySelector('.cambio-in'):null;
      if(inS){ inS.value=sug.getAttribute('data-nom')||''; }
      cerrarCambio(sug.closest('.ejer'));
      return;
    }
    /* «Guardar» del banco: añade el ejercicio al catálogo del club para que la
       próxima vez salga solo. Si el ejercicio no se guarda, lo apuntado sigue
       igual: esto es un atajo para el futuro, no un requisito de hoy. */
    var bnc=t.closest('.bn-guardar');
    if(bnc){ guardarEnBanco(bnc); return; }
    /* El ✓, que solo existe donde no hay ningún número que apuntar */
    var ok=t.closest('.s-ok');
    if(ok){
      var puesto=ok.getAttribute('aria-pressed')==='true';
      ok.setAttribute('aria-pressed', puesto?'false':'true');
      var cajaOk=t.closest('.entreno-uno');
      progresoBloques(cajaOk); marcarSucio(cajaOk);
      return;
    }
    /* La casilla del RIR: abre su propio teclado de 0 a 4 más «5+». No el
       teclado numérico del sistema, que tapa media pantalla y es lento para
       un dígito que además solo puede ser uno de seis. */
    var rirC=t.closest('.rir-cel');
    if(rirC){ abrirTecladoRir(rirC); return; }
    var rirB=t.closest('.rir-tec button');
    if(rirB){
      var pan=rirB.closest('.rir-tec');
      var destino=pan&&pan.__cel;
      if(destino) ponerRir(destino, rirB.getAttribute('data-v')||'');
      cerrarTecladoRir(pan);
      var cajaRir=t.closest('.entreno-uno');
      progresoBloques(cajaRir); marcarSucio(cajaRir);
      return;
    }
    /* «Metros / km»: cambia la unidad del EJERCICIO entero, no de una casilla.
       Se recuerda para la próxima, así que quien hace siempre series no la
       toca nunca. */
    var uni=t.closest('.ej-uni');
    if(uni){
      var insU=uni.closest('.ejer').querySelector('.serie-inputs');
      ponerUnidad(insU, uni.getAttribute('data-uni'), true);
      marcarSucio(t.closest('.entreno-uno'));
      return;
    }
    /* «+ Serie»: una serie de más, con las mismas columnas. Se hicieron cuatro
       y el plan decía tres, y eso también es un dato. */
    var masS=t.closest('.ej-mas-serie');
    if(masS){
      var gM=masS.closest('.ejer').querySelector('.serie-inputs');
      var todasM=gM?gM.querySelectorAll('.ej-fila'):[];
      var ultF=todasM.length?todasM[todasM.length-1]:null;
      if(ultF){
        var nueva=ultF.cloneNode(true);
        nueva.querySelectorAll('input.s-cel').forEach(function(i){ i.value=''; i.removeAttribute('data-tocado'); });
        var rc=nueva.querySelector('.rir-cel'); if(rc) ponerRir(rc, '');
        nueva.removeAttribute('data-hecha');
        var cuantas=gM.querySelectorAll('.ej-fila').length;
        nueva.setAttribute('data-i', cuantas);
        var num=nueva.querySelector('.s-n'); if(num) num.textContent=cuantas+1;
        gM.appendChild(nueva);
        verMenosSerie(gM);
        var cajaM=t.closest('.entreno-uno');
        progresoBloques(cajaM); marcarSucio(cajaM);
      }
      return;
    }
    /* «− Serie»: quita la última, y SOLO si la añadió el atleta. Si tenía algo
       escrito se pregunta antes: es trabajo suyo y no se tira sin avisar. */
    var menosS=t.closest('.ej-menos-serie');
    if(menosS){
      var gQ=menosS.closest('.ejer').querySelector('.serie-inputs');
      if(!gQ) return;
      var filasQ=gQ.querySelectorAll('.ej-fila');
      var mandadas=parseInt(gQ.getAttribute('data-mandadas'),10)||0;
      if(filasQ.length<=mandadas) return;         /* no se toca lo del entrenador */
      var ultima=filasQ[filasQ.length-1];
      var escrito=[].some.call(ultima.querySelectorAll('input.s-cel'), function(i){ return String(i.value||'').trim(); });
      if(escrito && !await apoConfirm({
            titulo:'Quitar la serie '+filasQ.length,
            texto:'Esta serie tiene algo apuntado. Si la quitas, se pierde lo que hayas escrito en ella.',
            confirmar:'Quitarla', peligro:true })) return;
      ultima.remove();
      verMenosSerie(gQ);
      var cajaQ=t.closest('.entreno-uno');
      progresoBloques(cajaQ); marcarSucio(cajaQ);
      return;
    }
    /* «Apuntar solo el total»: ocho de 50 son ocho filas y nadie sale del agua
       a rellenar ocho. Las demás se dan por hechas porque lo dice el atleta al
       pulsar aquí, no porque lo suponga la pantalla. */
    var sol=t.closest('.ej-solo-total');
    if(sol){
      var ejT=sol.closest('.ejer'), gT=ejT.querySelector('.serie-inputs');
      var filasT=gT.querySelectorAll('.ej-fila');
      filasT.forEach(function(fila, i){
        if(i===0) return;
        fila.hidden=true; fila.setAttribute('data-hecha','1');
      });
      gT.setAttribute('data-total','1');
      var pieT=ejT.querySelector('.ej-total');
      if(pieT) pieT.innerHTML='Apuntas solo el total de las '+filasT.length+' series · '+
        '<button type="button" class="ej-una-a-una">volver a apuntarlas una a una</button>';
      var cajaT=t.closest('.entreno-uno');
      progresoBloques(cajaT); marcarSucio(cajaT);
      return;
    }
    var unaU=t.closest('.ej-una-a-una');
    if(unaU){
      var ejU=unaU.closest('.ejer'), gU=ejU.querySelector('.serie-inputs');
      gU.removeAttribute('data-total');
      gU.querySelectorAll('.ej-fila').forEach(function(fila){ fila.hidden=false; fila.removeAttribute('data-hecha'); });
      var nU=gU.querySelectorAll('.ej-fila').length;
      var pieU=ejU.querySelector('.ej-total');
      if(pieU) pieU.innerHTML='Quedan '+(nU-1)+' series · <button type="button" class="ej-solo-total">apuntar solo el total</button>';
      var cajaU=t.closest('.entreno-uno');
      progresoBloques(cajaU); marcarSucio(cajaU);
      return;
    }
    /* El material de natación: se pone una vez para las ocho series. La lista
       es la misma que usa el entrenador al planificar. */
    var matP=t.closest('.mat-op');
    if(matP){ elegirMaterial(matP); return; }
    var matB=t.closest('.mat-mas');
    if(matB){ abrirMaterial(matB); return; }
    /* «+ Añadir un ejercicio»: lo que hizo y nadie le había puesto */
    var anadir=t.closest('.ej-anadir');
    if(anadir){ anadirEjercicio(anadir); return; }
    /* «Quitar», solo en los que ha añadido él. Lo que mandó el entrenador no
       se quita: si no se hizo, se deja sin apuntar y eso ya lo dice todo. */
    var quitar=t.closest('.ej-quitar');
    if(quitar){ quitarEjercicio(quitar); return; }
    /* Por qué se quedó a medias. Si es «me molestaba», se abren las molestias
       de siempre y se lleva ahí el foco: esa información ya tiene su sitio y no
       se guarda dos veces. */
    var mot=t.closest('.nh-motivos [data-motivo]');
    if(mot){
      var panel=mot.closest('[data-nh]');
      var k=mot.getAttribute('data-motivo');
      var yaSel=mot.getAttribute('aria-pressed')==='true';
      panel.querySelectorAll('[data-motivo]').forEach(function(b){ b.setAttribute('aria-pressed','false'); });
      if(!yaSel) mot.setAttribute('aria-pressed','true');
      panel.setAttribute('data-motivo', yaSel?'':k);
      var nt=panel.querySelector('.nh-nota'); if(nt) nt.hidden=yaSel;
      if(!yaSel && k==='molestia'){
        var tarjeta=mot.closest('.fb-card');
        var det=tarjeta&&tarjeta.querySelector('.fb-detalles');
        var bot=tarjeta&&tarjeta.querySelector('.fb-mas');
        if(det&&det.hidden&&bot){ det.hidden=false; bot.classList.add('abierto'); bot.setAttribute('aria-expanded','true'); }
        var mm=tarjeta&&tarjeta.querySelector('.fb-molestias');
        if(mm){ mm.scrollIntoView({block:'center'}); mm.focus(); }
      }
      marcarSucio(t.closest('.entreno-uno'));
      return;
    }
    // Ficha del 1 al 10: marca la elegida y la escribe en su campo oculto
    var esc10=t.closest('.esc');
    if(esc10){
      var grupo=esc10.parentNode, destino=esc10.getAttribute('data-esc'), v=esc10.getAttribute('data-v');
      var ya=esc10.classList.contains('sel');
      grupo.querySelectorAll('.esc').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-pressed','false'); });
      if(!ya){ esc10.classList.add('sel'); esc10.setAttribute('aria-pressed','true'); }
      var campo=grupo.parentNode.querySelector('.'+destino);
      if(campo) campo.value = ya ? '' : v;
      marcarSucio(t.closest('.entreno-uno'));
      return;
    }
    var mas=t.closest('.fb-mas');
    if(mas){
      var det=mas.parentNode.querySelector('.fb-detalles');
      if(det){ det.hidden=!det.hidden; mas.classList.toggle('abierto',!det.hidden); mas.setAttribute('aria-expanded', det.hidden?'false':'true'); }
      return;
    }
    var btn=t.closest('.fb-guardar');
    if(btn) guardarFeedback(btn);
  });

  // El acordeón: 'toggle' no burbujea, por eso se escucha en fase de captura
  $('sec-entreno').addEventListener('toggle', function(ev){
    var d=ev.target;
    if(!d || !d.classList || !d.classList.contains('bloque')) return;
    recordarBloques(d.closest('.entreno-uno'));
  }, true);

  /* Al escribir: la casilla deja de estar en gris —lo que hay dentro ya lo ha
     puesto el atleta y no la app—, se recalcula el arrastre de la siguiente y
     se avisa de que falta guardar. */
  $('sec-entreno').addEventListener('input', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var caja=t.closest('.entreno-uno'); if(!caja) return;
    if(t.classList.contains('s-cel')){
      if(String(t.value||'').trim()) t.setAttribute('data-tocado','1');
      else t.removeAttribute('data-tocado');
      t.classList.remove('arrastre');
      progresoBloques(caja);
    }
    if(t.classList.contains('cambio-in')) pintarSugerencias(t);
    marcarSucio(caja);
  });
  /* Enter en el campo del ejercicio = «Listo». Escribir «zancada patinador» y
     darle a intro tiene que funcionar sin tocar ninguna sugerencia. */
  $('sec-entreno').addEventListener('keydown', function(ev){
    var t=ev.target;
    if(!t || !t.classList || !t.classList.contains('cambio-in')) return;
    if(ev.key==='Enter'){ ev.preventDefault(); cerrarCambio(t.closest('.ejer')); }
  });

  /* ============================================================
     EL RIR, SERIE A SERIE, CON SU PROPIO TECLADO
     ============================================================ */
  function ponerRir(cel, v){
    if(!cel) return;
    v=String(v==null?'':v).trim();
    cel.setAttribute('data-v', v);
    /* Vacío es «—» y nunca un cero: cero significa «al fallo» y es un dato
       distinto de no haberlo puesto. */
    cel.textContent = v || '—';
    cel.classList.toggle('vacia', !v);
    if(v) cel.setAttribute('data-tocado','1'); else cel.removeAttribute('data-tocado');
  }
  function cerrarTecladoRir(pan){
    if(!pan) return;
    if(pan.__cel) pan.__cel.setAttribute('aria-expanded','false');
    pan.parentNode.removeChild(pan);
  }
  function abrirTecladoRir(cel){
    var ejer=cel.closest('.ejer');
    var abierto=ejer.querySelector('.rir-tec');
    var mismo = abierto && abierto.__cel===cel;
    if(abierto) cerrarTecladoRir(abierto);
    if(mismo) return;
    var pan=document.createElement('div');
    pan.className='rir-tec';
    pan.innerHTML='<span class="rt-et">¿Cuántas repeticiones te sobraron en esta serie?</span>'+
      ['0','1','2','3','4','5+'].map(function(v){
        return '<button type="button" data-v="'+v+'">'+v+'</button>';
      }).join('')+
      '<button type="button" class="borrar" data-v="">Dejarlo sin apuntar</button>';
    pan.__cel=cel;
    var fila=cel.closest('.ej-fila');
    fila.parentNode.insertBefore(pan, fila.nextSibling);
    cel.setAttribute('aria-expanded','true');
  }

  /* ============================================================
     EL CATÁLOGO DEL CLUB Y LAS SUGERENCIAS
     ------------------------------------------------------------
     Se pide UNA vez y solo la primera vez que alguien abre el campo:
     son doscientos nombres y no tienen por qué viajar en la carga de
     una pantalla que la mayoría de los días no los necesita.
     ============================================================ */
  var EJERCICIOS=null, EJ_PROM=null;
  function cargarEjercicios(){
    if(!EJ_PROM){
      EJ_PROM = sb.from('ejercicios').select('nombre,tipo,categoria').eq('activo',true)
                  .order('nombre').limit(400)
                  .then(function(r){ EJERCICIOS = (!r.error && r.data) ? r.data : []; return EJERCICIOS; })
                  .catch(function(){ EJERCICIOS=[]; return EJERCICIOS; });
    }
    return EJ_PROM;
  }
  /* Qué parte del catálogo pinta cada bloque. Con lo que hay hoy en la base se
     filtra por el TIPO (gimnasio o pista), que es lo que existe: el club
     todavía no ha etiquetado los ejercicios por grupo muscular (tren inferior,
     superior, core), y en cuanto lo haga este es el sitio donde afinarlo. */
  function tipoDeMedida(clave){
    return (clave==='peso_reps'||clave==='peso'||clave==='reps') ? 'gym' : 'pista';
  }
  function topeSug(nom){
    var k=claveEjercicio(nom);
    if(RM[k] && RM[k].kg>0) return 'tope '+comaDecimal(String(RM[k].kg));
    if(TOPE_REPS[k]>0) return 'tope '+TOPE_REPS[k];
    return '';
  }
  // La parte escrita, en negrita, dentro del nombre completo
  function resaltar(nom, txt){
    var i=claveEjercicio(nom).indexOf(claveEjercicio(txt));
    if(i<0 || !txt) return esc(nom);
    return esc(nom.slice(0,i))+'<b>'+esc(nom.slice(i, i+txt.length))+'</b>'+esc(nom.slice(i+txt.length));
  }
  function pintarSugerencias(inp){
    var ejer=inp.closest('.ejer');
    var caja=ejer.querySelector('.sug-caja'); if(!caja) return;
    var txt=String(inp.value||'').trim();
    /* A partir de DOS letras. Con una sola salen ciento y pico nombres, que es
       la lista larga que se venía a quitar. */
    if(txt.length<2){ caja.innerHTML=''; return; }
    if(EJERCICIOS===null){ cargarEjercicios().then(function(){ pintarSugerencias(inp); }); return; }
    var k=claveEjercicio(txt);
    var g=ejer.querySelector('.serie-inputs');
    var tipo=tipoDeMedida(g?g.getAttribute('data-medida'):'');
    var bl=ejer.closest('.bloque');
    var nomBloque=bl?String((bl.querySelector('.bl-tit')||{}).textContent||'').trim().toLowerCase():'';

    /* PRIMERO LOS TUYOS, y con tu tope al lado. El orden es lo que hace que no
       haga falta recorrer doscientos nombres: lo que ya haces cabe en dos
       líneas y es lo que se repite semana tras semana. */
    var mios=[], vistos={};
    Object.keys(ULTIMA_EJ).concat(Object.keys(RM)).forEach(function(c){
      if(vistos[c] || c.indexOf(k)<0) return;
      vistos[c]=1;
      var nom=(ULTIMA_EJ[c]&&ULTIMA_EJ[c].nom) || (RM[c]&&RM[c].nom) || '';
      if(nom) mios.push(nom);
    });
    var cat=(EJERCICIOS||[]).filter(function(e){
      return e.nombre && claveEjercicio(e.nombre).indexOf(k)>-1 &&
             !vistos[claveEjercicio(e.nombre)] && (!e.tipo || e.tipo===tipo || tipo==='pista');
    }).slice(0,8);

    var html='';
    if(mios.length){
      html+='<div class="sug-grupo">Los que ya haces</div>';
      html+=mios.slice(0,5).map(function(nom){
        var tp=topeSug(nom);
        return '<button type="button" class="sug-it" data-nom="'+escA(nom)+'">'+
          '<span class="sug-nom">'+resaltar(nom, txt)+'</span>'+
          (tp?'<span class="sug-tope">'+esc(tp)+'</span>':'')+'</button>';
      }).join('');
    }
    if(cat.length){
      html+='<div class="sug-grupo">Del catálogo del club'+(nomBloque?' · '+esc(nomBloque):'')+'</div>';
      html+=cat.map(function(e){
        return '<button type="button" class="sug-it" data-nom="'+escA(e.nombre)+'">'+
          '<span class="sug-nom">'+resaltar(e.nombre, txt)+'</span></button>';
      }).join('');
    }
    /* La frase del pie es la que garantiza que escribir gana. Sin ella, la
       lista parece obligatoria. */
    caja.innerHTML = (html?'<div class="sug-lista">'+html+'</div>':'')+
      '<div class="sug-pie">Si no es ninguno, sigue escribiendo y pulsa <b>Listo</b>: se guarda tal cual.</div>';
  }

  /* Se cierra el campo: manda lo escrito, esté en el catálogo o no. Y solo
     entonces —después de apuntarlo, nunca antes— se ofrece guardarlo. */
  function cerrarCambio(ejer){
    if(!ejer) return;
    var caja=ejer.querySelector('.cambio-caja');
    var inp=caja?caja.querySelector('.cambio-in'):null;
    var txt=inp?String(inp.value||'').trim():'';
    var sug=ejer.querySelector('.sug-caja'); if(sug) sug.innerHTML='';
    if(caja) caja.hidden=true;
    /* El título de la tarjeta pasa a ser lo que se hizo de verdad, con lo que
       tocaba tachado arriba: eso es lo que hace que el historial diga
       dominadas y no jalón al pecho. */
    var g=ejer.querySelector('.serie-inputs');
    var mandado=g?(g.getAttribute('data-eje')||''):'';
    var esExtra=ejer.getAttribute('data-extra')==='1';
    var nom=ejer.querySelector('.ej-nom');
    var band=ejer.querySelector('.ej-band');
    /* Un ejercicio añadido sin nombre no es nada: si se deja en blanco y no
       llegó a guardarse nunca, se va y no deja rastro. Si ya estaba guardado,
       se marca para que la base lo borre, como el botón «Quitar». */
    if(esExtra && !txt){
      var cajaX=ejer.closest('.entreno-uno');
      if(g && g.querySelector('[data-tocado="1"]')) { g.setAttribute('data-quitado','1'); ejer.hidden=true; }
      else ejer.parentNode.removeChild(ejer);
      progresoBloques(cajaX); marcarSucio(cajaX);
      return;
    }
    if(txt){
      if(nom) nom.textContent=primeraParte(txt);
      var pq=segundaParte(txt);
      /* En uno añadido no hay banda: no había nada puesto que cambiar */
      if(!esExtra){
        if(!band){
          band=document.createElement('div');
          band.className='ej-band';
          ejer.insertBefore(band, ejer.firstChild);
        }
        band.innerHTML='<span class="eb-et">Lo cambié</span><span class="eb-txt">tocaba <s>'+esc(mandado)+'</s></span>';
      }
      var ctx=ejer.querySelector('.ej-motivo');
      if(pq){
        if(!ctx){ ctx=document.createElement('span'); ctx.className='ej-plan ej-motivo';
                  ejer.querySelector('.ej-txt').appendChild(ctx); }
        ctx.textContent=pq;
      } else if(ctx){ ctx.parentNode.removeChild(ctx); }
      /* Y AHORA, no antes: la franja del banco solo aparece cuando el
         ejercicio ya está apuntado. Antes sería pedirle una decisión a alguien
         que todavía está escribiendo. */
      cargarEjercicios().then(function(){ pintarBanco(ejer, txt); });
    } else {
      if(nom) nom.textContent=mandado;
      if(band) band.parentNode.removeChild(band);
      var ctx0=ejer.querySelector('.ej-motivo'); if(ctx0) ctx0.parentNode.removeChild(ctx0);
      pintarBanco(ejer, '');
    }
    marcarSucio(ejer.closest('.entreno-uno'));
  }

  /* ------------------------------------------------------------
     AÑADIR AL BANCO · pieza 3
     Solo si el nombre no está ya en el catálogo. Y el botón solo se
     le ofrece a quien de verdad puede añadirlo: en la base el
     catálogo lo abre el equipo técnico (migración 107), y el club
     todavía no ha decidido quién aprueba lo que entra. A los demás
     se les dice la verdad en una línea, que es lo único que hace
     falta: lo apuntado se guarda igual.
     ------------------------------------------------------------ */
  var PUEDE_BANCO = ['admin','coordinador','entrenador','tesoreria','contabilidad','junta']
                      .indexOf(String((perfil&&(perfil.rol_activo||perfil.rol))||''))>-1;
  function pintarBanco(ejer, txt){
    var caja=ejer.querySelector('.ej-banco'); if(!caja) return;
    var nom=primeraParte(txt);
    var yaEsta = nom && (EJERCICIOS||[]).some(function(e){ return claveEjercicio(e.nombre)===claveEjercicio(nom); });
    if(!nom || nom.length<3 || yaEsta){ caja.hidden=true; caja.innerHTML=''; return; }
    caja.hidden=false;
    caja.innerHTML='<div class="bn-franja">'+
      '<span class="bn-txt">«'+esc(nom)+'» no está en el catálogo.</span>'+
      (PUEDE_BANCO
        ? '<button type="button" class="bn-guardar" data-nom="'+escA(nom)+'" data-tipo="'+
          escA(tipoDeMedida((ejer.querySelector('.serie-inputs')||{getAttribute:function(){return '';}}).getAttribute('data-medida')))+
          '">Guardar</button>'
        : '')+
      '</div>'+
      '<div class="bn-pie">'+(PUEDE_BANCO
        ? 'Si no lo guardas, el ejercicio se apunta igual. Solo es para que la próxima vez salga solo.'
        : 'El ejercicio se apunta igual. Si quieres que la próxima vez salga solo, díselo a tu entrenador y lo añade al catálogo.')+
      '</div>';
  }
  async function guardarEnBanco(btn){
    var nom=btn.getAttribute('data-nom')||'';
    var tipo=btn.getAttribute('data-tipo')||'gym';
    var pie=btn.closest('.ej-banco').querySelector('.bn-pie');
    btn.disabled=true; btn.textContent='Guardando…';
    var r=await sb.from('ejercicios').insert({ nombre: nom, tipo: tipo, creado_por: perfil.id });
    if(r.error){
      btn.disabled=false; btn.textContent='Guardar';
      if(pie) pie.textContent='No se ha podido guardar en el catálogo. El ejercicio se apunta igual.';
      return;
    }
    if(EJERCICIOS) EJERCICIOS.push({ nombre: nom, tipo: tipo, categoria:null });
    btn.textContent='Guardado';
    if(pie) pie.textContent='La próxima vez saldrá solo.';
  }

  /* ============================================================
     AÑADIR Y QUITAR UN EJERCICIO DE LOS TUYOS
     ============================================================ */
  function anadirEjercicio(btn){
    var bl=btn.closest('.bloque');
    var caja=btn.closest('.entreno-uno');
    var sid=caja?caja.getAttribute('data-sid'):null;
    var s=null;
    (sesionesDe(diaSel)||[]).forEach(function(x){ if(x.id===sid) s=x; });
    if(!s) return;
    var med=medidaDelBloque(bl, s);
    var html=filaHTML({ ejercicio:'', series:1 }, claveExtra(), disciplinaDe(s), false, null, s, med, true);
    var tmp=document.createElement('div');
    tmp.innerHTML=html;
    var tarjeta=tmp.firstChild;
    btn.parentNode.insertBefore(tarjeta, btn);
    /* En qué bloque se puso, para que mañana vuelva a su sitio */
    var g=tarjeta.querySelector('.serie-inputs');
    if(g) g.setAttribute('data-bloque', btn.getAttribute('data-bloque')||'0');
    /* El foco va al nombre: es lo primero y lo único que hay que escribir */
    var inp=tarjeta.querySelector('.cambio-in');
    if(inp) inp.focus();
    progresoBloques(caja); marcarSucio(caja);
  }
  function quitarEjercicio(btn){
    var ejer=btn.closest('.ejer'), caja=btn.closest('.entreno-uno');
    var g=ejer?ejer.querySelector('.serie-inputs'):null;
    /* Si ya estaba guardado hay que decirle a la base que lo borre, y eso se
       hace mandándolo en blanco (migración 111). Por eso no se quita del todo
       de la pantalla: se esconde y se marca. Si nunca llegó a guardarse, el
       blanco no le hace nada a nadie. */
    if(g){ g.setAttribute('data-quitado','1'); }
    ejer.hidden=true;
    progresoBloques(caja); marcarSucio(caja);
  }

  /* El material de natación: se pone una vez para las ocho series */
  function abrirMaterial(btn){
    var caja=btn.parentNode;
    if(caja.querySelector('.mat-op')){
      caja.querySelectorAll('.mat-op').forEach(function(o){ o.parentNode.removeChild(o); });
      return;
    }
    var puestos={};
    caja.querySelectorAll('.mat').forEach(function(m){ puestos[m.textContent.trim()]=1; });
    MATERIAL.forEach(function(m){
      if(puestos[m]) return;
      var b=document.createElement('button');
      b.type='button'; b.className='mat-mas mat-op'; b.textContent=m;
      caja.appendChild(b);
    });
  }
  function elegirMaterial(op){
    var caja=op.parentNode, nom=op.textContent.trim();
    var chip=document.createElement('span');
    chip.className='mat'; chip.textContent=nom;
    caja.insertBefore(chip, caja.querySelector('.mat-mas'));
    caja.querySelectorAll('.mat-op').forEach(function(o){ o.parentNode.removeChild(o); });
    marcarSucio(op.closest('.entreno-uno'));
  }

  // ---------- guardar sensaciones + tiempos de la sesión que se está viendo ----------
  async function guardarFeedback(btn){
    var caja=btn.closest('.entreno-uno'); if(!caja) return;
    var sid=caja.getAttribute('data-sid');
    var msg=caja.querySelector('.fb-msg'); msg.textContent='Guardando…'; msg.className='msg fb-msg';
    function val(sel){ var e=caja.querySelector(sel); return e?e.value:''; }
    var D=DESC();
    /* ------------------------------------------------------------
       LO QUE SE APUNTÓ DE CADA EJERCICIO
       ------------------------------------------------------------
       LA LLAVE ES EL ID DE LA FILA (migración 103), no su posición: así lo que
       marcó el atleta sigue pegado a SU ejercicio aunque el entrenador reordene
       el entrenamiento o meta otro en medio. Solo se cae a la llave de posición
       cuando la fila todavía no tiene id.

       Y SE MANDA EL EJERCICIO ENTERO AUNQUE NO SE HAYA TOCADO NADA: si no, un
       ejercicio que no se hizo desaparecería del registro y se perdería justo
       lo que el club quiere saber, que estaba puesto y no se hizo. Marcar sí,
       borrar no.

       ⚠️ SOLO VAN LOS EJERCICIOS QUE ESTA PANTALLA PINTA, y de eso se encarga
       la base: `apo_apuntar_ejercicios` (migración 111) mezcla lo que llega con
       lo que ya había en vez de sustituir la casilla entera. Antes esta
       pantalla y las calles de la piscina se borraban lo del otro sin enterarse
       —un nadador apuntaba sus largos y se llevaba por delante los kilos del
       gimnasio de esa misma tarde—. Aquí NO se vuelve a montar la casilla desde
       cero, por cómodo que parezca: la mezcla la hace la base en una sola
       operación y así no hay hueco entre leer y escribir. */
    var tiempos={};
    caja.querySelectorAll('.serie-inputs').forEach(function(g){
      var llave=g.getAttribute('data-fid')||g.getAttribute('data-key');
      if(!llave) return;
      /* Un ejercicio añadido y luego quitado se manda en blanco, que es como
         se le dice a la base que lo borre (migración 111). Si nunca llegó a
         guardarse, el blanco no le hace nada a nadie. */
      if(g.getAttribute('data-quitado')==='1'){ tiempos[llave]=null; return; }
      var filas=g.querySelectorAll('.ej-fila'); if(!filas.length) return;
      var clave=g.getAttribute('data-medida')||'tiempo';
      var ejerC=g.closest('.ejer');
      var botU=ejerC?ejerC.querySelector('.ej-uni .uni-act'):null;
      var unidad=botU?botU.textContent.trim():(clave==='peso_reps'||clave==='peso'?'kg':null);
      var series=[], planos=[], ultRir=null;
      filas.forEach(function(fila){
        var hecha=serieHecha(fila);
        var s={ hecha: hecha };
        /* Se guarda TAMBIÉN lo que vino en gris y el atleta no tocó: eso es lo
           que quiere decir «si no la toca, se guarda tal cual». */
        fila.querySelectorAll('.s-cel').forEach(function(cel){
          var v=valorCel(cel); if(!v) return;
          s[cel.getAttribute('data-c')]=v;
        });
        if(s.rir!=null && s.rir!=='') ultRir=s.rir;
        if(clave==='distancia' && unidad) s.unidad=unidad;
        /* El texto ya montado y con su unidad pegada («60 kg × 11»): lo leen las
           pantallas que todavía no entienden `series`, y así ninguna se queda en
           blanco. Un número sin unidad no es un dato. */
        var txt='';
        if(D && D.textoSerieHecha){ try { txt=D.textoSerieHecha(s, {clave:clave})||''; } catch(e){} }
        if(!txt && s.tiempo) txt=s.tiempo;
        planos.push(hecha?txt:'');
        series.push(s);
      });
      /* «Lo cambié por…»: lo que se hizo DE VERDAD. El nombre que mandó el
         entrenador se queda en `ejercicio` —los dos hacen falta: uno para que
         él vea que puso jalón y salieron dominadas, otro para que el atleta
         encuentre sus dominadas en el historial— y esto va aparte. */
      var inC=ejerC?ejerC.querySelector('.cambio-in'):null;
      var cambiado=(inC && inC.value.trim())||'';
      var mats=[];
      if(ejerC) ejerC.querySelectorAll('.ej-mat .mat').forEach(function(m){ mats.push(m.textContent.trim()); });
      /* ⚠️ EL QUE AÑADE EL ATLETA VA MARCADO, y no es un detalle: con esa marca
         la base NO lo cuenta al decidir si el día está entero (migración 107).
         Sin ella, alguien que se salta media sesión y luego hace seis series de
         remo por su cuenta saldría como que entrenó el día completo.
         Y su nombre va en `ejercicio`, no en `cambiado_por`: no ha cambiado
         nada, ha hecho algo de más. */
      var esExtra=g.getAttribute('data-extra')==='1';
      if(esExtra){
        var nomX=ejerC?String((ejerC.querySelector('.ej-nom')||{}).textContent||'').trim():'';
        tiempos[llave]={
          anadido_por_atleta: true,
          ejercicio: nomX || (cambiado?primeraParte(cambiado):'Ejercicio añadido'),
          nota: cambiado?segundaParte(cambiado)||null:null,
          bloque: parseInt(g.getAttribute('data-bloque'),10),
          medida: clave,
          unidad: unidad,
          material: mats.length?mats:null,
          series: series,
          tiempos: planos
        };
        if(isNaN(tiempos[llave].bloque)) tiempos[llave].bloque=null;
        return;
      }
      tiempos[llave]={
        fila_id: g.getAttribute('data-fid')||null,
        ejercicio: g.getAttribute('data-eje'),
        cambiado_por: cambiado||null,
        /* Lo que se le PIDIÓ de RIR, no lo que hizo. Es lo que deja al
           entrenador leer «objetivo 2-3, hizo 0». */
        rir_objetivo: g.getAttribute('data-rir')||null,
        /* El RIR ya va serie a serie dentro de `series`. Este de aquí es el
           mismo dato resumido en uno, y se sigue mandando porque la pantalla
           del entrenador lo lee así («lo dejó a 1»): quitarlo dejaría su
           columna en blanco sin que nadie se enterara. */
        rir: ultRir,
        medida: clave,
        unidad: unidad,
        material: mats.length?mats:null,
        series: series,
        tiempos: planos
      };
      /* Y se retira la llave vieja de POSICIÓN de este mismo ejercicio, pero
         SOLO si es de donde salió lo que hay en pantalla: o sea, si lo guardado
         estaba bajo la llave vieja y no bajo el id de la fila. Si no se
         quitara, el mismo ejercicio contaría dos veces y el día saldría más
         completo de lo que fue. Mandarla en blanco es como se le dice a la base
         que la borre (migración 111).
         La comprobación no sobra: la llave de posición se mueve cuando el
         entrenador reordena, y borrarla a ciegas se llevaría por delante lo
         apuntado de OTRO ejercicio. */
      var pos=g.getAttribute('data-key');
      var antes=(REG[sid] && REG[sid].tiempos_reales) || null;
      if(pos && pos!==llave && antes && antes[pos] && !antes[llave]) tiempos[pos]=null;
    });
    /* El motivo, si quedó algo sin hacer. Se pregunta una vez al final y es
       opcional: obligar a explicarse es la forma más rápida de que se deje de
       marcar, y entonces el historial vuelve a mentir. */
    var panel=caja.querySelector('[data-nh]');
    var motivo=(panel && !panel.hidden && panel.getAttribute('data-motivo'))||null;
    var notaNH=panel?panel.querySelector('.nh-nota'):null;
    function numOrNull(v){ v=(v||'').trim().replace(',','.'); if(!v) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
    function intOrNull(v){ if(!v) return null; var n=parseInt(v,10); return isNaN(n)?null:n; }
    var payload={
      sesion_id: sid, atleta_id: at.id,
      sensacion_general: intOrNull(val('.fb-sensacion')),
      rpe: intOrNull(val('.fb-rpe')),
      como_me_siento: val('.fb-siento').trim()||null,
      molestias: val('.fb-molestias').trim()||null,
      notas_atleta: val('.fb-notas').trim()||null,
      horas_sueno: numOrNull(val('.fb-sueno')),
      peso_kg: numOrNull(val('.fb-peso')),
      motivo_no_hecho: motivo,
      nota_no_hecho: (motivo && notaNH && notaNH.value.trim())||null
    };
    /* ------------------------------------------------------------
       DOS PASOS, Y EN ESTE ORDEN
       1) Los ejercicios, por `apo_apuntar_ejercicios`: la base mete SOLO los
          que manda esta pantalla y no toca los demás (migración 111). Va
          primero porque además crea la fila del día si no existía.
       2) Lo demás —cómo te fue, el RPE, las molestias, el motivo— con el
          guardado de siempre, que ya no nombra `tiempos_reales` y por tanto
          no puede pisarlo.
       ------------------------------------------------------------ */
    var trFinal=(REG[sid] && REG[sid].tiempos_reales) || null;
    if(Object.keys(tiempos).length){
      var rp=await sb.rpc('apo_apuntar_ejercicios', {
        p_sesion: sid, p_atleta: at.id, p_ejercicios: tiempos
      });
      if(rp.error){ msg.textContent='Error: '+rp.error.message; msg.className='msg fb-msg error'; return; }
      trFinal=(rp.data && rp.data.tiempos_reales) || null;
    }
    /* `tiempos_reales` NO va en el guardado de abajo, y eso es lo importante:
       lo que no se nombra, no se pisa. */
    /* Se pide de vuelta la fila ya guardada. La base calcula sola el estado
       del día y, si esto era la corrección de un día pasado, el rastro de la
       corrección (migración 104): pedirla es una vuelta que ya se estaba
       dando y evita que la pantalla se invente esos tres campos por su
       cuenta y acabe diciendo algo distinto de lo que hay guardado. */
    var up=await sb.from('registros_sesion').upsert(payload,{onConflict:'sesion_id,atleta_id'})
             .select('id,estado,series_hechas,series_previstas,corregido_en,corregido_veces').maybeSingle();
    if(up.error){ msg.textContent='Error: '+up.error.message; msg.className='msg fb-msg error'; }
    /* `pintarSemana` además del inicio: el visto del día tiene que aparecer
       en la tira en cuanto se guarda, no en la siguiente recarga. */
    else {
      payload.tiempos_reales = trFinal;      // para lo que la pantalla enseña, no para guardar
      if(up.data){
        payload.id              = up.data.id;
        payload.estado          = up.data.estado;
        payload.series_hechas   = up.data.series_hechas;
        payload.series_previstas= up.data.series_previstas;
        payload.corregido_en    = up.data.corregido_en;
        payload.corregido_veces = up.data.corregido_veces;
      } else {
        /* Si por lo que sea la fila no vuelve (una respuesta recortada, una
           red rara), se cuenta aquí lo mismo que cuenta la base —las series
           con ✓— para que el historial no siga diciendo «entero» un día que
           se acaba de marcar a medias. */
        var filasT=filasMandadas(caja), hechasT=0;
        filasT.forEach(function(f){ if(serieHecha(f)) hechasT++; });
        payload.estado = !filasT.length ? 'completo'
                       : (hechasT===0 ? 'no_hecho' : (hechasT<filasT.length ? 'a_medias' : 'completo'));
        payload.series_hechas=hechasT; payload.series_previstas=filasT.length;
        var antes=REG[sid]||{};
        payload.id=antes.id; payload.corregido_en=antes.corregido_en; payload.corregido_veces=antes.corregido_veces;
      }
      msg.textContent='Guardado ✓ ¡gracias!'; msg.className='msg fb-msg ok';
      REG[sid]=payload; limpiarSucio(caja); pintarHoy(); pintarSemana();
      /* El punto del historial tiene que cambiar de hueco a relleno ahora, no
         en la siguiente visita: se olvida lo que había calculado. */
      if(HIST_REG) HIST_REG[sid]={ estado: payload.estado };
      HIST={};
      /* Corregido y guardado: el día se vuelve a cerrar. Si se quedara
         abierto, al volver mañana seguiría en modo escritura y no se vería
         el «corregido el 3 de agosto» que se acaba de ganar. Se deja el
         aviso a la vista un momento antes de repintar. */
      if(CORRIGIENDO[sid]){
        setTimeout(function(){
          if(!CORRIGIENDO[sid]) return;
          delete CORRIGIENDO[sid];
          if(diaSel) pintarDia(diaSel);
        }, 1200);
      }
    }
  }

  // ---------- HOY: saludo, tira de semana, sesión destacada y aviso del club ----------
  var lunesHoy=lunesDe(todayISO);
  var PAGOS=[];            // recibos del atleta (para avisar de lo vencido en «Hoy»)
  var hoyPintado=false;
  function sesSemanaHoy(){ return sesDe(SEM[lunesHoy], at.id); }
  /* Un día libre se llama «Descanso», no «Entrenamiento». Se mira el papel del
     día (migración 102) y, si no está, el tipo de siempre. */
  function tituloSesion(s){ return s.titulo || ((s.papel_dia||s.tipo)==='descanso' ? 'Descanso' : 'Entrenamiento'); }

  /* ------------------------------------------------------------
     EL RESUMEN DE LA TARJETA
     Antes salía SIEMPRE el primer ejercicio del bloque principal. En un día de
     correr eso funciona: un día de 6 × 800 se llama «6 × 800» y el resto es
     calentar y soltar. En un full body de ocho ejercicios distintos, no: la
     tarjeta resumía el día entero como «3 × 10-12 rep · 2' recuperación», que
     es el primer ejercicio y nada más.

     Lo que resume de verdad no es lo mismo en cada deporte, así que ahora lo
     decide el módulo compartido: en fuerza, el volumen y qué se trabaja
     («8 ejercicios · Tren superior y core», con las etiquetas que escribió el
     entrenador); en atletismo y natación, la serie principal, como siempre.

     Y SI NO HAY UN RESUMEN HONESTO, NO SE PONE NINGUNO: un hueco no engaña a
     nadie y un resumen que miente, sí.
     ------------------------------------------------------------ */
  function resumenSesion(s){
    var D=DESC();
    if(D && D.resumenCorto){
      try { return D.resumenCorto(s, { disciplina: disciplinaDe(s), grupo: GRUPO })||''; } catch(e){}
    }
    return '';
  }

  // Abrir un día concreto en «Mi semana» (y, si se pide, ir al formulario de sensaciones)
  async function verDia(iso, foco){
    activarSeccion('entreno');
    /* ⚠️ SIEMPRE EN «Sesión de hoy», sea el día que sea, y ESO ES LO QUE
       QUITA EL CALENDARIO REPETIDO.
       Antes, abrir un día que no fuera hoy te dejaba en «Mi semana», o sea
       con la tira de días otra vez arriba: elegías el día en el inicio y al
       entrar te volvían a preguntar qué día. Ahora el inicio es donde se
       ojea —con sus flechas de semana— y aquí solo se hace el entrenamiento.
       La tira de dentro sigue existiendo en «Mi semana» para quien la
       quiera; lo que ya no hace es salir sola. */
    MODO = 'hoy';
    pintarModo(iso);
    if(lunesDe(iso)===lunesVis) pintarDia(iso); else await irSemana(lunesDe(iso), iso);
    if(foco){ var c=wrap.querySelector('.entreno-uno[data-sid="'+foco+'"] .fb-card'); if(c){ c.scrollIntoView({block:'center'}); return; } }
    wrap.scrollIntoView({block:'start'});
  }

  /* «La fila que manda» vive ahora en el módulo compartido, junto al resto de
     decisiones sobre cómo se resume una sesión: si estuviera aquí, cada
     pantalla acabaría teniendo su propia idea de cuál es el ejercicio
     importante del día. */
  /* Los tres datos de la tarjeta de hoy (maqueta 37b). En atletismo y natación
     son la serie, el ritmo y la RECUPERACIÓN, que es lo que de verdad define la
     sesión: 6×800 con 90" no es 6×800 con 3'. En fuerza no: ahí lo que dice de
     qué va el día es el volumen —cuántos ejercicios y cuántas series—, y el
     primer ejercicio no representa a los otros siete. */
  function cifrasSesion(s){
    var D=DESC();
    if(D && D.cifrasDe){
      try { return D.cifrasDe(s, { disciplina: disciplinaDe(s), grupo: GRUPO })||[]; } catch(e){}
    }
    return [];
  }

  // Franja ámbar de aviso: lo único que puede aparecer por encima del entreno.
  // Lleva icono, que es lo que la distingue del ámbar de marca del club.
  function franja(texto, accion, attr){
    return '<div class="franja"'+(attr||'')+'><span class="fr-ic" aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>'+
      '<span class="fr-txt">'+texto+'</span>'+
      (accion?'<span class="fr-acc">'+esc(accion)+'</span>':'')+'</div>';
  }

  /* INICIO (maqueta 37b) · pantalla de consulta, en este orden:
     1 aviso de recibo · 2 tarjeta navy del entreno de hoy · 3 fila del rango ·
     4 próxima carrera y última marca · 5 resto de la semana.
     Una sola tarjeta navy: si hubiera dos, ninguna ancla. */
  function pintarHoy(){
    /* La lista es la de la semana que se está OJEANDO, no la de hoy: si no,
       al pasar de semana la tira cambiaba y la tarjeta de debajo se quedaba
       enseñando el lunes pasado. */
    var sec=$('sec-hoy'), lista=sesOjeo(), html='';

    // 1 · aviso de recibo pendiente arriba (desaparece si está al día)
    var deb=PAGOS.filter(function(x){ var e=(x.estado||'').toLowerCase(); return e!=='pagado' && e!=='cobrado'; });
    if(deb.length){
      var deuda=deb.reduce(function(a,x){ return a+(parseFloat(x.importe)||0); },0);
      var uno=deb[0];
      var txt=(deb.length===1 ? esc(uno.concepto||'Recibo pendiente') : deb.length+' recibos pendientes')+
              (deuda>0 ? ' · <span style="white-space:nowrap">'+esc(eur(deuda))+'</span>' : '');
      html+=franja(txt, 'Ver', ' data-sec-ir="pagos"');
    }
    // Aviso del club: misma franja, solo cuando el club tiene algo que decir
    if(AVISO){
      var enlA=AVISO.enlace ? (/^https?:\/\//.test(AVISO.enlace) ? AVISO.enlace : '../../'+String(AVISO.enlace).replace(/^\//,'')) : '';
      html+='<div class="franja azul"'+(enlA?' data-url="'+esc(enlA)+'"':'')+'>'+
        '<span class="fr-ic" aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>'+
        '<span class="fr-txt">'+esc(AVISO.texto)+'</span>'+
        (enlA?'<span class="fr-acc">'+esc(AVISO.texto_enlace||'Ver')+'</span>':'')+'</div>';
    }

    /* 1b · LA SEMANA, ARRIBA DEL TODO.
       Al abrir la app se viene a ver qué toca hoy, y de paso a mirar qué hay
       mañana o qué te dejaste el lunes. Antes eso obligaba a entrar en
       «Entrenamiento»: el calendario estaba dentro, no a la vista.

       Va BAJA a propósito, dos renglones de alto: siete días y el
       entrenamiento de hoy tienen que caber en un móvil sin rodar la pantalla.
       Y va debajo de los avisos, porque un recibo pendiente manda sobre el
       calendario. */
    html+=tiraSemanaHTML();
    /* El formulario de apuntar, si está abierto: pegado a la tira, que es
       donde acabas de elegir el día. */
    if(APU_DIA) html+=apuntarHTML(APU_DIA);

    /* 2 · el entreno de hoy: la ÚNICA tarjeta navy de la pantalla. Si hoy hay
       dos sesiones (pista y gimnasio, por ejemplo) solo la primera va en navy;
       la otra baja a una fila. Con dos bloques navy ninguno ancla nada. */
    /* La tarjeta enseña EL DÍA QUE SE ESTÁ MIRANDO. Antes era siempre hoy y
       tocar otro día te sacaba de la pantalla; ahora te mueves por la semana
       viendo qué hay, y entras solo cuando vas a hacerlo. */
    var diaVer = DIA_OJEO || todayISO;
    var hoySes=lista.filter(function(s){ return s.fecha===diaVer; });
    if(hoySes.length){
      html+=hoySes.slice(0,1).map(function(s){
        var hecho=!!REG[s.id];
        var cifras=cifrasSesion(s);
        // grupo · sitio · entrenador, con el nombre propio del grupo en ámbar
        var sub=[nombreGrupoHTML((GRUPO&&GRUPO.nombre)||''), esc(lugarGrupo()), esc(ENTRENA)].filter(Boolean).join(' · ');
        var hora=horaGrupo();
        return '<div class="hoy-card">'+
          '<div class="hc-top">'+
            '<span class="hc-grupo">'+(diaVer===todayISO?'Entrenamiento de hoy':esc(formatFecha(diaVer)))+
              (s.origen==='atleta' ? ' · lo apuntaste tú' : (s.atletas_ids?' · solo para ti':''))+'</span>'+
            (hora?'<span class="hc-hora">'+esc(hora)+'</span>':'<span class="hc-hora">'+esc(deporteCorto(s))+'</span>')+
          '</div>'+
          '<div><h2 class="hc-tit">'+esc(tituloSesion(s))+'</h2>'+
            (sub?'<div class="hc-det">'+sub+'</div>':'')+'</div>'+
          (cifras.length?'<div class="hc-cifras">'+cifras.map(function(c){
            return '<span class="hc-cifra"><b>'+esc(c.v)+'</b><span>'+esc(c.l)+'</span></span>';
          }).join('')+'</div>':'')+
          '<button type="button" class="hc-cta" data-ir="'+diaVer+'">'+(diaVer===todayISO?'Empezar el entrenamiento':'Abrir este entrenamiento')+'</button>'+
          '<button type="button" class="hc-ok'+(hecho?' hecho':'')+'" data-ir="'+diaVer+'" data-fb="'+esc(s.id)+'">'+
            (hecho?'Ya has contado cómo fue':'¿Cómo fue?')+'</button>'+
          '</div>';
      }).join('');
      /* Y aunque ese día SÍ hubiera entrenamiento: se puede salir con la
         bici después de la pista, y eso también cuenta. */
      html+='<div class="apu-fuera">'+apuBotonHTML(diaVer)+'</div>';
      // Las demás sesiones de hoy, en filas: nunca una segunda tarjeta navy
      if(hoySes.length>1){
        html+='<div class="lista-caja">'+hoySes.slice(1).map(function(s){
          return '<button type="button" class="lista-fila" data-ir="'+todayISO+'">'+
            '<span class="lf-txt"><span class="lf-nom">'+esc(tituloSesion(s))+'</span>'+
            '<span class="lf-sub">también hoy · '+esc(deporteCorto(s))+'</span></span>'+
            '<span class="lf-hora">&rsaquo;</span></button>';
        }).join('')+'</div>';
      }
    } else if(SEM_FALLO[OJEO_LUNES]){
      /* «Hoy toca descansar» cuando lo que ha fallado es la consulta es la
         mentira más cara de todo el portal: te quedas en casa. Aquí se dice
         que no lo sabemos y se ofrece volver a mirar. */
      html+=htmlError('No hemos podido cargar tus entrenamientos',
        'Puede ser tu conexión, así que no sabemos si hoy tienes entrenamiento. No te fíes de esta pantalla hasta que cargue: si te queda duda, pregunta a tu entrenador.',
        async function(){ await cargarSemana(lunesHoy); pintarHoy(); });
    } else {
      var sig=null;
      lista.forEach(function(s){ if(s.fecha>todayISO && (!sig||s.fecha<sig.fecha)) sig=s; });
      var texto = sig ? 'La próxima, el '+formatFecha(sig.fecha)+': '+tituloSesion(sig)+'.'
                      : (at.grupo_id ? 'No hay ningún entrenamiento programado para hoy.'
                                     : 'Aún no estás asignado a un grupo. En cuanto tu entrenador te asigne, verás aquí tus entrenamientos.');
      /* Si se está ojeando OTRO día, no se dice «hoy toca descansar»: se dice
         qué pasa ESE día. Decirle a alguien que descanse hoy cuando está
         mirando el domingo es de las cosas que hacen que no te fíes de una
         pantalla. */
      if(diaVer !== todayISO){
        html+='<div class="hoy-vacio"><div class="luna" aria-hidden="true">'+icLuna+'</div>'+
          '<h2>'+esc(formatFecha(diaVer))+'</h2><p>Ese día no hay entrenamiento.</p>'+
          '<button type="button" class="btn btn--neutro" data-ojear="'+todayISO+'">Volver a hoy</button>'+
          apuBotonHTML(diaVer)+'</div>';
      } else {
        html+='<div class="hoy-vacio"><div class="luna" aria-hidden="true">'+icLuna+'</div><h2>Hoy toca descansar</h2>'+
          '<p>'+esc(texto)+'</p>'+
          '<button type="button" class="btn btn--neutro" data-ir="'+(sig?sig.fecha:todayISO)+'">Ver mi entrenamiento</button>'+
          apuBotonHTML(diaVer)+'</div>';
      }
    }

    /* 3 · el rango, como fila con la medalla en ámbar y qué falta para el
       siguiente reto. No un contador de puntos: una frase con algo que hacer.
       Solo aparece si el atleta participa en el juego de retos. */
    if(RANGO){
      var romano=['','I','II','III','IV','V','VI','VII'][RANGO.orden]||'·';
      var falta = RANGO.sigNombre
        ? 'Te faltan '+RANGO.sigFaltan+' puntos para '+RANGO.sigNombre
        : 'Has llegado al último rango del club';
      html+='<a class="rango-fila" href="../retos/">'+
        '<span class="rg-med" aria-hidden="true">'+esc(romano)+'</span>'+
        '<span class="rg-txt"><span class="rg-nom">'+esc(RANGO.nombre)+' · '+RANGO.puntos+' puntos</span>'+
        '<span class="rg-falta">'+esc(falta)+'</span></span>'+
        '<span class="rg-chev" aria-hidden="true">&rsaquo;</span></a>';
    }

    /* 3b · ACCESO RÁPIDO A LOS RECURSOS DEL GRUPO. Grande y visual, y solo si
       hay recursos: es lo que Andrés quería a un toque desde Inicio. */
    if(RECURSOS_GRUPO>0){
      html+='<a class="rec-acceso" data-sec-ir="recursos">'+
        '<span class="ra-ico" aria-hidden="true">💪</span>'+
        '<span class="ra-txt"><span class="ra-tit">Recursos de tu grupo</span>'+
        '<span class="ra-sub">'+RECURSOS_GRUPO+(RECURSOS_GRUPO===1?' ficha para hacer':' fichas para hacer')+' · fuerza, gomas, movilidad…</span></span>'+
        '<span class="ra-chev" aria-hidden="true">&rsaquo;</span></a>';
    }

    // 4 · dos tarjetas: próxima carrera y última marca
    var tj='';
    if(PROXCOMP){
      var dias=difDias(PROXCOMP.fecha_inicio, todayISO);
      tj+='<a class="mini" href="../competiciones/"><span class="mi-et">Próxima carrera</span>'+
        '<span class="mi-tit">'+esc(PROXCOMP.nombre||'')+'</span>'+
        '<span class="mi-pie pronto">'+esc(dias<=0?'Hoy':(dias===1?'Mañana':'En '+dias+' días'))+'</span></a>';
    }
    if(ULTIMA){
      var esMejor = ULTIMA.prueba && MMP[ULTIMA.prueba] && String(MMP[ULTIMA.prueba].disp)===String(ULTIMA.tiempo_display||'');
      tj+='<a class="mini" data-sec-ir="marcas"><span class="mi-et">Última marca</span>'+
        '<span class="mi-tit dato">'+esc(ULTIMA.tiempo_display||'—')+'</span>'+
        '<span class="mi-pie'+(esMejor?' bien':'')+'">'+esc((esMejor?'Mejor personal · ':'')+(ULTIMA.prueba||''))+'</span></a>';
    }
    if(tj) html+='<div class="minis">'+tj+'</div>';

    // 5 · resto de la semana: dos filas, en un solo contenedor
    /* «Lo que queda» de la semana que se está mirando, contado desde el día
       que se está mirando. Si fuera siempre desde hoy, al ojear la semana que
       viene esta lista repetiría lo de esta. */
    var futuras=lista.filter(function(s){ return s.fecha>diaVer; }).sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
    if(futuras.length){
      var nom=['dom','lun','mar','mié','jue','vie','sáb'];
      var hora=horaGrupo();
      html+='<div class="lista-tit"><span class="et">'+(OJEO_LUNES===lunesHoy?'Resto de la semana':'Lo que queda de esa semana')+'</span>'+
        '<a class="enl" href="../calendario/">Calendario</a></div>';
      html+='<div class="lista-caja">'+futuras.slice(0,2).map(function(s){
        var d=new Date(s.fecha+'T00:00:00');
        return '<button type="button" class="lista-fila" data-ir="'+s.fecha+'">'+
          '<span class="lf-dia">'+esc(nom[d.getDay()]+' '+d.getDate())+'</span>'+
          '<span class="lf-txt"><span class="lf-nom">'+esc(tituloSesion(s))+'</span></span>'+
          (hora?'<span class="lf-hora">'+esc(hora)+'</span>':'')+'</button>';
      }).join('')+'</div>';
    }

    sec.innerHTML=html;
    hoyPintado=true;
  }

  // Un solo manejador para toda la sección «Hoy»
  /* La tira de la semana del inicio. Se pinta con lo que ya está cargado, así
     que no cuesta ninguna consulta: son las mismas sesiones que ya se usan
     para la tarjeta de hoy. Un día con entrenamiento se toca y se abre; el ✓
     dice que ya apuntaste cómo te fue, igual que en la tira de dentro. */
  /* El día que se está mirando en el inicio. No es el mismo que `diaSel`, que
     es el del apartado de entrenamiento: aquí se OJEA, allí se TRABAJA. */
  var DIA_OJEO = null;
  /* Y la SEMANA que se está ojeando. Antes la tira era siempre la de hoy y
     para ver la que viene había que entrar en «Entrenamiento», que es
     justamente el viaje que esta tira venía a quitar: se ojea aquí, se entra
     solo para hacerlo. */
  var OJEO_LUNES = lunesHoy;
  function sesOjeo(){ return sesDe(SEM[OJEO_LUNES], at.id); }
  function tiraSemanaHTML(){
    var nom=['lun','mar','mié','jue','vie','sáb','dom'];
    var l=OJEO_LUNES, h='', deLaSemana=sesOjeo();
    /* Los mandos de la semana. «Hoy» solo sale cuando NO estás en la de hoy:
       un botón que no hace nada enseña a no fiarse de los botones. */
    var mandos='<div class="ti-cab">'+
      '<button type="button" class="ti-nav" data-sem-ojeo="-7" aria-label="Semana anterior">‹</button>'+
      '<span class="ti-rango">'+esc(l===lunesHoy ? 'Esta semana' : rangoTxt(l))+'</span>'+
      (l===lunesHoy ? '' : '<button type="button" class="ti-hoy" data-sem-ojeo="hoy">Hoy</button>')+
      '<button type="button" class="ti-nav" data-sem-ojeo="7" aria-label="Semana siguiente">›</button>'+
    '</div>';
    /* Una semana que no se ha podido cargar NO se pinta como siete días
       libres: eso es decirle a alguien que no tiene entrenamiento cuando no
       lo sabemos. Mismo criterio que la tarjeta de hoy. */
    if(SEM_FALLO[l]){
      return '<div class="ti-semana-caja">'+mandos+
        '<p class="ti-fallo">No hemos podido cargar esta semana. '+
        '<button type="button" class="enl" data-sem-ojeo="reintentar">Volver a intentarlo</button></p></div>';
    }
    for(var i=0;i<7;i++){
      var iso=addDias(l,i);
      var ses=deLaSemana.filter(function(x){ return x.fecha===iso; });
      var d=new Date(iso+'T00:00:00');
      var cls='ti-d'+(ses.length?'':' libre')+(iso===todayISO?' hoy':'')+(iso===(DIA_OJEO||todayISO)?' sel':'');
      var dentro;
      if(ses.length){
        var apuntado=ses.every(function(x){ return !!REG[x.id]; });
        dentro='<span class="ti-et">'+esc(deporteCorto(ses[0]))+'</span>'+
               (apuntado?'<span class="ti-ok">✓</span>':'');
      } else dentro='<span class="ti-et">libre</span>';
      h+='<button type="button" class="'+cls+'" data-ojear="'+iso+'" '+
         'title="'+esc(formatFecha(iso)+(ses.length?': '+(ses[0].titulo||'entrenamiento'):': sin entrenamiento'))+'">'+
         '<span class="ti-n">'+(iso===todayISO?'hoy':nom[i])+'</span>'+
         '<span class="ti-num">'+d.getDate()+'</span>'+dentro+'</button>';
    }
    return '<div class="ti-semana-caja">'+mandos+'<div class="ti-semana">'+h+'</div></div>';
  }

  /* ============================================================
     APUNTAR ALGO QUE HICE POR MI CUENTA
     ------------------------------------------------------------
     La salida de bici del domingo, el rodaje suelto, la piscina por tu
     cuenta. Hasta hoy no cabía en ningún sitio: solo se podía apuntar
     lo que alguien te había mandado antes, y si ese día no había nada
     planificado la pantalla decía «hoy toca descansar» y ahí se acababa.

     Se crea como una SESIÓN normal marcada `origen:'atleta'`
     (migración 146), no como una tabla aparte. Siendo una sesión, sale
     en la tira de la semana, cuenta en los kilómetros de las
     estadísticas, entra en la hoja de imprimir, la ve el entrenador y
     se le puede poner el «¿cómo fue?» de siempre. Con una tabla aparte
     habría que rehacer esas cinco cosas, y la quinta se olvidaría.

     ⚠️ Y VA MARCADA. Para el entrenador no es lo mismo que hayas hecho
     lo que te puso a que hayas salido con la bici por tu cuenta.
     ============================================================ */
  var APU_DIA=null;      // el día que se está apuntando, o null
  /* Qué se guarda de cada deporte. `tipo` es lo que mira el módulo de
     descansos para saber cómo se lee una serie, así que la bici va como
     `continuo`: distancia y tiempo, igual que un rodaje. */
  var APU_DEP={
    bici:      { et:'Bici',      deporte:'bici',      tipo:'continuo', unidad:'km', desnivel:true  },
    carrera:   { et:'Carrera',   deporte:'atletismo', tipo:'continuo', unidad:'km', desnivel:true  },
    natacion:  { et:'Natación',  deporte:'natacion',  tipo:'natacion', unidad:'m',  desnivel:false },
    fuerza:    { et:'Fuerza',    deporte:'fuerza',    tipo:'gym',      unidad:'',   desnivel:false },
    otro:      { et:'Otro',      deporte:'otro',      tipo:'continuo', unidad:'km', desnivel:true  }
  };
  var APU_ORDEN=['bici','carrera','natacion','fuerza','otro'];

  function apuntarHTML(iso){
    var d=APU_DEP[apuSel]||APU_DEP.bici;
    return '<div class="apu" id="apu-caja">'+
      '<div class="apu-cab"><b>Apuntar lo que hiciste</b>'+
        '<span>'+esc(formatFecha(iso))+'</span>'+
        '<button type="button" class="apu-x" id="apu-cerrar" aria-label="Cerrar">✕</button></div>'+
      '<div class="apu-deps">'+APU_ORDEN.map(function(k){
        return '<button type="button" class="apu-dep'+(k===apuSel?' sel':'')+'" data-apu-dep="'+k+'">'+esc(APU_DEP[k].et)+'</button>';
      }).join('')+'</div>'+
      '<label for="apu-tit">Qué hiciste</label>'+
      '<input id="apu-tit" type="text" maxlength="60" value="'+esc(APU_VAL.tit)+'" placeholder="'+esc(apuPlaceholder())+'">'+
      (d.unidad ? '<label for="apu-dist">Distancia ('+esc(d.unidad)+')</label>'+
        '<input id="apu-dist" type="text" inputmode="decimal" value="'+esc(APU_VAL.dist)+'" placeholder="'+(d.unidad==='km'?'42,5':'1200')+'">'+
        /* ⚠️ TRES CASILLAS Y NO UNA, Y NO ES CAPRICHO.
           Estaba en un solo recuadro con `inputmode="numeric"`, o sea que
           el iPhone abre el teclado de números —EL QUE NO TIENE DOS
           PUNTOS—. Escribir «1:56:39» era literalmente imposible: se
           tecleaba «15639» y se guardaba una hora y media de bici como
           un número sin sentido. Pasó el primer día.
           Se podría haber puesto `inputmode="text"` para que salieran los
           dos puntos, pero entonces se teclean números en un teclado de
           letras. O adivinar desde la derecha —«15639» son 1:56:39—, y
           entonces «45» no se sabe si son segundos o minutos.
           Tres casillas no tienen ninguna de las dos dudas. */
        '<label>Tiempo</label><div class="apu-hms">'+
          '<input id="apu-h" type="text" inputmode="numeric" maxlength="2" value="'+esc(APU_VAL.h)+'" placeholder="0" aria-label="Horas"><span>h</span>'+
          '<input id="apu-min" type="text" inputmode="numeric" maxlength="3" value="'+esc(APU_VAL.min)+'" placeholder="45" aria-label="Minutos"><span>min</span>'+
          '<input id="apu-seg" type="text" inputmode="numeric" maxlength="2" value="'+esc(APU_VAL.seg)+'" placeholder="00" aria-label="Segundos"><span>s</span>'+
        '</div>' : '')+
      (d.desnivel ? '<label for="apu-desn">Desnivel (m) <span class="apu-op">si lo sabes</span></label>'+

  var APU_VAL={ tit:'', dist:'', h:'', min:'', seg:'', desn:'' };
  /* QUÉ SE TRABAJÓ, solo en fuerza. No es un adorno: es la etiqueta del
     bloque, y de ahí sale el resumen de la tarjeta —«3 ejercicios · Tren

     (`etiquetasDeTrabajo` en descansos.js). Un día de gimnasio sin decir

  var APU_TRABAJO=['Tren superior','Tren inferior','Full body','Core'];
  var apuTrabajo='Tren superior';

  var apuRpe=null;

  function apuPlaceholder(){
    /* En fuerza el nombre por defecto lo dice lo que trabajaste: «Gimnasio
       por mi cuenta» repetido doce veces en el historial no distingue un
       día de otro. */
    if(apuSel==='fuerza') return 'Gimnasio · '+apuTrabajo.toLowerCase();
    return ({ bici:'Salida en bici', carrera:'Rodaje suave', natacion:'Piscina',
              otro:'Lo que hice' })[apuSel]||'Lo que hice';
  }
  /* El ritmo NO se pide: se calcula y se enseña mientras escribes, que es
     lo que te dice si has tecleado bien la distancia. En natación va por
     cada 100 m, que es como se habla en la piscina. */
  function apuPintarRitmo(){
    var caja=$('apu-ritmo'); if(!caja) return;
    var d=APU_DEP[apuSel]||APU_DEP.bici;
    var dist=numDe(($('apu-dist')||{}).value), t=segApu();
    if(!dist || !t || !d.unidad){ caja.textContent=''; return; }
    var metros = d.unidad==='km' ? dist*1000 : dist;
    if(metros<=0){ caja.textContent=''; return; }
    var porKm = t/(metros/1000);
    caja.textContent = d.unidad==='m'
      ? 'Ritmo: '+minSegTxt(t/(metros/100))+' cada 100 m'
      : 'Ritmo: '+minSegTxt(porKm)+' /km · '+(metros/1000/(t/3600)).toFixed(1).replace('.',',')+' km/h';
  }
  function numDe(v){
    if(v==null) return 0;
    var n=parseFloat(String(v).replace(',','.').replace(/[^\d.]/g,''));
    return isNaN(n)?0:n;
  }
  /* Los segundos que salen de las tres casillas. Se admite «90» en los
     minutos —hora y media— sin corregirlo por el camino: al guardarlo se
     escribe 1:30:00 y ya está. Corregir mientras alguien teclea es la
     forma más rápida de pelearse con un formulario. */
  function segApu(){
    function n(id){ var e=$(id); return e ? (parseInt(String(e.value).replace(/\D/g,''),10)||0) : 0; }
    return n('apu-h')*3600 + n('apu-min')*60 + n('apu-seg');
  }
  function minSegTxt(seg){
    var m=Math.floor(seg/60), s=Math.round(seg-m*60);
    if(s===60){ s=0; m++; }
    return m+':'+(s<10?'0':'')+s;
  }
  /* La DURACIÓN se escribe con horas cuando las hay. `minSegTxt` vale para
     un ritmo —nadie corre a 85 minutos el kilómetro— pero una salida de
     bici de hora y media se guardaba como «85:30», que se lee fatal y
     parece un ritmo. Los ritmos siguen en mm:ss, que es como se dicen. */
  function duracionTxt(seg){
    if(seg<3600) return minSegTxt(seg);
    var h=Math.floor(seg/3600), r=seg-h*3600;
    var m=Math.floor(r/60), sg=Math.round(r-m*60);
    if(sg===60){ sg=0; m++; }
    if(m===60){ m=0; h++; }
    return h+':'+(m<10?'0':'')+m+':'+(sg<10?'0':'')+sg;
  }

  async function apuGuardar(iso){
    var msg=$('apu-msg'), boton=$('apu-ok');
    var d=APU_DEP[apuSel]||APU_DEP.bici;
    var tit=(($('apu-tit')||{}).value||'').trim()||apuPlaceholder();
    var dist=numDe(($('apu-dist')||{}).value);
    var seg=segApu();
    var desn=numDe(($('apu-desn')||{}).value);
    if(d.unidad && !dist && !seg){
      msg.textContent='Pon al menos la distancia o el tiempo.'; msg.className='apu-msg mal'; return;
    }
    boton.disabled=true; msg.textContent='Guardando…'; msg.className='apu-msg';

    /* La fila del bloque: es lo que se ve en la tarjeta y en la hoja de
       imprimir. El ritmo se guarda ya escrito porque es un texto que se
       lee, no un número con el que se opere. */
    var metros = d.unidad==='km' ? dist*1000 : dist;
    var fila={ id:'libre', ejercicio:tit, series:'1' };
    if(dist) fila.distancia = comaDecimal(String(dist))+' '+d.unidad;
    if(dist && seg && metros>0){
      /* Cada deporte dice su ritmo como lo dice su gente: la piscina por
         cada 100, la bici en km/h y correr en minutos por kilómetro. Un
         ciclista al que le pones «2:01/km» tiene que hacer la cuenta. */
      fila.ritmo = d.unidad==='m' ? minSegTxt(seg/(metros/100))+'/100'
                 : (apuSel==='bici' ? (metros/1000/(seg/3600)).toFixed(1).replace('.',',')+' km/h'
                                    : minSegTxt(seg/(metros/1000))+'/km');
    }
    if(desn>0){ fila.desnivel_m = desn; fila.observaciones = desn+' m de desnivel'; }

    var ses={
      fecha: iso,
      titulo: tit,
      deporte: d.deporte,
      tipo: d.tipo,
      papel_dia: 'recuperacion',
      origen: 'atleta',
      publicada: true,
      creado_por: perfil.id,
      atletas_ids: [at.id],
      grupo_id: at.grupo_id || null,
      /* La etiqueta del bloque es la que hace que la tarjeta diga «3
         ejercicios · Tren superior» en vez de un genérico. En el resto de
         deportes no hay nada que elegir, así que se queda «Lo que hice». */
      bloques: [{ etiqueta: (apuSel==='fuerza' ? apuTrabajo : 'Lo que hice'), filas:[fila] }]
    };
    try {
      var ins=await sb.from('sesiones').insert(ses).select().single();
      if(ins.error) throw ins.error;
      /* Y se da por hecha en el mismo golpe. Obligar a entrar después a
         marcar la casilla de algo que TÚ acabas de escribir que hiciste
         es pedir el mismo dato dos veces. El «¿cómo fue?» —esfuerzo,
         sensaciones— se rellena luego, si se quiere, como en cualquier
         otro entrenamiento. */
      var serie={ hecha:true };
      if(dist){ serie.distancia=comaDecimal(String(dist)); serie.unidad=d.unidad; }
      if(seg) serie.tiempo=duracionTxt(seg);
      var reg={
        sesion_id: ins.data.id, atleta_id: at.id, estado: 'completo',
        rpe: apuRpe,
        tiempos_reales: { libre: { fila_id:'libre', ejercicio:tit,
                                   medida: d.unidad?'distancia':'hecho', unidad: d.unidad||null,
                                   series:[serie] } }
      };
      var rg=await sb.from('registros_sesion').upsert(reg,{onConflict:'sesion_id,atleta_id'}).select().single();
      if(!rg.error && rg.data) REG[ins.data.id]=rg.data;
      /* La semana en memoria se recarga de verdad, no se parchea: así lo
         que se ve sale de la base y no de lo que creemos haber guardado. */
      delete SEM[lunesDe(iso)];
      await cargarSemana(lunesDe(iso));
      APU_DIA=null; DIA_OJEO=iso;
      pintarHoy();
      window.scrollTo(0,0);
    } catch(e){
      msg.textContent='No se ha podido guardar'+(e&&e.message?' ('+e.message+')':'')+'.';
      msg.className='apu-msg mal';
      boton.disabled=false;
    }
  }

  /* Cambiar de semana en el inicio. Se pide la semana nueva si no está ya
     cargada —una consulta, la misma que usa «Entrenamiento», y se queda
     guardada— y se elige qué día enseñar al llegar.

     ⚠️ AL SALTAR DE SEMANA HAY QUE MOVER EL DÍA OJEADO. Si se quedara en el
     de antes, la tarjeta de abajo seguiría enseñando un día de OTRA semana
     que la tira ya no señala: la tira dice una cosa y la tarjeta otra.

  async function ojearSemana(lunes){
    OJEO_LUNES = lunes;

    if(caja) caja.classList.add('cargando');

      DIA_OJEO = lista.length ? lista[0].fecha : lunes;
    }
    pintarHoy();
    window.scrollTo(0,0);
  }

  $('sec-hoy').addEventListener('click', function(ev){
    var t=ev.target; if(!t||!t.closest) return;
    var u=t.closest('[data-url]');
    if(u){ location.href=u.getAttribute('data-url'); return; }
    var s=t.closest('[data-sec-ir]');

    if(t.closest('#apu-cerrar')){ APU_DIA=null; pintarHoy(); return; }
    var dep=t.closest('[data-apu-dep]');
    if(dep){ apuRecordar(); apuSel=dep.getAttribute('data-apu-dep'); pintarHoy(); apuPintarRitmo(); return; }
    var trab=t.closest('[data-apu-trab]');
    if(trab){ apuRecordar(); apuTrabajo=trab.getAttribute('data-apu-trab'); pintarHoy(); return; }
    var rp=t.closest('[data-apu-rpe]');
    if(rp){
      apuRecordar();
      var v=parseInt(rp.getAttribute('data-apu-rpe'),10);
      /* Volver a tocar el mismo número lo quita: el esfuerzo es opcional y
         hay que poder deshacer un toque sin recargar la pantalla. */
      apuRpe = (apuRpe===v) ? null : v;
      pintarHoy(); apuPintarRitmo(); return;

    if(t.closest('#apu-ok')){ apuGuardar(APU_DIA); return; }

    var w=t.closest('[data-sem-ojeo]');

      else ojearSemana(addDias(OJEO_LUNES, parseInt(v,10)));

    }

    var o=t.closest('[data-ojear]');
    if(o){ DIA_OJEO=o.getAttribute('data-ojear'); pintarHoy(); return; }
    var b=t.closest('[data-ir]'); if(!b) return;
    verDia(b.getAttribute('data-ir'), b.getAttribute('data-fb'));
