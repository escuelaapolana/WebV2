<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi zona · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .at-wrap { max-width: 860px; margin: 0 auto; padding: clamp(22px,4vw,40px) clamp(16px,4vw,40px); }
  .at-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(30px,6vw,44px); color: var(--navy); margin: 0 0 4px; }
  .at-cab .sub { font-family: var(--fuente-mono); font-size: 12px; letter-spacing:.1em; text-transform:uppercase; color: var(--texto-tenue); }
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,28px); box-shadow: var(--sombra-suave); margin-top: 20px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--texto-tenue); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:11px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  @media (max-width:640px){ .graficos{ grid-template-columns:1fr; } }
  .grafico { border:1px solid var(--linea); border-radius:14px; padding:10px 8px 4px; background: var(--crema); }
  .grafico svg { width:100%; height:auto; display:block; }
  .grafico .leyenda { font-size:11px; color: var(--texto-suave); padding:2px 4px 4px; }
  .grafico .mejora { color:#1e7a3d; font-weight:600; }
  .entreno-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .entreno-cab h2 { margin:0; }
  .fecha-pill { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; background: var(--azul); color:#fff; padding:4px 10px; border-radius:999px; }
  .entreno-titulo { font-size:18px; font-weight:600; color: var(--navy); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-family: var(--fuente-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; background: var(--crema-media); color: var(--texto-suave); padding:3px 9px; border-radius:999px; }
  .nota { font-size:14px; color: var(--texto); background: var(--crema); border-left:3px solid var(--azul); padding:10px 12px; border-radius:8px; margin:0 0 16px; }
  .bloque { margin-bottom:14px; }
  .bloque h3 { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color: var(--azul-oscuro); margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--linea); }
  .fila { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:7px 0; border-bottom:1px dashed var(--linea); }
  .fila:last-child { border-bottom:0; }
  .fila .ej { font-size:15px; color: var(--navy); font-weight:500; }
  .fila .fparams { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { font-size:12px; color: var(--texto-suave); background: var(--crema-media); padding:2px 8px; border-radius:6px; white-space:nowrap; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="at-wrap" id="at-wrap"><p class="intro">Cargando…</p></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('at-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  // Convierte una marca de texto a número (admite mm:ss.cc y ss.cc)
  function tiempoANum(s) {
    if (s == null) return null;
    s = String(s).trim().replace(',', '.');
    if (s.indexOf(':') > -1) { var p = s.split(':'); return (parseInt(p[0], 10) || 0) * 60 + (parseFloat(p[1]) || 0); }
    var n = parseFloat(s); return isNaN(n) ? null : n;
  }
  // Dibuja un mini-gráfico de evolución (SVG) para una prueba
  function graficoPrueba(nombre, pts) {
    var W = 320, H = 150, padL = 10, padR = 10, padT = 30, padB = 24;
    var ys = pts.map(function (p) { return p.y; });
    var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
    if (min === max) { min -= 1; max += 1; }
    var plotW = W - padL - padR, plotH = H - padT - padB;
    function X(i) { return padL + (pts.length === 1 ? plotW / 2 : plotW * i / (pts.length - 1)); }
    // En carreras, menos tiempo es mejor → lo ponemos arriba (línea que sube = mejora)
    function Y(v) { return padT + plotH * (v - min) / (max - min); }
    var linea = pts.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ');
    var puntos = pts.map(function (p, i) {
      var x = X(i), y = Y(p.y);
      return '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="var(--azul)"></circle>' +
        '<text x="' + x.toFixed(1) + '" y="' + (y - 8).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--navy)">' + esc(p.disp) + '</text>' +
        '<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="8" fill="#9a958c">' + esc((p.fecha || '').slice(5)) + '</text>';
    }).join('');
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de ' + esc(nombre) + '">' +
      '<text x="' + padL + '" y="16" font-size="12" font-weight="700" fill="var(--navy)">' + esc(nombre) + '</text>' +
      '<polyline fill="none" stroke="var(--azul)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + linea + '"></polyline>' +
      puntos + '</svg>';
    // Diferencia entre la primera y la última marca
    var d = pts[0].y - pts[pts.length - 1].y;
    var ley = '';
    if (Math.abs(d) > 0.001) {
      ley = d > 0 ? '<span class="mejora">▲ ' + d.toFixed(2) + ' mejor que al empezar</span>' : '▼ ' + Math.abs(d).toFixed(2) + ' respecto al inicio';
    }
    return '<div class="grafico">' + svg + (ley ? '<div class="leyenda">' + ley + '</div>' : '') + '</div>';
  }

  // Formatea 2026-07-31 -> "vie 31 jul"
  function formatFecha(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    var dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    var mes = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return dias[d.getDay()] + ' ' + d.getDate() + ' ' + mes[d.getMonth()];
  }
  // Una fila del entreno: ejercicio + parámetros (series, distancia, ritmo, descanso…)
  function filaHTML(f) {
    var main = esc(f.ejercicio || f.nombre || '');
    var parts = [];
    if (f.series && f.distancia) parts.push(esc(f.series) + ' × ' + esc(f.distancia));
    else if (f.series) parts.push(esc(f.series) + ' series');
    else if (f.distancia) parts.push(esc(f.distancia));
    if (f.ritmo) parts.push('ritmo ' + esc(f.ritmo));
    if (f.descanso) parts.push('desc. ' + esc(f.descanso));
    if (f.tiempo) parts.push(esc(f.tiempo));
    if (f.detalle) parts.push(esc(f.detalle));
    if (f.nota) parts.push(esc(f.nota));
    var chips = parts.map(function (p) { return '<span class="fchip">' + p + '</span>'; }).join('');
    return '<div class="fila"><span class="ej">' + main + '</span><span class="fparams">' + chips + '</span></div>';
  }
  // Tarjeta completa del entreno
  function renderEntreno(s, todayISO) {
    var esHoy = s.fecha === todayISO;
    var fechaTxt = (esHoy ? 'Hoy · ' : '') + formatFecha(s.fecha);
    var chips = [s.tipo, (s.rol || '').replace(/_/g, ' ')].filter(Boolean)
      .map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('');
    var bloques = Array.isArray(s.bloques) ? s.bloques : [];
    var bloquesHtml = bloques.map(function (b) {
      var filas = (b.filas || []).map(filaHTML).join('') || '<div class="fila"><span class="ej vacio">Por definir</span></div>';
      return '<div class="bloque"><h3>' + esc(b.etiqueta || '') + '</h3>' + filas + '</div>';
    }).join('');
    return '<div class="tarjeta">' +
      '<div class="entreno-cab"><h2>Mi entreno</h2><span class="fecha-pill">' + esc(fechaTxt) + '</span></div>' +
      (s.titulo ? '<div class="entreno-titulo">' + esc(s.titulo) + '</div>' : '') +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      (s.nota_razonamiento ? '<p class="nota">' + esc(s.nota_razonamiento) + '</p>' : '') +
      '<div class="bloques">' + bloquesHtml + '</div></div>';
  }

  // Buscar la ficha de atleta ligada a este perfil
  var at = null;
  try {
    var r = await sb.from('atletas').select('id,nombre,apellidos,categoria,grupo_id,estado').eq('perfil_id', perfil.id).maybeSingle();
    if (!r.error) at = r.data;
  } catch (e) {}

  var nombre = at ? ((at.nombre||'') + ' ' + (at.apellidos||'')) : (perfil.nombre || '');
  var html = '<div class="at-cab"><h1>Hola, ' + esc(perfil.nombre || nombre) + '</h1>' +
             '<span class="sub">' + (at && at.categoria ? esc(at.categoria) + ' · ' : '') + 'Mi zona de atleta</span></div>';

  if (!at) {
    html += '<div class="tarjeta"><p class="vacio">Todavía no vemos tu ficha de atleta. Puede que falten permisos por activar (bloque B del plan) o que tu ficha no esté enlazada a tu cuenta. Se soluciona pronto.</p></div>';
    wrap.innerHTML = html;
    return;
  }

  // Mi entreno (sesión publicada de mi grupo: la de hoy, o la más reciente)
  var entrenoHtml = '';
  if (at.grupo_id) {
    try {
      var todayISO = new Date().toISOString().slice(0, 10);
      var se = await sb.from('sesiones').select('fecha,dia_semana,tipo,rol,titulo,nota_razonamiento,bloques')
        .eq('grupo_id', at.grupo_id).eq('publicada', true).order('fecha', { ascending: false }).limit(10);
      if (!se.error && se.data && se.data.length) {
        var ses = se.data.filter(function (x) { return x.fecha === todayISO; })[0] || se.data[0];
        entrenoHtml = renderEntreno(ses, todayISO);
      }
    } catch (e) {}
  }

  // Mis marcas (con gráficos de evolución por prueba)
  var marcasHtml = '<p class="vacio">Aún no hay marcas registradas.</p>';
  try {
    var m = await sb.from('marcas_atleta').select('prueba,tiempo_display,fecha,sede,tipo').eq('atleta_id', at.id).order('fecha', { ascending: false }).limit(50);
    if (!m.error && m.data && m.data.length) {
      // Agrupar por prueba para los gráficos
      var porPrueba = {};
      m.data.forEach(function (x) { var k = x.prueba || '—'; (porPrueba[k] = porPrueba[k] || []).push(x); });
      var graficos = '';
      Object.keys(porPrueba).forEach(function (k) {
        var arr = porPrueba[k].map(function (x) { return { fecha: x.fecha || '', y: tiempoANum(x.tiempo_display), disp: x.tiempo_display || '' }; })
          .filter(function (p) { return p.y != null && p.fecha; })
          .sort(function (a, b) { return a.fecha < b.fecha ? -1 : 1; });
        if (arr.length >= 2) graficos += graficoPrueba(k, arr);
      });
      var tabla = '<table><thead><tr><th>Prueba</th><th>Marca</th><th>Fecha</th><th>Dónde</th></tr></thead><tbody>' +
        m.data.map(function (x) { return '<tr><td>' + esc(x.prueba) + '</td><td>' + esc(x.tiempo_display || '') + '</td><td>' + esc(x.fecha || '') + '</td><td>' + esc(x.sede || '') + '</td></tr>'; }).join('') +
        '</tbody></table>';
      marcasHtml = (graficos ? '<div class="graficos">' + graficos + '</div>' : '<p class="vacio" style="margin-bottom:14px;">Cuando tengas 2+ marcas de una misma prueba, aquí verás tu evolución.</p>') + tabla;
    }
  } catch (e) {}

  // Mis pagos
  var pagosHtml = '<p class="vacio">No hay pagos registrados.</p>';
  try {
    var p = await sb.from('pagos').select('concepto,importe,estado,fecha_vencimiento').eq('atleta_id', at.id).order('fecha_vencimiento', { ascending: false }).limit(20);
    if (!p.error && p.data && p.data.length) {
      pagosHtml = '<table><thead><tr><th>Concepto</th><th>Importe</th><th>Estado</th><th>Vence</th></tr></thead><tbody>' +
        p.data.map(function(x){ var ok = (x.estado==='cobrado'||x.estado==='pagado'); return '<tr><td>'+esc(x.concepto||'')+'</td><td>'+(x.importe!=null?esc(x.importe)+' €':'')+'</td><td><span class="pill'+(ok?' ok':'')+'">'+esc(x.estado||'')+'</span></td><td>'+esc(x.fecha_vencimiento||'')+'</td></tr>'; }).join('') +
        '</tbody></table>';
    }
  } catch (e) {}

  html += entrenoHtml;
  html += '<div class="tarjeta"><h2>Mis marcas</h2>' + marcasHtml + '</div>';
  html += '<div class="tarjeta"><h2>Mis pagos</h2>' + pagosHtml + '</div>';
  html += '<div class="tarjeta"><h2>Próximamente</h2><p class="vacio">Marcar el entreno como hecho, el feedback con ritmos por serie y el bono de El Cubo llegarán en las siguientes fases.</p></div>';
  wrap.innerHTML = html;
});
</script>

</body>
</html>
