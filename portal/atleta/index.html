<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi zona · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .at-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  /* El margen inferior evita que la primera tarjeta se pegue al titular y le corte la coma. */
  .at-cab[hidden] { display:none; }
  .at-cab { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
  .at-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(28px,6vw,42px); color: var(--navy); margin: 0; line-height:1; }
  .at-cab .sub { display:block; font-family: var(--fuente-mono); font-size: 12.5px; letter-spacing:.03em; text-transform:none; color: var(--texto-suave); margin-bottom:5px; }
  /* Iniciales, no un número: el círculo con el día parecía un contador de avisos. */
  .at-cab .at-ini { flex:none; width:46px; height:46px; border-radius:50%; background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; letter-spacing:.03em; box-shadow: var(--sombra-suave); }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 200px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding:8px; box-shadow: var(--sombra-suave); }
  .side nav a { cursor:pointer; font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:none; color: var(--texto-suave); padding:10px 12px; border-radius:10px; text-decoration:none; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { background: var(--navy); color:#fff; }
  .cont { flex:1 1 auto; min-width:0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(18px,3vw,26px); box-shadow: var(--sombra-suave); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:none; color: var(--texto-suave); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:12px; padding:3px 9px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }

  /* Estado vacío con cuerpo: icono de línea, frase corta y, si aplica, una acción. */
  .vacio-caja { text-align:center; padding: clamp(20px,4vw,28px) 16px; }
  .vacio-caja .vc-ic { width:46px; height:46px; border-radius:50%; background: var(--crema-media); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .vacio-caja .vc-ic svg { width:24px; height:24px; }
  .vacio-caja h3 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:20px; color: var(--navy); margin:0 0 6px; }
  .vacio-caja p { color: var(--texto-suave); font-size:14px; margin:0 0 14px; max-width:34ch; margin-left:auto; margin-right:auto; }
  .vacio-caja .btn { min-height:44px; display:inline-flex; align-items:center; }

  /* gráficos */
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
  .grafico { border:1px solid var(--linea); border-radius:14px; padding:10px 8px 4px; background: var(--crema); }
  .grafico svg { width:100%; height:auto; display:block; }
  .grafico .leyenda { font-size:12.5px; color: var(--texto-suave); padding:2px 4px 4px; }
  .grafico .mejora { color:#1e7a3d; font-weight:600; }
  .records { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .record { background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); color:#fff; border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; box-shadow: var(--sombra-suave); }
  .record .r-prueba { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.03em; text-transform:none; color: rgba(255,255,255,.82); }
  .record .r-marca { font-family: var(--fuente-titulo); font-size:26px; font-weight:700; line-height:1.1; }
  .record .r-fecha { font-size:12px; color: rgba(255,255,255,.7); }

  /* Marcas: filtrar entre competición y entrenamiento (las antiguas, sin dato, salen en «Todas») */
  .mk-filtro { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
  .mk-f { min-height:44px; display:inline-flex; align-items:center; gap:7px; padding:9px 15px; box-sizing:border-box;
    border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave);
    font:inherit; font-size:14px; line-height:1; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .mk-f:hover { border-color: var(--azul); color: var(--navy); }
  .mk-f .n { font-size:12.5px; color: var(--texto-tenue); }
  .mk-f[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color:#fff; font-weight:600; }
  .mk-f[aria-pressed="true"] .n { color: rgba(255,255,255,.78); }

  /* Marcas: lista de filas (en móvil una tabla de 5 columnas se aplastaba) */
  .mk-lista { display:flex; flex-direction:column; }
  .mk-fila { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--linea); }
  .mk-fila:last-child { border-bottom:none; }
  .mk-fila .mk-txt { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .mk-fila .mk-nom { font-size:15px; font-weight:600; color: var(--navy); }
  .mk-fila .mk-cuando { font-size:12.5px; color: var(--texto-suave); }
  .mk-fila .mk-der { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .mk-fila .mk-marca { font-family: var(--fuente-titulo); font-size:25px; font-weight:700; line-height:1; color: var(--azul-oscuro); }
  .mk-fila .mk-tags { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .pg-importe { font-family: var(--fuente-titulo); font-size:22px; font-weight:700; line-height:1; color: var(--navy); }

  /* entreno */
  .entreno-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .entreno-cab h2 { margin:0; }
  .fecha-pill { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.03em; text-transform:none; background: var(--azul); color:#fff; padding:5px 11px; border-radius:999px; }
  .entreno-titulo { font-size:18px; font-weight:600; color: var(--navy); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-family: var(--fuente-mono); font-size:12px; text-transform:none; letter-spacing:.03em; background: var(--crema-media); color: var(--texto-suave); padding:4px 10px; border-radius:999px; }
  .nota { font-size:14px; color: var(--texto); background: var(--crema); border-left:3px solid var(--azul); padding:10px 12px; border-radius:8px; margin:0 0 16px; }
  /* Bloques plegables: en el móvil el entreno entero era una lista larguísima.
     Ahora cada parte (calentamiento, principal, vuelta a la calma) se abre y se cierra. */
  .bloques { display:flex; flex-direction:column; gap:10px; }
  .bloque { border:1px solid var(--linea); border-radius:14px; background: var(--crema); overflow:hidden; }
  .bloque[open] { background:#fff; border-color: var(--linea-borde); }
  /* La cabecera es el botón: 52px de alto, se toca con prisa y con guantes */
  .bl-cab { list-style:none; display:flex; align-items:center; gap:10px; min-height:52px; padding:9px 14px; box-sizing:border-box; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .bl-cab::-webkit-details-marker { display:none; }
  .bl-cab::marker { content:''; }
  .bl-cab:hover { background: var(--crema-media); }
  .bloque[open] .bl-cab { border-bottom:1px solid var(--linea); }
  .bloque[open] .bl-cab:hover { background: var(--crema); }
  .bl-cab:focus-visible { outline:2px solid var(--azul); outline-offset:-2px; }
  .bl-fl { flex:none; width:18px; height:18px; color: var(--azul-oscuro); transition: transform .15s; }
  .bloque[open] .bl-fl { transform: rotate(90deg); }
  .bl-mid { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .bl-tit { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:18px; line-height:1.05; color: var(--navy); }
  .bl-res { font-size:12.5px; line-height:1.3; color: var(--texto-suave); }
  .bl-prog { flex:none; font-size:12px; line-height:1.1; color: var(--azul-oscuro); background: var(--azul-suave); border-radius:999px; padding:5px 10px; white-space:nowrap; }
  .bl-prog.lleno { background:#e6f4ea; color:#1e7a3d; font-weight:600; }
  .bl-prog[hidden] { display:none; }
  .bl-cuerpo { padding:2px 14px 8px; }

  /* Un ejercicio: su línea de datos y, justo debajo, sus huecos para anotar */
  .ejer { padding:11px 0; border-bottom:1px solid var(--linea); }
  .ejer:last-child { border-bottom:none; }
  .fila { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:0; }
  .fila .ej { font-size:15px; color: var(--navy); font-weight:600; }
  .fila .fparams { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { font-size:12px; color: var(--texto-suave); background: var(--crema-media); padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .fchip.mio { background: var(--azul); color:#fff; font-weight:600; }
  .serie-cap { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:11px 0 7px; }
  .serie-cap b { font-size:12.5px; font-weight:600; color: var(--azul-oscuro); }
  .serie-cap span { font-size:12px; color: var(--texto-suave); white-space:nowrap; }
  /* Rejilla en vez de tira: cada serie con su número y bien separada del dedo de al lado */
  .serie-inputs { display:grid; grid-template-columns:repeat(auto-fill,minmax(82px,1fr)); gap:10px; padding:0; border:0; }
  .serie-hueco { display:flex; flex-direction:column; gap:4px; margin:0; font-weight:400; }
  .serie-hueco .s-n { font-size:12px; font-weight:600; color: var(--texto-suave); }
  .serie-in { width:100%; box-sizing:border-box; min-height:46px; text-align:center; padding:10px 6px; border:1px solid var(--linea-borde); border-radius:10px; font-size:16px; font-family: var(--fuente-mono); color: var(--navy); background: var(--crema); }
  .serie-in::placeholder { color: var(--texto-tenue); }
  .serie-in:focus { outline:none; border-color: var(--azul); background:#fff; box-shadow:0 0 0 3px var(--azul-suave); }
  .serie-in.puesto { border-color: var(--azul); background:#fff; font-weight:600; }
  .fb-sucio { font-size:12.5px; color:#B96F09; }
  .fb-sucio[hidden] { display:none; }
  .chip.personal { background: var(--azul-suave); color: var(--azul-oscuro); font-weight:700; }

  /* semana: tira de días y navegación */
  .sem-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .sem-cab h2 { margin:0; }
  .sem-nav { display:flex; gap:6px; flex-wrap:wrap; }
  /* 44px de alto: son botones que se tocan con prisa */
  .sem-btn { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.03em; text-transform:none; min-height:44px; padding:8px 14px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); cursor:pointer; line-height:1; display:inline-flex; align-items:center; }
  .sem-btn:hover { border-color: var(--azul); color: var(--navy); }
  .sem-btn.ahora { border-color: var(--azul); color: var(--azul-oscuro); font-weight:700; }
  .sem-rango { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.03em; text-transform:none; color: var(--texto-suave); margin:10px 0 8px; }
  .dias { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .dias.cargando { opacity:.45; }
  .dia { flex:1 1 0; min-width:58px; min-height:78px; box-sizing:border-box; font:inherit; -webkit-appearance:none; appearance:none; background: var(--crema); border:1px solid var(--linea); border-radius:12px; padding:8px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .dia:hover { border-color: var(--azul); }
  .dia .d-nom { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.03em; text-transform:none; color: var(--texto-suave); }
  .dia .d-num { font-family: var(--fuente-titulo); font-size:20px; font-weight:700; line-height:1; color: var(--navy); }
  .dia .d-tipo { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.01em; text-transform:none; color: var(--azul-oscuro); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .dia .d-punto { width:7px; height:7px; border-radius:50%; background: var(--azul); }
  .dia .d-punto.personal { background: var(--navy); }
  .dia.vacio { background:#fff; }
  .dia.vacio .d-num { color: var(--texto-tenue); font-weight:600; }
  .dia.vacio .d-tipo { color: var(--texto-tenue); }
  .dia.hoy { border-color: var(--azul); border-width:2px; padding:7px 3px; }
  .dia.hoy .d-nom { color: var(--azul-oscuro); font-weight:700; }
  .dia.sel { background: var(--navy); border-color: var(--navy); box-shadow: var(--sombra-suave); }
  .dia.sel .d-nom, .dia.sel .d-num, .dia.sel .d-tipo { color:#fff; }
  .dia.sel .d-punto, .dia.sel .d-punto.personal { background:#fff; }
  .dia.hoy.sel { border-color: var(--azul); }

  /* ---- INICIO (maqueta 22a): franja de aviso, entreno de hoy, dos tarjetas ---- */
  /* Franja ámbar: recibo pendiente. Desaparece si está al día. */
  .franja { display:flex; align-items:center; gap:12px; background:#FDF3E3; border:1px solid #EBD9B8; border-radius:14px; padding:12px 14px; margin-bottom:12px; min-height:48px; box-sizing:border-box; cursor:pointer; }
  .franja .fr-pt { flex:none; width:8px; height:8px; border-radius:999px; background:#B96F09; }
  .franja .fr-txt { flex:1; min-width:0; font-size:14px; line-height:1.4; color:#6B5227; }
  .franja .fr-acc { flex:none; font-size:14px; font-weight:600; color:#B96F09; }
  .franja.azul { background: var(--azul-suave); border-color:#CFE2F1; }
  .franja.azul .fr-pt { background: var(--azul); }
  .franja.azul .fr-txt { color: var(--navy); }
  .franja.azul .fr-acc { color: var(--azul-oscuro); }

  .hoy-card { background: var(--navy); border-radius:20px; padding: clamp(18px,3vw,22px); color:#fff; display:flex; flex-direction:column; gap:14px; margin-bottom:14px; box-shadow: 0 24px 44px -26px rgba(46,66,86,.9); }
  .hoy-card .hc-cifras { display:flex; gap:8px; }
  .hoy-card .hc-cifra { flex:1 1 0; min-width:0; background: rgba(255,255,255,.12); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:1px; }
  .hoy-card .hc-cifra b { font-family: var(--fuente-mono); font-weight:600; font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hoy-card .hc-cifra span { font-size:12px; color: rgba(255,255,255,.65); }

  /* Dos tarjetas: próxima carrera y última marca */
  .minis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .mini { background:#fff; border:1px solid var(--linea); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:4px; text-decoration:none; cursor:pointer; min-height:48px; }
  .mini:hover { border-color: var(--azul); }
  .mini .mi-et { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.02em; text-transform:none; color: var(--texto-suave); }
  .mini .mi-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:22px; line-height:1.05; text-transform:uppercase; color: var(--navy); }
  .mini .mi-pie { font-family: var(--fuente-mono); font-size:12.5px; color: var(--azul-oscuro); }
  .mini .mi-pie.bien { color:#3F7A4C; font-weight:600; }
  .hoy-card .hc-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .hoy-card .hc-grupo { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color: rgba(255,255,255,.9); }
  .hoy-card .hc-tipo { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color: rgba(255,255,255,.72); }
  .hoy-card .hc-tit { font-family: var(--fuente-titulo); font-weight:700; font-size: clamp(28px,5vw,38px); line-height:.98; color:#fff; margin:0; text-transform:none; }
  .hoy-card .hc-det { font-size:14px; color: rgba(255,255,255,.8); margin-top:6px; }
  .hoy-card .hc-lugar { display:flex; align-items:center; gap:8px; font-size:13.5px; color: rgba(255,255,255,.8); }
  .hoy-card .hc-lugar .pt { flex:none; width:6px; height:6px; border-radius:3px; background: rgba(255,255,255,.85); }
  .hoy-card .hc-btns { display:flex; gap:10px; margin-top:4px; flex-wrap:wrap; }
  .hoy-card .hc-ver { flex:1 1 150px; background:#fff; color: var(--azul-oscuro); border:0; border-radius:12px; min-height:48px; padding:13px; font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .hoy-card .hc-ver:hover { background: var(--azul-suave); }
  .hoy-card .hc-ok { flex:1 1 130px; border:1px solid rgba(255,255,255,.32); background: rgba(255,255,255,.08); color:#fff; border-radius:12px; min-height:48px; padding:13px 14px; font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .hoy-card .hc-ok:hover { border-color:#fff; background: rgba(255,255,255,.16); }
  .hoy-card .hc-ok.hecho { background: rgba(127,191,74,.2); border-color: rgba(190,229,160,.6); color:#dcf1c6; }

  .hoy-vacio { background:#fff; border:1px solid var(--linea); border-radius:18px; padding: clamp(22px,4vw,30px) 20px; text-align:center; margin-bottom:18px; box-shadow: var(--sombra-suave); }
  .hoy-vacio .luna { width:58px; height:58px; border-radius:50%; background: var(--crema-media); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .hoy-vacio .luna svg { width:28px; height:28px; }
  .hoy-vacio h2 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size: clamp(22px,4vw,28px); color: var(--navy); margin:0 0 8px; }
  .hoy-vacio p { color: var(--texto-suave); font-size:14px; margin:0 0 16px; }
  .hoy-vacio .btn { min-height:44px; display:inline-flex; align-items:center; }

  .hoy-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 8px; }
  .hoy-tit h2 { font-family: var(--fuente-mono); font-weight:600; text-transform:none; letter-spacing:.02em; font-size:12.5px; color: var(--texto-suave); margin:0; }
  .hoy-tit .cnt-enl { font-size:13px; font-weight:600; color: var(--azul-oscuro); white-space:nowrap; text-decoration:none; }
  .hoy-lista { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .hoy-item { width:100%; text-align:left; font:inherit; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; min-height:48px; }
  .hoy-item:hover { border-color: var(--azul); }
  .hoy-item .d { flex:none; width:52px; font-family: var(--fuente-mono); font-size:12.5px; text-transform:none; color: var(--azul-oscuro); }
  .hoy-item .t { flex:1; min-width:0; font-size:14px; color: var(--navy); }
  .hoy-item .h { flex:none; font-size:13px; color: var(--texto-suave); }

  /* ---- MÁS (maqueta 22b): perfil y tres bloques ---- */
  .ml-cab { font-family: var(--fuente-titulo); text-transform:uppercase; font-size: clamp(26px,5vw,34px); color: var(--navy); margin:0 0 14px; }
  .ml-perfil { display:flex; align-items:center; gap:12px; background: var(--crema-banda); border-radius:16px; padding:12px 16px; margin-bottom:14px; }
  .ml-avatar { flex:none; width:46px; height:46px; border-radius:999px; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; }
  .ml-quien { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .ml-quien b { font-size:16px; font-weight:600; color: var(--navy); }
  .ml-quien span { font-family: var(--fuente-mono); font-size:12.5px; color: var(--texto-suave); }
  .ml-bloque { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .ml-tit { font-family: var(--fuente-mono); font-weight:600; font-size:12.5px; letter-spacing:.02em; text-transform:none; color: var(--texto-suave); padding-left:4px; }
  .ml-caja { background:#fff; border:1px solid var(--linea); border-radius:16px; overflow:hidden; }
  .ml-fila { display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:52px; box-sizing:border-box; border-bottom:1px solid #F4EFE4; text-decoration:none; color: var(--navy); }
  .ml-fila:last-child { border-bottom:none; }
  .ml-fila[href], .ml-fila[data-sec-ir], .ml-fila.salir { cursor:pointer; }
  .ml-fila[href]:hover, .ml-fila[data-sec-ir]:hover, .ml-fila.salir:hover { background: var(--crema); }
  .ml-fila .ml-txt { flex:1; min-width:0; font-size:16px; color: var(--navy); }
  .ml-fila .ml-chev { flex:none; font-size:18px; color:#C8C0B0; line-height:1; }
  .ml-fila .ml-dato { flex:none; font-size:13px; color: var(--texto-suave); text-align:right; }
  .ml-fila .ml-dato.pend { font-family: var(--fuente-mono); font-size:12.5px; color:#B96F09; font-weight:600; }
  .ml-fila .ml-num { flex:none; background: var(--azul); color:#fff; font-family: var(--fuente-mono); font-size:12px; border-radius:999px; padding:3px 9px; }
  .ml-fila.salir .ml-txt { color:#B0563A; font-weight:600; }

  .enlace-accion { background:none; border:0; padding:0; font:inherit; font-weight:600; font-size:14px; color: var(--azul-oscuro); cursor:pointer; min-height:44px; display:inline-flex; align-items:center; }
  .enlace-accion:hover { color: var(--azul-hover); }

  /* Puntuar con fichas tocables en vez de dos desplegables fríos */
  .escala-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:14px 0 7px; }
  .escala-tit b { font-size:14px; font-weight:600; color: var(--navy); }
  .escala-tit span { font-size:12.5px; color: var(--texto-suave); }
  .escala { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  @media (min-width:560px){ .escala { grid-template-columns:repeat(10,1fr); } }
  .escala .esc { min-height:44px; font:inherit; font-size:15px; font-weight:600; color: var(--texto-suave); background:#fff; border:1px solid var(--linea-borde); border-radius:11px; cursor:pointer; padding:0; }
  .escala .esc:hover { border-color: var(--azul); color: var(--navy); }
  .escala .esc.sel { background: var(--azul); border-color: var(--azul); color:#fff; }
  .fb-mas { margin-top:16px; min-height:44px; display:inline-flex; align-items:center; gap:8px; background:none; border:0; padding:0; font:inherit; font-size:14px; font-weight:600; color: var(--azul-oscuro); cursor:pointer; }
  .fb-mas:hover { color: var(--azul-hover); }
  .fb-mas .fl { transition: transform .15s; display:inline-block; }
  .fb-mas.abierto .fl { transform: rotate(90deg); }
  .fb-detalles[hidden] { display:none; }
  .fb-detalles { border-top:1px solid var(--linea); margin-top:12px; padding-top:4px; }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; }
  .rango { display:flex; align-items:center; gap:10px; }
  .rango output { font-family: var(--fuente-mono); font-weight:700; color: var(--azul-oscuro); min-width:26px; text-align:center; }

  /* --- Barra inferior única (maqueta 22c): Inicio · Entreno · Calendario · Marcas · Más.
         Iconos de línea de 24 px sin relleno; el activo se distingue por color y peso,
         no por una píldora de fondo. Objetivos táctiles de 48 px. --- */
  .tabbar { display:none; }
  @media (max-width:760px){
    /* En columna hay que estirar: si no, la columna se ajusta al contenido y sobresale */
    .layout { flex-direction:column; align-items:stretch; gap:0; }
    .cont { width:100%; }
    .side { display:none; }                  /* en móvil manda la barra de abajo */
    body { padding-bottom:88px; }            /* hueco para la barra fija */
    .graficos { grid-template-columns:1fr; }
    .grid2 { grid-template-columns:1fr; }
    .tabbar { display:flex; align-items:stretch; position:fixed; left:0; right:0; bottom:0; z-index:600;
      background:rgba(251,249,244,.96); -webkit-backdrop-filter:saturate(1.3) blur(10px); backdrop-filter:saturate(1.3) blur(10px);
      border-top:1px solid var(--linea); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); }
    .tabbar a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
      min-height:48px; text-decoration:none; color: var(--texto-tenue);
      font-size:11px; letter-spacing:.01em; text-transform:none; -webkit-tap-highlight-color:transparent; }
    .tabbar a .ic { width:24px; height:24px; }
    .tabbar a.activo { color: var(--azul-oscuro); }
    .tabbar a.activo span { font-weight:600; }
    .tabbar a.activo .ic { stroke-width:2; }
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="at-wrap" id="at-wrap"><p class="intro">Cargando…</p></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('at-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  // ---------- helpers ----------
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){ var p=s.split(':'); if(p.length>=3) return (parseInt(p[0],10)||0)*3600+(parseInt(p[1],10)||0)*60+(parseFloat(p[2])||0); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); } var n=parseFloat(s); return isNaN(n)?null:n; }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function fechaLarga(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], me=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function iniciales(nom,ape){ var a=(nom||'').trim().charAt(0), b=(ape||'').trim().charAt(0); return ((a+b)||'·').toUpperCase(); }
  function eur(n){ var v=parseFloat(n); return (isNaN(v)?0:v).toFixed(2).replace('.',',')+' €'; }

  // ---------- fechas: semana de lunes a domingo ----------
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  function addDias(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  // Lunes de la semana de esa fecha (el domingo cuenta como final de su semana, no como principio)
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  function difDias(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); }

  // ¿La prueba mide distancia (salto/lanzamiento)? Entonces MÁS es mejor.
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+me[d.getMonth()]; }
  function graficoPrueba(nombre, pts, masMejor, idx){
    var W=340,H=172,padL=14,padR=14,padT=38,padB=28;
    var ys=pts.map(function(p){return p.y;});
    var min=Math.min.apply(null,ys),max=Math.max.apply(null,ys);
    var span=(max-min)||Math.max(Math.abs(max)*0.1,1); var lo=min-span*0.22, hi=max+span*0.22;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    function X(i){ return padL+(pts.length===1?plotW/2:plotW*i/(pts.length-1)); }
    function Y(v){ var t=(v-lo)/(hi-lo); return padT+plotH*(masMejor?(1-t):t); }
    var bestI=0; for(var b=1;b<pts.length;b++){ if(masMejor?pts[b].y>pts[bestI].y:pts[b].y<pts[bestI].y) bestI=b; }
    var gid='grad'+(idx||0);
    var grid=''; for(var g=0;g<=2;g++){ var gy=(padT+plotH*g/2).toFixed(1); grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--linea)" stroke-width="1" stroke-dasharray="2 5"></line>'; }
    var coords=pts.map(function(p,i){return X(i).toFixed(1)+','+Y(p.y).toFixed(1);});
    var area='M'+padL+','+(padT+plotH).toFixed(1)+' L'+coords.join(' L')+' L'+(W-padR)+','+(padT+plotH).toFixed(1)+' Z';
    var puntos=pts.map(function(p,i){ var x=X(i),y=Y(p.y); var best=(i===bestI&&pts.length>1);
      return (best?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="7" fill="var(--azul)" opacity="0.16"></circle>':'')+
        '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(best?4.3:3)+'" fill="'+(best?'var(--azul-oscuro)':'#fff')+'" stroke="var(--azul)" stroke-width="2"></circle>'+
        '<text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+(best?'var(--azul-oscuro)':'var(--navy)')+'">'+esc(p.disp)+'</text>'+
        '<text x="'+x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="8.5" fill="#9a958c">'+esc(fechaCorta(p.fecha))+'</text>';
    }).join('');
    var svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolución de '+esc(nombre)+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--azul)" stop-opacity="0.28"></stop><stop offset="1" stop-color="var(--azul)" stop-opacity="0"></stop></linearGradient></defs>'+
      grid+'<path d="'+area+'" fill="url(#'+gid+')"></path>'+
      '<polyline fill="none" stroke="var(--azul)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+coords.join(' ')+'"></polyline>'+puntos+
      '<text x="'+padL+'" y="19" font-size="12.5" font-weight="700" fill="var(--navy)">'+esc(nombre)+'</text>'+
      '<text x="'+(W-padR)+'" y="19" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--azul-oscuro)">MMP '+esc(pts[bestI].disp)+'</text></svg>';
    var mej = masMejor ? (pts[pts.length-1].y - pts[0].y) : (pts[0].y - pts[pts.length-1].y);
    var u = masMejor ? ' m' : '', ley='';
    if(mej>0.001) ley='<span class="mejora">▲ '+mej.toFixed(2)+u+' mejor que al empezar</span>';
    else if(mej<-0.001) ley='▼ '+Math.abs(mej).toFixed(2)+u+' respecto al inicio';
    return '<div class="grafico">'+svg+(ley?'<div class="leyenda">'+ley+'</div>':'')+'</div>';
  }

  // ---- Ritmos personales: un "90%" se convierte en TU tiempo, según tu mejor marca ----
  var MMP = {};   // { 'nombre de prueba': {seg: 7.85, disp:'7.85'} }
  function segATexto(s){
    if(s==null||isNaN(s)) return '';
    if(s<60) return s.toFixed(2);                       // 7.85
    if(s<3600){                                          // 4:33.00
      var m=Math.floor(s/60), r=s-m*60;
      return m+':'+(r<10?'0':'')+r.toFixed(2);
    }
    var h=Math.floor(s/3600), mm=Math.floor((s-h*3600)/60), ss=Math.round(s-h*3600-mm*60);
    if(ss===60){ ss=0; mm++; }                           // 3:35:00 (maratón, ultras…)
    return h+':'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
  }
  // Busca la mejor marca del atleta para la distancia de una fila (p. ej. "60 m" -> "60 m lisos")
  function mmpParaDistancia(dist){
    if(!dist) return null;
    var m=String(dist).match(/(\d[\d.,]*)\s*m/i); if(!m) return null;
    var metros=m[1].replace(/[.,]/g,'');
    var mejor=null;
    Object.keys(MMP).forEach(function(prueba){
      var pm=prueba.match(/(\d[\d.,]*)\s*m/i); if(!pm) return;
      if(pm[1].replace(/[.,]/g,'')===metros && (!mejor || MMP[prueba].seg<mejor.seg)) mejor=MMP[prueba];
    });
    return mejor;
  }
  // De "90%" o "90-95%" saca el tiempo objetivo. Menos % = más lento (tiempo = mmp / (%/100)).
  function ritmoPersonal(f){
    var r=f.ritmo; if(!r) return '';
    var pcts=String(r).match(/(\d{2,3})\s*%/g); if(!pcts||!pcts.length) return '';
    var base=mmpParaDistancia(f.distancia); if(!base) return '';
    var nums=pcts.map(function(p){ return parseFloat(p); }).filter(function(n){ return n>=40&&n<=110; });
    if(!nums.length) return '';
    var tiempos=nums.map(function(p){ return base.seg/(p/100); }).sort(function(a,b){ return a-b; });
    return tiempos.length>1 ? segATexto(tiempos[0])+'–'+segATexto(tiempos[tiempos.length-1]) : segATexto(tiempos[0]);
  }

  function esSerie(f){ var n=parseInt(f.series,10); return (n>0 && n<=30)?n:0; }
  // Para meter texto dentro de un atributo: esc() no toca las comillas y un nombre
  // como 3x300 "al 90%" rompería el data-eje que usa el guardado.
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
  function filaHTML(f, key){
    var main=esc(f.ejercicio||f.nombre||''); var parts=[];
    if(f.series&&f.distancia) parts.push(esc(f.series)+' × '+esc(f.distancia));
    else if(f.series) parts.push(esc(f.series)+' series'); else if(f.distancia) parts.push(esc(f.distancia));
    if(f.ritmo) parts.push('ritmo '+esc(f.ritmo));
    if(f.descanso) parts.push('desc. '+esc(f.descanso));
    if(f.tiempo) parts.push(esc(f.tiempo));
    if(f.detalle) parts.push(esc(f.detalle));
    if(f.nota) parts.push(esc(f.nota));
    var chips=parts.map(function(p){return '<span class="fchip">'+p+'</span>';}).join('');
    var tuyo=ritmoPersonal(f);
    if(tuyo) chips+='<span class="fchip mio" title="Calculado con tu mejor marca">tú: '+esc(tuyo)+'</span>';
    var html='<div class="fila"><span class="ej">'+main+'</span><span class="fparams">'+chips+'</span></div>';
    var n=esSerie(f);
    // Los huecos van DENTRO del ejercicio, cada uno con su número: así no hay duda de dónde anota uno cada serie.
    if(n>0){
      var ins='';
      for(var i=0;i<n;i++){
        ins+='<label class="serie-hueco"><span class="s-n">'+(i+1)+'ª</span>'+
             '<input class="serie-in" data-key="'+key+'" data-i="'+i+'" inputmode="decimal" '+
             'placeholder="–" aria-label="Serie '+(i+1)+' de '+n+' de '+escA(f.ejercicio||f.nombre||'')+'"></label>';
      }
      html+='<div class="serie-cap"><b>Tus tiempos</b><span class="serie-cnt">0 de '+n+'</span></div>'+
            '<div class="serie-inputs" data-eje="'+escA(f.ejercicio||f.nombre||'')+'">'+ins+'</div>';
    }
    return '<div class="ejer">'+html+'</div>';
  }
  // Lo que se lee en la cabecera de un bloque cerrado: cuánto hay y de qué va
  function resumenBloque(b){
    var filas=(b.filas||[]); var p=[];
    if(b.matiz) p.push(String(b.matiz));
    if(!filas.length) return p.length?p.join(' · '):'Por definir';
    p.push(filas.length===1?'1 ejercicio':filas.length+' ejercicios');
    var f=null; filas.forEach(function(x){ if(!f && esSerie(x)) f=x; });
    if(f){
      if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
      else if(f.series) p.push(f.series+' series');
    }
    return p.join(' · ');
  }
  // Qué bloques quedan abiertos: lo que dejó el atleta la última vez y, si es la
  // primera, la parte principal (o el primer bloque si ninguno se llama así).
  function claveBloques(sid){ return 'apolana.entreno.bloques.'+sid; }
  function bloquesAbiertos(s, bloques){
    var g=null;
    try { var raw=window.localStorage.getItem(claveBloques(s.id)); if(raw) g=JSON.parse(raw); } catch(e){}
    if(Array.isArray(g)) return function(i){ return g.indexOf(i)>-1; };
    var pri=-1;
    bloques.forEach(function(b,i){ if(pri<0 && /principal/i.test(b.etiqueta||'')) pri=i; });
    if(pri<0) pri=0;
    return function(i){ return i===pri; };
  }
  function recordarBloques(caja){
    if(!caja) return;
    var sid=caja.getAttribute('data-sid'); if(!sid) return;
    var ab=[];
    caja.querySelectorAll('.bloque').forEach(function(d){ if(d.open) ab.push(parseInt(d.getAttribute('data-b'),10)); });
    try { window.localStorage.setItem(claveBloques(sid), JSON.stringify(ab)); } catch(e){}
  }
  var FLECHA='<svg class="bl-fl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  function renderEntreno(s, todayISO){
    var esHoy=s.fecha===todayISO; var fechaTxt=(esHoy?'Hoy · ':'')+formatFecha(s.fecha);
    var chips=[s.tipo,(s.rol||'').replace(/_/g,' ')].filter(Boolean).map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('');
    if(s.atletas_ids) chips='<span class="chip personal" title="Este entreno lo ha preparado tu entrenador solo para ti">Solo para ti</span>'+chips;
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var abierto=bloquesAbiertos(s, bloques);
    var bloquesHtml=bloques.map(function(b,bi){
      var filas=(b.filas||[]).map(function(f,fi){return filaHTML(f,'b'+bi+'f'+fi);}).join('')||'<div class="ejer"><div class="fila"><span class="ej vacio">Por definir</span></div></div>';
      return '<details class="bloque" data-b="'+bi+'"'+(abierto(bi)?' open':'')+'>'+
        '<summary class="bl-cab">'+FLECHA+
          '<span class="bl-mid"><span class="bl-tit">'+esc(b.etiqueta||'Bloque')+'</span>'+
          '<span class="bl-res">'+esc(resumenBloque(b))+'</span></span>'+
          '<span class="bl-prog" hidden></span>'+
        '</summary>'+
        '<div class="bl-cuerpo">'+filas+'</div></details>';
    }).join('');
    return '<div class="tarjeta">'+
      '<div class="entreno-cab"><h2>Mi entreno</h2><span class="fecha-pill">'+esc(fechaTxt)+'</span></div>'+
      (s.titulo?'<div class="entreno-titulo">'+esc(s.titulo)+'</div>':'')+
      (chips?'<div class="chips">'+chips+'</div>':'')+
      (s.nota_razonamiento?'<p class="nota">'+esc(s.nota_razonamiento)+'</p>':'')+
      '<div class="bloques">'+bloquesHtml+'</div></div>';
  }

  // ---------- datos ----------
  var at=null;
  try { var r=await sb.from('atletas').select('id,nombre,apellidos,categoria,grupo_id,estado,especialidades').eq('perfil_id',perfil.id).maybeSingle(); if(!r.error) at=r.data; } catch(e){}

  var todayISO=isoDe(new Date());

  // Aviso del club: mismo criterio que la web pública (activo, el más reciente)

  var catMap={}; CAT.forEach(function(p){ catMap[p.nombre]=p; });

  // ---------- navegación por secciones ----------

  // ---------- ENTRENO POR SEMANAS ----------
  var SEM={};              // { lunesISO: [sesiones de esa semana] }  (caché, una consulta por semana)
  var REG={};              // { sesion_id: registro de sensaciones ya guardado }
  var lunesVis=lunesDe(todayISO);   // lunes de la semana que se está viendo
  var diaSel=todayISO;              // día elegido en la tira

  function rangoTxt(lunes){ return 'Semana del '+fechaCorta(lunes)+' – '+fechaCorta(addDias(lunes,6)); }
  function tipoCorto(t){
    var m={pista:'pista', gym:'gym', continuo:'rodaje', activacion:'activ.', competicion:'compe.', descanso:'descanso'};
    return m[t]||(t?String(t).slice(0,8):'entreno');
  }
  function sesionesDe(iso){ return (SEM[lunesVis]||[]).filter(function(s){ return s.fecha===iso; }); }

  // Trae las sesiones publicadas de la semana. Sin filtrar por grupo: el permiso del
  // servidor ya devuelve solo lo mío, incluidos los entrenos preparados solo para mí.
  async function cargarSemana(lunes){
    if(SEM[lunes]) return SEM[lunes];
    var lista=[];
    try {
      var se=await sb.from('sesiones')
        .select('id,fecha,dia_semana,tipo,rol,titulo,nota_razonamiento,bloques,atletas_ids')
        .eq('publicada',true).gte('fecha',lunes).lte('fecha',addDias(lunes,6))
        .order('fecha',{ascending:true});
      if(!se.error && se.data) lista=se.data;
    } catch(e){}
    SEM[lunes]=lista;
    var ids=lista.map(function(s){ return s.id; });
    if(ids.length){ try {
      var rg=await sb.from('registros_sesion').select('*').eq('atleta_id',at.id).in('sesion_id',ids);
      if(!rg.error && rg.data) rg.data.forEach(function(r){ REG[r.sesion_id]=r; });
    } catch(e){} }
    return lista;
  }

  function pintarSemana(){
    $('sem-rango').textContent=rangoTxt(lunesVis);
    var nom=['lun','mar','mié','jue','vie','sáb','dom'], html='';
    for(var i=0;i<7;i++){
      var iso=addDias(lunesVis,i), ses=sesionesDe(iso);
      var num=new Date(iso+'T00:00:00').getDate();
      var cls='dia'+(ses.length?'':' vacio')+(iso===todayISO?' hoy':'')+(iso===diaSel?' sel':'');
      var marca, titulo;
      if(ses.length){
        var personal=ses.some(function(s){ return s.atletas_ids!=null; });
        var etiqueta=tipoCorto(ses[0].tipo)+(ses.length>1?' +'+(ses.length-1):'');
        marca='<span class="d-punto'+(personal?' personal':'')+'"></span><span class="d-tipo">'+esc(etiqueta)+'</span>';
        titulo=formatFecha(iso)+': '+(ses[0].titulo||'entreno')+(ses.length>1?' (y '+(ses.length-1)+' más)':(personal?' · solo para ti':''));
      } else {
        marca='<span class="d-tipo">libre</span>';
        titulo=formatFecha(iso)+': sin entreno';

      html+='<button type="button" class="'+cls+'" data-dia="'+iso+'" title="'+esc(titulo)+'" aria-pressed="'+(iso===diaSel?'true':'false')+'">'+
        '<span class="d-nom">'+(iso===todayISO?'hoy':nom[i])+'</span><span class="d-num">'+num+'</span>'+marca+'</button>';
    }

  // Tarjeta "¿Cómo ha ido?" de UNA sesión, rellenada con lo que ya haya guardado.
  // Puntuar es tocar una ficha del 1 al 10; el resto del formulario queda plegado.
  function fichaFeedback(s){
    var reg=REG[s.id]||null;
    // Fila de fichas 1-10 que escribe en un campo oculto (así se guarda igual que antes)
    function escala(destino, sel){
      var f=''; for(var i=1;i<=10;i++) f+='<button type="button" class="esc'+(String(sel)===String(i)?' sel':'')+'" data-esc="'+destino+'" data-v="'+i+'" aria-pressed="'+(String(sel)===String(i)?'true':'false')+'">'+i+'</button>';
      return '<div class="escala" role="group">'+f+'</div>'+
             '<input type="hidden" class="'+destino+'" value="'+esc(sel!=null?sel:'')+'">';
    }
    var hayDetalles = !!(reg && (reg.como_me_siento||reg.molestias||reg.notas_atleta||reg.horas_sueno!=null||reg.peso_kg!=null));
    return '<div class="tarjeta fb-card"><h2>¿Cómo ha ido?</h2>'+
      '<div class="escala-tit"><b>Sensación general</b><span>1 fatal · 10 genial</span></div>'+
      escala('fb-sensacion', reg&&reg.sensacion_general)+
      '<div class="escala-tit"><b>Esfuerzo (RPE)</b><span>1 muy suave · 10 al límite</span></div>'+
      escala('fb-rpe', reg&&reg.rpe)+
      '<button type="button" class="fb-mas'+(hayDetalles?' abierto':'')+'" aria-expanded="'+(hayDetalles?'true':'false')+'"><span class="fl">&rsaquo;</span>Añadir detalles</button>'+
      '<div class="fb-detalles"'+(hayDetalles?'':' hidden')+'>'+
        '<label>¿Cómo te sientes?</label><input class="fb-siento" type="text" value="'+esc(reg&&reg.como_me_siento||'')+'" placeholder="con energía, cansado…">'+
        '<label>Molestias (si hay)</label><input class="fb-molestias" type="text" value="'+esc(reg&&reg.molestias||'')+'" placeholder="ninguna / gemelo derecho…">'+
        '<label>Notas para el entrenador</label><textarea class="fb-notas" placeholder="lo que quieras contar del entreno">'+esc(reg&&reg.notas_atleta||'')+'</textarea>'+
        '<div class="grid2">'+
          '<div><label>Horas de sueño</label><input class="fb-sueno" inputmode="decimal" value="'+esc(reg&&reg.horas_sueno!=null?reg.horas_sueno:'')+'" placeholder="p. ej. 7.5"></div>'+
          '<div><label>Peso (kg)</label><input class="fb-peso" inputmode="decimal" value="'+esc(reg&&reg.peso_kg!=null?reg.peso_kg:'')+'" placeholder="opcional"></div>'+
        '</div>'+
      '</div>'+
      '<div class="acciones"><button type="button" class="btn btn--primario fb-guardar">Guardar sensaciones</button><span class="msg fb-msg"></span><span class="fb-sucio" hidden>Tienes cambios sin guardar</span></div>'+
      '<p class="vacio" style="margin-top:10px;">Los tiempos de cada serie los escribes arriba, en su ejercicio. Se guardan junto a tus sensaciones.</p>'+
      '</div>';
  }

  // Vuelca los tiempos por serie ya guardados en los recuadros de esa sesión
  function prefillTiempos(s){
    var reg=REG[s.id]; if(!reg||!reg.tiempos_reales) return;
    var caja=wrap.querySelector('.entreno-uno[data-sid="'+s.id+'"]'); if(!caja) return;
    var tr=reg.tiempos_reales;
    Object.keys(tr).forEach(function(key){
      var arr=(tr[key]&&tr[key].tiempos)||[];
      caja.querySelectorAll('.serie-in[data-key="'+key+'"]').forEach(function(inp){
        var i=parseInt(inp.getAttribute('data-i'),10); if(arr[i]!=null) inp.value=arr[i];
      });
    });
  }

  // Cuántas series lleva anotadas: en la cabecera de cada bloque y en cada ejercicio
  function progresoBloques(raiz){
    if(!raiz) return;
    raiz.querySelectorAll('.bloque').forEach(function(d){
      var et=d.querySelector('.bl-prog'); if(!et) return;
      var ins=d.querySelectorAll('.serie-in');
      if(!ins.length){ et.hidden=true; return; }
      var hechas=0; ins.forEach(function(i){ if(i.value.trim()) hechas++; });
      var txt=hechas+' de '+ins.length+' anotadas';
      et.hidden=false; et.textContent=txt; et.title=txt;
      et.classList.toggle('lleno', hechas===ins.length);
    });
    raiz.querySelectorAll('.serie-inputs').forEach(function(g){
      var ins=g.querySelectorAll('.serie-in'), hechas=0;
      ins.forEach(function(i){ var v=i.value.trim(); if(v) hechas++; i.classList.toggle('puesto', !!v); });
      var c=g.parentNode.querySelector('.serie-cnt');
      if(c) c.textContent=hechas+' de '+ins.length;
    });

  window.addEventListener('beforeunload', function(ev){

  function pintarDia(iso){
    diaSel=iso;
    pintarSemana();
    var lista=sesionesDe(iso), cont=$('entreno-cont');
    if(!lista.length){
      var haySemana=(SEM[lunesVis]||[]).length;
      var aviso = haySemana ? 'Toca otro día de la semana para ver su entreno.'
        : (at.grupo_id ? 'Todavía no hay entrenos publicados en esta semana.'
                       : 'Aún no estás asignado a un grupo. En cuanto tu entrenador te asigne, verás aquí tus entrenos.');
      cont.innerHTML='<div class="tarjeta">'+
        '<div class="entreno-cab"><h2>Mi entreno</h2><span class="fecha-pill">'+esc((iso===todayISO?'Hoy · ':'')+formatFecha(iso))+'</span></div>'+
        '<p class="vacio">'+(iso===todayISO?'Hoy no toca entreno. ':'Ese día no hay entreno. ')+esc(aviso)+'</p></div>';
      return;
    }
    cont.innerHTML=lista.map(function(s){
      return '<div class="entreno-uno" data-sid="'+esc(s.id)+'">'+renderEntreno(s,todayISO)+fichaFeedback(s)+'</div>';
    }).join('');
    lista.forEach(prefillTiempos);
    progresoBloques(cont);
  }

  // Día que se muestra al abrir una semana: el preferido si tiene entreno; si no, el más cercano
  function elegirDia(lunes, pref){
    var lista=SEM[lunes]||[];
    var base=(pref && difDias(pref,lunes)>=0 && difDias(pref,lunes)<=6) ? pref : lunes;
    if(lista.some(function(s){ return s.fecha===base; })) return base;
    var mejor=null;
    lista.forEach(function(s){
      var d=Math.abs(difDias(s.fecha,base));
      if(!mejor || d<mejor.d || (d===mejor.d && s.fecha>mejor.f)) mejor={d:d,f:s.fecha};
    });
    return mejor?mejor.f:base;
  }

  async function irSemana(lunes, pref){
    lunesVis=lunes;
    $('sem-rango').textContent=rangoTxt(lunes);
    $('sem-dias').classList.add('cargando');
    $('entreno-cont').innerHTML='<div class="tarjeta"><p class="vacio">Cargando…</p></div>';
    await cargarSemana(lunes);
    $('sem-dias').classList.remove('cargando');
    pintarDia(elegirDia(lunes, pref));
  }

  $('sem-prev').addEventListener('click', function(){ irSemana(addDias(lunesVis,-7), null); });

  // Un único manejador para toda la sección: al repintar no se duplican los clics

    function numOrNull(v){ v=(v||'').trim().replace(',','.'); if(!v) return null; var n=parseFloat(v); return isNaN(n)?null:n; }
    function intOrNull(v){ if(!v) return null; var n=parseInt(v,10); return isNaN(n)?null:n; }

    var up=await sb.from('registros_sesion').upsert(payload,{onConflict:'sesion_id,atleta_id'});

  // Resumen corto de la sesión, al estilo «4 × 60 m · ritmo 90-95% · rec. 4 min»
  function resumenSesion(s){
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var principal=null;
    bloques.forEach(function(b){ if(!principal && /principal/i.test(b.etiqueta||'')) principal=b; });
    var filas=[];
    (principal?[principal]:bloques).forEach(function(b){ (b.filas||[]).forEach(function(f){ filas.push(f); }); });
    var f=null;
    filas.forEach(function(x){ if(!f && (x.series||x.ritmo)) f=x; });
    if(!f) f=filas[0];
    if(!f) return '';
    var p=[];
    if(f.ejercicio) p.push(f.ejercicio);
    if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
    else if(f.series) p.push(f.series+' series');
    else if(f.distancia) p.push(f.distancia);
    if(f.ritmo) p.push('ritmo '+f.ritmo);
    if(f.descanso) p.push('rec. '+f.descanso);
    if(p.length<2 && f.detalle) p.push(f.detalle);
    return p.join(' · ');
  }

    if(foco){ var c=wrap.querySelector('.entreno-uno[data-sid="'+foco+'"] .fb-card'); if(c){ c.scrollIntoView({block:'center'}); return; } }

  // Cifras del entreno: series, ritmo objetivo y volumen total (maqueta 22a)
  function cifrasSesion(s){
    var bloques=Array.isArray(s.bloques)?s.bloques:[];
    var principal=null;
    bloques.forEach(function(b){ if(!principal && /principal/i.test(b.etiqueta||'')) principal=b; });
    var filas=[];
    (principal?[principal]:bloques).forEach(function(b){ (b.filas||[]).forEach(function(f){ filas.push(f); }); });
    var f=null;
    filas.forEach(function(x){ if(!f && (x.series||x.ritmo)) f=x; });
    if(!f) f=filas[0];
    if(!f) return [];
    var out=[];
    if(f.series && f.distancia) out.push({v:String(f.series)+' × '+String(f.distancia).replace(/\s*m$/i,''), l:'Series'});
    else if(f.series) out.push({v:String(f.series), l:'Series'});
    else if(f.distancia) out.push({v:String(f.distancia), l:'Distancia'});
    if(f.ritmo) out.push({v:String(f.ritmo), l:'Ritmo obj.'});
    // Volumen: series × metros, si se puede leer de los datos
    var nS=parseFloat(String(f.series||'').replace(',','.'));
    var mD=String(f.distancia||'').match(/(\d[\d.,]*)\s*m/i);
    if(nS>0 && mD){
      var metros=parseFloat(mD[1].replace(/\./g,'').replace(',','.'))*nS;
      if(metros>0) out.push({v: metros>=1000 ? (metros/1000).toFixed(metros%1000?1:0)+' km' : Math.round(metros)+' m', l:'Total'});
    } else if(f.tiempo) out.push({v:String(f.tiempo), l:'Tiempo'});
    return out.slice(0,3);
  }

      var cuando=[fechaCorta(x.fecha), x.sede].filter(Boolean).join(' · ');
      var tags='';
      if(x.contexto==='competicion') tags+='<span class="pill ok">Competición</span>';
      else if(x.contexto==='entreno') tags+='<span class="pill">Entreno</span>';
      if(x.tipo) tags+='<span class="pill">'+esc(tipoLabel[x.tipo]||x.tipo)+'</span>';
      return '<div class="mk-fila">'+
        '<span class="mk-txt"><span class="mk-nom">'+esc(x.prueba||'—')+'</span>'+
        (cuando?'<span class="mk-cuando">'+esc(cuando)+'</span>':'')+'</span>'+
        '<span class="mk-der"><span class="mk-marca">'+esc(x.tiempo_display||'—')+'</span>'+
        (tags?'<span class="mk-tags">'+tags+'</span>':'')+'</span></div>';
    }).join('')+'</div>';
    var sinGrafico = (mkFiltro==='todas')
      ? 'Con 2+ marcas de una misma prueba verás aquí tu evolución.'
      : 'Con 2+ marcas de la misma prueba en este apartado verás aquí tu evolución.';
    cont.innerHTML=filtro+recordsHtml+(graficos?'<div class="graficos">'+graficos+'</div>':'<p class="vacio" style="margin-bottom:14px;">'+sinGrafico+'</p>')+lista;
  }
  cargarMarcas();

  // Al elegir prueba, adaptar la etiqueta de la marca (tiempo / metros / puntos)
  $('mk-prueba').addEventListener('change', function(){ var p=catMap[this.value]; var lbl=$('mk-tiempo-lbl'), inp=$('mk-tiempo');
    if(p&&p.unidad==='distancia'){ lbl.textContent='Marca (metros)'; inp.placeholder='6.85'; }
    else if(p&&p.unidad==='puntos'){ lbl.textContent='Marca (puntos)'; inp.placeholder='5820'; }
    else { lbl.textContent='Marca (tiempo)'; inp.placeholder='7.85 · 1:02.3'; }
  });

  $('mk-guardar').addEventListener('click', async function(){
    var msg=$('mk-msg'); var prueba=$('mk-prueba').value.trim(), disp=$('mk-tiempo').value.trim();
    if(!prueba){ msg.textContent='Elige la prueba.'; msg.className='msg error'; return; }
    msg.textContent='Guardando…'; msg.className='msg';
    var payload={ atleta_id:at.id, prueba:prueba, tiempo_display:disp||null, tiempo_segundos:tiempoANum(disp), fecha:$('mk-fecha').value||null, sede:$('mk-sede').value.trim()||null, tipo:$('mk-tipo').value||null, contexto:$('mk-contexto').value||null };
    var ins=await sb.from('marcas_atleta').insert(payload);
    if(ins.error){ msg.textContent='Error: '+ins.error.message; msg.className='msg error'; return; }
    msg.textContent='Marca guardada ✓'; msg.className='msg ok';
    $('mk-prueba').value=''; $('mk-tiempo').value=''; $('mk-sede').value=''; $('mk-tipo').value=''; $('mk-contexto').value='';
    cargarMarcas();
  });

  // ---------- PAGOS ----------
  (async function cargarPagos(){
    var cont=$('pagos-cont');
    var p=await sb.from('pagos').select('concepto,importe,estado,fecha_vencimiento').eq('atleta_id',at.id).order('fecha_vencimiento',{ascending:false}).limit(40);
    if(p.error){ cont.innerHTML='<p class="vacio">Error: '+esc(p.error.message)+'</p>'; return; }
    PAGOS = p.data || [];
    if(hoyPintado) pintarHoy();   // ya podemos avisar de un recibo vencido en «Hoy»
    if(!PAGOS.length){
      cont.innerHTML='<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icPagos+'</div>'+
        '<h3>Sin recibos por ahora</h3><p>Cuando el club emita un recibo a tu nombre lo verás aquí, con su estado y su fecha.</p></div>';
      return;
    }
    // Un recibo por fila: cuatro columnas se apretaban demasiado en el móvil
    cont.innerHTML='<div class="mk-lista">'+PAGOS.map(function(x){
      var ok=(x.estado==='pagado'||x.estado==='cobrado');
      var cuando = x.fecha_vencimiento ? ((ok?'Cobrado el ':'Se cobra el ')+fechaCorta(x.fecha_vencimiento)) : '';
      return '<div class="mk-fila">'+
        '<span class="mk-txt"><span class="mk-nom">'+esc(x.concepto||'')+'</span>'+
        (cuando?'<span class="mk-cuando">'+esc(cuando)+'</span>':'')+'</span>'+
        '<span class="mk-der"><span class="pg-importe">'+(x.importe!=null?esc(eur(x.importe)):'')+'</span>'+
        '<span class="pill'+(ok?' ok':'')+'">'+esc(x.estado||'')+'</span></span></div>';
    }).join('')+'</div>';
  })();

  // ---------- llegar directo a una sección ----------
  // La barra inferior del resto de pantallas del portal enlaza aquí con
  // #entreno, #marcas, #pagos o #mas: se abre esa sección al entrar.
  (function(){
    function secDelHash(){
      var h=(location.hash||'').replace(/^#/,'');
      return SECCIONES.indexOf(h)!==-1 ? h : null;
    }
    var s=secDelHash();
    if(s && s!==SEC) activarSeccion(s);
    window.addEventListener('hashchange', function(){
      var x=secDelHash(); if(x && x!==SEC) activarSeccion(x);
    });
  })();

});
</script>

</body>
</html>
