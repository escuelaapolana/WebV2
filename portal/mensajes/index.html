<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensajes · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .mz-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  /* Cabecera de pantalla (kit 30h): migas a 14 px, título a 28 px, sobre crema. */
  .mz-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; line-height:1.05; color: var(--navy); margin: 0 0 4px; }
  .mz-cab .sub { font-size:14px; color: var(--texto-suave); }
  .migas { display:inline-flex; align-items:center; min-height:44px; margin-bottom:4px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:14px; padding:0 2px 0 0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(16px,3vw,24px); margin-top:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 6px; }
  .tarjeta h3 { font-size:13px; color: var(--texto-suave); margin:18px 0 6px; }

  .nota-sin-avisos { background: var(--aviso-fondo); border:1px solid var(--aviso-borde); color: var(--aviso-texto);
                     border-radius:10px; padding:12px 14px; margin-top:16px; font-size:14px; line-height:1.5; }
  .apunte { font-size:13px; color: var(--texto-suave); margin:4px 0 0; }
  /* Rojo solo para lo que se ha escrito mal; si falla el envío, ámbar. */
  .msg { font-size:14px; margin-top:10px; display:block; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; } .msg.fallo { color:#B96F09; }

  .mz-panel { display:grid; grid-template-columns: 300px 1fr; gap:18px; align-items:start; margin-top:18px; }
  @media (max-width:860px){ .mz-panel { grid-template-columns:1fr; } .mz-panel.abierta .col-lista { display:none; } }
  @media (min-width:861px){ .solo-movil { display:none !important; } }

  /* Fila de lista (kit 30d): 48 px de alto y la fila entera pulsable. */
  .conv { display:flex; gap:10px; align-items:center; width:100%; min-height:48px; box-sizing:border-box; text-align:left;
          background:none; border:0; border-bottom:1px solid var(--linea); padding:12px 4px; cursor:pointer; font-family:inherit; }
  .conv:last-child { border-bottom:0; }
  .conv:hover { background: var(--crema); }
  .conv.activa { background: var(--azul-suave); border-radius:10px; }
  /* El azul se reserva a lo que se pulsa: las iniciales son un dato (carácter 31a). */
  .conv .ini { width:38px; height:38px; flex:0 0 38px; border-radius:10px; background: var(--crema-media); color: var(--navy);
               display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
  .conv .txt { flex:1; min-width:0; }
  .conv .txt b { display:block; font-size:15px; color: var(--navy); font-weight:600; }
  .conv .txt small { display:block; font-size:13px; color: var(--texto-suave); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv .der { text-align:right; flex:0 0 auto; }
  /* Hora de un mensaje: cifras de ancho fijo, sin aire de cronómetro (fundamentos 28c). */
  .conv .cuando { font-size:13px; font-variant-numeric: tabular-nums; color: var(--texto-suave); display:block; }
  /* Contador de sin leer: cifra que se compara, en mono. */
  .badge { display:inline-block; min-width:20px; padding:1px 6px; border-radius:999px; background: var(--navy); color:#fff;
           font-family: var(--fuente-dato); font-size:13px; text-align:center; margin-top:4px; }
  .badge.gris { background: var(--crema-media); color: var(--texto-suave); }

  .hilo { max-height:52vh; overflow-y:auto; padding:4px 2px 8px; display:flex; flex-direction:column; gap:8px; }
  .glob { max-width:78%; padding:10px 13px; border-radius:14px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .glob.suyo { align-self:flex-start; background: var(--crema); border:1px solid var(--linea); color: var(--texto); border-bottom-left-radius:4px; }
  .glob.mio  { align-self:flex-end; background: var(--navy); border:1px solid var(--navy); color:#fff; border-bottom-right-radius:4px; }
  .glob.mio .cuando { color: rgba(255,255,255,.7); }
  .glob.mio .quitar { color:#F0B968; }
  .glob .cuando { display:block; font-size:13px; font-variant-numeric: tabular-nums; color: var(--texto-suave); margin-top:5px; }
  .glob .quitar { background:none; border:0; color:#b3261e; font-size:13px; font-family:inherit; cursor:pointer; padding:0; margin-left:8px; }
  .dia { align-self:center; font-size:13px; font-variant-numeric: tabular-nums;
         color: var(--texto-suave); background: var(--crema-media); padding:2px 10px; border-radius:999px; }

  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:12px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde);
    border-radius:10px; font-size:16px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  textarea { min-height:74px; resize:vertical; }
  .enviar { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; margin-top:12px; }
  @media (max-width:600px){ .enviar { grid-template-columns:1fr; } }
  .btn { cursor:pointer; }
  .btn--mini { padding:9px 16px; font-size:14px; }
  .cab-hilo { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .pill { font-size:13px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
</style>
<script>
/* Avisos suaves y confirmaciones no bloqueantes del portal (APX). */
(function(){
  if (window.APX) return;
  var css =
    '.apx-host{position:fixed;left:0;right:0;bottom:18px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}'+
    '.apx-toast{pointer-events:auto;max-width:440px;background:var(--navy,#2E4256);color:#fff;font-family:var(--fuente-texto,system-ui);font-size:14px;line-height:1.4;padding:12px 16px;border-radius:10px;box-shadow:0 16px 34px -18px rgba(46,66,86,.7);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}'+
    '.apx-toast.apx-in{opacity:1;transform:none}'+
    '.apx-toast.apx-error{background:#B23A38}'+
    '.apx-toast.apx-ok{background:#2F6FA8}'+
    '.apx-ov{position:fixed;inset:0;z-index:10000;background:rgba(30,42,56,.5);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .2s}'+
    '.apx-ov.apx-in{opacity:1}'+
    '.apx-dlg{background:var(--crema,#FBF9F4);border:1px solid var(--linea,#EAE3D5);border-radius:14px;box-shadow:0 34px 60px -30px rgba(46,66,86,.6);max-width:400px;width:100%;padding:22px 22px 18px;transform:translateY(8px) scale(.98);transition:transform .2s}'+
    '.apx-ov.apx-in .apx-dlg{transform:none}'+
    '.apx-dlg-msg{margin:0 0 18px;font-family:var(--fuente-texto,system-ui);font-size:15px;line-height:1.5;color:var(--texto,#4A4437)}'+
    '.apx-dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}'+
    '.apx-btn{font-family:var(--fuente-texto,system-ui);font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--linea-borde,#E0D8C8);background:#fff;color:var(--navy,#2E4256);cursor:pointer;min-height:42px}'+
    '.apx-btn:hover{border-color:#C9D9E7}'+
    '.apx-ok{background:var(--azul, #2F6FA8);border-color:var(--azul, #2F6FA8);color:#fff}'+
    '.apx-ok:hover{background:var(--azul-hover, #1E4E78)}'+
    '.apx-ok.apx-danger{background:#B23A38;border-color:#B23A38}'+
    '.apx-ok.apx-danger:hover{background:#8f2c2b}'+
    '@media(max-width:420px){.apx-dlg-btns{flex-direction:column-reverse}.apx-btn{width:100%}}';
  var st=document.createElement('style'); st.textContent=css; (document.head||document.documentElement).appendChild(st);
  var host=null;
  function ensureHost(){ if(!host){ host=document.createElement('div'); host.className='apx-host'; document.body.appendChild(host);} return host; }
  function toast(msg,tipo){
    ensureHost();
    var el=document.createElement('div'); el.className='apx-toast'+(tipo?' apx-'+tipo:''); el.textContent=msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('apx-in'); });
    var vida=(tipo==='error')?4600:3000;
    setTimeout(function(){ el.classList.remove('apx-in'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); }, vida);
  }
  function confirmar(msg,opts){
    opts=opts||{};
    return new Promise(function(resolve){
      var ov=document.createElement('div'); ov.className='apx-ov';
      var dlg=document.createElement('div'); dlg.className='apx-dlg'; dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true');
      var p=document.createElement('p'); p.className='apx-dlg-msg'; p.textContent=msg; dlg.appendChild(p);
      var btns=document.createElement('div'); btns.className='apx-dlg-btns';
      var bc=document.createElement('button'); bc.type='button'; bc.className='apx-btn'; bc.textContent=opts.cancelar||'Cancelar';
      var bo=document.createElement('button'); bo.type='button'; bo.className='apx-btn apx-ok'; bo.textContent=opts.aceptar||'Aceptar';
      if(opts.peligro) bo.classList.add('apx-danger');
      btns.appendChild(bc); btns.appendChild(bo); dlg.appendChild(btns); ov.appendChild(dlg);
      document.body.appendChild(ov);
      requestAnimationFrame(function(){ ov.classList.add('apx-in'); });
      function cerrar(v){ ov.classList.remove('apx-in'); document.removeEventListener('keydown',onkey); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); resolve(v); }
      function onkey(e){ if(e.key==='Escape'){ e.preventDefault(); cerrar(false);} else if(e.key==='Enter'){ e.preventDefault(); cerrar(true);} }
      bc.addEventListener('click',function(){ cerrar(false); });
      bo.addEventListener('click',function(){ cerrar(true); });
      ov.addEventListener('click',function(e){ if(e.target===ov) cerrar(false); });
      document.addEventListener('keydown',onkey);
      setTimeout(function(){ bo.focus(); },40);
    });
  }
  window.APX={ toast:toast, confirm:confirmar };
})();
</script>
</head>
<body>

<div id="portal-contenido">
  <div class="mz-wrap" id="mz-wrap">
    <a class="migas" href="../">← Volver al portal</a>
    <div class="mz-cab"><h1>Mensajes</h1></div>
    <div class="tarjeta"><div class="ap-esq" data-esq="filas:4"></div></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('mz-wrap');
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function pad(n){ return (n<10?'0':'')+n; }
  function hora(iso){ var d=new Date(iso); return isNaN(d.getTime())?'':pad(d.getHours())+':'+pad(d.getMinutes()); }
  function dia(iso){ var d=new Date(iso); return isNaN(d.getTime())?'':pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
  function cuando(iso){
    var d=new Date(iso); if(isNaN(d.getTime())) return '';
    var h=new Date(); h.setHours(0,0,0,0);
    if (d.getTime() >= h.getTime()) return hora(iso);
    var ayer = new Date(h.getTime()-86400000);
    if (d.getTime() >= ayer.getTime()) return 'ayer';
    return pad(d.getDate())+'/'+pad(d.getMonth()+1);
  }
  function nomC(c){ return ((c.nombre||'')+' '+(c.apellidos||'')).trim() || 'Alguien del club'; }
  function ini(c){
    var n=(c.nombre||'').charAt(0), a=(c.apellidos||'').charAt(0);
    return ((n+a) || '?').toUpperCase();
  }

  if (!perfil || !perfil.id) {
    wrap.innerHTML = '<a class="migas" href="../">← Volver al portal</a>' +
      '<div class="mz-cab"><h1>Mensajes</h1></div>' +
      '<div class="tarjeta">' + APOLANA_UI.vacio('Todavía no encontramos tu ficha en el club',
        'Has entrado bien, pero tu ficha aún no está enlazada con esta cuenta, y los mensajes van de ficha a ficha. Avisa al club y lo dejan listo.',
        APOLANA_UI.boton('Volver al portal', '../')) + '</div>';
    return;
  }
  var YO = perfil.id;

  var CONVERS = [], CONTACTOS = [], GRUPOS = [], HILO = [];
  var abierta = null, nueva = false, borrador = '', avisoGlobal = '', falloCarga = false;

  async function cargarBase(){
    var rc = await sb.rpc('mis_conversaciones');
    CONVERS = (rc.error ? [] : (rc.data || []));

    var rk = await sb.rpc('mis_contactos_mensajes');
    /* Si fallan las dos consultas no se traga en silencio: la pantalla lo dice. */
    falloCarga = !!(rc.error && rk.error);
    var brutos = (rk.error ? [] : (rk.data || []));
    var vistos = {}; CONTACTOS = []; var gr = {};
    brutos.forEach(function(c){
      if (c.grupo_id) gr[c.grupo_id] = c.grupo_nombre || 'Grupo';
      if (vistos[c.perfil_id]) { vistos[c.perfil_id].grupos.push(c.grupo_id); return; }
      var x = {
        perfil_id: c.perfil_id, nombre: c.nombre, apellidos: c.apellidos, rol: c.rol,
        relacion: c.relacion, atleta_id: c.atleta_id, atleta_nombre: c.atleta_nombre,
        grupos: c.grupo_id ? [c.grupo_id] : []
      };
      vistos[c.perfil_id] = x; CONTACTOS.push(x);
    });
    CONTACTOS.sort(function(a,b){ return nomC(a).localeCompare(nomC(b)); });
    GRUPOS = Object.keys(gr).map(function(id){ return { id:id, nombre:gr[id] }; })
      .sort(function(a,b){ return a.nombre.localeCompare(b.nombre); });
  }

  async function cargarHilo(otro){
    var r = await sb.from('mensajes_directos')
      .select('id,de_perfil,para_perfil,texto,leido,created_at,atleta_id')
      .or('de_perfil.eq.' + otro + ',para_perfil.eq.' + otro)
      .order('created_at', { ascending: true }).limit(300);
    HILO = (r.error ? [] : (r.data || []));
    if (HILO.some(function(m){ return m.para_perfil === YO && !m.leido; })) {
      await sb.rpc('marcar_leidos', { p_otro: otro });
    }
  }

  function datosDe(id){
    for (var i=0;i<CONVERS.length;i++) if (CONVERS[i].otro === id) return CONVERS[i];
    for (var j=0;j<CONTACTOS.length;j++) if (CONTACTOS[j].perfil_id === id) return CONTACTOS[j];
    return { nombre:'Alguien del club', apellidos:'' };
  }
  function relacionDe(id){
    for (var j=0;j<CONTACTOS.length;j++) if (CONTACTOS[j].perfil_id === id) return CONTACTOS[j];
    return null;
  }

  /* ------------- trozos ------------- */

  function listaConversaciones(){
    var sinLeer = 0;
    CONVERS.forEach(function(c){ sinLeer += (c.no_leidos || 0); });

    var h = '<div class="tarjeta col-lista"><h2>Conversaciones' +
      (sinLeer ? ' <span class="badge">' + sinLeer + '</span>' : '') + '</h2>';

    if (!CONVERS.length) {
      h += APOLANA_UI.vacio('Todavía no hay ninguna conversación',
        'En cuanto escribas a alguien —o alguien te escriba— la conversación se queda aquí.');
    } else {
      h += CONVERS.map(function(c){
        var prev = (c.ultimo_mio ? 'Tú: ' : '') + (c.ultimo_texto || '');
        return '<button class="conv' + (abierta === c.otro ? ' activa' : '') + '" data-abrir="' + esc(c.otro) + '">' +
          '<span class="ini">' + esc(ini(c)) + '</span>' +
          '<span class="txt"><b>' + esc(nomC(c)) + '</b><small>' + esc(prev) + '</small></span>' +
          '<span class="der"><span class="cuando">' + esc(cuando(c.ultimo_at)) + '</span>' +
          (c.no_leidos ? '<span class="badge">' + c.no_leidos + '</span>' : '') + '</span></button>';
      }).join('');
    }

    h += '<div style="margin-top:14px"><button class="btn btn--neutro btn--mini" id="mz-nueva" style="width:100%">Escribir un mensaje nuevo</button></div>';
    return h + '</div>';
  }

  function panelNuevo(){
    if (!CONTACTOS.length) {
      return '<div class="tarjeta"><h2>Mensaje nuevo</h2>' +
        APOLANA_UI.vacio('Todavía no hay nadie a quien escribir',
          'Aquí se habla con tu entrenador, con tus atletas y sus familias, o con la administración del club. ' +
          'En cuanto el club te asigne un grupo, aparecerán en esta lista.',
          '<button type="button" class="ap-btn" id="mz-cerrar-nueva">Cerrar</button>') + '</div>';
    }
    var h = '<div class="tarjeta" id="mz-panel-nuevo"><h2>Mensaje nuevo</h2>';

    if (GRUPOS.length) {
      h += '<label for="n-modo">¿A quién?</label><select id="n-modo">' +
        '<option value="uno">A una persona</option>' +
        '<option value="grupo">A todo un grupo</option></select>';
    }

    h += '<div id="n-uno"><label for="n-quien">Persona</label><select id="n-quien">' +
      CONTACTOS.map(function(c){
        var det = c.relacion === 'atleta' ? 'atleta'
                : c.relacion === 'familia' ? 'familia de ' + (c.atleta_nombre || '')
                : c.relacion === 'entrenador' ? 'tu entrenador'
                : c.relacion === 'administración' ? 'administración del club' : 'club';
        return '<option value="' + esc(c.perfil_id) + '">' + esc(nomC(c)) + ' · ' + esc(det) + '</option>';
      }).join('') + '</select></div>';

    if (GRUPOS.length) {
      h += '<div id="n-grupo" style="display:none"><label for="n-gr">Grupo</label><select id="n-gr">' +
        GRUPOS.map(function(g){
          var n = CONTACTOS.filter(function(c){ return c.grupos.indexOf(g.id) !== -1; }).length;
          return '<option value="' + esc(g.id) + '">' + esc(g.nombre) + ' · ' + n + ' con cuenta</option>';
        }).join('') + '</select>' +
        '<p class="apunte">Se manda un mensaje por persona: cada uno lo recibe en su conversación y no ve a los demás. ' +
        'Solo llega a quienes tienen cuenta en el portal.</p></div>';
    }

    h += '<label for="n-texto">Mensaje</label><textarea id="n-texto" placeholder="Escribe aquí…"></textarea>' +
      '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn btn--primario btn--mini" id="n-enviar">Enviar</button>' +
      '<button class="btn btn--neutro btn--mini" id="mz-cerrar-nueva">Cancelar</button></div>' +
      '<span class="msg" id="n-msg"></span></div>';
    return h;
  }

  function panelHilo(){
    if (!abierta) {
      return '<div class="tarjeta"><h2>Mensajes</h2>' +
        APOLANA_UI.vacio('Elige una conversación',
          'Toca una de la lista para leerla y contestar, o empieza una nueva desde «Escribir un mensaje nuevo».') + '</div>';
    }
    var c = datosDe(abierta);
    var rel = relacionDe(abierta);
    var det = rel ? (rel.relacion === 'atleta' ? 'atleta'
                   : rel.relacion === 'familia' ? 'familia de ' + (rel.atleta_nombre || '')
                   : rel.relacion === 'entrenador' ? 'tu entrenador'
                   : rel.relacion === 'administración' ? 'administración del club' : 'club') : '';

    var h = '<div class="tarjeta"><div class="cab-hilo">' +
      '<div><h2 style="margin:0">' + esc(nomC(c)) + '</h2>' +
      (det ? '<span class="apunte">' + esc(det) + '</span>' : '') + '</div>' +
      '<button class="btn btn--neutro btn--mini solo-movil" id="mz-volver-lista">← Conversaciones</button></div>';

    if (!HILO.length) {
      h += APOLANA_UI.vacio('Todavía no os habéis escrito nada',
        'Escribe abajo y se lo encontrará la próxima vez que entre en el portal.');
    } else {
      var ultimoDia = '';
      h += '<div class="hilo" id="mz-hilo">' + HILO.map(function(m){
        var d = dia(m.created_at), cab = '';
        if (d !== ultimoDia) { ultimoDia = d; cab = '<span class="dia">' + esc(d) + '</span>'; }
        var mio = (m.de_perfil === YO);
        return cab + '<div class="glob ' + (mio ? 'mio' : 'suyo') + '">' + esc(m.texto) +
          '<span class="cuando">' + esc(hora(m.created_at)) +
          (mio ? (m.leido ? ' · leído' : ' · sin leer') + '<button class="quitar" data-quitar="' + esc(m.id) + '">retirar</button>' : '') +
          '</span></div>';
      }).join('') + '</div>';
    }

    h += '<div class="enviar"><div><label for="mz-texto">Escribe tu mensaje</label>' +
      '<textarea id="mz-texto" placeholder="Escribe aquí…"></textarea></div>' +
      '<div><button class="btn btn--primario btn--mini" id="mz-enviar">Enviar</button></div></div>' +
      '<span class="msg" id="mz-msg"></span></div>';
    return h;
  }

  /* ------------- pintar ------------- */

  function pintar(){
    var h = '<a class="migas" href="../">← Volver al portal</a>' +
      '<div class="mz-cab"><h1>Mensajes</h1><span class="sub">Entrenador, atletas y familias</span></div>' +
      '<div class="nota-sin-avisos">Los mensajes se quedan <b>dentro del portal</b>: no se envía ningún correo ' +
      'ni aviso al móvil. La otra persona los verá la próxima vez que entre. Para algo urgente, llama por teléfono.</div>';

    if (avisoGlobal) h += '<div class="tarjeta"><p class="msg ok" style="margin:0">' + esc(avisoGlobal) + '</p></div>';

    if (!CONVERS.length && !CONTACTOS.length) {
      h += '<div class="tarjeta">' + (falloCarga
        ? APOLANA_UI.error('No hemos podido cargar tus mensajes',
            'Puede ser tu conexión. Lo que tengas escrito sigue guardado; vuelve a intentarlo en un momento.')
        : APOLANA_UI.vacio('Aquí no hay nada todavía',
            'Los mensajes son entre el entrenador y sus atletas o sus familias. Cuando alguien te escriba, lo verás en esta pantalla.',
            APOLANA_UI.boton('Volver al portal', '../'))) + '</div>';
      wrap.innerHTML = h; avisoGlobal = ''; return;
    }

    h += '<div class="mz-panel' + (abierta || nueva ? ' abierta' : '') + '">' + listaConversaciones() +
         '<div>' + (nueva ? panelNuevo() : panelHilo()) + '</div></div>';

    wrap.innerHTML = h;
    avisoGlobal = '';

    var hl = $('mz-hilo'); if (hl) hl.scrollTop = hl.scrollHeight;
    var tx = $('mz-texto'); if (tx) { tx.value = borrador; }

    var bn = $('mz-nueva'); if (bn) bn.addEventListener('click', function(){ nueva = true; abierta = null; pintar(); });
    var bc = $('mz-cerrar-nueva'); if (bc) bc.addEventListener('click', function(){ nueva = false; pintar(); });
    var bv = $('mz-volver-lista'); if (bv) bv.addEventListener('click', function(){ abierta = null; nueva = false; pintar(); });

    var modo = $('n-modo');
    if (modo) modo.addEventListener('change', function(){
      var g = (this.value === 'grupo');
      $('n-uno').style.display = g ? 'none' : '';
      $('n-grupo').style.display = g ? '' : 'none';
    });
  }

  /* ------------- acciones ------------- */

  wrap.addEventListener('input', function(e){
    if (e.target && e.target.id === 'mz-texto') borrador = e.target.value;
  });

  wrap.addEventListener('click', async function(e){
    var t = e.target;
    if (!t) return;
    var abrir = t.getAttribute ? t.getAttribute('data-abrir') : null;
    if (!abrir && t.parentNode && t.parentNode.getAttribute) abrir = t.parentNode.getAttribute('data-abrir');
    if (!abrir && t.parentNode && t.parentNode.parentNode && t.parentNode.parentNode.getAttribute) {
      abrir = t.parentNode.parentNode.getAttribute('data-abrir');
    }

    if (abrir) {
      abierta = abrir; nueva = false; borrador = '';
      await cargarHilo(abierta);
      await cargarBase();
      pintar();
      return;
    }

    var quitar = t.getAttribute && t.getAttribute('data-quitar');
    if (quitar) {
      if (!await APX.confirm('¿Retirar este mensaje? Desaparecerá también para la otra persona.', { aceptar:'Retirar', peligro:true })) return;
      var d = await sb.from('mensajes_directos').delete().eq('id', quitar);
      if (d.error) { APX.toast('No hemos podido retirar el mensaje', 'error', { detalle:'Puede ser tu conexión: inténtalo otra vez.' }); return; }
      await cargarHilo(abierta); await cargarBase(); pintar();
      return;
    }

    if (t.id === 'mz-enviar') {
      var msg = $('mz-msg'); msg.className = 'msg';
      var texto = ($('mz-texto').value || '').trim();
      if (!texto) { msg.textContent = 'Escribe algo primero.'; msg.className = 'msg error'; return; }
      msg.textContent = 'Enviando…';
      var rel = relacionDe(abierta);
      var r = await sb.from('mensajes_directos').insert({
        de_perfil: YO, para_perfil: abierta, texto: texto,
        atleta_id: (rel && rel.atleta_id) ? rel.atleta_id : null
      });
      if (r.error) { msg.textContent = 'No hemos podido enviar el mensaje. Puede ser tu conexión: inténtalo otra vez.'; msg.className = 'msg fallo'; return; }
      borrador = '';
      await cargarHilo(abierta); await cargarBase(); pintar();
      return;
    }

    if (t.id === 'n-enviar') {
      var m2 = $('n-msg'); m2.className = 'msg';
      var txt = ($('n-texto').value || '').trim();
      if (!txt) { m2.textContent = 'Escribe el mensaje.'; m2.className = 'msg error'; return; }
      var modoV = $('n-modo') ? $('n-modo').value : 'uno';

      if (modoV === 'grupo') {
        var gid = $('n-gr').value;
        var destinos = CONTACTOS.filter(function(c){ return c.grupos.indexOf(gid) !== -1; });
        if (!destinos.length) { m2.textContent = 'En ese grupo todavía no hay nadie con cuenta en el portal.'; m2.className = 'msg error'; return; }
        if (!await APX.confirm('Se va a mandar el mismo mensaje a ' + destinos.length + (destinos.length === 1 ? ' persona' : ' personas') + ', una conversación por cada una. ¿Seguimos?', { aceptar:'Enviar a todos' })) return;
        m2.textContent = 'Enviando…';
        var filas = destinos.map(function(c){
          return { de_perfil: YO, para_perfil: c.perfil_id, texto: txt, atleta_id: c.atleta_id || null };
        });
        var rg = await sb.from('mensajes_directos').insert(filas);
        if (rg.error) { m2.textContent = 'No hemos podido enviar el mensaje. Puede ser tu conexión: inténtalo otra vez.'; m2.className = 'msg fallo'; return; }
        avisoGlobal = 'Mensaje enviado a ' + destinos.length + (destinos.length === 1 ? ' persona.' : ' personas.');
        nueva = false; abierta = null;
        await cargarBase(); pintar();
        return;
      }

      var quien = $('n-quien').value;
      var relN = relacionDe(quien);
      m2.textContent = 'Enviando…';
      var r2 = await sb.from('mensajes_directos').insert({
        de_perfil: YO, para_perfil: quien, texto: txt,
        atleta_id: (relN && relN.atleta_id) ? relN.atleta_id : null
      });
      if (r2.error) { m2.textContent = 'No hemos podido enviar el mensaje. Puede ser tu conexión: inténtalo otra vez.'; m2.className = 'msg fallo'; return; }
      nueva = false; abierta = quien; borrador = '';
      await cargarHilo(abierta); await cargarBase(); pintar();
      return;
    }
  });

  /* Refresco suave: cada 30 segundos mira si hay algo nuevo.
     No hay avisos push: esto solo repinta mientras la pestaña está abierta. */
  setInterval(async function(){
    if (document.hidden || nueva) return;
    await cargarBase();
    if (abierta) await cargarHilo(abierta);
    pintar();
  }, 30000);

  await cargarBase();
  pintar();
});
</script>

</body>
</html>
