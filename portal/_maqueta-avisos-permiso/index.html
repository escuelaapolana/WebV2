<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Permitir avisos (atleta)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<style>
  /* MAQUETA · La ventanita de "permitir avisos" que sale al entrar la primera vez.
     Para que activen las notificaciones del móvil. */
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --curva:cubic-bezier(.2,.7,.2,1);
    --s2:0 2px 6px rgba(30,45,65,.10),0 30px 60px -18px rgba(30,45,65,.5); }
  html,body { margin:0; height:100%; }
  body { background:var(--navy,#26374B); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
  .backdrop { position:fixed; inset:0; background:rgba(20,30,42,.55); }
  .modal { position:relative; width:100%; max-width:380px; background:#fff; border-radius:24px; box-shadow:var(--s2); padding:30px 26px 24px; text-align:center; animation:aparece .4s var(--curva); }
  @keyframes aparece { from{ transform:translateY(16px) scale(.98); opacity:0; } to{ transform:none; opacity:1; } }
  .ico { width:72px; height:72px; margin:0 auto 16px; border-radius:20px; display:grid; place-items:center; color:#fff;
    background:radial-gradient(120% 120% at 30% 0%, #3B85C0, transparent 60%), linear-gradient(150deg,#2E4258,#1E2D3D); box-shadow:0 10px 24px -8px rgba(59,133,192,.6); }
  .ico svg { width:36px; height:36px; }
  h1 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em; font-size:24px; color:var(--navy,#26374B); margin:0 0 8px; }
  p { margin:0 0 6px; font-size:14.5px; line-height:1.55; color:var(--texto-suave,#6E6656); }
  .lista { text-align:left; margin:16px 0 22px; display:grid; gap:9px; }
  .lista .l { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--navy,#26374B); }
  .lista .l svg { width:18px; height:18px; color:#4E8A3E; flex:0 0 auto; }
  .btn { width:100%; box-sizing:border-box; font:inherit; font-size:16px; font-weight:600; cursor:pointer; border:0; border-radius:14px; padding:15px; }
  .btn.si { background:var(--navy,#26374B); color:#fff; }
  .btn.no { background:none; color:var(--texto-suave,#6E6656); margin-top:6px; padding:12px; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="modal">
  <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
  <h1>Activa los avisos</h1>
  <p>Así no te pierdes nada importante de tu entrenamiento.</p>
  <div class="lista">
    <div class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg> El entreno de hoy y cambios de hora</div>
    <div class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg> Competiciones y convocatorias</div>
    <div class="l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l4 4 10-10"/></svg> Mensajes de tu entrenador</div>
  </div>
  <button type="button" class="btn si">Permitir avisos</button>
  <button type="button" class="btn no">Ahora no</button>
</div>
</body>
</html>
