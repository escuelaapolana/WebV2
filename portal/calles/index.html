<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calles de la piscina · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<!-- El modelo de calles (leer una sesión repartida por calles) va aparte -->
<script src="../../assets/js/calles.js"></script>
<!-- Descansos de las cinco disciplinas. Lo monta otra persona; si todavía no
     existe, calles.js se apaña con el mínimo de natación. El 404 no rompe nada. -->
<script src="../../assets/js/descansos.js" onerror="this.remove()"></script>
<style>
  /* ==========================================================================
     CALLES DE NATACIÓN · maqueta v3, bloques 25a-25d
     Pantalla de trabajo: se abre a pie de piscina, con una mano y el brazo
     mojado. Móvil primero; en pantalla grande no se ensancha, se centra.
     ========================================================================== */
  body { background: var(--crema); }
  #app { max-width: 680px; margin: 0 auto; }

  /* ---- cabecera navy · kit 30h ------------------------------------------
     El navy se reserva para las pantallas donde se está trabajando. Aquí
     avisa de que esto es el borde de la piscina, no la web del club. */
  .cab { background: var(--navy); color:#fff; }
  .cab .dentro { max-width:680px; margin:0 auto; padding: 2px 16px 16px; }
  .cab a.volver, .cab button.volver {
    display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0;
    background:none; border:0; font-family:inherit; font-size:14px; font-weight:600;
    color:#A9C4DC; text-decoration:none; cursor:pointer; }
  .cab h1 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:28px;
            line-height:1.05; color:#fff; margin: 2px 0 6px; }
  .cab .meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px;
               line-height:1.4; color: rgba(255,255,255,.72); }
  .cab .meta .dato { font-family: var(--fuente-dato); font-size:13px; color:#8FC0E8; }
  .cab .cambiar { min-height:44px; display:inline-flex; align-items:center; background:none;
                  border:0; padding:0 2px; font-family:inherit; font-size:14px; font-weight:600;
                  color:#8FC0E8; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* fila C1-C4: se salta de calle sin volver atrás (25b) */
  .saltos { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .saltos button { flex:1 1 60px; min-height:44px; border:0; border-radius:10px; cursor:pointer;
                   background: rgba(255,255,255,.12); color: rgba(255,255,255,.78);
                   font-family: var(--fuente-dato); font-size:14px; }
  .saltos button.on { background:#fff; color: var(--navy); font-weight:700; }

  .wrap { padding: 14px 16px 28px; display:flex; flex-direction:column; gap:12px; }

  /* ---- rótulo de sección con hilo -------------------------------------- */
  .rotulo { display:flex; align-items:center; gap:8px; }
  .rotulo span { font-size:13px; line-height:1.4; color: var(--texto-suave); }
  .rotulo i { flex:1; height:1px; background: var(--linea-marcada); }
  .rotulo .dato { font-family: var(--fuente-dato); color: var(--azul-oscuro); flex:0 0 auto; }

  /* ---- tarjeta de calle · 25b ------------------------------------------
     Borde izquierdo de color por nivel: de la calle más suave a la más
     fuerte. Es pulsable, así que lleva las tres cosas del kit 30c:
     sombra baja, borde marcado y chevron. */
  .calle-t { display:block; width:100%; text-align:left; box-sizing:border-box;
             background:#fff; border:1px solid var(--linea-marcada); border-left:4px solid var(--nivel,#8FC0E8);
             border-radius:14px; padding:14px 16px; font-family:inherit; cursor:pointer;
             box-shadow: 0 12px 24px -18px rgba(46,66,86,0.5); }
  .calle-t + .calle-t { margin-top:10px; }
  .calle-t.aqui { border:2px solid var(--azul); border-left:4px solid var(--nivel,#8FC0E8);
                  box-shadow: 0 18px 32px -22px rgba(47,111,168,.8); }
  .calle-t .lin1 { display:flex; align-items:baseline; gap:10px; }
  .calle-t .nom { flex:1; min-width:0; font-family: var(--fuente-titulo); text-transform:uppercase;
                  font-weight:700; font-size:21px; line-height:1.05; color: var(--navy); }
  .calle-t .m { font-family: var(--fuente-dato); font-size:13px; color: var(--azul-oscuro); flex:0 0 auto; }
  .calle-t .lin2 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .calle-t .cifra { font-family: var(--fuente-dato); font-size:15px; color: var(--navy); }
  .calle-t .pt { color:#C8C0B0; }
  .calle-t .nad-n { font-family: var(--fuente-dato); font-size:12px; color: var(--texto-suave); margin-left:auto; }
  .calle-t .lin3 { display:flex; align-items:center; margin-top:9px; }
  .calle-t .vacio-t { font-size:14px; line-height:1.45; color: var(--texto-suave); margin-top:8px; }
  /* El chevron de «entrar» siempre en gris, nunca azul (kit 30a) */
  .calle-t .chv { flex:0 0 auto; margin-left:auto; color: var(--texto-suave); font-size:21px; line-height:1; }

  .avat { width:26px; height:26px; border-radius:999px; background: var(--crema-banda);
          border:2px solid #fff; display:inline-flex; align-items:center; justify-content:center;
          font-family: var(--fuente-titulo); font-weight:700; font-size:11px; color: var(--navy); }
  .avat + .avat { margin-left:-6px; }
  .avat.yo { background: var(--navy); color:#fff; }

  /* ---- pastillas de cifra (total, nadadores, duración) ------------------ */
  .cifras { display:flex; gap:8px; }
  .cifras > div { flex:1; min-width:0; background: var(--crema-banda); border-radius:10px; padding:10px 12px; }
  .cifras b { display:block; font-family: var(--fuente-dato); font-weight:400; font-size:17px; color: var(--navy); }
  .cifras span { display:block; font-size:13px; line-height:1.4; color: var(--texto-suave); }

  /* ---- lista de bloques · un contenedor con separadores (kit 30d) ------- */
  .bloques { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; }
  .bq { padding:12px 14px; border-bottom:1px solid var(--linea); display:flex; flex-direction:column; gap:7px; }
  .bq:last-child { border-bottom:0; }
  .bq.hecho { opacity:.55; }
  .bq.comun { background: var(--crema); }
  .bq.curso { background:#F1F7FC; }
  .bq .cab-b { display:flex; align-items:baseline; gap:8px; }
  .bq .cab-b .et { font-size:13px; line-height:1.4; color: var(--texto-suave); }
  .bq.curso .cab-b .et { color: var(--azul-oscuro); }
  .bq .cab-b .der { margin-left:auto; font-family: var(--fuente-dato); font-size:12px; color: var(--texto-suave); flex:0 0 auto; }
  .bq .cab-b .der.ok { color: var(--verde); }
  .bq .cab-b .der.az { color: var(--azul-oscuro); }
  .bq .marca-todos { font-size:13px; color: var(--texto-suave); }

  .ej { display:flex; flex-direction:column; gap:6px; }
  .ej + .ej { margin-top:10px; padding-top:10px; border-top:1px solid var(--linea); }
  .ej .cifra { font-family: var(--fuente-dato); font-size:18px; color: var(--navy); }
  .bq.curso .ej .cifra { font-size:20px; font-weight:700; }
  .ej .det { font-size:14px; line-height:1.45; color: var(--texto); }
  .ej .obs { font-size:13px; line-height:1.5; color: var(--texto-suave); }

  /* ---- descanso: los dos modos, con etiqueta de color -------------------
     Salida y descanso fijo se confunden y son cosas distintas, así que no
     comparten color: salida en azul, descanso al tocar pared en morado. */
  .desc { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .desc .tag { border-radius:999px; padding:3px 10px; color:#fff; font-size:13px; line-height:1.3; }
  .desc .val { font-family: var(--fuente-dato); font-size:15px; color: var(--navy); }
  .desc .nota { font-size:13px; color: var(--texto-suave); }

  /* separador de descanso entre bloques */
  .entre { padding:5px 14px; border-bottom:1px solid var(--linea); background: var(--crema);
           display:flex; align-items:center; gap:8px; }
  .entre i { flex:1; height:1px; background: var(--linea-marcada); }
  .entre span { font-size:13px; line-height:1.4; color: var(--texto-suave); }

  .mats { display:flex; flex-wrap:wrap; gap:6px; }
  .mats span { font-size:13px; line-height:1.3; color: var(--texto-suave); background: var(--crema);
               border:1px solid var(--linea); border-radius:999px; padding:3px 10px; }

  /* ---- tus tiempos, dentro de cada serie (patrón del portal) ------------ */
  .tcap { display:flex; align-items:baseline; gap:8px; margin-top:2px; }
  .tcap b { font-size:13px; font-weight:600; color: var(--navy); }
  .tcap span { margin-left:auto; font-family: var(--fuente-dato); font-size:12px; color: var(--texto-suave); }
  .thuecos { display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px; }
  .thueco { display:flex; flex-direction:column; gap:3px; }
  .thueco .n { font-size:13px; color: var(--texto-suave); }
  .thueco input { width:100%; box-sizing:border-box; min-height:46px; text-align:center; padding:10px 6px;
                  border:1px solid var(--linea-borde); border-radius:10px; font-size:16px;
                  font-family: var(--fuente-dato); color: var(--navy); background: var(--crema); }
  .thueco input:focus { outline:none; border-color: var(--azul); background:#fff; box-shadow:0 0 0 3px var(--azul-suave); }
  .thueco input.puesto { border-color: var(--azul); background:#fff; font-weight:700; }

  /* ---- tarjeta del nadador · 25c ---------------------------------------- */
  .hola { padding: 6px 16px 4px; max-width:680px; margin:0 auto; display:flex; align-items:flex-end; gap:12px; }
  .hola .txt { flex:1; min-width:0; }
  .hola .et { display:block; font-size:13px; line-height:1.4; color: var(--texto-suave); }
  .hola h1 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:28px; line-height:1.05;
             color: var(--navy); margin:2px 0 0; }
  .hola .yo { width:40px; height:40px; border-radius:999px; background: var(--navy); color:#fff; flex:0 0 auto;
              display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo);
              font-weight:700; font-size:15px; }

  .mia { background: var(--navy); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column;
         gap:12px; box-shadow: 0 24px 44px -26px rgba(46,66,86,0.9); }
  .mia .lin { display:flex; align-items:center; gap:10px; }
  .mia .et { font-size:13px; line-height:1.4; color: rgba(255,255,255,.62); }
  .mia .hora { margin-left:auto; font-family: var(--fuente-dato); font-size:13px; color:#8FC0E8; }
  .mia .tit { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .mia .tit b { font-family: var(--fuente-titulo); text-transform:uppercase; font-weight:700;
                font-size:40px; line-height:.95; color:#fff; }
  .mia .tit i { font-style:normal; font-size:15px; color: rgba(255,255,255,.72); }
  .mia .cifras > div { background: rgba(255,255,255,.12); }
  .mia .cifras b { color:#fff; }
  .mia .cifras span { color: rgba(255,255,255,.62); }
  .mia p { margin:0; font-size:14px; line-height:1.5; color: rgba(255,255,255,.75); }

  /* ---- avisos y franjas -------------------------------------------------- */
  .franja-ambar { background: var(--ambar-fondo); border:1px solid var(--ambar-borde); border-radius:14px;
                  padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .franja-ambar p { margin:0; flex:1 1 180px; font-size:14px; line-height:1.45; color:#6B5227; }

  /* ---- botones · tres niveles, un solo azul por pantalla (kit 30f) ------ */
  .btn-a, .btn-b, .btn-c, .btn-am {
    display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box;
    min-height:44px; padding:0 20px; border-radius:999px; font-family:inherit; font-size:15px;
    font-weight:600; line-height:1.2; cursor:pointer; text-decoration:none; border:1px solid transparent; }
  .btn-a { background: var(--azul); color:#fff; border-color: var(--azul); }
  .btn-a:hover { background: var(--azul-oscuro); }
  .btn-a[disabled] { opacity:.5; cursor:default; }
  .btn-b { background:#fff; border-color:#C9C0AE; color: var(--navy); }
  .btn-b:hover { border-color: var(--azul); }
  .btn-c { background:none; border:0; color: var(--azul-oscuro); padding:0 6px; }
  .btn-am { background: var(--ambar); color:#fff; border-color: var(--ambar); }

  /* barra de acción: se queda a mano, por encima de la barra de pestañas */
  .barra { position:sticky; bottom:12px; z-index:5; display:flex; gap:10px; align-items:stretch;
           background: var(--crema); padding:10px 0 0; }
  .barra .btn-a { flex:1; }
  @media (max-width:760px) { .barra { bottom: calc(90px + env(safe-area-inset-bottom)); } }

  /* ---- formularios (ajustar calle, cambiar sesión) ---------------------- */
  .panel { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px 16px;
           display:flex; flex-direction:column; gap:12px; }
  .panel h2 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px;
              color: var(--navy); margin:0; }
  .panel .pista { margin:0; font-size:13px; line-height:1.5; color: var(--texto-suave); }
  label.et { display:block; font-size:13px; line-height:1.4; color: var(--texto-suave); margin-bottom:4px; }
  input[type=text], input[type=date], select, textarea {
    width:100%; box-sizing:border-box; min-height:44px; padding:10px 12px; border:1px solid var(--linea-borde);
    border-radius:10px; font-family:inherit; font-size:15px; color: var(--navy); background:#fff; }
  textarea { resize:vertical; min-height:64px; }
  .rej { display:flex; flex-wrap:wrap; gap:10px; }
  .rej > div { flex:1 1 150px; min-width:0; }
  .rej > div.ancho { flex:1 1 100%; }

  .ejfila { border:1px solid var(--linea); border-radius:10px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; }
  .ejfila > .ancho { flex:1 1 100%; }
  .ejfila > .corto { flex:1 1 84px; min-width:0; }
  .ejfila input.dato { font-family: var(--fuente-dato); }
  .ejfila input.dato::placeholder { font-family: var(--fuente-texto); }
  .quitar { min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center;
            background:none; border:0; color: var(--rojo); font-size:18px; cursor:pointer; font-family:inherit; }

  /* los dos modos de descanso, como elección de dos (nunca un menú) */
  .modos { display:flex; gap:6px; flex:1 1 100%; }
  .modos button { flex:1; min-height:44px; border-radius:999px; border:1px solid var(--linea-borde);
                  background: var(--crema); color: var(--texto-suave); font-family:inherit; font-size:14px;
                  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .modos button .pnt { width:9px; height:9px; border-radius:999px; background: currentColor; }
  .modos button.on { color:#fff; border-color:transparent; font-weight:600; }
  .modos button.on.salida { background:#2F6FA8; }
  .modos button.on.fijo { background:#6B5B8A; }

  .chips-mat { display:flex; flex-wrap:wrap; gap:6px; }
  .chips-mat label { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 13px;
                     border:1px solid var(--linea-borde); border-radius:999px; background: var(--crema);
                     font-size:14px; color: var(--texto-suave); cursor:pointer; }
  .chips-mat label.on { background: var(--navy); border-color: var(--navy); color:#fff; }
  .chips-mat input { width:16px; height:16px; min-height:0; margin:0; }

  /* quién nada aquí */
  .gente { display:flex; flex-wrap:wrap; gap:8px; }
  .nad { position:relative; display:inline-flex; align-items:center; gap:8px; min-height:44px;
         background:#fff; border:1px solid var(--linea-borde); border-radius:999px;
         padding:0 34px 0 14px; font-size:15px; color: var(--navy); }
  .nad::after { content:'\203A'; position:absolute; right:13px; top:50%; transform:translateY(-50%);
                color: var(--texto-suave); font-size:20px; line-height:1; pointer-events:none; }
  .nad select { position:absolute; inset:0; width:100%; height:100%; min-height:0; opacity:0;
                border:0; padding:0; margin:0; cursor:pointer; }
  .gente .vacia { font-size:14px; line-height:1.45; color: var(--texto-suave); }

  .msg { font-size:14px; line-height:1.45; color: var(--texto-suave); }
  .msg.ok { color: var(--verde); }
  .msg.error { color: var(--rojo); }

  .check { display:flex; align-items:center; gap:10px; min-height:44px; font-size:15px;
           color: var(--texto); cursor:pointer; }
  .check input { flex:0 0 auto; width:20px; height:20px; min-height:0; }
</style>
<script>
/* Avisos suaves y confirmaciones no bloqueantes del portal (APX). */
(function(){
  if (window.APX) return;
  var css =
    '.apx-host{position:fixed;left:0;right:0;bottom:18px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}'+
    '.apx-toast{pointer-events:auto;max-width:440px;background:var(--navy,#2E4256);color:#fff;font-family:var(--fuente-texto,system-ui);font-size:14px;line-height:1.4;padding:12px 16px;border-radius:14px;box-shadow:0 16px 34px -18px rgba(46,66,86,.7);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}'+
    '.apx-toast.apx-in{opacity:1;transform:none}'+
    '.apx-ov{position:fixed;inset:0;z-index:10000;background:rgba(30,42,56,.5);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .2s}'+
    '.apx-ov.apx-in{opacity:1}'+
    '.apx-dlg{background:var(--crema,#FBF9F4);border:1px solid var(--linea,#EAE3D5);border-radius:14px;box-shadow:0 34px 60px -30px rgba(46,66,86,.6);max-width:400px;width:100%;padding:22px 22px 18px;transform:translateY(8px) scale(.98);transition:transform .2s}'+
    '.apx-ov.apx-in .apx-dlg{transform:none}'+
    '.apx-dlg-msg{margin:0 0 18px;font-family:var(--fuente-texto,system-ui);font-size:15px;line-height:1.5;color:var(--texto,#4A4437)}'+
    '.apx-dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}'+
    '.apx-btn{font-family:var(--fuente-texto,system-ui);font-size:15px;font-weight:600;padding:10px 20px;border-radius:999px;border:1px solid var(--linea-borde,#D4CBB9);background:#fff;color:var(--navy,#2E4256);cursor:pointer;min-height:44px}'+
    '.apx-btn:hover{border-color:#C9D9E7}'+
    '.apx-ok{background:var(--azul,#3B85C0);border-color:var(--azul,#3B85C0);color:#fff}'+
    '.apx-ok:hover{background:var(--azul-oscuro,#2F6FA8)}'+
    '.apx-ok.apx-danger{background:#B0563A;border-color:#B0563A}'+
    '@media(max-width:420px){.apx-dlg-btns{flex-direction:column-reverse}.apx-btn{width:100%}}';
  var st=document.createElement('style'); st.textContent=css; (document.head||document.documentElement).appendChild(st);
  var host=null;
  function ensureHost(){ if(!host){ host=document.createElement('div'); host.className='apx-host'; document.body.appendChild(host);} return host; }
  function toast(msg){
    ensureHost();
    var el=document.createElement('div'); el.className='apx-toast'; el.textContent=msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('apx-in'); });
    setTimeout(function(){ el.classList.remove('apx-in'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); }, 4000);
  }
  function confirmar(msg,opts){
    opts=opts||{};
    return new Promise(function(resolve){
      var ov=document.createElement('div'); ov.className='apx-ov';
      var dlg=document.createElement('div'); dlg.className='apx-dlg'; dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true');
      var p=document.createElement('p'); p.className='apx-dlg-msg'; p.textContent=msg; dlg.appendChild(p);
      var btns=document.createElement('div'); btns.className='apx-dlg-btns';
      var bc=document.createElement('button'); bc.type='button'; bc.className='apx-btn'; bc.textContent=opts.cancelar||'Cancelar';
      var bo=document.createElement('button'); bo.type='button'; bo.className='apx-btn apx-ok'; bo.textContent=opts.aceptar||'Aceptar';
      if(opts.peligro) bo.classList.add('apx-danger');
      btns.appendChild(bc); btns.appendChild(bo); dlg.appendChild(btns); ov.appendChild(dlg);
      document.body.appendChild(ov);
      requestAnimationFrame(function(){ ov.classList.add('apx-in'); });
      function cerrar(v){ ov.classList.remove('apx-in'); document.removeEventListener('keydown',onkey); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); resolve(v); }
      function onkey(e){ if(e.key==='Escape'){ e.preventDefault(); cerrar(false);} else if(e.key==='Enter'){ e.preventDefault(); cerrar(true);} }
      bc.addEventListener('click',function(){ cerrar(false); });
      bo.addEventListener('click',function(){ cerrar(true); });
      ov.addEventListener('click',function(e){ if(e.target===ov) cerrar(false); });
      document.addEventListener('keydown',onkey);
      setTimeout(function(){ bo.focus(); },40);
    });
  }
  window.APX={ toast:toast, confirm:confirmar };
})();
</script>
</head>
<body>

<div id="portal-contenido">
  <div id="app">
    <div class="wrap"><div class="ap-esq" data-esq="tarjeta"></div></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var C = window.APOLANA_CALLES;
  var app = document.getElementById('app');

  /* ---------- utilidades de texto ---------- */
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function escAt(s){ return esc(s).replace(/"/g,'&quot;'); }
  function isoHoy(){ var d=new Date(), m=d.getMonth()+1, x=d.getDate();
    return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x; }
  var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function diaSemana(iso){ if(!iso) return null; return DIAS[new Date(iso+'T00:00:00').getDay()]; }
  function fechaLarga(iso){
    if(!iso) return '';
    var d=new Date(iso+'T00:00:00');
    return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];
  }
  function horaCorta(h){ return h ? String(h).slice(0,5) : ''; }
  var HOY = isoHoy();

  var MATERIAL = ['Tabla','Pull-buoy','Palas','Aletas','Manoplas','Snorkel frontal','Goma elástica','Sin material'];
  var SECCIONES = {
    escuela:'Escuela', competicion:'Competición', running:'Running', natacion:'Natación',
    'escuela-natacion':'Escuela de natación', triatlon:'Triatlón', montana:'Montaña',
    cubo:'El Cubo', pista:'Pista', 'escuela-municipal':'Escuela municipal', 'deporte-adaptado':'Deporte adaptado'
  };
  function nombreSeccion(s){ return SECCIONES[s] || s; }
  function nombreCorto(a){ return a ? (a.nombre_corto || ((a.nombre||'')+' '+((a.apellidos||'').split(' ')[0]||'')).trim()) : ''; }
  function nombreLargo(a){ return a ? ((a.nombre||'')+' '+(a.apellidos||'')).trim() : ''; }

  /* ---------- estados de un bloque que lee datos (fundamentos 28f) ---------- */
  function pintarCargando(){
    app.innerHTML = '<div class="wrap">'+APOLANA_UI.cargando('tarjeta')+APOLANA_UI.cargando('filas',3)+'</div>';
  }
  var REINTENTOS = {};
  var nReintento = 0;
  /* Error en ámbar y con salida. El botón NO recarga la página: repite solo
     lo que ha fallado, para no perder lo que el entrenador tenga escrito. */
  function htmlError(titulo, texto, fn){
    var k = 'r'+(++nReintento);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="'+k+'">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (fn) fn();
  });
  function pintarError(titulo, texto, fn){
    app.innerHTML = '<div class="wrap">'+htmlError(titulo, texto, fn)+'</div>';
  }

  /* ======================================================================
     PIEZAS COMPARTIDAS · las mismas para el entrenador y para el nadador
     ====================================================================== */

  /* Los dos modos de descanso, con su etiqueta de color. Nunca un campo
     vacío: si el bloque no lleva recuperación, esto no devuelve nada. */
  function htmlDescanso(f){
    var d = C.descanso(f);
    if (!d) return '';
    return '<div class="desc"><span class="tag" style="background:'+escAt(d.color)+'">'+esc(d.etiqueta)+'</span>'+
           '<span class="val">'+esc(d.valor)+'</span>'+
           (d.nota ? '<span class="nota">· '+esc(d.nota)+'</span>' : '')+'</div>';
  }

  function htmlMaterial(f){
    var m = Array.isArray(f.material) ? f.material : (f.material ? [f.material] : []);
    m = m.filter(function(x){ return x && x !== 'Sin material'; });
    if (!m.length) return '';
    return '<div class="mats">'+m.map(function(x){ return '<span>'+esc(x)+'</span>'; }).join('')+'</div>';
  }

  /* Un ejercicio: la cifra en monoespaciada (se compara de fila en fila),
     lo demás en texto normal. `huecos` añade los tiempos del nadador. */
  function htmlEjercicio(f, huecos){
    var cif = C.cifra(f), det = C.detalle(f);
    return '<div class="ej">'+
      (cif ? '<span class="cifra">'+esc(cif)+'</span>' : '')+
      (det ? '<span class="det">'+esc(det)+'</span>' : '')+
      htmlDescanso(f)+
      htmlMaterial(f)+
      (f.observaciones ? '<span class="obs">'+esc(f.observaciones)+'</span>' : '')+
      (huecos || '')+
    '</div>';
  }

  /* La sesión de una calle: lo común y lo suyo, con su estado y con el
     separador de descanso entre bloques cuando está escrito. */
  function htmlBloques(lista, hechos, opciones){
    opciones = opciones || {};
    var h = '<div class="bloques">';
    lista.forEach(function(x, i){
      var prev = C.descansoPrevio(x.b);
      if (prev && i > 0) h += '<div class="entre"><i></i><span>'+esc(prev)+'</span><i></i></div>';
      var estado = i < hechos ? 'hecho' : (i === hechos ? 'curso' : '');
      var m = C.metrosBloque(x.b);
      var derecha = i < hechos ? '<span class="der ok">hecho</span>'
                  : (m ? '<span class="der'+(i===hechos?' az':'')+'">'+esc(C.volumen(m))+'</span>' : '');
      h += '<div class="bq '+estado+(x.propio?'':' comun')+'">'+
        '<div class="cab-b"><span class="et">'+esc((i+1)+' · '+(x.b.etiqueta||'Bloque'))+
          (i===hechos ? ' · en curso' : '')+'</span>'+derecha+'</div>'+
        (!x.propio && opciones.marcarComun ? '<span class="marca-todos">Lo hace todo el grupo, no solo tu calle</span>' : '')+
        ((x.b.filas||[]).length
          ? (x.b.filas||[]).map(function(f, fi){
              return htmlEjercicio(f, opciones.huecos ? opciones.huecos(x.idx, fi, f) : '');
            }).join('')
          : '<span class="obs">Por definir</span>')+
      '</div>';
    });
    return h + '</div>';
  }

  function htmlCifras(items){
    return '<div class="cifras">'+items.map(function(x){
      return '<div><b>'+esc(x.v)+'</b><span>'+esc(x.l)+'</span></div>';
    }).join('')+'</div>';
  }

  /* ======================================================================
     ¿QUIÉN ENTRA? · entrenador o nadador
     ====================================================================== */
  var rol = (perfil && perfil.rol) || '';
  var esAdmin = (rol === 'admin');
  var GRUPOS = [];

  pintarCargando();

  try {
    var q = sb.from('grupos').select('id,nombre,seccion,entrenador_id,horario').eq('activo', true).order('seccion').order('nombre');
    if (!esAdmin) q = q.eq('entrenador_id', perfil ? perfil.id : '00000000-0000-0000-0000-000000000000');
    var rg = await q;
    if (rg.error) throw rg.error;
    GRUPOS = rg.data || [];
  } catch (e) {
    pintarError('No hemos podido cargar tus grupos',
      'Puede ser tu conexión. Los datos siguen ahí: vuelve a intentarlo en un momento.', arrancar);
    return;
  }

  /* El arranque va al final del todo: así las variables de estado de más
     abajo ya están creadas cuando se pinta la primera pantalla. */

  async function arrancar(){
    if (esAdmin || rol === 'entrenador' || GRUPOS.length) { await entrenadorArranca(); return; }
    await nadadorArranca();
  }

  /* ======================================================================
     NADADOR · 25c — su calle y nada más
     Nunca ve las otras calles ni quién nada en ellas. Lo de todo el grupo
     va detrás y en segundo plano; lo suyo, delante y destacado.
     ====================================================================== */
  async function nadadorArranca(){
    pintarCargando();
    var at = null;
    try {
      var ra = await sb.from('atletas').select('id,nombre,apellidos,nombre_corto,grupo_id,estado')
        .eq('perfil_id', perfil ? perfil.id : null).maybeSingle();
      if (ra.error) throw ra.error;
      at = ra.data;
    } catch (e) {
      pintarError('No hemos podido cargar tu ficha',
        'Puede ser tu conexión. Espera un momento y vuelve a intentarlo.', nadadorArranca);
      return;
    }

    if (!at) {
      app.innerHTML = '<div class="wrap">'+APOLANA_UI.vacio('Esta pantalla es de las calles de la piscina',
        'Aquí el entrenador reparte a los nadadores por calles y cada uno ve la suya. Tu cuenta no está '+
        'enlazada con ninguna ficha de nadador: díselo a la coordinación del club.',
        APOLANA_UI.boton('Volver al portal', '../'))+'</div>';
      return;
    }

    /* Sesiones por calles de su grupo: hoy si la hay; si no, la más cercana.
       Con RLS el nadador solo puede leer las publicadas de su grupo. */
    var ses = [];
    try {
      var rs = await sb.from('sesiones')
        .select('id,fecha,hora,lugar,titulo,nota_razonamiento,bloques,calles,grupo_id,publicada')
        .eq('grupo_id', at.grupo_id).eq('publicada', true)
        .gte('fecha', desplazar(HOY, -21)).lte('fecha', desplazar(HOY, 21))
        .order('fecha', { ascending:true });
      if (rs.error) throw rs.error;
      ses = (rs.data || []).filter(function(s){ return C.separar(s.bloques).calles.length > 0; });
    } catch (e) {
      pintarError('No hemos podido cargar tu entreno',
        'Puede ser tu conexión. Espera un momento y vuelve a intentarlo.', nadadorArranca);
      return;
    }

    /* De todas, la que le toca: la de hoy; si no, la siguiente; si no, la última */
    var mias = ses.filter(function(s){ return miCalle(s, at.id) != null; });
    var s = null;
    mias.forEach(function(x){ if (!s && x.fecha === HOY) s = x; });
    if (!s) mias.forEach(function(x){ if (!s && x.fecha > HOY) s = x; });
    if (!s && mias.length) s = mias[mias.length - 1];

    if (!s) {
      app.innerHTML =
        '<div class="hola"><div class="txt"><span class="et">'+esc(fechaLarga(HOY))+'</span>'+
          '<h1>Hola, '+esc(at.nombre||'')+'</h1></div>'+
          '<span class="yo">'+esc(C.iniciales(at.nombre, at.apellidos))+'</span></div>'+
        '<div class="wrap">'+APOLANA_UI.vacio('Todavía no tienes calle',
          'Cuando tu entrenador reparta la sesión de natación por calles, aquí verás la tuya: los metros, '+
          'las series y con qué salida. Mientras tanto, tu entreno del día está en tu portal.',
          APOLANA_UI.boton('Ver mi entreno', '../atleta/'))+'</div>';
      return;
    }

    var sep = C.separar(s.bloques);
    var cal = miCalle(s, at.id);
    var lista = C.secuencia(sep, cal.n);
    var metros = C.metrosSecuencia(lista);
    var dur = C.duracion(lista);
    var reg = await leerRegistro(s.id, at.id);

    var etiquetaCalle = cal.b.etiqueta || ('Calle ' + cal.n);
    var cabFecha = (s.fecha === HOY ? 'hoy · ' : '') + fechaLarga(s.fecha) + (s.lugar ? ' · ' + s.lugar : '');

    app.innerHTML =
      '<div class="hola"><div class="txt"><span class="et">'+esc(cabFecha)+'</span>'+
        '<h1>Hola, '+esc(at.nombre||'')+'</h1></div>'+
        '<span class="yo">'+esc(C.iniciales(at.nombre, at.apellidos))+'</span></div>'+
      '<div class="wrap">'+
        '<div class="mia">'+
          '<div class="lin"><span class="et">'+(s.fecha===HOY?'tu calle hoy':'tu calle')+'</span>'+
            (s.hora ? '<span class="hora">'+esc(horaCorta(s.hora))+'</span>' : '')+'</div>'+
          '<div class="tit"><b>'+esc(etiquetaCalle)+'</b>'+(cal.b.matiz?'<i>'+esc(cal.b.matiz)+'</i>':'')+'</div>'+
          htmlCifras([
            { v: String(metros).replace(/\B(?=(\d{3})+(?!\d))/g,'.'), l:'metros' },
            { v: String(lista.length), l:'bloques' }
          ].concat(dur ? [{ v: dur, l:'duración' }] : []))+
          (s.titulo || s.nota_razonamiento
            ? '<p>'+esc([s.titulo, s.nota_razonamiento].filter(Boolean).join('. '))+'</p>' : '')+
        '</div>'+
        htmlBloques(lista, -1, {
          marcarComun: true,
          huecos: function(bi, fi, f){ return htmlHuecos(bi, fi, f, reg); }
        })+
        '<div class="msg" id="n-msg"></div>'+
        '<div class="barra"><button class="btn-a" id="n-guardar">Guardar mis tiempos</button></div>'+
      '</div>';

    /* Los manejadores van en el contenedor y una sola vez: la pantalla se
       repinta entera y si colgasen del botón se duplicarían los clics. */
    if (!NADADOR_ENGANCHADO) {
      NADADOR_ENGANCHADO = true;
      app.addEventListener('input', function(ev){
        var t = ev.target;
        if (!t.classList || !t.classList.contains('t-in')) return;
        t.classList.toggle('puesto', !!t.value.trim());
        var caja = t.closest('.ej');
        var cap = caja ? caja.querySelector('.tcap span') : null;
        if (cap) {
          var ins = caja.querySelectorAll('.t-in'), n = 0;
          Array.prototype.forEach.call(ins, function(x){ if (x.value.trim()) n++; });
          cap.textContent = n + ' de ' + ins.length;
        }
      });
      app.addEventListener('click', function(ev){
        var b = ev.target && ev.target.closest ? ev.target.closest('#n-guardar') : null;
        if (b) guardarTiempos(NADADOR.sesion, NADADOR.atleta);
      });
    }
    NADADOR = { sesion: s, atleta: at };
  }
  var NADADOR_ENGANCHADO = false;
  var NADADOR = { sesion:null, atleta:null };

  function desplazar(iso, dias){
    var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+dias);
    var m=d.getMonth()+1, x=d.getDate();
    return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;
  }

  function miCalle(s, atletaId){
    var sep = C.separar(s.bloques), out = null;
    sep.calles.forEach(function(c){
      if (!out && (c.b.atletas||[]).indexOf(atletaId) > -1) out = c;
    });
    return out;
  }

  async function leerRegistro(sid, aid){
    try {
      var r = await sb.from('registros_sesion').select('tiempos_reales').eq('sesion_id', sid).eq('atleta_id', aid).maybeSingle();
      return (r && r.data && r.data.tiempos_reales) ? r.data.tiempos_reales : {};
    } catch (e) { return {}; }
  }

  /* Los tiempos van DENTRO de cada serie, con su número, igual que en el
     resto del portal: así no hay duda de dónde se anota cada repetición.
     La clave usa la posición real del bloque en la sesión, que es la misma
     que usa el portal del atleta: los dos escriben el mismo sitio. */
  function htmlHuecos(bi, fi, f, reg){
    var n = C.repeticiones(f);
    if (!(n > 1) || !C.metros(f.distancia)) return '';
    if (n > 30) n = 30;
    var key = 'b'+bi+'f'+fi;
    var ya = (reg && reg[key] && reg[key].tiempos) ? reg[key].tiempos : [];
    var puestos = 0, h = '';
    for (var i=0;i<n;i++){
      var v = ya[i] == null ? '' : String(ya[i]);
      if (v.trim()) puestos++;
      h += '<label class="thueco"><span class="n">'+(i+1)+'ª</span>'+
           '<input class="t-in'+(v.trim()?' puesto':'')+'" type="text" inputmode="decimal" placeholder="–" '+
           'value="'+escAt(v)+'" data-key="'+escAt(key)+'" data-i="'+i+'" '+
           'aria-label="Serie '+(i+1)+' de '+n+' de '+escAt(f.ejercicio||C.cifra(f))+'"></label>';
    }
    return '<div class="tcap"><b>Tus tiempos</b><span>'+puestos+' de '+n+'</span></div>'+
           '<div class="thuecos" data-eje="'+escAt(f.ejercicio || C.cifra(f))+'">'+h+'</div>';
  }

  async function guardarTiempos(s, at){
    var msg = document.getElementById('n-msg');
    var btn = document.getElementById('n-guardar');
    msg.className = 'msg'; msg.textContent = 'Guardando…';
    btn.disabled = true;
    var tiempos = {};
    Array.prototype.forEach.call(app.querySelectorAll('.thuecos'), function(g){
      var ins = g.querySelectorAll('.t-in');
      if (!ins.length) return;
      var key = ins[0].getAttribute('data-key'), vals = [], hay = false;
      Array.prototype.forEach.call(ins, function(x){ var v = x.value.trim(); vals.push(v); if (v) hay = true; });
      if (hay) tiempos[key] = { ejercicio: g.getAttribute('data-eje'), tiempos: vals };
    });
    var r = await sb.from('registros_sesion').upsert(
      { sesion_id: s.id, atleta_id: at.id, tiempos_reales: Object.keys(tiempos).length ? tiempos : null },
      { onConflict: 'sesion_id,atleta_id' });
    btn.disabled = false;
    if (r.error) {
      msg.className = 'msg';
      msg.innerHTML = htmlError('No hemos podido guardar tus tiempos',
        'Puede ser tu conexión. No has perdido nada de lo que has escrito: sigue en pantalla.',
        function(){ guardarTiempos(s, at); });
      return;
    }
    msg.className = 'msg ok';
    msg.textContent = 'Guardado. Tu entrenador lo verá en el feedback de la sesión.';
    APX.toast('Tiempos guardados');
  }

  /* ======================================================================
     ENTRENADOR · 25b — las calles, y al tocar una, su sesión
     ====================================================================== */
  var EST = {
    grupo: null, fecha: HOY, sesion: null, sesionesDia: [],
    nCalles: 4, calles: [], comunes: [], atletas: [],
    vista: 'tablero',   /* 'tablero' | 'calle' */
    calle: 1,
    ajustando: false, cambiando: false
  };

  function calleVacia(i){ return { n:i+1, etiqueta:'Calle '+(i+1), matiz:'', atletas:[], filas:[filaVacia()], descanso_previo:'' }; }
  function filaVacia(){ return { ejercicio:'', series:'', distancia:'', ritmo:'', descanso:'', descanso_modo:'salida', material:[], observaciones:'' }; }
  function atletaPorId(id){ for (var i=0;i<EST.atletas.length;i++) if (EST.atletas[i].id===id) return EST.atletas[i]; return null; }
  function calleDe(id){ for (var i=0;i<EST.calles.length;i++) if (EST.calles[i].atletas.indexOf(id)>-1) return i; return -1; }

  async function entrenadorArranca(){
    if (!GRUPOS.length && !esAdmin) {
      app.innerHTML =
        '<header class="cab"><div class="dentro"><a class="volver" href="../">‹ Portal</a>'+
        '<h1>Calles de la piscina</h1></div></header>'+
        '<div class="wrap">'+APOLANA_UI.vacio('Todavía no tienes ningún grupo',
          'Aquí se reparte a los nadadores por calles y se escribe el trabajo de cada una. En cuanto la '+
          'coordinación te asigne tu grupo de natación, esta pantalla se llena sola.',
          APOLANA_UI.boton('Volver al portal', '../'))+'</div>';
      return;
    }
    EST.grupo = EST.grupo || (GRUPOS[0] ? GRUPOS[0].id : null);
    engancharTodo();
    pintarCargando();
    var ok = await cargarGrupoYDia();
    if (ok) pintar();
  }

  async function cargarGrupoYDia(){
    try {
      var ra = await sb.from('atletas').select('id,nombre,apellidos,nombre_corto,grupo_id,estado')
        .eq('grupo_id', EST.grupo).order('apellidos', { ascending:true });
      if (ra.error) throw ra.error;
      EST.atletas = (ra.data||[]).filter(function(a){ return a.estado !== 'baja'; });

      var rs = await sb.from('sesiones')
        .select('id,fecha,hora,lugar,tipo,titulo,nota_razonamiento,bloques,publicada,grupo_id,atletas_ids,calles')
        .eq('grupo_id', EST.grupo).eq('fecha', EST.fecha).order('created_at', { ascending:true });
      if (rs.error) throw rs.error;
      EST.sesionesDia = rs.data || [];
    } catch (e) {
      pintarError('No hemos podido cargar ese día',
        'Puede ser tu conexión. Espera un momento y vuelve a intentarlo.',
        async function(){ pintarCargando(); if (await cargarGrupoYDia()) pintar(); });
      return false;
    }
    var deCalles = EST.sesionesDia.filter(function(s){ return C.separar(s.bloques).calles.length > 0; })[0];
    abrirSesion(deCalles || null);
    return true;
  }

  function abrirSesion(s){
    EST.sesion = s;
    EST.calle = 1;
    EST.vista = 'tablero';
    EST.ajustando = false;
    if (!s) { EST.calles = []; EST.comunes = []; return; }
    var sep = C.separar(s.bloques);
    EST.comunes = sep.comunes.map(function(x){ return x.b; });
    var n = parseInt(s.calles,10) || 0;
    sep.calles.forEach(function(c){ if (c.n > n) n = c.n; });
    if (!n) n = 4;
    if (n < 2) n = 2; if (n > 8) n = 8;
    EST.nCalles = n;
    EST.calles = [];
    for (var i=0;i<n;i++) EST.calles.push(calleVacia(i));
    sep.calles.forEach(function(c){
      var i = c.n - 1;
      if (i < 0 || i >= EST.calles.length) return;
      EST.calles[i] = {
        n: c.n,
        etiqueta: c.b.etiqueta || ('Calle '+c.n),
        matiz: c.b.matiz || '',
        descanso_previo: c.b.descanso_previo || '',
        atletas: (Array.isArray(c.b.atletas)?c.b.atletas:[]).slice(),
        filas: (Array.isArray(c.b.filas) && c.b.filas.length) ? c.b.filas.map(function(f){
          var o = {}; for (var k in f) if (Object.prototype.hasOwnProperty.call(f,k)) o[k] = f[k];
          o.material = Array.isArray(f.material) ? f.material.slice() : (f.material ? [f.material] : []);
          o.descanso_modo = C.modoDe(f);
          return o;
        }) : [filaVacia()]
      };
    });
  }

  /* Lo que ve una calle: los bloques comunes más el suyo, en orden */
  function secuenciaDe(i){
    var lista = EST.comunes.map(function(b, k){ return { idx:k, b:b, propio:false }; });
    var c = EST.calles[i];
    if (c) lista.push({ idx: 1000+i, b: { etiqueta:c.etiqueta, matiz:c.matiz, filas:c.filas, descanso_previo:c.descanso_previo }, propio:true });
    return lista;
  }

  function pintar(){
    if (EST.vista === 'calle') pintarCalle(); else pintarTablero();
  }

  /* ---------- cabecera de la sesión ---------- */
  function htmlCabSesion(){
    var s = EST.sesion;
    var g = null; GRUPOS.forEach(function(x){ if (x.id === EST.grupo) g = x; });
    var meta = [ (EST.fecha===HOY ? 'hoy · ' : '') + fechaLarga(EST.fecha) ];
    if (s && s.lugar) meta.push(s.lugar);
    var conCalle = 0; EST.calles.forEach(function(c){ conCalle += c.atletas.length; });
    return '<header class="cab"><div class="dentro">'+
      '<a class="volver" href="../">‹ Portal</a>'+
      '<div class="meta"><span>'+esc(meta.join(' · '))+'</span>'+
        (s && s.hora ? '<span class="dato">'+esc(horaCorta(s.hora))+'</span>' : '')+
        '<button class="cambiar" id="e-cambiar">'+(EST.cambiando?'cerrar':'cambiar')+'</button></div>'+
      '<h1>'+esc(s ? (s.titulo || 'Sesión sin título') : 'Calles de la piscina')+'</h1>'+
      '<div class="meta"><span>'+esc((g?g.nombre:'')+(s ? ' · '+EST.nCalles+' calles · '+conCalle+' de '+EST.atletas.length+' con calle' : ''))+'</span>'+
        (s && !s.publicada ? '<span class="dato">borrador</span>' : '')+'</div>'+
      '</div></header>';
  }

  /* ---------- panel de «cambiar»: grupo, día y sesión ---------- */
  function htmlPanelCambiar(){
    if (!EST.cambiando) return '';
    var s = EST.sesion;
    var op = ''; for (var n=2;n<=8;n++) op += '<option value="'+n+'"'+(n===EST.nCalles?' selected':'')+'>'+n+' calles</option>';
    return '<div class="panel">'+
      '<h2>La sesión</h2>'+
      '<div class="rej">'+
        '<div><label class="et" for="e-grupo">Grupo</label><select id="e-grupo">'+
          GRUPOS.map(function(g){ return '<option value="'+escAt(g.id)+'"'+(g.id===EST.grupo?' selected':'')+'>'+
            esc(g.nombre)+(g.seccion?' · '+esc(nombreSeccion(g.seccion)):'')+'</option>'; }).join('')+
        '</select></div>'+
        '<div><label class="et" for="e-fecha">Día</label><input type="date" id="e-fecha" value="'+escAt(EST.fecha)+'"></div>'+
        '<div class="ancho"><label class="et" for="e-sesion">Sesión de ese día</label><select id="e-sesion">'+
          '<option value="">Sesión nueva por calles</option>'+
          EST.sesionesDia.map(function(x){
            var deCalles = C.separar(x.bloques).calles.length > 0;
            return '<option value="'+escAt(x.id)+'"'+(s && s.id===x.id?' selected':'')+'>'+
              esc((x.titulo||'Sin título')+(deCalles?' · por calles':' · '+(x.tipo||'sesión')))+'</option>';
          }).join('')+
        '</select></div>'+
        (s ? '<div><label class="et" for="e-num">Cuántas calles</label><select id="e-num">'+op+'</select></div>'+
             '<div class="ancho"><label class="et" for="e-titulo">Título (lo que ven los nadadores)</label>'+
               '<input type="text" id="e-titulo" value="'+escAt(s.titulo||'')+'" placeholder="Series de 100 · umbral"></div>'+
             '<div class="ancho"><label class="et" for="e-nota">Nota del día (opcional)</label>'+
               '<textarea id="e-nota" placeholder="Por qué se hace así, avisos del día…">'+esc(s.nota_razonamiento||'')+'</textarea></div>'
           : '')+
      '</div>'+
      (s ? '<label class="check"><input type="checkbox" id="e-publicar"'+(s.publicada?' checked':'')+'> '+
             'Publicada · si no, se queda en borrador y no la ve nadie</label>'+
           '<div><button class="btn-b" id="e-guardar-ses">Guardar la sesión</button></div>'
         : '<div><button class="btn-b" id="e-crear">Montar la sesión por calles de este día</button></div>')+
      '<div class="msg" id="e-msg-ses"></div>'+
    '</div>';
  }

  /* ---------- 25b · las calles ---------- */
  function pintarTablero(){
    var s = EST.sesion;
    var cuerpo;

    if (!s) {
      /* Vacío con salida: el club acaba de empezar y habrá días sin sesión */
      cuerpo = APOLANA_UI.vacio('Ese día no hay sesión por calles',
        'En natación el grupo se reparte en calles por nivel y cada calle lleva su serie. Monta la sesión '+
        'de este día y reparte a tus nadadores; puedes dejarla en borrador hasta que la tengas.',
        '<button type="button" class="ap-btn" id="e-crear-vacio">Montar la sesión por calles</button>');
    } else {
      var sinCalle = EST.atletas.filter(function(a){ return calleDe(a.id) < 0; });
      var minHechos = null;
      EST.calles.forEach(function(c, i){
        var h = C.leerProgreso(s.id, i+1);
        if (minHechos === null || h < minHechos) minHechos = h;
      });
      var seqRef = secuenciaDe(0);
      var enCurso = seqRef[minHechos || 0];
      cuerpo =
        '<div class="rotulo"><span>bloque en curso</span><i></i><span class="dato">'+
          esc(enCurso ? ((minHechos+1)+' de '+seqRef.length+' · '+(enCurso.b.etiqueta||'Bloque')) : 'sesión terminada')+
        '</span></div>'+
        EST.calles.map(function(c, i){ return htmlTarjetaCalle(c, i); }).join('')+
        (sinCalle.length
          ? '<div class="franja-ambar"><p><b>'+sinCalle.length+(sinCalle.length===1?' nadador sin calle':' nadadores sin calle')+'.</b> '+
              'Si la sesión se publica así, no la verán.</p>'+

          : '')+
        '<div class="barra">'+
          '<a class="btn-b" href="../entrenador/#lista">Asistencia</a>'+
          '<button class="btn-a" id="e-siguiente"'+(minHechos >= seqRef.length ? ' disabled' : '')+'>Siguiente bloque</button>'+

    app.innerHTML = htmlCabSesion() + '<div class="wrap">' + htmlPanelCambiar() + cuerpo + '</div>';

  function htmlTarjetaCalle(c, i){
    var seq = secuenciaDe(i);
    var hechos = C.leerProgreso(EST.sesion.id, i+1);
    var curso = seq[hechos];
    var f = null;
    if (curso) (curso.b.filas||[]).forEach(function(x){ if (!f && C.cifra(x)) f = x; });
    var metros = C.metrosSecuencia(seq);
    var d = f ? C.descanso(f) : null;
    var gente = c.atletas.map(function(id){ return atletaPorId(id); }).filter(Boolean);
    var avat = gente.slice(0,3).map(function(a){
      return '<span class="avat">'+esc(C.iniciales(a.nombre, a.apellidos))+'</span>';
    }).join('') + (gente.length > 3 ? '<span class="avat">+'+(gente.length-3)+'</span>' : '');

    return '<button class="calle-t" data-abrir="'+i+'" '+
      'style="--nivel:'+C.colorNivel(i, EST.calles.length)+'">'+
      '<div class="lin1"><span class="nom">'+esc(c.etiqueta || ('Calle '+(i+1)))+(c.matiz?' · '+esc(c.matiz):'')+'</span>'+
        (metros ? '<span class="m">'+esc(C.volumen(metros))+'</span>' : '')+'</div>'+
      (f
        ? '<div class="lin2"><span class="cifra">'+esc(C.cifra(f))+'</span>'+
            (d ? '<span class="pt">·</span><span class="cifra" style="color:'+escAt(d.color)+'">'+esc(d.etiqueta+' '+d.valor.replace(/^(cada|fijo) /,''))+'</span>' : '')+
            '<span class="nad-n">'+gente.length+' nad.</span></div>'
        : '<div class="vacio-t">Sin trabajo escrito todavía. Tócala para montarla.</div>')+
      '<div class="lin3">'+avat+'<span class="chv" aria-hidden="true">&rsaquo;</span></div>'+
    '</button>';
  }

  /* ---------- 25b · una calle abierta ---------- */
  function pintarCalle(){
    var s = EST.sesion;
    var i = EST.calle - 1;
    var c = EST.calles[i];
    if (!c) { EST.vista = 'tablero'; pintar(); return; }
    var seq = secuenciaDe(i);
    var hechos = C.leerProgreso(s.id, EST.calle);
    var metros = C.metrosSecuencia(seq);
    var dur = C.duracion(seq);

    var cab = '<header class="cab"><div class="dentro">'+
      '<button class="volver" id="e-atras">‹ Las '+EST.calles.length+' calles</button>'+
      '<h1>'+esc(c.etiqueta || ('Calle '+EST.calle))+(c.matiz?' · '+esc(c.matiz):'')+'</h1>'+
      '<div class="saltos">'+EST.calles.map(function(_, k){
        return '<button data-salto="'+(k+1)+'"'+(k+1===EST.calle?' class="on"':'')+'>C'+(k+1)+'</button>';
      }).join('')+'</div>'+
      '</div></header>';

    var cuerpo;
    if (EST.ajustando) {
      cuerpo = htmlAjustar(c, i);
    } else {
      cuerpo =
        htmlCifras([
          { v: C.volumen(metros), l:'total de la calle' },
          { v: String(c.atletas.length), l: c.atletas.length===1?'nadador':'nadadores' }
        ].concat(dur ? [{ v: dur, l:'duración' }] : []))+
        htmlBloques(seq, hechos, {})+
        '<div class="franja-ambar"><p>Ajustar solo esta calle: metros, repeticiones, salida y quién nada en ella.</p>'+
          '<button class="btn-am" id="e-ajustar">Ajustar</button></div>'+
        '<div class="barra">'+
          '<button class="btn-b" id="e-atras2">Volver</button>'+
          '<button class="btn-a" id="e-hecho"'+(hechos >= seq.length ? ' disabled' : '')+'>Marcar bloque hecho</button>'+
        '</div>';
    }

    app.innerHTML = cab + '<div class="wrap">' + cuerpo + '</div>';
  }

  /* ---------- ajustar SOLO esta calle ---------- */
  function htmlAjustar(c, i){
    var gente = c.atletas.map(function(id){ return atletaPorId(id); }).filter(Boolean);
    var sinCalle = EST.atletas.filter(function(a){ return calleDe(a.id) < 0; });

    function selectorCalle(a, actual){
      var op = '<option value="-1"'+(actual<0?' selected':'')+'>Sin calle</option>';
      EST.calles.forEach(function(x, k){
        op += '<option value="'+k+'"'+(actual===k?' selected':'')+'>'+esc(x.etiqueta || ('Calle '+(k+1)))+'</option>';
      });
      return '<span class="nad">'+esc(nombreCorto(a))+
        '<select data-mover="'+escAt(a.id)+'" aria-label="Calle de '+escAt(nombreLargo(a))+'">'+op+'</select></span>';
    }

    return '<div class="panel">'+
      '<h2>Esta calle</h2>'+
      '<p class="pista">Lo que cambies aquí solo afecta a la calle '+EST.calle+'. La estructura de la sesión '+
        '—lo que hace todo el grupo— se queda como está.</p>'+
      '<div class="rej">'+
        '<div><label class="et" for="a-et">Cómo se llama</label>'+
          '<input type="text" id="a-et" value="'+escAt(c.etiqueta||'')+'" placeholder="Calle '+EST.calle+'"></div>'+
        '<div><label class="et" for="a-mt">Nivel de la calle</label>'+
          '<input type="text" id="a-mt" value="'+escAt(c.matiz||'')+'" placeholder="Rápidos, fondo, crol medio…"></div>'+
        '<div class="ancho"><label class="et" for="a-dp">Descanso antes de este bloque (opcional)</label>'+
          '<input type="text" id="a-dp" class="dato" value="'+escAt(c.descanso_previo||'')+'" placeholder="1 min"></div>'+
      '</div>'+
    '</div>'+

    '<div class="panel">'+
      '<h2>Quién nada aquí</h2>'+
      '<div class="gente">'+
        (gente.length ? gente.map(function(a){ return selectorCalle(a, i); }).join('')
                      : '<span class="vacia">Todavía no hay nadie en esta calle.</span>')+
      '</div>'+
      (sinCalle.length
        ? '<p class="pista">Sin calle · tócalos para mandarlos a una:</p>'+
          '<div class="gente">'+sinCalle.map(function(a){ return selectorCalle(a, -1); }).join('')+'</div>'
        : '')+
    '</div>'+

    '<div class="panel">'+
      '<h2>Qué hace esta calle</h2>'+
      c.filas.map(function(f, fi){ return htmlFilaEditable(f, fi); }).join('')+
      '<div><button class="btn-b" id="a-add">Añadir ejercicio</button></div>'+
      (EST.calles.length > 1
        ? '<div><label class="et" for="a-copiar">Copiar este trabajo a otra calle</label>'+
            '<select id="a-copiar"><option value="">Elige una calle…</option>'+
            EST.calles.map(function(x, k){ return k===i ? '' : '<option value="'+k+'">'+esc(x.etiqueta||('Calle '+(k+1)))+'</option>'; }).join('')+
            '</select></div>'
        : '')+
    '</div>'+

    '<div class="msg" id="a-msg"></div>'+
    '<div class="barra">'+
      '<button class="btn-b" id="a-cancelar">Dejarlo</button>'+
      '<button class="btn-a" id="a-guardar">Guardar la calle '+EST.calle+'</button>'+
    '</div>';
  }

  function htmlFilaEditable(f, fi){
    var mats = Array.isArray(f.material) ? f.material : (f.material ? [f.material] : []);
    var modo = C.modoDe(f);
    return '<div class="ejfila" data-f="'+fi+'">'+
      '<div class="ancho"><label class="et" for="f-ej'+fi+'">Ejercicio</label>'+
        '<input type="text" id="f-ej'+fi+'" data-f="'+fi+'" data-k="ejercicio" value="'+escAt(f.ejercicio||'')+'" placeholder="Crol a tope, pies con tabla…"></div>'+
      '<div class="corto"><label class="et" for="f-se'+fi+'">Repeticiones</label>'+
        '<input class="dato" type="text" id="f-se'+fi+'" data-f="'+fi+'" data-k="series" value="'+escAt(f.series||'')+'" placeholder="8"></div>'+
      '<div class="corto"><label class="et" for="f-di'+fi+'">Metros</label>'+
        '<input class="dato" type="text" id="f-di'+fi+'" data-f="'+fi+'" data-k="distancia" value="'+escAt(f.distancia||'')+'" placeholder="50 m"></div>'+
      '<div class="corto"><label class="et" for="f-ri'+fi+'">Ritmo</label>'+

      '<div class="corto"><label class="et" for="f-de'+fi+'">Tiempo</label>'+
        '<input class="dato" type="text" id="f-de'+fi+'" data-f="'+fi+'" data-k="descanso" value="'+escAt(f.descanso||'')+'" placeholder="1\'00&quot;"></div>'+
      '<button class="quitar" data-quitar="'+fi+'" title="Quitar este ejercicio" aria-label="Quitar este ejercicio">×</button>'+
      '<div class="modos">'+
        '<button type="button" class="salida'+(modo==='salida'?' on':'')+'" data-modo="salida" data-f="'+fi+'">'+
          '<span class="pnt" style="background:#2F6FA8"></span>salida cada</button>'+
        '<button type="button" class="fijo'+(modo==='fijo'?' on':'')+'" data-modo="fijo" data-f="'+fi+'">'+
          '<span class="pnt" style="background:#6B5B8A"></span>descanso fijo</button>'+
      '</div>'+
      '<p class="pista ancho" style="margin:-2px 0 0">'+
        (modo==='salida' ? 'Salen cada ese tiempo: nadar y descansar caben dentro.'
                         : 'Ese tiempo parados al tocar la pared, tarden lo que tarden.')+'</p>'+
      '<div class="ancho"><span class="et">Material</span><div class="chips-mat">'+
        MATERIAL.map(function(m){
          var on = mats.indexOf(m) > -1;
          return '<label class="'+(on?'on':'')+'"><input type="checkbox" data-f="'+fi+'" data-mat="'+escAt(m)+'"'+(on?' checked':'')+'>'+esc(m)+'</label>';
        }).join('')+
      '</div></div>'+
      '<div class="ancho"><label class="et" for="f-ob'+fi+'">Notas de esta serie</label>'+
        '<input type="text" id="f-ob'+fi+'" data-f="'+fi+'" data-k="observaciones" value="'+escAt(f.observaciones||'')+'" placeholder="Marta: 1:35 · Luis: 1:40"></div>'+
    '</div>';
  }

  /* ---------- todo lo que se toca, en un solo sitio ----------------------
     La pantalla se repinta entera en cada cambio, así que los manejadores no
     pueden colgar de los botones: van una sola vez en el contenedor y miran
     quién los ha llamado. Si no, cada repintado duplicaría los clics. */
  var ENGANCHADO = false;
  function engancharTodo(){
    if (ENGANCHADO) return;
    ENGANCHADO = true;

    function calleAbierta(){ return EST.calles[EST.calle - 1] || null; }

    app.addEventListener('input', function(ev){
      var t = ev.target, c = calleAbierta();
      if (!c || !t.getAttribute) return;
      if (t.id === 'a-et') { c.etiqueta = t.value; return; }
      if (t.id === 'a-mt') { c.matiz = t.value; return; }
      if (t.id === 'a-dp') { c.descanso_previo = t.value; return; }
      var k = t.getAttribute('data-k');
      if (!k) return;
      var fi = parseInt(t.getAttribute('data-f'), 10);
      if (isNaN(fi) || !c.filas[fi]) return;
      c.filas[fi][k] = t.value;
    });

    app.addEventListener('change', async function(ev){
      var t = ev.target;
      if (!t.getAttribute) return;

      /* --- material de una serie --- */
      if (t.hasAttribute('data-mat')) {
        var c1 = calleAbierta(); if (!c1) return;
        var fi = parseInt(t.getAttribute('data-f'), 10);
        var caja = t.closest('.chips-mat'), lista = [];
        Array.prototype.forEach.call(caja.querySelectorAll('input[data-mat]'), function(ch){
          ch.parentNode.classList.toggle('on', ch.checked);
          if (ch.checked) lista.push(ch.getAttribute('data-mat'));
        });
        if (c1.filas[fi]) c1.filas[fi].material = lista;
        return;
      }

      /* --- mover un nadador de calle: la calle es un nivel, no un grupo --- */
      if (t.hasAttribute('data-mover')) {
        var id = t.getAttribute('data-mover'), destino = parseInt(t.value, 10);
        EST.calles.forEach(function(x){
          var p = x.atletas.indexOf(id);
          if (p > -1) x.atletas.splice(p, 1);
        });
        if (destino >= 0 && EST.calles[destino]) EST.calles[destino].atletas.push(id);
        pintar();
        return;
      }

      /* --- copiar el trabajo de esta calle a otra --- */
      if (t.id === 'a-copiar') {
        var destino2 = parseInt(t.value, 10), origen = EST.calle - 1;
        t.value = '';
        if (isNaN(destino2) || !EST.calles[destino2] || !EST.calles[origen]) return;
        var hay = EST.calles[destino2].filas.some(function(f){ return f.ejercicio || f.series || f.distancia; });
        var nombreDestino = EST.calles[destino2].etiqueta || ('calle ' + (destino2 + 1));
        function copiar(){
          EST.calles[destino2].filas = JSON.parse(JSON.stringify(EST.calles[origen].filas));
          APX.toast('Copiado a ' + nombreDestino + '. Ahora cámbiale la salida.');
          pintar();
        }
        if (hay) {
          APX.confirm(nombreDestino + ' ya tiene trabajo escrito. ¿Lo reemplazo?',
            { aceptar:'Reemplazar', peligro:true }).then(function(ok){ if (ok) copiar(); });
          return;
        }
        copiar();
        return;
      }

      /* --- panel de la sesión --- */
      if (t.id === 'e-grupo') {
        EST.grupo = t.value; pintarCargando();
        if (await cargarGrupoYDia()) { EST.cambiando = true; pintar(); }
        return;
      }
      if (t.id === 'e-fecha') {
        EST.fecha = t.value || HOY; pintarCargando();
        if (await cargarGrupoYDia()) { EST.cambiando = true; pintar(); }
        return;
      }
      if (t.id === 'e-sesion') {
        var elegida = null;
        EST.sesionesDia.forEach(function(x){ if (x.id === t.value) elegida = x; });
        abrirSesion(elegida);
        EST.cambiando = true;
        pintar();
        return;
      }
      if (t.id === 'e-num') {
        var n = parseInt(t.value, 10) || 4;
        if (n < EST.calles.length) {
          var conCosas = EST.calles.slice(n).some(function(c){
            return c.atletas.length || c.filas.some(function(x){ return x.ejercicio; });
          });
          if (conCosas) {
            APX.confirm('Vas a quitar calles que tienen gente o trabajo escrito. Esos nadadores se quedan sin ' +
              'calle y lo que llevaban se pierde. ¿Sigo?', { aceptar:'Quitar calles', peligro:true }).then(function(ok){
              if (!ok) { t.value = EST.calles.length; return; }
              EST.calles = EST.calles.slice(0, n); EST.nCalles = n; EST.cambiando = true; pintar();
            });
            return;
          }
          EST.calles = EST.calles.slice(0, n);
        } else {
          for (var k = EST.calles.length; k < n; k++) EST.calles.push(calleVacia(k));
        }
        EST.nCalles = n; EST.cambiando = true; pintar();
        return;
      }
    });

    app.addEventListener('click', async function(ev){
      var t = ev.target && ev.target.closest
        ? ev.target.closest('button, a[href], [data-abrir], [data-salto]') : null;
      if (!t) return;
      var id = t.id || '';

      /* --- cabecera --- */
      if (id === 'e-cambiar') { EST.cambiando = !EST.cambiando; pintar(); return; }

      /* --- montar la sesión del día --- */
      if (id === 'e-crear' || id === 'e-crear-vacio') { crearSesion(); return; }

      /* --- las cuatro calles --- */
      if (t.hasAttribute('data-abrir')) {
        EST.calle = parseInt(t.getAttribute('data-abrir'), 10) + 1;
        EST.vista = 'calle'; EST.ajustando = false;
        window.scrollTo(0, 0); pintar();
        return;
      }
      if (id === 'e-siguiente') {
        var total = secuenciaDe(0).length;
        EST.calles.forEach(function(_, i){
          var h = C.leerProgreso(EST.sesion.id, i + 1);
          if (h < total) C.guardarProgreso(EST.sesion.id, i + 1, h + 1);
        });
        APX.toast('Las ' + EST.calles.length + ' calles pasan al siguiente bloque');
        pintar();
        return;
      }
      if (id === 'e-repartir') {
        var libres = EST.atletas.filter(function(a){ return calleDe(a.id) < 0; });
        libres.forEach(function(a, k){ EST.calles[k % EST.calles.length].atletas.push(a.id); });
        var r0 = await guardarSesion({});
        if (!r0.ok) APX.toast('Repartidos en pantalla, pero no se ha podido guardar. Vuelve a intentarlo.');
        pintar();
        return;
      }

      /* --- una calle abierta --- */
      if (id === 'e-atras' || id === 'e-atras2') {
        EST.vista = 'tablero'; EST.ajustando = false;
        window.scrollTo(0, 0); pintar();
        return;
      }
      if (t.hasAttribute('data-salto')) {
        EST.calle = parseInt(t.getAttribute('data-salto'), 10);
        window.scrollTo(0, 0); pintar();
        return;
      }
      if (id === 'e-hecho') {
        C.guardarProgreso(EST.sesion.id, EST.calle, C.leerProgreso(EST.sesion.id, EST.calle) + 1);
        APX.toast('Bloque marcado en la calle ' + EST.calle);
        pintar();
        return;
      }
      if (id === 'e-ajustar') { EST.ajustando = true; window.scrollTo(0, 0); pintar(); return; }

      /* --- ajustar solo esta calle --- */
      var c = calleAbierta();
      if (t.hasAttribute('data-modo')) {
        if (!c) return;
        var fm = parseInt(t.getAttribute('data-f'), 10);
        if (c.filas[fm]) c.filas[fm].descanso_modo = t.getAttribute('data-modo');
        pintar();
        return;
      }
      if (t.hasAttribute('data-quitar')) {
        if (!c) return;
        c.filas.splice(parseInt(t.getAttribute('data-quitar'), 10), 1);
        if (!c.filas.length) c.filas.push(filaVacia());
        pintar();
        return;
      }
      if (id === 'a-add') { if (c) { c.filas.push(filaVacia()); pintar(); } return; }
      if (id === 'a-cancelar') {
        APX.confirm('Se pierde lo que hayas cambiado en esta calle desde el último guardado. ¿Sigo?',
          { aceptar:'Dejarlo', peligro:true }).then(function(ok){
          if (!ok) return;
          var vuelta = EST.calle;
          abrirSesion(EST.sesion);
          EST.calle = vuelta; EST.vista = 'calle';
          pintar();
        });
        return;
      }
      if (id === 'a-guardar') {
        var msg = document.getElementById('a-msg');
        msg.className = 'msg'; msg.textContent = 'Guardando…';
        var r = await guardarSesion({});
        if (!r.ok) {
          msg.className = 'msg';
          msg.innerHTML = htmlError('No hemos podido guardar esta calle',
            'Puede ser tu conexión. No se ha perdido nada de lo que hay en pantalla: vuelve a darle a guardar.',
            function(){ var b = document.getElementById('a-guardar'); if (b) b.click(); });
          return;
        }
        EST.ajustando = false;
        APX.toast('Calle ' + EST.calle + ' guardada');
        pintar();
        return;
      }

      /* --- guardar la sesión desde el panel --- */
      if (id === 'e-guardar-ses') {
        var m = document.getElementById('e-msg-ses');
        m.className = 'msg'; m.textContent = 'Guardando…';
        var r2 = await guardarSesion({ desdePanel:true });
        if (!r2.ok) {
          m.className = 'msg';
          m.innerHTML = htmlError('No hemos podido guardar la sesión',
            'Puede ser tu conexión. Lo que hay en pantalla no se ha perdido: vuelve a darle a guardar.',
            function(){ var b = document.getElementById('e-guardar-ses'); if (b) b.click(); });
          return;
        }
        m.className = 'msg ok';
        m.textContent = EST.sesion.publicada
          ? 'Guardada y publicada. La ven los nadadores con calle.'
          : 'Guardada como borrador: todavía no la ve nadie.';
        return;
      }
    });
  }

  /* ---------- crear la sesión por calles del día ---------- */
  async function crearSesion(){
    EST.sesion = { id:null, fecha:EST.fecha, titulo:'', nota_razonamiento:'', publicada:false, bloques:[], calles:4, hora:null, lugar:null };
    EST.comunes = [];
    EST.nCalles = 4;
    EST.calles = [];
    for (var i=0;i<4;i++) EST.calles.push(calleVacia(i));
    EST.cambiando = true;
    EST.vista = 'tablero';
    pintar();
  }

  /* ---------- guardar ---------- */
  function bloquesParaGuardar(){
    var out = EST.comunes.slice();
    EST.calles.forEach(function(c, i){
      var filas = c.filas.map(function(f){
        var o = {};
        for (var k in f) if (Object.prototype.hasOwnProperty.call(f,k)) {
          var v = f[k];
          if (v === '' || v === null || v === undefined) continue;
          if (Array.isArray(v) && !v.length) continue;
          o[k] = v;
        }
        /* El modo solo se guarda si hay descanso: nunca un campo vacío */
        if (!o.descanso) delete o.descanso_modo;
        return o;
      }).filter(function(o){
        var ks = Object.keys(o);
        return ks.length > 0 && !(ks.length === 1 && ks[0] === 'descanso_modo');
      });
      if (!filas.length && !c.atletas.length) return;
      var b = { etiqueta: (c.etiqueta||'').trim() || ('Calle '+(i+1)), calle: i+1, atletas: c.atletas.slice(), filas: filas };
      if ((c.matiz||'').trim()) b.matiz = c.matiz.trim();
      if ((c.descanso_previo||'').trim()) b.descanso_previo = c.descanso_previo.trim();
      out.push(b);
    });
    return out;
  }

  async function guardarSesion(op){
    op = op || {};
    var s = EST.sesion;
    if (!s) return { ok:false };

    if (op.desdePanel) {
      var t = document.getElementById('e-titulo'), n = document.getElementById('e-nota'), p = document.getElementById('e-publicar');
      if (t) s.titulo = t.value.trim() || null;
      if (n) s.nota_razonamiento = n.value.trim() || null;
      if (p) s.publicada = p.checked;
    }

    var asignados = [];
    EST.calles.forEach(function(c){ c.atletas.forEach(function(id){ if (asignados.indexOf(id) < 0) asignados.push(id); }); });

    var payload = {
      grupo_id: EST.grupo,
      fecha: EST.fecha,
      dia_semana: diaSemana(EST.fecha),
      tipo: 'natacion',
      titulo: s.titulo || null,
      nota_razonamiento: s.nota_razonamiento || null,
      bloques: bloquesParaGuardar(),
      calles: EST.calles.length,
      publicada: !!s.publicada,
      atletas_ids: asignados.length ? asignados : null
    };

    var res = await mandar(payload, s.id);
    /* Si la base aún no admite el tipo «natación», se guarda como continua
       para no perder el trabajo del entrenador. */
    if (res.error && /sesiones_tipo_check/.test(res.error.message||'')) {
      payload.tipo = 'continuo';
      res = await mandar(payload, s.id);
    }
    if (res.error && /calles/.test(res.error.message||'') && /column/i.test(res.error.message||'')) {
      delete payload.calles;
      res = await mandar(payload, s.id);
    }
    if (res.error) return { ok:false, error:res.error };

    if (res.data && res.data.id) s.id = res.data.id;
    s.bloques = payload.bloques;
    s.calles = EST.calles.length;
    /* Se refresca la lista del día para que la sesión recién creada aparezca */
    var enLista = EST.sesionesDia.some(function(x){ return x.id === s.id; });
    if (!enLista) EST.sesionesDia.push({ id:s.id, titulo:s.titulo, tipo:payload.tipo, bloques:payload.bloques, calles:payload.calles });
    return { ok:true };
  }

  async function mandar(payload, id){
    if (id) return await sb.from('sesiones').update(payload).eq('id', id).select('id').maybeSingle();
    var p = {}; for (var k in payload) p[k] = payload[k];
    p.creado_por = perfil ? perfil.id : null;
    return await sb.from('sesiones').insert(p).select('id').maybeSingle();
  }

  /* ---------- y ahora sí, a pintar ---------- */
  await arrancar();
});
</script>
