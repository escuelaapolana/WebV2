<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de ropa · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<link rel="stylesheet" href="../../assets/css/panel-piezas.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/panel-piezas.js" defer></script>
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 1px 2px rgba(30,45,65,.07),0 14px 30px -13px rgba(30,45,65,.30); }
  body { background:var(--crema,#FBF9F4); }
  .pd-wrap { max-width:760px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,28px) 60px; }
  .volver { display:inline-flex; align-items:center; min-height:44px; margin-bottom:2px;
            color:var(--azul-oscuro,#2F6FA8); font-weight:600; text-decoration:none; font-size:14px; }

  .cab { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(26px,5.5vw,36px); line-height:1; color:var(--navy,#26374B); margin:6px 0 2px; }
  .cab .dl { margin-left:auto; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
             background:#E4F0EC; color:#2E7D6B; border:1px solid #BFD8D0; border-radius:999px; padding:9px 15px; }
  .cab .dl[hidden]{ display:none; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0; }

  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .kpi { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:15px; padding:14px;
         box-shadow:var(--s1); text-align:center; }
  .kpi .n { font-family:var(--dato); font-weight:700; font-size:24px; color:var(--navy,#26374B); line-height:1; }
  .kpi .n.w{ color:#8A5307; }
  .kpi .et { display:block; margin-top:5px; font-size:11.5px; color:var(--texto-suave,#6E6656); }

  /* Filtros por estado */
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 12px; }
  .chip { font:inherit; font-size:13.5px; cursor:pointer; background:#fff; color:var(--texto-suave,#6E6656);
          border:1px solid var(--linea-marcada,#E4DCCB); border-radius:999px; padding:7px 13px; }
  .chip.on { background:var(--navy,#26374B); color:#fff; border-color:var(--navy,#26374B); }
  .chip .c { opacity:.7; font-variant-numeric:tabular-nums; }

  /* Un pedido = una tarjeta */
  .ped { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1);
         padding:14px 16px; margin-top:12px; }
  .ped.sinpagar { opacity:.72; }
  .ped-top { display:flex; align-items:flex-start; gap:12px; }
  .ped .av { width:38px; height:38px; flex:0 0 auto; border-radius:50%;
             background:linear-gradient(135deg,#3B85C0,#2E4256); color:#fff; display:grid; place-items:center;
             font-size:13px; font-weight:700; }
  .ped .quien { flex:1; min-width:0; }
  .ped .quien b { font-size:15.5px; font-weight:600; color:var(--navy,#26374B); }
  .ped .quien .tag { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.02em;
                     background:#EDE6F5; color:#5B4B8A; border-radius:6px; padding:2px 6px; margin-left:7px; vertical-align:2px; }
  .ped .quien small { display:block; font-size:12.5px; color:var(--texto-suave,#6E6656); margin-top:2px; line-height:1.5; }
  .ped .quien small a { color:var(--azul-oscuro,#2F6FA8); text-decoration:none; }
  .ped .pago { flex:0 0 auto; font-size:11px; font-weight:700; text-transform:uppercase; border-radius:7px; padding:4px 9px; }
  .ped .pago.si { background:#EAF3E3; color:#4E8A3E; } .ped .pago.no { background:#F4EAD6; color:#8A5307; }

  .ped .arts { list-style:none; margin:11px 0 0; padding:11px 0 0; border-top:1px solid var(--linea,#EDE6D7); }
  .ped .arts li { display:flex; justify-content:space-between; gap:10px; font-size:14px; color:var(--navy,#26374B);
                  padding:3px 0; }
  .ped .arts li .t { color:var(--texto-suave,#6E6656); }
  .ped .tot { display:flex; justify-content:space-between; gap:10px; margin-top:9px; padding-top:9px;
              border-top:1px solid var(--linea,#EDE6D7); font-size:14px; }
  .ped .tot b { font-family:var(--dato); color:var(--navy,#26374B); font-size:16px; }

  .ped-pie { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .est { font-size:11.5px; font-weight:700; text-transform:uppercase; border-radius:7px; padding:5px 10px; }
  .est.pendiente { background:#F4EAD6; color:#8A5307; } .est.preparando { background:#E4EDF6; color:#2F6FA8; }
  .est.listo { background:#E7F0FF; color:#2A5DB0; } .est.entregado { background:#EAF3E3; color:#4E8A3E; }
  .est.cancelado { background:#F3E4E4; color:#9A3B3B; }
  .ped-pie label { font-size:12.5px; color:var(--texto-suave,#6E6656); margin-left:auto; }
  .ped-pie select { font:inherit; font-size:14px; color:var(--navy,#26374B); background:#fff;
                    border:1px solid var(--linea-borde,#D8CFBC); border-radius:9px; padding:7px 10px; min-height:40px; }

  /* Resumen por talla */
  .resumen { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1);
             padding:16px 18px; margin-top:14px; }
  .resumen[hidden]{ display:none; }
  .resumen h2 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:16px;
                color:var(--navy,#26374B); margin:0 0 4px; }
  .resumen p.pista { font-size:13px; color:var(--texto-suave,#6E6656); margin:0 0 12px; }
  .resumen table { width:100%; border-collapse:collapse; font-size:14px; }
  .resumen th, .resumen td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--linea,#EDE6D7); }
  .resumen th { font-size:11.5px; text-transform:uppercase; color:var(--texto-suave,#6E6656); font-weight:700; }
  .resumen td.n, .resumen th.n { text-align:right; font-family:var(--dato); }
  .rotulo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:14px;
            color:var(--navy,#26374B); margin:22px 0 0; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="pd-wrap">
    <a class="volver" href="../">← Volver al portal</a>
    <div class="cab">
      <h1 class="saludo">Pedidos de ropa</h1>
      <button type="button" class="dl" id="pd-resumen-btn" hidden>↓ Resumen por talla</button>
    </div>
    <p class="sub">La equipación del club</p>

    <div id="pd-kpis"></div>
    <div class="resumen" id="pd-resumen" hidden></div>
    <div id="pd-chips" class="chips" hidden></div>
    <div id="pd-lista">
      <div class="ap-esq" data-esq="filas:4"></div>
    </div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  };

  var FILAS = [];
  var filtro = 'activos';   // por defecto: lo que hay que atender (pagado y sin entregar)
  var fallo = '';
  var resumenAbierto = false;

  var ESTADOS = ['pendiente','preparando','listo','entregado','cancelado'];
  var NOMBRE_ESTADO = {
    pendiente:'Pendiente', preparando:'Preparando', listo:'Listo',
    entregado:'Entregado', cancelado:'Cancelado'
  };

  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fechaCorta(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function eur(n) { return (Math.round(Number(n) * 100) / 100).toLocaleString('es-ES', { minimumFractionDigits:0, maximumFractionDigits:2 }) + ' €'; }
  function iniciales(nom) {
    var p = String(nom || '?').trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  function pagado(f) { return !!f.pagado_en; }

  // ============================================================
  //  TRAER
  // ============================================================
  async function cargar() {
    fallo = '';
    var r = await sb.rpc('pedidos_admin_listar', {});
    if (r.error) { fallo = r.error.message; FILAS = []; return; }
    FILAS = r.data || [];
  }

  function nombreDe(f) {
    return f.socio_nombre || (f.contacto && f.contacto.nombre) || 'Sin nombre';
  }

  function visibles() {
    return FILAS.filter(function (f) {
      if (filtro === 'todos') return true;
      if (filtro === 'activos') return pagado(f) && f.estado !== 'entregado' && f.estado !== 'cancelado';
      if (filtro === 'sinpagar') return !pagado(f);
      return f.estado === filtro;
    });
  }

  // ============================================================
  //  PINTAR
  // ============================================================
  function pintarKpis() {
    var pagados = FILAS.filter(pagado);
    var porPreparar = pagados.filter(function (f) { return f.estado !== 'entregado' && f.estado !== 'cancelado'; }).length;
    var recaudado = pagados.reduce(function (s, f) { return s + Number(f.total || 0); }, 0);
    $('pd-kpis').innerHTML =
      '<div class="kpis">' +
        '<div class="kpi"><div class="n">' + pagados.length + '</div><span class="et">Pedidos pagados</span></div>' +
        '<div class="kpi"><div class="n' + (porPreparar ? ' w' : '') + '">' + porPreparar + '</div><span class="et">Por preparar</span></div>' +
        '<div class="kpi"><div class="n">' + esc(eur(recaudado)) + '</div><span class="et">Recaudado</span></div>' +
      '</div>';
  }

  function pintarChips() {
    var cuenta = function (fn) { return FILAS.filter(fn).length; };
    var chips = [
      { v:'activos',  t:'Por atender', c: cuenta(function (f) { return pagado(f) && f.estado !== 'entregado' && f.estado !== 'cancelado'; }) },
      { v:'preparando', t:'Preparando', c: cuenta(function (f) { return f.estado === 'preparando'; }) },
      { v:'listo',      t:'Listos',     c: cuenta(function (f) { return f.estado === 'listo'; }) },
      { v:'entregado',  t:'Entregados', c: cuenta(function (f) { return f.estado === 'entregado'; }) },
      { v:'sinpagar',   t:'Sin pagar',  c: cuenta(function (f) { return !pagado(f); }) },
      { v:'todos',      t:'Todos',      c: FILAS.length }
    ].filter(function (c) { return c.c > 0 || c.v === filtro || c.v === 'todos' || c.v === 'activos'; });

    $('pd-chips').hidden = false;
    $('pd-chips').innerHTML = chips.map(function (c) {
      return '<button type="button" class="chip' + (filtro === c.v ? ' on' : '') + '" data-filtro="' + c.v + '">' +
        esc(c.t) + ' <span class="c">' + c.c + '</span></button>';
    }).join('');
  }

  function tarjeta(f) {
    var nom = nombreDe(f);
    var ct = f.contacto || {};
    var lineasCont = [];
    if (ct.email) lineasCont.push('<a href="mailto:' + esc(ct.email) + '">' + esc(ct.email) + '</a>');
    if (ct.telefono) lineasCont.push('<a href="tel:' + esc(ct.telefono) + '">' + esc(ct.telefono) + '</a>');
    if (ct.recogida) lineasCont.push('Recogida: ' + esc(ct.recogida));
    var meta = fechaCorta(f.pagado_en || f.created_at) + (f.referencia ? ' · ' + esc(f.referencia) : '');

    var arts = (f.items || []).map(function (it) {
      return '<li><span>' + esc(it.producto) + (it.talla ? ' · talla ' + esc(it.talla) : '') +
        (it.cantidad > 1 ? ' ×' + it.cantidad : '') + '</span>' +
        '<span class="t">' + esc(eur(it.precio_unitario * it.cantidad)) + '</span></li>';
    }).join('');

    var opciones = ESTADOS.map(function (e) {
      return '<option value="' + e + '"' + (f.estado === e ? ' selected' : '') + '>' + NOMBRE_ESTADO[e] + '</option>';
    }).join('');

    return '<article class="ped ' + (pagado(f) ? '' : 'sinpagar') + '">' +
      '<div class="ped-top">' +
        '<span class="av">' + esc(iniciales(nom)) + '</span>' +
        '<span class="quien"><b>' + esc(nom) + '</b>' + (f.es_socio ? '<span class="tag">Socio</span>' : '') +
          '<small>' + meta + (lineasCont.length ? '<br>' + lineasCont.join(' · ') : '') +
          (ct.nota ? '<br>«' + esc(ct.nota) + '»' : '') + '</small></span>' +
        '<span class="pago ' + (pagado(f) ? 'si' : 'no') + '">' + (pagado(f) ? 'Pagado' : 'Sin pagar') + '</span>' +
      '</div>' +
      '<ul class="arts">' + arts + '</ul>' +
      '<div class="tot"><span class="t">Total</span><b>' + esc(eur(f.total)) + '</b></div>' +
      '<div class="ped-pie">' +
        '<span class="est ' + esc(f.estado) + '">' + esc(NOMBRE_ESTADO[f.estado] || f.estado) + '</span>' +
        '<label for="e-' + esc(f.id) + '">Cambiar estado</label>' +
        '<select id="e-' + esc(f.id) + '" data-id="' + esc(f.id) + '">' + opciones + '</select>' +
      '</div>' +
    '</article>';
  }

  function pintarResumen() {
    // Lo que hay que pedir/preparar: pagados y aún no entregados, por producto+talla.
    var faltan = FILAS.filter(function (f) { return pagado(f) && f.estado !== 'entregado' && f.estado !== 'cancelado'; });
    var mapa = {};
    faltan.forEach(function (f) {
      (f.items || []).forEach(function (it) {
        var k = it.producto + '|' + (it.talla || '—');
        mapa[k] = (mapa[k] || 0) + (it.cantidad || 0);
      });
    });
    var claves = Object.keys(mapa).sort();
    var caja = $('pd-resumen');
    if (!claves.length) {
      caja.innerHTML = '<h2>Resumen por talla</h2><p class="pista">No hay nada pendiente de preparar ahora mismo.</p>';
    } else {
      var filas = claves.map(function (k) {
        var p = k.split('|');
        return '<tr><td>' + esc(p[0]) + '</td><td>' + esc(p[1]) + '</td><td class="n">' + mapa[k] + '</td></tr>';
      }).join('');
      caja.innerHTML = '<h2>Resumen por talla</h2>' +
        '<p class="pista">Unidades pendientes de preparar (pedidos pagados sin entregar). Es lo que hay que tener listo.</p>' +
        '<table><thead><tr><th>Prenda</th><th>Talla</th><th class="n">Uds.</th></tr></thead><tbody>' + filas + '</tbody></table>';
    }
    caja.hidden = !resumenAbierto;
  }

  function pintar() {
    pintarKpis();
    pintarChips();
    pintarResumen();
    $('pd-resumen-btn').hidden = !FILAS.length;

    var caja = $('pd-lista');
    if (fallo) {
      var esPermiso = /administrador|club puede|permiso|42501/i.test(fallo);
      caja.innerHTML = APOLANA_UI.error(
        esPermiso ? 'Esta pantalla es del club' : 'No hemos podido traer los pedidos',
        esPermiso ? 'Los pedidos de la tienda solo los ve quien lleva la administración.'
                  : 'Puede ser la conexión. Ningún pedido se ha perdido: siguen guardados.',
        esPermiso ? APOLANA_UI.boton('Volver al portal', '../') : APOLANA_UI.boton('Volver a intentarlo'));
      if (!esPermiso) { var b = caja.querySelector('.ap-btn'); if (b) b.addEventListener('click', refrescar); }
      return;
    }
    if (!FILAS.length) {
      caja.innerHTML = APOLANA_UI.vacio('Todavía no hay pedidos',
        'Cuando alguien compre equipación en la tienda, su pedido aparecerá aquí para prepararlo y entregarlo.',
        APOLANA_UI.boton('Ver la tienda', '../../tienda/'));
      return;
    }
    var lista = visibles();
    if (!lista.length) {
      caja.innerHTML = APOLANA_UI.vacio('Nada con este filtro',
        'Prueba con otro estado o mira todos los pedidos.',
        APOLANA_UI.boton('Ver todos'));
      var v = caja.querySelector('.ap-btn'); if (v) v.addEventListener('click', function () { filtro = 'todos'; pintar(); });
      return;
    }
    caja.innerHTML = '<p class="rotulo">' + (lista.length === 1 ? '1 pedido' : lista.length + ' pedidos') + '</p>' +
      lista.map(tarjeta).join('');
  }

  async function refrescar() {
    $('pd-lista').innerHTML = APOLANA_UI.cargando('filas', 4);
    await cargar();
    pintar();
  }

  // ============================================================
  //  CAMBIAR ESTADO
  // ============================================================
  async function cambiarEstado(id, estado, select) {
    var previo = select.getAttribute('data-previo') || '';
    select.disabled = true;
    var r = await sb.rpc('pedido_admin_estado', { p_id: id, p_estado: estado });
    select.disabled = false;
    if (r.error || (r.data && r.data.ok === false)) {
      APX.toast((r.error && r.error.message) || 'No se ha podido cambiar.', 'error');
      if (previo) select.value = previo;
      return;
    }
    // Actualiza en memoria y repinta (para KPIs, resumen y orden).
    FILAS.forEach(function (f) { if (f.id === id) f.estado = estado; });
    pintar();
    APX.toast('Pedido: ' + (NOMBRE_ESTADO[estado] || estado).toLowerCase());
  }

  // Guardar el valor previo al enfocar, para poder revertir si falla.
  $('portal-contenido').addEventListener('focusin', function (ev) {
    if (ev.target && ev.target.tagName === 'SELECT' && ev.target.dataset.id) {
      ev.target.setAttribute('data-previo', ev.target.value);
    }
  });
  $('portal-contenido').addEventListener('change', function (ev) {
    var s = ev.target;
    if (s && s.tagName === 'SELECT' && s.dataset.id) cambiarEstado(s.dataset.id, s.value, s);
  });
  $('portal-contenido').addEventListener('click', function (ev) {
    var c = ev.target.closest ? ev.target.closest('.chip[data-filtro]') : null;
    if (c) { filtro = c.getAttribute('data-filtro'); pintar(); }
  });
  $('pd-resumen-btn').addEventListener('click', function () {
    resumenAbierto = !resumenAbierto;
    this.textContent = (resumenAbierto ? '↑ Ocultar resumen' : '↓ Resumen por talla');
    $('pd-resumen').hidden = !resumenAbierto;
  });

  // ============================================================
  //  ARRANQUE
  // ============================================================
  await cargar();
  pintar();
});
</script>

</body>
</html>
