    function avisarLunes(){
      var v = $('sw-lunes').value, el = $('sw-lunes-aviso');
      if(!v){ el.textContent = ''; return; }
      var d = new Date(v+'T00:00:00');
      el.textContent = (d.getDay() === 1) ? '' : 'Ojo: ese día no es lunes. Los días se colocarán contando desde esa fecha como si fuera el lunes.';
    }
    $('sw-lunes').addEventListener('change', avisarLunes);
    avisarLunes();

    // --- ¿para quién es esta semana? ---
    pintarListaDest('sw', $('sw-grupo').value, []);
    refrescarDestSw = conectarDest('sw', false, function(){
      var el = $('sw-prev-dest'); if(el) el.textContent = textoDest('sw', false);
    });

    // --- ¿están abiertos estos entrenos? ---
    // Lo que se pone aquí baja a TODOS los días de la previsualización.
    pintarSecciones('sw', []);
    // Se recuerda el sitio que hemos puesto nosotros, para no pisar el que
    // escriba el entrenador a mano si luego cambia de grupo.
    var lugarPuestoSolo = lugarDeGrupo($('sw-grupo').value);
    aplicarAbrir('sw', { lugar: lugarPuestoSolo });
    refrescarAbrirSw = conectarAbrir('sw', function(){
      volcarAbrirEnLosDias();
      pintarPrevisualizacion();
    }, function(){ return $('sw-publicar') ? $('sw-publicar').checked : true; });
    $('sw-publicar').addEventListener('change', function(){ refrescarAbrirSw(true); });

    // --- 1 · pegar texto ---
    $('sw-interpretar').addEventListener('click', async function(){
      var lunes = $('sw-lunes').value;
      if(!lunes){ swMsg('Pon la fecha de inicio de la semana.', 'error'); return; }
      var txt = $('sw-texto').value;
      if(!txt.trim()){ swMsg('Pega antes el texto de la semana.', 'error'); return; }
      await ponerSemana(interpretarTexto(txt, lunes, nombreGrupo($('sw-grupo').value)), $('sw-grupo').value);
      $('sw-prev-card').scrollIntoView({ behavior:'smooth', block:'start' });
    });
    $('sw-ejemplo').addEventListener('click', function(){ $('sw-texto').value = EJEMPLO_SEMANA; });
    $('sw-limpiar-texto').addEventListener('click', function(){ $('sw-texto').value = ''; });
    $('sw-copiar').addEventListener('click', function(){ copiarAlPortapapeles(GUIA_FORMATO); });

    // --- 2 · CSV ---
    $('sw-descargar-plantilla').addEventListener('click', descargarPlantillaCSV);
    $('sw-interpretar-csv').addEventListener('click', function(){
      var f = $('sw-archivo').files && $('sw-archivo').files[0];
      if(!f){ swMsg('Elige antes un archivo: tu planificación en .txt o la plantilla en .csv', 'error'); return; }
      var lunes = $('sw-lunes').value;
      if(!lunes){ swMsg('Pon la fecha de inicio de la semana.', 'error'); return; }
      var lector = new FileReader();
      lector.onload = async function(){
        var contenido = String(lector.result||'');
        /* Vale un CSV de la plantilla Y vale el documento de siempre bajado de
           Drive como texto. Se decide por el contenido y no por la extensión,
           que miente en cuanto alguien renombra un archivo: si la primera línea
           tiene cabeceras conocidas es una hoja de cálculo; si no, es la
           planificación escrita a mano y la lee el intérprete de texto, que ya
           sabe traducir el formato del club. */
        await ponerSemana(pareceCSV(contenido)
          ? interpretarCSV(contenido, lunes)
          : interpretarTexto(contenido, lunes, nombreGrupo($('sw-grupo').value)), $('sw-grupo').value);
        $('sw-prev-card').scrollIntoView({ behavior:'smooth', block:'start' });
      };
      lector.onerror = function(){ swMsg('No he podido leer el archivo.', 'error'); };
      lector.readAsText(f, 'UTF-8');
    });

    // --- 3 · duplicar ---
    $('sw-dup-grupo').addEventListener('change', cargarSemanasOrigen);
    $('sw-duplicar').addEventListener('click', async function(){
      var L = $('sw-dup-semana').value;
      if(!L){ swMsg('Elige qué semana quieres copiar.', 'error'); return; }
      var destino = $('sw-lunes').value;
      if(!destino){ swMsg('Pon la fecha de inicio de la semana destino.', 'error'); return; }
      var arr = SEMANAS_ORIGEN[L] || [];
      var gDest = $('sw-grupo').value, avisos = [];

      // Se conserva a quién iba dirigida la semana de origen; el entrenador puede cambiarlo arriba.
      var d = destComunDeSesiones(arr);
      if(d.mixto){
        avisos.push('Los entrenamientos de la semana de origen no iban todos a los mismos atletas. Elige arriba, en «¿Para quién es esta semana?», a quién va la copia.');
      } else if(d.ids){
        var enDestino = atletasDeGrupo(gDest).map(function(x){ return x.id; });
        var validos = d.ids.filter(function(id){ return enDestino.indexOf(id) > -1; });
        if(validos.length){
          aplicarDest('sw', gDest, validos);
          if(validos.length < d.ids.length) avisos.push('Algunos atletas a los que iba la semana de origen no están en el grupo destino: la copia queda dirigida a los '+validos.length+' que sí están.');
        } else {
          aplicarDest('sw', gDest, null);
          avisos.push('La semana de origen iba dirigida a atletas concretos que no están en el grupo destino: la copia queda para todo el grupo. Cámbialo arriba si hace falta.');
        }
      } else {
        aplicarDest('sw', gDest, null);
      }
      refrescarDestSw();

      // Se conserva también si esos entrenos estaban abiertos, con cuántas
      // plazas y para qué secciones.
      var ab = abrirComunDeSesiones(arr);
      aplicarAbrir('sw', {
        abierta_inscripcion: ab.hay,
        plazas: ab.plazas,
        abierta_a: ab.abierta_a,
        hora: $('sw-hora').value,        // la hora y el sitio van día a día
        lugar: $('sw-lugar').value
      });
      refrescarAbrirSw(true);
      if(ab.mixto) avisos.push('Los entrenamientos abiertos de la semana de origen no tenían todos las mismas plazas ni las mismas secciones. He puesto arriba los del primero: revísalo antes de crear.');

      await ponerSemana({ sesiones: sesionesDesdeOrigen(arr, L, destino), avisos: avisos }, gDest);
      $('sw-prev-card').scrollIntoView({ behavior:'smooth', block:'start' });
    });

    // --- 4 · plantillas ---
    $('sw-pl-aplicar').addEventListener('click', async function(){
      var id = $('sw-pl-lista').value;
      if(!id){ swMsg('Elige una plantilla.', 'error'); return; }
      var destino = $('sw-lunes').value;
      if(!destino){ swMsg('Pon la fecha de inicio de la semana.', 'error'); return; }
      var p = PLANTILLAS[id];
      await ponerSemana({ sesiones: sesionesDesdePlantilla(p.datos, destino), avisos: [] }, $('sw-grupo').value);
      $('sw-prev-card').scrollIntoView({ behavior:'smooth', block:'start' });
    });
    $('sw-pl-borrar').addEventListener('click', async function(){
      var id = $('sw-pl-lista').value, m = $('sw-pl-msg'); m.className = 'msg';
      if(!id){ m.textContent = 'Elige una plantilla.'; m.className = 'msg error'; return; }
      if(!await APX.confirm('¿Borrar esta plantilla? No se puede deshacer.', { aceptar:'Borrar', peligro:true })) return;
      var r = await sb.from('plantillas_semana').delete().eq('id', id);
      if(r.error){ m.textContent = 'Error: '+r.error.message; m.className = 'msg error'; return; }
      m.textContent = 'Plantilla borrada ✓'; m.className = 'msg ok';
      await cargarPlantillas();
    });
    $('sw-pl-guardar').addEventListener('click', async function(){
      var nombre = $('sw-pl-nombre').value.trim();
      if(!SEMANA || !SEMANA.sesiones.length){ swMsg('No hay nada previsualizado que guardar.', 'error'); return; }
      if(!nombre){ swMsg('Ponle un nombre a la plantilla.', 'error'); return; }
      var datos = { sesiones: SEMANA.sesiones.filter(function(s){ return s.incluir !== false; }).map(function(s){
        return { offset_dia: difDias(s.fecha, lunesDe(s.fecha)), dia_semana: s.dia_semana,
                 tipo: s.tipo||'', rol: s.rol||'', titulo: s.titulo||'',
                 nota_razonamiento: s.nota_razonamiento||'', bloques: s.bloques||[],
                 abierta: !!s.abierta, hora: s.hora||'', lugar: s.lugar||'' };
      }) };
      var r = await sb.from('plantillas_semana').insert({ nombre: nombre, creado_por: perfil.id, datos: datos }).select('id').maybeSingle();
      if(r.error){ swMsg('Error al guardar la plantilla: '+r.error.message, 'error'); return; }
      $('sw-pl-nombre').value = '';
      swMsg('Plantilla «'+nombre+'» guardada ✓', 'ok');
      await cargarPlantillas();
    });

    // --- previsualización ---
    $('sw-crear').addEventListener('click', crearSemana);
    $('sw-descartar').addEventListener('click', function(){ SEMANA = null; $('sw-prev-card').hidden = true; });
    $('sw-grupo').addEventListener('change', async function(){
      // otro grupo = otros atletas: la lista de destinatarios se repinta desde cero
      aplicarDest('sw', $('sw-grupo').value, null);
      refrescarDestSw();
      // el sitio, solo si no lo ha escrito él a mano
      if(($('sw-lugar').value||'').trim() === (lugarPuestoSolo||'')){
        $('sw-lugar').value = lugarDeGrupo($('sw-grupo').value);
        refrescarAbrirSw();
      }
      lugarPuestoSolo = lugarDeGrupo($('sw-grupo').value);
      if(SEMANA){ SEMANA.grupo_id = $('sw-grupo').value; await comprobarChoques(); }
    });

    cargarSemanasOrigen();
    cargarPlantillas();

    /* ------------------------------------------------------------
       TODO LO QUE SE PULSA EN LA REJILLA DE LA SEMANA
       ------------------------------------------------------------
       Un solo oyente para la sección entera: la rejilla se repinta
       cada vez que se cambia de semana o de grupo, y si los oyentes
       fueran de cada botón habría que volver a colgarlos siempre y
       se acabarían duplicando los clics.
       ------------------------------------------------------------ */
    function abrirTanda(scroll){
      var caja = $('sw-tanda');
      if(!caja) return null;
      caja.hidden = false;
      // el grupo y la semana de la rejilla son los que se usan abajo
      if($('sw-grupo') && SV_GRUPO) $('sw-grupo').value = SV_GRUPO;
      if(scroll) document.getElementById(scroll).scrollIntoView({ behavior:'smooth', block:'start' });
      return caja;
    }

    PZ.alPulsar(cont, async function(accion, id){
      if(accion === 'sem-atras'){ SV_LUNES = addDias(SV_LUNES, -7); cargarSemanaVista(); return; }
      if(accion === 'sem-alante'){ SV_LUNES = addDias(SV_LUNES, 7); cargarSemanaVista(); return; }
      if(accion === 'sem-hoy'){ SV_LUNES = lunesDe(todayISO); cargarSemanaVista(); return; }
      if(accion === 'nuevo'){ planificarDia(SV_LUNES, SV_GRUPO); return; }
      if(accion === 'planificar-dia'){ planificarDia(id, SV_GRUPO); return; }
      if(accion === 'abrir'){ abrirEnPlanificador(id, SV_GRUPO, false); return; }
      if(accion === 'duplicar-dia'){ abrirEnPlanificador(id, SV_GRUPO, true); return; }
      if(accion === 'ver-detalle'){ verDetalleSesion(id); return; }
      if(accion === 'mas-formas'){ abrirTanda('sw-tanda'); return; }
      /* La plantilla se baja de golpe, sin desplegar nada: el que la pide ya
         sabe lo que quiere y hacerle abrir un panel para llegar al botón era
         justo lo que la escondía. */
      if(accion === 'plantilla-csv'){ descargarPlantillaCSV(); return; }
      /* La plantilla de la IA es un archivo que ya existe en la web: se abre en
         otra pestaña con `download` puesto, así que el navegador la guarda en
         vez de enseñarla. Se puede leer antes si se quiere, que para eso es
         texto y no un binario. */
      if(accion === 'plantilla-ia'){
        var p = plantillaIA(SV_GRUPO);
        if(!p) return;
        var a = document.createElement('a');
        a.href = (window.APOLANA_BASE || '../../') + 'assets/descargas/' + p.archivo;
        a.download = p.archivo;
        document.body.appendChild(a); a.click(); a.remove();
        return;
      }
      if(accion === 'copiar-esta'){
        /* «Copiar esta semana a…»: ya estás en la semana que quieres
           copiar, así que lo único que falta es decir a cuál. Se deja
           el origen puesto y el cursor en la fecha de destino. */
        abrirTanda('sw-tanda');
        if($('sw-dup-grupo')) $('sw-dup-grupo').value = SV_GRUPO;
        await cargarSemanasOrigen();
        if($('sw-dup-semana')) $('sw-dup-semana').value = SV_LUNES;
        if($('sw-lunes')){
          // por defecto, la semana siguiente a la que se está mirando
          $('sw-lunes').value = addDias(lunesDe(todayISO), 7);
          avisarLunes();
          $('sw-lunes').focus();
        }
        swMsg('Estás copiando la semana del '+formatFecha(SV_LUNES)+'. Di a qué lunes va y pulsa «Preparar copia».', 'ok');
        return;
      }
    });

    /* Al guardar una semana desde las herramientas de tanda, la rejilla
       de arriba se queda enseñando lo de antes. Se vuelve a pedir. */
    var crearAntes = $('sw-crear');
    if(crearAntes) crearAntes.addEventListener('click', function(){
      setTimeout(function(){ if(SV_GRUPO) cargarSemanaVista(); }, 1200);
    });
  }
  renderSemana();

  // ============================================================
  // SECCIÓN 2c · CALENDARIO
  // ------------------------------------------------------------
  // Qué hay por delante en sus grupos, de un vistazo: entrenamientos
  // publicados, borradores y competiciones.
  //
  // EL FORMATO ES EL QUE PIDIÓ EL CLUB: el mes en grande y, al pulsar
  // un día, ese día se abre debajo. Ni tres barras de mandos apiladas
  // ni una lista infinita: una fila de mandos, el mes, y el día.
  //
  // Un día del mes es lo más fácil de que se quede pequeño: son siete
  // columnas en 375 px. Miden 44 px de alto como poco y la rejilla va
  // en `minmax(0,1fr)` para que ninguna columna empuje a las demás.
  //
  // El calendario del club (apuntarse, bonos, inscripciones) sigue
  // donde estaba y se llega desde aquí: son dos cosas distintas y esta
  // es la del entrenador.
  // ============================================================
  var CV_GRUPO = '', CV_MES = '', CV_DIA = '';
  var CV_SES = [], CV_COMPE = [], CV_ESTADO = 'nada', CV_SINCOMPE = false;

  function mesDe(iso){ return String(iso||'').slice(0,7); }
  function primeroDelMes(mes){ return mes+'-01'; }
  function ultimoDelMes(mes){
    var a = parseInt(mes.slice(0,4),10), m = parseInt(mes.slice(5,7),10);
    var d = new Date(a, m, 0);   // día 0 del mes siguiente = último del mes
    return isoDe(d);
  }
  function mesAlante(mes, n){
    var a = parseInt(mes.slice(0,4),10), m = parseInt(mes.slice(5,7),10) - 1 + n;
    var d = new Date(a, m, 1);
    return isoDe(d).slice(0,7);
  }
  function nombreMes(mes){
    var m = parseInt(mes.slice(5,7),10) - 1;
    return MESES_LARGOS[m]+' '+mes.slice(0,4);
  }

  async function cargarCalendario(){
    CV_ESTADO = 'cargando';
    pintarCalendario();
    var ini = primeroDelMes(CV_MES), fin = ultimoDelMes(CV_MES);
    var r = await sb.from('sesiones')
      .select('id,fecha,hora,lugar,titulo,tipo,rol,deporte,deporte_2,papel_dia,publicada,bloques,'+
              'nota_razonamiento,atletas_ids,abierta_inscripcion,grupo_id')
      .eq('grupo_id', CV_GRUPO).gte('fecha', ini).lte('fecha', fin).order('fecha', { ascending:true });
    if(r.error){ CV_ESTADO = 'error'; pintarCalendario(); return; }
    CV_SES = r.data || [];

    /* Las competiciones no son del grupo: son del club entero, y el
       entrenador las quiere ver aquí porque condicionan la semana. Si esta
       consulta falla, el mes se pinta igual con los entrenamientos y se
       dice que faltan las competiciones: mejor eso que una pantalla en
       blanco o, peor, un mes que parece que no tiene nada. */
    CV_COMPE = []; CV_SINCOMPE = false;
    try {
      var c = await sb.from('competiciones')
        .select('id,nombre,sede,fecha_inicio,fecha_fin,nivel,ambito')
        .lte('fecha_inicio', fin).order('fecha_inicio', { ascending:true });
      if(c.error) CV_SINCOMPE = true;
      else CV_COMPE = (c.data||[]).filter(function(x){
        return (x.fecha_fin || x.fecha_inicio) >= ini;
      });
    } catch(e){ CV_SINCOMPE = true; }

    CV_ESTADO = 'listo';
    pintarCalendario();
  }

  /* Cuánto queda para una competición, en chip. En ámbar la que cae dentro de
     la semana: es la que obliga a cambiar lo que se tenía pensado. */
  function cuandoChip(iso){
    var d = difDias(iso, todayISO), txt, tono;
    if(d === 0){ txt = 'Hoy'; tono = 'aviso'; }
    else if(d < 0){ txt = 'Ya pasó'; tono = ''; }
    else if(d === 1){ txt = 'Mañana'; tono = 'aviso'; }
    else if(d <= 7){ txt = 'Dentro de '+d+' días'; tono = 'aviso'; }
    else { txt = 'Dentro de '+d+' días'; tono = 'info'; }
    return '<span class="pz-estado'+(tono ? ' pz-estado--'+tono : '')+'">'+esc(txt)+'</span>';
  }

  // Los días que ocupa una competición, para poder marcarlos en el mes
  function compeEnDia(iso){
    return CV_COMPE.filter(function(c){
      var a = c.fecha_inicio, b = c.fecha_fin || c.fecha_inicio;
      return a <= iso && iso <= b;
    });
  }

  function pintarCalendario(){
    var cont = $('sec-calendario');
    if(!cont) return;
    if(!MIS_GRUPOS.length){
      cont.innerHTML = '<div class="tarjeta"><h2>Calendario</h2>'+
        vacioHTML(icVacCal, 'Necesitas tener al menos un grupo a tu cargo para ver su calendario.')+'</div>';
      return;
    }

    var pub = CV_SES.filter(function(s){ return s.publicada; }).length;
    var bor = CV_SES.length - pub;
    var ctx = [nombreGrupo(CV_GRUPO) || 'Sin grupo', nombreMes(CV_MES)];
    ctx.push(CV_SES.length ? (pub + (pub===1 ? ' publicado' : ' publicados') + (bor ? ' · '+bor+' en borrador' : ''))
                           : 'sin entrenamientos');
    if(CV_COMPE.length) ctx.push(CV_COMPE.length + (CV_COMPE.length===1 ? ' competición' : ' competiciones'));

    var h = PZ.cabecera({
      titulo: 'Calendario',
      contexto: ctx.join(' · '),
      accion: { texto: 'Planificar la semana', accion: 'cal-semana' }
    });

    h += '<div class="mandos">'+
      '<span class="navper">'+
        '<button type="button" data-pz-accion="cal-atras" aria-label="Mes anterior">&#8592;</button>'+
        '<span class="np-txt">'+esc(nombreMes(CV_MES))+'</span>'+
        '<button type="button" data-pz-accion="cal-alante" aria-label="Mes siguiente">&#8594;</button>'+
      '</span>'+
      '<select id="cv-grupo" aria-label="Grupo">'+
        MIS_GRUPOS.map(function(g){
          return '<option value="'+escAttr(g.id)+'"'+(g.id===CV_GRUPO?' selected':'')+'>'+esc(g.nombre)+'</option>';
        }).join('')+
      '</select>'+
      '<a class="pz-btn pz-btn--texto m-der" href="../calendario/">Ver el calendario del club</a>'+
    '</div>';

    if(CV_ESTADO === 'cargando'){
      cont.innerHTML = h + '<div class="tarjeta">'+APOLANA_UI.cargando('filas', 4)+'</div>';
      return;
    }
    if(CV_ESTADO === 'error'){
      cont.innerHTML = h + '<div class="tarjeta">'+APOLANA_UI.error('No hemos podido cargar el calendario de este mes',
        'Puede ser tu conexión. No se ha perdido nada: los entrenamientos siguen puestos.',
        APOLANA_UI.boton('Volver a intentarlo'))+'</div>';
      var b = cont.querySelector('.ap-btn');
      if(b) b.addEventListener('click', cargarCalendario);
      conectarGrupoCalendario();
      return;
    }

    // ---- el mes en grande ----
    var porDia = {};
    CV_SES.forEach(function(s){ (porDia[s.fecha] = porDia[s.fecha] || []).push(s); });

    var ini = primeroDelMes(CV_MES), ultimo = ultimoDelMes(CV_MES);
    var primero = new Date(ini+'T00:00:00');
    // La semana del club empieza en lunes, como en todo lo demás
    var hueco = (primero.getDay() + 6) % 7;
    var cuantos = parseInt(ultimo.slice(8,10), 10);

    h += '<div class="cal-card">'+
      '<div class="cal-cab">'+['L','M','X','J','V','S','D'].map(function(d){
        return '<span>'+d+'</span>';
      }).join('')+'</div>'+
      '<div class="cal-rej">';
    for(var v=0; v<hueco; v++) h += '<span class="cal-hueco"></span>';
    for(var n=1; n<=cuantos; n++){
      var iso = CV_MES+'-'+(n<10?'0':'')+n;
      var ses = porDia[iso] || [], cmp = compeEnDia(iso);
      var puntos = '';
      ses.slice(0,4).forEach(function(s){ puntos += '<i'+(s.publicada?'':' class="borrador"')+'></i>'; });
      cmp.slice(0,2).forEach(function(){ puntos += '<i class="compe"></i>'; });
      var vacio = !ses.length && !cmp.length;
      h += '<button type="button" class="cal-dia'+(vacio?' libre':'')+(iso===todayISO?' hoy':'')+'" '+
             'aria-pressed="'+(iso===CV_DIA?'true':'false')+'" data-pz-accion="cal-dia" data-pz-id="'+escAttr(iso)+'" '+
             'aria-label="'+escAttr(formatFecha(iso)+(vacio ? ', sin nada puesto' : ''))+'">'+
             '<span class="cd-n">'+n+'</span>'+
             '<span class="cd-p">'+puntos+'</span>'+
           '</button>';
    }
    h += '</div>'+
      '<div class="cal-leyenda">'+
        '<span><i></i>Entrenamiento publicado</span>'+
        '<span><i class="borrador"></i>Borrador</span>'+
        '<span><i class="compe"></i>Competición</span>'+
      '</div>'+
    '</div>';

    if(CV_SINCOMPE){
      h += '<p class="banda-ambar">No hemos podido cargar las competiciones de este mes. Los entrenamientos que ves están completos; las competiciones pueden faltar.</p>';
    }

    // ---- el día que se ha pulsado ----
    if(CV_DIA && mesDe(CV_DIA) === CV_MES){
      var d = new Date(CV_DIA+'T00:00:00');
      var sesDia = porDia[CV_DIA] || [], cmpDia = compeEnDia(CV_DIA);
      h += '<h2 class="cv-tit">'+esc(DIA_TIT[d.getDay()])+' '+d.getDate()+' de '+esc(MESES_LARGOS[d.getMonth()])+'</h2>'+
           '<div class="sw-rej">'+
             tarjetaDia(CV_DIA, sesDia, CV_GRUPO, CV_DIA < todayISO, 'cv')+
             cmpDia.map(function(c){
               var cuando = c.fecha_fin && c.fecha_fin !== c.fecha_inicio
                 ? 'del '+formatFecha(c.fecha_inicio)+' al '+formatFecha(c.fecha_fin) : formatFecha(c.fecha_inicio);
               return '<div class="dia-t">'+
                 '<div class="dt-cab"><span class="dt-dia">Competición</span></div>'+
                 '<div class="dt-cuerpo">'+
                   '<span class="dt-tit">'+esc(c.nombre||'Sin nombre')+'</span>'+
                   ((c.nivel||c.ambito) ? '<div class="dt-chips">'+
                      (c.nivel ? '<span class="dt-chip">'+esc(c.nivel)+'</span>' : '')+
                      (c.ambito ? '<span class="dt-chip">'+esc(c.ambito)+'</span>' : '')+
                    '</div>' : '')+
                   '<span class="dt-res">'+esc([c.sede, cuando].filter(Boolean).join(' · '))+'</span>'+
                 '</div>'+
                 '<div class="dt-pie">'+
                   /* El chip no repite «Competición» —eso ya lo dice la cabecera
                      de la tarjeta—: dice cuánto queda, que es lo que decide si
                      esta semana toca apretar o aflojar. */
                   cuandoChip(c.fecha_inicio)+
                   '<a class="pz-btn pz-btn--texto" href="../competiciones/">Competiciones</a>'+
                 '</div>'+
               '</div>';
             }).join('')+
           '</div>';
    } else {
      h += '<p class="sv-linea">Pulsa un día del mes para ver lo que hay ese día.</p>';
    }

    cont.innerHTML = h;
    conectarGrupoCalendario();
  }

  function conectarGrupoCalendario(){
    var sel = $('cv-grupo');
    if(!sel) return;
    sel.addEventListener('change', function(){ CV_GRUPO = sel.value; cargarCalendario(); });
  }

  function entrarCalendario(){
    if(!MIS_GRUPOS.length){ pintarCalendario(); return; }
    if(!CV_GRUPO) CV_GRUPO = MIS_GRUPOS[0].id;
    if(!CV_MES){ CV_MES = mesDe(todayISO); CV_DIA = todayISO; }
    cargarCalendario();
  }

  (function renderCalendario(){
    var cont = $('sec-calendario');
    if(!cont) return;
    PZ.alPulsar(cont, function(accion, id){
      if(accion === 'cal-atras'){  CV_MES = mesAlante(CV_MES, -1); cargarCalendario(); return; }
      if(accion === 'cal-alante'){ CV_MES = mesAlante(CV_MES,  1); cargarCalendario(); return; }
      if(accion === 'cal-semana'){
        // La semana que se abre es la del día que se está mirando
        SV_GRUPO = CV_GRUPO;
        SV_LUNES = lunesDe(CV_DIA || primeroDelMes(CV_MES));
        irASeccion('semana');
        window.scrollTo(0,0);
        return;
      }
      if(accion === 'cal-dia'){
        // Volver a pulsar el mismo día lo cierra: es lo que espera cualquiera
        CV_DIA = (CV_DIA === id) ? '' : id;
        pintarCalendario();
        return;
      }
      if(accion === 'planificar-dia'){ planificarDia(id, CV_GRUPO); return; }
      if(accion === 'abrir'){ abrirEnPlanificador(id, CV_GRUPO, false); return; }
      if(accion === 'duplicar-dia'){ abrirEnPlanificador(id, CV_GRUPO, true); return; }
      if(accion === 'ver-detalle'){ verDetalleSesion(id); return; }
    });
  })();

  // ============================================================
  // SECCIÓN 3 · FEEDBACK
  // ============================================================
  var FB_SESIONES = {};

  async function cargarSesionesFeedback(){
    var sel = $('fb-sesion');
    if(!sel) return;
    var prev = sel.value;
    var r = await sb.from('sesiones').select('id,fecha,titulo,grupo_id,publicada').order('fecha',{ascending:false}).limit(120);
    FB_SESIONES = {};

    /* Si la consulta falla, el desplegable se quedaba con la sola opción de
       «elige una sesión» y parecía que no había ninguna. Un desplegable
       vacío no es una respuesta: se dice que no se ha podido cargar y se
       deja volver a intentarlo sin recargar la pantalla. */
    if(r.error){
      sel.innerHTML = '<option value="">— no hemos podido cargarlas —</option>';
      sel.disabled = true;
      $('fb-cont').innerHTML = APOLANA_UI.error('No hemos podido cargar la lista de entrenamientos',
        'Puede ser tu conexión. No se ha perdido nada: lo que apuntaron tus atletas sigue guardado.',
        APOLANA_UI.boton('Volver a intentarlo'));
      var bf = $('fb-cont').querySelector('.ap-btn');
      if(bf) bf.addEventListener('click', cargarSesionesFeedback);
      return;
    }

    sel.disabled = false;
    sel.innerHTML = '<option value="">— elige un entrenamiento —</option>';
    (r.data||[]).forEach(function(s){ FB_SESIONES[s.id]=s; sel.innerHTML += '<option value="'+s.id+'">'+esc(formatFecha(s.fecha))+' · '+esc(nombreGrupo(s.grupo_id)||'')+' · '+esc(s.titulo||'sin título')+(s.publicada?'':' (borrador)')+'</option>'; });

    if(!r.data || !r.data.length){
      sel.innerHTML = '<option value="">— todavía no hay entrenamientos —</option>';
      sel.disabled = true;
      $('fb-cont').innerHTML = APOLANA_UI.vacio('Todavía no hay ningún entrenamiento planificado',
        'El feedback lo escriben los atletas después de entrenar, así que primero hace falta un entrenamiento. Planifica el primero y vuelve por aquí.');
      return;
    }

    if(prev && FB_SESIONES[prev]) sel.value = prev;
  }

  /* Cómo se le cuenta al entrenador el motivo que eligió el atleta. «Me
     molestaba» se dice «le molestaba algo», y entonces lo que hay que mirar es
     el campo de molestias, que está tres líneas más abajo en su misma ficha. */
  var MOTIVO_ENTRENADOR={ tiempo:'no le dio tiempo', molestia:'le molestaba algo', otro:'otro motivo' };

  async function pintarFeedback(sesionId, destacarAtleta){
    var cont = $('fb-cont');
    if(!sesionId){ cont.innerHTML = vacioHTML(icVacChat, 'Elige un entrenamiento para ver cómo lo vivieron tus atletas.'); return; }
    cont.innerHTML = APOLANA_UI.cargando('filas', 4);
    var ses = FB_SESIONES[sesionId];
    var grupoId = ses ? ses.grupo_id : null;
    /* Quién entrena en ese grupo, contando a los que están en varios
       (migración 116): con `grupo_id` a secas, el que tiene ese grupo como
       segundo no salía y su feedback se quedaba sin enseñar. */
    var atls = atletasDeGrupo(grupoId);
    var reg = await sb.from('registros_sesion').select('*').eq('sesion_id', sesionId);
    if(reg.error){
      cont.innerHTML = APOLANA_UI.error('No hemos podido cargar el feedback de este entrenamiento',
        'Puede ser tu conexión. Los atletas no han perdido nada de lo que apuntaron.',
        APOLANA_UI.boton('Volver a intentarlo'));
      var br = cont.querySelector('.ap-btn');
      if(br) br.addEventListener('click', function(){ pintarFeedback(sesionId, destacarAtleta); });
      return;
    }
    var porAtleta={}; (reg.data||[]).forEach(function(r){ porAtleta[r.atleta_id]=r; });

    /* Y quien apuntó algo en ese entrenamiento va SIEMPRE, esté hoy en el
       grupo que esté: lo hizo, lo contó y se le ha leído en su ficha. Sin
       esto, entrar aquí desde el feedback de alguien que ha cambiado de
       grupo te dejaba mirando una lista donde él no aparece. */
    (reg.data||[]).forEach(function(r){
      if(atls.some(function(x){ return x.id===r.atleta_id; })) return;
      var extra = atletaPorId(r.atleta_id);
      if(extra) atls = atls.concat([extra]);
    });

    if(!atls.length){ cont.innerHTML = vacioHTML(icVacGrupo, 'No hay atletas visibles en el grupo de este entrenamiento.'); return; }

    /* Lo que ya se le contestó a cada uno. Se pide de una vez para todo el
       entrenamiento: son los mismos atletas de la lista, no una consulta por
       ficha. Si falla, no se rompe la pantalla: se dejan las cajas vacías y
       lo que hay guardado sigue estando. */
    var COM={};   // { registro_id: {id, comentario, created_at, editado_en, entrenador_id} }
    var regIds=(reg.data||[]).map(function(r){ return r.id; });
    if(regIds.length){ try {
      var fq = await sb.from('feedback_entrenamientos')
        .select('id,registro_id,entrenador_id,comentario,created_at,editado_en')
        .in('registro_id', regIds).order('created_at', { ascending:true });
      if(!fq.error && fq.data) fq.data.forEach(function(c){ COM[c.registro_id]=c; });
    } catch(e){} }

    var html = atls.map(function(at){
      var r = porAtleta[at.id];
      var nom = esc((at.nombre||'')+' '+(at.apellidos||''));
      if(!r){ return '<div class="fb-atleta" data-atleta="'+esc(at.id)+'"><div class="fb-nom"><strong>'+nom+'</strong><span class="sin-registro">Sin registro todavía</span></div></div>'; }
      var metrics='';
      if(r.rpe!=null) metrics += '<span class="fb-metric">RPE <b>'+esc(r.rpe)+'</b>/10</span>';
      if(r.sensacion_general!=null) metrics += '<span class="fb-metric">Sensación <b>'+esc(r.sensacion_general)+'</b>/10</span>';
      if(r.horas_sueno!=null) metrics += '<span class="fb-metric">Sueño <b>'+esc(r.horas_sueno)+'</b> h</span>';
      if(r.peso_kg!=null) metrics += '<span class="fb-metric">Peso <b>'+esc(r.peso_kg)+'</b> kg</span>';
      var txt='';
      if(r.como_me_siento) txt += '<p class="fb-txt"><span>Cómo se siente</span>'+esc(r.como_me_siento)+'</p>';
      if(r.molestias) txt += '<p class="fb-txt"><span>Molestias</span>'+esc(r.molestias)+'</p>';
      if(r.notas_atleta) txt += '<p class="fb-txt"><span>Notas</span>'+esc(r.notas_atleta)+'</p>';
      /* ------------------------------------------------------------
         LO QUE SE QUEDÓ SIN HACER
         De nada sirve que el atleta lo marque si aquí se queda enterrado. Va
         arriba del todo de su ficha, antes que el RPE, porque cambia cómo se
         lee todo lo demás: un RPE de 5 en un entrenamiento entero y en medio
         entrenamiento no significan lo mismo.

         Y se dice QUÉ se cayó, no solo cuánto: si alguien lleva tres semanas
         saltándose siempre el core, eso es un dato, no un descuido, y solo se
         ve si aparecen los nombres.
         ------------------------------------------------------------ */
      var aviso='';
      if(r.estado==='a_medias' || r.estado==='no_hecho'){
        var cayeron=[];
        if(r.tiempos_reales && typeof r.tiempos_reales==='object'){
          Object.keys(r.tiempos_reales).forEach(function(k){
            var t=r.tiempos_reales[k]; if(!t || !Array.isArray(t.series)) return;
            var sin=t.series.filter(function(s){ return !(s&&s.hecha); }).length;
            if(sin) cayeron.push((t.ejercicio||k)+' ('+sin+')');
          });
        }
        var cuanto = (r.series_previstas>0) ? r.series_hechas+' de '+r.series_previstas+' series' : '';
        var porque = r.motivo_no_hecho ? MOTIVO_ENTRENADOR[r.motivo_no_hecho]||r.motivo_no_hecho : '';
        aviso = '<div class="fb-medias"><b>'+(r.estado==='no_hecho'?'No lo hizo':'Se quedó a medias')+'</b>'+
          (cuanto?'<span> · '+esc(cuanto)+'</span>':'')+
          (porque?'<span> · '+esc(porque)+'</span>':'')+
          (cayeron.length?'<em>Se cayó: '+esc(cayeron.slice(0,5).join(', '))+(cayeron.length>5?'…':'')+'</em>':'')+
          (r.nota_no_hecho?'<em>«'+esc(r.nota_no_hecho)+'»</em>':'')+'</div>';
      }
      /* ------------------------------------------------------------
         LO QUE CAMBIÓ POR OTRA COSA
         El entrenamiento decía press banca y él hizo flexiones, porque no
         había banco. Va arriba, con lo que se quedó sin hacer, y por lo
         mismo: cambia lo que estás leyendo. Si esto se quedara enterrado
         al final, marcarlo no serviría de nada y se dejaría de marcar.

         Y es información para planificar, no un descuido del atleta: si
         todas las semanas el jalón sale convertido en dominadas, en esa
         sala no hay polea y toca escribir otra cosa.
         ------------------------------------------------------------ */
      var cambios='';
      if(r.tiempos_reales && typeof r.tiempos_reales==='object'){
        var lin=[];
        Object.keys(r.tiempos_reales).forEach(function(k){
          var t=r.tiempos_reales[k]; if(!t || !t.cambiado_por) return;
          lin.push('<span class="fbc-uno">Hizo <b>'+esc(t.cambiado_por)+'</b> '+
                   '<span>en vez de '+esc(t.ejercicio||k)+'</span></span>');
        });
        if(lin.length) cambios='<div class="fb-cambios"><span class="fbc-et">Lo cambió por otra cosa</span>'+lin.join('')+'</div>';
      }
      var tiempos='';
      if(r.tiempos_reales && typeof r.tiempos_reales==='object'){
        Object.keys(r.tiempos_reales).forEach(function(k){
          var t=r.tiempos_reales[k]; if(!t) return;
          /* Se enseña serie a serie, y la que no se hizo se dice con palabras.
             Antes se filtraban los huecos y una serie sin hacer desaparecía;
             ahora se ve, que es justo el dato que el club quería. */
          var trozos=[];
          if(Array.isArray(t.series)){
            t.series.forEach(function(s,i){
              var v=(t.tiempos&&t.tiempos[i])||'';
              trozos.push('<span class="fb-serie'+(s&&s.hecha?'':' no')+'">'+(i+1)+'ª '+
                          esc(s&&s.hecha ? (v||'hecha') : 'no la hizo')+'</span>');
            });
          } else {
            (t.tiempos||[]).forEach(function(v,i){
              if(v==null||String(v).trim()==='') return;
              trozos.push('<span class="fb-serie">'+(i+1)+'ª '+esc(v)+'</span>');
            });
          }
          if(!trozos.length) return;
          /* El nombre que manda aquí es el del entrenamiento, y al lado lo que
             hizo de verdad: el entrenador busca por lo que él puso. */
          var comoSeLlama = esc(t.ejercicio||k) +
            (t.cambiado_por ? ' <span class="fb-corregido">→ '+esc(t.cambiado_por)+'</span>' : '');
          /* EL RIR, POR EJERCICIO: lo que se pidió y lo que dejó. Es el dato
             con el que se decide la semana siguiente —si pedías 2-3 y lo dejó
             a 0 se pasó; si lo dejó a 4, le sobró y toca subir peso—, así que
             va pegado al nombre y no enterrado entre las series.
             ⚠️ Más RIR es MÁS SUAVE. RIR 0 es el fallo. */
          var lineaRir = '';
          if(t.rir_objetivo || (t.rir!=null && t.rir!=='')){
            var objRir = (Dsc && t.rir_objetivo) ? Dsc.rirDeFila({ rir: t.rir_objetivo }) : null;
            var fuera = (objRir && t.rir!=null && t.rir!=='') ? Dsc.rirComparado(objRir, t.rir) : null;
            var partesRir = [];
            if(t.rir_objetivo) partesRir.push('le pedías '+t.rir_objetivo);
            if(t.rir!=null && t.rir!=='') partesRir.push('lo dejó a '+t.rir);
            var clsRir = fuera==='paso' ? ' rir-paso' : fuera==='corto' ? ' rir-corto' : '';
            /* En su propia línea, entre el nombre y las series: es una lectura
               del ejercicio entero, no una serie más. */
            lineaRir = '<span class="fb-rir-obj'+clsRir+'">'+esc(partesRir.join(' · '))+
              (fuera==='paso' ? ' · se pasó' : fuera==='corto' ? ' · le sobró' : '')+'</span>';
          }
          tiempos += '<div class="fb-ej">'+comoSeLlama+':'+lineaRir+' '+trozos.join('')+'</div>';
        });
      }
      /* «Corregido el 3 de agosto»: lo apuntado se puede corregir (migración
         104) y aquí tiene que verse, porque igual ya habías leído el número
         de antes y decidido algo con él. */
      var corr = r.corregido_en
        ? '<span class="fb-corregido">Corregido el '+esc(formatFecha(String(r.corregido_en).slice(0,10)))+
          (r.corregido_veces>1?' ('+r.corregido_veces+' veces)':'')+'</span>' : '';
      return '<div class="fb-atleta" data-reg="'+esc(r.id)+'" data-atleta="'+esc(at.id)+'">'+
        '<div class="fb-nom"><strong>'+nom+'</strong>'+
        (at.categoria?'<span class="pill">'+esc(at.categoria)+'</span>':'')+corr+'</div>'+
        aviso + cambios +
        (metrics?'<div class="fb-metrics">'+metrics+'</div>':'')+ txt +
        (tiempos?'<div class="fb-tiempos">'+tiempos+'</div>':'')+
        respuestaHTML(r.id, COM[r.id])+'</div>';
    }).join('');
    cont.innerHTML = html;

    /* Si se ha llegado hasta aquí desde la ficha de alguien, se venía a leer
       LO SUYO. Se lleva la pantalla a su tarjeta y se le pone un filete azul,
       para no dejar al entrenador buscando un nombre entre veinte en un
       móvil. Los ids son uuid, así que el selector no necesita escaparse. */
    if(destacarAtleta){
      var suyo = cont.querySelector('.fb-atleta[data-atleta="'+destacarAtleta+'"]');
      if(suyo){
        suyo.classList.add('fb-mirando');
        suyo.scrollIntoView({ behavior:'smooth', block:'center' });
      }
    }
  }

  /* ------------------------------------------------------------
     CONTESTARLE AL ATLETA
     ------------------------------------------------------------
     Aquí mismo, debajo de lo que acabas de leer. Es el momento natural
     de responder: acabas de ver que se quedó a medias y que le molestaba
     el gemelo. Montarlo en otra pantalla sería asegurarse de que no se
     escribe nunca.

     ⚠️ EL AVISO DE QUIÉN LO LEE NO ES DECORATIVO. Ya pasó con la «nota /
     razonamiento» del entrenamiento: la leían el atleta y su familia y no
     lo decía en ninguna parte, y hubo que añadirlo después. Aquí va desde
     el primer día y al lado del título, antes de escribir nada.

     SE PUEDE CORREGIR, con el mismo criterio que lo demás: el mismo día
     se retoca y no pasa nada; si se reescribe otro día, queda dicho
     (migración 105). Eso lo lleva la base, no esta pantalla.
     ------------------------------------------------------------ */
  function respuestaHTML(regId, com){
    var pie='';
    if(com){
      pie = 'Escrito el '+esc(formatFecha(String(com.created_at).slice(0,10)));
      if(com.editado_en) pie += ' · corregido el '+esc(formatFecha(String(com.editado_en).slice(0,10)));
      /* El comentario de otro entrenador se lee pero no se toca: si dos
         personas llevan al mismo atleta, cada una firma lo suyo. */
      if(com.entrenador_id && com.entrenador_id !== perfil.id) pie += ' · lo escribió otro entrenador';
    }
    var ajeno = !!(com && com.entrenador_id && com.entrenador_id !== perfil.id);
    return '<div class="fb-resp">'+
      '<div class="fbr-et">Tu comentario para el atleta'+
        '<span class="fbr-lee">— lo lee él en su portal</span></div>'+
      '<textarea class="fbr-txt" '+(ajeno?'readonly ':'')+
        'placeholder="Lo que quieras decirle de este entrenamiento">'+esc(com&&com.comentario||'')+'</textarea>'+
      '<div class="fbr-acc">'+
        (ajeno ? '' : '<button type="button" class="btn btn--neutro btn--sm fbr-guardar" data-reg="'+esc(regId)+'">'+
                      (com?'Guardar cambios':'Enviar comentario')+'</button>')+
        '<span class="msg fbr-msg"></span>'+
        (pie?'<span class="fbr-pie">'+pie+'</span>':'')+
      '</div></div>';
  }

  /* Guardar el comentario. Se inserta la primera vez y se actualiza las
     siguientes; el rastro de «corregido el…» lo pone la base. */
  async function guardarComentario(btn){
    var caja = btn.closest('.fb-atleta'); if(!caja) return;
    var regId = btn.getAttribute('data-reg');
    var ta = caja.querySelector('.fbr-txt');
    var msg = caja.querySelector('.fbr-msg');
    var texto = ta ? ta.value.trim() : '';
    if(!texto){ msg.textContent = 'Escribe algo antes de enviarlo.'; msg.className='msg fbr-msg error'; return; }
    msg.textContent = 'Guardando…'; msg.className='msg fbr-msg';
    var ya = await sb.from('feedback_entrenamientos').select('id')
               .eq('registro_id', regId).eq('entrenador_id', perfil.id).maybeSingle();
    var res;
    if(!ya.error && ya.data){
      res = await sb.from('feedback_entrenamientos').update({ comentario: texto }).eq('id', ya.data.id);
    } else {
      res = await sb.from('feedback_entrenamientos')
              .insert({ registro_id: regId, entrenador_id: perfil.id, comentario: texto });
    }
    if(res.error){ msg.textContent = 'Error: '+res.error.message; msg.className='msg fbr-msg error'; return; }
    msg.textContent = 'Enviado ✓ ya lo puede leer'; msg.className='msg fbr-msg ok';
  }

  // ============================================================
  // SECCIÓN 4 · OBSERVACIONES PRIVADAS (solo el equipo técnico)
  // ------------------------------------------------------------
  // Notas internas del entrenador sobre un atleta. El atleta y su
  // familia NO pueden leerlas: la tabla notas_atleta tiene RLS y
  // solo el staff (admin o el entrenador de ESE atleta) tiene
  // acceso. Ver migraciones/009_notas_privadas.sql.
  // ============================================================
  function formatFechaHora(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    var me = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var p2 = function(n){ return (n<10?'0':'')+n; };
    return p2(d.getDate())+' '+me[d.getMonth()]+' '+d.getFullYear()+' · '+p2(d.getHours())+':'+p2(d.getMinutes());
  }

      : vacioHTML(icVacNota, 'Aún no hay observaciones para este atleta.');
    cont.innerHTML =
      '<div class="aviso-privado">🔒 Estas observaciones son <strong>solo del equipo técnico</strong>. El atleta y su familia <strong>no pueden verlas</strong>: solo tú (su entrenador) y la dirección del club.</div>'+

        '<div id="nt-cont" style="margin-top:16px;">'+vacioHTML(icVacNota, 'Elige un atleta para ver y añadir observaciones.')+'</div>'+
      '</div>';
    $('nt-atleta').addEventListener('change', function(){ pintarNotas($('nt-atleta').value); });
  })();

  // ---------- llegar directo a una sección ----------
  // La barra inferior del resto de pantallas del portal enlaza aquí con
  // #lista, #feedback o #mas: se abre eso mismo al entrar.
  (function(){
    function aplicarHash(){
      var h=(location.hash||'').replace(/^#/,'');
      if(h==='mas'){ abrirMas(); return; }
      if(SECCIONES.indexOf(h)!==-1){ cerrarMas(); irASeccion(h); }
    }
    aplicarHash();
    window.addEventListener('hashchange', aplicarHash);
  })();

});
</script>

</body>
</html>
