<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona de entrenador · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .en-wrap { max-width: 960px; margin: 0 auto; padding: clamp(22px,4vw,40px) clamp(16px,4vw,40px); }
  .en-wrap h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(30px,6vw,44px); color: var(--navy); margin: 0 0 4px; }
  .en-wrap .sub { font-family: var(--fuente-mono); font-size: 12px; letter-spacing:.1em; text-transform:uppercase; color: var(--texto-tenue); }
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(20px,3vw,28px); box-shadow: var(--sombra-suave); margin-top: 20px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  .grupos { display:flex; flex-wrap:wrap; gap:8px; }
  .grupo-chip { border:1px solid var(--linea-borde); border-radius:999px; padding:7px 14px; font-size:14px; color: var(--texto); }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--texto-tenue); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:11px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="en-wrap" id="en-wrap"><p class="intro">Cargando…</p></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('en-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  var html = '<h1>Mis grupos</h1><span class="sub">Hola, ' + esc(perfil.nombre || '') + '</span>';

  // Mis grupos
  var gruposHtml = '<p class="vacio">Aún no vemos grupos a tu cargo.</p>';
  try {
    var g = await sb.from('grupos').select('nombre,seccion,horario').eq('entrenador_id', perfil.id).order('nombre');
    if (!g.error && g.data && g.data.length) {
      gruposHtml = '<div class="grupos">' + g.data.map(function(x){ return '<span class="grupo-chip">'+esc(x.nombre)+(x.seccion?' · '+esc(x.seccion):'')+'</span>'; }).join('') + '</div>';
    }
  } catch (e) {}

  // Mis atletas
  var atletasHtml = '<p class="vacio">Todavía no vemos atletas a tu cargo (o faltan datos por cargar).</p>';
  try {
    var a = await sb.from('atletas').select('nombre,apellidos,categoria,estado').eq('entrenador_id', perfil.id).order('apellidos');
    if (!a.error && a.data && a.data.length) {
      atletasHtml = '<table><thead><tr><th>Atleta</th><th>Categoría</th><th>Estado</th></tr></thead><tbody>' +
        a.data.map(function(x){ return '<tr><td>'+esc((x.nombre||'')+' '+(x.apellidos||''))+'</td><td>'+esc(x.categoria||'')+'</td><td><span class="pill">'+esc(x.estado||'')+'</span></td></tr>'; }).join('') +
        '</tbody></table>';
    }
  } catch (e) {}

  html += '<div class="tarjeta"><h2>Grupos</h2>' + gruposHtml + '</div>';
  html += '<div class="tarjeta"><h2>Mis atletas</h2>' + atletasHtml + '</div>';
  html += '<div class="tarjeta"><h2>Próximamente</h2><p class="vacio">Planificar la sesión, pasar lista, leer el feedback y la ficha del atleta llegarán en las siguientes fases (con permiso de edición).</p></div>';
  wrap.innerHTML = html;
});
</script>

</body>
</html>
