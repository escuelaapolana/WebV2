<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona de entrenador · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .en-wrap { max-width: 1060px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  .en-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(28px,6vw,42px); color: var(--navy); margin: 0 0 4px; }
  .en-cab .sub { font-family: var(--fuente-mono); font-size: 12px; letter-spacing:.1em; text-transform:uppercase; color: var(--texto-tenue); }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 210px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding:8px; box-shadow: var(--sombra-suave); }
  .side nav a { cursor:pointer; font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color: var(--texto-suave); padding:10px 12px; border-radius:10px; text-decoration:none; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { background: var(--navy); color:#fff; }
  .cont { flex:1 1 auto; min-width:0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(18px,3vw,26px); box-shadow: var(--sombra-suave); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  .tarjeta h3 { font-size:15px; color: var(--navy); margin: 14px 0 8px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--texto-tenue); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:11px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); text-transform:capitalize; }
  .pill.activo { background:#e6f4ea; color:#1e7a3d; }
  .pill.lesionado { background:#fdeceb; color:#b3261e; }
  .pill.prueba { background: var(--azul-suave); color: var(--azul-oscuro); }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  input:focus, select:focus, textarea:focus { outline:none; border-color: var(--azul); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; }
  .check { display:flex; align-items:center; gap:8px; }
  .check input { width:auto; }
  .check label { margin:0; }

  /* ¿para quién es la sesión? */
  .dest { border:1px solid var(--linea); border-radius:12px; padding:12px 14px; margin-top:14px; background: var(--crema); }
  .dest > label:first-child { margin-top:0; }
  .dest-lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px; margin-top:10px; }
  .dest-lista label { display:flex; align-items:center; gap:8px; margin:0; font-weight:400; font-size:13.5px; background:#fff; border:1px solid var(--linea); border-radius:9px; padding:7px 10px; cursor:pointer; }
  .dest-lista input { width:auto; }
  .dest-aviso { background:#fff8e6; border:1px solid #f0d98a; color:#7a5c00; border-radius:9px; padding:8px 11px; font-size:12.5px; margin:10px 0 0; }
  .dest-barra { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pista { font-size:12.5px; color: var(--texto-suave); margin:6px 0 0; line-height:1.5; }
  .pista code { font-family: var(--fuente-mono); font-size:12px; background: var(--crema-media); border-radius:4px; padding:1px 5px; }

  /* mejores marcas en Mi grupo */
  .mrc { display:flex; flex-wrap:wrap; gap:5px; }
  .mrc span { font-family: var(--fuente-mono); font-size:11.5px; background: var(--azul-suave); color: var(--azul-oscuro); border-radius:6px; padding:2px 7px; white-space:nowrap; }
  .mrc-no { font-size:12.5px; color: var(--texto-tenue); font-style:italic; }

  /* editor de bloques */
  .editor-bloque { border:1px solid var(--linea); border-radius:14px; padding:12px; margin-bottom:12px; background: var(--crema); }
  .b-cab { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .b-cab .b-etiqueta { flex:1 1 210px; font-weight:600; }
  .b-cab .b-matiz { flex:1 1 190px; font-style:italic; }
  .filas-cab { display:grid; grid-template-columns:1.7fr .72fr .85fr .8fr .8fr .95fr 34px; gap:6px; font-family: var(--fuente-mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color: var(--texto-tenue); padding:0 2px 4px; }
  .editor-fila { margin-bottom:9px; }
  .fila-l1 { display:grid; grid-template-columns:1.7fr .72fr .85fr .8fr .8fr .95fr 34px; gap:6px; align-items:center; }
  .fila-l2 { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:5px; padding-right:40px; }
  .fila-l2 .f-detalle { flex:1 1 150px; min-width:0; }
  .fila-l2 .f-observaciones { flex:2 1 280px; min-width:0; }
  .editor-fila input, .editor-fila select { padding:8px 8px; font-size:13px; border-radius:8px; }
  .f-cel-cz { min-width:0; }
  .f-cel-cz select, .f-cel-cz input { width:100%; }

  /* calzado / carga según el tipo de sesión */
  #bloques-cont .f-carga { display:none; }
  #bloques-cont.modo-gym .f-carga { display:block; }
  #bloques-cont.modo-gym .f-calzado { display:none; }

  /* material de natación (varios a la vez) */
  .f-material-caja { flex:1 1 100%; display:none; gap:5px; flex-wrap:wrap; align-items:center; }
  #bloques-cont.con-material .f-material-caja { display:flex; }
  .f-material-caja > .mat-tit { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color: var(--texto-tenue); margin-right:2px; }
  .mat-op { margin:0; position:relative; }
  /* la casilla se oculta a la vista pero se sigue pudiendo enfocar con el teclado */
  .mat-op input { position:absolute; width:1px; height:1px; opacity:0; margin:0; padding:0; }
  .mat-op span { display:inline-block; font-size:12px; line-height:1; padding:6px 9px; border:1px solid var(--linea-borde); border-radius:999px; background:#fff; color: var(--texto-suave); cursor:pointer; user-select:none; }
  .mat-op input:checked + span { background: var(--azul-suave); border-color: var(--azul); color: var(--azul-oscuro); font-weight:600; }
  .mat-op input:focus-visible + span { outline:2px solid var(--azul); outline-offset:2px; }
  .mini-x { border:1px solid var(--linea-borde); background:#fff; border-radius:8px; width:34px; height:36px; cursor:pointer; color: var(--texto-suave); font-size:18px; line-height:1; padding:0; }
  .mini-x:hover { border-color:#b3261e; color:#b3261e; }
  .btn-mini { font-family: var(--fuente-mono); font-size:12px; text-transform:uppercase; letter-spacing:.05em; border:1px solid var(--linea-borde); background:#fff; color: var(--azul-oscuro); border-radius:8px; padding:8px 13px; cursor:pointer; }
  .btn-mini:hover { background: var(--azul-suave); border-color: var(--azul); }

  /* buscador de ejercicios */
  .buscador-ej { position:relative; }
  .buscador-ej input { border-radius:10px; }
  .buscador-ej.abierto input { border-radius:10px 10px 0 0; border-bottom-color: transparent; }
  .ej-res { border:1px solid var(--linea-borde); border-top:none; border-radius:0 0 10px 10px; max-height:240px; overflow-y:auto; background:#fff; box-shadow: var(--sombra-suave); }
  .ej-item { padding:8px 11px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--linea); display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .ej-item:last-child { border-bottom:none; }
  .ej-item:hover, .ej-item.sel { background: var(--azul-suave); }
  .ej-item .ej-meta { font-family: var(--fuente-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color: var(--texto-tenue); white-space:nowrap; }
  .ej-vacio { padding:10px 11px; font-size:13px; color: var(--texto-tenue); }
  .ej-ayuda { font-size:12px; color: var(--texto-tenue); margin:6px 0 0; }
  .editor-fila.fila-activa { outline:2px solid var(--azul); outline-offset:3px; border-radius:8px; }

  /* planificar semana */
  .sw-ayuda { background: var(--crema); border:1px solid var(--linea); border-radius:12px; padding:11px 14px; margin-top:14px; font-size:13.5px; color: var(--texto); }
  .sw-ayuda summary { cursor:pointer; font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color: var(--azul-oscuro); }
  .sw-ayuda pre { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:10px 12px; overflow-x:auto; font-size:12.5px; line-height:1.5; margin:10px 0; white-space:pre; }
  .sw-ayuda ul { margin:8px 0 0 18px; padding:0; }
  .sw-ayuda li { margin:3px 0; }
  .sw-ayuda code { font-family: var(--fuente-mono); font-size:12.5px; background: var(--crema-media); border-radius:4px; padding:1px 5px; }
  #sw-texto { min-height:230px; font-family: var(--fuente-mono); font-size:13px; line-height:1.55; }
  .sw-dia { border:1px solid var(--linea); border-radius:14px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .sw-dia.excluido { opacity:.42; }
  .sw-dia-cab { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px; }
  .sw-fecha { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color: var(--azul-oscuro); background: var(--azul-suave); border-radius:999px; padding:3px 10px; }
  .sw-choque { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; background:#fdeceb; color:#b3261e; border-radius:999px; padding:3px 10px; }
  .sw-dia-campos { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin-bottom:6px; }
  .sw-dia-campos input, .sw-dia-campos select { padding:7px 9px; font-size:13px; border-radius:8px; }
  .sw-lab { display:block; font-family: var(--fuente-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color: var(--texto-tenue); margin-bottom:3px; }
  .sw-nota { font-size:13px; color: var(--texto-suave); font-style:italic; margin:6px 0 0; }
  .sw-bloque { margin-top:9px; }
  .sw-bloque h4 { margin:0 0 4px; font-size:11px; font-family: var(--fuente-mono); text-transform:uppercase; letter-spacing:.06em; color: var(--texto-tenue); }
  .sw-bloque ul { margin:0 0 0 17px; padding:0; }
  .sw-bloque li { font-size:13.5px; color: var(--texto); margin:2px 0; }
  .sw-bloque li b { color: var(--navy); font-weight:600; }
  .sw-chip { font-family: var(--fuente-mono); font-size:11px; background: var(--crema-media); color: var(--texto-suave); border-radius:6px; padding:2px 7px; margin-left:5px; }
  .sw-avisos { background:#fff8e6; border:1px solid #f0d98a; color:#7a5c00; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .sw-avisos ul { margin:6px 0 0 18px; padding:0; }
  .sw-resumen { font-size:14.5px; color: var(--navy); margin:0 0 12px; }
  .sw-barra { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .sw-radios { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .sw-radios label { display:flex; align-items:center; gap:6px; margin:0; font-weight:400; font-size:13.5px; }
  .sw-radios input { width:auto; }
  .sw-file { padding:8px; background:#fff; }
  .sw-sep { border:none; border-top:1px solid var(--linea); margin:22px 0 18px; }

  /* feedback */
  .fb-atleta { border:1px solid var(--linea); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .fb-atleta .fb-nom { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .fb-atleta .fb-nom strong { font-size:15px; color: var(--navy); }
  .fb-metrics { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .fb-metric { background: var(--crema-media); border-radius:8px; padding:5px 10px; font-size:13px; color: var(--texto); }
  .fb-metric b { color: var(--navy); }
  .fb-txt { font-size:13px; color: var(--texto); margin:2px 0; }
  .fb-txt span { color: var(--texto-tenue); font-family: var(--fuente-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; margin-right:6px; }
  .fb-tiempos { margin-top:6px; }
  .fb-tiempos .fb-ej { font-size:13px; color: var(--navy); }
  .fb-tiempos .fb-serie { display:inline-block; font-family: var(--fuente-mono); font-size:12px; background: var(--azul-suave); color: var(--azul-oscuro); border-radius:6px; padding:2px 7px; margin:2px 4px 2px 0; }
  .sin-registro { color: var(--texto-tenue); font-size:13px; font-style:italic; }

  /* observaciones privadas (solo staff) */
  .aviso-privado { background:#fff8e6; border:1px solid #f0d98a; color:#7a5c00; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .aviso-privado strong { color:#5c4600; }
  .nota { border:1px solid var(--linea); border-radius:12px; padding:10px 14px; margin-bottom:10px; background:#fff; }
  .nota-meta { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .nota-meta span { font-family: var(--fuente-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color: var(--texto-tenue); }
  .nota-borrar { border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); border-radius:8px; padding:4px 9px; font-size:12px; cursor:pointer; }
  .nota-borrar:hover { border-color:#b3261e; color:#b3261e; }
  .nota-txt { font-size:14px; color: var(--texto); white-space:pre-wrap; }

  @media (max-width:760px){
    .layout { flex-direction:column; }
    .side { position:static; flex-basis:auto; width:100%; }
    .side nav { flex-direction:row; overflow-x:auto; }
    .side nav a { white-space:nowrap; }
    .grid2, .grid3 { grid-template-columns:1fr; }
    .sw-dia-campos { grid-template-columns:1fr; }
    .filas-cab { display:none; }
    .fila-l1 { grid-template-columns:1fr 1fr; }
    .fila-l2 { padding-right:0; }
    .editor-fila { border:1px solid var(--linea); border-radius:10px; padding:8px; background:#fff; }
    .editor-fila .mini-x { grid-column: span 2; width:100%; }
  }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="en-wrap" id="en-wrap"><p class="intro">Cargando…</p></div>
</div>

<datalist id="etiquetas-dl">
  <option value="Calentamiento"></option>
  <option value="Parte principal"></option>
  <option value="Vuelta a la calma"></option>
</datalist>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('en-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  // ---------- constantes ----------
  var TIPOS = [['pista','Pista'],['gym','Gimnasio'],['continuo','Rodaje / continuo'],['activacion','Activación'],['competicion','Competición'],['descanso','Descanso']];
  var ROLES = [['calidad_fuerte','Calidad fuerte'],['secundaria','Secundaria'],['activacion','Activación'],['ultimo_toque_48h','Último toque (48h)'],['descarga','Descarga'],['competicion','Competición']];

  // ---------- listas cerradas (para que no haya erratas) ----------
  // Calzado: se guarda el texto completo; en sitios estrechos se pinta la abreviatura (Z / C).
  var CALZADO = [
    { valor:'Zapatillas', corto:'Z' },
    { valor:'Clavos', corto:'C' },
    { valor:'Zapatillas de gimnasio', corto:'ZG' },
    { valor:'Descalzo', corto:'D' }
  ];
  // Lo que puede escribir el entrenador (texto pegado o CSV) → valor de la lista
  var SINON_CALZADO = {
    'z':'Zapatillas', 'zapatillas':'Zapatillas', 'zapatilla':'Zapatillas', 'zapas':'Zapatillas',
    'c':'Clavos', 'clavos':'Clavos', 'clavo':'Clavos', 'spikes':'Clavos',
    'zg':'Zapatillas de gimnasio', 'zapatillas de gimnasio':'Zapatillas de gimnasio', 'zapatillas gimnasio':'Zapatillas de gimnasio', 'zapatillas de gym':'Zapatillas de gimnasio',
    'd':'Descalzo', 'descalzo':'Descalzo', 'descalzos':'Descalzo', 'pies descalzos':'Descalzo'
  };
  // Material de natación: se pueden elegir VARIOS a la vez (p. ej. tabla + aletas)
  var MATERIAL = ['Tabla','Pull-buoy','Palas','Aletas','Manoplas','Snorkel frontal','Goma elástica','Sin material'];
  var SINON_MATERIAL = {
    'tabla':'Tabla', 'tablas':'Tabla',
    'pull buoy':'Pull-buoy', 'pullbuoy':'Pull-buoy', 'pull-buoy':'Pull-buoy', 'pull':'Pull-buoy', 'buoy':'Pull-buoy',
    'palas':'Palas', 'pala':'Palas',
    'aletas':'Aletas', 'aleta':'Aletas',
    'manoplas':'Manoplas', 'manopla':'Manoplas',
    'snorkel frontal':'Snorkel frontal', 'snorkel':'Snorkel frontal', 'tubo frontal':'Snorkel frontal',
    'goma elastica':'Goma elástica', 'goma':'Goma elástica', 'gomas':'Goma elástica', 'elastico':'Goma elástica',
    'sin material':'Sin material', 'nada':'Sin material'
  };
  function calzadoCorto(v){
    for(var i=0;i<CALZADO.length;i++) if(CALZADO[i].valor===v) return CALZADO[i].corto;
    return v||'';
  }
  // 'Z', 'clavos', 'ZAPATILLAS'… → valor de la lista, o '' si no es calzado
  function resolverCalzado(txt){
    var n = norm(txt).replace(/[.:]/g,'').trim();
    return SINON_CALZADO[n] || '';
  }
  // 'tabla + aletas', 'Palas, manoplas' → ['Tabla','Aletas'] · [] si no es material
  function resolverMaterial(txt){
    var trozos = String(txt||'').split(/\s*[+,/·;&]\s*|\s+y\s+/i);
    var out = [], vistos = {};
    for(var i=0;i<trozos.length;i++){
      var t = trozos[i].trim(); if(!t) continue;
      var v = SINON_MATERIAL[norm(t).replace(/[.:]/g,'').trim()];
      if(!v) return [];                       // si algo no está en la lista, no es material
      if(!vistos[v]){ vistos[v] = true; out.push(v); }
    }
    return out;
  }
  // '80% RM', '75 %rm' → es carga, no ritmo
  function esCarga(txt){ return /%\s*rm\b/i.test(sinTildes(String(txt||''))); }

  function optsPares(pares, sel, vacio){
    var o = '<option value="">'+(vacio||'—')+'</option>';
    pares.forEach(function(p){ o += '<option value="'+p[0]+'"'+(String(sel)===p[0]?' selected':'')+'>'+esc(p[1])+'</option>'; });
    return o;
  }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function diaSemana(iso){ if(!iso) return null; var d=new Date(iso+'T00:00:00'); return ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]; }

  // ---------- texto y fechas ----------
  function sinTildes(s){ s = (s==null?'':String(s)); try { return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); } catch(e){ return s; } }
  function norm(s){ return sinTildes(s).toLowerCase().replace(/\s+/g,' ').trim(); }
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  function addDias(iso, n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  function difDias(isoA, isoB){ return Math.round((new Date(isoA+'T00:00:00') - new Date(isoB+'T00:00:00'))/86400000); }
  var todayISO = isoDe(new Date());

  // ---------- datos base ----------
  var MIS_GRUPOS = [], MIS_ATLETAS = [], EJERCICIOS = [];
  try { var g = await sb.from('grupos').select('id,nombre,seccion,horario,descripcion').eq('entrenador_id', perfil.id).order('nombre'); if(!g.error && g.data) MIS_GRUPOS = g.data; } catch(e){}
  try { var a = await sb.from('atletas').select('id,nombre,apellidos,categoria,estado,grupo_id').eq('entrenador_id', perfil.id).order('apellidos'); if(!a.error && a.data) MIS_ATLETAS = a.data; } catch(e){}
  try { var e = await sb.from('ejercicios').select('nombre,nombre_corto,categoria,tipo').eq('activo', true).order('categoria').order('nombre'); if(!e.error && e.data) EJERCICIOS = e.data; } catch(e){}

  function nombreGrupo(id){ for(var i=0;i<MIS_GRUPOS.length;i++) if(MIS_GRUPOS[i].id===id) return MIS_GRUPOS[i].nombre; return ''; }
  function nombreAtleta(x){ return ((x.nombre||'')+' '+(x.apellidos||'')).trim(); }
  function atletasDeGrupo(grupoId){ return MIS_ATLETAS.filter(function(x){ return x.grupo_id===grupoId; }); }
  // ¿El grupo entrena en el agua? Se mira la sección del grupo (natacion,
  // escuela-natacion, triatlon) y, si no, su nombre. Solo sirve para DEJAR
  // MARCADA por defecto la casilla de material: el entrenador siempre puede
  // marcarla o desmarcarla a mano, porque no hay un tipo «natación» en la base.
  function grupoEsDeAgua(grupoId){
    for(var i=0;i<MIS_GRUPOS.length;i++){
      if(MIS_GRUPOS[i].id===grupoId){
        var t = norm((MIS_GRUPOS[i].seccion||'')+' '+(MIS_GRUPOS[i].nombre||''));
        return /nataci|triatl|acuat|piscina|agua/.test(t);
      }
    }
    return false;
  }

  // ---------- mejores marcas de mis atletas ----------
  // MARCAS = { atleta_id: { 'nombre de prueba': {valor, disp, fecha} } }  ← ya filtrado a la MEJOR de cada prueba
  var MARCAS = {}, MAS_MEJOR = {};
  function numMarca(s){
    if(s==null) return null;
    s = String(s).trim().replace(',', '.');
    if(s.indexOf(':')>-1){ var p=s.split(':'); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); }
    var n = parseFloat(s); return isNaN(n) ? null : n;
  }
  function valorMarca(m){ var v = (m.tiempo_segundos!=null) ? Number(m.tiempo_segundos) : numMarca(m.tiempo_display); return (v==null||isNaN(v)) ? null : v; }
  // En saltos y lanzamientos MÁS es mejor; en carreras, menos.
  function masEsMejor(prueba){
    if(MAS_MEJOR[prueba]!==undefined) return MAS_MEJOR[prueba];
    return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(prueba||'');
  }
  function mejoresMarcasDe(atletaId, tope){
    var pa = MARCAS[atletaId]; if(!pa) return [];
    return Object.keys(pa).map(function(p){ return { prueba:p, disp:pa[p].disp, fecha:pa[p].fecha }; })
      .sort(function(a,b){ return (a.fecha||'') > (b.fecha||'') ? -1 : 1; })
      .slice(0, tope||4);
  }

  try { var pc = await sb.from('pruebas').select('nombre,mas_es_mejor').eq('activa', true); if(!pc.error && pc.data) pc.data.forEach(function(p){ MAS_MEJOR[p.nombre] = !!p.mas_es_mejor; }); } catch(e){}
  if(MIS_ATLETAS.length){
    try {
      var mr = await sb.from('marcas_atleta').select('atleta_id,prueba,tiempo_segundos,tiempo_display,fecha').in('atleta_id', MIS_ATLETAS.map(function(x){ return x.id; })).limit(2000);
      if(!mr.error && mr.data) mr.data.forEach(function(m){
        var v = valorMarca(m);
        if(v==null || !m.prueba || !m.atleta_id) return;
        var pa = MARCAS[m.atleta_id] = MARCAS[m.atleta_id] || {};
        var ya = pa[m.prueba];
        var mejor = !ya || (masEsMejor(m.prueba) ? v > ya.valor : v < ya.valor);
        if(mejor) pa[m.prueba] = { valor: v, disp: (m.tiempo_display || String(v)), fecha: m.fecha || '' };
      });
    } catch(e){}
  }

      '</nav></aside>'+
      '<main class="cont">'+
        '<section id="sec-grupo"></section>'+
        '<section id="sec-semana" hidden></section>'+
        '<section id="sec-planificar" hidden></section>'+
        '<section id="sec-feedback" hidden></section>'+
        '<section id="sec-notas" hidden></section>'+
      '</main>'+
    '</div>';

  var navLinks = wrap.querySelectorAll('.side nav a');
  navLinks.forEach(function(link){ link.addEventListener('click', function(){
    navLinks.forEach(function(x){ x.classList.remove('activo'); }); link.classList.add('activo');
    ['grupo','semana','planificar','feedback','notas'].forEach(function(sec){ $('sec-'+sec).hidden = (sec!==link.getAttribute('data-sec')); });
  }); });

  // ============================================================
  // SECCIÓN 1 · MI GRUPO
  // ============================================================
  (function renderMiGrupo(){
    var cont = $('sec-grupo');
    if(!MIS_GRUPOS.length){ cont.innerHTML = '<div class="tarjeta"><h2>Mi grupo</h2><p class="vacio">Aún no tienes grupos a tu cargo. Cuando el club te asigne como entrenador de un grupo, aparecerá aquí con sus atletas.</p></div>'; return; }
    var html = '';
    MIS_GRUPOS.forEach(function(gr){
      var atls = MIS_ATLETAS.filter(function(x){ return x.grupo_id===gr.id; });
      var sub = [gr.seccion, gr.horario].filter(Boolean).map(function(s){ return esc(s); }).join(' · ');
      var tabla;
      if(atls.length){
        tabla = '<table><thead><tr><th>Atleta</th><th>Categoría</th><th>Estado</th><th>Mejores marcas</th></tr></thead><tbody>'+
          atls.map(function(x){
            var est = x.estado||''; var cls = (est==='activo'?'activo':est==='lesionado'?'lesionado':est==='prueba'?'prueba':'');

                  return '<span title="'+escAttr(m.prueba+(m.fecha?' · '+formatFecha(m.fecha):''))+'">'+esc(m.prueba)+' '+esc(m.disp)+'</span>';
                }).join('')+'</div>'
              : '<span class="mrc-no">Sin marcas registradas</span>';
            return '<tr><td>'+esc((x.nombre||'')+' '+(x.apellidos||''))+'</td><td>'+esc(x.categoria||'')+'</td><td><span class="pill '+cls+'">'+esc(est||'—')+'</span></td><td>'+celdaMarcas+'</td></tr>';
          }).join('')+'</tbody></table>'+
          '<p class="pista">Se muestra la <strong>mejor marca de cada prueba</strong> (las cuatro más recientes). Son las marcas con las que se calculan los tiempos objetivo cuando pones el ritmo en porcentaje.</p>';
      } else {
        tabla = '<p class="vacio">Sin atletas visibles en este grupo todavía.</p>';
      }
      html += '<div class="tarjeta"><h2>'+esc(gr.nombre)+'</h2>'+(sub?'<p class="vacio" style="margin-top:-6px;margin-bottom:12px;">'+sub+'</p>':'')+tabla+'</div>';
    });
    cont.innerHTML = html;
  })();

  // ============================================================
  // DESTINATARIOS DE UNA SESIÓN (columna sesiones.atletas_ids)
  // ------------------------------------------------------------
  //   atletas_ids = null   -> la ve todo el grupo
  //   atletas_ids = [ids]  -> la ven SOLO esos atletas; el resto
  //                           del grupo no la ve en su zona.
  // Los dos apartados (Planificar entreno y Planificar semana)
  // usan el mismo control; se distinguen por el prefijo del id
  // ('pl' para el editor manual, 'sw' para la semana entera).
  // ============================================================
  function cajaDestHTML(pref, pregunta){
    return '<div class="dest" id="'+pref+'-dest">'+
      '<label>'+esc(pregunta)+'</label>'+
      '<div class="sw-radios">'+
        '<label><input type="radio" name="'+pref+'-dest-modo" value="grupo" checked> Todo el grupo</label>'+
        '<label><input type="radio" name="'+pref+'-dest-modo" value="algunos"> Solo estos atletas</label>'+
      '</div>'+
      '<div id="'+pref+'-dest-caja" hidden>'+
        '<div class="dest-barra">'+
          '<button type="button" class="btn-mini" id="'+pref+'-dest-todos">Marcar todos</button>'+
          '<button type="button" class="btn-mini" id="'+pref+'-dest-ninguno">Desmarcar todos</button>'+
        '</div>'+
        '<div class="dest-lista" id="'+pref+'-dest-lista"></div>'+
        '<p class="dest-aviso">Marca solo a quien va dirigido. <strong>El resto del grupo NO lo verá</strong> en su zona de atleta.</p>'+
      '</div>'+
      '<p class="pista" id="'+pref+'-dest-resumen"></p>'+
    '</div>';
  }

  function pintarListaDest(pref, grupoId, seleccion){
    var cont = $(pref+'-dest-lista'); if(!cont) return;
    var atls = atletasDeGrupo(grupoId);
    var sel = {}; (seleccion||[]).forEach(function(id){ sel[id] = true; });
    if(!atls.length){ cont.innerHTML = '<p class="vacio">Este grupo no tiene atletas visibles todavía.</p>'; return; }
    cont.innerHTML = atls.map(function(x){
      return '<label><input type="checkbox" class="dest-chk" value="'+x.id+'"'+(sel[x.id]?' checked':'')+'>'+esc(nombreAtleta(x))+'</label>';
    }).join('');
  }

  function modoDest(pref){ var r = document.querySelector('input[name="'+pref+'-dest-modo"]:checked'); return r ? r.value : 'grupo'; }
  function idsMarcadosDest(pref){
    var out = [], c = $(pref+'-dest-lista'); if(!c) return out;
    c.querySelectorAll('.dest-chk').forEach(function(i){ if(i.checked) out.push(i.value); });
    return out;
  }
  // Deja el control en el estado que corresponde a unos atletas_ids concretos
  function aplicarDest(pref, grupoId, ids){
    var lista = (ids && ids.length) ? ids : null;
    var r = document.querySelector('input[name="'+pref+'-dest-modo"][value="'+(lista?'algunos':'grupo')+'"]');
    if(r) r.checked = true;
    pintarListaDest(pref, grupoId, lista || []);
  }
  // Lee lo elegido: {ids:null} = todo el grupo · {ids:[…]} = solo esos · {error:'…'}
  function leerDest(pref){
    if(modoDest(pref) !== 'algunos') return { ids: null };
    var ids = idsMarcadosDest(pref);
    if(!ids.length) return { error: 'Has elegido «Solo estos atletas» pero no has marcado a nadie. Marca al menos un atleta o vuelve a «Todo el grupo».' };
    return { ids: ids };
  }
  function textoDest(pref, singular){
    if(modoDest(pref) !== 'algunos') return 'Ahora mismo '+(singular?'la sesión la verán':'las sesiones las verán')+' todos los atletas del grupo.';
    var n = idsMarcadosDest(pref).length;
    if(!n) return 'No has marcado a ningún atleta todavía.';
    return 'Dirigid'+(singular?'a':'as')+' solo a '+n+' atleta(s): el resto del grupo no '+(singular?'la verá':'las verá')+'.';
  }
  // Conecta los botones y radios; devuelve la función que refresca el estado visible
  function conectarDest(pref, singular, alCambiar){
    function refrescar(){
      $(pref+'-dest-caja').hidden = (modoDest(pref) !== 'algunos');
      $(pref+'-dest-resumen').textContent = textoDest(pref, singular);
      if(alCambiar) alCambiar();
    }
    document.querySelectorAll('input[name="'+pref+'-dest-modo"]').forEach(function(r){ r.addEventListener('change', refrescar); });
    $(pref+'-dest-lista').addEventListener('change', refrescar);
    $(pref+'-dest-todos').addEventListener('click', function(){ $(pref+'-dest-lista').querySelectorAll('.dest-chk').forEach(function(i){ i.checked = true; }); refrescar(); });
    $(pref+'-dest-ninguno').addEventListener('click', function(){ $(pref+'-dest-lista').querySelectorAll('.dest-chk').forEach(function(i){ i.checked = false; }); refrescar(); });
    refrescar();
    return refrescar;
  }

  // Texto de ayuda sobre los ritmos en % (se usa en varios sitios)
  var PISTA_RITMO_HTML = 'En la columna <strong>Ritmo</strong>: si escribes un porcentaje (<code>90%</code> o <code>90-95%</code>) y la distancia va en metros (<code>60 m</code>), '+
    '<strong>cada atleta verá su propio tiempo objetivo</strong>, calculado con su mejor marca en esa distancia. '+
    'Si escribes un ritmo fijo (<code>4:10 min/km</code>, <code>7.9 s</code>), todos verán exactamente lo mismo.';

  // ============================================================
  // SECCIÓN 2 · PLANIFICAR ENTRENO
  // ============================================================
  var editandoId = null;        // id de sesión en edición (null = nueva)
  var refrescarDestPl = null;   // se asigna al pintar el formulario

  function filtroActual(){ var f=$('ej-filtro'); return f?f.value:''; }

  // Busca por nombre, categoría y tipo; tolera acentos y palabras sueltas
  // ("tacos salida" encuentra "Salidas desde tacos").
  function casaEjercicio(ej, filtro){
    var f = norm(filtro);
    if(!f) return true;
    var heno = norm((ej.nombre||'')+' '+(ej.categoria||'')+' '+(ej.tipo||'')+' '+(ej.nombre_corto||''));
    var palabras = f.split(' ');
    for(var i=0;i<palabras.length;i++){ if(heno.indexOf(palabras[i])===-1) return false; }
    return true;
  }

  function buscarEjercicios(filtro, limite){
    var res=[];
    for(var i=0;i<EJERCICIOS.length && res.length<(limite||60); i++){ if(casaEjercicio(EJERCICIOS[i], filtro)) res.push(EJERCICIOS[i]); }
    return res;
  }

  function opcionesEjercicios(filtro, seleccionado){
    var porCat={};
    EJERCICIOS.forEach(function(ej){
      if(casaEjercicio(ej, filtro) || ej.nombre===seleccionado){ var c=ej.categoria||'otros'; (porCat[c]=porCat[c]||[]).push(ej); }
    });
    var html='<option value="">— elige ejercicio —</option>';
    Object.keys(porCat).sort().forEach(function(cat){
      html+='<optgroup label="'+esc(cat)+'">';
      porCat[cat].forEach(function(ej){ html+='<option'+(ej.nombre===seleccionado?' selected':'')+'>'+esc(ej.nombre)+'</option>'; });
      html+='</optgroup>';
    });
    // si el seleccionado no está en la biblioteca (texto libre antiguo), lo añadimos suelto
    if(seleccionado){ var existe=EJERCICIOS.some(function(ej){return ej.nombre===seleccionado;}); if(!existe) html+='<option selected>'+esc(seleccionado)+'</option>'; }
    return html;
  }

  var CALZADO_OPTS = '<option value="">— calzado —</option>' +
    CALZADO.map(function(c){ return '<option value="'+escAttr(c.valor)+'">'+esc(c.valor)+' ('+esc(c.corto)+')</option>'; }).join('');

  function materialHTML(){
    return '<div class="f-material-caja"><span class="mat-tit">Material</span>'+
      MATERIAL.map(function(m){
        return '<label class="mat-op"><input type="checkbox" class="f-material-chk" value="'+escAttr(m)+'"><span>'+esc(m)+'</span></label>';
      }).join('')+'</div>';
  }

  function nuevaFila(filasCont, data){
    data = data||{};
    var div=document.createElement('div'); div.className='editor-fila';
    div.innerHTML =
      '<div class="fila-l1">'+
        '<select class="f-ejercicio"></select>'+
        '<input class="f-series" placeholder="series">'+
        '<input class="f-distancia" placeholder="distancia">'+
        '<input class="f-ritmo" placeholder="ritmo">'+
        '<input class="f-descanso" placeholder="rec">'+
        '<div class="f-cel-cz">'+
          '<select class="f-calzado">'+CALZADO_OPTS+'</select>'+
          '<input class="f-carga" placeholder="carga (80% RM)">'+
        '</div>'+
        '<button type="button" class="mini-x" title="Quitar fila">×</button>'+
      '</div>'+
      '<div class="fila-l2">'+
        '<input class="f-detalle" placeholder="detalle">'+
        '<input class="f-observaciones" placeholder="observaciones (objetivos por atleta, matices…)">'+
        materialHTML()+
      '</div>';
    filasCont.appendChild(div);
    var sel=div.querySelector('.f-ejercicio');
    sel.innerHTML=opcionesEjercicios(filtroActual(), data.ejercicio||'');
    if(data.ejercicio) sel.value=data.ejercicio;
    div.querySelector('.f-series').value=data.series||'';
    div.querySelector('.f-distancia').value=data.distancia||'';
    div.querySelector('.f-ritmo').value=data.ritmo||'';
    div.querySelector('.f-descanso').value=data.descanso||'';
    div.querySelector('.f-detalle').value=data.detalle||'';
    div.querySelector('.f-carga').value=data.carga||'';
    div.querySelector('.f-observaciones').value=data.observaciones||'';
    // calzado: si viene un valor antiguo que no está en la lista, se añade suelto para no perderlo
    var selCz = div.querySelector('.f-calzado');
    if(data.calzado){
      var hay = false;
      selCz.querySelectorAll('option').forEach(function(o){ if(o.value===data.calzado) hay = true; });
      if(!hay) selCz.innerHTML += '<option value="'+escAttr(data.calzado)+'">'+esc(data.calzado)+'</option>';
      selCz.value = data.calzado;
    }
    var mats = Array.isArray(data.material) ? data.material : (data.material ? [data.material] : []);
    if(mats.length){
      div.querySelectorAll('.f-material-chk').forEach(function(chk){ if(mats.indexOf(chk.value)>-1) chk.checked = true; });
    }
    div.querySelector('.mini-x').addEventListener('click', function(){ if(FILA_ACTIVA===div) FILA_ACTIVA=null; div.remove(); });
    // marcar como "fila activa" para poder insertarle ejercicios desde el buscador
    div.addEventListener('focusin', function(){ marcarFilaActiva(div); });
    div.addEventListener('mousedown', function(){ marcarFilaActiva(div); });
    if(!FILA_ACTIVA || !document.body.contains(FILA_ACTIVA)) marcarFilaActiva(div);
    return div;
  }

  var FILA_ACTIVA = null;
  function marcarFilaActiva(div){
    if(FILA_ACTIVA && FILA_ACTIVA!==div) FILA_ACTIVA.classList.remove('fila-activa');
    FILA_ACTIVA = div;
    div.classList.add('fila-activa');
  }

  // Mete un ejercicio del buscador en la fila activa (o crea una nueva al final)
  function insertarEjercicioEnFila(nombre){
    var fila = FILA_ACTIVA;
    if(fila && !document.body.contains(fila)) fila = null;
    if(fila){
      var sel = fila.querySelector('.f-ejercicio');
      if(sel.value){ // la fila ya tiene ejercicio: añadimos una fila nueva en su mismo bloque
        var bloque = fila.closest('.editor-bloque');
        fila = nuevaFila(bloque.querySelector('.filas-cont'), {});
        marcarFilaActiva(fila);
      }
    }
    if(!fila){
      var bloques = $('bloques-cont').querySelectorAll('.editor-bloque');
      var ultimo = bloques.length ? bloques[bloques.length-1] : nuevoBloque({ etiqueta:'Parte principal' });
      fila = nuevaFila(ultimo.querySelector('.filas-cont'), {});
      marcarFilaActiva(fila);
    }
    var s = fila.querySelector('.f-ejercicio');
    s.innerHTML = opcionesEjercicios(filtroActual(), nombre);
    s.value = nombre;
    fila.querySelector('.f-series').focus();
    return fila;
  }

  function nuevoBloque(data){
    data = data||{};
    var cont = $('bloques-cont');
    var div=document.createElement('div'); div.className='editor-bloque';
    div.innerHTML =
      '<div class="b-cab"><input class="b-etiqueta" list="etiquetas-dl" placeholder="Etiqueta del bloque (Velocidad máxima, Fuerza / potencia…)">'+
        '<input class="b-matiz" placeholder="Matiz (lo que va tras el guion: «Calidad pura»)">'+
        '<button type="button" class="mini-x b-quitar" title="Quitar bloque">×</button></div>'+
      '<div class="filas-cab"><span>Ejercicio</span><span class="cab-series">Series</span><span>Distancia</span><span>Ritmo</span><span>Rec</span><span class="cab-cz">Calzado</span><span></span></div>'+
      '<div class="filas-cont"></div>'+
      '<div style="margin-top:8px;"><button type="button" class="btn-mini b-add-fila">+ Añadir fila</button></div>';
    cont.appendChild(div);
    div.querySelector('.b-etiqueta').value = data.etiqueta||'';
    div.querySelector('.b-matiz').value = data.matiz||'';
    var filasCont = div.querySelector('.filas-cont');
    div.querySelector('.b-quitar').addEventListener('click', function(){ div.remove(); });
    div.querySelector('.b-add-fila').addEventListener('click', function(){ nuevaFila(filasCont, {}); });
    var filas = Array.isArray(data.filas)?data.filas:[];
    if(filas.length){ filas.forEach(function(f){ nuevaFila(filasCont, f); }); }
    else { nuevaFila(filasCont, {}); }
    aplicarModoFilas();
    return div;
  }

  // ------------------------------------------------------------
  // Las columnas se adaptan al tipo de sesión:
  //   gym                          -> Carga (% RM), sin Calzado
  //   pista / continuo / activación-> Calzado y Rec, sin Carga
  // El material de natación es un interruptor aparte (ver más abajo).
  // ------------------------------------------------------------
  function aplicarModoFilas(){
    var cont = $('bloques-cont'); if(!cont) return;

          var el = fe.querySelector('.f-'+k); if(!el) return;
          var v = el.value.trim(); if(v) f[k]=v;
        });
        var mats = [];
        fe.querySelectorAll('.f-material-chk').forEach(function(chk){ if(chk.checked) mats.push(chk.value); });

      }
    });

  }

  // ============================================================
  // SECCIÓN 2b · PLANIFICAR UNA SEMANA ENTERA
  // ------------------------------------------------------------
  // Cuatro caminos que terminan todos en la MISMA previsualización
  // y en el mismo botón de guardado:
  //   A) pegar la semana escrita en texto plano
  //   B) importar un CSV (con plantilla descargable)
  //   C) duplicar una semana ya creada a otro grupo u otra fecha
  //   D) aplicar una plantilla de semana guardada
  // Nunca se escribe en la base de datos sin pasar antes por la
  // previsualización. El guardado va en lote (un solo insert).
  // ============================================================

  var DIAS_CLAVE = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
  var DIAS_TXT   = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];

  function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
  function mapaNorm(pares){ var m={}; Object.keys(pares).forEach(function(k){ m[norm(k).replace(/_/g,' ')] = pares[k]; }); return m; }

  // Sinónimos aceptados al interpretar. A la izquierda lo que puede
  // escribir el entrenador, a la derecha el valor que admite la base
  // de datos (los CHECK de la tabla sesiones).
  var SINON_TIPO = mapaNorm({
    'pista':'pista','track':'pista','atletismo':'pista','series':'pista','entreno de pista':'pista',
    'gym':'gym','gimnasio':'gym','pesas':'gym','sala':'gym','fuerza':'gym','musculacion':'gym',
    'continuo':'continuo','rodaje':'continuo','carrera continua':'continuo','aerobico':'continuo','rodar':'continuo',
    'activacion':'activacion',
    'competicion':'competicion','competi':'competicion','compe':'competicion','control':'competicion',
    'descanso':'descanso','descansa':'descanso','libre':'descanso','off':'descanso','reposo':'descanso'
  });
  var SINON_ROL = mapaNorm({
    'calidad_fuerte':'calidad_fuerte','calidad fuerte':'calidad_fuerte','calidad':'calidad_fuerte','fuerte':'calidad_fuerte',
    'secundaria':'secundaria','secundario':'secundaria','sesion secundaria':'secundaria',
    'activacion':'activacion',
    'ultimo_toque_48h':'ultimo_toque_48h','ultimo toque':'ultimo_toque_48h','ultimo toque 48h':'ultimo_toque_48h','48h':'ultimo_toque_48h','toque':'ultimo_toque_48h',
    'descarga':'descarga','regenerativo':'descarga','recuperacion':'descarga',
    'competicion':'competicion'
  });
  var ETIQ_BLOQUE = ['calentamiento','parte principal','principal','parte central','vuelta a la calma','vuelta calma','core','gimnasio','gym','fuerza','tecnica','estiramientos','activacion','trabajo especifico','preventivo'];

  // ---------- intérprete de texto ----------
  function detectaDia(txt){
    var n = sinTildes(txt).toLowerCase();
    for(var i=0;i<7;i++){
      var d = DIAS_CLAVE[i];
      if(n.indexOf(d)===0){
        var sig = n.charAt(d.length);
        if(sig==='' || /[^a-z0-9]/.test(sig)) return { idx:i, resto: txt.slice(d.length) };
      }
    }
    return null;
  }

  function aplicarCabecera(ses, resto){
    resto = String(resto||'').replace(/^[\s:·•|,.\-–—]+/,'').trim();
    if(!resto) return;
    resto.split(/\s*[·•|]\s*|\s+[–—]\s+|\s+-\s+/).forEach(function(p){
      p = p.trim(); if(!p) return;
      var np = norm(p).replace(/[()]/g,'').replace(/_/g,' ').trim();
      if(/^\d{1,2}\s*(\/|-|\.|de\s)/.test(np)) return;   // "4 de agosto", "04/08" → es la fecha, ya la sabemos
      if(SINON_TIPO[np] && !ses.tipo){ ses.tipo = SINON_TIPO[np]; return; }
      if(SINON_ROL[np] && !ses.rol){ ses.rol = SINON_ROL[np]; return; }
      ses.titulo = (ses.titulo ? ses.titulo+' · ' : '') + p;
    });
  }

  // Un encabezado de bloque: "VELOCIDAD MÁXIMA — Calidad pura" → etiqueta + matiz
  function bloqueDeEncabezado(texto){
    var t = String(texto||'').replace(/\s*:\s*$/,'').trim();
    var b = { etiqueta: t, filas: [] };
    var m = t.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    if(m){ b.etiqueta = m[1].trim(); b.matiz = m[2].trim(); }
    return b;
  }

  // Una fila de entreno:
  //   pista:    "Salidas desde tacos | 3x30m | rec 3-4' | C | obs: Máxima aceleración"
  //   gimnasio: "Cargada completa | 3x2 | 80% RM | obs: Sin llegar a fallo"
  function parseFila(texto){
    var bruto = String(texto||'').trim();
    var partes = bruto.split('|');
    if(partes.length===1 && bruto.indexOf(' · ')>-1) partes = bruto.split(' · ');
    if(partes.length===1 && bruto.indexOf(';')>-1) partes = bruto.split(';');
    partes = partes.map(function(x){ return x.trim(); }).filter(function(x){ return x!==''; });
    var f = { ejercicio: partes.shift() || bruto }, sobra = [];
    partes.forEach(function(p){
      var np = norm(p);
      // observaciones: "obs: ..." / "observaciones: ..." (puede llevar · dentro, se respeta entero)
      var mo = p.match(/^(obs|observacion(?:es)?)\s*[:.\-–—]\s*(.*)$/i);
      if(mo){ var tx = mo[2].trim() || p; f.observaciones = f.observaciones ? f.observaciones+' · '+tx : tx; return; }
      // carga de gimnasio: cualquier cosa con "% RM" (o etiquetada "carga:")
      if(!f.carga && (esCarga(p) || /^carga\s*[:.]/i.test(np))){
        f.carga = p.replace(/^carga\s*[:.]?\s*/i,'').trim() || p; return;
      }
      // calzado: Z, C, zapatillas, clavos, descalzo… (lista cerrada)
      if(!f.calzado){ var cz = resolverCalzado(p); if(cz){ f.calzado = cz; return; } }
      // material de natación: uno o varios ("tabla + aletas")
      if(!f.material){ var mat = resolverMaterial(p); if(mat.length){ f.material = mat; return; } }
      var mm = p.match(/^(\d{1,3})\s*[x×]\s*(.*)$/i);
      if(mm && !f.series){ f.series = mm[1]; var d = mm[2].trim(); if(d) f.distancia = d; return; }
      if(!f.ritmo && (/%/.test(p) || /\britmo\b/.test(np))){ f.ritmo = p.replace(/^ritmo\s*[:.]?\s*/i,'').trim() || p; return; }
      if(!f.descanso && (/^(desc|rec|r)\b/.test(np) || /\bdescanso\b|\bpausa\b/.test(np))){
        f.descanso = p.replace(/^(descansos?|desc\.?|recup\w*|rec\.?|pausa|r)\s*[:.]?\s*/i,'').trim() || p; return;
      }
      if(!f.distancia && /^\d+(?:[.,]\d+)?\s*(m|km|metros)\.?$/.test(np)){ f.distancia = p; return; }
      sobra.push(p);
    });
    if(sobra.length) f.detalle = sobra.join(' · ');
    if(!f.ejercicio) f.ejercicio = bruto;
    return f;
  }

  function interpretarTexto(txt, lunes){
    var lineas = String(txt||'').split(/\r?\n/);
    var mapa = {}, orden = [], avisos = [], ses = null, bloque = null, sueltas = 0;

    function asegurarBloque(){
      if(!bloque){
        bloque = { etiqueta:'Parte principal', filas:[] };
        ses.bloques.push(bloque);
        avisos.push('El '+ses.dia_semana+' tenía ejercicios sin bloque: los he puesto en «Parte principal».');
      }
      return bloque;
    }

    for(var i=0;i<lineas.length;i++){
      var t = lineas[i].replace(/\*\*/g,'').replace(/__/g,'').replace(/^\s+|\s+$/g,'');
      if(!t) continue;

      var marca = '', cuerpo = t;
      var m = t.match(/^(#{1,6}|[-*•·+>]|\d{1,2}[.)])\s+(.+)$/);
      if(m){ marca = m[1]; cuerpo = m[2].trim(); }
      else { var m2 = t.match(/^(#{1,6})\s*(.+)$/); if(m2){ marca = m2[1]; cuerpo = m2[2].trim(); } }

      // ¿línea de día? abre sesión (aunque venga con # o con guion delante)
      var dia = detectaDia(cuerpo);
      if(dia){
        if(mapa[dia.idx]){ ses = mapa[dia.idx]; avisos.push('El '+DIAS_TXT[dia.idx]+' aparece más de una vez: he juntado todo en la misma sesión.'); }
        else { ses = { idx:dia.idx, fecha: addDias(lunes, dia.idx), dia_semana: DIAS_TXT[dia.idx], tipo:'', rol:'', titulo:'', nota_razonamiento:'', bloques:[], incluir:true };
               mapa[dia.idx] = ses; orden.push(dia.idx); }
        bloque = null;
        aplicarCabecera(ses, dia.resto);
        continue;
      }

      if(!ses){ sueltas++; continue; }

      // '#' abre bloque (y lo que vaya tras " — " se guarda como matiz)
      if(marca.charAt(0)==='#'){ bloque = bloqueDeEncabezado(cuerpo); ses.bloques.push(bloque); continue; }

      // nota / objetivo del día
      var mn = cuerpo.match(/^(nota|notas|objetivo|razonamiento|comentario|observaciones)\s*[:·\-–]\s*(.*)$/i);
      if(mn){ ses.nota_razonamiento = (ses.nota_razonamiento ? ses.nota_razonamiento+' ' : '') + mn[2].trim(); continue; }

      // viñeta o número → fila de entreno
      if(marca){ asegurarBloque().filas.push(parseFila(cuerpo)); continue; }

      // sin viñeta: ¿es el título de un bloque? ("Calentamiento:", "Calentamiento", "Fuerza — Máxima")
      var sinDosP = cuerpo.replace(/\s*:\s*$/,'');
      var cand = bloqueDeEncabezado(cuerpo);
      if((/:\s*$/.test(cuerpo) && sinDosP.length<=48) || ETIQ_BLOQUE.indexOf(norm(cuerpo))>-1 || (cand.matiz && ETIQ_BLOQUE.indexOf(norm(cand.etiqueta))>-1)){
        bloque = cand; ses.bloques.push(bloque); continue;
      }

      // no encaja con nada: NO se pierde, entra como ejercicio y se avisa
      asegurarBloque().filas.push({ ejercicio: cuerpo });
      avisos.push('No supe interpretar esta línea del '+ses.dia_semana+' y la he dejado tal cual como ejercicio: «'+cuerpo+'»');
    }

    if(sueltas) avisos.push('Hay '+sueltas+' línea(s) antes del primer día: las he ignorado. Cada sesión tiene que empezar por el nombre del día.');
    orden.sort(function(a,b){ return a-b; });
    var sesiones = orden.map(function(k){ return mapa[k]; });
    sesiones.forEach(function(s){ s.bloques = (s.bloques||[]).filter(function(b){ return (b.filas && b.filas.length) || b.etiqueta; }); });
    return { sesiones: sesiones, avisos: avisos };
  }

  function p2(n){ n = String(parseInt(n,10)); return (n.length<2?'0':'')+n; }
  function fechaDeCSV(v){
    v = String(v||'').trim(); if(!v) return '';
    var m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
    m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(m){ var a = m[3]; if(a.length===2) a = '20'+a; return a+'-'+p2(m[2])+'-'+p2(m[1]); }
    return '';
  }

  function detectarSepCSV(texto){
    var linea = String(texto||'').split(/\r?\n/)[0] || '', fuera = true, c = { ';':0, ',':0, '\t':0 };
    for(var i=0;i<linea.length;i++){ var ch = linea.charAt(i); if(ch==='"') fuera = !fuera; else if(fuera && c[ch]!==undefined) c[ch]++; }
    var mejor = ';';
    if(c[',']>c[mejor]) mejor = ',';
    if(c['\t']>c[mejor]) mejor = '\t';
    return mejor;
  }

  // Parser CSV a mano: respeta comillas dobles y "" escapadas
  function parseCSV(texto){
    texto = String(texto||'').replace(/^\uFEFF/,'');
    var sep = detectarSepCSV(texto), filas = [], fila = [], campo = '', comillas = false;
    for(var i=0;i<texto.length;i++){
      var c = texto.charAt(i);
      if(comillas){
        if(c==='"'){ if(texto.charAt(i+1)==='"'){ campo += '"'; i++; } else comillas = false; }
        else campo += c;
      }
      else if(c==='"'){ comillas = true; }
      else if(c===sep){ fila.push(campo); campo = ''; }
      else if(c==='\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
      else if(c!=='\r'){ campo += c; }
    }
    if(campo!=='' || fila.length){ fila.push(campo); filas.push(fila); }
    return filas.filter(function(f){ return f.some(function(x){ return String(x).trim()!==''; }); });
  }

  function interpretarCSV(texto, lunes){
    var filas = parseCSV(texto), avisos = [];
    if(!filas.length) return { sesiones:[], avisos:['El archivo está vacío.'] };
    var cab = filas.shift().map(function(h){ return ALIAS_CSV[norm(h)] || ''; });
    if(cab.indexOf('ejercicio')===-1 && cab.indexOf('dia')===-1 && cab.indexOf('fecha')===-1){
      return { sesiones:[], avisos:['No reconozco la cabecera del archivo. Descarga la plantilla y usa sus columnas: dia, fecha, tipo, rol, titulo, bloque, matiz, ejercicio, series, distancia, ritmo, rec, calzado, carga, material, observaciones, detalle.'] };
    }
    var mapa = {}, orden = [];
    filas.forEach(function(f, n){
      var r = {};
      cab.forEach(function(k, j){ if(k) r[k] = String(f[j]==null?'':f[j]).trim(); });
      var fecha = fechaDeCSV(r.fecha), idx = -1;
      if(fecha){ idx = difDias(fecha, lunesDe(fecha)); }
      else {
        var d = detectaDia(r.dia||'');
        if(!d){ avisos.push('Fila '+(n+2)+' sin día ni fecha reconocibles: la he saltado.'); return; }
        idx = d.idx; fecha = addDias(lunes, idx);
      }
      var ses = mapa[fecha];
      if(!ses){
        ses = { idx: idx, fecha: fecha, dia_semana: DIAS_TXT[idx] || diaSemana(fecha), tipo:'', rol:'', titulo:'', nota_razonamiento:'', bloques:[], incluir:true };
        mapa[fecha] = ses; orden.push(fecha);
      }
      if(!ses.tipo && r.tipo){ var tp = SINON_TIPO[norm(r.tipo).replace(/_/g,' ')]; if(tp) ses.tipo = tp; else avisos.push('Fila '+(n+2)+': el tipo «'+r.tipo+'» no es válido, lo he dejado vacío.'); }
      if(!ses.rol && r.rol){ var rl = SINON_ROL[norm(r.rol).replace(/_/g,' ')]; if(rl) ses.rol = rl; else avisos.push('Fila '+(n+2)+': el rol «'+r.rol+'» no es válido, lo he dejado vacío.'); }
      if(!ses.titulo && r.titulo) ses.titulo = r.titulo;
      if(r.nota) ses.nota_razonamiento = (ses.nota_razonamiento ? ses.nota_razonamiento+' ' : '') + r.nota;
      if(!r.ejercicio && !r.series && !r.distancia && !r.ritmo && !r.descanso && !r.detalle &&
         !r.calzado && !r.carga && !r.material && !r.observaciones) return;
      var etq = r.bloque || 'Parte principal', bl = null;
      for(var b=0;b<ses.bloques.length;b++){ if(ses.bloques[b].etiqueta===etq) bl = ses.bloques[b]; }
      if(!bl){ bl = { etiqueta: etq, filas: [] }; ses.bloques.push(bl); }
      if(r.matiz && !bl.matiz) bl.matiz = r.matiz;
      var celda = {};
      celda.ejercicio = r.ejercicio || '(sin nombre)';
      ['series','distancia','ritmo','descanso','detalle','carga','observaciones'].forEach(function(k){ if(r[k]) celda[k] = r[k]; });
      // calzado y material son listas cerradas: se traducen, y lo que no esté en la lista
      // no se pierde (se guarda en detalle) y se avisa.
      if(r.calzado){
        var cz = resolverCalzado(r.calzado);
        if(cz) celda.calzado = cz;
        else { celda.detalle = (celda.detalle ? celda.detalle+' · ' : '')+'calzado: '+r.calzado;
               avisos.push('Fila '+(n+2)+': el calzado «'+r.calzado+'» no está en la lista (Zapatillas, Clavos, Zapatillas de gimnasio, Descalzo). Lo he pasado a detalle.'); }
      }
      if(r.material){
        var mat = resolverMaterial(r.material);
        if(mat.length) celda.material = mat;
        else { celda.detalle = (celda.detalle ? celda.detalle+' · ' : '')+'material: '+r.material;
               avisos.push('Fila '+(n+2)+': el material «'+r.material+'» no está en la lista ('+MATERIAL.join(', ')+'). Lo he pasado a detalle.'); }
      }
      bl.filas.push(celda);
    });
    var sesiones = orden.map(function(k){ return mapa[k]; }).sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
    return { sesiones: sesiones, avisos: avisos };
  }

  function copiarAlPortapapeles(txt){

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, function(){ copiaManual(txt) ? ok() : mal(); });
    } else { copiaManual(txt) ? ok() : mal(); }
  }
  function copiaManual(txt){
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      var r = document.execCommand('copy');
      document.body.removeChild(ta);
      return r;
    } catch(e){ return false; }
  }

    document.body.appendChild(a); a.click(); document.body.removeChild(a);

  }

  // ---------- guardado en lote ----------
  async function crearSemana(){
    if(!SEMANA || !SEMANA.sesiones.length){ swMsg('No hay nada previsualizado.', 'error'); return; }
    var incluidas = SEMANA.sesiones.filter(function(s){ return s.incluir !== false; });
    if(!incluidas.length){ swMsg('No has dejado ningún día marcado.', 'error'); return; }
    var dest = leerDest('sw');
    if(dest.error){ swMsg(dest.error, 'error'); return; }
    var modoEl = document.querySelector('input[name="sw-choque"]:checked');
    var modo = modoEl ? modoEl.value : 'saltar';
    var publicar = $('sw-publicar').checked;
    var ex = SEMANA.existentes || {};

    swMsg('Guardando…');
    var nuevas = [], updates = [], saltadas = 0;
    incluidas.forEach(function(s){
      var p = {
        grupo_id: SEMANA.grupo_id,
        fecha: s.fecha,
        dia_semana: s.dia_semana || diaSemana(s.fecha),
        titulo: (s.titulo||'').trim() || null,
        tipo: s.tipo || null,
        rol: s.rol || null,
        nota_razonamiento: (s.nota_razonamiento||'').trim() || null,
        bloques: s.bloques || [],
        publicada: publicar,
        atletas_ids: dest.ids   // el mismo destinatario para toda la tanda
      };
      if(ex[s.fecha]){
        if(modo === 'saltar'){ saltadas++; return; }
        updates.push({ id: ex[s.fecha], payload: p });
      } else {
        p.creado_por = perfil.id;
        nuevas.push(p);
      }
    });

    var creadas = 0, actualizadas = 0;
    if(nuevas.length){
      var r = await sb.from('sesiones').insert(nuevas).select('id');   // un solo insert con todas
      if(r.error){ swMsg('Error al crear: '+r.error.message, 'error'); return; }
      creadas = (r.data||nuevas).length;
    }
    for(var i=0;i<updates.length;i++){
      var u = await sb.from('sesiones').update(updates[i].payload).eq('id', updates[i].id);
      if(u.error){ swMsg('Error al sobrescribir: '+u.error.message, 'error'); return; }
      actualizadas++;
    }

    var partes = [];
    if(creadas) partes.push(creadas+' creada(s)');
    if(actualizadas) partes.push(actualizadas+' sobrescrita(s)');
    if(saltadas) partes.push(saltadas+' saltada(s) porque ya existían');
    var quien = dest.ids ? ' · solo para '+dest.ids.length+' atleta(s)' : ' · para todo el grupo';
    swMsg('Semana guardada ✓ '+partes.join(' · ')+quien+(publicar?' · visibles en la zona de atleta':' · en borrador'), 'ok');

    await comprobarChoques();
    if($('pl-grupo') && $('pl-grupo').value === SEMANA.grupo_id) await cargarSesionesGrupo(SEMANA.grupo_id);
    cargarSesionesFeedback();
  }

  function sesionesDesdeOrigen(arr, lunesOrigen, lunesDestino){
    return arr.map(function(s){
      var off = difDias(s.fecha, lunesOrigen);
      var fecha = addDias(lunesDestino, off);
      return { idx: off, fecha: fecha, dia_semana: DIAS_TXT[off] || diaSemana(fecha),
               tipo: s.tipo||'', rol: s.rol||'', titulo: s.titulo||'', nota_razonamiento: s.nota_razonamiento||'',
               bloques: JSON.parse(JSON.stringify(s.bloques||[])), incluir: true,
               atletas_ids: Array.isArray(s.atletas_ids) ? s.atletas_ids.slice() : null };
    }).sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
  }

  // ¿Todas las sesiones de origen iban a los mismos atletas?
  // Devuelve {mixto:true} si no coinciden, o {ids: null | [..]} si sí.
  function destComunDeSesiones(arr){
    if(!arr || !arr.length) return { mixto:false, ids:null };
    function clave(s){ var a = s.atletas_ids; return (Array.isArray(a) && a.length) ? a.slice().sort().join(',') : ''; }
    var k = clave(arr[0]);
    for(var i=1;i<arr.length;i++) if(clave(arr[i]) !== k) return { mixto:true, ids:null };
    return { mixto:false, ids: k ? k.split(',') : null };
  }

  async function cargarPlantillas(){
    var sel = $('sw-pl-lista'); if(!sel) return;

    var r = await sb.from('plantillas_semana').select('id,nombre,datos,creado_por,created_at').order('created_at', { ascending:false }).limit(100);
    if(r.error || !r.data){ return; }
    r.data.forEach(function(p){

      sel.innerHTML += '<option value="'+p.id+'">'+esc(p.nombre)+' · '+n+' sesión(es)</option>';
    });
  }

  function sesionesDesdePlantilla(datos, lunesDestino){
    var arr = (datos && datos.sesiones) ? datos.sesiones : [];
    return arr.map(function(s){
      var off = parseInt(s.offset_dia, 10) || 0;
      var fecha = addDias(lunesDestino, off);
      return { idx: off, fecha: fecha, dia_semana: DIAS_TXT[off] || diaSemana(fecha),
               tipo: s.tipo||'', rol: s.rol||'', titulo: s.titulo||'', nota_razonamiento: s.nota_razonamiento||'',
               bloques: JSON.parse(JSON.stringify(s.bloques||[])), incluir: true };
    }).sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
  }

      lector.onload = async function(){
        await ponerSemana(interpretarCSV(String(lector.result||''), lunes), $('sw-grupo').value);
        $('sw-prev-card').scrollIntoView({ behavior:'smooth', block:'start' });
      };
      lector.onerror = function(){ swMsg('No he podido leer el archivo.', 'error'); };
      lector.readAsText(f, 'UTF-8');
    });

    // --- 3 · duplicar ---
    $('sw-dup-grupo').addEventListener('change', cargarSemanasOrigen);
    $('sw-duplicar').addEventListener('click', async function(){
      var L = $('sw-dup-semana').value;
      if(!L){ swMsg('Elige qué semana quieres copiar.', 'error'); return; }
      var destino = $('sw-lunes').value;
      if(!destino){ swMsg('Pon la fecha de inicio de la semana destino.', 'error'); return; }
      var arr = SEMANAS_ORIGEN[L] || [];
      var gDest = $('sw-grupo').value, avisos = [];

      // Se conserva a quién iba dirigida la semana de origen; el entrenador puede cambiarlo arriba.
      var d = destComunDeSesiones(arr);
      if(d.mixto){
        avisos.push('Las sesiones de la semana de origen no iban todas a los mismos atletas. Elige arriba, en «¿Para quién es esta semana?», a quién va la copia.');
      } else if(d.ids){
        var enDestino = atletasDeGrupo(gDest).map(function(x){ return x.id; });
        var validos = d.ids.filter(function(id){ return enDestino.indexOf(id) > -1; });
        if(validos.length){
          aplicarDest('sw', gDest, validos);
          if(validos.length < d.ids.length) avisos.push('Algunos atletas a los que iba la semana de origen no están en el grupo destino: la copia queda dirigida a los '+validos.length+' que sí están.');
        } else {
          aplicarDest('sw', gDest, null);
          avisos.push('La semana de origen iba dirigida a atletas concretos que no están en el grupo destino: la copia queda para todo el grupo. Cámbialo arriba si hace falta.');
        }
      } else {
        aplicarDest('sw', gDest, null);
      }
      refrescarDestSw();

      await ponerSemana({ sesiones: sesionesDesdeOrigen(arr, L, destino), avisos: avisos }, gDest);
      $('sw-prev-card').scrollIntoView({ behavior:'smooth', block:'start' });
    });

    // --- 4 · plantillas ---
    $('sw-pl-aplicar').addEventListener('click', async function(){
      var id = $('sw-pl-lista').value;
      if(!id){ swMsg('Elige una plantilla.', 'error'); return; }
      var destino = $('sw-lunes').value;
      if(!destino){ swMsg('Pon la fecha de inicio de la semana.', 'error'); return; }
      var p = PLANTILLAS[id];
      await ponerSemana({ sesiones: sesionesDesdePlantilla(p.datos, destino), avisos: [] }, $('sw-grupo').value);
      $('sw-prev-card').scrollIntoView({ behavior:'smooth', block:'start' });
    });
    $('sw-pl-borrar').addEventListener('click', async function(){
      var id = $('sw-pl-lista').value, m = $('sw-pl-msg'); m.className = 'msg';
      if(!id){ m.textContent = 'Elige una plantilla.'; m.className = 'msg error'; return; }
      if(!confirm('¿Borrar esta plantilla? No se puede deshacer.')) return;
      var r = await sb.from('plantillas_semana').delete().eq('id', id);
      if(r.error){ m.textContent = 'Error: '+r.error.message; m.className = 'msg error'; return; }
      m.textContent = 'Plantilla borrada ✓'; m.className = 'msg ok';
      await cargarPlantillas();
    });
    $('sw-pl-guardar').addEventListener('click', async function(){
      var nombre = $('sw-pl-nombre').value.trim();
      if(!SEMANA || !SEMANA.sesiones.length){ swMsg('No hay nada previsualizado que guardar.', 'error'); return; }
      if(!nombre){ swMsg('Ponle un nombre a la plantilla.', 'error'); return; }
      var datos = { sesiones: SEMANA.sesiones.filter(function(s){ return s.incluir !== false; }).map(function(s){
        return { offset_dia: difDias(s.fecha, lunesDe(s.fecha)), dia_semana: s.dia_semana,
                 tipo: s.tipo||'', rol: s.rol||'', titulo: s.titulo||'',
                 nota_razonamiento: s.nota_razonamiento||'', bloques: s.bloques||[] };
      }) };
      var r = await sb.from('plantillas_semana').insert({ nombre: nombre, creado_por: perfil.id, datos: datos }).select('id').maybeSingle();
      if(r.error){ swMsg('Error al guardar la plantilla: '+r.error.message, 'error'); return; }
      $('sw-pl-nombre').value = '';
      swMsg('Plantilla «'+nombre+'» guardada ✓', 'ok');
      await cargarPlantillas();
    });

    // --- previsualización ---
    $('sw-crear').addEventListener('click', crearSemana);
    $('sw-descartar').addEventListener('click', function(){ SEMANA = null; $('sw-prev-card').hidden = true; });
    $('sw-grupo').addEventListener('change', async function(){
      // otro grupo = otros atletas: la lista de destinatarios se repinta desde cero
      aplicarDest('sw', $('sw-grupo').value, null);
      refrescarDestSw();
      if(SEMANA){ SEMANA.grupo_id = $('sw-grupo').value; await comprobarChoques(); }
    });

    cargarSemanasOrigen();
    cargarPlantillas();
  })();

  // ============================================================
  // SECCIÓN 3 · FEEDBACK
  // ============================================================
  var FB_SESIONES = {};

  async function cargarSesionesFeedback(){
    var sel = $('fb-sesion');
    if(!sel) return;
    var prev = sel.value;
    var r = await sb.from('sesiones').select('id,fecha,titulo,grupo_id,publicada').order('fecha',{ascending:false}).limit(120);
    FB_SESIONES = {};
    sel.innerHTML = '<option value="">— elige una sesión —</option>';
    if(!r.error && r.data){
      r.data.forEach(function(s){ FB_SESIONES[s.id]=s; sel.innerHTML += '<option value="'+s.id+'">'+esc(formatFecha(s.fecha))+' · '+esc(nombreGrupo(s.grupo_id)||'')+' · '+esc(s.titulo||'sin título')+(s.publicada?'':' (borrador)')+'</option>'; });
    }
    if(prev && FB_SESIONES[prev]) sel.value = prev;
  }

  async function pintarFeedback(sesionId){
    var cont = $('fb-cont');
    if(!sesionId){ cont.innerHTML='<p class="vacio">Elige una sesión para ver las sensaciones de tus atletas.</p>'; return; }
    cont.innerHTML='<p class="vacio">Cargando…</p>';
    var ses = FB_SESIONES[sesionId];
    var grupoId = ses ? ses.grupo_id : null;
    var atls = MIS_ATLETAS.filter(function(x){ return x.grupo_id===grupoId; });
    var reg = await sb.from('registros_sesion').select('*').eq('sesion_id', sesionId);
    if(reg.error){ cont.innerHTML='<p class="vacio">Error: '+esc(reg.error.message)+'</p>'; return; }
    var porAtleta={}; (reg.data||[]).forEach(function(r){ porAtleta[r.atleta_id]=r; });

    if(!atls.length){ cont.innerHTML='<p class="vacio">No hay atletas visibles en el grupo de esta sesión.</p>'; return; }

    var html = atls.map(function(at){
      var r = porAtleta[at.id];
      var nom = esc((at.nombre||'')+' '+(at.apellidos||''));
      if(!r){ return '<div class="fb-atleta"><div class="fb-nom"><strong>'+nom+'</strong><span class="sin-registro">Sin registro todavía</span></div></div>'; }
      var metrics='';
      if(r.rpe!=null) metrics += '<span class="fb-metric">RPE <b>'+esc(r.rpe)+'</b>/10</span>';
      if(r.sensacion_general!=null) metrics += '<span class="fb-metric">Sensación <b>'+esc(r.sensacion_general)+'</b>/10</span>';
      if(r.horas_sueno!=null) metrics += '<span class="fb-metric">Sueño <b>'+esc(r.horas_sueno)+'</b> h</span>';
      if(r.peso_kg!=null) metrics += '<span class="fb-metric">Peso <b>'+esc(r.peso_kg)+'</b> kg</span>';
      var txt='';
      if(r.como_me_siento) txt += '<p class="fb-txt"><span>Cómo se siente</span>'+esc(r.como_me_siento)+'</p>';
      if(r.molestias) txt += '<p class="fb-txt"><span>Molestias</span>'+esc(r.molestias)+'</p>';
      if(r.notas_atleta) txt += '<p class="fb-txt"><span>Notas</span>'+esc(r.notas_atleta)+'</p>';
      var tiempos='';
      if(r.tiempos_reales && typeof r.tiempos_reales==='object'){
        Object.keys(r.tiempos_reales).forEach(function(k){
          var t=r.tiempos_reales[k]; if(!t) return;
          var arr=(t.tiempos||[]).filter(function(v){return v!=null && String(v).trim()!=='';});
          if(!arr.length) return;
          tiempos += '<div class="fb-ej">'+esc(t.ejercicio||k)+': '+arr.map(function(v,i){ return '<span class="fb-serie">'+(i+1)+'ª '+esc(v)+'</span>'; }).join('')+'</div>';
        });
      }
      return '<div class="fb-atleta"><div class="fb-nom"><strong>'+nom+'</strong>'+(at.categoria?'<span class="pill">'+esc(at.categoria)+'</span>':'')+'</div>'+
        (metrics?'<div class="fb-metrics">'+metrics+'</div>':'')+ txt +
        (tiempos?'<div class="fb-tiempos">'+tiempos+'</div>':'')+'</div>';
    }).join('');
    cont.innerHTML = html;
  }

  (function renderFeedback(){
    var cont = $('sec-feedback');
    cont.innerHTML =
      '<div class="tarjeta">'+
        '<h2>Feedback de los atletas</h2>'+
        '<label>Sesión</label><select id="fb-sesion"><option value="">— elige una sesión —</option></select>'+
        '<div id="fb-cont" style="margin-top:16px;"><p class="vacio">Elige una sesión para ver las sensaciones de tus atletas.</p></div>'+
      '</div>';
    $('fb-sesion').addEventListener('change', function(){ pintarFeedback($('fb-sesion').value); });
    cargarSesionesFeedback();
  })();

  // ============================================================
  // SECCIÓN 4 · OBSERVACIONES PRIVADAS (solo el equipo técnico)
  // ------------------------------------------------------------
  // Notas internas del entrenador sobre un atleta. El atleta y su
  // familia NO pueden leerlas: la tabla notas_atleta tiene RLS y
  // solo el staff (admin o el entrenador de ESE atleta) tiene
  // acceso. Ver migraciones/009_notas_privadas.sql.
  // ============================================================
  function formatFechaHora(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    var me = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    var p2 = function(n){ return (n<10?'0':'')+n; };
    return p2(d.getDate())+' '+me[d.getMonth()]+' '+d.getFullYear()+' · '+p2(d.getHours())+':'+p2(d.getMinutes());
  }

  async function pintarNotas(atletaId){
    var cont = $('nt-cont');
    if(!atletaId){ cont.innerHTML = '<p class="vacio">Elige un atleta para ver y añadir observaciones.</p>'; return; }
    cont.innerHTML = '<p class="vacio">Cargando…</p>';
    var r = await sb.from('notas_atleta').select('id,texto,created_at').eq('atleta_id', atletaId).order('created_at', { ascending:false });
    if(r.error){ cont.innerHTML = '<p class="vacio">Error: '+esc(r.error.message)+'</p>'; return; }
    var notas = r.data || [];
    var lista = notas.length
      ? notas.map(function(n){
          return '<div class="nota"><div class="nota-meta"><span>'+esc(formatFechaHora(n.created_at))+'</span>'+
            '<button type="button" class="nota-borrar" data-id="'+n.id+'">Borrar</button></div>'+
            '<div class="nota-txt">'+esc(n.texto)+'</div></div>';
        }).join('')
      : '<p class="vacio">Aún no hay observaciones para este atleta.</p>';
    cont.innerHTML =
      '<div class="aviso-privado">🔒 Estas observaciones son <strong>privadas del equipo técnico</strong>. El atleta y su familia <strong>no pueden verlas</strong>: solo tú (su entrenador) y la dirección del club.</div>'+
      '<div class="notas-lista">'+lista+'</div>'+
      '<label style="margin-top:16px;">Nueva observación</label>'+
      '<textarea id="nt-texto" placeholder="Observación privada sobre el atleta (técnica, actitud, lesiones, contexto…)"></textarea>'+
      '<div class="acciones">'+
        '<button class="btn btn--primario" id="nt-guardar">Añadir observación</button>'+
        '<span class="msg" id="nt-msg"></span>'+
      '</div>';

    $('nt-guardar').addEventListener('click', async function(){
      var msg = $('nt-msg'); msg.className = 'msg';
      var texto = $('nt-texto').value.trim();
      if(!texto){ msg.textContent = 'Escribe algo antes de guardar.'; msg.className = 'msg error'; return; }
      msg.textContent = 'Guardando…';
      var res = await sb.from('notas_atleta').insert({ atleta_id: atletaId, autor_id: perfil.id, texto: texto }).select('id').maybeSingle();
      if(res.error){ msg.textContent = 'Error: '+res.error.message; msg.className = 'msg error'; return; }
      await pintarNotas(atletaId);
    });

    cont.querySelectorAll('.nota-borrar').forEach(function(b){
      b.addEventListener('click', async function(){
        if(!confirm('¿Borrar esta observación? No se puede deshacer.')) return;
        var res = await sb.from('notas_atleta').delete().eq('id', b.getAttribute('data-id'));
        if(!res.error) pintarNotas(atletaId);
      });
    });
  }

  (function renderNotas(){
    var cont = $('sec-notas');
    if(!MIS_ATLETAS.length){
      cont.innerHTML = '<div class="tarjeta"><h2>Observaciones privadas</h2><p class="vacio">Cuando tengas atletas a tu cargo podrás anotar aquí observaciones privadas sobre cada uno. Solo las ve el equipo técnico.</p></div>';
      return;
    }
    cont.innerHTML =
      '<div class="tarjeta">'+
        '<h2>Observaciones privadas</h2>'+
        '<p class="vacio" style="margin-top:-6px;margin-bottom:14px;">Notas internas <strong>solo para el equipo técnico</strong>. El atleta y su familia NO las ven.</p>'+
        '<label>Atleta</label><select id="nt-atleta"><option value="">— elige un atleta —</option>'+
          MIS_ATLETAS.map(function(x){ return '<option value="'+x.id+'">'+esc(((x.nombre||'')+' '+(x.apellidos||'')).trim())+'</option>'; }).join('')+
        '</select>'+
        '<div id="nt-cont" style="margin-top:16px;"><p class="vacio">Elige un atleta para ver y añadir observaciones.</p></div>'+
      '</div>';
    $('nt-atleta').addEventListener('change', function(){ pintarNotas($('nt-atleta').value); });
  })();

});
</script>
