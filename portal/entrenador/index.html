    texto += f.puestas
      ? ', y esa falta queda avisada: en la lista de ese día sale que lo hace otro día.'
      : '.';
    if(f.yaHabia.length){
      /* Lo que dijo la familia manda: esa línea no se toca ni se completa.
         Se enseña quién avisó y con qué motivo, y decide una persona. */
      texto += ' Ojo: ya había falta avisada de '+f.yaHabia.join('; ')+
        '. No se ha tocado, se deja como estaba.';
    }
    if(f.error){
      texto += ' No se ha podido apuntar la falta del '+formatFecha(s.fecha)+
        ' ('+f.error+'): el entrenamiento sí está puesto, apúntala tú en Pasar lista.';
    }
    msg.textContent = texto;
    msg.className = (f.error || f.yaHabia.length) ? 'msg' : 'msg ok';
    $('pl-pasar-hecho').hidden = !PASAR.creadaId;
    await cargarSesionesGrupo(s.grupo_id);
    if(editandoId) $('pl-editar').value = editandoId;
    refrescarDia();   // por si el día que toca es hoy
  }

  /* Deshacer de verdad: la copia se acaba de crear y no tiene nada colgando,
     así que se borra entera y no queda rastro. Y con ella se retira la falta
     que hayamos apuntado nosotros — SOLO esa: las que ya estaban puestas son
     de otro y se quedan donde están. */
  async function deshacerPasar(){
    if(!PASAR.creadaId) return;
    var msg = $('pl-pasar-msg'); msg.className = 'msg'; msg.textContent = 'Deshaciendo…';
    var r = await sb.from('sesiones').delete().eq('id', PASAR.creadaId);
    if(r.error){ msg.textContent = 'No se ha podido deshacer: '+r.error.message; msg.className = 'msg error'; return; }
    var aviso = '';
    if(PASAR.faltasIds && PASAR.faltasIds.length){
      try {
        var rf = await sb.from('ausencias').delete().in('id', PASAR.faltasIds);
        if(rf.error) aviso = ' La falta que se apuntó sigue puesta ('+rf.error.message+'): quítala en Pasar lista.';
      } catch(e){ aviso = ' La falta que se apuntó sigue puesta: quítala en Pasar lista.'; }
    }
    var g = PASAR.sesion ? PASAR.sesion.grupo_id : null;
    PASAR.creadaId = null; PASAR.faltasIds = [];
    $('pl-pasar-hecho').hidden = true;
    $('pl-pasar-ok').disabled = false;
    msg.textContent = 'Deshecho ✓ Ha quedado todo como estaba.'+aviso;
    msg.className = aviso ? 'msg' : 'msg ok';
    if(g){ await cargarSesionesGrupo(g); if(editandoId) $('pl-editar').value = editandoId; }
    refrescarDia();
  }

  // ============================================================
  // ¿ABIERTO PARA APUNTARSE? (columnas de la tabla sesiones)
  // ------------------------------------------------------------
  //   abierta_inscripcion = false -> es el entreno de tu grupo y punto
  //   abierta_inscripcion = true  -> sale en el calendario del club con
  //                                  el botón de apuntarse
  //   plazas    = null  -> sin límite · un número = aforo
  //   abierta_a = null  -> todo el club · ['running'] = solo esa sección
  //   hora / lugar      -> lo que se ve en el calendario («17:30 · Pista»)
  // Quien decide de verdad si alguien se puede apuntar es la base de
  // datos (migraciones/025): comprueba fecha, sección y plazas libres.
  // Igual que con los destinatarios, el mismo control se usa en los dos
  // apartados y se distingue por el prefijo ('pl' y 'sw').
  // ============================================================
  function cajaAbrirHTML(pref, pregunta, explicacion){
    return '<div class="dest" id="'+pref+'-abre">'+
      '<label>'+esc(pregunta)+'</label>'+
      '<div class="check" style="margin-top:6px;"><input type="checkbox" id="'+pref+'-abierta">'+
        '<label for="'+pref+'-abierta">Sí, cualquiera del club se puede apuntar desde el calendario</label></div>'+
      /* La explicación larga de qué implica abrir el entreno se lee una vez.
         Se pliega, sin quitar ni una palabra. */
      '<details class="ayuda"><summary>Qué cambia si lo marco</summary>'+
        '<p class="pista">'+explicacion+'</p>'+
      '</details>'+
      '<div id="'+pref+'-abre-caja" hidden>'+
        /* Con «pedir plaza», quien se apunta queda esperando a que el
           entrenador conteste. Las peticiones sin contestar NO gastan plaza,
           a propósito: si la gastaran, los diez primeros dedos llenarían el
           cupo y el número once no podría ni pedirla. */
        '<label>¿Cómo entra la gente?</label>'+
        '<select id="'+pref+'-comose">'+
          '<option value="abierta">Se apunta quien quiera</option>'+
          '<option value="con_permiso">Hay que pedir plaza y contesto yo</option>'+
        '</select>'+
        '<p class="pista">Con <strong>pedir plaza</strong>, quien se apunte queda a la espera hasta que le contestes desde «Solicitudes de plaza». Las peticiones sin contestar no gastan plaza.</p>'+
        '<div class="grid2">'+
          '<div>'+
            '<label>Plazas</label>'+
            '<input id="'+pref+'-plazas" type="number" min="1" step="1" inputmode="numeric" placeholder="sin límite">'+
            '<p class="pista">Cuánta gente cabe. <strong>Déjalo vacío si no hay tope.</strong> Cuando se llene, el calendario deja de dejar apuntarse.</p>'+
          '</div>'+
          '<div>'+
            '<label>Abierta a</label>'+
            '<div class="dest-lista" id="'+pref+'-secciones"></div>'+
            '<p class="pista"><strong>Sin marcar nada = a todo el club.</strong> Si marcas secciones, solo se podrá apuntar quien entrene en un grupo de esas secciones.</p>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div><label>Hora</label><input id="'+pref+'-hora" type="time"></div>'+
        '<div><label>Lugar</label><input id="'+pref+'-lugar" list="lugares-dl" placeholder="Pista Joaquín Villar, Playa del Postiguet…"></div>'+
      '</div>'+
      '<details class="ayuda"><summary>Para qué sirven la hora y el lugar</summary>'+
        '<p class="pista">La hora y el lugar son los que se ven en el calendario del club («17:30 · Pista Joaquín Villar»). Puedes ponerlos aunque el entrenamiento no esté abierto a nadie más.</p>'+
      '</details>'+
      '<p class="abre-resumen" id="'+pref+'-abre-resumen"></p>'+
    '</div>';
  }

  function pintarSecciones(pref, seleccion){
    var cont = $(pref+'-secciones'); if(!cont) return;
    var sel = {}; (seleccion||[]).forEach(function(s){ sel[s] = true; });
    if(!SECCIONES_CLUB.length){ cont.innerHTML = '<p class="vacio">Todavía no hay secciones definidas en los grupos del club.</p>'; return; }
    cont.innerHTML = SECCIONES_CLUB.map(function(s){
      return '<label><input type="checkbox" class="sec-chk-'+pref+'" value="'+escAttr(s)+'"'+(sel[s]?' checked':'')+'>'+esc(nombreSeccion(s))+'</label>';
    }).join('');
  }
  function seccionesMarcadas(pref){
    var out = [], cont = $(pref+'-secciones'); if(!cont) return out;
    cont.querySelectorAll('.sec-chk-'+pref).forEach(function(i){ if(i.checked) out.push(i.value); });
    return out;
  }
  function estaAbierta(pref){ var c = $(pref+'-abierta'); return !!(c && c.checked); }

  // Deja el control como esté guardado en una sesión (o lo vacía con null)
  function aplicarAbrir(pref, s){
    s = s || {};
    if($(pref+'-abierta')) $(pref+'-abierta').checked = !!s.abierta_inscripcion;
    if($(pref+'-plazas'))  $(pref+'-plazas').value = (s.plazas==null ? '' : s.plazas);
    if($(pref+'-hora'))    $(pref+'-hora').value = horaCorta(s.hora);
    if($(pref+'-lugar'))   $(pref+'-lugar').value = s.lugar || '';
    if($(pref+'-comose'))  $(pref+'-comose').value = (s.inscripcion === 'con_permiso') ? 'con_permiso' : 'abierta';
    pintarSecciones(pref, Array.isArray(s.abierta_a) ? s.abierta_a : []);
  }

  // Lee lo elegido. Devuelve {error:'…'} si algo no cuadra.
  function leerAbrir(pref){
    var abierta = estaAbierta(pref);
    var txtPlazas = ($(pref+'-plazas') ? $(pref+'-plazas').value : '').trim();
    var plazas = null;
    if(abierta && txtPlazas!==''){
      plazas = parseInt(txtPlazas, 10);
      if(isNaN(plazas) || plazas < 1) return { error: 'Las plazas tienen que ser un número mayor que cero. Si no quieres poner tope, deja la casilla vacía.' };
    }
    var secs = abierta ? seccionesMarcadas(pref) : [];
    return {
      abierta_inscripcion: abierta,
      /* Cerrada no admite matices: si no está abierta, no se pide nada. */
      inscripcion: abierta ? (($(pref+'-comose')||{}).value || 'abierta') : 'cerrada',
      plazas: abierta ? plazas : null,
      abierta_a: (abierta && secs.length) ? secs : null,
      hora: ($(pref+'-hora') && $(pref+'-hora').value) ? $(pref+'-hora').value : null,
      lugar: ($(pref+'-lugar') ? $(pref+'-lugar').value.trim() : '') || null
    };
  }

  // Resumen en una línea: «Abierto · 20 plazas · Running» / «Solo para tu grupo»
  function textoAbrir(pref, publicada){
    var partes = [];
    if(estaAbierta(pref)){
      var p = ($(pref+'-plazas') ? $(pref+'-plazas').value : '').trim();
      partes.push('Abierto');
      partes.push(p ? p+' plazas' : 'sin límite de plazas');
      partes.push(textoSecciones(seccionesMarcadas(pref)));
    } else {
      partes.push('Solo para tu grupo');
    }
    var h = $(pref+'-hora') ? $(pref+'-hora').value : '';
    var l = $(pref+'-lugar') ? $(pref+'-lugar').value.trim() : '';
    if(h) partes.push(h);
    if(l) partes.push(l);
    var txt = partes.join(' · ');
    if(estaAbierta(pref) && publicada === false) txt += ' — recuerda publicarla o no saldrá en el calendario';
    return txt;
  }

  // Conecta el control. `estaPublicada` es una función opcional que dice si
  // la sesión se va a publicar (para avisar de que si no, nadie la verá).
  function conectarAbrir(pref, alCambiar, estaPublicada){
    function refrescar(sinPropagar){
      var on = estaAbierta(pref);
      $(pref+'-abre-caja').hidden = !on;
      var r = $(pref+'-abre-resumen');
      var pub = estaPublicada ? estaPublicada() : true;
      r.textContent = textoAbrir(pref, pub);
      r.className = 'abre-resumen' + (!on ? ' cerrado' : (pub===false ? ' ojo' : ''));
      if(alCambiar && sinPropagar !== true) alCambiar();
    }
    $(pref+'-abierta').addEventListener('change', refrescar);
    $(pref+'-plazas').addEventListener('input', refrescar);
    $(pref+'-hora').addEventListener('input', refrescar);
    $(pref+'-lugar').addEventListener('input', refrescar);
    $(pref+'-secciones').addEventListener('change', refrescar);
    refrescar(true);
    return refrescar;
  }

  // Texto de ayuda sobre los ritmos en % (se usa en varios sitios)
  var PISTA_RITMO_HTML = 'En la columna <strong>Ritmo</strong>: si escribes un porcentaje (<code>90%</code> o <code>90-95%</code>) y la distancia va en metros (<code>60 m</code>), '+
    '<strong>cada atleta verá su propio tiempo objetivo</strong>, calculado con su mejor marca en esa distancia. '+
    'Si escribes un ritmo fijo (<code>4:10 min/km</code>, <code>7.9 s</code>), todos verán exactamente lo mismo.';

  // ============================================================
  // SECCIÓN 2 · PLANIFICAR ENTRENO
  // ============================================================
  var editandoId = null;        // id de sesión en edición (null = nueva)
  var COPIA_DE = null;          // { fecha, titulo } del original, mientras se está duplicando
  var refrescarDestPl = null;   // se asigna al pintar el formulario
  var refrescarAbrirPl = null;  // ídem, para «¿Abierto para apuntarse?»

  /* Ya no hay un filtro global: cada fila busca lo suyo mientras se escribe.
     Se conserva la función porque la llaman sitios que solo quieren «sin
     filtro», y devolver '' es exactamente eso. */
  function filtroActual(){ return ''; }

  // Busca por nombre, categoría y tipo; tolera acentos y palabras sueltas
  // ("tacos salida" encuentra "Salidas desde tacos").
  function casaEjercicio(ej, filtro){
    var f = norm(filtro);
    if(!f) return true;
    var heno = norm((ej.nombre||'')+' '+(ej.categoria||'')+' '+(ej.tipo||'')+' '+(ej.nombre_corto||''));
    var palabras = f.split(' ');
    for(var i=0;i<palabras.length;i++){ if(heno.indexOf(palabras[i])===-1) return false; }
    return true;
  }

  function buscarEjercicios(filtro, limite){
    var res=[];
    for(var i=0;i<EJERCICIOS.length && res.length<(limite||60); i++){ if(casaEjercicio(EJERCICIOS[i], filtro)) res.push(EJERCICIOS[i]); }
    return res;
  }

  /* Aquí vivía `opcionesEjercicios`, que montaba el desplegable de 158
     ejercicios agrupado por categoría. Se ha ido con el desplegable: en un
     móvil esa lista era inusable —había que arrastrar con el pulgar hasta
     abajo— y los `<optgroup>` que agrupaban se pierden en la ruleta de
     iPhone, así que ni siquiera cumplía su parte. No se deja «por si
     acaso»: una función que nadie llama hace creer que el desplegable sigue
     ahí, y dentro de seis meses alguien lo revive sin saber por qué se fue.
     Lo que hace falta ahora lo hace `abrirSug`, pegado a cada fila. */

  /* Las categorías y los tipos, escritos como se dicen. En la base están en
     minúscula y sin tilde («potenciacion», «tecnica») porque son llaves, no
     texto: sacarlas tal cual a la pantalla es el mismo fallo que ya se
     arregló en la pantalla de las familias, texto crudo de la base a la
     vista. Si algún día aparece una categoría nueva que no esté aquí, se
     enseña con la primera en mayúscula en vez de desaparecer. */
  var NOMBRE_CATEGORIA = {
    activacion:'Activación', calentamiento:'Calentamiento', core:'Core',
    fuerza:'Fuerza', potenciacion:'Potenciación', preventivo:'Preventivo',
    recuperacion:'Recuperación', resistencia:'Resistencia', tecnica:'Técnica',
    transferencia:'Transferencia', velocidad:'Velocidad', otros:'Otros'
  };
  var NOMBRE_TIPO = { pista:'Pista', gym:'Gimnasio', continuo:'Continuo', tecnica:'Técnica', otro:'Otro' };
  function bonitoCat(v){
    if(!v) return '';
    return NOMBRE_CATEGORIA[v] || String(v).replace(/_/g,' ').replace(/^./, function(c){ return c.toUpperCase(); });
  }
  function bonitoTipo(v){
    if(!v) return '';
    return NOMBRE_TIPO[v] || String(v).replace(/^./, function(c){ return c.toUpperCase(); });
  }

  /* ============================================================
     EL CAMPO DE EJERCICIO: SE ESCRIBE, Y SUGIERE MIENTRAS ESCRIBES
     ------------------------------------------------------------
     Sustituye al desplegable y al buscador único de arriba. Dos
     problemas que se creaban el uno al otro: el desplegable con 158
     ejercicios era inusable en un móvil, así que se puso un buscador
     arriba; y el buscador, al ser uno solo y estar arriba, obligaba a
     subir y bajar una vez por ejercicio.

     Con el campo en cada fila los dos desaparecen: escribes tres
     letras y salen tres opciones, sin moverte del sitio.

     Y EL CAMPO ES LIBRE. Lo que el banco conozca se aprovecha; lo que
     no, se guarda y se enseña tal cual. Un banco cerrado no sobrevive
     a la primera semana: el día que el entrenador quiera meter algo
     que no está, lo escribe en las notas para saltarse el sistema y
     ese ejercicio deja de existir para la app.
     ============================================================ */
  var SUG = null;          // la caja de sugerencias, una sola para toda la pantalla
  var SUG_INPUT = null;    // a qué campo está pegada ahora
  var SUG_LISTA = [];      // lo que se está enseñando
  var SUG_SEL = -1;

  function cajaSug(){
    if(SUG) return SUG;
    SUG = document.createElement('div');
    SUG.className = 'ej-sug';
    SUG.id = 'ej-sug';
    SUG.hidden = true;
    SUG.setAttribute('role','listbox');
    /* Cuelga del BODY, no de la fila. Si colgara de la fila, el
       `overflow-x:hidden` del body —o cualquier caja con overflow por el
       camino— la recortaría en cuanto se saliera un píxel. Ya pasó con el
       menú del avatar, que se comía el «Salir». */
    document.body.appendChild(SUG);
    /* En `mousedown`, no en `click`: en el móvil el click llega DESPUÉS del
       blur del campo, y para entonces la lista ya estaría cerrada. Y con
       preventDefault el campo no pierde el foco, así que el teclado no
       parpadea ni se cierra al elegir. */
    SUG.addEventListener('mousedown', function(ev){
      var it = ev.target.closest ? ev.target.closest('[data-sug]') : null;
      if(!it) return;
      ev.preventDefault();
      elegirSug(parseInt(it.getAttribute('data-sug'), 10));
    });
    return SUG;
  }

  function cerrarSug(){
    if(SUG) { SUG.hidden = true; SUG.innerHTML = ''; }
    if(SUG_INPUT) SUG_INPUT.setAttribute('aria-expanded','false');
    SUG_INPUT = null; SUG_LISTA = []; SUG_SEL = -1;
  }

  function elegirSug(i){
    if(!SUG_INPUT || !SUG_LISTA[i]) return;
    var inp = SUG_INPUT;
    inp.value = SUG_LISTA[i].nombre;
    cerrarSug();
    inp.dispatchEvent(new Event('change', { bubbles:true }));
    /* El foco se queda donde estaba: se acaba de elegir y lo siguiente es
       escribir las series, no volver a abrir la lista. */
    var fila = inp.closest('.editor-fila');
    var sig = fila ? fila.querySelector('.f-series') : null;
    if(sig) sig.focus(); else inp.focus();
  }

  /* Dónde se pinta la lista. Se abre hacia abajo si cabe y hacia arriba si
     no: un campo del final de la pantalla con la lista abriéndose hacia
     abajo queda justo debajo del teclado, que es donde no se ve. */
  function colocarSug(inp){
    var c = cajaSug();
    var r = inp.getBoundingClientRect();
    var hueco = 8;
    var libre = window.innerWidth - hueco*2;
    /* LA LISTA NO HEREDA EL ANCHO DEL CAMPO, y es a propósito. La casilla del
       ejercicio vive en una rejilla de siete columnas y es estrecha: con ese
       ancho, «Trote de vuelta a la calma · Recuperación» se partía en tres
       líneas y cada sugerencia medía 113 px. Se le da el ancho que necesita
       para leerse de un vistazo, sin pasarse de la pantalla. */
    var ancho = Math.min(Math.max(r.width, 260), libre);
    /* Y si con ese ancho se saldría por la derecha, se recoloca hacia la
       izquierda en vez de desbordar: el body lleva `overflow-x:hidden` y lo
       que se salga no se ve cortado, se ve DESAPARECIDO. */
    var izq = Math.min(r.left, window.innerWidth - hueco - ancho);
    c.style.width = Math.round(ancho) + 'px';
    c.style.left  = Math.round(Math.max(hueco, izq)) + 'px';
    /* Se mide el alto DESPUÉS de fijar el ancho: con otro ancho el contenido
       se parte distinto y el alto de antes ya no vale. */
    var alto = c.offsetHeight || 200;
    var abajo = window.innerHeight - r.bottom;
    if(abajo < alto + hueco && r.top > abajo){
      c.style.top = Math.round(Math.max(hueco, r.top - alto - 4)) + 'px';
    } else {
      c.style.top = Math.round(r.bottom + 4) + 'px';
    }
  }

  function abrirSug(inp){
    var texto = (inp.value||'').trim();
    var res = buscarEjercicios(texto, 8);
    var exacto = EJERCICIOS.some(function(ej){ return norm(ej.nombre) === norm(texto); });
    var c = cajaSug();
    var html = '';
    /* Lo primero, si lo escrito no está en el banco: decir que vale igual.
       Es la respuesta a «no puedo escribir un ejercicio que no esté en la
       lista» — que se vea que sí se puede y que no hay que elegir nada. */
    if(texto && !exacto){
      html += '<div class="sug sug-libre">Usar <b>'+esc(texto)+'</b> tal cual</div>';
    }
    SUG_LISTA = res;
    html += res.map(function(ej, i){
      var meta = [bonitoCat(ej.categoria), bonitoTipo(ej.tipo)].filter(Boolean).join(' · ');
      return '<div class="sug" data-sug="'+i+'" role="option">'+
             '<span>'+esc(ej.nombre)+'</span>'+
             (meta?'<span class="sug-cat">'+esc(meta)+'</span>':'')+'</div>';
    }).join('');
    if(!html){ cerrarSug(); return; }
    c.innerHTML = html;
    c.hidden = false;
    SUG_INPUT = inp; SUG_SEL = -1;
    inp.setAttribute('aria-expanded','true');
    colocarSug(inp);
  }

  function moverSug(paso){
    if(!SUG || SUG.hidden || !SUG_LISTA.length) return;
    SUG_SEL = Math.max(0, Math.min(SUG_LISTA.length-1, SUG_SEL + paso));
    SUG.querySelectorAll('[data-sug]').forEach(function(el, i){
      el.classList.toggle('sel', i === SUG_SEL);
      if(i === SUG_SEL) el.scrollIntoView({ block:'nearest' });
    });
  }

  /* Un solo juego de manejadores para todos los campos de ejercicio de la
     pantalla, los de las filas y el de las repeticiones máximas. Al
     repintar filas no se duplican. */
  document.addEventListener('input', function(ev){
    var t = ev.target;
    if(t && t.classList && t.classList.contains('ej-libre')) abrirSug(t);
  });
  document.addEventListener('focusin', function(ev){
    var t = ev.target;
    if(t && t.classList && t.classList.contains('ej-libre')){ if((t.value||'').trim()) abrirSug(t); }
    else if(SUG_INPUT && t !== SUG_INPUT) cerrarSug();
  });
  document.addEventListener('keydown', function(ev){
    var t = ev.target;
    if(!t || !t.classList || !t.classList.contains('ej-libre')) return;
    if(ev.key === 'ArrowDown'){ ev.preventDefault(); if(SUG && SUG.hidden) abrirSug(t); else moverSug(1); }
    else if(ev.key === 'ArrowUp'){ ev.preventDefault(); moverSug(-1); }
    else if(ev.key === 'Enter'){
      /* Enter sin nada marcado NO elige nada: se queda lo escrito y se
         sigue. Escribir «multisaltos con lastre» y pasar al siguiente
         campo tiene que funcionar sin tocar una sugerencia. */
      if(SUG && !SUG.hidden && SUG_SEL >= 0){ ev.preventDefault(); elegirSug(SUG_SEL); }
      else cerrarSug();
    }
    else if(ev.key === 'Escape'){ cerrarSug(); }
    else if(ev.key === 'Tab'){ cerrarSug(); }
  });
  /* Si se hace scroll o gira el móvil con la lista abierta, la lista se
     queda flotando donde estaba: `fixed` no sigue a la página. */
  window.addEventListener('scroll', function(){ if(SUG_INPUT) colocarSug(SUG_INPUT); }, true);
  window.addEventListener('resize', function(){ if(SUG_INPUT) colocarSug(SUG_INPUT); });

  /* ------------------------------------------------------------
     «¿ES NUEVO? AÑÁDELO AL BANCO»
     ------------------------------------------------------------
     Repasa lo escrito en las filas y ofrece meter en el catálogo lo que no
     esté. SIN OBLIGAR y sin bloquear: el entrenamiento se guarda igual, con
     ejercicios del banco o sin ellos. Es lo que hace que el catálogo se
     llene usándolo, en vez de tener que sentarse a escribir doscientos
     ejercicios antes de empezar.

     Va debajo de los bloques y no dentro de cada fila: la fila es una
     rejilla apretada de siete columnas y meterle un botón más la rompe en
     el móvil. Aquí se lee cuando ya se ha terminado de escribir.
     ------------------------------------------------------------ */
  function repasarBanco(){
    var caja = $('banco-nuevos'); if(!caja) return;
    var vistos = {}, nuevos = [];
    var cont = $('bloques-cont'); if(!cont){ caja.hidden = true; return; }
    cont.querySelectorAll('.f-ejercicio').forEach(function(inp){
      var v = (inp.value||'').trim(); if(!v) return;
      var k = norm(v); if(vistos[k]) return; vistos[k] = true;
      if(!EJERCICIOS.some(function(ej){ return norm(ej.nombre) === k; })) nuevos.push(v);
    });
    if(!nuevos.length){ caja.hidden = true; caja.innerHTML = ''; return; }
    caja.hidden = false;
    caja.innerHTML =
      '<p>'+(nuevos.length===1
        ? 'Este ejercicio no está en el banco. Puedes dejarlo así —se guarda y se ve igual— o añadirlo para tenerlo a mano la próxima vez.'
        : 'Estos ejercicios no están en el banco. Puedes dejarlos así —se guardan y se ven igual— o añadirlos para tenerlos a mano la próxima vez.')+'</p>'+
      nuevos.map(function(n){
        return '<div class="bn-fila"><span class="bn-nom">'+esc(n)+'</span>'+
               '<button type="button" class="btn-mini" data-anadir="'+escAttr(n)+'">Añadir al banco</button></div>';
      }).join('');
  }

  var CALZADO_OPTS = '<option value="">— calzado —</option>' +
    CALZADO.map(function(c){ return '<option value="'+escAttr(c.valor)+'">'+esc(c.valor)+' ('+esc(c.corto)+')</option>'; }).join('');

  function materialHTML(){
    return '<div class="f-material-caja"><span class="mat-tit">Material</span>'+
      MATERIAL.map(function(m){
        return '<label class="mat-op"><input type="checkbox" class="f-material-chk" value="'+escAttr(m)+'"><span>'+esc(m)+'</span></label>';
      }).join('')+'</div>';
  }

  // ============================================================
  // LA RECUPERACIÓN DE CADA SERIE
  // ------------------------------------------------------------
  // Sin recuperación una serie no dice nada: 6×800 con 90" no tiene
  // nada que ver con 6×800 con 3'. El campo suelto de texto se
  // sustituye por tres controles —modo, valor y si es trote o
  // parado— que se adaptan al deporte del grupo. Los textos, el
  // cálculo y el guardado los pone `assets/js/descansos.js`, para que
  // las cinco pantallas del club digan exactamente lo mismo.
  // ============================================================
  var Dsc = window.APOLANA_DESCANSOS || null;

  /* EL TIPO DE SIEMPRE, DEDUCIDO DE LOS DOS EJES
     El campo `tipo` mezclaba deporte y papel del día, y de él salen todavía
     el formato del descanso, las columnas de las filas y lo que pintan el
     calendario del club, la pantalla de calles y la de carga. Ya no se elige a
     mano: se calcula aquí a partir del deporte, del papel del día y de la
     sección del grupo (un continuo de montaña se escribe por desnivel, no por
     series). La base hace esta misma cuenta por su cuenta (migración 102); se
     repite aquí para que las columnas cambien mientras se rellena, sin esperar
     a guardar. */
  /* El camino de vuelta: del tipo y el rol de siempre a los dos ejes. Es la
     misma traducción que hace la base en la migración 102, escrita aquí para
     los entrenamientos guardados antes de aquello. */
  function deporteDesdeTipo(tipo, grupoId){
    if(tipo === 'natacion') return 'natacion';
    if(tipo === 'gym') return 'fuerza';
    if(tipo === 'pista' || tipo === 'continuo') return 'atletismo';
    return deportePorGrupo(grupoId);
  }
  function papelDesdeRol(tipo, rol){
    if(tipo === 'descanso' || tipo === 'competicion' || tipo === 'activacion') return tipo;
    var m = { calidad_fuerte:'impacto', secundaria:'carga', descarga:'recuperacion',
              ultimo_toque_48h:'tapering', activacion:'activacion', competicion:'competicion' };
    if(m[rol]) return m[rol];
    if(nombrePapel(rol)) return rol;   // ya venía con el vocabulario nuevo
    return 'carga';
  }
  /* Qué deporte hace normalmente un grupo, para no preguntar lo obvio: quien
     entrena a un grupo de natación no debería tener que cambiar el desplegable
     cada vez que planifica. */
  function deportePorGrupo(grupoId){
    var sec = seccionDeGrupo(grupoId);
    if(sec === 'natacion' || sec === 'escuela-natacion') return 'natacion';
    if(sec === 'cubo') return 'cubo';
    return 'atletismo';
  }

  function tipoDesdeEjes(deporte, papel, grupoId){
    if(deporte === 'natacion') return 'natacion';
    if(deporte === 'fuerza' || deporte === 'cubo') return 'gym';
    if(papel === 'descanso' || papel === 'competicion' || papel === 'activacion') return papel;
    var sec = seccionDeGrupo(grupoId);
    if(sec === 'running' || sec === 'montana' || sec === 'triatlon') return 'continuo';
    return 'pista';
  }
  /* El deporte que hay que mirar para las columnas es el PRINCIPAL. Si el día
     es «fuerza y luego series», las filas se escriben como fuerza: es donde
     está el grueso del trabajo y lo que el entrenador viene a teclear. */
  function sincronizarTipo(){
    var t = $('pl-tipo'); if(!t) return;
    t.value = tipoDesdeEjes(
      $('pl-deporte') ? $('pl-deporte').value : 'atletismo',
      $('pl-papel')   ? $('pl-papel').value   : 'carga',
      $('pl-grupo')   ? $('pl-grupo').value   : ''
    );
  }

  function disciplinaActual(){
    if(!Dsc) return 'pista';
    var tipo = $('pl-tipo') ? $('pl-tipo').value : '';
    var gr = grupoPorId($('pl-grupo') ? $('pl-grupo').value : '');
    return Dsc.disciplinaDe({ tipo: tipo }, gr);
  }

  // Cómo se llama cada modo en cada deporte (en cristiano y en minúscula)
  var REC_TXT = {
    natacion: { salida:'salida cada', fijo:'descanso' },
    pista:    { tiempo:'rec en tiempo', distancia:'rec en metros' },
    running:  { tiempo:'rec en tiempo', distancia:'rec en metros' },
    cubo:     { tiempo:'descanso' },
    montana:  { bajada:'bajada', tiempo:'rec en tiempo' }
  };
  var REC_TXT_GEN = { salida:'salida cada', fijo:'descanso', tiempo:'rec en tiempo',
                      distancia:'rec en metros', bajada:'bajada', texto:'tal cual' };
  var REC_PLACE = { salida:'1\'00"', fijo:'20"', tiempo:'2\'', distancia:'200 m',
                    bajada:'4\' (si lo sabes)', texto:'lo que escribiste' };
  var REC_TIT = {
    salida: 'Salida cada X: nadar y descansar caben dentro del intervalo.',
    fijo:   'Descanso fijo: segundos parado al tocar la pared, tardes lo que tardes.',
    bajada: 'En montaña la recuperación es la bajada.'
  };
  // Cómo se recupera. En natación y en El Cubo no se pregunta.
  var REC_FORMAS = {
    pista:   ['trote','parado','andando'],
    running: ['trote','parado','andando'],
    montana: ['suave','andando','trote','bastones']
  };
  var REC_FORMA_TIT = { montana:'cómo baja' };

  function recModosDe(dis){ return (Dsc && Dsc.MODOS[dis]) ? Dsc.MODOS[dis].slice() : ['tiempo']; }

  function opcionesRecModo(dis, sel){
    var lista = recModosDe(dis);
    // lo que ya estaba escrito no se pierde nunca, aunque no sea de este deporte
    if(sel && lista.indexOf(sel)<0) lista.push(sel);
    var html = '<option value="">sin recuperación</option>';
    lista.forEach(function(m){
      var t = (REC_TXT[dis] && REC_TXT[dis][m]) || REC_TXT_GEN[m] || m;
      html += '<option value="'+escAttr(m)+'"'+(m===sel?' selected':'')+'>'+esc(t)+'</option>';
    });
    return html;
  }

  function opcionesRecForma(dis, sel){
    var lista = (REC_FORMAS[dis]||[]).slice();
    if(sel && lista.indexOf(sel)<0) lista.push(sel);
    var html = '<option value="">'+esc(REC_FORMA_TIT[dis]||'trote o parado')+'</option>';
    lista.forEach(function(f){ html += '<option value="'+escAttr(f)+'"'+(f===sel?' selected':'')+'>'+esc(f)+'</option>'; });
    return html;
  }

  // «200 m» → 200 · «1.000 m» → 1000 · «1,5 km» → 1500
  function metrosDeTexto(v){
    var t = String(v==null?'':v).toLowerCase().trim();
    if(!t) return null;
    var esKm = /km/.test(t);
    var n = parseFloat(t.replace(/\.(?=\d{3}\b)/g,'').replace(',', '.').replace(/[^\d.]/g,''));
    if(isNaN(n) || n<=0) return null;
    return Math.round(esKm ? n*1000 : n);
  }

  // Lo que se escribe en la casilla del valor a partir de lo guardado
  function recValorTexto(rec){
    if(!rec || !Dsc) return '';
    if(rec.modo==='texto')     return rec.texto||'';
    if(rec.modo==='distancia') return Dsc.fmtMetros(rec.metros);
    if(rec.modo==='salida')    return Dsc.fmtSalida(rec.segundos);
    return rec.segundos>0 ? Dsc.fmtSegundos(rec.segundos) : '';
  }

  function recCeldaHTML(dis){
    return '<div class="f-cel-rec">'+
      '<select class="f-rec-modo">'+opcionesRecModo(dis, '')+'</select>'+
      '<input class="f-rec-valor" placeholder="">'+
      '<select class="f-rec-forma">'+opcionesRecForma(dis, '')+'</select>'+
    '</div>';
  }

  // Deja los tres controles como estaba guardada la fila
  function cargarRecEnFila(fe, data, dis){
    if(!Dsc) return;
    var rec = Dsc.recDeFila(data||{}, dis);
    var modo = rec ? rec.modo : '';
    if(modo==='ninguna') { modo = ''; rec = null; }
    fe.querySelector('.f-rec-modo').innerHTML  = opcionesRecModo(dis, modo);
    fe.querySelector('.f-rec-modo').value      = modo;
    fe.querySelector('.f-rec-valor').value     = recValorTexto(rec);
    fe.querySelector('.f-rec-forma').innerHTML = opcionesRecForma(dis, (rec && rec.forma) || '');
    fe.querySelector('.f-rec-forma').value     = (rec && rec.forma) || '';
    refrescarRecFila(fe);
  }

  // Rehace los desplegables al cambiar el deporte, sin tocar lo escrito
  function rehacerRecFila(fe, dis){
    var selM = fe.querySelector('.f-rec-modo'), selF = fe.querySelector('.f-rec-forma');
    if(!selM || !selF) return;
    var m = selM.value, f = selF.value;
    selM.innerHTML = opcionesRecModo(dis, m); selM.value = m;
    selF.innerHTML = opcionesRecForma(dis, f); selF.value = f;
    refrescarRecFila(fe);
  }

  // Qué se ve y qué no: nunca un campo vacío esperando a que lo rellenen
  function refrescarRecFila(fe){
    var celda = fe.querySelector('.f-cel-rec'); if(!celda) return;
    var dis  = disciplinaActual();
    var selM = fe.querySelector('.f-rec-modo');
    var modo = selM.value;
    var val  = fe.querySelector('.f-rec-valor');
    var serEl = fe.querySelector('.f-series');
    var series = parseFloat(String(serEl ? serEl.value : '').replace(',', '.')) || 0;

    val.placeholder = REC_PLACE[modo] || '';
    selM.title = REC_TIT[modo] || '';
    celda.classList.toggle('rec-vacia', !modo);
    celda.classList.toggle('rec-sin-forma', !((REC_FORMAS[dis]||[]).length && modo && modo!=='texto'));
    celda.classList.toggle('rec-salida',   dis==='natacion' && modo==='salida');
    celda.classList.toggle('rec-descanso', dis==='natacion' && modo==='fijo');
    // rodaje o tirada (una sola repetición): no hay nada que recuperar y el campo se va
    var deSeries = (dis==='pista' || dis==='running');
    celda.classList.toggle('rec-oculta', deSeries && series>0 && series<2 && !modo);
    // en pista y running una serie sin recuperación no se entiende: se marca
    celda.classList.toggle('rec-falta',  deSeries && series>=2 && !modo);
  }

  // Lee los tres controles y devuelve el objeto rec (o null si no hay)
  function leerRecDeFila(fe){
    if(!Dsc) return null;
    var selM = fe.querySelector('.f-rec-modo'); if(!selM) return null;
    var modo = selM.value; if(!modo) return null;
    var val = (fe.querySelector('.f-rec-valor').value||'').trim();
    var forma = (fe.querySelector('.f-rec-forma').value||'') || null;
    if(modo==='texto')     return val ? { modo:'texto', texto:val, forma:forma } : null;
    if(modo==='distancia'){ var m = metrosDeTexto(val); return m ? { modo:'distancia', metros:m, forma:forma } : null; }
    var s = Dsc.segundosDeTexto(val);
    if(modo==='bajada')    return { modo:'bajada', segundos:(s>0?s:null), forma: forma||'suave' };
    return s>0 ? { modo:modo, segundos:s, forma:forma } : null;
  }

  // Cuántas series de pista o running se han quedado sin recuperación
  function seriesSinRec(){
    var n = 0, cont = $('bloques-cont'); if(!cont) return 0;
    cont.querySelectorAll('.f-cel-rec.rec-falta').forEach(function(){ n++; });
    return n;
  }

  function nuevaFila(filasCont, data){
    data = data||{};
    var dis = disciplinaActual();
    var div=document.createElement('div'); div.className='editor-fila';
    /* ⚠️ EL ID DE LA FILA VIAJA EN EL FORMULARIO, Y NO ES OPCIONAL.
       Cada fila de un entrenamiento lleva un id propio (migración 103) que es
       la cuerda que une lo que el atleta apuntó —sus kilos, sus tiempos y las
       series que no hizo— con SU ejercicio. Este editor rehace las filas desde
       cero al guardar, así que si el id no se arrastra por aquí se pierde, la
       base le pone uno nuevo creyendo que es una fila nueva, y lo que el atleta
       apuntó se queda huérfano SIN QUE NADIE SE ENTERE hasta meses después.
       Si algún día se toca `serializarBloques`, esto tiene que seguir. */
    if(data.id) div.setAttribute('data-fid', data.id);
    /* Y por lo mismo, todo lo demás que traiga la fila y este editor no
       enseñe se guarda aparte y se devuelve tal cual al guardar. Antes la
       fila se rehacía con una lista cerrada de campos: cualquier cosa que
       escribiera otra pantalla y no estuviera en esa lista se caía sin
       que nadie lo viera. La lista de abajo es la de lo que SÍ se edita
       aquí; lo que no esté, se conserva. */
    var CAMPOS_DE_LA_FILA = ['id','ejercicio','series','distancia','ritmo','detalle','calzado',
                             'carga','rir','observaciones','desnivel_m','material','rec','descanso'];
    div.__extra = {};
    Object.keys(data).forEach(function(k){ if(CAMPOS_DE_LA_FILA.indexOf(k) < 0) div.__extra[k] = data[k]; });
    div.innerHTML =
      '<div class="fila-l1">'+
        /* ⚠️ CAMPO ABIERTO, NO DESPLEGABLE.
           Aquí había un `<select>` y el entrenador se encontró con que no podía
           escribir un ejercicio que no estuviera en la lista. Un banco cerrado
           no sobrevive a la primera semana: el día que quiera meter algo que no
           está, se atasca y lo acaba escribiendo en las notas para saltarse el
           sistema — y a partir de ahí ese ejercicio no existe para la app.
           Se escribe lo que sea; la lista solo SUGIERE mientras escribes, y
           sale pegada a ESTA fila, no en un buscador allá arriba. */
        '<input class="f-ejercicio ej-libre" placeholder="ejercicio" autocomplete="off" '+
          'role="combobox" aria-autocomplete="list" aria-expanded="false" aria-label="Ejercicio">'+
        '<input class="f-series" placeholder="series">'+
        '<input class="f-distancia" placeholder="distancia">'+
        '<input class="f-ritmo" placeholder="ritmo">'+
        recCeldaHTML(dis)+
        '<div class="f-cel-cz">'+
          '<select class="f-calzado">'+CALZADO_OPTS+'</select>'+
          '<input class="f-carga" placeholder="carga (80% RM)">'+
          /* EL RIR VA POR EJERCICIO, no por sesión. El dueño lo dijo así:
             «RIR en cada ejercicio, no al final de la sesión». En su
             programa conviven «RIR 2-3» en un ejercicio y «nada al fallo»
             en otro el mismo día, así que uno global no diría nada.
             Va pegado a la carga porque son la misma familia: las dos
             dicen con cuánta intensidad se hace ESTE ejercicio. */
          '<input class="f-rir" placeholder="RIR 2-3 · sin fallo" aria-label="RIR objetivo de este ejercicio">'+
        '</div>'+
        '<button type="button" class="mini-x" title="Quitar fila">×</button>'+
      '</div>'+
      '<div class="fila-l2">'+
        '<input class="f-desnivel" placeholder="desnivel (400 m D+)">'+
        '<input class="f-detalle" placeholder="detalle">'+
        '<input class="f-observaciones" placeholder="observaciones (objetivos por atleta, matices…)">'+
        materialHTML()+
      '</div>';
    filasCont.appendChild(div);
    var sel=div.querySelector('.f-ejercicio');
    sel.value=data.ejercicio||'';
    /* Al escribir se mira si eso está en el banco. Si no está, se ofrece
       añadirlo —sin obligar y sin bloquear nada: el entrenamiento se guarda
       igual—. Así el catálogo se llena usándolo, en vez de tener que
       sentarse a escribir doscientos ejercicios antes de empezar. */
    sel.addEventListener('change', repasarBanco);
    sel.addEventListener('blur', repasarBanco);
    div.querySelector('.f-series').value=data.series||'';
    div.querySelector('.f-distancia').value=data.distancia||'';
    div.querySelector('.f-ritmo').value=data.ritmo||'';
    div.querySelector('.f-desnivel').value = (data.desnivel_m!=null && data.desnivel_m!=='') ? data.desnivel_m : '';
    cargarRecEnFila(div, data, dis);
    div.querySelector('.f-rec-modo').addEventListener('change', function(){ refrescarRecFila(div); pedirResumen(); });
    div.querySelector('.f-series').addEventListener('input', function(){ refrescarRecFila(div); });
    div.querySelector('.f-detalle').value=data.detalle||'';
    div.querySelector('.f-carga').value=data.carga||'';
    div.querySelector('.f-rir').value=data.rir||'';
    div.querySelector('.f-observaciones').value=data.observaciones||'';
    // calzado: si viene un valor antiguo que no está en la lista, se añade suelto para no perderlo
    var selCz = div.querySelector('.f-calzado');
    if(data.calzado){
      var hay = false;
      selCz.querySelectorAll('option').forEach(function(o){ if(o.value===data.calzado) hay = true; });
      if(!hay) selCz.innerHTML += '<option value="'+escAttr(data.calzado)+'">'+esc(data.calzado)+'</option>';
      selCz.value = data.calzado;
    }
    var mats = Array.isArray(data.material) ? data.material : (data.material ? [data.material] : []);
    if(mats.length){
      div.querySelectorAll('.f-material-chk').forEach(function(chk){ if(mats.indexOf(chk.value)>-1) chk.checked = true; });
    }
    div.querySelector('.mini-x').addEventListener('click', function(){
      if(FILA_ACTIVA===div) FILA_ACTIVA=null;
      div.remove();
      /* Al quitar la fila puede irse el único ejercicio que no estaba en el
         banco: si no se repasa, el ofrecimiento se queda ahí ofreciendo algo
         que ya no existe. */
      repasarBanco();
    });
    // marcar como "fila activa" para poder insertarle ejercicios desde el buscador
    div.addEventListener('focusin', function(){ marcarFilaActiva(div); });
    div.addEventListener('mousedown', function(){ marcarFilaActiva(div); });
    if(!FILA_ACTIVA || !document.body.contains(FILA_ACTIVA)) marcarFilaActiva(div);
    return div;
  }

  var FILA_ACTIVA = null;
  function marcarFilaActiva(div){
    if(FILA_ACTIVA && FILA_ACTIVA!==div) FILA_ACTIVA.classList.remove('fila-activa');
    FILA_ACTIVA = div;
    div.classList.add('fila-activa');
  }

  // Mete un ejercicio del buscador en la fila activa (o crea una nueva al final)
  function insertarEjercicioEnFila(nombre){
    var fila = FILA_ACTIVA;
    if(fila && !document.body.contains(fila)) fila = null;
    if(fila){
      var sel = fila.querySelector('.f-ejercicio');
      if(sel.value){ // la fila ya tiene ejercicio: añadimos una fila nueva en su mismo bloque
        var bloque = fila.closest('.editor-bloque');
        fila = nuevaFila(bloque.querySelector('.filas-cont'), {});
        marcarFilaActiva(fila);
      }
    }
    if(!fila){
      var bloques = $('bloques-cont').querySelectorAll('.editor-bloque');
      var ultimo = bloques.length ? bloques[bloques.length-1] : nuevoBloque({ etiqueta:'Parte principal' });
      fila = nuevaFila(ultimo.querySelector('.filas-cont'), {});
      marcarFilaActiva(fila);
    }
    var s = fila.querySelector('.f-ejercicio');
    s.value = nombre;
    fila.querySelector('.f-series').focus();
    repasarBanco();
    return fila;
  }

  function nuevoBloque(data){
    data = data||{};
    var cont = $('bloques-cont');
    var div=document.createElement('div'); div.className='editor-bloque';
    div.innerHTML =
      '<div class="b-cab"><input class="b-etiqueta" list="etiquetas-dl" placeholder="Etiqueta del bloque (Velocidad máxima, Fuerza / potencia…)">'+
        '<input class="b-matiz" placeholder="Matiz (lo que va tras el guion: «Calidad pura»)">'+
        '<button type="button" class="mini-x b-quitar" title="Quitar bloque">×</button></div>'+
      '<div class="filas-cab"><span>Ejercicio</span><span class="cab-series">Series</span><span>Distancia</span><span>Ritmo</span><span>Recuperación</span><span class="cab-cz">Calzado</span><span></span></div>'+
      '<div class="filas-cont"></div>'+
      '<div class="b-pie">'+
        '<button type="button" class="btn-mini b-add-fila">+ Añadir fila</button>'+
        '<label class="b-rec-caja"><span>descanso tras el bloque</span>'+
          '<input class="b-rec" placeholder="3\'"></label>'+
        '<label class="b-rec-caja b-rec-ej-caja"><span>entre ejercicios</span>'+
          '<input class="b-rec-ej" placeholder="3\'"></label>'+
      '</div>';
    cont.appendChild(div);
    // Lo que este editor todavía no sabe editar (la calle de natación, los
    // atletas del bloque) se guarda aquí para devolverlo intacto al grabar.
    // Se apunta TODO lo que no se edita, no una lista de dos cosas: así, el
    // día que otra pantalla escriba un campo nuevo, no se cae al guardar
    // aquí sin que nadie se dé cuenta.
    var CAMPOS_DEL_BLOQUE = ['etiqueta','matiz','filas','rec_bloque','rec_ejercicios'];
    div.__extra = {};
    Object.keys(data).forEach(function(k){ if(CAMPOS_DEL_BLOQUE.indexOf(k) < 0) div.__extra[k] = data[k]; });
    div.querySelector('.b-etiqueta').value = data.etiqueta||'';
    div.querySelector('.b-matiz').value = data.matiz||'';
    if(Dsc){
      var sB = Dsc.recEntreBloques(data), sE = Dsc.recEntreEjercicios(data);
      div.querySelector('.b-rec').value    = sB>0 ? Dsc.fmtSegundos(sB) : '';
      div.querySelector('.b-rec-ej').value = sE>0 ? Dsc.fmtSegundos(sE) : '';
    }
    var filasCont = div.querySelector('.filas-cont');
    div.querySelector('.b-quitar').addEventListener('click', function(){ div.remove(); pedirResumen(); });
    div.querySelector('.b-add-fila').addEventListener('click', function(){ nuevaFila(filasCont, {}); });
    var filas = Array.isArray(data.filas)?data.filas:[];
    if(filas.length){ filas.forEach(function(f){ nuevaFila(filasCont, f); }); }
    else { nuevaFila(filasCont, {}); }
    aplicarModoFilas();
    return div;
  }

  // ------------------------------------------------------------
  // Las columnas se adaptan al tipo de sesión:
  //   gym                          -> Carga (% RM), sin Calzado
  //   pista / continuo / activación-> Calzado y Rec, sin Carga
  // El material de natación es un interruptor aparte (ver más abajo).
  // Y la recuperación se adapta al DEPORTE del grupo: salida o
  // descanso en natación, tiempo o metros en pista y running, entre
  // series y entre ejercicios en El Cubo, y la bajada en montaña.
  // ------------------------------------------------------------
  var DISCIPLINAS_UI = ['natacion','pista','running','cubo','montana'];

  function aplicarModoFilas(){
    var cont = $('bloques-cont'); if(!cont) return;
    var tipo = $('pl-tipo') ? $('pl-tipo').value : '';
    var esGym = (tipo === 'gym');
    cont.classList.toggle('modo-gym', esGym);
    var conMaterial = $('pl-material') ? $('pl-material').checked : false;
    cont.classList.toggle('con-material', conMaterial);
    cont.querySelectorAll('.cab-cz').forEach(function(el){ el.textContent = esGym ? 'Carga' : 'Calzado'; });
    cont.querySelectorAll('.cab-series').forEach(function(el){ el.textContent = esGym ? 'Series × reps' : 'Series'; });
    var dis = disciplinaActual();
    DISCIPLINAS_UI.forEach(function(d){ cont.classList.toggle('modo-'+d, d===dis); });
    cont.querySelectorAll('.editor-fila').forEach(function(fe){ rehacerRecFila(fe, dis); });
    pintarAyudaRec(dis);
    pedirResumen();
  }

  // Una sola línea que explica lo que hay que explicar de este deporte.
  // Si no hay nada que aclarar, la línea desaparece: nunca un hueco.
  var AYUDA_REC = {
    natacion: '<strong>Salida cada X</strong>: nadar y descansar caben dentro del intervalo. '+
              '<strong>Descanso</strong>: segundos parado al tocar la pared, tardes lo que tardes.',
    pista:    'La recuperación va en tiempo (<code>2\'</code>, <code>90"</code>) o en metros (<code>200 m</code>), diciendo si es trote o parado. En un rodaje o una tirada el campo se quita solo.',
    running:  'La recuperación va en tiempo (<code>2\'</code>, <code>90"</code>) o en metros (<code>200 m</code>), diciendo si es trote o parado. En un rodaje o una tirada el campo se quita solo.',
    cubo:     'Dos descansos distintos: el de <strong>entre series</strong> va en cada fila y el de <strong>entre ejercicios</strong>, al pie del bloque.',
    montana:  'La recuperación es la bajada. El desnivel de la subida se apunta en la segunda línea de cada fila.'
  };
  function pintarAyudaRec(dis){
    var el = $('pl-ayuda-rec'); if(!el) return;
    var t = AYUDA_REC[dis] || '';
    el.innerHTML = t;
    el.hidden = !t;
  }

  // ------------------------------------------------------------
  // EN QUÉ MODO ESTÁ EL FORMULARIO
  // ------------------------------------------------------------
  // Tres modos, y hay que verlos ANTES de guardar, porque el botón
  // de guardar hace cosas distintas en cada uno:
  //   · nuevo   → crea un entrenamiento.
  //   · editando→ CAMBIA el que está abierto. Si alguien abre el
  //               del lunes pasado, le cambia la fecha y guarda, el
  //               del lunes pasado se mueve: no se queda una copia.
  //               Por eso aquí se dice, y por eso existe «Duplicar».
  //   · copia   → crea uno NUEVO y el original no se toca.
  // ------------------------------------------------------------
  /* Lo que dice la línea de los ajustes plegados. Sin esto, plegar sería
     esconder: hay que poder saber a quién va y dónde es sin abrir nada. */
  function pintarResumenAjustes(){
    var res = $('pl-ajustes-res'); if(!res) return;
    var p = [];
    var dep = $('pl-deporte') ? $('pl-deporte').value : '';
    if(dep) p.push(nombreDeporte(dep) || dep);
    var dep2 = $('pl-deporte2') ? $('pl-deporte2').value : '';
    if(dep2) p.push('y '+String(nombreDeporte(dep2) || dep2).toLowerCase());
    var pap = $('pl-papel');
    if(pap && pap.value && pap.selectedIndex >= 0) p.push(pap.options[pap.selectedIndex].textContent);
    /* Para quién: es lo que más se equivoca, así que se dice con nombres. */
    var soloAlg = document.querySelector('input[name="pl-dest-modo"]:checked');
    if(soloAlg && soloAlg.value === 'algunos'){
      var ids = [];
      document.querySelectorAll('#pl-dest-lista input[type="checkbox"]:checked').forEach(function(c){ ids.push(c.value); });
      p.push(ids.length ? 'solo '+nombresDeIds(ids, 2) : '⚠️ sin nadie marcado');
    }
    var ab = $('pl-abierta');
    if(ab && ab.checked) p.push('abierto para apuntarse');
    var hora = $('pl-hora') ? $('pl-hora').value : '';
    var lugar = $('pl-lugar') ? $('pl-lugar').value : '';
    if(hora)  p.push(hora);
    if(lugar) p.push(lugar);
    res.textContent = p.length ? p.join(' · ') : 'sin tocar';
  }

  function pintarModo(){
    var pill = $('pl-estado'), aviso = $('pl-aviso-modo'), dup = $('pl-duplicar');
    /* «Pasárselo a otro día» va y viene con «Duplicar»: los dos necesitan un
       entrenamiento ya guardado, porque los dos parten de una copia suya. */
    var pas = $('pl-pasar');
    var bor = $('pl-borrar');
    if(!pill) return;
    var fecha = $('pl-fecha') ? $('pl-fecha').value : '';
    var titulo = $('pl-titulo') ? $('pl-titulo').value.trim() : '';
    var comoSeLlama = titulo || (fecha ? formatFecha(fecha) : 'sin título');
    if(COPIA_DE){
      pill.textContent = 'Copia sin guardar';
      pill.className = 'pill pill--copia';
      if(aviso){
        aviso.innerHTML = 'Esto es una <strong>copia</strong> de «'+esc(COPIA_DE.titulo || formatFecha(COPIA_DE.fecha))+'» ('+esc(formatFecha(COPIA_DE.fecha))+'). '+
          'El original <strong>no se toca</strong>: al guardar se creará un entrenamiento nuevo'+(fecha?' el '+esc(formatFecha(fecha)):'')+', en borrador. Cambia lo que quieras antes de guardar.';
        aviso.hidden = false;
      }
      if(dup) dup.hidden = true;
      if(pas) pas.hidden = true;
      if(bor) bor.hidden = true;
      cerrarPasar();
      return;
    }
    if(editandoId){
      pill.textContent = 'Editando: '+comoSeLlama;
      pill.className = 'pill';
      if(aviso){
        aviso.innerHTML = 'Al guardar se cambia <strong>ese mismo</strong> entrenamiento, también si le cambias la fecha. '+
          'Si lo que quieres es otro parecido para otro día, pulsa <strong>Duplicar</strong>.';
        aviso.hidden = false;
      }
      if(dup) dup.hidden = false;
      if(pas) pas.hidden = false;
      if(bor) bor.hidden = false;
      return;
    }
    pill.textContent = 'Nuevo entrenamiento';
    pill.className = 'pill';
    if(aviso){ aviso.innerHTML = ''; aviso.hidden = true; }
    if(dup) dup.hidden = true;
    if(pas) pas.hidden = true;
    if(bor) bor.hidden = true;
    cerrarPasar();
  }

  /* El panel se cierra solo en cuanto se cambia de entrenamiento: si se
     quedara abierto, estaría preguntando por uno que ya no es el de la
     pantalla. */
  function cerrarPasar(){
    var caja = $('pl-pasar-caja');
    if(caja) caja.hidden = true;
    PASAR.sesion = null; PASAR.creadaId = null; PASAR.faltasIds = [];
  }

  function limpiarFormulario(){
    editandoId = null;
    COPIA_DE = null;
    DURACION_EDIT = null;
    if($('pl-fecha')) $('pl-fecha').value = todayISO;
    if($('pl-titulo')) $('pl-titulo').value = '';
    /* Los dos ejes arrancan contestados: el deporte que hace ese grupo y
       «carga», que es el día de trabajo corriente. Quien planifica un martes
       normal no tiene que tocar ninguno de los dos. */
    if($('pl-deporte')) $('pl-deporte').value = deportePorGrupo($('pl-grupo') ? $('pl-grupo').value : '');
    if($('pl-deporte2')) $('pl-deporte2').value = '';
    if($('pl-papel')) $('pl-papel').value = 'carga';
    if(typeof pintarResumenAjustes==='function') pintarResumenAjustes();
    if($('pl-dep2-caja')) $('pl-dep2-caja').open = false;
    sincronizarTipo();
    if($('pl-nota')) $('pl-nota').value = '';
    if($('pl-publicar')) $('pl-publicar').checked = false;
    if($('pl-material')) $('pl-material').checked = grupoEsDeAgua($('pl-grupo') ? $('pl-grupo').value : '');
    if($('pl-dest')){ aplicarDest('pl', $('pl-grupo').value, null); if(refrescarDestPl) refrescarDestPl(); }
    // sesión nueva: cerrada, sin plazas y con el sitio habitual del grupo puesto
    if($('pl-abre')){ aplicarAbrir('pl', { lugar: lugarDeGrupo($('pl-grupo') ? $('pl-grupo').value : '') }); if(refrescarAbrirPl) refrescarAbrirPl(true); }
    $('bloques-cont').innerHTML='';
    // arranca con los tres bloques típicos vacíos
    nuevoBloque({etiqueta:'Calentamiento'});
    nuevoBloque({etiqueta:'Parte principal'});
    nuevoBloque({etiqueta:'Vuelta a la calma'});
    aplicarModoFilas();
    repasarBanco();      // formulario limpio: el ofrecimiento del banco también
    $('pl-msg').textContent=''; $('pl-msg').className='msg';
    if($('pl-editar')) $('pl-editar').value='';
    pintarModo();
  }

  function cargarSesionEnForm(s){
    editandoId = s.id;
    COPIA_DE = null;
    cerrarPasar();   // el panel preguntaba por el entrenamiento anterior
    // si el entrenador ya escribió la duración, esa manda: es un dato, no una estimación
    DURACION_EDIT = (s.duracion_min > 0) ? s.duracion_min : null;
    $('pl-grupo').value = s.grupo_id||'';
    $('pl-fecha').value = s.fecha||todayISO;
    PL_LUNES = lunesDeFecha($('pl-fecha').value); pintarSemanaPlan();
    $('pl-titulo').value = s.titulo||'';
    /* Un entrenamiento de antes de la migración 102 puede no traer los ejes
       nuevos si se pidió sin esas columnas: se deducen del tipo de siempre,
       igual que lo hace la base, para que al abrirlo no aparezca vacío. */
    $('pl-deporte').value = s.deporte || deporteDesdeTipo(s.tipo, s.grupo_id||$('pl-grupo').value);
    $('pl-deporte2').value = s.deporte_2 || '';
    $('pl-papel').value = s.papel_dia || papelDesdeRol(s.tipo, s.rol);
    if(typeof pintarResumenAjustes==='function') pintarResumenAjustes();
    if($('pl-dep2-caja')) $('pl-dep2-caja').open = !!s.deporte_2;
    $('pl-tipo').value = s.tipo||'';
    if(!$('pl-tipo').value) sincronizarTipo();
    $('pl-nota').value = s.nota_razonamiento||'';
    $('pl-publicar').checked = !!s.publicada;
    // ¿va a todo el grupo o solo a algunos? (null = todo el grupo)
    aplicarDest('pl', s.grupo_id||$('pl-grupo').value, Array.isArray(s.atletas_ids) ? s.atletas_ids : null);
    if(refrescarDestPl) refrescarDestPl();
    // ¿está abierta a que se apunte gente? con cuántas plazas, para qué secciones, a qué hora y dónde
    aplicarAbrir('pl', s);
    if(refrescarAbrirPl) refrescarAbrirPl(true);
    $('bloques-cont').innerHTML='';
    var bloques = Array.isArray(s.bloques)?s.bloques:[];
    // Si la sesión ya trae material apuntado, la casilla se marca sola para que se vea.
    var traeMaterial = bloques.some(function(b){
      return (b.filas||[]).some(function(f){ return f && f.material && f.material.length; });
    });
    if($('pl-material')) $('pl-material').checked = traeMaterial || grupoEsDeAgua(s.grupo_id||$('pl-grupo').value);
    // Una sesión sin bloques (p. ej. un día de descanso) se queda vacía: se sigue editando, no se convierte en nueva.
    bloques.forEach(function(b){ nuevoBloque(b); });
    aplicarModoFilas();
    /* Un entrenamiento de hace semanas puede traer ejercicios escritos a mano
       que nunca llegaron al banco: al abrirlo se vuelve a ofrecer añadirlos. */
    repasarBanco();
    $('pl-msg').textContent=''; $('pl-msg').className='msg';
    pintarModo();
  }

  /* ------------------------------------------------------------
     LA TIRA DE DÍAS DEL PLANIFICADOR
     ------------------------------------------------------------
     Se pinta con lo que ya está cargado en `window.__SESIONES_GRUPO`, así que
     no pide nada a la base: es la misma lista del desplegable, puesta como
     semana. Un día con entrenamiento lo abre; un día libre empieza uno nuevo
     con esa fecha ya puesta.
     ------------------------------------------------------------ */
  var PL_LUNES = null;   // lunes de la semana que se está viendo
  function lunesDeFecha(iso){
    var d = new Date(iso+'T00:00:00');
    if(isNaN(d.getTime())) d = new Date();
    var n = (d.getDay()+6)%7;               /* 0 = lunes */
    d.setDate(d.getDate()-n);
    return d.toISOString().slice(0,10);
  }
  function sesionesDelDia(iso){
    var todas = window.__SESIONES_GRUPO || {};
    var g = $('pl-grupo') ? $('pl-grupo').value : '';
    return Object.keys(todas).map(function(k){ return todas[k]; })
      .filter(function(s){ return s.fecha===iso && (!g || s.grupo_id===g); });
  }
  function pintarSemanaPlan(){
    var cont = $('pl-semana'); if(!cont) return;
    if(!PL_LUNES) PL_LUNES = lunesDeFecha(($('pl-fecha') && $('pl-fecha').value) || todayISO);
    var nom = ['lun','mar','mié','jue','vie','sáb','dom'];
    var sel = $('pl-fecha') ? $('pl-fecha').value : '';
    var h = '<div class="pls-cab">'+
      '<button type="button" class="pls-fl" data-pls="atras" aria-label="Semana anterior">&#8592;</button>'+
      '<span class="pls-rango">'+esc(rangoSemana(PL_LUNES))+'</span>'+
      '<button type="button" class="pls-fl" data-pls="alante" aria-label="Semana siguiente">&#8594;</button>'+
      '<button type="button" class="pls-hoy" data-pls="hoy">Hoy</button>'+
      '</div><div class="pls-dias">';
    for(var i=0;i<7;i++){
      var iso = addDias(PL_LUNES, i);
      var ses = sesionesDelDia(iso);
      var d = new Date(iso+'T00:00:00');
      var cls = 'pls-d'+(ses.length?'':' libre')+(iso===todayISO?' hoy':'')+(iso===sel?' sel':'');
      var et = ses.length
        ? esc((ses[0].titulo||'entrenamiento').slice(0,18))+(ses.length>1?' +'+(ses.length-1):'')
        : 'libre';
      var tit = ses.length
        ? formatFecha(iso)+': '+(ses[0].titulo||'entrenamiento')+(ses[0].publicada?'':' (borrador)')
        : formatFecha(iso)+': sin entrenamiento · se abre uno nuevo';
      h += '<button type="button" class="'+cls+'" data-pls-dia="'+iso+'" title="'+esc(tit)+'">'+
             '<span class="pls-n">'+(iso===todayISO?'hoy':nom[i])+'</span>'+
             '<span class="pls-num">'+d.getDate()+'</span>'+
             '<span class="pls-et">'+et+'</span></button>';
    }
    cont.innerHTML = h+'</div>';
  }
  function rangoSemana(lunes){
    var a = new Date(lunes+'T00:00:00'), b = new Date(addDias(lunes,6)+'T00:00:00');
    var m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return a.getDate()+' '+m[a.getMonth()]+' – '+b.getDate()+' '+m[b.getMonth()];
  }

  async function cargarSesionesGrupo(grupoId){
    var selEditar = $('pl-editar');
    if(!selEditar) return;
    selEditar.innerHTML = '<option value="">— nuevo entrenamiento —</option>';
    if(!grupoId) return;
    /* 200 en vez de 60: este desplegable ya no es solo «el de la semana
       pasada», es por donde se llega a lo de hace meses. */
    var r = await sb.from('sesiones').select('id,fecha,titulo,tipo,rol,deporte,deporte_2,papel_dia,nota_razonamiento,bloques,publicada,grupo_id,atletas_ids,abierta_inscripcion,plazas,abierta_a,hora,lugar,duracion_min').eq('grupo_id', grupoId).order('fecha',{ascending:false}).limit(200);
    if(r.error || !r.data){ return; }
    window.__SESIONES_GRUPO = {};
    /* Agrupados por mes: una lista de 200 fechas seguidas no se lee, y
       «lo de mayo» es como se busca de verdad un entrenamiento antiguo. */
    var html = '', mesActual = '';
    r.data.forEach(function(s){
      window.__SESIONES_GRUPO[s.id] = s;
      var d = new Date((s.fecha||'')+'T00:00:00');
      var mes = isNaN(d.getTime()) ? 'sin fecha' : (MESES_LARGOS[d.getMonth()]+' de '+d.getFullYear());
      if(mes !== mesActual){
        if(mesActual) html += '</optgroup>';
        html += '<optgroup label="'+esc(mes)+'">';
        mesActual = mes;
      }
      var soloAlgunos = Array.isArray(s.atletas_ids) && s.atletas_ids.length;
      html += '<option value="'+s.id+'">'+esc(formatFecha(s.fecha))+(s.publicada?'':' (borrador)')+' · '+esc(s.titulo||'sin título')+(soloAlgunos?' · solo '+esc(nombresDeIds(s.atletas_ids, 2)):'')+(s.abierta_inscripcion?' · abierta':'')+'</option>';
    });
    if(mesActual) html += '</optgroup>';
    PL_LUNES = null;              /* la semana se recoloca en la fecha del formulario */
    selEditar.innerHTML += html;
    pintarSemanaPlan();
  }

  function serializarBloques(){
    var bloques=[], dis = disciplinaActual();
    $('bloques-cont').querySelectorAll('.editor-bloque').forEach(function(be){
      var etiqueta = be.querySelector('.b-etiqueta').value.trim();
      var matiz = be.querySelector('.b-matiz').value.trim();
      var filas=[];
      be.querySelectorAll('.editor-fila').forEach(function(fe){
        var f={};
        /* El id de la fila, lo primero: es lo que hace que lo que el atleta
           apuntó siga pegado a su ejercicio aunque aquí se reordene todo. Ver
           el aviso de `nuevaFila`. Una fila nueva no lo trae y se lo pone la
           base al guardar. */
        var fid = fe.getAttribute('data-fid'); if(fid) f.id=fid;
        var ej = fe.querySelector('.f-ejercicio').value.trim(); if(ej) f.ejercicio=ej;
        // 'detalle' se mantiene tal cual: la zona del atleta ya lo lee.
        ['series','distancia','ritmo','detalle','calzado','carga','rir','observaciones'].forEach(function(k){
          var el = fe.querySelector('.f-'+k); if(!el) return;
          var v = el.value.trim(); if(v) f[k]=v;
        });
        // ⚠️ Los dos campos nuevos, 'rec' y 'desnivel_m', NO salen de un input
        // suelto y por eso no pueden ir en la lista de arriba: se arman aquí.
        // Si alguien vuelve a montar la fila desde una lista de campos, tienen
        // que estar los dos, o el descanso se pierde al guardar y no se nota
        // hasta que se recarga la página.
        var elD = fe.querySelector('.f-desnivel');                   // «400 m D+» -> 400
        var dm  = elD ? metrosDeTexto(elD.value) : null;
        if(dm) f.desnivel_m = dm;
        // `ponerRec` escribe a la vez el objeto `rec` y el texto de siempre en
        // `descanso`, para que ninguna pantalla se quede sin el dato.
        if(Dsc){
          var rec = leerRecDeFila(fe);
          if(rec) Dsc.ponerRec(f, rec, dis); else Dsc.quitarRec(f);
        }
        var mats = [];
        fe.querySelectorAll('.f-material-chk').forEach(function(chk){ if(chk.checked) mats.push(chk.value); });
        if(mats.length) f.material = mats;
        /* Una fila vacía se sigue tirando. El `id` no cuenta como contenido: si
           contara, una fila que el entrenador acaba de vaciar se quedaría
           guardada para siempre solo por llevar su identificador. */
        var tieneAlgo = Object.keys(f).some(function(k){ return k!=='id'; });
        if(tieneAlgo){
          /* Se devuelve lo que llegó y este editor no enseña, sin pisar
             nunca lo que sí se ha editado aquí. */
          var exF = fe.__extra || {};
          Object.keys(exF).forEach(function(k){ if(!(k in f)) f[k] = exF[k]; });
          filas.push(f);
        }
      });
      if(etiqueta || matiz || filas.length){
        var b = { etiqueta: etiqueta, filas: filas };
        if(matiz) b.matiz = matiz;
        // el separador que faltaba: el descanso DESPUÉS de este bloque
        if(Dsc){
          var elB = be.querySelector('.b-rec'), elE = be.querySelector('.b-rec-ej');
          Dsc.ponerRecEntreBloques(b, elB ? Dsc.segundosDeTexto(elB.value) : 0);
          if(dis==='cubo') Dsc.ponerRecEntreEjercicios(b, elE ? Dsc.segundosDeTexto(elE.value) : 0);
          else if(elE && Dsc.segundosDeTexto(elE.value) > 0) Dsc.ponerRecEntreEjercicios(b, Dsc.segundosDeTexto(elE.value));
        }
        // lo que este editor no edita (calle de natación, atletas del bloque)
        // se devuelve tal cual llegó, para no borrarlo sin querer
        var ex = be.__extra || {};
        Object.keys(ex).forEach(function(k){ if(!(k in b)) b[k] = ex[k]; });
        bloques.push(b);
      }
    });
    return bloques;
  }

  // ------------------------------------------------------------
  // Volumen y tiempo, SEPARADOS, en la cabecera de la sesión.
  // Las familias planifican con el tiempo, no con los metros. Si
  // faltan datos para estimarlo, se enseña solo el volumen: aquí no
  // se inventa un número.
  // ------------------------------------------------------------
  var DURACION_EDIT = null;    // la duración escrita a mano, si la sesión ya la traía
  var TIMER_RESUMEN = null;

  function pedirResumen(){
    if(TIMER_RESUMEN) clearTimeout(TIMER_RESUMEN);
    TIMER_RESUMEN = setTimeout(refrescarResumenSesion, 180);
  }

  function refrescarResumenSesion(){
    var caja = $('pl-resumen'); if(!caja) return;
    if(!Dsc){ caja.hidden = true; return; }
    var dis = disciplinaActual();
    var ses = { tipo: $('pl-tipo') ? $('pl-tipo').value : '', duracion_min: DURACION_EDIT, bloques: serializarBloques() };
    var r = Dsc.resumen(ses, { disciplina: dis });
    var html = '', notas = [];

    if(r.tiene_calles){
      // Cada nadador hace los bloques comunes MÁS los de su calle, no los de
      // todas: aquí el número general no significaría nada, así que va por calle.
      Dsc.estimarPorCalles(ses, { disciplina: dis }).forEach(function(e){
        var t = [Dsc.fmtMetros(e.metros), e.minutos>0 ? Dsc.fmtEstimado(e.minutos) : ''].filter(Boolean).join(' · ');
        if(t) html += '<span class="sr-dato">calle '+esc(e.calle)+' · '+esc(t)+'</span>';
      });
      if(html) notas.push('Este entrenamiento tiene bloques por calle: cada nadador hace los comunes y los de la suya.');
    } else {
      if(r.volumen) html += '<span class="sr-dato">'+esc(r.volumen)+'</span>';
      if(r.tiempo)  html += '<span class="sr-dato sr-tiempo">'+esc(r.tiempo)+'</span>';
      if(r.volumen && r.volumen_parcial) notas.push('Hay series medidas en tiempo o en repeticiones: los metros no lo cuentan todo.');
      if(!r.tiempo && r.faltan && r.faltan.length){
        notas.push('Todavía no se puede estimar el tiempo: '+r.faltan.slice(0,2).join(' · ')+'.');
      }
      if(r.tiempo && r.supuesto) notas.push('El tiempo sale de un ritmo supuesto: tómalo como orientación.');
    }
    if(html && notas.length) html += '<p class="sr-nota">'+esc(notas.join(' '))+'</p>';

    caja.innerHTML = html;
    caja.hidden = !html;      // si no hay nada que decir, no hay hueco que rellenar
  }

  (function renderPlanificar(){
    var cont = $('sec-planificar');
    if(!MIS_GRUPOS.length){ cont.innerHTML='<div class="tarjeta"><h2>Planificar entrenamiento</h2>'+vacioHTML(icVacCal, 'Necesitas tener al menos un grupo a tu cargo para planificar entrenamientos.')+'</div>'; return; }
    cont.innerHTML =
      '<div class="tarjeta">'+
        '<h2>Planificar entrenamiento</h2>'+
        /* ------------------------------------------------------------
           LA TIRA DE DÍAS, IGUAL QUE LA DEL ATLETA
           ------------------------------------------------------------
           El atleta puede saltar de un día a otro sin salir de la pantalla; el
           entrenador tenía que volver a la rejilla de «Planificar semana» y
           entrar otra vez. Ahora la semana está aquí arriba: se toca un día y
           se abre su entrenamiento, o se empieza uno nuevo si está libre.
           Cambiar de grupo también estaba enterrado abajo, así que el
           desplegable sube a la misma línea.
           ------------------------------------------------------------ */
        '<div class="pl-semana" id="pl-semana"></div>'+
        '<div class="grid2">'+
          '<div><label>Grupo</label><select id="pl-grupo">'+MIS_GRUPOS.map(function(gr){return '<option value="'+gr.id+'">'+esc(gr.nombre)+'</option>';}).join('')+'</select></div>'+
          '<div><label>Abrir un entrenamiento del grupo</label><select id="pl-editar"><option value="">— nuevo entrenamiento —</option></select>'+
            '<p class="ej-ayuda">Los anteriores, del más reciente al más antiguo. Al abrir uno puedes cambiarlo o <strong>duplicarlo</strong> para otro día.</p></div>'+
        '</div>'+
        '<div class="grid2">'+
          '<div><label>Fecha</label><input id="pl-fecha" type="date" value="'+todayISO+'"></div>'+
          '<div><label>Título</label><input id="pl-titulo" placeholder="p. ej. Series 6×150"></div>'+
        '</div>'+
        /* ------------------------------------------------------------
           LOS AJUSTES, PLEGADOS
           ------------------------------------------------------------
           Antes de llegar al primer ejercicio había que pasar por trece
           bloques: deporte, papel del día, «¿dos deportes?», para quién —con
           marcar todos, una casilla por atleta y dos avisos que decían lo
           mismo—, abierto para apuntarse, hora, lugar y dos ayudas más.

           Y de todo eso, lo que se cambia de verdad cada vez son la fecha, el
           título y los ejercicios. Lo demás se pone una vez y no se vuelve a
           mirar: el grupo entrena donde entrena y a la hora que entrena.

           Así que se pliega, y la línea de arriba dice lo que hay puesto
           —«Natación · Ajuste · solo Andrés e Irene · Mar»— para que plegado
           no signifique escondido. Mismo patrón que el «Filtrar» de noticias.
           ------------------------------------------------------------ */
        '<details class="pl-ajustes" id="pl-ajustes">'+
          '<summary><span class="pa-et">Ajustes del día</span><span class="pa-res" id="pl-ajustes-res"></span></summary>'+
        '<div class="grid2">'+
          '<div><label for="pl-deporte">Deporte</label><select id="pl-deporte">'+optsFijos(DEPORTES,'atletismo')+'</select></div>'+
          '<div><label for="pl-papel">Papel del día</label><select id="pl-papel">'+optsFijos(PAPELES,'carga')+'</select></div>'+
        '</div>'+
        /* El segundo deporte es el caso raro (gimnasio y luego series, como
           transferencia), así que va plegado: quien no lo necesita ni lo ve. */
        '<details class="ayuda" id="pl-dep2-caja"><summary>¿Ese día hace dos deportes?</summary>'+
          '<p class="pista">Solo si son <strong>dos de verdad y seguidos</strong>, sin irse a casa en medio. '+
            'El atleta verá que necesita las dos cosas, y el día le contará en los dos deportes.</p>'+
          '<label for="pl-deporte2">Y además</label>'+
          '<select id="pl-deporte2">'+optsPares(DEPORTES,'','— solo uno —')+'</select>'+
        '</details>'+
        /* El tipo de siempre ya no se elige: lo deduce la propia página a
           partir del deporte, y sirve para que las columnas de las filas y el
           formato del descanso sigan saliendo bien. Se queda oculto, no se
           borra: hay pantallas que lo leen. */
        '<select id="pl-tipo" hidden aria-hidden="true" tabindex="-1">'+optsPares(TIPOS,'')+'</select>'+
        cajaDestHTML('pl', '¿Para quién es este entrenamiento?')+
        cajaAbrirHTML('pl', '¿Abierto para apuntarse?',
          'Si lo dejas <strong>sin marcar</strong>, el entrenamiento es solo para tu grupo: en el calendario del club se ve que existe, pero nadie de fuera se puede apuntar. '+
          'Si lo marcas, aparece con el botón de <strong>apuntarse</strong> para la gente que digas debajo.')+
        /* Este campo NO es un cuaderno interno: sale tal cual en la zona del
           atleta y en la de la familia. Lo interno va en «Observaciones»,
           que tiene su propio permiso y no lo ve nadie más. */
        '</details>'+
        /* La nota se queda FUERA del plegado: la leen el atleta y su familia,
           y cambia todos los días. No es un ajuste, es contenido. */
        '<label>Nota / razonamiento</label><textarea id="pl-nota" placeholder="Objetivo del día, sensaciones a buscar, avisos…"></textarea>'+
        '<p class="ej-ayuda"><strong>Esto lo leen el atleta y su familia</strong>, debajo del entrenamiento. Lo que sea solo para el equipo técnico va en <strong>Observaciones</strong>.</p>'+
        '<h3>Bloques del entrenamiento</h3>'+
        '<div class="ses-resumen" id="pl-resumen" hidden></div>'+
        '<p class="pista" id="pl-ayuda-rec" style="margin:10px 0 10px;" hidden></p>'+
        '<div class="check" style="margin:0 0 10px;"><input type="checkbox" id="pl-material"><label for="pl-material">Entrenamiento de agua: mostrar el <strong>material de natación</strong> en cada fila (tabla, palas, aletas…). Se puede marcar más de uno.</label></div>'+
        /* Los tres párrafos de manual (ritmos, columnas y buscador) se leen
           una vez y a partir de ahí solo separan al entrenador de las filas
           que viene a rellenar. No se borra ni una palabra: se pliegan. */
        '<details class="ayuda"><summary>Cómo se rellenan las filas: ritmos y columnas</summary>'+
          '<p class="pista">'+PISTA_RITMO_HTML+'</p>'+
          '<p class="pista">Las columnas se ajustan solas al tipo de entrenamiento: en <strong>gimnasio</strong> aparecen <strong>Carga</strong> (<code>80% RM</code>) y <strong>RIR</strong>, y en <strong>pista, rodaje o activación</strong> aparecen <strong>Calzado</strong> y <strong>Rec</strong>.</p>'+
          '<p class="pista"><strong>RIR</strong> son las repeticiones que le sobran al acabar, y va <strong>en cada ejercicio</strong>, no en la sesión: escribe <code>2</code>, <code>2-3</code> o <code>sin fallo</code>. El atleta lo ve mientras entrena y apunta el suyo debajo de las series de ese ejercicio, así que luego puedes comparar: si pedías <code>2-3</code> y lo dejó a <code>0</code> se pasó; si lo dejó a <code>4</code>, le sobró y toca subir peso. Déjalo en blanco y no aparece por ninguna parte.</p>'+
          '<p class="pista"><strong>El ejercicio se escribe en su propia fila.</strong> Al teclear salen sugerencias del banco justo debajo: puedes elegir una con el dedo o con <strong>↑ ↓</strong> y <strong>Enter</strong>, o <strong>seguir escribiendo lo tuyo y pasar al siguiente campo</strong> sin elegir nada.</p>'+
          '<p class="pista"><strong>La casilla es libre:</strong> puedes escribir lo que quieras aunque no esté en el banco. Lo que el banco conozca se aprovecha (el <code>% RM</code>, lo que hizo la última vez); lo que no, se guarda y se enseña tal cual. Si escribes algo nuevo, debajo de los bloques te ofrecemos añadirlo al banco de un clic.</p>'+
        '</details>'+
        /* El buscador único que había aquí se ha quitado. Estaba ARRIBA y las
           filas debajo, así que con nueve ejercicios eran nueve viajes hasta
           arriba y nueve vueltas. Ahora cada fila tiene su campo y sus
           sugerencias: no hay a dónde subir. */
        '<div id="bloques-cont" style="margin-top:12px;"></div>'+
        '<div id="banco-nuevos" class="banco-nuevos" hidden></div>'+
        '<div style="margin-top:4px;"><button type="button" class="btn-mini" id="pl-add-bloque">+ Añadir bloque</button></div>'+
        '<div class="check" style="margin-top:16px;"><input type="checkbox" id="pl-publicar"><label for="pl-publicar">Publicar (visible en la zona de atleta, para quien lo hayas dirigido arriba)</label></div>'+
        '<p class="pista pl-modo" id="pl-aviso-modo" hidden></p>'+
        '<div class="acciones">'+
          '<button class="btn btn--primario" id="pl-guardar">Guardar entrenamiento</button>'+
          /* «Duplicar» solo aparece cuando hay un entrenamiento abierto:
             sobre uno nuevo no hay nada que copiar. */
          '<button class="btn btn--neutro" id="pl-duplicar" hidden>Duplicar</button>'+
          /* «Pasárselo a otro día» vive aquí, al lado de Duplicar, porque es
             lo mismo con otro nombre: una copia para otro día, pero dirigida
             a una persona. Y aparece justo donde el entrenador ya está
             mirando ese entrenamiento. */
          '<button class="btn btn--neutro" id="pl-pasar" hidden>Pasárselo a otro día</button>'+
          '<button class="btn btn--neutro" id="pl-nueva">Nuevo / limpiar</button>'+
          /* Borrar existía en ninguna parte: el único borrado de sesión de toda
             la web era el «Deshacer» de «Pasárselo a otro día», y solo valía
             para la copia recién hecha. Quien se equivocaba de día se quedaba
             con el entrenamiento de más para siempre. */
          '<button class="btn btn--peligro" id="pl-borrar" hidden>Borrar</button>'+
          '<span class="pill" id="pl-estado">Nuevo entrenamiento</span>'+
          '<span class="msg" id="pl-msg"></span>'+
        '</div>'+
        cajaPasarHTML()+
      '</div>';

    /* El buscador único que vivía aquí se ha quitado entero: cada fila
       tiene ahora su campo y sus sugerencias, así que no hay a dónde subir
       ni desplegables que acotar. */

    /* ¿Los añades al banco? Se ofrece debajo de los bloques, cuando ya se ha
       terminado de escribir, y NO bloquea nada: el entrenamiento se guarda
       igual con ejercicios que no estén en el banco. */
    $('banco-nuevos').addEventListener('click', async function(ev){
      var b = ev.target.closest ? ev.target.closest('[data-anadir]') : null;
      if(!b) return;
      var nombre = b.getAttribute('data-anadir');
      b.disabled = true; b.textContent = 'Añadiendo…';
      /* Se apunta con el deporte del día como pista de tipo, que es lo que
         mejor se puede adivinar sin preguntar. La categoría se deja vacía:
         inventarla sería peor que no ponerla. */
      var dep = $('pl-deporte') ? $('pl-deporte').value : '';
      var tipo = (dep==='fuerza'||dep==='cubo') ? 'gym' : (dep==='natacion' ? 'otro' : 'pista');
      var res = await sb.from('ejercicios').insert({ nombre: nombre, tipo: tipo, creado_por: perfil.id })
                  .select('nombre,nombre_corto,categoria,tipo').maybeSingle();
      if(res.error){
        b.disabled = false; b.textContent = 'Añadir al banco';
        var m = $('pl-msg'); if(m){ m.textContent = 'No se ha podido añadir: '+res.error.message; m.className='msg error'; }
        return;
      }
      if(res.data) EJERCICIOS.push(res.data);
      repasarBanco();
    });

    $('pl-add-bloque').addEventListener('click', function(){ nuevoBloque({}); });
    /* ------------------------------------------------------------
       BORRAR UN ENTRENAMIENTO
       ------------------------------------------------------------
       No existía en toda la web: el único borrado de sesión era el «Deshacer»
       de «Pasárselo a otro día», y solo valía para la copia recién creada. Si
       te equivocabas de día, el entrenamiento de más se quedaba ahí.

       ⚠️ SE AVISA DE LO QUE SE LLEVA POR DELANTE. Si algún atleta ya apuntó
       sus series en esa sesión, borrarla borra su trabajo —`registros_sesion`
       cuelga de `sesiones` con borrado en cascada—. Así que primero se mira si
       hay algo apuntado, se dice cuántos y de quién, y se pregunta otra vez.
       ------------------------------------------------------------ */
    $('pl-borrar').addEventListener('click', async function(){
      if(!editandoId) return;
