<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona de entrenador · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .en-wrap { max-width: 1060px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  .en-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(32px,7vw,46px); color: var(--navy); margin: 0 0 3px; line-height:1; }
  .en-cab .sub { font-size: 13.5px; color: var(--texto-suave); }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 210px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding:8px; box-shadow: var(--sombra-suave); }
  .side nav a { cursor:pointer; font-size:13.5px; color: var(--texto-suave); padding:10px 12px; border-radius:10px; text-decoration:none; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { background: var(--navy); color:#fff; }
  .side nav .side-sep { display:block; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color: var(--texto-tenue); padding:12px 12px 4px; }
  .side nav .side-sep:first-child { padding-top:4px; }
  .cont { flex:1 1 auto; min-width:0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(18px,3vw,26px); box-shadow: var(--sombra-suave); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  .tarjeta h3 { font-size:15px; color: var(--navy); margin: 14px 0 8px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:none; color: var(--texto-tenue); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:11px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); text-transform:capitalize; }
  .pill.activo { background:#e6f4ea; color:#1e7a3d; }
  .pill.lesionado { background:#fdeceb; color:#b3261e; }
  .pill.prueba { background: var(--azul-suave); color: var(--azul-oscuro); }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  input:focus, select:focus, textarea:focus { outline:none; border-color: var(--azul); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; } .msg.pendiente { color:#A8453F; font-weight:600; }
  .check { display:flex; align-items:center; gap:8px; }
  .check input { width:auto; }
  .check label { margin:0; }

  /* ¿para quién es la sesión? */
  .dest { border:1px solid var(--linea); border-radius:12px; padding:12px 14px; margin-top:14px; background: var(--crema); }
  .dest > label:first-child { margin-top:0; }
  .dest-lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px; margin-top:10px; }
  .dest-lista label { display:flex; align-items:center; gap:8px; margin:0; font-weight:400; font-size:13.5px; background:#fff; border:1px solid var(--linea); border-radius:9px; padding:7px 10px; cursor:pointer; }
  .dest-lista input { width:auto; }
  .dest-aviso { background:#fff8e6; border:1px solid #f0d98a; color:#7a5c00; border-radius:9px; padding:8px 11px; font-size:12.5px; margin:10px 0 0; }
  .dest-barra { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pista { font-size:12.5px; color: var(--texto-suave); margin:6px 0 0; line-height:1.5; }
  .pista code { font-family: var(--fuente-mono); font-size:12px; background: var(--crema-media); border-radius:4px; padding:1px 5px; }

  /* ¿abierto para apuntarse? (resumen en una línea) */
  .abre-resumen { display:inline-block; font-family: var(--fuente-mono); font-size:11.5px; letter-spacing:.03em; background: var(--azul-suave); color: var(--azul-oscuro); border-radius:999px; padding:4px 11px; margin:10px 0 0; line-height:1.5; }
  .abre-resumen.cerrado { background: var(--crema-media); color: var(--texto-suave); }
  .abre-resumen.ojo { background:#fff8e6; color:#7a5c00; }

  /* quién se ha apuntado */
  .ap-ses { border:1px solid var(--linea); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .ap-cab { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:6px; }
  .ap-cab strong { font-size:15px; color: var(--navy); }
  .ap-lista { list-style:none; margin:8px 0 0; padding:0; }
  .ap-lista li { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:14px; color: var(--texto); padding:7px 0; border-bottom:1px solid #F5F0E6; }
  .ap-lista li:last-child { border-bottom:none; }
  .ap-lista li span { font-family: var(--fuente-mono); font-size:11.5px; color: var(--texto-tenue); }
  .ap-quitar { border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; font-family: var(--fuente-texto); }
  .ap-quitar:hover { border-color:#b3261e; color:#b3261e; }

  /* mejores marcas en Mi grupo */
  .mrc { display:flex; flex-wrap:wrap; gap:5px; }
  .mrc span { font-family: var(--fuente-mono); font-size:11.5px; background: var(--azul-suave); color: var(--azul-oscuro); border-radius:6px; padding:2px 7px; white-space:nowrap; }
  .mrc-no { font-size:12.5px; color: var(--texto-tenue); font-style:italic; }

  /* ---------- PASAR LISTA ---------- */
  .lst-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:16px 0 12px; }
  .lst-cab > div { flex:1 1 auto; min-width:0; }
  .lst-cab .lst-ctx { font-size:12.5px; color: var(--texto-suave); display:block; margin-bottom:3px; }
  .lst-cab .lst-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:30px; text-transform:uppercase; color: var(--navy); line-height:1; }
  .lst-contador { font-family: var(--fuente-mono); font-size:15px; color:#4C7A28; white-space:nowrap; }
  .lst-contador.cero { color: var(--texto-tenue); }
  .lst-avisos { background:#FBE9E7; border:1px solid #F0D9D9; color:#8B3A35; border-radius:12px; padding:11px 14px; margin-bottom:12px; font-size:13.5px; }
  .lst-avisos strong { display:block; color:#A8453F; margin-bottom:5px; }
  .lst-avisos ul { margin:0 0 0 18px; padding:0; }
  .lst-avisos li { margin:2px 0; }
  .lst-avisos li b { color:#8B3A35; }
  .lst-avisos li span { color:#A8453F; opacity:.75; }
  .lst-avisos p { margin:7px 0 0; font-size:12.5px; opacity:.85; }
  .lst-acciones { display:flex; gap:8px; margin-bottom:10px; }
  .lst-acciones button { flex:1; padding:11px; min-height:44px; border-radius:999px; background:#fff; border:1px solid var(--linea-borde); color: var(--texto); font-size:14px; cursor:pointer; font-family: var(--fuente-texto); }
  .lst-acciones button:hover { border-color: var(--azul); color: var(--azul-oscuro); }
  .lst-buscar { margin-bottom:10px; }
  .lst-lista { display:flex; flex-direction:column; gap:7px; }
  .lst-fila { background:#fff; border:1px solid var(--linea); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:12px; }
  .lst-fila.es-ausente { background:#FBE9E7; border-color:#F0D9D9; }
  .lst-fila.es-prueba { background: var(--azul-suave); border-style:dashed; border-color:#C9D9E7; }
  .avatar { width:34px; height:34px; flex:0 0 34px; border-radius:50%; background: var(--azul-suave); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; letter-spacing:.02em; }
  .lst-fila.es-ausente .avatar { background:#fff; color:#A8453F; }
  .lst-nom { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .lst-nom > button { background:none; border:none; padding:0; margin:0; text-align:left; font-family: var(--fuente-texto); font-size:15px; color: var(--navy); cursor:pointer; text-decoration:underline; text-decoration-color: var(--linea-borde); text-underline-offset:3px; }
  .lst-nom > button:hover { color: var(--azul-oscuro); }
  .lst-sub { font-size:12px; color: var(--texto-suave); }
  .lst-sub.avisada { color:#A8453F; }
  .lst-sub.prueba { color: var(--azul-oscuro); }
  .seg { display:flex; gap:8px; flex:0 0 auto; }
  .seg button { width:44px; height:44px; min-height:44px; border-radius:50%; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-tenue); font-size:17px; line-height:1; cursor:pointer; padding:0; }
  .seg button.si.on { background:#7FBF4A; border-color:#7FBF4A; color:#fff; }
  .seg button.no.on { background:#fff; border-color:#A8453F; color:#A8453F; font-weight:700; }
  .seg button:focus-visible { outline:2px solid var(--azul); outline-offset:2px; }
  .lst-pie { margin-top:16px; padding-top:14px; border-top:1px solid var(--linea); display:flex; flex-direction:column; gap:8px; align-items:center; }
  .lst-pie .btn { width:100%; max-width:340px; }
  .lst-pie p { font-size:12px; color: var(--texto-suave); text-align:center; margin:0; }
  .lst-resumen { font-size:14.5px; color: var(--navy); text-align:center; margin:0; }

  /* ---------- FICHA DEL ATLETA ---------- */
  .ficha-fondo { position:fixed; inset:0; background:rgba(46,66,86,.45); z-index:60; display:flex; justify-content:center; align-items:flex-start; overflow-y:auto; padding:0; }
  .ficha { background: var(--crema); width:100%; max-width:560px; min-height:100%; box-sizing:border-box; padding:0 0 30px; }
  @media (min-width:620px){ .ficha-fondo { padding:24px 16px; } .ficha { min-height:0; border-radius: var(--radio-grande); overflow:hidden; box-shadow: var(--sombra-tarjeta); } }
  .ficha-barra { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background: var(--crema); position:sticky; top:0; z-index:2; border-bottom:1px solid var(--linea); }
  .ficha-barra button { background:none; border:none; color: var(--azul-oscuro); font-size:15px; cursor:pointer; font-family: var(--fuente-texto); padding:4px; }
  .ficha-enc { padding:16px 20px 18px; display:flex; gap:16px; align-items:center; }
  .ficha-enc .avatar { width:64px; height:64px; flex-basis:64px; font-size:21px; }
  .ficha-enc h3 { font-family: var(--fuente-titulo); font-weight:700; font-size:29px; text-transform:uppercase; color: var(--navy); line-height:1; margin:0 0 4px; }
  .ficha-enc p { font-size:14px; color: var(--texto-suave); margin:0; }
  .ficha-bloque { margin:0 16px 14px; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px 16px; }
  .ficha-bloque > h4 { font-size:12.5px; color: var(--texto-suave); margin:0 0 10px; font-weight:600; }
  .dato { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #F5F0E6; font-size:14px; color: var(--texto); }
  .dato:last-child { border-bottom:none; padding-bottom:0; }
  .dato b { font-family: var(--fuente-mono); font-size:13.5px; font-weight:400; color: var(--navy); text-align:right; }
  .dato b.bien { color:#4C7A28; } .dato b.ojo { color:#8A7530; } .dato b.mal { color:#A8453F; }
  .ficha-tit { padding:16px 20px 8px; font-size:12.5px; font-weight:600; color: var(--texto-suave); }
  /* Los dos cuadernos: privado (crema, candado) y familia (azul, ojo).
     Se distinguen a propósito por color, etiqueta y texto explícito. */
  .ficha-bloque.priv { background:#FFF8E6; border-color:#F0D98A; }
  .ficha-bloque.fam  { background: var(--azul-suave); border-color:#C9D9E7; }
  .ficha-bloque.priv .dato, .ficha-bloque.fam .dato,
  .ficha-bloque.priv .mini-lista li, .ficha-bloque.fam .mini-lista li { border-bottom-color: rgba(46,66,86,.10); }
  .ficha-bloque > h4 .marca-priv, .ficha-bloque > h4 .marca-fam { font-size:11px; font-weight:600; border-radius:999px; padding:3px 9px; margin-left:8px; white-space:nowrap; }
  .ficha-bloque > h4 .marca-priv { background:#7A5C00; color:#fff; }
  .ficha-bloque > h4 .marca-fam  { background: var(--azul-oscuro); color:#fff; }
  .ficha-bloque .marca-expl { font-size:12.5px; margin:-4px 0 10px; color: var(--texto); }
  .ficha-bloque.priv .marca-expl { color:#7A5C00; }
  .ficha-bloque.fam  .marca-expl { color: var(--azul-oscuro); }
  .ficha-bloque textarea { background:#fff; }
  .acc-lista { margin:0 16px; display:flex; flex-direction:column; gap:8px; }
  .acc { background:#fff; border:1px solid var(--linea); border-radius:12px; padding:0; overflow:hidden; }
  .acc > button { width:100%; background:none; border:none; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; font-family: var(--fuente-texto); font-size:15px; color: var(--navy); text-align:left; }
  .acc > button:hover { background: var(--azul-suave); }
  .acc > button .acc-val { font-size:14px; color: var(--texto-suave); white-space:nowrap; }
  .acc > button .acc-val.azul { color: var(--azul-oscuro); font-weight:600; }
  .acc.roja { background:#FBE9E7; border-color:#F0D9D9; }
  .acc.roja > button { color:#A8453F; } .acc.roja > button .acc-val { color:#A8453F; }
  .acc.roja > button:hover { background:#F7DEDB; }
  .acc[hidden] { display:none; }
  .acc-caja { padding:0 16px 14px; border-top:1px solid var(--linea); }
  .acc-caja label:first-child { margin-top:12px; }
  .ficha-nota { margin:16px 16px 0; background: var(--crema-banda); border:1px solid var(--linea-borde); border-radius:12px; padding:12px 15px; font-size:13px; color: var(--texto); line-height:1.45; }
  .mini-lista { list-style:none; margin:0; padding:0; }
  .mini-lista li { display:flex; justify-content:space-between; gap:10px; font-size:13.5px; color: var(--texto); padding:6px 0; border-bottom:1px solid #F5F0E6; }
  .mini-lista li:last-child { border-bottom:none; }
  .mini-lista li span { font-family: var(--fuente-mono); font-size:12px; color: var(--texto-tenue); white-space:nowrap; }
  .mini-lista li b { font-weight:600; color: var(--navy); }
  .fila-atleta { cursor:pointer; }
  .fila-atleta:hover { background: var(--azul-suave); }
  .fila-atleta td:first-child { color: var(--azul-oscuro); text-decoration:underline; text-decoration-color: var(--linea-borde); text-underline-offset:3px; }

  /* editor de bloques */
  .editor-bloque { border:1px solid var(--linea); border-radius:14px; padding:12px; margin-bottom:12px; background: var(--crema); }
  .b-cab { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .b-cab .b-etiqueta { flex:1 1 210px; font-weight:600; }
  .b-cab .b-matiz { flex:1 1 190px; font-style:italic; }
  .filas-cab { display:grid; grid-template-columns:1.7fr .72fr .85fr .8fr .8fr .95fr 34px; gap:6px; font-family: var(--fuente-mono); font-size:10px; letter-spacing:.05em; text-transform:none; color: var(--texto-tenue); padding:0 2px 4px; }
  .editor-fila { margin-bottom:9px; }
  .fila-l1 { display:grid; grid-template-columns:1.7fr .72fr .85fr .8fr .8fr .95fr 34px; gap:6px; align-items:center; }
  .fila-l2 { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:5px; padding-right:40px; }
  .fila-l2 .f-detalle { flex:1 1 150px; min-width:0; }
  .fila-l2 .f-observaciones { flex:2 1 280px; min-width:0; }
  .editor-fila input, .editor-fila select { padding:8px 8px; font-size:13px; border-radius:8px; }
  .f-cel-cz { min-width:0; }
  .f-cel-cz select, .f-cel-cz input { width:100%; }

  /* calzado / carga según el tipo de sesión */
  #bloques-cont .f-carga { display:none; }
  #bloques-cont.modo-gym .f-carga { display:block; }
  #bloques-cont.modo-gym .f-calzado { display:none; }

  /* material de natación (varios a la vez) */
  .f-material-caja { flex:1 1 100%; display:none; gap:5px; flex-wrap:wrap; align-items:center; }
  #bloques-cont.con-material .f-material-caja { display:flex; }
  .f-material-caja > .mat-tit { font-family: var(--fuente-mono); font-size:10px; letter-spacing:.05em; text-transform:none; color: var(--texto-tenue); margin-right:2px; }
  .mat-op { margin:0; position:relative; }
  /* la casilla se oculta a la vista pero se sigue pudiendo enfocar con el teclado */
  .mat-op input { position:absolute; width:1px; height:1px; opacity:0; margin:0; padding:0; }
  .mat-op span { display:inline-block; font-size:12px; line-height:1; padding:6px 9px; border:1px solid var(--linea-borde); border-radius:999px; background:#fff; color: var(--texto-suave); cursor:pointer; user-select:none; }
  .mat-op input:checked + span { background: var(--azul-suave); border-color: var(--azul); color: var(--azul-oscuro); font-weight:600; }
  .mat-op input:focus-visible + span { outline:2px solid var(--azul); outline-offset:2px; }
  .mini-x { border:1px solid var(--linea-borde); background:#fff; border-radius:8px; width:34px; height:36px; cursor:pointer; color: var(--texto-suave); font-size:18px; line-height:1; padding:0; }
  .mini-x:hover { border-color:#b3261e; color:#b3261e; }
  .btn-mini { font-family: var(--fuente-mono); font-size:12px; text-transform:none; letter-spacing:.05em; border:1px solid var(--linea-borde); background:#fff; color: var(--azul-oscuro); border-radius:8px; padding:8px 13px; cursor:pointer; }
  .btn-mini:hover { background: var(--azul-suave); border-color: var(--azul); }

  /* buscador de ejercicios */
  .buscador-ej { position:relative; }
  .buscador-ej input { border-radius:10px; }
  .buscador-ej.abierto input { border-radius:10px 10px 0 0; border-bottom-color: transparent; }
  .ej-res { border:1px solid var(--linea-borde); border-top:none; border-radius:0 0 10px 10px; max-height:240px; overflow-y:auto; background:#fff; box-shadow: var(--sombra-suave); }
  .ej-item { padding:8px 11px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--linea); display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .ej-item:last-child { border-bottom:none; }
  .ej-item:hover, .ej-item.sel { background: var(--azul-suave); }
  .ej-item .ej-meta { font-family: var(--fuente-mono); font-size:10.5px; text-transform:none; letter-spacing:.05em; color: var(--texto-tenue); white-space:nowrap; }
  .ej-vacio { padding:10px 11px; font-size:13px; color: var(--texto-tenue); }
  .ej-ayuda { font-size:12px; color: var(--texto-tenue); margin:6px 0 0; }
  .editor-fila.fila-activa { outline:2px solid var(--azul); outline-offset:3px; border-radius:8px; }

  /* planificar semana */
  .sw-ayuda { background: var(--crema); border:1px solid var(--linea); border-radius:12px; padding:11px 14px; margin-top:14px; font-size:13.5px; color: var(--texto); }
  .sw-ayuda summary { cursor:pointer; font-family: var(--fuente-mono); font-size:11px; letter-spacing:.08em; text-transform:none; color: var(--azul-oscuro); }
  .sw-ayuda pre { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:10px 12px; overflow-x:auto; font-size:12.5px; line-height:1.5; margin:10px 0; white-space:pre; }
  .sw-ayuda ul { margin:8px 0 0 18px; padding:0; }
  .sw-ayuda li { margin:3px 0; }

<script>
/* Avisos suaves y confirmaciones no bloqueantes del portal (APX). */
(function(){
  if (window.APX) return;
  var css =
    '.apx-host{position:fixed;left:0;right:0;bottom:18px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}'+
    '.apx-toast{pointer-events:auto;max-width:440px;background:var(--navy,#2E4256);color:#fff;font-family:var(--fuente-texto,system-ui);font-size:14px;line-height:1.4;padding:12px 16px;border-radius:12px;box-shadow:0 16px 34px -18px rgba(46,66,86,.7);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}'+
    '.apx-toast.apx-in{opacity:1;transform:none}'+
    '.apx-toast.apx-error{background:#B23A38}'+
    '.apx-toast.apx-ok{background:#2F6FA8}'+
    '.apx-ov{position:fixed;inset:0;z-index:10000;background:rgba(30,42,56,.5);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .2s}'+
    '.apx-ov.apx-in{opacity:1}'+
    '.apx-dlg{background:var(--crema,#FBF9F4);border:1px solid var(--linea,#EAE3D5);border-radius:18px;box-shadow:0 34px 60px -30px rgba(46,66,86,.6);max-width:400px;width:100%;padding:22px 22px 18px;transform:translateY(8px) scale(.98);transition:transform .2s}'+
    '.apx-ov.apx-in .apx-dlg{transform:none}'+
    '.apx-dlg-msg{margin:0 0 18px;font-family:var(--fuente-texto,system-ui);font-size:15px;line-height:1.5;color:var(--texto,#5E5849)}'+
    '.apx-dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}'+
    '.apx-btn{font-family:var(--fuente-texto,system-ui);font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--linea-borde,#E0D8C8);background:#fff;color:var(--navy,#2E4256);cursor:pointer;min-height:42px}'+
    '.apx-btn:hover{border-color:#C9D9E7}'+
    '.apx-ok{background:var(--azul,#3B85C0);border-color:var(--azul,#3B85C0);color:#fff}'+
    '.apx-ok:hover{background:var(--azul-oscuro,#2F6FA8)}'+
    '.apx-ok.apx-danger{background:#B23A38;border-color:#B23A38}'+
    '.apx-ok.apx-danger:hover{background:#8f2c2b}'+
    '@media(max-width:420px){.apx-dlg-btns{flex-direction:column-reverse}.apx-btn{width:100%}}';
  var st=document.createElement('style'); st.textContent=css; (document.head||document.documentElement).appendChild(st);
  var host=null;
  function ensureHost(){ if(!host){ host=document.createElement('div'); host.className='apx-host'; document.body.appendChild(host);} return host; }
  function toast(msg,tipo){
    ensureHost();
    var el=document.createElement('div'); el.className='apx-toast'+(tipo?' apx-'+tipo:''); el.textContent=msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('apx-in'); });
    var vida=(tipo==='error')?4600:3000;
    setTimeout(function(){ el.classList.remove('apx-in'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); }, vida);
  }
  function confirmar(msg,opts){
    opts=opts||{};
    return new Promise(function(resolve){
      var ov=document.createElement('div'); ov.className='apx-ov';
      var dlg=document.createElement('div'); dlg.className='apx-dlg'; dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true');
      var p=document.createElement('p'); p.className='apx-dlg-msg'; p.textContent=msg; dlg.appendChild(p);
      var btns=document.createElement('div'); btns.className='apx-dlg-btns';
      var bc=document.createElement('button'); bc.type='button'; bc.className='apx-btn'; bc.textContent=opts.cancelar||'Cancelar';
      var bo=document.createElement('button'); bo.type='button'; bo.className='apx-btn apx-ok'; bo.textContent=opts.aceptar||'Aceptar';
      if(opts.peligro) bo.classList.add('apx-danger');
      btns.appendChild(bc); btns.appendChild(bo); dlg.appendChild(btns); ov.appendChild(dlg);
      document.body.appendChild(ov);
      requestAnimationFrame(function(){ ov.classList.add('apx-in'); });
      function cerrar(v){ ov.classList.remove('apx-in'); document.removeEventListener('keydown',onkey); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); resolve(v); }
      function onkey(e){ if(e.key==='Escape'){ e.preventDefault(); cerrar(false);} else if(e.key==='Enter'){ e.preventDefault(); cerrar(true);} }
      bc.addEventListener('click',function(){ cerrar(false); });
      bo.addEventListener('click',function(){ cerrar(true); });
      ov.addEventListener('click',function(e){ if(e.target===ov) cerrar(false); });
      document.addEventListener('keydown',onkey);
      setTimeout(function(){ bo.focus(); },40);
    });
  }
  window.APX={ toast:toast, confirm:confirmar };
})();
</script>

  function numMarca(s){
    if(s==null) return null;

  var elMas = $('masheet');
  function abrirMas(){ elMas.hidden=false; }
  function cerrarMas(){ if(elMas) elMas.hidden=true; }
  var btnMas = wrap.querySelector('.tabbar [data-mas]');
  if(btnMas) btnMas.addEventListener('click', function(){ elMas.hidden ? abrirMas() : cerrarMas(); });
  wrap.querySelectorAll('#masheet [data-cerrar]').forEach(function(x){ x.addEventListener('click', cerrarMas); });

  // ============================================================
  // SECCIÓN 1 · MI GRUPO
  // ============================================================
  function renderMiGrupo(){
    var cont = $('grupo-cont');
    if(!MIS_GRUPOS.length){
      cont.innerHTML = '<div class="tarjeta"><h2>Mi grupo</h2>'+
        vacioHTML(icVacGrupo, 'Aún no tienes grupos a tu cargo. Cuando el club te asigne uno, aparecerá aquí con sus atletas.')+'</div>';
      return;
    }
    var html = '';
    MIS_GRUPOS.forEach(function(gr){
      var atls = MIS_ATLETAS.filter(function(x){ return x.grupo_id===gr.id; });
      var sub = [gr.seccion, gr.horario].filter(Boolean).map(function(s){ return esc(s); }).join(' · ');
      var tabla;
      if(atls.length){
        tabla = '<div class="atletas-lista">'+
          atls.map(function(x){
            var est = x.estado||''; var cls = (est==='activo'?'activo':est==='lesionado'?'lesionado':est==='prueba'?'prueba':'');
            var nom = ((x.nombre||'')+' '+(x.apellidos||'')).trim();
            var ini = ((x.nombre||'?').charAt(0)+(x.apellidos?x.apellidos.charAt(0):'')).toUpperCase();
            var mrc = mejoresMarcasDe(x.id, 4);
            var celdaMarcas = mrc.length
              ? '<div class="mrc">'+mrc.map(function(m){
                  return '<span title="'+escAttr(m.prueba+(m.fecha?' · '+formatFecha(m.fecha):''))+'">'+esc(m.prueba)+' '+esc(m.disp)+'</span>';
                }).join('')+'</div>'
              : '<span class="mrc-no">Sin marcas registradas</span>';
            return '<div class="atleta-row fila-atleta" data-atleta="'+x.id+'" tabindex="0" role="button">'+
              '<div class="ar-av">'+esc(ini)+'</div>'+
              '<div class="ar-main">'+
                '<div class="ar-nom">'+esc(nom)+' <span class="pill '+cls+'">'+esc(est||'—')+'</span></div>'+
                (x.categoria?'<div class="ar-cat">'+esc(x.categoria)+'</div>':'')+
                celdaMarcas+
              '</div>'+
              '<span class="ar-chev" aria-hidden="true">&rsaquo;</span>'+
            '</div>';
          }).join('')+'</div>'+
          '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
            '<p class="pista">Pulsa un atleta para abrir su <strong>ficha</strong>. Se muestra la <strong>mejor marca de cada prueba</strong> (las cuatro más recientes), con las que se calculan los tiempos objetivo cuando pones el ritmo en porcentaje.</p>'+
          '</details>';
      } else {
        tabla = vacioHTML(icVacGrupo, 'Sin atletas en este grupo todavía.');
      }
      html += '<div class="tarjeta"><h2>'+esc(gr.nombre)+'</h2>'+(sub?'<p class="vacio" style="margin-top:-6px;margin-bottom:12px;">'+sub+'</p>':'')+tabla+'</div>';
    });
    cont.innerHTML = html;
    cont.querySelectorAll('.fila-atleta').forEach(function(tr){
      tr.addEventListener('click', function(){ abrirFicha(tr.getAttribute('data-atleta')); });
      tr.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); abrirFicha(tr.getAttribute('data-atleta')); } });
    });
  }
  renderMiGrupo();

  // Estado vacío estándar: icono de línea, frase corta y (si procede) una acción.
  function vacioHTML(icono, texto, accion){
    return '<div class="vac">'+icono+'<p>'+esc(texto)+'</p>'+(accion||'')+'</div>';
  }

  // ============================================================
  // SECCIÓN 1 · EL DÍA DEL ENTRENADOR (lo primero que se ve)
  // ------------------------------------------------------------
  // Arriba, la sesión de hoy de sus grupos con los dos botones que
  // se usan a diario (pasar lista y ver el entreno). Debajo, solo
  // si los hay, los avisos del día: faltas que ha avisado la
  // familia, pruebas que se acaban y feedback nuevo sin mirar.
  // No se toca ninguna tabla nueva: son las mismas consultas que ya
  // usa el resto de la página (sesiones, ausencias, atletas,
  // registros_sesion).
  // ============================================================
  var HOY = { sesiones: [], siguiente: null, cargando: true };
  var AVISOS = { ausencias: [], prueba: [], feedbackNuevos: 0, cargando: true };

  // «Feedback sin leer» = registros de los atletas posteriores a la última vez
  // que el entrenador abrió la sección Feedback (se guarda en este navegador).
  var FB_VISTO_CLAVE = 'apolana_fb_visto_' + (perfil.id || '');
  function feedbackVistoDesde(){
    try { return localStorage.getItem(FB_VISTO_CLAVE) || ''; } catch(e){ return ''; }
  }
  function marcarFeedbackVisto(){
    try { localStorage.setItem(FB_VISTO_CLAVE, new Date().toISOString()); } catch(e){}
    if(AVISOS){ AVISOS.feedbackNuevos = 0; pintarAvisos(); }
  }

  function tipoNombre(t){ for(var i=0;i<TIPOS.length;i++) if(TIPOS[i][0]===t) return TIPOS[i][1]; return ''; }

  async function cargarHoy(){
    HOY.sesiones = []; HOY.siguiente = null;
    if(!MIS_GRUPOS.length) return;
    var ids = MIS_GRUPOS.map(function(g){ return g.id; });
    var r = await sb.from('sesiones')
      .select('id,fecha,hora,titulo,tipo,lugar,grupo_id,publicada,atletas_ids,abierta_inscripcion')
      .in('grupo_id', ids).eq('fecha', todayISO)
      .order('hora', { ascending:true }).limit(8);
    if(!r.error && r.data) HOY.sesiones = r.data;
    if(HOY.sesiones.length) return;
    var r2 = await sb.from('sesiones').select('id,fecha,titulo,grupo_id')
      .in('grupo_id', ids).gt('fecha', todayISO)
      .order('fecha', { ascending:true }).limit(1);
    if(!r2.error && r2.data && r2.data.length) HOY.siguiente = r2.data[0];
  }

  async function cargarAvisos(){
    AVISOS.ausencias = []; AVISOS.prueba = []; AVISOS.feedbackNuevos = 0;
    // Pruebas que se acaban (o ya vencidas): sale de los atletas ya cargados.
    AVISOS.prueba = MIS_ATLETAS.filter(function(x){
      if(x.estado!=='prueba' || !x.fecha_prueba_fin) return false;
      var d = difDias(x.fecha_prueba_fin, todayISO);
      return d <= 7 && d >= -30;   // los que acaban esta semana y los que ya vencieron hace poco
    });
    if(!MIS_ATLETAS.length) return;
    var ids = MIS_ATLETAS.map(function(x){ return x.id; });
    // Faltas avisadas hoy por las familias (misma tabla que en Pasar lista).
    try {
      var au = await sb.from('ausencias').select('atleta_id,motivo,avisado_por_nombre')
        .eq('fecha', todayISO).in('atleta_id', ids);
      if(!au.error && au.data) AVISOS.ausencias = au.data;
    } catch(e){}
    // Feedback nuevo desde la última visita (o de los últimos 3 días la primera vez).
    try {
      var desde = feedbackVistoDesde() || (addDias(todayISO,-3)+'T00:00:00');
      var rg = await sb.from('registros_sesion').select('id,created_at')
        .in('atleta_id', ids).gte('created_at', desde).limit(300);
      if(!rg.error && rg.data) AVISOS.feedbackNuevos = rg.data.length;
    } catch(e){}
  }

  function pintarHoy(){
    var cont = $('hoy-cont'); if(!cont) return;
    if(!MIS_GRUPOS.length){ cont.innerHTML = ''; return; }
    if(HOY.cargando){
      cont.innerHTML = '<div class="hoy-e-no"><div class="hn-ic">'+icReloj+'</div><div class="hn-txt"><b>Preparando tu día…</b></div></div>';
      return;
    }

    if(!HOY.sesiones.length){
      var txt = HOY.siguiente
        ? 'La siguiente es el '+formatFecha(HOY.siguiente.fecha)+(HOY.siguiente.titulo ? ' · '+HOY.siguiente.titulo : '')+'.'
        : 'No hay nada en el calendario de tus grupos.';
      cont.innerHTML = '<div class="hoy-e-no">'+
        '<div class="hn-ic">'+icVacCal+'</div>'+
        '<div class="hn-txt"><b>Hoy no hay sesión programada</b><span>'+esc(txt)+'</span></div>'+
        '<button type="button" data-planificar>Planificar</button>'+
      '</div>';
    } else {
      cont.innerHTML = HOY.sesiones.map(function(s){
        var det = [];
        if(s.hora) det.push('<span><i></i>'+esc(horaCorta(s.hora))+'</span>');
        var lugar = s.lugar || lugarDeGrupo(s.grupo_id);
        if(lugar) det.push('<span><i></i>'+esc(lugar)+'</span>');
        var soloAlgunos = Array.isArray(s.atletas_ids) && s.atletas_ids.length;
        if(soloAlgunos) det.push('<span><i></i>solo '+s.atletas_ids.length+' atleta'+(s.atletas_ids.length===1?'':'s')+'</span>');
        var tipo = tipoNombre(s.tipo);
        return '<div class="hoy-e">'+
          '<div class="he-top">'+
            '<span class="he-et">Hoy · '+esc(nombreGrupo(s.grupo_id)||'tu grupo')+'</span>'+
            (tipo ? '<span class="he-tipo">'+esc(tipo)+'</span>' : '')+
          '</div>'+
          '<div>'+
            '<h2 class="he-tit">'+esc(s.titulo || 'Entreno de hoy')+'</h2>'+
            (det.length ? '<div class="he-det">'+det.join('')+'</div>' : '')+
          '</div>'+
          (!s.publicada ? '<p class="he-aviso">Está en borrador: todavía no la ven tus atletas.</p>' : '')+
          '<div class="he-btns">'+
            '<button type="button" class="he-lista" data-lista="'+escAttr(s.grupo_id)+'">Pasar lista</button>'+
            '<button type="button" class="he-ver" data-ver="'+escAttr(s.id)+'" data-grupo="'+escAttr(s.grupo_id)+'">Ver entreno</button>'+
          '</div>'+
        '</div>';
      }).join('');
    }

    var bp = cont.querySelector('[data-planificar]');
    if(bp) bp.addEventListener('click', function(){ irASeccion('planificar'); cerrarMas(); window.scrollTo(0,0); });
    cont.querySelectorAll('[data-lista]').forEach(function(b){
      b.addEventListener('click', function(){ irAPasarLista(b.getAttribute('data-lista'), todayISO); });
    });
    cont.querySelectorAll('[data-ver]').forEach(function(b){
      b.addEventListener('click', function(){ verEntreno(b.getAttribute('data-grupo'), b.getAttribute('data-ver')); });
    });
  }

  // Abre la lista del día en el grupo que toque
  async function irAPasarLista(grupoId, fecha){
    // Si ya había una lista a medias sin guardar, primero se pone a salvo.
    if(!(await puedoDejarLaLista())) { irASeccion('lista'); cerrarMas(); window.scrollTo(0,0); return; }
    irASeccion('lista'); cerrarMas();
    var sg = $('lst-grupo'), sf = $('lst-fecha');
    if(sg && grupoId){ sg.value = grupoId; LST.grupo = grupoId; }
    if(sf){ sf.value = fecha || todayISO; }
    LST.fecha = fecha || todayISO;
    if(sg) refrescarLista();
    window.scrollTo(0,0);
  }

  // Abre la sesión en «Planificar un entreno», ya cargada para verla o retocarla
  async function verEntreno(grupoId, sesionId){
    irASeccion('planificar'); cerrarMas(); window.scrollTo(0,0);
    var sg = $('pl-grupo'); if(!sg) return;
    sg.value = grupoId || sg.value;
    await cargarSesionesGrupo(sg.value);
    var se = $('pl-editar');
    var s = window.__SESIONES_GRUPO && window.__SESIONES_GRUPO[sesionId];
    if(se && s){ se.value = sesionId; cargarSesionEnForm(s); }
  }

  function pintarAvisos(){
    var cont = $('avisos-cont'); if(!cont) return;
    if(!MIS_GRUPOS.length || AVISOS.cargando){ cont.innerHTML = ''; return; }
    var filas = '';

    if(AVISOS.ausencias.length){
      var noms = AVISOS.ausencias.map(function(a){
        var at = atletaPorId(a.atleta_id); return at ? nombreAtleta(at) : '';
      }).filter(Boolean);
      filas += '<button type="button" class="aviso rojo" data-av="faltas">'+
        '<span class="av-ic">'+icAlerta+'</span>'+
        '<span class="av-txt">'+AVISOS.ausencias.length+' falta'+(AVISOS.ausencias.length>1?'s':'')+' avisada'+(AVISOS.ausencias.length>1?'s':'')+' para hoy'+
          (noms.length ? '<small>'+esc(noms.slice(0,3).join(', '))+(noms.length>3 ? ' y '+(noms.length-3)+' más' : '')+'</small>' : '')+
        '</span>'+
        '<span class="av-n">'+AVISOS.ausencias.length+'</span><span class="av-chev">&rsaquo;</span></button>';
    }

    if(AVISOS.prueba.length){
      var pr = AVISOS.prueba.map(function(x){
        var d = difDias(x.fecha_prueba_fin, todayISO);
        return nombreAtleta(x) + (d < 0 ? ' (ya acabó)' : d === 0 ? ' (acaba hoy)' : ' (en '+d+' día'+(d===1?'':'s')+')');
      });
      filas += '<button type="button" class="aviso ambar" data-av="prueba" data-atleta="'+escAttr(AVISOS.prueba[0].id)+'">'+
        '<span class="av-ic">'+icReloj+'</span>'+
        '<span class="av-txt">'+AVISOS.prueba.length+' periodo'+(AVISOS.prueba.length>1?'s':'')+' de prueba por decidir'+
          '<small>'+esc(pr.slice(0,2).join(' · '))+(pr.length>2 ? ' y '+(pr.length-2)+' más' : '')+'</small>'+
        '</span>'+
        '<span class="av-n">'+AVISOS.prueba.length+'</span><span class="av-chev">&rsaquo;</span></button>';
    }

    if(AVISOS.feedbackNuevos){
      filas += '<button type="button" class="aviso" data-av="feedback">'+
        '<span class="av-ic">'+icVacChat+'</span>'+
        '<span class="av-txt">Feedback nuevo de tus atletas<small>Sin mirar desde la última vez que entraste</small></span>'+
        '<span class="av-n">'+AVISOS.feedbackNuevos+'</span><span class="av-chev">&rsaquo;</span></button>';
    }

    cont.innerHTML = filas ? '<div class="avisos">'+filas+'</div>' : '';

    cont.querySelectorAll('.aviso').forEach(function(b){
      b.addEventListener('click', function(){
        var q = b.getAttribute('data-av');
        if(q==='faltas'){ irAPasarLista(LST.grupo || MIS_GRUPOS[0].id, todayISO); }
        else if(q==='feedback'){ irASeccion('feedback'); cerrarMas(); window.scrollTo(0,0); }
        else if(q==='prueba'){
          if(AVISOS.prueba.length===1) abrirFicha(b.getAttribute('data-atleta'));
          else { var g=$('grupo-cont'); if(g) g.scrollIntoView({ behavior:'smooth', block:'start' }); }
        }
      });
    });
  }

  async function refrescarDia(){
    HOY.cargando = true; AVISOS.cargando = true;
    pintarHoy(); pintarAvisos();
    await cargarHoy();
    HOY.cargando = false; pintarHoy();
    await cargarAvisos();
    AVISOS.cargando = false; pintarAvisos();
  }
  refrescarDia();

  // ============================================================
  // SECCIÓN 1a · QUIÉN SE HA APUNTADO A TUS ENTRENOS ABIERTOS
  // ------------------------------------------------------------
  // Cuando abres un entreno (ver «Planificar entreno»), cualquiera
  // del club se puede apuntar desde el calendario. Aquí ves cuánta
  // gente espera cada día, para preparar el material y las calles.
  //
  // OJO, ESTO NO ES UN FALLO: los NOMBRES que salen son los de TUS
  // atletas. Los de otros grupos cuentan en el total (que sale de la
  // vista `sesiones_agenda`), pero sus datos personales son de su
  // entrenador y la base de datos no te los deja leer. Por lo mismo,
  // solo puedes quitar de la lista a los tuyos.
  // ============================================================
  var APUNTADOS = { sesiones: [], porSesion: {}, totales: {}, cargando: false, error: '' };

  async function cargarApuntados(){
    APUNTADOS.sesiones = []; APUNTADOS.porSesion = {}; APUNTADOS.totales = {}; APUNTADOS.error = '';
    if(!MIS_GRUPOS.length) return;
    var ids = MIS_GRUPOS.map(function(g){ return g.id; });
    var r = await sb.from('sesiones')
      .select('id,fecha,hora,titulo,lugar,grupo_id,plazas,abierta_a,publicada')
      .in('grupo_id', ids).eq('abierta_inscripcion', true).gte('fecha', todayISO)
      .order('fecha', { ascending:true }).order('hora', { ascending:true }).limit(60);
    if(r.error){ APUNTADOS.error = r.error.message; return; }
    APUNTADOS.sesiones = r.data || [];
    if(!APUNTADOS.sesiones.length) return;
    var sids = APUNTADOS.sesiones.map(function(s){ return s.id; });

    var ri = await sb.from('sesion_inscripciones').select('id,sesion_id,atleta_id,created_at').in('sesion_id', sids);
    if(!ri.error && ri.data) ri.data.forEach(function(i){
      (APUNTADOS.porSesion[i.sesion_id] = APUNTADOS.porSesion[i.sesion_id] || []).push(i);
    });
    // El TOTAL de apuntados (incluida la gente de otros grupos) sale de la
    // agenda del club, que sí puede contarlos.
    try {
      var ra = await sb.from('sesiones_agenda').select('sesion_id,apuntados,libres').in('sesion_id', sids);
      if(!ra.error && ra.data) ra.data.forEach(function(v){ APUNTADOS.totales[v.sesion_id] = v; });
    } catch(e){}
  }

  function pintarApuntados(){
    var cont = $('ap-cont'); if(!cont) return;
    if(!MIS_GRUPOS.length){ cont.innerHTML = ''; return; }

    var cab = '<div class="tarjeta"><h2>Quién se ha apuntado</h2>';
    if(APUNTADOS.cargando){ cont.innerHTML = ''; return; }
    if(APUNTADOS.error){ cont.innerHTML = cab + '<p class="vacio">No he podido leer los apuntados: '+esc(APUNTADOS.error)+'</p></div>'; return; }

    // Sin entrenos abiertos no hay tarjeta: una línea corta y el manual plegado.
    if(!APUNTADOS.sesiones.length){
      cont.innerHTML =
        '<div class="ap-nada"><p>No tienes ningún entreno abierto al club.</p>'+
        '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
          '<p class="pista">Ve a <strong>Planificar un entreno</strong>, marca «¿Abierto para apuntarse?», pon las plazas y publícalo: '+
          'saldrá en el calendario del club con el botón de apuntarse y aquí verás quién viene.</p>'+
        '</details></div>';
      return;
    }

    var html = cab + '<p class="vacio" style="margin-top:-6px;margin-bottom:14px;">Tus entrenos abiertos al club, de hoy en adelante.</p>';

    APUNTADOS.sesiones.forEach(function(s){
      var tot = APUNTADOS.totales[s.id];
      var mios = APUNTADOS.porSesion[s.id] || [];
      var nTotal = tot ? tot.apuntados : mios.length;
      var otros = Math.max(0, nTotal - mios.length);

      var cuando = formatFecha(s.fecha) + (s.hora ? ' · '+horaCorta(s.hora) : '');
      var contador = nTotal + (s.plazas ? '/'+s.plazas : '') + ' apuntado'+(nTotal===1?'':'s');
      var completo = !!(s.plazas && nTotal >= s.plazas);

      html += '<div class="ap-ses">'+
        '<div class="ap-cab">'+
          '<span class="sw-fecha">'+esc(cuando)+'</span>'+
          '<strong>'+esc(s.titulo || 'Entreno abierto')+'</strong>'+
          (s.lugar ? '<span class="pill">'+esc(s.lugar)+'</span>' : '')+
          '<span style="flex:1 1 auto"></span>'+
          '<span class="lst-contador'+(nTotal?'':' cero')+'"'+(completo?' style="color:#A8453F"':'')+'>'+esc(contador)+'</span>'+
        '</div>'+
        '<p class="pista" style="margin-top:0;">'+esc(nombreGrupo(s.grupo_id))+' · abierto a '+esc(textoSecciones(s.abierta_a))+
          (s.plazas ? ' · '+(completo ? 'completo' : Math.max(0, s.plazas - nTotal)+' plaza(s) libres') : ' · sin límite de plazas')+'</p>'+
        (!s.publicada ? '<p class="dest-aviso">Está en <strong>borrador</strong>: hasta que no la publiques no sale en el calendario y nadie se puede apuntar.</p>' : '');

      if(mios.length){
        html += '<ul class="ap-lista">'+mios.map(function(i){
          var at = atletaPorId(i.atleta_id);
          var nom = at ? nombreAtleta(at) : 'Atleta de otro grupo';
          return '<li><span style="flex:1 1 auto;color:var(--navy);font-family:var(--fuente-texto);font-size:14px;">'+esc(nom)+'</span>'+
            '<span>'+esc(formatFecha(String(i.created_at||'').slice(0,10)))+'</span>'+
            '<button type="button" class="ap-quitar" data-sesion="'+s.id+'" data-atleta="'+i.atleta_id+'">Quitar</button></li>';
        }).join('')+'</ul>';
      } else if(!otros){
        html += '<p class="vacio" style="font-size:13.5px;margin:8px 0 0;">Todavía no se ha apuntado nadie.</p>';
      }

      if(otros){
        html += '<p class="pista" style="margin-bottom:0;"><strong>'+otros+' apuntado(s) de otros grupos.</strong></p>'+
          '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
            '<p class="pista">Cuentan para las plazas, pero sus nombres no salen aquí: son atletas de otros entrenadores. Administración sí los ve todos.</p>'+
          '</details>';
      }
      html += '</div>';
    });

    html += '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
        '<p class="pista">Si quitas a alguien, su plaza queda libre y se puede volver a apuntar mientras el entreno siga abierto.</p>'+
      '</details>'+
      '<span class="msg" id="ap-msg"></span></div>';

    cont.innerHTML = html;

    cont.querySelectorAll('.ap-quitar').forEach(function(b){
      b.addEventListener('click', async function(){
        var sid = b.getAttribute('data-sesion'), aid = b.getAttribute('data-atleta');
        var at = atletaPorId(aid);
        if(!await APX.confirm('¿Quitar a '+(at ? nombreAtleta(at) : 'este atleta')+' de este entreno? Su plaza queda libre.', { aceptar:'Quitar', peligro:true })) return;
        b.disabled = true;
        var r = await sb.from('sesion_inscripciones').delete().eq('sesion_id', sid).eq('atleta_id', aid).select('id');
        var m = $('ap-msg');
        if(r.error){ if(m){ m.textContent = 'Error: '+r.error.message; m.className = 'msg error'; } b.disabled = false; return; }
        if(!r.data || !r.data.length){
          if(m){ m.textContent = 'No se ha podido quitar: ese atleta no es tuyo. Tiene que hacerlo su entrenador o administración.'; m.className = 'msg error'; }
          b.disabled = false; return;
        }
        await refrescarApuntados();
        var m2 = $('ap-msg'); if(m2){ m2.textContent = 'Quitado de la lista ✓'; m2.className = 'msg ok'; }
      });
    });
  }

  async function refrescarApuntados(){
    if(!$('ap-cont')) return;
    APUNTADOS.cargando = true; pintarApuntados();
    await cargarApuntados();
    APUNTADOS.cargando = false; pintarApuntados();
  }
  refrescarApuntados();

  // ============================================================
  // SECCIÓN 1b · PASAR LISTA
  // ------------------------------------------------------------
  // El entrenador elige grupo y día (hoy por defecto) y marca a
  // cada atleta de un toque. Se guarda en la tabla `asistencia`,
  // con una fila por atleta y día (ver migraciones/023).
  //   · marcado ✓  -> fila con presente = true
  //   · marcado ✕  -> fila con presente = false
  //   · sin marcar -> NO hay fila (se borra si la había)
  // Por eso la lista se puede corregir después: al volver al mismo
  // día se recupera lo guardado y se vuelve a escribir encima.
  // Si la familia avisó de la falta (tabla `ausencias`), se ve en
  // la fila del atleta antes de marcar.
  // ============================================================
  var MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function formatFechaLarga(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); if(isNaN(d.getTime())) return ''; return d.getDate()+' de '+MESES_LARGOS[d.getMonth()]; }
  function iniciales(x){
    var n=(x.nombre||'').trim(), a=(x.apellidos||'').trim();
    var i=(n?n[0]:'')+(a?a[0]:(n.length>1?n[1]:''));
    return i.toUpperCase() || '··';
  }
  function edadDe(iso){
    if(!iso) return null;
    var d=new Date(iso+'T00:00:00'); if(isNaN(d.getTime())) return null;
    var h=new Date(), e=h.getFullYear()-d.getFullYear();
    var m=h.getMonth()-d.getMonth();
    if(m<0 || (m===0 && h.getDate()<d.getDate())) e--;
    return (e>=0 && e<120) ? e : null;
  }
  function diasCortos(arr){
    if(!arr || !arr.length) return '';
    var cortos = { lunes:'L', martes:'M', miercoles:'X', jueves:'J', viernes:'V', sabado:'S', domingo:'D' };
    var l = arr.map(function(d){ return cortos[norm(d).replace(/\s/g,'')] || d; });
    return l.length>1 ? l.slice(0,-1).join(', ')+' y '+l[l.length-1] : l[0];
  }
  // Atletas que se pasan lista: los del grupo que no están de baja.
  function atletasParaLista(grupoId){
    return MIS_ATLETAS.filter(function(x){ return x.grupo_id===grupoId && x.estado!=='baja'; });
  }

  /* `sucio`  = hay marcas puestas a mano que todavía no están en la base.
     `aviso`  = el mensaje del pie (guardado, error, etc.), guardado en el
                estado para que no se borre al repintar la lista.
     `sobrantes` = atletas del grupo que NO están asignados a este entrenador:
                se ven en el grupo pero el club no le deja pasarles lista. */
  var LST = { grupo:'', fecha: todayISO, marcas:{}, guardadas:{}, ausencias:{}, sesion:null, filtro:'', buscando:false, cargando:false,
              sucio:false, guardando:false, aviso:null, sobrantes:[], version:0 };

  /* BORRADOR EN EL PROPIO MÓVIL
     Aunque al cambiar de grupo o de día ya se pregunta, la pestaña de un móvil
     se puede cerrar sola a pie de pista. Cada toque deja copia de lo marcado en
     el teléfono; al volver a esa misma lista se recupera. Se borra en cuanto
     queda guardado en la base, así que nunca reaparece nada viejo. */
  var BORRADOR = 'apolana.lista.entrenador';
  function guardarBorrador(){
    try {
      var m = {};
      Object.keys(LST.marcas).forEach(function(id){ m[id] = (LST.marcas[id]===undefined ? null : LST.marcas[id]); });
      localStorage.setItem(BORRADOR, JSON.stringify({ grupo:LST.grupo, fecha:LST.fecha, marcas:m }));
    } catch(e){}
  }
  function borrarBorrador(){ try { localStorage.removeItem(BORRADOR); } catch(e){} }
  function recuperarBorrador(){
    var b = null;
    try { b = JSON.parse(localStorage.getItem(BORRADOR) || 'null'); } catch(e){ b = null; }
    if(!b || b.grupo!==LST.grupo || b.fecha!==LST.fecha || !b.marcas) return false;
    var distinto = false;
    Object.keys(b.marcas).forEach(function(id){
      var v = (b.marcas[id]===null ? undefined : b.marcas[id]);
      if(LST.marcas[id] !== v){
        if(v===undefined) delete LST.marcas[id]; else LST.marcas[id] = v;
        distinto = true;
      }
    });
    return distinto;
  }

  async function cargarLista(){
    var atls = atletasParaLista(LST.grupo);
    LST.marcas = {}; LST.guardadas = {}; LST.ausencias = {}; LST.sesion = null;
    LST.sucio = false; LST.aviso = null; LST.sobrantes = [];

    /* Aviso de huecos: si en el grupo hay atletas que el club no le ha
       asignado, no salen en la lista y nadie se entera. Mejor decirlo. */
    try {
      var todos = await sb.from('atletas').select('id,nombre,apellidos').eq('grupo_id', LST.grupo).neq('estado','baja');
      if(!todos.error && todos.data){
        var mios = {}; atls.forEach(function(x){ mios[x.id] = true; });
        LST.sobrantes = todos.data.filter(function(x){ return !mios[x.id]; });
      }
    } catch(e){}

    if(!atls.length || !LST.fecha) return;
    var ids = atls.map(function(x){ return x.id; });

    var asis = await sb.from('asistencia').select('atleta_id,presente').eq('fecha', LST.fecha).in('atleta_id', ids);
    if(asis.error){
      /* Sin esto, un fallo de red se vería como "no hay nadie pasado" y el
         entrenador repetiría la lista creyendo que se había perdido. */
      LST.aviso = { tipo:'error', texto:'No se ha podido leer la lista de ese día: '+(asis.error.message||'sin conexión')+'. Vuelve a cargarla antes de marcar.' };
    } else if(asis.data){
      asis.data.forEach(function(r){ LST.marcas[r.atleta_id] = !!r.presente; LST.guardadas[r.atleta_id] = true; });
    }

    // Faltas avisadas por la familia (tabla `ausencias`, del portal de
    // familias). Si el atleta tiene falta avisada y todavía no se le ha
    // pasado lista ese día, se deja PRERRELLENADO como ausente: el
    // entrenador lo ve y puede cambiarlo si al final sí vino.
    try {
      var au = await sb.from('ausencias').select('atleta_id,motivo,avisado_por_nombre').eq('fecha', LST.fecha).in('atleta_id', ids);
      if(!au.error && au.data) au.data.forEach(function(r){
        LST.ausencias[r.atleta_id] = r;
        if(LST.marcas[r.atleta_id]===undefined) LST.marcas[r.atleta_id] = false;
      });
    } catch(e){}

    var se = await sb.from('sesiones').select('id,titulo,fecha,publicada').eq('grupo_id', LST.grupo).eq('fecha', LST.fecha).order('publicada',{ascending:false}).limit(1);
    if(!se.error && se.data && se.data.length) LST.sesion = se.data[0];

    if(recuperarBorrador()){
      LST.sucio = true;
      LST.aviso = { tipo:'pendiente', texto:'Se han recuperado las marcas que quedaron sin guardar en este móvil. Repásalas y dale a Guardar lista.' };
    }
  }

  function contadorLista(){
    var atls = atletasParaLista(LST.grupo);
    var pres = 0, marcados = 0;
    atls.forEach(function(x){ if(LST.marcas[x.id]!==undefined){ marcados++; if(LST.marcas[x.id]) pres++; } });
    return { presentes: pres, marcados: marcados, total: atls.length };
  }

  function pintarLista(){
    var cont = $('lst-cont');
    if(!cont) return;
    if(LST.cargando){ cont.innerHTML = '<p class="vacio">Cargando…</p>'; return; }
    var gr = null;
    for(var i=0;i<MIS_GRUPOS.length;i++) if(MIS_GRUPOS[i].id===LST.grupo) gr = MIS_GRUPOS[i];
    var atls = atletasParaLista(LST.grupo);
    var c = contadorLista();

    var ctx = [formatFecha(LST.fecha), (gr && gr.horario ? gr.horario : ''), (gr ? gr.nombre : '')].filter(Boolean).join(' · ');
    var cab = '<div class="lst-cab"><div><span class="lst-ctx">'+esc(ctx)+'</span><span class="lst-tit">Pasar lista</span></div>'+
      '<span class="lst-contador'+(c.presentes?'':' cero')+'">'+c.presentes+'/'+c.total+'</span></div>';

    /* Atletas del grupo que el club no te ha asignado: no se les puede pasar
       lista (el permiso va por entrenador asignado, no por grupo). */
    var sobra = LST.sobrantes.length
      ? '<div class="lst-avisos"><strong>'+LST.sobrantes.length+' atleta'+(LST.sobrantes.length>1?'s de este grupo no están':' de este grupo no está')+' a tu nombre</strong><ul>'+
          LST.sobrantes.map(function(x){ return '<li><b>'+esc(nombreAtleta(x))+'</b></li>'; }).join('')+
        '</ul><p>No salen en la lista y no puedes marcarles. Pídele al club que te los asigne.</p></div>'
      : '';

    if(!atls.length){
      cont.innerHTML = cab + sobra + vacioHTML(icVacGrupo, 'Este grupo no tiene atletas en activo. Cuando el club te asigne atletas, aparecerán aquí para pasar lista.');
      return;
    }

    var filtro = norm(LST.filtro);
    var visibles = filtro ? atls.filter(function(x){ return norm(nombreAtleta(x)).indexOf(filtro)>-1; }) : atls;

    // Aviso arriba del todo con las faltas que ha avisado la familia.
    var conAviso = atls.filter(function(x){ return LST.ausencias[x.id]; });
    var avisos = conAviso.length
      ? '<div class="lst-avisos"><strong>'+conAviso.length+' falta'+(conAviso.length>1?'s':'')+' avisada'+(conAviso.length>1?'s':'')+' por la familia</strong><ul>'+
          conAviso.map(function(x){
            var a = LST.ausencias[x.id];
            return '<li><b>'+esc(nombreAtleta(x))+'</b> — '+esc(a.motivo || 'no viene')+(a.avisado_por_nombre?' <span>(avisó '+esc(a.avisado_por_nombre)+')</span>':'')+'</li>';
          }).join('')+
        '</ul><p>Ya están marcados como ausentes. Si al final vinieron, cámbialo con el ✓.</p></div>'
      : '';

    var acciones = sobra + avisos + '<div class="lst-acciones">'+
      '<button type="button" id="lst-todos">Marcar todos</button>'+
      '<button type="button" id="lst-buscar">Buscar</button>'+
    '</div>'+
    (LST.buscando ? '<div class="lst-buscar"><input id="lst-filtro" placeholder="Escribe un nombre…" value="'+escAttr(LST.filtro)+'" autocomplete="off"></div>' : '');

    var filas = visibles.map(function(x){
      var m = LST.marcas[x.id];
      var av = LST.ausencias[x.id];
      var sub = '';
      if(av){ sub = '<span class="lst-sub avisada">Avisó: '+esc(av.motivo || 'no viene')+(av.avisado_por_nombre?' · '+esc(av.avisado_por_nombre):'')+'</span>'; }
      else if(x.estado==='prueba'){ sub = '<span class="lst-sub prueba">De prueba'+(x.fecha_prueba_fin?' · acaba el '+esc(formatFechaLarga(x.fecha_prueba_fin)):'')+'</span>'; }
      else if(x.estado==='lesionado'){ sub = '<span class="lst-sub avisada">Lesionado</span>'; }
      var clase = (m===false || av) ? ' es-ausente' : (x.estado==='prueba' && m!==false ? ' es-prueba' : '');
      return '<div class="lst-fila'+clase+'" data-atleta="'+x.id+'">'+
        '<span class="avatar">'+esc(iniciales(x))+'</span>'+
        '<span class="lst-nom"><button type="button" class="lst-ficha" data-atleta="'+x.id+'">'+esc(nombreAtleta(x))+'</button>'+sub+'</span>'+
        '<span class="seg">'+
          '<button type="button" class="si'+(m===true?' on':'')+'" data-atleta="'+x.id+'" data-val="si" aria-label="Presente" title="Presente">✓</button>'+
          '<button type="button" class="no'+(m===false?' on':'')+'" data-atleta="'+x.id+'" data-val="no" aria-label="Ausente" title="Ausente">✕</button>'+
        '</span>'+
      '</div>';
    }).join('');

    if(!visibles.length) filas = vacioHTML(icVacGrupo, 'Ningún atleta con ese nombre.');

    /* El aviso vive en el estado: así sobrevive a los repintados y no se pierde
       el «Lista guardada ✓» (ni un error) en cuanto se toca otro botón. */
    var avisoPie = LST.aviso || (LST.sucio ? { tipo:'pendiente', texto:'Cambios sin guardar' } : null);
    var pie = '<div class="lst-pie">'+
      '<p class="lst-resumen">'+c.presentes+' de '+c.total+' presentes'+(c.marcados<c.total ? ' · '+(c.total-c.marcados)+' sin marcar' : '')+'</p>'+
      '<button class="btn btn--primario" id="lst-guardar"'+(LST.guardando?' disabled':'')+'>'+(LST.guardando?'Guardando…':'Guardar lista')+'</button>'+
      '<span class="msg'+(avisoPie?' '+avisoPie.tipo:'')+'" id="lst-msg">'+(avisoPie?esc(avisoPie.texto):'')+'</span>'+
    '</div>'+
    '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
      '<p class="pista">La familia ve la asistencia en su portal. El aviso automático de las faltas sin avisar todavía no está en marcha.</p>'+
    '</details>';

    cont.innerHTML = cab + acciones + '<div class="lst-lista">'+filas+'</div>' + pie;

    cont.querySelectorAll('.seg button').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-atleta'), val = b.getAttribute('data-val')==='si';
        LST.marcas[id] = (LST.marcas[id]===val) ? undefined : val;   // volver a pulsar lo desmarca
        if(LST.marcas[id]===undefined) delete LST.marcas[id];
        LST.sucio = true; LST.aviso = null; LST.version++;
        guardarBorrador();
        pintarLista();
      });
    });
    cont.querySelectorAll('.lst-ficha').forEach(function(b){
      b.addEventListener('click', function(){ abrirFicha(b.getAttribute('data-atleta')); });
    });
    $('lst-todos').addEventListener('click', function(){
      // No pisa a quien tiene falta avisada por la familia.
      visibles.forEach(function(x){ if(!LST.ausencias[x.id]) LST.marcas[x.id] = true; });
      LST.sucio = true; LST.aviso = null; LST.version++;
      guardarBorrador();
      pintarLista();
    });
    $('lst-buscar').addEventListener('click', function(){
      LST.buscando = !LST.buscando;
      if(!LST.buscando) LST.filtro = '';
      pintarLista();
      if(LST.buscando && $('lst-filtro')) $('lst-filtro').focus();
    });
    if($('lst-filtro')) $('lst-filtro').addEventListener('input', function(){
      LST.filtro = $('lst-filtro').value;
      var pos = $('lst-filtro').selectionStart;
      pintarLista();
      var f = $('lst-filtro'); if(f){ f.focus(); try { f.setSelectionRange(pos,pos); } catch(e){} }
    });
    $('lst-guardar').addEventListener('click', guardarLista);
  }

  /* Devuelve true solo si TODO ha quedado escrito en la base. */
  async function guardarLista(){
    if(LST.guardando) return false;                 // dos toques seguidos = un solo guardado
    var atls = atletasParaLista(LST.grupo);
    var filas = [], borrar = [];
    atls.forEach(function(x){
      if(LST.marcas[x.id]===undefined){
        if(LST.guardadas[x.id]) borrar.push(x.id);
      } else {
        filas.push({ atleta_id: x.id, fecha: LST.fecha, grupo_id: LST.grupo, sesion_id: (LST.sesion?LST.sesion.id:null), presente: LST.marcas[x.id] });
      }
    });
    if(!filas.length && !borrar.length){
      LST.aviso = { tipo:'error', texto:'No has marcado a nadie todavía.' };
      pintarLista(); return false;
    }

    LST.guardando = true; LST.aviso = { tipo:'', texto:'Guardando…' };
    var version0 = LST.version;   // por si se marca a alguien más mientras se guarda
    pintarLista();
    try {
      if(filas.length){
        var res = await sb.from('asistencia').upsert(filas, { onConflict: 'atleta_id,fecha' });
        if(res.error) throw res.error;
      }
      if(borrar.length){
        var del = await sb.from('asistencia').delete().eq('fecha', LST.fecha).in('atleta_id', borrar);
        if(del.error) throw del.error;
      }
      LST.guardadas = {}; filas.forEach(function(f){ LST.guardadas[f.atleta_id]=true; });
      LST.sucio = (LST.version !== version0);   // si tocó algo mientras tanto, sigue pendiente
      LST.guardando = false;
      if(LST.sucio) guardarBorrador(); else borrarBorrador();
      var c = contadorLista();
      var hora = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      LST.aviso = LST.sucio ? null : { tipo:'ok', texto:'Lista guardada ✓ · '+c.presentes+' de '+c.total+' presentes · '+hora };
      pintarLista();
      return !LST.sucio;
    } catch(e){
      /* Nada se toca en pantalla: las marcas siguen ahí para reintentar. */
      LST.guardando = false;
      LST.aviso = { tipo:'error', texto:'NO se ha guardado: '+((e&&e.message)||e)+'. Las marcas siguen aquí; comprueba la conexión y vuelve a darle a Guardar lista.' };
      pintarLista();
      if(window.APX) APX.toast('No se ha guardado la lista. Vuelve a intentarlo.','error');
      return false;
    }
  }

  /* Cambiar de grupo o de día repinta la lista desde cero: si hay marcas sin
     guardar hay que guardarlas antes, o se pierden sin que nadie se entere.
     Se guarda (en vez de descartar) porque perder una lista cuesta repetirla
     entera y una marca de más se corrige en dos toques. */
  async function puedoDejarLaLista(){
    if(!LST.sucio) return true;
    var ok = window.APX
      ? await APX.confirm('Tienes marcas sin guardar en esta lista. Si sales ahora se perderían.', { aceptar:'Guardar y salir', cancelar:'Seguir en la lista' })
      : true;
    if(!ok) return false;
    return await guardarLista();
  }

  window.addEventListener('beforeunload', function(e){
    if(LST.sucio){ e.preventDefault(); e.returnValue = ''; return ''; }
  });

  async function refrescarLista(){
    LST.cargando = true; pintarLista();
    await cargarLista();
    LST.cargando = false; pintarLista();
  }

  (function renderPasarLista(){
    var cont = $('sec-lista');
    if(!MIS_GRUPOS.length){
      cont.innerHTML = '<div class="tarjeta"><h2>Pasar lista</h2>'+vacioHTML(icVacGrupo, 'Necesitas tener al menos un grupo a tu cargo para pasar lista.')+'</div>';
      return;
    }
    LST.grupo = MIS_GRUPOS[0].id;
    cont.innerHTML =
      '<div class="tarjeta">'+
        '<div class="grid2">'+
          '<div><label>Grupo</label><select id="lst-grupo">'+MIS_GRUPOS.map(function(gr){ return '<option value="'+gr.id+'">'+esc(gr.nombre)+'</option>'; }).join('')+'</select></div>'+
          '<div><label>Día</label><input id="lst-fecha" type="date" value="'+todayISO+'"></div>'+
        '</div>'+
        '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
          '<p class="pista">Marca <strong>✓</strong> presente o <strong>✕</strong> ausente. Vuelve a pulsar para dejarlo sin marcar. Puedes cambiar el día y corregir una lista que ya guardaste.</p>'+
        '</details>'+
        '<div id="lst-cont" style="margin-top:10px;"></div>'+
      '</div>';
    /* Si el entrenador dice «seguir en la lista», el desplegable vuelve a lo
       que estaba: lo que se ve en pantalla y lo que hay marcado no se separan. */
    $('lst-grupo').addEventListener('change', async function(){
      var nuevo = $('lst-grupo').value, anterior = LST.grupo;
      if(!(await puedoDejarLaLista())){ $('lst-grupo').value = anterior; return; }
      LST.grupo = nuevo; refrescarLista();
    });
    $('lst-fecha').addEventListener('change', async function(){
      var nueva = $('lst-fecha').value || todayISO, anterior = LST.fecha;
      if(!(await puedoDejarLaLista())){ $('lst-fecha').value = anterior; return; }
      LST.fecha = nueva; refrescarLista();
    });
    refrescarLista();
  })();

  // ============================================================
  // FICHA DEL ATLETA (se abre desde «Mi grupo» y desde «Pasar lista»)
  // ------------------------------------------------------------
  // Sus datos, marcas, asistencia, feedback y observaciones, más
  // las acciones de gestión del grupo: cambiar de grupo, confirmar
  // el alta tras la prueba, marcar o quitar una lesión, escribir a
  // la familia y dar de baja. Los cambios de estado escriben en
  // `atletas.estado` (activo · lesionado · baja · prueba); el
  // permiso mínimo del entrenador se añadió en migraciones/023.
  // ============================================================
  var FICHA = null;   // { atletaId, datos… } mientras está abierta

  function cerrarFicha(){
    var f = document.getElementById('ficha-fondo');
    if(f) f.remove();
    document.body.style.overflow = '';
    FICHA = null;
  }

  function atletaPorId(id){ for(var i=0;i<MIS_ATLETAS.length;i++) if(MIS_ATLETAS[i].id===id) return MIS_ATLETAS[i]; return null; }

  async function abrirFicha(atletaId){
    var at = atletaPorId(atletaId);
    if(!at) return;
    cerrarFicha();
    var fondo = document.createElement('div');
    fondo.className = 'ficha-fondo';
    fondo.id = 'ficha-fondo';
    fondo.innerHTML = '<div class="ficha" role="dialog" aria-modal="true"><div class="ficha-barra"><button type="button" id="ficha-cerrar">‹ Volver</button></div><p class="vacio" style="padding:24px;">Cargando la ficha…</p></div>';
    document.body.appendChild(fondo);
    document.body.style.overflow = 'hidden';
    fondo.addEventListener('click', function(ev){ if(ev.target===fondo) cerrarFicha(); });
    document.getElementById('ficha-cerrar').addEventListener('click', cerrarFicha);
    document.addEventListener('keydown', function esc2(ev){ if(ev.key==='Escape'){ cerrarFicha(); document.removeEventListener('keydown', esc2); } });

    FICHA = { atletaId: atletaId, asistencia: [], pagos: [], registros: [], notas: [], notasFamilia: [], ausencias: [], contacto: null, abierto: '' };

    var desde = addDias(todayISO, -30);
    var r1 = await sb.from('asistencia').select('fecha,presente').eq('atleta_id', atletaId).gte('fecha', desde).order('fecha', { ascending:false });
    if(!r1.error && r1.data) FICHA.asistencia = r1.data;
    var r1b = await sb.from('ausencias').select('fecha,motivo,avisado_por_nombre').eq('atleta_id', atletaId).gte('fecha', addDias(todayISO,-60)).order('fecha', { ascending:false }).limit(8);
    if(!r1b.error && r1b.data) FICHA.ausencias = r1b.data;
    var r1c = await sb.from('notas_familia').select('id,texto,fecha,autor_nombre,visible').eq('atleta_id', atletaId).order('fecha', { ascending:false }).limit(5);
    if(!r1c.error && r1c.data) FICHA.notasFamilia = r1c.data;
    var r2 = await sb.from('pagos').select('estado,concepto,importe,fecha_vencimiento').eq('atleta_id', atletaId);
    if(!r2.error && r2.data) FICHA.pagos = r2.data;
    var r3 = await sb.from('registros_sesion').select('sesion_id,created_at,rpe,sensacion_general,como_me_siento,molestias').eq('atleta_id', atletaId).order('created_at', { ascending:false }).limit(5);
    if(!r3.error && r3.data) FICHA.registros = r3.data;
    var r4 = await sb.from('notas_atleta').select('id,texto,created_at').eq('atleta_id', atletaId).order('created_at', { ascending:false }).limit(3);
    if(!r4.error && r4.data) FICHA.notas = r4.data;
    try {
      var r5 = await sb.rpc('contacto_familia_atleta', { p_atleta: atletaId });
      if(!r5.error && r5.data && r5.data.length) FICHA.contacto = r5.data[0];
    } catch(e){}

    if(FICHA && FICHA.atletaId===atletaId) pintarFicha();
  }

  function pintarFicha(){
    if(!FICHA) return;
    var caja = document.querySelector('#ficha-fondo .ficha');
    if(!caja) return;
    var at = atletaPorId(FICHA.atletaId);
    if(!at){ cerrarFicha(); return; }

    // --- cabecera ---
    var edad = edadDe(at.fecha_nacimiento);
    var gNom = nombreGrupo(at.grupo_id) || 'sin grupo';
    // La categoría solo se repite si el nombre del grupo no la lleva ya dentro.
    var cat = (at.categoria && norm(gNom).indexOf(norm(at.categoria))===-1) ? at.categoria : '';
    var linea = [ (edad!=null ? edad+' años' : ''), gNom, cat, diasCortos(at.dias_entreno) ].filter(Boolean).join(' · ');

    // --- asistencia últimos 30 días ---
    var total30 = FICHA.asistencia.length;
    var pres30 = FICHA.asistencia.filter(function(r){ return r.presente; }).length;
    var asisTxt = total30 ? (pres30+' de '+total30) : 'Sin listas todavía';

    // --- estado ---
    var est = at.estado || '';
    var estTxt = 'Sin definir', estCls = '';
    if(est==='activo'){ estTxt = 'Activo'; estCls='bien'; }
    else if(est==='prueba'){ estTxt = 'En prueba'+(at.fecha_prueba_fin ? ' · acaba el '+formatFechaLarga(at.fecha_prueba_fin) : ''); estCls='ojo'; }
    else if(est==='lesionado'){ estTxt = 'Lesionado'; estCls='mal'; }
    else if(est==='baja'){ estTxt = 'De baja'; estCls='mal'; }

    // --- pagos ---
    var pend = FICHA.pagos.filter(function(p){ return p.estado==='pendiente' || p.estado==='impagado'; });
    var pagTxt, pagCls;
    if(!FICHA.pagos.length){ pagTxt = 'Sin recibos registrados'; pagCls=''; }
    else if(!pend.length){ pagTxt = 'Al día'; pagCls='bien'; }
    else { pagTxt = pend.length+' recibo'+(pend.length>1?'s':'')+' sin pagar'; pagCls='mal'; }

    // --- mejores marcas ---
    var mrc = mejoresMarcasDe(at.id, 6);
    var marcasHTML = mrc.length
      ? '<div class="mrc">'+mrc.map(function(m){ return '<span>'+esc(m.prueba)+' '+esc(m.disp)+'</span>'; }).join('')+'</div>'
      : '<p class="vacio" style="margin:0;font-size:13.5px;">Sin marcas registradas.</p>';

    // --- asistencia reciente ---
    var asisHTML = FICHA.asistencia.length
      ? '<ul class="mini-lista">'+FICHA.asistencia.slice(0,8).map(function(r){
          return '<li><b>'+esc(formatFecha(r.fecha))+'</b><span style="color:'+(r.presente?'#4C7A28':'#A8453F')+'">'+(r.presente?'Presente':'Ausente')+'</span></li>';
        }).join('')+'</ul>'
      : '<p class="vacio" style="margin:0;font-size:13.5px;">Todavía no se ha pasado lista con este atleta.</p>';

    // --- feedback reciente ---
    var fbHTML = FICHA.registros.length
      ? '<ul class="mini-lista">'+FICHA.registros.map(function(r){
          var partes = [];
          if(r.rpe!=null) partes.push('RPE '+r.rpe+'/10');
          if(r.sensacion_general!=null) partes.push('sensación '+r.sensacion_general+'/10');
          if(r.molestias) partes.push('molestias: '+r.molestias);
          else if(r.como_me_siento) partes.push(r.como_me_siento);
          return '<li><b style="font-weight:400;color:var(--texto);flex:1;">'+esc(partes.join(' · ')||'Registrado sin detalles')+'</b><span>'+esc(formatFechaHora(r.created_at).split(' · ')[0])+'</span></li>';
        }).join('')+'</ul>'
      : '<p class="vacio" style="margin:0;font-size:13.5px;">Sin feedback registrado todavía.</p>';

    // --- faltas avisadas por la familia ---
    var ausHTML = FICHA.ausencias.length
      ? '<ul class="mini-lista">'+FICHA.ausencias.map(function(a){
          return '<li><b style="font-weight:400;color:var(--texto);flex:1;">'+esc(a.motivo||'No viene')+(a.avisado_por_nombre?' <em style="color:var(--texto-tenue);font-style:normal;">· avisó '+esc(a.avisado_por_nombre)+'</em>':'')+'</b><span>'+esc(formatFecha(a.fecha))+'</span></li>';
        }).join('')+'</ul>'
      : '<p class="vacio" style="margin:0;font-size:13.5px;">La familia no ha avisado ninguna falta en los últimos dos meses.</p>';

    // --- observaciones privadas (notas_atleta) · la familia NO las ve ---
    var ntHTML = FICHA.notas.length
      ? '<ul class="mini-lista">'+FICHA.notas.map(function(n){
          return '<li><b style="font-weight:400;color:var(--texto);flex:1;white-space:pre-wrap;">'+esc(n.texto)+'</b><span>'+esc(formatFechaHora(n.created_at).split(' · ')[0])+'</span></li>';
        }).join('')+'</ul>'
      : '<p class="vacio" style="margin:0;font-size:13.5px;">Sin observaciones privadas.</p>';

    // --- notas PARA LA FAMILIA (notas_familia) · la familia SÍ las ve ---
    var nfHTML = FICHA.notasFamilia.length
      ? '<ul class="mini-lista">'+FICHA.notasFamilia.map(function(n){
          return '<li><b style="font-weight:400;color:var(--texto);flex:1;white-space:pre-wrap;">'+esc(n.texto)+'</b><span>'+esc(formatFecha(n.fecha))+'</span></li>';
        }).join('')+'</ul>'
      : '<p class="vacio" style="margin:0;font-size:13.5px;">Todavía no le has escrito nada a la familia.</p>';

    // --- gestión del grupo ---
    var abierto = FICHA.abierto || '';
    var opcGrupos = '<option value="">— sin grupo —</option>'+MIS_GRUPOS.map(function(g){
      return '<option value="'+g.id+'"'+(g.id===at.grupo_id?' selected':'')+'>'+esc(g.nombre)+'</option>';
    }).join('');

    var accGrupo =
      '<div class="acc"><button type="button" data-acc="grupo"><span>Cambiar de grupo</span><span class="acc-val">'+esc(nombreGrupo(at.grupo_id)||'sin grupo')+' ›</span></button>'+
      (abierto==='grupo' ? '<div class="acc-caja">'+
        '<label>Nuevo grupo</label><select id="fa-grupo">'+opcGrupos+'</select>'+
        '<p class="pista">Solo aparecen los grupos que diriges tú. Para pasarlo al grupo de otro entrenador, avisa a administración.</p>'+
        '<div class="acciones"><button class="btn btn--primario btn--sm" id="fa-grupo-ok">Cambiar de grupo</button></div>'+
      '</div>' : '')+'</div>';

    var accAlta = (est==='prueba')
      ? '<div class="acc"><button type="button" data-acc="alta"><span>Confirmar alta tras la prueba</span><span class="acc-val azul">Confirmar</span></button>'+
        (abierto==='alta' ? '<div class="acc-caja"><p class="pista" style="margin-top:12px;">El atleta pasará de <strong>en prueba</strong> a <strong>activo</strong> y se borrará la fecha de fin de prueba.</p>'+
          '<div class="acciones"><button class="btn btn--primario btn--sm" id="fa-alta-ok">Confirmar el alta</button></div></div>' : '')+'</div>'
      : '';

    var esLesion = (est==='lesionado');
    var accLesion =
      '<div class="acc"><button type="button" data-acc="lesion"><span>'+(esLesion?'Quitar la lesión':'Marcar lesión o molestia')+'</span><span class="acc-val">›</span></button>'+
      (abierto==='lesion' ? '<div class="acc-caja">'+
        '<label>'+(esLesion?'¿Qué anotas al darle el alta?':'¿Qué le pasa? (queda como observación privada)')+'</label>'+
        '<textarea id="fa-lesion-txt" placeholder="'+(esLesion?'Ya entrena sin molestias…':'Molestia en el sóleo derecho, sin series esta semana…')+'"></textarea>'+
        '<p class="pista">'+(esLesion?'Volverá al estado <strong>activo</strong>.':'Pasará al estado <strong>lesionado</strong>. Podrás quitarlo desde aquí mismo.')+'</p>'+
        '<div class="acciones"><button class="btn btn--primario btn--sm" id="fa-lesion-ok">'+(esLesion?'Quitar la lesión':'Marcar la lesión')+'</button></div>'+
      '</div>' : '')+'</div>';

    var cont = FICHA.contacto;
    var destino = cont ? ((cont.nombre||'')+' '+(cont.apellidos||'')).trim()+(cont.email?' · '+cont.email:'') : '';
    var mailto = (cont && cont.email) ? 'mailto:'+encodeURIComponent(cont.email)+'?subject='+encodeURIComponent('Apolana · '+nombreAtleta(at)) : '';
    // La caja de escribir vive en su propio apartado (más abajo), para que
    // no se confunda con las observaciones privadas. Esta fila lleva allí.
    var accFamilia =
      '<div class="acc"><button type="button" data-acc="familia"><span>Escribir a la familia</span><span class="acc-val">›</span></button></div>';

    var accBaja = (est!=='baja')
      ? '<div class="acc roja"><button type="button" data-acc="baja"><span>Dar de baja</span><span class="acc-val">›</span></button>'+
        (abierto==='baja' ? '<div class="acc-caja"><p class="pista" style="margin-top:12px;">El atleta pasará al estado <strong>baja</strong>: deja de salir al pasar lista y en las sesiones nuevas. No se borra nada: sus marcas y su historial se conservan.</p>'+
          '<div class="acciones"><button class="btn btn--primario btn--sm" id="fa-baja-ok">Sí, dar de baja</button></div></div>' : '')+'</div>'
      : '<div class="acc"><button type="button" data-acc="reactivar"><span>Volver a dar de alta</span><span class="acc-val azul">Reactivar</span></button>'+
        (abierto==='reactivar' ? '<div class="acc-caja"><p class="pista" style="margin-top:12px;">Volverá al estado <strong>activo</strong> y reaparecerá al pasar lista.</p>'+
          '<div class="acciones"><button class="btn btn--primario btn--sm" id="fa-reactivar-ok">Dar de alta otra vez</button></div></div>' : '')+'</div>';

    caja.innerHTML =
      '<div class="ficha-barra"><button type="button" id="ficha-cerrar">‹ Volver</button><span class="msg" id="fa-msg"></span></div>'+
      '<div class="ficha-enc"><span class="avatar">'+esc(iniciales(at))+'</span><div><h3>'+esc(nombreAtleta(at))+'</h3><p>'+esc(linea)+'</p></div></div>'+
      '<div class="ficha-bloque">'+
        '<div class="dato"><span>Asistencia últimos 30 días</span><b>'+esc(asisTxt)+'</b></div>'+
        '<div class="dato"><span>Estado</span><b class="'+estCls+'">'+esc(estTxt)+'</b></div>'+
        '<div class="dato"><span>Pagos</span><b class="'+pagCls+'">'+esc(pagTxt)+'</b></div>'+
        (at.licencia ? '<div class="dato"><span>Licencia</span><b>'+esc(at.licencia)+'</b></div>' : '')+
      '</div>'+
      '<div class="ficha-bloque"><h4>Mejores marcas</h4>'+marcasHTML+'</div>'+
      '<div class="ficha-bloque"><h4>Asistencia reciente</h4>'+asisHTML+'</div>'+
      '<div class="ficha-bloque"><h4>Faltas avisadas por la familia</h4>'+ausHTML+'</div>'+
      '<div class="ficha-bloque"><h4>Feedback reciente</h4>'+fbHTML+'</div>'+

      // ---- Los dos cuadernos, uno al lado del otro y bien diferenciados ----
      '<div class="ficha-bloque priv" id="fa-bloque-privado">'+
        '<h4>Observaciones privadas <span class="marca-priv">Solo el equipo técnico</span></h4>'+
        '<p class="marca-expl">El atleta y su familia <strong>no ven</strong> nada de esto.</p>'+
        ntHTML+
        '<p class="pista" style="margin-bottom:0;">Para añadir una observación privada, usa el apartado <strong>Observaciones</strong> del menú.</p>'+
      '</div>'+
      '<div class="ficha-bloque fam" id="fa-bloque-familia">'+
        '<h4>Notas para la familia <span class="marca-fam">La familia SÍ ve esto</span></h4>'+
        '<p class="marca-expl">Aparecen en el portal de familias con la fecha y tu nombre.</p>'+
        nfHTML+
        (cont
          ? '<p class="pista">Contacto de la familia: <strong>'+esc(destino)+'</strong>'+(cont.es_el_propio_atleta?' (es el propio atleta: no tiene cuenta de familia asociada)':'')+'.</p>'
