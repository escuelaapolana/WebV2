      var s = window.__SESIONES_GRUPO && window.__SESIONES_GRUPO[editandoId];
      var comoSeLlama = (s && (s.titulo || formatFecha(s.fecha))) || 'este entrenamiento';
      var cuando = s ? formatFecha(s.fecha) : '';

      var apuntados = [];
      try {
        var rg = await sb.from('registros_sesion').select('atleta_id').eq('sesion_id', editandoId);
        if(!rg.error && rg.data) apuntados = rg.data;
      } catch(e){ /* si no se puede mirar, se avisa igual abajo */ }

      var texto = 'Vas a borrar «'+comoSeLlama+'»'+(cuando?' del '+cuando:'')+'. Desaparece para todo el grupo y no se puede deshacer.';
      if(apuntados.length){
        var quien = nombresDeIds(apuntados.map(function(x){ return x.atleta_id; }), 3);
        texto += '\n\n⚠️ OJO: ya hay '+apuntados.length+' registro'+(apuntados.length===1?'':'s')+
                 ' apuntado'+(apuntados.length===1?'':'s')+' en este entrenamiento'+(quien?' ('+quien+')':'')+
                 '. Si lo borras, se pierden sus series, sus tiempos y lo que escribieran. Eso no se recupera.';
      }
      if(!await APX.confirm(texto, { aceptar:'Borrar', peligro:true })) return;

      var r = await sb.from('sesiones').delete().eq('id', editandoId);
      var m = $('pl-msg');
      if(r.error){ if(m){ m.textContent='No se ha podido borrar: '+r.error.message; m.className='msg error'; } return; }
      var g = $('pl-grupo').value;
      limpiarFormulario();
      await cargarSesionesGrupo(g);
      refrescarDia();
      if(m){ m.textContent='Borrado ✓ «'+comoSeLlama+'» ya no existe.'; m.className='msg ok'; }
    });

    /* Los clics de la tira: flechas, «Hoy» y cada día. */
    /* Desde la tira del inicio al planificador, en ese día. */
    /* Ir al planificador en un día concreto. Vale para la tarjeta del inicio y
       para el segundo toque en la tira. */
    function irAlPlan(iso){
      irASeccion('planificar');
      PL_LUNES = lunesDeFecha(iso);
      var ses = sesionesDelDia ? sesionesDelDia(iso) : [];
      if(ses.length){ $('pl-editar').value = ses[0].id; cargarSesionEnForm(ses[0]); }
      else { limpiarFormulario(); $('pl-fecha').value = iso; }
      pintarSemanaPlan(); pintarModo();
      window.scrollTo(0,0);
    }

    document.addEventListener('click', function(ev){
      var o = ev.target.closest ? ev.target.closest('[data-ojear-ent]') : null;
      if(o){
        var isoO = o.getAttribute('data-ojear-ent');
        /* Un toque OJEA. El segundo toque en el mismo día ENTRA: así se navega
           por la semana sin salir, y se entra a propósito y no de rebote. */
        if(ENT_OJEO === isoO){ ENT_OJEO = null; irAlPlan(isoO); return; }
        ENT_OJEO = isoO; pintarHoy(); return;
      }
      var b = ev.target.closest ? ev.target.closest('[data-ir-plan]') : null;
      if(!b) return;
      irAlPlan(b.getAttribute('data-ir-plan'));
    });

    $('pl-semana').addEventListener('click', function(ev){
      var t = ev.target.closest ? ev.target.closest('[data-pls],[data-pls-dia]') : null;
      if(!t) return;
      var mov = t.getAttribute('data-pls');
      if(mov){
        if(mov==='atras')  PL_LUNES = addDias(PL_LUNES, -7);
        if(mov==='alante') PL_LUNES = addDias(PL_LUNES,  7);
        if(mov==='hoy')    PL_LUNES = lunesDeFecha(todayISO);
        pintarSemanaPlan();
        return;
      }
      var iso = t.getAttribute('data-pls-dia'); if(!iso) return;
      var ses = sesionesDelDia(iso);
      if(ses.length){
        /* Si el día tiene entrenamiento, se abre. Con más de uno se abre el
           primero: para elegir entre varios está el desplegable de arriba. */
        $('pl-editar').value = ses[0].id;
        cargarSesionEnForm(ses[0]);
      } else {
        /* Día libre: formulario en blanco con esa fecha ya puesta, que es lo
           que se venía a hacer al pulsar un hueco. */
        limpiarFormulario();
        $('pl-fecha').value = iso;
      }
      PL_LUNES = lunesDeFecha(iso);
      pintarSemanaPlan();
      pintarModo();
    });
    $('pl-fecha').addEventListener('change', function(){
      PL_LUNES = lunesDeFecha(this.value || todayISO);
      pintarSemanaPlan();
    });
    /* Cualquier cambio dentro de los ajustes se refleja en la línea de fuera. */
    ['pl-deporte','pl-deporte2','pl-papel','pl-abierta','pl-hora','pl-lugar'].forEach(function(id){
      var el = $(id); if(el) el.addEventListener('change', pintarResumenAjustes);
    });
    pintarResumenAjustes();

    $('pl-nueva').addEventListener('click', function(){ limpiarFormulario(); });

    /* DUPLICAR
       El lunes 4×100 y el lunes siguiente 5×100: se abre el del lunes,
       se pulsa aquí y solo hay que cambiar el 4 por el 5.
       Lo único que hace es soltar el vínculo con el original (para que
       guardar CREE en vez de CAMBIAR), adelantar la fecha una semana y
       dejarlo en borrador. Todo lo escrito se queda tal cual, incluidos
       los destinatarios y el «abierto para apuntarse». */
    $('pl-duplicar').addEventListener('click', function(){
      if(!editandoId) return;
      COPIA_DE = { fecha: $('pl-fecha').value, titulo: $('pl-titulo').value.trim() };
      editandoId = null;
      if($('pl-fecha').value) $('pl-fecha').value = addDias($('pl-fecha').value, 7);
      // Una copia nace en borrador: publicarla es una decisión aparte.
      $('pl-publicar').checked = false;
      if(refrescarAbrirPl) refrescarAbrirPl(true);
      // El desplegable ya no señala a nada: lo de la pantalla es otro entrenamiento.
      if($('pl-editar')) $('pl-editar').value = '';
      var m = $('pl-msg');
      m.className = 'msg';
      m.textContent = 'Copia preparada. Cambia lo que quieras y pulsa «Guardar entrenamiento»: el original no se toca.';
      pintarModo();
      $('pl-titulo').focus();
    });

    /* PASÁRSELO A OTRO DÍA · el panel de arriba, conectado. */
    $('pl-pasar').addEventListener('click', function(){
      var caja = $('pl-pasar-caja');
      if(caja.hidden) abrirPasar(); else cerrarPasar();
    });
    $('pl-pasar-no').addEventListener('click', cerrarPasar);
    $('pl-pasar-lista').addEventListener('change', refrescarPasar);
    $('pl-pasar-fecha').addEventListener('change', refrescarPasar);
    $('pl-pasar-ninguno').addEventListener('click', function(){
      $('pl-pasar-lista').querySelectorAll('.pasar-chk').forEach(function(i){ i.checked = false; });
      refrescarPasar();
    });
    $('pl-pasar-ok').addEventListener('click', hacerPasar);
    $('pl-pasar-deshacer').addEventListener('click', deshacerPasar);
    $('pl-pasar-abrir').addEventListener('click', function(){
      var id = PASAR.creadaId, g = PASAR.sesion ? PASAR.sesion.grupo_id : null;
      if(!id) return;
      cerrarPasar();
      verEntreno(g, id);
    });

    // El rótulo dice de qué entrenamiento se está hablando: se refresca al escribir.
    $('pl-fecha').addEventListener('change', pintarModo);
    $('pl-titulo').addEventListener('input', pintarModo);
    /* Cambiar el deporte o el papel del día cambia el tipo de siempre, y de él
       salen las columnas de las filas y el formato del descanso. Por eso se
       recalcula antes de repintar. */
    function ejeCambiado(){ sincronizarTipo(); aplicarModoFilas(); }
    $('pl-deporte').addEventListener('change', ejeCambiado);
    $('pl-papel').addEventListener('change', ejeCambiado);
    $('pl-deporte2').addEventListener('change', pedirResumen);
    $('pl-tipo').addEventListener('change', aplicarModoFilas);
    $('pl-material').addEventListener('change', aplicarModoFilas);
    // el volumen y el tiempo se recalculan solos según se escribe
    $('bloques-cont').addEventListener('input', pedirResumen);
    $('bloques-cont').addEventListener('change', pedirResumen);

    // ---- ¿para quién es? ----
    pintarListaDest('pl', $('pl-grupo').value, []);
    refrescarDestPl = conectarDest('pl', true);

    // ---- ¿abierto para apuntarse? ----
    pintarSecciones('pl', []);
    refrescarAbrirPl = conectarAbrir('pl', null, function(){ return $('pl-publicar').checked; });
    $('pl-publicar').addEventListener('change', function(){ refrescarAbrirPl(true); });

    $('pl-grupo').addEventListener('change', function(){
      editandoId = null;
      // al cambiar de grupo cambian los atletas: la lista se repinta vacía
      aplicarDest('pl', $('pl-grupo').value, null);
      refrescarDestPl();
      $('pl-material').checked = grupoEsDeAgua($('pl-grupo').value);
      aplicarModoFilas();
      // el sitio habitual del nuevo grupo, para no escribirlo a mano
      aplicarAbrir('pl', { lugar: lugarDeGrupo($('pl-grupo').value) });
      refrescarAbrirPl(true);
      pintarModo();
      cargarSesionesGrupo($('pl-grupo').value);
    });
    $('pl-editar').addEventListener('change', function(){
      var id=$('pl-editar').value;
      if(!id){ limpiarFormulario(); return; }
      var s = window.__SESIONES_GRUPO && window.__SESIONES_GRUPO[id];
      if(s) cargarSesionEnForm(s);
    });

    $('pl-guardar').addEventListener('click', async function(){
      var msg=$('pl-msg'); msg.className='msg'; msg.textContent='Guardando…';
      var grupoId=$('pl-grupo').value, fecha=$('pl-fecha').value;
      if(!grupoId){ msg.textContent='Elige un grupo.'; msg.className='msg error'; return; }
      if(!fecha){ msg.textContent='Pon una fecha.'; msg.className='msg error'; return; }
      var dest = leerDest('pl');
      if(dest.error){ msg.textContent = dest.error; msg.className='msg error'; return; }
      var abre = leerAbrir('pl');
      if(abre.error){ msg.textContent = abre.error; msg.className='msg error'; return; }
      var payload={
        grupo_id: grupoId,
        fecha: fecha,
        dia_semana: diaSemana(fecha),
        titulo: $('pl-titulo').value.trim()||null,
        /* Los dos ejes son lo que el entrenador ha elegido de verdad. El `tipo`
           de siempre va también, deducido, porque hay pantallas que lo leen.
           Y el `rol` se manda vacío a posta: así la base lo vuelve a calcular
           desde el papel del día (migración 102) y no se queda colgado el
           valor viejo cuando alguien cambia un impacto por una recuperación. */
        deporte: $('pl-deporte').value||null,
        deporte_2: $('pl-deporte2').value||null,
        papel_dia: $('pl-papel').value||null,
        tipo: $('pl-tipo').value||null,
        rol: null,
        nota_razonamiento: $('pl-nota').value.trim()||null,
        bloques: serializarBloques(),
        publicada: $('pl-publicar').checked,
        atletas_ids: dest.ids,  // null = todo el grupo · [ids] = solo esos atletas
        abierta_inscripcion: abre.abierta_inscripcion,
        inscripcion: abre.inscripcion,
        plazas: abre.plazas,
        abierta_a: abre.abierta_a,
        hora: abre.hora,
        lugar: abre.lugar
      };
      var res;
      if(editandoId){ res = await sb.from('sesiones').update(payload).eq('id', editandoId).select('id').maybeSingle(); }
      else { payload.creado_por = perfil.id; res = await sb.from('sesiones').insert(payload).select('id').maybeSingle(); }
      if(res.error){ msg.textContent='Error: '+res.error.message; msg.className='msg error'; return; }
      /* Si era una copia, ya es un entrenamiento de verdad y con su propio
         id: deja de ser copia y pasa a estar en edición, como cualquier otro. */
      var eraCopia = !!COPIA_DE;
      COPIA_DE = null;
      if(res.data && res.data.id) editandoId = res.data.id;
      var quien = dest.ids ? ' · solo para '+dest.ids.length+' atleta(s)' : ' · para todo el grupo';
      var abierto = '';
      if(abre.abierta_inscripcion){
        abierto = ' · abierto a '+textoSecciones(abre.abierta_a)+(abre.plazas ? ' ('+abre.plazas+' plazas)' : ' (sin límite de plazas)');
        if(!payload.publicada) abierto += ' · ojo: en borrador nadie se puede apuntar';
      }
      // en pista y running una serie sin recuperación no se entiende: se avisa,
      // pero nunca se tira lo que el entrenador ya había escrito
      var sinRec = seriesSinRec();
      var falta = sinRec ? ' · ojo: '+sinRec+' serie(s) sin recuperación' : '';
      msg.textContent = (eraCopia ? 'Copia guardada como entrenamiento nuevo ✓' : 'Guardado ✓')+($('pl-publicar').checked?' (publicada)':' (borrador)')+quien+abierto+falta; msg.className='msg ok';
      pintarModo();
      await cargarSesionesGrupo(grupoId);
      if(editandoId) $('pl-editar').value = editandoId;
      cargarSesionesFeedback(); // refrescar el desplegable de feedback
      refrescarApuntados();     // por si acabas de abrir (o cerrar) un entreno
    });

    // estado inicial
    limpiarFormulario();
    cargarSesionesGrupo($('pl-grupo').value);
  })();


  // ============================================================
  // SECCIÓN 2b · PLANIFICAR UNA SEMANA ENTERA
  // ------------------------------------------------------------
  // Cuatro caminos que terminan todos en la MISMA previsualización
  // y en el mismo botón de guardado:
  //   A) pegar la semana escrita en texto plano
  //   B) importar un CSV (con plantilla descargable)
  //   C) duplicar una semana ya creada a otro grupo u otra fecha
  //   D) aplicar una plantilla de semana guardada
  // Nunca se escribe en la base de datos sin pasar antes por la
  // previsualización. El guardado va en lote (un solo insert).
  // ============================================================

  var DIAS_CLAVE = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
  var DIAS_TXT   = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];

  function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
  function mapaNorm(pares){ var m={}; Object.keys(pares).forEach(function(k){ m[norm(k).replace(/_/g,' ')] = pares[k]; }); return m; }

  // Sinónimos aceptados al interpretar. A la izquierda lo que puede
  // escribir el entrenador, a la derecha el valor que admite la base
  // de datos (los CHECK de la tabla sesiones).
  var SINON_TIPO = mapaNorm({
    'pista':'pista','track':'pista','atletismo':'pista','series':'pista','entreno de pista':'pista',
    'gym':'gym','gimnasio':'gym','pesas':'gym','sala':'gym','fuerza':'gym','musculacion':'gym',
    'continuo':'continuo','rodaje':'continuo','carrera continua':'continuo','aerobico':'continuo','rodar':'continuo',
    'activacion':'activacion',
    'competicion':'competicion','competi':'competicion','compe':'competicion','control':'competicion',
    'descanso':'descanso','descansa':'descanso','libre':'descanso','off':'descanso','reposo':'descanso'
  });
  var SINON_ROL = mapaNorm({
    'calidad_fuerte':'calidad_fuerte','calidad fuerte':'calidad_fuerte','calidad':'calidad_fuerte','fuerte':'calidad_fuerte',
    'secundaria':'secundaria','secundario':'secundaria','sesion secundaria':'secundaria',
    'activacion':'activacion',
    'ultimo_toque_48h':'ultimo_toque_48h','ultimo toque':'ultimo_toque_48h','ultimo toque 48h':'ultimo_toque_48h','48h':'ultimo_toque_48h','toque':'ultimo_toque_48h',
    'descarga':'descarga','regenerativo':'descarga','recuperacion':'descarga',
    'competicion':'competicion'
  });
  var ETIQ_BLOQUE = ['calentamiento','parte principal','principal','parte central','vuelta a la calma','vuelta calma','core','gimnasio','gym','fuerza','tecnica','estiramientos','activacion','trabajo especifico','preventivo'];

  // ---------- intérprete de texto ----------
  function detectaDia(txt){
    var n = sinTildes(txt).toLowerCase();
    for(var i=0;i<7;i++){
      var d = DIAS_CLAVE[i];
      if(n.indexOf(d)===0){
        var sig = n.charAt(d.length);
        if(sig==='' || /[^a-z0-9]/.test(sig)) return { idx:i, resto: txt.slice(d.length) };
      }
    }
    return null;
  }

  function aplicarCabecera(ses, resto){
    resto = String(resto||'').replace(/^[\s:·•|,.\-–—]+/,'').trim();
    if(!resto) return;
    resto.split(/\s*[·•|]\s*|\s+[–—]\s+|\s+-\s+/).forEach(function(p){
      p = p.trim(); if(!p) return;
      var np = norm(p).replace(/[()]/g,'').replace(/_/g,' ').trim();
      if(/^\d{1,2}\s*(\/|-|\.|de\s)/.test(np)) return;   // "4 de agosto", "04/08" → es la fecha, ya la sabemos
      // un trozo que sea SOLO una hora ("9:00", "17:30 h") es la hora de quedada
      if(!ses.hora && /^\d{1,2}\s*[:.h]\s*\d{2}\s*(h|horas)?$/i.test(p.trim())){
        var hh = horaDeTexto(p);
        if(hh){ ses.hora = hh; return; }
      }
      if(SINON_TIPO[np] && !ses.tipo){ ses.tipo = SINON_TIPO[np]; return; }
      if(SINON_ROL[np] && !ses.rol){ ses.rol = SINON_ROL[np]; return; }
      ses.titulo = (ses.titulo ? ses.titulo+' · ' : '') + p;
    });
  }

  // Un encabezado de bloque: "VELOCIDAD MÁXIMA — Calidad pura" → etiqueta + matiz
  function bloqueDeEncabezado(texto){
    var t = String(texto||'').replace(/\s*:\s*$/,'').trim();
    var b = { etiqueta: t, filas: [] };
    var m = t.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    if(m){ b.etiqueta = m[1].trim(); b.matiz = m[2].trim(); }
    return b;
  }

  // Una fila de entreno:
  //   pista:    "Salidas desde tacos | 3x30m | rec 3-4' | C | obs: Máxima aceleración"
  //   gimnasio: "Cargada completa | 3x2 | 80% RM | obs: Sin llegar a fallo"
  function parseFila(texto){
    var bruto = String(texto||'').trim();
    var partes = bruto.split('|');
    if(partes.length===1 && bruto.indexOf(' · ')>-1) partes = bruto.split(' · ');
    if(partes.length===1 && bruto.indexOf(';')>-1) partes = bruto.split(';');
    partes = partes.map(function(x){ return x.trim(); }).filter(function(x){ return x!==''; });
    var f = { ejercicio: partes.shift() || bruto }, sobra = [];
    partes.forEach(function(p){
      var np = norm(p);
      // observaciones: "obs: ..." / "observaciones: ..." (puede llevar · dentro, se respeta entero)
      var mo = p.match(/^(obs|observacion(?:es)?)\s*[:.\-–—]\s*(.*)$/i);
      if(mo){ var tx = mo[2].trim() || p; f.observaciones = f.observaciones ? f.observaciones+' · '+tx : tx; return; }
      // carga de gimnasio: cualquier cosa con "% RM" (o etiquetada "carga:")
      if(!f.carga && (esCarga(p) || /^carga\s*[:.]/i.test(np))){
        f.carga = p.replace(/^carga\s*[:.]?\s*/i,'').trim() || p; return;
      }
      // calzado: Z, C, zapatillas, clavos, descalzo… (lista cerrada)
      if(!f.calzado){ var cz = resolverCalzado(p); if(cz){ f.calzado = cz; return; } }
      // material de natación: uno o varios ("tabla + aletas")
      if(!f.material){ var mat = resolverMaterial(p); if(mat.length){ f.material = mat; return; } }
      var mm = p.match(/^(\d{1,3})\s*[x×]\s*(.*)$/i);
      if(mm && !f.series){ f.series = mm[1]; var d = mm[2].trim(); if(d) f.distancia = d; return; }
      if(!f.ritmo && (/%/.test(p) || /\britmo\b/.test(np))){ f.ritmo = p.replace(/^ritmo\s*[:.]?\s*/i,'').trim() || p; return; }
      if(!f.descanso && (/^(desc|rec|r)\b/.test(np) || /\bdescanso\b|\bpausa\b/.test(np))){
        f.descanso = p.replace(/^(descansos?|desc\.?|recup\w*|rec\.?|pausa|r)\s*[:.]?\s*/i,'').trim() || p; return;
      }
      // montaña: «400 m D+» es el desnivel de la subida, no la distancia
      if(!f.desnivel_m && (/\bd\s*\+/.test(np) || /\bdesnivel\b/.test(np))){
        var dv = metrosDeTexto(p); if(dv){ f.desnivel_m = dv; return; }
      }
      if(!f.distancia && /^\d+(?:[.,]\d+)?\s*(m|km|metros)\.?$/.test(np)){ f.distancia = p; return; }
      sobra.push(p);
    });
    if(sobra.length) f.detalle = sobra.join(' · ');
    if(!f.ejercicio) f.ejercicio = bruto;
    return f;
  }

  /* ============================================================
     EL TRADUCTOR · de cómo escribe el club a cómo lee el portal
     ------------------------------------------------------------
     La planificación de natación del club lleva años escribiéndose así, en un
     documento de Drive:

       MASTER Lunes 27 de julio – 50 m (≈3.300 m)
       Calentamiento (900 m)
       ● 100 (50) crol suave
       ● 300 X PARES: C/ALETAS (a 50 CAMBIO) crol / br [pies mar] / esp
       PAUSA DE HIDRATACIÓN
       Principal (1.600 m)
       Calle 1 (cinturón/churro)

     Y el portal esperaba almohadillas y guiones. Se intentó al revés —enseñarle
     el formato del portal al entrenador, y a ChatGPT— y falló tres veces: se
     comían las almohadillas, no ponían las distancias de iniciación y se
     inventaban los totales. Adaptar el programa es más barato que adiestrar a
     cada persona que pase por el club.

     Esto NO reinterpreta nada: traduce el texto al formato que el intérprete de
     siempre ya sabe leer, y a partir de ahí todo sigue igual —previsualización,
     avisos, y nada se guarda sin revisar—. Si el texto ya viene en el formato
     del portal, no se toca.

     ⚠️ El color no sobrevive al copiar y pegar, pero da igual: en el documento
     del club los metros de iniciación van ENTRE PARÉNTESIS —«100 (50)»— y el
     paréntesis sí llega. El color era el adorno; el dato estaba en el paréntesis.
     ============================================================ */
  var DIA_SUELTO = /(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)/i;
  /* Los nombres de bloque que usa el club. Se reconocen aunque lleven detrás sus
     metros entre paréntesis: «Calentamiento (900 m)». */
  var BLOQUE_CLUB = new RegExp('^\\s*(calentamiento|parte inicial|parte principal|serie principal|principal|' +
    't[eé]cnica|velocidad|juego|juegos|relevos|circuito|circuito t[eé]cnico|mini campeonato|' +
    'vuelta a la calma|final|soltar|estiramientos)\\b', 'i');
  var CALLE_CLUB = /^\s*calle\s*\d/i;
  var PAUSA_CLUB = /^\s*pausa\s+de\s+hidrataci[oó]n\s*$/i;
  var VINETA = /^\s*(?:[●•·◦▪–—-]|\*|\d{1,2}[.)])\s+/;

  function pareceFormatoPortal(txt){
    return /^\s*#/m.test(txt) || /^\s*[-*]\s+\S/m.test(txt);
  }

  /* ¿Es una hoja de cálculo o es la planificación escrita a mano? Manda la
     primera línea: una cabecera de la plantilla trae varias columnas conocidas
     separadas por ; o por ,. Un documento de Drive empieza por el título o por
     el primer día, y ahí no hay cabecera que valga. */
  function pareceCSV(txt){
    var primera = String(txt||'').split(/\r?\n/)[0] || '';
    if(!/[;,\t]/.test(primera)) return false;
    var reconocidas = primera.split(/[;,\t]/).filter(function(c){ return claveDeCabecera(c); }).length;
    return reconocidas >= 2;
  }

  /* ------------------------------------------------------------
     UN ARCHIVO, TRES GRUPOS
     ------------------------------------------------------------
     El documento del club no es la semana de un grupo: es la semana del CLUB
     entero. Diez sesiones, tres grupos y cuatro días en el mismo archivo:

       MASTER Lunes 27 de julio – 50 m (≈3.300 m)
       ESCUELA 6-9 AÑOS Lunes 27/07–
       ESCUELA 10-15 Lunes 27/07–
       MÁSTER Martes 28 de julio – …

     Y el portal importa a UN grupo. Antes esto acababa con el máster y las dos
     escuelas fundidos en el mismo lunes, sin decir nada.

     Se resuelve leyendo lo que hay ANTES del día en cada cabecera —eso es el
     grupo— y quedándose solo con el que se está planificando. El entrenador
     sube su archivo entero, tal cual, y elige el grupo en el desplegable de
     siempre. Sin partir archivos a mano.

     Si no se puede decidir cuál es, NO se adivina: entra todo y se avisa.
     ------------------------------------------------------------ */
  function clave(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  }
  /* Palabras que no distinguen a un grupo de otro: están en casi todos. */
  var VACIAS = { 'de':1,'del':1,'la':1,'el':1,'los':1,'las':1,'y':1,'anos':1,'grupo':1,'natacion':1 };
  function parecido(a, b){
    var A = clave(a).split(' ').filter(function(p){ return p && !VACIAS[p]; });
    var B = clave(b).split(' ').filter(function(p){ return p && !VACIAS[p]; });
    if(!A.length || !B.length) return 0;
    var n = 0;
    A.forEach(function(p){ if(B.indexOf(p) !== -1) n++; });
    return n;
  }

  function separarPorGrupo(txt, nombreGrupo){
    var lineas = String(txt||'').split(/\r?\n/);
    var trozos = [], actual = null, sinGrupo = [];
    lineas.forEach(function(l){
      var t = l.replace(/ /g,' ').trim();
      var md = t.match(DIA_SUELTO);
      if(md && !VINETA.test(t) && t.length < 120){
        var g = t.slice(0, md.index).replace(/[\s·|,–—-]+$/,'').trim();
        if(g){ actual = { grupo: g, lineas: [] }; trozos.push(actual); }
        else if(!actual){ sinGrupo.push(l); return; }
      }
      (actual ? actual.lineas : sinGrupo).push(l);
    });

    /* ⚠️ SE AGRUPA POR EL NOMBRE NORMALIZADO, no por el literal. En el documento
       de verdad el máster está escrito de las dos maneras —«MASTER» el lunes y
       «MÁSTER» el martes—, y contándolos como dos grupos distintos empataban
       entre ellos y no se podía elegir ninguno. Un acento no hace un grupo. */
    var porClave = {}, nombres = [];
    trozos.forEach(function(tr){
      var k = clave(tr.grupo);
      if(!porClave[k]){ porClave[k] = tr.grupo; nombres.push(tr.grupo); }
      tr.k = k;
    });
    var claves = Object.keys(porClave);
    if(claves.length < 2) return { texto: txt, grupos: nombres, elegido: null };

    var mejor = null, tope = 0, empate = false;
    claves.forEach(function(k){
      var p = parecido(porClave[k], nombreGrupo);
      if(p > tope){ tope = p; mejor = k; empate = false; }
      else if(p === tope && p > 0 && k !== mejor){ empate = true; }
    });
    if(!mejor || empate) return { texto: txt, grupos: nombres, elegido: null };

    var quedan = sinGrupo.concat();
    trozos.forEach(function(tr){ if(tr.k === mejor) quedan = quedan.concat(tr.lineas); });
    return { texto: quedan.join('\n'), grupos: nombres, elegido: porClave[mejor] };
  }

  function traducirDelClub(txt){
    var fuera = [], enDia = false, tocado = false, vistos = {}, repetido = null;
    String(txt||'').split(/\r?\n/).forEach(function(cruda){
      var t = cruda.replace(/ /g,' ').replace(/^\s+|\s+$/g,'');
      if(!t){ fuera.push(''); return; }

      if(PAUSA_CLUB.test(t)){ fuera.push('- Pausa de hidratación'); tocado = true; return; }

      /* Una línea con día es una sesión nueva. Se queda con lo que la acompaña
         —el grupo, la piscina, los metros— como título, que es información que
         el entrenador ha escrito a propósito y no se tira. */
      var md = t.match(DIA_SUELTO);
      if(md && !VINETA.test(t) && t.length < 120){
        var resto = t.replace(md[0], ' ').replace(/\s{2,}/g,' ').replace(/^[\s·|,–—-]+|[\s·|,–—-]+$/g,'');
        /* ⚠️ EL DOCUMENTO DEL CLUB TRAE VARIOS GRUPOS: máster, escuela 6-9 y
           escuela 10-15, cada uno con su lunes. Dos «LUNES» en el mismo texto
           acabarían fundidos en una sola sesión con los bloques de los dos
           grupos mezclados, y encima sin avisar. Se cuenta y se avisa. */
        var clave = md[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
        if(vistos[clave] && !repetido) repetido = md[1];
        vistos[clave] = true;
        fuera.push(md[1].toUpperCase() + (resto ? ' · ' + resto : ''));
        enDia = true; tocado = true; return;
      }
      if(!enDia){ fuera.push(t); return; }

      /* «Calle 1 (cinturón/churro)» es un bloque: dentro va lo que hace ESA
         calle, que en la escuela pequeña es distinto de lo de la de al lado. */
      if(CALLE_CLUB.test(t)){
        var mc = t.match(/^\s*calle\s*(\d)\s*(?:[（(]([^)）]*)[)）])?/i);
        var NIVEL = { '1':'Iniciación', '2':'Desarrollo', '3':'Perfeccionamiento' };
        var mat = mc && mc[2] ? mc[2].trim() : '';
        fuera.push('# Calle ' + mc[1] + ' — ' + (NIVEL[mc[1]] || '') + (mat ? ' · ' + mat : ''));
        tocado = true; return;
      }

      /* Las rayas de separación del documento («________») no son nada. */
      if(/^[_\-–—=·.\s]{4,}$/.test(t)){ fuera.push(''); return; }

      /* «Objetivo: mantener la técnica aunque aumente el cansancio» es la nota
         del día y el intérprete de siempre ya la reconoce, así que pasa entera
         y sin guion. Con guion se convertía en un ejercicio más, y esa frase la
         leen el atleta y su familia: su sitio es la cabecera del día. */
      if(/^(nota|objetivo|hora|lugar)\s*:/i.test(t)){ fuera.push(t); tocado = true; return; }

      /* ⚠️ EL BLOQUE SE MIRA SIN EL NÚMERO DE DELANTE. El club numera sus
         bloques —«1. Calentamiento (400 m) (200)», «4. vUELTA A LA CALMA»— y
         eso tiene la misma pinta que una lista de ejercicios numerada. Si se
         mira la línea entera, «1. Calentamiento» no casa con ningún nombre de
         bloque, se lo lleva la regla de la viñeta y el calentamiento acaba
         siendo un ejercicio dentro del bloque anterior. */
      var sinNumero = t.replace(/^\s*\d{1,2}[.)]\s+/, '');
      if(BLOQUE_CLUB.test(sinNumero)){ fuera.push('# ' + sinNumero); tocado = true; return; }

      if(VINETA.test(t)){ fuera.push('- ' + t.replace(VINETA,'')); tocado = true; return; }

      /* Una línea suelta dentro de un día que no es bloque ni viñeta suele ser
         un ejercicio escrito de corrido —«4 x (200 crol A2/20" + 2×50…)»—, así
         que entra como ejercicio. Perderla sería peor. */
      fuera.push('- ' + t); tocado = true;
    });
    return { texto: fuera.join('\n'), tocado: tocado, repetido: repetido };
  }

  function interpretarTexto(txt, lunes, nombreGrupo){
    var traduccion = null, corte = null;
    if(txt && !pareceFormatoPortal(txt)){
      corte = separarPorGrupo(txt, nombreGrupo || '');
      traduccion = traducirDelClub(corte.texto);
      if(traduccion.tocado) txt = traduccion.texto;
    }
    var lineas = String(txt||'').split(/\r?\n/);
    var mapa = {}, orden = [], avisos = [], ses = null, bloque = null, sueltas = 0;

    function asegurarBloque(){
      if(!bloque){
        bloque = { etiqueta:'Parte principal', filas:[] };
        ses.bloques.push(bloque);
        avisos.push('El '+ses.dia_semana+' tenía ejercicios sin bloque: los he puesto en «Parte principal».');
      }
      return bloque;
    }

    for(var i=0;i<lineas.length;i++){
      var t = lineas[i].replace(/\*\*/g,'').replace(/__/g,'').replace(/^\s+|\s+$/g,'');
      if(!t) continue;

      var marca = '', cuerpo = t;
      var m = t.match(/^(#{1,6}|[-*•·+>]|\d{1,2}[.)])\s+(.+)$/);
      if(m){ marca = m[1]; cuerpo = m[2].trim(); }
      else { var m2 = t.match(/^(#{1,6})\s*(.+)$/); if(m2){ marca = m2[1]; cuerpo = m2[2].trim(); } }

      // ¿línea de día? abre sesión (aunque venga con # o con guion delante)
      var dia = detectaDia(cuerpo);
      if(dia){
        if(mapa[dia.idx]){ ses = mapa[dia.idx]; avisos.push('El '+DIAS_TXT[dia.idx]+' aparece más de una vez: he juntado todo en el mismo entrenamiento.'); }
        else { ses = { idx:dia.idx, fecha: addDias(lunes, dia.idx), dia_semana: DIAS_TXT[dia.idx], tipo:'', rol:'', titulo:'', nota_razonamiento:'', bloques:[], incluir:true, hora:'', lugar:'' };
               mapa[dia.idx] = ses; orden.push(dia.idx); }
        bloque = null;
        aplicarCabecera(ses, dia.resto);
        continue;
      }

      if(!ses){ sueltas++; continue; }

      // '#' abre bloque (y lo que vaya tras " — " se guarda como matiz)
      if(marca.charAt(0)==='#'){ bloque = bloqueDeEncabezado(cuerpo); ses.bloques.push(bloque); continue; }

      // nota / objetivo del día
      var mn = cuerpo.match(/^(nota|notas|objetivo|razonamiento|comentario|observaciones)\s*[:·\-–]\s*(.*)$/i);
      if(mn){ ses.nota_razonamiento = (ses.nota_razonamiento ? ses.nota_razonamiento+' ' : '') + mn[2].trim(); continue; }

      // hora de quedada y sitio ("Hora: 9:00", "Lugar: Playa del Postiguet")
      var mh = cuerpo.match(/^(hora|a las)\s*[:·\-–]\s*(.*)$/i);
      if(mh){ var h2 = horaDeTexto(mh[2]); if(h2) ses.hora = h2; else avisos.push('No he entendido la hora «'+mh[2].trim()+'» del '+ses.dia_semana+'. Ponla como 9:00 o 17:30.'); continue; }
      var ml = cuerpo.match(/^(lugar|sitio|donde|dónde|instalacion|instalación)\s*[:·\-–]\s*(.*)$/i);
      if(ml){ ses.lugar = ml[2].trim(); continue; }

      // viñeta o número → fila de entreno
      if(marca){ asegurarBloque().filas.push(parseFila(cuerpo)); continue; }

      // sin viñeta: ¿es el título de un bloque? ("Calentamiento:", "Calentamiento", "Fuerza — Máxima")
      var sinDosP = cuerpo.replace(/\s*:\s*$/,'');
      var cand = bloqueDeEncabezado(cuerpo);
      if((/:\s*$/.test(cuerpo) && sinDosP.length<=48) || ETIQ_BLOQUE.indexOf(norm(cuerpo))>-1 || (cand.matiz && ETIQ_BLOQUE.indexOf(norm(cand.etiqueta))>-1)){
        bloque = cand; ses.bloques.push(bloque); continue;
      }

      // no encaja con nada: NO se pierde, entra como ejercicio y se avisa
      asegurarBloque().filas.push({ ejercicio: cuerpo });
      avisos.push('No supe interpretar esta línea del '+ses.dia_semana+' y la he dejado tal cual como ejercicio: «'+cuerpo+'»');
    }

    if(sueltas) avisos.push('Hay '+sueltas+' línea(s) antes del primer día: las he ignorado. Cada entrenamiento tiene que empezar por el nombre del día.');
    orden.sort(function(a,b){ return a-b; });
    var sesiones = orden.map(function(k){ return mapa[k]; });
    sesiones.forEach(function(s){ s.bloques = (s.bloques||[]).filter(function(b){ return (b.filas && b.filas.length) || b.etiqueta; }); });
    /* Se dice que se ha traducido, y se dice PRIMERO: quien pega su documento de
       siempre tiene que saber que la pantalla ha interpretado su escritura, para
       que mire la previsualización con ojo en vez de darle a crear a ciegas. */
    if(traduccion && traduccion.tocado){
      if(traduccion.repetido){
        avisos.unshift('⚠️ El ' + traduccion.repetido.toLowerCase() + ' aparece más de una vez y todo ha ido a la misma sesión. Si el archivo trae varios grupos, quédate solo con la parte de uno.');
      }
      if(corte && corte.grupos && corte.grupos.length > 1){
        avisos.unshift(corte.elegido
          ? 'Este archivo trae ' + corte.grupos.length + ' grupos (' + corte.grupos.join(', ') + '). Me he quedado solo con «' + corte.elegido + '», que es el que se parece al grupo que has elegido arriba. Para los demás, vuelve a subir el mismo archivo cambiando el grupo.'
          : '⚠️ Este archivo trae ' + corte.grupos.length + ' grupos (' + corte.grupos.join(', ') + ') y no sé cuál de ellos es el grupo que has elegido arriba, así que los he metido todos y se han mezclado. Cambia el grupo del desplegable por uno que se llame parecido, o borra del texto los grupos que no toquen.');
      }
      avisos.unshift('He leído tu documento tal como lo escribes y lo he ordenado en días, bloques y ejercicios. Repasa la previsualización antes de crear nada.');
    }
    return { sesiones: sesiones, avisos: avisos };
  }

  var ALIAS_CSV = mapaNorm({

    'series':'series','repeticiones':'series','reps':'series','series x reps':'series',
    'distancia':'distancia','ritmo':'ritmo','intensidad':'ritmo',
    /* La columna de natación: los metros de la calle de iniciación. Va aparte
       porque en una casilla propia se ve VACÍA cuando falta, y así se nota. Si
       fuera parte del texto de la distancia, quien no la escribiera no dejaría
       ni rastro. Ver plantilla-semana-natacion.xlsx. */
    'distancia iniciacion':'distancia_ini','distancia iniciacion m':'distancia_ini',
    'distancia ini':'distancia_ini','iniciacion':'distancia_ini','metros iniciacion':'distancia_ini',
    'descanso':'descanso','recuperacion':'descanso','rec':'descanso',
    'desnivel':'desnivel_m','desnivel m':'desnivel_m','d+':'desnivel_m','desnivel positivo':'desnivel_m',
    'calzado':'calzado','zapatillas':'calzado',

    'material':'material','material natacion':'material',
    'observaciones':'observaciones','observacion':'observaciones','obs':'observaciones',
    'detalle':'detalle',
    'nota':'nota','notas':'nota','nota razonamiento':'nota','nota del dia':'nota',
    'hora':'hora','hora de inicio':'hora','a las':'hora',
    'lugar':'lugar','sitio':'lugar','instalacion':'lugar','donde':'lugar',
    /* Las cabeceras tal como están escritas en los Excel que se descargan. En la
       hoja se lee «Título de la sesión», no «titulo»: si no están aquí, la columna
       entera se cae sin decir nada. */
    'titulo de la sesion':'titulo','tipo de sesion':'tipo',
    'papel del dia':'rol','papel':'rol',
    /* «Para quién» = el subgrupo o la persona a la que va ese bloque, como en las
       planificaciones de papel del club («VALLISTAS — Rafa y Adri»). Viaja como
       matiz del bloque, que es donde ya se ve hoy en el portal y en la ficha. */
    'para quien':'matiz','atleta':'matiz','atletas':'matiz','subgrupo':'matiz'

  /* La cabecera se reconoce con tolerancia, porque nadie escribe «distancia» a
     secas en una hoja de cálculo: escribe «Distancia (m)» y explica entre
     paréntesis para qué es. Si el paréntesis tumba la columna, el entrenador
     rellena su Excel entero y sube una semana sin distancias, sin un solo aviso.
     Por eso, si no hay coincidencia exacta, se prueba otra vez sin paréntesis. */
  function claveDeCabecera(h){
    var t = norm(h);
    if(ALIAS_CSV[t]) return ALIAS_CSV[t];
    t = t.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
    return ALIAS_CSV[t] || '';
  }

  function p2(n){ n = String(parseInt(n,10)); return (n.length<2?'0':'')+n; }
  function fechaDeCSV(v){
    v = String(v||'').trim(); if(!v) return '';
    var m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
    m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(m){ var a = m[3]; if(a.length===2) a = '20'+a; return a+'-'+p2(m[2])+'-'+p2(m[1]); }
    return '';
  }

  function detectarSepCSV(texto){
    var linea = String(texto||'').split(/\r?\n/)[0] || '', fuera = true, c = { ';':0, ',':0, '\t':0 };
    for(var i=0;i<linea.length;i++){ var ch = linea.charAt(i); if(ch==='"') fuera = !fuera; else if(fuera && c[ch]!==undefined) c[ch]++; }
    var mejor = ';';
    if(c[',']>c[mejor]) mejor = ',';
    if(c['\t']>c[mejor]) mejor = '\t';
    return mejor;
  }

  // Parser CSV a mano: respeta comillas dobles y "" escapadas
  function parseCSV(texto){
    texto = String(texto||'').replace(/^\uFEFF/,'');
    var sep = detectarSepCSV(texto), filas = [], fila = [], campo = '', comillas = false;
    for(var i=0;i<texto.length;i++){
      var c = texto.charAt(i);
      if(comillas){
        if(c==='"'){ if(texto.charAt(i+1)==='"'){ campo += '"'; i++; } else comillas = false; }
        else campo += c;
      }
      else if(c==='"'){ comillas = true; }
      else if(c===sep){ fila.push(campo); campo = ''; }
      else if(c==='\n'){ fila.push(campo); filas.push(fila); fila = []; campo = ''; }
      else if(c!=='\r'){ campo += c; }
    }
    if(campo!=='' || fila.length){ fila.push(campo); filas.push(fila); }
    return filas.filter(function(f){ return f.some(function(x){ return String(x).trim()!==''; }); });
  }

  function interpretarCSV(texto, lunes){
    var filas = parseCSV(texto), avisos = [];
    if(!filas.length) return { sesiones:[], avisos:['El archivo está vacío.'] };
    var cab = filas.shift().map(function(h){ return claveDeCabecera(h); });
    if(cab.indexOf('ejercicio')===-1 && cab.indexOf('dia')===-1 && cab.indexOf('fecha')===-1){
      return { sesiones:[], avisos:['No reconozco la cabecera del archivo. Descarga la plantilla y usa sus columnas: dia, fecha, tipo, rol, titulo, bloque, matiz, ejercicio, series, distancia, ritmo, rec, calzado, carga, material, observaciones, detalle.'] };
    }
    var mapa = {}, orden = [];
    filas.forEach(function(f, n){
      var r = {};
      cab.forEach(function(k, j){ if(k) r[k] = String(f[j]==null?'':f[j]).trim(); });
      var fecha = fechaDeCSV(r.fecha), idx = -1;
      if(fecha){ idx = difDias(fecha, lunesDe(fecha)); }
      else {
        var d = detectaDia(r.dia||'');
        if(!d){ avisos.push('Fila '+(n+2)+' sin día ni fecha reconocibles: la he saltado.'); return; }
        idx = d.idx; fecha = addDias(lunes, idx);
      }
      var ses = mapa[fecha];
      if(!ses){
        ses = { idx: idx, fecha: fecha, dia_semana: DIAS_TXT[idx] || diaSemana(fecha), tipo:'', rol:'', titulo:'', nota_razonamiento:'', bloques:[], incluir:true, hora:'', lugar:'' };
        mapa[fecha] = ses; orden.push(fecha);
      }
      if(!ses.hora && r.hora){
        var hc = horaDeTexto(r.hora);
        if(hc) ses.hora = hc; else avisos.push('Fila '+(n+2)+': no entiendo la hora «'+r.hora+'». Ponla como 9:00 o 17:30.');
      }
      if(!ses.lugar && r.lugar) ses.lugar = r.lugar;
      if(!ses.tipo && r.tipo){ var tp = SINON_TIPO[norm(r.tipo).replace(/_/g,' ')]; if(tp) ses.tipo = tp; else avisos.push('Fila '+(n+2)+': el tipo «'+r.tipo+'» no es válido, lo he dejado vacío.'); }
      if(!ses.rol && r.rol){ var rl = SINON_ROL[norm(r.rol).replace(/_/g,' ')]; if(rl) ses.rol = rl; else avisos.push('Fila '+(n+2)+': el rol «'+r.rol+'» no es válido, lo he dejado vacío.'); }
      if(!ses.titulo && r.titulo) ses.titulo = r.titulo;
      if(r.nota) ses.nota_razonamiento = (ses.nota_razonamiento ? ses.nota_razonamiento+' ' : '') + r.nota;
      if(!r.ejercicio && !r.series && !r.distancia && !r.ritmo && !r.descanso && !r.detalle &&
         !r.calzado && !r.carga && !r.material && !r.observaciones && !r.desnivel_m) return;
      /* Un bloque es su etiqueta Y su matiz, no solo la etiqueta. Si solo se
         mirase la etiqueta, dos «Parte principal» dirigidas a gente distinta
         —«Juan» y «Ander»— se fundirían en una sola con el nombre del primero, y
         cada uno acabaría viendo el trabajo del otro. Eso pasa de verdad: es
         como están escritas las hojas del club, una columna por persona.
         El matiz en blanco no abre bloque nuevo: se pega al último de esa misma
         parte, que es lo que hace quien solo escribe el nombre en la primera
         línea de la tanda. */
      var etq = r.bloque || 'Parte principal', mtz = r.matiz || '', bl = null;
      for(var b=0;b<ses.bloques.length;b++){
        var cand = ses.bloques[b];
        if(cand.etiqueta === etq && (!mtz || (cand.matiz||'') === mtz)) bl = cand;
      }
      if(!bl){ bl = { etiqueta: etq, filas: [] }; if(mtz) bl.matiz = mtz; ses.bloques.push(bl); }
      var celda = {};
      celda.ejercicio = r.ejercicio || '(sin nombre)';
      // ⚠️ 'rec' y 'desnivel_m' tienen que seguir en esta lista: si se caen, el
      // descanso de la fila se pierde al guardar y no se nota hasta recargar.
      ['series','distancia','ritmo','descanso','rec','desnivel_m','detalle','carga','observaciones'].forEach(function(k){ if(r[k]) celda[k] = r[k]; });
      /* Los metros de iniciación se pegan a la distancia con la notación que el
         club ya usa en su papel: «600 (300)». Así se ven hoy en el portal y en
         la ficha del atleta sin construir un campo nuevo por toda la aplicación,
         que es trabajo de otro día. Si algún día hay campo propio, se cambia
         aquí y solo aquí. */
      if(r.distancia_ini){
        celda.distancia = celda.distancia
          ? celda.distancia + ' (' + r.distancia_ini + ')'
          : '(' + r.distancia_ini + ')';
      }
      if(celda.desnivel_m){ var dmc = metrosDeTexto(celda.desnivel_m); if(dmc) celda.desnivel_m = dmc; else delete celda.desnivel_m; }
      // calzado y material son listas cerradas: se traducen, y lo que no esté en la lista
      // no se pierde (se guarda en detalle) y se avisa.
      if(r.calzado){
        var cz = resolverCalzado(r.calzado);
        if(cz) celda.calzado = cz;
        else { celda.detalle = (celda.detalle ? celda.detalle+' · ' : '')+'calzado: '+r.calzado;
               avisos.push('Fila '+(n+2)+': el calzado «'+r.calzado+'» no está en la lista (Zapatillas, Clavos, Zapatillas de gimnasio, Descalzo). Lo he pasado a detalle.'); }
      }
      if(r.material){
        var mat = resolverMaterial(r.material);
        if(mat.length) celda.material = mat;
        else { celda.detalle = (celda.detalle ? celda.detalle+' · ' : '')+'material: '+r.material;
               avisos.push('Fila '+(n+2)+': el material «'+r.material+'» no está en la lista ('+MATERIAL.join(', ')+'). Lo he pasado a detalle.'); }
      }
      bl.filas.push(celda);
    });
    var sesiones = orden.map(function(k){ return mapa[k]; }).sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
    return { sesiones: sesiones, avisos: avisos };
  }

  function copiarAlPortapapeles(txt){
    function ok(){ swMsg('Formato copiado al portapapeles ✓', 'ok'); }
    function mal(){ swMsg('No he podido copiar. Abre «Ver el formato aceptado» y cópialo a mano.', 'error'); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, function(){ copiaManual(txt) ? ok() : mal(); });
    } else { copiaManual(txt) ? ok() : mal(); }
  }
  function copiaManual(txt){
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      var r = document.execCommand('copy');
      document.body.removeChild(ta);
      return r;
    } catch(e){ return false; }
  }

  function descargarArchivo(nombre, contenido, mime){
    var blob = new Blob([contenido], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }
