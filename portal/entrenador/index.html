<body>

<div id="portal-contenido">
  <!-- Mientras llegan los datos se dibuja la forma de lo que va a salir, para
       que la pantalla no dé un salto. Nunca un «Cargando…» en gris. -->
  <div class="en-wrap" id="en-wrap">
    <div class="ap-esq" data-esq="tarjeta"></div>
  </div>
</div>

<datalist id="etiquetas-dl">
  <option value="Calentamiento"></option>
  <option value="Parte principal"></option>
  <option value="Vuelta a la calma"></option>
</datalist>

<!-- Sitios donde entrena el club. Se rellena solo con las instalaciones
     que ya usan los grupos y con los lugares de sesiones anteriores. -->
<datalist id="lugares-dl"></datalist>

<!-- Ventana para apuntar la nota del día de un atleta. Vacía hasta que se abre. -->
<div id="modal-nota" class="oculto" role="dialog" aria-modal="true" aria-label="Observaciones del día"><div class="modal-caja" id="modal-nota-caja"></div></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('en-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) {
    /* Esta pantalla se pinta su propia barra de abajo, y aquí no se llega a
       pintar: sin una salida dentro del aviso se queda uno encerrado. */
    wrap.innerHTML = '<div class="tarjeta">'+APOLANA_UI.vacio('No encontramos tu ficha en el club',
      'Tu cuenta existe, pero todavía no está unida a una ficha de entrenador. Avisa al club y podrás entrar en cuanto te den de alta.',
      APOLANA_UI.volver())+'</div>';
    return;
  }

  // ---------- constantes ----------
  /* LOS DOS EJES DEL ENTRENAMIENTO (migración 102)
     Hasta ahora una sola casilla, «tipo», mezclaba dos preguntas: dónde se
     entrena (pista, gimnasio, natación) y qué papel juega el día (activación,
     competición, descanso). Se notaba en que «activación» estaba en las dos
     listas a la vez. Ahora son dos preguntas y dos desplegables. */

  // 1 · A QUÉ VA HOY. «Fuerza» no se dice «gimnasio» a propósito: quien oye
  //     gimnasio piensa «yo no tengo, ¿dónde lo hago?», y con unas mancuernas
  //     en casa también es fuerza. El Cubo va aparte porque es una clase con
  //     plaza a la que uno se apunta, no un entrenamiento que manda nadie.
  var DEPORTES = [['atletismo','Atletismo'],['natacion','Natación'],['fuerza','Fuerza'],['cubo','El Cubo']];

  // 2 · QUÉ PINTA ESE DÍA EN LA TEMPORADA. Los seis primeros nombres son los
  //     que el club ya escribe en su planificación anual; los tres últimos los
  //     añadimos porque son días que existen y no encajaban en ninguno.
  var PAPELES = [
    ['ajuste','Ajuste'], ['carga','Carga'], ['impacto','Impacto'],
    ['recuperacion','Recuperación'], ['activacion','Activación'], ['tapering','Tapering'],
    ['competicion','Competición'], ['descanso','Descanso'], ['rehabilitador','Rehabilitador']
  ];

  /* EL CONTENIDO NO ES UN CAMPO, Y ES A PROPÓSITO
     Hubo una tercera lista, la del contenido de la sesión, y se decidió no
     montarla: el papel del día es justo lo que NO se deduce leyendo los
     ejercicios, y por eso tiene casilla; el contenido sí se deduce. Quien
     escribe «sentadilla 4×5 al 85 %» ya está diciendo que es fuerza máxima.
     Se dejan aquí escritas por si algún día se quiere etiquetar el contenido
     para el análisis de final de temporada, y para no tener que buscarlas otra vez:

       FUERZA:    fuerza máxima · potencia · pliometría y multisaltos ·
                  hipertrofia · resistencia a la fuerza · movilidad ·
                  core y preventivo
       NATACIÓN:  técnica · velocidad · umbral · aeróbico o fondo ·
                  recuperación · puesta a punto   (PROVISIONAL: sale de la
                  literatura, no del club; está pendiente de repasarla con el
                  responsable de la sección)
       ATLETISMO: sin lista, el club no la ha dado y no se inventa.
       EL CUBO:   sin lista. */

  /* Las dos listas viejas siguen vivas SOLO para el importador de texto y la
     planificación por semanas, que escriben `tipo` y `rol` a la antigua. La
     base los traduce sola a los dos ejes nuevos (migración 102), así que no
     hay que tocarlos. */
  var TIPOS = [['pista','Pista'],['gym','Gimnasio'],['continuo','Rodaje / continuo'],['activacion','Activación'],['competicion','Competición'],['descanso','Descanso']];
  var ROLES = [['calidad_fuerte','Calidad fuerte'],['secundaria','Secundaria'],['activacion','Activación'],['ultimo_toque_48h','Último toque (48h)'],['descarga','Descarga'],['competicion','Competición']];

  // Secciones del club (columna grupos.seccion). Se leen de la base de datos
  // al arrancar; este mapa solo sirve para escribirlas bonitas en pantalla.
  var NOMBRE_SECCION = {
    'competicion':'Competición', 'cubo':'El Cubo', 'escuela':'Escuela',
    'escuela-natacion':'Escuela de natación', 'natacion':'Natación',
    'montana':'Montaña', 'running':'Running', 'triatlon':'Triatlón'
  };
  var SECCIONES_CLUB = [];   // ['competicion','escuela',…] tal cual están en grupos.seccion
  var LUGARES = [];     // instalaciones que ya usa el club, para sugerirlas
  function nombreSeccion(s){
    if(!s) return '';
    if(NOMBRE_SECCION[s]) return NOMBRE_SECCION[s];
    return String(s).charAt(0).toUpperCase()+String(s).slice(1).replace(/-/g,' ');
  }
  function textoSecciones(arr){
    if(!arr || !arr.length) return 'todo el club';
    return arr.map(nombreSeccion).join(', ');
  }
  // '17:30', '9.00', '9h30' → '17:30' / '09:00' · '' si no es una hora
  function horaDeTexto(v){
    var m = String(v==null?'':v).trim().match(/^(\d{1,2})\s*[:.h]\s*(\d{2})/);
    if(!m) return '';
    var h = parseInt(m[1],10), mi = parseInt(m[2],10);
    if(isNaN(h) || isNaN(mi) || h>23 || mi>59) return '';
    return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
  }
  // '17:30:00' (lo que devuelve la base) → '17:30' (lo que quiere <input type="time">)
  function horaCorta(v){ var s = String(v==null?'':v); return s ? s.slice(0,5) : ''; }
  // 'Martes y jueves 17:30-18:45 · Pista municipal' → 'Pista municipal'
  function lugarDeHorario(h){
    var t = String(h==null?'':h);
    if(t.indexOf('·')===-1) return '';
    var trozo = t.split('·').pop().trim();
    return (trozo.length>2 && trozo.length<70) ? trozo : '';
  }

  // ---------- listas cerradas (para que no haya erratas) ----------
  // Calzado: se guarda el texto completo; en sitios estrechos se pinta la abreviatura (Z / C).
  var CALZADO = [
    { valor:'Zapatillas', corto:'Z' },
    { valor:'Clavos', corto:'C' },
    { valor:'Zapatillas de gimnasio', corto:'ZG' },
    { valor:'Descalzo', corto:'D' }
  ];
  // Lo que puede escribir el entrenador (texto pegado o CSV) → valor de la lista
  var SINON_CALZADO = {
    'z':'Zapatillas', 'zapatillas':'Zapatillas', 'zapatilla':'Zapatillas', 'zapas':'Zapatillas',
    'c':'Clavos', 'clavos':'Clavos', 'clavo':'Clavos', 'spikes':'Clavos',
    'zg':'Zapatillas de gimnasio', 'zapatillas de gimnasio':'Zapatillas de gimnasio', 'zapatillas gimnasio':'Zapatillas de gimnasio', 'zapatillas de gym':'Zapatillas de gimnasio',
    'd':'Descalzo', 'descalzo':'Descalzo', 'descalzos':'Descalzo', 'pies descalzos':'Descalzo'
  };
  // Material de natación: se pueden elegir VARIOS a la vez (p. ej. tabla + aletas)
  var MATERIAL = ['Tabla','Pull-buoy','Palas','Aletas','Manoplas','Snorkel frontal','Goma elástica','Sin material'];
  var SINON_MATERIAL = {
    'tabla':'Tabla', 'tablas':'Tabla',
    'pull buoy':'Pull-buoy', 'pullbuoy':'Pull-buoy', 'pull-buoy':'Pull-buoy', 'pull':'Pull-buoy', 'buoy':'Pull-buoy',
    'palas':'Palas', 'pala':'Palas',
    'aletas':'Aletas', 'aleta':'Aletas',
    'manoplas':'Manoplas', 'manopla':'Manoplas',
    'snorkel frontal':'Snorkel frontal', 'snorkel':'Snorkel frontal', 'tubo frontal':'Snorkel frontal',
    'goma elastica':'Goma elástica', 'goma':'Goma elástica', 'gomas':'Goma elástica', 'elastico':'Goma elástica',
    'sin material':'Sin material', 'nada':'Sin material'
  };
  function calzadoCorto(v){
    for(var i=0;i<CALZADO.length;i++) if(CALZADO[i].valor===v) return CALZADO[i].corto;
    return v||'';
  }
  // 'Z', 'clavos', 'ZAPATILLAS'… → valor de la lista, o '' si no es calzado
  function resolverCalzado(txt){
    var n = norm(txt).replace(/[.:]/g,'').trim();
    return SINON_CALZADO[n] || '';
  }
  // 'tabla + aletas', 'Palas, manoplas' → ['Tabla','Aletas'] · [] si no es material
  function resolverMaterial(txt){
    var trozos = String(txt||'').split(/\s*[+,/·;&]\s*|\s+y\s+/i);
    var out = [], vistos = {};
    for(var i=0;i<trozos.length;i++){
      var t = trozos[i].trim(); if(!t) continue;
      var v = SINON_MATERIAL[norm(t).replace(/[.:]/g,'').trim()];
      if(!v) return [];                       // si algo no está en la lista, no es material
      if(!vistos[v]){ vistos[v] = true; out.push(v); }
    }
    return out;
  }
  // '80% RM', '75 %rm' → es carga, no ritmo
  function esCarga(txt){ return /%\s*rm\b/i.test(sinTildes(String(txt||''))); }

  function optsPares(pares, sel, vacio){
    var o = '<option value="">'+(vacio||'—')+'</option>';
    pares.forEach(function(p){ o += '<option value="'+p[0]+'"'+(String(sel)===p[0]?' selected':'')+'>'+esc(p[1])+'</option>'; });
    return o;
  }
  /* Igual, pero SIN la opción vacía de arriba: para los desplegables que
     siempre tienen respuesta (el deporte y el papel del día vienen puestos con
     lo que más se usa, y dejarlos en blanco no significa nada). */
  function optsFijos(pares, sel){
    var o = '';
    pares.forEach(function(p){ o += '<option value="'+p[0]+'"'+(String(sel)===p[0]?' selected':'')+'>'+esc(p[1])+'</option>'; });
    return o;
  }
  function formatFecha(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); var di=['dom','lun','mar','mié','jue','vie','sáb'], me=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return di[d.getDay()]+' '+d.getDate()+' '+me[d.getMonth()]; }
  function diaSemana(iso){ if(!iso) return null; var d=new Date(iso+'T00:00:00'); return ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][d.getDay()]; }

  // ---------- texto y fechas ----------
  function sinTildes(s){ s = (s==null?'':String(s)); try { return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); } catch(e){ return s; } }
  function norm(s){ return sinTildes(s).toLowerCase().replace(/\s+/g,' ').trim(); }
  function isoDe(d){ var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  function addDias(iso, n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
  function lunesDe(iso){ var d=new Date(iso+'T00:00:00'); var w=d.getDay(); d.setDate(d.getDate()+(w===0?-6:1-w)); return isoDe(d); }
  function difDias(isoA, isoB){ return Math.round((new Date(isoA+'T00:00:00') - new Date(isoB+'T00:00:00'))/86400000); }
  var todayISO = isoDe(new Date());

  // ---------- datos base ----------
  var MIS_GRUPOS = [], MIS_ATLETAS = [], EJERCICIOS = [];
  /* MIEMBROS[atleta_id] = { grupo_id: true, … }. En qué grupos entrena cada
     uno de los tuyos. Desde este curso puede estar en varios —la escuela a
     primera hora y fuerza a segunda, o running en La Tribu y El Cubo—, así
     que quién sale en cada lista ya no lo dice la casilla de su ficha. */
  var MIEMBROS = {};
  /* Estas dos consultas son el suelo de la pantalla entera. Si fallan y se
     dan por vacías, TODO miente a la vez: «todavía no tienes ningún grupo»,
     ningún atleta al que pasar lista, ninguna ficha que abrir. Se apunta
     que ha fallado para poder decirlo arriba del todo. */
  var FALLO_BASE = false;
  try { var g = await sb.from('grupos').select('id,nombre,seccion,horario,descripcion,turno').eq('entrenador_id', perfil.id).order('nombre').order('turno', { nullsFirst: true }); if(g.error) FALLO_BASE = true; else MIS_GRUPOS = g.data || []; } catch(e){ FALLO_BASE = true; }
  /* Quien lleva dos turnos del mismo grupo de la escuela —el «Azul 2»
     de lunes y miércoles y el de martes y jueves, que se llaman igual y
     tienen niños distintos— los veía aquí como dos líneas idénticas.
     Elegir mal al pasar lista pone faltas a quien sí vino. Se les añade
     los días al nombre nada más leerlos, y así salen distinguidos en
     todas las pantallas de esta página a la vez. */
  MIS_GRUPOS.forEach(function (gr) {
    if (gr.turno && window.APOLANA_GRUPO_NOMBRE) gr.nombre = window.APOLANA_GRUPO_NOMBRE(gr);
  });
  /* ------------------------------------------------------------
     QUIÉNES SON «MIS ATLETAS»
     Dos cosas distintas, y hacen falta las dos:
       · los que están A MI NOMBRE en su ficha — de esos lo llevo
         todo: observaciones, lesiones, el contacto de la familia;
       · los que ENTRENAN EN MIS GRUPOS aunque en su ficha figure
         otro entrenador — de esos llevo la lista y poco más.
     Antes solo se pedían los primeros, y el resultado era que el
     crío de La Tribu que además viene a El Cubo no le salía en la
     lista al entrenador de El Cubo. La pantalla llegaba a decirle
     que el club no se lo había asignado, cuando lo que pasaba es
     que no se le había preguntado a la base por él.
     ------------------------------------------------------------ */
  /* `permiso_imagen` y sus ámbitos entran aquí desde la 135. No es un dato
     de papeleo: es lo único que le dice al entrenador, antes de sacar el
     móvil, de qué críos no se publican fotos. Si no se pide en esta línea,
     no se puede enseñar en ninguna pantalla. */
  var CAMPOS_ATLETA = 'id,nombre,apellidos,categoria,estado,grupo_id,entrenador_id,fecha_nacimiento,dias_entreno,fecha_prueba_fin,especialidades,pruebas_principales,licencia,perfil_padre_id,permiso_imagen,permiso_imagen_ambitos';
  try { var a = await sb.from('atletas').select(CAMPOS_ATLETA).eq('entrenador_id', perfil.id).order('apellidos'); if(a.error) FALLO_BASE = true; else MIS_ATLETAS = a.data || []; } catch(e){ FALLO_BASE = true; }
  /* Y ahora los de mis grupos. Se piden aparte y con su propio `try`: si
     esta se cae, la pantalla sigue enseñando a los de siempre en vez de
     quedarse en blanco. Los repetidos se descartan por su id. */
  try {
    var idsG = MIS_GRUPOS.map(function(gr){ return gr.id; });
    if(idsG.length){
      var pert = await sb.from('atleta_grupos').select('atleta_id').in('grupo_id', idsG);
      if(pert.error) FALLO_BASE = true;
      else {
        var ya = {}; MIS_ATLETAS.forEach(function(x){ ya[x.id] = true; });
        var faltan = [];
        (pert.data || []).forEach(function(m){ if(!ya[m.atleta_id]){ ya[m.atleta_id] = true; faltan.push(m.atleta_id); } });
        if(faltan.length){
          var a2 = await sb.from('atletas').select(CAMPOS_ATLETA).in('id', faltan).order('apellidos');
          if(a2.error) FALLO_BASE = true;
          else if(a2.data) MIS_ATLETAS = MIS_ATLETAS.concat(a2.data);
        }
      }
    }
  } catch(e){ FALLO_BASE = true; }
  /* En qué grupos entrena cada uno. Va aparte y sin hacer ruido si falla: si
     esta consulta se cae, las listas siguen saliendo por la casilla de la
     ficha, que es lo que se hacía hasta ahora. */
  try {
    var ids0 = MIS_ATLETAS.map(function(x){ return x.id; });
    if(ids0.length){
      var mg = await sb.from('atleta_grupos').select('atleta_id,grupo_id').in('atleta_id', ids0);
      if(!mg.error && mg.data) mg.data.forEach(function(m){ (MIEMBROS[m.atleta_id] = MIEMBROS[m.atleta_id] || {})[m.grupo_id] = true; });
    }
  } catch(e){}
  try { var e = await sb.from('ejercicios').select('nombre,nombre_corto,categoria,tipo').eq('activo', true).order('categoria').order('nombre'); if(!e.error && e.data) EJERCICIOS = e.data; } catch(e){}

  // Secciones del club y sitios donde se entrena. Los grupos son de lectura
  // pública, así que aquí salen TODAS las secciones (no solo las tuyas): son
  // las que se pueden marcar al abrir un entreno a otra gente del club.
  var vistaS = {}, vistaL = {};
  try {
    var gt = await sb.from('grupos').select('seccion,horario');
    if(!gt.error && gt.data){
      gt.data.forEach(function(g){
        if(g.seccion && !vistaS[g.seccion]){ vistaS[g.seccion] = true; SECCIONES_CLUB.push(g.seccion); }
        var l = lugarDeHorario(g.horario);
        if(l && !vistaL[norm(l)]){ vistaL[norm(l)] = true; LUGARES.push(l); }
      });
      SECCIONES_CLUB.sort();
    }
    var sl = await sb.from('sesiones').select('lugar').not('lugar','is',null).limit(400);
    if(!sl.error && sl.data) sl.data.forEach(function(s){
      var l = (s.lugar||'').trim();
      if(l && !vistaL[norm(l)]){ vistaL[norm(l)] = true; LUGARES.push(l); }
    });
    LUGARES.sort();
    var dl = document.getElementById('lugares-dl');
    if(dl) dl.innerHTML = LUGARES.map(function(l){ return '<option value="'+escAttr(l)+'"></option>'; }).join('');
  } catch(e){}

  /* La Tribu, Madre Tierra y El Cubo tienen nombre propio; el resto son
     categorías («Natación adultos») y se quedan en navy (carácter 31c). */
  var NOMBRES_PROPIOS = ['El Cubo', 'La Tribu', 'Madre Tierra', 'Kilómetro Cero',
                         'Vertical Apolana', 'Familia Apolana', 'Liga Apolana'];
  function marcarNombres(html){
    NOMBRES_PROPIOS.forEach(function(n){ html = html.split(n).join('<span class="nombre-club">'+n+'</span>'); });
    return html;
  }
  function nombreGrupo(id){ for(var i=0;i<MIS_GRUPOS.length;i++) if(MIS_GRUPOS[i].id===id) return MIS_GRUPOS[i].nombre; return ''; }
  function nombreAtleta(x){ return ((x.nombre||'')+' '+(x.apellidos||'')).trim(); }
  /* Si las pertenencias no se han podido leer se cae a la casilla de la
     ficha: enseñar el grupo a medias es mejor que enseñarlo vacío. */
  function estaEn(x, grupoId){ var m = MIEMBROS[x.id]; return m ? !!m[grupoId] : x.grupo_id===grupoId; }
  function gruposDe(x){
    var m = MIEMBROS[x.id];
    if(!m) return x.grupo_id ? [x.grupo_id] : [];
    return Object.keys(m).sort(function(a,b){ return a===x.grupo_id ? -1 : b===x.grupo_id ? 1 : 0; });
  }
  function atletasDeGrupo(grupoId){ return MIS_ATLETAS.filter(function(x){ return estaEn(x, grupoId); }); }
  /* Un entrenamiento dirigido a alguien decía siempre CUÁNTOS («solo 2
     atletas») y nunca QUIÉNES. Un número no se puede comprobar de un
     vistazo: o se ven los nombres, o no te fías y dejas de usarlo. */
  function nombresDeIds(ids, tope){
    if(!ids || !ids.length) return '';
    var max = tope || 3, dichos = [], resto = 0;
    ids.forEach(function(id){
      var a = null;
      for(var i=0;i<MIS_ATLETAS.length;i++) if(MIS_ATLETAS[i].id===id){ a = MIS_ATLETAS[i]; break; }
      var n = a ? (a.nombre_corto || nombreAtleta(a)) : '';
      if(!n){ resto++; return; }
      if(dichos.length < max) dichos.push(n); else resto++;
    });
    if(!dichos.length) return ids.length+' atleta'+(ids.length===1?'':'s');
    var txt = dichos.length===1 ? dichos[0] : dichos.slice(0,-1).join(', ')+' y '+dichos[dichos.length-1];
    return resto ? txt+' y '+resto+' más' : txt;
  }
  function grupoPorId(id){ for(var i=0;i<MIS_GRUPOS.length;i++) if(MIS_GRUPOS[i].id===id) return MIS_GRUPOS[i]; return null; }
  function seccionDeGrupo(id){ var g = grupoPorId(id); return g ? (g.seccion||'') : ''; }

  /* ------------------------------------------------------------
     LA PLANTILLA QUE SE LE MANDA A CHATGPT, POR DEPORTE
     ------------------------------------------------------------
     Un archivo de texto que el entrenador se descarga, se lo manda a ChatGPT y
     le dice «a partir de ahora crea mis entrenamientos con esta plantilla».
     Sigue haciendo lo mismo que hacía; lo que cambia es que ahora salen todos
     iguales y con los códigos del club dentro.

     Cada deporte tiene la suya porque una semana de natación y una de atletismo
     no se parecen en nada: la de natación habla de calles, estilos y material de
     piscina; la de atletismo hablará de calzado, tacos y ritmos.

     Para añadir un deporte, una línea aquí y ya sale el botón. Nada más.
     ------------------------------------------------------------ */
  var PLANTILLA_IA = {
    'natacion':         { archivo: 'plantilla-semana-natacion.xlsx',  que: 'natación' },
    'escuela-natacion': { archivo: 'plantilla-semana-natacion.xlsx',  que: 'natación' },
    'competicion':      { archivo: 'plantilla-semana-atletismo.xlsx', que: 'atletismo' },
    'escuela':          { archivo: 'plantilla-semana-atletismo.xlsx', que: 'atletismo' }
  };
  function plantillaIA(grupoId){ return PLANTILLA_IA[seccionDeGrupo(grupoId)] || null; }
  // Sitio habitual del grupo, sacado de su horario ('… · Pista municipal')
  function lugarDeGrupo(id){ var g = grupoPorId(id); return g ? lugarDeHorario(g.horario) : ''; }
  // ¿El grupo entrena en el agua? Se mira la sección del grupo (natacion,
  // escuela-natacion, triatlon) y, si no, su nombre. Solo sirve para DEJAR
  // MARCADA por defecto la casilla de material: el entrenador siempre puede
  // marcarla o desmarcarla a mano, porque no hay un tipo «natación» en la base.
  function grupoEsDeAgua(grupoId){
    for(var i=0;i<MIS_GRUPOS.length;i++){
      if(MIS_GRUPOS[i].id===grupoId){
        var t = norm((MIS_GRUPOS[i].seccion||'')+' '+(MIS_GRUPOS[i].nombre||''));
        return /nataci|triatl|acuat|piscina|agua/.test(t);
      }
    }
    return false;
  }

  // ---------- mejores marcas de mis atletas ----------
  // MARCAS = { atleta_id: { 'nombre de prueba': {valor, disp, fecha} } }  ← ya filtrado a la MEJOR de cada prueba
  var MARCAS = {}, MAS_MEJOR = {};
  function numMarca(s){
    if(s==null) return null;
    s = String(s).trim().replace(',', '.');
    if(s.indexOf(':')>-1){ var p=s.split(':'); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); }
    var n = parseFloat(s); return isNaN(n) ? null : n;
  }
  function valorMarca(m){ var v = (m.tiempo_segundos!=null) ? Number(m.tiempo_segundos) : numMarca(m.tiempo_display); return (v==null||isNaN(v)) ? null : v; }
  // En saltos y lanzamientos MÁS es mejor; en carreras, menos.
  function masEsMejor(prueba){
    if(MAS_MEJOR[prueba]!==undefined) return MAS_MEJOR[prueba];
    return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(prueba||'');
  }
  function mejoresMarcasDe(atletaId, tope){
    var pa = MARCAS[atletaId]; if(!pa) return [];
    return Object.keys(pa).map(function(p){ return { prueba:p, disp:pa[p].disp, fecha:pa[p].fecha }; })
      .sort(function(a,b){ return (a.fecha||'') > (b.fecha||'') ? -1 : 1; })
      .slice(0, tope||4);
  }

  /* El catálogo entero, no solo si más es mejor: para APUNTAR una marca hace
     falta saber además en qué se mide cada prueba —metros en salto y
     lanzamiento, tiempo en carrera, puntos en las combinadas— y de qué
     disciplina es, para ordenar el desplegable como lo tiene el atleta. */
  var PRUEBAS = [], PRUEBA_POR_NOMBRE = {};
  try {
    var pc = await sb.from('pruebas').select('nombre,disciplina,ambito,unidad,mas_es_mejor').eq('activa', true).order('orden');
    if(!pc.error && pc.data){
      PRUEBAS = pc.data;
      pc.data.forEach(function(p){ MAS_MEJOR[p.nombre] = !!p.mas_es_mejor; PRUEBA_POR_NOMBRE[p.nombre] = p; });
    }
  } catch(e){}
  if(MIS_ATLETAS.length){
    try {
      var mr = await sb.from('marcas_atleta').select('atleta_id,prueba,tiempo_segundos,tiempo_display,fecha').in('atleta_id', MIS_ATLETAS.map(function(x){ return x.id; })).limit(2000);
      if(!mr.error && mr.data) mr.data.forEach(function(m){
        var v = valorMarca(m);
        if(v==null || !m.prueba || !m.atleta_id) return;
        var pa = MARCAS[m.atleta_id] = MARCAS[m.atleta_id] || {};
        var ya = pa[m.prueba];
        var mejor = !ya || (masEsMejor(m.prueba) ? v > ya.valor : v < ya.valor);
        if(mejor) pa[m.prueba] = { valor: v, disp: (m.tiempo_display || String(v)), fecha: m.fecha || '' };
      });
    } catch(e){}
  }

  var icPlan    = svg('<rect x="3.5" y="4" width="17" height="17" rx="2"/><path d="M3.5 9h17M8 2.5v3M16 2.5v3M8 14l2.2 2.2L15 12"/>');

  var icCarga   = svg('<path d="M12 20s-6.5-4-9-8.2C1.2 8.5 3 5.5 6 5.5c1.8 0 3 1 4 2.3 1-1.3 2.2-2.3 4-2.3 3 0 4.8 3 3 6.3C18.5 16 12 20 12 20z"/>');
  var icHome    = svg('<path d="M3.7 10.6 12 4l8.3 6.6V19a1.6 1.6 0 0 1-1.6 1.6H5.3A1.6 1.6 0 0 1 3.7 19z"/><path d="M9.4 20.6v-6.2h5.2v6.2"/>');
  // Iconos de línea para los estados vacíos y los avisos del día
  var icVacGrupo = svg('<circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/>');
  var icVacChat  = svg('<path d="M20 14.5a2 2 0 0 1-2 2H9l-4 3.5V6a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2z"/>');
  var icVacNota  = svg('<path d="M6.5 3.5h8l4 4v13h-12z"/><path d="M14.5 3.5v4h4M9.5 13h5M9.5 16.5h3"/>');
  var icVacCal   = svg('<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M9.5 14.5h5"/>');

        '<a href="../mensajes/">'+icMsg+'<span>Mensajes</span><em>&rsaquo;</em></a>'+

        /* Estas tres las da el vestíbulo del portal a un entrenador, pero

        '<a href="../documentos/">'+svg('<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h4"/>')+'<span>Documentos</span><em>&rsaquo;</em></a>'+
        '<a href="../avisos/">'+svg('<path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>')+'<span>Avisos al móvil</span><em>&rsaquo;</em></a>'+
        '<a href="../perfil/">'+svg('<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>')+'<span>Mi perfil</span><em>&rsaquo;</em></a>'+
      '</div>'+
    '</div>';

  wrap.innerHTML = cab +
    '<div class="layout">'+
      '<aside class="side"><nav>'+

        '<a data-sec="lista">Pasar lista</a>'+

        '<span class="side-sep">Planificar</span>'+
        '<a data-sec="semana">Planificar semana</a>'+
        '<a data-sec="planificar">Planificar un entrenamiento</a>'+

  /* Si los datos base no han llegado, se dice antes que nada: lo que venga
     debajo está incompleto y no hay que fiarse de ningún «no hay nada». */
  if(FALLO_BASE){
    var cajaFallo = document.createElement('div');
    cajaFallo.className = 'tarjeta';
    cajaFallo.innerHTML = APOLANA_UI.error('No hemos podido cargar tus grupos y tus atletas',
      'Puede ser tu conexión. Lo de abajo está incompleto: puede parecer que no tienes grupo o que no hay nadie a quien pasar lista, y no es verdad. Vuelve a intentarlo antes de tocar nada.');

  var SECCIONES = ['grupo','lista','calendario','semana','planificar','feedback','notas'];
  // Barra lateral (escritorio) + barra inferior y panel Más (móvil) comparten lógica.
  var navLinks = wrap.querySelectorAll('.side nav a[data-sec], .tabbar a[data-sec], #masheet a[data-sec]');
  function irASeccion(sec){
    /* La sección se escribe en la dirección para que recargar te devuelva
       DONDE ESTABAS y no al inicio. Mismo motivo y misma decisión que en la
       zona del atleta: `replaceState`, no `pushState` — atrás sigue sacándote
       del portal en vez de recorrer los apartados que hayas tocado. */
    try { history.replaceState(null, '', '#'+sec); } catch(e){ /* la pantalla va igual */ }
    wrap.querySelectorAll('.side nav a, .tabbar a').forEach(function(x){ x.classList.toggle('activo', x.getAttribute('data-sec')===sec); });
    SECCIONES.forEach(function(s){ $('sec-'+s).hidden = (s!==sec); });
    // Al entrar en Feedback se da por leído lo nuevo: el aviso del inicio desaparece.
    if(sec==='feedback') marcarFeedbackVisto();

       entra, no al arrancar la página: son dos consultas más y la mayoría de
       las visitas no pasan por aquí. */
    if(sec==='calendario' && typeof entrarCalendario==='function') entrarCalendario();
    if(sec==='semana' && typeof entrarSemana==='function') entrarSemana();
  }

  // ============================================================
  // LO DE LAS FOTOS · un solo sitio del que salen todas las pantallas
  // ------------------------------------------------------------
  // Al apuntar a un hijo, la familia contesta si podemos publicar sus
  // fotos. Hasta la 135 esa respuesta se quedaba en el alta, que solo
  // leen administración y tesorería, y quien está en la pista con el
  // móvil es el entrenador. Aquí se traduce el dato a lo único que le
  // hace falta saber: si de este crío se pueden publicar fotos o no.
  //
  // TRES RESPUESTAS Y UNA MÁS QUE NO ES RESPUESTA:
  //   · sí       — la familia lo autorizó. No se marca nada: si se
  //                marcara, la lista se llenaría de etiquetas y la que
  //                importa dejaría de verse.
  //   · no       — la familia dijo que no. Se marca.
  //   · a medias — dijo que sí para unos canales y no para otros. Se
  //                marca diciendo cuáles, porque publicarlo en el sitio
  //                equivocado es igual de malo que publicarlo sin más.
  //   · no consta — nadie se lo preguntó, o no contestó. NO ES UN SÍ.
  //                Se marca aparte, con esas palabras.
  //
  // Y una cosa que no es de programación: esto NO se pinta de rojo. Que
  // una familia no quiera que su hijo salga en Instagram no es una
  // incidencia ni una falta; es una decisión suya, tan normal como
  // elegir turno. Pintarlo de alarma dejaría al crío señalado en la
  // lista delante de cualquiera que mire la pantalla, que es justo lo
  // contrario de lo que se pretende.
  // ============================================================
  var icSinFoto = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 17.5V9a1.5 1.5 0 0 0-1.5-1.5H16l-1-2H9.8"/><path d="M6.7 7.5H5.5A1.5 1.5 0 0 0 4 9v9a1.5 1.5 0 0 0 1.5 1.5h12"/><path d="M14.1 14.3a3 3 0 0 1-4.2-4.2"/><path d="M3 3l18 18"/></svg>';

  // Cómo se llaman los canales del impreso del club cuando hay que
  // decirlos en voz alta, sin la palabra suelta de la base de datos.
  //
  // «medios» NO es solo la prensa: desde agosto de 2026 esa misma
  // respuesta cubre también los carteles, los folletos y la memoria de
  // la temporada que imprime el club. Es el apartado d) del impreso de
  // papel entero. Se dice con las palabras del papel, sin comas dentro:
  // esta frase se cose con otras usando « y », y una coma aquí partiría
  // la lista donde no toca.
  var CANALES_FOTO  = { web:'la web', redes:'redes sociales', mensajeria:'el grupo de la familia', medios:'medios de comunicación y material del club' };
  // Y los mismos, en corto, para que quepan en la etiqueta de una fila a
  // 375 px sin sacar la lista por el borde derecho. Aquí no cabe la
  // frase larga, así que se nombran las dos cosas que un entrenador
  // reconoce de un vistazo —el periódico y el cartel—; la frase entera
  // la tiene a un dedo, en el título de la etiqueta y en la ficha.
  var CANALES_CORTO = { web:'web', redes:'redes', mensajeria:'grupo', medios:'prensa y carteles' };
  // Los canales que un entrenador usa a diario. Si falta alguno de estos
  // dos, se avisa; lo de prensa y carteles no lo hace él.
  var CANALES_DEL_DIA = ['redes', 'mensajeria'];

  function fotosDe(at){
    if(!at || at.permiso_imagen === undefined) return { nivel:'si' };
    if(at.permiso_imagen === null) {
      return { nivel:'nose', etiq:'no consta',
               dice:'no consta que se le preguntara' };
    }
    if(at.permiso_imagen === false) {
      return { nivel:'no', etiq:'sin fotos', dice:'su familia dijo que no' };
    }
    var amb = at.permiso_imagen_ambitos;
    // Sin lista de canales, el sí vale para todo: así se guardaron los
    // permisos antes de que el impreso separara los canales.
    if(!Array.isArray(amb) || !amb.length) return { nivel:'si' };
    var faltan = CANALES_DEL_DIA.filter(function(c){ return amb.indexOf(c) === -1; });
    if(!faltan.length) return { nivel:'si' };
    var corto = amb.map(function(c){ return CANALES_CORTO[c] || c; }).join('+');
    var largo = amb.map(function(c){ return CANALES_FOTO[c]  || c; }).join(' y ');
    return { nivel:'parcial', etiq:'solo '+(corto||'nada'),
             dice:'su familia autorizó solo '+(largo||'ningún canal') };
  }

  // La etiqueta de una fila. Devuelve cadena vacía cuando no hay nada que
  // decir, para poder pegarla sin preguntar.
  function etiqFoto(at, incluirSinDato){
    var f = fotosDe(at);
    if(f.nivel === 'si') return '';
    if(f.nivel === 'nose' && incluirSinDato === false) return '';
    return '<span class="et-foto'+(f.nivel==='nose'?' nose':'')+'" title="'+escAttr('Fotos: '+f.dice)+'">'+icSinFoto+esc(f.etiq)+'</span>';
  }

  // Reparte un grupo de atletas por lo que se puede hacer con sus fotos.
  function repartoFotos(atls){
    var r = { no:[], parcial:[], nose:[], total:atls.length };
    atls.forEach(function(x){
      var n = fotosDe(x).nivel;
      if(n !== 'si') r[n].push(x);
    });
    // Cuando de NADIE del grupo consta el permiso —que es lo que pasa hoy
    // con casi todos, porque entraron antes de que se preguntara—, marcar
    // las veinticinco filas no informa de nada: se vuelve papel pintado y
    // se deja de mirar. En ese caso se dice una vez arriba y las filas se
    // quedan limpias.
    r.ninguno = atls.length > 0 && r.nose.length === atls.length;
    r.hayAlgo = !!(r.no.length || r.parcial.length || r.nose.length);
    return r;
  }

  // La frase de la ficha, dicha entera: aquí sí hay sitio y aquí se viene
  // cuando ya ha surgido la duda sobre un crío en concreto.
  function fotoFicha(at){
    var f = fotosDe(at);
    if(f.nivel === 'no')      return 'No se publican: su familia dijo que no';
    if(f.nivel === 'nose')    return 'No consta que se le preguntara, así que no se publican';
    if(f.nivel === 'parcial') return 'Solo '+f.dice.replace('su familia autorizó solo ', '');
    return 'Su familia autorizó publicarlas';
  }

  function nombresCortos(lista, tope){
    var n = lista.slice(0, tope).map(nombreAtleta);
    var resto = lista.length - n.length;
    return n.join(', ') + (resto > 0 ? ' y '+resto+' más' : '');
  }

  // El aviso de arriba, el que de verdad sirve: a la hora de publicar no
  // se repasan veinticinco filas, se necesitan los nombres juntos.
  function avisoFotosHTML(atls){
    var r = repartoFotos(atls);
    if(!r.hayAlgo) return '';
    if(r.ninguno){
      return '<div class="avi-foto"><strong>De este grupo no consta el permiso de fotos de nadie</strong>'+
        '<p>Todavía no se les ha preguntado. Hasta que conste, no se publica ninguna foto suya: '+
        'ni en la web, ni en redes, ni en el grupo de las familias. Lo pide administración a las familias.</p></div>';
    }
    var lineas = [];
    r.no.forEach(function(x){ lineas.push('<li><b>'+esc(nombreAtleta(x))+'</b> — su familia dijo que no</li>'); });
    r.parcial.forEach(function(x){ lineas.push('<li><b>'+esc(nombreAtleta(x))+'</b> — '+esc(fotosDe(x).dice)+'</li>'); });
    r.nose.forEach(function(x){ lineas.push('<li><b>'+esc(nombreAtleta(x))+'</b> — no consta, así que no</li>'); });
    var cuantos = r.no.length + r.parcial.length + r.nose.length;
    return '<div class="avi-foto"><strong>'+cuantos+(cuantos===1?' atleta no sale':' atletas no salen')+' en las fotos que se publican</strong>'+
      '<ul>'+lineas.join('')+'</ul>'+
      '<p>Entrenan y compiten igual que los demás: esto solo es lo que su familia decidió sobre publicar sus fotos, '+
      'y no tiene ninguna otra consecuencia. Si haces una foto del grupo para subirla, que no salgan.</p></div>';
  }

  // ============================================================
  // SECCIÓN 1 · MI GRUPO
  // ============================================================
  function renderMiGrupo(){
    var cont = $('grupo-cont');
    if(!MIS_GRUPOS.length){
      cont.innerHTML = '<div class="tarjeta"><h2>Mi grupo</h2>'+
        vacioHTML(icVacGrupo, 'Aún no tienes grupos a tu cargo. Cuando el club te asigne uno, aparecerá aquí con sus atletas.')+'</div>';
      return;
    }
    var html = '';
    MIS_GRUPOS.forEach(function(gr){
      var atls = MIS_ATLETAS.filter(function(x){ return estaEn(x, gr.id); });
      var sub = [gr.seccion, gr.horario].filter(Boolean).map(function(s){ return esc(s); }).join(' · ');
      /* Si de nadie del grupo consta el permiso, las filas se quedan sin
         etiqueta y lo dice el aviso de arriba una sola vez. Marcarlas
         todas sería tapar la lista con algo que no distingue a nadie. */
      var repFotos = repartoFotos(atls);
      var tabla;
      if(atls.length){
        /* Con pocos atletas el buscador estorba; a partir de una docena, la
           lista ya no se recorre de un vistazo y hace falta. */
        var buscador = atls.length >= 12
          ? '<div class="busca-at">'+
              '<input type="search" data-buscar="'+escAttr(gr.id)+'" autocomplete="off" '+
                     'placeholder="Buscar por nombre o apellidos…" '+
                     'aria-label="Buscar un atleta de '+escAttr(gr.nombre||'este grupo')+'">'+
              '<span class="cuenta" data-cuenta aria-live="polite">'+atls.length+' atletas</span>'+
            '</div>'+
            '<p class="sin-busca" data-sinbusca hidden>Ningún atleta de este grupo se llama así. Prueba con el apellido solo, o borra la búsqueda.</p>'
          : '';
        tabla = avisoFotosHTML(atls) + buscador +
          '<div class="atletas-lista">'+
          atls.map(function(x){
            var est = x.estado||''; var cls = (est==='activo'?'activo':est==='lesionado'?'lesionado':est==='prueba'?'prueba':'');
            var nom = ((x.nombre||'')+' '+(x.apellidos||'')).trim();
            var ini = ((x.nombre||'?').charAt(0)+(x.apellidos?x.apellidos.charAt(0):'')).toUpperCase();
            var mrc = mejoresMarcasDe(x.id, 4);
            var celdaMarcas = mrc.length
              ? '<div class="mrc">'+mrc.map(function(m){
                  return '<span title="'+escAttr(m.prueba+(m.fecha?' · '+formatFecha(m.fecha):''))+'">'+esc(m.prueba)+' '+esc(m.disp)+'</span>';
                }).join('')+'</div>'
              : '<span class="mrc-no">Sin marcas registradas</span>';
            return '<div class="atleta-row fila-atleta" data-atleta="'+x.id+'" data-nombre="'+escAttr(norm(nom))+'" tabindex="0" role="button">'+
              '<div class="ar-av">'+esc(ini)+'</div>'+
              '<div class="ar-main">'+
                '<div class="ar-nom">'+esc(nom)+' <span class="pill '+cls+'">'+esc(est||'—')+'</span> '+etiqFoto(x, !repFotos.ninguno)+'</div>'+
                (x.categoria?'<div class="ar-cat">'+esc(x.categoria)+'</div>':'')+
                celdaMarcas+
              '</div>'+
              '<span class="ar-chev" aria-hidden="true">&rsaquo;</span>'+
            '</div>';
          }).join('')+'</div>'+
          '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
            '<p class="pista">Pulsa un atleta para abrir su <strong>ficha</strong>. Se muestra la <strong>mejor marca de cada prueba atlética</strong> (las cuatro más recientes), con las que se calculan los tiempos objetivo cuando pones el ritmo en porcentaje.</p>'+
          '</details>';
      } else {
        tabla = vacioHTML(icVacGrupo, 'Sin atletas en este grupo todavía.');
      }
      html += '<div class="tarjeta"><h2>'+marcarNombres(esc(gr.nombre))+'</h2>'+(sub?'<p class="vacio" style="margin-top:-6px;margin-bottom:12px;">'+sub+'</p>':'')+tabla+'</div>';
    });
    cont.innerHTML = html;
    cont.querySelectorAll('.fila-atleta').forEach(function(tr){
      tr.addEventListener('click', function(){ abrirFicha(tr.getAttribute('data-atleta')); });
      tr.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); abrirFicha(tr.getAttribute('data-atleta')); } });
    });
    /* La búsqueda esconde y enseña filas ya pintadas, no vuelve a pintar la
       tarjeta: si se repintara, el campo perdería el foco a cada letra. */
    cont.querySelectorAll('[data-buscar]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var caja = inp.closest('.tarjeta');
        if(!caja) return;
        var texto = norm(inp.value);
        var filas = caja.querySelectorAll('.fila-atleta');
        var vistos = 0;
        filas.forEach(function(f){
          var cabe = !texto || (f.getAttribute('data-nombre')||'').indexOf(texto) !== -1;
          f.hidden = !cabe;
          if(cabe) vistos++;
        });
        var cuenta = caja.querySelector('[data-cuenta]');
        if(cuenta) cuenta.textContent = texto ? (vistos+' de '+filas.length)
                                              : (filas.length+(filas.length===1?' atleta':' atletas'));
        var sin = caja.querySelector('[data-sinbusca]');
        if(sin) sin.hidden = !(texto && !vistos);
      });
    });
  }
  renderMiGrupo();

  // Estado vacío estándar: icono de línea, frase corta y (si procede) una acción.
  function vacioHTML(icono, texto, accion){
    return '<div class="vac">'+icono+'<p>'+esc(texto)+'</p>'+(accion||'')+'</div>';
  }

  // ============================================================
  // SECCIÓN 1 · EL DÍA DEL ENTRENADOR (lo primero que se ve)
  // ------------------------------------------------------------
  // Arriba, la sesión de hoy de sus grupos con los dos botones que
  // se usan a diario (pasar lista y ver el entreno). Debajo, solo
  // si los hay, los avisos del día: faltas que ha avisado la
  // familia, pruebas que se acaban y feedback nuevo sin mirar.
  // No se toca ninguna tabla nueva: son las mismas consultas que ya
  // usa el resto de la página (sesiones, ausencias, atletas,
  // registros_sesion).
  // ============================================================
  var HOY = { sesiones: [], siguiente: null, semana: [], apuntados: {}, cargando: true };
  var AVISOS = { ausencias: [], prueba: [], feedbackNuevos: 0, cargando: true };

  // «Feedback sin leer» = registros de los atletas posteriores a la última vez
  // que el entrenador abrió la sección Feedback (se guarda en este navegador).
  var FB_VISTO_CLAVE = 'apolana_fb_visto_' + (perfil.id || '');
  function feedbackVistoDesde(){
    try { return localStorage.getItem(FB_VISTO_CLAVE) || ''; } catch(e){ return ''; }
  }
  function marcarFeedbackVisto(){
    try { localStorage.setItem(FB_VISTO_CLAVE, new Date().toISOString()); } catch(e){}
    if(AVISOS){ AVISOS.feedbackNuevos = 0; pintarAvisos(); }
  }

  function tipoNombre(t){ for(var i=0;i<TIPOS.length;i++) if(TIPOS[i][0]===t) return TIPOS[i][1]; return ''; }

  function enPares(pares, v){ for(var i=0;i<pares.length;i++) if(pares[i][0]===v) return pares[i][1]; return ''; }
  function nombreDeporte(d){ return enPares(DEPORTES, d); }
  function nombrePapel(p){ return enPares(PAPELES, p); }
  /* «Fuerza y atletismo», no «fuerza» a secas: si solo pone fuerza, el atleta
     se presenta sin las zapatillas de clavos. Los dos deportes se dicen los dos. */
  function textoDeportes(s){
    if(!s) return '';
    var a = nombreDeporte(s.deporte), b = nombreDeporte(s.deporte_2);
    if(a && b) return a+' y '+b.toLowerCase();
    return a || b || tipoNombre(s.tipo);
  }

  async function cargarHoy(){
    HOY.sesiones = []; HOY.siguiente = null; HOY.semana = []; HOY.apuntados = {};
    if(!MIS_GRUPOS.length) return;
    var ids = MIS_GRUPOS.map(function(g){ return g.id; });
    /* La semana entera, para la tira del inicio. Es UNA consulta más y evita
       que el entrenador tenga que entrar en el planificador solo para ver qué
       hay mañana. */
    try {
      var lun = lunesDeFecha(todayISO);
      var rs = await sb.from('sesiones').select('id,fecha,titulo,deporte,tipo,papel_dia,grupo_id')
        .in('grupo_id', ids).gte('fecha', lun).lte('fecha', addDias(lun,6))
        .order('fecha', { ascending:true }).limit(60);
      if(!rs.error && rs.data){
        HOY.semana = rs.data;
        /* Y cuántos han apuntado ya en cada una: a un entrenador no le sirve
           saber que el martes hay «Carrera A», le sirve saber si alguien la ha
           apuntado. Ese es el dato que le hace entrar o no. */
        var sids = HOY.semana.map(function(x){ return x.id; });
        if(sids.length){
          var rr = await sb.from('registros_sesion').select('sesion_id').in('sesion_id', sids);
          if(!rr.error && rr.data) rr.data.forEach(function(x){
            HOY.apuntados[x.sesion_id] = (HOY.apuntados[x.sesion_id]||0)+1;
          });
        }
      }
    } catch(e){ /* sin la semana, el inicio sigue enseñando lo de hoy */ }
    var r = await sb.from('sesiones')
      .select('id,fecha,hora,titulo,tipo,deporte,deporte_2,papel_dia,lugar,grupo_id,publicada,atletas_ids,abierta_inscripcion')
      .in('grupo_id', ids).eq('fecha', todayISO)
      .order('hora', { ascending:true }).limit(8);
    if(!r.error && r.data) HOY.sesiones = r.data;
    if(HOY.sesiones.length) return;
    var r2 = await sb.from('sesiones').select('id,fecha,titulo,grupo_id')
      .in('grupo_id', ids).gt('fecha', todayISO)
      .order('fecha', { ascending:true }).limit(1);
    if(!r2.error && r2.data && r2.data.length) HOY.siguiente = r2.data[0];
  }

  async function cargarAvisos(){
    AVISOS.ausencias = []; AVISOS.prueba = []; AVISOS.feedbackNuevos = 0;
    // Pruebas que se acaban (o ya vencidas): sale de los atletas ya cargados.
    AVISOS.prueba = MIS_ATLETAS.filter(function(x){
      if(x.estado!=='prueba' || !x.fecha_prueba_fin) return false;
      var d = difDias(x.fecha_prueba_fin, todayISO);
      return d <= 7 && d >= -30;   // los que acaban esta semana y los que ya vencieron hace poco
    });
    if(!MIS_ATLETAS.length) return;
    var ids = MIS_ATLETAS.map(function(x){ return x.id; });
    /* Faltas avisadas hoy por las familias, por lo mismo que en Pasar lista:
       preguntadas por grupo y no a la tabla, que está cerrada. Quien entrena
       en dos de mis grupos vendría dos veces —una por lista—, y en la portada
       eso serían dos avisos de la misma falta: se deja uno por persona. */
    try {
      var au = await sb.rpc('apo_faltas_avisadas', {
        p_grupos: MIS_GRUPOS.map(function(gr){ return gr.id; }), p_fecha: todayISO });
      if(!au.error && au.data){
        var vistos = {};
        AVISOS.ausencias = au.data.filter(function(r){
          if(vistos[r.atleta_id]) return false;
          vistos[r.atleta_id] = true; return true;
        });
      }
    } catch(e){}
    // Feedback nuevo desde la última visita (o de los últimos 3 días la primera vez).
    try {
      var desde = feedbackVistoDesde() || (addDias(todayISO,-3)+'T00:00:00');
      var rg = await sb.from('registros_sesion').select('id,created_at')
        .in('atleta_id', ids).gte('created_at', desde).limit(300);
      if(!rg.error && rg.data) AVISOS.feedbackNuevos = rg.data.length;
    } catch(e){}
  }

  /* La semana en el inicio del entrenador. Cada día dice el deporte y, si hay
     algo apuntado, cuántos: «2» al lado del martes significa que dos ya han
     escrito cómo les fue. Se toca un día y se abre el planificador ahí. */
  /* El día que el entrenador está OJEANDO en su inicio. Se mira aquí y se
     entra al planificador solo cuando hay algo que tocar. */
  var ENT_OJEO = null;
  function tiraSemanaEnt(){
    if(!HOY.semana || !HOY.semana.length) return '';
    var nom = ['lun','mar','mié','jue','vie','sáb','dom'];
    var lun = lunesDeFecha(todayISO), h = '';
    for(var i=0;i<7;i++){
      var iso = addDias(lun,i);
      var ses = HOY.semana.filter(function(x){ return x.fecha===iso; });
      var d = new Date(iso+'T00:00:00');
      var ap = ses.reduce(function(a,x){ return a+(HOY.apuntados[x.id]||0); }, 0);
      var cls = 'te-d'+(ses.length?'':' libre')+(iso===todayISO?' hoy':'')+(iso===(ENT_OJEO||todayISO)?' sel':'');
      h += '<button type="button" class="'+cls+'" data-ojear-ent="'+iso+'" '+
           'title="'+esc(formatFecha(iso)+(ses.length?': '+(ses[0].titulo||'entrenamiento'):': sin entrenamiento'))+'">'+
           '<span class="te-n">'+(iso===todayISO?'hoy':nom[i])+'</span>'+
           '<span class="te-num">'+d.getDate()+'</span>'+
           '<span class="te-et">'+esc(ses.length?(nombreDeporte(ses[0].deporte)||tipoNombre(ses[0].tipo)||'entreno'):'libre')+'</span>'+
           (ap?'<span class="te-ap">'+ap+'</span>':'')+'</button>';
    }
    return '<div class="te-semana">'+h+'</div>';
  }

  function pintarHoy(){
    var cont = $('hoy-cont'); if(!cont) return;
    if(!MIS_GRUPOS.length){ cont.innerHTML = ''; return; }
    if(HOY.cargando){
      // La forma de la tarjeta de hoy, para que no salte al llegar los datos.
      cont.innerHTML = '<div class="hoy-e-no"><div class="hn-txt">'+APOLANA_UI.cargando('tarjeta')+'</div></div>';
      return;
    }
    var TIRA = tiraSemanaEnt();
    /* Lo de debajo sigue al día que se está mirando. Antes era siempre hoy y
       tocar otro día te metía en el planificador; ahora ojeas la semana y
       entras solo para editar o para mirar el feedback. */
    var diaVer = ENT_OJEO || todayISO;
    var delDia = (diaVer===todayISO) ? HOY.sesiones
               : (HOY.semana||[]).filter(function(x){ return x.fecha===diaVer; });

    if(!delDia.length){
      var txt = (diaVer !== todayISO)
        ? 'Ese día no hay entrenamiento puesto. Tócalo otra vez para planificar uno.'
        : (HOY.siguiente
            ? 'La siguiente es el '+formatFecha(HOY.siguiente.fecha)+(HOY.siguiente.titulo ? ' · '+HOY.siguiente.titulo : '')+'.'
            : 'No hay nada en el calendario de tus grupos.');
      cont.innerHTML = TIRA + '<div class="hoy-e-no">'+
        '<div class="hn-ic">'+icVacCal+'</div>'+
        '<div class="hn-txt"><b>Hoy no hay entrenamiento programado</b><span>'+esc(txt)+'</span></div>'+
        '<button type="button" data-planificar>Planificar</button>'+
      '</div>';
    } else {
      cont.innerHTML = TIRA + delDia.map(function(s){
        var det = [];
        if(s.hora) det.push('<span class="he-hora"><i></i>'+esc(horaCorta(s.hora))+'</span>');
        var lugar = s.lugar || lugarDeGrupo(s.grupo_id);
        if(lugar) det.push('<span><i></i>'+esc(lugar)+'</span>');
        var soloAlgunos = Array.isArray(s.atletas_ids) && s.atletas_ids.length;
        if(soloAlgunos) det.push('<span><i></i>solo '+esc(nombresDeIds(s.atletas_ids, 2))+'</span>');
        /* La etiqueta de la tarjeta de hoy dice el deporte, no el «tipo» de
           antes: es lo que el entrenador y el atleta necesitan saber de un
           vistazo, y cuando el día son dos deportes se dicen los dos. */
        var tipo = textoDeportes(s);
        /* Una línea sobre las fotos, en la tarjeta del día.
           No repite el aviso entero —ese está en Pasar lista, con los
           nombres—, pero esta es la pantalla en la que se entra, y las
           fotos no se hacen solo al principio del entrenamiento: se hacen
           a mitad, cuando ya nadie va a volver a abrir la lista. Una línea
           basta para que la pregunta te pase por la cabeza a tiempo. */
        var deHoy = MIS_ATLETAS.filter(function(x){ return estaEn(x, s.grupo_id) && x.estado !== 'baja'; });
        var rf = repartoFotos(deHoy);
        var lineaFoto = '';
        if(rf.ninguno){
          lineaFoto = '<p class="he-foto">'+icSinFoto+'<span>De este grupo no consta el permiso de fotos de nadie: hasta que conste, no se publica ninguna.</span></p>';
        } else if(rf.hayAlgo){
          var fuera = rf.no.concat(rf.parcial, rf.nose);
          lineaFoto = '<p class="he-foto">'+icSinFoto+'<span>No salen en fotos publicadas: <strong>'+esc(nombresCortos(fuera, 3))+'</strong>.</span></p>';
        }
        return '<div class="hoy-e">'+
          '<div class="he-top">'+
            '<span class="he-et">Hoy · '+esc(nombreGrupo(s.grupo_id)||'tu grupo')+'</span>'+
            (tipo ? '<span class="he-tipo">'+esc(tipo)+'</span>' : '')+
          '</div>'+
          '<div>'+
            '<h2 class="he-tit">'+esc(s.titulo || 'Entrenamiento de hoy')+'</h2>'+
            (det.length ? '<div class="he-det">'+det.join('')+'</div>' : '')+
          '</div>'+
          (!s.publicada ? '<p class="he-aviso">Está en borrador: todavía no lo ven tus atletas.</p>' : '')+
          lineaFoto+
          '<div class="he-btns">'+
            '<button type="button" class="he-lista" data-lista="'+escAttr(s.grupo_id)+'">Pasar lista</button>'+
            '<button type="button" class="he-ver" data-ver="'+escAttr(s.id)+'" data-grupo="'+escAttr(s.grupo_id)+'">Ver entrenamiento</button>'+
          '</div>'+
        '</div>';
      }).join('');
    }

    var bp = cont.querySelector('[data-planificar]');
    if(bp) bp.addEventListener('click', function(){ irASeccion('planificar'); cerrarMas(); window.scrollTo(0,0); });
    cont.querySelectorAll('[data-lista]').forEach(function(b){
      b.addEventListener('click', function(){ irAPasarLista(b.getAttribute('data-lista'), todayISO); });
    });
    cont.querySelectorAll('[data-ver]').forEach(function(b){
      b.addEventListener('click', function(){ verEntreno(b.getAttribute('data-grupo'), b.getAttribute('data-ver')); });
    });
  }

  // Abre la lista del día en el grupo que toque
  async function irAPasarLista(grupoId, fecha){
    // Si ya había una lista a medias sin guardar, primero se pone a salvo.
    if(!(await puedoDejarLaLista())) { irASeccion('lista'); cerrarMas(); window.scrollTo(0,0); return; }
    irASeccion('lista'); cerrarMas();
    var sg = $('lst-grupo'), sf = $('lst-fecha');
    if(sg && grupoId){ sg.value = grupoId; LST.grupo = grupoId; }
    if(sf){ sf.value = fecha || todayISO; }
    LST.fecha = fecha || todayISO;
    if(sg) refrescarLista();
    window.scrollTo(0,0);
  }

  // Abre la sesión en «Planificar un entreno», ya cargada para verla o retocarla
  async function verEntreno(grupoId, sesionId){
    irASeccion('planificar'); cerrarMas(); window.scrollTo(0,0);
    var sg = $('pl-grupo'); if(!sg) return;
    sg.value = grupoId || sg.value;
    await cargarSesionesGrupo(sg.value);
    var se = $('pl-editar');
    var s = window.__SESIONES_GRUPO && window.__SESIONES_GRUPO[sesionId];
    if(se && s){ se.value = sesionId; cargarSesionEnForm(s); }
  }

  function pintarAvisos(){
    var cont = $('avisos-cont'); if(!cont) return;
    if(!MIS_GRUPOS.length || AVISOS.cargando){ cont.innerHTML = ''; return; }
    var filas = '';

    if(AVISOS.ausencias.length){
      var noms = AVISOS.ausencias.map(function(a){
        var at = atletaPorId(a.atleta_id); return at ? nombreAtleta(at) : '';
      }).filter(Boolean);
      filas += '<button type="button" class="aviso rojo" data-av="faltas">'+
        '<span class="av-ic">'+icAlerta+'</span>'+

          (noms.length ? '<small>'+esc(noms.slice(0,3).join(', '))+(noms.length>3 ? ' y '+(noms.length-3)+' más' : '')+'</small>' : '')+

  // ============================================================
  // SECCIÓN 1a · QUIÉN SE HA APUNTADO A TUS ENTRENOS ABIERTOS
  // ------------------------------------------------------------
  // Cuando abres un entreno (ver «Planificar entreno»), cualquiera
  // del club se puede apuntar desde el calendario. Aquí ves cuánta
  // gente espera cada día, para preparar el material y las calles.
  //
  // OJO, ESTO NO ES UN FALLO: los NOMBRES que salen son los de TUS
  // atletas. Los de otros grupos cuentan en el total (que sale de la
  // vista `sesiones_agenda`), pero sus datos personales son de su
  // entrenador y la base de datos no te los deja leer. Por lo mismo,
  // solo puedes quitar de la lista a los tuyos.
  // ============================================================
  var APUNTADOS = { sesiones: [], porSesion: {}, totales: {}, cargando: false, error: '' };

  async function cargarApuntados(){
    APUNTADOS.sesiones = []; APUNTADOS.porSesion = {}; APUNTADOS.totales = {}; APUNTADOS.error = '';
    if(!MIS_GRUPOS.length) return;
    var ids = MIS_GRUPOS.map(function(g){ return g.id; });
    var r = await sb.from('sesiones')
      .select('id,fecha,hora,titulo,lugar,grupo_id,plazas,abierta_a,publicada')
      .in('grupo_id', ids).eq('abierta_inscripcion', true).gte('fecha', todayISO)
      .order('fecha', { ascending:true }).order('hora', { ascending:true }).limit(60);
    if(r.error){ APUNTADOS.error = r.error.message; return; }
    APUNTADOS.sesiones = r.data || [];
    if(!APUNTADOS.sesiones.length) return;
    var sids = APUNTADOS.sesiones.map(function(s){ return s.id; });

    var ri = await sb.from('sesion_inscripciones').select('id,sesion_id,atleta_id,created_at').in('sesion_id', sids);
    if(!ri.error && ri.data) ri.data.forEach(function(i){
      (APUNTADOS.porSesion[i.sesion_id] = APUNTADOS.porSesion[i.sesion_id] || []).push(i);
    });
    // El TOTAL de apuntados (incluida la gente de otros grupos) sale de la
    // agenda del club, que sí puede contarlos.
    try {
      var ra = await sb.from('sesiones_agenda').select('sesion_id,apuntados,libres').in('sesion_id', sids);
      if(!ra.error && ra.data) ra.data.forEach(function(v){ APUNTADOS.totales[v.sesion_id] = v; });
    } catch(e){}
  }

  function pintarApuntados(){
    var cont = $('ap-cont'); if(!cont) return;

    var cab = '<div class="tarjeta"><h2>Quién se ha apuntado</h2>';
    if(APUNTADOS.cargando){ cont.innerHTML = ''; return; }
