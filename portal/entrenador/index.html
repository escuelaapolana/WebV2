  function swMsg(txt, clase){
    ['sw-msg-top','sw-msg'].forEach(function(id){
      var m = $(id); if(!m) return;
      m.textContent = txt||''; m.className = 'msg'+(clase?' '+clase:'');
    });
  }

  async function ponerSemana(res, grupoId){
    SEMANA = { grupo_id: grupoId, sesiones: res.sesiones||[], avisos: res.avisos||[], existentes: {} };
    // Cada día hereda lo de arriba salvo que ya traiga lo suyo (texto pegado,
    // CSV o semana duplicada pueden traer su propia hora, sitio y apertura).
    if($('sw-abierta')){
      var a = leerAbrir('sw');
      SEMANA.sesiones.forEach(function(s){
        if(s.abierta === undefined || s.abierta === null) s.abierta = !!a.abierta_inscripcion;
        if(!s.hora) s.hora = horaCorta(a.hora || '');
        else s.hora = horaCorta(s.hora);
        if(!s.lugar) s.lugar = a.lugar || '';
      });
    }
    pintarPrevisualizacion();
    if(!SEMANA.sesiones.length){ swMsg('No he encontrado ningún entrenamiento. Revisa que cada día empiece por su nombre (LUNES, MARTES…).', 'error'); return; }
    swMsg('Interpretado: '+SEMANA.sesiones.length+' entrenamiento(s). Revísalo abajo antes de guardar.', 'ok');
    await comprobarChoques();
  }

  async function comprobarChoques(){
    if(!SEMANA || !SEMANA.sesiones.length) return;
    var fechas = SEMANA.sesiones.map(function(s){ return s.fecha; });
    var r = await sb.from('sesiones').select('id,fecha,titulo').eq('grupo_id', SEMANA.grupo_id).in('fecha', fechas);
    SEMANA.existentes = {};
    if(!r.error && r.data) r.data.forEach(function(s){ SEMANA.existentes[s.fecha] = s.id; });
    pintarPrevisualizacion();
  }

  function filaTexto(f, dis){
    var p = [];
    // la serie y la recuperación las escribe el módulo, para que las cinco
    // pantallas del club digan exactamente lo mismo
    if(Dsc){
      Dsc.partesFila(f, dis||'pista').forEach(function(x){ p.push(esc(x)); });
    } else {
      if(f.series && f.distancia) p.push(esc(f.series)+' × '+esc(f.distancia));
      else if(f.series) p.push(esc(f.series)+' series');
      else if(f.distancia) p.push(esc(f.distancia));
      if(f.ritmo) p.push('ritmo '+esc(f.ritmo));
      if(f.descanso) p.push('rec '+esc(f.descanso));
    }
    if(f.calzado) p.push('calzado '+esc(calzadoCorto(f.calzado)));   // en la lista va la abreviatura (Z / C)
    if(f.carga && !(Dsc && dis==='cubo')) p.push('carga '+esc(f.carga));   // en El Cubo ya va dentro de la serie
    if(f.material && f.material.length) p.push('material '+esc(f.material.join(' + ')));
    if(f.detalle) p.push(esc(f.detalle));
    if(f.observaciones) p.push('obs. '+esc(f.observaciones));
    return '<li><b>'+esc(f.ejercicio||'—')+'</b>'+(p.length ? ' — '+p.join(' · ') : '')+'</li>';
  }

  // Volumen y tiempo de un día de la semana previsualizada, separados y sin
  // inventar: si no se puede estimar el tiempo, solo sale el volumen.
  function resumenChips(s){
    if(!Dsc) return '';
    var r = Dsc.resumen(s, { grupo: grupoPorId(SEMANA ? SEMANA.grupo_id : '') });
    var h = '';
    if(r.volumen) h += '<span class="sw-chip">'+esc(r.volumen)+'</span>';
    if(r.tiempo)  h += '<span class="sw-chip">'+esc(r.tiempo)+'</span>';
    return h;
  }

  // ------------------------------------------------------------
  // EL DESTINATARIO DE UN DÍA SUELTO
  // ------------------------------------------------------------
  // «A lo mejor el lunes es igual para dos, y el miércoles y el viernes
  // no.» La base ya lo aguantaba: `atletas_ids` es de cada entrenamiento,
  // no de la semana. El límite era solo de la pantalla.
  //
  // Lo de arriba («¿Para quién es esta semana?») sigue siendo el valor de
  // toda la tanda, que es el caso normal —de 361 entrenamientos, 359 van
  // al grupo entero— y es lo que sale puesto. Aquí solo se afina un día,
  // y va plegado: quien no lo necesite no lo ve.
  //
  // Es el mismo reparto que ya tenía «Abierto»: arriba lo de la tanda,
  // en cada día la excepción.
  // ------------------------------------------------------------
  function destDiaHTML(s, i){
    var atls = atletasDeGrupo(SEMANA.grupo_id);
    var propio = !!s.dest_propio;
    var ids = Array.isArray(s.atletas_ids) ? s.atletas_ids : [];
    return '<div class="sw-dest-dia">'+
      '<span class="sw-lab">Para quién</span>'+
      '<div class="sw-dest-fila">'+
        '<span class="sw-dest-txt">'+esc(propio ? (ids.length ? 'Solo '+nombresDeIds(ids, 4) : 'No has marcado a nadie todavía') : 'Lo mismo que la semana')+'</span>'+
        '<button type="button" class="btn-mini sw-dest-abrir" aria-expanded="false">Cambiar solo este día</button>'+
      '</div>'+
      '<div class="sw-dest-caja" hidden>'+
        (atls.length
          ? '<label class="check"><input type="radio" name="swd-'+i+'" value="tanda"'+(propio?'':' checked')+'><span>Lo mismo que la semana</span></label>'+
            '<label class="check"><input type="radio" name="swd-'+i+'" value="propio"'+(propio?' checked':'')+'><span>Solo estos atletas</span></label>'+
            '<div class="dest-lista sw-dest-lista"'+(propio?'':' hidden')+'>'+
              atls.map(function(x){
                return '<label><input type="checkbox" class="swd-chk" value="'+escAttr(x.id)+'"'+(ids.indexOf(x.id)>-1?' checked':'')+'>'+esc(nombreAtleta(x))+'</label>';
              }).join('')+
            '</div>'
          : '<p class="sw-nota">Este grupo no tiene atletas visibles todavía.</p>')+
      '</div>'+
    '</div>';
  }

  // Deja `s.dest_propio` y `s.atletas_ids` al día con lo que hay marcado,
  // y reescribe la línea que se lee sin abrir nada.
  function conectarDestDia(el, s, i){
    var abrir = el.querySelector('.sw-dest-abrir');
    if(!abrir) return;
    abrir.addEventListener('click', function(){
      var caja = el.querySelector('.sw-dest-caja');
      caja.hidden = !caja.hidden;
      abrir.setAttribute('aria-expanded', caja.hidden ? 'false' : 'true');
    });
    function refrescar(){
      var marcado = el.querySelector('input[name="swd-'+i+'"]:checked');
      var esPropio = !!marcado && marcado.value === 'propio';
      var lista = el.querySelector('.sw-dest-lista');
      if(lista) lista.hidden = !esPropio;
      var ids = [];
      el.querySelectorAll('.swd-chk').forEach(function(c){ if(c.checked) ids.push(c.value); });
      s.dest_propio = esPropio;
      s.atletas_ids = esPropio ? ids : null;
      var txt = el.querySelector('.sw-dest-txt');
      if(txt) txt.textContent = esPropio
        ? (ids.length ? 'Solo '+nombresDeIds(ids, 4) : 'No has marcado a nadie todavía')
        : 'Lo mismo que la semana';
      el.classList.toggle('propio', esPropio && ids.length > 0);
      var res = $('sw-prev-dest');
      if(res) res.textContent = textoDestSemana();
    }
    el.querySelectorAll('input[name="swd-'+i+'"]').forEach(function(r){ r.addEventListener('change', refrescar); });
    el.querySelectorAll('.swd-chk').forEach(function(c){ c.addEventListener('change', refrescar); });
  }

  // La línea de arriba de la previsualización: lo de la tanda, y cuántos
  // días se han salido de ella.
  function textoDestSemana(){
    var base = textoDest('sw', false);
    if(!SEMANA) return base;
    var aparte = SEMANA.sesiones.filter(function(s){ return s.incluir !== false && s.dest_propio && (s.atletas_ids||[]).length; });
    if(!aparte.length) return base;
    return base+' '+(aparte.length===1 ? 'Un día va aparte: ' : aparte.length+' días van aparte: ')+
      aparte.map(function(s){ return (s.dia_semana||formatFecha(s.fecha))+' → '+nombresDeIds(s.atletas_ids, 3); }).join(' · ')+'.';
  }

  function pintarPrevisualizacion(){
    var card = $('sw-prev-card'), cont = $('sw-prev');
    if(!card) return;
    if(!SEMANA || !SEMANA.sesiones.length){ card.hidden = true; return; }
    card.hidden = false;
    var ex = SEMANA.existentes || {};
    var incluidas = SEMANA.sesiones.filter(function(s){ return s.incluir !== false; });
    var nChoques = incluidas.filter(function(s){ return ex[s.fecha]; }).length;

    var html = '<p class="sw-resumen"><strong>'+incluidas.length+'</strong> entrenamiento(s) para <strong>'+esc(nombreGrupo(SEMANA.grupo_id)||'—')+
      '</strong> · semana del '+esc(formatFecha(SEMANA.sesiones[0].fecha))+'. Puedes corregir aquí mismo el título, el tipo, el rol, la hora, el sitio y si ese día está abierto, o desmarcar los días que no quieras crear.</p>'+
      '<p class="pista" id="sw-prev-dest" style="margin:0 0 4px;">'+esc(textoDestSemana())+'</p>'+
      '<p class="pista" id="sw-prev-abre" style="margin:0 0 12px;">Apuntarse: '+esc(textoAbrir('sw', $('sw-publicar') ? $('sw-publicar').checked : true))+'</p>';

    if(SEMANA.avisos && SEMANA.avisos.length){
      html += '<div class="sw-avisos"><strong>Cosas que conviene revisar ('+SEMANA.avisos.length+'):</strong><ul>'+
        SEMANA.avisos.map(function(a){ return '<li>'+esc(a)+'</li>'; }).join('')+'</ul></div>';
    }
    if(nChoques){
      html += '<div class="sw-avisos"><strong>Ya hay '+nChoques+' entrenamiento(s) creado(s) en esas fechas para este grupo.</strong> Elige abajo si quieres sobrescribirlos o saltarlos.</div>';
    }

    SEMANA.sesiones.forEach(function(s, i){
      var nFilas = 0;
      (s.bloques||[]).forEach(function(b){ nFilas += (b.filas||[]).length; });
      html += '<div class="sw-dia'+(s.incluir===false?' excluido':'')+((s.dest_propio && (s.atletas_ids||[]).length)?' propio':'')+'" data-i="'+i+'">'+
        '<div class="sw-dia-cab">'+
          '<span class="sw-fecha">'+esc(s.dia_semana||'')+' · '+esc(formatFecha(s.fecha))+'</span>'+
          (ex[s.fecha] ? '<span class="sw-choque">Ya existe</span>' : '')+
          '<span class="pill">'+nFilas+' ejercicio(s)</span>'+
          resumenChips(s)+
          '<span style="flex:1 1 auto"></span>'+
          /* El rótulo va DENTRO de la etiqueta para que se pueda pulsar: antes
             era un <label> suelto sin «for», así que había que acertar en el
             cuadradito de 20 px. Y esta casilla decide si el día entra o no
             cuando se sobrescribe una semana. */
          '<label class="check"><input type="checkbox" class="sw-inc"'+(s.incluir===false?'':' checked')+'><span>Incluir</span></label>'+
        '</div>'+
        '<div class="sw-dia-campos">'+
          '<div><span class="sw-lab">Título</span><input class="sw-tit" placeholder="Título del entrenamiento" value="'+escAttr(s.titulo||'')+'"></div>'+
          '<div><span class="sw-lab">Tipo</span><select class="sw-tipo">'+optsPares(TIPOS, s.tipo||'', '— sin tipo —')+'</select></div>'+
          '<div><span class="sw-lab">Rol</span><select class="sw-rol">'+optsPares(ROLES, s.rol||'', '— sin rol —')+'</select></div>'+
        '</div>'+
        '<div class="sw-dia-campos">'+
          /* La hora se puede dejar en blanco, y de hecho es lo normal: si no
             se pone, el atleta ve la del horario de su grupo. Solo se rellena
             cuando ese día se entrena a otra hora. Vacío y sin decir nada, al
             lado de «Lugar» ya relleno, parecía que faltaba algo. */
          '<div><span class="sw-lab">Hora (si no, la del grupo)</span><input class="sw-hora" type="time" value="'+escAttr(horaCorta(s.hora||''))+'"></div>'+
          '<div><span class="sw-lab">Lugar</span><input class="sw-lugar" list="lugares-dl" placeholder="Dónde se queda" value="'+escAttr(s.lugar||'')+'"></div>'+
          '<div><span class="sw-lab">Apuntarse</span><label class="check"><input type="checkbox" class="sw-abre-dia"'+(s.abierta?' checked':'')+'><span>Abierto</span></label></div>'+
        '</div>'+
        destDiaHTML(s, i);
      var disSem = Dsc ? Dsc.disciplinaDe(s, grupoPorId(SEMANA.grupo_id)) : 'pista';
      var bloquesSem = s.bloques||[];
      bloquesSem.forEach(function(b, bi){
        html += '<div class="sw-bloque"><h4>'+esc(b.etiqueta||'Bloque')+(b.matiz?' — '+esc(b.matiz):'')+'</h4><ul>'+
          (b.filas||[]).map(function(f){ return filaTexto(f, disSem); }).join('')+'</ul>';
        // el separador entre bloques. Si ese bloque no lleva descanso, no se pinta nada
        if(Dsc){
          var entreEj = Dsc.textoEntreEjercicios(b);
          if(entreEj) html += '<p class="sw-nota">'+esc(entreEj)+'</p>';
          var entre = Dsc.textoEntreBloques(b);
          if(entre && bi < bloquesSem.length-1) html += '<p class="sw-nota">'+esc(entre)+'</p>';
        }
        html += '</div>';
      });
      if(!(s.bloques||[]).length) html += '<p class="sw-nota">Sin bloques (día de descanso o solo cabecera).</p>';
      if(s.nota_razonamiento) html += '<p class="sw-nota">Nota: '+esc(s.nota_razonamiento)+'</p>';
      html += '</div>';
    });

    cont.innerHTML = html;

    cont.querySelectorAll('.sw-dia').forEach(function(el){
      var i = parseInt(el.getAttribute('data-i'), 10), s = SEMANA.sesiones[i];
      el.querySelector('.sw-inc').addEventListener('change', function(){ s.incluir = this.checked; el.classList.toggle('excluido', !this.checked); });
      el.querySelector('.sw-tit').addEventListener('input', function(){ s.titulo = this.value; });
      el.querySelector('.sw-tipo').addEventListener('change', function(){ s.tipo = this.value; });
      el.querySelector('.sw-rol').addEventListener('change', function(){ s.rol = this.value; });
      el.querySelector('.sw-hora').addEventListener('input', function(){ s.hora = this.value; });
      el.querySelector('.sw-lugar').addEventListener('input', function(){ s.lugar = this.value; });
      el.querySelector('.sw-abre-dia').addEventListener('change', function(){ s.abierta = this.checked; });
      conectarDestDia(el, s, i);
    });
  }

  // ---------- guardado en lote ----------
  async function crearSemana(){
    if(!SEMANA || !SEMANA.sesiones.length){ swMsg('No hay nada previsualizado.', 'error'); return; }
    var incluidas = SEMANA.sesiones.filter(function(s){ return s.incluir !== false; });
    if(!incluidas.length){ swMsg('No has dejado ningún día marcado.', 'error'); return; }
    var dest = leerDest('sw');
    if(dest.error){ swMsg(dest.error, 'error'); return; }
    /* Un día puesto en «Solo estos atletas» y sin nadie marcado no se
       puede guardar en silencio: se quedaría para todo el grupo, que es
       justo lo contrario de lo que se pidió. Se dice qué día es. */
    var malDia = null;
    incluidas.forEach(function(s){ if(!malDia && s.dest_propio && !(s.atletas_ids||[]).length) malDia = s; });
    if(malDia){
      swMsg('El '+(malDia.dia_semana||formatFecha(malDia.fecha))+' está en «Solo estos atletas» pero no has marcado a nadie. Márcalos, o déjalo en «Lo mismo que la semana».', 'error');
      return;
    }
    var abre = leerAbrir('sw');
    if(abre.error){ swMsg(abre.error, 'error'); return; }
    var modoEl = document.querySelector('input[name="sw-choque"]:checked');
    var modo = modoEl ? modoEl.value : 'saltar';
    var publicar = $('sw-publicar').checked;
    var ex = SEMANA.existentes || {};

    /* Sobrescribir pisa sesiones que ya estaban escritas y no hay vuelta
       atrás. Es lo más irreversible de esta pantalla, así que se pregunta
       contando cuántas se van a perder. */
    if(modo === 'sobrescribir'){
      var aPisar = incluidas.filter(function(s){ return ex[s.fecha]; }).length;
      if(aPisar && window.APX){
        var sigo = await APX.confirm(
          'Vas a sobrescribir '+aPisar+' entrenamiento(s) que ya estaban creados en esas fechas. Lo que tuvieran escrito se pierde y no se puede recuperar.',
          { aceptar: 'Sobrescribir '+aPisar+' entrenamiento(s)', cancelar: 'Cancelar', peligro: true });
        if(!sigo){ swMsg(''); return; }
      }
    }

    swMsg('Guardando…');
    var nuevas = [], updates = [], saltadas = 0;
    incluidas.forEach(function(s){
      var p = {
        grupo_id: SEMANA.grupo_id,
        fecha: s.fecha,
        dia_semana: s.dia_semana || diaSemana(s.fecha),
        titulo: (s.titulo||'').trim() || null,
        tipo: s.tipo || null,
        rol: s.rol || null,
        nota_razonamiento: (s.nota_razonamiento||'').trim() || null,
        bloques: s.bloques || [],
        publicada: publicar,
        /* El de la tanda, salvo que ese día se haya dicho otra cosa en la
           previsualización. Así el lunes puede ir para dos y el miércoles
           para todo el grupo, sin planificar la semana dos veces. */
        atletas_ids: (s.dest_propio && (s.atletas_ids||[]).length) ? s.atletas_ids : dest.ids,
        // el «abierto» es de cada día; las plazas y las secciones, de la tanda
        abierta_inscripcion: !!s.abierta,
        inscripcion: s.abierta ? abre.inscripcion : 'cerrada',
        plazas: s.abierta ? abre.plazas : null,
        abierta_a: s.abierta ? abre.abierta_a : null,
        hora: horaCorta(s.hora||'') || null,
        lugar: (s.lugar||'').trim() || null
      };
      if(ex[s.fecha]){
        if(modo === 'saltar'){ saltadas++; return; }
        updates.push({ id: ex[s.fecha], payload: p });
      } else {
        p.creado_por = perfil.id;
        nuevas.push(p);
      }
    });

    var creadas = 0, actualizadas = 0;
    if(nuevas.length){
      var r = await sb.from('sesiones').insert(nuevas).select('id');   // un solo insert con todas
      if(r.error){ swMsg('Error al crear: '+r.error.message, 'error'); return; }
      creadas = (r.data||nuevas).length;
    }
    for(var i=0;i<updates.length;i++){
      var u = await sb.from('sesiones').update(updates[i].payload).eq('id', updates[i].id);
      if(u.error){ swMsg('Error al sobrescribir: '+u.error.message, 'error'); return; }
      actualizadas++;
    }

    var partes = [];
    if(creadas) partes.push(creadas+' creada(s)');
    if(actualizadas) partes.push(actualizadas+' sobrescrita(s)');
    if(saltadas) partes.push(saltadas+' saltada(s) porque ya existían');
    var quien = dest.ids ? ' · solo para '+nombresDeIds(dest.ids, 4) : ' · para todo el grupo';
    var nAparte = incluidas.filter(function(s){ return s.dest_propio && (s.atletas_ids||[]).length; }).length;
    if(nAparte) quien += ' · '+nAparte+' día(s) con su propio destinatario';
    var nAbiertas = incluidas.filter(function(s){ return s.abierta; }).length;
    var abierto = nAbiertas
      ? ' · '+nAbiertas+' día(s) abiertos a '+textoSecciones(abre.abierta_a)+(abre.plazas ? ' ('+abre.plazas+' plazas)' : ' (sin límite de plazas)')+(publicar?'':' — en borrador nadie se puede apuntar')
      : '';
    swMsg('Semana guardada ✓ '+partes.join(' · ')+quien+(publicar?' · visibles en la zona de atleta':' · en borrador')+abierto, 'ok');

    await comprobarChoques();
    if($('pl-grupo') && $('pl-grupo').value === SEMANA.grupo_id) await cargarSesionesGrupo(SEMANA.grupo_id);
    cargarSesionesFeedback();
    refrescarApuntados();
  }

  // ---------- duplicar ----------
  async function cargarSemanasOrigen(){
    var sel = $('sw-dup-semana'); if(!sel) return;
    var gid = $('sw-dup-grupo').value;
    sel.innerHTML = '<option value="">— elige una semana —</option>';
    SEMANAS_ORIGEN = {};
    if(!gid) return;
    var r = await sb.from('sesiones').select('id,fecha,dia_semana,tipo,rol,titulo,nota_razonamiento,bloques,atletas_ids,abierta_inscripcion,plazas,abierta_a,hora,lugar').eq('grupo_id', gid).order('fecha', { ascending:false }).limit(250);
    if(r.error || !r.data) return;
    r.data.forEach(function(s){ var L = lunesDe(s.fecha); (SEMANAS_ORIGEN[L] = SEMANAS_ORIGEN[L] || []).push(s); });
    Object.keys(SEMANAS_ORIGEN).sort().reverse().forEach(function(L){
      sel.innerHTML += '<option value="'+L+'">Semana del '+esc(formatFecha(L))+' · '+SEMANAS_ORIGEN[L].length+' entrenamiento(s)</option>';
    });
  }

  function sesionesDesdeOrigen(arr, lunesOrigen, lunesDestino){
    return arr.map(function(s){
      var off = difDias(s.fecha, lunesOrigen);
      var fecha = addDias(lunesDestino, off);
      return { idx: off, fecha: fecha, dia_semana: DIAS_TXT[off] || diaSemana(fecha),
               tipo: s.tipo||'', rol: s.rol||'', titulo: s.titulo||'', nota_razonamiento: s.nota_razonamiento||'',
               bloques: JSON.parse(JSON.stringify(s.bloques||[])), incluir: true,
               /* Si aquel día iba dirigido a unos atletas concretos, la copia
                  nace igual. Antes se leía y luego el guardado lo pisaba con
                  el destinatario de la tanda: la copia perdía a quién iba. */
               atletas_ids: Array.isArray(s.atletas_ids) ? s.atletas_ids.slice() : null,
               dest_propio: !!(Array.isArray(s.atletas_ids) && s.atletas_ids.length),
               // se copia tal cual si estaba abierto, a qué hora y dónde
               abierta: !!s.abierta_inscripcion, hora: horaCorta(s.hora||''), lugar: s.lugar||'' };
    }).sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
  }

  // ¿Todas las sesiones abiertas de origen tenían las mismas plazas y secciones?
  // Devuelve lo que hay que dejar puesto arriba al duplicar.
  function abrirComunDeSesiones(arr){
    var abiertas = (arr||[]).filter(function(s){ return s.abierta_inscripcion; });
    if(!abiertas.length) return { hay:false, mixto:false, plazas:null, abierta_a:null };
    function clave(s){ return String(s.plazas==null?'':s.plazas)+'|'+((s.abierta_a||[]).slice().sort().join(',')); }
    var k = clave(abiertas[0]), mixto = false;
    for(var i=1;i<abiertas.length;i++) if(clave(abiertas[i]) !== k) mixto = true;
    return { hay:true, mixto:mixto, plazas: abiertas[0].plazas, abierta_a: abiertas[0].abierta_a || null };
  }

  // ¿Todas las sesiones de origen iban a los mismos atletas?
  // Devuelve {mixto:true} si no coinciden, o {ids: null | [..]} si sí.
  function destComunDeSesiones(arr){
    if(!arr || !arr.length) return { mixto:false, ids:null };
    function clave(s){ var a = s.atletas_ids; return (Array.isArray(a) && a.length) ? a.slice().sort().join(',') : ''; }
    var k = clave(arr[0]);
    for(var i=1;i<arr.length;i++) if(clave(arr[i]) !== k) return { mixto:true, ids:null };
    return { mixto:false, ids: k ? k.split(',') : null };
  }

  // ---------- plantillas de semana ----------
  async function cargarPlantillas(){
    var sel = $('sw-pl-lista'); if(!sel) return;
    sel.innerHTML = '<option value="">— elige una plantilla —</option>';
    PLANTILLAS = {};
    var r = await sb.from('plantillas_semana').select('id,nombre,datos,creado_por,created_at').order('created_at', { ascending:false }).limit(100);
    if(r.error || !r.data){ return; }
    r.data.forEach(function(p){
      PLANTILLAS[p.id] = p;
      var n = (p.datos && p.datos.sesiones) ? p.datos.sesiones.length : 0;
      sel.innerHTML += '<option value="'+p.id+'">'+esc(p.nombre)+' · '+n+' entrenamiento(s)</option>';
    });
  }

  function sesionesDesdePlantilla(datos, lunesDestino){
    var arr = (datos && datos.sesiones) ? datos.sesiones : [];
    return arr.map(function(s){
      var off = parseInt(s.offset_dia, 10) || 0;
      var fecha = addDias(lunesDestino, off);
      return { idx: off, fecha: fecha, dia_semana: DIAS_TXT[off] || diaSemana(fecha),
               tipo: s.tipo||'', rol: s.rol||'', titulo: s.titulo||'', nota_razonamiento: s.nota_razonamiento||'',
               bloques: JSON.parse(JSON.stringify(s.bloques||[])), incluir: true,
               abierta: (s.abierta===undefined ? undefined : !!s.abierta),
               hora: horaCorta(s.hora||''), lugar: s.lugar||'' };
    }).sort(function(a,b){ return a.fecha < b.fecha ? -1 : 1; });
  }

  // ============================================================
  // LA SEMANA EN REJILLA · y el historial del entrenador dentro
  // ------------------------------------------------------------
  // Es la pantalla madre que faltaba. Una rejilla de días, no un
  // formulario: cada día es una tarjeta que se lee de un vistazo
  // —tipo, resumen, estado y «Abrir»— y el día vacío se ve vacío.
  //
  // Y EL HISTORIAL DEL ENTRENADOR NO ES OTRA PANTALLA: es esta misma
  // andando hacia atrás. Lo único que cambia en una semana pasada es
  // un pie por día, «Cómo les fue», con el esfuerzo medio, cuántos
  // apuntaron y lo que se repite en lo que escribieron. Montar una
  // pantalla aparte para eso sería tener dos sitios donde mirar la
  // misma semana.
  //
  // El editor de un entrenamiento NO se duplica aquí: «Abrir» y
  // «Planificar este día» llevan a «Planificar un entrenamiento»,
  // que ya existe y funciona.
  // ============================================================

  var SV_GRUPO = '';        // grupo cuya semana se está viendo
  var SV_LUNES = '';        // lunes de la semana visible
  var SV_SES = [];          // los entrenamientos de esa semana
  var SV_REG = {};          // lo que apuntaron los atletas, por sesión
  var SV_ESTADO = 'nada';   // nada · cargando · listo · error

  var MES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var DIA_TIT = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

  // «8-14 sep» para el navegador, que tiene que caber en una línea
  function rangoCorto(lunes){
    var a = new Date(lunes+'T00:00:00'), b = new Date(addDias(lunes,6)+'T00:00:00');
    if(a.getMonth() === b.getMonth()) return a.getDate()+'-'+b.getDate()+' '+MES_CORTO[a.getMonth()];
    return a.getDate()+' '+MES_CORTO[a.getMonth()]+' – '+b.getDate()+' '+MES_CORTO[b.getMonth()];
  }
  // «del 8 al 14 de septiembre», que es como se dice en voz alta
  function rangoLargo(lunes){
    var a = new Date(lunes+'T00:00:00'), b = new Date(addDias(lunes,6)+'T00:00:00');
    if(a.getMonth() === b.getMonth()) return 'del '+a.getDate()+' al '+b.getDate()+' de '+MESES_LARGOS[a.getMonth()];
    return 'del '+a.getDate()+' de '+MESES_LARGOS[a.getMonth()]+' al '+b.getDate()+' de '+MESES_LARGOS[b.getMonth()];
  }

  /* Lo que se lee bajo el título de cada día: el volumen, el tiempo y
     cuántos ejercicios lleva. Sale del mismo módulo que usan las otras
     pantallas del club, para que todas digan lo mismo. */
  function resumenDia(s, gid){
    var p = [];
    if(Dsc){
      var r = Dsc.resumen(s, { grupo: grupoPorId(gid) });
      if(r.volumen) p.push(r.volumen);
      if(r.tiempo)  p.push(r.tiempo);
    }
    var n = 0; (s.bloques||[]).forEach(function(b){ n += (b.filas||[]).length; });
    if(n) p.push(n + (n===1 ? ' ejercicio' : ' ejercicios'));
    if(Array.isArray(s.atletas_ids) && s.atletas_ids.length) p.push('solo para '+s.atletas_ids.length);
    if(s.abierta_inscripcion) p.push('abierto para apuntarse');
    if(!p.length && s.nota_razonamiento) return String(s.nota_razonamiento);
    return p.join(' · ');
  }

  // Los chips del día: los deportes en neutro y el papel del día en azul.
  function chipsDia(s){
    var h = '';
    [s.deporte, s.deporte_2].forEach(function(d){
      if(d) h += '<span class="dt-chip">'+esc(nombreDeporte(d)||d)+'</span>';
    });
    var papel = s.papel_dia || papelDesdeRol(s.tipo, s.rol);
    if(papel) h += '<span class="pz-estado pz-estado--info">'+esc(nombrePapel(papel)||papel)+'</span>';
    return h ? '<div class="dt-chips">'+h+'</div>' : '';
  }

  /* ------------------------------------------------------------
     «CÓMO LES FUE» · lo que convierte una semana pasada en historial
     ------------------------------------------------------------
     Tres datos y ni uno más: el esfuerzo medio, cuántos apuntaron y
     la queja que se repite. El cuarto —los que no apuntaron nada— va
     en ámbar porque es lo único de la semana sobre lo que el
     entrenador puede actuar: hablar con esos dos.
     ------------------------------------------------------------ */

  // Palabras que están en todas las frases y no distinguen ninguna
  var PALABRAS_VACIAS = {};
  ('el la los las un una unos unas de del al que como para por con sin muy mas pero '+
   'me te se le nos lo mi tu su es fue era han he ha hemos estaba estoy esta este '+
   'bien mal dia dias hoy ayer poco algo nada todo toda cuando porque aunque '+
   'entrenamiento entreno series serie hacer hice hizo').split(' ').forEach(function(w){ PALABRAS_VACIAS[w]=1; });

  function palabrasClave(t){
    return norm(t).replace(/[^a-z0-9ñ ]/g,' ').split(/\s+/)
      .filter(function(w){ return w.length > 3 && !PALABRAS_VACIAS[w]; });
  }

  /* «3 dicen algo parecido» no es magia ni adivina nada: dos notas se
     parecen si comparten DOS palabras con contenido («últimas» y
     «duras»). Se enseña la que más veces se repite; si ninguna se
     parece a otra, se enseña una y se dice cuántos escribieron algo,
     sin fingir que todos dicen lo mismo. */
  function quejaQueSeRepite(notas){
    if(!notas.length) return null;
    var claves = notas.map(palabrasClave);
    var mejor = 0, cuenta = 0;
    for(var i=0;i<notas.length;i++){
      var n = 0;
      for(var j=0;j<notas.length;j++){
        if(i===j) continue;
        var comunes = 0;
        claves[i].forEach(function(w){ if(claves[j].indexOf(w) > -1) comunes++; });
        if(comunes >= 2) n++;
      }
      if(n > cuenta){ cuenta = n; mejor = i; }
    }
    return { texto: notas[mejor], parecidos: cuenta, total: notas.length };
  }

  function comoLesFueHTML(s, gid){
    var regs = SV_REG[s.id] || [];
    // A cuántos iba dirigido: al grupo entero, o solo a los que se marcaron
    var aQuien = (Array.isArray(s.atletas_ids) && s.atletas_ids.length)
      ? s.atletas_ids.length : atletasDeGrupo(gid).length;
    var apuntaron = regs.length;
    var sinApuntar = Math.max(0, aQuien - apuntaron);

    var rpes = regs.map(function(r){ return r.rpe; }).filter(function(v){ return v!=null && v!==''; });
    var medio = rpes.length
      ? (rpes.reduce(function(a,b){ return a + Number(b); }, 0) / rpes.length)
      : null;

    var notas = [];
    regs.forEach(function(r){
      var t = (r.notas_atleta || r.como_me_siento || '').trim();
      if(t) notas.push(t);
    });
    var queja = quejaQueSeRepite(notas);
    var medias = regs.filter(function(r){ return r.estado==='a_medias' || r.estado==='no_hecho'; }).length;

    var h = '<div class="clf"><span class="clf-et">Cómo les fue</span>';
    if(medio != null){
      h += '<div class="clf-cifra"><b>'+esc(String(Math.round(medio*10)/10).replace('.', ','))+'</b>'+
           '<span>esfuerzo medio · '+apuntaron+' de '+aQuien+'</span></div>';
    } else if(apuntaron){
      h += '<div class="clf-cifra"><span>'+apuntaron+' de '+aQuien+' apuntaron algo, pero ninguno puso el esfuerzo</span></div>';
    }
    if(queja){
      h += '<p>«'+esc(queja.texto)+'»'+
           (queja.parecidos ? ' <span style="color:var(--texto-suave)">· '+(queja.parecidos+1)+' dicen algo parecido</span>'
            : (queja.total > 1 ? ' <span style="color:var(--texto-suave)">· y '+(queja.total-1)+' escribieron algo más</span>' : ''))+
           '</p>';
    }
    /* Los días a medias no están en la maqueta y se dicen igual: un
       esfuerzo medio de 6 con medio grupo dejándolo a la mitad no
       significa lo mismo que uno de 6 con todos acabando. */
    if(medias) h += '<p>'+medias+(medias===1 ? ' se quedó a medias' : ' se quedaron a medias')+'</p>';
    /* Si no ha apuntado nadie, se dice una sola vez y aquí: con una cifra
       vacía encima parecía que había fallado algo. */
    if(sinApuntar) h += '<p class="ojo">'+(apuntaron ? sinApuntar+(sinApuntar===1 ? ' no apuntó nada' : ' no apuntaron nada')
                                                     : 'Todavía no ha apuntado nada ninguno de los '+sinApuntar)+'</p>';
    return h + '</div>';
  }

  /* ---------- una tarjeta de día ----------
     `pre` distingue de qué pantalla es la tarjeta (`sv` la semana, `cv` el
     calendario). El mismo entrenamiento puede estar pintado en las dos a la
     vez —una está escondida, pero sigue en la página— y sin el prefijo los
     dos menús del «⋯» tendrían el mismo identificador: al abrir uno se
     abriría el de la pantalla que no se está mirando. */
  function tarjetaDia(fecha, sesiones, gid, pasado, pre){
    pre = pre || 'sv';
    var d = new Date(fecha+'T00:00:00');
    var cabDia = '<div class="dt-cab"><span class="dt-dia">'+esc(DIA_TIT[d.getDay()])+' '+d.getDate()+'</span>';

    if(!sesiones.length){
      return '<div class="dia-t sinnada">'+cabDia+'</div>'+
        '<div class="dt-cuerpo">'+
          '<span class="dt-res">'+(pasado ? 'No pusiste entreno' : 'Sin entreno puesto')+'</span>'+
          '<button type="button" class="pz-btn pz-btn--borde" data-pz-accion="planificar-dia" data-pz-id="'+escAttr(fecha)+'">'+
            (pasado ? 'Añadirlo ahora' : 'Planificar este día')+'</button>'+
        '</div></div>';
    }

    var hora = sesiones[0].hora ? horaCorta(sesiones[0].hora) : '';
    var h = '<div class="dia-t">'+cabDia+(hora ? '<span class="dt-hora">'+esc(hora)+'</span>' : '')+'</div>';

    h += '<div class="dt-cuerpo">';
    sesiones.forEach(function(s, i){
      /* Un día con dos deportes es UN día, no dos: van los dos en la
         misma tarjeta, separados, no en dos tarjetas. */
      if(i) h += '<hr style="border:0;border-top:1px solid var(--crema-media);margin:2px 0">';
      h += '<span class="dt-tit">'+esc(s.titulo || 'Sin título')+'</span>'+
           chipsDia(s);
      var res = resumenDia(s, gid);
      if(res) h += '<span class="dt-res">'+esc(res)+'</span>';
    });
    h += '</div>';

    // El pie: chip de estado, la acción de siempre y un solo «⋯»
    sesiones.forEach(function(s){
      var pub = !!s.publicada;
      h += '<div class="dt-pie">'+
        '<span class="pz-estado '+(pub ? 'pz-estado--ok' : 'pz-estado--aviso')+'">'+(pub ? 'Publicado' : 'Borrador')+'</span>'+
        '<span class="dt-menu">'+
          '<button type="button" class="pz-btn pz-btn--texto" data-pz-accion="'+(pasado ? 'ver-detalle' : 'abrir')+'" data-pz-id="'+escAttr(s.id)+'">'+
            (pasado ? 'Ver el detalle' : 'Abrir')+'</button>'+
          '<button type="button" class="pz-mas" aria-haspopup="menu" aria-expanded="false" '+
            'data-pz-menu="pz-menu-'+pre+'-'+escAttr(s.id)+'" aria-label="Más acciones del '+escAttr(formatFecha(s.fecha))+'">'+
            '<span aria-hidden="true">⋯</span></button>'+
          '<div class="pz-menu" hidden role="menu" id="pz-menu-'+pre+'-'+escAttr(s.id)+'">'+
            '<button type="button" role="menuitem" data-pz-accion="abrir" data-pz-id="'+escAttr(s.id)+'">Abrir el entrenamiento</button>'+
            '<button type="button" role="menuitem" data-pz-accion="ver-detalle" data-pz-id="'+escAttr(s.id)+'">Ver lo que apuntaron</button>'+
            '<button type="button" role="menuitem" data-pz-accion="duplicar-dia" data-pz-id="'+escAttr(s.id)+'">Duplicarlo a la semana siguiente</button>'+
          '</div>'+
        '</span>'+
      '</div>';
      if(pasado) h += comoLesFueHTML(s, gid);
    });

    return h + '</div>';
  }

  // ---------- traerse la semana ----------
  async function cargarSemanaVista(){
    SV_ESTADO = 'cargando';
    pintarSemana();
    var fin = addDias(SV_LUNES, 6);
    var r = await sb.from('sesiones')
      .select('id,fecha,hora,lugar,titulo,tipo,rol,deporte,deporte_2,papel_dia,publicada,bloques,'+
              'nota_razonamiento,atletas_ids,abierta_inscripcion,plazas,abierta_a,grupo_id,duracion_min')
      .eq('grupo_id', SV_GRUPO).gte('fecha', SV_LUNES).lte('fecha', fin).order('fecha', { ascending:true });
    if(r.error){ SV_ESTADO = 'error'; pintarSemana(); return; }
    SV_SES = r.data || [];
    SV_REG = {};
    /* Lo que apuntaron los atletas solo hace falta si la semana ya ha
       empezado: pedirlo para una semana futura sería una consulta que
       siempre vuelve vacía. */
    var ids = SV_SES.filter(function(s){ return s.fecha <= todayISO; }).map(function(s){ return s.id; });
    if(ids.length){
      var g = await sb.from('registros_sesion')
        .select('id,sesion_id,atleta_id,estado,rpe,notas_atleta,como_me_siento').in('sesion_id', ids);
      if(!g.error && g.data) g.data.forEach(function(x){ (SV_REG[x.sesion_id] = SV_REG[x.sesion_id] || []).push(x); });
    }
    SV_ESTADO = 'listo';
    pintarSemana();
  }

  function pintarSemana(){
    var vista = $('sw-vista');
    if(!vista) return;

    var lunesHoy = lunesDe(todayISO);
    var pasada = addDias(SV_LUNES, 6) < todayISO;
    var esEstaSemana = (SV_LUNES === lunesHoy);

    var puestas = SV_SES.length;
    var borradores = SV_SES.filter(function(s){ return !s.publicada; }).length;
    var ctx = [nombreGrupo(SV_GRUPO) || 'Sin grupo', rangoLargo(SV_LUNES)];
    if(pasada) ctx.push('semana pasada');
    ctx.push(puestas ? (puestas + (puestas===1 ? ' entrenamiento puesto' : ' entrenamientos puestos') +
                        (borradores ? ' · '+borradores+' en borrador' : ''))
                     : 'ningún entrenamiento puesto todavía');

    var h = PZ.cabecera({
      titulo: 'Planificar la semana',
      contexto: ctx.join(' · '),
      /* En una semana pasada lo que se viene a hacer no es planificar:
         es llevarse esa semana a otra. Por eso cambia el botón. */
      accion: pasada ? { texto: 'Copiar esta semana a…', accion: 'copiar-esta' }
                     : { texto: 'Nuevo entreno', accion: 'nuevo' }
    });

    // Una sola fila de mandos, y después del título
    h += '<div class="mandos">'+
      '<span class="navper">'+
        '<button type="button" data-pz-accion="sem-atras" aria-label="Semana anterior">&#8592;</button>'+
        '<span class="np-txt">'+esc(rangoCorto(SV_LUNES))+'</span>'+
        '<button type="button" data-pz-accion="sem-alante" aria-label="Semana siguiente">&#8594;</button>'+
      '</span>'+
      '<select id="sv-grupo" aria-label="Grupo">'+
        MIS_GRUPOS.map(function(g){
          return '<option value="'+escAttr(g.id)+'"'+(g.id===SV_GRUPO?' selected':'')+'>'+esc(g.nombre)+'</option>';
        }).join('')+
      '</select>'+
      (esEstaSemana ? '' : '<button type="button" class="pz-btn pz-btn--texto" data-pz-accion="sem-hoy">Volver a esta semana</button>')+
      /* ⚠️ LA PUERTA TIENE QUE DECIR QUÉ HAY DETRÁS. Antes esto ponía «Copiar
         de otra semana», que es UNA de las cuatro formas de montar la semana de
         golpe; las otras tres —pegar texto, subir un CSV y aplicar una
         plantilla guardada— no se nombraban en ninguna parte, así que quien
         buscaba la plantilla del CSV no tenía por dónde llegar. Y la plantilla
         va aparte y en directo: es un archivo que se baja, no hace falta
         desplegar nada ni leer nada para eso. */
      '<button type="button" class="pz-btn pz-btn--texto m-der" data-pz-accion="mas-formas">Montar la semana de una vez</button>'+
      '<button type="button" class="pz-btn pz-btn--texto" data-pz-accion="plantilla-csv">Descargar plantilla CSV</button>'+
      /* La plantilla para la IA es POR DEPORTE, así que solo sale la del deporte
         del grupo que estás mirando. Una lista de plantillas de deportes que no
         entrenas es ruido, y encima invita a bajarse la que no toca. Hoy hay dos,
         natación y atletismo; para añadir un deporte basta una línea en
         PLANTILLA_IA y el botón aparece solo, sin tocar nada más. */
      (plantillaIA(SV_GRUPO)
        ? '<button type="button" class="pz-btn pz-btn--texto" data-pz-accion="plantilla-ia">Plantilla de la semana (Excel)</button>'
        : '')+
    '</div>';

    if(SV_ESTADO === 'cargando'){
      vista.innerHTML = h + '<div class="tarjeta">'+APOLANA_UI.cargando('filas', 4)+'</div>';
      return;
    }
    if(SV_ESTADO === 'error'){
      vista.innerHTML = h + '<div class="tarjeta">'+APOLANA_UI.error('No hemos podido cargar esta semana',
        'Puede ser tu conexión. No se ha perdido nada: los entrenamientos que ya tenías puestos siguen ahí.',
        APOLANA_UI.boton('Volver a intentarlo'))+'</div>';
      var b = vista.querySelector('.ap-btn');
      if(b) b.addEventListener('click', cargarSemanaVista);
      conectarGrupoSemana();
      return;
    }

    /* En una semana pasada, lo primero que quiere saber el entrenador es
       si le contestaron. Va escrito, no solo en las fechas. */
    if(SV_LUNES <= todayISO){
      /* Se cuentan ATLETAS, no registros: si alguien apuntó tres días es una
         persona, no tres. Sumar los registros daría «12 de 21», que no
         significa nada y además suena a que hay veintiún atletas. */
      var quienes = {}, huboAlgo = false;
      SV_SES.forEach(function(s){
        if(s.fecha > todayISO) return;
        huboAlgo = true;
        (SV_REG[s.id]||[]).forEach(function(r){ quienes[r.atleta_id] = 1; });
      });
      var enElGrupo = atletasDeGrupo(SV_GRUPO).length;
      var cuantos = Object.keys(quienes).length;
      if(huboAlgo && enElGrupo){
        h += '<p class="sv-linea">'+cuantos+' de '+enElGrupo+
             (enElGrupo===1 ? ' atleta apuntó' : ' atletas apuntaron')+' algo esta semana.</p>';
      }
    }

    var porDia = {};
    SV_SES.forEach(function(s){ (porDia[s.fecha] = porDia[s.fecha] || []).push(s); });
    h += '<div class="sw-rej">';
    for(var i=0;i<7;i++){
      var f = addDias(SV_LUNES, i);
      h += tarjetaDia(f, porDia[f] || [], SV_GRUPO, f < todayISO);
    }
    h += '</div>';

    // La banda que quita la duda de quién ve qué
    if(borradores){
      var dias = SV_SES.filter(function(s){ return !s.publicada; })
        .map(function(s){ return diaSemana(s.fecha); });
      h += '<p class="banda-ambar"><b>El borrador del '+esc(dias.join(' y del '))+' no lo ve la familia hasta que lo publiques.</b> '+
           'Los atletas ven solo los publicados.</p>';
    } else if(puestas){
      h += '<p class="banda-ambar">Los atletas ven solo los entrenamientos <b>publicados</b>. Lo que dejes en borrador no lo ve nadie más que tú.</p>';
    }

    vista.innerHTML = h;
    conectarGrupoSemana();
  }

  function conectarGrupoSemana(){
    var sel = $('sv-grupo');
    if(!sel) return;
    sel.addEventListener('change', function(){
      SV_GRUPO = sel.value;
      // Las herramientas de tanda trabajan sobre el mismo grupo y la misma semana
      if($('sw-grupo')){ $('sw-grupo').value = SV_GRUPO; }
      cargarSemanaVista();
    });
  }

  // La primera vez que se entra se trae la semana en curso del primer grupo.
  function entrarSemana(){
    if(!MIS_GRUPOS.length || !$('sw-vista')) return;
    if(!SV_GRUPO) SV_GRUPO = MIS_GRUPOS[0].id;
    if(!SV_LUNES) SV_LUNES = lunesDe(todayISO);
    cargarSemanaVista();
  }

  // Ir a un día concreto en «Planificar un entrenamiento», sin duplicar editor
  function planificarDia(fecha, grupoId){
    irASeccion('planificar');
    if($('pl-grupo') && grupoId) $('pl-grupo').value = grupoId;
    limpiarFormulario();
    if($('pl-fecha')) $('pl-fecha').value = fecha;
    pintarModo();
    cargarSesionesGrupo(grupoId || ($('pl-grupo') ? $('pl-grupo').value : ''));
    window.scrollTo(0,0);
  }

  async function abrirEnPlanificador(sesId, grupoId, duplicar){
    irASeccion('planificar');
    if($('pl-grupo') && grupoId){
      $('pl-grupo').value = grupoId;
      if($('pl-material')) $('pl-material').checked = grupoEsDeAgua(grupoId);
    }
    window.scrollTo(0,0);
    await cargarSesionesGrupo(grupoId || ($('pl-grupo') ? $('pl-grupo').value : ''));
    var s = window.__SESIONES_GRUPO && window.__SESIONES_GRUPO[sesId];
    if(!s) return;
    cargarSesionEnForm(s);
    if($('pl-editar')) $('pl-editar').value = sesId;
    /* Duplicar es el botón que ya existe en el editor: se pulsa por él,
       para que no haya dos formas distintas de copiar un entrenamiento. */
    if(duplicar && $('pl-duplicar')) $('pl-duplicar').click();
  }

  /* «Ver el detalle» de un día pasado: lo que apuntó cada atleta, que ya
     vive en Feedback con lo hecho, lo que no se hizo y el «lo cambié por».
     `atletaId` es opcional y lo trae quien llega desde la ficha de alguien:
     entonces no se viene a leer el entrenamiento entero, se viene a leer lo
     de esa persona, y la pantalla se para en su tarjeta. */
  async function verDetalleSesion(sesId, atletaId){
    irASeccion('feedback');
    window.scrollTo(0,0);
    var sel = $('fb-sesion');
    if(!sel) return;
    if(!FB_SESIONES[sesId]) await cargarSesionesFeedback();
    /* El desplegable de Feedback trae los 120 entrenamientos más recientes, y
       el historial va hacia atrás sin límite: uno de hace meses puede no
       estar en la lista. No se deja al entrenador sin el detalle por eso —se
       añade a mano el que acaba de pulsar—, porque si no, el «Ver el detalle»
       de un día antiguo diría «no hay atletas en este grupo», que es mentira. */
    if(!FB_SESIONES[sesId]){
      var s = SV_SES.concat(CV_SES).filter(function(x){ return x.id === sesId; })[0];
      /* Y si tampoco está ahí —se ha llegado desde la ficha de un atleta, sin
         pasar por el calendario ni por la semana—, se pregunta por él. */
      if(!s){
        var rs = await sb.from('sesiones').select('id,fecha,titulo,grupo_id,publicada').eq('id', sesId).maybeSingle();
        if(!rs.error && rs.data) s = rs.data;
      }
      if(s){
        FB_SESIONES[sesId] = s;
        var op = document.createElement('option');
        op.value = s.id;
        op.textContent = formatFecha(s.fecha)+' · '+(nombreGrupo(s.grupo_id)||'')+' · '+
                         (s.titulo||'sin título')+(s.publicada ? '' : ' (borrador)');
        sel.disabled = false;
        sel.appendChild(op);
      }
    }
    sel.value = sesId;
    await pintarFeedback(sesId, atletaId);
  }
