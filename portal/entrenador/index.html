      cont.innerHTML = cab + APOLANA_UI.error('No hemos podido ver quién se ha apuntado',
        'Puede ser tu conexión. Nadie ha perdido su plaza: la lista sigue guardada.',
        APOLANA_UI.boton('Volver a intentarlo')) + '</div>';
      var ba = cont.querySelector('.ap-btn');
      if(ba) ba.addEventListener('click', refrescarApuntados);
      return;
    }

    // Sin entrenos abiertos no hay tarjeta: una línea corta y el manual plegado.
    if(!APUNTADOS.sesiones.length){
      cont.innerHTML =
        '<div class="ap-nada"><p>No tienes ningún entrenamiento abierto al club.</p>'+
        '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
          '<p class="pista">Ve a <strong>Planificar un entrenamiento</strong>, marca «¿Abierto para apuntarse?», pon las plazas y publícalo: '+
          'saldrá en el calendario del club con el botón de apuntarse y aquí verás quién viene.</p>'+
        '</details></div>';
      return;
    }

    var html = cab + '<p class="vacio" style="margin-top:-6px;margin-bottom:14px;">Tus entrenamientos abiertos al club, de hoy en adelante.</p>';

    APUNTADOS.sesiones.forEach(function(s){
      var tot = APUNTADOS.totales[s.id];
      var mios = APUNTADOS.porSesion[s.id] || [];
      var nTotal = tot ? tot.apuntados : mios.length;
      var otros = Math.max(0, nTotal - mios.length);

      var cuando = formatFecha(s.fecha) + (s.hora ? ' · '+horaCorta(s.hora) : '');
      var contador = nTotal + (s.plazas ? '/'+s.plazas : '') + ' apuntado'+(nTotal===1?'':'s');
      var completo = !!(s.plazas && nTotal >= s.plazas);

      html += '<div class="ap-ses">'+
        '<div class="ap-cab">'+
          '<span class="sw-fecha">'+esc(cuando)+'</span>'+
          '<strong>'+esc(s.titulo || 'Entrenamiento abierto')+'</strong>'+
          (s.lugar ? '<span class="pill">'+esc(s.lugar)+'</span>' : '')+
          '<span style="flex:1 1 auto"></span>'+
          '<span class="lst-contador'+(nTotal?'':' cero')+'"'+(completo?' style="color:#A8453F"':'')+'>'+esc(contador)+'</span>'+
        '</div>'+
        '<p class="pista" style="margin-top:0;">'+esc(nombreGrupo(s.grupo_id))+' · abierto a '+esc(textoSecciones(s.abierta_a))+
          (s.plazas ? ' · '+(completo ? 'completo' : Math.max(0, s.plazas - nTotal)+' plaza(s) libres') : ' · sin límite de plazas')+'</p>'+
        (!s.publicada ? '<p class="dest-aviso">Está en <strong>borrador</strong>: hasta que no lo publiques no sale en el calendario y nadie se puede apuntar.</p>' : '');

      if(mios.length){
        html += '<ul class="ap-lista">'+mios.map(function(i){
          var at = atletaPorId(i.atleta_id);
          var nom = at ? nombreAtleta(at) : 'Atleta de otro grupo';
          return '<li><span style="flex:1 1 auto;color:var(--navy);font-family:var(--fuente-texto);font-size:14px;">'+esc(nom)+'</span>'+
            '<span>'+esc(formatFecha(String(i.created_at||'').slice(0,10)))+'</span>'+
            '<button type="button" class="ap-quitar" data-sesion="'+s.id+'" data-atleta="'+i.atleta_id+'">Quitar</button></li>';
        }).join('')+'</ul>';
      } else if(!otros){
        html += '<p class="vacio" style="margin:8px 0 0;">Todavía no se ha apuntado nadie.</p>';
      }

      if(otros){
        html += '<p class="pista" style="margin-bottom:0;"><strong>'+otros+' apuntado(s) de otros grupos.</strong></p>'+
          '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
            '<p class="pista">Cuentan para las plazas, pero sus nombres no salen aquí: son atletas de otros entrenadores. Administración sí los ve todos.</p>'+
          '</details>';
      }
      html += '</div>';
    });

    html += '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
        '<p class="pista">Si quitas a alguien, su plaza queda libre y se puede volver a apuntar mientras el entrenamiento siga abierto.</p>'+
      '</details>'+
      '<span class="msg" id="ap-msg"></span></div>';

    cont.innerHTML = html;

    cont.querySelectorAll('.ap-quitar').forEach(function(b){
      b.addEventListener('click', async function(){
        var sid = b.getAttribute('data-sesion'), aid = b.getAttribute('data-atleta');
        var at = atletaPorId(aid);
        if(!await APX.confirm('¿Quitar a '+(at ? nombreAtleta(at) : 'este atleta')+' de este entrenamiento? Su plaza queda libre.', { aceptar:'Quitar', peligro:true })) return;
        b.disabled = true;
        var r = await sb.from('sesion_inscripciones').delete().eq('sesion_id', sid).eq('atleta_id', aid).select('id');
        var m = $('ap-msg');
        if(r.error){ if(m){ m.textContent = 'Error: '+r.error.message; m.className = 'msg error'; } b.disabled = false; return; }
        if(!r.data || !r.data.length){
          if(m){ m.textContent = 'No se ha podido quitar: ese atleta no es tuyo. Tiene que hacerlo su entrenador o administración.'; m.className = 'msg error'; }
          b.disabled = false; return;
        }
        await refrescarApuntados();
        var m2 = $('ap-msg'); if(m2){ m2.textContent = 'Quitado de la lista ✓'; m2.className = 'msg ok'; }
      });
    });
  }

  async function refrescarApuntados(){
    if(!$('ap-cont')) return;
    APUNTADOS.cargando = true; pintarApuntados();
    await cargarApuntados();
    APUNTADOS.cargando = false; pintarApuntados();
  }
  refrescarApuntados();

  // ============================================================
  // SECCIÓN 1b · PASAR LISTA
  // ------------------------------------------------------------
  // El entrenador elige grupo y día (hoy por defecto) y marca a
  // cada atleta de un toque. Se guarda en la tabla `asistencia`,
  // con una fila por atleta y día (ver migraciones/023).
  //   · marcado ✓  -> fila con presente = true
  //   · marcado ✕  -> fila con presente = false
  //   · sin marcar -> NO hay fila (se borra si la había)
  // Por eso la lista se puede corregir después: al volver al mismo
  // día se recupera lo guardado y se vuelve a escribir encima.
  // Si la familia avisó de la falta (tabla `ausencias`), se ve en
  // la fila del atleta antes de marcar.
  // ============================================================
  var MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function formatFechaLarga(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); if(isNaN(d.getTime())) return ''; return d.getDate()+' de '+MESES_LARGOS[d.getMonth()]; }
  function iniciales(x){
    var n=(x.nombre||'').trim(), a=(x.apellidos||'').trim();
    var i=(n?n[0]:'')+(a?a[0]:(n.length>1?n[1]:''));
    return i.toUpperCase() || '··';
  }
  function edadDe(iso){
    if(!iso) return null;
    var d=new Date(iso+'T00:00:00'); if(isNaN(d.getTime())) return null;
    var h=new Date(), e=h.getFullYear()-d.getFullYear();
    var m=h.getMonth()-d.getMonth();
    if(m<0 || (m===0 && h.getDate()<d.getDate())) e--;
    return (e>=0 && e<120) ? e : null;
  }
  function diasCortos(arr){
    if(!arr || !arr.length) return '';
    var cortos = { lunes:'L', martes:'M', miercoles:'X', jueves:'J', viernes:'V', sabado:'S', domingo:'D' };
    var l = arr.map(function(d){ return cortos[norm(d).replace(/\s/g,'')] || d; });
    return l.length>1 ? l.slice(0,-1).join(', ')+' y '+l[l.length-1] : l[0];
  }
  // Atletas que se pasan lista: los del grupo que no están de baja.
  function atletasParaLista(grupoId){
    return MIS_ATLETAS.filter(function(x){ return estaEn(x, grupoId) && x.estado!=='baja'; });
  }

  /* `sucio`  = hay marcas puestas a mano que todavía no están en la base.
     `aviso`  = el mensaje del pie (guardado, error, etc.), guardado en el
                estado para que no se borre al repintar la lista.
     `sinEntrenador` = atletas de este grupo a los que no les consta ningún
                entrenador en su ficha. Sí salen en la lista y sí se les puede
                pasar; lo que falta es quién los lleva, y eso hay que decirlo
                porque nadie más se va a enterar.
                (Aquí antes se avisaba de otra cosa: de los del grupo que no
                estaban a tu nombre, porque no salían en la lista. Desde que
                la lista es del grupo sí salen, así que ese aviso decía algo
                que ya no era verdad. Lo que sí seguía siendo verdad —que a
                alguno no le consta entrenador— es lo que se dice ahora.) */
  var LST = { grupo:'', fecha: todayISO, marcas:{}, guardadas:{}, ausencias:{}, sesion:null, filtro:'', buscando:false, cargando:false,
              sucio:false, guardando:false, aviso:null, sinEntrenador:[], version:0 };

  /* BORRADOR EN EL PROPIO MÓVIL
     Aunque al cambiar de grupo o de día ya se pregunta, la pestaña de un móvil
     se puede cerrar sola a pie de pista. Cada toque deja copia de lo marcado en
     el teléfono; al volver a esa misma lista se recupera. Se borra en cuanto
     queda guardado en la base, así que nunca reaparece nada viejo. */
  var BORRADOR = 'apolana.lista.entrenador';
  function guardarBorrador(){
    try {
      var m = {};
      Object.keys(LST.marcas).forEach(function(id){ m[id] = (LST.marcas[id]===undefined ? null : LST.marcas[id]); });
      localStorage.setItem(BORRADOR, JSON.stringify({ grupo:LST.grupo, fecha:LST.fecha, marcas:m }));
    } catch(e){}
  }
  function borrarBorrador(){ try { localStorage.removeItem(BORRADOR); } catch(e){} }
  function recuperarBorrador(){
    var b = null;
    try { b = JSON.parse(localStorage.getItem(BORRADOR) || 'null'); } catch(e){ b = null; }
    if(!b || b.grupo!==LST.grupo || b.fecha!==LST.fecha || !b.marcas) return false;
    var distinto = false;
    Object.keys(b.marcas).forEach(function(id){
      var v = (b.marcas[id]===null ? undefined : b.marcas[id]);
      if(LST.marcas[id] !== v){
        if(v===undefined) delete LST.marcas[id]; else LST.marcas[id] = v;
        distinto = true;
      }
    });
    return distinto;
  }

  async function cargarLista(){
    var atls = atletasParaLista(LST.grupo);
    LST.marcas = {}; LST.guardadas = {}; LST.ausencias = {}; LST.sesion = null;
    LST.sucio = false; LST.aviso = null; LST.sinEntrenador = []; NOTAS = {};

    /* A quién no le consta entrenador. Ya no hace falta preguntárselo a la
       base: los atletas del grupo están todos cargados, así que se mira lo
       que ya tenemos y se ahorran dos consultas en cada lista. */
    LST.sinEntrenador = atls.filter(function(x){ return !x.entrenador_id; });

    if(!atls.length || !LST.fecha) return;
    var ids = atls.map(function(x){ return x.id; });

    /* La lista es de UN grupo y de UN día. Sin el grupo, un chaval que
       entrene con dos grupos el mismo día —primera y segunda hora de la
       escuela— aparecía marcado en los dos, y desmarcarlo en uno borraba
       la marca que había puesto el otro entrenador. */
    var asis = await sb.from('asistencia').select('atleta_id,presente')
      .eq('fecha', LST.fecha).eq('grupo_id', LST.grupo).in('atleta_id', ids);
    if(asis.error){
      /* Sin esto, un fallo de red se vería como "no hay nadie pasado" y el
         entrenador repetiría la lista creyendo que se había perdido. */
      LST.aviso = { tipo:'error', texto:'No se ha podido leer la lista de ese día: '+(asis.error.message||'sin conexión')+'. Vuelve a cargarla antes de marcar.' };
    } else if(asis.data){
      asis.data.forEach(function(r){ LST.marcas[r.atleta_id] = !!r.presente; LST.guardadas[r.atleta_id] = true; });
    }

    // Faltas avisadas por la familia (tabla `ausencias`, del portal de
    // familias). Si el atleta tiene falta avisada y todavía no se le ha
    // pasado lista ese día, se deja PRERRELLENADO como ausente: el
    // entrenador lo ve y puede cambiarlo si al final sí vino.
    /* Se pregunta POR EL GRUPO, no por la tabla. La tabla de ausencias solo la
       lee administración, la familia y el entrenador que figure en la ficha:
       preguntándole a ella, el entrenador del grupo no veía ni una y ponía
       faltas a quien había avisado por la mañana. La función devuelve las de
       su grupo; el motivo solo si además es quien lo lleva, porque un motivo
       suele ser salud y eso no es del grupo. */
    try {
      var au = await sb.rpc('apo_faltas_avisadas', { p_grupos: [LST.grupo], p_fecha: LST.fecha });
      if(!au.error && au.data) au.data.forEach(function(r){
        LST.ausencias[r.atleta_id] = r;
        if(LST.marcas[r.atleta_id]===undefined) LST.marcas[r.atleta_id] = false;
      });
    } catch(e){}

    var se = await sb.from('sesiones').select('id,titulo,fecha,publicada').eq('grupo_id', LST.grupo).eq('fecha', LST.fecha).order('publicada',{ascending:false}).limit(1);
    if(!se.error && se.data && se.data.length) LST.sesion = se.data[0];

    /* Las notas de ESE día: así el icono de cada fila ya sale marcado si
       alguien apuntó algo antes (por ejemplo, al corregir la lista). */
    await cargarNotasDia(ids, LST.fecha);

    if(recuperarBorrador()){
      LST.sucio = true;
      LST.aviso = { tipo:'pendiente', texto:'Se han recuperado las marcas que quedaron sin guardar en este móvil. Repásalas y dale a Guardar lista.' };
    }
  }

  function contadorLista(){
    var atls = atletasParaLista(LST.grupo);
    var pres = 0, marcados = 0;
    atls.forEach(function(x){ if(LST.marcas[x.id]!==undefined){ marcados++; if(LST.marcas[x.id]) pres++; } });
    return { presentes: pres, marcados: marcados, total: atls.length };
  }

  function pintarLista(){
    var cont = $('lst-cont');
    if(!cont) return;
    if(LST.cargando){ cont.innerHTML = APOLANA_UI.cargando('filas', 6); return; }
    var gr = null;
    for(var i=0;i<MIS_GRUPOS.length;i++) if(MIS_GRUPOS[i].id===LST.grupo) gr = MIS_GRUPOS[i];
    var atls = atletasParaLista(LST.grupo);
    var c = contadorLista();

    var ctx = [formatFecha(LST.fecha), (gr && gr.horario ? gr.horario : ''), (gr ? gr.nombre : '')].filter(Boolean).join(' · ');
    var cab = '<div class="lst-cab"><div><span class="lst-ctx">'+marcarNombres(esc(ctx))+'</span><span class="lst-tit">Pasar lista</span></div>'+
      '<span class="lst-contador'+(c.presentes?'':' cero')+'">'+c.presentes+'/'+c.total+'</span></div>';

    /* A estos les falta el entrenador en su ficha. La lista se les pasa con
       normalidad —eso ya no depende de la ficha, sino del grupo—, pero todo
       lo demás sí: las observaciones, las lesiones y el contacto de su
       familia los lleva quien figure ahí, y si no figura nadie, nadie. */
    var sobra = LST.sinEntrenador.length
      ? '<div class="lst-avisos"><strong>'+LST.sinEntrenador.length+' atleta'+(LST.sinEntrenador.length>1?'s de este grupo no tienen':' de este grupo no tiene')+' entrenador en su ficha</strong><ul>'+
          LST.sinEntrenador.map(function(x){ return '<li><b>'+esc(nombreAtleta(x))+'</b></li>'; }).join('')+
        '</ul><p>La lista se les pasa igual. Lo que no se puede es escribirles observaciones ni ver el contacto de su familia: eso lo hace quien los lleva. Pídele al club que se lo asigne.</p></div>'
      : '';

    if(!atls.length){
      cont.innerHTML = cab + sobra + vacioHTML(icVacGrupo, 'Este grupo no tiene atletas en activo. Cuando el club te asigne atletas, aparecerán aquí para pasar lista.');
      return;
    }

    var filtro = norm(LST.filtro);
    var visibles = filtro ? atls.filter(function(x){ return norm(nombreAtleta(x)).indexOf(filtro)>-1; }) : atls;
    var repFotos = repartoFotos(atls);

    // Aviso arriba del todo con las faltas que ha avisado la familia.
    var conAviso = atls.filter(function(x){ return LST.ausencias[x.id]; });
    var avisos = conAviso.length
      ? '<div class="lst-avisos"><strong>'+conAviso.length+' falta'+(conAviso.length>1?'s':'')+' avisada'+(conAviso.length>1?'s':'')+' por la familia</strong><ul>'+
          conAviso.map(function(x){
            var a = LST.ausencias[x.id];
            return '<li><b>'+esc(nombreAtleta(x))+'</b> — '+esc(a.motivo || 'no viene')+(a.avisado_por_nombre?' <span>(avisó '+esc(a.avisado_por_nombre)+')</span>':'')+'</li>';
          }).join('')+
        '</ul><p>Ya están marcados como ausentes. Si al final vinieron, cámbialo con el ✓.</p></div>'
      : '';

    /* EL AVISO DE LAS FOTOS VA AQUÍ, y no solo en la ficha del atleta.
       Nadie abre una ficha antes de sacar el móvil. Pasar lista es la
       única pantalla que un entrenador tiene abierta a pie de pista con
       todos los nombres delante, y es de donde arranca la sesión: si el
       aviso no se ve aquí, no se ve el día que hace falta.
       Va debajo de las faltas avisadas —eso es de ahora mismo, esto es
       de todo el curso— y encima de la lista, para que no haya que
       bajar a buscarlo. */
    var acciones = sobra + avisos + avisoFotosHTML(atls) + '<div class="lst-acciones">'+
      '<button type="button" id="lst-todos">Marcar todos</button>'+
      '<button type="button" id="lst-buscar">Buscar</button>'+
    '</div>'+
    (LST.buscando ? '<div class="lst-buscar"><input id="lst-filtro" placeholder="Escribe un nombre…" value="'+escAttr(LST.filtro)+'" autocomplete="off"></div>' : '');

    var filas = visibles.map(function(x){
      var m = LST.marcas[x.id];
      var av = LST.ausencias[x.id];
      var sub = '';
      if(av){ sub = '<span class="lst-sub avisada">Avisó: '+esc(av.motivo || 'no viene')+(av.avisado_por_nombre?' · '+esc(av.avisado_por_nombre):'')+'</span>'; }
      else if(x.estado==='prueba'){ sub = '<span class="lst-sub prueba">De prueba'+(x.fecha_prueba_fin?' · acaba el '+esc(formatFechaLarga(x.fecha_prueba_fin)):'')+'</span>'; }
      else if(x.estado==='lesionado'){ sub = '<span class="lst-sub avisada">Lesionado</span>'; }
      var clase = (m===false || av) ? ' es-ausente' : (x.estado==='prueba' && m!==false ? ' es-prueba' : '');
      var nn = (NOTAS[x.id]||[]).length;
      var etiqNota = nn ? nn+(nn>1?' observaciones de este día · ':' observación de este día · ')+nombreAtleta(x) : 'Añadir una observación de este día · '+nombreAtleta(x);
      return '<div class="lst-fila'+clase+'" data-atleta="'+x.id+'">'+
        '<span class="avatar">'+esc(iniciales(x))+'</span>'+
        '<span class="lst-nom"><button type="button" class="lst-ficha" data-atleta="'+x.id+'">'+esc(nombreAtleta(x))+'</button>'+sub+etiqFoto(x, !repFotos.ninguno)+'</span>'+
        '<button type="button" class="nd-btn'+(nn?' tiene':'')+'" data-nota="'+x.id+'" title="'+escAttr(etiqNota)+'" aria-label="'+escAttr(etiqNota)+'">'+icNotaDia+'</button>'+
        '<span class="seg">'+
          '<button type="button" class="si'+(m===true?' on':'')+'" data-atleta="'+x.id+'" data-val="si" aria-label="Presente" title="Presente">✓</button>'+
          '<button type="button" class="no'+(m===false?' on':'')+'" data-atleta="'+x.id+'" data-val="no" aria-label="Ausente" title="Ausente">✕</button>'+
        '</span>'+
      '</div>';
    }).join('');

    if(!visibles.length) filas = vacioHTML(icVacGrupo, 'Ningún atleta con ese nombre.');

    /* El aviso vive en el estado: así sobrevive a los repintados y no se pierde
       el «Lista guardada ✓» (ni un error) en cuanto se toca otro botón. */
    var avisoPie = LST.aviso || (LST.sucio ? { tipo:'pendiente', texto:'Cambios sin guardar' } : null);
    var pie = '<div class="lst-pie">'+
      '<p class="lst-resumen">'+c.presentes+' de '+c.total+' presentes'+(c.marcados<c.total ? ' · '+(c.total-c.marcados)+' sin marcar' : '')+'</p>'+
      '<button class="btn btn--primario" id="lst-guardar"'+(LST.guardando?' disabled':'')+'>'+(LST.guardando?'Guardando…':'Guardar lista')+'</button>'+
      '<span class="msg'+(avisoPie?' '+avisoPie.tipo:'')+'" id="lst-msg">'+(avisoPie?esc(avisoPie.texto):'')+'</span>'+
      '<p class="privado-linea">El icono de observaciones sirve para apuntar lo que pase con un atleta ese día. Son observaciones internas del club: la familia no las ve.</p>'+
    '</div>'+
    '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
      '<p class="pista">La familia ve la asistencia en su portal. El aviso automático de las faltas sin avisar todavía no está en marcha.</p>'+
    '</details>';

    cont.innerHTML = cab + acciones + '<div class="lst-lista">'+filas+'</div>' + pie;

    /* La FILA ENTERA marca presente, no solo la casilla (fundamentos 28g): a
       pie de pista y con una mano ocupada lo que falla no es leer, es acertar
       con el dedo. Los botones de dentro (el nombre, la nota y el ✓ / ✕)
       siguen mandando sobre la fila. */
    cont.querySelectorAll('.lst-fila').forEach(function(fila){
      fila.addEventListener('click', function(ev){
        if(ev.target.closest && ev.target.closest('button')) return;
        var id = fila.getAttribute('data-atleta');
        LST.marcas[id] = (LST.marcas[id]===true) ? undefined : true;   // volver a pulsar lo desmarca
        if(LST.marcas[id]===undefined) delete LST.marcas[id];
        LST.sucio = true; LST.aviso = null; LST.version++;
        guardarBorrador();
        pintarLista();
      });
    });

    cont.querySelectorAll('.seg button').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-atleta'), val = b.getAttribute('data-val')==='si';
        LST.marcas[id] = (LST.marcas[id]===val) ? undefined : val;   // volver a pulsar lo desmarca
        if(LST.marcas[id]===undefined) delete LST.marcas[id];
        LST.sucio = true; LST.aviso = null; LST.version++;
        guardarBorrador();
        pintarLista();
      });
    });
    cont.querySelectorAll('.lst-ficha').forEach(function(b){
      b.addEventListener('click', function(){ abrirFicha(b.getAttribute('data-atleta')); });
    });
    cont.querySelectorAll('.nd-btn').forEach(function(b){
      b.addEventListener('click', function(){ abrirNota(b.getAttribute('data-nota')); });
    });
    $('lst-todos').addEventListener('click', function(){
      // No pisa a quien tiene falta avisada por la familia.
      visibles.forEach(function(x){ if(!LST.ausencias[x.id]) LST.marcas[x.id] = true; });
      LST.sucio = true; LST.aviso = null; LST.version++;
      guardarBorrador();
      pintarLista();
    });
    $('lst-buscar').addEventListener('click', function(){
      LST.buscando = !LST.buscando;
      if(!LST.buscando) LST.filtro = '';
      pintarLista();
      if(LST.buscando && $('lst-filtro')) $('lst-filtro').focus();
    });
    if($('lst-filtro')) $('lst-filtro').addEventListener('input', function(){
      LST.filtro = $('lst-filtro').value;
      var pos = $('lst-filtro').selectionStart;
      pintarLista();
      var f = $('lst-filtro'); if(f){ f.focus(); try { f.setSelectionRange(pos,pos); } catch(e){} }
    });
    $('lst-guardar').addEventListener('click', guardarLista);
  }

  /* Devuelve true solo si TODO ha quedado escrito en la base. */
  async function guardarLista(){
    if(LST.guardando) return false;                 // dos toques seguidos = un solo guardado
    var atls = atletasParaLista(LST.grupo);
    /* Se manda SOLO lo de esta lista, y quitar a alguien se dice con un
       hueco en blanco. Antes se mandaban las marcas por un lado y los
       borrados por otro, y el borrado iba sin grupo: se llevaba por
       delante la lista que otro entrenador había pasado ese mismo día.
       Ahora la base recibe las dos cosas juntas y solo toca este grupo. */
    var marcas = {}, nMarcadas = 0, nQuitadas = 0;
    atls.forEach(function(x){
      if(LST.marcas[x.id]===undefined){
        if(LST.guardadas[x.id]){ marcas[x.id] = null; nQuitadas++; }
      } else {
        marcas[x.id] = LST.marcas[x.id]; nMarcadas++;
      }
    });
    if(!nMarcadas && !nQuitadas){
      LST.aviso = { tipo:'error', texto:'No has marcado a nadie todavía.' };
      pintarLista(); return false;
    }

    LST.guardando = true; LST.aviso = { tipo:'', texto:'Guardando…' };
    var version0 = LST.version;   // por si se marca a alguien más mientras se guarda
    pintarLista();
    try {
      var res = await sb.rpc('apo_pasar_lista', {
        p_grupo: LST.grupo, p_fecha: LST.fecha, p_marcas: marcas,
        p_sesion: (LST.sesion ? LST.sesion.id : null)
      });
      if(res.error) throw res.error;
      /* La base devuelve cómo ha quedado la lista de este grupo y este día,
         que es más fiable que dar por hecho lo que acabamos de mandar. */
      var guardado = res.data || {};
      LST.guardadas = {};
      Object.keys(guardado).forEach(function(id){ LST.guardadas[id] = true; });
      LST.sucio = (LST.version !== version0);   // si tocó algo mientras tanto, sigue pendiente
      LST.guardando = false;
      if(LST.sucio) guardarBorrador(); else borrarBorrador();
      var c = contadorLista();
      var hora = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      LST.aviso = LST.sucio ? null : { tipo:'ok', texto:'Lista guardada ✓ · '+c.presentes+' de '+c.total+' presentes · '+hora };
      pintarLista();
      return !LST.sucio;
    } catch(e){
      /* Nada se toca en pantalla: las marcas siguen ahí para reintentar. */
      LST.guardando = false;
      LST.aviso = { tipo:'error', texto:'NO se ha guardado: '+((e&&e.message)||e)+'. Las marcas siguen aquí; comprueba la conexión y vuelve a darle a Guardar lista.' };
      pintarLista();
      if(window.APX) APX.toast('No se ha guardado la lista. Vuelve a intentarlo.','error');
      return false;
    }
  }

  /* Cambiar de grupo o de día repinta la lista desde cero: si hay marcas sin
     guardar hay que guardarlas antes, o se pierden sin que nadie se entere.
     Se guarda (en vez de descartar) porque perder una lista cuesta repetirla
     entera y una marca de más se corrige en dos toques. */
  async function puedoDejarLaLista(){
    if(!LST.sucio) return true;
    var ok = window.APX
      ? await APX.confirm('Tienes marcas sin guardar en esta lista. Si sales ahora se perderían.', { aceptar:'Guardar y salir', cancelar:'Seguir en la lista' })
      : true;
    if(!ok) return false;
    return await guardarLista();
  }

  window.addEventListener('beforeunload', function(e){
    if(LST.sucio){ e.preventDefault(); e.returnValue = ''; return ''; }
  });

  async function refrescarLista(){
    LST.cargando = true; pintarLista();
    await cargarLista();
    LST.cargando = false; pintarLista();
  }

  /* ============================================================
     NOTA DEL DÍA
     ------------------------------------------------------------
     Apuntar en el momento lo que ha pasado con un atleta («hoy ha
     roto X y no ha hecho caso»), para poder enseñárselo luego a la
     familia en el informe del panel. Va en la tabla `notas_atleta`,
     que SOLO lee el equipo técnico: ni el atleta ni la familia la
     ven (migraciones/009 y 050).
     La nota se guarda SOLA, sin tocar la lista: se puede apuntar
     aunque la asistencia todavía no se haya guardado, y borrar o
     rehacer la lista no se lleva la nota por delante.
     Es la misma ventana que hay en el panel del club («En la pista»).
     ============================================================ */
  var TIPOS_NOTA = [
    { v:'comportamiento', t:'Comportamiento' },
    { v:'lesion',         t:'Lesión' },
    { v:'material',       t:'Material' },
    { v:'familia',        t:'Familia' },
    { v:'otro',           t:'Otro' }
  ];
  function tipoTexto(v){
    for(var i=0;i<TIPOS_NOTA.length;i++) if(TIPOS_NOTA[i].v===v) return TIPOS_NOTA[i].t;
    return 'Otro';
  }
  var icNotaDia = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7.5z"/><path d="M15 4v4h4"/><path d="M8.5 12.5h7M8.5 16h4.5"/></svg>';

  /* NOTAS[atleta_id] = notas de ese atleta EN EL DÍA de la lista. */
  var NOTAS = {}, AUTORES = {};
  var NOTA = { atleta:null, editando:'', guardando:false, msg:'', error:false };

  async function cargarNotasDia(ids, fecha){
    NOTAS = {};
    if(!ids || !ids.length || !fecha) return;
    var r = await sb.from('notas_atleta')
      .select('id,atleta_id,texto,tipo,fecha,autor_id,created_at')
      .eq('fecha', fecha).in('atleta_id', ids)
      .order('created_at', { ascending:true });
    if(r.error || !r.data) return;
    r.data.forEach(function(n){ (NOTAS[n.atleta_id] = NOTAS[n.atleta_id] || []).push(n); });
    /* Los nombres de quien escribió cada nota (solo si hace falta). */
    var faltan = [];
    r.data.forEach(function(n){
      if(n.autor_id && n.autor_id!==perfil.id && !AUTORES[n.autor_id] && faltan.indexOf(n.autor_id)<0) faltan.push(n.autor_id);
    });
    if(faltan.length){
      try {
        var p = await sb.from('perfiles').select('id,nombre,apellidos').in('id', faltan);
        if(!p.error && p.data) p.data.forEach(function(x){ AUTORES[x.id] = [x.nombre,x.apellidos].filter(Boolean).join(' '); });
      } catch(e){}
    }
  }
  function autorTexto(n){
    if(n.autor_id && n.autor_id===perfil.id) return 'Lo apuntaste tú';
    var nom = n.autor_id ? AUTORES[n.autor_id] : '';
    return nom ? 'Lo apuntó '+nom : 'Equipo técnico';
  }
  function horaDe(iso){
    if(!iso) return '';
    var d = new Date(iso); if(isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }

  function abrirNota(atletaId){
    var at = null;
    MIS_ATLETAS.forEach(function(x){ if(x.id===atletaId) at = x; });
    if(!at) return;
    NOTA = { atleta:at, editando:'', guardando:false, msg:'', error:false };
    $('modal-nota').classList.remove('oculto');
    pintarModalNota();
  }
  function cerrarNota(){
    $('modal-nota').classList.add('oculto');
    $('modal-nota-caja').innerHTML = '';
    NOTA = { atleta:null, editando:'', guardando:false, msg:'', error:false };
    pintarLista();
  }

  function pintarModalNota(){
    var at = NOTA.atleta; if(!at) return;
    var caja = $('modal-nota-caja');
    var lista = NOTAS[at.id] || [];
    var enEdicion = null;
    lista.forEach(function(n){ if(n.id===NOTA.editando) enEdicion = n; });

    var notasHTML = lista.length
      ? '<div class="mn-lista">'+lista.map(function(n){
          return '<div class="nd-item'+(n.id===NOTA.editando?' editandose':'')+'">'+
            '<div class="nm"><span class="nd-tipo t-'+escAttr(n.tipo||'otro')+'">'+esc(tipoTexto(n.tipo))+'</span>'+
              '<span class="nd-quien">'+esc(autorTexto(n))+(horaDe(n.created_at)?' · '+esc(horaDe(n.created_at)):'')+'</span></div>'+
            '<p class="nd-txt">'+esc(n.texto)+'</p>'+
            '<div class="nd-acc">'+
              '<button type="button" class="nd-lin" data-editar="'+escAttr(n.id)+'">Editar</button>'+
              '<button type="button" class="nd-lin peligro" data-borrar="'+escAttr(n.id)+'">Borrar</button>'+
            '</div></div>';
        }).join('')+'</div>'
      : '';

    var tipoSel = enEdicion ? (enEdicion.tipo||'otro') : 'comportamiento';
    caja.innerHTML =
      '<h3>'+esc(nombreAtleta(at))+'</h3>'+
      '<p class="mn-sub">Observaciones del '+esc(formatFecha(LST.fecha))+'</p>'+
      notasHTML +
      '<label for="mn-tipo">'+(enEdicion?'Corrige la observación':'Qué ha pasado')+'</label>'+
      '<select id="mn-tipo">'+TIPOS_NOTA.map(function(t){
        return '<option value="'+t.v+'"'+(t.v===tipoSel?' selected':'')+'>'+t.t+'</option>';
      }).join('')+'</select>'+
      '<label for="mn-texto">En dos líneas</label>'+
      '<textarea id="mn-texto" placeholder="Ha roto un cono y no ha hecho caso cuando se le ha llamado la atención.">'+esc(enEdicion?enEdicion.texto:'')+'</textarea>'+
      '<div class="mn-acc">'+
        '<button type="button" class="btn btn--primario" id="mn-guardar"'+(NOTA.guardando?' disabled':'')+'>'+
          (NOTA.guardando ? 'Guardando…' : (enEdicion ? 'Guardar cambios' : 'Guardar observación'))+'</button>'+
        '<button type="button" class="btn btn--neutro" id="mn-cerrar">'+(enEdicion?'Dejarlo como estaba':'Cerrar')+'</button>'+
        '<span class="mn-msg'+(NOTA.error?' error':'')+'">'+esc(NOTA.msg)+'</span>'+
      '</div>'+
      '<p class="mn-privado">Esta observación es interna del club: la ve el equipo técnico y nadie más. La familia y el atleta no la ven en su portal.</p>';

    $('mn-cerrar').addEventListener('click', function(){
      if(NOTA.editando){ NOTA.editando=''; NOTA.msg=''; NOTA.error=false; pintarModalNota(); return; }
      cerrarNota();
    });
    $('mn-guardar').addEventListener('click', guardarNota);
    caja.querySelectorAll('[data-editar]').forEach(function(b){
      b.addEventListener('click', function(){
        NOTA.editando = b.getAttribute('data-editar'); NOTA.msg=''; NOTA.error=false;
        pintarModalNota();
        var t = $('mn-texto'); if(t){ t.focus(); try { t.setSelectionRange(t.value.length, t.value.length); } catch(e){} }
      });
    });
    caja.querySelectorAll('[data-borrar]').forEach(function(b){
      b.addEventListener('click', function(){ borrarNota(b.getAttribute('data-borrar')); });
    });
  }

  async function guardarNota(){
    if(NOTA.guardando || !NOTA.atleta) return;
    var texto = ($('mn-texto').value||'').trim();
    var tipo = $('mn-tipo').value;
    if(!texto){ NOTA.msg='Escribe qué ha pasado antes de guardar.'; NOTA.error=true; pintarModalNota(); return; }
    NOTA.guardando = true; NOTA.msg='Guardando…'; NOTA.error=false; pintarModalNota();
    var at = NOTA.atleta;
    try {
      if(NOTA.editando){
        var up = await sb.from('notas_atleta').update({ texto:texto, tipo:tipo })
          .eq('id', NOTA.editando).select('id,atleta_id,texto,tipo,fecha,autor_id,created_at');
        if(up.error) throw up.error;
        if(!up.data || !up.data.length) throw new Error('no se ha encontrado la observación');
        var lst = NOTAS[at.id] || [];
        for(var i=0;i<lst.length;i++) if(lst[i].id===NOTA.editando) lst[i] = up.data[0];
        NOTA.editando = '';
      } else {
        var ins = await sb.from('notas_atleta').insert({
          atleta_id: at.id, autor_id: perfil.id, texto: texto, tipo: tipo,
          fecha: LST.fecha, grupo_id: LST.grupo || at.grupo_id || null
        }).select('id,atleta_id,texto,tipo,fecha,autor_id,created_at');
        if(ins.error) throw ins.error;
        if(ins.data && ins.data.length) (NOTAS[at.id] = NOTAS[at.id] || []).push(ins.data[0]);
      }
      NOTA.guardando = false; NOTA.msg = 'Observación guardada.'; NOTA.error = false;
      pintarModalNota();
      pintarLista();
      if(window.APX) APX.toast('Observación guardada · '+nombreAtleta(at),'ok');
    } catch(e){
      NOTA.guardando = false;
      NOTA.msg = 'NO se ha guardado: '+((e&&e.message)||e)+'. El texto sigue aquí, vuelve a intentarlo.';
      NOTA.error = true;
      pintarModalNota();
    }
  }

  async function borrarNota(id){
    var ok = window.APX
      ? await APX.confirm('¿Borrar esta observación? Sale del historial del atleta y no se puede recuperar.', { aceptar:'Borrar', peligro:true })
      : true;
    if(!ok) return;
    var at = NOTA.atleta; if(!at) return;
    var d = await sb.from('notas_atleta').delete().eq('id', id);
    if(d.error){ NOTA.msg='NO se ha borrado: '+(d.error.message||''); NOTA.error=true; pintarModalNota(); return; }
    NOTAS[at.id] = (NOTAS[at.id]||[]).filter(function(n){ return n.id!==id; });
    if(NOTA.editando===id) NOTA.editando='';
    NOTA.msg = 'Observación borrada.'; NOTA.error = false;
    pintarModalNota();
    pintarLista();
  }

  $('modal-nota').addEventListener('click', function(e){ if(e.target===this) cerrarNota(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && !$('modal-nota').classList.contains('oculto')) cerrarNota();
  });

  (function renderPasarLista(){
    var cont = $('sec-lista');
    if(!MIS_GRUPOS.length){
      cont.innerHTML = '<div class="tarjeta"><h2>Pasar lista</h2>'+vacioHTML(icVacGrupo, 'Necesitas tener al menos un grupo a tu cargo para pasar lista.')+'</div>';
      return;
    }
    LST.grupo = MIS_GRUPOS[0].id;
    cont.innerHTML =
      '<div class="tarjeta">'+
        '<div class="grid2">'+
          '<div><label>Grupo</label><select id="lst-grupo">'+MIS_GRUPOS.map(function(gr){ return '<option value="'+gr.id+'">'+esc(gr.nombre)+'</option>'; }).join('')+'</select></div>'+
          '<div><label>Día</label><input id="lst-fecha" type="date" value="'+todayISO+'"></div>'+
        '</div>'+
        '<details class="ayuda"><summary>¿Cómo funciona?</summary>'+
          '<p class="pista">Toca la fila del atleta para darlo por <strong>presente</strong>; vuelve a tocarla para dejarlo sin marcar. Si no ha venido, usa el <strong>✕</strong>. Puedes cambiar el día y corregir una lista que ya guardaste.</p>'+
        '</details>'+
        '<div id="lst-cont" style="margin-top:10px;"></div>'+
      '</div>';
    /* Si el entrenador dice «seguir en la lista», el desplegable vuelve a lo
       que estaba: lo que se ve en pantalla y lo que hay marcado no se separan. */
    $('lst-grupo').addEventListener('change', async function(){
      var nuevo = $('lst-grupo').value, anterior = LST.grupo;
      if(!(await puedoDejarLaLista())){ $('lst-grupo').value = anterior; return; }
      LST.grupo = nuevo; refrescarLista();
    });
    $('lst-fecha').addEventListener('change', async function(){
      var nueva = $('lst-fecha').value || todayISO, anterior = LST.fecha;
      if(!(await puedoDejarLaLista())){ $('lst-fecha').value = anterior; return; }
      LST.fecha = nueva; refrescarLista();
    });
    refrescarLista();
  })();

  // ============================================================
  // FICHA DEL ATLETA (se abre desde «Mi grupo» y desde «Pasar lista»)
  // ------------------------------------------------------------
  // Sus datos, marcas, asistencia, feedback y observaciones, más
  // las acciones de gestión del grupo: cambiar de grupo, confirmar
  // el alta tras la prueba, marcar o quitar una lesión, escribir a
  // la familia y dar de baja. Los cambios de estado escriben en
  // `atletas.estado` (activo · lesionado · baja · prueba); el
  // permiso mínimo del entrenador se añadió en migraciones/023.
  // ============================================================
  var FICHA = null;   // { atletaId, datos… } mientras está abierta

  function cerrarFicha(){
    var f = document.getElementById('ficha-fondo');
    if(f) f.remove();
    document.body.style.overflow = '';
    FICHA = null;
  }

  /* ¿Este atleta está a MI nombre en su ficha? No es lo mismo que entrenar en
     mi grupo: la lista va por grupo, pero las observaciones, las lesiones, el
     contacto de la familia y el motivo de sus faltas van por la ficha. */
  function esMioDeFicha(x){ return !!(x && x.entrenador_id === perfil.id); }
  function atletaPorId(id){ for(var i=0;i<MIS_ATLETAS.length;i++) if(MIS_ATLETAS[i].id===id) return MIS_ATLETAS[i]; return null; }

  async function abrirFicha(atletaId){
    var at = atletaPorId(atletaId);
    if(!at) return;
    cerrarFicha();
    var fondo = document.createElement('div');
    fondo.className = 'ficha-fondo';
    fondo.id = 'ficha-fondo';
    fondo.innerHTML = '<div class="ficha" role="dialog" aria-modal="true"><div class="ficha-barra"><button type="button" id="ficha-cerrar">← Volver</button></div>'+
      '<div style="padding:20px 20px 24px;">'+APOLANA_UI.cargando('tarjeta')+APOLANA_UI.cargando('filas', 4)+'</div></div>';
    document.body.appendChild(fondo);
    document.body.style.overflow = 'hidden';
    fondo.addEventListener('click', function(ev){ if(ev.target===fondo) cerrarFicha(); });
    document.getElementById('ficha-cerrar').addEventListener('click', cerrarFicha);
    document.addEventListener('keydown', function esc2(ev){ if(ev.key==='Escape'){ cerrarFicha(); document.removeEventListener('keydown', esc2); } });

    FICHA = { atletaId: atletaId, asistencia: [], pagos: [], registros: [], notas: [], notasFamilia: [], ausencias: [], contacto: null, abierto: '', rm: [], marcas: [], veMarcas: true, sesiones: {} };

    var desde = addDias(todayISO, -30);
    var r1 = await sb.from('asistencia').select('fecha,presente').eq('atleta_id', atletaId).gte('fecha', desde).order('fecha', { ascending:false });
    if(!r1.error && r1.data) FICHA.asistencia = r1.data;
    /* El historial de faltas avisadas, con su motivo, solo lo lee quien lleva
       a ese atleta: el motivo suele ser salud. Si entrena en tu grupo pero en
       su ficha figura otro entrenador, esta consulta devuelve cero filas —y
       eso NO quiere decir que no haya avisado ninguna vez—. Se guarda si el
       apartado se puede enseñar o no, para no dar por mirado lo que no se ha
       podido mirar. */
    FICHA.veAusencias = false;
    var r1b = await sb.from('ausencias').select('fecha,motivo,avisado_por_nombre').eq('atleta_id', atletaId).gte('fecha', addDias(todayISO,-60)).order('fecha', { ascending:false }).limit(8);
    if(!r1b.error){ FICHA.veAusencias = true; if(r1b.data) FICHA.ausencias = r1b.data; }
    var r1c = await sb.from('notas_familia').select('id,texto,fecha,autor_nombre,visible').eq('atleta_id', atletaId).order('fecha', { ascending:false }).limit(5);
    if(!r1c.error && r1c.data) FICHA.notasFamilia = r1c.data;
    /* Los recibos ya no se piden: lo que debe una familia no es cosa del
       entrenador (migración 126). Se quitó también de la ficha porque, sin
       datos, la línea decía «Sin recibos registrados» a todo el mundo, que
       es peor que no decir nada: parece un dato y es una mentira. */
    var r3 = await sb.from('registros_sesion').select('sesion_id,created_at,rpe,sensacion_general,como_me_siento,molestias').eq('atleta_id', atletaId).order('created_at', { ascending:false }).limit(5);
    if(!r3.error && r3.data) FICHA.registros = r3.data;
    /* De QUÉ entrenamiento habla cada cosa que ha contado. Sin esto, aquí se
       leía «RPE 8/10 · me costó el final» y no había manera de volver al
       entrenamiento del que hablaba: un comentario suelto sin nada detrás. */
    var sesIds = (FICHA.registros||[]).map(function(r){ return r.sesion_id; })
                   .filter(function(x, i, a){ return x && a.indexOf(x)===i; });
    if(sesIds.length){
      var r3b = await sb.from('sesiones').select('id,fecha,titulo,grupo_id,publicada').in('id', sesIds);
      if(!r3b.error && r3b.data) r3b.data.forEach(function(s){ FICHA.sesiones[s.id] = s; });
    }
    /* ------------------------------------------------------------
       CUÁNTO LLEVA HECHO · lo mismo que ve él en su portal
       ------------------------------------------------------------
       La ficha contaba las últimas cinco cosas que dijo el atleta y su
       asistencia de treinta días, y con eso no se contesta la pregunta
       que se hace un entrenador al abrirla: «¿este chaval está haciendo
       el volumen que le he puesto?». Los metros estaban apuntados desde
       el primer día; solo que no había dónde verlos sumados.

       Es EL MISMO cálculo que ve el atleta (`assets/js/estadisticas.js`),
       a propósito: si el entrenador mira una cifra y el atleta otra, la
       conversación empieza discutiendo cuál de las dos es la buena.

       Los cinco registros de arriba no sirven para esto —son cinco y sin
       las series dentro—, así que se pide otra vez con lo que hace falta.
       Va al final de la carga porque es lo más pesado de la ficha y lo
       último que se mira: si falla o tarda, lo demás ya está pintado.
       ------------------------------------------------------------ */
    FICHA.volumen = null;
    try {
      var rv = await sb.from('registros_sesion')
        .select('sesion_id,created_at,tiempos_reales,rpe,sensacion_general')
        .eq('atleta_id', atletaId).gte('created_at', addDias(todayISO, -7*13))
        .order('created_at', { ascending:false }).limit(250);
      if(!rv.error && rv.data && rv.data.length){
        var idsV = rv.data.map(function(r){ return r.sesion_id; })
                     .filter(function(x,i,a){ return x && a.indexOf(x)===i; });
        var sesV = [];
        if(idsV.length){
          var qv = await sb.from('sesiones').select('id,fecha,deporte,deporte_2').in('id', idsV);
          if(!qv.error && qv.data) sesV = qv.data;
        }
        /* Si mientras se pedía esto el entrenador cerró la ficha y abrió la
           de otro atleta, lo que llega aquí son los metros del PRIMERO: no
           se escriben, o el segundo mostraría el volumen del otro. */
        if(window.APOLANA_ESTADISTICAS && FICHA && FICHA.atletaId===atletaId)
          FICHA.volumen = window.APOLANA_ESTADISTICAS.resumir(sesV, rv.data, 12);
      }
    } catch(e){}
    var r4 = await sb.from('notas_atleta').select('id,texto,created_at').eq('atleta_id', atletaId).order('created_at', { ascending:false }).limit(3);
    if(!r4.error && r4.data) FICHA.notas = r4.data;
    /* Sus repeticiones máximas, de la más reciente a la más antigua: de aquí
       salen los kilos que ve el atleta cuando el entrenamiento dice «80 % RM».
       Se guardan todos los tests, no solo el último: la progresión de la
       sentadilla a lo largo del año es justo lo que se quiere mirar. */
    var r4b = await sb.from('rm_atleta').select('id,ejercicio,peso_kg,fecha_test,nota')
                .eq('atleta_id', atletaId).order('fecha_test', { ascending:false, nullsFirst:false });
    if(!r4b.error && r4b.data) FICHA.rm = r4b.data;
    await traerMarcas(atletaId);
    try {
      var r5 = await sb.rpc('contacto_familia_atleta', { p_atleta: atletaId });
      if(!r5.error && r5.data && r5.data.length) FICHA.contacto = r5.data[0];
    } catch(e){}

    if(FICHA && FICHA.atletaId===atletaId) pintarFicha();
  }

  /* ------------------------------------------------------------
     LAS MARCAS DE UN ATLETA
     ------------------------------------------------------------
     El club lo dijo mirando su propia ficha: «me deja añadir RM pero no
     mejor marca». Y era verdad: las marcas se veían y no había por dónde
     apuntarlas, con el formulario de los RM justo debajo. Las marcas de
     competición las toma el ENTRENADOR, que es quien está en la pista con
     el cronómetro, así que el sitio de escribirlas es este.

     ⚠️ NO TODAS LAS PRUEBAS SE MIDEN IGUAL, Y NO SE ADIVINA POR EL NOMBRE.
     En salto y lanzamiento se apuntan METROS y gana el número grande; en
     carrera es tiempo y gana el pequeño; las combinadas van a puntos. Eso
     lo dice el catálogo (`pruebas.unidad` y `pruebas.mas_es_mejor`) y de
     ahí se lee, no se supone: un 6,85 de longitud metido como si fuera un
     tiempo saldría de «mejor marca» solo cuando empeorase.

     Y SE APUNTA DÓNDE SE HIZO: un 51.30 en una final y un 51.30 en una
     serie del martes no son la misma marca.
     ------------------------------------------------------------ */

  /* Sus marcas y, de paso, la mejor de cada prueba. Se recalcula aquí para
     que la ficha, la cabecera y la lista de fuera digan lo mismo en cuanto
     se apunta una: si no, guardabas una marca y la de arriba seguía siendo
     la vieja hasta recargar la página. */
  async function traerMarcas(atletaId){
    var r = await sb.from('marcas_atleta')
      .select('id,prueba,tiempo_display,tiempo_segundos,fecha,sede,contexto')
      .eq('atleta_id', atletaId).order('fecha', { ascending:false, nullsFirst:false }).limit(200);
    if(!FICHA || FICHA.atletaId!==atletaId) return;
    /* Si la consulta falla NO se dice «todavía no tiene marcas»: eso sería
       dar por mirado lo que no se ha podido mirar, y encima invita a
       apuntar otra vez una que ya está. */
    if(r.error){ FICHA.veMarcas = false; return; }
    FICHA.veMarcas = true;
    FICHA.marcas = r.data || [];
    var mejor = {};
    FICHA.marcas.forEach(function(m){
      var v = valorMarca(m);
      if(v==null || !m.prueba) return;
      var ya = mejor[m.prueba];
      if(!ya || (masEsMejor(m.prueba) ? v > ya.valor : v < ya.valor))
        mejor[m.prueba] = { valor: v, disp: (m.tiempo_display || String(v)), fecha: m.fecha || '' };
    });
    MARCAS[atletaId] = mejor;
  }

  // En qué se mide la prueba elegida, dicho para quien va a teclearlo.
  function pistaUnidad(nombre){
    var p = PRUEBA_POR_NOMBRE[nombre];
    if(!p) return 'En carrera se apunta el tiempo (51.30, o 1:58.60 si pasa del minuto); en salto y lanzamiento, los metros (6,85).';
    if(p.unidad==='distancia') return p.nombre+' se mide en METROS, y cuanto más lejos mejor: 6,85.';
    if(p.unidad==='puntos')    return p.nombre+' se apunta en puntos: 5820.';
    return p.nombre+' se apunta en tiempo: 51.30, o 1:58.60 si pasa del minuto.';
  }
  function ejemploUnidad(nombre){
    var p = PRUEBA_POR_NOMBRE[nombre];
    if(p && p.unidad==='distancia') return '6,85';
    if(p && p.unidad==='puntos')    return '5820';
    return '51.30 · 1:58.60';
  }

  /* El desplegable, ordenado como el que ve el atleta en su zona: primero
     LAS SUYAS. El entrenador viene a apuntar el 400 de este chaval, no a
     buscarlo entre cincuenta pruebas; y si los dos desplegables se leen
     igual, el nombre de la prueba casa y las marcas no se parten en dos. */
  function opcionesPruebasFicha(at){
    var grupos = {}, orden = [];
    PRUEBAS.forEach(function(p){
      var g = (p.ambito==='natacion' ? 'Natación' : 'Atletismo') + (p.disciplina ? ' · '+p.disciplina : '');
      if(!grupos[g]){ grupos[g] = []; orden.push(g); }
      grupos[g].push(p.nombre);
    });
    function ops(lista){ return lista.map(function(n){ return '<option value="'+escAttr(n)+'">'+esc(n)+'</option>'; }).join(''); }
    var suyas = (at.especialidades||[]).filter(function(n){ return PRUEBA_POR_NOMBRE[n]; });
    return '<option value="">— elige la prueba —</option>'+
      (suyas.length ? '<optgroup label="★ Sus pruebas">'+ops(suyas)+'</optgroup>' : '')+
      orden.map(function(g){ return '<optgroup label="'+escAttr(g)+'">'+ops(grupos[g])+'</optgroup>'; }).join('');
  }

  var CONTEXTO_MARCA = { competicion:'en competición', entreno:'en un entrenamiento' };

  function marcasHTML(at){
    // Arriba, la mejor de cada prueba: es lo que se viene a mirar de un vistazo.
    var mrc = mejoresMarcasDe(at.id, 6);
    var cabeza = mrc.length
      ? '<div class="mrc">'+mrc.map(function(m){ return '<span>'+esc(m.prueba)+' '+esc(m.disp)+'</span>'; }).join('')+'</div>'
      : (FICHA.veMarcas
          ? '<p class="vacio" style="margin:0;">Todavía no tiene ninguna marca apuntada. Apúntale la primera aquí abajo.</p>'
          : '<p class="vacio" style="margin:0;">No hemos podido leer sus marcas. Puede ser tu conexión: no quiere decir que no tenga ninguna, así que no des por hecho que falta apuntarlas.</p>');

    /* Y debajo, las últimas tal como se apuntaron. No sobra con la línea de
       arriba: si le apuntas una marca que no es la mejor, sin esto guardabas
       y la pantalla se quedaba igual, que es la mejor manera de que alguien
       la vuelva a apuntar tres veces. */
    var ult = (FICHA.marcas||[]).slice(0, 5);
    var lista = ult.length
      ? '<label style="margin-top:14px;">Las últimas apuntadas</label>'+
        '<ul class="mini-lista">'+ult.map(function(m){
          var donde = CONTEXTO_MARCA[m.contexto] || '';
          var detalle = [donde, m.sede||''].filter(Boolean).join(' · ');
          return '<li><b style="font-weight:400;color:var(--texto);flex:1;">'+esc(m.prueba)+
            ' <span style="font-family:var(--fuente-dato);font-weight:700;color:var(--navy);">'+esc(m.tiempo_display||'')+'</span>'+
            (detalle ? ' <em style="font-style:normal;color:var(--texto-suave);">· '+esc(detalle)+'</em>' : '')+
            '</b><span>'+esc(m.fecha ? formatFecha(m.fecha) : 'sin fecha')+'</span></li>';
        }).join('')+'</ul>'
      : '';

    return cabeza + lista +
      '<label style="margin-top:14px;">Apuntar una marca</label>'+
      '<div class="grid2">'+
        '<div><select id="fa-mk-prueba" aria-label="Prueba">'+opcionesPruebasFicha(at)+'</select></div>'+
        '<div><input id="fa-mk-marca" aria-label="Marca" autocomplete="off" placeholder="'+escAttr(ejemploUnidad(''))+'"></div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div><input id="fa-mk-fecha" type="date" aria-label="Día de la marca" value="'+escAttr(todayISO)+'"></div>'+
        '<div><select id="fa-mk-contexto" aria-label="Dónde se hizo">'+
          '<option value="">— ¿dónde se hizo? —</option>'+
          '<option value="competicion">En competición</option>'+
          '<option value="entreno">En un entrenamiento</option>'+
        '</select></div>'+
      '</div>'+
      // «Dónde» ya lo pregunta la casilla de arriba: aquí es en qué pista.
      '<div style="margin-top:12px;"><input id="fa-mk-sede" aria-label="En qué pista o estadio" placeholder="opcional: en qué pista o estadio"></div>'+
      '<p class="pista" id="fa-mk-unidad">'+esc(pistaUnidad(''))+'</p>'+
      '<p class="pista">Un <strong>51.30 en una final</strong> y un 51.30 en una serie del martes no son la misma marca: por eso se dice dónde se hizo. Él las ve en su portal, y también puede apuntarse las suyas.</p>'+
      '<div class="acciones"><button class="btn btn--neutro btn--sm" id="fa-mk-ok">Guardar la marca</button></div>';
  }

  /* ------------------------------------------------------------
     LAS REPETICIONES MÁXIMAS DE UN ATLETA
     ------------------------------------------------------------
     El club lo pidió así: «quiero que calcule el porcentaje de peso de
     los RM. Añádelo». Para eso hace falta que alguien meta los RM, y
     hasta hoy no había por dónde: la tabla existía y estaba vacía.

     ⚠️ EL NOMBRE DEL EJERCICIO TIENE QUE SER EL MISMO que se escribe en
     el entrenamiento. Por eso el campo trae la lista del club pegada
     (un `datalist`): se escribe y se elige, y el nombre casa. Si se
     teclea otra cosa, el atleta no verá el cálculo en esa fila y nadie
     entenderá por qué. Se avisa debajo del campo, con esas palabras.

     UNA FILA POR TEST, y el más reciente es el que manda. Los viejos no
     se tocan: la progresión de la sentadilla a lo largo de la temporada
     es de lo poco que de verdad dice si el trabajo está sirviendo.

     Y SE PUEDE CORREGIR: cada fila lleva su «Borrar». Un RM mal tecleado
     no es un dato incómodo, es un peso equivocado en una barra.
     ------------------------------------------------------------ */
  function rmHTML(at){
    var lista = FICHA.rm || [];
    /* Cuál es el que vale HOY de cada ejercicio: el del test más reciente.
       Los anteriores se ven igual, pero en gris y dicho con palabras, para
       que nadie confunda un RM de octubre con el de ahora. */
    var vigente = {};
    lista.forEach(function(x){
      var k = norm(x.ejercicio||'');
      if(!vigente[k]) vigente[k] = x.id;
    });
    var filas = lista.length
      ? '<ul class="mini-lista">'+lista.map(function(x){
          var esVigente = vigente[norm(x.ejercicio||'')] === x.id;
          var kg = String(x.peso_kg).replace('.',',');
          return '<li><b style="font-weight:400;color:var(--texto);flex:1;">'+esc(x.ejercicio)+
            ' <span class="cifra" style="font-weight:700;color:var(--navy);">'+esc(kg)+' kg</span>'+
            (esVigente?'':' <em style="font-style:normal;color:var(--texto-suave);">(test anterior)</em>')+
            (x.nota?' <em style="font-style:normal;color:var(--texto-suave);">· '+esc(x.nota)+'</em>':'')+
            '</b><span>'+esc(x.fecha_test?formatFecha(x.fecha_test):'sin fecha')+
            ' <button type="button" class="nota-borrar" data-rm="'+esc(x.id)+'">Borrar</button></span></li>';
        }).join('')+'</ul>'
      : '<p class="vacio" style="margin:0;">Todavía no tiene ninguna repetición máxima apuntada. Sin ella, cuando el entrenamiento diga «80 % RM» el atleta verá el porcentaje pero no sus kilos: no se estima ninguno.</p>';
    /* El mismo campo que en el planificador, no un `datalist` distinto: si
       hubiera dos formas de escribir un ejercicio, una acabaría siendo la
       buena y la otra la que nadie arregla. */
    return filas +
      '<label style="margin-top:14px;">Apuntar una repetición máxima</label>'+
      '<div class="grid2">'+
        '<div><input id="fa-rm-ejercicio" class="ej-libre" placeholder="Sentadilla completa" autocomplete="off" '+
          'role="combobox" aria-autocomplete="list" aria-expanded="false" aria-label="Ejercicio"></div>'+
        '<div><input id="fa-rm-peso" inputmode="decimal" placeholder="kilos (p. ej. 100)"></div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div><input id="fa-rm-fecha" type="date" value="'+esc(todayISO)+'"></div>'+
        '<div><input id="fa-rm-nota" placeholder="opcional: con cinturón, test de octubre…"></div>'+
      '</div>'+
      '<p class="pista">Escribe el ejercicio <strong>tal como lo pones en el entrenamiento</strong> (la lista te lo completa). Si no coincide, el atleta no verá sus kilos en esa fila.</p>'+
      '<p class="pista">Con esto, donde el entrenamiento diga <strong>«80 % RM»</strong> él leerá <em>«Para ti, 80 % son 80 kg — desde tu RM de 100 kg de marzo»</em>. Lo pones tú: el atleta no puede tocarlo.</p>'+
      '<div class="acciones"><button class="btn btn--neutro btn--sm" id="fa-rm-ok">Guardar la repetición máxima</button></div>';
  }

  /* El bloque de volumen, o nada. Si no hay nada apuntado en trece semanas
     no se pinta un apartado vacío: en una ficha que ya es larga, un título
     con «todavía no hay datos» debajo es una línea que hay que leer para
     descubrir que no dice nada. */
  function volumenFichaHTML(){
    if(!FICHA || !FICHA.volumen || !window.APOLANA_ESTADISTICAS) return '';
    var h = window.APOLANA_ESTADISTICAS.html(FICHA.volumen, {});
    if(!h) return '';
    return '<div class="ficha-bloque" id="fa-bloque-volumen"><h4>Cuánto lleva hecho</h4>'+h+
      '<p class="pista" style="margin-bottom:0;">Lo mismo que ve él en su portal, de sus últimas doce semanas.</p></div>';
  }

  function pintarFicha(){
    if(!FICHA) return;
    var caja = document.querySelector('#ficha-fondo .ficha');
    if(!caja) return;
    var at = atletaPorId(FICHA.atletaId);
    if(!at){ cerrarFicha(); return; }

    // --- cabecera ---
    var edad = edadDe(at.fecha_nacimiento);
    /* Todos sus grupos, el principal delante: quien entrena dos veces al
       día tiene que verlo en su ficha y no solo en una de las dos listas. */
    var gNom = gruposDe(at).map(nombreGrupo).filter(Boolean).join(' · ') || 'sin grupo';
    // La categoría solo se repite si el nombre del grupo no la lleva ya dentro.
    var cat = (at.categoria && norm(gNom).indexOf(norm(at.categoria))===-1) ? at.categoria : '';
    var linea = [ (edad!=null ? edad+' años' : ''), gNom, cat, diasCortos(at.dias_entreno) ].filter(Boolean).join(' · ');

    // Guarda cambios en el atleta y refresca lo que se ve por detrás.
    async function guardarAtleta(cambios, textoOk){
      fmsg('Guardando…');
      var res = await sb.from('atletas').update(cambios).eq('id', at.id).select('id,estado,grupo_id,fecha_prueba_fin').maybeSingle();
      if(res.error){ fmsg('Error: '+res.error.message, 'error'); return false; }
      if(!res.data){ fmsg('No se pudo guardar: no tienes permiso sobre este atleta.', 'error'); return false; }
      Object.keys(cambios).forEach(function(k){ at[k] = cambios[k]; });
      FICHA.abierto = '';
      renderMiGrupo();
      if($('lst-cont')) pintarLista();
      pintarFicha();
      fmsg(textoOk||'Guardado ✓', 'ok');
      return true;
    }

      var prueba = (document.getElementById('fa-mk-prueba').value||'').trim();

      var fecha  = document.getElementById('fa-mk-fecha').value || todayISO;
      var ctx    = document.getElementById('fa-mk-contexto').value || null;
      var sede   = (document.getElementById('fa-mk-sede').value||'').trim();
      if(!prueba){ fmsg('Elige de qué prueba es la marca.', 'error'); return; }
      if(!disp){ fmsg('Escribe la marca.', 'error'); return; }
      var v = numMarca(disp);
      var p = PRUEBA_POR_NOMBRE[prueba];
      /* Lo que se teclea a pie de pista con una mano se equivoca, y una marca
         mal metida no es un dato feo: es la que manda en «mejores marcas» y
         la que sale en el ranking. Se avisa con el ejemplo delante en vez de
         guardarla y que aparezca un 5130 donde iba un 51.30. */
      if(v==null || v<=0){ fmsg('No entendemos esa marca. '+pistaUnidad(prueba), 'error'); return; }
      if(p && p.unidad==='distancia' && v>150){ fmsg('¿Metros? '+v+' es demasiado para '+prueba+'. Escríbelo como 6,85.', 'error'); return; }
      if(p && (!p.unidad || p.unidad==='tiempo') && v>36000){ fmsg('Ese tiempo pasa de diez horas: revísalo. Se escribe 51.30, o 1:58.60 si pasa del minuto.', 'error'); return; }
      /* Si mejora lo que tenía, se dice: es la razón por la que el entrenador
         está apuntándola, y así de paso se ve que la prueba se ha entendido
         al derecho (en salto gana el número grande, en carrera el pequeño). */
      var antes = (MARCAS[at.id]||{})[prueba];
      var esMejor = !antes || (masEsMejor(prueba) ? v > antes.valor : v < antes.valor);
      fmsg('Guardando…');
      var ins = await sb.from('marcas_atleta').insert({
        atleta_id: at.id, prueba: prueba, tiempo_display: disp,
        tiempo_segundos: v, fecha: fecha || null, sede: sede||null, contexto: ctx });
      if(ins.error){
        /* Si la base no le deja escribirla, decir «error» y el mensaje de
           dentro no sirve de nada a pie de pista: se dice qué pasa. */
        var noPuede = /permission|policy|row-level/i.test(ins.error.message||'');
        fmsg(noPuede ? 'No puedes apuntarle marcas a este atleta: no está en tus grupos ni a tu nombre. Díselo a administración.'
                     : 'Error: '+ins.error.message, 'error');
        return;
      }
      await traerMarcas(at.id);
      pintarFicha();
      fmsg(esMejor ? 'Marca guardada ✓ es su mejor '+prueba : 'Marca guardada ✓', 'ok');
    });

      var fecha = document.getElementById('fa-rm-fecha').value || todayISO;
      var nota = (document.getElementById('fa-rm-nota').value||'').trim();
      if(!ej){ fmsg('Escribe qué ejercicio es.', 'error'); return; }
      var kg = parseFloat(kgTxt);
      /* Los límites no son burocracia: un 8 en vez de un 80 se cuela sin que
         nadie lo note, y luego el atleta ve «el 80 % son 6,5 kg» y no entiende
         nada. Y un 800 es un cero de más. */
      if(isNaN(kg) || kg <= 0 || kg > 500){ fmsg('Pon los kilos que levantó una vez (entre 1 y 500).', 'error'); return; }
      fmsg('Guardando…');
      var ins = await sb.from('rm_atleta').insert({
        atleta_id: at.id, ejercicio: ej, peso_kg: kg, fecha_test: fecha,
        anotado_por: perfil.id, nota: nota||null });
      if(ins.error){
        /* Dos tests del mismo ejercicio el mismo día son un doble clic, no dos
           tests: la base no los deja y aquí se dice en llano por qué. */
        var dup = /duplicad|duplicate|unique/i.test(ins.error.message||'');
        fmsg(dup ? 'Ya hay un RM de ese ejercicio con esa fecha. Bórralo o cambia la fecha.'
                 : 'Error: '+ins.error.message, 'error');
        return;
      }
      await recargarRM();
      fmsg('Repetición máxima guardada ✓ ya le salen sus kilos', 'ok');
    });
    caja.querySelectorAll('[data-rm]').forEach(function(b){
      b.addEventListener('click', async function(){
        if(!await APX.confirm('¿Borrar esta repetición máxima? Los kilos que calcula el atleta se recalcularán con la anterior, si la hay.', { aceptar:'Borrar', peligro:true })) return;
        fmsg('Borrando…');
        var del = await sb.from('rm_atleta').delete().eq('id', b.getAttribute('data-rm'));
        if(del.error){ fmsg('Error: '+del.error.message, 'error'); return; }
        await recargarRM();
        fmsg('Borrada ✓', 'ok');
      });
    });
  }

  // ============================================================
  // DESTINATARIOS DE UNA SESIÓN (columna sesiones.atletas_ids)
  // ------------------------------------------------------------
  //   atletas_ids = null   -> la ve todo el grupo
  //   atletas_ids = [ids]  -> la ven SOLO esos atletas; el resto
  //                           del grupo no la ve en su zona.
  // Los dos apartados (Planificar entreno y Planificar semana)
  // usan el mismo control; se distinguen por el prefijo del id
  // ('pl' para el editor manual, 'sw' para la semana entera).
  // ============================================================
  function cajaDestHTML(pref, pregunta){
    return '<div class="dest" id="'+pref+'-dest">'+
      '<label>'+esc(pregunta)+'</label>'+
      '<div class="sw-radios">'+
        '<label><input type="radio" name="'+pref+'-dest-modo" value="grupo" checked> Todo el grupo</label>'+
        '<label><input type="radio" name="'+pref+'-dest-modo" value="algunos"> Solo estos atletas</label>'+
      '</div>'+
      '<div id="'+pref+'-dest-caja" hidden>'+
        '<div class="dest-barra">'+
          '<button type="button" class="btn-mini" id="'+pref+'-dest-todos">Marcar todos</button>'+
          '<button type="button" class="btn-mini" id="'+pref+'-dest-ninguno">Desmarcar todos</button>'+
        '</div>'+
        '<div class="dest-lista" id="'+pref+'-dest-lista"></div>'+
        /* El aviso, UNA vez. Debajo había otra frase que decía exactamente lo
           mismo con otras palabras («Dirigido solo a … el resto del grupo no lo
           verá»), y en un móvil eso son tres renglones de más en cada carga. */
        '<p class="dest-aviso">Marca solo a quien va dirigido. <strong>El resto del grupo NO lo verá</strong> en su zona de atleta.</p>'+
      '</div>'+
      '<p class="pista" id="'+pref+'-dest-resumen"></p>'+
    '</div>';
  }

  function pintarListaDest(pref, grupoId, seleccion){
    var cont = $(pref+'-dest-lista'); if(!cont) return;
    var atls = atletasDeGrupo(grupoId);
    var sel = {}; (seleccion||[]).forEach(function(id){ sel[id] = true; });
    if(!atls.length){ cont.innerHTML = '<p class="vacio">Este grupo no tiene atletas visibles todavía.</p>'; return; }
    cont.innerHTML = atls.map(function(x){
      return '<label><input type="checkbox" class="dest-chk" value="'+x.id+'"'+(sel[x.id]?' checked':'')+'>'+esc(nombreAtleta(x))+'</label>';
    }).join('');
  }

  function modoDest(pref){ var r = document.querySelector('input[name="'+pref+'-dest-modo"]:checked'); return r ? r.value : 'grupo'; }
  function idsMarcadosDest(pref){
    var out = [], c = $(pref+'-dest-lista'); if(!c) return out;
    c.querySelectorAll('.dest-chk').forEach(function(i){ if(i.checked) out.push(i.value); });
    return out;
  }
  // Deja el control en el estado que corresponde a unos atletas_ids concretos
  function aplicarDest(pref, grupoId, ids){
    var lista = (ids && ids.length) ? ids : null;
    var r = document.querySelector('input[name="'+pref+'-dest-modo"][value="'+(lista?'algunos':'grupo')+'"]');
    if(r) r.checked = true;
    pintarListaDest(pref, grupoId, lista || []);
  }
  // Lee lo elegido: {ids:null} = todo el grupo · {ids:[…]} = solo esos · {error:'…'}
  function leerDest(pref){
    if(modoDest(pref) !== 'algunos') return { ids: null };
    var ids = idsMarcadosDest(pref);
    if(!ids.length) return { error: 'Has elegido «Solo estos atletas» pero no has marcado a nadie. Marca al menos un atleta o vuelve a «Todo el grupo».' };
    return { ids: ids };
  }
  function textoDest(pref, singular){
    if(modoDest(pref) !== 'algunos') return 'Ahora mismo '+(singular?'el entrenamiento lo verán':'los entrenamientos los verán')+' todos los atletas del grupo.';
    var n = idsMarcadosDest(pref).length;
    if(!n) return 'No has marcado a ningún atleta todavía.';
    /* «Dirigida … no la verá» venía de cuando esto se llamaba «sesión», que
       era femenino. Ahora es «el entrenamiento»: masculino. */
    return 'Dirigid'+(singular?'o':'os')+' solo a '+nombresDeIds(idsMarcadosDest(pref), 4)+' ('+n+'): el resto del grupo no '+(singular?'lo verá':'los verá')+'.';
  }
  // Conecta los botones y radios; devuelve la función que refresca el estado visible
  function conectarDest(pref, singular, alCambiar){
    function refrescar(){
      $(pref+'-dest-caja').hidden = (modoDest(pref) !== 'algunos');
      $(pref+'-dest-resumen').textContent = textoDest(pref, singular);
      /* La línea de los ajustes plegados se refresca con cualquier cambio de
         destino: si no, diría «solo Andrés» después de haber marcado a los dos. */
      if(pref==='pl' && typeof pintarResumenAjustes==='function') pintarResumenAjustes();
      if(alCambiar) alCambiar();
    }
    document.querySelectorAll('input[name="'+pref+'-dest-modo"]').forEach(function(r){ r.addEventListener('change', refrescar); });
    $(pref+'-dest-lista').addEventListener('change', refrescar);
    $(pref+'-dest-todos').addEventListener('click', function(){ $(pref+'-dest-lista').querySelectorAll('.dest-chk').forEach(function(i){ i.checked = true; }); refrescar(); });
    $(pref+'-dest-ninguno').addEventListener('click', function(){ $(pref+'-dest-lista').querySelectorAll('.dest-chk').forEach(function(i){ i.checked = false; }); refrescar(); });
    refrescar();
    return refrescar;
  }

  // ============================================================
  // PASÁRSELO A OTRO DÍA (a un atleta suelto)
  // ------------------------------------------------------------
  // «El atleta venía el martes y no viene: pues el miércoles hace
  // el entrenamiento del martes.» Pasa todas las semanas —un viaje,
  // un examen— y hasta ahora había que duplicar a mano el entreno,
  // cambiarle la fecha y marcar «Solo estos atletas». Seis o siete
  // toques. Esto es ese mismo camino en un botón.
  //
  // No es un editor nuevo: usa las dos cosas que ya existían, la
  // COPIA (un entrenamiento nuevo con lo mismo dentro) y los
  // DESTINATARIOS (`sesiones.atletas_ids` = solo esa gente).
  //
  // El original NO se toca: el martes sigue en pie para el resto
  // del grupo, y eso se dice con todas las letras antes y después.
  //
  // Y se le apunta la FALTA del día original (tabla `ausencias`,
  // la misma de «avisar falta»), con el motivo diciendo la verdad:
  // que lo hace otro día. Sin eso, el chaval abría el móvil y veía
  // DOS entrenamientos —el del martes de su grupo y el suyo del
  // miércoles— sin nada que le dijera cuál le toca. La falta va
  // atada al entrenamiento del martes, así que en Pasar lista de
  // ese día sale como avisada y el entrenador no lo busca por la
  // pista.
  // ============================================================
  //   faltasIds = las ausencias que hemos apuntado NOSOTROS. Solo
  //   esas se borran al deshacer: las que ya estaban son de otro.
  var PASAR = { sesion: null, creadaId: null, faltasIds: [] };

  function cajaPasarHTML(){
    return '<div class="dest" id="pl-pasar-caja" hidden style="margin-top:16px;">'+
      '<label>Pasárselo a otro día</label>'+
      '<p class="pista" id="pl-pasar-de"></p>'+
      '<div class="dest-barra">'+
        '<button type="button" class="btn-mini" id="pl-pasar-ninguno">Desmarcar todos</button>'+
      '</div>'+
      '<div class="dest-lista" id="pl-pasar-lista"></div>'+
      '<label for="pl-pasar-fecha" style="margin-top:12px;">¿Qué día lo hace?</label>'+
      '<input id="pl-pasar-fecha" type="date">'+
      '<p class="pista" id="pl-pasar-resumen"></p>'+
      '<div class="dest-barra" style="margin-top:12px;">'+
        '<button type="button" class="btn btn--primario" id="pl-pasar-ok">Pasarlo a ese día</button>'+
        '<button type="button" class="btn btn--neutro" id="pl-pasar-no">Cancelar</button>'+
      '</div>'+
      '<p class="msg" id="pl-pasar-msg"></p>'+
      '<div class="dest-barra" id="pl-pasar-hecho" hidden>'+
        '<button type="button" class="btn-mini" id="pl-pasar-abrir">Abrir el entrenamiento nuevo</button>'+
        '<button type="button" class="btn-mini" id="pl-pasar-deshacer">Deshacer</button>'+
      '</div>'+
    '</div>';
  }

  function idsPasar(){
    var out = [], c = $('pl-pasar-lista'); if(!c) return out;
    c.querySelectorAll('.pasar-chk').forEach(function(i){ if(i.checked) out.push(i.value); });
    return out;
  }

  /* ------------------------------------------------------------
     APUNTAR LA FALTA DEL DÍA ORIGINAL
     ------------------------------------------------------------
     LO QUE DIJO LA FAMILIA MANDA. Si ese atleta ya tiene una falta
     avisada ese día, NO se toca: se deja como está y se dice en
     pantalla. Tres razones para dejarla en vez de completarla:

       · Lo que buscábamos ya está conseguido. La falta existe, y
         en Pasar lista de ese día ya sale avisada. No hay nada
         roto que arreglar, así que escribir encima no gana nada.
       · La línea lleva UNA sola firma (`avisado_por`). Pegar
         nuestro motivo detrás del suyo dejaría un texto de dos
         voces firmado por una: «malo del estómago · lo hace el
         miércoles», sin saber quién dijo qué. Eso es el mismo
         borrado silencioso, solo que más despacio.
       · Y si se contradicen —la madre dice que está malo y el
         entrenador que lo hace el miércoles— eso lo tiene que VER
         una persona y decidir, no juntarlo la máquina. Por eso se
         enseña quién avisó y con qué motivo.

     Nunca tira el pase: si esto falla, el entrenamiento del
     miércoles ya está creado, que es lo importante. Se avisa y ya.
     Devuelve {puestas, creadas:[ids], yaHabia:[textos], error}.
     ------------------------------------------------------------ */
  async function apuntarFaltas(ids, fecha, sesionId, fechaNueva){
    var salida = { puestas: 0, creadas: [], yaHabia: [], error: '' };
    try {
      // Primero se mira qué hay: así se sabe a quién NO hay que tocar.
      var ya = {};
      var r0 = await sb.from('ausencias').select('atleta_id,motivo,avisado_por_nombre')
        .eq('fecha', fecha).in('atleta_id', ids);
      if(r0.error){ salida.error = r0.error.message; return salida; }
      (r0.data || []).forEach(function(a){ ya[a.atleta_id] = a; });

      ids.forEach(function(id){
        var a = ya[id]; if(!a) return;
        var at = atletaPorId(id);
        var quien = limpioTxt(a.avisado_por_nombre);
        salida.yaHabia.push((at ? nombreAtleta(at) : 'un atleta')+
          (limpioTxt(a.motivo) ? ' («'+limpioTxt(a.motivo)+'»)' : '')+
          (quien ? ', que avisó '+quien : ''));
      });

      var faltan = ids.filter(function(id){ return !ya[id]; });
      if(!faltan.length) return salida;

      /* El motivo dice lo que es: ni plantón ni lesión. En el historial
         del atleta se lee tal cual y se entiende meses después. */
      var motivo = 'Lo hace el '+formatFecha(fechaNueva);
      var filas = faltan.map(function(id){
        return { atleta_id: id, fecha: fecha, motivo: motivo, sesion_id: sesionId || null };
      });
      var r = await sb.from('ausencias').insert(filas).select('id');
      if(r.error){ salida.error = r.error.message; return salida; }
      salida.creadas = (r.data || []).map(function(x){ return x.id; });
      salida.puestas = salida.creadas.length || faltan.length;
    } catch(e){ salida.error = (e && e.message) ? e.message : 'no se ha podido apuntar la falta'; }
    return salida;
  }
  function limpioTxt(s){ return (s == null ? '' : String(s)).trim(); }

  /* El resumen se escribe entero antes de tocar nada: quién, qué día, y
     —lo que más se pregunta— qué pasa con el día original. */
  function refrescarPasar(){
    var s = PASAR.sesion; if(!s) return;
    var ids = idsPasar();
    var nueva = $('pl-pasar-fecha').value;
    var como = s.titulo || 'el entrenamiento del '+formatFecha(s.fecha);
    var p = $('pl-pasar-resumen');
    if(!ids.length){ p.textContent = 'Marca a quién se lo pasas.'; return; }
    if(!nueva){ p.textContent = 'Elige el día en el que lo hace.'; return; }
    if(nueva === s.fecha){ p.textContent = 'Ese es el mismo día que ya tiene. Elige otro.'; return; }
    p.textContent = 'El '+formatFecha(nueva)+' se creará «'+como+'» solo para '+nombresDeIds(ids, 4)+'. '+
      'El '+formatFecha(s.fecha)+' no se toca: sigue en pie para el resto del grupo, '+
      'y a quien se lo pases se le apunta la falta ese día para que no le salgan dos entrenamientos.';
  }

  function abrirPasar(){
    var s = window.__SESIONES_GRUPO && window.__SESIONES_GRUPO[editandoId];
    if(!s) return;
    PASAR.sesion = s; PASAR.creadaId = null; PASAR.faltasIds = [];
    var atls = atletasDeGrupo(s.grupo_id);
    var cont = $('pl-pasar-lista');
    cont.innerHTML = atls.length
      ? atls.map(function(x){ return '<label><input type="checkbox" class="pasar-chk" value="'+escAttr(x.id)+'">'+esc(nombreAtleta(x))+'</label>'; }).join('')
      : '<p class="vacio">Este grupo no tiene atletas visibles todavía.</p>';
    $('pl-pasar-de').innerHTML = 'Se copia <strong>'+esc(s.titulo || formatFecha(s.fecha))+'</strong> ('+esc(formatFecha(s.fecha))+') tal cual está guardado, y la copia la verán <strong>solo</strong> los atletas que marques.';
    /* Por defecto, el día siguiente: es lo que más se dice («mañana lo haces»). */
    $('pl-pasar-fecha').value = addDias(s.fecha, 1);
    $('pl-pasar-msg').textContent = ''; $('pl-pasar-msg').className = 'msg';
    $('pl-pasar-hecho').hidden = true;
    $('pl-pasar-ok').disabled = false;
    $('pl-pasar-caja').hidden = false;
    refrescarPasar();
    $('pl-pasar-caja').scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  async function hacerPasar(){
    var s = PASAR.sesion; if(!s) return;
    var ids = idsPasar(), nueva = $('pl-pasar-fecha').value;
    var msg = $('pl-pasar-msg'); msg.className = 'msg';
    if(!ids.length){ msg.textContent = 'Marca al menos un atleta.'; msg.className = 'msg error'; return; }
    if(!nueva){ msg.textContent = 'Pon el día en el que lo hace.'; msg.className = 'msg error'; return; }
    if(nueva === s.fecha){ msg.textContent = 'Ese es el mismo día que ya tiene.'; msg.className = 'msg error'; return; }
    msg.textContent = 'Pasándolo…';
    $('pl-pasar-ok').disabled = true;
    var payload = {
      grupo_id: s.grupo_id,
      fecha: nueva,
      dia_semana: diaSemana(nueva),
      titulo: s.titulo || null,
      deporte: s.deporte || null,
      deporte_2: s.deporte_2 || null,
      papel_dia: s.papel_dia || null,
      tipo: s.tipo || null,
      /* El `rol` va vacío a posta: lo vuelve a calcular la base desde el
         papel del día, igual que al guardar desde el formulario. */
      rol: null,
      nota_razonamiento: s.nota_razonamiento || null,
      bloques: Array.isArray(s.bloques) ? s.bloques : [],
      /* Si el original ya lo veían los atletas, la copia también: si no, el
         chaval abriría su día y no vería nada. Y si era borrador, borrador. */
      publicada: !!s.publicada,
      atletas_ids: ids,
      /* Un entrenamiento que se le pasa a una persona no se abre al club
         entero para que se apunte nadie: eso es otra cosa. */
      abierta_inscripcion: false, plazas: null, abierta_a: null,
      hora: s.hora || null,
      lugar: s.lugar || null,
      duracion_min: s.duracion_min || null,
      creado_por: perfil.id
    };
    var res = await sb.from('sesiones').insert(payload).select('id').maybeSingle();
    if(res.error){
      msg.textContent = 'No se ha podido: '+res.error.message; msg.className = 'msg error';
      $('pl-pasar-ok').disabled = false; return;
    }
    PASAR.creadaId = res.data ? res.data.id : null;

    /* El entrenamiento del miércoles YA ESTÁ, que es lo importante. Lo de la
       falta del martes viene después y va aparte a posta: si fallara —el
       permiso de ausencias mira el entrenador del atleta, no el del grupo—
       se avisa y ya, pero no se tira lo principal. */
    var f = await apuntarFaltas(ids, s.fecha, s.id, nueva);
    PASAR.faltasIds = f.creadas;

    var texto = 'Hecho ✓ El '+formatFecha(nueva)+' lo tiene '+nombresDeIds(ids, 4)+
      (payload.publicada ? '' : ' (en borrador: todavía no lo ve)')+
      '. El '+formatFecha(s.fecha)+' sigue igual para el resto del grupo';
