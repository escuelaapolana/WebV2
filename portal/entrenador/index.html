<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona de entrenador · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<!-- Las seis piezas del panel (cabecera, filtros, fila, ficha, campo y franja).
     Son las mismas que ya llevan Tarifas, Pedidos, Usuarios o el Histórico: si
     el club cambia un color o una altura, cambia en todas a la vez y no hay que
     acordarse de esta pantalla. -->
<link rel="stylesheet" href="../../assets/css/panel-piezas.css">
<script src="../../assets/js/panel-piezas.js" defer></script>
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/descansos.js"></script>
<script src="../../assets/js/estadisticas.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .en-wrap { max-width: 1060px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  .en-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; color: var(--navy); margin: 0 0 3px; line-height:1; }
  .en-cab .sub { font-size:13px; color: var(--texto-suave); }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
.pl-semana { margin: 0 0 18px; }
  /* Los ajustes del día, plegados. La línea de resumen es lo que evita que
     plegar signifique esconder: se lee sin abrir nada. */
  .pl-ajustes { border:1px solid var(--linea); border-radius:12px; margin:0 0 16px; background:#fff; }
  .pl-ajustes > summary { list-style:none; cursor:pointer; padding:12px 14px; min-height:44px;
                          display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pl-ajustes > summary::-webkit-details-marker { display:none; }
  .pl-ajustes > summary::after { content:'▾'; margin-left:auto; color:var(--texto-suave); font-size:12px; }
  .pl-ajustes[open] > summary::after { content:'▴'; }
  .pl-ajustes[open] > summary { border-bottom:1px solid var(--linea); }
  .pl-ajustes .pa-et { font-size:14px; font-weight:600; color:var(--navy); }
  .pl-ajustes .pa-res { font-size:13px; color:var(--texto-suave); flex:1 1 auto; min-width:0;
                        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pl-ajustes > *:not(summary) { margin-left:14px; margin-right:14px; }
  .pl-ajustes > *:last-child { margin-bottom:14px; }
  /* La semana en el inicio del entrenador: baja, para que la tarjeta de hoy
     siga viéndose sin rodar. El número de la esquina son los que ya han
     apuntado cómo les fue. */
  .te-semana { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:0 0 14px; }
  .te-d { position:relative; display:flex; flex-direction:column; align-items:center; gap:1px;
          padding:6px 2px; min-height:58px; border:1px solid var(--linea); border-radius:11px;
          background:#fff; font:inherit; cursor:pointer; }
  .te-d .te-n   { font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--texto-suave); }
  .te-d .te-num { font-size:16px; font-weight:600; color:var(--navy); line-height:1; }
  .te-d .te-et  { font-size:9px; color:var(--texto-suave); line-height:1.2; max-width:100%;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .te-d .te-ap  { position:absolute; top:3px; right:4px; min-width:15px; height:15px; padding:0 3px;
                  border-radius:999px; background:#3F7A4C; color:#fff; font-size:9px; font-weight:700;
                  line-height:15px; text-align:center; }
  .te-d.libre { background:var(--crema); border-style:dashed; }
  .te-d.hoy   { border-color:var(--azul-filete); border-width:2px; }
  .te-d.sel   { background:var(--navy); border-color:var(--navy); }
  .te-d.sel .te-n, .te-d.sel .te-num, .te-d.sel .te-et { color:#fff; }
  .pls-cab { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .pls-rango { font-size:14px; color: var(--texto-suave); flex:1 1 auto; }
  .pls-fl, .pls-hoy { min-height:36px; padding:0 12px; border:1px solid var(--linea-borde); border-radius:999px;
                      background:#fff; color: var(--texto); font:inherit; font-size:14px; cursor:pointer; }
  .pls-fl:hover, .pls-hoy:hover { border-color: var(--azul-filete); color: var(--navy); }
  /* Siete columnas fijas: la semana se lee de un vistazo, como la del atleta. */
  .pls-dias { display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; }
  .pls-d { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px;
           min-height:72px; border:1px solid var(--linea); border-radius:12px; background:#fff;
           font:inherit; cursor:pointer; text-align:center; }
  .pls-d:hover { border-color: var(--azul-filete); }
  .pls-d .pls-n   { font-size:11px; letter-spacing:.04em; text-transform:uppercase; color: var(--texto-suave); }
  .pls-d .pls-num { font-size:17px; font-weight:600; color: var(--navy); line-height:1; }
  .pls-d .pls-et  { font-size:11px; color: var(--texto-suave); line-height:1.25;
                    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  /* Un día libre se ve libre: sin él, todos los días parecen tener algo. */
  .pls-d.libre { background: var(--crema); border-style:dashed; }
  .pls-d.hoy   { border-color: var(--azul-filete); }
  .pls-d.sel   { background: var(--navy); border-color: var(--navy); }
  .pls-d.sel .pls-n, .pls-d.sel .pls-num, .pls-d.sel .pls-et { color:#fff; }
  @media (max-width: 620px) {
    .pls-dias { grid-template-columns: repeat(4, 1fr); }
    .pls-d { min-height:64px; }
  }

  .side { flex:0 0 210px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:8px; box-shadow: var(--sombra-suave); }
  /* Cada enlace de la barra lateral se pulsa: 44 px de alto (28g) */
  /* Los enlaces van en el color de cuerpo y NO en el de rótulo: mientras
     compartían color con los rótulos del grupo, la única diferencia entre
     «Planificar» y «Planificar semana» era el tamaño de letra, y a un golpe de
     vista el menú se leía como una lista plana de once cosas. Oscurecerlos
     también mejora el contraste, así que no hay nada que perder. */
  .side nav a { cursor:pointer; font-size:13px; color: var(--texto); padding:10px 12px; border-radius:10px; text-decoration:none;
                display:flex; align-items:center; min-height:44px; box-sizing:border-box; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { background: var(--navy); color:#fff; }
  /* Los rótulos que agrupan el menú («Planificar», «Seguimiento») NO se
     pulsan: solo ponen nombre a lo que viene debajo. Iban en el mismo
     cuerpo y el mismo color que los enlaces, así que parecían una opción
     más; se pulsaban esperando entrar a algún sitio y lo único que pasaba
     era que se subrayaba el texto. Ahora van en mono, más pequeños y
     espaciados —el mismo recurso que usan las etiquetas de las tablas—,
     con una línea que abre cada grupo. Y no se dejan seleccionar, para
     que un toque despistado no deje media palabra en azul.

     ⚠️ Y AUN ASÍ NO SE DISTINGUÍAN, porque seguían compartiendo COLOR con los
     enlaces: mono y 11 px no bastan cuando lo de arriba y lo de abajo son del
     mismo gris. La diferencia de verdad la hace que el enlace sea oscuro y el
     rótulo no. Aquí no se puede aclarar más el rótulo —el gris claro se retiró
     del proyecto porque al sol desaparecía—, así que lo que se oscurece es el
     enlace. Y se le da aire de sobra por arriba: dos grupos pegados se leen
     como uno solo por mucho que haya una línea entre medias. */
  .side nav .side-sep { display:block; font-family: var(--fuente-mono); font-size:11px; letter-spacing:.1em;
                        text-transform:uppercase; color: var(--texto-suave); padding:20px 12px 8px;
                        margin-top:10px; border-top:1px solid var(--linea); user-select:none; cursor:default; }
  .side nav .side-sep:first-child { padding-top:6px; margin-top:0; border-top:0; }
  .cont { flex:1 1 auto; min-width:0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(18px,3vw,26px); box-shadow: var(--sombra-suave); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 12px; }
  .tarjeta h3 { font-size:15px; color: var(--navy); margin: 14px 0 8px; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:13px; padding:2px 8px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); text-transform:capitalize; }
  .pill.activo { background: var(--verde-fondo); color: var(--verde); }
  .pill.lesionado { background:#fdeceb; color:#b3261e; }
  .pill.prueba { background: var(--azul-suave); color: var(--azul-oscuro); }
  /* «Copia sin guardar»: tiene que verse que lo de la pantalla ya no es el
     entrenamiento que se abrió, sino uno nuevo que todavía no existe. */
  .pill--copia { background: var(--azul-suave); color: var(--azul-oscuro); font-weight:600; text-transform:none; }
  /* La línea que dice qué va a pasar al guardar. Va pegada a los botones,
     justo encima, porque es lo que explica lo que hacen. */
  .pl-modo { margin:16px 0 -4px; padding:10px 12px; border-radius:10px; background: var(--crema-media); color: var(--texto); }

  /* formularios */
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:10px 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  /* Los 44 px van aquí, en la regla de todos, y no campo por campo: así no
     vuelve a quedarse ninguno corto por copiar un trozo de otra pantalla.
     Las casillas y los redondeles se quedan fuera: esos no se estiran, y
     quien los pulsa lo hace sobre la fila entera, que ya mide lo suyo. */
  input:not([type="checkbox"]):not([type="radio"]), select, textarea { min-height:44px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color: var(--azul-filete, #3B85C0); }
  textarea { min-height:64px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .acciones { display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .msg { font-size:14px; } .msg.ok { color: var(--verde); } .msg.error { color:#b3261e; } .msg.pendiente { color:#A8453F; font-weight:600; }
  .check { display:flex; align-items:center; gap:8px; }
  .check input { width:auto; }
  .check label { margin:0; }
  /* Cuando la propia etiqueta es el envoltorio, todo el rótulo se puede
     pulsar y la zona llega a los 44 px: a pie de pista no se acierta en un
     cuadradito de 20 px. */
  label.check { min-height:44px; cursor:pointer; }
  label.check span { font-size:14px; color: var(--texto); }

  /* ¿para quién es la sesión? */
  .dest { border:1px solid var(--linea); border-radius:10px; padding:12px 14px; margin-top:14px; background: var(--crema); }
  .dest > label:first-child { margin-top:0; }
  .dest-lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px; margin-top:10px; }
  /* Marcar a un atleta es un gesto de dedo: la fila entera mide 44 px (28g) */
  .dest-lista label { display:flex; align-items:center; gap:8px; margin:0; font-weight:400; font-size:13px; background:#fff; border:1px solid var(--linea); border-radius:10px; padding:7px 10px; cursor:pointer; min-height:44px; box-sizing:border-box; }
  .dest-lista input { width:auto; }
  .dest-aviso { background:#fff8e6; border:1px solid #f0d98a; color:#7a5c00; border-radius:10px; padding:8px 11px; font-size:13px; margin:10px 0 0; }
  .dest-barra { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pista { font-size:13px; color: var(--texto-suave); margin:6px 0 0; line-height:1.5; }
  .pista code { font-family: var(--fuente-dato); font-size:13px; background: var(--crema-media); border-radius:10px; padding:1px 5px; }

  /* ¿abierto para apuntarse? (resumen en una línea) */
  .abre-resumen { display:inline-block; font-family: var(--fuente-texto); font-size:13px;  background: var(--crema-media); color: var(--navy); border-radius:999px; padding:4px 11px; margin:10px 0 0; line-height:1.5; }
  .abre-resumen.cerrado { background: var(--crema-media); color: var(--texto-suave); }
  .abre-resumen.ojo { background:#fff8e6; color:#7a5c00; }

  /* quién se ha apuntado */
  .ap-ses { border:1px solid var(--linea); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .ap-cab { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:6px; }
  .ap-cab strong { font-size:15px; color: var(--navy); }
  .ap-lista { list-style:none; margin:8px 0 0; padding:0; }
  .ap-lista li { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:48px; font-size:14px; color: var(--texto); padding:8px 0; border-bottom:1px solid #F5F0E6; }
  .ap-lista li:last-child { border-bottom:none; }
  .ap-lista li span { font-family: var(--fuente-mono); font-size:13px; color: var(--texto-suave); }
  .ap-quitar { border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); border-radius:999px; min-height:44px; padding:10px 16px; font-size:13px; cursor:pointer; font-family: var(--fuente-texto); }
  .ap-quitar:hover { border-color:#b3261e; color:#b3261e; }

  /* Mejores marcas · la marca es un dato que se compara en columna, así que va
     en mono y en navy: el azul se reserva para lo que se pulsa (31a). */
  .mrc { display:flex; flex-wrap:wrap; gap:5px; }
  .mrc span { font-family: var(--fuente-dato); font-size:13px; background: var(--crema-media); color: var(--navy); border-radius:10px; padding:2px 7px; white-space:nowrap; }
  .mrc-no { font-size:13px; color: var(--texto-suave); font-style:italic; }

  /* ---------- PASAR LISTA ---------- */
  .lst-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:16px 0 12px; }
  .lst-cab > div { flex:1 1 auto; min-width:0; }
  .lst-cab .lst-ctx { font-size:13px; color: var(--texto-suave); display:block; margin-bottom:3px; }
  /* Los nombres propios del club (La Tribu, Madre Tierra, El Cubo) van en ámbar:
     enseñan qué tiene identidad y qué es una categoría (carácter 31c). Van en
     texto, nunca en bloque de fondo, para no confundirse con un aviso. */
  .nombre-club { color:#8A5307; font-weight:600; }
  .lst-cab .lst-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:28px; text-transform:uppercase; color: var(--navy); line-height:1; }
  .lst-contador { font-family: var(--fuente-dato); font-size:15px; color: var(--navy); white-space:nowrap; }
  .lst-contador.cero { color: var(--texto-suave); }
  .lst-avisos { background:#FBE9E7; border:1px solid #F0D9D9; color:#8B3A35; border-radius:10px; padding:11px 14px; margin-bottom:12px; font-size:13px; }
  .lst-avisos strong { display:block; color:#A8453F; margin-bottom:5px; }
  .lst-avisos ul { margin:0 0 0 18px; padding:0; }
  .lst-avisos li { margin:2px 0; }
  .lst-avisos li b { color:#8B3A35; }
  .lst-avisos li span { color:#A8453F; opacity:.75; }
  .lst-avisos p { margin:7px 0 0; font-size:13px; opacity:.85; }
  .lst-acciones { display:flex; gap:8px; margin-bottom:10px; }
  .lst-acciones button { flex:1; padding:11px; min-height:44px; border-radius:999px; background:#fff; border:1px solid var(--linea-borde); color: var(--texto); font-size:14px; cursor:pointer; font-family: var(--fuente-texto); }
  .lst-acciones button:hover { border-color: var(--azul-filete, #3B85C0); color: var(--azul-oscuro); }
  .lst-buscar { margin-bottom:10px; }
  /* Kit 30d · un solo contenedor con separadores: diez filas con su borde y su
     radio parecen diez tarjetas y se pierde la lista. Cada fila mide 48 px de
     alto como mínimo y se pulsa ENTERA para marcar presente (fundamentos 28g):
     el ✓ es un atajo, no el único sitio donde se acierta con el dedo. */
  .lst-lista { background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; overflow:hidden; }
  .lst-fila { background:#fff; border-bottom:1px solid var(--linea); min-height:48px; padding:12px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .lst-fila:last-child { border-bottom:none; }
  .lst-fila:hover { background: var(--crema); }
  .lst-fila.es-ausente { background:#FBE9E7; }
  .lst-fila.es-ausente:hover { background:#F7DEDB; }
  .lst-fila.es-prueba { background: var(--azul-suave); }
  .lst-fila.es-prueba:hover { background:#DFEBF5; }
  .avatar { width:34px; height:34px; flex:0 0 34px; border-radius:50%; background: var(--crema-media); color: var(--navy); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;  }
  .lst-fila.es-ausente .avatar { background:#fff; color:#A8453F; }
  .lst-nom { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; }
  /* La etiqueta se queda del ancho de su texto (`align-self`, sin tocar la
     columna: el botón del nombre tiene que seguir ocupando todo el ancho,
     que es su zona de toque) y, si el canal fuera largo, se recorta antes
     que sacar la lista por el borde derecho de un móvil. */
  .lst-nom .et-foto { align-self:flex-start; max-width:100%; overflow:hidden; margin-bottom:2px; }
  .lst-nom > button { background:none; border:none; padding:0; margin:0; text-align:left; font-family: var(--fuente-texto); font-size:15px; color: var(--navy); cursor:pointer; text-decoration:underline; text-decoration-color: var(--linea-borde); text-underline-offset:3px; min-height:44px; display:flex; align-items:center; }
  .lst-nom > button:hover { color: var(--azul-oscuro); }
  /* ------------------------------------------------------------
     LO DE LAS FOTOS
     En gris tinta y NO en rojo, a propósito. Que una familia no quiera
     que su hijo salga en Instagram es una decisión suya, no una
     incidencia: con colores de alarma el crío quedaría señalado en la
     lista delante de cualquiera que mire la pantalla. Se tiene que ver
     a la primera y no tiene que gritar.
     El «no consta» va aún más apagado y con el borde discontinuo:
     es lo único que se puede arreglar preguntando, y se distingue de
     un no de verdad sin tener que leer.
     ------------------------------------------------------------ */
  .et-foto { display:inline-flex; align-items:center; gap:5px; font-family: var(--fuente-mono); font-size:12px;
             padding:3px 9px; border-radius:999px; background:#EAEDF2; color:#4A5568; white-space:nowrap; vertical-align:middle; }
  .et-foto svg { width:13px; height:13px; flex:none; }
  .et-foto.nose { background:transparent; color:#6B7280; border:1px dashed #C4CBD6; padding:2px 8px; }
  .avi-foto { background:#F2F4F8; border:1px solid #DCE1E9; color:#3B4557; border-radius:10px;
              padding:11px 14px; margin-bottom:12px; font-size:13px; }
  .avi-foto strong { display:block; color: var(--navy); margin-bottom:5px; }
  .avi-foto ul { margin:0 0 0 18px; padding:0; }
  .avi-foto li { margin:2px 0; }
  .avi-foto li b { color: var(--navy); }
  .avi-foto p { margin:7px 0 0; opacity:.85; line-height:1.5; }
  /* En la tarjeta de hoy no cabe una caja: cabe una línea. Y esa tarjeta
     es azul marino con letra blanca, así que la línea va en el mismo azul
     claro que el resto de sus detalles, no en el gris de las listas. */
  .hoy-e .he-foto { display:flex; align-items:flex-start; gap:8px; margin:0; font-size:13px; color:#D6E4F0; line-height:1.5; }
  .hoy-e .he-foto strong { color:#fff; font-weight:600; }
  .hoy-e .he-foto svg { width:15px; height:15px; flex:none; margin-top:2px; color:#7FB6E0; }

  .lst-sub { font-size:13px; color: var(--texto-suave); }
  .lst-sub.avisada { color:#A8453F; }
  .lst-sub.prueba { color: var(--azul-oscuro); }
  .seg { display:flex; gap:8px; flex:0 0 auto; }
  .seg button { width:44px; height:44px; min-height:44px; border-radius:50%; border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); font-size:17px; line-height:1; cursor:pointer; padding:0; }
  .seg button.si.on { background: var(--verde); border-color: var(--verde); color:#fff; }
  .seg button.no.on { background:#fff; border-color:#A8453F; color:#A8453F; font-weight:700; }
  .seg button:focus-visible { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:2px; }
  .lst-pie { margin-top:16px; padding-top:14px; border-top:1px solid var(--linea); display:flex; flex-direction:column; gap:8px; align-items:center; }
  .lst-pie .btn { width:100%; max-width:340px; }
  .lst-pie p { font-size:13px; color: var(--texto-suave); text-align:center; margin:0; }
  .lst-resumen { font-size:14px; color: var(--navy); text-align:center; margin:0; }

  /* ---------- NOTA DEL DÍA (al pasar lista) ----------
     Botón discreto en cada fila, igual que en el panel del club. Si ese
     día ya hay algo apuntado se pone en azul con un punto. */
  .nd-btn { width:44px; height:44px; flex:0 0 44px; padding:0; position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--linea-borde); background:#fff; border-radius:10px;
    color: var(--texto-suave); cursor:pointer; }
  .nd-btn svg { width:20px; height:20px; }
  .nd-btn.tiene { color: var(--azul-oscuro); background: var(--azul-suave); border-color:#C9D9E7; }
  .nd-btn.tiene::after { content:""; position:absolute; top:5px; right:5px; width:8px; height:8px;
    border-radius:50%; background: var(--azul-oscuro); }
  .nd-btn:focus-visible { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:2px; }
  .privado-linea { font-size:13px; color: var(--texto-suave); text-align:center; margin:0; }
  /* En un móvil estrecho la fila lleva ya avatar, nota y los dos botones de
     lista: se aprietan los huecos para que el nombre quepa en una línea.
     Los botones siguen midiendo 44px, que es lo que se toca. */
  @media (max-width: 430px) {
    .lst-fila { gap:8px; padding:12px 10px; }
    .seg { gap:6px; }
  }

  /* Ventana emergente de la nota
     ⚠️ POR ENCIMA DE LA BARRA DE ABAJO (ver la nota de .ficha-fondo): esta
     ventana también llegaba hasta el borde inferior de la pantalla y la barra
     le comía el botón de guardar. */
  #modal-nota { position:fixed; inset:0; z-index:720; background:rgba(46,66,86,.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:clamp(14px,5vh,60px) 14px; overflow:auto;
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
  #modal-nota.oculto { display:none !important; }
  #modal-nota .modal-caja { background:#fff; border:1px solid var(--linea); border-radius:14px;
    box-shadow:0 30px 70px -25px rgba(46,66,86,.55); padding:20px; width:min(520px,100%);
    box-sizing:border-box; animation:modal-nota-sube .2s ease; }
  @keyframes modal-nota-sube { from{ transform:translateY(12px); opacity:.6; } to{ transform:none; opacity:1; } }
  #modal-nota h3 { font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase;
    color: var(--navy); font-size:21px; line-height:1.1; margin:0; }
  #modal-nota .mn-sub { font-family: var(--fuente-mono); font-size:13px; color: var(--texto-suave); margin:4px 0 0; }
  #modal-nota label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:14px 0 5px; }
  #modal-nota select, #modal-nota textarea { width:100%; box-sizing:border-box; padding:12px;
    border:1px solid var(--linea-borde); border-radius:10px; background:#fff;
    font-family: var(--fuente-texto); font-size:16px; color: var(--navy); }
  #modal-nota textarea { min-height:110px; resize:vertical; line-height:1.45; }
  #modal-nota .mn-acc { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  #modal-nota .mn-msg { font-size:13px; color: var(--texto-suave); }
  #modal-nota .mn-msg.error { color:#A8453F; font-weight:600; }
  .mn-privado { background: var(--azul-suave); border:1px solid #C9D9E7; border-radius:10px;
    padding:9px 11px; font-size:13px; color: var(--navy); margin:12px 0 0; }
  .mn-lista { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  .nd-item { border:1px solid var(--linea); border-radius:10px; padding:10px 12px; background: var(--crema); }
  .nd-item.editandose { border-color: var(--azul-filete, #3B85C0); box-shadow:0 0 0 2px rgba(59,133,192,.16); }
  .nd-item .nm { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .nd-tipo { font-family: var(--fuente-mono); font-size:13px; padding:3px 9px; border-radius:999px;
    background: var(--crema-media); color: var(--navy); }
  .nd-tipo.t-comportamiento { background:#FBE9E7; color:#A8453F; }
  .nd-tipo.t-lesion { background:#FDF3DD; color:#8A5507; }
  .nd-tipo.t-material { background:#EDE7F6; color:#5B4A8A; }
  .nd-tipo.t-familia { background: var(--azul-suave); color: var(--azul-oscuro); }
  .nd-quien { font-size:13px; color: var(--texto-suave); }
  .nd-txt { margin:6px 0 0; font-size:14px; color: var(--navy); line-height:1.45; white-space:pre-wrap; }
  .nd-acc { display:flex; gap:6px; margin-top:8px; }
  .nd-lin { border:0; background:none; padding:8px 10px; min-height:44px; font-family: var(--fuente-texto);
    font-size:13px; color: var(--azul-oscuro); cursor:pointer; text-decoration:underline; }
  .nd-lin.peligro { color:#A8453F; }

  /* ---------- FICHA DEL ATLETA ---------- */
  /* ⚠️ EL NÚMERO DE APILADO IMPORTA, Y ESTE COSTÓ UN FALLO.
     La ficha ocupa la pantalla entera, pero la barra de pestañas de abajo
     (.tabbar, 600) se dibujaba por encima y le tapaba los últimos 70 px:
     la línea de «los cambios de grupo y las bajas quedan registrados…» se
     leía a medias y no había forma de bajar más. La ficha es una ventana
     que se abre encima de todo, así que va por encima de la barra —tiene su
     propio «← Volver»— y por debajo de las sugerencias de ejercicio (900),
     que se abren DENTRO de ella y tienen que verse. */
  .ficha-fondo { position:fixed; inset:0; background:rgba(46,66,86,.45); z-index:700; display:flex; justify-content:center; align-items:flex-start; overflow-y:auto; padding:0; }
  /* El hueco de abajo no es decorativo: en un iPhone la última línea queda
     pegada al borde y a la franja del gesto de inicio. */
  .ficha { background: var(--crema); width:100%; max-width:560px; min-height:100%; box-sizing:border-box; padding:0 0 calc(30px + env(safe-area-inset-bottom)); }
  @media (min-width:620px){ .ficha-fondo { padding:24px 16px; } .ficha { min-height:0; border-radius:14px; overflow:hidden; box-shadow: var(--sombra-tarjeta); } }
  .ficha-barra { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background: var(--crema); position:sticky; top:0; z-index:2; border-bottom:1px solid var(--linea); }
  .ficha-barra button { background:none; border:none; color: var(--azul-oscuro); font-size:15px; cursor:pointer; font-family: var(--fuente-texto); min-height:44px; padding:10px 4px; }
  .ficha-enc { padding:16px 20px 18px; display:flex; gap:16px; align-items:center; }
  .ficha-enc .avatar { width:64px; height:64px; flex-basis:64px; font-size:21px; }
  .ficha-enc h3 { font-family: var(--fuente-titulo); font-weight:700; font-size:28px; text-transform:uppercase; color: var(--navy); line-height:1; margin:0 0 4px; }
  .ficha-enc p { font-size:14px; color: var(--texto-suave); margin:0; }
  .ficha-bloque { margin:0 16px 14px; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px 16px; }
  .ficha-bloque > h4 { font-size:13px; color: var(--texto-suave); margin:0 0 10px; font-weight:600; }
  .dato { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #F5F0E6; font-size:14px; color: var(--texto); }
  .dato:last-child { border-bottom:none; padding-bottom:0; }
  /* El dato de la derecha: en mono solo si es una cifra que se compara
     («12 de 15», una licencia); en Plex Sans si es una palabra («Al día»). */
  .dato b { font-family: var(--fuente-texto); font-size:13px; font-weight:400; color: var(--navy); text-align:right; }
  .dato b.cifra { font-family: var(--fuente-dato); }
  .dato b.bien { color:#3F7A4C; } .dato b.ojo { color:#8A7530; } .dato b.mal { color:#A8453F; }
  .ficha-tit { padding:16px 20px 8px; font-size:13px; font-weight:600; color: var(--texto-suave); }
  /* Los dos cuadernos: privado (crema, candado) y familia (azul, ojo).
     Se distinguen a propósito por color, etiqueta y texto explícito. */
  .ficha-bloque.priv { background:#FFF8E6; border-color:#F0D98A; }
  .ficha-bloque.fam  { background: var(--azul-suave); border-color:#C9D9E7; }
  .ficha-bloque.priv .dato, .ficha-bloque.fam .dato,
  .ficha-bloque.priv .mini-lista li, .ficha-bloque.fam .mini-lista li { border-bottom-color: rgba(46,66,86,.10); }
  .ficha-bloque > h4 .marca-priv, .ficha-bloque > h4 .marca-fam { font-size:13px; font-weight:600; border-radius:999px; padding:3px 9px; margin-left:8px; white-space:nowrap; }
  .ficha-bloque > h4 .marca-priv { background:#7A5C00; color:#fff; }
  .ficha-bloque > h4 .marca-fam  { background: var(--azul-oscuro); color:#fff; }
  .ficha-bloque .marca-expl { font-size:13px; margin:-4px 0 10px; color: var(--texto); }
  .ficha-bloque.priv .marca-expl { color:#7A5C00; }
  .ficha-bloque.fam  .marca-expl { color: var(--azul-oscuro); }
  .ficha-bloque textarea { background:#fff; }
  /* Dos filas de campos seguidas se pegaban entre ellas y respiraban por
     dentro: dentro de la fila 12 px y entre una fila y otra ninguno, así que
     no se leía como dos parejas sino como un montón de cajas. */
  .ficha-bloque .grid2 + .grid2 { margin-top:12px; }
  .acc-lista { margin:0 16px; display:flex; flex-direction:column; gap:8px; }
  .acc { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:0; overflow:hidden; }
  .acc > button { width:100%; background:none; border:none; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; font-family: var(--fuente-texto); font-size:15px; color: var(--navy); text-align:left; }
  .acc > button:hover { background: var(--azul-suave); }
  .acc > button .acc-val { font-size:14px; color: var(--texto-suave); white-space:nowrap; }
  .acc > button .acc-val.azul { color: var(--azul-oscuro); font-weight:600; }
  .acc.roja { background:#FBE9E7; border-color:#F0D9D9; }
  .acc.roja > button { color:#A8453F; } .acc.roja > button .acc-val { color:#A8453F; }
  .acc.roja > button:hover { background:#F7DEDB; }
  .acc[hidden] { display:none; }
  .acc-caja { padding:0 16px 14px; border-top:1px solid var(--linea); }
  .acc-caja label:first-child { margin-top:12px; }
  .ficha-nota { margin:16px 16px 0; background: var(--crema-banda); border:1px solid var(--linea-borde); border-radius:10px; padding:12px 15px; font-size:13px; color: var(--texto); line-height:1.45; }
  .mini-lista { list-style:none; margin:0; padding:0; }
  .mini-lista li { display:flex; justify-content:space-between; gap:10px; font-size:13px; color: var(--texto); padding:6px 0; border-bottom:1px solid #F5F0E6; }
  .mini-lista li:last-child { border-bottom:none; }
  .mini-lista li span { font-family: var(--fuente-mono); font-size:13px; color: var(--texto-suave); white-space:nowrap; }
  .mini-lista li b { font-weight:600; color: var(--navy); }
  /* La fila que lleva a otro sitio. Es un botón de verdad —se pulsa con el
     pulgar a pie de pista, así que ocupa la fila entera y llega a los 44 px—
     y se nota que lo es: el nombre del entrenamiento en azul y el chevrón
     al final, como en el resto de la ficha. */
  .mini-lista li.fila-ir { padding:0; }
  /* La fecha arriba, en línea con la primera línea del texto, como en todas
     las demás filas de la ficha: si aquí se centrara, esta lista se leería
     distinta que las de al lado sin ninguna razón. */
  .mini-lista li.fila-ir button { display:flex; width:100%; align-items:flex-start; justify-content:space-between; gap:10px;
    min-height:44px; padding:8px 0; background:none; border:0; cursor:pointer; text-align:left;
    font-family: var(--fuente-texto); font-size:13px; color: var(--texto); -webkit-tap-highlight-color:transparent; }
  .mini-lista li.fila-ir button b { display:block; flex:1; min-width:0; }
  .mini-lista li.fila-ir button b em { display:block; font-style:normal; margin-top:2px;
    color: var(--azul-oscuro); font-size:13px; }
  .mini-lista li.fila-ir button:hover b em { text-decoration:underline; text-underline-offset:3px; }
  .mini-lista li.fila-ir .chev { color: var(--azul-oscuro); font-size:15px; }
  .fila-atleta { cursor:pointer; }
  .fila-atleta:hover { background: var(--azul-suave); }
  .fila-atleta td:first-child { color: var(--azul-oscuro); text-decoration:underline; text-decoration-color: var(--linea-borde); text-underline-offset:3px; }

  /* editor de bloques */
  .editor-bloque { border:1px solid var(--linea); border-radius:14px; padding:12px; margin-bottom:12px; background: var(--crema); }
  .b-cab { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .b-cab .b-etiqueta { flex:1 1 210px; font-weight:600; }
  .b-cab .b-matiz { flex:1 1 190px; font-style:italic; }
  .filas-cab { display:grid; grid-template-columns:1.5fr .58fr .78fr .72fr 1.7fr .85fr 44px; gap:6px; font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); padding:0 2px 4px; }
  .editor-fila { margin-bottom:9px; }
  .fila-l1 { display:grid; grid-template-columns:1.5fr .58fr .78fr .72fr 1.7fr .85fr 44px; gap:6px; align-items:center; }
  .fila-l2 { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:5px; padding-right:40px; }
  .fila-l2 .f-detalle { flex:1 1 150px; min-width:0; }
  .fila-l2 .f-observaciones { flex:2 1 280px; min-width:0; }
  .editor-fila input, .editor-fila select { padding:8px 8px; font-size:13px; border-radius:10px; }
  .f-cel-cz { min-width:0; }
  .f-cel-cz select, .f-cel-cz input { width:100%; }

  /* ---- recuperación de la fila (modo + valor + trote/parado) ----
     Tres controles en una sola celda: se adaptan al deporte y bajan a
     dos líneas cuando no caben, en vez de encogerse hasta no poder
     tocarlos. */
  .f-cel-rec { display:flex; gap:5px; flex-wrap:wrap; min-width:0; align-items:center; }
  .f-cel-rec select, .f-cel-rec input { min-width:0; }
  .f-cel-rec .f-rec-modo  { flex:1 1 88px; }
  .f-cel-rec .f-rec-valor { flex:1 1 54px; font-family: var(--fuente-dato); }
  .f-cel-rec .f-rec-forma { flex:1 1 72px; }
  .f-cel-rec.rec-oculta { visibility:hidden; }                 /* rodaje o tirada: no hay nada que recuperar */
  .f-cel-rec.rec-vacia .f-rec-valor, .f-cel-rec.rec-vacia .f-rec-forma { display:none; }
  .f-cel-rec.rec-sin-forma .f-rec-forma { display:none; }
  .f-cel-rec.rec-falta .f-rec-modo { border-color:#D9A441; background:#FFFBF0; }
  /* natación: salida y descanso son cosas distintas y se distinguen por color */
  .f-cel-rec.rec-salida .f-rec-modo { color:#1F5C8F; background:#E7F0F8; border-color:#C7DDF0; }
  .f-cel-rec.rec-descanso .f-rec-modo { color:#6B5227; background:#F7EFDD; border-color:#E6D4AE; }

  /* montaña: el desnivel de la subida */
  .fila-l2 .f-desnivel { flex:0 1 150px; min-width:0; display:none; font-family: var(--fuente-dato); }
  #bloques-cont.modo-montana .f-desnivel { display:block; }

  /* pie del bloque: el descanso que va DESPUÉS (el separador que faltaba) */
  .b-pie { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .b-pie .btn-mini { flex:0 0 auto; }
  .b-rec-caja { display:flex; gap:6px; align-items:center; flex:1 1 210px; min-width:0; margin:0; }
  .b-rec-caja > span { font-size:13px; font-weight:400; color: var(--texto-suave); white-space:nowrap; }
  .b-rec-caja input { flex:0 1 78px; min-width:0; padding:8px; font-size:13px; border-radius:10px; font-family: var(--fuente-dato); }
  .b-rec-ej-caja { display:none; }
  #bloques-cont.modo-cubo .b-rec-ej-caja { display:flex; }

  /* volumen y tiempo de la sesión, separados */
  .ses-resumen { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0 0; }
  .ses-resumen[hidden] { display:none; }
  .sr-dato { font-family: var(--fuente-dato); font-size:15px; color: var(--navy); background: var(--crema-media); border-radius:999px; padding:5px 12px; }
  .sr-dato.sr-tiempo { background: var(--azul-suave); color: var(--azul-oscuro); }
  .sr-nota { flex:1 1 100%; font-size:13px; color: var(--texto-suave); line-height:1.4; margin:0; }

  /* calzado / carga según el tipo de sesión */
  #bloques-cont .f-carga { display:none; }
  #bloques-cont.modo-gym .f-carga { display:block; }
  #bloques-cont.modo-gym .f-calzado { display:none; }
  /* El RIR solo donde se usa: en gimnasio. Quien no lo use no lo ve
     estorbando, que es como está pedido. Debajo de la carga y con un
     respiro entre las dos, para que no se lean como un solo campo. */
  #bloques-cont .f-rir { display:none; }
  #bloques-cont.modo-gym .f-rir { display:block; margin-top:6px; }

  /* material de natación (varios a la vez) */
  .f-material-caja { flex:1 1 100%; display:none; gap:5px; flex-wrap:wrap; align-items:center; }
  #bloques-cont.con-material .f-material-caja { display:flex; }
  .f-material-caja > .mat-tit { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); margin-right:2px; }
  .mat-op { margin:0; position:relative; }
  /* la casilla se oculta a la vista pero se sigue pudiendo enfocar con el teclado */
  .mat-op input { position:absolute; width:1px; height:1px; opacity:0; margin:0; padding:0; }
  /* Cada material se marca con el dedo: 44 px de alto, creciendo el hueco (28g) */
  .mat-op span { display:inline-flex; align-items:center; min-height:44px; font-size:13px; line-height:1; padding:6px 12px; border:1px solid var(--linea-borde); border-radius:999px; background:#fff; color: var(--texto-suave); cursor:pointer; user-select:none; }
  .mat-op input:checked + span { background: var(--azul-suave); border-color: var(--azul-filete, #3B85C0); color: var(--azul-oscuro); font-weight:600; }
  .mat-op input:focus-visible + span { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:2px; }
  /* Zona pulsable de 44 px: lo que crece es el relleno, no la letra (28g) */
  /* 44 de alto Y de ancho: era el botón más pequeño de la pantalla y el que
     más se lamenta fallar, porque borra un ejercicio o un bloque entero. */
  .mini-x { border:1px solid var(--linea-borde); background:#fff; border-radius:10px; width:44px; min-width:44px; height:44px; min-height:44px; cursor:pointer; color: var(--texto-suave); font-size:18px; line-height:1; padding:0; }
  .mini-x:hover { border-color:#b3261e; color:#b3261e; }
  .btn-mini { font-family: var(--fuente-texto); font-size:13px;  border:1px solid var(--linea-borde); background:#fff; color: var(--azul-oscuro); border-radius:999px; min-height:44px; padding:11px 18px; cursor:pointer; }
  .btn-mini:hover { background: var(--azul-suave); border-color: var(--azul-filete, #3B85C0); }

  /* buscador de ejercicios */
  .buscador-ej { position:relative; }
  .buscador-ej input { border-radius:10px; }
  .buscador-ej.abierto input { border-radius:10px 10px 0 0; border-bottom-color: transparent; }
  .ej-res { border:1px solid var(--linea-borde); border-top:none; border-radius:0 0 10px 10px; max-height:240px; overflow-y:auto; background:#fff; box-shadow: var(--sombra-suave); }
  /* Se elige con el dedo de una lista larga: 44 px por resultado (28g) */
  .ej-item { padding:8px 11px; min-height:44px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--linea); display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .ej-item:last-child { border-bottom:none; }
  .ej-item:hover, .ej-item.sel { background: var(--azul-suave); }
  .ej-item .ej-meta { font-family: var(--fuente-mono); font-size:13px; text-transform:none;  color: var(--texto-suave); white-space:nowrap; }
  .ej-vacio { padding:10px 11px; font-size:13px; color: var(--texto-suave); }
  .ej-ayuda { font-size:13px; color: var(--texto-suave); margin:6px 0 0; }
  .editor-fila.fila-activa { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:3px; border-radius:10px; }

  /* ============================================================
     SUGERENCIAS PEGADAS A CADA FILA
     ------------------------------------------------------------
     Antes había UN buscador, arriba del todo, y las filas debajo.
     Con nueve ejercicios en un entrenamiento eso son nueve viajes
     hasta arriba y nueve vueltas: en el móvil, insoportable. El
     entrenador lo dijo tal cual: «si estoy en vuelta a la calma,
     tengo que seleccionar y subir al buscador».

     Ahora cada fila escribe en su sitio y las sugerencias salen
     pegadas a SU campo. Cuatro cosas que hay que cuidar y que son
     donde estos campos salen mal en el móvil:

     1 · POSITION: FIXED, Y NO ES UN CAPRICHO. `apolana.css`,
         `portal-auth.js` y `admin-auth.js` ponen `overflow-x:hidden`
         en el body, y eso RECORTA cualquier cosa colgada que se
         salga. Ya se comió el «Salir» del menú del avatar. Con
         `fixed` la lista sale del flujo y no la recorta nadie; las
         coordenadas las pone el JS al abrirla.
     2 · Se abre hacia ARRIBA si no cabe abajo, para no quedar
         debajo del teclado justo cuando estás escribiendo.
     3 · 44 px por sugerencia: se pulsan de pie y con prisa.
     4 · Y se elige en `mousedown`, no en `click`: en el móvil el
         `click` llega DESPUÉS del `blur`, y para entonces la lista
         ya se habría cerrado y el dedo habría caído en el vacío.
     ============================================================ */
  .ej-sug { position:fixed; z-index:900; background:#fff; border:1px solid var(--linea-borde);
    border-radius:12px; box-shadow: var(--sombra-suave, 0 6px 24px rgba(0,0,0,.14));
    max-height:min(46vh, 300px); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0; }
  .ej-sug[hidden] { display:none; }
  /* El nombre en una línea y la categoría debajo, en pequeño. En columna y no
     en dos extremos: la caja es estrecha y, separándolos, «Trote de vuelta a
     la calma» se partía en tres líneas mientras «Recuperación» se iba sola al
     otro lado. Apilado se lee de un vistazo y la fila mide lo mismo siempre. */
  .ej-sug .sug { display:block; min-height:44px; padding:7px 13px; font-size:15px;
    line-height:1.35; color: var(--texto); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .ej-sug .sug > span:first-child { display:block; overflow-wrap:anywhere; }
  .ej-sug .sug .sug-cat { display:block; margin-top:1px; font-size:12px; line-height:1.3;
    color: var(--texto-suave); }
  .ej-sug .sug.sel, .ej-sug .sug:hover { background: var(--azul-suave); }
  .ej-sug .sug b { font-weight:700; color: var(--navy); }
  /* La primera línea cuando lo escrito no está en el banco: no es una
     sugerencia, es la confirmación de que se puede seguir sin elegir nada. */
  /* Es una frase, no una fila de dos extremos: en `flex` el nombre largo se
     partía y el «tal cual» se iba solo a la derecha. Como texto corrido se
     lee de una vez. */
  .ej-sug .sug-libre { display:block; border-bottom:1px solid var(--linea);
    color: var(--texto-suave); font-size:14px; overflow-wrap:anywhere; }
  .ej-sug .sug-libre b { color: var(--navy); }

  /* «¿Es nuevo? Añádelo al banco». Ni bloquea ni obliga: el entrenamiento
     se guarda igual. Es la forma de que el catálogo se llene usándolo. */
  .banco-nuevos { margin-top:10px; padding:11px 13px; border-radius:12px;
    background: var(--azul-suave); border:1px solid #C9DDEE; }
  .banco-nuevos[hidden] { display:none; }
  .banco-nuevos p { margin:0 0 8px; font-size:14px; line-height:1.45; color: var(--navy); }
  .banco-nuevos .bn-fila { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:7px; }
  .banco-nuevos .bn-nom { flex:1 1 auto; min-width:0; font-size:14px; font-weight:600;
    color: var(--navy); overflow-wrap:anywhere; }

  /* planificar semana */
  .sw-ayuda { background: var(--crema); border:1px solid var(--linea); border-radius:10px; padding:11px 14px; margin-top:14px; font-size:13px; color: var(--texto); }
  /* Se pulsa para abrir: 44 px de alto como todo lo demás (28g) */
  .sw-ayuda summary { cursor:pointer; font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--azul-oscuro);
                      min-height:44px; display:flex; align-items:center; }
  .sw-ayuda pre { background:#fff; border:1px solid var(--linea); border-radius:10px; padding:10px 12px; overflow-x:auto; font-size:13px; line-height:1.5; margin:10px 0; white-space:pre; }
  .sw-ayuda ul { margin:8px 0 0 18px; padding:0; }
  .sw-ayuda li { margin:3px 0; }
  .sw-ayuda code { font-family: var(--fuente-dato); font-size:13px; background: var(--crema-media); border-radius:10px; padding:1px 5px; }
  /* La semana pegada y el ejemplo son texto que se lee en columna (los datos
     van separados por «|»): aquí la mono sí ayuda a cuadrarlo. */
  .sw-ayuda pre { font-family: var(--fuente-dato); }
  #sw-texto { min-height:230px; font-family: var(--fuente-dato); font-size:13px; line-height:1.55; }
  .sw-dia { border:1px solid var(--linea); border-radius:14px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .sw-dia.excluido { opacity:.42; }
  .sw-dia-cab { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px; }
  .sw-fecha { font-family: var(--fuente-texto); font-size:13px; color: var(--navy); background: var(--crema-media); border-radius:999px; padding:3px 10px; }
  .sw-choque { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; background:#fdeceb; color:#b3261e; border-radius:999px; padding:3px 10px; }
  .sw-dia-campos { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin-bottom:6px; }
  /* 44 px también aquí: estos campos se corrigen a pie de pista, con el
     pulgar, y medían 35. Lo que crece es el hueco, no la letra. */
  .sw-dia-campos input, .sw-dia-campos select { min-height:44px; box-sizing:border-box;
                                                padding:7px 9px; font-size:13px; border-radius:10px; }
  .sw-lab { display:block; font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); margin-bottom:3px; }
  .sw-nota { font-size:13px; color: var(--texto-suave); font-style:italic; margin:6px 0 0; }
  /* Destinatario de un día suelto: se lee sin abrir nada, y lo que hay que
     tocar para cambiarlo va plegado al lado. */
  .sw-dest-dia { margin-top:8px; }
  .sw-dest-fila { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .sw-dest-txt { font-size:13px; color: var(--texto-suave); }
  .sw-dest-caja { margin-top:8px; }
  .sw-dest-caja .check { margin:0 0 4px; }
  .sw-dest-lista { margin-top:8px; }
  /* Un día que se ha salido de lo de la semana se ve sin leer: filete azul. */
  .sw-dia.propio { border-left:3px solid var(--azul-filete, #3B85C0); }
  .sw-dia.propio .sw-dest-txt { color: var(--azul-oscuro); font-weight:600; }
  .sw-bloque { margin-top:9px; }
  .sw-bloque h4 { margin:0 0 4px; font-size:13px; font-family: var(--fuente-mono); text-transform:none;  color: var(--texto-suave); }
  .sw-bloque ul { margin:0 0 0 17px; padding:0; }
  .sw-bloque li { font-size:13px; color: var(--texto); margin:2px 0; }
  .sw-bloque li b { color: var(--navy); font-weight:600; }
  .sw-chip { font-family: var(--fuente-mono); font-size:13px; background: var(--crema-media); color: var(--texto-suave); border-radius:10px; padding:2px 7px; margin-left:5px; }
  .sw-avisos { background:#fff8e6; border:1px solid #f0d98a; color:#7a5c00; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .sw-avisos ul { margin:6px 0 0 18px; padding:0; }
  .sw-resumen { font-size:14px; color: var(--navy); margin:0 0 12px; }
  .sw-barra { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  /* Botones de la planificación por semanas (incluidos los de mover semana): dedo cómodo */
  .sw-barra .btn, .sw-barra .btn-mini, .sem-btn { min-height:44px; }
  .sw-radios { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .sw-radios label { display:flex; align-items:center; gap:6px; margin:0; font-weight:400; font-size:13px; }
  .sw-radios input { width:auto; }
  .sw-file { padding:8px; background:#fff; }
  .sw-sep { border:none; border-top:1px solid var(--linea); margin:22px 0 18px; }

  /* feedback */
  .fb-atleta { border:1px solid var(--linea); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; }
  .fb-atleta .fb-nom { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .fb-atleta .fb-nom strong { font-size:15px; color: var(--navy); }
  /* La tarjeta a la que se venía cuando se entra desde la ficha de alguien.
     Se marca en vez de solo bajar hasta ella: en un móvil, media pantalla de
     tarjetas iguales sin nada que diga «esta es» no ayuda a nadie. */
  .fb-atleta.fb-mirando { border-color: var(--azul-filete, #3B85C0); box-shadow:0 0 0 2px rgba(59,133,192,.16); }
  .fb-metrics { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .fb-metric { background: var(--crema-media); border-radius:10px; padding:5px 10px; font-size:13px; color: var(--texto); }
  .fb-metric b { color: var(--navy); font-family: var(--fuente-dato); }
  .fb-txt { font-size:13px; color: var(--texto); margin:2px 0; }
  .fb-txt span { color: var(--texto-suave); font-family: var(--fuente-mono); font-size:13px; text-transform:none;  margin-right:6px; }
  .fb-tiempos { margin-top:6px; }
  .fb-tiempos .fb-ej { font-size:13px; color: var(--navy); }
  .fb-tiempos .fb-serie { display:inline-block; font-family: var(--fuente-dato); font-size:13px; background: var(--crema-media); color: var(--navy); border-radius:10px; padding:2px 7px; margin:2px 4px 2px 0; }
  /* La serie que no se hizo se ve DISTINTA, no solo de otro color: en
     discontinuo y sin fondo, que es la misma forma que usa el atleta en su
     pantalla para decir «esto está sin hacer». */
  .fb-tiempos .fb-serie.no { background:none; border:1px dashed var(--linea); color: var(--texto-suave); font-family: inherit; }
  /* El RIR que se pidió, y las series que se salieron de él. Dos avisos
     distintos porque son decisiones distintas: «se pasó» (menos reserva de
     la pedida, ojo con la fatiga) y «se quedó corto» (le sobró, toca subir
     peso). Ni uno ni otro dicen qué hacer: eso lo decide el entrenador.
     ⚠️ Más RIR es MÁS SUAVE. RIR 0 es el fallo. */
  .fb-rir-obj { display:block; width:fit-content; font-size:12px; line-height:1.5;
    color: var(--azul-oscuro); background: var(--azul-suave); border-radius:8px;
    padding:2px 8px; margin:4px 0 3px; }
  .fb-rir-obj.rir-paso  { background: var(--ambar-fondo); border:1px solid var(--ambar-borde); color:#8A5307; font-weight:600; }
  .fb-rir-obj.rir-corto { background:#EAF2F9; border:1px solid #C9DDEE; color: var(--azul-oscuro); font-weight:600; }
  /* «Se quedó a medias · 7 de 10 series · no le dio tiempo». Va arriba de la
     ficha del atleta porque cambia cómo se lee el resto: un RPE de 5 en medio
     entrenamiento no es el mismo dato que en uno entero. */
  .fb-medias { margin:6px 0 8px; padding:8px 11px; border-radius:10px; font-size:14px; line-height:1.45;
    background: var(--ambar-fondo); border:1px solid var(--ambar-borde); color:#6B4A0B; }
  .fb-medias b { font-weight:700; }
  .fb-medias em { display:block; margin-top:3px; font-style:normal; font-size:13px; color:#8A5307; }
  .sin-registro { color: var(--texto-suave); font-size:13px; font-style:italic; }
  /* «Puse jalón al pecho y él hizo dominadas». Va arriba, con lo que se
     quedó sin hacer, y por la misma razón: cambia lo que estás leyendo.
     Si no se viera aquí, el atleta podría marcarlo y no serviría de nada. */
  .fb-cambios { margin:6px 0 8px; padding:8px 11px; border-radius:10px; font-size:14px; line-height:1.5;
    background:#EAF2F9; border:1px solid #C9DDEE; color: var(--navy); }
  .fb-cambios .fbc-et { display:block; font-size:13px; font-weight:700; margin-bottom:3px; }
  .fb-cambios .fbc-uno { display:block; overflow-wrap:anywhere; }
  .fb-cambios .fbc-uno b { font-weight:700; }
  .fb-cambios .fbc-uno span { color: var(--texto-suave); }
  /* «Corregido el 3 de agosto»: un dato de hace un mes que cambia sin que
     se note es peor que uno equivocado, así que se dice. */
  .fb-corregido { font-size:13px; color:#8A5307; }

  /* ------------------------------------------------------------
     EL COMENTARIO PARA EL ATLETA
     Aquí mismo, donde acabas de leer cómo le fue: es el momento
     natural de contestar, y montarlo en otra pantalla sería
     garantizar que no se escribe nunca.
     ⚠️ LO LEE EL ATLETA. Va dicho en el propio formulario, en alto y
     antes de escribir. Ya pasó una vez con la «nota / razonamiento»
     del entrenamiento: la leían el atleta y su familia y no lo decía
     en ninguna parte. Ese aviso no se quita de aquí.
     ------------------------------------------------------------ */
  .fb-resp { margin-top:10px; padding-top:10px; border-top:1px solid var(--linea); }
  .fb-resp .fbr-et { display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:13px; font-weight:700; color: var(--navy); margin-bottom:2px; }
  .fb-resp .fbr-lee { font-size:13px; font-weight:400; color:#8A5307; }
  .fb-resp textarea { width:100%; box-sizing:border-box; min-height:70px; margin-top:6px; }
  .fb-resp .fbr-acc { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .fb-resp .fbr-pie { font-size:13px; color: var(--texto-suave); }

  /* observaciones privadas (solo staff) */
  .aviso-privado { background:#fff8e6; border:1px solid #f0d98a; color:#7a5c00; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .aviso-privado strong { color:#5c4600; }
  .nota { border:1px solid var(--linea); border-radius:10px; padding:10px 14px; margin-bottom:10px; background:#fff; }
  .nota-meta { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .nota-meta span { font-family: var(--fuente-mono); font-size:13px; text-transform:none;  color: var(--texto-suave); }
  .nota-borrar { border:1px solid var(--linea-borde); background:#fff; color: var(--texto-suave); border-radius:999px; min-height:44px; padding:10px 16px; font-size:13px; cursor:pointer; font-family: var(--fuente-texto); }
  .nota-borrar:hover { border-color:#b3261e; color:#b3261e; }
  .nota-txt { font-size:14px; color: var(--texto); white-space:pre-wrap; }

  /* Mi grupo: lista de atletas en tarjetas (cómoda en móvil, nada se corta) */
  .atletas-lista { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  /* Buscador de la lista de atletas: un grupo de treinta se recorría a
     scroll y nada más. Mismo campo que en el panel de atletas: redondo,
     con el recuento de lo que se está viendo al lado. */
  .busca-at { display:flex; align-items:center; gap:10px; margin:10px 0 2px; }
  .busca-at input[type="search"] { flex:1 1 200px; min-width:0; box-sizing:border-box; min-height:44px;
    padding:10px 16px; border:1px solid var(--linea-borde); border-radius:999px; background:#fff;
    font-family:inherit; font-size:15px; color:var(--navy); }
  .busca-at input[type="search"]:focus { outline:2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }
  .busca-at .cuenta { flex:0 0 auto; font-family: var(--fuente-mono); font-size:13px; color:var(--texto-suave); white-space:nowrap; }
  .sin-busca { font-size:14px; color:var(--texto-suave); line-height:1.5; margin:10px 0 0; }
  /* `.atleta-row` es flex, así que el `hidden` de la búsqueda hay que
     decirlo a mano o no esconde nada. */
  .atleta-row[hidden] { display:none; }
  /* Tres líneas por atleta (nombre, categoría y marcas): es una tarjeta, no una
     fila. Y como se pulsa, lleva las tres cosas del kit: sombra, borde marcado
     y chevron. */
  .atleta-row { display:flex; align-items:center; gap:12px; min-height:48px; padding:14px 16px; border:1px solid var(--linea-marcada); border-radius:14px; background:#fff; cursor:pointer; box-shadow:0 12px 24px -18px rgba(46,66,86,0.5); transition:border-color .15s, box-shadow .15s; }
  .atleta-row:hover, .atleta-row:focus { border-color:#C9D9E7; box-shadow:0 14px 26px -16px rgba(46,66,86,0.55); outline:none; }
  .atleta-row .ar-av { width:42px; height:42px; flex:0 0 42px; border-radius:10px; background:var(--crema-media); color:var(--navy); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  .atleta-row .ar-main { flex:1; min-width:0; }
  .atleta-row .ar-nom { color:var(--navy); font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .atleta-row .ar-cat { color:var(--texto-suave); font-size:13px; margin-top:1px; }
  .atleta-row .mrc { margin-top:7px; }
  .atleta-row .mrc-no { font-size:13px; color:var(--texto-suave); }
  .atleta-row .ar-chev { color:#6E6656; font-size:22px; flex:0 0 auto; line-height:1; }

  /* ---------- INICIO · EL DÍA DEL ENTRENADOR ---------- */
  /* La sesión de hoy, arriba del todo: mismo lenguaje que la tarjeta de hoy
     del atleta, pero en el navy del club. */
  .hoy-e { background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); border-radius:14px; padding: clamp(18px,3vw,24px); color:#fff; display:flex; flex-direction:column; gap:14px; margin-bottom:14px; box-shadow: var(--sombra-suave); }
  .hoy-e .he-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .hoy-e .he-et, .hoy-e .he-tipo { font-size:13px; color:#BBD6EC; }
  .hoy-e .he-tit { font-family: var(--fuente-titulo); font-weight:700; text-transform: uppercase; font-size:36px; line-height:1; color:#fff; margin:0; }
  .hoy-e .he-det { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:9px; }
  .hoy-e .he-det span { display:flex; align-items:center; gap:8px; font-size:14px; color:#D6E4F0; }
  .hoy-e .he-det span.he-hora { font-family: var(--fuente-dato); }   /* la hora de la sesión es un dato */
  .hoy-e .he-det span i { flex:none; width:5px; height:5px; border-radius:10px; background:#7FB6E0; }
  .hoy-e .he-btns { display:flex; gap:10px; flex-wrap:wrap; }
  .hoy-e .he-btns button { flex:1 1 145px; min-height:46px; border-radius:10px; font:inherit; font-weight:600; font-size:15px; cursor:pointer; padding:12px 14px; }
  .hoy-e .he-lista { background:#fff; border:0; color: var(--navy); }
  .hoy-e .he-lista:hover { background: var(--azul-suave); }
  .hoy-e .he-ver { background:transparent; border:1px solid rgba(255,255,255,.42); color:#fff; }
  .hoy-e .he-ver:hover { border-color:#fff; }
  .hoy-e .he-aviso { margin:0; font-size:13px; color:#FBE7B8; }

  .hoy-e-no { background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:14px; margin-bottom:14px; box-shadow: var(--sombra-suave); }
  .hoy-e-no .hn-ic { flex:none; width:42px; height:42px; border-radius:10px; background: var(--crema-media); color: var(--navy); display:flex; align-items:center; justify-content:center; }
  .hoy-e-no .hn-ic svg { width:22px; height:22px; }
  .hoy-e-no .hn-txt { flex:1 1 auto; min-width:0; }
  .hoy-e-no b { display:block; font-size:15px; font-weight:600; color: var(--navy); }
  .hoy-e-no span { font-size:13px; color: var(--texto-suave); }
  .hoy-e-no button { flex:none; min-height:44px; padding:10px 16px; border-radius:999px; border:1px solid var(--linea-borde); background:#fff; color: var(--azul-oscuro); font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .hoy-e-no button:hover { border-color: var(--azul-filete, #3B85C0); background: var(--azul-suave); }

  /* Avisos del día: solo salen si hay algo que mirar */
  .avisos { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }

  /* ============================================================
     CALENDARIO Y PLANIFICAR SEMANA · la maqueta del panel
     ------------------------------------------------------------
     Los colores, las alturas y los chips salen de `panel-piezas.css`
     (las clases `pz-`), que es la hoja común de las pantallas que ya
     están maquetadas: Tarifas, Pedidos, Usuarios, el Histórico… Aquí
     solo va la forma que estas dos pantallas no comparten con nadie:
     la rejilla del mes y la rejilla de días de la semana.

     REGLA DE LA CASA: nada pulsable baja de 44 px, los días del mes
     incluidos, y nada se sale por la derecha a 375 px. Por eso todas
     las rejillas van con `minmax(0,1fr)`: con `1fr` a secas, una

     ============================================================ */

  /* --- Una sola fila de mandos, y va DESPUÉS del título --- */
  .mandos { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px; }
  .mandos > * { max-width:100%; }
  /* `width:auto` a mano: la hoja del club pone los desplegables de formulario

  .mandos select { width:auto; min-width:150px; min-height:44px; box-sizing:border-box; padding:10px 14px;

  .navper button:last-child { border-radius:0 9px 9px 0; }
  .navper .np-txt { padding:0 12px; min-height:44px; display:flex; align-items:center; white-space:nowrap;
                    font-family: var(--fuente-titulo); font-weight:700; text-transform:uppercase;
                    letter-spacing:.02em; font-size:18px; color:var(--navy); }

  /* --- El mes en grande. Se pincha un día y se abre ese día debajo --- */
  .cal-card { background:#fff; border:1px solid var(--linea-marcada); border-radius:14px;
              padding:16px 14px; box-shadow: var(--sombra-suave); margin-bottom:14px; }
  .cal-cab, .cal-rej { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; }

  /* El día del mes: 44 px de zona pulsable como poco, y crece con lo que

  .cal-dia[aria-pressed="true"] .cd-p i.borrador { background:none; border-color:#F0D9A8; }
  .cal-dia[aria-pressed="true"] .cd-p i.compe { background:#8FC0E8; }

  .cal-leyenda { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px; padding-top:11px;

  .cal-leyenda span { display:flex; align-items:center; gap:7px; }

  .sw-rej { display:grid; grid-template-columns:repeat(auto-fill, minmax(236px, 1fr)); gap:12px; align-items:start; }

  /* La línea que dice si te contestaron, entre los mandos y la rejilla */
  .sv-linea { margin:0 0 14px; font-size:15px; line-height:1.45; color: var(--texto-suave); }

  /* --- «Cómo les fue»: el pie que convierte la semana en historial --- */
  .clf { border-top:1px solid var(--crema-media); background: var(--crema); padding:11px 14px;
         display:flex; flex-direction:column; gap:7px; }
  .clf .clf-et { font-size:12px; line-height:1; letter-spacing:.08em; text-transform:uppercase; color:var(--texto-suave); }
  .clf .clf-cifra { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }

  .banda-ambar { margin-top:16px; padding:13px 15px; border-radius:10px; background: var(--pz-aviso-fondo,#FDF6EA);

     semana, que es a lo que se entra. */
  .caja-tanda { margin-top:16px; }
  .caja-tanda[hidden] { display:none; }

      var btns=document.createElement('div'); btns.className='apx-dlg-btns';
      var bc=document.createElement('button'); bc.type='button'; bc.className='apx-btn'; bc.textContent=opts.cancelar||'Cancelar';
      var bo=document.createElement('button'); bo.type='button'; bo.className='apx-btn apx-ok'; bo.textContent=opts.aceptar||'Aceptar';
      if(opts.peligro) bo.classList.add('apx-danger');
      btns.appendChild(bc); btns.appendChild(bo); dlg.appendChild(btns); ov.appendChild(dlg);
      document.body.appendChild(ov);
      requestAnimationFrame(function(){ ov.classList.add('apx-in'); });
      function cerrar(v){ ov.classList.remove('apx-in'); document.removeEventListener('keydown',onkey); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); resolve(v); }
      function onkey(e){ if(e.key==='Escape'){ e.preventDefault(); cerrar(false);} else if(e.key==='Enter'){ e.preventDefault(); cerrar(true);} }
      bc.addEventListener('click',function(){ cerrar(false); });
      bo.addEventListener('click',function(){ cerrar(true); });
      ov.addEventListener('click',function(e){ if(e.target===ov) cerrar(false); });
      document.addEventListener('keydown',onkey);
      setTimeout(function(){ bo.focus(); },40);
    });
  }
  window.APX={ toast:toast, confirm:confirmar };
})();
</script>
