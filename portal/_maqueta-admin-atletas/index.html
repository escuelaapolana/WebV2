<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Atletas y socios (admin)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<style>
  /* MAQUETA · Admin · Atletas y socios: lista con buscador y filtros.
     Cada fila lleva al detalle (ficha). */
  :root {
    --ap-titulo: 'Bricolage Grotesque', system-ui, sans-serif;
    --dato: var(--fuente-dato, 'IBM Plex Mono', monospace);
    --s1: 0 1px 2px rgba(30,45,65,.07), 0 14px 30px -13px rgba(30,45,65,.30);
    --s2: 0 2px 6px rgba(30,45,65,.10), 0 28px 50px -18px rgba(30,45,65,.42);
    --curva: cubic-bezier(.2,.7,.2,1);
  }
  body { background: var(--crema, #FBF9F4); margin: 0; padding-bottom: 40px; }

  .ap-top { position: sticky; top: 0; z-index: 40; color: #fff;
    background: linear-gradient(180deg,#2E4258,#25354A);
    box-shadow: 0 3px 14px rgba(20,30,42,.20); border-bottom: 1px solid rgba(255,255,255,.06); }
  .ap-top__in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 11px clamp(14px,4vw,28px); min-height: 54px; box-sizing: border-box; }
  .ap-top .volver { display: inline-flex; align-items: center; gap: 7px; color: #fff; text-decoration: none; font-size: 14.5px; font-weight: 600; }
  .ap-top .volver svg { width: 18px; height: 18px; }
  .ap-top__acc { margin-left: auto; display: flex; align-items: center; gap: 9px; }
  .ap-top .ir-web { display: inline-flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 7px 13px; }
  .ap-top .ir-web svg { width: 15px; height: 15px; }
  .ap-top .perfil { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 13px; color: #fff; }
  .ap-top .perfil .av { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,#C9A23A,#8A6A1E); display: grid; place-items: center; font-size: 11px; font-weight: 700; }

  .ap-wrap { max-width: 760px; margin: 0 auto; padding: clamp(18px,4vw,26px) clamp(14px,4vw,28px) 40px; }
  .cab { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .saludo { font-family: var(--ap-titulo); font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; font-size: clamp(26px,5.5vw,36px); line-height: 1; color: var(--navy,#26374B); margin: 6px 0 2px; }
  .cab .cuenta { font-size: 14px; color: var(--texto-suave,#6E6656); }
  .cab .nuevo { margin-left: auto; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--navy,#26374B); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; box-shadow: var(--s1); }

  /* Buscador */
  .buscar { position: relative; margin: 16px 0 12px; }
  .buscar svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--texto-tenue,#9A927F); }
  .buscar input { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 13px 15px 13px 44px; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 13px; background: #fff; box-shadow: var(--s1); color: var(--navy,#26374B); }
  .buscar input:focus { outline: 0; border-color: var(--azul-filete,#3B85C0); }

  /* Filtros */
  .filtros { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .filtros button { flex: 0 0 auto; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 999px; padding: 8px 15px; color: var(--texto-suave,#6E6656); box-shadow: var(--s1); }
  .filtros button.sel { background: var(--navy,#26374B); border-color: var(--navy,#26374B); color: #fff; }
  .filtros button .b { font-family: var(--dato); opacity: .7; margin-left: 3px; }

  /* Lista */
  .lista { background: #fff; border: 1px solid var(--linea-marcada,#E4DCCB); border-radius: 18px; box-shadow: var(--s1); overflow: hidden; }
  .fila { display: flex; align-items: center; gap: 13px; padding: 12px 15px; border-bottom: 1px solid var(--linea,#EDE6D7); cursor: pointer; text-decoration: none; }
  .fila:last-child { border-bottom: 0; }
  .fila:hover { background: #FBFAF6; }
  .fila .av { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; background: linear-gradient(135deg,#3B85C0,#2E4256); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .fila .nom { flex: 1; min-width: 0; }
  .fila .nom b { display: block; font-size: 15px; font-weight: 600; color: var(--navy,#26374B); }
  .fila .nom small { font-size: 12.5px; color: var(--texto-suave,#6E6656); }
  .chip { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; border-radius: 7px; padding: 4px 9px; }
  .chip.aldia { background: #EAF3E3; color: #4E8A3E; }
  .chip.impago { background: #F7E7E2; color: #B0563A; }
  .chip.prueba { background: #F4EAD6; color: #8A5307; }
  .chip.lesion { background: #EDE7F1; color: #6B4E8A; }
  .fila .fl { flex: 0 0 auto; color: var(--texto-tenue,#9A927F); } .fila .fl svg { width: 18px; height: 18px; }
  .vacio { padding: 30px; text-align: center; color: var(--texto-tenue,#9A927F); font-size: 14px; }

  .nota-maqueta { margin: 22px 0 0; text-align: center; font-size: 12.5px; color: var(--texto-tenue,#9A927F); }
  .nota-maqueta a { color: var(--azul-oscuro,#2F6FA8); font-weight: 600; }
</style>
</head>
<body>

<header class="ap-top">
  <div class="ap-top__in">
    <a class="volver" href="../_maqueta-admin/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg> Panel</a>
    <div class="ap-top__acc">
      <a class="ir-web" href="../../" title="Ir a la web del club"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg> Web</a>
      <span class="perfil"><span class="av">S</span> Secretaría</span>
    </div>
  </div>
</header>

<main class="ap-wrap">
  <div class="cab">
    <h1 class="saludo">Atletas y socios</h1>
    <button type="button" class="nuevo">+ Nueva alta</button>
  </div>
  <p class="cuenta" id="cuenta">214 personas</p>

  <div class="buscar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar por nombre…" oninput="pintar()">
  </div>

  <div class="filtros" id="filtros">
    <button type="button" class="sel" data-f="todos" onclick="filtro('todos',this)">Todos <span class="b">10</span></button>
    <button type="button" data-f="impago" onclick="filtro('impago',this)">Impagados <span class="b">2</span></button>
    <button type="button" data-f="prueba" onclick="filtro('prueba',this)">En prueba <span class="b">2</span></button>
    <button type="button" data-f="lesion" onclick="filtro('lesion',this)">Lesionados <span class="b">1</span></button>
    <button type="button" data-f="escuela" onclick="filtro('escuela',this)">Escuela</button>
  </div>

  <section class="lista" id="lista"></section>

  <p class="nota-maqueta">Maqueta con datos de ejemplo · <a href="../_maqueta-admin/">Panel del club</a></p>
</main>

<script>
  var P = [
    {n:'Carlos Ruiz', ini:'CR', grupo:'Academia AC98', cat:'Sub-20', estado:'aldia'},
    {n:'Ana Gómez', ini:'AG', grupo:'Academia AC98', cat:'Sub-18', estado:'aldia'},
    {n:'Juan Pérez', ini:'JP', grupo:'Velocidad', cat:'Sub-23', estado:'impago'},
    {n:'María López', ini:'ML', grupo:'Velocidad', cat:'Sub-20', estado:'aldia'},
    {n:'Diego Martín', ini:'DM', grupo:'Fondo-Mediofondo', cat:'Sénior', estado:'lesion'},
    {n:'Lucía Sánchez', ini:'LS', grupo:'Fondo-Mediofondo', cat:'Sub-18', estado:'impago'},
    {n:'Pablo Torres', ini:'PT', grupo:'El Cubo', cat:'Sénior', estado:'aldia'},
    {n:'Sara Díaz', ini:'SD', grupo:'Escuela', cat:'Alevín', estado:'escuela', esc:true},
    {n:'Marta Gil', ini:'MG', grupo:'Escuela', cat:'Benjamín', estado:'prueba', esc:true},
    {n:'Hugo Navarro', ini:'HN', grupo:'Velocidad', cat:'Sub-16', estado:'prueba'}
  ];
  var EST = { aldia:'Al día', impago:'Impago', prueba:'En prueba', lesion:'Lesión', escuela:'Escuela' };
  var f = 'todos';

  function filtro(v, btn){
    f = v;
    Array.prototype.forEach.call(document.querySelectorAll('#filtros button'), function(b){ b.classList.remove('sel'); });
    btn.classList.add('sel');
    pintar();
  }
  function pintar(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var arr = P.filter(function(p){
      if(q && p.n.toLowerCase().indexOf(q) < 0) return false;
      if(f === 'todos') return true;
      if(f === 'escuela') return !!p.esc;
      return p.estado === f;
    });
    document.getElementById('cuenta').textContent = arr.length + (arr.length===1?' persona':' personas') + (f==='todos' && !q ? ' · de 214' : '');
    var chip = function(e){ return e==='escuela' ? '' : '<span class="chip '+e+'">'+EST[e]+'</span>'; };
    document.getElementById('lista').innerHTML = arr.length ? arr.map(function(p){
      return '<a class="fila" href="../_maqueta-admin-ficha/">'+
        '<span class="av">'+p.ini+'</span>'+
        '<div class="nom"><b>'+p.n+'</b><small>'+p.grupo+' · '+p.cat+'</small></div>'+
        chip(p.estado)+
        '<span class="fl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>'+
      '</a>';
    }).join('') : '<div class="vacio">Nadie con ese filtro</div>';
  }
  pintar();
</script>

</body>
</html>
