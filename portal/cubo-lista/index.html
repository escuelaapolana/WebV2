<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); }
  .cl-wrap { max-width:680px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 40px; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(24px,5.5vw,34px); line-height:1.02; color:var(--navy,#26374B); margin:4px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 14px; }

  /* Selector de grupo: UNA fila que se desliza en horizontal (antes eran dos o
     tres filas de botones que se comían un tercio de la pantalla). */
  .cl-grupos { position:relative; display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto; overscroll-behavior-x:contain;
               scroll-snap-type:x mandatory; scroll-padding-inline:clamp(14px,4vw,26px); -webkit-overflow-scrolling:touch;
               margin:0 calc(-1 * clamp(14px,4vw,26px)) 12px; padding:4px clamp(14px,4vw,26px) 8px; scrollbar-width:none; }
  .cl-grupos::-webkit-scrollbar { display:none; }
  .cl-chip { flex:0 0 auto; scroll-snap-align:start; white-space:nowrap; min-height:48px; text-align:left;
             font:inherit; font-size:14px; font-weight:600; cursor:pointer; background:#fff; color:var(--navy,#26374B);
             border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; padding:7px 14px; }
  .cl-chip.on { background:var(--navy,#26374B); color:#fff; border-color:var(--navy,#26374B); box-shadow:0 4px 10px -4px rgba(30,45,65,.45); }
  .cl-chip small { display:block; font-size:11.5px; font-weight:500; opacity:.75; margin-top:1px; font-variant-numeric:tabular-nums; }
  .cl-chip .hoy { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
                  background:#E3F1EC; color:#1F6B57; border-radius:999px; padding:1px 6px; margin-left:4px; opacity:1; }
  .cl-chip.on .hoy { background:rgba(255,255,255,.18); color:#fff; }

  /* Fecha + resumen */
  .cl-barra { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
              background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
              padding:12px 15px; margin-bottom:14px; }
  .cl-barra .fh { display:flex; align-items:center; gap:8px; }
  .cl-barra input[type=date] { font:inherit; font-size:15px; color:var(--navy,#26374B); border:1px solid var(--linea-borde,#C9C0AE);
              border-radius:10px; padding:7px 10px; background:var(--crema,#FBF9F4); font-size:16px; min-height:44px; box-sizing:border-box; }
  .cl-barra .cont { font-size:14px; color:var(--texto-suave,#6E6656); }
  .cl-barra .cont b { color:#2E7D6B; font-family:var(--dato); font-size:17px; }

  /* Lista de personas */
  .cl-lista { display:flex; flex-direction:column; gap:9px; }
  .cl-fila { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
             background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
             padding:13px 15px; font:inherit; color:var(--navy,#26374B); cursor:pointer; }
  .cl-fila:disabled { opacity:.55; cursor:default; }
  .cl-fila .tick { flex:0 0 auto; width:30px; height:30px; border-radius:999px; border:2px solid var(--linea-borde,#C9C0AE);
             display:grid; place-items:center; color:#fff; }
  .cl-fila .tick svg { width:18px; height:18px; opacity:0; }
  .cl-fila.vino .tick { background:#2E7D6B; border-color:#2E7D6B; }
  .cl-fila.vino .tick svg { opacity:1; }
  .cl-fila .nom { flex:1; min-width:0; }
  .cl-fila .nom b { display:block; font-size:16px; font-weight:600; }
  .cl-fila .nom small { display:block; font-size:12.5px; color:var(--texto-tenue,#9A927F); margin-top:1px; }
  .cl-fila .est { font-size:13px; font-weight:600; color:var(--texto-tenue,#9A927F); }
  .cl-fila.novoy { opacity:.6; }
  .cl-fila.novoy .nom b { text-decoration:line-through; }
  .cl-fila.novoy .est { color:#B0563A; }
  .cl-fila.vino .est { color:#2E7D6B; }

  /* Más */
  .fila-mas { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
              background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
              padding:15px 16px; margin-bottom:11px; font:inherit; color:var(--navy,#26374B); cursor:pointer; text-decoration:none; }
  .fila-mas b { display:block; font-size:15.5px; font-weight:600; }
  .fila-mas small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }

  .cl-toast { position:fixed; left:50%; bottom:86px; transform:translate(-50%,14px); opacity:0; transition:.24s;
              background:var(--navy,#26374B); color:#fff; font-size:14px; padding:10px 16px; border-radius:999px; z-index:60;
              box-shadow:0 10px 24px -8px rgba(30,45,65,.5); }
  .cl-toast.ver { opacity:1; transform:translate(-50%,0); }
  .cl-toast.err { background:#B23B3B; }
</style>
</head>
<body>

  <div class="cl-wrap" id="cl"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cl');
  var b = window.APOLANA_BASE || '../../';
  var UI = window.APOLANA_UI;

  var GRUPOS = [], ALTAS = [], PRUEBA = [], sel = null, fecha = hoyISO(), ASIS = {}, AUSF = {}, PAUSA = {}, cargado = false, CANCEL = {cancelado:false};

  function pad(n){ return (n<10?'0':'')+n; }
  function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function fechaLarga(s){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  // Singular/plural: «1 persona» / «2 personas».
  function pl(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sinPrefijo(n){ return String(n||'').replace(/^El Cubo\s*·\s*/i,''); }
  /* Grupos de FUERZA GRATIS: su gente no está en cubo_altas (no son atletas ni
     tienen cuenta), sino en cubo_prueba. Se reconoce por el nombre y su turno. */
  function esGratis(g){ return !!g && /fuerza\s*gratis/i.test(g.nombre||''); }
  function turnoDe(g){
    var s = ((g&&(g.nombre||''))+' '+(g&&(g.horario||''))).toLowerCase();
    if(s.indexOf('viernes')>=0) return 'viernes';
    if(s.indexOf('sábado')>=0 || s.indexOf('sabado')>=0) return 'sabado';
    if(s.indexOf('domingo')>=0) return 'domingo';
    return null;
  }
  /* Los contadores y la lista son POR DÍA: el día de la fecha elegida (1=lun…
     7=dom). Así, en «M y J», quien solo viene el jueves NO cuenta el martes. */
  function diaSemFecha(){ var p=String(fecha).split('-'); var js=new Date(+p[0],+p[1]-1,+p[2]).getDay(); return js===0?7:js; }
  /* Los días que entrena el grupo, sacados del nombre (para la gente que aún no
     tiene marcado qué día viene: se les enseña todos los días del turno). */
  function diasDelGrupo(g){
    var n=((g&&g.nombre)||'').toLowerCase();
    if(n.indexOf('l y x')>=0) return [1,3];
    if(n.indexOf('m y j')>=0) return [2,4];
    if(n.indexOf('viernes')>=0) return [5];
    if(n.indexOf('sábado')>=0||n.indexOf('sabado')>=0) return [6];
    if(n.indexOf('domingo')>=0) return [7];
    return [];
  }
  function vieneEseDia(a,D,g){
    if(a && a.dias_semana && a.dias_semana.length) return a.dias_semana.indexOf(D)!==-1;
    var dg=diasDelGrupo(g); return !dg.length || dg.indexOf(D)!==-1;   // sin marcar = todos los días del turno
  }
  /* Al entrar, el grupo que entrena HOY; si hay varios, el de la hora más
     cercana a ahora. Los días salen del nombre («L y X», «M y J», «Viernes»…). */
  function diasPreselec(g){
    var d = diasDelGrupo(g); if(d.length) return d;
    var t = turnoDe(g); return t==='viernes' ? [5] : t==='sabado' ? [6] : t==='domingo' ? [7] : [];
  }
  function horaDe(g){
    var m = /(\d{1,2})[:.h](\d{2})/.exec(((g&&g.nombre)||'')+' '+((g&&g.horario)||''));
    return m ? (+m[1])*60 + (+m[2]) : null;
  }
  function grupoDeHoy(){
    var D = diaSemFecha(), now = new Date(), min = now.getHours()*60 + now.getMinutes();
    var deHoy = GRUPOS.filter(function(g){ return diasPreselec(g).indexOf(D) !== -1; });
    if(!deHoy.length) return null;
    deHoy.sort(function(a,b){
      var ha = horaDe(a), hb = horaDe(b);
      return (ha==null?9999:Math.abs(ha-min)) - (hb==null?9999:Math.abs(hb-min));
    });
    return deHoy[0];
  }
  function entrenaEseDia(g){ return diasPreselec(g).indexOf(diaSemFecha()) !== -1; }
  function cuenta(g){
    if(esGratis(g)){ var t=turnoDe(g); return PRUEBA.filter(function(p){ return (p.turnos||[]).indexOf(t)!==-1 && !AUSF[p.perfil_id]; }).length; }
    var D=diaSemFecha();
    return ALTAS.filter(function(a){ return a.horario===g.nombre && !a.lista_espera && vieneEseDia(a,D,g) && !AUSF[a.perfil_id] && !PAUSA[a.id]; }).length;
  }
  function toast(msg,tipo){ var t=document.createElement('div'); t.className='cl-toast'+(tipo==='err'?' err':''); t.textContent=msg;
    document.body.appendChild(t); requestAnimationFrame(function(){ t.classList.add('ver'); });
    setTimeout(function(){ t.classList.remove('ver'); setTimeout(function(){ t.remove(); },260); },2000); }

  async function cargar(){
    var g = await sb.from('grupos').select('id,nombre,horario').eq('seccion','cubo').eq('activo',true).order('nombre');
    GRUPOS = g.error ? [] : (g.data||[]);
    var a = await sb.from('cubo_altas').select('id,nombre,apellidos,horario,atleta_id,perfil_id,estado,lista_espera,dias_semana').eq('estado','aprobada');
    ALTAS = a.error ? [] : (a.data||[]);
    var p = await sb.from('cubo_prueba').select('id,nombre,apellidos,turnos,estado,perfil_id').neq('estado','cancelado');
    PRUEBA = p.error ? [] : (p.data||[]);
    if(!sel && GRUPOS.length){ var gh = grupoDeHoy(); sel = (gh || GRUPOS[0]).id; }
    cargado = true;
  }

  async function cargarAsis(){
    ASIS = {}; AUSF = {}; PAUSA = {};
    CANCEL = {cancelado:false};
    /* [360] Quién tiene la cuota EN PAUSA el mes de la fecha elegida: guarda
       su plaza (sale en la lista) pero no viene ese mes. */
    try {
      var rz = await sb.from('cubo_pausas').select('alta_id,mes,stripe_aplicada_en').eq('estado','aprobada').eq('mes', String(fecha).slice(0,7)+'-01');
      // En vigor: ya puesta en Stripe, o aún antes del cobro del día 5 (si no
      // llegó a Stripe a tiempo, ese mes SÍ se cobró y viene con normalidad).
      if(rz && !rz.error) (rz.data||[]).forEach(function(x){
        if(x.alta_id && (x.stripe_aplicada_en || hoyISO() < String(x.mes).slice(0,7)+'-05')) PAUSA[x.alta_id] = true;
      });
    } catch(e){}
    try { var rc = await sb.rpc('dia_cancelado', { p_fecha: fecha, p_seccion: 'cubo' }); if(rc && !rc.error && rc.data) CANCEL = rc.data; } catch(e){}
    if(!sel) return;
    /* Quién ha avisado que NO viene ESE día (por perfil). El staff del Cubo
       puede leer todas las ausencias (RLS). */
    var ra = await sb.from('cubo_ausencias').select('perfil_id').eq('fecha', fecha);
    if(!ra.error) (ra.data||[]).forEach(function(x){ if(x.perfil_id) AUSF[x.perfil_id] = true; });
    var g = grupoSel();
    if(esGratis(g)){
      var t = turnoDe(g);
      var rp = await sb.from('cubo_prueba_asistencia').select('prueba_id,presente').eq('turno', t).eq('fecha', fecha);
      if(!rp.error) (rp.data||[]).forEach(function(x){ ASIS[x.prueba_id] = !!x.presente; });
      return;
    }
    var r = await sb.from('asistencia').select('atleta_id,presente').eq('grupo_id', sel).eq('fecha', fecha);
    if(!r.error) (r.data||[]).forEach(function(x){ ASIS[x.atleta_id] = !!x.presente; });
  }

  function grupoSel(){ return GRUPOS.filter(function(g){ return g.id===sel; })[0] || null; }
  /* Gente del grupo seleccionado, normalizada para pintar/marcar igual venga de
     cubo_altas (de pago) o de cubo_prueba (gratis):
       { id, nombre, apellidos, key, gratis, sinFicha }
     · id  = lo que va en data-a y llega a marcar()
     · key = con qué se guarda la asistencia (atleta_id de pago, prueba_id gratis) */
  function miembros(){
    var g = grupoSel(); if(!g) return [];
    var arr;
    if(esGratis(g)){
      var t = turnoDe(g);
      arr = PRUEBA.filter(function(p){ return (p.turnos||[]).indexOf(t)!==-1; }).map(function(p){
        return { id:p.id, nombre:p.nombre, apellidos:p.apellidos, key:p.id, gratis:true, sinFicha:false, noViene:!!AUSF[p.perfil_id] };
      });
    } else {
      var D=diaSemFecha();
      arr = ALTAS.filter(function(a){ return a.horario===g.nombre && !a.lista_espera && vieneEseDia(a,D,g); }).map(function(a){
        return { id:a.id, nombre:a.nombre, apellidos:a.apellidos, key:a.atleta_id, gratis:false, sinFicha:!a.atleta_id,
                 noViene:!!AUSF[a.perfil_id] || !!PAUSA[a.id], pausa:!!PAUSA[a.id] };
      });
    }
    return arr.sort(function(x,y){
      if(!!x.noViene !== !!y.noViene) return x.noViene ? 1 : -1;   // los que avisaron «no voy», al final
      return (((x.apellidos||'')+' '+(x.nombre||'')).toLowerCase() < ((y.apellidos||'')+' '+(y.nombre||'')).toLowerCase()) ? -1 : 1;
    });
  }

  async function marcar(id){
    var g = grupoSel();
    var m = miembros().filter(function(x){ return x.id===id; })[0];
    if(!m) return;

    // --- Turno de FUERZA GRATIS: asistencia por persona de la prueba ---
    if(m.gratis){
      var t = turnoDe(g), vinoP = !!ASIS[m.key];
      if(vinoP){
        var rdp = await sb.from('cubo_prueba_asistencia').delete().eq('prueba_id', m.key).eq('turno', t).eq('fecha', fecha);
        if(rdp.error){ toast('No se pudo guardar','err'); return; }
        delete ASIS[m.key];
      } else {
        var rup = await sb.from('cubo_prueba_asistencia').upsert(
          { prueba_id:m.key, turno:t, fecha:fecha, presente:true, registrado_por:(perfil&&perfil.id)||null },
          { onConflict:'prueba_id,turno,fecha' });
        if(rup.error){ toast('No se pudo guardar: '+rup.error.message,'err'); return; }
        ASIS[m.key] = true;
      }
      pintarLista(); return;
    }

    // --- Grupo de pago: asistencia por atleta (tabla asistencia) ---
    if(!m.key){ toast('Esta ficha no está enlazada; avisa al club.','err'); return; }
    var vino = !!ASIS[m.key];
    if(vino){
      var rd = await sb.from('asistencia').delete().eq('atleta_id', m.key).eq('grupo_id', sel).eq('fecha', fecha);
      if(rd.error){ toast('No se pudo guardar','err'); return; }
      delete ASIS[m.key];
    } else {
      var ru = await sb.from('asistencia').upsert(
        { atleta_id:m.key, grupo_id:sel, fecha:fecha, presente:true, registrado_por:(perfil&&perfil.id)||null },
        { onConflict:'atleta_id,fecha,grupo_id' });
      if(ru.error){ toast('No se pudo guardar: '+ru.error.message,'err'); return; }
      ASIS[m.key] = true;
    }
    pintarLista();
  }

  function pintarLista(){
    var g = grupoSel();
    var chips = GRUPOS.map(function(x){
      return '<button type="button" class="cl-chip'+(x.id===sel?' on':'')+'" data-g="'+esc(x.id)+'" aria-pressed="'+(x.id===sel?'true':'false')+'">'+esc(sinPrefijo(x.nombre))+
        '<small>'+pl(cuenta(x), 'persona', 'personas')+(entrenaEseDia(x)?'<span class="hoy">'+(fecha===hoyISO()?'hoy':'este día')+'</span>':'')+'</small></button>';
    }).join('');

    var lst = miembros();
    var vinieron = lst.filter(function(a){ return ASIS[a.key]; }).length;
    var esperados = lst.filter(function(a){ return !a.noViene; }).length;   // los que no han avisado «no voy»
    var noVienen = lst.filter(function(a){ return a.noViene; }).length;
    var vacio = esGratis(g)
      ? (UI ? UI.vacio('Nadie apuntado a este turno', 'Cuando alguien rellene el formulario de fuerza gratis para este día, aparecerá aquí.') : '<p>Nadie apuntado a este turno todavía.</p>')
      : (UI ? UI.vacio('Nadie en este grupo', 'Cuando el club apruebe altas en este horario, aparecerán aquí.') : '<p>Nadie en este grupo todavía.</p>');

    var filas = lst.length ? lst.map(function(a){
      var vino = !!ASIS[a.key];
      var sinFicha = a.sinFicha;
      var est = vino ? 'Vino' : (a.pausa ? 'En pausa' : (a.noViene ? 'No viene' : '—'));
      var sub = a.pausa ? '<small>en pausa · '+esc(MESES[+String(fecha).slice(5,7)-1])+' (guarda su plaza, no viene este mes)</small>'
              : (a.noViene ? '<small>avisó que no viene</small>' : (sinFicha ? '<small>ficha sin enlazar</small>' : ''));
      return '<button type="button" class="cl-fila'+(vino?' vino':'')+(a.noViene?' novoy':'')+'" data-a="'+esc(a.id)+'"'+(sinFicha?' disabled':'')+'>'+
        '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>'+
        '<span class="nom"><b>'+esc(((a.nombre||'')+' '+(a.apellidos||'')).trim())+'</b>'+sub+'</span>'+
        '<span class="est">'+est+'</span>'+
      '</button>';
    }).join('') : vacio;

    wrap.innerHTML =
      '<h1 class="saludo">Pasar lista</h1>'+
      '<p class="sub">Toca a quién ha venido hoy. Se guarda solo.</p>'+
      (GRUPOS.length ? '<div class="cl-grupos">'+chips+'</div>' : '')+
      '<div class="cl-barra">'+
        '<span class="fh"><input type="date" id="cl-fecha" value="'+esc(fecha)+'" max="'+esc(hoyISO())+'"></span>'+
        (CANCEL.cancelado
          ? '<span class="cont">'+esc(fechaLarga(fecha))+' · cancelado</span>'
          : '<span class="cont">'+(vinieron===1?'Ha':'Han')+' venido <b>'+vinieron+'</b> de '+esperados+(esGratis(g)?'':' <small>('+esc(DIAS[diaSemFecha()===7?0:diaSemFecha()])+')</small>')+(noVienen?' · <small>'+pl(noVienen, 'no viene', 'no vienen')+'</small>':'')+'</span>')+
      '</div>'+
      (CANCEL.cancelado
        ? '<div style="text-align:center;background:#FBEDEA;border:1px solid #E7C3BB;border-radius:14px;padding:24px 16px;margin-top:6px">'+
            '<div style="font-size:30px;line-height:1;margin-bottom:6px">🚫</div>'+
            '<div style="font-weight:700;color:#9A3B3B;font-size:17px">Entrenamiento cancelado</div>'+
            '<div style="color:#7A4A44;margin-top:3px">'+esc(CANCEL.motivo||'Festivo')+'</div>'+
            '<div style="color:#8A816E;font-size:12.5px;margin-top:8px">Este día no hay entrenamiento del Cubo. No hace falta pasar lista.</div>'+
          '</div>'
        : '<div class="cl-lista">'+filas+'</div>');
    // La fila de grupos se repinta entera: dejar a la vista el elegido (sin mover la página).
    var fila = wrap.querySelector('.cl-grupos'), on = fila && fila.querySelector('.cl-chip.on');
    if(fila && on){
      var pad = parseFloat(getComputedStyle(fila).paddingLeft) || 0;
      fila.scrollLeft = Math.max(0, on.offsetLeft - pad);
    }
  }

  function pintarMas(){
    wrap.innerHTML =
      '<h1 class="saludo">Más</h1>'+
      '<p class="sub">'+esc(perfil && perfil.nombre ? perfil.nombre : 'Lista del Cubo')+'</p>'+
      '<a class="fila-mas" href="'+b+'portal/perfil/"><span><b>Mi perfil</b><small>Cambiar la contraseña.</small></span></a>'+
      '<button type="button" class="fila-mas" id="cl-salir"><span><b>Cerrar sesión</b></span></button>';
  }

  async function pintar(){
    if(!cargado){ if(UI) wrap.innerHTML = '<div class="ap-esq" data-esq="filas:4"></div>'; await cargar(); }
    if((location.hash||'') === '#mas'){ pintarMas(); return; }
    await cargarAsis();
    pintarLista();
  }

  wrap.addEventListener('click', function(ev){
    var ch = ev.target.closest ? ev.target.closest('.cl-chip[data-g]') : null;
    if(ch){ sel = ch.getAttribute('data-g'); pintar(); return; }
    var fi = ev.target.closest ? ev.target.closest('.cl-fila[data-a]') : null;
    if(fi && !fi.disabled){ marcar(fi.getAttribute('data-a')); return; }
    var sal = ev.target.closest ? ev.target.closest('#cl-salir') : null;
    if(sal){ try { sb.auth.signOut().then(function(){ location.href = b; }); } catch(e){ location.href = b; } return; }
  });
  wrap.addEventListener('change', function(ev){
    if(ev.target && ev.target.id==='cl-fecha'){ fecha = ev.target.value || hoyISO(); pintar(); }
  });
  window.addEventListener('hashchange', pintar);

  pintar();
});
</script>
</body>
</html>
