<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); }
  .cl-wrap { max-width:680px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 40px; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(24px,5.5vw,34px); line-height:1.02; color:var(--navy,#26374B); margin:4px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 14px; }

  /* Más */
  .fila-mas { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
              background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
              padding:15px 16px; margin-bottom:11px; font:inherit; color:var(--navy,#26374B); cursor:pointer; text-decoration:none; }
  .fila-mas b { display:block; font-size:15.5px; font-weight:600; }
  .fila-mas small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }

  .cl-toast { position:fixed; left:50%; bottom:170px; transform:translate(-50%,14px); opacity:0; transition:.24s;
              background:var(--navy,#26374B); color:#fff; font-size:14px; padding:10px 16px; border-radius:999px; z-index:60;
              box-shadow:0 10px 24px -8px rgba(30,45,65,.5); }
  .cl-toast.ver { opacity:1; transform:translate(-50%,0); }
  .cl-toast.err { background:#B23B3B; }
</style>

<body>

  <div class="cl-wrap" id="cl"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cl');
  var b = window.APOLANA_BASE || '../../';
  var UI = window.APOLANA_UI;

  var GRUPOS = [], ALTAS = [], PRUEBA = [], sel = null, fecha = hoyISO(), ASIS = {}, AUSF = {}, PAUSA = {}, cargado = false, CANCEL = {cancelado:false};

  function pad(n){ return (n<10?'0':'')+n; }
  function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function fechaLarga(s){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  // Singular/plural: «1 persona» / «2 personas».
  function pl(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sinPrefijo(n){ return String(n||'').replace(/^El Cubo\s*·\s*/i,''); }
  /* Grupos de FUERZA GRATIS: su gente no está en cubo_altas (no son atletas ni
     tienen cuenta), sino en cubo_prueba. Se reconoce por el nombre y su turno. */
  function esGratis(g){ return !!g && /fuerza\s*gratis/i.test(g.nombre||''); }
  function turnoDe(g){
    var s = ((g&&(g.nombre||''))+' '+(g&&(g.horario||''))).toLowerCase();
    if(s.indexOf('viernes')>=0) return 'viernes';
    if(s.indexOf('sábado')>=0 || s.indexOf('sabado')>=0) return 'sabado';
    if(s.indexOf('domingo')>=0) return 'domingo';
    return null;
  }
  /* Los contadores y la lista son POR DÍA: el día de la fecha elegida (1=lun…
     7=dom). Así, en «M y J», quien solo viene el jueves NO cuenta el martes. */
  function diaSemFecha(){ var p=String(fecha).split('-'); var js=new Date(+p[0],+p[1]-1,+p[2]).getDay(); return js===0?7:js; }
  /* Los días que entrena el grupo, sacados del nombre (para la gente que aún no
     tiene marcado qué día viene: se les enseña todos los días del turno). */
  function diasDelGrupo(g){
    var n=((g&&g.nombre)||'').toLowerCase();
    if(n.indexOf('l y x')>=0) return [1,3];
    if(n.indexOf('m y j')>=0) return [2,4];
    if(n.indexOf('viernes')>=0) return [5];
    if(n.indexOf('sábado')>=0||n.indexOf('sabado')>=0) return [6];
    if(n.indexOf('domingo')>=0) return [7];
    return [];
  }
  function vieneEseDia(a,D,g){
    if(a && a.dias_semana && a.dias_semana.length) return a.dias_semana.indexOf(D)!==-1;
    var dg=diasDelGrupo(g); return !dg.length || dg.indexOf(D)!==-1;   // sin marcar = todos los días del turno
  }
  /* Al entrar, el grupo que entrena HOY; si hay varios, el de la hora más
     cercana a ahora. Los días salen del nombre («L y X», «M y J», «Viernes»…). */
  function diasPreselec(g){
    var d = diasDelGrupo(g); if(d.length) return d;
    var t = turnoDe(g); return t==='viernes' ? [5] : t==='sabado' ? [6] : t==='domingo' ? [7] : [];
  }
  function horaDe(g){
    var m = /(\d{1,2})[:.h](\d{2})/.exec(((g&&g.nombre)||'')+' '+((g&&g.horario)||''));
    return m ? (+m[1])*60 + (+m[2]) : null;
  }
  function grupoDeHoy(){
    var D = diaSemFecha(), now = new Date(), min = now.getHours()*60 + now.getMinutes();
    var deHoy = GRUPOS.filter(function(g){ return diasPreselec(g).indexOf(D) !== -1; });
    if(!deHoy.length) return null;
    deHoy.sort(function(a,b){
      var ha = horaDe(a), hb = horaDe(b);
      return (ha==null?9999:Math.abs(ha-min)) - (hb==null?9999:Math.abs(hb-min));
    });
    return deHoy[0];
  }
  function entrenaEseDia(g){ return diasPreselec(g).indexOf(diaSemFecha()) !== -1; }
  function cuenta(g){
    if(esGratis(g)){ var t=turnoDe(g); return PRUEBA.filter(function(p){ return (p.turnos||[]).indexOf(t)!==-1 && !AUSF[p.perfil_id]; }).length; }
    var D=diaSemFecha();
    return ALTAS.filter(function(a){ return a.horario===g.nombre && !a.lista_espera && vieneEseDia(a,D,g) && !AUSF[a.perfil_id] && !PAUSA[a.id]; }).length;
  }
  function toast(msg,tipo){ var t=document.createElement('div'); t.className='cl-toast'+(tipo==='err'?' err':''); t.textContent=msg;
    document.body.appendChild(t); requestAnimationFrame(function(){ t.classList.add('ver'); });
    setTimeout(function(){ t.classList.remove('ver'); setTimeout(function(){ t.remove(); },260); },2000); }

  async function cargar(){
    var g = await sb.from('grupos').select('id,nombre,horario').eq('seccion','cubo').eq('activo',true).order('nombre');
    GRUPOS = g.error ? [] : (g.data||[]);
    var a = await sb.from('cubo_altas').select('id,nombre,apellidos,telefono,horario,atleta_id,perfil_id,estado,lista_espera,dias_semana').eq('estado','aprobada');
    ALTAS = a.error ? [] : (a.data||[]);
    var p = await sb.from('cubo_prueba').select('id,nombre,apellidos,telefono,turnos,estado,perfil_id').neq('estado','cancelado');
    PRUEBA = p.error ? [] : (p.data||[]);
    if(!sel && GRUPOS.length){ var gh = grupoDeHoy(); sel = (gh || GRUPOS[0]).id; }
    cargado = true;
  }

  async function cargarAsis(){
    ASIS = {}; AUSF = {}; PAUSA = {};
    CANCEL = {cancelado:false};
    /* [360] Quién tiene la cuota EN PAUSA el mes de la fecha elegida: guarda
       su plaza (sale en la lista) pero no viene ese mes. */
    try {
      var rz = await sb.from('cubo_pausas').select('alta_id,mes,stripe_aplicada_en').eq('estado','aprobada').eq('mes', String(fecha).slice(0,7)+'-01');
      // En vigor: ya puesta en Stripe, o aún antes del cobro del día 5 (si no
      // llegó a Stripe a tiempo, ese mes SÍ se cobró y viene con normalidad).
      if(rz && !rz.error) (rz.data||[]).forEach(function(x){
        if(x.alta_id && (x.stripe_aplicada_en || hoyISO() < String(x.mes).slice(0,7)+'-05')) PAUSA[x.alta_id] = true;
      });
    } catch(e){}
    try { var rc = await sb.rpc('dia_cancelado', { p_fecha: fecha, p_seccion: 'cubo' }); if(rc && !rc.error && rc.data) CANCEL = rc.data; } catch(e){}
    if(!sel) return;
    /* Quién ha avisado que NO viene ESE día (por perfil) y cuándo lo avisó. El
       staff del Cubo puede leer todas las ausencias (RLS). */
    var ra = await sb.from('cubo_ausencias').select('perfil_id,creado_en').eq('fecha', fecha);
    if(!ra.error) (ra.data||[]).forEach(function(x){ if(x.perfil_id) AUSF[x.perfil_id] = x.creado_en || true; });
    var g = grupoSel();
    if(esGratis(g)){
      var t = turnoDe(g);
      var rp = await sb.from('cubo_prueba_asistencia').select('prueba_id,presente').eq('turno', t).eq('fecha', fecha);
      if(!rp.error) (rp.data||[]).forEach(function(x){ ASIS[x.prueba_id] = !!x.presente; });
      return;
    }
    var r = await sb.from('asistencia').select('atleta_id,presente').eq('grupo_id', sel).eq('fecha', fecha);
    if(!r.error) (r.data||[]).forEach(function(x){ ASIS[x.atleta_id] = !!x.presente; });
  }

  function grupoSel(){ return GRUPOS.filter(function(g){ return g.id===sel; })[0] || null; }
  /* Gente del grupo seleccionado, normalizada venga de cubo_altas (de pago) o de
     cubo_prueba (gratis):
       { id, nombre, apellidos, key, gratis, sinFicha, tel, aviso, pausa, est }
     · key = con qué se guarda la asistencia (atleta_id de pago, prueba_id gratis)
     · est = 'si' | 'no' | '' (sin marcar). Lo guardado manda; si no hay nada
       guardado y avisó «no voy» (o está en pausa), sale ya como «no». */
  function miembros(){
    var g = grupoSel(); if(!g) return [];
    var arr;
    if(esGratis(g)){
      var t = turnoDe(g);
      arr = PRUEBA.filter(function(p){ return (p.turnos||[]).indexOf(t)!==-1; }).map(function(p){
        return { id:p.id, nombre:p.nombre, apellidos:p.apellidos, tel:p.telefono, key:p.id, gratis:true, sinFicha:false, aviso:AUSF[p.perfil_id]||null, pausa:false };
      });
    } else {
      var D=diaSemFecha();
      arr = ALTAS.filter(function(a){ return a.horario===g.nombre && !a.lista_espera && vieneEseDia(a,D,g); }).map(function(a){
        return { id:a.id, nombre:a.nombre, apellidos:a.apellidos, tel:a.telefono, key:a.atleta_id, gratis:false, sinFicha:!a.atleta_id,
                 aviso:AUSF[a.perfil_id]||null, pausa:!!PAUSA[a.id] };
      });
    }
    arr.forEach(function(m){
      m.guardado = (m.key && ASIS.hasOwnProperty(m.key)) ? (ASIS[m.key] ? 'si' : 'no') : null;
      m.est = m.guardado || ((m.aviso || m.pausa) ? 'no' : '');
    });
    return arr.sort(function(x,y){
      return (((x.nombre||'')+' '+(x.apellidos||'')).toLowerCase() < ((y.nombre||'')+' '+(y.apellidos||'')).toLowerCase()) ? -1 : 1;
    });
  }
  function cuentas(lst){
    var c = { si:0, no:0, sin:0, av:0, tot:0 };
    lst.forEach(function(m){ if(m.sinFicha) return; c.tot++; if(m.est==='si') c.si++; else if(m.est==='no') c.no++; else c.sin++; if(m.aviso) c.av++; });
    return c;
  }

  // Guarda la marca de varias personas de golpe (true = vino, false = no vino, null = quitar).
  async function guardarMarcas(lista, valor){
    lista = lista.filter(function(m){ return m.key; });
    if(!lista.length) return true;
    var g = grupoSel(), keys = lista.map(function(m){ return m.key; }), r;
    if(esGratis(g)){
      var t = turnoDe(g);
      r = valor === null
        ? await sb.from('cubo_prueba_asistencia').delete().in('prueba_id', keys).eq('turno', t).eq('fecha', fecha)
        : await sb.from('cubo_prueba_asistencia').upsert(keys.map(function(k){ return { prueba_id:k, turno:t, fecha:fecha, presente:valor, registrado_por:(perfil&&perfil.id)||null }; }), { onConflict:'prueba_id,turno,fecha' });
    } else {
      r = valor === null
        ? await sb.from('asistencia').delete().in('atleta_id', keys).eq('grupo_id', sel).eq('fecha', fecha)
        : await sb.from('asistencia').upsert(keys.map(function(k){ return { atleta_id:k, grupo_id:sel, fecha:fecha, presente:valor, registrado_por:(perfil&&perfil.id)||null }; }), { onConflict:'atleta_id,fecha,grupo_id' });
    }
    if(r.error){ toast('No se pudo guardar: '+r.error.message,'err'); return false; }
    keys.forEach(function(k){ if(valor === null) delete ASIS[k]; else ASIS[k] = valor; });
    return true;
  }

  // ✓ / ✗ de una persona: se guarda al momento. Tocar el que ya está puesto lo quita.
  async function marcar(id, v, filaEl){
    var m = miembros().filter(function(x){ return x.id===id; })[0];
    if(!m) return;
    if(!m.key){ toast('Esta ficha no está enlazada; avisa al club.','err'); return; }
    if(filaEl) filaEl.setAttribute('aria-busy','true');
    var quitar = (m.guardado === v);
    await guardarMarcas([m], quitar ? null : (v === 'si'));
    pintarLista();
  }

  async function restoVienen(){
    var pend = miembros().filter(function(m){ return !m.sinFicha && !m.est; });
    if(!pend.length) return;
    if(await guardarMarcas(pend, true)) toast(pl(pend.length,'persona marcada','personas marcadas')+' ✓');
    pintarLista();
  }
  async function borrarMarcas(){
    if(!window.confirm('¿Borrar todas las marcas de este grupo este día?')) return;
    var cons = miembros().filter(function(m){ return m.guardado; });
    await guardarMarcas(cons, null);
    pintarLista();
  }
  // «Guardar lista»: lo que queda sin marcar (y los que avisaron, si aún no se
  // había guardado nada) se guarda como que NO vino. Lo demás ya estaba guardado.
  async function guardarLista(){
    var lst = miembros().filter(function(m){ return !m.sinFicha; });
    var sin = lst.filter(function(m){ return !m.est; });
    if(sin.length && !window.confirm('Quedan '+pl(sin.length,'persona','personas')+' sin marcar: se guardan como que no han venido.\n\n¿Guardar la lista?')) return;
    var noGuardados = lst.filter(function(m){ return !m.guardado && m.est !== 'si'; });
    if(await guardarMarcas(noGuardados, false)){
      var c = cuentas(miembros());
      toast('Lista guardada ✓ · '+c.si+' '+(c.si===1?'vino':'vinieron'));
    }
    pintarLista();
  }

  var COL = ['#2F6FA8','#2E8C86','#B5714A','#6E5AA6','#3F7A4C','#C6892F'];
  // Nombres escritos TODO EN MAYÚSCULAS (vienen así de las fichas) → «Enzo Garrido Ibos»: ocupan menos y se leen mejor.
  function bonito(n){
    n = String(n||'').trim();
    if (!n || n !== n.toUpperCase() || !/[A-ZÁÉÍÓÚÑÜ]/.test(n)) return n;
    return n.toLowerCase().split(/\s+/).map(function(w, i){
      if (i && /^(de|del|la|las|los|y|i)$/.test(w)) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }
  function iniciales(n){ return String(n||'').trim().split(/\s+/).slice(0,2).map(function(x){ return x.charAt(0).toUpperCase(); }).join(''); }
  function color(n){ var h=0; String(n||'').split('').forEach(function(c){ h=(h*31+c.charCodeAt(0))>>>0; }); return COL[h%COL.length]; }
  function cuando(ts){
    if(!ts || ts === true) return '';
    var d = new Date(ts), hoy = new Date(), ay = new Date(); ay.setDate(ay.getDate()-1);
    function iso(x){ return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }
    var h = pad(d.getHours())+':'+pad(d.getMinutes());
    if(iso(d)===iso(hoy)) return ' hoy a las '+h;
    if(iso(d)===iso(ay)) return ' ayer a las '+h;
    return ' el '+d.getDate()+' de '+MESES[d.getMonth()]+' a las '+h;
  }
  function moverDia(n){ var p=fecha.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  function filaHTML(a){
    var nombre = bonito(((a.nombre||'')+' '+(a.apellidos||'')).trim());
    var meta = [], extra = '';
    if(a.pausa) meta.push('<span class="pl-pill pl-p-gris">En pausa · '+esc(MESES[+String(fecha).slice(5,7)-1])+'</span>');
    if(a.aviso){ meta.push('<span class="pl-pill pl-p-av">🔔 Avisó</span>'); var w = cuando(a.aviso); if(w) extra = '<div class="pl-aviso-txt">Avisó'+esc(w)+' que no viene</div>'; }
    if(a.sinFicha) meta.push('<span class="pl-pill pl-p-gris">Ficha sin enlazar</span>');
    if(a.tel){ var tl = String(a.tel).replace(/[^\d+]/g,''); if(tl) meta.push('<a class="pl-tel" href="tel:'+esc(tl)+'">📞 Llamar</a>'); }
    var cls = 'pl-fila '+(a.est==='si'?'si':a.est==='no'?'no':'sin')+(a.aviso?' aviso':'');
    return '<div class="'+cls+'">'+
      '<div class="pl-av" style="background:'+color(nombre)+'">'+esc(iniciales(nombre))+'</div>'+
      '<div class="pl-info"><div class="n">'+esc(nombre)+'</div>'+(meta.length?'<div class="m">'+meta.join(' ')+'</div>':'')+extra+'</div>'+
      (a.sinFicha ? '' :
        '<div class="pl-est"><button type="button" class="si" data-a="'+esc(a.id)+'" data-v="si" aria-label="Vino">✓</button>'+
        '<button type="button" class="no" data-a="'+esc(a.id)+'" data-v="no" aria-label="No vino">✗</button></div>')+
    '</div>';
  }

  function pintarLista(){
    var g = grupoSel(), hoy = hoyISO();
    var chipsAntes = wrap.querySelector('.pl-chips'), scrollChips = chipsAntes ? chipsAntes.scrollLeft : null;
    var chips = GRUPOS.map(function(x){
      return '<button type="button" class="pl-chip'+(x.id===sel?' on':'')+'" data-g="'+esc(x.id)+'" aria-pressed="'+(x.id===sel?'true':'false')+'">'+
        '<div class="h">'+esc(sinPrefijo(x.nombre))+(entrenaEseDia(x)?' <span class="pl-tag">'+(fecha===hoy?'Hoy':'Este día')+'</span>':'')+'</div>'+
        '<div class="s">'+pl(cuenta(x), 'persona', 'personas')+'</div></button>';
    }).join('');

    var cab =
      '<h1 class="pl-tit">Pasar lista</h1>'+
      '<div class="pl-fecha">'+
        '<button type="button" data-dia="-1" aria-label="Día anterior">‹</button>'+
        '<label class="dia">'+(fecha===hoy?'Hoy · ':'')+esc(fechaLarga(fecha))+
          '<input type="date" id="cl-fecha" value="'+esc(fecha)+'" max="'+esc(hoy)+'" aria-label="Elegir día"></label>'+
        '<button type="button" data-dia="1" aria-label="Día siguiente"'+(fecha>=hoy?' disabled':'')+'>›</button>'+
      '</div>'+
      (GRUPOS.length ? '<div class="pl-chips">'+chips+'</div>' : '');

    if(CANCEL.cancelado){
      wrap.innerHTML = cab +
        '<div style="text-align:center;background:#FBEDEA;border:1px solid #E7C3BB;border-radius:14px;padding:24px 16px;margin-top:6px">'+
          '<div style="font-size:30px;line-height:1;margin-bottom:6px">🚫</div>'+
          '<div style="font-weight:700;color:#9A3B3B;font-size:17px">Entrenamiento cancelado</div>'+
          '<div style="color:#7A4A44;margin-top:3px">'+esc(CANCEL.motivo||'Festivo')+'</div>'+
          '<div style="color:#8A816E;font-size:12.5px;margin-top:8px">Este día no hay entrenamiento del Cubo. No hace falta pasar lista.</div>'+
        '</div>';
      return;
    }

    var lst = miembros(), c = cuentas(lst);
    var vacio = esGratis(g)
      ? (UI ? UI.vacio('Nadie apuntado a este turno', 'Cuando alguien rellene el formulario de fuerza gratis para este día, aparecerá aquí.') : '<p class="pl-vacio">Nadie apuntado a este turno todavía.</p>')
      : (UI ? UI.vacio('Nadie en este grupo', 'Cuando el club apruebe altas en este horario, aparecerán aquí.') : '<p class="pl-vacio">Nadie en este grupo todavía.</p>');
    var pct = c.tot ? Math.round((c.si+c.no)/c.tot*100) : 0;
    var titG = g ? esc(sinPrefijo(g.nombre)) : '';
    var subG = esGratis(g) ? 'fuerza gratis' : esc(DIAS[diaSemFecha()===7?0:diaSemFecha()]);

    var resumen = !lst.length ? '' :
      '<div class="pl-res">'+
        '<div class="cab"><b>'+titG+'</b><small>'+pl(lst.length,'persona','personas')+' · '+subG+'</small></div>'+
        '<div class="cuerpo">'+
          '<div class="pl-anillo" style="--p:'+pct+'"><i>'+(c.si+c.no)+'/'+c.tot+'</i></div>'+
          '<div class="pl-cifras">'+
            '<div class="pl-c-ok"><b>'+c.si+'</b>'+(c.si===1?'vino':'vinieron')+'</div>'+
            '<div class="pl-c-ko"><b>'+c.no+'</b>no '+(c.no===1?'vino':'vinieron')+'</div>'+
            '<div class="pl-c-av"><b>'+c.av+'</b>'+(c.av===1?'avisó':'avisaron')+'</div>'+
            '<div class="pl-c-az"><b>'+c.sin+'</b>sin marcar</div>'+
          '</div>'+
        '</div>'+
        '<div class="pl-todos">'+
          '<button type="button" class="pl-b-ok" id="cl-resto"'+(c.sin?'':' disabled')+'>✓ El resto, vinieron</button>'+
          '<button type="button" class="pl-b-lim" id="cl-borrar">Borrar marcas</button>'+
        '</div>'+
      '</div>';

    var bloque = lst.length
      ? '<div class="pl-blq"><div class="cab"><b>'+titG+'</b><span>'+(c.sin ? pl(c.sin,'sin marcar','sin marcar') : 'todo marcado')+'</span></div>'+lst.map(filaHTML).join('')+'</div>'
      : vacio;

    var pie = !lst.length ? '' :
      '<div class="pl-pie"><div class="txt">'+
        (c.sin ? '<b>'+c.sin+'</b> sin marcar · '+c.si+' '+(c.si===1?'vino':'vinieron')+' · '+c.no+' no' : '<b>Todo marcado</b> · '+c.si+' '+(c.si===1?'vino':'vinieron')+' · '+c.no+' no')+
      '</div><button type="button" id="cl-guardar">Guardar lista</button></div>';

    wrap.innerHTML = cab + '<p class="pl-nota">Cada marca se guarda al momento.</p>' + resumen + bloque + pie;

    // La fila de grupos: dejar a la vista el elegido (o donde estaba, si solo se repinta).
    var fila = wrap.querySelector('.pl-chips'), on = fila && fila.querySelector('.pl-chip.on');
    if(fila){
      if(scrollChips != null) fila.scrollLeft = scrollChips;
      else if(on) fila.scrollLeft = Math.max(0, on.offsetLeft - (parseFloat(getComputedStyle(fila).paddingLeft) || 0));
    }
  }

  function pintarMas(){
    wrap.innerHTML =
      '<h1 class="saludo">Más</h1>'+
      '<p class="sub">'+esc(perfil && perfil.nombre ? perfil.nombre : 'Lista del Cubo')+'</p>'+
      '<a class="fila-mas" href="'+b+'portal/perfil/"><span><b>Mi perfil</b><small>Cambiar la contraseña.</small></span></a>'+
      '<button type="button" class="fila-mas" id="cl-salir"><span><b>Cerrar sesión</b></span></button>';
  }

  async function pintar(){
    if(!cargado){ if(UI) wrap.innerHTML = '<div class="ap-esq" data-esq="filas:4"></div>'; await cargar(); }
    if((location.hash||'') === '#mas'){ pintarMas(); return; }
    await cargarAsis();
    pintarLista();
  }
  function cambiarFecha(nueva){
    var hoy = hoyISO(); fecha = nueva || hoy; if(fecha > hoy) fecha = hoy;
    pintar();
  }

  wrap.addEventListener('click', function(ev){
    var t = ev.target; if(!t || !t.closest) return;
    var ch = t.closest('.pl-chip[data-g]');
    if(ch){ sel = ch.getAttribute('data-g'); pintar(); return; }
    var dd = t.closest('[data-dia]');
    if(dd){ if(!dd.disabled) cambiarFecha(moverDia(+dd.getAttribute('data-dia'))); return; }
    var bt = t.closest('.pl-est button[data-a]');
    if(bt){ marcar(bt.getAttribute('data-a'), bt.getAttribute('data-v'), bt.closest('.pl-fila')); return; }
    if(t.closest('#cl-resto')){ restoVienen(); return; }
    if(t.closest('#cl-borrar')){ borrarMarcas(); return; }
    if(t.closest('#cl-guardar')){ guardarLista(); return; }
    var sal = t.closest('#cl-salir');
    if(sal){ try { sb.auth.signOut().then(function(){ location.href = b; }); } catch(e){ location.href = b; } return; }
  });
  wrap.addEventListener('change', function(ev){
    if(ev.target && ev.target.id==='cl-fecha'){ cambiarFecha(ev.target.value); }
  });
  window.addEventListener('hashchange', pintar);

  pintar();
});
</script>
</body>
</html>
