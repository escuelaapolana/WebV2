<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Cubo · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<link rel="stylesheet" href="../../assets/css/panel-piezas.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/panel-piezas.js" defer></script>
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); }
  .cb-wrap { max-width:680px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 40px; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(24px,5.5vw,34px); line-height:1.02; color:var(--navy,#26374B); margin:4px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 4px; }
  .rotulo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:14px;
            color:var(--navy,#26374B); margin:22px 0 10px; }
  /* Separación estética entre un bloque y «Otras actividades del club» */
  .rotulo--sep { margin-top:30px; padding-top:22px; border-top:1px solid var(--linea-marcada,#E4DCCB); }

  /* Noticias */
  .noti { display:block; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px;
          box-shadow:var(--s1); overflow:hidden; margin-bottom:14px; text-decoration:none; color:inherit; }
  .noti img { display:block; width:100%; height:auto; background:var(--crema-media,#F1EADC); }
  .noti .tx { padding:13px 16px 15px; }
  .noti .cat { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#8A5307; }
  .noti h2 { font-family:var(--ap-titulo); font-weight:700; font-size:18px; line-height:1.2; color:var(--navy,#26374B); margin:3px 0 5px; }
  .noti p { font-size:14px; line-height:1.5; color:var(--texto-suave,#6E6656); margin:0; }
  .noti .fecha { font-size:12.5px; color:var(--texto-tenue,#9A927F); margin-top:7px; }

  /* Horarios */
  .hor { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); overflow:hidden; }
  .hor .fila { display:flex; align-items:baseline; gap:12px; padding:14px 16px; border-top:1px solid var(--linea,#EDE6D7); }
  .hor .fila:first-child { border-top:0; }
  .hor .dia { flex:0 0 92px; font-weight:600; color:var(--navy,#26374B); font-size:15px; }
  .hor .det { flex:1; min-width:0; }
  .hor .hh { font-family:var(--dato); font-size:15px; color:var(--navy,#26374B); }
  .hor .lugar { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }

  /* Más */
  .fila-mas { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
              background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
              padding:15px 16px; margin-bottom:11px; font:inherit; color:var(--navy,#26374B); cursor:pointer; text-decoration:none; }
  .fila-mas b { display:block; font-size:15.5px; font-weight:600; }
  .fila-mas small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }
  .cuota { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); padding:16px 18px; margin-bottom:14px; }
  .cuota h2 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:15px; color:var(--navy,#26374B); margin:0 0 6px; }
  .cuota p { font-size:14px; line-height:1.5; color:var(--texto-suave,#6E6656); margin:0 0 12px; }
  .cuota .btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 18px;
                border-radius:999px; border:1px solid var(--linea-borde,#C9C0AE); background:var(--crema-media,#F1EADC);
                color:var(--texto-suave,#6E6656); font:inherit; font-size:15px; font-weight:600; cursor:not-allowed; }
  .cuota .btn.activo { background:var(--navy,#26374B); border-color:var(--navy,#26374B); color:#fff; cursor:pointer; }
  .cuota .btn.activo:disabled { opacity:.62; cursor:progress; }
  .cuota .pago-msg { margin:10px 0 0; font-size:13.5px; color:#B23B3B; }
  .cuota .fina { font-size:12.5px; color:var(--texto-tenue,#9A927F); margin:10px 0 0; }
  .cuota .enlace { background:none; border:0; padding:0; font:inherit; color:var(--azul,#2F6FA8); text-decoration:underline; cursor:pointer; }
  .cuota .enlace:hover { color:var(--azul-hover,#1E4E78); }
  .cb-vuelta { display:flex; gap:10px; align-items:flex-start; border-radius:14px; padding:13px 15px; margin:0 0 14px;
               font-size:14px; line-height:1.45; border:1px solid; }
  .cb-vuelta.ok { background:#EDF5EC; border-color:#BFD9BB; color:#2E5A2A; }
  .cb-vuelta.ko { background:#FBF0EC; border-color:#E6C4B5; color:#8A4A2E; }
  /* Aviso de pago pendiente en el Inicio */
  .cb-pend { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:0 0 18px;
             background:#FBF0EC; border:1px solid #E6C4B5; border-radius:14px; padding:14px 16px; }
  .cb-pend .tx { flex:1 1 190px; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .cb-pend .tx b { color:#8A4A2E; font-size:15px; }
  .cb-pend .tx span { color:#8A4A2E; font-size:13.5px; opacity:.92; }
  .cb-pend .btn { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; min-height:44px;
                  padding:0 18px; border-radius:999px; border:1px solid var(--navy,#26374B); background:var(--navy,#26374B);
                  color:#fff; font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
  .cb-pend .btn:disabled { opacity:.62; cursor:progress; }
  .cb-pend .pago-msg { flex-basis:100%; margin:2px 0 0; font-size:13.5px; color:#B23B3B; }
  /* Próximo / último pago dentro de la tarjeta de cuota */
  .cuota .pagos { display:flex; flex-wrap:wrap; gap:10px; margin:2px 0 4px; }
  .cuota .pago { flex:1 1 130px; background:var(--crema-media,#F1EADC); border-radius:10px; padding:9px 12px; }
  .cuota .pago span { display:block; font-size:12px; color:var(--texto-suave,#6E6656); }
  .cuota .pago b { font-size:14px; color:var(--navy,#26374B); }
  /* Calendario semanal · tus clases + otras secciones que sumas con los chips */
  .cal-chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 2px; }
  .cal-chip { min-height:40px; padding:8px 15px; border-radius:999px; border:1.5px solid var(--linea-borde,#C9C0AE);
              background:#fff; color:var(--texto-suave,#6E6656); font:inherit; font-size:14px; font-weight:600;
              cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
  .cal-chip::before { content:''; width:10px; height:10px; border-radius:50%; background:var(--pc,#8A5307); flex:0 0 auto; }
  .cal-chip.sec-cubo { --pc:#26374B; } .cal-chip.sec-running { --pc:#2F6FA8; }
  .cal-chip.sec-competicion { --pc:#8A5307; } .cal-chip.sec-escuela { --pc:#3E7D57; }
  .cal-chip.on { color:#fff; border-color:var(--pc); background:var(--pc); }
  .cal-chip.on::before { background:#fff; }
  .cal-chip--mia::before { width:8px; height:8px; box-shadow:0 0 0 3px rgba(38,55,75,.16); }
  .cal-otras-eti { font-size:13px; font-weight:600; color:var(--texto-suave,#6E6656); margin:15px 0 8px; }
  .cal-otras-eti span { font-weight:400; color:var(--texto-tenue,#9A927F); }

  .cal-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:14px 0 12px; }
  .cal-fl { width:44px; height:44px; flex:0 0 auto; border-radius:12px; border:1px solid var(--linea-marcada,#E4DCCB);
            background:#fff; box-shadow:var(--s1); font-size:22px; line-height:1; color:var(--navy,#26374B); cursor:pointer; }
  .cal-rango { flex:1; min-width:0; text-align:center; font-family:var(--ap-titulo); font-weight:700; font-size:16px;
               color:var(--navy,#26374B); display:flex; flex-direction:column; gap:1px; }
  .cal-rango small { font-family:var(--fuente-texto,inherit); font-weight:500; font-size:12px; color:var(--texto-tenue,#9A927F); }

  .cal-semana { display:flex; flex-direction:column; gap:10px; }
  .cal-dia { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1); padding:11px 15px 12px; }
  .cal-dia.vacio { box-shadow:none; background:transparent; border-style:dashed; border-color:var(--linea,#E4DCCB); padding:9px 15px; }
  .cal-dia.hoy { border-color:var(--navy,#26374B); box-shadow:0 0 0 1px var(--navy,#26374B), var(--s1); }
  .cal-dia h3 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:13px;
                letter-spacing:.02em; color:var(--navy,#26374B); margin:0 0 2px; }
  .cal-dia h3 span { color:var(--texto-tenue,#9A927F); font-weight:600; }
  .cal-dia.hoy h3::after { content:'Hoy'; margin-left:8px; font-size:10.5px; font-weight:700; color:#fff;
                           background:var(--navy,#26374B); border-radius:999px; padding:2px 8px; vertical-align:middle; }
  .cal-nada { margin:2px 0 0; color:var(--texto-tenue,#C7BFAD); font-size:14px; }

  .cal-ses { display:flex; gap:12px; align-items:baseline; padding:9px 0 8px; border-top:1px solid var(--linea,#EDE6D7); }
  .cal-dia h3 + .cal-ses { border-top:0; padding-top:6px; }
  .cal-ses .hh { flex:0 0 auto; font-family:var(--dato); font-size:13.5px; color:var(--navy,#26374B); min-width:46px; }
  .cal-ses .tx { min-width:0; border-left:3px solid var(--pc,#8A5307); padding-left:11px; }
  .cal-ses .tx b { display:block; font-size:14.5px; font-weight:600; line-height:1.25; color:var(--navy,#26374B); }
  .cal-ses .tx small { display:block; font-size:12.5px; color:var(--texto-suave,#6E6656); margin-top:1px; }
  .cal-ses.sec-cubo { --pc:#26374B; } .cal-ses.sec-running { --pc:#2F6FA8; }
  .cal-ses.sec-competicion { --pc:#8A5307; } .cal-ses.sec-escuela { --pc:#3E7D57; }
  .cal-ses.mia .tx b::after { content:'Tú'; margin-left:7px; font-size:10.5px; font-weight:700; color:#fff;
                              background:var(--navy,#26374B); border-radius:999px; padding:1px 7px; vertical-align:middle; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="cb-wrap" id="cb"></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  };
  var b = (window.APOLANA_BASE || '../../');
  var DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function hhmm(h) { return h ? String(h).slice(0,5) : ''; }
  function fechaLarga(iso) {
    if (!iso) return '';
    var p = String(iso).slice(0,10).split('-');
    return (+p[2]) + ' de ' + MESES[(+p[1])-1] + ' de ' + p[0];
  }
  /* Los PRÓXIMOS entrenamientos con fecha real: proyecta el horario semanal
     (día de la semana + hora) sobre las próximas ~6 semanas y devuelve las
     siguientes sesiones. Los grupos de la prueba gratis no empiezan hasta el
     2 de octubre. dia_semana: 1=lunes … 7=domingo. */
  function proximosEntrenos(horas, n) {
    var out = [];
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var inicioGratis = new Date(2026, 9, 2);   // 2 de octubre de 2026
    var d = new Date(hoy);
    var limite = new Date(hoy); limite.setDate(limite.getDate() + 42);
    while (d <= limite) {
      var dow = d.getDay();                    // 0=domingo … 6=sábado
      horas.forEach(function (hh) {
        var dowJs = (hh.dia_semana === 7) ? 0 : hh.dia_semana;
        if (dow === dowJs && !(hh._gratis && d < inicioGratis)) out.push({ fecha: new Date(d), h: hh });
      });
      d.setDate(d.getDate() + 1);
    }
    out.sort(function (a, b) { return (+a.fecha - +b.fecha) || String(a.h.hora_inicio || '').localeCompare(String(b.h.hora_inicio || '')); });
    return out.slice(0, n);
  }
  /* «Viernes 3 de octubre» a partir de un Date. */
  function diaFecha(d) { return DIAS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
  var nombre = (perfil && perfil.nombre) ? String(perfil.nombre).split(' ')[0] : '';

  // --------------------------------------------------------
  //  DATOS (se cargan una vez y se cachean)
  // --------------------------------------------------------
  var _noticias = null, _horarios = null;

  async function noticias() {
    if (_noticias) return _noticias;
    var r = await sb.from('noticias')
      .select('id,titulo,excerpt,categoria,foto_portada,fecha_publicacion')
      .eq('publicada', true)
      .order('fecha_publicacion', { ascending: false })
      .limit(20);
    _noticias = r.error ? { error: r.error.message, data: [] } : { error: '', data: r.data || [] };
    return _noticias;
  }

  async function horarios() {
    if (_horarios) return _horarios;
    // Junta TODOS sus grupos del Cubo: el principal de su ficha y todos los de
    // `atleta_grupos` (en la prueba de fuerza uno puede estar en varios turnos).
    var gids = [];
    try {
      var m = await APOLANA_PORTAL.misAtletas(perfil.id);
      var fichas = (m && m.data || []);
      fichas.forEach(function (a) { if (a && a.grupo_id) gids.push(a.grupo_id); });
      var ids = fichas.map(function (a) { return a.id; }).filter(Boolean);
      if (ids.length) {
        var rag = await sb.from('atleta_grupos').select('grupo_id').in('atleta_id', ids);
        if (rag && !rag.error && rag.data) rag.data.forEach(function (x) { gids.push(x.grupo_id); });
      }
    } catch (e) {}
    gids = gids.filter(function (v, i) { return v && gids.indexOf(v) === i; });
    if (!gids.length) { _horarios = { data: [], grupo: '', varios: false }; return _horarios; }
    var rg = await sb.from('grupos').select('id,nombre').in('id', gids);
    var nombres = {};
    ((rg && rg.data) || []).forEach(function (g) { nombres[g.id] = g.nombre; });
    var r = await sb.from('grupo_horarios')
      .select('grupo_id,dia_semana,hora_inicio,hora_fin,lugar,nota')
      .in('grupo_id', gids).eq('activo', true)
      .order('dia_semana').order('hora_inicio');
    var data = (r && !r.error && r.data) ? r.data : [];
    // Marca cada horario si es de un grupo de la prueba gratis (empieza el 2-oct)
    // y guarda el nombre del grupo para poder etiquetarlo en el calendario.
    data.forEach(function (x) {
      x._grupo = nombres[x.grupo_id] || '';
      x._gratis = /Fuerza gratis/i.test(x._grupo);
    });
    _horarios = {
      error: r && r.error ? r.error.message : false,
      data: data,
      grupo: gids.length === 1 ? (nombres[gids[0]] || '') : '',
      varios: gids.length > 1
    };
    return _horarios;
  }

  // --------------------------------------------------------
  //  VISTAS
  // --------------------------------------------------------
  // Aviso al volver de la pasarela de Stripe (?cuota=hecho / cancelado).
  function bannerVuelta() {
    var qs = new URLSearchParams(location.search);
    var c = qs.get('cuota');
    var p = qs.get('pago'); // vuelta de un pago puntual («ponle un pago»)
    if (!c && !p) return '';
    // Limpiamos la URL para que no reaparezca al recargar.
    qs.delete('cuota'); qs.delete('ref'); qs.delete('pago'); qs.delete('cobro');
    history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs.toString() : '') + location.hash);
    // Pago puntual (Prioridad: si vuelve de un pago suelto, ese es el aviso).
    if (p === 'hecho') {
      return '<div class="cb-vuelta ok">✅ <span>¡<b>Pago realizado</b>! Gracias. Ya queda registrado; ' +
        'puedes cerrar esto tranquilo.</span></div>';
    }
    if (p === 'cancelado') {
      return '<div class="cb-vuelta ko">⚠️ <span>Has salido sin terminar el pago. Sigue disponible aquí abajo ' +
        'cuando quieras pagarlo.</span></div>';
    }
    if (c === 'hecho') {
      return '<div class="cb-vuelta ok">✅ <span>¡Listo! <b>Primer pago hecho</b> y tu tarjeta queda guardada. ' +
        'A partir del <b>día 5 de cada mes</b> tu cuota se cobra sola; no tienes que hacer nada. Puedes verlo en «Más».</span></div>';
    }
    return '<div class="cb-vuelta ko">⚠️ <span>Has salido sin terminar el pago. Cuando quieras, actívala desde ' +
      '«Más» › «Tu cuota mensual».</span></div>';
  }

  function noticiaHTML(x) {
    var src = (window.APOLANA_IMG ? window.APOLANA_IMG(x.foto_portada) : x.foto_portada);
    return '<a class="noti" href="' + b + 'noticias/">' +
      (src ? '<img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
      '<div class="tx">' +
        (x.categoria ? '<span class="cat">' + esc(x.categoria) + '</span>' : '') +
        '<h2>' + esc(x.titulo) + '</h2>' +
        (x.excerpt ? '<p>' + esc(x.excerpt) + '</p>' : '') +
        '<div class="fecha">' + esc(fechaLarga(x.fecha_publicacion)) + '</div>' +
      '</div></a>';
  }

  // Otras actividades del club (para descubrir el resto: running, natación…).
  function otrasHTML() {
    return '<a class="fila-mas" href="' + b + 'running/"><span><b>Running · La Tribu</b>' +
        '<small>Corre con el club, para todos los niveles.</small></span></a>' +
      '<a class="fila-mas" href="' + b + 'natacion/"><span><b>Natación de adultos</b>' +
        '<small>Entrena en la piscina con el club.</small></span></a>' +
      '<a class="fila-mas" href="' + b + 'montana/"><span><b>Montaña y trail</b>' +
        '<small>Rutas y carreras por montaña.</small></span></a>' +
      '<a class="fila-mas" href="' + b + 'escuela-atletismo/"><span><b>Escuela de atletismo</b>' +
        '<small>Atletismo para niños y niñas.</small></span></a>';
  }

  // INICIO · su entrenamiento (horarios) + aviso de pago si toca + noticias.
  async function pintarInicio() {
    var qsC = new URLSearchParams(location.search).get('cuota');
    $('cb').innerHTML = bannerVuelta() +
      '<h1 class="saludo">Hola' + (nombre ? ', ' + esc(nombre) : '') + '</h1>' +
      '<p class="sub">Tus entrenamientos en El Cubo</p>' +
      '<div id="cb-aviso"></div>' +
      '<div id="cb-pagos"></div>' +
      '<div id="cb-horarios"><div class="ap-esq" data-esq="filas:2"></div></div>' +
      '<p class="rotulo rotulo--sep">Otras actividades del club</p>' +
      otrasHTML() +
      '<p class="rotulo">Noticias del club</p>' +
      '<div id="cb-noticias"><div class="ap-esq" data-esq="filas:2"></div></div>';

    var res = await Promise.all([horarios(), cuota(), noticias()]);
    var h = res[0], c = res[1], n = res[2];

    var alta = c.alta;
    // El cobro se abre POR PERSONA (columna cobro_abierto): a los de prueba y
    // a quien aún no le toca no le sale «Pagar la cuota». Antes era global.
    var abierto = !!(alta && alta.cobro_abierto);
    // En lista de espera: aviso propio, y no se pide pago.
    if (alta && alta.lista_espera && alta.suscripcion_estado !== 'activa') {
      $('cb-aviso').innerHTML =
        '<div class="cb-pend" style="background:#EEF3F8;border-color:#BcD3E6">' +
          '<div class="tx"><b style="color:#2F6FA8">En lista de espera</b>' +
          '<span style="color:#2F6FA8">Tu grupo está completo. Te avisaremos en cuanto haya sitio.</span></div>' +
        '</div>';
    }
    // Aviso de pago pendiente, bien visible (solo si el cobro ya está abierto,
    // no está en lista de espera y no acaban de pagar).
    var pendiente = alta && !alta.lista_espera && (alta.suscripcion_estado == null || alta.suscripcion_estado === 'impago');
    if (pendiente && abierto && qsC !== 'hecho') {
      var txt = alta.suscripcion_estado === 'impago'
        ? 'Tu cuota no se ha podido cobrar este mes.'
        : 'Tu cuota mensual está pendiente de activar.';
      $('cb-aviso').innerHTML =
        '<div class="cb-pend">' +
          '<div class="tx"><b>Pago pendiente</b><span>' + esc(txt) + '</span></div>' +
          '<button type="button" class="btn activo" id="cb-pagar">' +
            (alta.suscripcion_estado === 'impago' ? 'Reactivar la cuota' : 'Pagar la cuota') + '</button>' +
          '<p class="pago-msg" id="cb-pago-msg" hidden></p>' +
        '</div>';
      engancharPago();
    }

    // Pagos puntuales que le ha puesto el club (camiseta, inscripción…).
    await pintarPagos();

    // Sus PRÓXIMOS entrenamientos (con día y hora reales), no solo el horario semanal.
    var caja = $('cb-horarios');
    if (!h.data.length) {
      caja.innerHTML = '<p class="rotulo cb-grupo">Tus entrenamientos</p>' + APOLANA_UI.vacio('Aún no tienes turnos asignados',
        'En cuanto el club te ponga en un grupo del Cubo, verás aquí tus próximos entrenamientos con día y hora.');
    } else {
      var prox = proximosEntrenos(h.data, 6);
      var cab = '<p class="rotulo cb-grupo">Tus próximos entrenamientos</p>';
      caja.innerHTML = cab + (prox.length
        ? '<div class="hor">' + prox.map(function (p) {
            var x = p.h;
            var rango = hhmm(x.hora_inicio) + (x.hora_fin ? '–' + hhmm(x.hora_fin) : '');
            return '<div class="fila">' +
              '<span class="dia">' + esc(diaFecha(p.fecha)) + '</span>' +
              '<span class="det"><span class="hh">' + esc(rango) + '</span>' +
                (x.lugar ? '<span class="lugar">' + esc(x.lugar) + '</span>' : '') +
                (x.nota ? '<span class="lugar">' + esc(x.nota) + '</span>' : '') +
              '</span></div>';
          }).join('') + '</div>'
        : APOLANA_UI.vacio('Sin entrenamientos próximos', 'Tus clases empiezan pronto; aquí verás las fechas en cuanto lleguen.'));
    }

    // Noticias del club, debajo
    var cn = $('cb-noticias');
    cn.innerHTML = n.data.length
      ? n.data.map(noticiaHTML).join('')
      : APOLANA_UI.vacio('Todavía no hay noticias', 'Cuando el club publique algo, aparecerá aquí.');
  }

  // Pagos puntuales que el club le ha puesto (concepto + importe). Se pagan con
  // tarjeta (Stripe). La RLS deja que cada quien vea solo los suyos.
  async function pintarPagos() {
    var caja = $('cb-pagos'); if (!caja) return;
    var r = await sb.from('cubo_cobros')
      .select('id,concepto,importe_cent,stripe_session_id').eq('estado', 'pendiente').order('created_at');
    var lista = (!r.error && r.data) ? r.data : [];
    // Red de seguridad: si alguno ya se pagó (y el webhook no llegó), se
    // confirma contra Stripe y se descarta de la lista.
    var conSesion = lista.filter(function (c) { return c.stripe_session_id; });
    if (conSesion.length) {
      var pagados = {};
      await Promise.all(conSesion.map(function (c) {
        return sb.functions.invoke('cubo-cobro-confirmar', { body: { cobro_id: c.id } })
          .then(function (rr) { if (rr && rr.data && rr.data.pagado) pagados[c.id] = true; })
          .catch(function () {});
      }));
      lista = lista.filter(function (c) { return !pagados[c.id]; });
    }
    if (!lista.length) { caja.innerHTML = ''; return; }
    caja.innerHTML = lista.map(function (c) {
      var eur = (Number(c.importe_cent) / 100).toFixed(2).replace('.', ',');
      return '<div class="cb-pend">' +
        '<div class="tx"><b>Pago pendiente</b><span>' + esc(c.concepto) + ' · ' + esc(eur) + ' €</span></div>' +
        '<button type="button" class="btn activo" data-pagar-cobro="' + esc(c.id) + '">Pagar ' + esc(eur) + ' €</button>' +
      '</div>';
    }).join('');
    caja.querySelectorAll('[data-pagar-cobro]').forEach(function (b) {
      b.addEventListener('click', function () { pagarCobro(b.getAttribute('data-pagar-cobro'), b); });
    });
  }
  async function pagarCobro(cobroId, btn) {
    var txt = btn.textContent; btn.disabled = true; btn.textContent = 'Abriendo el pago…';
    var vuelta = function (t) { btn.disabled = false; btn.textContent = txt; if (t) alert(t); };
    try {
      var r = await sb.functions.invoke('cubo-cobro-pagar', { body: { cobro_id: cobroId } });
      if (r.error) {
        var d = null; try { if (r.error.context && r.error.context.json) d = await r.error.context.json(); } catch (e) {}
        // Ya estaba pagado (p. ej. pagó y volvió a pulsar): se avisa y se
        // refresca la lista para que ese pago desaparezca. NO se cobra otra vez.
        if (d && d.error === 'ya_pagado') { btn.disabled = false; btn.textContent = txt; alert(d.mensaje || 'Este pago ya está cobrado.'); pintarPagos(); return; }
        return vuelta((d && d.mensaje) || 'No hemos podido abrir el pago. Inténtalo en un minuto.');
      }
      if (!r.data || !r.data.url) return vuelta('No hemos podido abrir el pago. Inténtalo de nuevo.');
      window.location.href = r.data.url; // a la pasarela de Stripe
    } catch (e) { vuelta('No hemos podido conectar con la pasarela. Inténtalo en un minuto.'); }
  }

  // ¿Está abierto el cobro con tarjeta? (interruptor del club, tabla cubo_config)
  var _cfg = null;
  async function cobroAbierto() {
    if (_cfg) return _cfg.abierto;
    var r = await sb.from('cubo_config').select('cobro_abierto').eq('id', 1).maybeSingle();
    _cfg = { abierto: !!(r.data && r.data.cobro_abierto) };
    return _cfg.abierto;
  }

  // Su propia alta del Cubo (la RLS deja que cada quien vea la suya).
  var _cuota = null;
  async function cuota() {
    if (_cuota) return _cuota;
    var r = await sb.from('cubo_altas')
      .select('id,precio_mes,primer_pago_cent,suscripcion_estado,proximo_cobro,ultimo_cobro,baja_solicitada,lista_espera,cobro_abierto')
      .eq('perfil_id', perfil.id)
      .order('created_at', { ascending: false })
      .limit(1);
    _cuota = { error: r.error ? r.error.message : '', alta: (r.data && r.data[0]) || null };
    return _cuota;
  }

  function bloqueCuota(alta, abierto) {
    if (!alta) {
      return '<div class="cuota"><h2>Tu cuota mensual</h2>' +
        '<p>Aún no vemos tu alta en El Cubo. Si acabas de apuntarte, dale un momento y recarga; ' +
        'si no, habla con el club.</p></div>';
    }
    var precio = alta.precio_mes;
    var estado = alta.suscripcion_estado;

    // En lista de espera: aún no hay cuota que pagar.
    if (alta.lista_espera && estado !== 'activa') {
      return '<div class="cuota"><h2>Tu cuota mensual</h2>' +
        '<p><b>Estás en lista de espera.</b> Tu grupo está completo ahora mismo. En cuanto haya un ' +
        'sitio te avisamos y podrás activar tu cuota (' + esc(precio) + ' € al mes). De momento no ' +
        'tienes que hacer nada.</p></div>';
    }

    // Cobro aún no abierto: se informa de la cuota pero sin botón de pago.
    if (!abierto && estado !== 'activa') {
      return '<div class="cuota"><h2>Tu cuota mensual</h2>' +
        '<p>Tu cuota será de <b>' + esc(precio) + ' € al mes</b>. ' +
        'El pago con tarjeta se <b>abrirá muy pronto</b>; te avisaremos cuando puedas activarlo. ' +
        'No tienes que hacer nada todavía.</p></div>';
    }

    if (estado === 'activa') {
      var prox = alta.proximo_cobro ? fechaLarga(alta.proximo_cobro) : '';
      // Último pago: solo si es un cobro real (a partir del 21 sep); el de la
      // puesta en marcha es de 0 € y no cuenta como pago hecho.
      var ini = '2026-09-21';
      var ult = (alta.ultimo_cobro && String(alta.ultimo_cobro).slice(0, 10) >= ini)
        ? fechaLarga(alta.ultimo_cobro) : '';
      var baja = alta.baja_solicitada
        ? '<p class="fina">Has pedido la baja. El club la tramitará y dejará de cobrarte. Si fue un error, escríbenos.</p>'
        : '<p class="fina">¿Cambiar de tarjeta? Escríbenos. ¿Quieres darte de baja? ' +
          '<button type="button" class="enlace" id="cb-baja">Solicitar la baja</button></p>' +
          '<p class="pago-msg" id="cb-baja-msg" hidden></p>';
      return '<div class="cuota"><h2>Tu cuota mensual</h2>' +
        '<p><b>Cuota activa.</b> ' + esc(precio) + ' € al mes. ' +
          'Se cobra sola con tu tarjeta; no tienes que hacer nada.</p>' +
        '<div class="pagos">' +
          '<div class="pago"><span>Próximo pago</span><b>' + (prox ? esc(prox) : 'Por confirmar') + '</b></div>' +
          (ult ? '<div class="pago"><span>Último pago</span><b>' + esc(ult) + '</b></div>' : '') +
        '</div>' + baja +
      '</div>';
    }

    var primerEur = (alta.primer_pago_cent > 0)
      ? (Number(alta.primer_pago_cent) / 100).toFixed(2).replace('.', ',') : '';
    var texto = estado === 'impago'
      ? '<p>Tu último recibo no se ha podido cobrar. Vuelve a activar la cuota con una tarjeta al día.</p>'
      : '<p>Al activar harás tu <b>primer pago' + (primerEur ? ' de ' + esc(primerEur) + ' €' : '') +
        '</b> y tu tarjeta queda guardada. A partir del <b>día 5 de cada mes</b> se cobra sola tu cuota de <b>' +
        esc(precio) + ' € al mes</b>; no tendrás que hacer nada.</p>';
    return '<div class="cuota"><h2>Tu cuota mensual</h2>' + texto +
      '<button type="button" class="btn activo" id="cb-pagar">' +
        (estado === 'impago' ? 'Reactivar la cuota' : 'Pagar la cuota') + '</button>' +
      '<p class="pago-msg" id="cb-pago-msg" hidden></p>' +
      '<p class="fina">La tarjeta se teclea en la página segura de Stripe; el club no la ve.</p>' +
    '</div>';
  }

  function engancharPago() {
    var bp = $('cb-pagar');
    if (!bp) return;
    bp.addEventListener('click', function () {
      var txt = bp.textContent;
      bp.disabled = true;
      bp.textContent = 'Abriendo el pago…';
      var msg = $('cb-pago-msg');
      var fallo = function (t) {
        bp.disabled = false; bp.textContent = txt;
        if (msg) { msg.hidden = false; msg.textContent = t; }
      };
      sb.functions.invoke('cubo-pagar', { body: {} }).then(function (r) {
        if (r.error) {
          var ctx = r.error.context;
          return (ctx && ctx.json ? ctx.json() : Promise.resolve(null))
            .catch(function () { return null; })
            .then(function (d) { fallo((d && d.mensaje) || 'No hemos podido abrir el pago. Inténtalo en un minuto.'); });
        }
        if (!r.data || !r.data.url) { fallo('No hemos podido abrir el pago. Inténtalo de nuevo.'); return; }
        window.location.href = r.data.url; // a la pasarela de Stripe
      }).catch(function (e) {
        fallo('No hemos podido conectar con la pasarela. Inténtalo en un minuto.');
        console.warn('[Apolana] cubo-pagar:', e && e.message ? e.message : e);
      });
    });
  }

  // Solicitar la baja (opción B): el padre la pide, el club la tramita.
  function engancharBaja() {
    var b = $('cb-baja');
    if (!b) return;
    b.addEventListener('click', function () {
      if (!confirm('¿Seguro que quieres solicitar la baja de tu cuota? El club la tramitará y dejará de cobrarte.')) return;
      var msg = $('cb-baja-msg');
      b.disabled = true; b.textContent = 'Enviando…';
      sb.rpc('cubo_baja_solicitar').then(function (r) {
        if (r.error || (r.data && r.data.ok === false)) {
          b.disabled = false; b.textContent = 'Solicitar la baja';
          if (msg) { msg.hidden = false; msg.textContent = 'No se ha podido. Vuelve a intentarlo o escríbenos.'; }
          return;
        }
        _cuota = null; pintarMas();
      }).catch(function () {
        b.disabled = false; b.textContent = 'Solicitar la baja';
        if (msg) { msg.hidden = false; msg.textContent = 'No se ha podido conectar. Inténtalo de nuevo.'; }
      });
    });
  }

  // CALENDARIO SEMANAL · por defecto, TUS clases del Cubo (tus grupos). Con los
  // chips de arriba sumas otras secciones (Running, Competición, Escuela) y sus
  // sesiones aparecen en los mismos días. Solo secciones con horario estructurado
  // (grupo_horarios: día + hora). Natación/montaña no lo tienen → van como enlaces
  // en «Otras actividades del club», debajo.
  var SEC_ETI = { cubo:'El Cubo', running:'Running', competicion:'Competición', escuela:'Escuela' };
  var CAL_MIAS = { k: 'cubo', t: 'Mis actividades' };           // lo tuyo (tus clases del Cubo)
  var CAL_OTRAS = [                                             // otras secciones del club, para asomarse
    { k: 'running',     t: 'Running' },
    { k: 'competicion', t: 'Competición' },
    { k: 'escuela',     t: 'Escuela' }
  ];
  var CAL_TODAS = [CAL_MIAS].concat(CAL_OTRAS);
  var calOffset = 0;                                   // semana visible (0 = esta semana)
  var calSecs = { cubo:true, running:false, competicion:false, escuela:false };

  // Sesiones de TODOS los grupos de una sección (para «asomarse»). Cacheado.
  var _secHoras = {};
  async function seccionHoras(k) {
    if (_secHoras[k]) return _secHoras[k];
    var rg = await sb.from('grupos').select('id,nombre').eq('seccion', k);
    var nombres = {}, ids = [];
    ((rg && rg.data) || []).forEach(function (g) { nombres[g.id] = g.nombre; ids.push(g.id); });
    if (!ids.length) { _secHoras[k] = []; return _secHoras[k]; }
    var r = await sb.from('grupo_horarios')
      .select('grupo_id,dia_semana,hora_inicio,hora_fin,lugar,nota')
      .in('grupo_id', ids).eq('activo', true);
    _secHoras[k] = ((r && !r.error && r.data) ? r.data : []).map(function (x) {
      return { seccion:k, grupo:nombres[x.grupo_id] || '', dia_semana:x.dia_semana,
               hora_inicio:x.hora_inicio, hora_fin:x.hora_fin, lugar:x.lugar, nota:x.nota, mine:false };
    });
    return _secHoras[k];
  }
  // TUS sesiones del Cubo (tus grupos), en la misma forma.
  async function misHorasCubo() {
    var h = await horarios();
    return (h.data || []).map(function (x) {
      return { seccion:'cubo', grupo:x._grupo || '', dia_semana:x.dia_semana,
               hora_inicio:x.hora_inicio, hora_fin:x.hora_fin, lugar:x.lugar, nota:x.nota,
               _gratis:x._gratis, mine:true };
    });
  }

  function lunesDe(offset) {                            // lunes 00:00 de la semana `offset`
    var d = new Date(); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7);
    return d;
  }
  function fechaISO(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  // Secciones que se enseñan unificadas (sin listar los grupos uno a uno). En la
  // escuela hay muchos grupos (Azul 1, Rojo 2…) a la misma hora: para el que se
  // asoma desde el Cubo basta con «Entrenamiento de la escuela» en cada franja.
  var SEC_GENERICO = { escuela: 'Entrenamiento de la escuela' };
  function sesionHTML(s) {
    var rango = hhmm(s.hora_inicio) + (s.hora_fin ? '–' + hhmm(s.hora_fin) : '');
    var eti = SEC_ETI[s.seccion] || '';
    var generico = SEC_GENERICO[s.seccion];
    var lugar = s.lugar || '';
    // En la escuela algún lugar trae una nota colada («Viernes 17:30-19:00 · …»):
    // nos quedamos con la sede real (lo que hay tras el último «·»).
    if (generico && lugar.indexOf('·') !== -1) lugar = lugar.split('·').pop().trim();
    var pie = (generico ? [lugar] : [eti, lugar, s.nota]).filter(Boolean).join(' · ');
    return '<div class="cal-ses sec-' + s.seccion + (s.mine ? ' mia' : '') + '">' +
      '<span class="hh">' + esc(rango) + '</span>' +
      '<span class="tx"><b>' + esc(generico || s.grupo || eti) + '</b>' +
        (pie ? '<small>' + esc(pie) + '</small>' : '') +
      '</span></div>';
  }
  function navHTML(lunes) {
    var dom = new Date(lunes); dom.setDate(dom.getDate() + 6);
    var rango = (lunes.getMonth() === dom.getMonth())
      ? lunes.getDate() + '–' + dom.getDate() + ' ' + MESES[lunes.getMonth()]
      : lunes.getDate() + ' ' + MESES[lunes.getMonth()].slice(0, 3) + ' – ' + dom.getDate() + ' ' + MESES[dom.getMonth()].slice(0, 3);
    return '<button type="button" class="cal-fl" data-nav="-1" aria-label="Semana anterior">‹</button>' +
      '<span class="cal-rango">' + (calOffset === 0 ? 'Esta semana' : esc(rango)) +
        (calOffset === 0 ? '<small>' + esc(rango) + '</small>' : '') + '</span>' +
      '<button type="button" class="cal-fl" data-nav="1" aria-label="Semana siguiente">›</button>';
  }

  async function pintarCalendario() {
    $('cb').innerHTML =
      '<h1 class="saludo">Calendario</h1>' +
      '<p class="sub">Tu semana en el club. Toca una sección para sumarla.</p>' +
      '<div id="cb-chips"></div>' +
      '<div class="cal-nav" id="cb-nav"></div>' +
      '<div id="cb-cal"><div class="ap-esq" data-esq="filas:4"></div></div>' +
      '<p class="rotulo rotulo--sep">Otras actividades del club</p>' +
      otrasHTML();
    pintarChips();
    await pintarSemana();
  }

  function chipHTML(c, extra) {
    var on = !!calSecs[c.k];
    return '<button type="button" class="cal-chip sec-' + c.k + (extra ? ' ' + extra : '') + (on ? ' on' : '') +
      '" data-sec="' + c.k + '" aria-pressed="' + on + '">' + esc(c.t) + '</button>';
  }
  function pintarChips() {
    $('cb-chips').innerHTML =
      '<div class="cal-chips">' + chipHTML(CAL_MIAS, 'cal-chip--mia') + '</div>' +
      '<p class="cal-otras-eti">Otras actividades del club <span>· míralas aunque no sean tuyas</span></p>' +
      '<div class="cal-chips">' + CAL_OTRAS.map(function (c) { return chipHTML(c); }).join('') + '</div>';
    Array.prototype.forEach.call($('cb-chips').querySelectorAll('.cal-chip'), function (btn) {
      btn.addEventListener('click', function () {
        var k = btn.getAttribute('data-sec');
        calSecs[k] = !calSecs[k];
        pintarChips();
        pintarSemana();
      });
    });
  }

  async function pintarSemana() {
    var caja = $('cb-cal');
    var activas = CAL_TODAS.filter(function (c) { return calSecs[c.k]; }).map(function (c) { return c.k; });
    var listas = await Promise.all(activas.map(function (k) {
      return k === 'cubo' ? misHorasCubo() : seccionHoras(k);
    }));
    var sesiones = [].concat.apply([], listas);

    var lunes = lunesDe(calOffset);
    var inicioGratis = new Date(2026, 9, 2);
    var dias = [];
    for (var i = 0; i < 7; i++) { var f = new Date(lunes); f.setDate(f.getDate() + i); dias.push({ fecha: f, ses: [] }); }
    sesiones.forEach(function (s) {
      var idx = (+s.dia_semana || 1) - 1; if (idx < 0 || idx > 6) return;
      if (s._gratis && dias[idx].fecha < inicioGratis) return;   // la prueba gratis no empieza hasta el 2-oct
      dias[idx].ses.push(s);
    });
    // En cada día, une los grupos que comparten sección+hora+lugar (p. ej. varios
    // grupos de escuela a la misma hora, en una sola línea).
    dias.forEach(function (d) {
      var porFirma = {}, orden = [];
      d.ses.forEach(function (s) {
        var firma = s.seccion + '|' + s.hora_inicio + '|' + s.hora_fin + '|' + (s.lugar || '');
        if (!porFirma[firma]) { porFirma[firma] = { seccion:s.seccion, hora_inicio:s.hora_inicio, hora_fin:s.hora_fin, lugar:s.lugar, nota:s.nota, mine:s.mine, grupos:[] }; orden.push(firma); }
        var g = porFirma[firma];
        if (s.grupo && g.grupos.indexOf(s.grupo) === -1) g.grupos.push(s.grupo);
        if (s.mine) g.mine = true;
      });
      d.filas = orden.map(function (f) { var g = porFirma[f]; g.grupo = g.grupos.join(', '); return g; })
        .sort(function (a, b) { return String(a.hora_inicio || '').localeCompare(String(b.hora_inicio || '')); });
    });

    $('cb-nav').innerHTML = navHTML(lunes);
    Array.prototype.forEach.call($('cb-nav').querySelectorAll('.cal-fl'), function (btn) {
      btn.addEventListener('click', function () { calOffset += (+btn.getAttribute('data-nav')); pintarSemana(); });
    });

    if (!activas.length) {
      caja.innerHTML = APOLANA_UI.vacio('No hay nada seleccionado', 'Toca «Mis actividades» u otra sección de arriba para ver sus entrenamientos de la semana.');
      return;
    }
    var hoyISO = fechaISO(new Date());
    caja.innerHTML = '<div class="cal-semana">' + dias.map(function (d, i) {
      var hoy = fechaISO(d.fecha) === hoyISO;
      return '<div class="cal-dia' + (hoy ? ' hoy' : '') + (d.filas.length ? '' : ' vacio') + '">' +
        '<h3>' + esc(DIAS[i]) + ' <span>' + d.fecha.getDate() + '</span></h3>' +
        (d.filas.length ? d.filas.map(sesionHTML).join('') : '<p class="cal-nada">—</p>') +
      '</div>';
    }).join('') + '</div>';
  }

  async function pintarMas() {
    $('cb').innerHTML = '<h1 class="saludo">Más</h1>' +
      '<div id="cb-cuota"><div class="ap-esq" data-esq="filas:2"></div></div>' +
      '<p class="rotulo">El club</p>' +
      '<a class="fila-mas" href="' + b + 'tienda/"><span><b>Tienda del club</b>' +
        '<small>Equipación y ropa oficial.</small></span></a>' +
      '<a class="fila-mas" href="' + b + 'contacto/"><span><b>Contactar con el club</b>' +
        '<small>Escríbenos cualquier duda.</small></span></a>' +
      '<p class="rotulo">Tu cuenta</p>' +
      '<a class="fila-mas" href="' + b + 'portal/perfil/"><span><b>Mi perfil</b>' +
        '<small>Tu nombre, tus datos y tu contraseña.</small></span></a>' +
      '<button type="button" class="fila-mas" id="cb-salir"><span><b>Cerrar sesión</b>' +
        '<small>Salir de tu cuenta en este dispositivo.</small></span></button>';
    var s = $('cb-salir');
    if (s) s.addEventListener('click', function () {
      try { sb.auth.signOut().then(function () { location.href = b; }); } catch (e) { location.href = b; }
    });
    var res = await Promise.all([cuota(), cobroAbierto()]);
    $('cb-cuota').innerHTML = bloqueCuota(res[0].alta, res[1]);
    engancharPago();
    engancharBaja();
  }

  function pintar() {
    var h = (location.hash || '').replace('#', '');
    if (h === 'calendario') return pintarCalendario();
    if (h === 'mas') return pintarMas();
    return pintarInicio();
  }

  window.addEventListener('hashchange', pintar);
  pintar();
});
</script>

</body>
