<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Cubo · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<link rel="stylesheet" href="../../assets/css/panel-piezas.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/panel-piezas.js" defer></script>
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); }
  .cb-wrap { max-width:680px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 40px; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(24px,5.5vw,34px); line-height:1.02; color:var(--navy,#26374B); margin:4px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 4px; }
  .rotulo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:14px;
            color:var(--navy,#26374B); margin:22px 0 10px; }

  /* Noticias */
  .noti { display:block; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px;
          box-shadow:var(--s1); overflow:hidden; margin-bottom:14px; text-decoration:none; color:inherit; }
  .noti img { display:block; width:100%; height:150px; object-fit:cover; background:var(--crema-media,#F1EADC); }
  .noti .tx { padding:13px 16px 15px; }
  .noti .cat { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#8A5307; }
  .noti h2 { font-family:var(--ap-titulo); font-weight:700; font-size:18px; line-height:1.2; color:var(--navy,#26374B); margin:3px 0 5px; }
  .noti p { font-size:14px; line-height:1.5; color:var(--texto-suave,#6E6656); margin:0; }
  .noti .fecha { font-size:12.5px; color:var(--texto-tenue,#9A927F); margin-top:7px; }

  /* Horarios */
  .hor { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); overflow:hidden; }
  .hor .fila { display:flex; align-items:baseline; gap:12px; padding:14px 16px; border-top:1px solid var(--linea,#EDE6D7); }
  .hor .fila:first-child { border-top:0; }
  .hor .dia { flex:0 0 92px; font-weight:600; color:var(--navy,#26374B); font-size:15px; }
  .hor .det { flex:1; min-width:0; }
  .hor .hh { font-family:var(--dato); font-size:15px; color:var(--navy,#26374B); }
  .hor .lugar { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }

  /* Más */
  .fila-mas { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
              background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
              padding:15px 16px; margin-bottom:11px; font:inherit; color:var(--navy,#26374B); cursor:pointer; text-decoration:none; }
  .fila-mas b { display:block; font-size:15.5px; font-weight:600; }
  .fila-mas small { display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:2px; }
  .cuota { background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--s1); padding:16px 18px; margin-bottom:14px; }
  .cuota h2 { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; font-size:15px; color:var(--navy,#26374B); margin:0 0 6px; }
  .cuota p { font-size:14px; line-height:1.5; color:var(--texto-suave,#6E6656); margin:0 0 12px; }
  .cuota .btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 18px;
                border-radius:999px; border:1px solid var(--linea-borde,#C9C0AE); background:var(--crema-media,#F1EADC);
                color:var(--texto-suave,#6E6656); font:inherit; font-size:15px; font-weight:600; cursor:not-allowed; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="cb-wrap" id="cb"></div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  };
  var b = (window.APOLANA_BASE || '../../');
  var DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function hhmm(h) { return h ? String(h).slice(0,5) : ''; }
  function fechaLarga(iso) {
    if (!iso) return '';
    var p = String(iso).slice(0,10).split('-');
    return (+p[2]) + ' de ' + MESES[(+p[1])-1] + ' de ' + p[0];
  }
  var nombre = (perfil && perfil.nombre) ? String(perfil.nombre).split(' ')[0] : '';

  // --------------------------------------------------------
  //  DATOS (se cargan una vez y se cachean)
  // --------------------------------------------------------
  var _noticias = null, _horarios = null;

  async function noticias() {
    if (_noticias) return _noticias;
    var r = await sb.from('noticias')
      .select('id,titulo,excerpt,categoria,foto_portada,fecha_publicacion')
      .eq('publicada', true)
      .order('fecha_publicacion', { ascending: false })
      .limit(20);
    _noticias = r.error ? { error: r.error.message, data: [] } : { error: '', data: r.data || [] };
    return _noticias;
  }

  async function horarios() {
    if (_horarios) return _horarios;
    var gid = null;
    try {
      var m = await APOLANA_PORTAL.misAtletas(perfil.id);
      var ficha = (m && m.data || []).filter(function (a) { return a && a.grupo_id; })[0];
      gid = ficha ? ficha.grupo_id : null;
    } catch (e) {}
    if (!gid) { _horarios = { data: [] }; return _horarios; }
    var r = await sb.from('grupo_horarios')
      .select('dia_semana,hora_inicio,hora_fin,lugar,nota')
      .eq('grupo_id', gid).eq('activo', true)
      .order('dia_semana').order('hora_inicio');
    _horarios = r.error ? { error: r.error.message, data: [] } : { data: r.data || [] };
    return _horarios;
  }

  // --------------------------------------------------------
  //  VISTAS
  // --------------------------------------------------------
  async function pintarInicio() {
    $('cb').innerHTML = '<h1 class="saludo">Hola' + (nombre ? ', ' + esc(nombre) : '') + '</h1>' +
      '<p class="sub">Las noticias del club</p>' +
      '<div id="cb-lista"><div class="ap-esq" data-esq="filas:3"></div></div>';
    var n = await noticias();
    var caja = $('cb-lista');
    if (!n.data.length) {
      caja.innerHTML = APOLANA_UI.vacio('Todavía no hay noticias',
        'Cuando el club publique algo, aparecerá aquí.');
      return;
    }
    caja.innerHTML = n.data.map(function (x) {
      return '<a class="noti" href="' + b + 'noticias/">' +
        (x.foto_portada ? '<img src="' + esc(x.foto_portada) + '" alt="" loading="lazy">' : '') +
        '<div class="tx">' +
          (x.categoria ? '<span class="cat">' + esc(x.categoria) + '</span>' : '') +
          '<h2>' + esc(x.titulo) + '</h2>' +
          (x.excerpt ? '<p>' + esc(x.excerpt) + '</p>' : '') +
          '<div class="fecha">' + esc(fechaLarga(x.fecha_publicacion)) + '</div>' +
        '</div></a>';
    }).join('');
  }

  async function pintarEntrenamientos() {
    $('cb').innerHTML = '<h1 class="saludo">Entrenamientos</h1>' +
      '<p class="sub">Tus días y horarios en El Cubo</p>' +
      '<div id="cb-lista"><div class="ap-esq" data-esq="filas:3"></div></div>';
    var h = await horarios();
    var caja = $('cb-lista');
    if (!h.data.length) {
      caja.innerHTML = APOLANA_UI.vacio('Aún no tienes horarios asignados',
        'En cuanto el club te ponga en un grupo del Cubo, verás aquí tus días y horas de entrenamiento.');
      return;
    }
    caja.innerHTML = '<div class="hor">' + h.data.map(function (x) {
      var rango = hhmm(x.hora_inicio) + (x.hora_fin ? '–' + hhmm(x.hora_fin) : '');
      return '<div class="fila">' +
        '<span class="dia">' + esc(DIAS[(x.dia_semana || 1) - 1] || '') + '</span>' +
        '<span class="det"><span class="hh">' + esc(rango) + '</span>' +
          (x.lugar ? '<span class="lugar">' + esc(x.lugar) + '</span>' : '') +
          (x.nota ? '<span class="lugar">' + esc(x.nota) + '</span>' : '') +
        '</span></div>';
    }).join('') + '</div>';
  }

  function pintarMas() {
    $('cb').innerHTML = '<h1 class="saludo">Más</h1>' +
      '<div class="cuota">' +
        '<h2>Tu cuota mensual</h2>' +
        '<p>El pago de la cuota con tarjeta (y su renovación automática cada mes) se activará muy pronto. ' +
           'De momento, para cualquier duda con el pago habla con el club.</p>' +
        '<span class="btn" aria-disabled="true">Pagar la cuota · próximamente</span>' +
      '</div>' +
      '<p class="rotulo">Tu cuenta</p>' +
      '<a class="fila-mas" href="' + b + 'portal/perfil/"><span><b>Mi perfil</b>' +
        '<small>Tu nombre, tus datos y tu contraseña.</small></span></a>' +
      '<button type="button" class="fila-mas" id="cb-salir"><span><b>Cerrar sesión</b>' +
        '<small>Salir de tu cuenta en este dispositivo.</small></span></button>';
    var s = $('cb-salir');
    if (s) s.addEventListener('click', function () {
      try { sb.auth.signOut().then(function () { location.href = b; }); } catch (e) { location.href = b; }
    });
  }

  function pintar() {
    var h = (location.hash || '').replace('#', '');
    if (h === 'entrenamientos') return pintarEntrenamientos();
    if (h === 'mas') return pintarMas();
    return pintarInicio();
  }

  window.addEventListener('hashchange', pintar);
  pintar();
});
</script>

</body>
</html>
