<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>
  window.APOLANA_BASE="../../";
  /* Sin home:true — este Resumen lo pintamos nosotros (lleva datos en vivo). */
  window.APOLANA_MUNDO = { world:"general", screen:"resumen", contentSel:"#g" };
</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<script src="../../assets/js/mundos.js" defer></script>
<style>
  :root{ --mm-acento:#2E4256; }
  body{ background:var(--crema,#FBF9F4); }
  #g{ max-width:900px; margin:0 auto; padding:clamp(16px,4vw,26px) clamp(14px,4vw,24px) 40px; }
  .g-msg{ color:var(--texto-suave,#6E6656); text-align:center; padding:26px 10px; }

  .g-pend{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr)); gap:12px; margin-bottom:26px; }
  .g-card{ display:flex; flex-direction:column; gap:2px; text-decoration:none; background:#fff; border-radius:14px;
    box-shadow:var(--sombra-suave,0 10px 22px -16px rgba(46,66,86,.5)); padding:15px 16px; border-left:4px solid var(--linea-marcada,#E4DCCB); color:inherit;
    transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s; }
  .g-card:hover{ transform:translateY(-3px); box-shadow:0 12px 22px -12px rgba(30,45,65,.22); }
  .g-card b{ font-family:var(--fuente-titulo); font-weight:700; font-size:30px; color:var(--navy,#2E4256); line-height:1; }
  .g-card span{ font-size:13px; color:var(--texto-suave,#6E6656); margin-top:3px; line-height:1.3; }
  .g-card .fl{ font-style:normal; font-size:12.5px; color:var(--azul-oscuro,#2F6FA8); margin-top:9px; font-weight:600; }
  .g-card.hay{ border-left-color:#B96F09; background:#FDF6E9; }
  .g-card.hay b{ color:#8A5307; }
  .g-card.hay .fl{ color:#8A5307; }
  .g-nada{ font-size:14px; color:var(--texto-suave,#6E6656); background:#fff; border-radius:14px; box-shadow:var(--sombra-suave,0 10px 22px -16px rgba(46,66,86,.5)); padding:16px 18px; margin-bottom:26px; }

  /* KPIs del club (un vistazo, como la home de antes) */
  .g-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin:0 0 26px; }
  .g-kpi{ background:#fff; border:1px solid var(--linea,#EDE6D7); border-radius:14px; box-shadow:var(--sombra-suave,0 10px 22px -16px rgba(46,66,86,.5)); padding:15px 16px; }
  .g-kpi b{ display:block; font-family:var(--fuente-titulo); font-weight:700; font-size:30px; line-height:1; color:var(--navy,#2E4256); }
  .g-kpi span{ display:block; font-size:13px; color:var(--texto-suave,#6E6656); margin-top:4px; line-height:1.3; }
  .g-kpi small{ color:#4E8A3E; font-weight:600; }
</style>
</head>
<body>
  <div id="g"><p class="g-msg">Cargando…</p></div>
<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('g');
  var B = window.APOLANA_BASE || '../../';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Recuentos del día a día (admin/staff). Si no hay permiso, vuelve {}.
  var counts = {};
  try { var r = await sb.rpc('general_resumen'); if (r && !r.error && r.data) counts = r.data; } catch (e) {}

  // --- KPIs del club (mismos criterios que la home de antes) ---
  var hoy = new Date();
  var hoyIso = hoy.getFullYear() + '-' + ('0'+(hoy.getMonth()+1)).slice(-2) + '-' + ('0'+hoy.getDate()).slice(-2);
  var anoTemp = (hoy.getMonth()+1) >= 7 ? hoy.getFullYear() : hoy.getFullYear()-1;   // la temporada arranca el 1-jul
  var temporadaIso = anoTemp + '-07-01';
  var kpi = { cuotas:'—', compes:'—' };
  // Recuento por SECCIÓN (cada una con su fuente real, RPC gated por admin).
  // Antes era «357 socios activos +357» — falso: contaba todos los atletas.
  var sec = {};
  try { var rs = await sb.rpc('general_secciones'); if (rs && !rs.error && rs.data) sec = rs.data; } catch (e) {}
  try { var rc = await sb.from('competiciones').select('id', { count:'exact', head:true }).gte('fecha_inicio', hoyIso); if (rc && !rc.error) kpi.compes = rc.count || 0; } catch (e) {}
  try {
    var rp = await sb.from('pagos').select('estado,fecha_vencimiento').in('estado', ['pendiente','impagado']);
    if (rp && !rp.error && rp.data) {
      kpi.cuotas = rp.data.filter(function(p){ return p.estado === 'impagado' || (p.estado === 'pendiente' && p.fecha_vencimiento && p.fecha_vencimiento < hoyIso); }).length;
    }
  } catch (e) {}
  // Cada tarjeta lleva el color de su mundo, para que no sea monocromo.
  function kcard(n, etq, color){
    return '<div class="g-kpi"'+(color?' style="border-top:3px solid '+color+'"':'')+'><b>'+esc(n==null?'—':n)+'</b><span>'+etq+'</span></div>';
  }
  var kpiHTML =
    '<div class="g-kpis">'+
      kcard(sec.socios,           'Socios',                   '#2E4256')+
      kcard(sec.familias,         'Familias',                 '#7A5CA8')+
      kcard(sec.escuela_natacion, 'Escuela de natación',      '#3B85C0')+
      kcard(sec.natacion_master,  'Natación máster',          '#2E8C86')+
      kcard(sec.cubo,             'El Cubo',                  '#C36A4E')+
      kcard(sec.atletismo,        'Atletismo pista/escuela',  '#B0563A')+
      kcard(kpi.cuotas,           'Cuotas pendientes',        '#B96F09')+
      kcard(kpi.compes,           'Competiciones próximas',   '#3E8E5A')+
    '</div>';

  var ITEMS = [
    { k:'altas_socio',   t:'Altas de socio por revisar',    url:'admin/altas/?tipo=socio' },
    { k:'altas_escuela', t:'Altas de escuela por revisar',  url:'admin/altas/?tipo=escuela' },
    { k:'cubo_altas',    t:'Altas del Cubo por revisar',    url:'admin/cubo-altas/' },
    { k:'solicitudes',   t:'Solicitudes de inscripción',    url:'admin/buzon/' },
    { k:'buzon',         t:'Mensajes del buzón sin atender', url:'admin/buzon/' },
    { k:'liga_validar',  t:'Puntos de liga por validar',    url:'admin/liga/' },
    { k:'cubo_prueba',   t:'Apuntados a la prueba del Cubo', url:'admin/cubo-prueba/' }
  ].map(function(it){ it.n = parseInt(counts[it.k],10) || 0; return it; });
  ITEMS.sort(function(a,b){ return b.n - a.n; });   // lo que hay, primero
  var hayAlgo = ITEMS.some(function(it){ return it.n > 0; });

  var cards = ITEMS.map(function(it){
    return '<a class="g-card'+(it.n>0?' hay':'')+'" href="'+esc(B+it.url)+'">'+
      '<b>'+it.n+'</b><span>'+esc(it.t)+'</span><i class="fl">Ver →</i></a>';
  }).join('');

  var shell = window.APOLANA_MUNDOS_SHELL;
  wrap.innerHTML =
    '<div class="mh-cab"><div class="mh-eyebrow">Mundo</div>'+
      '<h1><span class="pt-g"></span>General</h1>'+
      '<p>El club por dentro. Aquí ves de un vistazo lo que va llegando y lo que está pendiente de ti.</p></div>'+
    kpiHTML+
    '<p class="mh-rot">Pendiente de ti · lo que llega</p>'+
    (hayAlgo ? '' : '<div class="g-nada">Todo al día: no hay nada pendiente de revisar ahora mismo. Cuando lleguen altas, inscripciones o mensajes, aparecerán aquí.</div>')+
    '<div class="g-pend">'+cards+'</div>'+
    '<p class="mh-rot">Herramientas de este mundo</p>'+
    (shell && shell.hubHTML ? shell.hubHTML('general') : '');
});
</script>
</body>
</html>
