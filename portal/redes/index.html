<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proponer un post · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  body { background: var(--crema-media); }
  .rd-wrap { max-width: 820px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  /* Cabecera de pantalla (kit 30h): migas a 14 px, título a 28 px, sobre crema. */
  .rd-wrap h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:28px; line-height:1.05; color: var(--navy); margin: 0 0 4px; }
  .rd-wrap .sub { font-size:14px; color: var(--texto-suave); }
  .migas { display:inline-flex; align-items:center; min-height:44px; margin-bottom:4px; color: var(--azul-oscuro); font-weight:600; text-decoration:none; font-size:14px; padding:0 2px 0 0; }
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(18px,3vw,26px); margin-top:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 10px; }
  .intro { color: var(--texto-suave); font-size:15px; line-height:1.55; margin:0 0 8px; }

  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:14px 0 5px; }
  select, input[type=text], textarea {
    box-sizing:border-box; width:100%; padding:11px 13px; border:1px solid var(--linea-borde); border-radius:10px;
    font-family: var(--fuente-texto); font-size:15px; background:#fff; color: var(--navy);
  }
  textarea { min-height:120px; resize:vertical; line-height:1.5; }
  select:focus, input[type=text]:focus, textarea:focus { outline:2px solid var(--azul-filete, #3B85C0); border-color: var(--azul-filete, #3B85C0); }
  .oculto { display:none !important; }
  .pista { font-size:13px; color: var(--texto-suave); margin:5px 0 0; }

  .aviso { background:#f4f0e6; border:1px solid var(--linea); border-radius:10px; padding:12px 14px; font-size:13px; color: var(--texto-suave); line-height:1.5; margin-top:14px; }

  input[type=file] { font-size:14px; }
  .minis { display:grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap:12px; margin-top:12px; }
  .mini { position:relative; border:1px solid var(--linea); border-radius:10px; overflow:hidden; background: var(--crema-media); }
  .mini img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .mini .quitar { position:absolute; top:5px; right:5px; width:26px; height:26px; border-radius:999px; border:none; background:rgba(255,255,255,.92); box-shadow:0 1px 4px rgba(0,0,0,.25); font-size:15px; line-height:1; cursor:pointer; color:#b3261e; display:flex; align-items:center; justify-content:center; }
  .mini .peso { position:absolute; left:0; right:0; bottom:0; background:rgba(46,66,86,.78); color:#fff; font-size:13px; padding:2px 4px; text-align:center; }
  .mini .peso.alto { background:rgba(179,38,30,.85); }

  .msg { margin-top:14px; font-size:14px; }
  .msg.error { color:#b3261e; }
  .msg.ok { color:#1e7a3d; }
  .barra { height:10px; background: var(--crema-media); border:1px solid var(--linea); border-radius:999px; overflow:hidden; margin-top:12px; }
  .barra > span { display:block; height:100%; width:0; background: var(--azul); transition: width .2s ease; }

  .peticion { border-bottom:1px solid var(--linea); padding:14px 0; }
  .peticion:last-child { border-bottom:0; }
  .peticion .cab { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .peticion .tit { font-size:16px; font-weight:600; color: var(--navy); }
  .peticion .desc { font-size:14px; color: var(--texto-suave); margin-top:4px; line-height:1.5; white-space:pre-wrap; }
  .peticion .meta { font-size:13px; color: var(--texto-suave); margin-top:6px; }
  .peticion .galeria { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .peticion .galeria img { width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--linea); }
  .estado { font-size:13px; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  /* Verde solo cuando ya está publicado; el resto, sin color de alarma. */
  .estado.pendiente  { background:#f1ece0; color: var(--texto-suave); }
  .estado.en_proceso { background:#fff; border:1px solid var(--linea-borde); color: var(--navy); }
  .estado.publicado  { background:#EDF5EE; color:#3F7A4C; }
  .estado.descartado { background:#F6EBD6; color:#8A5307; }
  .enlace-post { display:inline-flex; align-items:center; min-height:44px; margin-top:2px; font-size:15px; color: var(--azul-oscuro); font-weight:600; }
</style>
</head>
<body>

<div id="portal-contenido">
  <div class="rd-wrap" id="rd-wrap">
    <a class="migas" href="../">← Volver al portal</a>
    <h1>Proponer un post</h1><span class="sub">Ideas para las redes del club</span>
    <div class="tarjeta"><div class="ap-esq" data-esq="tarjeta"></div></div>
  </div>
</div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('rd-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }
  function fecha(ts){ if(!ts) return ''; try { return new Date(ts).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); } catch(e){ return ''; } }
  function mb(b){ return (b/1048576).toFixed(1).replace('.',',') + ' MB'; }

  /* Las fotos de las propuestas viven en su propio cubo PRIVADO: cada
     persona manda sobre su carpeta y el club las ve para revisarlas.
     Como es privado, para enseñarlas se pide un enlace que caduca solo
     (migración 086). Las propuestas de antes tenían las fotos en el
     cubo público «imagenes», dentro de «redes/»: esas se siguen viendo
     por su ruta de siempre. */
  var CUBO    = 'propuestas-redes';
  var FIRMA_S = 3600;
  function esAntigua(ruta){ return /^redes\//.test(String(ruta||'')); }
  async function firmar(rutas){
    var mapa = {}, nuevas = [];
    (rutas || []).forEach(function (r) {
      if (esAntigua(r)) mapa[r] = sb.storage.from('imagenes').getPublicUrl(r).data.publicUrl;
      else if (nuevas.indexOf(r) === -1) nuevas.push(r);
    });
    if (nuevas.length) {
      try {
        var r = await sb.storage.from(CUBO).createSignedUrls(nuevas, FIRMA_S);
        if (!r.error && r.data) r.data.forEach(function (f) { if (f && f.signedUrl) mapa[f.path] = f.signedUrl; });
      } catch (e) { /* sin enlace no se pinta la miniatura; el texto sigue */ }
    }
    return mapa;
  }

  /* Un fallo de permisos no es un fallo de cobertura, y decirle a
     alguien que revise su conexión cuando el problema es otro le hace
     perder la tarde. Aquí se distinguen. */
  function esDePermisos(err){
    if (!err) return false;
    var codigo = String(err.statusCode || err.status || '');
    if (codigo === '401' || codigo === '403') return true;
    var t = String(err.message || '') + ' ' + String(err.error || '');
    return /row-level security|violates|policy|unauthorized|forbidden|not authorized|permission|denied/i.test(t);
  }
  function noExisteElSitio(err){
    return !!err && /bucket not found|not found/i.test(String(err.message || '') + ' ' + String(err.error || ''));
  }

  var SECCIONES = [
    { v:'escuela',          t:'Escuela' },
    { v:'escuela-natacion', t:'Escuela de natación' },
    { v:'competicion',      t:'Competición' },
    { v:'running',          t:'Running' },
    { v:'natacion',         t:'Natación' },
    { v:'triatlon',         t:'Triatlón' },
    { v:'montana',          t:'Montaña' },
    { v:'cubo',             t:'El Cubo' }
  ];
  var ESTADOS = { pendiente:'Pendiente', en_proceso:'En proceso', publicado:'Publicado', descartado:'Descartado' };

  // Perfil de quien entra (para solicitante_id)
  var miId = perfil && perfil.id ? perfil.id : null;

  // Sus fichas de atleta: la suya y las de sus hijos (lo que puede leer)
  var atletas = [];
  if (miId) {
    try {
      var ra = await sb.from('atletas')
        .select('id,nombre,apellidos')
        .or('perfil_id.eq.' + miId + ',perfil_padre_id.eq.' + miId)
        .order('nombre');
      if (!ra.error && ra.data) atletas = ra.data;
    } catch (e) {}
  }

  wrap.innerHTML =
    '<a class="migas" href="../">← Volver al portal</a>' +
    '<h1>Proponer un post</h1><span class="sub">Ideas para las redes del club</span>' +

    '<div class="tarjeta">' +
      '<p class="intro">¿Un atleta, una sección, un evento o un resultado merecen un post en el Instagram del club? Cuéntanoslo y sube las fotos. El club lo revisa y decide si lo publica; no es automático.</p>' +

      '<label for="rd-tipo">¿De qué es el post?</label>' +
      '<select id="rd-tipo">' +
        '<option value="atleta">De un atleta</option>' +
        '<option value="seccion">De una sección</option>' +
        '<option value="evento">De un evento</option>' +
        '<option value="resultado">De un resultado</option>' +
        '<option value="otro">Otro</option>' +
      '</select>' +

      '<div id="rd-campo-atleta"' + (atletas.length ? '' : ' class="oculto"') + '>' +
        '<label for="rd-atleta">¿Qué atleta?</label>' +
        '<select id="rd-atleta">' +
          atletas.map(function(a){ return '<option value="'+esc(a.id)+'">'+esc((a.nombre||'')+' '+(a.apellidos||'')).trim()+'</option>'; }).join('') +
        '</select>' +
        (atletas.length ? '' : '<p class="pista">No tienes fichas de atleta asociadas; puedes describir de quién es en el texto.</p>') +
      '</div>' +

      '<div id="rd-campo-seccion" class="oculto">' +
        '<label for="rd-seccion">¿Qué sección?</label>' +
        '<select id="rd-seccion">' +
          SECCIONES.map(function(s){ return '<option value="'+esc(s.v)+'">'+esc(s.t)+'</option>'; }).join('') +
        '</select>' +
      '</div>' +

      '<label for="rd-titulo">Título</label>' +
      '<input type="text" id="rd-titulo" maxlength="120" placeholder="Un título corto para la propuesta">' +

      '<label for="rd-desc">¿Qué quieres que ponga el post?</label>' +
      '<textarea id="rd-desc" maxlength="3000" placeholder="Escribe el texto que te gustaría que apareciera, con los datos importantes (nombres, marcas, fechas, lugar…)."></textarea>' +

      '<label for="rd-fotos">Fotos</label>' +
      '<input type="file" id="rd-fotos" accept="image/*" multiple>' +
      '<p class="pista">Puedes elegir varias. Se ven aquí antes de enviarlas y puedes quitar las que no quieras.</p>' +
      '<div class="minis" id="rd-minis"></div>' +

      '<div class="aviso">Sube solo fotos con permiso de las personas que salen (derecho a la propia imagen). El club puede decidir no publicarlas.</div>' +

      '<div style="margin-top:18px"><button class="btn btn--primario" id="rd-enviar" type="button">Enviar propuesta</button></div>' +
      '<div class="barra oculto" id="rd-barra"><span id="rd-barra-int"></span></div>' +
      '<div class="msg" id="rd-msg"></div>' +
    '</div>' +

    '<div class="tarjeta">' +
      '<h2>Mis peticiones</h2>' +
      '<div id="rd-mias">' + APOLANA_UI.cargando('filas', 3) + '</div>' +
    '</div>';

  // --- Mostrar/ocultar los campos según el tipo ---
  var tipoSel = $('rd-tipo');
  function refrescarCampos() {
    var t = tipoSel.value;
    $('rd-campo-atleta').classList.toggle('oculto', !(t === 'atleta' && atletas.length));
    $('rd-campo-seccion').classList.toggle('oculto', t !== 'seccion');
  }
  tipoSel.addEventListener('change', refrescarCampos);
  refrescarCampos();

  // --- Selección de fotos con vista previa ---
  var elegidas = []; // { file, url }
  var inputFotos = $('rd-fotos');
  function pintarMinis() {
    var cont = $('rd-minis');
    cont.innerHTML = elegidas.map(function (e, i) {
      var alto = e.file.size > 10 * 1048576;
      return '<div class="mini">' +
        '<img src="' + e.url + '" alt="">' +
        '<button type="button" class="quitar" data-i="' + i + '" aria-label="Quitar foto" title="Quitar">×</button>' +
        '<span class="peso' + (alto ? ' alto' : '') + '">' + mb(e.file.size) + '</span>' +
      '</div>';
    }).join('');
  }
  inputFotos.addEventListener('change', function () {
    [].slice.call(inputFotos.files).forEach(function (f) {
      if (!/^image\//.test(f.type)) return;
      elegidas.push({ file: f, url: URL.createObjectURL(f) });
    });
    inputFotos.value = '';
    var pesadas = elegidas.filter(function (e) { return e.file.size > 10 * 1048576; }).length;
    var m = $('rd-msg'); m.className = 'msg';
    m.textContent = pesadas ? ('Aviso: ' + pesadas + ' foto' + (pesadas === 1 ? '' : 's') + ' pesa' + (pesadas === 1 ? '' : 'n') + ' más de 10 MB; puede tardar en subir.') : '';
    pintarMinis();
  });
  $('rd-minis').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.quitar') : null;
    if (!b) return;
    var i = parseInt(b.getAttribute('data-i'), 10);
    if (elegidas[i]) { try { URL.revokeObjectURL(elegidas[i].url); } catch (x) {} elegidas.splice(i, 1); pintarMinis(); }
  });

  // --- Enviar ---
  var enviando = false;
  $('rd-enviar').addEventListener('click', async function () {
    if (enviando) return;
    var msg = $('rd-msg');
    var desc = $('rd-desc').value.trim();
    if (!desc) { msg.className = 'msg error'; msg.textContent = 'Escribe qué quieres que ponga el post.'; $('rd-desc').focus(); return; }
    if (!miId) { msg.className = 'msg error'; msg.textContent = 'No se ha podido identificar tu cuenta. Vuelve a entrar e inténtalo de nuevo.'; return; }

    var tipo = tipoSel.value;
    enviando = true;
    $('rd-enviar').disabled = true;
    msg.className = 'msg'; msg.textContent = 'Enviando…';

    // 1) Subir las fotos al cubo de las propuestas, cada una en la
    //    carpeta de quien la manda: «<id de usuario>/<archivo>».
    var rutas = [];
    var barra = $('rd-barra'), barraInt = $('rd-barra-int');
    if (elegidas.length) barra.classList.remove('oculto');
    for (var i = 0; i < elegidas.length; i++) {
      barraInt.style.width = Math.round((i / elegidas.length) * 100) + '%';
      msg.textContent = 'Subiendo foto ' + (i + 1) + ' de ' + elegidas.length + '…';
      var f = elegidas[i].file;
      var limpio = f.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-');
      var ruta = miId + '/' + Date.now() + '-' + i + '-' + limpio;
      var up = await sb.storage.from(CUBO).upload(ruta, f, { cacheControl: '3600', upsert: false });
      if (up.error) {
        enviando = false; $('rd-enviar').disabled = false; barra.classList.add('oculto');
        // Las fotos que ya habían subido se retiran: si no se envía la
        // propuesta, no tienen por qué quedarse ahí.
        if (rutas.length) { try { await sb.storage.from(CUBO).remove(rutas); } catch (x) {} }
        msg.className = 'msg error';
        msg.textContent = (esDePermisos(up.error) || noExisteElSitio(up.error))
          ? 'No hemos podido subir «' + f.name + '»: tu cuenta no tiene permiso para subir fotos aquí. No es tu conexión. Escríbenos y lo dejamos listo.'
          : 'No hemos podido subir «' + f.name + '». Puede ser tu conexión: inténtalo otra vez en un momento.';
        return;
      }
      rutas.push(ruta);
    }
    barraInt.style.width = '100%';

    // 2) Crear la petición (estado pendiente por defecto)
    var fila = {
      solicitante_id: miId,
      tipo: tipo,
      atleta_id: (tipo === 'atleta' && atletas.length) ? $('rd-atleta').value : null,
      seccion: (tipo === 'seccion') ? $('rd-seccion').value : null,
      titulo: $('rd-titulo').value.trim() || null,
      descripcion: desc,
      fotos: rutas
    };
    var ins = await sb.from('peticiones_redes').insert(fila);
    enviando = false; $('rd-enviar').disabled = false;
    setTimeout(function () { barra.classList.add('oculto'); barraInt.style.width = '0'; }, 500);

    if (ins.error) {
      // Si falla al guardar, retiramos las fotos para no dejar huérfanas.
      if (rutas.length) { try { await sb.storage.from(CUBO).remove(rutas); } catch (x) {} }
      msg.className = 'msg error';
      msg.textContent = esDePermisos(ins.error)
        ? 'No hemos podido enviar la propuesta: tu cuenta no tiene permiso para hacerlo. No es tu conexión. Escríbenos y lo dejamos listo.'
        : 'No hemos podido enviar la propuesta. Puede ser tu conexión: vuelve a intentarlo en un momento.';
      return;
    }

    // Limpiar el formulario
    elegidas.forEach(function (e) { try { URL.revokeObjectURL(e.url); } catch (x) {} });
    elegidas = []; pintarMinis();
    $('rd-titulo').value = ''; $('rd-desc').value = '';
    msg.className = 'msg ok';
    msg.textContent = '¡Propuesta enviada! El club la revisará y decidirá si se publica. La verás aquí abajo con su estado.';
    cargarMias();
  });

  // --- Mis peticiones ---
  async function cargarMias() {
    var cont = $('rd-mias');
    var r = await sb.from('peticiones_redes')
      .select('id,tipo,seccion,titulo,descripcion,fotos,estado,publicado_url,created_at')
      .order('created_at', { ascending: false });
    if (r.error) {
      cont.innerHTML = esDePermisos(r.error)
        ? APOLANA_UI.error('No hemos podido cargar tus propuestas',
            'Tu cuenta no tiene permiso para verlas. No es tu conexión: escríbenos y lo dejamos listo.')
        : APOLANA_UI.error('No hemos podido cargar tus propuestas',
            'Puede ser tu conexión. Lo que has enviado sigue guardado; vuelve a intentarlo en un momento.');
      return;
    }
    var data = r.data || [];
    if (!data.length) {
      cont.innerHTML = APOLANA_UI.vacio('Todavía no has enviado ninguna propuesta',
        'Cuando mandes la primera, aparecerá aquí con su estado: si está pendiente, si el club la está preparando o si ya se ha publicado.');
      return;
    }
    var etTipo = { atleta:'Atleta', seccion:'Sección', evento:'Evento', resultado:'Resultado', otro:'Otro' };
    var todas = [];
    data.forEach(function (p) { (p.fotos || []).forEach(function (ru) { if (todas.indexOf(ru) === -1) todas.push(ru); }); });
    var enlaces = await firmar(todas);
    cont.innerHTML = data.map(function (p) {
      var galeria = (p.fotos || []).map(function (ru) {
        var u = enlaces[ru];
        if (!u) return '';
        return '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img src="' + esc(u) + '" alt="" loading="lazy"></a>';
      }).join('');
      var meta = [etTipo[p.tipo] || p.tipo, p.seccion || '', 'Enviada el ' + fecha(p.created_at)].filter(Boolean).join(' · ');
      return '<div class="peticion">' +
        '<div class="cab"><span class="tit">' + esc(p.titulo || (etTipo[p.tipo] || 'Propuesta')) + '</span>' +
          '<span class="estado ' + esc(p.estado) + '">' + esc(ESTADOS[p.estado] || p.estado) + '</span></div>' +
        (p.descripcion ? '<div class="desc">' + esc(p.descripcion) + '</div>' : '') +
        (galeria ? '<div class="galeria">' + galeria + '</div>' : '') +
        '<div class="meta">' + esc(meta) + '</div>' +
        (p.estado === 'publicado' && p.publicado_url ? '<a class="enlace-post" href="' + esc(p.publicado_url) + '" target="_blank" rel="noopener">Ver el post publicado →</a>' : '') +
      '</div>';
    }).join('');
  }
  cargarMias();
});
</script>

</body>
</html>
