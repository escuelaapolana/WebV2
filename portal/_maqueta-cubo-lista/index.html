<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta · Lista del Cubo</title>
<link rel="stylesheet" href="../../assets/css/apolana.css">
<style>
  :root { --ap-titulo:'Bricolage Grotesque',system-ui,sans-serif; --dato:var(--fuente-dato,'IBM Plex Mono',monospace);
    --s1:0 3px 8px rgba(30,45,65,.09),0 12px 22px -6px rgba(30,45,65,.26); }
  body { background:var(--crema,#FBF9F4); margin:0; }
  .cl-wrap { max-width:680px; margin:0 auto; padding:clamp(18px,4vw,26px) clamp(14px,4vw,26px) 90px; }
  .saludo { font-family:var(--ap-titulo); font-weight:700; text-transform:uppercase; letter-spacing:-0.01em;
            font-size:clamp(24px,5.5vw,34px); line-height:1.02; color:var(--navy,#26374B); margin:4px 0 2px; }
  .sub { font-size:14px; color:var(--texto-suave,#6E6656); margin:0 0 14px; }
  .cl-grupos { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
  .cl-chip { font:inherit; font-size:14px; cursor:pointer; background:#fff; color:var(--navy,#26374B);
             border:1px solid var(--linea-marcada,#E4DCCB); border-radius:999px; padding:9px 15px; }
  .cl-chip.on { background:var(--navy,#26374B); color:#fff; border-color:var(--navy,#26374B); }
  .cl-chip small { display:block; font-size:11px; opacity:.75; margin-top:1px; font-variant-numeric:tabular-nums; }
  .cl-barra { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
              background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
              padding:12px 15px; margin-bottom:14px; }
  .cl-barra .fh { display:flex; align-items:center; gap:8px; }
  .cl-barra input[type=date] { font:inherit; font-size:15px; color:var(--navy,#26374B); border:1px solid var(--linea-borde,#C9C0AE);
              border-radius:10px; padding:7px 10px; background:var(--crema,#FBF9F4); }
  .cl-barra .cont { font-size:14px; color:var(--texto-suave,#6E6656); }
  .cl-barra .cont b { color:#2E7D6B; font-family:var(--dato); font-size:17px; }
  .cl-lista { display:flex; flex-direction:column; gap:9px; }
  .cl-fila { display:flex; align-items:center; gap:12px; width:100%; box-sizing:border-box; text-align:left;
             background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; box-shadow:var(--s1);
             padding:13px 15px; font:inherit; color:var(--navy,#26374B); cursor:pointer; }
  .cl-fila .tick { flex:0 0 auto; width:30px; height:30px; border-radius:999px; border:2px solid var(--linea-borde,#C9C0AE);
             display:grid; place-items:center; color:#fff; }
  .cl-fila .tick svg { width:18px; height:18px; opacity:0; }
  .cl-fila.vino .tick { background:#2E7D6B; border-color:#2E7D6B; }
  .cl-fila.vino .tick svg { opacity:1; }
  .cl-fila .nom { flex:1; min-width:0; }
  .cl-fila .nom b { display:block; font-size:16px; font-weight:600; }
  .cl-fila .est { font-size:13px; font-weight:600; color:var(--texto-tenue,#9A927F); }
  .cl-fila.vino .est { color:#2E7D6B; }
  .maq-nota { max-width:680px; margin:0 auto; padding:8px 16px; font-size:12px; color:#9A927F; text-align:center; }
  .barra-demo { position:fixed; left:0; right:0; bottom:0; height:64px; background:var(--navy,#26374B); display:flex;
                align-items:center; justify-content:space-around; box-shadow:0 -6px 20px -8px rgba(30,45,65,.4); }
  .barra-demo span { color:rgba(255,255,255,.65); font-size:11px; font-weight:600; text-align:center; }
  .barra-demo span.on { color:#fff; }
  .barra-demo span i { display:block; font-size:19px; font-style:normal; margin-bottom:2px; }
</style>
</head>
<body>
  <p class="maq-nota">Maqueta · datos de ejemplo (así la verá Claudia en el móvil)</p>
  <div class="cl-wrap" id="cl"></div>
  <div class="barra-demo"><span class="on"><i>✓</i>Lista</span><span><i>▦</i>Calendario</span><span><i>⋯</i>Más</span></div>
<script>
  var GRUPOS = [
    { id:'g1', nombre:'El Cubo · L y X 17:30', horario:'Lunes y miércoles · 17:30–18:30' },
    { id:'g2', nombre:'El Cubo · L y X 18:45', horario:'Lunes y miércoles · 18:45–19:45' },
    { id:'g3', nombre:'El Cubo · M y J 17:30', horario:'Martes y jueves · 17:30–18:30' }
  ];
  var ALTAS = [
    { id:'a1', nombre:'Marta', apellidos:'Aguilar', horario:'El Cubo · L y X 17:30' },
    { id:'a2', nombre:'Diego', apellidos:'Bernal', horario:'El Cubo · L y X 17:30' },
    { id:'a3', nombre:'Lucía', apellidos:'Cano', horario:'El Cubo · L y X 17:30' },
    { id:'a4', nombre:'Javier', apellidos:'Díaz', horario:'El Cubo · L y X 17:30' },
    { id:'a5', nombre:'Sara', apellidos:'Esteve', horario:'El Cubo · L y X 17:30' },
    { id:'a6', nombre:'Pablo', apellidos:'Ferrer', horario:'El Cubo · L y X 17:30' },
    { id:'a7', nombre:'Nerea', apellidos:'Gómez', horario:'El Cubo · L y X 18:45' },
    { id:'a8', nombre:'Hugo', apellidos:'Herrero', horario:'El Cubo · L y X 18:45' },
    { id:'a9', nombre:'Elena', apellidos:'Ibáñez', horario:'El Cubo · M y J 17:30' },
    { id:'a10', nombre:'Marc', apellidos:'Jover', horario:'El Cubo · M y J 17:30' }
  ];
  var sel = 'g1';
  var ASIS = { a1:true, a3:true, a6:true };   // ejemplo: ya marcados

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sinPrefijo(n){ return String(n||'').replace(/^El Cubo\s*·\s*/i,''); }
  function hoyISO(){ var d=new Date(); function p(n){return(n<10?'0':'')+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function grupoSel(){ return GRUPOS.filter(function(g){return g.id===sel;})[0]; }
  function miembros(){ var g=grupoSel(); return ALTAS.filter(function(a){return a.horario===g.nombre;})
      .sort(function(x,y){ return ((x.apellidos+' '+x.nombre).toLowerCase()<(y.apellidos+' '+y.nombre).toLowerCase())?-1:1; }); }

  function pintar(){
    var chips = GRUPOS.map(function(x){
      var n = ALTAS.filter(function(a){return a.horario===x.nombre;}).length;
      return '<button type="button" class="cl-chip'+(x.id===sel?' on':'')+'" data-g="'+x.id+'">'+esc(sinPrefijo(x.nombre))+'<small>'+n+' personas</small></button>';
    }).join('');
    var lst = miembros();
    var vinieron = lst.filter(function(a){return ASIS[a.id];}).length;
    var filas = lst.map(function(a){
      var vino = !!ASIS[a.id];
      return '<button type="button" class="cl-fila'+(vino?' vino':'')+'" data-a="'+a.id+'">'+
        '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>'+
        '<span class="nom"><b>'+esc(a.nombre+' '+a.apellidos)+'</b></span>'+
        '<span class="est">'+(vino?'Vino':'—')+'</span></button>';
    }).join('');
    document.getElementById('cl').innerHTML =
      '<h1 class="saludo">Pasar lista</h1>'+
      '<p class="sub">Toca a quién ha venido hoy. Se guarda solo.</p>'+
      '<div class="cl-grupos">'+chips+'</div>'+
      '<div class="cl-barra"><span class="fh"><input type="date" value="'+hoyISO()+'" max="'+hoyISO()+'"></span>'+
        '<span class="cont">Han venido <b>'+vinieron+'</b> de '+lst.length+'</span></div>'+
      '<div class="cl-lista">'+filas+'</div>';
  }
  document.getElementById('cl').addEventListener('click', function(ev){
    var ch=ev.target.closest?ev.target.closest('.cl-chip[data-g]'):null;
    if(ch){ sel=ch.getAttribute('data-g'); pintar(); return; }
    var fi=ev.target.closest?ev.target.closest('.cl-fila[data-a]'):null;
    if(fi){ var id=fi.getAttribute('data-a'); if(ASIS[id]) delete ASIS[id]; else ASIS[id]=true; pintar(); }
  });
  pintar();
</script>
</body>
</html>
