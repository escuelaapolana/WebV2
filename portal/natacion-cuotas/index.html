<style>

  .cu-hoja > h2 button{ margin-left:auto; font:inherit; font-size:22px; line-height:1; background:none; border:0; cursor:pointer; color:var(--texto-suave,#6E6656); padding:4px 8px; }
  .cu-hoja .cu-cuerpo{ padding:16px 18px 18px; }
  .cu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }

  .cu-campo{ display:flex; flex-direction:column; gap:5px; min-width:0; }

  .cu-switch{ display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; color:var(--navy,#26374B); cursor:pointer; min-height:44px; margin-top:12px; }

  .cu-fam ul{ list-style:none; margin:0 0 10px; padding:0; font-size:14px; color:var(--navy,#26374B); line-height:1.5; }
  .cu-fam li span{ color:var(--texto-suave,#6E6656); }
  .cu-dto{ display:flex; flex-wrap:wrap; gap:6px; }
  .cu-dto .cu-chip{ min-height:40px; padding:0 12px; font-size:13.5px; }

  .cu-formula{ font-size:14px; color:var(--navy,#26374B); margin-top:10px; line-height:1.5; }

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('cuotas');
  var params = new URLSearchParams(location.search);
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var RECARGO_NO_SOCIO = 15;                       // €/mes; va ENTERO en el proporcional (criterio de Mario)
  var TARIFA_SOCIO = { 1:35, 2:45, 3:55 };         // respaldo si no se pueden leer las tarifas
  var FIN_TEMPORADA = '2027-06-30';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function norm(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
  function r2(n){ return Math.round(Number(n) * 100) / 100; }
  function eur(n){
    if (n == null || n === '' || isNaN(Number(n))) return '—';
    var v = r2(n);
    return v.toLocaleString('es-ES', { minimumFractionDigits: Math.round(v*100) % 100 ? 2 : 0, maximumFractionDigits: 2 }) + ' €';
  }
  function num(s){ var v = String(s == null ? '' : s).trim().replace(/\s/g,'').replace(',', '.'); if (v === '') return null; var n = Number(v); return isNaN(n) ? NaN : n; }
  function numTxt(n){ return n == null || isNaN(n) ? '' : String(r2(n)).replace('.', ','); }
  function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function ymd(y, m, d){ return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
  function partes(iso){ var p = String(iso||'').slice(0,10).split('-'); return { y:+p[0], m:+p[1], d:+p[2] }; }
  function diasDelMes(y, m){ return new Date(y, m, 0).getDate(); }
  function fechaLarga(iso){ if (!iso) return ''; var p = partes(iso); return p.d + ' de ' + MESES[p.m-1] + ' de ' + p.y; }
  function mesAnio(iso){ var p = partes(iso); return MESES[p.m-1] + ' de ' + p.y; }
  function capital(s){ return String(s||'').toLowerCase().replace(/(^|[\s-])(\p{L})/gu, function(_, a, b){ return a + b.toUpperCase(); }); }
  function nombreDe(x){ return capital(((x.nombre || '') + ' ' + (x.apellidos || '')).trim()); }
  function pl(n, uno, varios){ return n + ' ' + (n === 1 ? uno : varios); }
  function perCorta(p){ return p === 'trimestral' ? '/trim.' : p === 'temporada' ? '/temp.' : p === 'anual' ? '/año' : '/mes'; }
  function textoPer(p){ return p === 'trimestral' ? 'al trimestre' : p === 'temporada' ? 'por temporada' : p === 'anual' ? 'al año' : 'al mes'; }

  // Errores en cristiano: nada de «Supabase», «RLS» ni «permission denied».
  function humano(e, accion){
    var m = String((e && (e.message || e.msg || e.mensaje)) || e || '');
    if (/JWT expired|jwt|sesi[oó]n caducada|sin_sesion/i.test(m)) return 'Tu sesión ha caducado. Sal y vuelve a entrar.';
    if (/^(Solo |No encuentro|Falta|Ya tiene|Ya está|Esa persona|Ese cobro|Está de baja|Su ficha|La fecha|La cuota|La periodicidad|La forma|El primer|El concepto)/.test(m)) return m;

  function listaHtml(){
    if (S.lista == null) return '<p class="cu-msg">Cargando nadadores…</p>';

  function porId(id){ return (S.lista || []).filter(function(x){ return x.atleta_id === id; })[0] || null; }

  // ---------- guardar la cuota de la ficha ----------
  async function guardarCuota(id){
    var x = porId(id), ed = S.edit[id]; if (!x || !ed) return;

    if (r.error){ pintarFila(id); toast(humano(r.error, 'cambiar cuotas')); return; }
    x.cuota_importe = imp; x.cuota_periodicidad = ed.per; delete S.edit[id];
    pintarFila(id); toast('Cuota guardada: ' + eur(imp) + ' ' + textoPer(ed.per));

  // ======================================================================
  //  FORMULARIO «Crear enlace de domiciliación»
  // ======================================================================
  var F = null, velo = null;
  function mesSiguiente(iso){ var p = partes(iso); return p.m === 12 ? ymd(p.y + 1, 1, 1) : ymd(p.y, p.m + 1, 1); }
  function abrirForm(id){
    var x = porId(id); if (!x) return;
    var per = x.cuota_periodicidad === 'trimestral' ? 'trimestral' : 'mensual';
    var imp = (x.cuota_importe != null && !x.cuota_otra_seccion && Number(x.cuota_importe) > 0) ? Number(x.cuota_importe) : null;
    var deFicha = imp != null;
    if (imp == null){ var pr = cuotaPropuesta(x); if (pr != null){ imp = pr; per = 'mensual'; } }
    var hoy = hoyISO();
    F = {
      x: x, importe: imp == null ? '' : numTxt(imp), per: per, impDeFicha: deFicha, impTocado: false,
      inicio: mesSiguiente(hoy), fin: FIN_TEMPORADA,
      mitad: false, alta: hoy, socio: !!x.es_socio,
      ref: '', refTocada: false, cargo: '', cargoTocado: false,
      forma: 'ambos',   // 431: 'ambos' = se cobra solo (tarjeta o IBAN) · 'mes_a_mes' = aviso y paga cada mes
      enviando: false, err: null, hecho: null,
      fam: familiaDe(x), puesto: 1, dto: null
    };
    // Descuento familiar: se propone por su puesto en la familia. Si ya trae una
    // cuota en la ficha, se marca el descuento que le cuadre (o ninguno: «a mano»).
    if (F.fam.length){
      F.puesto = puestoFamilia(x, F.fam);
      var pAuto = F.puesto >= 3 ? 0.40 : F.puesto === 2 ? 0.20 : 0, tf = tarifaForm();
      if (!deFicha && tf != null){ F.dto = pAuto; F.importe = numTxt(conDescuento(tf, F.per, pAuto, x, F.socio)); }
      else F.dto = dtoQueCuadra();
    }
    velo = document.createElement('div'); velo.className = 'cu-velo';
    velo.addEventListener('click', function(ev){ if (ev.target === velo) cerrarForm(); });
    velo.addEventListener('click', clickForm);
    velo.addEventListener('input', inputForm);
    velo.addEventListener('change', inputForm);
    document.body.appendChild(velo);
    document.body.style.overflow = 'hidden';
    pintarForm();
  }
  function cerrarForm(){
    if (F && F.enviando) return;
    if (velo){ velo.remove(); velo = null; }
    document.body.style.overflow = '';
    var recargar = F && F.hecho; F = null;
    if (recargar) cargar().then(pintarLista);
  }
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && velo) cerrarForm(); });

  // Cuota del mes completo de referencia (para el proporcional).
  function refMensual(){
    if (F.refTocada) return num(F.ref);
    var imp = num(F.importe); if (imp == null || isNaN(imp)) return null;
    return F.per === 'trimestral' ? r2((imp + 15) / 3) : imp;   // trimestral = 3 × mensual − 15
  }
  function recargo(){ return F.x.tipo === 'Máster' && !F.socio ? RECARGO_NO_SOCIO : 0; }
  // Cuota de tarifa SIN descuento para el periodo elegido (trimestral = 3 × mensual − 15).
  function tarifaForm(){
    var s = tarifaSocio(F.x.tipo, F.x.dias); if (s == null) return null;
    var m = s + recargo();
    return F.per === 'trimestral' ? 3 * m - 15 : m;
  }
  // ¿Qué descuento familiar da el importe escrito? (null = ninguno cuadra: puesto a mano)
  function dtoQueCuadra(){
    var tf = tarifaForm(), imp = num(F.importe);
    if (tf == null || imp == null || isNaN(imp)) return null;
    for (var i = 0; i < DTO_FAM.length; i++){ if (Math.abs(conDescuento(tf, F.per, DTO_FAM[i].p, F.x, F.socio) - imp) < 0.005) return DTO_FAM[i].p; }
    return null;
  }
  function famHtml(){
    if (!F.fam.length) return '';
    var x = F.x, tf = tarifaForm();
    var li = F.fam.map(function(o){
      var c = o.cobro_id ? eur(o.cobro_importe) + ' ' + textoPer(o.cobro_periodicidad) + ' · ' + estadoDe(o).t.toLowerCase()
        : (Number(o.cuota_importe) > 0 ? eur(o.cuota_importe) + ' ' + textoPer(o.cuota_periodicidad) + ' en su ficha' : 'sin cuota');
      return '<li><b>' + esc(nombreDe(o)) + '</b> <span>· ' + esc(o.tipo === 'Escuela' ? 'Escuela' : 'Máster') + (o.dias ? ', ' + pl(o.dias, 'día', 'días') : '') + ' · ' + esc(c) + '</span></li>';
    }).join('');
    var pills = DTO_FAM.map(function(d){
      var no = d.p === 0.40 && F.fam.length < 2;   // −40 % solo con 2 familiares más
      return '<button type="button" class="cu-chip' + (F.dto === d.p ? ' on' : '') + '" data-dto="' + d.p + '"' + (no ? ' disabled title="Solo con dos familiares más en natación"' : '') + '>' + d.t + '</button>';
    }).join('');
    var pila = capital(String(x.nombre || '').trim().split(/\s+/)[0] || '');
    var calc = '';
    if (tf != null && F.dto != null && F.dto > 0){
      var res = conDescuento(tf, F.per, F.dto, x, F.socio), rec = recargo() * (F.per === 'trimestral' ? 3 : 1);
      calc = 'Tarifa ' + eur(tf) + ' ' + textoPer(F.per) + ' − ' + Math.round(F.dto * 100) + ' %' + (rec ? ' (sobre la parte de socio; los ' + eur(rec) + ' de no socio van enteros)' : '') + ' = <b>' + eur(res) + '</b>.';
    } else if (F.dto === 0){
      var pT = F.puesto >= 3 ? 0.40 : F.puesto === 2 ? 0.20 : 0;
      calc = esc(pila) + ' paga la cuota entera' + (F.puesto === 1 ? ': es el de tarifa más alta de su familia.'
        : (F.impDeFicha && !F.impTocado ? ' (la de su ficha)' : '') + (tf != null ? '. Como ' + F.puesto + 'º de la familia le tocaría <b>' + eur(conDescuento(tf, F.per, pT, x, F.socio)) + '</b> (−' + Math.round(pT * 100) + ' %).' : '.'));
    } else {
      calc = 'Cuota puesta a mano.';
    }
    var sug = F.puesto >= 2 ? ' · por la tarifa, ' + esc(pila) + ' es el ' + F.puesto + 'º' : '';
    return '<div class="cu-fam"><div class="cu-sec-lab" style="margin-top:0">Familia en natación' + sug + '</div><ul>' + li + '</ul>' +
      '<div class="cu-dto" role="group" aria-label="Descuento familiar">' + pills + '</div>' +
      '<div class="cu-fam-calc">' + calc + '</div></div>';
  }
  // Proporcional del mes de alta: SOLO la parte de socio; el recargo de no socio va entero (criterio de Mario).
  function calcProp(){
    var ref = refMensual(); if (ref == null || isNaN(ref) || !F.alta) return null;
    var p = partes(F.alta), dm = diasDelMes(p.y, p.m), quedan = dm - p.d + 1;
    var rec = recargo(), socio = Math.max(0, r2(ref - rec));
    var prop = r2(socio * quedan / dm);
    return { ref:ref, rec:rec, socio:socio, quedan:quedan, dm:dm, prop:prop, total:r2(prop + rec), mes:MESES[p.m-1], y:p.y, d:p.d };
  }
  function cargoFinal(){
    if (!F.mitad) return null;
    if (F.cargoTocado) return num(F.cargo);
    var c = calcProp(); return c ? c.total : null;
  }
  function conceptoCargo(){
    var c = calcProp(); if (!c) return null;
    return (F.x.tipo === 'Escuela' ? 'Escuela de natación' : 'Natación máster') + ' · ' + c.mes + ' ' + c.y + (c.d > 1 ? ' (proporcional desde el ' + c.d + ')' : '');
  }
  function opcionesMes(){
    var h = '', p = partes(hoyISO());
    for (var i = 0; i <= 12; i++){
      var m = p.m + i, y = p.y + Math.floor((m - 1) / 12); m = ((m - 1) % 12) + 1;
      var v = ymd(y, m, 1);
      h += '<option value="' + v + '"' + (F.inicio === v ? ' selected' : '') + '>' + capital(MESES[m-1]) + ' de ' + y + (i === 0 ? ' (este mes)' : '') + '</option>';
    }
    return h;
  }
  function datosHecho(){
    return F ? { importe: num(F.importe), per: F.per, inicio: F.inicio, fin: F.fin, cargo: cargoFinal(), metodo: F.forma === 'mes_a_mes' ? 'mes_a_mes' : 'ambos' } : {};
  }
  // Nº de cobros como los hará Stripe (mig 429): si empieza un mes que viene, el
  // primero es el día 5 de ese mes; si empieza este mes, uno hoy (el periodo en
  // curso) y luego el día 5 del periodo siguiente. Siempre el día 5.
  function plan(){
    var hoy = partes(hoyISO()), ini = partes(F.inicio);
    var diferido = ini.y * 12 + ini.m > hoy.y * 12 + hoy.m;
    var paso = F.per === 'trimestral' ? 3 : 1;
    var ancla = diferido ? { y: ini.y, m: ini.m } : { y: hoy.y, m: hoy.m + paso };
    var fin = F.fin, n = diferido ? 0 : 1, ultimo = diferido ? null : hoyISO(), primero5 = null;
    for (var k = 0; k < 60; k++){
      var m = ancla.m + paso * k, y = ancla.y + Math.floor((m - 1) / 12); m = ((m - 1) % 12) + 1;
      var iso = ymd(y, m, 5);
      if (iso > fin) break; n++; ultimo = iso; if (!primero5) primero5 = iso;
    }
    return { diferido: diferido, n: n, ultimo: ultimo, primero5: primero5 };
  }
  function resumenHtml(){
    var imp = num(F.importe), cargo = cargoFinal();
    if (imp == null || isNaN(imp) || imp <= 0) return '<div class="cu-resumen">Escribe el importe de la cuota.</div>';
    if (!F.fin || F.fin < F.inicio) return '<div class="cu-resumen">Revisa la fecha de fin: tiene que ser después del mes de inicio.</div>';
    if (F.forma === 'mes_a_mes'){
      var cuotaM = eur(imp) + (F.per === 'trimestral' ? ' al trimestre' : '/mes');
      var primero = (cargo != null && !isNaN(cargo) && cargo > 0) ? '<b>' + eur(cargo) + '</b> (el proporcional de este mes)' : '<b>' + cuotaM + '</b> de ' + mesAnio(F.inicio);
      return '<div class="cu-resumen">Se crea ya el primer recibo, ' + primero + ', con su enlace para pagar con tarjeta: mándaselo tú. ' +
        ((cargo != null && !isNaN(cargo) && cargo > 0)
          ? 'Después, desde ' + mesAnio(F.inicio) + ', cada ' + (F.per === 'trimestral' ? 'trimestre' : 'mes') + ' se crea solo un recibo de <b>' + cuotaM + '</b>'
          : 'Los siguientes se crean solos cada ' + (F.per === 'trimestral' ? 'trimestre' : 'mes')) +
        ' y le llega un correo el día 1 para pagarlo antes del 5.' +
        '<small>No se guarda ninguna tarjeta. Se para sola el ' + fechaLarga(F.fin) + '. Los correos van a ' + esc(F.x.email || '—') + '.</small></div>';
    }
    var pl = plan(), cuota = eur(imp) + (F.per === 'trimestral' ? ' al trimestre' : '/mes');
    var hasta = pl.ultimo ? ' hasta ' + MESES[partes(pl.ultimo).m - 1] + ' de ' + partes(pl.ultimo).y : '';
    var txt;
    if (cargo != null && !isNaN(cargo) && cargo > 0){
      var c = calcProp();
      txt = 'Al domiciliar se cobran <b>' + eur(cargo) + '</b>' + (c ? ' de ' + c.mes : '') + '; ' +
        (pl.primero5 ? 'desde el <b>' + fechaLarga(pl.primero5) + '</b>, ' : 'después, ') + '<b>' + cuota + '</b> el día 5' + hasta + '.';
    } else if (pl.diferido){
      txt = 'Al domiciliar no se cobra nada. Desde el <b>' + fechaLarga(pl.primero5 || F.inicio) + '</b>, <b>' + cuota + '</b> el día 5' + hasta + '.';
    } else {
      txt = 'El primer cobro (<b>' + cuota + '</b>, ' + (F.per === 'trimestral' ? 'el trimestre en curso' : 'el mes en curso') + ') se hace al domiciliar y después <b>el día 5</b> ' + (F.per === 'trimestral' ? 'de cada trimestre' : 'de cada mes') + (pl.primero5 ? ', desde el ' + fechaLarga(pl.primero5) : '') + hasta + '.';
    }
    return '<div class="cu-resumen">' + txt +
      '<small>' + pl.n + ' cobro' + (pl.n === 1 ? '' : 's') + ' de la cuota en total; se para sola el ' + fechaLarga(F.fin) + '. El enlace es para ' + esc(F.x.email || '—') + '.</small></div>';
  }
  function pintarForm(){
    if (!velo || !F) return;
    var x = F.x, h = '<div class="cu-hoja" role="dialog" aria-modal="true" aria-labelledby="cu-hoja-t"><h2 id="cu-hoja-t">' +
      (F.hecho ? 'Enlace creado' : 'Crear enlace de pago') + '<button type="button" data-cerrar aria-label="Cerrar">×</button></h2><div class="cu-cuerpo">';
    if (F.hecho){
      var en = F.hecho.enlace;
      h += '<div class="cu-hecho"><div class="ok">✓</div><h3>' + esc(nombreDe(x)) + '</h3>' +
        '<p style="margin:0;color:var(--texto-suave)">' + esc(F.hecho.concepto || '') + '</p></div>' +
        '<div class="cu-enlace"><input readonly value="' + esc(en) + '" aria-label="Enlace de domiciliación" id="cu-enlace-txt"></div>' +
        '<div class="cu-acc"><button type="button" class="cu-btn" data-copiar-hecho>Copiar enlace</button>' +
        '<a class="cu-btn wa" href="' + esc(urlWa(x, en, datosHecho())) + '" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">WhatsApp' + (telWa(x.telefono) ? '' : ' (elige el chat)') + '</a></div>' +
        '<div class="cu-msg"><div class="cu-msg-lab">Mensaje para copiar y pegar</div>' +
          '<p class="cu-msg-nota">Las palabras entre *asteriscos* salen en negrita en WhatsApp.</p>' +
          '<textarea readonly id="cu-msg-txt" rows="12">' + esc(mensaje(x, en, datosHecho())) + '</textarea>' +
          '<button type="button" class="cu-btn" data-copiar-msg-hecho>Copiar mensaje</button></div>' +
        (F.forma === 'mes_a_mes'
          ? '<div class="cu-info">No se ha mandado ningún correo de este primer recibo: el enlace lo mandas tú. Cuando pague, aquí saldrá como pagado. Los siguientes le llegarán solos por correo cada ' + (F.per === 'trimestral' ? 'trimestre' : 'mes') + '.</div>'
          : '<div class="cu-info">No se ha mandado ningún correo. Cuando ' + (x.tipo === 'Escuela' ? 'la familia' : 'el nadador') + ' abra el enlace y ponga su tarjeta o su IBAN (lo elige ' + (x.tipo === 'Escuela' ? 'ella' : 'él') + '), aquí pasará a «Activa» (tarjeta) o «En camino» (IBAN, el banco tarda unos días).</div>') +
        '<div class="cu-acc"><button type="button" class="cu-btn sec" data-cerrar>Cerrar</button></div>';
      velo.innerHTML = h + '</div></div>';
      return;
    }
    var c = calcProp(), cargo = cargoFinal();
    h += '<p style="margin:0 0 12px;font-size:15px;color:var(--navy)"><b>' + esc(nombreDe(x)) + '</b> · ' + (x.tipo === 'Escuela' ? 'Escuela de natación' : 'Máster') +
      (x.dias ? ' · ' + x.dias + ' día' + (x.dias === 1 ? '' : 's') : '') + (x.tipo === 'Máster' ? (F.socio ? ' · socio/a' : ' · no socio') : '') + '</p>' +
      famHtml() +
      '<div class="cu-grid">' +
        '<div class="cu-campo"><label for="f-imp">Cuota</label><input id="f-imp" data-f="importe" inputmode="decimal" value="' + esc(F.importe) + '" placeholder="Ej.: 60"><span class="ayuda">En euros. ' + (F.dto > 0 && !F.impTocado ? 'La de la tarifa con el descuento familiar.' : F.impDeFicha ? 'La de su ficha.' : 'La de la tarifa' + (x.tipo === 'Máster' ? ' (no socio = socio + 15 €)' : '') + '.') + '</span></div>' +
        '<div class="cu-campo"><label for="f-per">Cada cuánto</label><select id="f-per" data-f="per">' +
          '<option value="mensual"' + (F.per === 'mensual' ? ' selected' : '') + '>Al mes</option>' +
          '<option value="trimestral"' + (F.per === 'trimestral' ? ' selected' : '') + '>Al trimestre</option></select></div>' +
        '<div class="cu-campo"><label for="f-ini">Empieza</label><select id="f-ini" data-f="inicio">' + opcionesMes() + '</select><span class="ayuda">La cuota se cobra el día 5 de cada mes.</span></div>' +
        '<div class="cu-campo"><label for="f-fin">Se para sola el</label><input id="f-fin" data-f="fin" type="date" value="' + esc(F.fin) + '"></div>' +
      '</div>' +
      (x.tipo === 'Máster' ? '<label class="cu-switch"><input type="checkbox" data-f="socio"' + (F.socio ? ' checked' : '') + '> Es socio/a del club <small style="font-weight:500;color:var(--texto-suave)">(' + (x.es_socio ? 'su ficha dice que sí' : 'su ficha dice que no') + ')</small></label>' : '') +
      '<div class="cu-campo" style="margin:4px 0 10px"><label for="f-forma">Cómo paga</label><select id="f-forma" data-f="forma">' +
        '<option value="ambos"' + (F.forma === 'ambos' ? ' selected' : '') + '>Se cobra solo — tarjeta o IBAN guardados (recomendado)</option>' +
        '<option value="mes_a_mes"' + (F.forma === 'mes_a_mes' ? ' selected' : '') + '>Mes a mes — le llega un aviso y paga cada vez</option></select>' +
        '<span class="ayuda">' + (F.forma === 'mes_a_mes'
          ? 'No deja la tarjeta guardada: cada ' + (F.per === 'trimestral' ? 'trimestre' : 'mes') + ' le llega un correo el día 1 con un enlace para pagar con tarjeta antes del 5 (y un recordatorio si no paga).'
          : 'Elige en el enlace tarjeta o IBAN; se queda guardado y se cobra solo el día 5.') + '</span></div>' +
      '<label class="cu-switch"><input type="checkbox" data-f="mitad"' + (F.mitad ? ' checked' : '') + '> ¿Empieza a mitad de mes?</label>';
    if (F.mitad){
      var hoy = partes(hoyISO()), min = ymd(hoy.y, hoy.m, 1);
      h += '<div class="cu-prop"><div class="cu-grid">' +
        '<div class="cu-campo"><label for="f-alta">Fecha de alta</label><input id="f-alta" data-f="alta" type="date" min="' + min + '" value="' + esc(F.alta) + '"></div>' +
        '<div class="cu-campo"><label for="f-ref">Cuota de un mes entero</label><input id="f-ref" data-f="ref" inputmode="decimal" value="' + esc(F.refTocada ? F.ref : numTxt(refMensual())) + '"><span class="ayuda">' + (F.per === 'trimestral' ? 'Del trimestre: (cuota + 15) ÷ 3.' : 'La misma cuota mensual.') + '</span></div>' +
        '</div>';
      if (c){
        h += '<div class="cu-formula">' + eur(c.socio) + ' × ' + c.quedan + '/' + c.dm + ' = ' + eur(c.prop) +
          (c.rec ? ' + ' + eur(c.rec) + ' (no socio, entero)' : '') + ' = <b>' + eur(c.total) + '</b>' +
          '<br><small style="color:var(--texto-suave)">Del ' + c.d + ' al ' + c.dm + ' de ' + c.mes + ': ' + c.quedan + ' de ' + c.dm + ' días. Solo se prorratea la parte de socio' + (x.tipo === 'Máster' ? '; los 15 € de no socio van enteros' : '') + '.</small></div>';
      }
      h += '<div class="cu-campo" style="margin-top:10px"><label for="f-cargo">Primer cargo (al domiciliar)</label>' +
        '<div style="display:flex;gap:8px;align-items:center"><input id="f-cargo" data-f="cargo" inputmode="decimal" style="max-width:140px" value="' + esc(F.cargoTocado ? F.cargo : numTxt(cargo)) + '"><b>€</b>' +
        (F.cargoTocado ? '<button type="button" class="cu-btn peq sec" data-recalcular>Recalcular</button>' : '') + '</div>' +
        '<span class="ayuda">Se puede cambiar a mano.</span></div>';
      var pa = partes(F.alta || hoyISO()), pi = partes(F.inicio);
      if (F.inicio <= ymd(pa.y, pa.m, 1)) h += '<div class="cu-aviso">La cuota tiene que empezar el mes <b>siguiente</b> al alta (si no, ese mes se cobraría dos veces).</div>';
      else if (pi.y * 12 + pi.m > pa.y * 12 + pa.m + 1) h += '<div class="cu-aviso">Ojo: entre el mes del alta y el de inicio queda algún mes sin cobrar.</div>';
      h += '</div>';
    }
    h += resumenHtml();
    if (!x.email) h += '<div class="cu-mal">Falta el correo en su ficha: Stripe lo necesita. Ábrele la ficha, ponlo y vuelve aquí.</div>';
    if (F.err) h += '<div class="cu-mal">' + esc(F.err) + '</div>';
    var ok = valido();
    h += '<div class="cu-acc"><button type="button" class="cu-btn sec" data-cerrar' + (F.enviando ? ' disabled' : '') + '>Cancelar</button>' +
      '<button type="button" class="cu-btn verde" data-crear-ya' + (ok && !F.enviando ? '' : ' disabled') + '>' + (F.enviando ? 'Creando…' : 'Crear enlace') + '</button></div>' +
      '<p style="font-size:12.5px;color:var(--texto-suave);margin:10px 0 0">No se manda ningún correo: te doy el enlace para que se lo pases tú.</p>';
    var foco = document.activeElement && velo.contains(document.activeElement) ? document.activeElement.id : null, pos = null;
    try { pos = foco ? document.activeElement.selectionStart : null; } catch(e){}
    velo.innerHTML = h + '</div></div>';
    if (foco){ var el = document.getElementById(foco); if (el){ el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch(e){} } }
  }
  function valido(){
    if (!F || !F.x.email) return false;
    var imp = num(F.importe); if (imp == null || isNaN(imp) || imp < 1 || imp > 2000) return false;
    if (!F.fin || F.fin < F.inicio) return false;
    if (F.mitad){
      var cg = cargoFinal(); if (cg == null || isNaN(cg) || cg < 0.5 || cg > 2000) return false;
      var pa = partes(F.alta || hoyISO()); if (F.inicio <= ymd(pa.y, pa.m, 1)) return false;
    }
    return true;
  }
  async function crear(){
    if (!valido() || F.enviando) return;
    F.enviando = true; F.err = null; pintarForm();
    var cargo = cargoFinal();
    var r = await sb.rpc('natacion_cobro_crear', {
      p_atleta: F.x.atleta_id,
      p_importe: num(F.importe),
      p_periodicidad: F.per,
      p_inicio: F.inicio,
      p_fin: F.fin,
      p_cargo_inicial: F.mitad ? cargo : null,
      p_cargo_concepto: F.mitad ? conceptoCargo() : null,
      p_metodo: F.forma === 'mes_a_mes' ? 'mes_a_mes' : 'ambos',
      // queda escrito en la cuota por qué paga menos
      p_descuento: (F.fam.length && F.dto > 0 && dtoQueCuadra() === F.dto)
        ? Math.round(F.dto * 100) + ' % (' + (F.dto >= 0.4 ? '3º o más' : '2º') + ' de la familia, con ' + F.fam.map(nombreDe).join(', ') + ')' : null
    });
    F.enviando = false;
    if (r.error){ F.err = humano(r.error, 'crear cobros de natación'); pintarForm(); return; }
    F.hecho = r.data || {};
    pintarForm();
  }
  function clickForm(ev){
    var t = ev.target; if (!t || !t.closest) return;
    if (t.closest('[data-cerrar]')){ cerrarForm(); return; }
    if (t.closest('[data-crear-ya]')){ crear(); return; }
    if (t.closest('[data-copiar-hecho]')){ if (F && F.hecho) copiar(F.hecho.enlace); return; }
    if (t.closest('[data-copiar-msg-hecho]')){ if (F && F.hecho) copiar(mensaje(F.x, F.hecho.enlace, datosHecho()), 'Mensaje copiado'); return; }
    if (t.closest('[data-recalcular]')){ F.cargoTocado = false; F.cargo = ''; pintarForm(); return; }
    var bd = t.closest('[data-dto]');
    if (bd && !bd.disabled && !F.hecho){   // descuento familiar: el importe sale de la tarifa
      F.dto = Number(bd.getAttribute('data-dto'));
      var tf = tarifaForm();
      if (tf != null){ F.importe = numTxt(conDescuento(tf, F.per, F.dto, F.x, F.socio)); F.impTocado = false; }
      F.err = null; pintarForm(); return;
    }
  }
  function inputForm(ev){
    var t = ev.target, k = t && t.getAttribute && t.getAttribute('data-f'); if (!k || !F || F.hecho) return;
    if (ev.type === 'change' && t.tagName === 'INPUT' && t.type !== 'checkbox' && t.type !== 'date') return;   // ya lo vio «input»
    if (k === 'importe'){ F.importe = t.value; F.impTocado = true; if (F.fam.length) F.dto = dtoQueCuadra(); }
    else if (k === 'per'){
      var antes = F.per; F.per = t.value;
      if (antes !== F.per && F.fam.length && F.dto != null && tarifaForm() != null){   // con descuento familiar: desde la tarifa del periodo
        F.importe = numTxt(conDescuento(tarifaForm(), F.per, F.dto, F.x, F.socio)); F.impTocado = false;
      } else if (antes !== F.per && !F.impTocado){   // trimestral = 3 × mensual − 15
        var iv = num(F.importe);
        if (iv != null && !isNaN(iv) && iv > 0) F.importe = numTxt(F.per === 'trimestral' ? 3 * iv - 15 : (iv + 15) / 3);
      }
    }
    else if (k === 'inicio'){ F.inicio = t.value; }
    else if (k === 'fin'){ F.fin = t.value; }
    else if (k === 'mitad'){ F.mitad = t.checked; if (F.mitad) F.inicio = mesSiguiente(F.alta || hoyISO()); }
    else if (k === 'alta'){ F.alta = t.value; if (F.alta) F.inicio = mesSiguiente(F.alta); }
    else if (k === 'ref'){ F.ref = t.value; F.refTocada = true; }
    else if (k === 'socio'){
      F.socio = t.checked;
      // si la cuota salió de la tarifa (no de la ficha) y no se ha tocado, se recalcula
      if (F.fam.length && F.dto != null && !F.impTocado && tarifaForm() != null){
        F.importe = numTxt(conDescuento(tarifaForm(), F.per, F.dto, F.x, F.socio));
      } else if (!F.impDeFicha && !F.impTocado){
        var pr = cuotaPropuesta({ tipo: F.x.tipo, dias: F.x.dias, es_socio: F.socio });
        if (pr != null) F.importe = numTxt(F.per === 'trimestral' ? 3 * pr - 15 : pr);
      }
    }
    else if (k === 'cargo'){ F.cargo = t.value; F.cargoTocado = true; }
    else if (k === 'forma'){ F.forma = t.value === 'mes_a_mes' ? 'mes_a_mes' : 'ambos'; }
    F.err = null;
    pintarForm();
  }

  // ======================================================================
  //  EVENTOS DE LA LISTA (delegados en el contenedor)
  // ======================================================================
  wrap.addEventListener('click', function(ev){
    var t = ev.target; if (!t || !t.closest) return;
    var b;
    if ((b = t.closest('[data-tipo]'))){
      S.tipo = b.getAttribute('data-tipo');
      try { history.replaceState(null, '', S.tipo ? '?tipo=' + encodeURIComponent(S.tipo) : location.pathname); } catch(e){}
      pintar(); return;
    }
    if ((b = t.closest('[data-rango]'))){ var rg = rango(b.getAttribute('data-rango')); S.exp.desde = rg[0]; S.exp.hasta = rg[1]; pintarExp(); return; }
    if ((b = t.closest('[data-exportar]'))){ if (!S.exp.cargando) exportar(); return; }
    if ((b = t.closest('[data-copiar]'))){ var x = porId(b.getAttribute('data-copiar')); if (x && x.enlace) copiar(x.enlace); return; }
    if ((b = t.closest('[data-copiar-msg]'))){ var xm = porId(b.getAttribute('data-copiar-msg')); if (xm && xm.enlace) copiar(mensaje(xm, xm.enlace, datosCobro(xm)), 'Mensaje copiado'); return; }
    if ((b = t.closest('[data-crear]'))){ abrirForm(b.getAttribute('data-crear')); return; }
    if ((b = t.closest('[data-anular]'))){ anular(b.getAttribute('data-anular')); return; }
    if ((b = t.closest('[data-guardar]'))){ guardarCuota(b.getAttribute('data-guardar')); return; }
    if ((b = t.closest('[data-deshacer]'))){ delete S.edit[b.getAttribute('data-deshacer')]; pintarFila(b.getAttribute('data-deshacer')); return; }
    if ((b = t.closest('[data-abrir]'))){
      var ia = b.getAttribute('data-abrir');
      if (S.abiertos[ia]) delete S.abiertos[ia]; else S.abiertos[ia] = true;
      pintarFila(ia); return;
    }
    if ((b = t.closest('[data-ficha]'))){
      var xf = porId(b.getAttribute('data-ficha'));
      if (xf && xf.codigo && window.APOLANA_NAT_FICHA){
        APOLANA_NAT_FICHA.abrir({ codigo: xf.codigo, nombre: nombreDe(xf), onCambio: function(){ cargar().then(pintarLista); } });
      }
      return;
    }
  });
  var qTmr = null;
  wrap.addEventListener('input', function(ev){
    var t = ev.target;
    if (t.id === 'cu-q'){ S.q = t.value; clearTimeout(qTmr); qTmr = setTimeout(pintarLista, 150); return; }
    var id = t.getAttribute && t.getAttribute('data-cuota');
    if (id){
      var x = porId(id); if (!x) return;
      var ed = S.edit[id] || { importe: x.cuota_importe == null ? '' : numTxt(x.cuota_importe), per: x.cuota_periodicidad === 'trimestral' ? 'trimestral' : 'mensual' };
      ed.importe = t.value; S.edit[id] = ed;
      // repinta la fila solo si cambia la botonera (aparece «Guardar» o cambia si está bien)
      var btn = wrap.querySelector('[data-guardar="' + id + '"]');
      var mal = num(ed.importe) == null || isNaN(num(ed.importe)) || num(ed.importe) < 0 || num(ed.importe) > 2000;
      if (!btn || btn.disabled !== mal) pintarFila(id);
    }
  });
  wrap.addEventListener('change', function(ev){
    var t = ev.target;
    if (t.id === 'cu-estado'){ S.estado = t.value; pintarLista(); return; }
    if (t.id === 'cu-desde' || t.id === 'cu-hasta'){ S.exp[t.id === 'cu-desde' ? 'desde' : 'hasta'] = t.value; pintarExp(); return; }
    var id = t.getAttribute && t.getAttribute('data-per');
    if (id){
      var x = porId(id); if (!x) return;
      var ed = S.edit[id] || { importe: x.cuota_importe == null ? '' : numTxt(x.cuota_importe), per: x.cuota_periodicidad === 'trimestral' ? 'trimestral' : 'mensual' };
      ed.per = t.value; S.edit[id] = ed; pintarFila(id);
    }
  });
  wrap.addEventListener('toggle', function(ev){ if (ev.target && ev.target.id === 'cu-exp') S.exp.abierto = ev.target.open; }, true);
  wrap.addEventListener('keydown', function(ev){
    var id = ev.target.getAttribute && ev.target.getAttribute('data-cuota');
    if (id && ev.key === 'Enter'){ ev.preventDefault(); guardarCuota(id); }
    if (id && ev.key === 'Escape'){ delete S.edit[id]; pintarFila(id); }
  });

  pintar();
  await cargar();
  pintar();
});
</script>
