<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona de familias · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/datos.js" defer></script>
<script src="../../assets/js/info-pagos.js" defer></script>
<script src="../../assets/js/descansos.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .fa-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  /* Cabecera de pantalla (kit 30h): sobre crema, sin barra de color.
     Migas a 14 px arriba y el título a 28 px justo debajo. */
  .fa-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; }
  /* «Familia Apolana» es nombre propio del club: ámbar, en texto y nunca
     sobre un bloque de fondo, para no confundirlo con un aviso. */
  .fa-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:32px; color: #8A5307; margin: 0; line-height:1; }
  .fa-cab .migas { display:block; font-size:14px; line-height:1.45; color: var(--texto-suave); margin:0 0 4px; }
  /* El relleno y el margen negativo se compensan: el enlace se ve donde
     estaba, pero la zona que responde al dedo mide 44 px. */
  .fa-cab .migas a { display:inline-block; padding:12px 4px; margin:-12px -4px; color: var(--texto-suave); text-decoration:none; }
  .fa-cab .migas a:hover { color: var(--navy); text-decoration:underline; }
  /* Plano y sin sombra: no se pulsa, así que no lleva sombra (34c) */
  .fa-cab .fa-ini { flex:none; width:40px; height:40px; border-radius:999px; background: var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family: var(--fuente-titulo); font-weight:700; font-size:15px; }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 210px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:2px; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:8px; }
  .side nav a { display:flex; align-items:center; min-height:44px; box-sizing:border-box; cursor:pointer; font-size:15px; color: var(--texto-suave); padding:11px 12px; border-radius:10px; text-decoration:none; border-bottom:2px solid transparent; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  /* El activo se marca con subrayado de 2 px, no con una píldora de fondo */
  .side nav a.activo { color: var(--navy); font-weight:600; border-bottom-color: var(--navy); border-radius:0; }
  .cont { flex:1 1 auto; min-width:0; }

  /* Radio de tarjeta: 14 px (kit 30b) */
  /* Sin sombra: lo que no se pulsa lleva borde, no sombra (34c) */
  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius:14px; padding: clamp(18px,3vw,26px); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size:21px; color: var(--navy); margin: 0 0 12px; }
  .tarjeta-cab { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .tarjeta-cab h2 { margin:0; }
  /* Se pulsa, así que mide 44 px de alto; el margen negativo lo deja donde estaba. */
  .enlace-mini { display:inline-flex; align-items:center; min-height:44px; padding:0 4px; margin:-11px -4px;
                 font-size:14px; font-weight:600; color: var(--azul-oscuro); text-decoration:none; }
  .enlace-mini:hover { color: var(--azul-hover); text-decoration:underline; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:13px; padding:3px 9px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); white-space:nowrap; }
  /* Verde solo para «está hecho» y mejoras de marca; ámbar para lo que
     hay que mirar; el ladrillo, para lo que de verdad va mal (31a). */
  .pill.ok { background:#EDF5EE; color:#3F7A4C; }
  .pill.warn { background:#FDF3E3; color:#8A5307; }
  .pill.bad { background:#F7ECE8; color:#B0563A; }

  /* Nombre propio de grupo (La Tribu, Madre Tierra, El Cubo): ámbar.
     Los genéricos —«Natación adultos»— se quedan en navy (bloque 31c). */
  .nom-grupo { font-weight:600; color:#8A5307; }
  /* Sobre navy, el ámbar de apoyo (31a) */
  /* La tarjeta navy del entrenamiento y la del recibo se han ido: el
     entrenamiento ya no se enseña aquí y los pagos se dicen en una
     línea. Sus estilos se van con ellas. */

  /* selector de hijos */
  .hijos-lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
  .hijo-card { text-align:left; cursor:pointer; background:#fff; border:1px solid var(--linea-marcada); border-radius:14px; padding:14px 16px; box-shadow: var(--sombra-suave); display:flex; flex-direction:column; gap:4px; transition:border-color .12s; }
  .hijo-card:hover { border-color: var(--azul-filete, #3B85C0); }
  .hijo-card.activo { background: var(--navy); border-color: var(--navy); }
  .hijo-card .hc-nombre { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; color: var(--navy); line-height:1.1; }
  .hijo-card.activo .hc-nombre { color:#fff; }
  .hijo-card .hc-meta { font-size:14px; color: var(--texto-suave); }
  .hijo-card.activo .hc-meta { color:#cdd6e0; }

  /* Ficha del atleta · patrón tabla-ficha (kit 30e).
     Rejilla fija: la inicial a la izquierda y el nombre con su línea de
     datos al lado. Así por debajo de 720 px no se descoloca ni aparece
     desplazamiento horizontal. */
  .ficha-cab { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:14px; align-items:center; }
  .ficha-cab .avatar { grid-column:1; }
  .ficha-cab .fc-txt { grid-column:2; min-width:0; }
  .avatar { width:56px; height:56px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background: var(--navy); color:#fff; font-family: var(--fuente-titulo); font-weight:700; font-size:18px;  }
  .avatar.chico { width:42px; height:42px; font-size:13px; }
  .ficha-cab .fc-txt { flex:1 1 200px; min-width:0; }
  /* En bloque: si no, el nombre y la categoría salían pegados en la misma línea */
  .ficha-cab .fc-nombre { display:block; font-family: var(--fuente-titulo); text-transform:uppercase; font-size:28px; color: var(--navy); line-height:1.1; margin-bottom:3px; }
  .ficha-cab .fc-linea { display:block; font-size:14px; color: var(--texto-suave); line-height:1.4; }

  /* nota del entrenador */
  .nota-fam { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px dashed var(--linea); }
  .nota-fam:last-child { border-bottom:none; padding-bottom:0; }
  .nota-fam:first-child { padding-top:0; }
  .nota-fam .nf-firma { font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); display:block; margin-bottom:3px; }
  .nota-fam p { margin:0; font-size:15px; color: var(--texto); line-height:1.55; }

  /* records */
  /* MARCAS (maqueta 37b) · una sola tarjeta navy por pantalla: la mejor marca.
     El resto de los datos, en listas de filas sobre crema. */
  .mejor { background: var(--navy); border-radius:14px; padding:16px 18px; display:flex; flex-direction:column; gap:11px; margin-bottom:14px; }
  .mejor .mj-et { font-size:14px; color: rgba(255,255,255,.62); }
  .mejor .mj-cifra { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .mejor .mj-dato { font-family: var(--fuente-dato); font-size:42px; font-weight:700; line-height:1; color:#fff; }
  .mejor .mj-prueba { font-size:16px; color: rgba(255,255,255,.7); }
  .mejor .mj-pie { display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-top:1px solid rgba(255,255,255,.16); padding-top:11px; }
  .mejor .mj-mejora { font-size:14px; color:#7FC08D; }
  .mejor .mj-donde { flex:1; text-align:right; font-size:14px; color: rgba(255,255,255,.6); }

  /* Lista de datos: UN solo contenedor con separadores (kit, punto 4) */
  .lista-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 7px; padding:0 2px; }
  .lista-tit .et { font-size:14px; color: var(--texto-suave); }
  .lista-tit .enl { background:none; border:0; padding:0; font:inherit; font-size:14px; font-weight:600; color: var(--azul-oscuro); cursor:pointer; text-decoration:none; white-space:nowrap; }
  .lista-caja { background:#fff; border:1px solid var(--linea); border-radius:14px; overflow:hidden; margin-bottom:14px; }
  .lista-fila { display:flex; align-items:center; gap:12px; min-height:48px; box-sizing:border-box; width:100%;
    padding:11px 15px; border:0; border-bottom:1px solid var(--linea); text-align:left; font:inherit; background:none; color:inherit; }
  .lista-fila:last-child { border-bottom:none; }
  .lista-fila .lf-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .lista-fila .lf-nom { font-size:15px; color: var(--navy); overflow-wrap:anywhere; }
  /* Máximo dos líneas por fila: si hiciera falta una tercera, sería una tarjeta */
  .lista-fila .lf-sub { font-size:14px; color: var(--texto-suave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lista-fila .lf-dato { flex:none; font-family: var(--fuente-dato); font-size:16px; color: var(--navy); }
  .lista-fila .lf-dif { flex:none; width:56px; text-align:right; font-size:14px; color: var(--texto-suave); }
  .lista-fila .lf-dif.mejora { color: var(--verde); font-weight:600; }
  /* «sin marca», nunca un guion: el guion hace dudar de si falta el dato */
  .lista-fila .lf-sin { flex:none; font-size:15px; color:#C4BCA9; }
  .lista-fila.sin .lf-nom { color: var(--texto-suave); }

  /* Descansos: el separador entre bloques y el de entre ejercicios de El Cubo.
     Si un bloque no lleva recuperación, no se pinta nada. */
  .bl-sep { display:flex; align-items:center; gap:10px; padding:2px 6px 8px; }
  .bl-sep i { flex:1; height:1px; background: var(--linea); }
  .bl-sep span { font-size:13px; color: var(--texto-suave); white-space:nowrap; }
  .bl-entre { font-size:13px; color: var(--texto-suave); padding:6px 0 0; }
  /* Volumen y tiempo, separados: se planifica la tarde con el tiempo */
  .ses-cifras { display:flex; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .ses-cifra { flex:1 1 0; min-width:120px; background: var(--crema-banda); border-radius:10px; padding:9px 12px; display:flex; flex-direction:column; gap:1px; }
  .ses-cifra b { font-family: var(--fuente-dato); font-weight:700; font-size:17px; color: var(--navy); }
  .ses-cifra span { font-size:13px; color: var(--texto-suave); }
  .fchip.nat { font-weight:600; }

  /* ---- Permiso para que el nombre salga en las clasificaciones ---- */
  .intro-perm { font-size:15px; line-height:1.55; color: var(--texto); margin:0 0 14px; max-width:62ch; }
  .perm-lista { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .perm-uno { border:1px solid var(--linea-marcada); border-radius:14px; padding:12px 14px; }
  .perm-estado { margin:6px 0 0; font-size:14px; color: var(--texto-suave); }
  .perm-estado.si { color: var(--verde); font-weight:600; }
  /* Un interruptor de verdad, no una casilla diminuta: se toca con el pulgar */
  .interruptor { display:flex; align-items:flex-start; gap:14px; cursor:pointer; padding:6px 0; min-height:44px; }
  .interruptor input { position:absolute; opacity:0; width:1px; height:1px; }
  .interruptor .palanca { flex:0 0 52px; width:52px; height:30px; border-radius:999px; background:#D9D2C2; position:relative; margin-top:2px; transition:background .15s; }
  .interruptor .palanca::after { content:''; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:999px; background:#fff; transition:transform .15s; }
  .interruptor input:checked + .palanca { background: var(--azul); }
  .interruptor input:checked + .palanca::after { transform: translateX(22px); }
  .interruptor input:focus-visible + .palanca { outline:2px solid var(--azul-filete, #3B85C0); outline-offset:3px; }
  .interruptor .texto { font-size:15px; line-height:1.45; color: var(--navy); font-weight:600; }
  .perm-detalle { border-top:1px solid var(--linea); padding-top:14px; }
  .perm-detalle b { display:block; font-size:14px; color: var(--navy); margin:10px 0 4px; }
  .perm-detalle ul { margin:0 0 4px; padding-left:20px; }
  .perm-detalle li { font-size:15px; line-height:1.5; color: var(--texto); margin-bottom:3px; }
  .perm-detalle p { font-size:15px; line-height:1.55; color: var(--texto); margin:12px 0 0; }

  /* Marcas: lista de filas (una tabla de 5 columnas se aplastaba en el móvil) */
  .mk-lista { display:flex; flex-direction:column; }
  .mk-fila { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--linea); }
  .mk-fila:last-child { border-bottom:none; }
  .mk-fila .mk-txt { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .mk-fila .mk-nom { font-size:15px; font-weight:600; color: var(--navy); }
  .mk-fila .mk-cuando { font-size:13px; color: var(--texto-suave); }
  .mk-fila .mk-der { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  /* La marca es un dato, no algo que se pulse: navy (bloque 31a) */
  .mk-fila .mk-marca { font-family: var(--fuente-dato); font-size:28px; font-weight:700; line-height:1; color: var(--navy); }
  .mk-fila .mk-tags { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }

  /* filas de próximos entrenamientos */
  .agenda { display:flex; flex-direction:column; }
  .btn-linea { cursor:pointer; font-family: inherit; background:#fff; border:1px solid #C9D9E7; color: var(--azul-oscuro); border-radius:999px; min-height:44px; padding:7px 16px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  .btn-linea:hover { background: var(--azul-suave); }
  .btn-linea.gris { border-color: var(--linea-borde); color: var(--texto-suave); font-weight:400; }
  .btn-linea.azul { background: var(--azul); border-color: var(--azul); color:#fff; }
  .btn-linea.azul:hover { background: var(--azul-hover, #1E4E78); }

  /* Próximos entrenos: fila compacta, fecha y título en la misma línea */
  .ent-fila { display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--linea); min-height:52px; }
  .ent-fila:last-child { border-bottom:none; }
  .ent-fila .ef-txt { flex:1 1 auto; min-width:0; }
  .ent-fila .ef-linea { display:block; font-size:15px; color: var(--navy); }
  .ent-fila .ef-cuando { font-weight:700; color: var(--navy); }
  .ent-fila .ef-sub { display:block; font-size:13px; color: var(--texto-suave); margin-top:2px; }
  .ent-fila .ef-acc { flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .enlace-accion { background:none; border:0; padding:0 2px; font:inherit; font-weight:600; font-size:14px; color: var(--azul-oscuro); cursor:pointer; min-height:44px; display:inline-flex; align-items:center; white-space:nowrap; }
  .enlace-accion:hover { color: var(--azul-hover); }

  /* Estado vacío con cuerpo: icono de línea, frase corta y salida */
  .vacio-caja { text-align:center; padding: clamp(18px,4vw,26px) 12px; }
  .vacio-caja .vc-ic { width:46px; height:46px; border-radius:50%; background: var(--crema-media); color: var(--texto-suave); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .vacio-caja .vc-ic svg { width:24px; height:24px; }
  .vacio-caja h3 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:21px; color: var(--navy); margin:0 0 6px; }
  .vacio-caja p { color: var(--texto-suave); font-size:14px; margin:0 0 14px; max-width:36ch; margin-left:auto; margin-right:auto; }
  .vacio-caja .btn, .vacio-caja .btn-linea { min-height:44px; display:inline-flex; align-items:center; }

  /* Inicio: la próxima sesión, destacada */

  /* Inicio: el recibo pendiente.
     Es un AVISO (bloque 31a), así que se reconoce por la forma: icono
     y fondo #FDF3E3. Pero va en la página, no flotando (kit 30g): el
     aviso flotante se reserva para lo que acabas de hacer. */
              background:#FDF3E3; border:1px solid var(--ambar-borde); border-radius:14px;
              padding:14px 16px; margin-bottom:12px; min-height:48px; box-sizing:border-box;
              font:inherit; cursor:pointer; }
  /* El importe sigue siendo un dato en columna: monoespaciada */
                      line-height:1; color:#8A5307; white-space:nowrap; }

  /* Pagos: el resumen, en dos cifras grandes encima de la tabla */
  .res-cifras { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .res-cifra { background: var(--crema); border:1px solid var(--linea); border-radius:14px; padding:12px 14px; }
  .res-cifra .rc-tit { display:block; font-family: var(--fuente-mono); font-size:13px;  text-transform:none; color: var(--texto-suave); }
  .res-cifra .rc-num { display:block; font-family: var(--fuente-dato); font-size:28px; font-weight:700; line-height:1.15; color: var(--navy); }
  .res-cifra.pend .rc-num { color: var(--navy); }
  .res-cifra.pend.hay { border-color:#EBC6C4; background:#FDF6F5; }
  .res-cifra.pend.hay .rc-num { color:#B23A38; }
  .pg-quien { font-size:15px; font-weight:600; color: var(--navy); margin:20px 0 2px; }

  /* Recibos · tabla que en móvil se vuelve ficha (kit 30e).
     Escritorio: concepto · cuándo · importe · estado, sin líneas
     verticales, con el importe a la derecha y en monoespaciada para
     poder sumarlos con la vista.
     Móvil (≤720 px): el concepto pasa a título, el estado se queda
     arriba a la derecha y el resto baja a una línea de datos. Nunca
     desplazamiento horizontal. */
  .rc-lista { display:flex; flex-direction:column; }
  .rc-fila { display:grid; grid-template-columns: minmax(0,1fr) auto auto auto;
             column-gap:14px; align-items:baseline; min-height:48px;
             padding:12px 2px; border-bottom:1px solid var(--linea); }
  .rc-fila:last-child { border-bottom:none; }
  .rc-fila .rc-nom { font-size:15px; font-weight:600; color: var(--navy); }
  .rc-fila .rc-cuando { font-size:14px; color: var(--texto-suave); white-space:nowrap; }
  .rc-fila .rc-imp { font-family: var(--fuente-dato); font-size:17px; font-weight:700;
                     color: var(--navy); text-align:right; white-space:nowrap; }
  .rc-fila .rc-estado { justify-self:end; }
  @media (max-width:720px){
    .rc-fila { grid-template-columns: minmax(0,1fr) auto; row-gap:4px; align-items:start; padding:13px 2px; }
    .rc-fila .rc-nom { grid-column:1; grid-row:1; }
    .rc-fila .rc-estado { grid-column:2; grid-row:1; }
    .rc-fila .rc-imp { grid-column:1; grid-row:2; text-align:left; }
    .rc-fila .rc-cuando { grid-column:2; grid-row:2; justify-self:end; align-self:center; }
    /* El estado, siempre arriba a la derecha: se parte en dos líneas
       antes que empujar el concepto fuera de la pantalla. */
    .rc-fila .rc-estado .pill { white-space:normal; text-align:right; }
  }

  /* Descuentos Familia Apolana: una línea con enlace, no una tarjeta entera */
  .desc-linea { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background: var(--crema); border:1px solid var(--linea); border-radius:10px; padding:12px 14px; margin-top:16px; font-size:14px; color: var(--texto); }
  .desc-linea a { display:inline-flex; align-items:center; min-height:44px; padding:0 4px; margin:-11px -4px;
                  font-weight:600; white-space:nowrap; }

  /* ---- lo que se lee una vez, plegado ----
     Manuales y explicaciones que se leen el primer día y luego estorban:
     el texto sigue entero, solo se pliega bajo un título que dice qué hay. */
  .plegable { background: var(--crema); border:1px solid var(--linea); border-radius:10px; overflow:hidden; margin:16px 0 0; }
  .plegable > summary { list-style:none; display:flex; align-items:center; gap:10px; min-height:44px;

      requestAnimationFrame(function(){ ov.classList.add('apx-in'); });
      function cerrar(v){ ov.classList.remove('apx-in'); document.removeEventListener('keydown',onkey); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); resolve(v); }
      function onkey(e){ if(e.key==='Escape'){ e.preventDefault(); cerrar(false);} else if(e.key==='Enter'){ e.preventDefault(); cerrar(true);} }
      bc.addEventListener('click',function(){ cerrar(false); });
      bo.addEventListener('click',function(){ cerrar(true); });
      ov.addEventListener('click',function(e){ if(e.target===ov) cerrar(false); });
      document.addEventListener('keydown',onkey);
      setTimeout(function(){ bo.focus(); },40);
    });
  }
  window.APX={ toast:toast, confirm:confirmar };
})();
</script>
</head>
<body>

<div id="portal-contenido">
  <div class="fa-wrap" id="fa-wrap"><div class="ap-esq" data-esq="tarjeta"></div></div>
</div>

<div id="hoja-recibos"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('fa-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  /* ---------- el error de un bloque, con salida ----------
     Cada consulta lleva su bandera de fallo. Sin ella, una consulta caída y
     una lista vacía de verdad se ven igual, y la pantalla acaba diciendo
     «no hay recibos» a quien sí los tiene. El botón NO recarga la página:
     repite solo lo que ha fallado, para no perder lo que haya escrito. */
  var REINTENTOS = {}, nReintento = 0;
  function htmlError(titulo, texto, fn){
    var k = 'r'+(++nReintento);
    if (fn) REINTENTOS[k] = fn;
    return APOLANA_UI.error(titulo, texto,
      fn ? '<button type="button" class="ap-btn" data-reintento="'+k+'">Volver a intentarlo</button>' : null);
  }
  document.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-reintento]') : null;
    if (!b) return;
    var fn = REINTENTOS[b.getAttribute('data-reintento')];
    if (!fn) return;
    b.disabled = true; b.textContent = 'Un momento…';
    fn();
  });

  if (!perfil) {
    /* Sin ficha no se llega a pintar la barra de abajo: la vuelta al portal
       va aquí dentro. «Escribir al club» lleva fuera del portal, así que no
       sirve de salida. */
    wrap.innerHTML = '<div class="tarjeta">'+ APOLANA_UI.vacio(
      'No encontramos tu ficha',
      'Tu cuenta existe, pero todavía no está enlazada con ninguna familia del club. Escribid al club y os la enlazan en un momento.',
      APOLANA_UI.boton('Escribir al club', '../../contacto/') +
      APOLANA_UI.volver()) +'</div>';
    return;
  }

  // ---------- helpers ----------
  var DIAS_C = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function d(iso){ if(!iso) return null; var x=new Date(String(iso).indexOf('T')>-1?iso:iso+'T00:00:00'); return isNaN(x.getTime())?null:x; }
  function formatFecha(iso){ var x=d(iso); return x? DIAS_C[x.getDay()]+' '+x.getDate()+' '+MESES_C[x.getMonth()] : ''; }
  function fechaCorta(iso){ var x=d(iso); return x? x.getDate()+' '+MESES_C[x.getMonth()] : ''; }
  function fechaLarga(iso){ var x=d(iso); return x? x.getDate()+' de '+MESES_L[x.getMonth()]+' de '+x.getFullYear() : ''; }
  function diaCorto(iso){ var x=d(iso); return x? DIAS_C[x.getDay()].toUpperCase()+' '+x.getDate()+'/'+(x.getMonth()+1) : ''; }
  function eur(n){ var v=parseFloat(n); return (isNaN(v)?0:v).toFixed(2).replace('.',',')+' €'; }
  function iniciales(nom,ape){ var a=(nom||'').trim().charAt(0), b=(ape||'').trim().charAt(0); return ((a+b)||'·').toUpperCase(); }
  function edad(iso){ var x=d(iso); if(!x) return null; var h=new Date(); var e=h.getFullYear()-x.getFullYear(); var m=h.getMonth()-x.getMonth(); if(m<0||(m===0&&h.getDate()<x.getDate())) e--; return e; }
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){ var p=s.split(':'); if(p.length>=3) return (parseInt(p[0],10)||0)*3600+(parseInt(p[1],10)||0)*60+(parseFloat(p[2])||0); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); } var n=parseFloat(s); return isNaN(n)?null:n; }
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  // Fecha de hoy en hora local: con toISOString() (UTC) entre medianoche y las 2
  // de la madrugada el portal creía que todavía era ayer.
  function isoLocal(x){ var q=x||new Date(); var m=q.getMonth()+1, dd=q.getDate(); return q.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  var todayISO = isoLocal();

  /* El estado venía tal cual de la base y se leía «impagado», en minúscula y
     sin tilde, que parece que la pantalla está a medio hacer. Aquí solo se
     escribe bien; cambiar la palabra en sí lo decide el club. */
  var ESTADO_PAGO = { pagado:'Pagado', impagado:'Impagado', pendiente:'Pendiente',
                      devuelto:'Devuelto', anulado:'Anulado' };
  function pillPago(estado){
    var e=(estado||'').toLowerCase();
    var cls = (e==='pagado') ? 'ok' : (e==='impagado' ? 'bad' : (e==='pendiente' ? 'warn' : ''));
    var txt = e ? (ESTADO_PAGO[e] || e.replace(/^./, function(c){ return c.toUpperCase(); })) : '—';
    return '<span class="pill '+cls+'">'+esc(txt)+'</span>';
  }
  /* El estado de los pagos se dice UNA vez y en un solo sitio: el aviso del
     recibo pendiente de Inicio, que además lleva el importe y abre la
     sección de Pagos. Antes se repetía en la tarjeta del hijo, en la ficha
     de marcas y en la lista de «Más», diciendo cuatro veces lo mismo. */

  // ---------- datos de la familia ----------
  /* Los hijos NO se piden aquí: la pantalla de acceso (portal-auth.js) ya
     ha tenido que pedir las fichas para saber qué puertas ofrecerle a esta
     persona, y las comparte. Antes se preguntaba dos veces lo mismo nada
     más entrar. Los campos vienen ya con lo que hace falta aquí; entre
     ellos `tipo_membresia`, para saber si a esta casa le toca la cuenta de
     la escuela o la del club en el bloque «Cómo se paga».
     De todas las fichas que llegan (la suya, las de sus hijos y las de los
     atletas que entrena, si además entrena) aquí solo valen los hijos. */
  var hijos = [], falloCarga = false;
  try {
    var r = await APOLANA_PORTAL.misAtletas();
    if (r.error) falloCarga = true;
    else hijos = r.data.filter(function(a){ return a.perfil_padre_id === perfil.id; });
  } catch (e) { falloCarga = true; }

  // Cabecera de pantalla (kit 30h): migas a 14 px, título a 28 px debajo.
  var cab = '<div class="fa-cab"><div>'+
    '<span class="migas"><a href="../">Portal</a> · Hola, '+esc(perfil.nombre||'')+'</span>'+
    '<h1>Familia Apolana</h1></div>'+
    /* Las iniciales ya están en el avatar de la barra de arriba: aquí
       sobraban, que es el mismo dato dicho dos veces en la misma pantalla. */
    '</div>';

  // Iconos de línea de 24 px, sin relleno, tal y como pide la maqueta 22c.
  var svg = function(p){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; };
  var icInicio  = svg('<path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>');
  var icEntreno = svg('<circle cx="15.5" cy="4.5" r="2"/><path d="M7 21l3-5.5 3.5-2.5-1-4.5-4 2-1.5 3"/><path d="M13.5 13l3.5 2 1.5 4"/>');
  var icAgenda  = svg('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>');
  var icMarcas  = svg('<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>');
  var icMas     = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';
  var icPagos   = svg('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/>');
  var icLuna    = svg('<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>');
  var icCrono   = svg('<circle cx="12" cy="14" r="7"/><path d="M12 14V10M10 3h4M18.5 7l1.4-1.4"/>');
  var icNota    = svg('<path d="M20 15a3 3 0 0 1-3 3H9l-4 3v-3a3 3 0 0 1-1-2.2V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/>');

  // Si la consulta se ha caído no se puede decir «no tienes hijos»:
  // se dice que no se ha podido cargar, en ámbar y con salida (28f).
  /* En los dos casos de abajo la pantalla se queda sin barra: la vuelta al
     portal va dentro del aviso, que si no desde aquí no se sale. */
  var salidaPortal = '<p style="margin-top:14px">' + APOLANA_UI.volver() + '</p>';
  if (falloCarga) {
    wrap.innerHTML = cab + '<div class="tarjeta" style="margin-top:18px;">'+
      APOLANA_UI.error('No hemos podido cargar vuestra ficha',
        'Puede ser la conexión. Vuelve a intentarlo en un momento; si sigue igual, avisad al club.') +
      salidaPortal +'</div>';
    return;
  }
  if (!hijos.length) {
    wrap.innerHTML = cab + '<div class="tarjeta" style="margin-top:18px;">'+
      APOLANA_UI.vacio('Todavía no hay nadie enlazado a vuestra cuenta',
        'En cuanto el club enlace a vuestro hijo o hija, aquí veréis su entrenamiento, sus marcas y sus recibos. Si creéis que es un error, escribidnos.',
        APOLANA_UI.boton('Escribir al club', '../../contacto/')) +
      salidaPortal +'</div>';
    return;
  }

  var IDS = hijos.map(function(h){ return h.id; });
  var nombreHijo = {}; hijos.forEach(function(h){ nombreHijo[h.id] = ((h.nombre||'')+' '+(h.apellidos||'')).trim(); });

  /* ---------- BONO DE EL CUBO ----------
     Los usos que quedan, para leerlos en la fila de «Más» sin entrar. Se
     guardan por hijo: con más de uno, un número solo no diría de quién es,
     así que en ese caso la fila no lleva cifra y el reparto se ve dentro,
     que es donde está el selector de hijo. Si la consulta falla no se pinta
     un 0: eso se leería como «no te quedan usos». */
  var USOS_CUBO = null;
  (async function cargarBonoCubo(){
    if (!IDS.length) return;
    var r = await sb.from('cubo_bono_saldo').select('atleta_id,usos_disponibles,activo,caducado').in('atleta_id', IDS);
    if (r.error || !r.data) return;
    var porHijo = {};
    r.data.forEach(function(b){
      if (!b.activo || b.caducado) return;
      porHijo[b.atleta_id] = (porHijo[b.atleta_id] || 0) + (b.usos_disponibles || 0);
    });
    var conBono = Object.keys(porHijo);
    if (conBono.length === 1) USOS_CUBO = porHijo[conBono[0]];
    if (SEC === 'mas') pintar();
  })();

  /* Los pedidos de ropa de esta casa, para la fila de «Ropa del club» sin
     tener que entrar. La política de la base deja ver los pedidos propios
     (`perfil_id = mi_perfil_id()`). Si la consulta falla, la fila se queda
     sin cifra: mejor sin dato que con un cero que se lee como «nada
     pendiente». */
  var ROPA_PREP = null;
  (async function cargarPedidos(){
    try {
      var r = await sb.from('pedidos').select('id,estado').eq('perfil_id', perfil.id);
      if (r.error || !r.data) return;
      ROPA_PREP = r.data.filter(function (x) {
        return ['pendiente', 'preparando', 'listo'].indexOf((x.estado || '').toLowerCase()) !== -1;
      }).length;
      if (SEC === 'inicio') pintar();
    } catch (e) { /* sin cifra, la fila sigue llevando a la tienda */ }
  })();

  /* ----------------------------------------------------------
     PERMISO PARA LAS CLASIFICACIONES PÚBLICAS
     El club publica récords, palmarés y el ranking por prueba. El
     nombre de un menor no sale ahí sin que su familia lo autorice,
     y esa autorización se pide desde esta pantalla.
     Quién es menor lo decide la base con `juego_es_menor()`: no se
     usa otro criterio. Si la llamada falla se aplica la misma regla
     que tiene la función (sin fecha de nacimiento, o menos de 18).
     ---------------------------------------------------------- */
  var JUEGO = {}, falloJuego = false;   // { atleta_id: {autoriza_parental_por, autoriza_parental_en} }
  async function cargarJuego(){
    JUEGO = {}; falloJuego = false;
    try {
      var pj = await sb.from('perfil_juego').select('atleta_id,autoriza_parental_por,autoriza_parental_en').in('atleta_id', IDS);
      falloJuego = !!pj.error;
      if (!pj.error && pj.data) pj.data.forEach(function(x){ JUEGO[x.atleta_id] = x; });
    } catch (e) { falloJuego = true; }
  }
  await cargarJuego();
  var ES_MENOR = {};
  for (var iM = 0; iM < hijos.length; iM++) {
    var hM = hijos[iM], resM = null;
    try { resM = await sb.rpc('juego_es_menor', { p_fnac: hM.fecha_nacimiento || null }); } catch (e) {}
    if (resM && !resM.error && typeof resM.data === 'boolean') ES_MENOR[hM.id] = resM.data;
    else ES_MENOR[hM.id] = !hM.fecha_nacimiento ||
      (new Date(hM.fecha_nacimiento + 'T00:00:00') > new Date(new Date().setFullYear(new Date().getFullYear() - 18)));
  }
  function autorizado(id){ return !!(JUEGO[id] && JUEGO[id].autoriza_parental_en); }
  function menoresCasa(){ return hijos.filter(function(h){ return ES_MENOR[h.id]; }); }

  /* Grupos (lectura pública): nombre y horario.
     Tampoco se piden aquí: los trae la pantalla de acceso, que ya los
     necesita para saber si esta persona lleva algún grupo. De los del
     club entero nos quedamos con los de nuestros hijos. */
  var grupos = {}, falloGrupos = false;
  var gids = hijos.map(function(h){return h.grupo_id;}).filter(function(v,i,a){return v && a.indexOf(v)===i;});
  if (gids.length) {
    try {
      var g = await APOLANA_PORTAL.grupos();
      falloGrupos = !!g.error;
      /* En la escuela hay dos grupos con cada nombre, uno de lunes y
         miércoles y otro de martes y jueves. A un padre, «Azul 2» a
         secas no le dice qué días lleva a su hijo; con los días, sí.
         Se trabaja sobre una COPIA: la fila es la misma que ven las
         demás pantallas y cambiarle el nombre allí sería cambiárselo a
         todo el mundo. */
      if(!g.error) g.data.forEach(function(x){
        if (gids.indexOf(x.id) === -1) return;
        var gr = { id:x.id, nombre:x.nombre, horario:x.horario, turno:x.turno };
        if (gr.turno && window.APOLANA_GRUPO_NOMBRE) gr.nombre = window.APOLANA_GRUPO_NOMBRE(gr);
        grupos[gr.id]=gr;
      });
    } catch(e){ falloGrupos = true; }
  }
  /* Sin poder leer los grupos, «Sin grupo asignado» sería mentira: se dice
     que no se ha podido cargar. */
  function sinGrupo(){ return falloGrupos ? 'Grupo sin cargar' : 'Sin grupo asignado'; }

  // Pagos de todos los hijos
  var pagosPorHijo = {}; var pagosTodos = []; var falloPagos = false;
  async function cargarPagos(){
    pagosPorHijo = {}; pagosTodos = []; falloPagos = false;
    try {
      var pp = await sb.from('pagos').select('id,atleta_id,concepto,importe,estado,fecha_vencimiento,fecha_pago,notas').in('atleta_id', IDS).order('fecha_vencimiento',{ascending:false});
      falloPagos = !!pp.error;
      if(!pp.error && pp.data){ pagosTodos = pp.data; pp.data.forEach(function(x){ (pagosPorHijo[x.atleta_id]=pagosPorHijo[x.atleta_id]||[]).push(x); }); }
    } catch(e){ falloPagos = true; }
  }
  await cargarPagos();
  async function reintentarPagos(){ await cargarPagos(); pintar(); }

  // Cómo se paga: los datos bancarios del club, que solo se pueden leer con
  // la sesión iniciada. Se piden aquí una vez y luego el bloque se pinta sin
  // esperar a nada. Si la consulta falla, el bloque sencillamente no sale.
  if(window.APOLANA_INFO_PAGOS){ try { await APOLANA_INFO_PAGOS.cargar(sb); } catch(e){} }

  // Tienda del club
  var productos = [], falloProductos = false;
  async function cargarProductos(){
    productos = []; falloProductos = false;
    try {
      var pr = await sb.from('productos').select('nombre,descripcion,precio,tallas_disponibles,imagen_url').eq('activo',true).order('nombre').limit(6);
      falloProductos = !!pr.error;
      if(!pr.error && pr.data) productos = pr.data;
    } catch(e){ falloProductos = true; }
  }
  await cargarProductos();
  async function reintentarProductos(){ await cargarProductos(); pintar(); }

  // Competiciones que vienen (la inscripción se hace en la página de competiciones)
  var comps = [], falloComps = false;
  async function cargarComps(){
    comps = []; falloComps = false;
    try {
      var cc = await sb.from('competiciones').select('id,nombre,sede,fecha_inicio,inscripcion_abierta,fecha_limite_interna').gte('fecha_inicio', todayISO).order('fecha_inicio').limit(4);
      falloComps = !!cc.error;
      if(!cc.error && cc.data) comps = cc.data;
    } catch(e){ falloComps = true; }
  }
  await cargarComps();
  async function reintentarComps(){ await cargarComps(); pintar(); }

  // Aviso del club y noticias recientes: alimentan Inicio y la pantalla «Más»
  var AVISO = null, falloAviso = false;
  try {
    var av = await sb.from('avisos').select('texto,tipo,enlace,texto_enlace').eq('activo',true).order('created_at',{ascending:false}).limit(1);
    falloAviso = !!av.error;
    if(!av.error && av.data && av.data.length && av.data[0].texto) AVISO = av.data[0];
  } catch(e){ falloAviso = true; }
  var NOTIS = 0;
  try {
    var hace30 = isoLocal(new Date(Date.now()-30*86400000));
    var nn = await sb.from('noticias').select('id').eq('publicada',true).gte('fecha_publicacion',hace30).limit(20);
    if(!nn.error && nn.data) NOTIS = nn.data.length;
  } catch(e){}

  // ---------- datos por hijo (se cargan al entrar y se refrescan al avisar) ----------
  var D = {};
  async function cargarHijo(hid){
    var hijo = null; hijos.forEach(function(h){ if(h.id===hid) hijo=h; });
    /* Una bandera por consulta: lo que no se ha podido mirar no se puede
       contar como «no hay nada». */
    var dat = { proximas:[], ausencias:[], notas:[], marcas:[],
                falloProximas:false, falloAusencias:false,
                falloNotas:false, falloMarcas:false };

    if (hijo && hijo.grupo_id) {
      try {
        /* CUÁNDO entrena, no QUÉ entrena.
           El club ha decidido que una familia no ve el contenido del
           entrenamiento ni el feedback de su hijo. Eso está cerrado en la
           base (migración 100), así que esta pantalla ya no puede pedir
           `sesiones`: le respondería vacío.
           Lo que sí necesita —el día, la hora, el sitio y cómo se llama,
           para saber cuándo hay que ir y para poder avisar de una falta—
           sale de la vista `sesiones_agenda`, que solo expone eso y nunca
           los bloques ni la nota del entrenador. Es la misma que usa el
           calendario público del club. */
        var pr = await sb.from('sesiones_agenda').select('id:sesion_id,fecha,hora,titulo,tipo,rol,deporte,deporte_2,papel_dia,lugar').eq('grupo_id',hijo.grupo_id).gte('fecha',todayISO).order('fecha',{ascending:true}).limit(6);
        dat.falloProximas = !!pr.error;
        if(!pr.error && pr.data) dat.proximas = pr.data;
      } catch(e){ dat.falloProximas = true; }
    }
    try {
      var au = await sb.from('ausencias').select('id,fecha,motivo,sesion_id,avisado_por,avisado_por_nombre').eq('atleta_id',hid).gte('fecha',todayISO).order('fecha',{ascending:true});
      dat.falloAusencias = !!au.error;
      if(!au.error && au.data) dat.ausencias = au.data;
    } catch(e){ dat.falloAusencias = true; }
    try {
      var nf = await sb.from('notas_familia').select('id,fecha,texto,autor_nombre').eq('atleta_id',hid).eq('visible',true).order('fecha',{ascending:false}).limit(5);
      dat.falloNotas = !!nf.error;
      if(!nf.error && nf.data) dat.notas = nf.data;
    } catch(e){ dat.falloNotas = true; }
    try {
      var mm = await sb.from('marcas_atleta').select('prueba,tiempo_display,fecha,sede,tipo,contexto').eq('atleta_id',hid).order('fecha',{ascending:false}).limit(80);
      dat.falloMarcas = !!mm.error;
      if(!mm.error && mm.data) dat.marcas = mm.data;
    } catch(e){ dat.falloMarcas = true; }

    D[hid] = dat;
    return dat;
  }
  /* Reintentar lo del hijo que se está mirando, sin recargar la página. */
  async function reintentarHijo(){ await cargarHijo(HIJO); pintar(); }

  // ---------- trozos de pantalla ----------
  function fichaHTML(hijo, dat){
    var gr = hijo.grupo_id ? grupos[hijo.grupo_id] : null;
    // El nombre propio del grupo (La Tribu, Madre Tierra…) va en ámbar:
    // así se ve de un vistazo qué tiene identidad y qué es una categoría.
    var linea = esc(hijo.categoria || 'Sin categoría') + ' · ' +
      (gr ? '<b class="nom-grupo">'+esc(gr.nombre)+'</b>' : esc(sinGrupo())) +
      (gr && gr.horario ? ' · '+esc(gr.horario) : '');
    var e = edad(hijo.fecha_nacimiento);

    /* Aquí no va el estado de los pagos: esto son sus marcas, y el dinero
       ya se dice en Inicio, en su aviso, con el importe y con salida. */
    var html = '<div class="tarjeta"><div class="ficha-cab">'+
      '<span class="avatar">'+esc(iniciales(hijo.nombre,hijo.apellidos))+'</span>'+
      '<span class="fc-txt"><span class="fc-nombre">'+esc(nombreHijo[hijo.id])+'</span>'+
      '<span class="fc-linea">'+linea+'</span></span>'+
      '</div>';
    if (e != null && e >= 14) {
      /* Esta frase decía que aquí se ven «los entrenamientos publicados», y
         ya no es verdad: el club ha decidido que el entrenamiento y el
         feedback son del atleta y su entrenador, a cualquier edad, y así
         está cerrado en la base (migración 100). Lo que sigue dependiendo
         de la edad es tener cuenta propia, que es lo que dice el aviso. */
      html += '<p class="aviso-caja" style="margin-top:14px;margin-bottom:0;">A partir de los 14 años '+esc(hijo.nombre||'')+' tiene su propia cuenta en el portal. Aquí seguís viendo los pagos, el calendario, sus marcas y las faltas; el entrenamiento y lo que hable con su entrenador son suyos.</p>';
    }
    html += '</div>';

    // La nota del entrenador vive en Inicio; aquí no se repite.
    html += marcasHTML(dat.marcas, dat.falloMarcas);
    return html;
  }

  // «Cómo va X»: la nota del entrenador, lo que más quiere leer una familia
  function notasHTML(hijo, dat){
    var titulo = 'Cómo va '+(hijo.nombre||'');
    // Si la consulta se ha caído no se dice «aún no hay notas»: puede haberlas.
    if (dat.falloNotas) {
      return '<div class="tarjeta"><h2>'+esc(titulo)+'</h2>'+
        htmlError('No hemos podido cargar las notas de su entrenador',
          'Puede ser la conexión. Lo que haya escrito sigue ahí; volved a intentarlo en un momento.',
          reintentarHijo)+'</div>';
    }
    var notas = dat.notas.length
      ? dat.notas.map(function(n){
          return '<div class="nota-fam"><span class="avatar chico">'+esc(iniciales(n.autor_nombre, (n.autor_nombre||'').split(' ')[1]))+'</span>'+
            '<span><span class="nf-firma">'+esc(n.autor_nombre||'Equipo técnico')+' · '+esc(fechaCorta(n.fecha))+'</span>'+
            '<p>'+esc(n.texto)+'</p></span></div>';
        }).join('')
      : '<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icNota+'</div>'+
        '<h3>Aún no hay notas</h3>'+
        '<p>Cuando su entrenador escriba cómo va '+esc(hijo.nombre||'')+', lo leeréis aquí.</p></div>';
    return '<div class="tarjeta"><h2>'+esc(titulo)+'</h2>'+notas+'</div>';
  }

  /* MARCAS (maqueta 37b) · una sola tarjeta navy —la mejor marca— y el resto en
     listas de filas. Antes había una tarjeta navy por prueba y ninguna anclaba.
     Y donde no hay dato pone «sin marca», nunca un guion. */
  function marcasHTML(rows, fallo){
    // Primero, si se ha podido mirar. Un fallo no es «todavía no hay marcas».
    if(fallo) return '<div class="tarjeta"><h2>Marcas</h2>'+
      htmlError('No hemos podido cargar sus marcas',
        'Puede ser la conexión. Sus tiempos siguen guardados; volved a intentarlo en un momento.',
        reintentarHijo)+'</div>';
    if(!rows || !rows.length) return '<div class="tarjeta"><h2>Marcas</h2>'+
      '<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icCrono+'</div>'+
      '<h3>Todavía no hay marcas</h3>'+
      '<p>En cuanto compita o registre un tiempo en el entrenamiento, aparecerá aquí con su récord.</p></div></div>';
    var porPrueba={}; rows.forEach(function(x){ var k=x.prueba||'Prueba sin nombre'; (porPrueba[k]=porPrueba[k]||[]).push(x); });
    function difTexto(seg, mas){ var s=Math.abs(seg); return (mas?'+':'−')+(s<60?s.toFixed(2):s.toFixed(2)); }

    // la mejor de cada prueba y su diferencia con la anterior
    var claves=Object.keys(porPrueba).sort();
    var mejores={};
    claves.forEach(function(k){
      var mas=pruebaEsDistancia(k), best=null, seg=null;
      porPrueba[k].forEach(function(x){
        var y=tiempoANum(x.tiempo_display); if(y==null) return;
        if(best==null||(mas?y>best.y:y<best.y)){ seg=best; best={y:y,disp:x.tiempo_display||'',fecha:x.fecha,sede:x.sede}; }
        else if(seg==null||(mas?y>seg.y:y<seg.y)) seg={y:y,disp:x.tiempo_display||'',fecha:x.fecha};
      });
      if(best) mejores[k]={ mas:mas, best:best, segunda:seg };
    });

    // LA tarjeta navy: el récord más reciente
    var top=null;
    claves.forEach(function(k){
      var m=mejores[k]; if(!m) return;
      if(!top || (m.best.fecha||'')>(top.m.best.fecha||'')) top={k:k, m:m};
    });
    var mejorHtml='';
    if(top){
      var donde=[top.m.best.sede, fechaCorta(top.m.best.fecha)].filter(Boolean).join(' · ');
      var g=top.m.segunda ? (top.m.mas ? top.m.best.y-top.m.segunda.y : top.m.segunda.y-top.m.best.y) : null;
      mejorHtml='<div class="mejor">'+
        '<span class="mj-et">Su mejor marca</span>'+
        '<div class="mj-cifra"><span class="mj-dato">'+esc(top.m.best.disp)+'</span>'+
        '<span class="mj-prueba">'+esc(top.k)+'</span></div>'+
        '<div class="mj-pie">'+
          ((g!=null&&g>0.001)?'<span class="mj-mejora">'+esc(difTexto(g, top.m.mas))+' sobre la anterior</span>':'')+
          '<span class="mj-donde">'+esc(donde)+'</span>'+
        '</div></div>';
    }

    var porPruebaHtml='<div class="lista-tit"><span class="et">Por prueba</span></div><div class="lista-caja">'+
      claves.map(function(k){
        var m=mejores[k];
        if(!m) return '<div class="lista-fila sin"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
          '<span class="lf-sin">sin marca</span><span class="lf-dif"></span></div>';
        var g=m.segunda ? (m.mas ? m.best.y-m.segunda.y : m.segunda.y-m.best.y) : null;
        var dif = (g!=null&&g>0.001) ? '<span class="lf-dif mejora">'+esc(difTexto(g, m.mas))+'</span>'
                                     : '<span class="lf-dif">'+(m.segunda?'=':'')+'</span>';
        return '<div class="lista-fila"><span class="lf-txt"><span class="lf-nom">'+esc(k)+'</span></span>'+
          '<span class="lf-dato">'+esc(m.best.disp)+'</span>'+dif+'</div>';
      }).join('')+'</div>';

    var tipoLabel={mmp:'mejor personal',temporada:'temporada',objetivo:'objetivo'};
    var ultimas='<div class="lista-tit"><span class="et">Últimas marcas</span></div><div class="lista-caja">'+
      rows.slice(0,8).map(function(x){
        var etq=[fechaCorta(x.fecha), x.sede,
                 x.contexto==='competicion'?'competición':(x.contexto==='entreno'?'entrenamiento':''),
                 x.tipo?(tipoLabel[x.tipo]||x.tipo):''].filter(Boolean).join(' · ');
        return '<div class="lista-fila"><span class="lf-txt"><span class="lf-nom">'+esc(x.prueba||'Prueba sin nombre')+'</span>'+
          (etq?'<span class="lf-sub">'+esc(etq)+'</span>':'')+'</span>'+
          (x.tiempo_display?'<span class="lf-dato">'+esc(x.tiempo_display)+'</span>':'<span class="lf-sin">sin marca</span>')+'</div>';
      }).join('')+'</div>';

    return mejorHtml+porPruebaHtml+ultimas;
  }

  /* Módulo compartido de descansos: es quien escribe «rec 2' trote»,
     «salida 1'00"» o «desc. 2'» según la disciplina. Aquí solo se lee. */
  function DESC(){ return window.APOLANA_DESCANSOS || null; }
  function piezasFila(f, dis){
    var D=DESC();
    if(D && dis){ try { return D.partesFila(f, dis)||[]; } catch(e){} }
    var p=[];
    if(f.series&&f.distancia) p.push(f.series+' × '+f.distancia);
    else if(f.series) p.push(f.series+' series'); else if(f.distancia) p.push(String(f.distancia));
    if(f.ritmo) p.push('ritmo '+f.ritmo);
    if(f.descanso) p.push('rec. '+f.descanso);
    return p;
  }
  /* En natación «salida cada X» y «descanso de X» son cosas distintas: el
     módulo da la palabra y el color de cada una para que no se confundan. */
  function chipNatacion(f, dis){
    var D=DESC(); if(!D || dis!=='natacion') return '';
    var et=null;
    try { et=D.etiquetaNatacion(D.recDeFila(f, dis)); } catch(e){ return ''; }
    if(!et) return '';
    return '<span class="fchip nat" title="'+esc(et.ayuda||'').replace(/"/g,'&quot;')+'" style="color:'+et.color+';background:'+et.fondo+';border:1px solid '+et.borde+'">'+
           esc(et.texto)+' '+esc(et.valor)+'</span>';
  }
  /* Volumen y tiempo, separados: «2.000 m» y «~55'». Una familia planifica la
     tarde con el tiempo, no con los metros. Si no se puede saber la duración,
     se enseña solo el volumen; nunca se inventa una hora de vuelta. */
  /* Aquí vivían las piezas que pintaban el entrenamiento para la familia:
     los bloques, cada ejercicio, las cifras del día y la nota del
     entrenador. El club ha decidido que una familia no ve eso, y la
     migración 100 lo cierra en la base. Se quitan enteras en vez de
     dejarlas sin llamar: si se quedan, alguien las vuelve a enchufar y la
     pantalla pediría un dato que ya no le van a dar. */

  /* Lo que guarda la base («activacion», «continuo», «gym», «ultimo_toque_48h»)
     no se enseña tal cual: un padre no tiene por qué saber qué es «activacion»,
     y en minúscula y sin tilde parece que la pantalla está rota. Son los mismos
     nombres que ya usa la pantalla del entrenador. */
  var TIPO_SESION = { pista:'Pista', gym:'Gimnasio', continuo:'Rodaje', activacion:'Activación',
                      competicion:'Competición', descanso:'Descanso' };
  var ROL_SESION  = { calidad_fuerte:'Calidad fuerte', secundaria:'Secundaria', activacion:'Activación',
                      ultimo_toque_48h:'Último toque (48h)', descarga:'Descarga', competicion:'Competición' };
  /* Los dos ejes nuevos (migración 102). El deporte es lo que un padre necesita
     de verdad para preparar la bolsa: si el día es de fuerza y de atletismo,
     hacen falta las dos cosas y por eso se dicen las dos. */
  var DEPORTE_SESION = { atletismo:'Atletismo', natacion:'Natación', fuerza:'Fuerza', cubo:'El Cubo' };
  var PAPEL_SESION   = { ajuste:'Ajuste', carga:'Carga', impacto:'Impacto', recuperacion:'Recuperación',
                         activacion:'Activación', tapering:'Tapering', competicion:'Competición',
                         descanso:'Descanso', rehabilitador:'Rehabilitador' };
  function enLimpio(mapa, v){
    if (!v) return '';
    return mapa[v] || String(v).replace(/_/g, ' ').replace(/^./, function(c){ return c.toUpperCase(); });
  }
  function nombreTipo(t){ return enLimpio(TIPO_SESION, t); }
  function nombreRol(r){ return enLimpio(ROL_SESION, r); }
  function nombrePapel(p){ return enLimpio(PAPEL_SESION, p); }
  /* «Fuerza y atletismo», con los dos dichos, o el tipo de siempre si el
     entrenamiento es anterior a la separación de los dos ejes. */
  function nombreDeportes(s){
    var a = enLimpio(DEPORTE_SESION, s && s.deporte);
    var b = enLimpio(DEPORTE_SESION, s && s.deporte_2);
    if (a && b) return a+' y '+b.toLowerCase();
    return a || b || nombreTipo(s && s.tipo);
  }

  var MOTIVOS = ['Está malo', 'Cita médica', 'Asunto familiar', 'Estudios o exámenes', 'Viaje', 'Molestia o lesión', 'Otro'];
  // Solo se puede retirar un aviso que dio esta misma cuenta
  function esMio(a){ return !a.avisado_por || a.avisado_por === perfil.id; }
  /* «Entrenamiento de pista», nunca «sesión». Descanso y competición se dicen
     por su nombre: «Entrenamiento de descanso» se contradice a sí mismo. */
  function tituloSesion(s){
    if (s.titulo) return s.titulo;
    var papel = s.papel_dia || s.tipo;
    if (papel === 'descanso' || papel === 'competicion') return nombrePapel(papel);
    var dep = nombreDeportes(s);
    return dep ? ('Entrenamiento de '+dep.toLowerCase()) : 'Entrenamiento';
  }

  /* Los tres datos de la tarjeta del entreno: series, ritmo y RECUPERACIÓN.
     Antes salía el ritmo pero no la recuperación, que es lo que de verdad
     define la sesión: 6×800 con 90" no es 6×800 con 3'. */

  // ---------- INICIO (maqueta 22a): solo hoy y lo pendiente ----------
  function inicioHTML(hijo, dat){
    var gr = hijo.grupo_id ? grupos[hijo.grupo_id] : null;
    var avisoDe = {}; dat.ausencias.forEach(function(a){ avisoDe[a.fecha] = a; });
    var html = '';

    /* ---------- 1 · LA ACCIÓN PRINCIPAL, Y ARRIBA ----------
       Avisar de una falta es lo que más hace una familia. Estaba en tercera
       posición, detrás de dos bloques que solo se leen. */
    html += '<button type="button" class="fa-accion" data-sec="entrenos">'+
      '<span aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>Avisar de una falta</button>';

    /* ---------- 2 · LOS PAGOS, EN UNA LÍNEA ----------
       Es el ÚNICO sitio donde se dice cómo van. Si no se han podido leer,
       callar se leería como «no debéis nada», y en dinero eso no puede pasar. */
    if (falloPagos) {
      html += htmlError('No hemos podido ver vuestros recibos',
        'Puede ser la conexión. Esto no quiere decir que estéis al día: volved a intentarlo en un momento.',
        reintentarPagos);
    } else {
      var deb = pagosTodos.filter(function(x){ var e=(x.estado||'').toLowerCase(); return e==='pendiente'||e==='impagado'; });
      var estado, sig = '', clase = '';
      if (deb.length) {
        clase = ' pend';
        estado = deb.length===1 ? '1 recibo pendiente' : deb.length+' recibos pendientes';
        var suma = deb.reduce(function(a,x){ return a+(parseFloat(x.importe)||0); }, 0);
        /* El más cercano de los que se deben: es el que hay que mirar. */
        var prim = deb.slice().sort(function(a,b){
          return String(a.fecha_vencimiento||'9999').localeCompare(String(b.fecha_vencimiento||'9999'));
        })[0];
        sig = [prim && prim.fecha_vencimiento ? fechaCorta(prim.fecha_vencimiento) : '', suma>0 ? eur(suma) : '']
          .filter(Boolean).join(', ');
      } else {
        estado = 'Pagos al día';
        /* El siguiente que va a llegar, si se sabe cuál es. */
        var futuros = pagosTodos.filter(function(x){
          return x.fecha_vencimiento && x.fecha_vencimiento >= todayISO && (x.estado||'').toLowerCase()!=='pagado';
        }).sort(function(a,b){ return String(a.fecha_vencimiento).localeCompare(String(b.fecha_vencimiento)); });
        if (futuros.length) {
          sig = fechaCorta(futuros[0].fecha_vencimiento)+
                (parseFloat(futuros[0].importe) ? ', '+eur(parseFloat(futuros[0].importe)) : '');
        }
      }
      html += '<button type="button" class="fa-pagos'+clase+'" data-sec="pagos">'+
        '<span class="fp-est">'+esc(estado)+'</span>'+
        '<span class="fp-sig">'+esc(sig)+'</span>'+
        '<span class="fp-chev" aria-hidden="true">&rsaquo;</span></button>';
    }

    /* ---------- 3 · el aviso del club, si lo hay ---------- */
    if (AVISO) {
      var enlA = AVISO.enlace ? (/^https?:\/\//.test(AVISO.enlace) ? AVISO.enlace : '../../'+String(AVISO.enlace).replace(/^\//,'')) : '';
      html += '<div class="franja azul"'+(enlA?' data-url="'+esc(enlA)+'"':'')+'>'+
        '<span class="fr-ic" aria-hidden="true">'+APOLANA_UI.icono('aviso',20)+'</span>'+
        '<span class="fr-txt">'+esc(AVISO.texto)+'</span>'+
        (enlA?'<span class="fr-acc">'+esc(AVISO.texto_enlace||'Ver')+'</span>':'')+'</div>';
    }

    /* ---------- 4 · LO DE ESTA SEMANA, EN DOS LÍNEAS ----------
       Día, hora y sitio. Nada de bloques ni de series: el contenido del
       entrenamiento es del atleta y de su entrenador. Esto es la agenda,
       que es lo que hace falta para llevarlo y para saber a qué día se
       refiere una falta. */
    html += '<div class="fa-semana">';
    if (dat.falloProximas) {
      html += '<div class="fa-vacio">'+
        htmlError('No hemos podido cargar sus días de entrenamiento',
          'Puede ser la conexión. Volved a intentarlo en un momento.', reintentarHijo)+'</div>';
    } else if (!dat.proximas.length) {
      html += '<p class="fa-vacio">No hay ningún día puesto para esta semana. En cuanto su entrenador lo publique, aparecerá aquí.</p>';
    } else {
      dat.proximas.slice(0, 2).forEach(function(sx){
        var esHoy = sx.fecha === todayISO;
        /* La hora sale de la sesión; si esa no la trae, la del grupo. */
        var hora = sx.hora ? String(sx.hora).slice(0,5)
                 : ((gr && gr.horario) ? (String(gr.horario).match(/\d{1,2}[:.]\d{2}/)||[''])[0] : '');
        var sitio = sx.lugar || (gr ? gr.nombre : sinGrupo());
        var det = [hora, sitio].filter(Boolean).join(' · ');
        var av = avisoDe[sx.fecha];
        html += '<div class="fa-dia">'+
          '<span class="fd-dia">'+esc(esHoy ? 'Hoy' : diaCorto(sx.fecha))+'</span>'+
          '<span class="fd-det">'+esc(det)+'</span>'+
          (av?'<span class="fd-avisada">Falta avisada</span>':'')+'</div>';
      });
    }
    html += '<a class="fa-mes" href="../calendario/">Ver el mes entero</a></div>';

    /* ---------- 5 · la última marca ---------- */
    var ult = null;
    (dat.marcas||[]).forEach(function(x){ if(x.fecha && (!ult || x.fecha>ult.fecha)) ult = x; });
    if (ult) {
      html += '<div class="minis una"><a class="mini" data-sec="marcas"><span class="mi-et">Última marca</span>'+
        '<span class="mi-tit">'+esc((ult.prueba||'')+' · '+(ult.tiempo_display||''))+'</span>'+
        '<span class="mi-pie'+(ult.tipo==='mmp'?' bien':'')+'">'+esc(ult.tipo==='mmp'?'Mejor personal':fechaCorta(ult.fecha))+'</span></a></div>';
    }

    /* ---------- 6 · lo que escribe su entrenador para la familia ---------- */
    html += notasHTML(hijo, dat);

    /* ---------- 7 · LO DEMÁS, UNA LISTA DE SECCIONES ----------
       En el orden en que se usan: las competiciones se miran cada quince
       días; la ropa y los documentos, dos veces al año. */
    function fila(txt, chip, href, sec){
      var d2 = href ? ' href="'+esc(href)+'"' : ' data-sec="'+esc(sec)+'"';
      return '<a class="fa-sec"'+d2+'><span class="fs-txt">'+esc(txt)+'</span>'+
        (chip?'<span class="fs-chip">'+esc(chip)+'</span>':'')+
        '<span class="fs-chev" aria-hidden="true">&rsaquo;</span></a>';
    }
    var chipRopa = '';
    if (ROPA_PREP) chipRopa = ROPA_PREP===1 ? '1 preparando' : ROPA_PREP+' preparando';
    html += '<div class="fa-secs">'+
      fila('Competiciones', comps.length ? (comps.length===1?'1 por venir':comps.length+' por venir') : '', '../competiciones/') +
      fila('Ropa del club', chipRopa, '', 'tienda') +
      fila('Documentos y permisos', '', '', 'permisos') +
      fila('Datos y marcas de '+(hijo.nombre||''), '', '', 'marcas') +
    '</div>';

    return html;
  }

  function entrenosHTML(hijo, dat){
    var gr = hijo.grupo_id ? grupos[hijo.grupo_id] : null;
    var avisoDe = {}; dat.ausencias.forEach(function(a){ avisoDe[a.fecha] = a; });

    // Próximos entrenamientos: fila compacta; el botón lleno solo en la primera
    var filas = dat.proximas.map(function(s, i){
      var av = avisoDe[s.fecha];
      var acc = av
        ? '<span class="pill warn">Falta avisada</span>'+(esMio(av)?'<button type="button" class="enlace-accion" data-quitar="'+esc(av.id)+'">Quitar</button>':'')
        : (i===0
            ? '<button type="button" class="btn-linea azul" data-falta="'+esc(s.fecha)+'" data-sesion="'+esc(s.id)+'">Avisar falta</button>'
            : '<button type="button" class="enlace-accion" data-falta="'+esc(s.fecha)+'" data-sesion="'+esc(s.id)+'">Avisar falta</button>');
      return '<div class="ent-fila"><span class="ef-txt">'+
        '<span class="ef-linea"><span class="ef-cuando">'+esc(diaCorto(s.fecha))+'</span> · '+esc(tituloSesion(s))+'</span>'+
        (i===0 ? '<span class="ef-sub">'+esc(gr ? (gr.nombre + (gr.horario ? ' · '+gr.horario : '')) : sinGrupo())+'</span>' : '')+
        '</span><span class="ef-acc">'+acc+'</span></div>';
    }).join('');

    // Competiciones que vienen: la inscripción vive en la página de competiciones
    var filasComp = comps.map(function(c, i){
      var abierta = !!c.inscripcion_abierta;
      return '<div class="ent-fila"><span class="ef-txt">'+
        '<span class="ef-linea"><span class="ef-cuando">'+esc(diaCorto(c.fecha_inicio))+'</span> · '+esc(c.nombre)+'</span>'+
        '<span class="ef-sub">'+esc([c.sede, abierta?'inscripción abierta':'inscripción aún cerrada'].filter(Boolean).join(' · '))+'</span>'+
        '</span><span class="ef-acc">'+
        (i===0
          ? '<a class="btn-linea'+(abierta?' azul':' gris')+'" style="text-decoration:none;" href="../competiciones/">'+(abierta?'Inscribir':'Ver')+'</a>'
          : '<a class="enlace-accion" href="../competiciones/">'+(abierta?'Inscribir':'Ver')+'</a>')+
        '</span></div>';
    }).join('');

    var html = '<div class="tarjeta">'+
      '<div class="tarjeta-cab"><h2>Próximos entrenamientos</h2><a class="enlace-mini" href="../calendario/">Ver calendario</a></div>'+

             : dat.falloProximas

                   reintentarHijo)
               : '<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icLuna+'</div>'+
                 '<h3>Nada publicado aún</h3>'+
                 '<p>No hay entrenamientos para los próximos días. Podéis avisar una falta igualmente aquí abajo.</p></div>')+
      '</div>';

                   : APOLANA_UI.vacio('Todavía no hay ninguna carrera en el calendario',

                       APOLANA_UI.boton('Ver competiciones', '../competiciones/')))+
      '<p class="vacio" style="margin-top:12px;">Las inscripciones (elegir prueba, ver la circular y el bono) se hacen en la página de competiciones.</p>'+
      '</div>';

    // Formulario para avisar una falta

        '<div><label for="falta-motivo">Motivo</label><select id="falta-motivo">'+opciones+'</select></div>'+

      (av.length
        ? '<div class="agenda">'+av.map(function(a){
            return '<div class="ent-fila"><span class="ef-txt">'+

          }).join('')+'</div>'
        : dat.falloAusencias
          ? htmlError('No hemos podido cargar las faltas avisadas',
              'Puede ser la conexión. Si ya avisasteis una, sigue avisada: esto no la borra. '+
              'Volved a intentarlo antes de avisarla otra vez.', reintentarHijo)
          : APOLANA_UI.vacio('Ninguna falta avisada',
              'No hay ninguna falta avisada para los próximos días, así que su entrenador cuenta con que va a ir a todos los entrenamientos.'))+

    /* Aquí iba el entrenamiento entero, con sus bloques y la nota del
       entrenador. El club ha decidido que una familia no lo ve, y está
       cerrado en la base (migración 100). No se deja un hueco ni un
       «no se ha podido cargar»: la sección se acaba en las faltas. */
    return html;

  function pagosHTML(){
    var html = '';
    /* Lo primero, si se ha podido mirar. «Sin recibos por ahora» con la
       consulta caída se lee como «no debéis nada», y aquí eso no vale. */
    if(falloPagos){
      html += '<div class="tarjeta"><h2>Pagos y recibos</h2>'+
        htmlError('No hemos podido cargar vuestros recibos',
          'Puede ser la conexión. Esto no quiere decir que estéis al día ni que no haya nada que pagar: '+
          'volved a intentarlo en un momento y, si sigue igual, avisad al club.',
          reintentarPagos)+'</div>';
    } else if(!pagosTodos.length){
      html += '<div class="tarjeta"><h2>Pagos y recibos</h2>'+
        '<div class="vacio-caja"><div class="vc-ic" aria-hidden="true">'+icPagos+'</div>'+
        '<h3>Sin recibos por ahora</h3>'+
        '<p>Cuando el club emita el primer recibo a vuestro nombre lo veréis aquí, con su desglose.</p></div></div>';
    } else {
      var pendiente = 0, pagado = 0;
      pagosTodos.forEach(function(x){ var v=parseFloat(x.importe)||0; if((x.estado||'').toLowerCase()==='pagado') pagado+=v; else pendiente+=v; });
      var hayRecibos = pagosTodos.some(function(x){ return (x.estado||'').toLowerCase()==='pagado'; });

      html += '<div class="tarjeta">'+
        '<div class="tarjeta-cab"><h2>Pagos y recibos</h2><span class="vacio">Desglose por persona</span></div>'+
        // El resumen, arriba y en grande: es lo que se mira primero
        '<div class="res-cifras">'+
          '<div class="res-cifra"><span class="rc-tit">Pagado</span><span class="rc-num">'+esc(eur(pagado))+'</span></div>'+
          '<div class="res-cifra pend'+(pendiente>0?' hay':'')+'"><span class="rc-tit">Pendiente</span><span class="rc-num">'+esc(eur(pendiente))+'</span></div>'+
        '</div>'+
        // Un recibo por fila. Es la tabla del kit 30e: en escritorio va
        // en columnas y por debajo de 720 px cada recibo se vuelve ficha.
        // Nunca más de 20 de golpe: el resto, tras «Ver más».
        hijos.map(function(h){
          var rows = pagosPorHijo[h.id]||[];
          var tit = '<h3 class="pg-quien">'+esc(nombreHijo[h.id])+'</h3>';
          if(!rows.length) return tit + APOLANA_UI.vacio('Sin recibos todavía',
            'Cuando el club emita el primer recibo a nombre de '+(h.nombre||'')+', aparecerá aquí con su desglose.');
          var visibles = VER_TODOS_RECIBOS ? rows : rows.slice(0,20);
          var mas = rows.length - visibles.length;
          return tit+'<div class="rc-lista">'+visibles.map(function(x){
            var e=(x.estado||'').toLowerCase();
            var f = (e==='pagado' && x.fecha_pago) ? ('Cobrada el '+fechaCorta(x.fecha_pago))
                  : (x.fecha_vencimiento ? ('Se cobra el '+fechaCorta(x.fecha_vencimiento)) : '');
            return '<div class="rc-fila">'+
              '<span class="rc-nom">'+esc(x.concepto||'Recibo')+'</span>'+
              '<span class="rc-cuando">'+esc(f)+'</span>'+
              '<span class="rc-imp">'+(x.importe!=null?esc(eur(x.importe)):'')+'</span>'+
              '<span class="rc-estado">'+pillPago(x.estado)+'</span></div>';
          }).join('')+'</div>'+
          (mas>0 ? '<p style="margin:10px 0 0;"><button type="button" class="btn-linea" data-accion="ver-recibos">Ver los '+mas+' recibos anteriores</button></p>' : '');
        }).join('')+
        (hayRecibos
          /* Decía «Descargar recibos» y no descarga nada: abre el diálogo de
             imprimir. El botón dice lo que hace de verdad. */
          ? '<p style="margin-top:16px;"><button class="btn btn--fantasma" data-accion="recibos">Imprimir los justificantes</button></p>'+
            '<p class="vacio" style="margin-top:6px;">Se abre la hoja de justificantes de los recibos ya cobrados, lista para imprimir o guardar en PDF.</p>'
          : '<p class="vacio" style="margin-top:16px;">Todavía no hay ningún recibo cobrado del que sacar justificante.</p>')+
        // Cómo se emiten los recibos se lee una vez: va plegado, entero.
        '<details class="plegable"><summary>Cómo se emiten los recibos<span class="fl" aria-hidden="true"></span></summary>'+
        '<div class="cuerpo"><p class="vacio" style="margin:0;">Un recibo, una familia: todo junto el día 3, con el desglose por persona que veis arriba. Si vuestra situación no encaja, la junta la estudia caso por caso: <a href="../../contacto/">escribir a la junta →</a></p></div></details>'+
        '</div>';
    }
    // --- Cómo se paga ---------------------------------------------------
    // Aquí se veían los importes pero no dónde pagarlos. El bloque enseña la
    // cuenta que le toca a esta casa (escuela o club), qué poner en el
    // concepto y a quién preguntar. Si los hijos están repartidos entre las
    // dos cuentas, salen las dos con su título: mejor eso que la equivocada.
    if(window.APOLANA_INFO_PAGOS){
      var devFam  = pagosTodos.filter(function(x){ var e=(x.estado||'').toLowerCase();
        return e==='impagado' || e==='devuelto' ||
               (e==='pendiente' && x.fecha_vencimiento && x.fecha_vencimiento < todayISO); });
      html += APOLANA_INFO_PAGOS.bloque({
        clave: APOLANA_INFO_PAGOS.claveDeVarios(hijos),
        /* A propósito 0. Cuántos recibos quedan ya se dice en Inicio y en las
           dos cifras de aquí arriba; si además se lo pasáramos a este bloque,
           lo mismo se leería cuatro veces en la misma pantalla. Con 0 el
           bloque se queda plegado y solo explica CÓMO se paga, que es lo suyo. */
        pendientes: 0,
        devueltos: devFam.length
      });
    }

    // Los descuentos, en una línea: quien quiera el detalle lo tiene a un clic
    html += '<div class="desc-linea" style="margin:18px 0;">'+
      '<span>Los descuentos Familia Apolana se aplican solos.</span>'+
      '<a href="../../familias/">Cómo funcionan →</a></div>';
    return html;
  }

  // ---------- pintado ----------

  // ---------- MÁS (maqueta 22b): tres bloques, nunca lista plana ----------
  function filaMas(txt, extra, dest, cls){
    var d2 = dest && dest.charAt(0)!=='#' ? ' href="'+esc(dest)+'"' : (dest?' data-sec="'+esc(dest.slice(1))+'"':'');
    return '<a class="ml-fila'+(cls?' '+cls:'')+'"'+d2+'>'+
      '<span class="ml-txt">'+esc(txt)+'</span>'+(extra||'')+
      (dest?'<span class="ml-chev">&rsaquo;</span>':'')+'</a>';
  }
  /* Los usos que quedan, en la fila de «Más». En ámbar con 1 o 0: es cuando
     hay que comprar más, y nadie quiere enterarse al llegar a la piscina. */
  function usosCuboHTML(){
    if (USOS_CUBO == null) return '';
    return '<span class="ml-dato' + (USOS_CUBO <= 1 ? ' pend' : '') + '">' +
           USOS_CUBO + (USOS_CUBO === 1 ? ' uso' : ' usos') + '</span>';

  function bloqueMas(titulo, filas){
    return '<div class="ml-bloque"><span class="ml-tit">'+esc(titulo)+'</span>'+
      '<div class="ml-caja">'+filas.join('')+'</div></div>';

  function masHTML(){
    var quien = ((perfil.nombre||'')+' '+(perfil.apellidos||'')).trim() || 'Mi cuenta';
    var sub = hijos.length===1 ? nombreHijo[hijos[0].id] : hijos.length+' hijos en el club';

    var html = '<h2 class="ml-cab">Más</h2>'+
      '<div class="ml-perfil"><span class="ml-avatar">'+esc(iniciales(perfil.nombre, perfil.apellidos))+'</span>'+
      '<span class="ml-quien"><b>'+esc(quien)+'</b><span>'+esc(sub)+'</span></span></div>';

    html += bloqueMas('El club', [
      filaMas('Noticias', NOTIS?'<span class="ml-num">'+NOTIS+'</span>':'', '../../noticias/'),
      filaMas('Competiciones', '', '../competiciones/'),
      filaMas('Galería', '', '../../galeria/'),
      filaMas('Tienda del club', '', '#tienda'),
      filaMas('Proponer un post', '', '../redes/')
    ]);

    /* En «Pagos y recibos» ya no va cuántos quedan: eso se dice en Inicio,
       en el aviso del recibo, y decirlo aquí otra vez era la cuarta. */
    /* Estas cinco pantallas el vestíbulo del portal dice que son de las
       familias, pero desde aquí no se llegaba a ninguna: solo escribiendo la
       dirección. «Mensajes» y «Mi perfil» son las que más se echan de menos

    html += bloqueMas('Mi cuenta', [
      filaMas('Bonos de El Cubo', usosCuboHTML(), '../cubo/'),

      filaMas('Mensajes', '', '../mensajes/'),
      filaMas('Mi perfil', '', '../perfil/'),
      filaMas('Mis tests', '', '../tests/'),
      filaMas('Liga Apolana', '', '../liga/'),
      filaMas('Familia Apolana', '<span class="ml-dato">'+hijos.length+' '+(hijos.length===1?'hijo':'hijos')+'</span>', '../../familias/'),
      filaMas('Documentos', '', '../documentos/'),
      filaMas('Ficha y marcas', '', '#marcas'),
      filaMas('Nombre en las clasificaciones', permisoResumen(), '#permisos'),
      filaMas('Mis grupos', '<span class="ml-dato">'+esc(hijos.map(function(h){ var g=h.grupo_id?grupos[h.grupo_id]:null; return g?g.nombre:(falloGrupos?'sin cargar':'sin grupo'); }).join(' · '))+'</span>', '')
    ]);

    html += bloqueMas('Ayuda', [
      filaMas('Escribir al club', '', '../../contacto/'),

    ]);

    // Cerrar sesión, separado: no se pulsa por error al ir a otra cosa.
    html += bloqueMas('Salir', [ filaMas('Cerrar sesión', '', '', 'salir') ]);
