<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona de familias · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<style>
  body { background: var(--crema-media); }
  .fa-wrap { max-width: 1040px; margin: 0 auto; padding: clamp(20px,4vw,36px) clamp(14px,4vw,32px); }
  .fa-cab { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .fa-cab h1 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: clamp(28px,6vw,42px); color: var(--navy); margin: 0 0 4px; }
  .fa-cab .sub { display:block; font-family: var(--fuente-mono); font-size: 12.5px; letter-spacing:.03em; text-transform:none; color: var(--texto-suave); }
  .fa-cab .fa-ini { flex:none; width:46px; height:46px; border-radius:50%; background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; letter-spacing:.03em; box-shadow: var(--sombra-suave); }

  .layout { display:flex; gap:22px; align-items:flex-start; margin-top:18px; }
  .side { flex:0 0 210px; position:sticky; top:16px; }
  .side nav { display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding:8px; box-shadow: var(--sombra-suave); }
  .side nav a { cursor:pointer; font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:none; color: var(--texto-suave); padding:10px 12px; border-radius:10px; text-decoration:none; }
  .side nav a:hover { background: var(--crema-media); color: var(--navy); }
  .side nav a.activo { background: var(--navy); color:#fff; }
  .cont { flex:1 1 auto; min-width:0; }

  .tarjeta { background:#fff; border:1px solid var(--linea); border-radius: var(--radio-grande); padding: clamp(18px,3vw,26px); box-shadow: var(--sombra-suave); margin-bottom:18px; }
  .tarjeta h2 { font-family: var(--fuente-titulo); text-transform: uppercase; font-size: 22px; color: var(--navy); margin: 0 0 12px; }
  .tarjeta-cab { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .tarjeta-cab h2 { margin:0; }
  .enlace-mini { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color: var(--azul-oscuro); text-decoration:none; }
  .enlace-mini:hover { color: var(--azul-hover); text-decoration:underline; }
  table { width:100%; border-collapse: collapse; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--linea); font-size:14px; }
  th { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.06em; text-transform:none; color: var(--texto-suave); }
  .vacio { color: var(--texto-suave); font-size:14px; }
  .pill { font-family: var(--fuente-mono); font-size:12px; padding:3px 9px; border-radius:999px; background: var(--crema-media); color: var(--texto-suave); white-space:nowrap; }
  .pill.ok { background:#e6f4ea; color:#1e7a3d; }
  .pill.warn { background:#fdf0e3; color:#a9631a; }
  .pill.bad { background:#fbe7e6; color:#b3261e; }

  /* selector de hijos */
  .hijos-lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
  .hijo-card { text-align:left; cursor:pointer; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:14px 16px; box-shadow: var(--sombra-suave); display:flex; flex-direction:column; gap:4px; transition:border-color .12s, transform .12s; }
  .hijo-card:hover { border-color: var(--azul); transform: translateY(-1px); }
  .hijo-card.activo { background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); border-color: var(--navy); }
  .hijo-card .hc-nombre { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:19px; color: var(--navy); line-height:1.1; }
  .hijo-card.activo .hc-nombre { color:#fff; }
  .hijo-card .hc-meta { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color: var(--texto-suave); }
  .hijo-card.activo .hc-meta { color:#cdd6e0; }
  .hijo-card .hc-estado { margin-top:4px; }

  /* ficha del atleta */
  .ficha-cab { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .avatar { width:56px; height:56px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); color:#fff; font-family: var(--fuente-mono); font-size:16px; letter-spacing:.04em; }
  .avatar.chico { width:42px; height:42px; font-size:13px; }
  .ficha-cab .fc-txt { flex:1 1 200px; min-width:0; }
  /* En bloque: si no, el nombre y la categoría salían pegados en la misma línea */
  .ficha-cab .fc-nombre { display:block; font-family: var(--fuente-titulo); text-transform:uppercase; font-size:26px; color: var(--navy); line-height:1.1; margin-bottom:3px; }
  .ficha-cab .fc-linea { display:block; font-size:14px; color: var(--texto-suave); line-height:1.4; }

  /* nota del entrenador */
  .nota-fam { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px dashed var(--linea); }
  .nota-fam:last-child { border-bottom:none; padding-bottom:0; }
  .nota-fam:first-child { padding-top:0; }
  .nota-fam .nf-firma { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color: var(--texto-suave); display:block; margin-bottom:3px; }
  .nota-fam p { margin:0; font-size:15px; color: var(--texto); line-height:1.55; }

  /* records */
  .records { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:6px; }
  .record { background: linear-gradient(160deg, var(--navy), var(--azul-oscuro)); color:#fff; border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; box-shadow: var(--sombra-suave); }
  .record .r-prueba { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.03em; text-transform:none; color: rgba(255,255,255,.82); }
  .record .r-marca { font-family: var(--fuente-titulo); font-size:26px; font-weight:700; line-height:1.1; }
  .record .r-fecha { font-size:12px; color: rgba(255,255,255,.7); }

  /* Marcas: lista de filas (una tabla de 5 columnas se aplastaba en el móvil) */
  .mk-lista { display:flex; flex-direction:column; }
  .mk-fila { display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--linea); }
  .mk-fila:last-child { border-bottom:none; }
  .mk-fila .mk-txt { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .mk-fila .mk-nom { font-size:15px; font-weight:600; color: var(--navy); }
  .mk-fila .mk-cuando { font-size:12.5px; color: var(--texto-suave); }
  .mk-fila .mk-der { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .mk-fila .mk-marca { font-family: var(--fuente-titulo); font-size:25px; font-weight:700; line-height:1; color: var(--azul-oscuro); }
  .mk-fila .mk-tags { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }

  /* filas de próximos entrenamientos */
  .agenda { display:flex; flex-direction:column; }
  .btn-linea { cursor:pointer; font-family: inherit; background:#fff; border:1px solid #C9D9E7; color: var(--azul-oscuro); border-radius:999px; min-height:44px; padding:7px 16px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  .btn-linea:hover { background: var(--azul-suave); }
  .btn-linea.gris { border-color: var(--linea-borde); color: var(--texto-suave); font-weight:400; }
  .btn-linea.azul { background: var(--azul); border-color: var(--azul); color:#fff; }
  .btn-linea.azul:hover { background: var(--azul-oscuro); }

  /* Próximos entrenos: fila compacta, fecha y título en la misma línea */
  .ent-fila { display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--linea); min-height:52px; }
  .ent-fila:last-child { border-bottom:none; }
  .ent-fila .ef-txt { flex:1 1 auto; min-width:0; }
  .ent-fila .ef-linea { display:block; font-size:15px; color: var(--navy); }
  .ent-fila .ef-cuando { font-weight:700; color: var(--azul-oscuro); }
  .ent-fila .ef-sub { display:block; font-size:12.5px; color: var(--texto-suave); margin-top:2px; }
  .ent-fila .ef-acc { flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .enlace-accion { background:none; border:0; padding:0 2px; font:inherit; font-weight:600; font-size:14px; color: var(--azul-oscuro); cursor:pointer; min-height:44px; display:inline-flex; align-items:center; white-space:nowrap; }
  .enlace-accion:hover { color: var(--azul-hover); }

  /* Estado vacío con cuerpo: icono de línea, frase corta y salida */
  .vacio-caja { text-align:center; padding: clamp(18px,4vw,26px) 12px; }
  .vacio-caja .vc-ic { width:46px; height:46px; border-radius:50%; background: var(--crema-media); color: var(--azul-oscuro); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; }
  .vacio-caja .vc-ic svg { width:24px; height:24px; }
  .vacio-caja h3 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:20px; color: var(--navy); margin:0 0 6px; }
  .vacio-caja p { color: var(--texto-suave); font-size:14px; margin:0 0 14px; max-width:36ch; margin-left:auto; margin-right:auto; }
  .vacio-caja .btn, .vacio-caja .btn-linea { min-height:44px; display:inline-flex; align-items:center; }

  /* Inicio: la próxima sesión, destacada */
  .prox-card { background: var(--navy); border-radius:20px; padding: clamp(18px,3vw,22px); color:#fff; display:flex; flex-direction:column; gap:14px; margin-bottom:14px; box-shadow: 0 24px 44px -26px rgba(46,66,86,.9); }
  .prox-card .pc-et { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color: rgba(255,255,255,.9); }
  .prox-card .pc-tit { font-family: var(--fuente-titulo); font-weight:700; font-size: clamp(26px,5vw,36px); line-height:1; color:#fff; margin:0; text-transform:none; }
  .prox-card .pc-det { font-size:14px; color: rgba(255,255,255,.8); margin-top:6px; }
  .prox-card .pc-btns { display:flex; gap:10px; flex-wrap:wrap; }
  .prox-card .pc-btn { flex:1 1 150px; min-height:48px; border-radius:12px; border:1px solid rgba(255,255,255,.32); background: rgba(255,255,255,.08); color:#fff; font:inherit; font-weight:600; font-size:15px; cursor:pointer; padding:13px 14px; }
  .prox-card .pc-btn:hover { border-color:#fff; background: rgba(255,255,255,.16); }
  .prox-card .pc-btn.claro { background:#fff; border-color:#fff; color: var(--azul-oscuro); }
  .prox-card .pc-btn.claro:hover { background: var(--azul-suave); }

  /* Inicio: recordatorio de pago, solo si hay algo pendiente */
  .fa-pendiente { background:#FDF6F5; border:1px solid #EBC6C4; border-radius:12px; padding:14px 16px; margin-bottom:18px; }
  .fa-pendiente .et { display:block; font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color:#B23A38; font-weight:600; margin-bottom:4px; }
  .fa-pendiente p { margin:0 0 4px; font-size:14px; color: var(--texto); }

  /* Pagos: el resumen, en dos cifras grandes encima de la tabla */
  .res-cifras { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .res-cifra { background: var(--crema); border:1px solid var(--linea); border-radius:14px; padding:12px 14px; }
  .res-cifra .rc-tit { display:block; font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; color: var(--texto-suave); }
  .res-cifra .rc-num { display:block; font-family: var(--fuente-titulo); font-size:30px; font-weight:700; line-height:1.15; color: var(--navy); }
  .res-cifra.pend .rc-num { color: var(--azul-oscuro); }
  .res-cifra.pend.hay { border-color:#EBC6C4; background:#FDF6F5; }
  .res-cifra.pend.hay .rc-num { color:#B23A38; }
  .pg-quien { font-family: var(--fuente-mono); font-size:12.5px; letter-spacing:.02em; text-transform:none; font-weight:600; color: var(--azul-oscuro); margin:18px 0 2px; }
  .pg-importe { font-family: var(--fuente-titulo); font-size:22px; font-weight:700; line-height:1; color: var(--navy); }

  /* Descuentos Familia Apolana: una línea con enlace, no una tarjeta entera */
  .desc-linea { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background: var(--crema); border:1px solid var(--linea); border-radius:12px; padding:12px 14px; margin-top:16px; font-size:14px; color: var(--texto); }
  .desc-linea a { font-weight:600; white-space:nowrap; }

  /* formulario de aviso de falta */
  .form-falta { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:12px; align-items:end; }
  label { display:block; font-size:13px; font-weight:600; color: var(--navy); margin:0 0 5px; }
  input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid var(--linea-borde); border-radius:10px; font-size:15px; font-family: var(--fuente-texto); background:#fff; color: var(--navy); }
  .msg { font-size:14px; margin-top:10px; display:block; } .msg.ok { color:#1e7a3d; } .msg.error { color:#b3261e; }
  .aviso-caja { background: var(--aviso-fondo); border:1px solid var(--aviso-borde); color: var(--aviso-texto); font-size:14px; line-height:1.55; padding:12px 14px; border-radius:12px; margin:0 0 14px; }
  .nota { font-size:14px; color: var(--texto); background: var(--crema); border-left:3px solid var(--azul); padding:10px 12px; border-radius:8px; margin:0 0 16px; }

  /* entreno */
  .entreno-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .entreno-cab h2 { margin:0; }
  .fecha-pill { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.03em; text-transform:none; background: var(--azul); color:#fff; padding:5px 11px; border-radius:999px; }
  .entreno-titulo { font-size:18px; font-weight:600; color: var(--navy); margin:2px 0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { font-family: var(--fuente-mono); font-size:12px; text-transform:none; letter-spacing:.03em; background: var(--crema-media); color: var(--texto-suave); padding:4px 10px; border-radius:999px; }
  .bloque { margin-bottom:14px; }
  .bloque h3 { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.08em; text-transform:none; color: var(--azul-oscuro); margin:0 0 8px; padding-bottom:5px; border-bottom:1px solid var(--linea); }
  .fila { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:7px 0; border-bottom:1px dashed var(--linea); }
  .fila:last-child { border-bottom:none; }
  .fila .ej { font-size:15px; color: var(--navy); font-weight:500; }
  .fila .fparams { display:flex; flex-wrap:wrap; gap:6px; }
  .fchip { font-size:12px; color: var(--texto-suave); background: var(--crema-media); padding:2px 8px; border-radius:6px; white-space:nowrap; }

  /* tienda */
  .prods { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; margin-bottom:14px; }
  .prod { border:1px solid var(--linea); border-radius:14px; overflow:hidden; background:#fff; display:flex; flex-direction:column; }
  .prod .ph { height:120px; background: var(--crema-media); display:flex; align-items:center; justify-content:center; }
  .prod .ph img { width:100%; height:100%; object-fit:contain; }
  .prod .cuerpo { padding:10px 12px; display:flex; flex-direction:column; gap:3px; }
  .prod b { font-size:15px; font-weight:600; color: var(--navy); }
  .prod span { font-size:13px; color: var(--texto-suave); }
  .prod .precio { font-family: var(--fuente-mono); font-size:15px; color: var(--azul-oscuro); }

  /* hoja de justificantes: solo se ve al imprimir */
  #hoja-recibos { display:none; }
  @media print {
    html.imprimiendo body > * { display:none !important; }
    html.imprimiendo body > #hoja-recibos { display:block !important; background:#fff; color:#000; padding:0; }
    #hoja-recibos h1 { font-family: var(--fuente-titulo); text-transform:uppercase; font-size:26px; margin:0 0 4px; }
    #hoja-recibos .rc { border:1px solid #999; border-radius:8px; padding:14px 16px; margin-bottom:12px; page-break-inside:avoid; }
    #hoja-recibos table { width:100%; border-collapse:collapse; }
    #hoja-recibos td, #hoja-recibos th { border-bottom:1px solid #ccc; padding:6px 4px; font-size:13px; text-align:left; }
    #hoja-recibos .pie { font-size:11px; color:#555; margin-top:18px; }
  }

  /* ---- INICIO (maqueta 22a): franja de aviso, entreno dominante, dos tarjetas ---- */
  .franja { display:flex; align-items:center; gap:12px; background:#FDF3E3; border:1px solid #EBD9B8; border-radius:14px; padding:12px 14px; margin-bottom:12px; min-height:48px; box-sizing:border-box; cursor:pointer; }
  .franja .fr-pt { flex:none; width:8px; height:8px; border-radius:999px; background:#B96F09; }
  .franja .fr-txt { flex:1; min-width:0; font-size:14px; line-height:1.4; color:#6B5227; }
  .franja .fr-acc { flex:none; font-size:14px; font-weight:600; color:#B96F09; }
  .franja.azul { background: var(--azul-suave); border-color:#CFE2F1; }
  .franja.azul .fr-pt { background: var(--azul); }
  .franja.azul .fr-txt { color: var(--navy); }
  .franja.azul .fr-acc { color: var(--azul-oscuro); }

  .prox-card .pc-top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .prox-card .pc-tipo { font-family: var(--fuente-mono); font-size:12.5px; text-transform:none; color: rgba(255,255,255,.72); }
  .prox-card .pc-cifras { display:flex; gap:8px; }
  .prox-card .pc-cifra { flex:1 1 0; min-width:0; background: rgba(255,255,255,.12); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:1px; }
  .prox-card .pc-cifra b { font-family: var(--fuente-mono); font-weight:600; font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .prox-card .pc-cifra span { font-size:12px; color: rgba(255,255,255,.65); }

  .minis { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .mini { background:#fff; border:1px solid var(--linea); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:4px; text-decoration:none; cursor:pointer; min-height:48px; }
  .mini:hover { border-color: var(--azul); }
  .mini .mi-et { font-family: var(--fuente-mono); font-size:12px; letter-spacing:.02em; text-transform:none; color: var(--texto-suave); }
  .mini .mi-tit { font-family: var(--fuente-titulo); font-weight:700; font-size:22px; line-height:1.05; text-transform:uppercase; color: var(--navy); }
  .mini .mi-pie { font-family: var(--fuente-mono); font-size:12.5px; color: var(--azul-oscuro); }
  .mini .mi-pie.bien { color:#3F7A4C; font-weight:600; }

  .hoy-tit { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 8px; }
  .hoy-tit h2 { font-family: var(--fuente-mono); font-weight:600; text-transform:none; letter-spacing:.02em; font-size:12.5px; color: var(--texto-suave); margin:0; }
  .hoy-tit .cnt-enl { font-size:13px; font-weight:600; color: var(--azul-oscuro); white-space:nowrap; text-decoration:none; }
  .hoy-lista { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .hoy-item { width:100%; text-align:left; font:inherit; background:#fff; border:1px solid var(--linea); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; min-height:48px; }
  .hoy-item:hover { border-color: var(--azul); }
  .hoy-item .d { flex:none; width:64px; font-family: var(--fuente-mono); font-size:12.5px; color: var(--azul-oscuro); }
  .hoy-item .t { flex:1; min-width:0; font-size:14px; color: var(--navy); }
  .hoy-item .h { flex:none; font-size:13px; color: var(--texto-suave); }

  /* ---- MÁS (maqueta 22b): perfil y tres bloques ---- */
  .ml-cab { font-family: var(--fuente-titulo); text-transform:uppercase; font-size: clamp(26px,5vw,34px); color: var(--navy); margin:0 0 14px; }
  .ml-perfil { display:flex; align-items:center; gap:12px; background: var(--crema-banda); border-radius:16px; padding:12px 16px; margin-bottom:14px; }

  .ml-quien { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }

  .ml-bloque { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .ml-tit { font-family: var(--fuente-mono); font-weight:600; font-size:12.5px; letter-spacing:.02em; text-transform:none; color: var(--texto-suave); padding-left:4px; }
  .ml-caja { background:#fff; border:1px solid var(--linea); border-radius:16px; overflow:hidden; }
  .ml-fila { display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:52px; box-sizing:border-box; border-bottom:1px solid #F4EFE4; text-decoration:none; color: var(--navy); }
  .ml-fila:last-child { border-bottom:none; }
  .ml-fila[href], .ml-fila[data-sec], .ml-fila.salir { cursor:pointer; }
  .ml-fila[href]:hover, .ml-fila[data-sec]:hover, .ml-fila.salir:hover { background: var(--crema); }
  .ml-fila .ml-txt { flex:1; min-width:0; font-size:16px; color: var(--navy); }
  .ml-fila .ml-chev { flex:none; font-size:18px; color:#C8C0B0; line-height:1; }
  .ml-fila .ml-dato { flex:none; font-size:13px; color: var(--texto-suave); text-align:right; max-width:52%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ml-fila .ml-dato.pend { font-family: var(--fuente-mono); font-size:12.5px; color:#B96F09; font-weight:600; }
  .ml-fila .ml-num { flex:none; background: var(--azul); color:#fff; font-family: var(--fuente-mono); font-size:12px; border-radius:999px; padding:3px 9px; }
  .ml-fila.salir .ml-txt { color:#B0563A; font-weight:600; }

  /* --- Barra inferior única (maqueta 22c): Inicio · Entreno · Calendario · Marcas · Más.
         Iconos de línea de 24 px sin relleno; el activo se distingue por color y peso,
         no por una píldora de fondo. Objetivos táctiles de 48 px. --- */
  .tabbar { display:none; }

  @media (max-width:760px){
    /* En columna hay que estirar: si no, la columna se ajusta al contenido y sobresale */
    .layout { flex-direction:column; align-items:stretch; gap:0; }
    .cont { width:100%; }
    .side { display:none; }                  /* en móvil manda la barra de abajo */
    body { padding-bottom:88px; }            /* hueco para la barra fija */
    .res-cifra .rc-num { font-size:26px; }
    .tabbar { display:flex; align-items:stretch; position:fixed; left:0; right:0; bottom:0; z-index:600;
      background:rgba(251,249,244,.96); -webkit-backdrop-filter:saturate(1.3) blur(10px); backdrop-filter:saturate(1.3) blur(10px);
      border-top:1px solid var(--linea); padding:10px 8px calc(10px + env(safe-area-inset-bottom)); }
    .tabbar a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
      min-height:48px; text-decoration:none; color: var(--texto-tenue);
      font-size:11px; letter-spacing:.01em; text-transform:none; -webkit-tap-highlight-color:transparent; }
    .tabbar a .ic { width:24px; height:24px; }
    .tabbar a.activo { color: var(--azul-oscuro); }
    .tabbar a.activo span { font-weight:600; }
    .tabbar a.activo .ic { stroke-width:2; }
  }

<script>
/* Avisos suaves y confirmaciones no bloqueantes del portal (APX). */
(function(){
  if (window.APX) return;
  var css =
    '.apx-host{position:fixed;left:0;right:0;bottom:18px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}'+
    '.apx-toast{pointer-events:auto;max-width:440px;background:var(--navy,#2E4256);color:#fff;font-family:var(--fuente-texto,system-ui);font-size:14px;line-height:1.4;padding:12px 16px;border-radius:12px;box-shadow:0 16px 34px -18px rgba(46,66,86,.7);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}'+
    '.apx-toast.apx-in{opacity:1;transform:none}'+
    '.apx-toast.apx-error{background:#B23A38}'+
    '.apx-toast.apx-ok{background:#2F6FA8}'+
    '.apx-ov{position:fixed;inset:0;z-index:10000;background:rgba(30,42,56,.5);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .2s}'+
    '.apx-ov.apx-in{opacity:1}'+
    '.apx-dlg{background:var(--crema,#FBF9F4);border:1px solid var(--linea,#EAE3D5);border-radius:18px;box-shadow:0 34px 60px -30px rgba(46,66,86,.6);max-width:400px;width:100%;padding:22px 22px 18px;transform:translateY(8px) scale(.98);transition:transform .2s}'+
    '.apx-ov.apx-in .apx-dlg{transform:none}'+
    '.apx-dlg-msg{margin:0 0 18px;font-family:var(--fuente-texto,system-ui);font-size:15px;line-height:1.5;color:var(--texto,#5E5849)}'+
    '.apx-dlg-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}'+
    '.apx-btn{font-family:var(--fuente-texto,system-ui);font-size:14px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--linea-borde,#E0D8C8);background:#fff;color:var(--navy,#2E4256);cursor:pointer;min-height:42px}'+
    '.apx-btn:hover{border-color:#C9D9E7}'+
    '.apx-ok{background:var(--azul,#3B85C0);border-color:var(--azul,#3B85C0);color:#fff}'+
    '.apx-ok:hover{background:var(--azul-oscuro,#2F6FA8)}'+
    '.apx-ok.apx-danger{background:#B23A38;border-color:#B23A38}'+
    '.apx-ok.apx-danger:hover{background:#8f2c2b}'+
    '@media(max-width:420px){.apx-dlg-btns{flex-direction:column-reverse}.apx-btn{width:100%}}';
  var st=document.createElement('style'); st.textContent=css; (document.head||document.documentElement).appendChild(st);
  var host=null;
  function ensureHost(){ if(!host){ host=document.createElement('div'); host.className='apx-host'; document.body.appendChild(host);} return host; }
  function toast(msg,tipo){
    ensureHost();
    var el=document.createElement('div'); el.className='apx-toast'+(tipo?' apx-'+tipo:''); el.textContent=msg;
    host.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add('apx-in'); });
    var vida=(tipo==='error')?4600:3000;
    setTimeout(function(){ el.classList.remove('apx-in'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); }, vida);
  }
  function confirmar(msg,opts){
    opts=opts||{};
    return new Promise(function(resolve){
      var ov=document.createElement('div'); ov.className='apx-ov';
      var dlg=document.createElement('div'); dlg.className='apx-dlg'; dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true');
      var p=document.createElement('p'); p.className='apx-dlg-msg'; p.textContent=msg; dlg.appendChild(p);
      var btns=document.createElement('div'); btns.className='apx-dlg-btns';
      var bc=document.createElement('button'); bc.type='button'; bc.className='apx-btn'; bc.textContent=opts.cancelar||'Cancelar';
      var bo=document.createElement('button'); bo.type='button'; bo.className='apx-btn apx-ok'; bo.textContent=opts.aceptar||'Aceptar';
      if(opts.peligro) bo.classList.add('apx-danger');
      btns.appendChild(bc); btns.appendChild(bo); dlg.appendChild(btns); ov.appendChild(dlg);
      document.body.appendChild(ov);
      requestAnimationFrame(function(){ ov.classList.add('apx-in'); });
      function cerrar(v){ ov.classList.remove('apx-in'); document.removeEventListener('keydown',onkey); setTimeout(function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); },200); resolve(v); }
      function onkey(e){ if(e.key==='Escape'){ e.preventDefault(); cerrar(false);} else if(e.key==='Enter'){ e.preventDefault(); cerrar(true);} }
      bc.addEventListener('click',function(){ cerrar(false); });
      bo.addEventListener('click',function(){ cerrar(true); });
      ov.addEventListener('click',function(e){ if(e.target===ov) cerrar(false); });
      document.addEventListener('keydown',onkey);
      setTimeout(function(){ bo.focus(); },40);
    });
  }
  window.APX={ toast:toast, confirm:confirmar };
})();
</script>

<body>

<div id="portal-contenido">
  <div class="fa-wrap" id="fa-wrap"><p class="intro">Cargando…</p></div>
</div>

<div id="hoja-recibos"></div>

<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('fa-wrap');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }

  if (!perfil) { wrap.innerHTML = '<div class="tarjeta"><p class="vacio">No encontramos tu perfil. Avisa al club.</p></div>'; return; }

  // ---------- helpers ----------
  var DIAS_C = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function d(iso){ if(!iso) return null; var x=new Date(String(iso).indexOf('T')>-1?iso:iso+'T00:00:00'); return isNaN(x.getTime())?null:x; }
  function formatFecha(iso){ var x=d(iso); return x? DIAS_C[x.getDay()]+' '+x.getDate()+' '+MESES_C[x.getMonth()] : ''; }
  function fechaCorta(iso){ var x=d(iso); return x? x.getDate()+' '+MESES_C[x.getMonth()] : ''; }
  function fechaLarga(iso){ var x=d(iso); return x? x.getDate()+' de '+MESES_L[x.getMonth()]+' de '+x.getFullYear() : ''; }
  function diaCorto(iso){ var x=d(iso); return x? DIAS_C[x.getDay()].toUpperCase()+' '+x.getDate()+'/'+(x.getMonth()+1) : ''; }
  function eur(n){ var v=parseFloat(n); return (isNaN(v)?0:v).toFixed(2).replace('.',',')+' €'; }
  function iniciales(nom,ape){ var a=(nom||'').trim().charAt(0), b=(ape||'').trim().charAt(0); return ((a+b)||'·').toUpperCase(); }
  function edad(iso){ var x=d(iso); if(!x) return null; var h=new Date(); var e=h.getFullYear()-x.getFullYear(); var m=h.getMonth()-x.getMonth(); if(m<0||(m===0&&h.getDate()<x.getDate())) e--; return e; }
  function tiempoANum(s){ if(s==null) return null; s=String(s).trim().replace(',','.'); if(s.indexOf(':')>-1){ var p=s.split(':'); if(p.length>=3) return (parseInt(p[0],10)||0)*3600+(parseInt(p[1],10)||0)*60+(parseFloat(p[2])||0); return (parseInt(p[0],10)||0)*60+(parseFloat(p[1])||0); } var n=parseFloat(s); return isNaN(n)?null:n; }
  function pruebaEsDistancia(nombre){ return /(longitud|altura|triple|p[eé]rtiga|garrocha|peso|disco|jabalina|martillo|salto|lanzam)/i.test(nombre||''); }
  // Fecha de hoy en hora local: con toISOString() (UTC) entre medianoche y las 2
  // de la madrugada el portal creía que todavía era ayer.
  function isoLocal(x){ var q=x||new Date(); var m=q.getMonth()+1, dd=q.getDate(); return q.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }
  var todayISO = isoLocal();

  function pillPago(estado){
    var e=(estado||'').toLowerCase();
    var cls = (e==='pagado') ? 'ok' : (e==='impagado' ? 'bad' : (e==='pendiente' ? 'warn' : ''));
    return '<span class="pill '+cls+'">'+esc(estado||'—')+'</span>';
  }
  // Estado de cuenta de un hijo: "Al día" o lo que quede por pagar
  function estadoPagos(rows){
    var deb = (rows||[]).filter(function(x){ var e=(x.estado||'').toLowerCase(); return e==='pendiente'||e==='impagado'; });
    if(!deb.length) return { txt:'Al día', cls:'ok' };
    var vencidos = deb.filter(function(x){ return x.fecha_vencimiento && x.fecha_vencimiento < todayISO; });
    if(vencidos.length) return { txt:'Hay '+vencidos.length+' recibo'+(vencidos.length>1?'s':'')+' sin pagar', cls:'bad' };
    return { txt:'Queda '+deb.length+' por cobrar', cls:'warn' };
  }

  // ---------- datos de la familia ----------
  var hijos = [];
  try {
    var r = await sb.from('atletas').select('id,nombre,apellidos,categoria,estado,grupo_id,fecha_nacimiento').eq('perfil_padre_id', perfil.id).order('nombre');
    if (!r.error && r.data) hijos = r.data;
  } catch (e) {}

  var cab = '<div class="fa-cab"><div><h1>Familia Apolana</h1>'+
    '<span class="sub">Hola, '+esc(perfil.nombre||'')+' · Zona de familias</span></div>'+
    '<div class="fa-ini" aria-hidden="true">'+esc(iniciales(perfil.nombre, perfil.apellidos))+'</div></div>';

  // Iconos de línea de 24 px, sin relleno, tal y como pide la maqueta 22c.
  var svg = function(p){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; };
  var icInicio  = svg('<path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>');
  var icEntreno = svg('<circle cx="15.5" cy="4.5" r="2"/><path d="M7 21l3-5.5 3.5-2.5-1-4.5-4 2-1.5 3"/><path d="M13.5 13l3.5 2 1.5 4"/>');
  var icAgenda  = svg('<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>');
  var icMarcas  = svg('<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>');
  var icMas     = '<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';
  var icPagos   = svg('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/>');
  var icLuna    = svg('<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>');
  var icCrono   = svg('<circle cx="12" cy="14" r="7"/><path d="M12 14V10M10 3h4M18.5 7l1.4-1.4"/>');
  var icNota    = svg('<path d="M20 15a3 3 0 0 1-3 3H9l-4 3v-3a3 3 0 0 1-1-2.2V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/>');

  if (!hijos.length) {
    wrap.innerHTML = cab + '<div class="tarjeta" style="margin-top:18px;"><p class="vacio">Todavía no vemos ningún hijo o hija enlazado a tu cuenta. En cuanto el club lo enlace, aquí verás su entreno, sus marcas y sus pagos. Si crees que es un error, avisa al club.</p></div>';
    return;
  }

  var IDS = hijos.map(function(h){ return h.id; });
  var nombreHijo = {}; hijos.forEach(function(h){ nombreHijo[h.id] = ((h.nombre||'')+' '+(h.apellidos||'')).trim(); });

  // Grupos (lectura pública): nombre y horario
  var grupos = {};
  var gids = hijos.map(function(h){return h.grupo_id;}).filter(function(v,i,a){return v && a.indexOf(v)===i;});
  if (gids.length) {
    try { var g = await sb.from('grupos').select('id,nombre,horario').in('id', gids); if(!g.error && g.data) g.data.forEach(function(x){ grupos[x.id]=x; }); } catch(e){}
  }

  // Pagos de todos los hijos
  var pagosPorHijo = {}; var pagosTodos = [];
  try {
    var pp = await sb.from('pagos').select('id,atleta_id,concepto,importe,estado,fecha_vencimiento,fecha_pago,notas').in('atleta_id', IDS).order('fecha_vencimiento',{ascending:false});
    if(!pp.error && pp.data){ pagosTodos = pp.data; pp.data.forEach(function(x){ (pagosPorHijo[x.atleta_id]=pagosPorHijo[x.atleta_id]||[]).push(x); }); }
  } catch(e){}

  // Tienda del club
  var productos = [];
  try { var pr = await sb.from('productos').select('nombre,descripcion,precio,tallas_disponibles,imagen_url').eq('activo',true).order('nombre').limit(6); if(!pr.error && pr.data) productos = pr.data; } catch(e){}

  // Competiciones que vienen (la inscripción se hace en la página de competiciones)
  var comps = [];
  try {
    var cc = await sb.from('competiciones').select('id,nombre,sede,fecha_inicio,inscripcion_abierta,fecha_limite_interna').gte('fecha_inicio', todayISO).order('fecha_inicio').limit(4);
    if(!cc.error && cc.data) comps = cc.data;
  } catch(e){}

  // Aviso del club y noticias recientes: alimentan Inicio y la pantalla «Más»
  var AVISO = null;
  try {
    var av = await sb.from('avisos').select('texto,tipo,enlace,texto_enlace').eq('activo',true).order('created_at',{ascending:false}).limit(1);
    if(!av.error && av.data && av.data.length && av.data[0].texto) AVISO = av.data[0];
  } catch(e){}
  var NOTIS = 0;
  try {
    var hace30 = isoLocal(new Date(Date.now()-30*86400000));
    var nn = await sb.from('noticias').select('id').eq('publicada',true).gte('fecha_publicacion',hace30).limit(20);
    if(!nn.error && nn.data) NOTIS = nn.data.length;
  } catch(e){}

  // ---------- datos por hijo (se cargan al entrar y se refrescan al avisar) ----------
  var D = {};
  async function cargarHijo(hid){
    var hijo = null; hijos.forEach(function(h){ if(h.id===hid) hijo=h; });
    var dat = { proximas:[], sesion:null, ausencias:[], notas:[], marcas:[] };

    if (hijo && hijo.grupo_id) {
      try {
        var pr = await sb.from('sesiones').select('id,fecha,tipo,rol,titulo').eq('grupo_id',hijo.grupo_id).eq('publicada',true).gte('fecha',todayISO).order('fecha',{ascending:true}).limit(6);
        if(!pr.error && pr.data) dat.proximas = pr.data;
      } catch(e){}
      try {
        var se = await sb.from('sesiones').select('id,fecha,tipo,rol,titulo,nota_razonamiento,bloques').eq('grupo_id',hijo.grupo_id).eq('publicada',true).order('fecha',{ascending:false}).limit(10);
        if(!se.error && se.data && se.data.length){ dat.sesion = se.data.filter(function(x){return x.fecha===todayISO;})[0] || se.data[0]; }
      } catch(e){}
    }
    try {
      var au = await sb.from('ausencias').select('id,fecha,motivo,sesion_id,avisado_por,avisado_por_nombre').eq('atleta_id',hid).gte('fecha',todayISO).order('fecha',{ascending:true});
      if(!au.error && au.data) dat.ausencias = au.data;
    } catch(e){}
    try {
      var nf = await sb.from('notas_familia').select('id,fecha,texto,autor_nombre').eq('atleta_id',hid).eq('visible',true).order('fecha',{ascending:false}).limit(5);
      if(!nf.error && nf.data) dat.notas = nf.data;
    } catch(e){}
    try {
      var mm = await sb.from('marcas_atleta').select('prueba,tiempo_display,fecha,sede,tipo,contexto').eq('atleta_id',hid).order('fecha',{ascending:false}).limit(80);
      if(!mm.error && mm.data) dat.marcas = mm.data;
    } catch(e){}

    D[hid] = dat;
    return dat;
  }

  // ---------- trozos de pantalla ----------
  function fichaHTML(hijo, dat){
    var gr = hijo.grupo_id ? grupos[hijo.grupo_id] : null;
    var est = estadoPagos(pagosPorHijo[hijo.id]);
    var linea = [hijo.categoria || 'Sin categoría', gr ? gr.nombre : 'Sin grupo asignado', gr && gr.horario ? gr.horario : ''].filter(Boolean).join(' · ');
    var e = edad(hijo.fecha_nacimiento);

    var html = '<div class="tarjeta"><div class="ficha-cab">'+
      '<span class="avatar">'+esc(iniciales(hijo.nombre,hijo.apellidos))+'</span>'+
      '<span class="fc-txt"><span class="fc-nombre">'+esc(nombreHijo[hijo.id])+'</span>'+
      '<span class="fc-linea">'+esc(linea)+'</span></span>'+
      '<span class="pill '+est.cls+'">'+esc(est.txt)+'</span>'+
      '</div>';
    if (e != null && e >= 14) {
      html += '<p class="aviso-caja" style="margin-top:14px;margin-bottom:0;">A partir de los 14 años '+esc(hijo.nombre||'')+' tiene su propia cuenta en el portal. Aquí seguís viendo los pagos, los entrenos publicados y las faltas; lo que hable con su entrenador (su feedback) es suyo.</p>';
    }
    html += '</div>';

    // La nota del entrenador vive en Inicio; aquí no se repite.
    html += marcasHTML(dat.marcas);
    return html;
  }

  // «Cómo va X»: la nota del entrenador, lo que más quiere leer una familia
  function notasHTML(hijo, dat){
    var titulo = 'Cómo va '+(hijo.nombre||'');
    var notas = dat.notas.length
      ? dat.notas.map(function(n){
          return '<div class="nota-fam"><span class="avatar chico">'+esc(iniciales(n.autor_nombre, (n.autor_nombre||'').split(' ')[1]))+'</span>'+
            '<span><span class="nf-firma">'+esc(n.autor_nombre||'Equipo técnico')+' · '+esc(fechaCorta(n.fecha))+'</span>'+
            '<p>'+esc(n.texto)+'</p></span></div>';
        }).join('')

  var MOTIVOS = ['Está malo', 'Cita médica', 'Asunto familiar', 'Estudios o exámenes', 'Viaje', 'Molestia o lesión', 'Otro'];
  // Solo se puede retirar un aviso que dio esta misma cuenta
  function esMio(a){ return !a.avisado_por || a.avisado_por === perfil.id; }
  function tituloSesion(s){ return s.titulo || (s.tipo ? ('Sesión de '+s.tipo) : 'Entrenamiento'); }

  // Cifras del entreno: series, ritmo objetivo y volumen total (maqueta 22a)
  function cifrasSesion(s){
    var bloques = (s && Array.isArray(s.bloques)) ? s.bloques : [];
    var principal = null;
    bloques.forEach(function(b){ if(!principal && /principal/i.test(b.etiqueta||'')) principal = b; });
    var filas = [];
    (principal?[principal]:bloques).forEach(function(b){ (b.filas||[]).forEach(function(f){ filas.push(f); }); });
    var f = null;
    filas.forEach(function(x){ if(!f && (x.series||x.ritmo)) f = x; });
    if(!f) f = filas[0];
    if(!f) return [];
    var out = [];
    if(f.series && f.distancia) out.push({v:String(f.series)+' × '+String(f.distancia).replace(/\s*m$/i,''), l:'Series'});
    else if(f.series) out.push({v:String(f.series), l:'Series'});
    else if(f.distancia) out.push({v:String(f.distancia), l:'Distancia'});
    if(f.ritmo) out.push({v:String(f.ritmo), l:'Ritmo obj.'});
    var nS = parseFloat(String(f.series||'').replace(',','.'));
    var mD = String(f.distancia||'').match(/(\d[\d.,]*)\s*m/i);
    if(nS>0 && mD){
      var metros = parseFloat(mD[1].replace(/\./g,'').replace(',','.'))*nS;
      if(metros>0) out.push({v: metros>=1000 ? (metros/1000).toFixed(metros%1000?1:0)+' km' : Math.round(metros)+' m', l:'Total'});
    } else if(f.tiempo) out.push({v:String(f.tiempo), l:'Tiempo'});
    return out.slice(0,3);
  }

      html += '<div class="prods">'+productos.map(function(p){
        var tallas = (p.tallas_disponibles && p.tallas_disponibles.length) ? ('Tallas '+p.tallas_disponibles.join(', ')) : (p.descripcion||'');
        return '<div class="prod"><span class="ph">'+(p.imagen_url?'<img src="'+esc(p.imagen_url)+'" alt="'+esc(p.nombre)+'">':'')+'</span>'+
          '<span class="cuerpo"><b>'+esc(p.nombre)+'</b><span>'+esc(tallas)+'</span>'+
          '<span class="precio">'+esc(eur(p.precio))+'</span></span></div>';
      }).join('')+'</div>';
    } else {
      html += '<p class="vacio">Todavía no hay equipación publicada en la tienda.</p>';
    }
    html += '<p style="margin-top:6px;"><a class="btn btn--primario" href="../../tienda/">Ir a la tienda</a></p>'+
      '<p class="vacio" style="margin-top:10px;">El pedido y el pago se hacen en la tienda del club, para que quede todo en un mismo sitio.</p>'+
      '</div>';
    return html;
  }

  // ---------- pintado ----------
  var SEC = 'inicio';
  var HIJO = hijos[0].id;
  /* Menú lateral (escritorio) con el mismo orden que la barra inferior.
     El tercer valor es un enlace a otra página; sin él, es una sección
     de esta misma página. */
  var SECCIONES = [
    ['inicio','Inicio'],
    ['entrenos','Entreno'],
    ['calendario','Calendario','../calendario/'],
    ['marcas','Marcas'],
    ['pagos','Pagos y recibos'],
    ['mas','Más']
  ];

  // Barra inferior única (maqueta 22c): Inicio · Entreno · Calendario · Marcas · Más
  function tabbarHTML(){
    // Pagos y Tienda se abren desde «Más»: la pestaña encendida sigue siendo Más
    var act = ({pagos:'mas', tienda:'mas'})[SEC] || SEC;
    function tab(sec,ic,txt){ return '<a data-sec="'+sec+'"'+(act===sec?' class="activo"':'')+'>'+ic+'<span>'+txt+'</span></a>'; }
    return '<nav class="tabbar">'+
      tab('inicio',icInicio,'Inicio')+
      tab('entrenos',icEntreno,'Entreno')+
      '<a href="../calendario/">'+icAgenda+'<span>Calendario</span></a>'+
      tab('marcas',icMarcas,'Marcas')+
      tab('mas',icMas,'Más')+
    '</nav>';
  }

  // ---------- MÁS (maqueta 22b): tres bloques, nunca lista plana ----------
  function filaMas(txt, extra, dest, cls){
    var d2 = dest && dest.charAt(0)!=='#' ? ' href="'+esc(dest)+'"' : (dest?' data-sec="'+esc(dest.slice(1))+'"':'');
    return '<a class="ml-fila'+(cls?' '+cls:'')+'"'+d2+'>'+
      '<span class="ml-txt">'+esc(txt)+'</span>'+(extra||'')+
      (dest?'<span class="ml-chev">&rsaquo;</span>':'')+'</a>';
  }
  function bloqueMas(titulo, filas){
    return '<div class="ml-bloque"><span class="ml-tit">'+esc(titulo)+'</span>'+
      '<div class="ml-caja">'+filas.join('')+'</div></div>';
  }
  function masHTML(){
    var deb = pagosTodos.filter(function(x){ var e=(x.estado||'').toLowerCase(); return e==='pendiente'||e==='impagado'; });
    var quien = ((perfil.nombre||'')+' '+(perfil.apellidos||'')).trim() || 'Mi cuenta';
    var sub = hijos.length===1 ? nombreHijo[hijos[0].id] : hijos.length+' hijos en el club';

    var html = '<h2 class="ml-cab">Más</h2>'+
      '<div class="ml-perfil"><span class="ml-avatar">'+esc(iniciales(perfil.nombre, perfil.apellidos))+'</span>'+
      '<span class="ml-quien"><b>'+esc(quien)+'</b><span>'+esc(sub)+'</span></span></div>';

    html += bloqueMas('El club', [
      filaMas('Noticias', NOTIS?'<span class="ml-num">'+NOTIS+'</span>':'', '../../noticias/'),
      filaMas('Competiciones', '', '../competiciones/'),
      filaMas('Galería', '', '../../galeria/'),
      filaMas('Tienda del club', '', '#tienda'),
      filaMas('Proponer un post', '', '../redes/')
    ]);

    html += bloqueMas('Mi cuenta', [
      filaMas('Pagos y recibos', deb.length?'<span class="ml-dato pend">'+deb.length+' pendiente'+(deb.length>1?'s':'')+'</span>':'<span class="ml-dato">Al día</span>', '#pagos'),
      filaMas('Familia Apolana', '<span class="ml-dato">'+hijos.length+' '+(hijos.length===1?'hijo':'hijos')+'</span>', '../../familias/'),
      filaMas('Bonos de El Cubo', '', '../cubo/'),
      filaMas('Documentos', '', '../documentos/'),
      filaMas('Ficha y marcas', '', '#marcas'),
      filaMas('Mis grupos', '<span class="ml-dato">'+esc(hijos.map(function(h){ var g=h.grupo_id?grupos[h.grupo_id]:null; return g?g.nombre:'sin grupo'; }).join(' · '))+'</span>', '')
    ]);

    html += bloqueMas('Ayuda', [
      filaMas('Escribir al club', '', '../../contacto/'),
      filaMas('Avisos del club', AVISO?'<span class="ml-dato pend">1</span>':'<span class="ml-dato">Ninguno</span>', '#inicio'),
      filaMas('Cerrar sesión', '', '', 'salir')
    ]);
    return html;
  }

  function pintar(){
    var hijo = null; hijos.forEach(function(h){ if(h.id===HIJO) hijo=h; });
    var dat = D[HIJO];

    var nav = '<aside class="side"><nav>'+SECCIONES.map(function(s){
      if (s[2]) return '<a href="'+s[2]+'">'+esc(s[1])+'</a>';
      return '<a data-sec="'+s[0]+'"'+(SEC===s[0]?' class="activo"':'')+'>'+esc(s[1])+'</a>';
    }).join('')+'</nav></aside>';

    // Con un solo hijo el selector no aporta nada: se quita
    var selector = '';
    if (hijos.length > 1 && (SEC==='inicio' || SEC==='marcas' || SEC==='entrenos')) {
      selector = '<div class="hijos-lista">'+hijos.map(function(h){
        var gr = h.grupo_id ? grupos[h.grupo_id] : null;
        var est = estadoPagos(pagosPorHijo[h.id]);
        return '<button class="hijo-card'+(h.id===HIJO?' activo':'')+'" data-hijo="'+esc(h.id)+'">'+
          '<span class="hc-nombre">'+esc(nombreHijo[h.id]||h.nombre||'')+'</span>'+
          '<span class="hc-meta">'+esc(h.categoria||'Sin categoría')+' · '+esc(gr?gr.nombre:'Sin grupo')+'</span>'+
          '<span class="hc-estado"><span class="pill '+est.cls+'">'+esc(est.txt)+'</span></span>'+
        '</button>';
      }).join('')+'</div>';
    }

    var cuerpo;
    if (SEC==='mas') cuerpo = masHTML();
    else if (SEC==='pagos') cuerpo = pagosHTML();
    else if (SEC==='tienda') cuerpo = tiendaHTML();
    else if (!dat) cuerpo = '<div class="tarjeta"><p class="vacio">Cargando…</p></div>';
    else if (SEC==='entrenos') cuerpo = entrenosHTML(hijo, dat);
    else if (SEC==='marcas') cuerpo = fichaHTML(hijo, dat);
    else cuerpo = inicioHTML(hijo, dat);

    // En «Más» manda su propio titular, como en la maqueta 22b
    var cabecera = (SEC==='mas') ? '' : cab;
    wrap.innerHTML = cabecera + '<div class="layout">'+nav+'<main class="cont">'+selector+cuerpo+'</main></div>'+ tabbarHTML();
  }

  // ---------- hoja de justificantes ----------
  function imprimirRecibos(){
    var hoja = document.getElementById('hoja-recibos');
    var cobrados = pagosTodos.filter(function(x){ return (x.estado||'').toLowerCase()==='pagado'; });
    if(!cobrados.length) return;
    var hoy = isoLocal();
    var html = '<h1>Justificantes de pago</h1>'+
      '<p style="margin:0 0 18px;font-size:13px;">Club Atletismo Apolana · Alicante — a nombre de '+esc(((perfil.nombre||'')+' '+(perfil.apellidos||'')).trim())+' · emitido el '+esc(fechaLarga(hoy))+'</p>';
    hijos.forEach(function(h){
      var rows = cobrados.filter(function(x){ return x.atleta_id===h.id; });
      if(!rows.length) return;
      var total = rows.reduce(function(a,x){ return a + (parseFloat(x.importe)||0); }, 0);
      html += '<div class="rc"><b>'+esc(nombreHijo[h.id])+'</b>'+
        '<table><thead><tr><th>Concepto</th><th>Fecha de cobro</th><th>Importe</th></tr></thead><tbody>'+
        rows.map(function(x){
          return '<tr><td>'+esc(x.concepto||'')+'</td><td>'+esc(x.fecha_pago?fechaLarga(x.fecha_pago):'—')+'</td><td>'+esc(eur(x.importe))+'</td></tr>';
        }).join('')+
        '<tr><td colspan="2"><b>Total</b></td><td><b>'+esc(eur(total))+'</b></td></tr>'+
        '</tbody></table></div>';
    });
    html += '<p class="pie">Documento informativo generado desde la zona de familias con los pagos que el club tiene marcados como cobrados. Si necesitáis una factura, escribid al club.</p>';
    hoja.innerHTML = html;
    document.documentElement.classList.add('imprimiendo');
    window.setTimeout(function(){
      window.print();
      document.documentElement.classList.remove('imprimiendo');
    }, 60);
  }

  // ---------- acciones ----------
  wrap.addEventListener('click', async function(ev){
    var t = ev.target;
    if(!t || !t.getAttribute) return;
    var el = t.closest ? t.closest('[data-sec],[data-hijo],[data-falta],[data-quitar],[data-accion],[data-url],[data-ir-falta],.ml-fila.salir') : t;
    if(!el) return;

    var url = el.getAttribute && el.getAttribute('data-url');
    if (url) { location.href = url; return; }
    // Cerrar sesión: lo mismo que hace la barra de arriba del portal
    if (el.classList && el.classList.contains('salir')) { await sb.auth.signOut(); location.reload(); return; }

    var sec = el.getAttribute('data-sec');
    if (sec) { SEC = sec; pintar(); window.scrollTo(0,0); return; }

    // Desde Inicio: ir a Entrenamientos con el día ya puesto en el formulario
    var irFalta = el.getAttribute('data-ir-falta');
    if (irFalta) {
      SEC = 'entrenos'; pintar();
      var ff = $('falta-fecha'); if(ff) ff.value = irFalta;
      var cf = $('caja-falta'); if(cf) cf.scrollIntoView({behavior:'smooth', block:'center'});
      var mf = $('falta-msg'); if(mf){ mf.className='msg'; mf.textContent='Elegid el motivo y dadle a «Enviar aviso».'; }
      return;
    }

    var hid = el.getAttribute('data-hijo');
    if (hid && hid !== HIJO) {
      HIJO = hid;
      if(!D[HIJO]){ pintar(); await cargarHijo(HIJO); }
      pintar();
      return;
    }
    if (hid) return;

    var falta = el.getAttribute('data-falta');
    if (falta) {
      var f = $('falta-fecha'); if(f) f.value = falta;
      var caja = $('caja-falta'); if(caja) caja.scrollIntoView({behavior:'smooth', block:'center'});
      var m = $('falta-msg'); if(m){ m.className='msg'; m.textContent='Elegid el motivo y dadle a «Enviar aviso».'; }
      return;
    }

    var quitar = el.getAttribute('data-quitar');
    if (quitar) {
      if(!await APX.confirm('¿Quitamos el aviso? Contaremos con que sí va a ir.', { aceptar:'Quitar aviso' })) return;
      var dq = await sb.from('ausencias').delete().eq('id', quitar);
      if (dq.error) { APX.toast('No se pudo quitar el aviso: '+dq.error.message, 'error'); return; }
      await cargarHijo(HIJO); pintar();
      return;
    }

    var acc = el.getAttribute('data-accion');
    if (acc === 'recibos') { imprimirRecibos(); return; }

    if (acc === 'enviar-falta') {
      var msg = $('falta-msg');
      var fecha = ($('falta-fecha')||{}).value || '';
      var motivo = ($('falta-motivo')||{}).value || '';
      var detalle = (($('falta-detalle')||{}).value || '').trim();
      if (!fecha) { msg.className='msg error'; msg.textContent='Poned primero el día.'; return; }
      if (fecha < todayISO) { msg.className='msg error'; msg.textContent='Solo se puede avisar de hoy en adelante.'; return; }
      var texto = motivo + (detalle ? ' · ' + detalle : '');

      // ¿hay una sesión publicada ese día? así el entrenador sabe a cuál
      var sesionId = null;
      (D[HIJO].proximas||[]).forEach(function(s){ if(s.fecha===fecha) sesionId = s.id; });

      msg.className='msg'; msg.textContent='Enviando el aviso…';
      var ins = await sb.from('ausencias').insert({ atleta_id: HIJO, fecha: fecha, motivo: texto, sesion_id: sesionId });
      if (ins.error && ins.error.code === '23505') {
        var upd = await sb.from('ausencias').update({ motivo: texto, sesion_id: sesionId }).eq('atleta_id', HIJO).eq('fecha', fecha);
        if (upd.error) { msg.className='msg error'; msg.textContent='No se pudo cambiar el aviso: '+upd.error.message; return; }
      } else if (ins.error) {
        msg.className='msg error';
        msg.textContent='No se pudo enviar el aviso: '+ins.error.message;
        return;
      }
      await cargarHijo(HIJO);
      pintar();
      var m2 = $('falta-msg');
      if (m2) { m2.className='msg ok'; m2.textContent='Aviso enviado para el '+formatFecha(fecha)+'. Su entrenador ya lo ve.'; }
      return;
    }
  });

  // ---------- arranque ----------
  pintar();
  await cargarHijo(HIJO);
  pintar();
});
</script>

</body>
</html>
