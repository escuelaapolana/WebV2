  /* ---------- PERMISO PARA LAS CLASIFICACIONES PÚBLICAS ----------
     Una casilla por menor: una familia con dos hijos puede querer una cosa
     para uno y otra para el otro. Debajo, qué se publica y qué no, y que se
     puede retirar cuando se quiera. No tiene nada que ver con el perfil
     visible entre socios, y en la pantalla se dice. */
  // Lo que se lee en «Más» sin tener que entrar: cuántos menores están autorizados
  function permisoResumen(){
    var m = menoresCasa();
    // Sin poder leerlo no se dice «Sin autorizar»: puede estar autorizado.
    if (falloJuego) return '<span class="ml-dato">Sin comprobar</span>';
    if (!m.length) return '<span class="ml-dato">No hace falta</span>';
    var si = m.filter(function(h){ return autorizado(h.id); }).length;
    if (si === 0) return '<span class="ml-dato pend">Sin autorizar</span>';
    if (si === m.length) return '<span class="ml-dato">'+(m.length===1?'Autorizado':'Los '+m.length+', autorizados')+'</span>';
    return '<span class="ml-dato pend">'+si+' de '+m.length+'</span>';
  }

  function permisosHTML(){
    var menores = menoresCasa();
    var mayores = hijos.filter(function(h){ return !ES_MENOR[h.id]; });
    var html = '<div class="tarjeta">'+
      '<h2>El nombre en las clasificaciones</h2>'+
      '<p class="intro-perm">El club publica los récords, el palmarés y el ranking por prueba en su web. '+
      'El nombre de un menor solo aparece ahí si su familia lo autoriza. Podéis decidirlo para cada hijo por separado.</p>';

    /* Con la consulta caída, todos los interruptores saldrían apagados y eso
       se leería como «no lo habéis autorizado». No se enseñan hasta saberlo. */
    if (falloJuego) {
      html += htmlError('No hemos podido ver qué tenéis autorizado',
        'Puede ser la conexión. Lo que hayáis decidido sigue guardado tal cual: volved a intentarlo en un momento.',
        async function(){ await cargarJuego(); pintar(); });
    } else if (!menores.length) {
      html += APOLANA_UI.vacio('Aquí no hay nada que autorizar',
        'Ninguno de vuestros hijos es menor de edad, así que su nombre aparece en las clasificaciones del club sin que haga falta permiso. Si alguno prefiere no salir, escribidnos y lo quitamos.',
        APOLANA_UI.boton('Escribir al club', '../../contacto/'));
    } else {
      html += '<div class="perm-lista">'+menores.map(function(h){
        var si = autorizado(h.id);
        var j = JUEGO[h.id] || {};
        var quien = j.autoriza_parental_en
          ? 'Autorizado el '+esc(fechaCorta(String(j.autoriza_parental_en).slice(0,10)))+
            (j.autoriza_parental_por===perfil.id ? ' por ti' : ' desde esta cuenta')
          : 'Sin autorizar: su nombre no aparece en las clasificaciones';
        return '<div class="perm-uno">'+
          '<label class="interruptor" for="perm-'+esc(h.id)+'">'+
            '<input type="checkbox" id="perm-'+esc(h.id)+'" data-perm="'+esc(h.id)+'"'+(si?' checked':'')+'>'+
            '<span class="palanca" aria-hidden="true"></span>'+
            '<span class="texto">Autorizo a que el nombre de '+esc(h.nombre||'mi hijo/a')+' aparezca en las clasificaciones públicas del club</span>'+
          '</label>'+
          '<p class="perm-estado'+(si?' si':'')+'">'+quien+'</p>'+
        '</div>';
      }).join('')+'</div>'+
      '<p class="msg" id="perm-msg"></p>';
    }

    /* La letra pequeña de qué se publica se lee una vez, al decidir: se
       queda entera, pero plegada, para no leerla cada vez que se entra. */
    html += '<details class="plegable"><summary>Qué se publica y qué no<span class="fl" aria-hidden="true"></span></summary>'+
      '<div class="cuerpo"><div class="perm-detalle" style="border-top:0;padding-top:0;">'+
      '<b>Qué se publica</b>'+
      '<ul><li>Su nombre y apellidos junto a su marca, en récords, palmarés y ranking por prueba.</li>'+
      '<li>La prueba, la marca, la fecha y el lugar de esa marca.</li></ul>'+
      '<b>Qué no se publica nunca</b>'+
      '<ul><li>Su edad exacta ni su fecha de nacimiento.</li>'+
      '<li>Fotos suyas.</li>'+
      '<li>Teléfono, correo, dirección ni ningún dato de contacto.</li>'+
      '<li>Nada de pagos ni de recibos.</li></ul>'+
      '<p>Se puede retirar cuando queráis desde esta misma pantalla: al quitarlo, su nombre desaparece de las clasificaciones y su marca pasa a salir sin nombre.</p>'+
      '</div></div></details></div>';

    if (mayores.length) {
      html += '<div class="tarjeta"><h2>Ya son mayores de edad</h2>'+
        '<p class="intro-perm">'+esc(mayores.map(function(h){ return h.nombre||''; }).filter(Boolean).join(', '))+
        ': su nombre aparece en las clasificaciones sin que haga falta vuestro permiso, porque ya deciden ellos. '+
        'Lo cambian desde su propia cuenta, en «Mi perfil».</p></div>';
    }

    html += '<div class="tarjeta"><h2>No lo confundáis con el perfil entre socios</h2>'+
      '<p class="intro-perm">Son dos cosas distintas. Esto de arriba es <b>el nombre en las clasificaciones públicas</b> de la web. '+
      'El <b>perfil que ven otros socios</b> dentro de la app es otra cosa, y <b>los menores no lo tienen, ni con vuestro permiso</b>: '+
      'las medallas y los retos de vuestro hijo los veis vosotros y su entrenador, y nadie más.</p></div>';

    return html;
  }

  async function guardarPermiso(id, si){
    var m = document.getElementById('perm-msg');
    if (m) { m.className='msg'; m.textContent='Guardando…'; }
    // La base exige que, si hay fecha, haya también quién autorizó
    var fila = si
      ? { atleta_id:id, autoriza_parental_por: perfil.id, autoriza_parental_en: new Date().toISOString() }
      : { atleta_id:id, autoriza_parental_por: null, autoriza_parental_en: null };
    var r = await sb.from('perfil_juego').upsert(fila, { onConflict:'atleta_id' });
    if (r.error) {
      if (m) { m.className='msg error'; m.textContent='No se ha podido guardar: '+r.error.message; }
      var cb = document.getElementById('perm-'+id); if (cb) cb.checked = !si;   // se deshace en pantalla
      return;
    }
    JUEGO[id] = { atleta_id:id, autoriza_parental_por: fila.autoriza_parental_por, autoriza_parental_en: fila.autoriza_parental_en };
    if (window.APX && APX.toast) APX.toast(si ? 'Autorización guardada' : 'Autorización retirada');
    pintar();
  }

  function pintar(){
    var hijo = null; hijos.forEach(function(h){ if(h.id===HIJO) hijo=h; });
    var dat = D[HIJO];

    var nav = '<aside class="side"><nav>'+SECCIONES.map(function(s){
      if (s[2]) return '<a href="'+s[2]+'">'+esc(s[1])+'</a>';
      return '<a data-sec="'+s[0]+'"'+(SEC===s[0]?' class="activo"':'')+'>'+esc(s[1])+'</a>';
    }).join('')+'</nav></aside>';

    // Con un solo hijo el selector no aporta nada: se quita
    var selector = '';
    if (hijos.length > 1 && (SEC==='inicio' || SEC==='marcas' || SEC==='entrenos')) {
      /* Aquí se elige de qué hijo se está hablando: el nombre, su categoría y
         su grupo. El estado de los pagos no: se dice una vez, en Inicio. */
      selector = '<div class="hijos-lista">'+hijos.map(function(h){
        var gr = h.grupo_id ? grupos[h.grupo_id] : null;
        return '<button class="hijo-card'+(h.id===HIJO?' activo':'')+'" data-hijo="'+esc(h.id)+'">'+
          '<span class="hc-nombre">'+esc(nombreHijo[h.id]||h.nombre||'')+'</span>'+
          '<span class="hc-meta">'+esc(h.categoria||'Sin categoría')+' · '+esc(gr?gr.nombre:(falloGrupos?'grupo sin cargar':'sin grupo'))+'</span>'+
        '</button>';
      }).join('')+'</div>';
    }

    var cuerpo;
    if (SEC==='mas') cuerpo = masHTML();
    else if (SEC==='permisos') cuerpo = permisosHTML();
    else if (SEC==='pagos') cuerpo = pagosHTML();
    else if (SEC==='tienda') cuerpo = tiendaHTML();
    // Nunca «Cargando…» en gris: un bloque con la forma de lo que llega (28f)
    else if (!dat) cuerpo = '<div class="tarjeta">'+ APOLANA_UI.cargando('filas', 4) +'</div>';
    else if (SEC==='entrenos') cuerpo = entrenosHTML(hijo, dat);
    else if (SEC==='marcas') cuerpo = fichaHTML(hijo, dat);
    else cuerpo = inicioHTML(hijo, dat);

    // En «Más» manda su propio titular, como en la maqueta 22b
    var cabecera = (SEC==='mas') ? '' : cab;
    wrap.innerHTML = cabecera + '<div class="layout">'+nav+'<main class="cont">'+selector+cuerpo+'</main></div>'+ tabbarHTML();
    // Los botones de «Copiar» del bloque «Cómo se paga». Va sobre `wrap`, que
    // no se destruye al cambiar de sección, así que se engancha una sola vez.
    if(window.APOLANA_INFO_PAGOS) APOLANA_INFO_PAGOS.activar(wrap);
  }

  // ---------- hoja de justificantes ----------
  function imprimirRecibos(){
    var hoja = document.getElementById('hoja-recibos');
    var cobrados = pagosTodos.filter(function(x){ return (x.estado||'').toLowerCase()==='pagado'; });
    if(!cobrados.length) return;
    var hoy = isoLocal();
    var html = '<h1>Justificantes de pago</h1>'+
      '<p style="margin:0 0 18px;font-size:13px;">Club Atletismo Apolana · Alicante — a nombre de '+esc(((perfil.nombre||'')+' '+(perfil.apellidos||'')).trim())+' · emitido el '+esc(fechaLarga(hoy))+'</p>';
    hijos.forEach(function(h){
      var rows = cobrados.filter(function(x){ return x.atleta_id===h.id; });
      if(!rows.length) return;
      var total = rows.reduce(function(a,x){ return a + (parseFloat(x.importe)||0); }, 0);
      html += '<div class="rc"><b>'+esc(nombreHijo[h.id])+'</b>'+
        '<table><thead><tr><th>Concepto</th><th>Fecha de cobro</th><th>Importe</th></tr></thead><tbody>'+
        rows.map(function(x){
          return '<tr><td>'+esc(x.concepto||'')+'</td><td>'+esc(x.fecha_pago?fechaLarga(x.fecha_pago):'—')+'</td><td>'+esc(eur(x.importe))+'</td></tr>';
        }).join('')+
        '<tr><td colspan="2"><b>Total</b></td><td><b>'+esc(eur(total))+'</b></td></tr>'+
        '</tbody></table></div>';
    });
    html += '<p class="pie">Documento informativo generado desde la zona de familias con los pagos que el club tiene marcados como cobrados. Si necesitáis una factura, escribid al club.</p>';
    hoja.innerHTML = html;
    document.documentElement.classList.add('imprimiendo');
    window.setTimeout(function(){
      window.print();
      document.documentElement.classList.remove('imprimiendo');
    }, 60);
  }

  // La casilla del permiso de clasificaciones: se guarda al momento
  wrap.addEventListener('change', function(ev){
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var id = t.getAttribute('data-perm');
    if (id) guardarPermiso(id, !!t.checked);
  });

  // ---------- acciones ----------
  wrap.addEventListener('click', async function(ev){
    var t = ev.target;
    if(!t || !t.getAttribute) return;
    var el = t.closest ? t.closest('[data-sec],[data-hijo],[data-falta],[data-quitar],[data-accion],[data-url],[data-ir-falta],.ml-fila.salir') : t;
    if(!el) return;

    var url = el.getAttribute && el.getAttribute('data-url');
    if (url) { location.href = url; return; }
    // Cerrar sesión: lo mismo que hace la barra de arriba del portal
    if (el.classList && el.classList.contains('salir')) { await sb.auth.signOut(); location.reload(); return; }

    var sec = el.getAttribute('data-sec');
    if (sec) { SEC = sec; pintar(); window.scrollTo(0,0); return; }

    // Desde Inicio: ir a Entrenamientos con el día ya puesto en el formulario
    var irFalta = el.getAttribute('data-ir-falta');
    if (irFalta) {
      SEC = 'entrenos'; pintar();
      var ff = $('falta-fecha'); if(ff) ff.value = irFalta;
      var cf = $('caja-falta'); if(cf) cf.scrollIntoView({behavior:'smooth', block:'center'});
      var mf = $('falta-msg'); if(mf){ mf.className='msg'; mf.textContent='Elegid el motivo y dadle a «Avisar falta».'; }
      return;
    }

    var hid = el.getAttribute('data-hijo');
    if (hid && hid !== HIJO) {
      HIJO = hid;
      if(!D[HIJO]){ pintar(); await cargarHijo(HIJO); }
      pintar();
      return;
    }
    if (hid) return;

    var falta = el.getAttribute('data-falta');
    if (falta) {
      var f = $('falta-fecha'); if(f) f.value = falta;
      var caja = $('caja-falta'); if(caja) caja.scrollIntoView({behavior:'smooth', block:'center'});
      var m = $('falta-msg'); if(m){ m.className='msg'; m.textContent='Elegid el motivo y dadle a «Avisar falta».'; }
      return;
    }

    var quitar = el.getAttribute('data-quitar');
    if (quitar) {
      if(!await APX.confirm('¿Quitamos la falta? Contaremos con que sí va a ir.', { aceptar:'Quitar falta' })) return;
      var dq = await sb.from('ausencias').delete().eq('id', quitar);
      if (dq.error) { APX.toast('No se pudo quitar la falta: '+dq.error.message, 'error'); return; }
      await cargarHijo(HIJO); pintar();
      return;
    }

    var acc = el.getAttribute('data-accion');
    if (acc === 'recibos') { imprimirRecibos(); return; }
    if (acc === 'ver-recibos') { VER_TODOS_RECIBOS = true; pintar(); return; }

    if (acc === 'enviar-falta') {
      var msg = $('falta-msg');
      var fecha = ($('falta-fecha')||{}).value || '';
      var motivo = ($('falta-motivo')||{}).value || '';
      var detalle = (($('falta-detalle')||{}).value || '').trim();
      if (!fecha) { msg.className='msg error'; msg.textContent='Poned primero el día.'; return; }
      if (fecha < todayISO) { msg.className='msg error'; msg.textContent='Solo se puede avisar de hoy en adelante.'; return; }
      var texto = motivo + (detalle ? ' · ' + detalle : '');

      // ¿hay una sesión publicada ese día? así el entrenador sabe a cuál
      var sesionId = null;
      (D[HIJO].proximas||[]).forEach(function(s){ if(s.fecha===fecha) sesionId = s.id; });

      msg.className='msg'; msg.textContent='Avisando la falta…';
      var ins = await sb.from('ausencias').insert({ atleta_id: HIJO, fecha: fecha, motivo: texto, sesion_id: sesionId });
      if (ins.error && ins.error.code === '23505') {
        var upd = await sb.from('ausencias').update({ motivo: texto, sesion_id: sesionId }).eq('atleta_id', HIJO).eq('fecha', fecha);
        if (upd.error) { msg.className='msg error'; msg.textContent='No se pudo cambiar la falta: '+upd.error.message; return; }
      } else if (ins.error) {
        msg.className='msg error';
        msg.textContent='No se pudo avisar la falta: '+ins.error.message;
        return;
      }
      await cargarHijo(HIJO);
      pintar();
      var m2 = $('falta-msg');
      if (m2) { m2.className='msg ok'; m2.textContent='Falta avisada para el '+formatFecha(fecha)+'. Su entrenador ya la ve.'; }
      return;
    }
  });

  // ---------- arranque ----------
  // La barra inferior del resto de pantallas del portal enlaza aquí con
  // #entrenos, #marcas, #pagos o #mas: se abre esa sección al entrar.
  (function(){
    var VALIDAS = ['inicio','entrenos','marcas','pagos','mas','tienda'];
    function secDelHash(){
      var h = (location.hash||'').replace(/^#/,'');
      return VALIDAS.indexOf(h)!==-1 ? h : null;
    }
    var s = secDelHash();
    if (s) SEC = s;
    window.addEventListener('hashchange', function(){
      var x = secDelHash();
      if (x && x !== SEC) { SEC = x; pintar(); window.scrollTo(0,0); }
    });
  })();
  pintar();
  await cargarHijo(HIJO);
  pintar();
});
</script>
