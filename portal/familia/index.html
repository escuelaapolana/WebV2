<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familia · Portal Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<script src="../../assets/js/portal-auth.js"></script>
<script src="../../assets/js/portal-tabbar.js" defer></script>
<style>
  :root{ --fa-agua:#2E8C86; }
  body{ background:var(--crema,#FBF9F4); }
  #fa{ max-width:820px; margin:0 auto; padding:clamp(16px,4vw,26px) clamp(14px,4vw,22px) 60px; }
  .fa-cab h1{ font-family:var(--fuente-titulo); text-transform:uppercase; font-size:clamp(24px,5vw,32px); color:var(--navy); margin:0 0 3px; }
  .fa-cab p{ font-size:14.5px; color:var(--texto-suave); margin:0 0 6px; }
  .fa-rot{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--texto-suave); margin:26px 0 12px; }
  .fa-msg{ color:var(--texto-suave); text-align:center; padding:26px 10px; }

  /* Avisos */
  .fa-avisos{ display:flex; flex-direction:column; gap:9px; }
  .fa-aviso{ background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-left:4px solid var(--mm-acento,#2F6FA8); border-radius:12px; padding:12px 15px; }
  .fa-aviso b{ display:block; color:var(--navy); font-size:15px; }
  .fa-aviso span{ font-size:13px; color:var(--texto-suave); }
  .fa-aviso .fch{ font-family:var(--fuente-dato); font-size:11.5px; color:var(--texto-tenue); }

  /* Tarjeta de hijo/a */
  .fa-hijo{ background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--sombra-suave,0 10px 22px -16px rgba(46,66,86,.5)); padding:15px 16px; margin-bottom:14px; }
  .fa-hijo-cab{ display:flex; align-items:center; gap:12px; }
  .fa-ava{ width:44px; height:44px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; color:#fff; font-weight:700; font-size:16px; font-family:var(--fuente-titulo); background:var(--fa-agua); }
  .fa-hijo-cab .nom{ flex:1 1 auto; min-width:0; }
  .fa-hijo-cab .nom b{ display:block; font-size:17px; color:var(--navy); font-family:var(--fuente-titulo); line-height:1.1; }
  .fa-hijo-cab .nom span{ font-size:12.5px; color:var(--texto-suave); }
  .fa-fichabtn{ flex:0 0 auto; font:inherit; font-size:12.5px; font-weight:600; color:var(--navy); background:var(--crema,#F4EEE1); border:1px solid var(--linea,#EAE3D5); border-radius:999px; padding:7px 13px; cursor:pointer; }

  /* Entrenos (desplegables) */
  .fa-entrenos{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .fa-ent{ border:1px solid var(--linea,#EAE3D5); border-radius:12px; overflow:hidden; }
  .fa-ent-cab{ width:100%; display:flex; align-items:center; gap:11px; background:#fff; border:0; padding:11px 13px; cursor:pointer; font:inherit; text-align:left; min-height:52px; }
  .fa-ent-cab:hover{ background:var(--crema,#FBF9F4); }
  .fa-ent-cab .hh{ font-family:var(--fuente-dato); font-weight:700; color:var(--fa-agua); font-size:14px; min-width:74px; }
  .fa-ent-cab .qq{ flex:1 1 auto; min-width:0; }
  .fa-ent-cab .qq b{ display:block; color:var(--navy); font-size:14.5px; }
  .fa-ent-cab .qq span{ font-size:12.5px; color:var(--texto-suave); }
  .fa-ent-cab .chev{ transition:transform .18s; color:var(--texto-tenue); }
  .fa-ent.abierto .fa-ent-cab .chev{ transform:rotate(90deg); }
  .fa-ent-cuerpo{ display:none; padding:4px 14px 14px; border-top:1px solid var(--linea,#EFEAE0); background:var(--crema,#FBF9F4); }
  .fa-ent.abierto .fa-ent-cuerpo{ display:block; }
  .fa-sub{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--texto-suave); margin:12px 0 7px; }
  .fa-comp{ display:flex; flex-wrap:wrap; gap:6px; }
  .fa-comp span{ font-size:12.5px; color:var(--navy); background:#fff; border:1px solid var(--linea,#EAE3D5); border-radius:999px; padding:4px 10px; }
  .fa-faltas{ display:flex; flex-wrap:wrap; gap:7px; }
  .fa-falta{ font:inherit; font-size:12.5px; color:var(--navy); background:#fff; border:1px solid var(--linea-borde,#D4CBB9); border-radius:10px; padding:7px 11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:58px; }
  .fa-falta small{ font-size:10.5px; color:var(--texto-suave); }
  .fa-falta.no{ background:#FBE3E1; border-color:#F1C7C3; color:#B3261E; }
  .fa-falta.no small{ color:#B3261E; }

  /* Ficha */
  .fa-ficha{ display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--linea,#EAE3D5); }
  .fa-ficha.abierta{ display:block; }
  .fa-campo{ display:flex; flex-direction:column; gap:3px; margin-bottom:10px; }
  .fa-campo label{ font-size:12px; font-weight:600; color:var(--texto-suave); }
  .fa-campo input{ font:inherit; font-size:14.5px; color:var(--navy); border:1px solid var(--linea-borde,#D4CBB9); border-radius:10px; padding:9px 11px; background:#fff; }
  .fa-campo input:disabled{ background:var(--crema,#F4EEE1); color:var(--texto-suave); }
  .fa-dato{ font-size:13px; color:var(--texto-suave); }
  .fa-guardar{ font:inherit; font-weight:600; font-size:14px; background:var(--fa-agua); color:#fff; border:0; border-radius:10px; padding:9px 18px; min-height:42px; cursor:pointer; }
  .fa-guardar:disabled{ opacity:.5; }

  /* Todo lo que hay en el club */
  .fa-club-btn{ width:100%; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:14px; padding:14px 16px; cursor:pointer; font:inherit; text-align:left; }
  .fa-club-btn b{ flex:1; color:var(--navy); font-size:15.5px; }
  .fa-club-btn span{ font-size:12.5px; color:var(--texto-suave); }
  .fa-club-cuerpo{ display:none; margin-top:10px; }
  .fa-club-cuerpo.abierto{ display:block; }
  .fa-sec{ background:#fff; border:1px solid var(--linea,#EAE3D5); border-radius:12px; padding:12px 14px; margin-bottom:9px; }
  .fa-sec h4{ margin:0 0 7px; font-family:var(--fuente-titulo); font-size:15px; color:var(--navy); text-transform:capitalize; }
  .fa-sec .g{ font-size:13.5px; color:var(--texto); padding:3px 0; display:flex; gap:8px; flex-wrap:wrap; }
  .fa-sec .g b{ color:var(--navy); }
  .fa-sem{ display:inline-block; width:9px; height:9px; border-radius:999px; margin-right:2px; }
  .fa-sem.verde{ background:#2E9E5B; } .fa-sem.ambar{ background:#E0A32E; } .fa-sem.rojo{ background:#C0453A; }

  .fa-toast{ position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); opacity:0; transition:.22s; z-index:60; background:var(--navy,#2E4256); color:#fff; font-size:14px; padding:10px 18px; border-radius:999px; box-shadow:0 12px 26px -10px rgba(30,45,65,.5); max-width:calc(100% - 32px); text-align:center; }
  .fa-toast.ver{ opacity:1; transform:translate(-50%,0); } .fa-toast.err{ background:#B0563A; }
</style>
</head>
<body>
  <div id="fa"><p class="fa-msg">Cargando…</p></div>
  <div class="fa-toast" id="fa-toast"></div>
<script>
APOLANA_PORTAL.listo(async function (sb, perfil) {
  var wrap = document.getElementById('fa');
  var toast = document.getElementById('fa-toast');
  var DIAS = ['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  var DIAS_C = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function ini(n){ var p=String(n||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
  var _t; function avisar(m,err){ toast.textContent=m; toast.className='fa-toast ver'+(err?' err':''); clearTimeout(_t); _t=setTimeout(function(){toast.className='fa-toast';}, err?3600:2000); }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  // Próximas N fechas (iso) de un día de la semana (1..7, lun..dom), desde hoy.
  function proximas(dia, n){
    var out=[], d=new Date(), t=(Number(dia)===7)?0:Number(dia);
    for (var i=0; i<70 && out.length<n; i++){ if (d.getDay()===t) out.push(iso(d)); d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); }
    return out;
  }
  function fechaCorta(isoStr){ var p=isoStr.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return DIAS_C[d.getDay()]+' '+d.getDate(); }

  // --------- datos ---------
  var rmp = await sb.rpc('natacion_mis_plazas');
  var plazas = (rmp && !rmp.error && Array.isArray(rmp.data)) ? rmp.data : [];
  // Agrupar por nadador (hijo o uno mismo)
  var porHijo = {};
  plazas.forEach(function(p){ var k=p.atleta_id||('x'); (porHijo[k]=porHijo[k]||{nombre:p.de, id:p.atleta_id, franjas:[]}).franjas.push(p); });
  var HIJOS = Object.keys(porHijo).map(function(k){ return porHijo[k]; });
  HIJOS.forEach(function(h){ h.franjas.sort(function(a,b){ return a.dia!==b.dia?a.dia-b.dia:(a.hora<b.hora?-1:1); }); });

  // Fichas (para la ficha editable)
  var FICHA = {};
  var ids = HIJOS.map(function(h){ return h.id; }).filter(Boolean);
  if (ids.length){
    var rf = await sb.from('atletas').select('id,nombre,apellidos,fecha_nacimiento,telefono,nombre_tutor,telefono_tutor,email_tutor').in('id', ids);
    if (rf && !rf.error && rf.data) rf.data.forEach(function(a){ FICHA[a.id]=a; });
  }

  // Avisos (noticias publicadas)
  var AVISOS=[];
  try { var rn = await sb.from('noticias').select('titulo,excerpt,fecha_publicacion').eq('publicada',true).order('fecha_publicacion',{ascending:false}).limit(3); if (rn && !rn.error && rn.data) AVISOS=rn.data; } catch(e){}

  // --------- pintar ---------
  function faltaChip(hijoId, franjaId, fe, marcada){
    var p=fe.split('-'); var etiqueta=fechaCorta(fe);
    return '<button class="fa-falta'+(marcada?' no':'')+'" data-falta="'+esc(hijoId)+'|'+esc(franjaId)+'|'+esc(fe)+'">'+
      esc(etiqueta)+'<small>'+(marcada?'No viene':'Sí va')+'</small></button>';
  }
  function pintaEntreno(h, p){
    var comps = (p.companeros||[]);
    var faltasSet = {}; (p.ausencias||[]).forEach(function(f){ faltasSet[f]=1; });
    var fechas = proximas(p.dia, 4);
    var detalle = [p.grupo, p.calle, p.nivel].filter(Boolean).join(' · ');
    return '<div class="fa-ent">'+
      '<button class="fa-ent-cab" data-toggle="1"><span class="hh">'+esc(DIAS_C[(Number(p.dia)===7?0:Number(p.dia))]).toUpperCase()+' '+esc(p.hora)+'</span>'+
        '<span class="qq"><b>Natación</b><span>'+esc(detalle)+'</span></span><span class="chev">›</span></button>'+
      '<div class="fa-ent-cuerpo">'+
        '<div class="fa-sub">¿Algún día no viene?</div>'+
        '<div class="fa-faltas">'+ fechas.map(function(fe){ return faltaChip(h.id, p.franja_id, fe, !!faltasSet[fe]); }).join('') +'</div>'+
        (comps.length ? '<div class="fa-sub">Compañeros de esa franja</div><div class="fa-comp">'+comps.map(function(c){ return '<span>'+esc(c)+'</span>'; }).join('')+'</div>' : '')+
      '</div>'+
    '</div>';
  }
  function pintaFicha(h){
    var f=FICHA[h.id]||{};
    return '<div class="fa-ficha" data-ficha="'+esc(h.id)+'">'+
      '<div class="fa-campo"><label>Nombre</label><input value="'+esc((f.nombre||'')+' '+(f.apellidos||''))+'" disabled></div>'+
      (f.email_tutor?'<div class="fa-campo"><label>Correo de acceso (no se cambia aquí)</label><input value="'+esc(f.email_tutor)+'" disabled></div>':'')+
      '<div class="fa-campo"><label>Nombre del padre/madre o tutor</label><input data-f="nombre_tutor" value="'+esc(f.nombre_tutor||'')+'"></div>'+
      '<div class="fa-campo"><label>Teléfono del tutor</label><input data-f="telefono_tutor" value="'+esc(f.telefono_tutor||'')+'" inputmode="tel"></div>'+
      '<div class="fa-campo"><label>Teléfono del niño/a (opcional)</label><input data-f="telefono" value="'+esc(f.telefono||'')+'" inputmode="tel"></div>'+
      '<button class="fa-guardar" data-guardar="'+esc(h.id)+'">Guardar cambios</button>'+
    '</div>';
  }
  function pintaHijo(h){
    return '<div class="fa-hijo" data-hijo="'+esc(h.id)+'">'+
      '<div class="fa-hijo-cab"><span class="fa-ava">'+esc(ini(h.nombre).toUpperCase())+'</span>'+
        '<span class="nom"><b>'+esc(h.nombre)+'</b><span>'+h.franjas.length+' '+(h.franjas.length===1?'entrenamiento':'entrenamientos')+' por semana</span></span>'+
        '<button class="fa-fichabtn" data-verficha="'+esc(h.id)+'">Ficha</button></div>'+
      '<div class="fa-entrenos">'+ (h.franjas.length? h.franjas.map(function(p){ return pintaEntreno(h,p); }).join('') : '<p class="fa-dato" style="padding:4px 2px">Todavía sin franja asignada. En cuanto el club lo coloque, aparecerá aquí.</p>') +'</div>'+
      pintaFicha(h)+
    '</div>';
  }

  var CLUB_HTML = '';   // se rellena al abrir (lazy)

  function render(){
    var html = '<div class="fa-cab"><h1>Zona de familias</h1><p>'+esc(perfil.nombre||'Bienvenida')+' · aquí tienes lo de tus hijos/as en el club.</p></div>';
    if (AVISOS.length){
      html += '<p class="fa-rot">Avisos del club</p><div class="fa-avisos">'+ AVISOS.map(function(a){
        var fe=a.fecha_publicacion?(function(){var p=String(a.fecha_publicacion).split('-'); return p[2]*1+' '+MESES_C[(p[1]*1)-1];})():'';
        return '<div class="fa-aviso"><b>'+esc(a.titulo||'')+'</b>'+(a.excerpt?'<span>'+esc(a.excerpt)+'</span>':'')+(fe?' <span class="fch">· '+esc(fe)+'</span>':'')+'</div>';
      }).join('') +'</div>';
    }
    html += '<p class="fa-rot">Mis hijos/as y sus entrenamientos</p>';
    html += HIJOS.length ? HIJOS.map(pintaHijo).join('') : '<p class="fa-msg">Aún no vemos a nadie asociado a tu cuenta. Si crees que es un error, dínoslo por WhatsApp.</p>';
    html += '<p class="fa-rot">Todo lo que hay en el club</p>'+
      '<button class="fa-club-btn" id="fa-club"><b>Ver horarios de todas las secciones</b><span>Natación, escuela, pista, El Cubo… por si queréis probar algo</span></button>'+
      '<div class="fa-club-cuerpo" id="fa-club-cuerpo"></div>';
    wrap.innerHTML = html;
  }
  render();

  // --------- Todo lo que hay en el club (lazy) ---------
  async function cargarClub(){
    var cont = document.getElementById('fa-club-cuerpo');
    cont.innerHTML = '<p class="fa-dato" style="padding:8px 2px">Cargando horarios…</p>';
    var html='';
    // Natación (vista pública con semáforo)
    try {
      var rv = await sb.from('natacion_vacantes').select('dia,hora,grupo,semaforo').order('dia').order('hora');
      if (rv && !rv.error && rv.data && rv.data.length){
        html += '<div class="fa-sec"><h4>Natación</h4>'+ rv.data.map(function(f){
          return '<div class="g"><span class="fa-sem '+esc(f.semaforo||'')+'"></span><b>'+esc(DIAS[f.dia]||'')+' '+esc(String(f.hora).slice(0,5))+'</b> · '+esc(f.grupo||'')+'</div>';
        }).join('') +'</div>';
      }
    } catch(e){}
    // Otras secciones (grupos + horarios)
    try {
      var rg = await sb.from('grupos').select('id,nombre,seccion');
      var rh = await sb.from('grupo_horarios').select('grupo_id,dia_semana,hora_inicio,hora_fin,lugar').eq('activo',true);
      if (rg && !rg.error && rg.data && rh && !rh.error && rh.data){
        var GRU={}; rg.data.forEach(function(g){ GRU[g.id]=g; });
        var porSec={};
        rh.data.forEach(function(h){ var g=GRU[h.grupo_id]; if(!g||g.seccion==='natacion') return; (porSec[g.seccion]=porSec[g.seccion]||[]).push({g:g.nombre,dia:h.dia_semana,hi:h.hora_inicio,hf:h.hora_fin,lugar:h.lugar}); });
        Object.keys(porSec).sort().forEach(function(sec){
          var filas=porSec[sec].sort(function(a,b){ return a.dia!==b.dia?a.dia-b.dia:(a.hi<b.hi?-1:1); });
          html += '<div class="fa-sec"><h4>'+esc(sec.replace(/-/g,' '))+'</h4>'+ filas.map(function(x){
            return '<div class="g"><b>'+esc(DIAS[x.dia]||'')+' '+esc(String(x.hi).slice(0,5))+(x.hf?'–'+esc(String(x.hf).slice(0,5)):'')+'</b> · '+esc(x.g)+(x.lugar?' · '+esc(x.lugar):'')+'</div>';
          }).join('') +'</div>';
        });
      }
    } catch(e){}
    cont.innerHTML = html || '<p class="fa-dato" style="padding:8px 2px">No hemos podido cargar los horarios ahora mismo.</p>';
  }

  // --------- interacciones ---------
  wrap.addEventListener('click', async function(ev){
    var t = ev.target;
    // abrir/cerrar entreno
    var cab = t.closest && t.closest('.fa-ent-cab');
    if (cab){ cab.parentNode.classList.toggle('abierto'); return; }
    // ver/ocultar ficha
    var vf = t.closest && t.closest('[data-verficha]');
    if (vf){ var id=vf.getAttribute('data-verficha'); var fic=wrap.querySelector('.fa-ficha[data-ficha="'+id+'"]'); if(fic) fic.classList.toggle('abierta'); return; }
    // marcar/quitar falta
    var fl = t.closest && t.closest('[data-falta]');
    if (fl){
      var parts=fl.getAttribute('data-falta').split('|'); var hijoId=parts[0], franjaId=parts[1], fe=parts[2];
      var marcada = fl.classList.contains('no');
      fl.disabled=true;
      var fn = marcada?'natacion_familia_quitar_ausencia':'natacion_familia_ausencia';
      var r = await sb.rpc(fn, { p_atleta:hijoId, p_franja:franjaId, p_fecha:fe });
      fl.disabled=false;
      var d=r&&r.data; if (r.error || (d&&d.ok===false)){ avisar((d&&d.msg)||'No se pudo.', true); return; }
      fl.classList.toggle('no'); fl.querySelector('small').textContent = fl.classList.contains('no')?'No viene':'Sí va';
      avisar(fl.classList.contains('no')?'Avisado: ese día no viene.':'Quitado: sí va.');
      return;
    }
    // guardar ficha
    var gb = t.closest && t.closest('[data-guardar]');
    if (gb){
      var hid=gb.getAttribute('data-guardar');
      var box=wrap.querySelector('.fa-ficha[data-ficha="'+hid+'"]');
      var val=function(k){ var el=box.querySelector('[data-f="'+k+'"]'); return el?el.value:null; };
      gb.disabled=true;
      var r=await sb.rpc('familia_edita_contacto', { p_atleta:hid, p_telefono:val('telefono'), p_nombre_tutor:val('nombre_tutor'), p_telefono_tutor:val('telefono_tutor') });
      gb.disabled=false;
      var d=r&&r.data; if (r.error || (d&&d.ok===false)){ avisar((d&&d.msg)||'No se pudo guardar.', true); return; }
      avisar('Datos guardados.');
      return;
    }
    // abrir "todo lo que hay en el club"
    var cb = t.closest && t.closest('#fa-club');
    if (cb){ var cont=document.getElementById('fa-club-cuerpo'); var abierto=cont.classList.toggle('abierto'); if (abierto && !CLUB_HTML){ CLUB_HTML='1'; cargarClub(); } return; }
  });
});
</script>
</body>
</html>
