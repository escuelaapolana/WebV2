<style>
  /* ===========================================================
     LAYOUT PROPIO DE LA PÁGINA /tienda
     Usa las piezas del sistema (apolana.css) y añade solo la
     colocación específica de esta página.
     =========================================================== */

  /* Cabecera de la sección: título + nota de recogida */
  .tienda-cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .tienda-cab .recogida { font-size: 15px; color: var(--texto-suave); max-width: 380px; }

  /* Disposición general: catálogo + resumen del pedido */
  .tienda-cuerpo { display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }

  /* Rejilla de productos: 3 → 2 → 1 columnas */
  .catalogo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  /* Tarjeta de producto · misma profundidad que las fichas de la portada y
     del club: blanca, sin borde duro, foto a sangre arriba y sombra en capas
     (contacto + media distancia + lejana). Al pasar por encima se eleva y la
     foto respira. */
  .producto {
    background: #fff; border: 0;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(30,45,65,.06),
                0 10px 20px -12px rgba(30,45,65,.18),
                0 26px 48px -28px rgba(30,45,65,.24);
    display: flex; flex-direction: column;
    transition: transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s cubic-bezier(.2,.7,.2,1);
  }
  .producto:hover {
    transform: translateY(-6px);
    box-shadow: 0 2px 4px rgba(30,45,65,.08),
                0 18px 32px -14px rgba(30,45,65,.26),
                0 44px 76px -32px rgba(30,45,65,.34);
  }
  /* La foto ocupa todo el ancho de la ficha (a sangre) y hace un zoom suave. */
  .producto .foto {
    aspect-ratio: 4 / 5; background: var(--crema-media); overflow: hidden;
  }
  .producto .foto img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .producto:hover .foto img { transform: scale(1.05); }
  /* Las fichas las pinta el JS con el catálogo de la base, así que NO llevan
     .reveal: entran con un desvanecido suave al inyectarse. Se anima
     `translate` (no `transform`) para no pisar el translateY del hover. */
  @media (prefers-reduced-motion: no-preference) {
    .catalogo .producto { animation: prod-entra .5s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes prod-entra { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
  }
  .producto .cuerpo { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  .producto .nombre {
    font-family: var(--fuente-titulo); font-weight: 700; font-size: 19px;
    line-height: 1.08; color: var(--navy);
  }
  .producto:hover .nombre { color: var(--azul-hover); }

  /* Tallas · son botones de verdad: se pulsan para elegir */
  .tallas { display: flex; gap: 6px; flex-wrap: wrap; }
  .talla {
    border: 1px solid var(--linea-borde); border-radius: 6px; background: #fff;
    padding: 4px 9px; font-size: 13px; color: var(--texto);
    cursor: pointer; line-height: 1.2;
  }
  .talla:hover { border-color: var(--azul-filete, #3B85C0); }
  .talla[aria-pressed="true"] { background: var(--azul-suave); border-color: var(--azul-filete, #3B85C0); color: var(--azul-oscuro); font-weight: 600; }
  .talla--no { color: #C0B8A6; cursor: not-allowed; background: #FBF9F4; text-decoration: line-through; }
  .talla--no:hover { border-color: var(--linea-borde); }

  /* Precio + cantidad + botón añadir */
  .producto .pie-tarjeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 4px; flex-wrap: wrap; }
  .precio { font-family: var(--fuente-dato); font-size: 17px; color: var(--navy); }
  .compra { display: flex; align-items: center; gap: 8px; }
  .cant {
    border: 1px solid var(--linea-borde); border-radius: 8px; background: #fff;
    padding: 6px 8px; font-family: var(--fuente-texto); font-size: 13px; color: var(--navy);
  }
  .anadir {
    background: var(--azul); color: #fff; border: 0;
    border-radius: var(--radio-pastilla); padding: 8px 16px;
    font-family: var(--fuente-texto); font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .anadir:hover { background: var(--azul-hover, #1E4E78); }
  .anadir[disabled] { background: #C0B8A6; cursor: not-allowed; }

  /* Texto solo para lectores de pantalla */
  .oculto {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  /* Resumen del pedido (columna lateral) */
  .pedido {
    background: #fff; border: 0;
    border-radius: 16px; padding: 24px 26px;
    display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 1px 2px rgba(30,45,65,.06),
                0 10px 20px -12px rgba(30,45,65,.18),
                0 26px 48px -28px rgba(30,45,65,.24);
    position: sticky; top: 90px;
  }
  .pedido h2 { font-family: var(--fuente-titulo); font-weight: 700; font-size: 28px; letter-spacing: -0.02em; text-transform: uppercase; color: var(--navy); line-height: 1; }
  #pedido-cuerpo { display: flex; flex-direction: column; gap: 14px; }
  .pedido-linea { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--crema-banda); }
  .pedido-linea .mini { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: #fff; flex-shrink: 0; }
  .pedido-linea .mini img { width: 100%; height: 100%; object-fit: contain; }
  .pedido-linea .desc { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .pedido-linea .desc b { font-size: 15px; font-weight: 500; color: var(--navy); }
  .pedido-linea .desc span { font-size: 13px; color: var(--texto-suave); }
  .pedido-linea .subtotal { font-family: var(--fuente-dato); font-size: 15px; color: var(--navy); white-space: nowrap; }

  /* Controles de cada línea: menos / cantidad / más / quitar */
  .linea-ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .linea-ctrl button {
    width: 26px; height: 26px; border: 1px solid var(--linea-borde); background: #fff;
    border-radius: 7px; color: var(--navy); font-family: var(--fuente-texto); font-size: 15px;
    line-height: 1; cursor: pointer; padding: 0;
  }
  .linea-ctrl button:hover { border-color: var(--azul-filete, #3B85C0); color: var(--azul-oscuro); }
  .linea-ctrl .uds { font-family: var(--fuente-dato); font-size: 13px; color: var(--navy); min-width: 18px; text-align: center; }
  .linea-ctrl .quitar {
    width: auto; padding: 0 9px; border: 0; color: var(--texto-suave); font-size: 13px; background: none;
  }
  .linea-ctrl .quitar:hover { color: #B3261E; }

  .pedido-total { display: flex; justify-content: space-between; align-items: baseline; }
  .pedido-total span { font-size: 15px; color: var(--texto); }
  .pedido-total b { font-family: var(--fuente-titulo); font-weight: 700; font-size: 32px; letter-spacing: -0.02em; color: var(--azul-oscuro); line-height: 1; }
  .pedido .nota { font-size: 13px; color: var(--texto-suave); line-height: 1.5; }
  .pedido-datos { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .pedido-datos label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--texto-suave); }
  .pedido-datos input { border: 1px solid var(--linea-marcada, #E4DCCB); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: inherit; color: var(--navy); background: #fff; }
  .pedido-datos input:focus { outline: 2px solid var(--azul-filete, #3B85C0); outline-offset: 1px; }
  .pedido .vacia { font-size: 15px; color: var(--texto-suave); line-height: 1.55; margin: 0; }
  .pedido .vaciar {
    background: none; border: 0; padding: 0; align-self: flex-start;
    font-family: var(--fuente-texto); font-size: 13px; color: var(--texto-suave);
    cursor: pointer; text-decoration: underline;
  }
  .pedido .vaciar:hover { color: #B3261E; }
  .pedido .btn[disabled] { background: #C0B8A6; border-color: #C0B8A6; cursor: not-allowed; pointer-events: none; }

  /* Avisos del panel: pago, sesión, errores y confirmación */
  .caja-aviso {
    background: var(--aviso-fondo); border: 1px solid var(--aviso-borde); border-radius: 12px;
    padding: 13px 15px; font-size: 13px; color: var(--aviso-texto); line-height: 1.55;
  }
  .caja-aviso b { display: block; color: var(--aviso-titulo); font-size: 13px; margin-bottom: 2px; }
  .caja-aviso a { color: var(--azul-oscuro); }
  .caja-error {
    background: #FDEDEC; border: 1px solid #F3C6C2; border-radius: 12px;
    padding: 13px 15px; font-size: 13px; color: #8A2B22; line-height: 1.55;
  }
  .caja-ok {
    background: #EEF6EE; border: 1px solid #CCE3CC; border-radius: 12px;
    padding: 14px 16px; font-size: 14px; color: #2E5B33; line-height: 1.6;
  }
  .caja-ok b { display: block; font-size: 15px; margin-bottom: 4px; }
  .aviso-catalogo {
    background: var(--aviso-fondo); border: 1px solid var(--aviso-borde); border-radius: 12px;
    padding: 14px 16px; font-size: 14px; color: var(--aviso-texto); line-height: 1.55;
    margin-bottom: 16px;
  }

  /* ===========================================================
     RESPONSIVE
     =========================================================== */
  @media (max-width: 1000px) {
    .tienda-cuerpo { grid-template-columns: 1fr; }
    /* La ropa primero: el resumen del pedido, debajo. Antes el carrito vacío
       se comía la primera pantalla y el primer producto quedaba muy abajo. */
    .tienda-cuerpo > div { order: 0; }
    .pedido { position: static; order: 1; }
  }
  @media (max-width: 760px) {
    .catalogo { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 480px) {
    .catalogo { grid-template-columns: 1fr; }
  }
</style>
</head>

<apolana-pie></apolana-pie>

<!-- ============================================================
     TIENDA DEL CLUB · catálogo, cesta y envío del pedido
     ------------------------------------------------------------
     · El catálogo sale de la tabla `productos`. Si la base de datos
       no responde, se pinta la copia de respaldo de aquí abajo: son
       los mismos artículos, precios y tallas que se sembraron en
       migraciones/029_tienda.sql.
     · La cesta vive solo en este navegador (localStorage), así que
       se conserva al recargar la página. Hasta que no se confirma,
       el club no se entera de nada.
     · Al pulsar «Pagar», la función `tienda-pagar` mira EN LA BASE
       cuánto vale cada prenda (nunca se fía del navegador), crea el
       pedido + sus líneas y abre la pasarela de Stripe. El pedido se
       marca «pagado» solo cuando Stripe avisa (webhook firmado).
     · Compra el socio con sesión (va a su ficha) o un invitado (que
       deja nombre y contacto). La tarjeta se teclea en Stripe, nunca aquí.
     ============================================================ -->
<script>
(function () {
  'use strict';

  var CLAVE_CESTA = 'apolana.cesta.v1';
  var MAX_UNIDADES = 10;

  /* Copia de respaldo del catálogo (misma lista que la migración 029).
     Solo se usa si no se puede leer la base de datos. */
  var RESPALDO = [
    { nombre: 'Camiseta de competición',       precio: 22, tallas_disponibles: ['S','M','L','XL'], tallas_agotadas: ['XL'], imagen_url: 'tienda-camiseta-competicion.jpg' },
    { nombre: 'Camiseta de tirantes · hombre', precio: 20, tallas_disponibles: ['S','M','L'],      tallas_agotadas: [],     imagen_url: 'tienda-camiseta-tirantes-hombre.jpg' },
    { nombre: 'Camiseta de tirantes · mujer',  precio: 20, tallas_disponibles: ['XS','S','M','L'], tallas_agotadas: [],     imagen_url: 'tienda-camiseta-tirantes-mujer.jpg' },
    { nombre: 'Top de competición',            precio: 22, tallas_disponibles: ['XS','S','M','L'], tallas_agotadas: ['L'],  imagen_url: 'tienda-top-competicion.jpg' },
    { nombre: 'Mono de velocidad',             precio: 48, tallas_disponibles: ['S','M','L'],      tallas_agotadas: [],     imagen_url: 'tienda-mono-velocidad.jpg' },
    { nombre: 'Malla corta · hombre',          precio: 18, tallas_disponibles: ['S','M','L'],      tallas_agotadas: [],     imagen_url: 'tienda-malla-corta-hombre.jpg' },
    { nombre: 'Culotte · mujer',               precio: 18, tallas_disponibles: ['XS','S','M','L'], tallas_agotadas: [],     imagen_url: 'tienda-culotte-mujer.jpg' },
    { nombre: 'Sudadera con capucha',          precio: 34, tallas_disponibles: ['S','M','L','XL'], tallas_agotadas: [],     imagen_url: 'tienda-sudadera-capucha.jpg' },
    { nombre: 'Chaqueta de chándal',           precio: 38, tallas_disponibles: ['S','M','L','XL'], tallas_agotadas: [],     imagen_url: 'tienda-chaqueta-chandal.jpg' },
    { nombre: 'Pantalón de chándal',           precio: 28, tallas_disponibles: ['S','M','L','XL'], tallas_agotadas: [],     imagen_url: 'tienda-pantalon-chandal.jpg' },
    { nombre: 'Parka del club',                precio: 55, tallas_disponibles: ['M','L','XL'],     tallas_agotadas: [],     imagen_url: 'tienda-parka.jpg' },
    { nombre: 'Braga de cuello',               precio:  9, tallas_disponibles: ['ÚNICA'],          tallas_agotadas: [],     imagen_url: 'tienda-braga-cuello.jpg' },
    { nombre: 'Mochila con zapatillero',       precio: 24, tallas_disponibles: ['ÚNICA'],          tallas_agotadas: [],     imagen_url: 'tienda-mochila.jpg' }
  ];

  var catalogo = [];        // lo que se está enseñando ahora mismo
  var cesta = [];           // [{ id, nombre, precio, talla, cantidad, imagen }]
  var perfil = null;        // ficha de quien ha entrado, si hay sesión
  var sesionLista = false;  // ¿ya sabemos si hay sesión o no?
  var hayBase = false;      // ¿hemos podido leer el catálogo de verdad?
  var enviado = null;       // pedido ya enviado, para enseñar la confirmación

  var elCatalogo = document.getElementById('catalogo');
  var elAviso    = document.getElementById('aviso-catalogo');
  var elPedido   = document.getElementById('pedido-cuerpo');

  /* ---------- ayudas ---------- */
  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function img(v) { return (window.APOLANA_IMG ? window.APOLANA_IMG(v) : ('../assets/img/' + v)); }
  function eur(n) {
    var x = Math.round(Number(n) * 100) / 100;
    var t = (x % 1 === 0) ? String(x) : x.toFixed(2).replace('.', ',');
    return t + ' €';
  }
  function clave(l) { return l.nombre + '·' + l.talla; }

  /* ---------- la cesta en el navegador ---------- */
  function leerCesta() {
    try {
      var bruto = window.localStorage.getItem(CLAVE_CESTA);
      if (!bruto) return [];
      var d = JSON.parse(bruto);
      if (!Array.isArray(d)) return [];
      return d.filter(function (l) {
        return l && typeof l.nombre === 'string' && typeof l.talla === 'string' &&
               isFinite(l.precio) && isFinite(l.cantidad) && l.cantidad > 0;
      }).map(function (l) {
        return {
          id: l.id || null, nombre: l.nombre, precio: Number(l.precio), talla: l.talla,
          cantidad: Math.min(MAX_UNIDADES, Math.max(1, Math.round(Number(l.cantidad)))),
          imagen: l.imagen || ''
        };
      });
    } catch (e) { return []; }
  }
  function guardarCesta() {
    try { window.localStorage.setItem(CLAVE_CESTA, JSON.stringify(cesta)); } catch (e) { /* modo privado: se pierde al salir */ }
  }
  function totalCesta() {
    return cesta.reduce(function (s, l) { return s + l.precio * l.cantidad; }, 0);
  }

  /* ---------- catálogo ---------- */
  function pintarCatalogo() {
    if (!elCatalogo) return;
    elCatalogo.innerHTML = catalogo.map(function (p, i) {
      var agotadas = p.tallas_agotadas || [];
      var tallas = (p.tallas_disponibles || []).slice();
      var libres = tallas.filter(function (t) { return agotadas.indexOf(t) === -1; });
      var sinPrecio = (p.precio == null || !isFinite(p.precio));
      var sinStock = (tallas.length > 0 && libres.length === 0);

      var botonesTalla = tallas.map(function (t) {
        if (agotadas.indexOf(t) !== -1) {
          return '<span class="talla talla--no" title="Sin existencias">' + esc(t) + '</span>';
        }
        var elegida = (t === libres[0]) ? ' aria-pressed="true"' : ' aria-pressed="false"';
        return '<button type="button" class="talla" data-talla="' + esc(t) + '"' + elegida + '>' + esc(t) + '</button>';
      }).join('');

      var grupoTallas = tallas.length
        ? '<div class="tallas" role="group" aria-label="Talla de ' + esc(p.nombre) + '">' + botonesTalla + '</div>'
        : '';

      var opciones = '';
      for (var n = 1; n <= MAX_UNIDADES; n++) opciones += '<option value="' + n + '">' + n + '</option>';

      var puedeComprar = !sinPrecio && !sinStock;
      var compra = puedeComprar
        ? '<div class="compra">' +
            '<label class="oculto" for="cant-' + i + '">Unidades de ' + esc(p.nombre) + '</label>' +
            '<select class="cant" id="cant-' + i + '">' + opciones + '</select>' +
            '<button type="button" class="anadir">Añadir</button>' +
          '</div>'
        : '<button type="button" class="anadir" disabled>' + (sinStock ? 'Sin existencias' : 'Consultar') + '</button>';

      return '<article class="producto" data-i="' + i + '">' +
          '<div class="foto">' + (p.imagen_url ? '<img src="' + esc(img(p.imagen_url)) + '" alt="' + esc(p.nombre) + '" loading="lazy" decoding="async">' : '') + '</div>' +
          '<div class="cuerpo">' +
            '<span class="nombre">' + esc(p.nombre) + '</span>' + grupoTallas +
            '<div class="pie-tarjeta">' +
              '<span class="precio">' + (sinPrecio ? 'Consultar' : eur(p.precio)) + '</span>' + compra +
            '</div>' +
          '</div>' +
        '</article>';
    }).join('');
  }

  function cargarCatalogo() {
    var sb = window.APOLANA_DB;
    if (!sb) { catalogo = RESPALDO; hayBase = false; return Promise.resolve(); }
    return sb.from('productos')
      .select('id,nombre,precio,tallas_disponibles,tallas_agotadas,imagen_url,orden')
      .eq('activo', true)
      .order('orden', { ascending: true, nullsFirst: false })
      .order('nombre')
      .then(function (r) {
        if (r.error || !r.data || !r.data.length) { catalogo = RESPALDO; hayBase = false; return; }
        catalogo = r.data.map(function (p) {
          return {
            id: p.id, nombre: p.nombre, precio: (p.precio == null ? null : Number(p.precio)),
            tallas_disponibles: p.tallas_disponibles || [], tallas_agotadas: p.tallas_agotadas || [],
            imagen_url: p.imagen_url || ''
          };
        });
        hayBase = true;
      })
      .catch(function () { catalogo = RESPALDO; hayBase = false; });
  }

  /* ---------- sesión ---------- */
  function cargarSesion() {
    var sb = window.APOLANA_DB;
    if (!sb || !sb.auth) { sesionLista = true; return Promise.resolve(); }
    return sb.auth.getSession().then(function (s) {
      var correo = s && s.data && s.data.session && s.data.session.user && s.data.session.user.email;
      if (!correo) { sesionLista = true; return; }
      return sb.from('perfiles').select('id,nombre,apellidos,email').eq('email', correo).maybeSingle()
        .then(function (r) { if (!r.error) perfil = r.data; sesionLista = true; })
        .catch(function () { sesionLista = true; });
    }).catch(function () { sesionLista = true; });
  }

  /* ---------- la cesta en pantalla ---------- */
  var AVISO_PAGO =
    '<div class="caja-aviso"><b>Pago seguro y recogida</b>' +
    'Pagas con tarjeta en la página de Stripe: nosotros no vemos tu tarjeta. ' +
    'Cuando esté listo, se recoge en la oficina del club (oficina Nº 1), en el Estadio de Atletismo, ' +
    'martes y jueves de 18:00 a 20:00.</div>';

  function pintarCesta() {
    if (!elPedido) return;

    if (enviado) {
      elPedido.innerHTML =
        '<div class="caja-ok" role="status"><b>¡Pago recibido!</b>' +
        'Gracias. El club ya tiene tu pedido apuntado y pagado. Te avisaremos cuando esté listo para recoger en la oficina del club (oficina Nº 1), ' +
        'en el Estadio de Atletismo, los martes y jueves de 18:00 a 20:00.</div>' +
        '<button type="button" class="btn btn--fantasma" id="otro-pedido" style="width:100%;">Hacer otro pedido</button>';
      return;
    }

    if (!cesta.length) {
      elPedido.innerHTML =
        '<p class="vacia">Tu cesta está vacía. Elige la talla en la prenda que quieras y pulsa «Añadir».</p>' +
        AVISO_PAGO;
      return;
    }

    var lineas = cesta.map(function (l) {
      var k = clave(l);
      return '<div class="pedido-linea">' +
          '<div class="mini">' + (l.imagen ? '<img src="' + esc(img(l.imagen)) + '" alt="" loading="lazy" decoding="async">' : '') + '</div>' +
          '<div class="desc">' +
            '<b>' + esc(l.nombre) + '</b>' +
            '<span>Talla ' + esc(l.talla) + ' · ' + eur(l.precio) + ' la unidad</span>' +
            '<div class="linea-ctrl">' +
              '<button type="button" data-acc="menos" data-k="' + esc(k) + '" aria-label="Quitar una unidad de ' + esc(l.nombre) + ', talla ' + esc(l.talla) + '">−</button>' +
              '<span class="uds">' + l.cantidad + '</span>' +
              '<button type="button" data-acc="mas" data-k="' + esc(k) + '" aria-label="Añadir una unidad de ' + esc(l.nombre) + ', talla ' + esc(l.talla) + '">+</button>' +
              '<button type="button" class="quitar" data-acc="fuera" data-k="' + esc(k) + '">Quitar</button>' +
            '</div>' +
          '</div>' +
          '<span class="subtotal">' + eur(l.precio * l.cantidad) + '</span>' +
        '</div>';
    }).join('');

    var accion;
    if (!sesionLista) {
      accion = '<button type="button" class="btn btn--primario" style="width:100%;" disabled>Comprobando tu cuenta…</button>';
    } else {
      var datos;
      if (!perfil) {
        // Invitado: pedimos lo justo para avisarle y prepararle el pedido.
        datos =
          '<div class="pedido-datos">' +
            '<label>Nombre y apellidos<input type="text" id="c-nombre" autocomplete="name" placeholder="Tu nombre"></label>' +
            '<label>Correo<input type="email" id="c-email" autocomplete="email" placeholder="tucorreo@ejemplo.com"></label>' +
            '<label>Teléfono<input type="tel" id="c-telefono" autocomplete="tel" placeholder="Para avisarte de la recogida"></label>' +
          '</div>';
      } else {
        datos = '<p class="nota">Compras como <b>' + esc(((perfil.nombre || '') + ' ' + (perfil.apellidos || '')).trim()) + '</b>.</p>';
      }
      accion = datos +
        '<button type="button" class="btn btn--primario" id="pagar" style="width:100%;">Pagar · ' + eur(totalCesta()) + '</button>';
    }

    elPedido.innerHTML =
      lineas +
      '<div class="pedido-total"><span>Total</span><b>' + eur(totalCesta()) + '</b></div>' +
      accion +
      '<div id="pedido-msg" role="status" aria-live="polite"></div>' +
      '<button type="button" class="vaciar" id="vaciar">Vaciar la cesta</button>' +
      AVISO_PAGO;
  }

  function mensaje(html, error) {
    var m = document.getElementById('pedido-msg');
    if (!m) return;
    m.innerHTML = html ? '<div class="' + (error ? 'caja-error' : 'caja-aviso') + '">' + html + '</div>' : '';
  }

  /* ---------- acciones ---------- */
  function anadir(p, talla, cantidad) {
    var l = { id: p.id || null, nombre: p.nombre, precio: Number(p.precio), talla: talla, cantidad: cantidad, imagen: p.imagen_url || '' };
    var k = clave(l);
    var ya = null;
    for (var i = 0; i < cesta.length; i++) { if (clave(cesta[i]) === k) { ya = cesta[i]; break; } }
    if (ya) {
      ya.cantidad = Math.min(MAX_UNIDADES, ya.cantidad + cantidad);
      ya.precio = l.precio;
      ya.id = l.id || ya.id;
    } else {
      cesta.push(l);
    }
    guardarCesta();
    pintarCesta();
  }

  function idDe(l) {
    if (l.id) return l.id;
    for (var i = 0; i < catalogo.length; i++) { if (catalogo[i].nombre === l.nombre && catalogo[i].id) return catalogo[i].id; }
    return null;
  }

  function pagar(boton) {
    var sb = window.APOLANA_DB;
    if (!cesta.length) return;
    if (!sb || !sb.functions) { mensaje('No hemos podido conectar con el club. Recarga la página e inténtalo otra vez.', true); return; }

    // Las líneas: solo producto, talla y cantidad. El PRECIO lo pone la base.
    var items = [];
    for (var i = 0; i < cesta.length; i++) {
      var pid = idDe(cesta[i]);
      if (!pid) { mensaje('No hemos podido identificar «' + esc(cesta[i].nombre) + '» en el catálogo. Recarga la página e inténtalo otra vez.', true); return; }
      items.push({ producto_id: pid, talla: cesta[i].talla, cantidad: cesta[i].cantidad });
    }

    // El contacto: del socio si hay sesión; si no, del formulario de invitado.
    var contacto;
    if (perfil) {
      contacto = { nombre: ((perfil.nombre || '') + ' ' + (perfil.apellidos || '')).trim(), email: perfil.email || '' };
    } else {
      var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; };
      contacto = { nombre: g('c-nombre'), email: g('c-email'), telefono: g('c-telefono') };
      if (!contacto.nombre || !(contacto.email || contacto.telefono)) {
        mensaje('Para comprar sin cuenta necesitamos tu nombre y un correo o teléfono.', true);
        return;
      }
    }

    var textoBoton = 'Pagar · ' + eur(totalCesta());
    boton.disabled = true;
    boton.textContent = 'Abriendo el pago…';
    mensaje('');

    var reponer = function (msg) {
      boton.disabled = false;
      boton.textContent = textoBoton;
      if (msg) mensaje(msg, true);
    };

    sb.functions.invoke('tienda-pagar', { body: { items: items, contacto: contacto } })
      .then(function (r) {
        if (r.error) {
          var ctx = r.error.context;
          return (ctx && ctx.json ? ctx.json() : Promise.resolve(null))
            .catch(function () { return null; })
            .then(function (d) { reponer((d && d.mensaje) || 'No hemos podido abrir el pago. Inténtalo de nuevo en un minuto.'); });
        }
        if (!r.data || !r.data.url) { reponer('No hemos podido abrir el pago. Inténtalo de nuevo.'); return; }
        // A la pasarela de Stripe. La cesta se queda por si el pago se cancela.
        window.location.href = r.data.url;
      })
      .catch(function (e) {
        reponer('No hemos podido conectar con la pasarela de pago. Inténtalo en un minuto.');
        console.warn('[Apolana] tienda-pagar:', e && e.message ? e.message : e);
      });
  }

  /* ---------- clics ---------- */
  if (elCatalogo) elCatalogo.addEventListener('click', function (ev) {
    var bTalla = ev.target.closest ? ev.target.closest('button.talla') : null;
    if (bTalla) {
      var grupo = bTalla.parentNode;
      Array.prototype.forEach.call(grupo.querySelectorAll('button.talla'), function (b) {
        b.setAttribute('aria-pressed', b === bTalla ? 'true' : 'false');
      });
      return;
    }
    var bAdd = ev.target.closest ? ev.target.closest('button.anadir') : null;
    if (!bAdd || bAdd.disabled) return;
    var art = bAdd.closest('article.producto');
    if (!art) return;
    var p = catalogo[Number(art.getAttribute('data-i'))];
    if (!p) return;
    var elegida = art.querySelector('button.talla[aria-pressed="true"]');
    var talla = elegida ? elegida.getAttribute('data-talla') : 'ÚNICA';
    var sel = art.querySelector('select.cant');
    var cantidad = sel ? Math.max(1, Math.min(MAX_UNIDADES, parseInt(sel.value, 10) || 1)) : 1;
    anadir(p, talla, cantidad);
    var antes = bAdd.textContent;
    bAdd.textContent = 'Añadido ✓';
    window.setTimeout(function () { bAdd.textContent = antes; }, 1200);
  });

  if (elPedido) elPedido.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('button') : null;
    if (!b) return;

    if (b.id === 'pagar') { pagar(b); return; }
    if (b.id === 'vaciar') { cesta = []; guardarCesta(); pintarCesta(); return; }
    if (b.id === 'otro-pedido') { enviado = null; pintarCesta(); return; }

    var acc = b.getAttribute('data-acc');
    var k = b.getAttribute('data-k');
    if (!acc || !k) return;
    for (var i = 0; i < cesta.length; i++) {
      if (clave(cesta[i]) !== k) continue;
      if (acc === 'mas') cesta[i].cantidad = Math.min(MAX_UNIDADES, cesta[i].cantidad + 1);
      if (acc === 'menos') cesta[i].cantidad -= 1;
      if (acc === 'fuera') cesta[i].cantidad = 0;
      if (cesta[i].cantidad < 1) cesta.splice(i, 1);
      break;
    }
    guardarCesta();
    pintarCesta();
  });

  /* ---------- arranque ---------- */
  document.addEventListener('DOMContentLoaded', function () {
    cesta = leerCesta();

    // ¿Volvemos de la pasarela de Stripe?
    var pagoVuelta = null;
    try {
      var qs = new URLSearchParams(window.location.search);
      pagoVuelta = qs.get('pago');
      if (pagoVuelta === 'hecho') { enviado = true; cesta = []; guardarCesta(); }
      if (pagoVuelta) {
        qs.delete('pago'); qs.delete('ref');
        window.history.replaceState(null, '', window.location.pathname + (qs.toString() ? '?' + qs.toString() : ''));
      }
    } catch (e) {}

    pintarCesta();
    if (pagoVuelta === 'cancelado') { mensaje('Pago cancelado. Tu cesta sigue aquí; puedes intentarlo de nuevo cuando quieras.', false); }

    cargarCatalogo().then(function () {
      pintarCatalogo();
      if (!hayBase && elAviso) {
        elAviso.hidden = false;
        elAviso.innerHTML = 'No hemos podido conectar con el club, así que estás viendo el catálogo guardado. ' +
          'Puedes mirarlo y preparar la cesta, pero para enviar el pedido tendrás que recargar la página cuando vuelva la conexión.';
      }
    });

    cargarSesion().then(function () { pintarCesta(); });
  });
})();
</script>

</body>
</html>
