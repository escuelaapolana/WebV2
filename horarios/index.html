     ESTA PÁGINA YA NO EXISTE COMO TAL: VIVE EN EL CALENDARIO
     ------------------------------------------------------------
     Los horarios eran una página aparte y el calendario, otra. Las dos
     contestaban la misma pregunta —«¿cuándo entreno?»— y obligaban a
     acertar cuál antes de saber cuál te servía. Andrés: «horarios y
     calendario, ¿no íbamos a unificarlo en calendario?».

     Ahora la parrilla de la semana es la tercera pestaña del calendario,
     junto a Mes y Semana. Esta dirección se queda viva y lleva allí:
     está en carteles, en mensajes de WhatsApp de hace meses y en la
     cabeza de cuatrocientas familias. Una dirección que alguien puede
     tener escrita no se borra, se redirige.

     Se hace con un `<meta refresh>` y no con JavaScript porque funciona
     aunque el JavaScript falle, y el enlace de abajo funciona aunque
     falle el refresh. Siempre queda una puerta.
     ============================================================ -->
