<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu camiseta de la Liga · Club Atletismo Apolana</title>
<meta name="description" content="Elige la talla de tu camiseta Finisher de la Liga Apolana.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css?v=3f7ff4ee">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js?v=a02b231d" defer></script>
<script src="../../assets/js/db.js?v=4fd9379b" defer></script>
<style>
  body{ background:var(--crema,#FBF9F4); margin:0; font-family:var(--fuente-texto,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif); color:var(--navy,#2E4256); }
  .wrap{ max-width:560px; margin:0 auto; padding:34px 18px 60px; }
  .cab{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .cab img{ height:46px; width:auto; }
  .cab b{ font-family:var(--fuente-titulo); font-weight:700; font-size:18px; }
  .caja{ background:#fff; border:1px solid var(--linea,#EDE6D7); border-radius:18px;
    box-shadow:0 18px 40px -26px rgba(46,66,86,.5); padding:26px 24px; }
  h1{ font-family:var(--fuente-titulo); font-size:clamp(22px,5vw,28px); margin:0 0 10px; }
  p{ line-height:1.6; color:#3f3f46; margin:0 0 14px; }
  .dato{ background:#F1EADC; border-radius:12px; padding:14px 16px; color:#5C4A1E; font-size:14.5px; line-height:1.6; margin:4px 0 18px; }
  .dato ul{ margin:8px 0 0; padding-left:20px; }
  .btn{ display:inline-block; background:#2F6FA8; color:#fff; border:0; text-decoration:none;
    padding:15px 30px; border-radius:12px; font-weight:700; font-size:16px; cursor:pointer; font-family:inherit; }
  .btn[disabled]{ opacity:.6; cursor:default; }
  .fina{ font-size:13px; color:var(--texto-suave,#6E6656); margin-top:16px; }
  .err{ color:#B3261E; font-size:14px; margin-top:12px; min-height:1.2em; }
  .ok{ background:#EAF3E3; color:#2E6B3A; border-radius:12px; padding:16px 18px; line-height:1.6; }
  .mal{ background:#FBEAE8; color:#B3261E; border-radius:12px; padding:16px 18px; line-height:1.6; }
  /* Estados finales (ya domiciliada, cerrada, enlace que no vale…): botones a lo ancho en el móvil. */
  .acciones{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .acciones .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; box-sizing:border-box; padding:0 22px; }
  .btn--wa{ background:#1F8A4C; }
  .btn--claro{ background:#fff; color:var(--navy,#2E4256); border:1px solid var(--linea,#E4DCCB); }
  .volver{ display:inline-flex; align-items:center; min-height:44px; margin-top:8px; color:#2F6FA8; font-weight:600; text-decoration:none; font-size:15px; }
  .volver:hover{ text-decoration:underline; }
  @media (max-width:480px){ .acciones .btn{ flex:1 1 100%; } }
  .importe{ font-family:var(--fuente-titulo); font-size:34px; font-weight:800; margin:4px 0 2px; }
  .concepto{ font-size:16px; font-weight:700; }
  .vence{ font-size:14px; color:var(--texto-suave,#6E6656); margin-top:4px; }
  .foto-cam{ margin:4px 0 6px; border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--linea,#EDE6D7); }
  .foto-cam img{ display:block; width:100%; height:auto; }
  .pie-foto{ font-size:13px; color:var(--texto-suave,#6E6656); margin:6px 0 18px; line-height:1.5; }
  .tallas{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 14px; }
  .tallas button{ font:inherit; font-weight:700; font-size:16px; min-height:48px; border-radius:12px; border:1px solid var(--linea-borde,#D4CBB9); background:#fff; color:var(--navy,#2E4256); cursor:pointer; }
  .tallas button[aria-pressed="true"]{ background:var(--navy,#2E4256); border-color:var(--navy,#2E4256); color:#fff; }
  label.lab{ display:block; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--texto-suave,#6E6656); margin:4px 0 6px; }
  textarea{ width:100%; box-sizing:border-box; font:inherit; font-size:15px; border:1px solid var(--linea-borde,#D4CBB9); border-radius:12px; padding:10px 12px; min-height:64px; resize:vertical; margin-bottom:14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cab">
      <img src="../../assets/img/favicon-escudo.png" alt="Escudo Apolana">
      <b>Club Atletismo Apolana · Liga</b>
    </div>
    <div class="caja" id="caja"><p>Cargando…</p></div>
  </div>
<script>
/* /liga/camiseta/?t=… · el finisher de la Liga elige la talla de su camiseta
   (mig 434). Sin cuenta: el enlace es el permiso. Se puede cambiar luego. */
(function () {
  var caja = document.getElementById('caja');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var SB = 'https://icaxokjsvhlreuwpyxeb.supabase.co', KEY = 'sb_publishable_ABwJ5L9azzN30mqKg6igxA_zq6pB3MH';
  function rpc(n, cuerpo){
    return fetch(SB + '/rest/v1/rpc/' + n, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) })
      .then(function (r) { return r.json().catch(function(){ return null; }).then(function (d) { return { ok: r.ok, d: d }; }); });
  }
  var TALLAS = ['XS','S','M','L','XL','XXL','3XL'];
  var token = (new URLSearchParams(location.search).get('t') || '').trim();
  var D = null, elegida = null, cambiando = false;
  var FOTO = '<div class="foto-cam"><img src="../../assets/img/liga-camiseta-2026.jpg" alt="Camiseta Finisher Liga Apolana 2026"></div>' +
    '<p class="pie-foto">La imagen es una <b>representación</b>: el diseño aún tiene que aprobarlo el proveedor y puede cambiar algún detalle.</p>';

  function malo(){ caja.innerHTML = '<h1>Este enlace no funciona</h1><div class="mal">El enlace no es válido. Escríbenos y te mandamos uno nuevo.</div>'; }
  function hecho(){
    caja.innerHTML = '<h1>¡Apuntado, ' + esc(D.nombre || '') + '! 🎉</h1>' + FOTO +
      '<div class="ok">Tu talla: <b>' + esc(D.talla) + '</b>' + (D.nota ? '<br>Nota: ' + esc(D.nota) : '') + '<br>Te avisaremos cuando llegue la camiseta.</div>' +
      '<p class="fina"><button class="btn btn--claro" id="cambiar" type="button">Cambiar la talla</button></p>';
    document.getElementById('cambiar').addEventListener('click', function(){ cambiando = true; pintar(); });
  }
  function pintar(){
    if (!D) { malo(); return; }
    if (D.respondido && !cambiando) { hecho(); return; }
    elegida = elegida || D.talla || null;
    caja.innerHTML = '<h1>' + (D.nombre ? '¡Enhorabuena, ' + esc(D.nombre) + '!' : '¡Enhorabuena!') + '</h1>' +
      '<p>Te has ganado la camiseta <b>«Finisher Liga Apolana 2026»</b>. Dinos tu talla y te la preparamos.</p>' + FOTO +
      '<label class="lab">Tu talla <span style="text-transform:none;font-weight:400">· corte único, igual para todos</span></label><div class="tallas" role="group" aria-label="Talla">' +
        TALLAS.map(function (t) { return '<button type="button" data-t="' + t + '" aria-pressed="' + (elegida === t ? 'true' : 'false') + '">' + t + '</button>'; }).join('') + '</div>' +
      '<label class="lab" for="nota">Observaciones <span style="text-transform:none;font-weight:400">(opcional)</span></label>' +
      '<textarea id="nota" maxlength="300" placeholder="Por ejemplo: la quiero una talla más grande…">' + esc(D.nota || '') + '</textarea>' +
      '<button class="btn" id="guardar" type="button">Guardar mi talla</button><p class="err" id="err"></p>';
    caja.querySelector('.tallas').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-t]'); if (!b) return;
      elegida = b.getAttribute('data-t');
      [].forEach.call(caja.querySelectorAll('.tallas button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    });
    document.getElementById('guardar').addEventListener('click', guardar);
  }
  function guardar(){
    var b = document.getElementById('guardar'), err = document.getElementById('err');
    if (!elegida) { err.textContent = 'Elige tu talla.'; return; }
    b.disabled = true; b.textContent = 'Guardando…'; err.textContent = '';
    var nota = document.getElementById('nota').value;
    rpc('liga_camiseta_guardar', { p_token: token, p_talla: elegida, p_nota: nota }).then(function (x) {
      if (!x.ok) { err.textContent = (x.d && x.d.message) || 'No se ha podido guardar. Inténtalo otra vez.'; b.disabled = false; b.textContent = 'Guardar mi talla'; return; }
      D.talla = elegida; D.nota = nota.trim(); D.respondido = true; cambiando = false; hecho();
    }).catch(function(){ err.textContent = 'No se pudo conectar. Inténtalo otra vez.'; b.disabled = false; b.textContent = 'Guardar mi talla'; });
  }
  if (!/^[0-9a-f]{40,128}$/i.test(token)) { malo(); return; }
  rpc('liga_camiseta_publica', { p_token: token }).then(function (x) { D = x.ok ? x.d : null; pintar(); }).catch(malo);
})();
</script>
</body>
</html>
