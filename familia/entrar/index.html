<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear tu acceso de familia · Apolana</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../../assets/img/favicon-escudo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<style>
  body{ background:var(--crema,#FBF9F4); margin:0; min-height:100vh; display:grid; place-items:center; }
  .en-caja{ width:100%; max-width:420px; margin:0 auto; padding:28px clamp(16px,5vw,28px) 34px; }
  .en-escudo{ display:block; width:64px; height:64px; margin:0 auto 14px; }
  .en-caja h1{ font-family:var(--fuente-titulo); text-transform:uppercase; text-align:center; font-size:23px; color:var(--navy); margin:0 0 4px; }
  .en-caja .sub{ text-align:center; color:var(--texto-suave); font-size:14.5px; margin:0 0 22px; line-height:1.5; }
  .en-card{ background:#fff; border:1px solid var(--linea-marcada,#E4DCCB); border-radius:16px; box-shadow:var(--sombra-suave,0 12px 26px -18px rgba(46,66,86,.5)); padding:20px 18px; }
  .en-campo{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .en-campo label{ font-size:13px; font-weight:600; color:var(--navy); }
  .en-campo input{ font:inherit; font-size:16px; color:var(--navy); border:1px solid var(--linea-borde,#D4CBB9); border-radius:10px; padding:11px 13px; background:#fff; }
  .en-btn{ width:100%; font:inherit; font-weight:700; font-size:15.5px; background:var(--navy,#2E4256); color:#fff; border:0; border-radius:11px; padding:13px; min-height:50px; cursor:pointer; }
  .en-btn:disabled{ opacity:.55; cursor:default; }
  .en-nota{ font-size:12.5px; color:var(--texto-suave); margin:12px 2px 0; text-align:center; }
  .en-error{ background:#FBE3E1; border:1px solid #F1C7C3; color:#B3261E; font-size:14px; border-radius:11px; padding:12px 14px; margin-bottom:14px; display:none; }
  .en-ok{ text-align:center; color:var(--navy); }
  .en-ok .tic{ font-size:40px; }
</style>
</head>
<body>
  <div class="en-caja">
    <img class="en-escudo" src="../../assets/img/favicon-escudo.png" alt="Apolana">
    <h1>Tu acceso de familia</h1>
    <p class="sub">Ponte una contraseña y entra para ver los entrenamientos de tus hijos/as, avisar de una falta y sus datos.</p>
    <div class="en-card" id="en-card"><p class="en-nota">Cargando…</p></div>
  </div>
<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function listo(fn){ if (window.APOLANA_DB) return fn(); var n=0; var t=setInterval(function(){ if (window.APOLANA_DB || n++>60){ clearInterval(t); fn(); } }, 100); }
  var token = new URLSearchParams(location.search).get('t') || '';
  var card = $('en-card');

  function pantallaError(msg){
    card.innerHTML = '<div class="en-error" style="display:block">'+msg+'</div>'+
      '<p class="en-nota">Si crees que es un error, escribe al club por WhatsApp y te mandamos un enlace nuevo.</p>';
  }
  function pantallaForm(){
    card.innerHTML =
      '<div class="en-error" id="en-err"></div>'+
      '<div class="en-campo"><label for="p1">Contraseña nueva</label><input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div>'+
      '<div class="en-campo"><label for="p2">Repite la contraseña</label><input id="p2" type="password" autocomplete="new-password"></div>'+
      '<button class="en-btn" id="p-go">Crear mi acceso y entrar</button>'+
      '<p class="en-nota">Tu correo ya lo tiene el club; solo eliges la contraseña.</p>';
    $('p-go').addEventListener('click', enviar);
    $('p2').addEventListener('keydown', function(e){ if (e.key==='Enter') enviar(); });
  }
  function err(msg){ var e=$('en-err'); if(e){ e.textContent=msg; e.style.display='block'; } }

  async function enviar(){
    var p1=$('p1').value, p2=$('p2').value, go=$('p-go');
    if (p1.length < 6){ err('La contraseña es muy corta (mínimo 6).'); return; }
    if (p1 !== p2){ err('Las dos contraseñas no coinciden.'); return; }
    go.disabled=true; go.textContent='Creando tu acceso…';
    try {
      var res = await window.APOLANA_DB.functions.invoke('familia-cuenta', { body: { token: token, password: p1 } });
      var data = res && res.data;
      if (res && res.error && !data){ err('No hemos podido conectar. Inténtalo de nuevo en un momento.'); go.disabled=false; go.textContent='Crear mi acceso y entrar'; return; }
      if (!data || data.ok !== true){ err((data && data.error) || 'No se ha podido crear el acceso.'); go.disabled=false; go.textContent='Crear mi acceso y entrar'; return; }
      // Cuenta creada: iniciamos sesión con la contraseña que acaba de poner.
      var login = await window.APOLANA_DB.auth.signInWithPassword({ email: data.email, password: p1 });
      if (login && login.error){
        // La cuenta existe pero el login falló: que entre por la puerta normal.
        card.innerHTML = '<div class="en-ok"><div class="tic">✓</div><p>¡Acceso creado! Entra con tu correo y tu nueva contraseña.</p></div>'+
          '<button class="en-btn" style="margin-top:14px" onclick="location.href=\''+(window.APOLANA_BASE||'../../')+'portal/\'">Ir a entrar</button>';
        return;
      }
      // Dentro: al portal de familia.
      location.href = (window.APOLANA_BASE || '../../') + 'portal/familia/';
    } catch(e){
      err('Ha habido un problema. Inténtalo de nuevo.'); go.disabled=false; go.textContent='Crear mi acceso y entrar';
    }
  }

  listo(function(){
    if (!token || !/^[A-Za-z0-9_-]{16,80}$/.test(token)){ pantallaError('Este enlace no es válido o está incompleto.'); return; }
    if (!window.APOLANA_DB){ pantallaError('El acceso no está disponible ahora mismo. Prueba en un momento.'); return; }
    pantallaForm();
  });
})();
</script>
</body>
</html>
