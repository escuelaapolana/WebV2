<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias · Club Atletismo Apolana</title>
<meta name="description" content="Lo que pasa en el Club Atletismo Apolana de Alicante: competición, escuela, club, resultados y montaña. Crónicas, resultados y novedades del club.">
<!-- APOLANA-SEO · lo genera herramientas/seo.py · no editar a mano -->
<!-- MIENTRAS LA WEB ESTA EN PRUEBAS: le decimos a Google que no la
     mire, para que no compita con atletismoapolana.com. EL DIA DEL
     CAMBIO DE DOMINIO HAY QUE QUITAR ESTA LINEA (la quita sola el
     comando de arriba con --indexable). -->
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Club Atletismo Apolana">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Noticias · Club Atletismo Apolana">
<meta property="og:description" content="Lo que pasa en el Club Atletismo Apolana de Alicante: competición, escuela, club, resultados y montaña. Crónicas, resultados y novedades del club.">
<meta property="og:url" content="https://escuelaapolana.github.io/WebV2/noticias/">
<meta property="og:image" content="https://escuelaapolana.github.io/WebV2/assets/img/noticia.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- /APOLANA-SEO -->
<link rel="icon" href="../assets/img/logo.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/css/apolana.css">
<script>window.APOLANA_BASE="../";</script>
<script src="../assets/js/datos.js" defer></script>
<script src="../assets/js/apolana.js" defer></script>
<script src="../assets/js/supabase.js" defer></script>
<script src="../assets/js/db.js" defer></script>
<style>
  /* ===========================================================
     LAYOUT PROPIO DE LA PÁGINA /noticias
     Usa las piezas del sistema (apolana.css) y añade solo la
     colocación específica de este listado.
     =========================================================== */

  /* Cabecera de página: eyebrow + título grande y filtros */
  .not-cab {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
  }
  .not-cab .titulo-bloque { display: flex; flex-direction: column; gap: 8px; }
  .not-cab .display { font-size: clamp(44px, 8vw, 60px); }

  /* ---- El botón «Filtrar» y su desplegable ----
     `position: relative` en el envoltorio y no en la sección entera: el panel
     va colgado del BOTÓN, y si se cuelga de algo más grande se despega al
     cambiar el ancho de la ventana. */
  .not-filtros { display: flex; }
  .not-desplegable { position: relative; }
  .btn-filtrar {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 18px; border-radius: var(--radio-pastilla);
    background: #fff; border: 1px solid var(--linea-borde);
    color: var(--texto); font: inherit; font-size: 15px; cursor: pointer;
  }
  .btn-filtrar:hover { border-color: var(--azul-filete, #3B85C0); color: var(--navy); }
  /* Con filtros puestos el botón se enciende: es lo único que queda a la vista
     cuando el panel está plegado, así que tiene que decir por sí solo que hay
     algo filtrando. Si no, se ve media web y parece que faltan noticias. */
  .btn-filtrar[aria-expanded="true"],
  .btn-filtrar.con-filtro {
    background: var(--azul-oscuro); border-color: var(--azul-oscuro);
    color: #fff; font-weight: 600;
  }
  .btn-filtrar .flecha { font-size: 12px; transition: transform .15s; }
  .btn-filtrar[aria-expanded="true"] .flecha { transform: rotate(180deg); }

  .filtro-caja {
    position: absolute; z-index: 30; top: calc(100% + 8px); left: 0;
    min-width: 320px; max-width: min(440px, calc(100vw - 40px));
    background: #fff; border: 1px solid var(--linea-borde);
    border-radius: var(--radio-grande, 16px); padding: 18px 20px 16px;
    box-shadow: 0 14px 34px rgba(20, 34, 48, .14);
  }
  .filtro-caja[hidden] { display: none; }
  .filtro-bloque + .filtro-bloque { margin-top: 18px; }
  .filtro-bloque > h3 {
    margin: 0 0 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--texto-suave);
  }
  .filtro-ops { display: flex; gap: 8px; flex-wrap: wrap; }
  .filtro-ops button {
    padding: 9px 15px; border-radius: var(--radio-pastilla);
    background: #fff; border: 1px solid var(--linea-borde);
    color: var(--texto); font: inherit; font-size: 14px; cursor: pointer;
  }
  .filtro-ops button:hover { border-color: var(--azul-filete, #3B85C0); color: var(--navy); }
  .filtro-ops button[aria-pressed="true"] { background: var(--azul-oscuro); border-color: var(--azul-oscuro); color: #fff; font-weight: 600; }

  .filtro-pie {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 16px; padding-top: 13px; border-top: 1px solid var(--linea);
    min-height: 24px;
  }
  .filtro-limpiar {
    background: none; border: 0; padding: 0; font: inherit; font-size: 14px;
    color: var(--azul-oscuro); font-weight: 600; cursor: pointer;
  }
  .filtro-limpiar:hover { color: var(--azul-hover); }
  .filtro-limpiar[hidden] { display: none; }
  .filtro-cuenta { margin-left: auto; font-size: 14px; color: var(--texto-suave); }

  /* Noticia destacada: imagen + texto en dos columnas */
  .destacada {
    margin-top: clamp(22px, 3vw, 28px);
    display: grid; grid-template-columns: 1.25fr 1fr;
    background: #fff; border: 1px solid var(--crema-media);
    border-radius: var(--radio-grande); overflow: hidden;
    box-shadow: var(--sombra-tarjeta);
  }
  .destacada .marco { height: 100%; min-height: 380px; border-radius: 0; }
  .destacada .cuerpo {
    padding: clamp(28px, 4vw, 38px);
    display: flex; flex-direction: column; gap: 14px; justify-content: center;
  }
  .destacada .titular {
    font-family: var(--fuente-titulo); font-weight: 700;
    font-size: clamp(30px, 5vw, 44px); line-height: 0.98;
    text-transform: uppercase; color: var(--navy);
  }
  .destacada .intro { max-width: 460px; }

  /* Rejilla de tarjetas de noticia */
  .rejilla { margin-top: clamp(18px, 3vw, 22px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .not-card {
    background: #fff; border: 1px solid var(--crema-media);
    border-radius: var(--radio); overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: var(--sombra-suave);
    transition: transform .15s ease, box-shadow .15s ease;
    color: inherit;
  }
  a.not-card:hover { transform: translateY(-2px); box-shadow: var(--sombra-tarjeta); }
  .not-card .marco { height: 190px; border-radius: 0; }
  .not-card .cuerpo { padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
  .not-card .tit {
    font-family: var(--fuente-titulo); font-weight: 700;
    font-size: 26px; line-height: 1.02; color: var(--navy);
  }
  .not-card .resumen { font-size: 15px; line-height: 1.5; color: #6B6558; }

  /* Paginación (marcadores estáticos) */
  .paginacion { margin-top: clamp(28px, 4vw, 34px); display: flex; justify-content: center; align-items: center; gap: 8px; }
  .pag-num {
    width: 36px; height: 36px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; border: 1px solid var(--linea-borde); color: var(--texto);
    background: #fff;
  }
  .pag-num.activo { background: var(--azul); border-color: var(--azul); color: #fff; font-weight: 600; }

  /* ===========================================================
     RESPONSIVE (solo lo específico de /noticias)
     =========================================================== */
  @media (max-width: 900px) {
    .not-cab { align-items: flex-start; }
    .destacada { grid-template-columns: 1fr; }
    .destacada .marco { min-height: 240px; }
    .rejilla { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    .rejilla { grid-template-columns: 1fr; }
    /* A 375 px un panel colgado del botón se sale por la derecha. Pasa a ocupar
       el ancho del contenedor, que es lo único que cabe. */
    .not-desplegable { position: static; }
    .not-filtros { display: block; }
    .filtro-caja { position: static; min-width: 0; max-width: none; margin-top: 10px; box-shadow: none; }
  }
</style>
</head>
<body>

<!-- ================= CABECERA (compartida) ================= -->
<apolana-cabecera activo="noticias"></apolana-cabecera>

<main>

  <!-- ================= CABECERA OSCURA ================= -->
  <apolana-hero
    encima="Lo que pasa en el club"
    titulo="Noticias"
    frase="Crónicas, resultados y avisos del club, contados por quien estuvo allí."></apolana-hero>

  <!-- ================= CABECERA DE PÁGINA + FILTROS ================= -->
  <section class="seccion" style="padding-bottom:0;">
    <div class="contenedor">
      <!-- UN BOTÓN, NO QUINCE PASTILLAS A LA VISTA.
           Quince opciones desplegadas en dos hileras ocupaban más alto que la
           primera noticia y empujaban las noticias fuera de la pantalla, que es
           justo lo que la gente viene a ver. El botón dice lo que está puesto
           («Running · Resultados»), así que no se pierde nada por plegarlo.

           Mismo patrón que el «Filtrar ▾» del calendario, para que la web no
           enseñe dos maneras distintas de hacer lo mismo. Ahí es una ventana
           emergente porque hay muchos más filtros; aquí, con dos listas cortas,
           un desplegable pegado al botón basta y molesta menos.

           DENTRO VAN DOS BLOQUES, que son dos preguntas distintas y se cruzan.
           Ojo con «Competición», que sale en los dos queriendo decir cosas
           distintas: en «De qué» es la sección de atletismo en pista —y por eso
           se rotula «Pista»— y en «Qué tipo» es la clase de noticia. Los
           títulos de cada bloque son lo que evita que se confundan. -->
      <div class="not-filtros">
        <div class="not-desplegable">
          <button type="button" class="btn-filtrar" id="abrir-filtros" aria-expanded="false" aria-controls="caja-filtros">
            <span id="filtros-texto">Filtrar</span> <span class="flecha" aria-hidden="true">▾</span>
          </button>

          <div class="filtro-caja" id="caja-filtros" hidden>
            <div class="filtro-bloque">
              <h3 id="rot-seccion">De qué</h3>
              <div class="filtro-ops" id="filtros-seccion" role="group" aria-labelledby="rot-seccion">
                <button type="button" data-sec="" aria-pressed="true">Todo el club</button>
                <button type="button" data-sec="escuela" aria-pressed="false">Escuela</button>
                <button type="button" data-sec="escuela-natacion" aria-pressed="false">Escuela de natación</button>
                <button type="button" data-sec="competicion" aria-pressed="false">Pista</button>
                <button type="button" data-sec="running" aria-pressed="false">Running</button>
                <button type="button" data-sec="natacion" aria-pressed="false">Natación</button>
                <button type="button" data-sec="montana" aria-pressed="false">Montaña</button>
                <button type="button" data-sec="triatlon" aria-pressed="false">Triatlón</button>
                <button type="button" data-sec="cubo" aria-pressed="false">El Cubo</button>
                <button type="button" data-sec="campus" aria-pressed="false">Campus</button>
              </div>
            </div>
            <div class="filtro-bloque">
              <h3 id="rot-tipo">Qué tipo</h3>
              <div class="filtro-ops" id="filtros" role="group" aria-labelledby="rot-tipo">
                <button type="button" data-cat="" aria-pressed="true">Todas</button>
                <button type="button" data-cat="competicion" aria-pressed="false">Competición</button>
                <button type="button" data-cat="club" aria-pressed="false">Club</button>
                <button type="button" data-cat="temporada" aria-pressed="false">Temporada</button>
                <button type="button" data-cat="resultado" aria-pressed="false">Resultados</button>
              </div>
            </div>
            <div class="filtro-pie">
              <button type="button" class="filtro-limpiar" id="filtros-limpiar" hidden>Quitar los filtros</button>
              <span class="filtro-cuenta" id="filtros-cuenta"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- El listado se genera desde Supabase -->
      <div id="destacada-cont"></div>
      <div class="rejilla" id="rejilla-noticias"></div>
      <p id="estado-noticias" class="intro cargando" style="margin-top:24px;">Cargando noticias…</p>
    </div>
  </section>

</main>

<!-- ================= PIE (compartido) ================= -->
<apolana-pie></apolana-pie>

<!-- Listado de noticias en directo desde Supabase, con filtros por categoría -->
<script>
document.addEventListener('DOMContentLoaded', async function () {
  var base = window.APOLANA_BASE || '../';
  var destCont = document.getElementById('destacada-cont');
  var rejilla = document.getElementById('rejilla-noticias');
  var estado = document.getElementById('estado-noticias');
  var filtros = document.getElementById('filtros');
  var filtrosSec = document.getElementById('filtros-seccion');
  var botonFiltrar = document.getElementById('abrir-filtros');
  var cajaFiltros = document.getElementById('caja-filtros');
  var textoFiltrar = document.getElementById('filtros-texto');
  var cuentaFiltros = document.getElementById('filtros-cuenta');
  var limpiarFiltros = document.getElementById('filtros-limpiar');
  var cat = '', sec = '';   /* lo elegido en cada bloque; '' es «sin filtrar» */
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  /* El nombre bonito de cada sección. La base las guarda sin acentos y con
     guiones ("escuela-natacion"), que es como se llaman las carpetas de la web. */
  var SECCIONES = { 'escuela':'la escuela', 'escuela-natacion':'la escuela de natación',
    'campus':'el campus', 'competicion':'pista', 'running':'running', 'natacion':'natación',
    'montana':'montaña', 'triatlon':'triatlón', 'cubo':'El Cubo' };
  function nombreSeccion(s){ return SECCIONES[s] || esc(s); }
  /* El rótulo corto, para el botón: ahí «la escuela de natación» no cabe y
     además el botón no es una frase, es una etiqueta. */
  function etiquetaFiltro(cont, valor){
    var b = cont.querySelector('[data-sec="'+valor+'"], [data-cat="'+valor+'"]');
    return b ? b.textContent.trim() : valor;
  }
  /* «de» + «el» es «del», y en un aviso que lee un socio eso se nota.
     Comparando en minúsculas porque El Cubo lleva mayúscula, que es su nombre. */
  function deSeccion(s){
    var t = nombreSeccion(s);
    return t.slice(0, 3).toLowerCase() === 'el ' ? 'del ' + t.slice(3) : 'de ' + t;
  }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function fechaCorta(f){ if(!f) return ''; var p=String(f).split('-'); return p.length===3 ? (+p[2])+' '+MESES[(+p[1])-1] : esc(f); }
  /* La base guarda la categoría sin acentos ("competicion"); aquí se muestra bien escrita. */
  var ETIQUETAS = { competicion:'Competición', club:'Club', escuela:'Escuela', temporada:'Temporada', resultado:'Resultados', resultados:'Resultados', montana:'Montaña', natacion:'Natación' };
  function categoria(c){ if(!c) return ''; var k=String(c).toLowerCase(); return ETIQUETAS[k] || esc(c.charAt(0).toUpperCase() + c.slice(1).toLowerCase()); }
  function ate(n){ return fechaCorta(n.fecha_publicacion) + (n.categoria ? ' · ' + categoria(n.categoria) : ''); }
  function enlace(n){ return base + 'noticias/articulo/?id=' + encodeURIComponent(n.id); }
  function img(n){ return n.foto_portada ? '<div class="marco"><img src="'+esc(window.APOLANA_IMG(n.foto_portada))+'" alt="'+esc(n.titulo)+'"></div>' : ''; }

  if (!window.APOLANA_DB || !window.APOLANA_DB.noticias) {
    estado.textContent = 'No se pudieron cargar las noticias.'; return;
  }
  var todas = await window.APOLANA_DB.noticias();
  if (!todas || !todas.length) {
    estado.textContent = 'Aún no hay noticias publicadas.'; return;
  }
  estado.style.display = 'none';

  /* Los dos filtros se cruzan: sección Y tipo. Una noticia sin secciones
     no aparece en ningún filtro de sección —no se supone a qué deporte
     pertenece— pero sigue saliendo en «Todo el club». */
  function pinta() {
    var lista = todas.filter(function(n){
      if (cat && n.categoria !== cat) return false;
      if (sec && (!Array.isArray(n.secciones) || n.secciones.indexOf(sec) === -1)) return false;
      return true;
    });
    pintarBoton(lista.length);
    if (!lista.length) {
      destCont.innerHTML = ''; rejilla.innerHTML = '';
      estado.style.display = '';
      /* Decir CUÁL de los dos filtros deja la lista vacía, porque con dos
         a la vez «no hay noticias» no dice dónde tocar para arreglarlo. */
      estado.textContent = (sec && cat) ? 'No hay noticias ' + deSeccion(sec) + ' de ese tipo. Prueba a quitar uno de los dos filtros.'
                         : sec          ? 'Todavía no hay noticias ' + deSeccion(sec) + '.'
                         :                'No hay noticias de ese tipo todavía.';
      return;
    }
    estado.style.display = 'none';
    var d = lista[0];
    destCont.innerHTML =
      '<a class="destacada" href="'+enlace(d)+'">' + img(d) +
      '<div class="cuerpo">' +
        '<span class="eyebrow eyebrow--azul">'+ate(d)+'</span>' +
        '<span class="titular">'+esc(d.titulo)+'</span>' +
        (d.excerpt ? '<p class="intro">'+esc(d.excerpt)+'</p>' : '') +
        '<span class="enlace-flecha">Leer la crónica →</span>' +
      '</div></a>';
    rejilla.innerHTML = lista.slice(1).map(function(n){
      return '<a class="not-card" href="'+enlace(n)+'">' + img(n) +
        '<div class="cuerpo">' +
          '<span class="eyebrow">'+ate(n)+'</span>' +
          '<span class="tit">'+esc(n.titulo)+'</span>' +
          (n.excerpt ? '<span class="resumen">'+esc(n.excerpt)+'</span>' : '') +
        '</div></a>';
    }).join('');
  }

  /* ------------------------------------------------------------
     EL BOTÓN «FILTRAR» Y SU DESPLEGABLE
     ------------------------------------------------------------
     Con el panel plegado, el botón es lo ÚNICO que queda a la vista: tiene que
     decir él solo qué hay puesto. Si dijera siempre «Filtrar», alguien que
     vuelve a la página vería veintitrés noticias donde había ciento dos y
     pensaría que se han perdido.
     ------------------------------------------------------------ */
  function pintarBoton(cuantas) {
    var partes = [];
    if (sec) partes.push(etiquetaFiltro(filtrosSec, sec));
    if (cat) partes.push(etiquetaFiltro(filtros, cat));
    textoFiltrar.textContent = partes.length ? partes.join(' · ') : 'Filtrar';
    botonFiltrar.classList.toggle('con-filtro', partes.length > 0);
    limpiarFiltros.hidden = !partes.length;
    cuentaFiltros.textContent = !partes.length ? ''
      : cuantas === 1 ? '1 noticia' : cuantas + ' noticias';
  }
  function abrirPanel(abrir) {
    botonFiltrar.setAttribute('aria-expanded', abrir ? 'true' : 'false');
    cajaFiltros.hidden = !abrir;
  }

  /* Elegir dentro de un bloque. NO se cierra el panel al elegir: hay dos
     bloques y lo normal es tocar los dos seguidos; cerrarlo al primer clic
     obliga a volver a abrirlo para la segunda mitad. */
  function engancharBloque(cont, attr, alElegir) {
    cont.addEventListener('click', function (e) {
      var b = e.target.closest('button[' + attr + ']'); if (!b) return;
      [].forEach.call(cont.querySelectorAll('button'), function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      alElegir(b.getAttribute(attr));
      pinta();
    });
  }
  engancharBloque(filtrosSec, 'data-sec', function (v) { sec = v; });
  engancharBloque(filtros, 'data-cat', function (v) { cat = v; });

  botonFiltrar.addEventListener('click', function () {
    abrirPanel(botonFiltrar.getAttribute('aria-expanded') !== 'true');
  });
  limpiarFiltros.addEventListener('click', function () {
    sec = ''; cat = '';
    [filtrosSec, filtros].forEach(function (cont) {
      [].forEach.call(cont.querySelectorAll('button'), function (o, i) { o.setAttribute('aria-pressed', i === 0 ? 'true' : 'false'); });
    });
    pinta();
  });
  /* Cerrar al pulsar fuera y con Escape: un panel que solo se cierra con el
     mismo botón se queda abierto tapando la primera noticia. */
  document.addEventListener('click', function (e) {
    if (cajaFiltros.hidden) return;
    if (e.target.closest('.not-desplegable')) return;
    abrirPanel(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !cajaFiltros.hidden) { abrirPanel(false); botonFiltrar.focus(); }
  });

  pinta();
});
</script>

</body>
</html>
