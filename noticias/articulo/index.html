<style>
  /* ===========================================================
     PLANTILLA DE ARTÍCULO  ·  /noticias/articulo
     Página de LECTURA. Todo el contenido lo pinta el <script> de
     abajo dentro de #articulo; aquí solo se coloca y se le da el
     lenguaje «pro». Se conservan TODAS las clases que usa el JS
     (.volver .eyebrow .titular .portada .lead .cuerpo .galeria
     .marco .seguir .item .fecha .tit .intro .cargando).

     La maqueta: una isla blanca de lectura centrada sobre el crema
     de la página, con medida cómoda de artículo (~66 ch), la foto
     de portada enmarcada con relieve, la galería en rejilla con
     zoom suave y un cierre de «seguir leyendo» en banda crema con
     tarjetas que se elevan. Sin bandas de cifras.
     =========================================================== */

  /* La isla de lectura. Un panel blanco que respira sobre el crema,
     con sombra en capas (contacto + media + lejana) para dar cuerpo.
     --pad-x se reutiliza abajo para que el cierre en crema llegue a
     los bordes del panel sin descuadrarse al cambiar el ancho. */
  .articulo {
    --pad-x: clamp(22px, 5vw, 54px);
    --pad-y: clamp(28px, 5vw, 50px);
    max-width: 760px; margin: 0 auto;
    background: #fff; border-radius: var(--radio-grande);
    padding: var(--pad-y) var(--pad-x);
    box-shadow: 0 1px 2px rgba(30,45,65,.06),
                0 12px 24px -14px rgba(30,45,65,.18),
                0 30px 56px -30px rgba(30,45,65,.26);
  }

  .articulo .volver {
    display: inline-block; margin-bottom: 20px; font-size: 15px;
    font-weight: 600; color: var(--azul-oscuro);
    transition: transform .3s ease;
  }
  .articulo .volver:hover { color: var(--azul-hover); transform: translateX(-3px); }

  .articulo > .eyebrow { display: block; }

  /* Titular en Bricolage, grande y con el tracking negativo del sistema.
     En caja mixta (no versalitas): un titular de artículo puede ser largo
     y así se lee mejor que en mayúsculas. */
  .articulo .titular {
    font-family: var(--fuente-titulo); font-weight: 700;
    font-size: clamp(34px, 5.4vw, 54px); line-height: 1.0;
    letter-spacing: -0.02em; color: var(--navy); margin: 10px 0 6px;
  }

  /* Foto de portada enmarcada: radius del sistema y sombra en capas.
     La imagen hace un zoom muy leve al pasar, igual que las tarjetas. */
  .articulo .portada {
    border-radius: var(--radio-grande); overflow: hidden;
    background: var(--crema-media); margin: 22px 0 6px;
    box-shadow: 0 1px 2px rgba(30,45,65,.06),
                0 16px 30px -18px rgba(30,45,65,.24),
                0 34px 60px -34px rgba(30,45,65,.30);
  }
  .articulo .portada img { width: 100%; height: auto; display: block; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
  .articulo .portada:hover img { transform: scale(1.03); }

  /* Entradilla algo mayor, en navy, para arrancar la lectura. */
  .articulo .lead { font-size: clamp(18px, 2.4vw, 21px); line-height: 1.55; color: var(--navy); font-weight: 500; margin-top: 22px; }

  /* Cuerpo del artículo: tipografía cómoda, buen interlineado y una
     medida de ~66 caracteres para que la vista no se pierda de renglón. */
  .articulo .cuerpo { margin-top: 18px; }
  .articulo .cuerpo p { font-size: 18px; line-height: 1.75; color: var(--texto); max-width: 66ch; margin: 0 0 1.05em; }
  .articulo .cuerpo p:last-child { margin-bottom: 0; }

  /* Galería en rejilla con relieve y zoom suave. */
  .articulo .galeria { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .articulo .galeria .marco {
    aspect-ratio: 1; border-radius: 12px; overflow: hidden; cursor: zoom-in;
    box-shadow: 0 1px 2px rgba(30,45,65,.06), 0 12px 22px -16px rgba(30,45,65,.24);
  }
  .articulo .galeria .marco img { transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .articulo .galeria .marco:hover img { transform: scale(1.06); }

  .cargando { color: var(--texto-suave); }

  /* Cierre «seguir leyendo»: banda crema que rompe el blanco y llega a
     los bordes del panel (por eso los márgenes negativos de --pad-x).
     Dentro, cada noticia es una tarjeta blanca que se eleva al pasar. */
  .articulo .seguir {
    margin: 40px calc(var(--pad-x) * -1) calc(var(--pad-y) * -1);
    padding: 30px var(--pad-x) 34px;
    background: var(--crema-banda); border-top: 1px solid var(--linea-marcada);
    border-radius: 0 0 var(--radio-grande) var(--radio-grande);
    display: flex; flex-direction: column; gap: 12px;
  }
  .articulo .seguir > .eyebrow { margin-bottom: 2px; }
  .articulo .seguir .item {
    display: flex; align-items: baseline; gap: 14px;
    background: #fff; border-radius: 12px; padding: 15px 18px;
    box-shadow: 0 1px 2px rgba(30,45,65,.05), 0 10px 20px -14px rgba(30,45,65,.20);
    transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s cubic-bezier(.2,.7,.2,1);
  }
  .articulo .seguir .item:hover {
    transform: translateY(-3px);
    box-shadow: 0 2px 4px rgba(30,45,65,.07), 0 18px 30px -16px rgba(30,45,65,.28);
  }
  .articulo .seguir .fecha { font-size: 13px; color: var(--texto-tenue); white-space: nowrap; }
  .articulo .seguir .tit {
    font-family: var(--fuente-titulo); font-weight: 700; letter-spacing: -0.01em;
    font-size: 20px; color: var(--navy); line-height: 1.15;
    transition: color .3s ease;
  }
  .articulo .seguir .item:hover .tit { color: var(--azul-hover); }

  /* ENTRADA. El artículo lo inserta el JS después de cargar, así que
     NO se usa la clase .reveal del sistema (se quedaría oculta). En su
     lugar, un desvanecido propio que arranca al insertarse cada bloque;
     se anima `opacity` y `translate` —no `transform`— para no pisar el
     zoom de la foto. Con «reduce motion» no se anima nada. */
  @media (prefers-reduced-motion: no-preference) {
    #articulo > .eyebrow, #articulo > .titular, #articulo > .portada,
    #articulo > .lead, #articulo > .cuerpo, #articulo > .galeria, #articulo > .seguir {
      animation: art-entra .6s cubic-bezier(.2,.7,.2,1) both;
    }
    #articulo > .titular { animation-delay: .04s; }
    #articulo > .portada { animation-delay: .10s; }
    #articulo > .lead    { animation-delay: .16s; }
    #articulo > .cuerpo  { animation-delay: .20s; }
    #articulo > .galeria { animation-delay: .24s; }
    @keyframes art-entra { from { opacity: 0; translate: 0 14px; } to { opacity: 1; translate: 0 0; } }
  }

  @media (max-width: 560px) { .articulo .galeria { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<apolana-cabecera activo="noticias"></apolana-cabecera>

<main>
  <section class="seccion">
    <div class="contenedor">
      <article class="articulo" id="articulo">
        <a class="volver" href="../../noticias/">← Volver a noticias</a>
        <p class="cargando">Cargando la noticia…</p>
      </article>
    </div>
  </section>
</main>

<apolana-pie></apolana-pie>

<script>
document.addEventListener('DOMContentLoaded', async function () {
  var cont = document.getElementById('articulo');
  var base = window.APOLANA_BASE || '../../';
  var volver = '<a class="volver" href="' + base + 'noticias/">← Volver a noticias</a>';
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function fechaCorta(f){ if(!f) return ''; var p=String(f).split('-'); return p.length===3 ? (+p[2])+' '+MESES[(+p[1])-1]+' '+p[0] : esc(f); }

  function sinNoticia(titulo, texto) {
    cont.innerHTML = volver +
      '<h1 class="titular">' + titulo + '</h1>' +
      '<p class="intro" style="max-width:52ch;">' + texto + '</p>' +
      '<a class="btn btn--primario" style="margin-top:8px;" href="' + base + 'noticias/">Ver todas las noticias</a>';
  }

  var id = new URLSearchParams(location.search).get('id');
  if (!id || !window.APOLANA_DB || !window.APOLANA_DB.noticiaPorId) {
    sinNoticia('No hemos podido abrir la noticia',
      'Puede que el enlace esté incompleto o que la noticia ya no esté publicada. En el listado tienes las últimas del club.');
    return;
  }
  var n = await window.APOLANA_DB.noticiaPorId(id);
  if (!n) {
    sinNoticia('Noticia no encontrada',
      'Puede que ya no exista o que se haya despublicado. Vuelve al listado para ver las últimas.');
    return;
  }

  document.title = n.titulo + ' · Club Atletismo Apolana';
  /* La base guarda la categoría sin acentos ("competicion"); aquí se muestra bien escrita. */
  var ETIQUETAS = { competicion:'Competición', club:'Club', escuela:'Escuela', temporada:'Temporada', resultado:'Resultados', resultados:'Resultados', montana:'Montaña', natacion:'Natación' };
  var cat = n.categoria ? (ETIQUETAS[String(n.categoria).toLowerCase()] || esc(n.categoria.charAt(0).toUpperCase() + n.categoria.slice(1).toLowerCase())) : '';
  var eyebrow = fechaCorta(n.fecha_publicacion) + (cat ? ' · ' + cat : '');
  var portada = n.foto_portada ? '<div class="portada"><img src="'+esc(window.APOLANA_IMG(n.foto_portada))+'" alt="'+esc(n.titulo)+'"></div>' : '';
  var lead = n.excerpt ? '<p class="lead">'+esc(n.excerpt)+'</p>' : '';
  var cuerpo = n.contenido
    ? '<div class="cuerpo">' + String(n.contenido).split(/\n\s*\n|\n/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>';}).join('') + '</div>'
    : '';
  var galeria = (Array.isArray(n.fotos_galeria) && n.fotos_galeria.length)
    ? '<div class="galeria">' + n.fotos_galeria.map(function(f){return '<div class="marco"><img src="'+esc(window.APOLANA_IMG(f))+'" alt=""></div>';}).join('') + '</div>'
    : '';

  cont.innerHTML = volver +
    '<span class="eyebrow eyebrow--azul">'+eyebrow+'</span>' +
    '<h1 class="titular">'+esc(n.titulo)+'</h1>' +
    portada + lead + cuerpo + galeria;

  /* Seguir leyendo: las tres noticias siguientes, sin repetir la actual */
  if (window.APOLANA_DB.noticias) {
    var otras = await window.APOLANA_DB.noticias(4);
    if (otras && otras.length) {
      otras = otras.filter(function (o) { return String(o.id) !== String(n.id); }).slice(0, 3);
      if (otras.length) {
        cont.insertAdjacentHTML('beforeend',
          '<div class="seguir">' +
            '<span class="eyebrow">Seguir leyendo</span>' +
            otras.map(function (o) {
              return '<a class="item" href="' + base + 'noticias/articulo/?id=' + encodeURIComponent(o.id) + '">' +
                     '<span class="fecha">' + fechaCorta(o.fecha_publicacion) + '</span>' +
                     '<span class="tit">' + esc(o.titulo) + '</span></a>';
            }).join('') +
          '</div>');
      }
    }
  }
});
</script>

</body>
