<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticia · Club Atletismo Apolana</title>
<meta name="description" content="Noticia del Club Atletismo Apolana de Alicante.">
<link rel="icon" href="../../assets/img/logo.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/datos.js" defer></script>
<script src="../../assets/js/apolana.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../../assets/js/db.js" defer></script>
<style>
  .articulo { max-width: 760px; }
  .articulo .volver { display: block; margin-bottom: 22px; font-weight: 600; color: var(--azul-oscuro); }
  .articulo .titular {
    font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
    font-size: clamp(34px, 6vw, 52px); line-height: 0.98; color: var(--navy); margin: 8px 0 14px;
  }
  .articulo .portada { border-radius: var(--radio-grande); overflow: hidden; background: var(--crema-media); margin: 22px 0; box-shadow: var(--sombra-tarjeta); }
  .articulo .portada img { width: 100%; height: auto; display: block; }
  .articulo .lead { font-size: clamp(17px, 2.4vw, 20px); line-height: 1.55; color: var(--navy); font-weight: 500; }
  .articulo .cuerpo p { font-size: 17px; line-height: 1.7; color: var(--texto); }
  .articulo .galeria { margin-top: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .articulo .galeria .marco { aspect-ratio: 1; border-radius: 12px; }
  .cargando { color: var(--texto-suave); }
  @media (max-width: 560px) { .articulo .galeria { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<apolana-cabecera activo="noticias"></apolana-cabecera>

<main>
  <section class="seccion">
    <div class="contenedor">
      <article class="articulo" id="articulo">
        <a class="volver" href="../../noticias/">← Volver a noticias</a>
        <p class="cargando">Cargando la noticia…</p>
      </article>
    </div>
  </section>
</main>

<apolana-pie></apolana-pie>

<script>
document.addEventListener('DOMContentLoaded', async function () {
  var cont = document.getElementById('articulo');
  var base = window.APOLANA_BASE || '../../';
  var volver = '<a class="volver" href="' + base + 'noticias/">← Volver a noticias</a>';
  var MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function fechaCorta(f){ if(!f) return ''; var p=String(f).split('-'); return p.length===3 ? (+p[2])+' '+MESES[(+p[1])-1]+' '+p[0] : esc(f); }

  var id = new URLSearchParams(location.search).get('id');
  if (!id || !window.APOLANA_DB || !window.APOLANA_DB.noticiaPorId) {
    cont.innerHTML = volver + '<p class="intro" style="margin-top:16px;">No hemos podido cargar la noticia.</p>';
    return;
  }
  var n = await window.APOLANA_DB.noticiaPorId(id);
  if (!n) {
    cont.innerHTML = volver + '<h1 class="titular">Noticia no encontrada</h1><p class="intro">Puede que ya no exista. Vuelve al listado para ver las últimas.</p>';
    return;
  }

  document.title = n.titulo + ' · Club Atletismo Apolana';
  var eyebrow = fechaCorta(n.fecha_publicacion) + (n.categoria ? ' · ' + esc(n.categoria).toUpperCase() : '');
  var portada = n.foto_portada ? '<div class="portada"><img src="'+esc(window.APOLANA_IMG(n.foto_portada))+'" alt="'+esc(n.titulo)+'"></div>' : '';
  var lead = n.excerpt ? '<p class="lead">'+esc(n.excerpt)+'</p>' : '';
  var cuerpo = n.contenido
    ? '<div class="cuerpo">' + String(n.contenido).split(/\n\s*\n|\n/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>';}).join('') + '</div>'
    : '';
  var galeria = (Array.isArray(n.fotos_galeria) && n.fotos_galeria.length)
    ? '<div class="galeria">' + n.fotos_galeria.map(function(f){return '<div class="marco"><img src="'+esc(window.APOLANA_IMG(f))+'" alt=""></div>';}).join('') + '</div>'
    : '';

  cont.innerHTML = volver +
    '<span class="eyebrow eyebrow--azul">'+eyebrow+'</span>' +
    '<h1 class="titular">'+esc(n.titulo)+'</h1>' +
    portada + lead + cuerpo + galeria;
});
</script>

</body>
</html>
