<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticia · Club Atletismo Apolana</title>
<meta name="description" content="Noticia del Club Atletismo Apolana de Alicante.">
<!-- APOLANA-SEO · lo genera herramientas/seo.py · no editar a mano -->
<!-- MIENTRAS LA WEB ESTA EN PRUEBAS: le decimos a Google que no la
     mire, para que no compita con atletismoapolana.com. EL DIA DEL
     CAMBIO DE DOMINIO HAY QUE QUITAR ESTA LINEA (la quita sola el
     comando de arriba con --indexable). -->
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Club Atletismo Apolana">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Noticia · Club Atletismo Apolana">
<meta property="og:description" content="Noticia del Club Atletismo Apolana de Alicante.">
<meta property="og:url" content="https://escuelaapolana.github.io/WebV2/noticias/articulo/">
<meta property="og:image" content="https://escuelaapolana.github.io/WebV2/assets/img/noticia.jpg">
<meta name="twitter:card" content="summary_large_image">
<!-- /APOLANA-SEO -->
<link rel="icon" href="../../assets/img/logo.png">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/css/apolana.css">
<script>window.APOLANA_BASE="../../";</script>
<script src="../../assets/js/datos.js" defer></script>
<script src="../../assets/js/apolana.js" defer></script>
<script src="../../assets/js/supabase.js" defer></script>
<script src="../../assets/js/db.js" defer></script>
<style>
  .articulo { max-width: 760px; }
  .articulo .volver { display: block; margin-bottom: 22px; font-weight: 600; color: var(--azul-oscuro); }
  .articulo .titular {
    font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase;
    font-size: clamp(34px, 6vw, 52px); line-height: 0.98; color: var(--navy); margin: 8px 0 14px;
  }
  .articulo .portada { border-radius: var(--radio-grande); overflow: hidden; background: var(--crema-media); margin: 22px 0; box-shadow: var(--sombra-tarjeta); }
  .articulo .portada img { width: 100%; height: auto; display: block; }
  .articulo .lead { font-size: clamp(17px, 2.4vw, 20px); line-height: 1.55; color: var(--navy); font-weight: 500; }
  .articulo .cuerpo p { font-size: 17px; line-height: 1.7; color: var(--texto); }
  .articulo .galeria { margin-top: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .articulo .galeria .marco { aspect-ratio: 1; border-radius: 12px; }
  .cargando { color: var(--texto-suave); }
  /* Seguir leyendo: las tres noticias siguientes */
  .articulo .seguir { margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 12px; }
  .articulo .seguir .item { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--linea); }
  .articulo .seguir .item:last-child { border-bottom: 0; padding-bottom: 0; }
  .articulo .seguir .fecha { font-size: 13px; color: var(--texto-tenue); white-space: nowrap; }
  .articulo .seguir .tit { font-size: 17px; font-weight: 600; color: var(--navy); line-height: 1.35; }
  @media (max-width: 560px) { .articulo .galeria { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<apolana-cabecera activo="noticias"></apolana-cabecera>

<main>
  <section class="seccion">
    <div class="contenedor">
      <article class="articulo" id="articulo">
        <a class="volver" href="../../noticias/">← Volver a noticias</a>
        <p class="cargando">Cargando la noticia…</p>
      </article>
    </div>
  </section>
</main>

<apolana-pie></apolana-pie>

<script>
document.addEventListener('DOMContentLoaded', async function () {
  var cont = document.getElementById('articulo');
  var base = window.APOLANA_BASE || '../../';
  var volver = '<a class="volver" href="' + base + 'noticias/">← Volver a noticias</a>';
  var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function fechaCorta(f){ if(!f) return ''; var p=String(f).split('-'); return p.length===3 ? (+p[2])+' '+MESES[(+p[1])-1]+' '+p[0] : esc(f); }

  function sinNoticia(titulo, texto) {
    cont.innerHTML = volver +
      '<h1 class="titular">' + titulo + '</h1>' +
      '<p class="intro" style="max-width:52ch;">' + texto + '</p>' +
      '<a class="btn btn--primario" style="margin-top:8px;" href="' + base + 'noticias/">Ver todas las noticias</a>';
  }

  var id = new URLSearchParams(location.search).get('id');
  if (!id || !window.APOLANA_DB || !window.APOLANA_DB.noticiaPorId) {
    sinNoticia('No hemos podido abrir la noticia',
      'Puede que el enlace esté incompleto o que la noticia ya no esté publicada. En el listado tienes las últimas del club.');
    return;
  }
  var n = await window.APOLANA_DB.noticiaPorId(id);
  if (!n) {
    sinNoticia('Noticia no encontrada',
      'Puede que ya no exista o que se haya despublicado. Vuelve al listado para ver las últimas.');
    return;
  }

  document.title = n.titulo + ' · Club Atletismo Apolana';
  /* La base guarda la categoría sin acentos ("competicion"); aquí se muestra bien escrita. */
  var ETIQUETAS = { competicion:'Competición', club:'Club', escuela:'Escuela', temporada:'Temporada', resultado:'Resultados', resultados:'Resultados', montana:'Montaña', natacion:'Natación' };
  var cat = n.categoria ? (ETIQUETAS[String(n.categoria).toLowerCase()] || esc(n.categoria.charAt(0).toUpperCase() + n.categoria.slice(1).toLowerCase())) : '';
  var eyebrow = fechaCorta(n.fecha_publicacion) + (cat ? ' · ' + cat : '');
  var portada = n.foto_portada ? '<div class="portada"><img src="'+esc(window.APOLANA_IMG(n.foto_portada))+'" alt="'+esc(n.titulo)+'"></div>' : '';
  var lead = n.excerpt ? '<p class="lead">'+esc(n.excerpt)+'</p>' : '';
  var cuerpo = n.contenido
    ? '<div class="cuerpo">' + String(n.contenido).split(/\n\s*\n|\n/).filter(Boolean).map(function(p){return '<p>'+esc(p)+'</p>';}).join('') + '</div>'
    : '';
  var galeria = (Array.isArray(n.fotos_galeria) && n.fotos_galeria.length)
    ? '<div class="galeria">' + n.fotos_galeria.map(function(f){return '<div class="marco"><img src="'+esc(window.APOLANA_IMG(f))+'" alt=""></div>';}).join('') + '</div>'
    : '';

  cont.innerHTML = volver +
    '<span class="eyebrow eyebrow--azul">'+eyebrow+'</span>' +
    '<h1 class="titular">'+esc(n.titulo)+'</h1>' +
    portada + lead + cuerpo + galeria;

  /* Seguir leyendo: las tres noticias siguientes, sin repetir la actual */
  if (window.APOLANA_DB.noticias) {
    var otras = await window.APOLANA_DB.noticias(4);
    if (otras && otras.length) {
      otras = otras.filter(function (o) { return String(o.id) !== String(n.id); }).slice(0, 3);
      if (otras.length) {
        cont.insertAdjacentHTML('beforeend',
          '<div class="seguir">' +
            '<span class="eyebrow">Seguir leyendo</span>' +
            otras.map(function (o) {
              return '<a class="item" href="' + base + 'noticias/articulo/?id=' + encodeURIComponent(o.id) + '">' +
                     '<span class="fecha">' + fechaCorta(o.fecha_publicacion) + '</span>' +
                     '<span class="tit">' + esc(o.titulo) + '</span></a>';
            }).join('') +
          '</div>');
      }
    }
  }
});
</script>

</body>
</html>
