<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Redirección de URLs de la WEB VIEJA (que tenía tráfico) a las páginas nuevas.
     GitHub Pages sirve este 404.html para cualquier ruta que no exista; si la ruta
     coincide con una vieja, la reenviamos antes de pintar el 404. Si no, se ve el 404. -->
<script>
(function () {
  try {
    var p = location.pathname.replace(/\/+$/, '');      // sin barra final
    var lp = p.toLowerCase();
    lp = lp.replace(/^\/(es|it|en|ca|va|fr|de)(?=\/|$)/, ''); // quitar prefijo de idioma
    var go = function (u) { location.replace(u + location.search); };

    if (lp === '' || lp === '/index' || lp === '/home') return go('/');
    if (/^\/blog-news/.test(lp) || lp === '/noticias' ) return go('/noticias/');
    if (/^\/public\//.test(lp)) return go('/club/normativa/');

    var mapa = {
      '/escuela-natacion': '/escuela-natacion/',
      '/z-natacion': '/escuela-natacion/',
      '/escuela-atletismo': '/escuela-atletismo/',
      '/escuela': '/escuela-atletismo/',
      '/escuelas-deportivas-atletismo': '/escuela-atletismo/',
      '/campuss': '/campus/',
      '/campus-verano-2026': '/campus/',
      '/campus-s-santa-20': '/campus/',
      '/campamento-biar': '/campus/',
      '/escuela-triatlon': '/triatlon/',
      '/triatlon-conocenos': '/triatlon/',
      '/tetratln-escolar': '/escuelas/',
      '/tetratlon-escolar': '/escuelas/',
      '/natacion-escolar-municipal-alicante-2026': '/escuelas/',
      '/escuelas-deportivas-ayuntamiento--deporte-adaptado': '/escuela-municipal-atletismo/',
      '/cross-escolar-municipal-alicante-2025': '/cross-escolar/',
      '/sobre-nosotros': '/club/',
      '/como-funcionamos': '/club/',
      '/directiva': '/club/',
      '/afiliacion': '/socio/',
      '/natacion-master': '/natacion/',
      '/media-maratn-alicante': '/running/',
      '/media-maraton-alicante': '/running/',
      '/aviso-legal': '/legal/aviso-legal/',
      '/liga': '/liga/',
      '/z': '/'
    };
    if (mapa[lp]) return go(mapa[lp]);
    // si no hay coincidencia, se muestra el 404 normal.
  } catch (e) {}
})();
</script>
<title>Página no encontrada · Club Atletismo Apolana</title>
<link rel="icon" type="image/png" href="assets/img/favicon-escudo.png">
<link rel="stylesheet" href="assets/css/apolana.css">
<script>window.APOLANA_BASE="./";</script>
<script src="assets/js/datos.js" defer></script>
<script src="assets/js/apolana.js" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/db.js" defer></script>
<style>
  .error { text-align: center; padding-block: clamp(48px, 10vw, 110px); }
  .error .codigo { font-family: var(--fuente-display); font-weight: 900; font-size: clamp(80px, 18vw, 160px); line-height: 1; color: var(--navy); letter-spacing: -0.03em; }
  .error .titular { font-family: var(--fuente-titulo); font-weight: 700; text-transform: uppercase; font-size: clamp(28px, 5vw, 40px); color: var(--navy); margin: 8px 0 14px; }
  .error p { max-width: 46ch; margin: 0 auto 26px; color: var(--texto); }
  .error .acciones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<apolana-cabecera></apolana-cabecera>

<main>
  <section class="seccion">
    <div class="contenedor error">
      <div class="codigo">404</div>
      <h1 class="titular">Esta página se ha ido a correr</h1>
      <p>No hemos encontrado lo que buscabas. Puede que la dirección esté mal escrita o que la página ya no exista.</p>
      <div class="acciones">
        <a class="btn btn--primario" href="./">Volver a la portada</a>
        <a class="btn btn--fantasma" href="calendario/">Ver el calendario</a>
      </div>
    </div>
  </section>
</main>

<apolana-pie></apolana-pie>

</body>
</html>
